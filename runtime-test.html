<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/src/styles/mobile-pages.css" />
    <link rel="stylesheet" href="/src/styles/notification-center.css" />
    <link rel="stylesheet" href="/src/styles/strategic-outliner.css" />
    <link rel="stylesheet" href="/src/styles/strategic-map-rendering.css" />
    <title>Economy runtime test</title>
    <script>
      const view = new URLSearchParams(window.location.search).get('view') ?? 'settings';
      const gameViews = ['overview', 'map', 'commerce', 'production', 'research', 'contracts', 'leaderboard', 'gem-shop', 'scroll-ownership'];
      document.documentElement.dataset.appSurface = gameViews.includes(view) ? 'game' : 'auth';
      document.documentElement.dataset.appBackdrop = gameViews.includes(view) ? 'game' : 'auth';
      document.documentElement.dataset.appTone = 'normal';
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/tests/browser/runtime-harness.tsx"></script>
  </body>
</html>
