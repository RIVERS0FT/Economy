name: Apply player title action rule

on:
  push:
    branches:
      - codex/player-title-actions

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/player-title-actions
          fetch-depth: 0
      - name: Apply final changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'missing expected text in {path}: {old[:80]!r}')
              p.write_text(text.replace(old, new, 1))

          replace(
              'src/components/ui/layout.tsx',
              '''        {pageNavigation && actions ? (\n          <div className="page-heading-actions page-heading-actions--player" data-player-page-actions="true">\n            {actions}\n          </div>\n        ) : null}\n''',
              '',
          )

          replace(
              'src/styles/globals.css',
              '''.page-heading-actions--player {\n  width: 100%;\n  justify-content: flex-end;\n  padding: 0 var(--layout-gutter) var(--layout-gutter);\n}\n\n''',
              '',
          )

          replace(
              'src/pages/TransportPage.tsx',
              '''    <PageLayout\n      title="运输"\n      actions={(\n        <Button\n          variant="secondary"\n          disabled={!canAddRoute || Boolean(pendingAction)}\n          onClick={() => setRouteDraft(emptyRouteDraft())}\n        >\n          增加路线\n        </Button>\n      )}\n    >\n      <div className="transport-page-content">\n''',
              '''    <PageLayout title="运输">\n      <div className="transport-page-content">\n        <div className="transport-page-actions">\n          <Button\n            variant="secondary"\n            disabled={!canAddRoute || Boolean(pendingAction)}\n            onClick={() => setRouteDraft(emptyRouteDraft())}\n          >\n            增加路线\n          </Button>\n        </div>\n''',
          )

          replace(
              'src/styles/transport-page.css',
              '''.transport-page-content {\n  min-width: 0;\n  display: grid;\n  gap: var(--layout-gutter);\n  container: transport-page / inline-size;\n}\n\n''',
              '''.transport-page-content {\n  min-width: 0;\n  display: grid;\n  gap: var(--layout-gutter);\n  container: transport-page / inline-size;\n}\n\n.transport-page-actions {\n  min-width: 0;\n  display: flex;\n  justify-content: flex-end;\n}\n\n''',
          )

          replace(
              'docs/UI_DESIGN_SYSTEM.md',
              '''玩家页面返回统一由 `PlayerPageNavigationContext` 的受限位置栈驱动。栈项必须是轻量可比较描述符，当前页加历史最多 20 层；同级分区使用 replace，实体下钻使用 push，返回 pop，关闭 reset 到 `map`。页面组件不得保存来源回调、DOM 或完整业务状态来实现返回，也不得让轮询更新改变栈深度。仓库商品卡、全局商品／工厂下钻和地区实体详情必须复用这套语义。\n\n''',
              '''玩家端 `PageLayout` 的标题区固定只包含返回、主标题和关闭三个槽位，不得渲染刷新、创建、筛选、保存或其他业务按钮；业务操作必须进入正文中的对应业务模块或正文顶部操作区。`PageLayout.actions` 只允许非玩家页面继续使用，玩家导航上下文存在时不得生成第二行标题操作区。原因是标题轨道承担跨页面稳定导航几何，业务操作进入标题区会改变标题高度、正文起点和跨页面按钮位置。\n\n玩家页面返回统一由 `PlayerPageNavigationContext` 的受限位置栈驱动。栈项必须是轻量可比较描述符，当前页加历史最多 20 层；同级分区使用 replace，实体下钻使用 push，返回 pop，关闭 reset 到 `map`。页面组件不得保存来源回调、DOM 或完整业务状态来实现返回，也不得让轮询更新改变栈深度。仓库商品卡、全局商品／工厂下钻和地区实体详情必须复用这套语义。\n\n''',
          )

          replace(
              'docs/PAGE_CONTENT_AND_NAVIGATION_DESIGN.md',
              '''州级概览以及未解锁建筑／仓库分区在正常状态下都只有一个一级业务模块，因此不得再为整个分区套 `PagePanel`／`.panel` 圆角卡片；标题、指标、数据行和解锁操作直接排列在 `PageLayout` 正文内容区。只有同一内容区存在两个及以上需要视觉分组的同级业务模块时才创建一级圆角卡片，避免 `workspaceCard` 与唯一业务卡形成无信息增益的双层圆角外壳。\n\n''',
              '''州级概览以及未解锁建筑／仓库分区在正常状态下都只有一个一级业务模块，因此不得再为整个分区套 `PagePanel`／`.panel` 圆角卡片；标题、指标、数据行和解锁操作直接排列在 `PageLayout` 正文内容区。只有同一内容区存在两个及以上需要视觉分组的同级业务模块时才创建一级圆角卡片，避免 `workspaceCard` 与唯一业务卡形成无信息增益的双层圆角外壳。\n\n运输页的“增加路线”固定放在正文顶部操作区，不占用页面标题区；路线编辑、路线列表和运输记录继续作为正文内独立业务分组。玩家标题区的通用按钮限制以 `UI_DESIGN_SYSTEM.md` 为准。\n\n''',
          )

          replace(
              'tests/browser/all-pages-preview.spec.ts',
              '''  const transportContent = page.locator('.transport-page-content');\n  await expect(transportContent).toBeVisible();\n  const transportOverflow = await transportContent.evaluate((element) => ({ clientWidth: element.clientWidth, scrollWidth: element.scrollWidth }));\n  expect(transportOverflow.scrollWidth).toBeLessThanOrEqual(transportOverflow.clientWidth + 1);\n  await page.getByRole('button', { name: '增加路线', exact: true }).click();\n''',
              '''  const transportContent = page.locator('.transport-page-content');\n  await expect(transportContent).toBeVisible();\n  const transportHeader = page.locator('.page-fixed-header');\n  const addRouteButton = transportContent.locator('.transport-page-actions').getByRole('button', { name: '增加路线', exact: true });\n  await expect(transportHeader.getByRole('button')).toHaveCount(2);\n  await expect(transportHeader.getByRole('button', { name: '增加路线', exact: true })).toHaveCount(0);\n  await expect(addRouteButton).toBeVisible();\n  const transportOverflow = await transportContent.evaluate((element) => ({ clientWidth: element.clientWidth, scrollWidth: element.scrollWidth }));\n  expect(transportOverflow.scrollWidth).toBeLessThanOrEqual(transportOverflow.clientWidth + 1);\n  await addRouteButton.click();\n''',
          )

          p = Path('scripts/verify-page-content.mjs')
          text = p.read_text()
          old = '''  'src/pages/ProvincePage.tsx',\n  'tests/browser/runtime-harness.tsx',\n'''
          new = '''  'src/pages/ProvincePage.tsx',\n  'src/pages/TransportPage.tsx',\n  'src/components/ui/layout.tsx',\n  'src/styles/transport-page.css',\n  'docs/UI_DESIGN_SYSTEM.md',\n  'tests/browser/runtime-harness.tsx',\n'''
          if old not in text:
              raise SystemExit('verify-page-content requireFile anchor missing')
          text = text.replace(old, new, 1)

          old = '''for (const text of [\n  '建筑仍按工厂与地区入口钻取',\n'''
          insert = '''for (const text of [\n  '运输页的“增加路线”固定放在正文顶部操作区',\n]) requireText('docs/PAGE_CONTENT_AND_NAVIGATION_DESIGN.md', text);\nfor (const text of [\n  '玩家端 `PageLayout` 的标题区固定只包含返回、主标题和关闭三个槽位',\n  '`PageLayout.actions` 只允许非玩家页面继续使用',\n]) requireText('docs/UI_DESIGN_SYSTEM.md', text);\nfor (const text of [\n  'className="transport-page-actions"',\n  '<PageLayout title="运输">',\n]) requireText('src/pages/TransportPage.tsx', text);\nfor (const text of [\n  'actions={(',\n]) forbidText('src/pages/TransportPage.tsx', text);\nrequireText('src/styles/transport-page.css', '.transport-page-actions {');\nfor (const text of [\n  'page-heading-actions--player',\n  'data-player-page-actions',\n]) {\n  forbidText('src/components/ui/layout.tsx', text);\n  forbidText('src/styles/globals.css', text);\n}\n\nfor (const text of [\n  '建筑仍按工厂与地区入口钻取',\n'''
          if old not in text:
              raise SystemExit('verify-page-content insertion anchor missing')
          text = text.replace(old, insert, 1)
          p.write_text(text)
          PY
      - name: Remove temporary workflow
        run: rm .github/workflows/codex-player-title-actions.yml
      - name: Commit final changes
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "限制玩家标题区业务按钮"
          git push origin HEAD:codex/player-title-actions
