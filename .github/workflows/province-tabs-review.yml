name: Apply regional building tabs
on:
  push:
    branches: [codex/split-province-building-tabs]
    paths:
      - .github/workflows/province-tabs-review.yml
      - .github/apply-province-tabs.py
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/split-province-building-tabs
          fetch-depth: 0
      - name: Apply reviewed page, design and regression edits
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/apply-province-tabs.py
          git rm .github/apply-province-tabs.py .github/workflows/province-tabs-review.yml
          git add src docs scripts server/test tests
          node scripts/normalize-repository-text.mjs
          git add src docs scripts server/test tests
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --cached --stat
          git commit -m 'feat: split province commercial and industrial building tabs'
          git push origin HEAD:codex/split-province-building-tabs
