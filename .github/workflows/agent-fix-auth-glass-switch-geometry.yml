name: Apply authentication glass switch geometry fix

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply verified source changes
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PYTHON'
          from pathlib import Path
          import re

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one exact match, found {count}: {old[:100]!r}')
              file.write_text(text.replace(old, new, 1))

          def regex_once(path: str, pattern: str, replacement: str) -> None:
              file = Path(path)
              text = file.read_text()
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'{path}: expected one regex match, found {count}: {pattern[:100]!r}')
              file.write_text(updated)

          surface = 'src/components/ui/LiquidGlassSurface.tsx'
          replace_once(
              surface,
              "  const contentRef = useRef<HTMLDivElement>(null);\n  const [contentHeight, setContentHeight] = useState<number | null>(null);",
              "  const surfaceRef = useRef<HTMLDivElement>(null);\n  const contentRef = useRef<HTMLDivElement>(null);\n  const [contentHeight, setContentHeight] = useState<number | null>(null);",
          )
          regex_once(
              surface,
              r"  useLayoutEffect\(\(\) => \{\n    if \(layout !== 'content'[\s\S]*?\n  \}, \[layout, variant\]\);",
              """  useLayoutEffect(() => {
    if (layout !== 'content' || !contentRef.current || !surfaceRef.current) return undefined;
    const contentElement = contentRef.current;
    const surfaceElement = surfaceRef.current;
    let measurementFrame = 0;
    let glassResizeFrame = 0;
    let previousHeight = -1;
    let previousSurfaceWidth = -1;
    let previousSurfaceHeight = -1;

    const notifyGlassResize = () => {
      glassResizeFrame = 0;
      const surfaceRect = surfaceElement.getBoundingClientRect();
      const nextWidth = Math.ceil(surfaceRect.width);
      const nextHeight = Math.ceil(surfaceRect.height);
      if (nextWidth <= 0 || nextHeight <= 0) return;
      if (nextWidth === previousSurfaceWidth && nextHeight === previousSurfaceHeight) return;
      previousSurfaceWidth = nextWidth;
      previousSurfaceHeight = nextHeight;
      window.dispatchEvent(new Event('resize'));
    };

    const scheduleGlassResize = () => {
      if (glassResizeFrame) cancelAnimationFrame(glassResizeFrame);
      glassResizeFrame = requestAnimationFrame(notifyGlassResize);
    };

    const measure = () => {
      measurementFrame = 0;
      const nextHeight = Math.ceil(Math.max(
        contentElement.scrollHeight,
        contentElement.getBoundingClientRect().height,
      ));
      if (nextHeight <= 0 || nextHeight === previousHeight) return;
      previousHeight = nextHeight;
      setContentHeight(nextHeight);
    };

    const scheduleMeasure = () => {
      if (measurementFrame) cancelAnimationFrame(measurementFrame);
      measurementFrame = requestAnimationFrame(measure);
    };

    const resizeObserver = typeof ResizeObserver === 'undefined' ? null : new ResizeObserver((entries) => {
      let contentChanged = false;
      let surfaceChanged = false;
      for (const entry of entries) {
        if (entry.target === contentElement) contentChanged = true;
        if (entry.target === surfaceElement) surfaceChanged = true;
      }
      if (contentChanged) scheduleMeasure();
      if (surfaceChanged) scheduleGlassResize();
    });
    resizeObserver?.observe(contentElement);
    resizeObserver?.observe(surfaceElement);

    const mutationObserver = typeof MutationObserver === 'undefined' ? null : new MutationObserver(scheduleMeasure);
    mutationObserver?.observe(contentElement, {
      attributes: true,
      characterData: true,
      childList: true,
      subtree: true,
    });
    window.addEventListener('resize', scheduleMeasure);
    measure();

    return () => {
      if (measurementFrame) cancelAnimationFrame(measurementFrame);
      if (glassResizeFrame) cancelAnimationFrame(glassResizeFrame);
      resizeObserver?.disconnect();
      mutationObserver?.disconnect();
      window.removeEventListener('resize', scheduleMeasure);
    };
  }, [layout, variant]);""",
          )
          replace_once(
              surface,
              "    <div\n      className={classes}",
              "    <div\n      ref={surfaceRef}\n      className={classes}",
          )

          styles = 'src/styles/liquid-glass-surfaces.css'
          replace_once(
              styles,
              """.liquid-glass-surface--desktopAuthCard .liquid-glass-surface__effect > span,
.liquid-glass-surface--mobileAuthCard .liquid-glass-surface__effect > span,
.liquid-glass-surface--desktopAuthCard .liquid-glass-surface__effect > div:not(.glass),
.liquid-glass-surface--mobileAuthCard .liquid-glass-surface__effect > div:not(.glass) {
  display: none !important;
  opacity: 0 !important;
}""",
              """.liquid-glass-surface--desktopAuthCard > span,
.liquid-glass-surface--mobileAuthCard > span,
.liquid-glass-surface--desktopAuthCard > div:not(.liquid-glass-surface__effect),
.liquid-glass-surface--mobileAuthCard > div:not(.liquid-glass-surface__effect) {
  display: none !important;
  opacity: 0 !important;
}""",
          )

          browser = 'tests/browser/auth-three-layer.spec.ts'
          replace_once(
              browser,
              """    const content = surface?.querySelector<HTMLElement>('.liquid-glass-surface__content');
    const warp = surface?.querySelector<HTMLElement>('.glass__warp');
    if (!card || !surface || !content || !warp) {
      throw new Error('authentication glass fixture is incomplete');
    }""",
              """    const effect = surface?.querySelector<HTMLElement>(':scope > .liquid-glass-surface__effect');
    const glassElement = effect?.querySelector<HTMLElement>(':scope > .glass');
    const filterSvg = effect?.querySelector<SVGSVGElement>(':scope > svg');
    const content = surface?.querySelector<HTMLElement>('.liquid-glass-surface__content');
    const warp = surface?.querySelector<HTMLElement>('.glass__warp');
    if (!card || !surface || !effect || !glassElement || !filterSvg || !content || !warp) {
      throw new Error('authentication glass fixture is incomplete');
    }""",
          )
          replace_once(
              browser,
              """    const outlineStyle = getComputedStyle(surface, '::after');
    const warpStyle = getComputedStyle(warp);
    return {""",
              """    const outlineStyle = getComputedStyle(surface, '::after');
    const warpStyle = getComputedStyle(warp);
    const directDecorationSpans = Array.from(surface.children)
      .filter((element): element is HTMLElement => element instanceof HTMLElement && element.tagName === 'SPAN');
    const directAuxiliaryDivs = Array.from(surface.children)
      .filter((element): element is HTMLElement => (
        element instanceof HTMLElement
        && element.tagName === 'DIV'
        && !element.classList.contains('liquid-glass-surface__effect')
      ));
    const isVisible = (element: HTMLElement) => {
      const style = getComputedStyle(element);
      return style.display !== 'none' && style.visibility !== 'hidden' && Number.parseFloat(style.opacity) > 0;
    };
    return {""",
          )
          replace_once(
              browser,
              """      surfaceHeight: surface.getBoundingClientRect().height,
      surfaceOverflowY: surfaceStyle.overflowY,""",
              """      surfaceHeight: surface.getBoundingClientRect().height,
      effectHeight: effect.getBoundingClientRect().height,
      glassHeight: glassElement.getBoundingClientRect().height,
      filterHeight: filterSvg.getBoundingClientRect().height,
      surfaceOverflowY: surfaceStyle.overflowY,""",
          )
          replace_once(
              browser,
              """      materialFillCount: surface.querySelectorAll('.liquid-glass-surface__material-fill').length,
      outlineBorder: outlineStyle.borderTopWidth,""",
              """      materialFillCount: surface.querySelectorAll('.liquid-glass-surface__material-fill').length,
      directDecorationSpanCount: directDecorationSpans.length,
      visibleDirectDecorationSpanCount: directDecorationSpans.filter(isVisible).length,
      directAuxiliaryDivCount: directAuxiliaryDivs.length,
      visibleDirectAuxiliaryDivCount: directAuxiliaryDivs.filter(isVisible).length,
      outlineBorder: outlineStyle.borderTopWidth,""",
          )
          replace_once(
              browser,
              "}\n\nasync function readMobileAtmosphere(page: Page) {",
              """}

async function expectAuthGlassGeometryAligned(page: Page) {
  await expect.poll(async () => {
    const glass = await readAuthGlass(page);
    return {
      contentAligned: Math.abs(glass.surfaceHeight - glass.contentHeight) <= 1,
      effectAligned: Math.abs(glass.surfaceHeight - glass.effectHeight) <= 1,
      glassAligned: Math.abs(glass.surfaceHeight - glass.glassHeight) <= 1,
      filterAligned: Math.abs(glass.surfaceHeight - glass.filterHeight) <= 1,
      visibleDirectDecorationSpanCount: glass.visibleDirectDecorationSpanCount,
      visibleDirectAuxiliaryDivCount: glass.visibleDirectAuxiliaryDivCount,
    };
  }).toEqual({
    contentAligned: true,
    effectAligned: true,
    glassAligned: true,
    filterAligned: true,
    visibleDirectDecorationSpanCount: 0,
    visibleDirectAuxiliaryDivCount: 0,
  });
}

async function readMobileAtmosphere(page: Page) {""",
          )
          replace_once(
              browser,
              """      expect(Math.abs(glass.surfaceHeight - glass.contentHeight)).toBeLessThanOrEqual(1);

      await page.getByLabel('账号邮箱').click();""",
              """      expect(glass.directDecorationSpanCount).toBeGreaterThanOrEqual(2);
      expect(glass.directAuxiliaryDivCount).toBeGreaterThanOrEqual(2);
      await expectAuthGlassGeometryAligned(page);

      await page.getByLabel('账号邮箱').click();""",
          )
          replace_once(
              browser,
              """      expect(loginGlass.materialFillCount).toBe(0);
      expect(loginGlass.webkitBackdropFilter).toContain('blur(7.2px)');

      await page.getByRole('tab', { name: '注册' }).click();""",
              """      expect(loginGlass.materialFillCount).toBe(0);
      expect(loginGlass.webkitBackdropFilter).toContain('blur(7.2px)');
      expect(loginGlass.directDecorationSpanCount).toBeGreaterThanOrEqual(2);
      expect(loginGlass.directAuxiliaryDivCount).toBeGreaterThanOrEqual(2);
      await expectAuthGlassGeometryAligned(page);

      await page.getByRole('tab', { name: '注册' }).click();""",
          )
          replace_once(
              browser,
              """      await expect(surface).toHaveAttribute('data-liquid-glass-variant', 'mobileAuthCard');

      const brandBox = await brand.boundingBox();""",
              """      await expect(surface).toHaveAttribute('data-liquid-glass-variant', 'mobileAuthCard');
      await expectAuthGlassGeometryAligned(page);

      const brandBox = await brand.boundingBox();""",
          )
          replace_once(
              browser,
              """      expect(registrationGlass.contentOverflowY).not.toMatch(/auto|scroll/);
      await expect(content).toBeVisible();""",
              """      expect(registrationGlass.contentOverflowY).not.toMatch(/auto|scroll/);
      const registrationHeight = registrationGlass.surfaceHeight;

      await page.getByRole('tab', { name: '登录' }).click();
      await expect(page.getByLabel('邀请码（可选）')).toHaveCount(0);
      await expect(page.getByLabel('邮箱验证码')).toHaveCount(0);
      await expect(email).toHaveValue('mobile@example.com');
      await expectAuthGlassGeometryAligned(page);
      const returnedLoginGlass = await readAuthGlass(page);
      expect(returnedLoginGlass.surfaceHeight).toBeLessThan(registrationHeight);

      await expect(content).toBeVisible();""",
          )

          auth_verify = 'scripts/verify-auth-three-layer.mjs'
          replace_once(auth_verify, "  'new ResizeObserver',\n", "  'new ResizeObserver',\n  'resizeObserver.observe(surfaceElement)',\n  'entry.target === surfaceElement',\n  'requestAnimationFrame(notifyGlassResize)',\n  'ref={surfaceRef}',\n")
          replace_once(auth_verify, "  'content: none;',\n", "  'content: none;',\n  '.liquid-glass-surface--desktopAuthCard > span,\\n.liquid-glass-surface--mobileAuthCard > span,',\n  '.liquid-glass-surface--desktopAuthCard > div:not(.liquid-glass-surface__effect),',\n")
          replace_once(auth_verify, "  'liquid-glass-surface__material-fill',\n", "  'liquid-glass-surface__material-fill',\n  '.liquid-glass-surface--desktopAuthCard .liquid-glass-surface__effect > span,',\n")
          replace_once(auth_verify, "  '认证卡片不得绘制项目结构描边',\n", "  '认证卡片不得绘制项目结构描边',\n  '单个 `ResizeObserver` 必须同时观察真实认证内容和认证宿主',\n  '直属 `span` 与 over-light 辅助 `div`',\n")
          replace_once(auth_verify, "  \"expect(glass.outlineContent).toBe('none')\",\n", "  \"expect(glass.outlineContent).toBe('none')\",\n  'expectAuthGlassGeometryAligned',\n  'visibleDirectDecorationSpanCount',\n  'filterHeight',\n  \"getByRole('tab', { name: '登录' }).click()\",\n")

          liquid_verify = 'scripts/verify-liquid-glass-chrome.mjs'
          replace_once(liquid_verify, "    'new ResizeObserver',\n", "    'new ResizeObserver',\n    'resizeObserver.observe(surfaceElement)',\n    'entry.target === surfaceElement',\n    'requestAnimationFrame(notifyGlassResize)',\n    'ref={surfaceRef}',\n")
          replace_once(liquid_verify, "    'content: none;',\n", "    'content: none;',\n    '.liquid-glass-surface--desktopAuthCard > span,\\n.liquid-glass-surface--mobileAuthCard > span,',\n    '.liquid-glass-surface--desktopAuthCard > div:not(.liquid-glass-surface__effect),',\n")
          replace_once(liquid_verify, "    'liquid-glass-surface__material-fill',\n", "    'liquid-glass-surface__material-fill',\n    '.liquid-glass-surface--desktopAuthCard .liquid-glass-surface__effect > span,',\n")
          replace_once(liquid_verify, "    '认证卡片不得绘制项目结构描边',\n", "    '认证卡片不得绘制项目结构描边',\n    '单个 `ResizeObserver` 必须同时观察真实认证内容和认证宿主',\n    '直属 `span` 与 over-light 辅助 `div`',\n")
          replace_once(liquid_verify, "    \"expect(glass.outlineContent).toBe('none')\",\n", "    \"expect(glass.outlineContent).toBe('none')\",\n    'expectAuthGlassGeometryAligned',\n    'visibleDirectDecorationSpanCount',\n    'filterHeight',\n")

          registration_design = 'docs/REGISTRATION_INVITE_FLOW_DESIGN.md'
          replace_once(
              registration_design,
              "认证卡片不得绘制项目结构描边或额外大圆角白色外框，只保留 `liquid-glass-react` 自身的折射边缘、圆角裁切和宿主阴影；桌面与移动状态栏继续保留一条位于内容之上的连续结构描边。",
              "认证卡片不得绘制项目结构描边或额外大圆角白色外框；`liquid-glass-react` Fragment 直属输出的两个边框 `span` 与两个 over-light 辅助 `div` 必须由认证宿主直属子元素选择器隐藏，不得错误地只检查 `.liquid-glass-surface__effect` 内部。认证卡片只保留 `.glass__warp` 折射材质、圆角裁切和宿主阴影；桌面与移动状态栏继续保留一条位于内容之上的连续结构描边。",
          )
          replace_once(
              registration_design,
              "登录、注册、邀请码、验证码、错误与状态提示变化以及 `720px` 断点切换都不得清空原生未受控表单值。",
              "登录、注册、邀请码、验证码、错误与状态提示变化以及 `720px` 断点切换都不得清空原生未受控表单值。单个 `ResizeObserver` 必须同时观察真实认证内容和认证宿主：内容变化只更新宿主高度，宿主提交后的真实宽高变化再通过合并后的 `requestAnimationFrame` 通知上游玻璃读取几何；不得在 `setContentHeight` 后、宿主高度尚未提交时提前派发 resize。",
          )
          replace_once(
              registration_design,
              "认证伪元素不生成外框、无 `material-fill`、表单值保持，以及 `721px`／`720px` 断点切换",
              "认证伪元素不生成外框、直属第三方边框／over-light 节点不可见、宿主／`.glass`／SVG 滤镜几何一致、登录→注册→登录双向切换、无 `material-fill`、表单值保持，以及 `721px`／`720px` 断点切换",
          )

          liquid_design = 'docs/LIQUID_GLASS_CHROME_DESIGN.md'
          replace_once(
              liquid_design,
              "- 桌面与移动状态栏及认证卡片必须隐藏 `liquid-glass-react` 的重复边框／高光和 over-light 辅助层，并清除第三方 `.glass` 外部阴影，只保留 `.glass__warp` 材质。状态栏只保留宿主的一条最上层连续结构描边；认证卡片不得绘制项目结构描边或额外大圆角白色外框，只保留第三方折射边缘、圆角裁切和宿主阴影。移动底栏允许保留第一层低强度 screen 高光。",
              "- 桌面与移动状态栏及认证卡片必须隐藏 `liquid-glass-react` 的重复边框／高光和 over-light 辅助层，并清除第三方 `.glass` 外部阴影，只保留 `.glass__warp` 材质。第三方组件通过 Fragment 把两个边框 `span` 与两个 over-light `div` 输出为认证宿主直属子元素，因此认证样式必须用 `> span` 与 `> div:not(.liquid-glass-surface__effect)` 隐藏，不得错误下沉到效果层内部。状态栏只保留宿主的一条最上层连续结构描边；认证卡片不得绘制项目结构描边或额外大圆角白色外框，只保留圆角裁切和宿主阴影。移动底栏允许保留第一层低强度 screen 高光。",
          )
          replace_once(
              liquid_design,
              "高度改变后更新宿主高度并通过 `window` resize 通知上游玻璃重新读取几何。",
              "高度改变后更新宿主高度；同一个 `ResizeObserver` 还必须观察认证宿主，只有宿主提交后的实际宽高发生变化，才通过合并后的 `requestAnimationFrame` 派发 `window` resize 通知上游玻璃重新读取几何。",
          )
          replace_once(
              liquid_design,
              "- 桌面与移动状态栏以及认证效果层的重复 `span`／辅助 `div` 必须隐藏，第三方 `.glass` 计算后的 `box-shadow` 必须为 `none`；认证宿主可以保留由项目定义的一层悬浮阴影。",
              "- 桌面与移动状态栏的直属重复 `span`／辅助 `div` 必须按各自策略隐藏；认证卡片必须隐藏宿主直属的全部边框 `span` 和除 `.liquid-glass-surface__effect` 外的 over-light 辅助 `div`。第三方 `.glass` 计算后的 `box-shadow` 必须为 `none`；认证宿主可以保留由项目定义的一层悬浮阴影。",
          )
          replace_once(
              liquid_design,
              "- 认证内容自适应只使用单个 `ResizeObserver` 和同一真实内容节点上的条件 DOM 观察，只在内容宽高变化时更新宿主高度并通知玻璃读取几何；表单内容和原生输入节点不得进入重建 key，不得加入定时轮询或每帧测量。",
              "- 认证内容自适应只使用单个 `ResizeObserver` 同时观察真实内容和认证宿主，并使用同一真实内容节点上的条件 DOM 观察；内容宽高变化只更新宿主高度，宿主提交后的尺寸变化才通知玻璃读取几何。表单内容和原生输入节点不得进入重建 key，不得加入定时轮询或每帧测量。",
          )
          replace_once(
              liquid_design,
              "认证伪元素不生成项目结构描边或大圆角白色外框。",
              "认证伪元素不生成项目结构描边或大圆角白色外框，宿主直属第三方边框／over-light 节点均不可见，宿主、`.glass` 与 SVG 滤镜在登录→注册→登录双向切换后保持同宽同高。",
          )

          workflow = Path('.github/workflows/agent-fix-auth-glass-switch-geometry.yml')
          workflow.unlink()
          PYTHON
          git diff --check
      - name: Commit source changes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "修复认证玻璃切换几何"
          git push origin HEAD:${{ github.head_ref }}
