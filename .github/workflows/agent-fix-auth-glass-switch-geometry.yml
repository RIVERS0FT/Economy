name: Apply authentication glass switch geometry fix

on:
  push:
    branches:
      - agent/fix-auth-glass-switch-geometry

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply verified source changes
        run: |
          set -euo pipefail
          # The second user-authored push intentionally triggers this already-indexed workflow.
          python3 .agent/apply-auth-glass-switch-geometry.py
          rm -f .agent/apply-auth-glass-switch-geometry.py
          rm -f .github/workflows/agent-fix-auth-glass-switch-geometry.yml
          rmdir .agent 2>/dev/null || true
          git diff --check
      - name: Commit source changes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "修复认证玻璃切换几何"
          git push origin HEAD:agent/fix-auth-glass-switch-geometry
