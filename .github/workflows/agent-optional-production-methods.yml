name: Agent optional production method metadata

on:
  push:
    branches:
      - agent/factory-production-methods

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/factory-production-methods
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Make production method metadata backward compatible
        run: node scripts/agent-make-production-methods-optional.mjs
      - name: Commit compatibility and remove one-time files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -- .github/workflows/agent-optional-production-methods.yml scripts/agent-make-production-methods-optional.mjs
          git add -- src/types.ts
          git commit -m "fix: keep production method metadata backward compatible"
          git push origin HEAD:agent/factory-production-methods
