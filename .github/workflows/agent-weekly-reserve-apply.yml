name: Apply weekly reserve routing

on:
  push:
    branches:
      - agent/route-weekly-settlement-to-market-reserve
    paths:
      - .github/workflows/agent-weekly-reserve-apply.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/route-weekly-settlement-to-market-reserve
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.4.0'
          cache: npm
      - name: Apply source, tests, verification and design updates
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}: {old[:80]!r}')
              p.write_text(text.replace(old, new, 1))

          def replace_count(path, old, new, expected):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected} matches, found {count}: {old[:80]!r}')
              p.write_text(text.replace(old, new))

          replace_once(
              'server/src/weekly-cash-settlement.js',
              "import { randomUUID } from 'node:crypto';\nimport { calculateRateMoney, internalMoneyToMicros, roundInternalMoney } from './money.js';\n\nexport const WEEKLY_CASH_SETTLEMENT_VERSION = 1;",
              "import { randomUUID } from 'node:crypto';\nimport { MARKET_DEMAND_GROUP_CATALOG } from './market-demand/catalog.js';\nimport { allocateMoneyBudget } from './market-demand/math.js';\nimport { calculateRateMoney, internalMoneyToMicros, roundInternalMoney } from './money.js';\n\nexport const WEEKLY_CASH_SETTLEMENT_VERSION = 2;",
          )

          replace_once(
              'server/src/weekly-cash-settlement.js',
              "function addMoney(left, right, message = '周资金结算金额超出系统可表示范围') {\n  const total = roundInternalMoney(Number(left || 0) + Number(right || 0));\n  if (total === null || internalMoneyToMicros(total) === null) throw new Error(message);\n  return total;\n}\n\nfunction subtractMoney(left, right) {",
              "function addMoney(left, right, message = '周资金结算金额超出系统可表示范围') {\n  const total = roundInternalMoney(Number(left || 0) + Number(right || 0));\n  if (total === null || internalMoneyToMicros(total) === null) throw new Error(message);\n  return total;\n}\n\nfunction creditMarketReserve(world, amount) {\n  const normalized = safeMoney(amount);\n  if (normalized <= 0) return {};\n  const groups = world.marketDemand?.liquidity?.groups;\n  if (!groups || typeof groups !== 'object') {\n    throw new Error('市场储备未初始化，无法接收周资金结算');\n  }\n  const entries = MARKET_DEMAND_GROUP_CATALOG.map((group) => {\n    const state = groups[group.id];\n    if (!state || typeof state !== 'object') {\n      throw new Error(`市场储备账户缺失: ${group.id}`);\n    }\n    return {\n      id: group.id,\n      weight: Math.max(0, Number(group.baseBudget || 0)),\n      maxBudget: normalized,\n    };\n  });\n  const allocations = allocateMoneyBudget(entries, normalized);\n  const transferredByGroup = {};\n  let transferred = 0;\n  for (const entry of entries) {\n    const credit = safeMoney(allocations.get(entry.id));\n    const state = groups[entry.id];\n    state.credits = addMoney(\n      state.credits,\n      credit,\n      '市场储备周资金结算金额超出系统可表示范围',\n    );\n    transferred = addMoney(transferred, credit);\n    transferredByGroup[entry.id] = credit;\n  }\n  if (internalMoneyToMicros(transferred) !== internalMoneyToMicros(normalized)) {\n    throw new Error('周资金结算转入市场储备时发生资金守恒错误');\n  }\n  return transferredByGroup;\n}\n\nfunction subtractMoney(left, right) {",
          )

          replace_count(
              'server/src/weekly-cash-settlement.js',
              "      burnedCredits: 0,\n",
              "      burnedCredits: 0,\n      reserveTransferredCredits: 0,\n",
              2,
          )

          replace_once(
              'server/src/weekly-cash-settlement.js',
              "  const collected = addMoney(fromDeposit, fromCash);\n  if (collected > 0) {\n    pending.amountCollected = addMoney(pending.amountCollected, collected);\n    pending.amountOutstanding = remaining;\n    pending.appliedAt = now;\n    playerState.totals.collectedCredits = addMoney(playerState.totals.collectedCredits, collected);\n    playerState.totals.burnedCredits = addMoney(playerState.totals.burnedCredits, collected);\n    player.stats ||= {};\n    player.stats.weeklyCashSettlementCollected = addMoney(player.stats.weeklyCashSettlementCollected, collected);\n    player.stats.weeklyCashSettlementBurned = addMoney(player.stats.weeklyCashSettlementBurned, collected);\n    world.stats ||= {};\n    world.stats.weeklyCashSettlementCollected = addMoney(world.stats.weeklyCashSettlementCollected, collected);\n    world.stats.weeklyCashSettlementBurned = addMoney(world.stats.weeklyCashSettlementBurned, collected);\n    worldState.totals.collectedCredits = addMoney(worldState.totals.collectedCredits, collected);\n    worldState.totals.burnedCredits = addMoney(worldState.totals.burnedCredits, collected);\n    worldState.totals.outstandingCredits = subtractMoney(worldState.totals.outstandingCredits, collected);\n    addBankTransaction(player, 'weekly_cash_settlement', collected, now, '完成周资金扣除结算', {\n      settlementId: pending.id,\n      weekKey: pending.weekKey,\n      source: fromDeposit > 0 && fromCash > 0 ? 'deposit_and_cash' : fromDeposit > 0 ? 'deposit' : 'cash',\n    });\n  }",
              "  const collected = addMoney(fromDeposit, fromCash);\n  if (collected > 0) {\n    const reserveAllocations = creditMarketReserve(world, collected);\n    pending.amountCollected = addMoney(pending.amountCollected, collected);\n    pending.amountOutstanding = remaining;\n    pending.appliedAt = now;\n    playerState.totals.collectedCredits = addMoney(playerState.totals.collectedCredits, collected);\n    playerState.totals.reserveTransferredCredits = addMoney(\n      playerState.totals.reserveTransferredCredits,\n      collected,\n    );\n    player.stats ||= {};\n    player.stats.weeklyCashSettlementCollected = addMoney(player.stats.weeklyCashSettlementCollected, collected);\n    player.stats.weeklyCashSettlementReserveTransferred = addMoney(\n      player.stats.weeklyCashSettlementReserveTransferred,\n      collected,\n    );\n    world.stats ||= {};\n    world.stats.weeklyCashSettlementCollected = addMoney(world.stats.weeklyCashSettlementCollected, collected);\n    world.stats.weeklyCashSettlementReserveTransferred = addMoney(\n      world.stats.weeklyCashSettlementReserveTransferred,\n      collected,\n    );\n    worldState.totals.collectedCredits = addMoney(worldState.totals.collectedCredits, collected);\n    worldState.totals.reserveTransferredCredits = addMoney(\n      worldState.totals.reserveTransferredCredits,\n      collected,\n    );\n    worldState.totals.outstandingCredits = subtractMoney(worldState.totals.outstandingCredits, collected);\n    addBankTransaction(player, 'weekly_cash_settlement', collected, now, '完成周资金扣除结算，资金转入市场储备', {\n      settlementId: pending.id,\n      weekKey: pending.weekKey,\n      source: fromDeposit > 0 && fromCash > 0 ? 'deposit_and_cash' : fromDeposit > 0 ? 'deposit' : 'cash',\n      destination: 'market_reserve',\n      reserveAllocations,\n    });\n  }",
          )

          replace_once(
              'server/src/leaderboards.js',
              "function policyAdjustmentFor(player) {\n  const stats = playerStats(player);\n  return Number(stats.bankDepositInterestEarned || 0)\n    - Number(stats.weeklyCashSettlementBurned || 0);\n}",
              "function policyAdjustmentFor(player) {\n  const stats = playerStats(player);\n  return Number(stats.bankDepositInterestEarned || 0)\n    - Number(stats.weeklyCashSettlementBurned || 0)\n    - Number(stats.weeklyCashSettlementReserveTransferred || 0);\n}",
          )

          replace_once(
              'src/types.ts',
              "  weeklyCashSettlementCollected?: number;\n  weeklyCashSettlementBurned?: number;\n",
              "  weeklyCashSettlementCollected?: number;\n  weeklyCashSettlementBurned?: number;\n  weeklyCashSettlementReserveTransferred?: number;\n",
          )

          replace_once(
              'server/test/weekly-cash-settlement.test.js',
              "  const world = createWorld(monday);\n  const player = preparedPlayer(world, 30, 70, 200);\n  const state = ensureWeeklyCashSettlementWorld(world, monday);",
              "  const world = createWorld(monday);\n  const player = preparedPlayer(world, 30, 70, 200);\n  const foodReserveBefore = world.marketDemand.liquidity.groups.food.credits;\n  const householdReserveBefore = world.marketDemand.liquidity.groups.household.credits;\n  const populationBefore = structuredClone(world.populationEconomy);\n  const state = ensureWeeklyCashSettlementWorld(world, monday);",
          )

          replace_once(
              'server/test/weekly-cash-settlement.test.js',
              "  assert.equal(player.weeklyCashSettlement.pendingSettlement, null);\n  assert.equal(player.stats.weeklyCashSettlementBurned, 30);",
              "  assert.equal(player.weeklyCashSettlement.pendingSettlement, null);\n  assert.equal(player.stats.weeklyCashSettlementReserveTransferred, 30);\n  assert.equal(player.stats.weeklyCashSettlementBurned || 0, 0);\n  assert.equal(world.weeklyCashSettlement.totals.reserveTransferredCredits, 30);\n  assert.equal(Number((world.marketDemand.liquidity.groups.food.credits - foodReserveBefore).toFixed(6)), 15.789474);\n  assert.equal(Number((world.marketDemand.liquidity.groups.household.credits - householdReserveBefore).toFixed(6)), 14.210526);\n  assert.deepEqual(world.populationEconomy, populationBefore);\n  const transaction = player.bankAccount.recentTransactions.at(-1);\n  assert.equal(transaction.destination, 'market_reserve');\n  assert.deepEqual(transaction.reserveAllocations, { food: 15.789474, household: 14.210526 });",
          )

          replace_once(
              'server/test/weekly-cash-settlement.test.js',
              "  assert.equal(result.outstanding, 15);\n  assert.equal(player.frozenCredits, 195, 'escrow remains untouched');",
              "  assert.equal(result.outstanding, 15);\n  assert.equal(world.stats.weeklyCashSettlementReserveTransferred, 5);\n  assert.equal(player.frozenCredits, 195, 'escrow remains untouched');",
          )

          replace_once(
              'server/test/weekly-cash-settlement.test.js',
              "  assert.equal(player.credits, 5);\n  assert.equal(weeklySettlementLiability(player), 0);",
              "  assert.equal(player.credits, 5);\n  assert.equal(weeklySettlementLiability(player), 0);\n  assert.equal(world.stats.weeklyCashSettlementReserveTransferred, 20);",
          )

          replace_once(
              'scripts/verify-weekly-cash-settlement.mjs',
              "  'WEEKLY_CASH_SETTLEMENT_RATE_BPS = 1_000',\n  \"WEEKLY_CASH_TIME_ZONE = 'Asia/Shanghai'\",",
              "  'WEEKLY_CASH_SETTLEMENT_VERSION = 2',\n  'WEEKLY_CASH_SETTLEMENT_RATE_BPS = 1_000',\n  \"WEEKLY_CASH_TIME_ZONE = 'Asia/Shanghai'\",\n  'MARKET_DEMAND_GROUP_CATALOG',\n  'allocateMoneyBudget',\n  'reserveTransferredCredits',\n  'weeklyCashSettlementReserveTransferred',\n  \"destination: 'market_reserve'\",",
          )

          replace_once(
              'scripts/verify-weekly-cash-settlement.mjs',
              "requireText('server/src/world-deadline-planner.js', 'weeklyCashSettlement');\n",
              "requireText('server/src/world-deadline-planner.js', 'weeklyCashSettlement');\nrequireText('src/types.ts', 'weeklyCashSettlementReserveTransferred?: number;');\nforbidText('server/src/weekly-cash-settlement.js', 'playerState.totals.burnedCredits = addMoney');\nforbidText('server/src/weekly-cash-settlement.js', 'player.stats.weeklyCashSettlementBurned = addMoney');\nforbidText('server/src/weekly-cash-settlement.js', 'world.stats.weeklyCashSettlementBurned = addMoney');\nforbidText('server/src/weekly-cash-settlement.js', 'worldState.totals.burnedCredits = addMoney');\n",
          )

          replace_once(
              'scripts/verify-weekly-cash-settlement.mjs',
              "  '不属于经营增长',\n]) requireText('docs/PRODUCT_AND_GAMEPLAY_DESIGN.md', text);",
              "  '不属于经营增长',\n  '实际收取部分按食品市场与社会消费市场的 `baseBudget` 权重',\n  '`weeklyCashSettlementReserveTransferred`',\n]) requireText('docs/PRODUCT_AND_GAMEPLAY_DESIGN.md', text);\n\nfor (const text of [\n  '实际收取额必须在同一世界事务中转入市场储备',\n  '3000:2700',\n  '`weeklyCashSettlementReserveTransferred`',\n]) requireText('docs/SERVER_ARCHITECTURE_AND_DEPLOYMENT_DESIGN.md', text);",
          )

          replace_once(
              'scripts/verify-weekly-cash-settlement.mjs',
              "forbidText('docs/PRODUCT_AND_GAMEPLAY_DESIGN.md', '每周 10% 的资金扣除只适用于完整活跃周。每周 10% 的资金扣除只适用于完整活跃周。');\n",
              "forbidText('docs/PRODUCT_AND_GAMEPLAY_DESIGN.md', '每周 10% 的资金扣除只适用于完整活跃周。每周 10% 的资金扣除只适用于完整活跃周。');\nforbidText('docs/PRODUCT_AND_GAMEPLAY_DESIGN.md', '周资金扣除作为 `weeklyCashSettlementBurned` 直接销毁');\n",
          )

          replace_once(
              'scripts/verify-weekly-cash-settlement.mjs',
              "console.log('固定利息与周资金结算验证通过：活跃周每日 1%、周末 10% 账单、登录扣款、长期回归一次性结算、冻结资金守恒和排行榜调整均已锁定。');",
              "console.log('固定利息与周资金结算验证通过：活跃周每日 1%、周末 10% 账单、登录扣款、实际收取额转入市场储备、长期回归一次性结算、冻结资金守恒和排行榜调整均已锁定。');",
          )

          replace_once(
              'docs/PRODUCT_AND_GAMEPLAY_DESIGN.md',
              '> 更新时间：2026-08-07',
              '> 更新时间：2026-08-08',
          )
          replace_once(
              'docs/PRODUCT_AND_GAMEPLAY_DESIGN.md',
              '活跃周结束后的 10% 周资金扣除作为 `weeklyCashSettlementBurned` 直接销毁，不转入人口、银行或其他玩家账户。',
              '活跃周结束后的 10% 周资金扣除不再销毁；实际收取部分按食品市场与社会消费市场的 `baseBudget` 权重 **3000:2700** 在微单位精度下完整转入两组市场储备真实 `credits`，不进入人口钱包、银行或其他玩家账户。历史 `weeklyCashSettlementBurned` 只保留规则切换前已经销毁的审计金额，新收取额改记 `weeklyCashSettlementReserveTransferred`，两者都属于排行榜经营增长的政策调整项。',
          )
          replace_once(
              'docs/PRODUCT_AND_GAMEPLAY_DESIGN.md',
              '建设、扩容、手续费、玩家交易、市场储备交易和人口消费成交都只转移已有普通货币。',
              '建设、扩容、手续费、玩家交易、市场储备交易、人口消费成交和周资金扣除都只转移已有普通货币。',
          )

          replace_once(
              'docs/SERVER_ARCHITECTURE_AND_DEPLOYMENT_DESIGN.md',
              '> 更新时间：2026-08-07',
              '> 更新时间：2026-08-08',
          )
          replace_once(
              'docs/SERVER_ARCHITECTURE_AND_DEPLOYMENT_DESIGN.md',
              '周一 00:00 的权威顺序为截止时间前世界推进、贷款与最后一日利息、关闭周资金账单、排行榜周期切换。账单关闭不扫描撤销玩家托管；冻结资金只参与计税。正式状态读取、商店读取和所有写操作必须在返回或执行业务前执行玩家登录结算，先扣存款、再扣可用资金，未缴金额留作负债。成功且改变经济状态的写操作在旧债清零后激活当前周；轮询、签到、失败和幂等重放不能激活。',
              '周一 00:00 的权威顺序为截止时间前世界推进、贷款与最后一日利息、关闭周资金账单、排行榜周期切换。账单关闭不扫描撤销玩家托管；冻结资金只参与计税。正式状态读取、商店读取和所有写操作必须在返回或执行业务前执行玩家登录结算，先扣存款、再扣可用资金，未缴金额留作负债。成功且改变经济状态的写操作在旧债清零后激活当前周；轮询、签到、失败和幂等重放不能激活。\n\n周资金扣除的实际收取额必须在同一世界事务中转入市场储备，不得销毁或进入人口钱包。分配读取 `MARKET_DEMAND_GROUP_CATALOG` 的 `baseBudget`，当前食品市场与社会消费市场固定按 **3000:2700** 权重在微单位精度下分配，最后必须满足储备增加总额与本次实际扣款严格相等；只增加各组可用 `credits`，不得改变 `frozenCredits`、商品库存、人口收入 EMA 或消费预算。旧 `weeklyCashSettlementBurned` / `burnedCredits` 只保留历史审计且不得继续累计，新收取额累计到 `weeklyCashSettlementReserveTransferred` / `reserveTransferredCredits`；排行榜政策调整同时扣除历史销毁和新储备转移，避免把周结算误记为经营亏损。',
          )
          PY

          git diff --check
          rm .github/workflows/agent-weekly-reserve-apply.yml
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- server/src/weekly-cash-settlement.js server/src/leaderboards.js server/test/weekly-cash-settlement.test.js scripts/verify-weekly-cash-settlement.mjs src/types.ts docs/PRODUCT_AND_GAMEPLAY_DESIGN.md docs/SERVER_ARCHITECTURE_AND_DEPLOYMENT_DESIGN.md .github/workflows/agent-weekly-reserve-apply.yml
          git commit -m "Route weekly settlement funds to market reserves"
          git push origin HEAD:agent/route-weekly-settlement-to-market-reserve
      - name: Install dependencies
        run: npm ci
      - name: Verify weekly settlement
        run: |
          npm run verify:weekly-cash-settlement
          node --test server/test/weekly-cash-settlement.test.js
      - name: Build
        run: npm run build
      - name: Install browser runtime
        run: npx playwright install --with-deps chromium
      - name: Browser tests
        run: npm run test:browser
