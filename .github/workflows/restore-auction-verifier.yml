name: Restore auction verifier

on:
  push:
    branches:
      - agent/indexed-runtime-scheduler

permissions:
  contents: write

concurrency:
  group: restore-auction-verifier
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/indexed-runtime-scheduler
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.4.0
      - name: Restore main verifier and move reservation ownership
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git show origin/main:scripts/verify-asset-auctions.mjs > scripts/verify-asset-auctions.mjs
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/verify-asset-auctions.mjs')
          text = path.read_text(encoding='utf-8')
          old_files = "  'server/src/warehouse.js',\n  'server/src/storage.js',"
          new_files = "  'server/src/warehouse.js',\n  'server/src/warehouse-reservations.js',\n  'server/src/storage.js',"
          if text.count(old_files) != 1:
              raise RuntimeError('asset auction required-file list target is not unique')
          text = text.replace(old_files, new_files, 1)
          old_rule = "requireText('server/src/warehouse.js', ['world?.assetAuctions']);"
          new_rule = """requireText('server/src/warehouse.js', [
            "from './warehouse-reservations.js'",
            'nonContractWarehouseReservation(world, player.userId)',
          ]);
          requireText('server/src/warehouse-reservations.js', [
            'world?.assetAuctions',
            "auction?.status !== 'open'",
            "item.assetKind === 'commodity'",
            'pendingCommodityBuyQuantityForOwner',
          ]);"""
          if text.count(old_rule) != 1:
              raise RuntimeError('warehouse auction rule target is not unique')
          path.write_text(text.replace(old_rule, new_rule, 1), encoding='utf-8')
          Path('.github/workflows/restore-auction-verifier.yml').unlink()
          PY
          node scripts/verify-asset-auctions.mjs
      - name: Commit restored verifier
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m '恢复拍卖验证并更新预占归属'
          git push origin HEAD:agent/indexed-runtime-scheduler
