name: Codex one-shot cleanup

on:
  push:
    branches:
      - codex/daily-market-freeze-timeout-fix

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.head_commit.message == '运行最终一次性清理'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/daily-market-freeze-timeout-fix
          fetch-depth: 0
      - name: Apply exact cleanup
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_one(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'{path}: missing expected text: {old!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_one(
              'docs/PAGE_CONTENT_AND_NAVIGATION_DESIGN.md',
              '场景插画右侧主信息区固定包含“运行中／冻结中”三项数量摘要',
              '场景插画右侧主信息区固定包含“运行中／冻结中”两项数量摘要',
          )
          replace_one(
              'docs/PAGE_CONTENT_AND_NAVIGATION_DESIGN.md',
              '商业建筑按服务器目录 `systemValue` 估值，第一版全部计入可用建筑资产，不进入冻结、冻结或产权交易。',
              '商业建筑按服务器目录 `systemValue` 估值，第一版全部计入可用建筑资产，不进入冻结或产权交易。',
          )
          replace_one(
              'tests/browser/production-methods.spec.ts',
              "    await expect(informationMain).toContainText('冻结中');\n    await expect(informationMain).toContainText('冻结中');",
              "    await expect(informationMain).toContainText('冻结中');\n    await expect(informationMain).not.toContainText('抵押中');",
          )
          replace_one(
              'scripts/verify-recipe-profit-analysis.mjs',
              "  'min-height: 32px;',",
              "  'min-height: 24px;',",
          )

          def move_failure_checks(path, checks):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              for check in checks:
                  if text.count(check) != 1:
                      raise SystemExit(f'{path}: expected one check: {check!r}')
                  text = text.replace('\n' + check, '', 1)
              marker = '\nif (failures.length) {'
              index = text.rfind(marker)
              if index < 0:
                  raise SystemExit(f'{path}: failure gate missing')
              block = '\n' + '\n'.join(checks) + '\n'
              text = text[:index] + block + text[index:]
              p.write_text(text, encoding='utf-8')

          move_failure_checks('scripts/verify-assets-page.mjs', [
              "requireText(componentPath, 'Number(group.frozenCount || 0) + Number(group.mortgagedCount || 0) + Number(group.contractCollateralCount || 0)');",
          ])
          move_failure_checks('scripts/verify-warehouse-expansion.mjs', [
              "requireText('src/styles/factory-auto-operation.css', 'grid-template-columns: minmax(0, 1fr) auto;');",
              "requireText('src/pages/production/ProductionFacilityDetail.tsx', '(group.frozenCount ?? group.listedCount) + group.mortgagedCount + (group.contractCollateralCount ?? 0)');",
          ])

          p = Path('scripts/verify-mobile-page-sheet.mjs')
          text = p.read_text(encoding='utf-8')
          check = "requireAll('src/styles/mobile-detail-sheet.css', ['min-height: 24px;']);"
          if text.count(check) != 1:
              raise SystemExit('mobile sheet verifier cleanup target missing')
          text = text.replace('\n' + check, '', 1)
          marker = "\nconsole.log('移动唯一 Sheet 自身毛玻璃、稳定松手、透明外部、状态/通知上层与导航隐藏恢复动画验证通过。');"
          index = text.rfind(marker)
          if index < 0:
              raise SystemExit('mobile sheet verifier log marker missing')
          text = text[:index] + '\n' + check + '\n' + text[index:]
          p.write_text(text, encoding='utf-8')

          for path, old, new in [
              ('docs/AUTHORITATIVE_COUNTDOWN_DESIGN.md', '\n\n\n手动商品即时买卖收到服务器精简确认', '\n\n手动商品即时买卖收到服务器精简确认'),
              ('docs/LIQUID_GLASS_CHROME_DESIGN.md', '\n\n\n移动根 Sheet 和二级详情复用同一个拖拽把手', '\n\n移动根 Sheet 和二级详情复用同一个拖拽把手'),
              ('docs/UNIFIED_ASSET_ORDER_BOOK_DESIGN.md', '\n\n\n手动即时商品交易的 HTTP 成功确认', '\n\n手动即时商品交易的 HTTP 成功确认'),
              ('docs/WAREHOUSE_EXPANSION_DESIGN.md', '\n\n\n工厂详情的“自动经营”标题与开关固定在同一行', '\n\n工厂详情的“自动经营”标题与开关固定在同一行'),
          ]:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old in text:
                  p.write_text(text.replace(old, new, 1), encoding='utf-8')

          for path in [
              'scripts/verify-assets-page.mjs',
              'scripts/verify-mobile-page-sheet.mjs',
              'scripts/verify-warehouse-expansion.mjs',
          ]:
              p = Path(path)
              p.write_text(p.read_text(encoding='utf-8').rstrip('\n') + '\n', encoding='utf-8')

          Path('.github/workflows/codex-one-shot-cleanup.yml').unlink()
          PY
          git diff --check
          git status --short
      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "清理30日行情与冻结规则回归"
          git push origin HEAD:codex/daily-market-freeze-timeout-fix
