name: Patch curved map label docs

on:
  push:
    branches:
      - codex/curved-chinese-state-labels
    paths:
      - .github/workflows/patch-curved-map-label-docs.yml

permissions:
  contents: write

jobs:
  patch-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch authoritative map label rules from main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git show origin/main:docs/PAGE_CONTENT_AND_NAVIGATION_DESIGN.md > docs/PAGE_CONTENT_AND_NAVIGATION_DESIGN.md
          git show origin/main:docs/UI_DESIGN_SYSTEM.md > docs/UI_DESIGN_SYSTEM.md
          python3 - <<'PY'
          from pathlib import Path

          page_path = Path('docs/PAGE_CONTENT_AND_NAVIGATION_DESIGN.md')
          page = page_path.read_text()
          old_page_label = '并把州缩写作为地图标签。'
          new_page_label = (
              '并把共享目录的中文州全名作为唯一州面名称。ECharts Map 默认 `label` 必须关闭，州名由绑定同一 ECharts 实例的 SVG `textPath` 标签层绘制：'
              '标签层根据当前投影后的州多边形计算州面内部主轴、局部厚度和安全二次曲线，文字基线及按字号估算的字形带都必须完整落在州面内部；'
              '标签层设置 `pointer-events: none`，不得拦截州面点击、拖动或 Tooltip，也不得维护第二套地图／相机状态。'
              'ECharts `georoam`、Contain 重置和容器尺寸变化后必须重新投影州边界并计算文字路径与字号，使名称与字号随地图缩放和平移同步变化，视觉上像直接绘制在地图地块上。'
              '小州在全图视角允许使用很小字号并随放大自然变大，但不得改回英文州缩写、把名称移到州外、使用引线标签或因移动端断点隐藏整批州名。'
          )
          if old_page_label not in page:
              raise SystemExit('PAGE label rule marker not found')
          page = page.replace(old_page_label, new_page_label, 1)
          zoom_guard = '- 把地图 `scaleLimit` 改离 `0.5～4`，移除滚轮／双指缩放、恢复独立放大／缩小／重置功能面板，或让页面切换、州面点击和镜头切换重置用户当前相机；\n'
          label_guard = '- 把地图州名恢复为英文州缩写、ECharts 默认直线标签、固定屏幕字号、州外标签或引线标签；州名必须继续使用中文州全名、州面内 SVG `textPath` 曲线路径，名称与字号随地图缩放和平移同步变化，且标签层不得拦截州面交互或维护第二套相机状态；\n'
          if zoom_guard not in page:
              raise SystemExit('PAGE zoom guard marker not found')
          page = page.replace(zoom_guard, zoom_guard + label_guard, 1)
          page_path.write_text(page)

          ui_path = Path('docs/UI_DESIGN_SYSTEM.md')
          ui = ui_path.read_text()
          old_camera = '`scaleLimit.min` 固定为 Contain 基线。用户主动平移和放大仍由 ECharts `roam` 与 `scaleLimit` 约束。'
          new_camera = '用户缩放范围固定为 `0.5～4`，默认 Contain 相机仍为 `zoom = 1`；用户主动平移和缩放由 ECharts `roam` 与 `scaleLimit` 约束。'
          if old_camera not in ui:
              raise SystemExit('UI camera marker not found')
          ui = ui.replace(old_camera, new_camera, 1)
          old_zoom = '地图表面支持鼠标／触摸点击、拖动和最高 8 倍受限缩放；'
          if old_zoom not in ui:
              raise SystemExit('UI zoom marker not found')
          ui = ui.replace(old_zoom, '地图表面支持鼠标／触摸点击、拖动和 `0.5～4` 受限缩放；', 1)
          old_labels = '纵向窄屏必须继续显示可读的常驻州缩写：默认字号降低到移动密度并由 `labelLayout.hideOverlap` 消除重叠，CT、DE、MD、MA、NH、NJ、RI、VT 等小州可以保持默认隐藏并仅在选中或悬停时显示；不得通过 `media` 或数据项覆盖把全部州缩写关闭。'
          new_labels = (
              '州面内只显示共享目录中的中文州全名，不得显示英文州缩写。ECharts Map 默认 `label` 固定关闭，由同一地图实例上的 SVG `textPath` 非交互标签层绘制；'
              '每个标签根据当前投影后的州多边形主轴、局部厚度与二次曲线自动拟合，文字基线与按字号估算的字形带必须完整落在州面内部。'
              '标签层使用 `pointer-events: none`，不得遮挡州面点击、拖动或 Tooltip；`georoam`、Contain 重置与尺寸变化后必须随地图缩放和平移同步重算路径和字号，使名称像直接画在地图上一样与地块共同缩放。'
              '小州允许使用极小字号并在放大后自然变大，但不得隐藏为英文简称、移到州外或使用引线。'
          )
          if old_labels not in ui:
              raise SystemExit('UI label marker not found')
          ui = ui.replace(old_labels, new_labels, 1)
          eyebrow = '- 恢复英文眉题；\n'
          ui_guard = '- 把地图州名恢复为英文州缩写、ECharts 默认标签、固定屏幕字号、州外／引线标签，或让中文州全名标签不再完整落在州面内部、不随地图缩放和平移同步重算；\n'
          if eyebrow not in ui:
              raise SystemExit('UI anti-regression marker not found')
          ui = ui.replace(eyebrow, eyebrow + ui_guard, 1)
          ui_path.write_text(ui)
          PY
          git diff --check
          git add docs/PAGE_CONTENT_AND_NAVIGATION_DESIGN.md docs/UI_DESIGN_SYSTEM.md
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m '更新州内中文曲线地图标签设计规则'
          git push origin HEAD:codex/curved-chinese-state-labels
