name: Sync main into daily market

on:
  push:
    branches:
      - codex/daily-system-market

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge latest main and resolve known conflict
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-commit --no-ff origin/main || true

          unresolved="$(git diff --name-only --diff-filter=U)"
          expected='tests/browser/all-pages-preview.spec.ts'
          if [ "$unresolved" != "$expected" ]; then
            echo "Unexpected conflicts:"
            printf '%s\n' "$unresolved"
            exit 1
          fi

          git checkout --theirs tests/browser/all-pages-preview.spec.ts
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'tests/browser/all-pages-preview.spec.ts';
          let source = fs.readFileSync(path, 'utf8');
          const replacements = [
            [
              "for (const label of ['地区', '卖单量', '买单量', '24h成交量', '市场价', '24h价格变化']) await expect(regionalHeader.getByText(label, { exact: true })).toBeVisible();",
              "for (const label of ['地区', '今日价格', '24h成交量', '24h价格变化']) await expect(regionalHeader.getByText(label, { exact: true })).toBeVisible();",
            ],
            [
              "for (const label of ['卖单量', '买单量', '24h成交量', '市场价', '24h价格变化', '挂单差额', '基准偏离', '挂单状态']) await expect(regionalRow.getByText(label, { exact: true })).toHaveCount(0);",
              "for (const label of ['卖单量', '买单量', '今日价格', '24h成交量', '24h价格变化', '挂单差额', '基准偏离', '挂单状态']) await expect(regionalRow.getByText(label, { exact: true })).toHaveCount(0);",
            ],
          ];
          for (const [before, after] of replacements) {
            if (!source.includes(before)) throw new Error(`missing expected all-pages market text: ${before}`);
            source = source.replace(before, after);
          }
          fs.writeFileSync(path, source);
          NODE

          rm .github/workflows/codex-sync-main-daily-market.yml
          git add -A
          if [ -n "$(git diff --name-only --diff-filter=U)" ]; then
            git diff --name-only --diff-filter=U
            exit 1
          fi
          git commit -m "同步最新 main 并保留每日即时市场规则"
          git push origin HEAD:codex/daily-system-market
