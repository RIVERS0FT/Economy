name: Invoke full regional tab verification
on:
  push:
    branches: [codex/validate-province-tabs-full]
    paths: [.github/workflows/dispatch-province-full-ci.yml]
permissions:
  contents: read
  actions: write
jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify target and dispatch the unchanged full CI workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          actual=$(gh api repos/RIVERS0FT/Economy/git/ref/heads/codex/split-province-building-tabs --jq '.object.sha')
          test "$actual" = dbe2d0d9d53318ec669abc33379d32f18920fb9b
          gh workflow run ci.yml --repo RIVERS0FT/Economy --ref codex/split-province-building-tabs
