name: Factory automatic operation authority sync

on:
  push:
    branches:
      - codex/factory-auto-operation-v2
    paths:
      - scripts/sync-factory-auto-operation-authority.mjs
      - .github/workflows/factory-auto-operation-authority-sync.yml

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/factory-auto-operation-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.4.0
      - name: Synchronize authority docs
        run: node scripts/sync-factory-auto-operation-authority.mjs
      - name: Commit synchronized docs and remove one-time tooling
        run: |
          git rm scripts/sync-factory-auto-operation-authority.mjs .github/workflows/factory-auto-operation-authority-sync.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs
          git diff --cached --check
          git commit -m 'Align factory automatic operation authority docs'
          git push origin HEAD:codex/factory-auto-operation-v2
