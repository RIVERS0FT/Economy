name: Integrate online auto-sell main

on:
  push:
    branches: [codex/infinite-warehouse-latest-main]
    paths: [.github/workflows/integrate-online-auto-sell-main.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/infinite-warehouse-latest-main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.4.0
          cache: npm
      - name: Merge current main and resolve warehouse conflicts
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+RIVERS0FT@users.noreply.github.com'
          git fetch origin main
          set +e
          git merge --no-commit --no-ff origin/main
          set -e
          git checkout --ours docs/README.md docs/WAREHOUSE_EXPANSION_DESIGN.md scripts/verify-warehouse-expansion.mjs
          git rm -- src/components/warehouse/WarehouseUpgradeCard.tsx
          sed -i '0,/> 更新时间：2026-08-09/s//> 更新时间：2026-08-10/' docs/README.md
          sed -i 's/无限共享仓库、真实商品库存、容量机制退役、商品卡和商品网格密度/无限共享仓库、真实商品库存、容量机制退役、客户端在线自动出售、商品卡和商品网格密度/' docs/README.md
          sed -i 's#src/components/warehouse/WarehouseUpgradeCard.tsx#src/components/warehouse/WarehouseInventoryPanel.tsx#g' scripts/verify-online-auto-sell.mjs
          sed -i 's/### 7.1 在线自动出售/### 4.1 在线自动出售/g' scripts/verify-online-auto-sell.mjs
          git add -- docs/README.md docs/WAREHOUSE_EXPANSION_DESIGN.md scripts/verify-warehouse-expansion.mjs scripts/verify-online-auto-sell.mjs src/components/warehouse/WarehouseInventoryPanel.tsx
          test -z "$(git diff --name-only --diff-filter=U)"
          git diff --check
          grep -q 'WarehouseInventoryPanel' src/pages/ProductionPage.tsx
          ! grep -q 'WarehouseUpgradeCard' src/pages/ProductionPage.tsx
          ! grep -R -n -E 'warehouseAvailableCapacity|warehouseReservedQuantity|warehouseUpgradeCost|warehouseLevel|warehouse_full' src/components/warehouse/WarehouseInventoryPanel.tsx server/src/online-auto-sell.js src/auto-sell/useOnlineAutoSell.ts
      - run: npm ci
      - name: Warehouse and auto-sell integration tests
        shell: bash
        run: |
          node scripts/verify-warehouse-expansion.mjs
          node scripts/verify-online-auto-sell.mjs
          npm run verify:facility-auto-procure
          node --test server/test/warehouse.test.js server/test/online-auto-sell.test.js server/test/contracts.test.js server/test/facility-groups.test.js server/test/instant-facility-construction.test.js
      - name: Full build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser regression
        run: npm run test:browser
      - name: Commit integrated current main
        shell: bash
        run: |
          git rm -- .github/workflows/integrate-online-auto-sell-main.yml
          git diff --cached --check
          test -z "$(git diff --name-only --diff-filter=U)"
          git status --short
          git commit -m 'Integrate online auto-sell with infinite warehouse'
          git push origin HEAD:codex/infinite-warehouse-latest-main
