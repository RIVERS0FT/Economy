name: Finish online auto-sell implementation

on:
  push:
    branches:
      - feature/online-auto-sell
  workflow_dispatch:

permissions:
  contents: write

jobs:
  implement:
    if: ${{ github.actor != 'github-actions[bot]' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/online-auto-sell
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24.4.0'
          cache: npm

      - name: Reapply staged implementation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          source = subprocess.check_output(
              ['git', 'show', '2e8c1a112b202725656f28da329adbf389be5e33:.github/workflows/apply-online-auto-sell.yml'],
              text=True,
          )
          lines = source.splitlines()
          step_start = lines.index('      - name: Apply implementation from staged source')
          run_start = lines.index('        run: |', step_start) + 1
          run_end = next(
              index for index in range(run_start, len(lines))
              if lines[index].startswith('      - name: ')
          )
          script = 'set -euo pipefail\n' + '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in lines[run_start:run_end]
          ) + '\n'
          Path('/tmp/reapply-online-auto-sell.sh').write_text(script, encoding='utf-8')
          subprocess.run(['bash', '/tmp/reapply-online-auto-sell.sh'], check=True)
          PY

      - name: Add legacy browser-harness fallback
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          component_path = Path('src/components/warehouse/WarehouseUpgradeCard.tsx')
          component = component_path.read_text(encoding='utf-8')
          old = "  const { game, autoSell, showResult, upgradeWarehouse } = model;\n"
          new = """  const { game, showResult, upgradeWarehouse } = model;
            const autoSell = useMemo(() => model.autoSell ?? ({
              policies: {},
              busyProductId: null,
              policyFor: (productId: string) => ({
                enabled: false,
                price: Math.max(0.01, Number(game.products.find((product) => product.id === productId)?.basePrice || 1)),
              }),
              statusFor: (productId: string) => {
                const inventory = game.inventories[productId] ?? { available: 0, frozen: 0 };
                return {
                  availableInventory: Math.max(0, Math.floor(Number(inventory.available || 0))),
                  productionReserved: 0,
                  contractReserved: 0,
                  eligibleQuantity: 0,
                  blockedByOwnBuy: false,
                  hasCrossingBuyer: false,
                };
              },
              setPolicy: () => undefined,
            }), [game.inventories, game.products, model.autoSell]);
"""
          if old not in component:
              raise SystemExit('WarehouseUpgradeCard autoSell destructure marker not found')
          component = component.replace(old, new, 1)
          component_path.write_text(component, encoding='utf-8')

          design_path = Path('docs/WAREHOUSE_EXPANSION_DESIGN.md')
          design = design_path.read_text(encoding='utf-8')
          rule = '在线自动出售控制器属于浏览器本地增强；旧快照、测试 harness 或其他不提供该控制器的调用方必须继续正常渲染仓库与生产页面，并退化为自动出售关闭，不得因可选增强缺失导致页面白屏。'
          if rule not in design:
              design = design.rstrip() + '\n\n### 在线自动出售兼容边界\n\n- ' + rule + '\n'
          design_path.write_text(design, encoding='utf-8')

          verify_path = Path('scripts/verify-online-auto-sell.mjs')
          verify = verify_path.read_text(encoding='utf-8')
          marker = "console.log('Online auto-sell verification passed.');"
          guard = """requireText('src/components/warehouse/WarehouseUpgradeCard.tsx', 'model.autoSell ??');
          requireText('docs/WAREHOUSE_EXPANSION_DESIGN.md', '在线自动出售控制器属于浏览器本地增强');

          """
          if guard.strip() not in verify:
              if marker not in verify:
                  raise SystemExit('online auto-sell verifier completion marker not found')
              verify = verify.replace(marker, guard + marker, 1)
          verify_path.write_text(verify, encoding='utf-8')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Run focused checks
        run: |
          node --test server/test/online-auto-sell.test.js server/test/tutorial-store.test.js
          node scripts/verify-online-auto-sell.mjs
          node scripts/verify-game-tutorial.mjs
          node scripts/verify-warehouse-expansion.mjs
          node scripts/verify-facility-auto-procure.mjs

      - name: Run full build verification
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run production browser regressions
        run: |
          npx playwright test \
            tests/browser/facility-artwork-resolution.spec.ts \
            tests/browser/input-modality.spec.ts \
            tests/browser/mobile-detail-sheet.spec.ts \
            tests/browser/mobile-facility-pull-refresh.spec.ts \
            tests/browser/production-facility-cards.spec.ts \
            tests/browser/production-methods.spec.ts \
            tests/browser/production-status-summary.spec.ts \
            tests/browser/research-technology-tree.spec.ts \
            tests/browser/top-layer-overlays.spec.ts

      - name: Run full browser suite
        run: npm run test:browser

      - name: Commit verified implementation
        shell: bash
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/finish-online-auto-sell.yml
          git add -- \
            package.json \
            docs/README.md \
            docs/UI_DESIGN_SYSTEM.md \
            docs/WAREHOUSE_EXPANSION_DESIGN.md \
            docs/PAGE_CONTENT_AND_NAVIGATION_DESIGN.md \
            docs/UNIFIED_ASSET_ORDER_BOOK_DESIGN.md \
            scripts/verify-facility-auto-procure.mjs \
            scripts/verify-game-tutorial.mjs \
            scripts/verify-online-auto-sell.mjs \
            scripts/verify-warehouse-expansion.mjs \
            server/src/domain.js \
            server/src/facility-groups.js \
            server/src/online-auto-sell.js \
            server/src/runtime-action-executor.js \
            server/src/tutorial-store.js \
            server/test/online-auto-sell.test.js \
            src/api/game.ts \
            src/app/GameApp.tsx \
            src/app/gameViewModel.ts \
            src/auto-sell/autoSellStorage.ts \
            src/auto-sell/useOnlineAutoSell.ts \
            src/components/warehouse/WarehouseUpgradeCard.tsx \
            src/game-guide/tutorialDefinition.ts \
            src/game-guide/tutorialStorage.ts \
            src/game-guide/useGameTutorial.ts \
            src/pages/PageRouter.tsx \
            src/pages/ProductionPage.tsx \
            src/pages/SettingsPage.tsx \
            src/styles/warehouse-expansion.css \
            src/utils/localActivityStore.ts \
            .github/workflows/finish-online-auto-sell.yml
          git diff --cached --check
          git status --short
          git commit -m "feat: add online warehouse auto-sell"
          git push origin HEAD:feature/online-auto-sell
