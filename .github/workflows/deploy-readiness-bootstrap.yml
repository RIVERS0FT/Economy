name: Apply deployment readiness fix

on:
  pull_request:
    paths:
      - '.github/workflows/deploy-readiness-bootstrap.yml'
      - 'scripts/apply-deploy-listen-readiness-fix.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Apply exact readiness patch
        shell: bash
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          python3 scripts/apply-deploy-listen-readiness-fix.py
          rm scripts/apply-deploy-listen-readiness-fix.py .github/workflows/deploy-readiness-bootstrap.yml
          node scripts/verify-runtime-reliability.mjs
          node scripts/verify-production-lazy-settlement.mjs
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: separate service listen readiness from health gate'
          git push origin "HEAD:${HEAD_REF}"
