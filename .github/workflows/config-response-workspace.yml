name: Configuration response workspace

on:
  push:
    branches: [fix/production-config-response-20260907]
    paths:
      - .github/workflows/config-response-workspace.yml
      - .github/config-response.patch

permissions:
  contents: write

jobs:
  workspace:
    if: github.repository == 'RIVERS0FT/Economy' && github.ref == 'refs/heads/fix/production-config-response-20260907'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Apply reviewed task patch and remove workspace helpers
        if: hashFiles('.github/config-response.patch') != ''
        shell: bash
        run: |
          set -euo pipefail
          git apply --check .github/config-response.patch
          git apply .github/config-response.patch
          git rm .github/config-response.patch .github/workflows/config-response-workspace.yml
          git diff --check
          git add src tests scripts docs
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix: unify immediate production configuration and confirmed-state synchronization'
          git push origin HEAD:fix/production-config-response-20260907
      - uses: actions/setup-node@v4
        with:
          node-version: 24.4.0
          cache: npm
      - run: npm ci
      - name: Package pinned validation tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/config-tools/bin"
          cp "$(command -v node)" "$RUNNER_TEMP/config-tools/bin/node"
          tar -czf "$RUNNER_TEMP/config-response-tools.tar.gz" node_modules -C "$RUNNER_TEMP/config-tools" bin
      - uses: actions/upload-artifact@v4
        with:
          name: config-response-tools-${{ github.run_id }}
          path: ${{ runner.temp }}/config-response-tools.tar.gz
          retention-days: 1
          compression-level: 0
