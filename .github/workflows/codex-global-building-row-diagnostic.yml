name: Diagnose building row browser regressions

on:
  push:
    branches:
      - fix/global-building-row-interactions

permissions:
  contents: read

jobs:
  focused-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/global-building-row-interactions
      - uses: actions/setup-node@v4
        with:
          node-version: 24.4.0
          cache: npm
      - name: Apply patches
        run: |
          python .codex-global-building-row-fix-bootstrap.py
          python .codex-global-building-row-fix.py
          python .codex-global-building-row-fix-verifier.py
          python .codex-global-building-row-fix-padding.py
          python .codex-global-building-row-fix-geometry.py
          python .codex-global-building-region-two-line.py
          python .codex-global-building-region-verifier-fix.py
          python - <<'PY'
          from pathlib import Path
          path = Path('src/styles/global-operation-pages.css')
          path.write_text(path.read_text(encoding='utf-8').rstrip() + '\n', encoding='utf-8', newline='\n')
          PY
      - run: npm ci
      - run: bash scripts/prepare-playwright-chromium.sh
      - name: Focused browser diagnostics
        env:
          PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: /usr/bin/google-chrome
        run: npx playwright test tests/browser/global-operation-pages.spec.ts tests/browser/all-pages-preview.spec.ts tests/browser/player-page-geometry.spec.ts --workers=1 --reporter=line
