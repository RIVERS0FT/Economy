name: Absorb state baselines into transport branch

on:
  push:
    branches:
      - feat/transport-routes-page

permissions:
  contents: write

jobs:
  absorb:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout transport branch
        uses: actions/checkout@v4
        with:
          ref: feat/transport-routes-page
          fetch-depth: 0

      - name: Apply latest baseline overlap
        run: node scripts/absorb-state-baselines.mjs

      - name: Commit resolved overlap and remove helper
        shell: bash
        run: |
          set -euo pipefail
          rm scripts/absorb-state-baselines.mjs
          rm .github/workflows/absorb-state-baselines.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "吸收最新州级经济基线"
            git push origin HEAD:feat/transport-routes-page
          fi
