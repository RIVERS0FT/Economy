name: Apply wide factory grid correction

on:
  push:
    branches:
      - codex/wide-facility-cluster-grid

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/wide-facility-cluster-grid
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24.4.0
          cache: npm

      - name: Apply corrected adaptive minimum
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              'src/styles/facility-group-card-grid.css': [
                  ('repeat(auto-fit, minmax(9rem, 10rem))', 'repeat(auto-fit, minmax(8.25rem, 10rem))'),
              ],
              'scripts/verify-production-desktop-layout.mjs': [
                  ('repeat(auto-fit, minmax(9rem, 10rem))', 'repeat(auto-fit, minmax(8.25rem, 10rem))'),
              ],
              'scripts/verify-unified-factory-recipes-grid.mjs': [
                  ('repeat(auto-fit, minmax(9rem, 10rem))', 'repeat(auto-fit, minmax(8.25rem, 10rem))'),
              ],
              'tests/browser/production-facility-cards.spec.ts': [
                  ('expect(geometry.minCardWidth).toBeGreaterThanOrEqual(143.5);', 'expect(geometry.minCardWidth).toBeGreaterThanOrEqual(131.5);'),
              ],
          }

          for path, pairs in replacements.items():
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              for old, new in pairs:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f'{path}: expected one match for {old!r}, found {count}')
                  text = text.replace(old, new)
              file.write_text(text, encoding='utf-8')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Verify corrected layout
        shell: bash
        run: |
          set -o pipefail
          node scripts/verify-production-desktop-layout.mjs
          node scripts/verify-unified-factory-recipes-grid.mjs
          npx playwright install --with-deps chromium
          npx playwright test tests/browser/production-facility-cards.spec.ts
          npm run build

      - name: Commit corrected files and remove temporary workflow
        shell: bash
        run: |
          rm -- .github/workflows/apply-wide-facility-grid-fix.yml
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- \
            src/styles/facility-group-card-grid.css \
            scripts/verify-production-desktop-layout.mjs \
            scripts/verify-unified-factory-recipes-grid.mjs \
            tests/browser/production-facility-cards.spec.ts \
            .github/workflows/apply-wide-facility-grid-fix.yml
          git diff --cached --check
          git commit -m "fix: preserve three wide factory columns"
          git push origin HEAD:codex/wide-facility-cluster-grid
