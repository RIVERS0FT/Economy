name: Align immediate market primary inset gate

on:
  push:
    branches:
      - codex/daily-system-market

permissions:
  contents: write

jobs:
  align:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: node scripts/codex-align-primary-inset-market.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "对齐即时市场安全几何门禁"
          git push origin HEAD:codex/daily-system-market
