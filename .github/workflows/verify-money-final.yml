name: Verify money precision final

on:
  push:
    branches:
      - agent/player-money-two-decimals
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.4.0
          cache: npm
      - run: npm ci
      - name: Full build and server tests
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser regression
        run: npm run test:browser
      - name: Report final verification
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          if [ "$JOB_STATUS" = "success" ]; then
            STATE="success"
            DESCRIPTION="Full build and Chromium regression passed"
          else
            STATE="failure"
            DESCRIPTION="Money precision final verification failed"
          fi
          python3 - "$STATE" "$DESCRIPTION" <<'PYTHON' > /tmp/status.json
          import json
          import sys
          print(json.dumps({
              "state": sys.argv[1],
              "description": sys.argv[2],
              "context": "verify/money-final",
              "target_url": f"https://github.com/{__import__('os').environ['GITHUB_REPOSITORY']}/actions/runs/{__import__('os').environ['GITHUB_RUN_ID']}",
          }))
          PYTHON
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data-binary @/tmp/status.json \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" >/dev/null
