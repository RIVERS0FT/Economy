name: Patch curved map label failures

on:
  push:
    branches:
      - codex/curved-chinese-state-labels
    paths:
      - .github/workflows/patch-curved-map-label-failures.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch map label fallback and browser consumers
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          labels_path = Path('src/components/provinces/provinceMapLabels.ts')
          labels = labels_path.read_text()
          labels = labels.replace(
              "interface LabelLayout {\n  path: string;\n  fontSize: number;",
              "interface LabelLayout {\n  path: string;\n  pathLength: number;\n  fontSize: number;",
              1,
          )
          labels = labels.replace(
              "  if (!chord || chord.length <= GEOMETRY_EPSILON || chord.thickness <= GEOMETRY_EPSILON) return null;",
              "  if (!chord || chord.length <= GEOMETRY_EPSILON) return null;",
              1,
          )
          labels = labels.replace(
              "      return {\n        path: pathData(start, control, end),\n        fontSize,",
              "      return {\n        path: pathData(start, control, end),\n        pathLength: Math.max(GEOMETRY_EPSILON, length(subtract(end, start)) * 0.92),\n        fontSize,",
              1,
          )
          old_tail = """    fontSize = Math.max(MIN_RENDERABLE_FONT_SIZE, fontSize * 0.82);\n  }\n  return null;\n}\n"""
          new_tail = """    fontSize = Math.max(MIN_RENDERABLE_FONT_SIZE, fontSize * 0.82);\n  }\n\n  // Concave or highly articulated states can reject the wide curved strip even when\n  // their center chord is valid. Fall back to a progressively shorter straight\n  // text path around the same interior midpoint. textLength compresses the full\n  // Chinese name into this verified path instead of dropping the state label.\n  for (const fraction of [0.56, 0.42, 0.3, 0.2, 0.12, 0.07]) {\n    const halfLength = chord.length * fraction / 2;\n    let start = add(chord.midpoint, scale(direction, -halfLength));\n    let end = add(chord.midpoint, scale(direction, halfLength));\n    if (end.x < start.x) [start, end] = [end, start];\n    const midpoint = scale(add(start, end), 0.5);\n    const fallbackFontSize = Math.max(MIN_RENDERABLE_FONT_SIZE, Math.min(\n      Math.max(MIN_RENDERABLE_FONT_SIZE, chord.thickness * 0.16),\n      Math.max(MIN_RENDERABLE_FONT_SIZE, chord.length * fraction / (characterCount * LABEL_WIDTH_FACTOR)),\n    ));\n    if (!quadraticPathInsidePolygon(polygon, start, midpoint, end, fallbackFontSize)) continue;\n    return {\n      path: pathData(start, midpoint, end),\n      pathLength: Math.max(GEOMETRY_EPSILON, length(subtract(end, start)) * 0.9),\n      fontSize: fallbackFontSize,\n      strokeWidth: Math.max(0.02, Math.min(0.9, fallbackFontSize * 0.065)),\n      letterSpacing: 0,\n      curved: false,\n    };\n  }\n  return null;\n}\n"""
          if old_tail not in labels:
              raise SystemExit('fitLabelLayout tail not found')
          labels = labels.replace(old_tail, new_tail, 1)
          labels = labels.replace(
              "    textPath.setAttribute('method', 'align');\n    textPath.setAttribute('spacing', 'auto');",
              "    textPath.setAttribute('method', 'align');\n    textPath.setAttribute('spacing', 'auto');\n    textPath.setAttribute('textLength', layout.pathLength.toFixed(2));\n    textPath.setAttribute('lengthAdjust', 'spacingAndGlyphs');",
              1,
          )
          labels = labels.replace(
              "  const handleGeoRoam = () => schedule();",
              "  const handleGeoRoam = () => {\n    schedule();\n    requestAnimationFrame(schedule);\n  };",
              1,
          )
          labels_path.write_text(labels)

          province_test_path = Path('tests/browser/province-map.spec.ts')
          province_test = province_test_path.read_text()
          old_click = """async function clickProvinceLabel(page: Page, provinceId: string) {\n  const label = page.locator(`.province-map-label[data-province-id=\"${provinceId}\"]`);\n  await expect(label).toBeVisible();\n  const box = await label.boundingBox();\n  expect(box).not.toBeNull();\n  await page.mouse.click(\n    (box?.x ?? 0) + (box?.width ?? 0) / 2,\n    (box?.y ?? 0) + (box?.height ?? 0) / 2,\n  );\n}\n"""
          new_click = """async function clickProvinceLabel(page: Page, provinceId: string) {\n  const label = page.locator(`.province-map-label[data-province-id=\"${provinceId}\"]`);\n  await expect(label).toBeVisible();\n  const point = await label.evaluate((element) => {\n    const textPath = element.querySelector('textPath');\n    const href = textPath?.getAttribute('href');\n    const path = href ? element.ownerSVGElement?.querySelector<SVGPathElement>(href) : null;\n    if (!path) throw new Error('province label path is missing');\n    const local = path.getPointAtLength(path.getTotalLength() / 2);\n    const matrix = path.getScreenCTM();\n    if (!matrix) throw new Error('province label screen transform is missing');\n    return {\n      x: matrix.a * local.x + matrix.c * local.y + matrix.e,\n      y: matrix.b * local.x + matrix.d * local.y + matrix.f,\n    };\n  });\n  await page.mouse.click(point.x, point.y);\n}\n"""
          if old_click not in province_test:
              raise SystemExit('province click helper not found')
          province_test = province_test.replace(old_click, new_click, 1)
          province_test = province_test.replace(
              "  await expect(labels.filter({ has: page.locator('[data-label-fit=\"inside\"]') })).toHaveCount(0);\n",
              "",
              1,
          )
          province_test_path.write_text(province_test)

          all_pages_path = Path('tests/browser/all-pages-preview.spec.ts')
          all_pages = all_pages_path.read_text()
          helper = """\nasync function clickMapProvinceLabel(page: import('@playwright/test').Page, provinceName: string) {\n  const label = page.locator('.province-map-label').filter({ hasText: new RegExp(`^${provinceName}$`) });\n  await expect(label).toBeVisible();\n  const point = await label.evaluate((element) => {\n    const href = element.querySelector('textPath')?.getAttribute('href');\n    const path = href ? element.ownerSVGElement?.querySelector<SVGPathElement>(href) : null;\n    if (!path) throw new Error('province label path is missing');\n    const local = path.getPointAtLength(path.getTotalLength() / 2);\n    const matrix = path.getScreenCTM();\n    if (!matrix) throw new Error('province label screen transform is missing');\n    return { x: matrix.a * local.x + matrix.c * local.y + matrix.e, y: matrix.b * local.x + matrix.d * local.y + matrix.f };\n  });\n  await page.mouse.click(point.x, point.y);\n}\n"""
          marker = "] as const;\n"
          if marker not in all_pages:
              raise SystemExit('all-pages helper marker not found')
          all_pages = all_pages.replace(marker, marker + helper, 1)
          all_pages = all_pages.replace("await map.locator('svg text').filter({ hasText: /^TX$/ }).click();", "await clickMapProvinceLabel(page, '得克萨斯州');")
          all_pages = all_pages.replace("await page.getByTestId('us-mainland-map').locator('svg text').filter({ hasText: /^TX$/ }).click();", "await clickMapProvinceLabel(page, '得克萨斯州');")
          all_pages_path.write_text(all_pages)

          warehouse_path = Path('tests/browser/warehouse-auto-sell.spec.ts')
          warehouse = warehouse_path.read_text()
          marker = "test.describe('warehouse and market online auto trade responsibilities', () => {\n"
          helper = """async function clickMapProvinceLabel(page: import('@playwright/test').Page, provinceName: string) {\n  const label = page.locator('.province-map-label').filter({ hasText: new RegExp(`^${provinceName}$`) });\n  await expect(label).toBeVisible();\n  const point = await label.evaluate((element) => {\n    const href = element.querySelector('textPath')?.getAttribute('href');\n    const path = href ? element.ownerSVGElement?.querySelector<SVGPathElement>(href) : null;\n    if (!path) throw new Error('province label path is missing');\n    const local = path.getPointAtLength(path.getTotalLength() / 2);\n    const matrix = path.getScreenCTM();\n    if (!matrix) throw new Error('province label screen transform is missing');\n    return { x: matrix.a * local.x + matrix.c * local.y + matrix.e, y: matrix.b * local.x + matrix.d * local.y + matrix.f };\n  });\n  await page.mouse.click(point.x, point.y);\n}\n\n"""
          if marker not in warehouse:
              raise SystemExit('warehouse describe marker not found')
          warehouse = warehouse.replace(marker, helper + marker, 1)
          warehouse = warehouse.replace("await map.locator('svg text').filter({ hasText: /^CA$/ }).click();", "await clickMapProvinceLabel(page, '加利福尼亚州');", 1)
          warehouse_path.write_text(warehouse)
          PY
          git diff --check
          git add src/components/provinces/provinceMapLabels.ts tests/browser/province-map.spec.ts tests/browser/all-pages-preview.spec.ts tests/browser/warehouse-auto-sell.spec.ts
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m '修复小州标签拟合与旧英文地图测试'
          git push origin HEAD:codex/curved-chinese-state-labels
