name: Apply mobile market layout update

on:
  push:
    branches:
      - agent/mobile-market-entry-book-columns

permissions:
  contents: write

concurrency:
  group: agent-mobile-market-entry-book-columns
  cancel-in-progress: false

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/mobile-market-entry-book-columns
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.4.0
          cache: npm

      - name: Apply approved layout changes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}: {old[:100]!r}')
              file.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'src/pages/MarketPage.tsx',
              "  const [compactTradeView, setCompactTradeView] = useState<'entry' | 'book'>('entry');\n",
              '',
          )
          replace_once(
              'src/pages/MarketPage.tsx',
              '''            <div className="market-compact-view-switch ui-segmented" role="group" aria-label="交易卡片视图">
              <Button
                variant="text"
                className={compactTradeView === 'entry' ? 'ui-segmented__button active' : 'ui-segmented__button'}
                aria-pressed={compactTradeView === 'entry'}
                onClick={() => setCompactTradeView('entry')}
              >下单</Button>
              <Button
                variant="text"
                className={compactTradeView === 'book' ? 'ui-segmented__button active' : 'ui-segmented__button'}
                aria-pressed={compactTradeView === 'book'}
                onClick={() => setCompactTradeView('book')}
              >盘口</Button>
            </div>
''',
              '',
          )
          replace_once(
              'src/pages/MarketPage.tsx',
              '''              <section className={`order-entry market-trade-entry${compactTradeView === 'entry' ? ' market-compact-pane--active' : ''}`} aria-labelledby="market-order-entry-title">''',
              '''              <section className="order-entry market-trade-entry" aria-labelledby="market-order-entry-title">''',
          )
          replace_once(
              'src/pages/MarketPage.tsx',
              '''              <section className={`order-book single-order-book market-trade-book${compactTradeView === 'book' ? ' market-compact-pane--active' : ''}`} aria-labelledby="market-order-book-title">''',
              '''              <section className="order-book single-order-book market-trade-book" aria-labelledby="market-order-book-title">''',
          )

          replace_once(
              'src/styles/market-page-polish.css',
              '''.market-compact-view-switch,
.market-account-view-switch {
  display: none;
}
''',
              '''.market-account-view-switch {
  display: none;
}
''',
          )
          replace_once(
              'src/styles/market-page-polish.css',
              '    grid-template-columns: minmax(0, 2fr) minmax(126px, 1fr);',
              '    grid-template-columns: minmax(0, 3fr) minmax(112px, 2fr);',
          )
          replace_once(
              'src/styles/market-page-polish.css',
              '''@container market-page (max-width: 339px) {
  .market-trade-summary {
    grid-template-columns: minmax(0, 1fr);
  }

  .market-compact-view-switch {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    margin-bottom: var(--space-2);
  }

  .market-trade-layout {
    grid-template-columns: minmax(0, 1fr);
  }

  .market-trade-entry,
  .market-trade-book {
    display: none;
  }

  .market-trade-entry.market-compact-pane--active,
  .market-trade-book.market-compact-pane--active {
    display: block;
  }

  .market-trade-entry {
    padding-right: 0;
    padding-bottom: var(--space-3);
  }

  .market-trade-book {
    border-top: 1px solid var(--color-divider);
    border-left: 0;
    padding-left: 0;
  }
}
''',
              '''@container market-page (max-width: 359px) {
  .market-trade-entry {
    padding-right: var(--space-1);
  }

  .market-trade-book {
    padding-left: var(--space-1);
  }

  .market-stepper-block {
    --market-stepper-label-width: 0px;
  }

  .market-page-surface .market-stepper__field {
    grid-template-columns: minmax(0, 1fr);
    gap: var(--space-1);
  }

  .market-page-surface .market-stepper__field > .ui-form-field__label,
  .market-page-surface .market-stepper__input {
    grid-column: 1;
  }

  .market-page-surface .market-stepper__button {
    top: auto;
    bottom: 0;
  }

  .market-page-surface .market-stepper__button:first-child {
    left: 0;
  }

  .market-stepper-block > .ui-form-field__description,
  .market-stepper-block > .ui-form-field__error {
    margin-left: 0;
  }

  .order-quick-fill {
    gap: 2px;
  }

  .order-quick-fill .ui-button {
    min-width: 0;
    padding-inline: 2px;
  }

  .order-book-columns,
  .market-trade-book .book-order-row {
    grid-template-columns: 24px minmax(0, 1fr) 34px;
    gap: 2px;
    padding-inline: 3px;
  }

  .market-trade-book .book-order-row {
    min-height: 44px;
  }

  .order-book-columns {
    font-size: 0.62rem;
  }

  .market-book-price-button,
  .order-book-midpoint {
    font-size: 0.66rem;
  }

  .market-book-price-button strong,
  .order-book-midpoint strong {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .order-book-midpoint {
    min-height: 44px;
    gap: 2px;
    padding-inline: 3px;
  }

  .order-book-midpoint strong {
    font-size: 0.72rem;
  }
}
''',
