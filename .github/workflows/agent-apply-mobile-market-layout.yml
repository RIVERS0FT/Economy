        run: |
          node scripts/verify-market-page-layout.mjs
          npm run verify:market-desktop-cleanup

      - name: Run complete build
        run: npm run build

      - name: Run browser regression suite
        run: npm run test:browser

      - name: Commit verified source changes
        shell: bash
        run: |
          rm .github/workflows/agent-apply-mobile-market-layout.yml
          git diff --check
          git status --short
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
