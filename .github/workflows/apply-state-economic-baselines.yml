illions": 61338\n    },\n    {\n      "provinceId": "US-SC",\n      "state": "South Carolina",\n      "shortName": "SC",\n      "population": 5570274,\n      "averageWeeklyWage": 1276,\n      "pceMillions": 264656\n    },\n    {\n      "provinceId": "US-SD",\n      "state": "South Dakota",\n      "shortName": "SD",\n      "population": 935094,\n      "averageWeeklyWage": 1230,\n      "pceMillions": 47927\n    },\n    {\n      "provinceId": "US-TN",\n      "state": "Tennessee",\n      "shortName": "TN",\n      "population": 7315076,\n      "averageWeeklyWage": 1424,\n      "pceMillions": 351525\n    },\n    {\n      "provinceId": "US-TX",\n      "state": "Texas",\n      "shortName": "TX",\n      "population": 31709821,\n      "averageWeeklyWage": 1549,\n      "pceMillions": 1595278\n    },\n    {\n      "provinceId": "US-UT",\n      "state": "Utah",\n      "shortName": "UT",\n      "population": 3538904,\n      "averageWeeklyWage": 1389,\n      "pceMillions": 174396\n    },\n    {\n      "provinceId": "US-VT",\n      "state": "Vermont",\n      "shortName": "VT",\n      "population": 644663,\n      "averageWeeklyWage": 1378,\n      "pceMillions": 38173\n    },\n    {\n      "provinceId": "US-VA",\n      "state": "Virginia",\n      "shortName": "VA",\n      "population": 8880107,\n      "averageWeeklyWage": 1585,\n      "pceMillions": 486123\n    },\n    {\n      "provinceId": "US-WA",\n      "state": "Washington",\n      "shortName": "WA",\n      "population": 8001020,\n      "averageWeeklyWage": 1948,\n      "pceMillions": 472900\n    },\n    {\n      "provinceId": "US-WV",\n      "state": "West Virginia",\n      "shortName": "WV",\n      "population": 1766147,\n      "averageWeeklyWage": 1203,\n      "pceMillions": 84235\n    },\n    {\n      "provinceId": "US-WI",\n      "state": "Wisconsin",\n      "shortName": "WI",\n      "population": 5972787,\n      "averageWeeklyWage": 1346,\n      "pceMillions": 310876\n    },\n    {\n      "provinceId": "US-WY",\n      "sta