name: Apply state economic baselines

on:
  push:
    branches:
      - feat/state-economic-baselines
    paths:
      - .github/workflows/apply-state-economic-baselines.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/state-economic-baselines
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.4.0
          cache: npm

      - name: Apply state economic baseline implementation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          
          def write(path, content):
              target = Path(path)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(content, encoding='utf-8')
          
          def replace_once(path, old, new):
              target = Path(path)
              text = target.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"replacement mismatch {path}: expected 1, found {count} for {old[:120]!r}")
              target.write_text(text.replace(old, new, 1), encoding='utf-8')
          
          def replace_expected(path, old, new, expected):
              target = Path(path)
              text = target.read_text(encoding='utf-8')
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f"replacement mismatch {path}: expected {expected}, found {count} for {old[:120]!r}")
              target.write_text(text.replace(old, new), encoding='utf-8')
          
          write('shared/us-state-economic-baselines.json', '{\n  "version": 1,\n  "sources": {\n    "population": {\n      "agency": "U.S. Census Bureau",\n      "series": "Vintage 2025 Population Estimates / QuickFacts",\n      "period": "2025-07-01",\n      "measure": "resident population",\n      "unit": "persons"\n    },\n    "wage": {\n      "agency": "U.S. Bureau of Labor Statistics",\n      "series": "Quarterly Census of Employment and Wages (QCEW)",\n      "period": "2025-Q4",\n      "measure": "average weekly wage",\n      "unit": "USD per week",\n      "status": "preliminary"\n    },\n    "consumption": {\n      "agency": "U.S. Bureau of Economic Analysis",\n      "series": "Personal Consumption Expenditures by State",\n      "period": "2023",\n      "measure": "total current-dollar PCE",\n      "unit": "million USD"\n    }\n  },\n  "states": [\n    {\n      "provinceId": "110000",\n      "state": "California",\n      "shortName": "CA",\n      "population": 39355309,\n      "averageWeeklyWage": 1954,\n      "pceMillions": 2526290\n    },\n    {\n      "provinceId": "120000",\n      "state": "Alabama",\n      "shortName": "AL",\n      "population": 5193088,\n      "averageWeeklyWage": 1301,\n      "pceMillions": 227475\n    },\n    {\n      "provinceId": "130000",\n      "state": "Arizona",\n      "shortName": "AZ",\n      "population": 7623818,\n      "averageWeeklyWage": 1446,\n      "pceMillions": 400704\n    },\n    {\n      "provinceId": "140000",\n      "state": "Arkansas",\n      "shortName": "AR",\n      "population": 3114791,\n      "averageWeeklyWage": 1213,\n      "pceMillions": 135761\n    },\n    {\n      "provinceId": "150000",\n      "state": "Colorado",\n      "shortName": "CO",\n      "population": 6012561,\n      "averageWeeklyWage": 1683,\n      "pceMillions": 374880\n    },\n    {\n      "provinceId": "210000",\n      "state": "Connecticut",\n      "shortName": "CT",\n      "population": 3688496,\n      "averageWeeklyWage": 1801,\n      