          replace_once('server/src/market-demand/signals.js', "  function orderBookQuote(world, product, depth, referencePrice) {\n    const asks = iterateOrderBookSide(world, {\n      assetKind: 'commodity',", "  function orderBookQuote(world, product, depth, referencePrice, provinceId) {\n    const asks = iterateOrderBookSide(world, {\n      provinceId,\n      assetKind: 'commodity',")
          replace_once('server/src/market-demand/signals.js', '  function effectivePrice(world, product, depth, priceState, now) {\n    const referencePrice = Math.max(0.01, Number(priceState?.referencePrice || product.basePrice));\n    const quote = orderBookQuote(world, product, depth, referencePrice);\n    const trades = realTradeStats(world, product.id, now);', '  function effectivePrice(world, product, depth, priceState, now, provinceId) {\n    const referencePrice = Math.max(0.01, Number(priceState?.referencePrice || product.basePrice));\n    const quote = orderBookQuote(world, product, depth, referencePrice, provinceId);\n    const trades = realTradeStats(world, product.id, now, PRICE_WINDOW_MS, provinceId);')
          replace_once('server/src/market-demand/allocation.js', '  function directDemandChoices(world, group, state, directBudget, now, { classShares } = {}) {', '  function directDemandChoices(world, group, state, directBudget, now, { classShares, provinceId } = {}) {')
