          replace_once('docs/PRODUCT_AND_GAMEPLAY_DESIGN.md', '普通货币、冻结资金、宝石、研发、银行、排行榜、合同和世界人口继续是玩家级或世界级状态，不按地区复制。商品库存、商品行情、工厂集群、工厂行情和订单簿按州级地区隔离：商品只进入成交或生产发生地的本地仓库；同资产、同价格但地区不同的订单永远不能撮合；工厂交易或拍卖后仍留在原地区。银行抵押明细、玩家借贷抵押和工厂租赁合同虽然属于全局账户或合同状态，但其工厂标的必须保存明确 `provinceId`，不得锁定、处置或租入另一地区的同类集群。跨州商品只能通过付费运输在已解锁州之间流动：公路低成本小运量中耗时、铁路中成本大运量长耗时、航空高成本中运量短耗时；运输中商品记入源州库存的 `inTransit`，到达后进入目的州本地仓库。客户端切换地图不得移动任何资产。', '普通货币、冻结资金、宝石、研发、银行、排行榜、合同和三类人口真实钱包继续是玩家级或世界级状态，不按地区复制；州级居民经济只保存官方统计基准，不复制人口钱包或把现实美元直接兑换为游戏货币。`shared/us-state-economic-baselines.json` 固定覆盖连续 48 州，当前人口基准为 Census Vintage 2025 的 2025-07-01 常住人口，工资基准为 BLS QCEW 2025-Q4 平均周薪（初值），消费基准为 BEA 2023 current-dollar PCE 总额。人口与工资用于州级经济基准和诊断；PCE 总额用于消费需求的州间分配权重，避免同时乘人口、工资和 PCE 造成重复放大。\n\n每个消费周期仍先从同一套三类人口真实钱包形成全局可消费预算，再仅在至少一名玩家已选择、已解锁或已有工厂经营足迹的州之间按 PCE 总额权重以六位小数完整分摊；同一州无论有多少玩家只计算一次真实州经济，不按玩家人数复制人口。没有任何州经营足迹时回退默认加利福尼亚州。州权重只分配既有预算，不发行货币、不增加钱包余额；分配后的消费与派生需求订单必须携带对应 `provinceId` 并只进入该州本地订单簿。\n\n商品库存、商品行情、工厂集群、工厂行情和订单簿按州级地区隔离：商品只进入成交或生产发生地的本地仓库；同资产、同价格但地区不同的订单永远不能撮合；工厂交易或拍卖后仍留在原地区。银行抵押明细、玩家借贷抵押和工厂租赁合同虽然属于全局账户或合同状态，但其工厂标的必须保存明确 `provinceId`，不得锁定、处置或租入另一地区的同类集群。跨州商品只能通过付费运输在已解锁州之间流动：公路低成本小运量中耗时、铁路中成本大运量长耗时、航空高成本中运量短耗时；运输中商品记入源州库存的 `inTransit`，到达后进入目的州本地仓库。客户端切换地图不得移动任何资产。')
