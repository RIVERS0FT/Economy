name: Apply fullscreen outliner hide

on:
  push:
    branches:
      - fix/hide-fullscreen-outliner

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply final behavior
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')

          def replace_once(path, old, new):
              text = read(path)
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one occurrence, got {count}: {old[:120]!r}')
              write(path, text.replace(old, new, 1))

          def replace_all(path, old, new, expected_min=1):
              text = read(path)
              count = text.count(old)
              if count < expected_min:
                  raise SystemExit(f'{path}: expected at least {expected_min} occurrences, got {count}: {old[:120]!r}')
              write(path, text.replace(old, new))

          def replace_regex_once(path, pattern, replacement, flags=0):
              text = read(path)
              new, count = re.subn(pattern, replacement, text, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f'{path}: regex expected once, got {count}: {pattern!r}')
              write(path, new)

          def replace_line_start(path, prefix, new_line):
              lines = read(path).splitlines()
              hits = [i for i, line in enumerate(lines) if line.startswith(prefix)]
              if len(hits) != 1:
                  raise SystemExit(f'{path}: line prefix expected once, got {len(hits)}: {prefix!r}')
              lines[hits[0]] = new_line
              write(path, '\n'.join(lines) + '\n')

          # Remove the last remnants of whole-Outliner horizontal collapse from the component.
          replace_once(
              'src/components/outliner/StrategicOutliner.tsx',
              "import {\n  MapIcon,\n  NavigationIcon,\n  PinIcon,\n  type NavigationIconName,\n} from '../icons/GameIcons';",
              "import {\n  NavigationIcon,\n  PinIcon,\n  type NavigationIconName,\n} from '../icons/GameIcons';",
          )
          replace_once(
              'src/components/outliner/StrategicOutliner.tsx',
              '      <span className="strategic-outliner__collapsed-map" aria-hidden="true"><MapIcon /></span>\n',
              '',
          )

          # Base Outliner has one stable width; only its internal sections can collapse.
          css = 'src/styles/strategic-game-shell.css'
          replace_once(css, ' * only collapse and pin references are browser-local preferences. */', ' * only section collapse and pin references are browser-local preferences. */')
          replace_once(css, '  transition: width 180ms cubic-bezier(.2, .8, .2, 1);\n', '')
          replace_once(css, '  grid-template-columns: minmax(0, 1fr) 34px 34px;', '  grid-template-columns: minmax(0, 1fr) 34px;')
          replace_once(css, '.strategic-outliner__context-pin,\n.strategic-outliner__collapse,\n.strategic-outliner-row__pin {', '.strategic-outliner__context-pin,\n.strategic-outliner-row__pin {')
          replace_once(css, '.strategic-outliner__context-pin,\n.strategic-outliner__collapse {', '.strategic-outliner__context-pin {')
          replace_once(css, '.strategic-outliner__context-pin svg,\n.strategic-outliner__collapse svg,\n.strategic-outliner-row__pin svg {', '.strategic-outliner__context-pin svg,\n.strategic-outliner-row__pin svg {')
          replace_regex_once(
              css,
              r'\n\.strategic-outliner__collapsed-map \{\n  display: none;\n\}\n.*?\n(?=@media \(hover: hover\) and \(pointer: fine\))',
              '\n',
              re.S,
          )
          replace_once(css, "  html[data-input-modality='mouse'] .strategic-outliner__collapse:hover,\n", '')
          replace_once(css, '    --strategic-outliner-collapsed-width: 44px;\n', '')
          replace_once(
              css,
              '@media (min-width: 1440px) {\n  .game-shell:has(.strategic-outliner[data-collapsed="true"]) {\n    --strategic-outliner-reserved-width: var(--strategic-outliner-collapsed-width);\n  }\n}\n\n',
              '',
          )
          replace_once(
              css,
              '@media (max-width: 1439px) and (min-width: 721px) {\n  .game-shell {\n    --strategic-outliner-reserved-width: var(--strategic-outliner-collapsed-width);\n  }\n}',
              '@media (max-width: 1439px) and (min-width: 721px) {\n  .game-shell {\n    --strategic-outliner-reserved-width: 0px;\n  }\n}',
          )

          # Final cascade: desktop fullscreen hides the same DOM and releases all horizontal reservation.
          write('src/styles/strategic-outliner.css', '''/* Strategic Outliner cascade corrections loaded after strategic-game-shell.css.\n * The tracker keeps one full-width desktop geometry. Fullscreen pages hide the\n * same DOM instead of compressing it, preserving local section and pin state. */\n.game-shell .strategic-outliner {\n  z-index: 2;\n}\n\n.strategic-outliner__scroll {\n  overscroll-behavior-x: contain;\n  overscroll-behavior-y: auto;\n}\n\n@media (min-width: 721px) {\n  .game-shell:not(:has(.strategic-page-host--fullscreen)) .strategic-outliner {\n    width: var(--strategic-outliner-width);\n    visibility: visible;\n    pointer-events: auto;\n  }\n\n  .game-shell:has(.strategic-page-host--fullscreen) {\n    --strategic-outliner-reserved-width: 0px;\n    --strategic-primary-card-inline-size: calc(\n      100% - var(--strategic-panel-gap) * 2\n    );\n  }\n\n  .game-shell:has(.strategic-page-host--fullscreen) .strategic-outliner {\n    visibility: hidden;\n    pointer-events: none;\n  }\n}\n\n@media (min-width: 1440px) {\n  .game-shell:not(:has(.strategic-page-host--fullscreen)) {\n    --strategic-outliner-reserved-width: var(--strategic-outliner-width);\n  }\n}\n\n@media (max-width: 1439px) and (min-width: 721px) {\n  .game-shell:not(:has(.strategic-page-host--fullscreen)) {\n    --strategic-outliner-reserved-width: 0px;\n  }\n}\n''')

          # Authoritative shell design: no 44px compact rail; fullscreen hides the mounted Outliner.
          design = 'docs/LIQUID_GLASS_CHROME_DESIGN.md'
          replace_once(design, '> 更新时间：2026-08-23', '> 更新时间：2026-08-24')
          replace_line_start(
              design,
              '- 桌面右侧统一使用 `StrategicWorkspaceChrome → StrategicOutliner`。',
              '- 桌面右侧统一使用 `StrategicWorkspaceChrome → StrategicOutliner`。战略追踪器是应用外壳级 Outliner，不属于任何业务页面，固定包含“教程／进行中／关注／公开经济事件”四个可折叠分区。战略追踪器与页面路由生命周期解耦：`home`、`map`、`province`、`market`、`buildings`、`settings` 以及 `research`、`auction`、`contracts`、`bank`、`leaderboard`、`gem-shop` 六个 `fullscreen` 页面都复用同一追踪器 DOM。正式页面切换不得卸载追踪器、清空关注引用、重置其滚动位置或改写教程轮次；六个 `fullscreen` 页面在桌面端隐藏同一追踪器并禁用命中，同时把追踪器预留宽度释放为 `0`，离开 `fullscreen` 后恢复完整显示。显示切换不得重建追踪器 DOM 或改写四个分区的折叠状态。',
          )
          replace_line_start(
              design,
              '- 教程固定为追踪器顶部的紧凑分区。',
              '- 教程固定为追踪器顶部的紧凑分区。追踪器内必须使用 `GameGuideStrip variant="outliner"`，保留“步骤 N/9”、教程总体进度、当前任务、前往操作和“跳过”；总体进度继续位于单个任务标题之前且无障碍名称固定为“教程总体进度”。Outliner 变体不得带独立 `.panel` 外壳。跳过仍需确认，清除当前教程轮次并写入按玩家和教程版本隔离的本地跳过标记；设置页只提供“重新开始教程”，该操作清除跳过标记、从第一步新建轮次并回到概览。页面切换、`fullscreen` 桌面隐藏展示、权威状态刷新和分区折叠均不得把展示层隐藏误写成跳过、完成或重开。',
          )
          replace_line_start(
              design,
              '- 桌面战略追踪器展开宽度固定为 `clamp(280px, 21vw, 320px)`',
              '- 桌面战略追踪器只有一种完整宽度 `clamp(280px, 21vw, 320px)`，不得提供追踪器整体横向展开／收起按钮，也不得保留 `44px` 紧凑轨道或整体 `data-collapsed` 状态。视口不小于 `1440px` 时，普通页面必须真实预留完整追踪器宽度和 `8px` 沟槽；`721px–1439px` 普通页面不预留伪收起轨道，完整追踪器向左覆盖地图／页面剩余区域而不推动主卡片。进入任一 `fullscreen` 页面时桌面追踪器保持同一 DOM 但 `visibility:hidden` 且禁止命中，预留宽度统一释放为 `0`；离开 `fullscreen` 后恢复完整显示。追踪器本身不执行横向宽度动画，页面主卡片继续使用既有页面展示宽度过渡；`prefers-reduced-motion: reduce` 时页面过渡立即完成。',
          )
          replace_line_start(
              design,
              '- `home`、`province`、`market`、`buildings`、`settings` 仍使用 `building`',
              '- `home`、`province`、`market`、`buildings`、`settings` 仍使用 `building`，统一以 `--strategic-compact-page-width: 56rem` 为内容目标；包含 `78px` 侧栏轨道的完整 `workspaceCard` 仍不得超过 `calc(100vw / 3)`，并不得越入宽屏普通页面为追踪器预留的空间。`research`、`auction`、`contracts`、`bank`、`leaderboard`、`gem-shop` 仍使用 `fullscreen`；其“全宽”含义为占用左侧 `8px` 屏幕边距之后到右侧 `8px` 屏幕边距之前的全部工作区，桌面 `fullscreen` 不再为战略追踪器保留任何横向轨道。',
          )
          replace_line_start(
              design,
              '- 玩家主卡片宽度只允许因正式页面展示类型、响应式断点或 `fullscreen` 自动紧凑／退出紧凑',
              '- 玩家主卡片宽度只允许因正式页面展示类型、响应式断点或 `fullscreen` 隐藏／恢复战略追踪器导致可用区域变化而使用既有 `220ms cubic-bezier(.2,.8,.2,1)` 过渡；教程开始／跳过、事件数量、待处理数量、关注实时值和权威状态刷新不得改变主卡片宽度或重播页面展开。新页面内容继续以 keyed `clip-path: inset(0 100% 0 0) → inset(0)` 从左向右裁剪展开并轻微淡入，动画不得修改 `grid-template-columns`、页面内容宽度或滚动根宽度，不得对地图、ECharts 宿主、工作区或毛玻璃采样链设置动画 `transform`。',
          )
          replace_line_start(
              design,
              '- `scripts/verify-liquid-glass-chrome.mjs`：',
              '- `scripts/verify-liquid-glass-chrome.mjs`：历史脚本路径保留，但验证对象已改为 CSS 毛玻璃、依赖删除、共享组件、单节点 Tooltip 材质、统一 `workspaceCard`、战略追踪器四分区、页面路由与追踪器生命周期解耦、`fullscreen` 桌面隐藏并释放右侧预留空间以及移动教程复用同一 Outliner DOM。',
          )
          replace_line_start(
              design,
              '- `scripts/verify-strategic-outliner.mjs`：',
              '- `scripts/verify-strategic-outliner.mjs`：锁定“教程／进行中／关注／公开经济事件”四分区、唯一纵向滚动根、关注引用与分区折叠本地持久化边界、禁止保存实时经济值、现有通知待处理复用、桌面普通页完整展示／`fullscreen` 隐藏同一 DOM、禁止整体横向收起状态与移动教程单实例。',
          )
          replace_line_start(
              design,
              '- `tests/browser/tutorial-right-rail.spec.ts`：',
              '- `tests/browser/tutorial-right-rail.spec.ts`：桌面战略追踪器在普通与六个 `fullscreen` 页面之间保持同一 DOM，普通页完整显示、`fullscreen` 隐藏且主卡片扩展到右侧 `8px` 屏幕边距，不存在整体横向收起按钮或 `44px` 轨道；教程步骤、分区折叠和关注引用跨页保持。移动端复用同一 Outliner DOM 只显示教程分区，根 Sheet 与通知可以自然覆盖教程而状态栏保持最高。',
          )

          # Page/navigation authority uses the same final visibility semantics.
          page_design = 'docs/PAGE_CONTENT_AND_NAVIGATION_DESIGN.md'
          replace_line_start(
              page_design,
              '玩家桌面侧栏与当前页面必须共同位于唯一 `workspaceCard`，',
              '玩家桌面侧栏与当前页面必须共同位于唯一 `workspaceCard`，卡片固定预留 `78px` 侧栏轨道；侧栏展开到 `224px` 时以竖线和阴影覆盖页面，不改变页面、地图或战略追踪器几何。`map` 只显示侧栏轨道；概览、州级上下文、市场、建筑、设置使用 `building`，共享 `56rem` 内容目标且整个主卡片不得超过 `calc(100vw / 3)`；研发、拍卖、合同、银行、排行榜、商店使用 `fullscreen`。桌面战略追踪器由 `StrategicWorkspaceChrome` 常驻持有并与页面路由生命周期解耦：所有普通页、纯地图和六个 `fullscreen` 页复用同一 `StrategicOutliner` DOM，页面切换不得卸载追踪器、教程、关注引用、分区折叠或滚动状态。视口不小于 `1440px` 时普通页面的完整追踪器真实占用 `clamp(280px, 21vw, 320px)`，主卡片必须预留追踪器宽度与 `8px` 沟槽；`721px–1439px` 普通页面不预留伪收起轨道，完整追踪器向左覆盖剩余地图区域而不推动主卡片或地图。六个 `fullscreen` 页面在桌面端隐藏同一追踪器 DOM、禁用命中并把横向预留释放为 `0`，主卡片右边缘只保留统一 `8px` 屏幕边距；离开 `fullscreen` 后同一追踪器恢复完整显示。战略追踪器不得提供整体横向展开／收起按钮，不存在 `44px` 整体紧凑轨道或整体收起偏好。桌面研发页继续使用与其他玩家页面相同的统一 `workspaceCard` 外层容器，容器保持共享毛玻璃、边框、圆角、阴影和高光；科技树视口自身仍不得形成铺满页面的第二层边框、圆角或不透明卡片背景。',
          )
          replace_line_start(
              page_design,
              '- 公开经济事件不得进入概览页面内容。',
              '- 公开经济事件不得进入概览页面内容。桌面端由 `StrategicWorkspaceChrome` 的统一战略追踪器持有，战略追踪器固定包含“教程／进行中／关注／公开经济事件”四个分区并跨全部桌面页面保持同一 DOM；公开事件读取最近已结束事件以及当前与未来七天事件，教程只由进行中的本地教程轮次控制。战略追踪器与页面路由生命周期解耦，`fullscreen` 页面不卸载教程或事件；桌面 `fullscreen` 只隐藏同一 Outliner 并释放其横向预留，离开后恢复完整显示，过程不得改写教程状态。移动端公开事件、进行中和关注分区隐藏，只保留同一 `StrategicOutliner` DOM 中的教程分区固定在状态栏正下方，概览不得持有移动专用教程入口或第二份教程 DOM。事件折叠态只显示名称、状态点和距离开始／结束时间，展开后查看说明、受影响类别与商品；市场页和概览页都不得复制该日志；',
          )
          replace_line_start(
              page_design,
              '教程只有进行中、已跳过和已完成三种结果。',
              '教程只有进行中、已跳过和已完成三种结果。进行中时教程由 `GameShell`／`StrategicWorkspaceChrome` 的统一战略追踪器单实例持有；桌面所有页面（包括六个 `fullscreen` 页面）都复用同一 Outliner DOM，教程始终位于其顶部且页面切换不得卸载；桌面 `fullscreen` 隐藏同一 Outliner 只改变可见性，不得改写教程轮次、步骤或完成状态。移动端继续复用同一 Outliner DOM，但只显示教程分区并固定在状态栏正下方；根级 Mobile Workspace Sheet 和通知面板可以覆盖它，覆盖不得触发卸载或教程状态变化。教程总体进度条属于九步教程整体，必须位于当前单个任务标题之前，并使用“教程总体进度”无障碍名称。教程卡的次要操作固定为“跳过”：点击后必须先通过系统确认框明确说明本轮进度会清除、不会再自动显示、不会影响游戏资产，并告知可前往“设置 → 游戏设置 → 教程”重新开始；确认后客户端清除当前轮次及其步骤、统计和上下文，写入按玩家 ID 与教程版本隔离的本地跳过标记，不调用服务器完成接口。当前版本被跳过后，刷新、重新登录和页面切换都不得自动创建新轮次。设置页不提供“显示教程”或继续教程入口，只保留“重新开始教程”；重新开始清除当前版本跳过标记、创建新的第一步轮次并回到概览，不清除服务器完成记录和任何经济状态。旧客户端持久化的 `hidden` 轮次读取时直接迁移为当前版本“已跳过”，不得恢复隐藏／显示状态机。教程不发放资金、商品、工厂、宝石、排行榜分数或其他经济奖励。首次完整完成时客户端调用一次幂等完成接口；已经完成过的玩家重复完成不再产生服务器写入。本地完成写入失败时只保留轻量待补记标记，并在下次进入时重试。',
          )
          replace_line_start(
              page_design,
              '| 战略追踪器（教程／进行中／关注／公开经济事件） |',
              '| 战略追踪器（教程／进行中／关注／公开经济事件） | `GameShell`／`StrategicWorkspaceChrome`／`StrategicOutliner`；桌面所有页面共享同一 Outliner，移动只呈现同一 DOM 的教程分区；四个分区折叠与关注引用是浏览器偏好，不存在追踪器整体横向收起状态，桌面 `fullscreen` presentation 仅隐藏同一 DOM 并释放横向预留，实时经济值始终来自当前权威状态 |',
          )
          replace_line_start(
              page_design,
              '- 让任何普通、纯地图或 `fullscreen` 页面卸载 `.strategic-outliner`、教程或公开经济事件分区，',
              '- 让任何普通、纯地图或 `fullscreen` 页面卸载 `.strategic-outliner`、教程或公开经济事件分区，或把页面类型重新作为追踪器存在条件；战略追踪器与页面路由生命周期解耦，页面切换不得重置分区折叠、关注、滚动或教程步骤。桌面 `fullscreen` 只允许隐藏同一 DOM 并把横向预留释放为 `0`，离开后必须恢复完整显示；不得恢复 `44px` 整体紧凑轨道、追踪器整体横向展开／收起按钮、整体 `data-collapsed` 状态或把整体收起状态写入 localStorage。不得为追踪器新增专用轮询、第二套待处理判断、嵌套纵向滚动区或内部大玻璃卡，也不得把实时价格、库存、数量、倒计时、合同或拍卖经济状态保存到其 localStorage；',
          )
          replace_all(page_design, '`fullscreen` 自动紧凑展示', '`fullscreen` 桌面隐藏展示')

          # Overview-specific authority no longer reserves or expects a compact rail.
          overview_design = 'docs/OVERVIEW_LAYOUT_INTEGRITY_DESIGN.md'
          replace_once(overview_design, '> 更新时间：2026-08-23', '> 更新时间：2026-08-24')
          replace_line_start(
              overview_design,
              '- `900px` 紧凑桌面只为战略追踪器保留 `44px` 收起轨道，',
