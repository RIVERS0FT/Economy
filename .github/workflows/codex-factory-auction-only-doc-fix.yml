name: Temporary auction-only design restore

on:
  push:
    branches:
      - codex/factory-auction-only

permissions:
  contents: write
  actions: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/factory-auction-only
          fetch-depth: 0
      - name: Restore section 1.1 without factory direct trading
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/PAGE_CONTENT_AND_NAVIGATION_DESIGN.md')
          text = path.read_text(encoding='utf-8')
          start = text.index('### 1.1 跨页面表单状态隔离')
          end = text.index('## 2. 应用外壳', start)
          section = '''### 1.1 跨页面表单状态隔离

- 市场当前选择的商品只属于市场交易上下文；建筑详情只承担工厂经营与生产配置，不提供工厂买卖入口、订单簿草稿或从属交易页。工厂所有权交易只能前往一级“拍卖”页面发起或竞拍；市场商品切换和市场目录合法化只能修改商品交易对应的 `marketAssetKind`、`marketAssetId` 及订单草稿，不得改写建筑页“建设新工厂”的类型选择。
- 工厂详情“生产结算”的投入／产出物资槽是当前州本地商品详情的直接导航入口；点击或键盘激活时必须通过受限页面栈从当前 `regional-facility` push 同 `provinceId + productId` 的 `regional-product`：来源宿主为 `province` 时继续使用 `province`，来源为建筑一级页时使用 `market` 宿主；返回必须回到原工厂详情。应用外壳继续以 `commodity + productId` 选择对应地区商品，不得先进入商品全局详情或商品目录。不得根据生产配方语义自动推断采购／出售方向，数量和价格继续按统一市场资产切换的订单草稿初始化规则处理（当前数量重置为 `1`，并按当前方向与目标资产初始化默认价格），不得自动提交订单；不得改写建筑页建设工厂类型、数量、配方、作业制度或任何服务器权威生产状态。
- 建设工厂类型、数量和一键采购报价只属于建筑页建设表单；目录变化时只在自身候选目录内合法化。建设动作必须显式提交表单当前选择的 `facilityTypeId` 与 `quantity`，所有教程、通知或页面包装层必须原样透传两者以及可选采购保护参数，不得通过默认值、其他页面状态或刷新结果隐式回退。农场和果园的空 `buildInputs` 必须显示“无需材料”；其他工厂逐项显示需求、库存与缺口，并把原“最多可建”改为“库存可直接建”。存在缺料时按表单的地区、工厂类型和数量调用只读建造报价接口；加载期间禁止提交，切换上下文时中止旧请求，失败时显示明确错误。全部缺料可在真实卖盘中购齐时显示“一键购齐并建造”，继续提交 `autoProcure=true`、逐材料最高接受价和采购总额上限，服务器报价失效时拒绝并要求重新确认；任一缺料卖盘不足时不得仅因深度不足禁用建设意图，而应显示逐材料“价格”、买单最高资金占用和“一键提交缺料买单”。缺料买单默认价格按同商品最低有效卖价 → 无卖单时最高有效买价 → 买卖盘均为空时 `1`，报价刷新不得覆盖玩家已编辑价格。服务器成功返回本次建造对应的正式订单 ID 后，客户端仅用按玩家隔离的浏览器本地关联把这些订单按单次建造聚类为“待采购”；官方订单及成交状态始终以本人 `game.orders` 为权威，不新增采购组轮询或服务器第二状态。
- 拍卖、合同、设置和管理员等下拉框必须由所属页面或业务表单状态控制；候选项变化时应在本表单内同步合法化显示值与提交值，不得借用其他页面的选择状态。
- 周期轮询、动作后同步和权威倒计时确认对客户端交互状态必须透明；只允许更新服务器权威数据，不得覆盖仍然有效的页面选择、未提交表单草稿、弹层、展开状态、焦点或滚动位置。
- 页面实体选择统一使用 `useStableSelection`：首次进入、业务上下文明确切换或当前实体失效时才允许使用显式业务回退；普通快照对象替换、资金变化、进度变化和目录引用变化必须保留当前选择，不得默认选择目录最后一项。
- 可编辑服务器字段统一使用 `useServerDraft`：未编辑时跟随服务器值；`dirty` 时保留草稿；编辑期间服务器值变化时标记 `conflicted`；服务器确认值与草稿一致时清除草稿状态。
- 操作提交必须在点击时冻结实体 ID 和表单载荷，异步确认与后续刷新不得重新读取默认选项或推荐值。页面、表单和弹层不得以服务器修订号、`lastProcessedAt`、完整 `game` 快照或序列化快照作为 React `key`。

'''
          path.write_text(text[:start] + section + text[end:], encoding='utf-8')
          Path('.github/workflows/codex-factory-auction-only-doc-fix.yml').unlink()
          PY
      - name: Verify restored design markers
        shell: bash
        run: |
          grep -F '周期轮询、动作后同步和权威倒计时确认对客户端交互状态必须透明' docs/PAGE_CONTENT_AND_NAVIGATION_DESIGN.md
          grep -F '建筑详情只承担工厂经营与生产配置，不提供工厂买卖入口、订单簿草稿或从属交易页' docs/PAGE_CONTENT_AND_NAVIGATION_DESIGN.md
      - name: Commit design restore
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Restore navigation state isolation rules'
          git push origin HEAD:codex/factory-auction-only
      - name: Run full CI on updated head
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh workflow run ci.yml --ref codex/factory-auction-only
