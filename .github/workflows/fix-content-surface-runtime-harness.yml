name: Fix content surface runtime harness

on:
  push:
    branches:
      - fix/content-surface-runtime-harness-20260902

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.4.0
          cache: npm
      - run: npm ci
      - name: Match runtime harness style stack to production
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/browser/runtime-harness.tsx')
          text = path.read_text(encoding='utf-8')
          line = "import '../../src/styles/scrolling-page-sections.css';"
          if line not in text:
              anchor = "import '../../src/styles/strategic-game-shell.css';"
              if anchor not in text:
                  raise SystemExit('runtime harness style anchor missing')
              text = text.replace(anchor, anchor + '\n' + line, 1)
              path.write_text(text, encoding='utf-8')
          PY
      - name: Verify content surface regression
        run: |
          npm run generate:local-preview
          bash scripts/prepare-playwright-chromium.sh
          npm run test:browser -- tests/browser/content-surface-semantics.spec.ts
          git diff --check
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/browser/runtime-harness.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m '修复正文表面浏览器夹具样式入口'
          git push origin HEAD:${GITHUB_REF_NAME}
