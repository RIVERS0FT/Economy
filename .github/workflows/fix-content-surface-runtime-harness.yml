name: Fix content surface runtime harness

on:
  push:
    branches:
      - fix/content-surface-runtime-harness-20260902

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.4.0
          cache: npm
      - run: npm ci
      - name: Match runtime harness to production player page
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/browser/runtime-harness.tsx')
          text = path.read_text(encoding='utf-8')

          style_line = "import '../../src/styles/scrolling-page-sections.css';"
          if style_line not in text:
              style_anchor = "import '../../src/styles/strategic-game-shell.css';"
              if style_anchor not in text:
                  raise SystemExit('runtime harness style anchor missing')
              text = text.replace(style_anchor, style_anchor + '\n' + style_line, 1)

          old = '  return <AuctionPage model={model} />;\n}\n\nfunction ScrollOwnershipHarness() {'
          new = '''  return (\n    <GameShell model={model}>\n      <AuctionPage model={model} />\n    </GameShell>\n  );\n}\n\nfunction ScrollOwnershipHarness() {'''
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('AuctionHarness return anchor missing')

          path.write_text(text, encoding='utf-8')
          PY
      - name: Verify content surface regression
        env:
          PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: /usr/bin/google-chrome
        run: |
          npm run generate:local-preview
          bash scripts/prepare-playwright-chromium.sh
          npm run test:browser -- tests/browser/content-surface-semantics.spec.ts
          git diff --check
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/browser/runtime-harness.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m '修复正文表面浏览器夹具页面上下文'
          git push origin HEAD:${GITHUB_REF_NAME}
