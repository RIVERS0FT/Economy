name: Fix commercial page verifier

on:
  push:
    branches:
      - feat/commercial-buildings

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/commercial-buildings
          fetch-depth: 0
      - name: Align page verifier with five province sections
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/verify-page-content.mjs')
          text = path.read_text()
          replacements = [
              (
                  "`ProvincePage` 内的市场与建筑分区仍始终是地图所打开当前州的本地视图",
                  "`ProvincePage` 内的市场、商业与工业分区仍始终是地图所打开当前州的本地视图",
              ),
              (
                  "建筑与仓库直接显示本地经营内容",
                  "商业、工业与仓库直接显示本地经营内容",
              ),
              (
                  "概览只展示当前州库存、工厂、运行／异常与经营摘要",
                  "概览始终显示官方常住人口以及该玩家在该州的只读经营摘要",
              ),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'missing expected verifier token: {old}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          Path('.github/workflows/fix-commercial-page-verifier.yml').unlink()
          PY
      - name: Commit verifier alignment
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "test: 对齐商业地区页面验证"
          git push origin HEAD:feat/commercial-buildings
