name: Apply unified reservation docs

on:
  push:
    branches:
      - agent/indexed-runtime-scheduler

permissions:
  contents: write

concurrency:
  group: apply-unified-reservation-docs
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/indexed-runtime-scheduler
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.4.0
          cache: npm
      - name: Update authority documents and guards
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path_name, old, new):
              path = Path(path_name)
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{path_name}: expected one target, found {count}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          def append_once(path_name, marker, addition):
              path = Path(path_name)
              text = path.read_text(encoding='utf-8')
              if marker in text:
                  raise RuntimeError(f'{path_name}: marker already exists')
              path.write_text(text.rstrip() + '\n' + addition.rstrip() + '\n', encoding='utf-8')

          replace_once(
              'docs/WAREHOUSE_EXPANSION_DESIGN.md',
              '> 状态：当前共享仓库容量、买单预占、生产空间与扩容规则基线',
              '> 状态：当前共享仓库容量、订单／拍卖／合同统一预占、生产空间与扩容规则基线',
          )
          replace_once(
              'docs/WAREHOUSE_EXPANSION_DESIGN.md',
              '> 更新时间：2026-07-22',
              '> 更新时间：2026-07-25',
          )
          replace_once(
              'docs/WAREHOUSE_EXPANSION_DESIGN.md',
              '- 商品买单与商品拍卖最高出价预占容量；捆绑拍卖按资产包中全部商品数量之和预占，工厂买单和工厂拍卖不预占仓库。',
              '- 商品买单、商品拍卖最高出价和进行中采购合同的下一批商品预占容量；捆绑拍卖按资产包中全部商品数量之和预占，工厂买单和工厂拍卖不预占仓库。',
          )
          replace_once(
              'docs/WAREHOUSE_EXPANSION_DESIGN.md',
              '''实物库存 = Σ(各商品可用数量 + 冻结数量)
          订单预占 = Σ(当前玩家 open/partial 商品买单剩余数量)
          拍卖预占 = Σ(当前玩家作为最高出价者的进行中单项或捆绑拍卖中全部商品数量之和)
          已用容量 = 实物库存 + 订单预占 + 拍卖预占
          剩余容量 = max(0, 当前容量 - 已用容量)''',
              '''实物库存 = Σ(各商品可用数量 + 冻结数量)
          订单预占 = Σ(当前玩家 open/partial 商品买单剩余数量)
          拍卖预占 = Σ(当前玩家作为最高出价者的进行中单项或捆绑拍卖中全部商品数量之和)
          合同预占 = Σ(当前玩家作为采购方的进行中合同下一批商品数量)
          已用容量 = 实物库存 + 订单预占 + 拍卖预占 + 合同预占
          剩余容量 = max(0, 当前容量 - 已用容量)''',
          )
          replace_once(
              'docs/WAREHOUSE_EXPANSION_DESIGN.md',
              '- 其他玩家订单。',
              '- 其他玩家订单；\n- 尚未承接、已完成、已取消、已终止或已过期的合同，以及当前批次已经转为实物库存的合同商品。',
          )
          replace_once(
              'docs/WAREHOUSE_EXPANSION_DESIGN.md',
              '提交商品买单或成为包含商品的拍卖最高出价者前，服务器必须确认剩余容量可以覆盖新增数量。单项商品拍卖按该商品数量预占；捆绑拍卖按资产包中全部商品数量之和预占。被超价、取消或流拍后立即释放，成交后等量转换为实物库存。',
              '提交商品买单、成为包含商品的拍卖最高出价者或承接采购合同时，服务器必须确认统一剩余容量可以覆盖新增数量。单项商品拍卖按该商品数量预占；捆绑拍卖按资产包中全部商品数量之和预占；进行中合同只预占采购方下一批商品。订单撤销、拍卖被超价／取消／流拍或合同结束后立即释放，成交或合同交付后等量转换为实物库存。',
          )
          replace_once(
              'docs/WAREHOUSE_EXPANSION_DESIGN.md',
              '- 实物库存、买单预占、剩余容量；',
              '- 实物库存、订单／拍卖／合同统一预占、剩余容量；',
          )

          replace_once(
              'docs/SERVER_ARCHITECTURE_AND_DEPLOYMENT_DESIGN.md',
              '正式世界处理先结算到期生产周期，再执行合同自动准备、到期结算和宽限期终止。每批结算在一个事务中同时检查供应方冻结商品、采购方冻结货款和采购方仓库空间，然后原子转移整批商品、扣除整批货款、支付扣费后收入并推进批次。任一条件不足不得部分交付，并进入宽限期；宽限结束后由责任方保证金赔付对方。',
              '正式世界处理先结算到期生产周期，再执行合同自动准备、到期结算和宽限期终止。每批结算在一个事务中同时检查供应方冻结商品、采购方冻结货款和采购方统一仓库空间；仓库空间必须同时计入实物库存、未完成商品买单、最高出价拍卖和其他进行中采购合同的下一批预占，并在检查当前合同时排除该合同自身旧预占后加入本批数量。随后原子转移整批商品、扣除整批货款、支付扣费后收入并推进批次。任一条件不足不得部分交付，并进入宽限期；宽限结束后由责任方保证金赔付对方。',
          )
          replace_once(
              'docs/SERVER_ARCHITECTURE_AND_DEPLOYMENT_DESIGN.md',
              '合同进入或离开 `active` 状态、完成批次、过期、取消或终止时必须同步刷新索引计数；索引不进入世界 JSON、客户端分区、分区哈希或 SQLite，事务回滚后直接丢弃。',
              '合同进入或离开 `active` 状态、完成批次、过期、取消或终止时必须同步刷新索引计数；同一工作世界的合同数组引用、长度和末项未变化时必须复用同一索引，避免仓库、合同与调度查询重复线性构建。索引不进入世界 JSON、客户端分区、分区哈希或 SQLite，事务回滚后直接丢弃。',
          )

          append_once(
              'docs/README.md',
              '49. 共享仓库统一预占',
              '49. 共享仓库统一预占必须同时包含未完成商品买单、当前最高出价拍卖和进行中采购合同的下一批商品；订单、拍卖、合同、生产空间检查和客户端仓库摘要必须调用 `warehouse.js` 的同一口径。合同容量检查必须复用 `contract-runtime-index.js` 并排除当前合同自身旧预占，禁止重新遍历全部合同或遗漏订单／拍卖预占；必须同步 `WAREHOUSE_EXPANSION_DESIGN.md`、`SERVER_ARCHITECTURE_AND_DEPLOYMENT_DESIGN.md`、统一仓库预占测试和 `scripts/verify-warehouse-expansion.mjs`。',
          )
          replace_once(
              'README.md',
              '- 长期生产合作合同只涉及商品与普通货币，不涉及工厂转移、工厂出租、指定工厂实例或对方配方控制。合同按周期冻结供应方商品和采购方货款，到期在服务器事务中原子交付；承接时双方冻结单批货款 20% 的保证金，条件不足进入宽限期，责任方违约后保证金赔付对方。合同交付不写入统一订单簿行情、商品估值或交易榜，但按卖方累计合同货款精确收取 1% 市场服务费。',
              '- 长期生产合作合同只涉及商品与普通货币，不涉及工厂转移、工厂出租、指定工厂实例或对方配方控制。合同按周期冻结供应方商品和采购方货款，采购方下一批商品与未完成商品买单、最高出价拍卖共同使用统一仓库预占，到期在服务器事务中原子交付；承接时双方冻结单批货款 20% 的保证金，条件不足进入宽限期，责任方违约后保证金赔付对方。合同交付不写入统一订单簿行情、商品估值或交易榜，但按卖方累计合同货款精确收取 1% 市场服务费。',
          )

          replace_once(
              'scripts/verify-warehouse-expansion.mjs',
              "  'server/src/warehouse.js',\n  'server/src/facility-groups.js',\n  'server/test/warehouse.test.js',",
              "  'server/src/warehouse.js',\n  'server/src/contract-runtime-index.js',\n  'server/src/contracts.js',\n  'server/src/facility-groups.js',\n  'server/test/warehouse.test.js',\n  'server/test/unified-warehouse-reservations.test.js',",
          )
          replace_once(
              'scripts/verify-warehouse-expansion.mjs',
              "  'export function createWarehouseUsage',\n  'warehouseReservedQuantity: reserved',",
              "  'export function createWarehouseUsage',\n  'createContractRuntimeIndex',\n  'contractRuntimeIndex = null',\n  'runtimeIndex.reservedContractIncomingForBuyer',\n  'warehouseReservedQuantity: reserved',",
          )
          replace_once(
              'scripts/verify-warehouse-expansion.mjs',
              "for (const forbidden of ['warehouseUpgradeCostForLevel']) forbidText('server/test/warehouse.test.js', forbidden);",
              "for (const forbidden of ['warehouseUpgradeCostForLevel']) forbidText('server/test/warehouse.test.js', forbidden);\nrequireText('server/test/unified-warehouse-reservations.test.js', 'warehouse usage combines inventory, buy orders, highest bids, and active contract next batches');\nrequireText('server/test/unified-warehouse-reservations.test.js', 'contract acceptance rejects capacity already reserved by buy orders and highest bids');\nrequireText('server/src/contract-runtime-index.js', 'reservedIncomingForBuyer(userId, exceptContractId = null)');",
          )
          replace_once(
              'scripts/verify-warehouse-expansion.mjs',
              "  '仓库没有玩家可见的最高等级',\n  '容器查询',",
              "  '仓库没有玩家可见的最高等级',\n  '合同预占 = Σ(当前玩家作为采购方的进行中合同下一批商品数量)',\n  '已用容量 = 实物库存 + 订单预占 + 拍卖预占 + 合同预占',\n  '容器查询',",
          )
          replace_once(
              'scripts/verify-warehouse-expansion.mjs',
              "requireText('docs/README.md', '移动和窄容器固定每行四张卡');\nrequireText('README.md', '扩容费用为 `150 + ceil((当前实际总容量 - 500) × 0.6)`');",
              "requireText('docs/README.md', '移动和窄容器固定每行四张卡');\nrequireText('docs/README.md', '共享仓库统一预占必须同时包含未完成商品买单');\nrequireText('README.md', '扩容费用为 `150 + ceil((当前实际总容量 - 500) × 0.6)`');\nrequireText('README.md', '采购方下一批商品与未完成商品买单、最高出价拍卖共同使用统一仓库预占');",
          )

          replace_once(
              'scripts/verify-runtime-efficiency.mjs',
              "requireText('server/src/contract-runtime-index.js', [\n  'createContractRuntimeIndex',",
              "requireText('server/src/contract-runtime-index.js', [\n  'runtimeByWorld',\n  'createContractRuntimeIndex',",
          )
          replace_once(
              'scripts/verify-runtime-efficiency.mjs',
              "  'nextDeadlineAt',\n]);\nrequireText('server/src/contracts.js', [",
              "  'nextDeadlineAt',\n]);\nrequireText('server/src/warehouse.js', [\n  'createContractRuntimeIndex',\n  'runtimeIndex.reservedContractIncomingForBuyer',\n]);\nrequireText('server/src/contracts.js', [",
          )
          replace_once(
              'scripts/verify-runtime-efficiency.mjs',
              "  '正式世界调度只能使用 `world-deadline-planner.js` 计算的单一最早到期 `setTimeout`',",
              "  '正式世界调度只能使用 `world-deadline-planner.js` 计算的单一最早到期 `setTimeout`',\n  '共享仓库统一预占必须同时包含未完成商品买单',",
          )

          Path('.github/workflows/apply-unified-reservation-docs.yml').unlink()
          PY
      - run: npm ci
      - name: Focused verification
        shell: bash
        run: |
          set -euo pipefail
          node --check server/src/contract-runtime-index.js
          node --check server/src/warehouse.js
          node --test server/test/contract-runtime-index.test.js server/test/unified-warehouse-reservations.test.js server/test/world-deadline-planner.test.js
          node scripts/verify-warehouse-expansion.mjs
          node scripts/verify-runtime-efficiency.mjs
      - name: Commit authority updates
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m '记录统一仓库预占权威规则'
          git push origin HEAD:agent/indexed-runtime-scheduler
