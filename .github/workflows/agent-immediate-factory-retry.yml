name: Finalize immediate factory implementation

on:
  push:
    branches:
      - agent/immediate-factory-participation

permissions:
  contents: write

concurrency:
  group: agent-immediate-factory-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/immediate-factory-participation
          fetch-depth: 0

      - name: Normalize source and remove temporary workflows
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('src/pages/production/ProductionFacilityDetail.tsx')
          source = path.read_text()
          before = '''        <div className="facility-production-settings-heading">
          <strong>生产设置</strong>
          <small className="facility-recipe-status">
            配置切换结果会提示“生产进度已清零”，并同步降低满员率。
          </small>
        </div>'''
          badly_indented = '''        <div className="facility-production-settings-heading">
  <strong>生产设置</strong>
  <small className="facility-recipe-status">
    配置切换结果会提示“生产进度已清零”，并同步降低满员率。
  </small>
</div>'''
          if source.count(badly_indented) != 1:
              raise SystemExit(f'expected one badly indented production heading, found {source.count(badly_indented)}')
          path.write_text(source.replace(badly_indented, before))
          PY
          git rm -- \
            .github/workflows/agent-immediate-factory.yml \
            .github/workflows/agent-immediate-factory-retry.yml
          git diff --check
          git config user.name "RIVERS0FT Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -- src/pages/production/ProductionFacilityDetail.tsx
          git status --short
          git commit -m "chore: finalize immediate factory implementation"
          git push origin HEAD:agent/immediate-factory-participation
