name: Apply province public access

on:
  push:
    branches:
      - feat/province-public-overview-market
    paths:
      - .github/workflows/apply-province-public-access.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/province-public-overview-market
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.4.0
          cache: npm

      - name: Apply implementation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/apply-province-public-access.py')
          text = path.read_text(encoding='utf-8')
          old = '''replace_once(
              'scripts/verify-page-content.mjs',
              "  '<EmbeddedMarketPage model={model} embedded />',",
              "  '<EmbeddedMarketPage model={model} embedded readOnly={!isUnlocked} />',",
          )'''.replace('              ', '    ')
          new = '''replace_expected(
              'scripts/verify-page-content.mjs',
              "  '<EmbeddedMarketPage model={model} embedded />',",
              "  '<EmbeddedMarketPage model={model} embedded readOnly={!isUnlocked} />',",
              2,
          )'''.replace('              ', '    ')
          if text.count(old) != 1:
              raise SystemExit(f'expected one verifier patch block, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python3 scripts/apply-province-public-access.py
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              target = Path(path)
              text = target.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"corrective replacement mismatch {path}: expected 1, found {count} for {old[:120]!r}")
              target.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'src/pages/ProvincePage.tsx',
              "  const sectionLabel = section === 'buildings' ? '建筑' : '仓库';\n  return (\n    <PagePanel className=\"province-lock-panel\">\n      <WidgetHeading title={`${sectionLabel}功能未解锁`} action={<StatusTag tone=\"warning\">锁定</StatusTag>} />",
              "  const sectionLabel = section === 'buildings' ? '建筑' : '仓库';\n  const sectionTitle = section === 'buildings' ? '建筑功能未解锁' : '仓库功能未解锁';\n  return (\n    <PagePanel className=\"province-lock-panel\">\n      <WidgetHeading title={sectionTitle} action={<StatusTag tone=\"warning\">锁定</StatusTag>} />",
          )
          replace_once(
              'scripts/verify-page-content.mjs',
              "    'model.setSelectedProvinceId(provinceId);',\n    '<EmbeddedMarketPage model={model} embedded readOnly={!isUnlocked} />',",
              "    'model.setSelectedProvinceId(provinceId);',\n    '<EmbeddedMarketPage model={model} embedded />',",
          )
          replace_once(
              'scripts/verify-provincial-economy.mjs',
              "  'export function ProvincePage', 'title={provinceName}', 'role=\"tablist\"', 'role=\"tab\"', 'role=\"tabpanel\"',",
              "  'export function ProvincePage', 'title={isMarketDetail && marketDetailProduct ? (', 'role=\"tablist\"', 'role=\"tab\"', 'role=\"tabpanel\"',",
          )
          replace_once(
              'scripts/verify-provincial-economy.mjs',
              "  '<EmbeddedMarketPage model={model} embedded />', '<EmbeddedBuildingsPage model={model} embedded />',",
              "  '<EmbeddedMarketPage model={model} embedded readOnly={!isUnlocked} />', '<EmbeddedBuildingsPage model={model} embedded />',",
          )
          replace_once(
              'tests/browser/province-locked-access.spec.ts',
              "  await expect(page.getByText('实时五档 · 只读', { exact: true })).toBeVisible();",
              "  await expect(page.getByText('实时五档 · 只读', { exact: true })).toHaveCount(1);",
          )
          for verifier in ['scripts/verify-market-assets.mjs', 'scripts/verify-market-page-layout-regional.mjs']:
              replace_once(
                  verifier,
                  "onClick={() => fillOrderPrice(level.price)}",
                  "onClick={readOnly ? undefined : () => fillOrderPrice(level.price)}",
              )
          replace_once(
              'scripts/verify-market-page-layout.mjs',
              "requireText('src/pages/ProvincePage.tsx', '<EmbeddedMarketPage model={model} embedded />', '州级上下文必须继续复用地区 MarketPage。');",
              "requireText('src/pages/ProvincePage.tsx', '<EmbeddedMarketPage model={model} embedded readOnly={!isUnlocked} />', '州级上下文必须继续复用地区 MarketPage，并允许锁定州只读查看。');",
          )
          PY
          git diff --check

      - name: Install dependencies
        run: npm ci

      - name: Run targeted static verification
        run: |
          node scripts/verify-page-content.mjs
          npm run verify:provincial-economy
          node --experimental-strip-types scripts/verify-market-assets.mjs
          node scripts/verify-market-page-layout.mjs

      - name: Prepare Chromium
        run: bash scripts/prepare-playwright-chromium.sh

      - name: Run targeted browser verification
        run: npx playwright test tests/browser/province-locked-access.spec.ts

      - name: Run full build
        run: npm run build

      - name: Run full browser suite
        run: npm run test:browser

      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/apply-province-public-access.yml
          rm scripts/apply-province-public-access.py
          git diff --check
          git status --short
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: expose locked province read views'
          git push origin HEAD:feat/province-public-overview-market
