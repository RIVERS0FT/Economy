name: Apply province public access

on:
  push:
    branches:
      - feat/province-public-overview-market
    paths:
      - .github/workflows/apply-province-public-access.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/province-public-overview-market
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.4.0
          cache: npm

      - name: Apply implementation
        run: |
          python3 scripts/apply-province-public-access.py
          git diff --check

      - name: Install dependencies
        run: npm ci

      - name: Run targeted verification
        run: |
          node scripts/verify-page-content.mjs
          npm run verify:provincial-economy
          bash scripts/prepare-playwright-chromium.sh
          npx playwright test tests/browser/province-locked-access.spec.ts

      - name: Run full build
        run: npm run build

      - name: Run full browser suite
        run: npm run test:browser

      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/apply-province-public-access.yml
          rm scripts/apply-province-public-access.py
          git diff --check
          git status --short
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: expose locked province read views'
          git push origin HEAD:feat/province-public-overview-market
