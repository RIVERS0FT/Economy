name: Apply transport design patch

on:
  push:
    branches:
      - transport-client-node-logistics

permissions:
  contents: write

concurrency:
  group: transport-design-patch
  cancel-in-progress: false

jobs:
  patch-docs:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply exact authoritative document edits
        run: node scripts/apply-transport-doc-patch.mjs
      - name: Remove one-shot migration files
        run: |
          rm scripts/apply-transport-doc-patch.mjs
          rm .github/workflows/apply-transport-doc-patch.yml
      - name: Commit authoritative design updates
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/PAGE_CONTENT_AND_NAVIGATION_DESIGN.md docs/SERVER_ARCHITECTURE_AND_DEPLOYMENT_DESIGN.md scripts/apply-transport-doc-patch.mjs .github/workflows/apply-transport-doc-patch.yml
          git diff --cached --check
          git commit -m '更新运输权威设计'
          git push origin HEAD:transport-client-node-logistics
