name: Fix transport test assertions

on:
  push:
    branches:
      - codex/transport-route-cost-style-lock
    paths:
      - scripts/fix-transport-test-assertions.mjs
      - .github/workflows/fix-transport-test-assertions.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/transport-route-cost-style-lock
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.4.0'
      - run: node scripts/fix-transport-test-assertions.mjs
      - run: node --test server/test/transport.test.js
      - run: git diff --check
      - name: Commit assertion fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "修正运输建线费测试断言"
          git push origin HEAD:codex/transport-route-cost-style-lock
