          new_design = '桌面端和移动端订单簿使用同一信息结构，均连续展示卖 5 至卖 1 和买 1 至买 5，不渲染“档位／价格／数量”表头或真实最近成交价“最新”分隔行；桌面端继续隐藏“实时五档 · 点击填价”辅助文案。'
          replace_once('docs/UNIFIED_ASSET_ORDER_BOOK_DESIGN.md', old_design, new_design)

          write_file(
              'scripts/verify-market-desktop-cleanup.mjs',
              '''import fs from 'node:fs';

const main = fs.readFileSync('src/main.tsx', 'utf8');
