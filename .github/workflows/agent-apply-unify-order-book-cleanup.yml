name: Apply unified order-book cleanup

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: agent-unify-mobile-order-book-cleanup
  cancel-in-progress: false

jobs:
  apply-and-verify:
    if: github.head_ref == 'agent/unify-mobile-order-book-cleanup'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: agent/unify-mobile-order-book-cleanup
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.4.0
          cache: npm

      - name: Apply approved order-book cleanup
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}: {old[:120]!r}')
              file.write_text(text.replace(old, new, 1), encoding='utf-8')

          def replace_count(path: str, old: str, new: str, expected: int) -> None:
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected} matches, found {count}: {old[:120]!r}')
              file.write_text(text.replace(old, new), encoding='utf-8')

          def remove_range(path: str, start: str, end: str) -> None:
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              start_count = text.count(start)
              end_count = text.count(end)
              if start_count != 1 or end_count < 1:
                  raise SystemExit(f'{path}: invalid range counts start={start_count} end={end_count}')
              begin = text.index(start)
              finish = text.index(end, begin)
              file.write_text(text[:begin] + text[finish:], encoding='utf-8')

          def regex_replace(path: str, pattern: str, replacement: str, expected: int) -> None:
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              updated, count = re.subn(pattern, replacement, text, flags=re.DOTALL)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected} regex matches, found {count}: {pattern}')
              file.write_text(updated, encoding='utf-8')

          def write_file(path: str, content: str) -> None:
              Path(path).write_text(content, encoding='utf-8')

          replace_once(
              'src/pages/MarketPage.tsx',
              '''                <div className="order-book-columns" aria-hidden="true">
                  <span>档位</span>
                  <span>价格</span>
                  <span>数量</span>
                </div>
''',
              '',
          )
          replace_once(
              'src/pages/MarketPage.tsx',
              '''                  <div className="order-book-midpoint" aria-label={`最近成交价 ${typeof selectedLastTradePrice === 'number' ? formatCurrency(selectedLastTradePrice) : '暂无成交'}`}>
                    <span>最新</span>
                    <strong><CurrencyAmount>{typeof selectedLastTradePrice === 'number' ? formatCurrency(selectedLastTradePrice) : '—'}</CurrencyAmount></strong>
                  </div>
''',
              '',
          )

          style_path = 'src/styles/market-page-polish.css'
          remove_range(style_path, '.order-book-columns {\n', '.market-trade-book .order-book-stack {')
          remove_range(style_path, '.order-book-midpoint {\n', '.order-book-empty {')
          replace_count(
              style_path,
              '''  .order-book-columns,
  .market-trade-book .book-order-row {''',
              '''  .market-trade-book .book-order-row {''',
              2,
          )
          replace_count(
              style_path,
              '''  .market-book-price-button,
  .order-book-midpoint {''',
              '''  .market-book-price-button {''',
              2,
          )
          replace_once(
              style_path,
              '''  .market-book-price-button strong,
  .order-book-midpoint strong {''',
              '''  .market-book-price-button strong {''',
          )
          regex_replace(style_path, r'\n  \.order-book-columns \{\n.*?\n  \}\n', '\n', 1)
          regex_replace(style_path, r'\n  \.order-book-midpoint(?: strong)? \{\n.*?\n  \}\n', '\n', 4)

          write_file(
              'src/styles/market-desktop-cleanup.css',
              '''/* Desktop-only market card cleanup.
 * Order-book rows now use the same structure on desktop and mobile. */
@media (min-width: 721px) {
  .market-page-surface .market-account-view-switch,
  .market-page-surface .market-trade-section-heading small {
    display: none !important;
  }
}
''',
          )

