              "requireText(marketDesign, '不大于 `720px` 的移动端始终同时显示下单区和五档盘口', '权威设计必须记录移动端永久双列规则。');\nrequireText(marketDesign, '桌面端和移动端订单簿使用同一信息结构', '权威设计必须记录全端统一盘口结构。');\nrequireText(marketDesign, '不渲染“档位／价格／数量”表头或真实最近成交价“最新”分隔行', '权威设计必须记录重复信息永久移除。');",
          )
          replace_once(
              'scripts/verify-market-page-layout.mjs',
              "requireText(runtimeSpec, \"name: '盘口', exact: true })).toHaveCount(0)\", 'Playwright 必须验证移动端不再存在下单／盘口切换。');",
              "requireText(runtimeSpec, \"name: '盘口', exact: true })).toHaveCount(0)\", 'Playwright 必须验证移动端不再存在下单／盘口切换。');\nrequireText(runtimeSpec, \"locator('.order-book-columns')).toHaveCount(0)\", 'Playwright 必须验证全端不渲染订单簿表头。');\nrequireText(runtimeSpec, \"locator('.order-book-midpoint')).toHaveCount(0)\", 'Playwright 必须验证全端不渲染最新价分隔。');",
          )

          replace_once(
              'scripts/verify-market-order-entry-compact.mjs',
              "  '盘口保留不小于 112px 的可读宽度',",
              "  '盘口保留不小于 112px 的可读宽度',\n  '桌面端和移动端订单簿使用同一信息结构',\n  '不渲染“档位／价格／数量”表头或真实最近成交价“最新”分隔行',",
          )
          replace_once(
              'scripts/verify-market-order-entry-compact.mjs',
              "forbidText(pagePath, 'market-compact-view-switch');",
