name: Finalize order prune spin fix

on:
  push:
    branches:
      - fix/initial-state-timeout

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.head_commit.message == '完成订单清理调度防自旋修复'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/initial-state-timeout
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24.4.0
          cache: npm

      - name: Apply final documentation and guardrails
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('server/test/world-deadline-planner.test.js')
          text = path.read_text()
          old = """    const before = store.getSchedulerDiagnostics();
              assert.ok(before.nextDueAt > clock.now);
              clock.advance(Math.min(60_000, Math.max(0, before.nextDueAt - clock.now - 1)));
          """
          new = """    const before = store.getSchedulerDiagnostics();
              assert.ok(before.nextDueAt - clock.now > 60_000);
              clock.advance(60_000);
          """
          if old not in text:
              raise SystemExit('scheduler regression patch anchor missing')
          path.write_text(text.replace(old, new, 1))

          path = Path('scripts/verify-runtime-efficiency.mjs')
          text = path.read_text()
          old = """  'createContractRuntimeIndex(world).nextDeadlineAt()',
            'createdAt + DAY_MS + 1',
          ]);
          """
          new = """  'createContractRuntimeIndex(world).nextDeadlineAt()',
            'createdAt + DAY_MS + 1',
            'MAX_RECENT_CLOSED_ORDERS = 800',
            'closedOrderCount += 1',
            'if (closedOrderCount > MAX_RECENT_CLOSED_ORDERS) return now;',
          ]);
          assert.equal(
            read('server/src/world-deadline-planner.js').includes('(world.orders || []).length > 4_000'),
            false,
            '开放订单数量不得触发历史订单清理截止时间',
          );
          """
          if old not in text:
              raise SystemExit('runtime verifier planner anchor missing')
          text = text.replace(old, new, 1)
          anchor = """requireText('server/src/domain.js', [
            'if (retainedOrders.length !== migratedOrders.length) migrated.orders = retainedOrders;',
          ]);
          """
          addition = anchor + """requireText('server/test/world-deadline-planner.test.js', [
            'order pruning deadline ignores production-scale open order volume',
            'order pruning deadline runs immediately only when retained closed history exceeds its cap',
            'deadline scheduler does not spin when non-pruneable open orders exceed the historical cap',
            'assert.ok(before.nextDueAt - clock.now > 60_000)',
            'assert.equal(world.orders.length, 13_812)',
          ]);
          """
          if anchor not in text:
              raise SystemExit('runtime verifier test anchor missing')
          text = text.replace(anchor, addition, 1)
          path.write_text(text)

          path = Path('docs/SERVER_ARCHITECTURE_AND_DEPLOYMENT_DESIGN.md')
          text = path.read_text()
          anchor = """正式服务的到期世界推进仍由单一权威调度器负责。若普通玩家写入到达时全局最早截止时间已经到期，`runtime-store.js` 必须先建立一个可复用的系统调度 barrier，在同一权威写执行器中先完成一次到期世界处理，再放行随后到达的玩家写入；同一到期窗口不得由多个玩家请求重复承担全服推进。系统调度任务不继承玩家 HTTP 请求的性能采集上下文，玩家请求只记录等待 barrier 的 `schedulerBarrierWaitMs`，不得把系统 `worldProcessMs` 伪装成该玩家动作自身处理阶段。非正式调度的内存测试存储仍可在请求内按到期领域推进，以保持确定性测试。
          """
          addition = anchor + """
订单历史清理截止时间只能由**可清理的关闭订单历史**触发：超过 800 条近期关闭历史时允许立即清理，未超过上限时按最早关闭订单的 24 小时保留期安排下一次清理。开放或部分成交订单属于不可清理权威状态，无论其数量达到数千或更多，都不得计入历史容量阈值、不得把 `orderPrune` 永久登记为 `now`。原因是生产环境可以合法长期保留大量开放订单；若用 `world.orders.length` 触发清理，而实际清理又必须保留这些订单，调度器会在每次无变化处理后继续判定同一领域立即到期，形成无业务变化的高 CPU 调度自旋并饿死 HTTP 事件循环。生产规模回归必须覆盖至少 13,000 条开放订单加 800 条近期关闭历史，并证明一分钟空闲窗口内不会产生清理事务或删除开放订单。
          """
          if anchor not in text:
              raise SystemExit('server design scheduler anchor missing')
          path.write_text(text.replace(anchor, addition, 1))
          PY

          rm -f .github/workflows/diagnose-production-state-timeout.yml
          rm -f .github/workflows/finalize-order-prune-spin-fix.yml

          npm ci
          node --test server/test/world-deadline-planner.test.js server/test/order-book-pruning.test.js
          node scripts/verify-runtime-efficiency.mjs
          git diff --check

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add server/src/world-deadline-planner.js server/test/world-deadline-planner.test.js scripts/verify-runtime-efficiency.mjs docs/SERVER_ARCHITECTURE_AND_DEPLOYMENT_DESIGN.md .github/workflows
          git commit -m '修复大量开放订单导致的调度自旋'
          git push origin HEAD:fix/initial-state-timeout
