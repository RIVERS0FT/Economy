name: Patch Contract Verifiers

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

env:
  TARGET_BRANCH: ${{ github.event.pull_request.head.ref }}

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
      - name: Patch provincial verifier
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/verify-provincial-economy.mjs')
          text = p.read_text()
          old = "  'groupFor(lender, contract.facilityTypeId, contract.provinceId, true, now)',"
          new = "  'const reserveKey = provinceScopedKey(contract.provinceId, contract.facilityTypeId);',\n  'bank.facilityReserves[reserveKey]',\n  'reduceGroupForBankCollection(borrowerGroup',"
          if new not in text:
              if old not in text or text.count(old) != 1:
                  raise SystemExit('expected legacy lender-factory verifier not found exactly once')
              p.write_text(text.replace(old, new))
          PY
      - name: Commit when needed
        shell: bash
        run: |
          if git diff --quiet -- scripts/verify-provincial-economy.mjs; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/verify-provincial-economy.mjs
          git commit -m "test: update provincial player-loan settlement boundary"
          git push origin HEAD:${TARGET_BRANCH}
