name: Fix market patch order
on:
  push:
    branches: [fix/market-six-column-headers]
    paths: [.github/workflows/fix-market-patch-order.yml]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/market-six-column-headers
      - shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/patch-market-six-columns.yml')
          text = p.read_text()
          old = "              ('24h 成交量、24h 价格变化和平均价格', '卖单量、买单量、24h 成交量、市场价和 24h 价格变化'),\n              ('一级商品目录表头允许按商品名称、24h 成交量、24h 价格变化和平均价格进行', '一级商品目录表头允许按商品名称、卖单量、买单量、24h 成交量、市场价和 24h 价格变化进行'),"
          new = "              ('一级商品目录表头允许按商品名称、24h 成交量、24h 价格变化和平均价格进行', '一级商品目录表头允许按商品名称、卖单量、买单量、24h 成交量、市场价和 24h 价格变化进行'),\n              ('24h 成交量、24h 价格变化和平均价格', '卖单量、买单量、24h 成交量、市场价和 24h 价格变化'),"
          if text.count(old) != 1:
              raise SystemExit(f'expected one docs loop match, got {text.count(old)}')
          p.write_text(text.replace(old, new, 1))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/patch-market-six-columns.yml
          git commit -m "修正市场表头补丁替换顺序"
          git push
