name: Regenerate local preview temp

on:
  push:
    branches:
      - fix/player-avatar-leaderboard

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.4.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Regenerate tracked preview fixture
        run: npm run generate:local-preview

      - name: Commit generated fixture
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- src/dev/generated/local-game-preview-state.json; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/dev/generated/local-game-preview-state.json
          git commit -m "更新本地游戏预览快照"
          git push origin HEAD:fix/player-avatar-leaderboard
