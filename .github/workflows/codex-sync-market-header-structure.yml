name: Codex sync market header structure

on:
  push:
    branches:
      - codex/unify-market-headers-chevrons

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/unify-market-headers-chevrons
          fetch-depth: 0
      - name: Split shared market header from data rows
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 occurrence, found {count}')
              file.write_text(text.replace(old, new, 1))

          row = Path('src/components/market/MarketCommodityRow.tsx')
          row_text = row.read_text()
          marker = '''export function MarketCommodityRow({\n'''
          header = '''export function MarketCommodityHeader() {\n  return (\n    <div className="market-commodity-row-header">\n      <span>商品</span>\n      <span>卖单量</span>\n      <span>买单量</span>\n      <span>市场价</span>\n      <span>24h</span>\n      <span />\n    </div>\n  );\n}\n\n'''
          if row_text.count(marker) != 1:
              raise SystemExit('MarketCommodityRow export marker not found exactly once')
          row_text = row_text.replace(marker, header + marker, 1)
          old_return = '''  return (\n    <>\n      <div className="market-commodity-row-header">\n        <span>商品</span>\n        <span>卖单量</span>\n        <span>买单量</span>\n        <span>市场价</span>\n        <span>24h</span>\n        <span />\n      </div>\n      <button\n'''
          new_return = '''  return (\n    <button\n'''
          if row_text.count(old_return) != 1:
              raise SystemExit('MarketCommodityRow embedded header block not found exactly once')
          row_text = row_text.replace(old_return, new_return, 1)
          old_tail = '''        </span>\n      </button>\n    </>\n  );\n}\n'''
          new_tail = '''        </span>\n    </button>\n  );\n}\n'''
          if row_text.count(old_tail) != 1:
              raise SystemExit('MarketCommodityRow fragment tail not found exactly once')
          row.write_text(row_text.replace(old_tail, new_tail, 1))

          replace_once(
              'src/pages/MarketPage.tsx',
              "import { MarketCommodityRow } from '../components/market/MarketCommodityRow';",
              "import { MarketCommodityHeader, MarketCommodityRow } from '../components/market/MarketCommodityRow';",
              'MarketPage import',
          )
          replace_once(
              'src/pages/MarketPage.tsx',
              '''        </details>\n        <ul className="market-catalog-list" aria-label="商品市场列表">''',
              '''        </details>\n        <MarketCommodityHeader />\n        <ul className="market-catalog-list" aria-label="商品市场列表">''',
              'MarketPage header placement',
          )

          replace_once(
              'src/pages/GlobalMarketPage.tsx',
              "import { MarketCommodityRow } from '../components/market/MarketCommodityRow';",
              "import { MarketCommodityHeader, MarketCommodityRow } from '../components/market/MarketCommodityRow';",
              'GlobalMarketPage import',
          )
          replace_once(
              'src/pages/GlobalMarketPage.tsx',
              '''            </details>\n            <ul className="global-market-product-region-list" aria-label={`${selectedGlobalProduct.name}各地区行情`}>''',
              '''            </details>\n            <MarketCommodityHeader />\n            <ul className="global-market-product-region-list" aria-label={`${selectedGlobalProduct.name}各地区行情`}>''',
              'GlobalMarketPage regional header placement',
          )

          css = Path('src/styles/market-commodity-row.css')
          css_text = css.read_text()
          css_text = css_text.replace('''  display: none;\n  grid-template-columns:''', '''  display: grid;\n  grid-template-columns:''', 1)
          old_css = '''\n.market-catalog-list > li:first-child > .market-commodity-row-header,\n.global-market-product-region-list > li:first-child > .market-commodity-row-header {\n  display: grid;\n}\n'''
          if old_css not in css_text:
              raise SystemExit('first-row-only market header CSS not found')
          css.write_text(css_text.replace(old_css, '\n', 1))

          replace_once(
              'tests/browser/market-information-hierarchy.spec.ts',
              "const regionalHeader = page.locator('.global-market-product-region-list .market-commodity-row-header').first();",
              "const regionalHeader = page.locator('.global-market-product-detail-panel > .market-commodity-row-header');",
              'market hierarchy browser header selector',
          )
          replace_once(
              'tests/browser/market-information-hierarchy.spec.ts',
              '''  await expect(regionalHeader).toBeVisible();\n  for (const label of ['商品', '卖单量', '买单量', '市场价', '24h']) {''',
              '''  await expect(regionalHeader).toBeVisible();\n  await expect(page.locator('.global-market-product-region-list .market-commodity-row-header')).toHaveCount(0);\n  for (const label of ['商品', '卖单量', '买单量', '市场价', '24h']) {''',
              'market hierarchy browser pure rows assertion',
          )

          layout = Path('scripts/verify-market-page-layout.mjs')
          layout_text = layout.read_text()
          layout_text = layout_text.replace("  '<WidgetHeading title=\"商品\"',\n", "  'global-market-goods-header',\n  '<MarketCommodityHeader />',\n", 1)
          layout_text = layout_text.replace("  'global-market-province-row',\n", "  '<WidgetHeading title=\"商品\"',\n  'global-market-province-row',\n", 1)
          layout_text = layout_text.replace(
              "if (!catalogSource.includes('<MarketCommodityRow')) failures.push('地区 MarketPage 必须复用共享商品数据行。');",
              "if (!catalogSource.includes('<MarketCommodityHeader />')) failures.push('地区 MarketPage 商品目录必须在列表顶部复用共享独立表头。');\nif (!catalogSource.includes('<MarketCommodityRow')) failures.push('地区 MarketPage 必须复用共享商品数据行。');",
              1,
          )
          layout_text = layout_text.replace(
              "for (const path of [\n  'src/pages/GlobalMarketPage.tsx',",
              "for (const path of [\n  'src/pages/GlobalMarketPage.tsx',",
              1,
          )
          layout.write_text(layout_text)

          hierarchy = Path('scripts/verify-market-information-hierarchy.mjs')
          h = hierarchy.read_text()
          h = h.replace("  '<MarketCommodityRow',\n  '<ChevronIcon direction=\"right\" />',", "  '<MarketCommodityHeader />',\n  '<MarketCommodityRow',\n  '<ChevronIcon direction=\"right\" />',", 1)
          h = h.replace(
              "const productRegionListIndex = globalMarket.indexOf('<ul className=\"global-market-product-region-list\"');\nif (productPanelIndex < 0 || productRegionListIndex <= productPanelIndex) {\n  throw new Error('global market hierarchy: product global detail must own the regional quote list');\n}",
              "const productRegionHeaderIndex = globalMarket.indexOf('<MarketCommodityHeader />', productPanelIndex);\nconst productRegionListIndex = globalMarket.indexOf('<ul className=\"global-market-product-region-list\"');\nif (\n  productPanelIndex < 0\n  || productRegionHeaderIndex <= productPanelIndex\n  || productRegionListIndex <= productRegionHeaderIndex\n) {\n  throw new Error('global market hierarchy: product global detail must render one shared header before the regional quote list');\n}",
              1,
          )
          h = h.replace("  'market-commodity-row-header',\n  '<span>商品</span>',", "  'export function MarketCommodityHeader',\n  'market-commodity-row-header',\n  '<span>商品</span>',", 1)
          h = h.replace(
              "for (const token of ['挂单差额', '基准偏离', '挂单状态', '>›<']) forbidText(commodityRow, token, 'shared commodity row');",
              "for (const token of ['挂单差额', '基准偏离', '挂单状态', '>›<']) forbidText(commodityRow, token, 'shared commodity row');\nconst commodityDataRowSource = commodityRow.slice(commodityRow.indexOf('export function MarketCommodityRow'));\nforbidText(commodityDataRowSource, 'market-commodity-row-header', 'shared commodity data row');",
              1,
          )
          h = h.replace("  '.market-commodity-row-header',\n  'repeat(4, minmax(4.1rem, .68fr))',", "  '.market-commodity-row-header',\n  'display: grid;',\n  'repeat(4, minmax(4.1rem, .68fr))',", 1)
          h = h.replace("forbidText(commodityCss, \"content: '⌄';\", 'shared commodity row css');", "forbidText(commodityCss, '.market-catalog-list > li:first-child > .market-commodity-row-header', 'shared commodity header css');\nforbidText(commodityCss, \"content: '⌄';\", 'shared commodity row css');", 1)
          h = h.replace("for (const token of ['market-catalog-filter-disclosure', '<MarketCommodityRow'])", "for (const token of ['market-catalog-filter-disclosure', '<MarketCommodityHeader />', '<MarketCommodityRow'])", 1)
          h = h.replace(
              '"page.locator(\'.global-market-product-region-list .market-commodity-row-header\').first()",',
              '"page.locator(\'.global-market-product-detail-panel > .market-commodity-row-header\')",\n  "page.locator(\'.global-market-product-region-list .market-commodity-row-header\')",',
              1,
          )
          hierarchy.write_text(h)

          base = Path('scripts/verify-market-page-layout-base.mjs')
          b = base.read_text()
          b = b.replace("requireText(marketPage, '<MarketCommodityRow', '地区商品目录必须复用共享商品数据行。');", "requireText(marketPage, '<MarketCommodityHeader />', '地区商品目录必须在列表顶部复用共享独立表头。');\nrequireText(marketPage, '<MarketCommodityRow', '地区商品目录必须复用共享商品数据行。');", 1)
          b = b.replace("for (const token of ['卖单量', '买单量', '市场价', '24h']) requireText(commodityRow, token, `共享商品数据行必须显示 ${token}。`);", "requireText(commodityRow, 'export function MarketCommodityHeader', '共享商品列表必须导出独立表头。');\nconst commodityDataRowSource = commodityRow.slice(commodityRow.indexOf('export function MarketCommodityRow'));\nforbidText(commodityDataRowSource, 'market-commodity-row-header', '共享商品数据行不得重复渲染列标题。');\nfor (const token of ['卖单量', '买单量', '市场价', '24h']) requireText(commodityRow, token, `共享商品表头必须显示 ${token}。`);", 1)
          b = b.replace("requireText(commodityRowStyles, 'grid-template-columns: minmax(8rem, 1.45fr) repeat(4, minmax(4.1rem, .68fr)) .8rem;', '共享商品数据行必须保持身份、四项指标和箭头的单行布局。');", "requireText(commodityRowStyles, 'display: grid;', '共享商品独立表头必须直接显示，不得依赖首行内隐藏副本。');\nforbidText(commodityRowStyles, '.market-catalog-list > li:first-child > .market-commodity-row-header', '共享商品表头不得重新塞回首条数据行。');\nrequireText(commodityRowStyles, 'grid-template-columns: minmax(8rem, 1.45fr) repeat(4, minmax(4.1rem, .68fr)) .8rem;', '共享商品数据行必须保持身份、四项指标和箭头的单行布局。');", 1)
          base.write_text(b)
          PY
      - name: Validate focused static checks
        run: |
          node scripts/verify-market-information-hierarchy.mjs
          node scripts/verify-market-page-layout.mjs
          node scripts/verify-market-page-layout-base.mjs
          git diff --check
      - name: Commit market header structure
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/components/market/MarketCommodityRow.tsx src/pages/MarketPage.tsx src/pages/GlobalMarketPage.tsx src/styles/market-commodity-row.css tests/browser/market-information-hierarchy.spec.ts scripts/verify-market-information-hierarchy.mjs scripts/verify-market-page-layout.mjs scripts/verify-market-page-layout-base.mjs
          git commit -m "修正市场独立表头结构"
          git push origin HEAD:codex/unify-market-headers-chevrons
