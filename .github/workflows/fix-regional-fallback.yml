name: Verify explicit regional back action
on:
  push:
    branches: [codex/regional-building-tabs-fixup]
    paths: [.github/workflows/fix-regional-fallback.yml]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/regional-building-tabs-fixup
      - uses: actions/setup-node@v4
        with:
          node-version: 24.4.0
          cache: npm
      - name: Fix shared fallback and retain normal navigation behavior
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/components/ui/layout.tsx')
          s = p.read_text()
          s = s.replace('  const pageNavigation = usePlayerPageNavigation();', '  const pageNavigation = usePlayerPageNavigation();\n  const showBackButton = Boolean(pageNavigation || backAction);')
          s = s.replace("classNames('page-heading', pageNavigation && 'page-heading--player-navigation')", "classNames('page-heading', showBackButton && 'page-heading--player-navigation')")
          s = s.replace('          {pageNavigation ? (\n            <Button', '          {showBackButton ? (\n            <Button', 1)
          s = s.replace('disabled={!backAction && !pageNavigation.canGoBack}', 'disabled={!backAction && !pageNavigation?.canGoBack}')
          s = s.replace('onClick={backAction?.onClick ?? pageNavigation.onBack}', 'onClick={backAction?.onClick ?? pageNavigation?.onBack}')
          p.write_text(s)
          p = Path('docs/UI_DESIGN_SYSTEM.md')
          p.write_text(p.read_text() + '\n`PageLayout` 的显式 `backAction` 不依赖页面栈上下文：无页面栈时仍使用共享标题轨道显示可访问的返回按钮，并只调用传入回调；只有存在页面栈时才显示关闭至地图按钮。两者都不存在时不制造无意义的返回按钮。地区商业／工业的无页面栈回退使用该公共能力，不新增页面私有返回控件。\n')
          p = Path('tests/browser/regional-building-tabs.spec.ts')
          s = p.read_text()
          start = s.index("test('without a page stack")
          end = s.index("test('missing commercial catalog", start)
          chunk = s[start:end].replace("    await page.locator('.page-navigation-button--back').click();", "    await expect(page.locator('.page-navigation-button--close')).toHaveCount(0);\n    await page.getByRole('button', { name: `返回${name}建筑列表`, exact: true }).click();")
          p.write_text(s[:start] + chunk + s[end:])
          p = Path('scripts/select-ci-tests.mjs')
          s = p.read_text()
          a = s.index('  // A deleted or moved test')
          b = s.index('  const fullTrigger =', a)
          s = s[:a] + '\n'.join([
            '  // A deleted or moved test cannot be executed by its old path. Validate the',
            '  // entire remaining suite rather than silently dropping its coverage.',
            '  const removedTest = executableChanges.find((path) => (',
            '    (isDtTest(path) || isServerTest(path) || isBrowserSpec(path))',
            '    && !existsSync(resolve(root, path))',
            '  ));',
            '  if (removedTest) {',
            "    plan.mode = 'full';",
            '    plan.reasons.push(`removed-test:${removedTest}`);',
            '    plan.needsDependencies = true;',
            "    plan.browser = { mode: 'all', tests: [] };",
            '    return plan;',
            '  }', '', '',
          ]) + s[b:]
          p.write_text(s)
          Path('.github/workflows/fix-regional-fallback.yml').unlink()
          PY
          git add -A
          node scripts/normalize-repository-text.mjs
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: render shared back action without a player page stack'
          git push origin HEAD:codex/regional-building-tabs-fixup
      - run: npm ci
      - run: bash scripts/prepare-playwright-chromium.sh
      - name: Reproduce and verify the failed fallback case
        run: npm run test:browser -- tests/browser/regional-building-tabs.spec.ts --grep 'without a page stack'
