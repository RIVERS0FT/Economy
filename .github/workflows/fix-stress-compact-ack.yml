name: Fix stress compact acknowledgement

on:
  push:
    branches:
      - codex/daily-market-freeze-timeout-fix
    paths:
      - .github/workflows/fix-stress-compact-ack.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Teach stress runner the documented compact trade acknowledgement
        run: |
          python3 - <<'PY'
          from pathlib import Path

          runner = Path('tests/stress/run.mjs')
          text = runner.read_text(encoding='utf-8')
          accept_block = """function acceptDelivery(client, payload, label) {\n  assert.ok(Number.isInteger(payload.revision) && payload.revision >= 0, `${label} 缺少有效修订号`);\n  assert.ok(Number.isFinite(payload.serverNow) && payload.serverNow >= 0, `${label} 缺少 serverNow`);\n  if (client.revision !== null) assert.ok(payload.revision >= client.revision, `${label} 修订号发生倒退`);\n  if (client.serverNow !== null) assert.ok(payload.serverNow >= client.serverNow, `${label} serverNow 发生倒退`);\n  if (!payload.unchanged) {\n    assert.ok(payload.patches && typeof payload.patches === 'object', `${label} 变化交付缺少分区正文`);\n  }\n  if (payload.partitionRevisions && typeof payload.partitionRevisions === 'object') {\n    for (const name of STATE_PARTITIONS) {\n      const revision = payload.partitionRevisions[name];\n      if (revision) client.partitionRevisions[name] = revision;\n    }\n  }\n  rebuildClientState(client, payload);\n  client.revision = payload.revision;\n  client.serverNow = payload.serverNow;\n}\n"""
          if accept_block not in text:
              raise SystemExit('acceptDelivery block not found')
          compact_helper = accept_block + """\nfunction acceptCompactActionConfirmation(client, payload, label) {\n  assert.ok(Number.isInteger(payload.revision) && payload.revision >= 0, `${label} 缺少有效修订号`);\n  assert.ok(Number.isFinite(payload.serverNow) && payload.serverNow >= 0, `${label} 缺少 serverNow`);\n  if (client.revision !== null) assert.ok(payload.revision >= client.revision, `${label} 修订号发生倒退`);\n  if (client.serverNow !== null) assert.ok(payload.serverNow >= client.serverNow, `${label} serverNow 发生倒退`);\n  assert.equal(payload.unchanged, undefined, `${label} 不得伪装成状态交付`);\n  assert.equal(payload.patches, undefined, `${label} 不得携带提交后全状态分区`);\n  // Do not advance client.revision here. The client intentionally keeps its last\n  // accepted state revision so the following GET /state returns changed partitions.\n  client.serverNow = payload.serverNow;\n}\n"""
          text = text.replace(accept_block, compact_helper, 1)

          old = """  assert.ok(Number(payload.revision) >= Number(payload.commandRevision), `${route} 权威交付落后于命令提交`);\n  acceptDelivery(client, payload, `${route} 动作响应`);\n  return payload;\n}\n"""
          new = """  assert.ok(Number(payload.revision) >= Number(payload.commandRevision), `${route} 权威交付落后于命令提交`);\n  const compactManualCommodityOrder = route === '/api/game/orders'\n    && body?.assetKind === 'commodity'\n    && !body?.execution;\n  if (compactManualCommodityOrder) {\n    assert.equal(payload.revision, payload.commandRevision, `${route} 精简确认修订号不一致`);\n    acceptCompactActionConfirmation(client, payload, `${route} 精简动作确认`);\n  } else {\n    acceptDelivery(client, payload, `${route} 动作响应`);\n  }\n  return payload;\n}\n"""
          if old not in text:
              raise SystemExit('postAction delivery block not found')
          runner.write_text(text.replace(old, new, 1), encoding='utf-8')

          verifier = Path('scripts/verify-stress-test-flow.mjs')
          text = verifier.read_text(encoding='utf-8')
          anchor = "  'acceptDelivery(client, payload',\n"
          addition = anchor + "  'acceptCompactActionConfirmation',\n  \"route === '/api/game/orders'\",\n  \"body?.assetKind === 'commodity'\",\n  '!body?.execution',\n  'Do not advance client.revision here',\n"
          if anchor not in text:
              raise SystemExit('stress verifier acceptDelivery guard not found')
          verifier.write_text(text.replace(anchor, addition, 1), encoding='utf-8')
          PY
      - name: Remove temporary workflow
        run: rm -f .github/workflows/fix-stress-compact-ack.yml
      - name: Check diff
        run: git diff --check
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "适配即时交易精简确认压力回归"
          git push origin HEAD:codex/daily-market-freeze-timeout-fix
