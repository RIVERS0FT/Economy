name: Integrate infinite warehouse latest main

on:
  push:
    branches: [codex/infinite-warehouse-latest-main]
    paths: [.github/workflows/integrate-infinite-warehouse-latest-main.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/infinite-warehouse-latest-main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.4.0
          cache: npm
      - name: Apply and resolve verified warehouse commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+RIVERS0FT@users.noreply.github.com'
          set +e
          git cherry-pick --no-commit 3c127d231e641317725d052c983e5a9acfba3607
          set -e
          python - <<'PY'
          from pathlib import Path
          import re

          doc_headers = {
              'docs/GIFT_CODE_AND_ADMIN_DESIGN.md': '> 更新时间：2026-08-10\n> 客户端状态版本：31\n',
              'docs/PAGE_CONTENT_AND_NAVIGATION_DESIGN.md': '> 更新时间：2026-08-10\n> 客户端状态版本：31\n',
              'docs/SERVER_ARCHITECTURE_AND_DEPLOYMENT_DESIGN.md': '> 更新时间：2026-08-10\n> 客户端状态版本：31\n',
          }
          for file_name, header in doc_headers.items():
              path = Path(file_name)
              source = path.read_text()
              source, count = re.subn(
                  r'<<<<<<< HEAD\n> 更新时间：[^\n]+\n> 客户端状态版本：\d+\n=======\n> 更新时间：[^\n]+\n> 客户端状态版本：\d+\n>>>>>>>[^\n]*\n',
                  header,
                  source,
                  count=1,
              )
              if count != 1:
                  raise SystemExit(f'{file_name}: header conflict replacement count={count}')
              path.write_text(source)

          runtime_path = Path('server/src/contract-runtime-index.js')
          runtime = runtime_path.read_text()
          runtime, count = re.subn(
              r'<<<<<<< HEAD\nfunction currentReservationQuantity\(snapshot\) \{.*?>>>>>>>[^\n]*\n(?=function deadlineFor)',
              '',
              runtime,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f'contract runtime reservation conflict replacement count={count}')
          runtime_path.write_text(runtime)

          for file_name in [*doc_headers, 'server/src/contract-runtime-index.js']:
              source = Path(file_name).read_text()
              if any(marker in source for marker in ('<<<<<<<', '=======', '>>>>>>>')):
                  raise SystemExit(f'unresolved marker remains in {file_name}')
          PY
          git add -- \
            docs/GIFT_CODE_AND_ADMIN_DESIGN.md \
            docs/PAGE_CONTENT_AND_NAVIGATION_DESIGN.md \
            docs/SERVER_ARCHITECTURE_AND_DEPLOYMENT_DESIGN.md \
            server/src/contract-runtime-index.js
          test -z "$(git diff --name-only --diff-filter=U)"
          git diff --check
          grep -q 'breachedAt' server/src/contract-runtime-index.js
          ! grep -q 'reservedIncomingForBuyer\|reservedContractIncomingForBuyer\|currentReservationQuantity\|renewalReservationQuantity' server/src/contract-runtime-index.js
          grep -q 'breachedAt' server/src/contracts.js
          ! grep -q 'warehouseAvailableCapacity\|warehouseReservedQuantity\|warehouse_full' server/src/contracts.js
      - run: npm ci
      - name: Contract and warehouse integration tests
        shell: bash
        run: |
          node scripts/verify-warehouse-expansion.mjs
          node scripts/verify-runtime-efficiency.mjs
          node scripts/verify-contract-types.mjs
          node scripts/verify-contract-audit.mjs
          node --test \
            server/test/contract-runtime-index.test.js \
            server/test/contracts.test.js \
            server/test/commercial-contracts.test.js \
            server/test/warehouse.test.js \
            server/test/instant-facility-construction.test.js
      - name: Full build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser regression
        run: npm run test:browser
      - name: Commit latest-main integration
        shell: bash
        run: |
          git rm -- .github/workflows/integrate-infinite-warehouse-latest-main.yml
          git diff --cached --check
          test -z "$(git diff --name-only --diff-filter=U)"
          git status --short
          git commit -m 'Implement infinite shared warehouse'
          git push origin HEAD:codex/infinite-warehouse-latest-main
