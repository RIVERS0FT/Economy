name: Apply ECharts migration

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: apply-echarts-migration
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/echarts-migration
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.4.0
          cache: npm
      - name: Reassemble and verify migration patch
        shell: bash
        run: |
          set -euo pipefail
          cat .agent/echarts-patch/part-* > /tmp/echarts-migration.patch.gz.b64
          echo "daba72dfd2fc04024b73a0bd0c960b05fd31b7ab79f4cf2c0c46e1b20d391c26  /tmp/echarts-migration.patch.gz.b64" | sha256sum -c -
          base64 --decode /tmp/echarts-migration.patch.gz.b64 > /tmp/echarts-migration.patch.gz
          gzip --decompress --stdout /tmp/echarts-migration.patch.gz > /tmp/echarts-migration.patch
          echo "5958c064f95bd3321c204e1cca080db0327727ece4c31750e7db3558e2747328  /tmp/echarts-migration.patch" | sha256sum -c -
          echo "7a26b878b20ae6b79efa2596a4038219e95d6d0b647ba6fa4ffcdabfcc01638e  .agent/echarts-browser-fix.patch" | sha256sum -c -
          echo "23179c9d736a9342bcf8faf59d848717a5e70010e9447e0346d4e6fdcd0e651d  .agent/echarts-geometry-fix.patch" | sha256sum -c -
          echo "d0afc0aef7a4504b16190ff3c6dc64d28ace87ae221749e86ef137509df4b3f6  .agent/echarts-whitespace-fix.patch" | sha256sum -c -
          awk '
            /^diff -ruN / {
              skip = index($0, "economy-base/.agent/echarts-migration-placeholder.txt") > 0 \
                || index($0, "economy-base/.github/workflows/prepare-echarts-worktree.yml") > 0
            }
            !skip { print }
          ' /tmp/echarts-migration.patch > /tmp/echarts-migration-code.patch
          patch --batch --dry-run -p1 < /tmp/echarts-migration-code.patch
      - name: Apply migration
        shell: bash
        run: |
          set -euo pipefail
          patch --batch -p1 < /tmp/echarts-migration-code.patch
          patch --batch --dry-run -p1 < .agent/echarts-browser-fix.patch
          patch --batch -p1 < .agent/echarts-browser-fix.patch
          patch --batch --dry-run -p1 < .agent/echarts-geometry-fix.patch
          patch --batch -p1 < .agent/echarts-geometry-fix.patch
          patch --batch --dry-run -p1 < .agent/echarts-whitespace-fix.patch
          patch --batch -p1 < .agent/echarts-whitespace-fix.patch
          rm -rf .agent
          npm install --save-exact echarts@6.1.0
      - name: Build and verify architecture
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser regression suite
        id: browser
        continue-on-error: true
        run: npm run test:browser
      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: echarts-browser-diagnostics
          path: |
            playwright-report
            test-results
          retention-days: 1
          if-no-files-found: warn
      - name: Require browser regressions to pass
        if: steps.browser.outcome != 'success'
        run: exit 1
      - name: Commit verified migration
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .agent
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: migrate project charts to Apache ECharts"
          git push origin HEAD:agent/echarts-migration
