name: Apply invitation shop update

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: agent-apply-invitation-shop
  cancel-in-progress: false

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'agent/move-invitations-to-shop'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.4.0
          cache: npm

      - name: Rebuild and validate implementation script
        shell: bash
        run: |
          set -euo pipefail
          cat .agent/invitation-shop-parts/part-* > /tmp/apply-invitation-shop.py.gz.b64
          base64 --decode /tmp/apply-invitation-shop.py.gz.b64 | gzip --decompress > /tmp/apply-invitation-shop.py
          python - <<'PY'
          from pathlib import Path
          path = Path('/tmp/apply-invitation-shop.py')
          script = path.read_text()
          start_marker = '# The generic page verifier should know the new unique ownership too.'
          end_marker = '# Sanity checks before writing anything.'
          start = script.find(start_marker)
          end = script.find(end_marker, start)
          if start >= 0 and end >= 0:
              script = script[:start] + script[end:]
          path.write_text(script)
          PY
          python -m py_compile /tmp/apply-invitation-shop.py
          test "$(wc -l < /tmp/apply-invitation-shop.py)" -gt 1500

      - name: Apply source, test, and design changes
        shell: bash
        run: |
          set -euo pipefail
          python /tmp/apply-invitation-shop.py
          rm -rf .agent
          rm -f .github/workflows/agent-apply-invitation-shop.yml
          git diff --check

      - name: Install dependencies
        run: npm ci

      - name: Run full build validation
        run: npm run build

      - name: Commit validated implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m '将邀请入口迁入商店并关闭注册后补填'
          git push origin HEAD:agent/move-invitations-to-shop
