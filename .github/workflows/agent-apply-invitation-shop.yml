name: Apply invitation shop update

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: agent-apply-invitation-shop
  cancel-in-progress: false

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'agent/move-invitations-to-shop'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.4.0
          cache: npm

      - name: Rebuild and validate implementation script
        shell: bash
        run: |
          set -euo pipefail
          cat .agent/invitation-shop-parts/part-* > /tmp/apply-invitation-shop.py.gz.b64
          base64 --decode /tmp/apply-invitation-shop.py.gz.b64 | gzip --decompress > /tmp/apply-invitation-shop.py
          python - <<'PY'
          from pathlib import Path
          path = Path('/tmp/apply-invitation-shop.py')
          script = path.read_text()
          start_marker = '# The generic page verifier should know the new unique ownership too.'
          end_marker = '# Sanity checks before writing anything.'
          start = script.find(start_marker)
          end = script.find(end_marker, start)
          if start >= 0 and end >= 0:
              script = script[:start] + script[end:]
          path.write_text(script)
          PY
          python -m py_compile /tmp/apply-invitation-shop.py
          test "$(wc -l < /tmp/apply-invitation-shop.py)" -gt 1500

      - name: Apply source, test, and design changes
        shell: bash
        run: |
          set -euo pipefail
          python /tmp/apply-invitation-shop.py
          python - <<'PY'
          from pathlib import Path

          replacements = {
              'docs/README.md': (
                  '18. 商店邀请卡唯一归属、固定汇率、单向兑换、直接货币发行、兑换幂等与独立页面属于产品、页面和服务器权威规则；必须同步更新对应文档、测试和 `scripts/verify-gem-shop.mjs`。',
                  '18. 商店固定汇率、单向兑换、直接货币发行、兑换幂等与独立页面属于产品、页面和服务器权威规则；必须同步更新对应文档、测试和 `scripts/verify-gem-shop.mjs`；邀请卡唯一归属商店，不得恢复到设置页。',
              ),
              'docs/REGISTRATION_INVITE_FLOW_DESIGN.md': (
                  '- Economy 注册完成的唯一判定是该统一账号的玩家档案首次创建事务提交成功。事务提交后永久不允许新增、补填、更换或替换邀请关系。',
                  '- Economy 注册完成的唯一判定是该统一账号的玩家档案首次创建事务提交成功。注册完成后不能补填、更换或替换邀请关系。',
              ),
              'docs/PRODUCT_AND_GAMEPLAY_DESIGN.md': (
                  '玩家档案首次创建事务提交后，账号无论是否已有邀请关系，都永久不能新增、补填、更换或重新绑定邀请人。已有主页统一账号但尚无 Economy 玩家档案时仍属于首次建档；已有 Economy 玩家档案时访问分享链接只能忽略邀请码并清除 URL 参数。旧补填接口固定返回 `410 Gone`，不得读取或写入邀请业务状态。',
                  '玩家档案首次创建事务提交后，账号无论是否已有邀请关系，都永久不能新增、补填、更换或重新绑定邀请人。注册完成后不能补填或更换邀请码。已有主页统一账号但尚无 Economy 玩家档案时仍属于首次建档；已有 Economy 玩家档案时访问分享链接只能忽略邀请码并清除 URL 参数。旧补填接口固定返回 `410 Gone`，不得读取或写入邀请业务状态。',
              ),
          }
          for file_name, (old, new) in replacements.items():
              path = Path(file_name)
              content = path.read_text()
              if content.count(old) != 1:
                  raise SystemExit(f'{file_name} 权威规则锚点不唯一')
              path.write_text(content.replace(old, new))
          PY
          rm -rf .agent
          rm -f .github/workflows/agent-apply-invitation-shop.yml
          git diff --check

      - name: Install dependencies
        run: npm ci

      - name: Run full build validation
        shell: bash
        run: |
          set -o pipefail
          if npm run build > /tmp/economy-build.log 2>&1; then
            echo '完整构建验证通过'
          else
            echo '完整构建验证失败，末尾日志如下：'
            tail -n 160 /tmp/economy-build.log
            exit 1
          fi

      - name: Report validation failure
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          {
            echo '### 一次性实施工作流失败日志'
            echo
            echo '```text'
            if [ -f /tmp/economy-build.log ]; then
              tail -n 80 /tmp/economy-build.log
            else
              echo '失败发生在完整构建之前，请检查实施工作流步骤。'
            fi
            echo '```'
          } > /tmp/invitation-shop-failure-comment.md
          gh pr comment "$PR_NUMBER" --body-file /tmp/invitation-shop-failure-comment.md

      - name: Commit validated implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m '将邀请入口迁入商店并关闭注册后补填'
          git push origin HEAD:agent/move-invitations-to-shop
