name: Apply population order depth v12

on:
  push:
    branches:
      - agent/population-order-depth-v12
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

concurrency:
  group: apply-population-order-depth-v12
  cancel-in-progress: false

jobs:
  apply-and-verify:
    if: ${{ github.event_name == 'pull_request' || !contains(github.event.head_commit.message, '[generated v12]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: agent/population-order-depth-v12
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.4.0
          cache: npm

      - name: Reconstruct and apply patch
        shell: bash
        run: |
          set -euxo pipefail
          cat scripts/.population-order-depth-v12.* > /tmp/population-order-depth-v12.py.gz.b64
          echo 'd2c45280c836908a242bc2b51a85b76a0367587e4bdd3d0834614ee2cbd7adfc  /tmp/population-order-depth-v12.py.gz.b64' | sha256sum -c -
          base64 --decode /tmp/population-order-depth-v12.py.gz.b64 | gzip --decompress > /tmp/apply-population-order-depth-v12.py
          echo '012d01fe4aba37c1f1a801ee5ab06b4ef64d86c8c24082f62fb4514b80e359cf  /tmp/apply-population-order-depth-v12.py' | sha256sum -c -
          python3 - <<'PY'
          from pathlib import Path
          path = Path('/tmp/apply-population-order-depth-v12.py')
          text = path.read_text()
          text = text.replace("replace_all('scripts/verify-staple-crops-demand.mjs', \"'world.version = 18',\", \"'world.version = 19',\")\n", '')
          path.write_text(text)
          PY
          python3 /tmp/apply-population-order-depth-v12.py
          python3 - <<'PY'
          from pathlib import Path
          replacements = {
              r'world\.version = 18': r'world\.version = 19',
              'world.version, 18': 'world.version, 19',
              'MARKET_DEMAND_MODEL_VERSION = 11': 'MARKET_DEMAND_MODEL_VERSION = 12',
              'MARKET_DEMAND_MODEL_VERSION, 11': 'MARKET_DEMAND_MODEL_VERSION, 12',
              'world.marketDemand.modelVersion, 11': 'world.marketDemand.modelVersion, 12',
              'POPULATION_ECONOMY_VERSION = 5': 'POPULATION_ECONOMY_VERSION = 6',
              'groupState.frozenCredits += reservedCredits': 'groupState.frozenCredits = roundMoney(groupState.frozenCredits + reservedCredits)',
          }
          for root in (Path('scripts'), Path('server/test')):
              for file in root.rglob('*'):
                  if not file.is_file() or file.suffix not in {'.js', '.mjs', '.ts'}:
                      continue
                  text = file.read_text()
                  updated = text
                  for old, new in replacements.items():
                      updated = updated.replace(old, new)
                  if updated != text:
                      file.write_text(updated)
          daily_check = Path('scripts/verify-daily-check-in.mjs')
          text = daily_check.read_text()
          text = text.replace('`.version, ${staleVersion})`,', '`state.version, ${staleVersion})`,')
          daily_check.write_text(text)
          PY

      - name: Install dependencies
        run: npm ci

      - name: Verify complete project
        run: npm run build

      - name: Commit generated implementation
        shell: bash
        run: |
          set -euxo pipefail
          git rm scripts/.population-order-depth-v12.00 scripts/.population-order-depth-v12.01 scripts/.population-order-depth-v12.02 .github/workflows/apply-population-order-depth-v12.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Implement population order depth model 12 [generated v12]'
          git push origin HEAD:agent/population-order-depth-v12
