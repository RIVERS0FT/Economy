name: Temporary page content verifier sync

on:
  push:
    branches:
      - codex/commodity-auto-trade

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/commodity-auto-trade
          fetch-depth: 0
      - name: Align page-content verification with auto trade
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const path = 'scripts/verify-page-content.mjs';
          let content = readFileSync(path, 'utf8');
          const replacements = [
            ["'左侧：自动出售'", "'左侧：自动交易'"],
            ["'移动端自动出售使用与工厂详情相同的底部抽屉'", "'移动端自动交易使用与工厂详情相同的底部抽屉'"],
          ];
          for (const [from, to] of replacements) {
            if (!content.includes(from)) throw new Error(`missing expected verifier text: ${from}`);
            content = content.replace(from, to);
          }
          writeFileSync(path, content);
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/agent-page-content-auto-trade-sync.yml
          git add scripts/verify-page-content.mjs
          git commit -m "test: align page content verifier with auto trade"
          git push origin HEAD:codex/commodity-auto-trade
