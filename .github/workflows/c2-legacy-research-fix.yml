name: C2 legacy research snapshot fix

on:
  push:
    branches:
      - feature/c2-production-methods

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.4.0'
          cache: npm
      - name: Apply compatibility fix
        run: |
          python3 scripts/c2-fix-legacy-research-snapshot.py
          git diff --check
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify production page browser recovery
        run: >-
          npx playwright test
          tests/browser/production-methods.spec.ts
          tests/browser/production-facility-cards.spec.ts
          tests/browser/warehouse-auto-sell.spec.ts
          tests/browser/mobile-detail-sheet.spec.ts
          tests/browser/production-status-summary.spec.ts
          tests/browser/facility-artwork-resolution.spec.ts
          --project=chromium
      - name: Commit fix and remove temporary helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -- .github/workflows/c2-legacy-research-fix.yml scripts/c2-fix-legacy-research-snapshot.py
          git add -- src/pages/ProductionPage.tsx docs/UI_DESIGN_SYSTEM.md
          git diff --check
          git commit -m "fix: preserve production page for legacy research snapshots"
          git push origin HEAD:feature/c2-production-methods
