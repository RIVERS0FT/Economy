name: Apply mobile facility sheet jitter fix

on:
  push:
    branches:
      - agent/fix-mobile-facility-sheet-opening-jitter

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: agent/fix-mobile-facility-sheet-opening-jitter
          fetch-depth: 0

      - name: Apply focused fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}: {old[:140]!r}')
              file.write_text(text.replace(old, new, 1))

          replace_once(
              'src/pages/production/MobileFacilityDetailSheet.tsx',
              '  useEffect,\n  useRef,',
              '  useEffect,\n  useLayoutEffect,\n  useRef,',
          )
          replace_once(
              'src/pages/production/MobileFacilityDetailSheet.tsx',
              '  useEffect(() => {\n    if (!isOpen) return undefined;\n\n    clearSettleTimer();',
              '  useLayoutEffect(() => {\n    if (!isOpen) return undefined;\n\n    clearSettleTimer();',
          )
          replace_once(
              'src/pages/production/MobileFacilityDetailSheet.tsx',
              "    const previousBodyOverflow = document.body.style.overflow;\n    const previousPageOverflow = pageScroll?.style.overflowY ?? '';\n    const previousPageScrollbarSuppressed = pageScrollArea?.dataset.modalScrollbarSuppressed;\n    document.body.style.overflow = 'hidden';\n    if (pageScroll) pageScroll.style.overflowY = 'hidden';\n    if (pageScrollArea) pageScrollArea.dataset.modalScrollbarSuppressed = 'true';\n\n    const focusFrame = window.requestAnimationFrame(() => sheetRef.current?.focus());",
              "    const previousPageOverflow = pageScroll?.style.overflowY ?? '';\n    const previousPageScrollTop = pageScroll?.scrollTop ?? 0;\n    const previousPageScrollbarSuppressed = pageScrollArea?.dataset.modalScrollbarSuppressed;\n    const sheet = sheetRef.current;\n    const viewportHeight = Math.max(1, window.visualViewport?.height ?? window.innerHeight);\n    const sheetMaxHeight = Math.min(viewportHeight * 0.88, 760);\n    sheet?.style.setProperty('--facility-sheet-max-height', `${Math.round(sheetMaxHeight)}px`);\n    if (pageScroll) {\n      pageScroll.style.overflowY = 'hidden';\n      pageScroll.scrollTop = previousPageScrollTop;\n    }\n    if (pageScrollArea) pageScrollArea.dataset.modalScrollbarSuppressed = 'true';\n    sheet?.focus({ preventScroll: true });",
          )
          replace_once(
              'src/pages/production/MobileFacilityDetailSheet.tsx',
              '        sheetRef.current?.focus();',
              '        sheetRef.current?.focus({ preventScroll: true });',
          )
          replace_once(
              'src/pages/production/MobileFacilityDetailSheet.tsx',
              "      window.cancelAnimationFrame(focusFrame);\n      document.removeEventListener('keydown', handleKeyDown);\n      document.body.style.overflow = previousBodyOverflow;\n      if (pageScroll) pageScroll.style.overflowY = previousPageOverflow;\n      if (pageScrollArea) {",
              "      document.removeEventListener('keydown', handleKeyDown);\n      sheet?.style.removeProperty('--facility-sheet-max-height');\n      if (pageScroll) {\n        pageScroll.style.overflowY = previousPageOverflow;\n        pageScroll.scrollTop = previousPageScrollTop;\n      }\n      if (pageScrollArea) {",
          )
          replace_once(
              'src/pages/production/MobileFacilityDetailSheet.tsx',
              '      requestAnimationFrame(() => returnFocusRef.current?.focus());',
              '      requestAnimationFrame(() => returnFocusRef.current?.focus({ preventScroll: true }));',
          )

          replace_once(
              'src/styles/facility-detail-sheet.css',
              '    transform: translate3d(0, var(--facility-sheet-drag-offset), 0);\n    will-change: transform;',
              '    transform: translate3d(0, var(--facility-sheet-drag-offset), 0);\n    animation: facility-sheet-open 200ms cubic-bezier(0.22, 1, 0.36, 1);\n    will-change: transform;',
          )
          replace_once(
              'src/styles/facility-detail-sheet.css',
              '    max-height: min(88dvh, 760px);',
              '    max-height: var(--facility-sheet-max-height, min(88svh, 760px));',
          )
          replace_once(
              'src/styles/facility-detail-sheet.css',
              '@media (prefers-reduced-motion: reduce) {\n  .facility-detail-sheet-backdrop::before,\n  .facility-detail-sheet.is-settling {',
              "@keyframes facility-sheet-open {\n  from { transform: translate3d(0, 100%, 0); }\n  to { transform: translate3d(0, var(--facility-sheet-drag-offset), 0); }\n}\n\n@media (prefers-reduced-motion: reduce) {\n  .facility-detail-sheet,\n  .facility-detail-sheet-backdrop::before,\n  .facility-detail-sheet.is-settling {",
          )
          replace_once(
              'src/styles/facility-detail-sheet.css',
              '    transition: none;\n  }\n}',
              '    animation: none;\n    transition: none;\n  }\n}',
          )

          replace_once(
              'src/styles/facility-group-card-grid.css',
              '  .facility-cluster-selector-card {\n    min-height: 0;',
              '  .facility-cluster-selector-card {\n    --ui-interactive-active-transform: none;\n\n    min-height: 0;',
          )
          replace_once(
              'src/styles/facility-group-card-grid.css',
              '    max-height: min(88dvh, 760px);',
              '    max-height: min(88svh, 760px);',
          )

          replace_once(
              'docs/INDUSTRY_AND_PRODUCTION_DESIGN.md',
              '- 桌面详情卡高度由自然内容流决定，不得使用弹性空白行、可见占位 spacer 或独立纵向滚动条；市场入口紧跟实际内容。移动详情继续使用固定头部、唯一正文 `ScrollArea` 和固定底部市场入口。',
              '- 桌面详情卡高度由自然内容流决定，不得使用弹性空白行、可见占位 spacer 或独立纵向滚动条；市场入口紧跟实际内容。移动详情继续使用固定头部、唯一正文 `ScrollArea` 和固定底部市场入口。移动 Bottom Sheet 打开期间只允许单向上移，不得因动态视口、焦点滚动或触发卡缩放产生纵向回摆；移动触控下工厂选择卡不得使用缩放按压反馈。',
          )
          replace_once(
              'docs/UI_DESIGN_SYSTEM.md',
              '- 移动详情悬浮框不显示顶部关闭按钮；对话框容器承担初始焦点，点击遮罩、按 `Escape` 和有效向下拖动共用向下收起与遮罩淡出动画，关闭后焦点返回触发卡。移动详情使用 `SignedInShell` 的根级 Dialog 层覆盖完整视口并位于状态栏与底部导航之上，普通 Tooltip／Popover 仍使用工作区安全浮层根。',
              '- 移动详情悬浮框不显示顶部关闭按钮；对话框容器承担初始焦点，点击遮罩、按 `Escape` 和有效向下拖动共用向下收起与遮罩淡出动画，关闭后焦点返回触发卡。移动详情使用 `SignedInShell` 的根级 Dialog 层覆盖完整视口并位于状态栏与底部导航之上，普通 Tooltip／Popover 仍使用工作区安全浮层根。Bottom Sheet 必须在首次可见绘制前通过 `useLayoutEffect` 完成页面滚动锁定、稳定视觉视口高度快照和 `focus({ preventScroll: true })`；打开后不得继续读取动态 `dvh` 改变高度。',
          )

          replace_once(
              'scripts/verify-facility-groups.mjs',
              "for (const text of [\n  '.facility-detail-sheet .facility-card-title-block',\n  '.facility-detail-sheet.is-closing',\n]) requireText('src/styles/facility-detail-sheet.css', text);\nfor (const forbidden of ['.facility-detail-sheet-close']) forbidText('src/styles/facility-detail-sheet.css', forbidden);",
              "for (const text of [\n  '.facility-detail-sheet .facility-card-title-block',\n  '.facility-detail-sheet.is-closing',\n  '--facility-sheet-max-height',\n  'animation: facility-sheet-open',\n  '@keyframes facility-sheet-open',\n]) requireText('src/styles/facility-detail-sheet.css', text);\nfor (const forbidden of ['.facility-detail-sheet-close', '88dvh']) forbidText('src/styles/facility-detail-sheet.css', forbidden);\nfor (const text of [\n  'useLayoutEffect',\n  \"window.visualViewport?.height ?? window.innerHeight\",\n  \"sheet?.focus({ preventScroll: true });\",\n  \"returnFocusRef.current?.focus({ preventScroll: true })\",\n]) requireText('src/pages/production/MobileFacilityDetailSheet.tsx', text);\nfor (const forbidden of [\n  \"document.body.style.overflow = 'hidden';\",\n  'const focusFrame = window.requestAnimationFrame',\n]) forbidText('src/pages/production/MobileFacilityDetailSheet.tsx', forbidden);\nrequireText('src/styles/facility-group-card-grid.css', '--ui-interactive-active-transform: none;');\nforbidText('src/styles/facility-group-card-grid.css', '88dvh');",
          )
          replace_once(
              'scripts/verify-facility-groups.mjs',
              "  '桌面详情卡高度由自然内容流决定',",
              "  '桌面详情卡高度由自然内容流决定',\n  '移动 Bottom Sheet 打开期间只允许单向上移',\n  '移动触控下工厂选择卡不得使用缩放按压反馈',",
          )
          replace_once(
              'scripts/verify-facility-groups.mjs',
              "  '玩家可见的“生产产物”与“作业制度”使用同一个“生产设置”区',",
              "  '玩家可见的“生产产物”与“作业制度”使用同一个“生产设置”区',\n  '首次可见绘制前通过 `useLayoutEffect` 完成页面滚动锁定',\n  '`focus({ preventScroll: true })`',",
          )

          replace_once(
              'tests/browser/facility-detail-sheet.spec.ts',
              "  test('detail scroll area reuses the shared overlay scrollbar geometry', async ({ page }) => {",
              "  test('opens with stable monotonic geometry and preserves page scroll position', async ({ page }) => {\n    await page.goto('runtime-test.html?view=production&scenario=activity');\n\n    const trigger = page.getByRole('button', { name: /机械工厂，数量 18，运行中/ });\n    const dialog = page.getByRole('dialog', { name: /机械工厂/ });\n    const pageScroll = page.locator('.page-scroll');\n    await expect(trigger).toBeVisible();\n    expect(await trigger.evaluate((element) => (\n      getComputedStyle(element).getPropertyValue('--ui-interactive-active-transform').trim()\n    ))).toBe('none');\n\n    const initialScrollTop = await pageScroll.evaluate((element) => {\n      const target = Math.min(180, Math.max(0, element.scrollHeight - element.clientHeight));\n      element.scrollTop = target;\n      return element.scrollTop;\n    });\n    const opening = await trigger.evaluate(async (element) => {\n      const frames: Array<{ y: number; height: number }> = [];\n      const pageScrollElement = document.querySelector<HTMLElement>('.page-scroll');\n      element.click();\n      for (let index = 0; index < 18; index += 1) {\n        await new Promise<void>((resolve) => requestAnimationFrame(() => resolve()));\n        const sheet = document.querySelector<HTMLElement>('.facility-detail-sheet');\n        if (!sheet) continue;\n        const rect = sheet.getBoundingClientRect();\n        frames.push({ y: rect.y, height: rect.height });\n      }\n      return {\n        frames,\n        scrollTop: pageScrollElement?.scrollTop ?? -1,\n        focused: document.activeElement?.classList.contains('facility-detail-sheet') ?? false,\n      };\n    });\n\n    await expect(dialog).toBeVisible();\n    expect(opening.frames.length).toBeGreaterThanOrEqual(8);\n    const heights = opening.frames.map((frame) => frame.height);\n    expect(Math.max(...heights) - Math.min(...heights)).toBeLessThanOrEqual(1);\n    for (let index = 1; index < opening.frames.length; index += 1) {\n      expect(opening.frames[index].y).toBeLessThanOrEqual(opening.frames[index - 1].y + 1);\n    }\n    expect(opening.scrollTop).toBe(initialScrollTop);\n    expect(opening.focused).toBe(true);\n\n    await waitForSheetAnimations(dialog);\n    await page.keyboard.press('Escape');\n    await expect(dialog).toBeHidden();\n  });\n\n  test('detail scroll area reuses the shared overlay scrollbar geometry', async ({ page }) => {",
          )
          PYTHON

          git rm .github/workflows/apply-mobile-facility-sheet-jitter-fix.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            src/pages/production/MobileFacilityDetailSheet.tsx \
            src/styles/facility-detail-sheet.css \
            src/styles/facility-group-card-grid.css \
            docs/INDUSTRY_AND_PRODUCTION_DESIGN.md \
            docs/UI_DESIGN_SYSTEM.md \
            scripts/verify-facility-groups.mjs \
            tests/browser/facility-detail-sheet.spec.ts
          git commit -m '修复移动工厂详情打开抖动'
          git push origin HEAD:agent/fix-mobile-facility-sheet-opening-jitter

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.4.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify focused architecture
        run: node scripts/verify-facility-groups.mjs

      - name: Build and test
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Test facility sheet
        run: npx playwright test tests/browser/facility-detail-sheet.spec.ts --project=chromium

      - name: Test browser runtime
        run: npm run test:browser
