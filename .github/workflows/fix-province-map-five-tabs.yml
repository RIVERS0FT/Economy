name: Fix province map five tabs

on:
  push:
    branches:
      - feat/commercial-buildings

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/commercial-buildings
          fetch-depth: 0
      - name: Align province map browser test with five tabs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/browser/province-map.spec.ts')
          text = path.read_text()
          old = '''  await expect(tabs.getByRole('tab', { name: '市场', exact: true })).toBeVisible();
          await expect(tabs.getByRole('tab', { name: '建筑', exact: true })).toBeVisible();
          await expect(tabs.getByRole('tab', { name: '仓库', exact: true })).toBeVisible();

          await tabs.getByRole('tab', { name: '建筑', exact: true }).click();
          await expect(tabs.getByRole('tab', { name: '建筑', exact: true })).toHaveAttribute('aria-selected', 'true');'''
          new = '''  await expect(tabs.getByRole('tab', { name: '市场', exact: true })).toBeVisible();
          await expect(tabs.getByRole('tab', { name: '商业', exact: true })).toBeVisible();
          await expect(tabs.getByRole('tab', { name: '工业', exact: true })).toBeVisible();
          await expect(tabs.getByRole('tab', { name: '仓库', exact: true })).toBeVisible();

          await tabs.getByRole('tab', { name: '工业', exact: true }).click();
          await expect(tabs.getByRole('tab', { name: '工业', exact: true })).toHaveAttribute('aria-selected', 'true');'''
          if old not in text:
              raise SystemExit('missing stale four-tab province-map test block')
          path.write_text(text.replace(old, new, 1))
          Path('.github/workflows/fix-province-map-five-tabs.yml').unlink()
          PY
      - name: Commit browser test alignment
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "test: 对齐地图地区五分区交互"
          git push origin HEAD:feat/commercial-buildings
