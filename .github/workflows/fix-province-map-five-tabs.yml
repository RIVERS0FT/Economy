name: Fix province map five tabs

on:
  push:
    branches:
      - feat/commercial-buildings

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/commercial-buildings
          fetch-depth: 0
      - name: Align province map browser test with five tabs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/browser/province-map.spec.ts')
          text = path.read_text()

          old_visible = "await expect(tabs.getByRole('tab', { name: '建筑', exact: true })).toBeVisible();"
          new_visible = "await expect(tabs.getByRole('tab', { name: '商业', exact: true })).toBeVisible();\n  await expect(tabs.getByRole('tab', { name: '工业', exact: true })).toBeVisible();"
          old_click = "await tabs.getByRole('tab', { name: '建筑', exact: true }).click();"
          new_click = "await tabs.getByRole('tab', { name: '工业', exact: true }).click();"
          old_selected = "await expect(tabs.getByRole('tab', { name: '建筑', exact: true })).toHaveAttribute('aria-selected', 'true');"
          new_selected = "await expect(tabs.getByRole('tab', { name: '工业', exact: true })).toHaveAttribute('aria-selected', 'true');"

          for old in [old_visible, old_click, old_selected]:
              if old not in text:
                  raise SystemExit(f'missing stale province-map test token: {old}')
          text = text.replace(old_visible, new_visible, 1)
          text = text.replace(old_click, new_click, 1)
          text = text.replace(old_selected, new_selected, 1)
          path.write_text(text)
          Path('.github/workflows/fix-province-map-five-tabs.yml').unlink()
          PY
      - name: Commit browser test alignment
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "test: 对齐地图地区五分区交互"
          git push origin HEAD:feat/commercial-buildings
