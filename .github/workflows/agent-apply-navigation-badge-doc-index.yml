name: Commit navigation badge document index

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/agent-apply-navigation-badge-doc-index.yml"

permissions:
  contents: write

jobs:
  commit:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/unified-navigation-badges'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/unified-navigation-badges
          fetch-depth: 0
          show-progress: false
      - name: Update document index
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/README.md')
          text = path.read_text(encoding='utf-8')
          old = '九个正式页面、统一导航角标语义与已读规则、商品／工厂资产拍卖、进行中的合同默认视图'
          new = '九个正式页面、商品／工厂资产拍卖、统一导航角标语义与已读规则、进行中的合同默认视图'
          if text.count(old) != 1:
              raise SystemExit(f'document index context count: {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          rm -f .agent/navigation-badge-doc-index.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "调整导航角标设计索引职责顺序"
          git push origin HEAD:agent/unified-navigation-badges
