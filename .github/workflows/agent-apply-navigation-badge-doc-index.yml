name: Update navigation badge document index

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/agent-apply-navigation-badge-doc-index.yml"

permissions:
  contents: write

jobs:
  update:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/unified-navigation-badges'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/unified-navigation-badges
          fetch-depth: 0
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Update and validate document index
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/README.md')
          text = path.read_text()
          old = '| `PAGE_CONTENT_AND_NAVIGATION_DESIGN.md` | 九个正式页面、统一导航角标语义与已读规则、商品／工厂资产拍卖、进行中的合同默认视图、登录注册入口、独立商店、分享链接、邀请码、封禁提示、资产导航、模块唯一归属和页面防回退规则 |'
          new = '| `PAGE_CONTENT_AND_NAVIGATION_DESIGN.md` | 九个正式页面、商品／工厂资产拍卖、统一导航角标语义与已读规则、进行中的合同默认视图、登录注册入口、独立商店、分享链接、邀请码、封禁提示、资产导航、模块唯一归属和页面防回退规则 |'
          if text.count(old) != 1:
              raise SystemExit('document index context changed')
          path.write_text(text.replace(old, new))
          PY
          rm -f .agent/navigation-badge-doc-index.patch
          node scripts/verify-asset-auctions.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "调整导航角标设计索引职责顺序"
          git push origin HEAD:agent/unified-navigation-badges
