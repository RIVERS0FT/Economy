name: Remove product contract summary
on:
  push:
    branches: [work/remove-product-contract-summary-20260906]
    paths: [.github/workflows/remove-product-contract-summary.yml]
permissions:
  contents: write
jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/remove-product-contract-summary-20260906
      - uses: actions/setup-node@v4
        with:
          node-version: 24.4.0
          cache: npm
      - name: Apply focused removal
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace(path, old, new, label):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'missing replacement target: {label} in {path}')
              p.write_text(text.replace(old, new, 1))

          # Product detail no longer owns any contract summary or contract jump.
          replace(
              'src/pages/MarketPage.tsx',
              "import { MarketContractSummary } from '../components/market/MarketContractSummary';\n",
              '',
              'MarketContractSummary import',
          )
          replace(
              'src/pages/MarketPage.tsx',
              "        {selectedProduct ? <MarketContractSummary model={model} productId={selectedProduct.id} /> : null}\n\n",
              '',
              'MarketContractSummary render',
          )
          Path('src/components/market/MarketContractSummary.tsx').unlink()

          css_path = Path('src/styles/market-detail-direct-flow.css')
          css = css_path.read_text()
          pattern = re.compile(
              r"\n\n\.market-detail-surface \.market-contract-summary-card \{\n"
              r".*?"
              r"\.market-detail-surface \.market-contract-summary-grid strong \{\n"
              r"  color: var\(--color-text-primary\);\n"
              r"  font-variant-numeric: tabular-nums;\n"
              r"\}\n",
              re.S,
          )
          css, count = pattern.subn('\n', css, count=1)
          if count != 1:
              raise SystemExit('missing contract summary CSS block')
          mobile = "  .market-detail-surface .market-contract-summary-grid {\n    grid-template-columns: repeat(2, minmax(0, 1fr));\n  }\n\n"
          if mobile not in css:
              raise SystemExit('missing mobile contract summary CSS block')
          css_path.write_text(css.replace(mobile, '', 1))

          replace(
              'tests/browser/market-information-hierarchy.spec.ts',
              "  const contractSummary = detail.locator('.market-contract-summary-card');\n"
              "  await expect(contractSummary).toBeVisible();\n"
              "  for (const label of ['合同简要', '采购合同', '供应合同', '今日采购额度', '最低采购合同价', '查看相关合同']) {\n"
              "    await expect(contractSummary.getByText(label, { exact: true })).toBeVisible();\n"
              "  }\n",
              "  await expect(detail.locator('.market-contract-summary-card')).toHaveCount(0);\n"
              "  for (const label of ['合同简要', '采购合同', '供应合同', '今日采购额度', '最低采购合同价', '查看相关合同']) {\n"
              "    await expect(detail.getByText(label, { exact: true })).toHaveCount(0);\n"
              "  }\n",
              'browser contract summary assertion',
          )

          replace(
              'scripts/verify-daily-supply-contracts.mjs',
              "import { readFileSync } from 'node:fs';",
              "import { existsSync, readFileSync } from 'node:fs';",
              'daily verifier fs import',
          )
          replace(
              'scripts/verify-daily-supply-contracts.mjs',
              "const productDetail = read('src/components/market/MarketContractSummary.tsx');\n",
              '',
              'daily verifier product detail source',
          )
          replace(
              'scripts/verify-daily-supply-contracts.mjs',
              "for (const token of ['合同简要', '采购合同', '供应合同', '今日采购额度', '最低采购合同价', '查看相关合同']) {\n"
              "  requireText(productDetail, token, `地区商品详情合同摘要缺少：${token}`);\n"
              "}\n"
              "requireText(productDetail, 'setContractMarketIntent(productId, model.selectedProvinceId)', '地区商品详情合同跳转必须携带 provinceId + productId。');\n"
              "requireText(marketPage, '<MarketContractSummary model={model} productId={selectedProduct.id} />', '地区商品详情必须实际渲染合同简要，而不是只在未使用组件中保留。');\n",
              "if (existsSync('src/components/market/MarketContractSummary.tsx')) failures.push('地区商品详情不得保留合同简要组件。');\n"
              "for (const token of ['MarketContractSummary', '合同简要', '查看相关合同']) {\n"
              "  forbidText(marketPage, token, `地区商品详情不得保留合同内容：${token}`);\n"
              "}\n",
              'daily verifier product summary contract',
          )
          replace(
              'scripts/verify-daily-supply-contracts.mjs',
              "  [warehouse, '合同简要', '仓库权威设计必须锁定商品详情合同摘要。'],",
              "  [warehouse, '地区商品详情不展示合同简要', '仓库权威设计必须锁定商品详情不承载合同摘要。'],",
              'daily verifier warehouse design rule',
          )
          replace(
              'scripts/verify-daily-supply-contracts.mjs',
              "console.log('地区化每日商品合同验证通过：按地区固定价、每日额度、合同时间按天、生产择价来源、优先供应条件、商品详情摘要与跳转均已锁定。');",
              "console.log('地区化每日商品合同验证通过：按地区固定价、每日额度、合同时间按天、生产择价来源、优先供应条件保持；商品详情不再承载合同摘要与跳转。');",
              'daily verifier completion message',
          )

          replace(
              'scripts/verify-online-auto-sell.mjs',
              "requireText('src/pages/MarketPage.tsx', '<MarketContractSummary model={model} productId={selectedProduct.id} />');\n"
              "for (const token of ['自动经营执行', '预计自动采购', '预计自动出售', '采购价格上限', '出售价格下限', '当前自由库存', '统一商品订单簿']) {\n"
              "  forbidText('src/components/market/MarketContractSummary.tsx', token);\n"
              "}\n",
              "forbidText('src/pages/MarketPage.tsx', 'MarketContractSummary');\n"
              "assert.ok(!existsSync('src/components/market/MarketContractSummary.tsx'), '商品详情合同简要组件必须删除');\n",
              'auto sell verifier summary coupling',
          )

          replace(
              'scripts/verify-contract-layout.mjs',
              "const marketPanelPath = 'src/components/market/MarketContractSummary.tsx';\n",
              '',
              'contract layout market panel path',
          )
          replace(
              'scripts/verify-contract-layout.mjs',
              "  navigationPath, marketPanelPath, designPath, productDesignPath, uiDesignPath, surfaceDesignPath,\n",
              "  navigationPath, designPath, productDesignPath, uiDesignPath, surfaceDesignPath,\n",
              'contract layout required files',
          )
          replace(
              'scripts/verify-contract-layout.mjs',
              "for (const text of ['setContractMarketIntent(productId, model.selectedProvinceId);', '查看相关合同']) requireText(marketPanelPath, text);\n"
              "forbidText(marketPanelPath, 'setContractMarketIntent(productId, model.selectedProvinceId,');\n\n",
              '',
              'contract layout market summary assertions',
          )

          replace(
              'docs/WAREHOUSE_EXPANSION_DESIGN.md',
              "地区商品详情的合同简要只读展示当前有效采购合同数、供应合同数、今日采购合同剩余额度、最低可用采购合同固定价，以及“查看相关合同”跳转按钮。该按钮固定携带当前 `provinceId + productId`，合同页只据此筛选，不自动判断采购／供应方向；合同简要不得恢复已经删除的“自动经营执行”卡。",
              "地区商品详情不展示合同简要、合同数量／额度／价格摘要，也不提供“查看相关合同”跳转；商品合同的查询、筛选和承接统一在合同页完成。商品合同仍严格使用合同地区本地仓库与正式冻结／交付规则，商品详情不得因为合同存在而增加第二套合同状态展示。",
              'warehouse product contract summary rule',
          )
          replace(
              'docs/PAGE_CONTENT_AND_NAVIGATION_DESIGN.md',
              "建筑页工厂经营诊断及既有商品合同简要中的“查看相关合同”仍只携带当前 `provinceId + productId` 并打开合同市场，不自动判断采购／供应方向、数量、价格、周期或发布类型。该入口只负责缩小候选范围，玩家必须在合同市场自行选择合作方向和具体合同。",
              "建筑页工厂经营诊断中的“查看相关合同”只携带当前 `provinceId + productId` 并打开合同市场，不自动判断采购／供应方向、数量、价格、周期或发布类型。该入口只负责缩小候选范围，玩家必须在合同市场自行选择合作方向和具体合同。地区商品详情不展示合同简要，也不提供“查看相关合同”入口；商品合同的浏览与操作统一进入合同页。",
              'page product contract navigation rule',
          )
          replace(
              'docs/MARKET_CHART_LAYOUT_DESIGN.md',
              "- 行情相关内容顺序固定为“顶部交易摘要 → 近 30 天按日成交趋势 → 手动即时交易”；商品合同简要按页面与仓库设计位于手动交易后、本地成交记录前。行情、即时交易、合同简要和本地成交按页面内容流排列；合同简要只展示合同事实，不得恢复玩家盘口或第二套自动经营执行卡。",
              "- 地区商品详情内容顺序固定为“顶部交易摘要 → 近 30 天按日成交趋势 → 手动即时交易 → 本地成交记录”。商品详情不插入合同简要、合同统计或“查看相关合同”入口；合同内容统一归合同页。该精简不得恢复玩家盘口或第二套自动经营执行卡。",
              'market chart product detail flow',
          )
          PY
      - name: Install dependencies
        run: npm ci
      - name: Verify focused architecture and types
        shell: bash
        run: |
          set -euo pipefail
          npm run verify:daily-supply-contracts
          npm run verify:contract-layout
          node scripts/verify-online-auto-sell.mjs
          npm run verify:market-information-hierarchy
          npm run typecheck
          git diff --check
      - name: Prepare Chromium
        shell: bash
        run: bash scripts/prepare-playwright-chromium.sh
      - name: Verify regional product detail in browser
        shell: bash
        run: npm run test:browser -- tests/browser/market-information-hierarchy.spec.ts
      - name: Commit focused change
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/WAREHOUSE_EXPANSION_DESIGN.md docs/PAGE_CONTENT_AND_NAVIGATION_DESIGN.md docs/MARKET_CHART_LAYOUT_DESIGN.md src/pages/MarketPage.tsx src/components/market/MarketContractSummary.tsx src/styles/market-detail-direct-flow.css tests/browser/market-information-hierarchy.spec.ts scripts/verify-daily-supply-contracts.mjs scripts/verify-online-auto-sell.mjs scripts/verify-contract-layout.mjs
          git commit -m 'fix: remove contract summary from product detail'
          git push origin HEAD:work/remove-product-contract-summary-20260906
