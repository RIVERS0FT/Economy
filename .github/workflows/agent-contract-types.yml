name: Apply contract types

on:
  push:
    branches:
      - agent/contract-types

permissions:
  contents: write

concurrency:
  group: agent-contract-types
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/contract-types
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.4.0
          cache: npm

      - name: Verify and apply implementation bundle
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .agent-contract-types/part-00 \
            .agent-contract-types/part-01 \
            .agent-contract-types/fix-02-0 \
            .agent-contract-types/fix-02-1 \
            .agent-contract-types/fix-02-2 \
            .agent-contract-types/part-03 \
            .agent-contract-types/fix-04-0 \
            .agent-contract-types/fix-04-1 \
            .agent-contract-types/fix-04-2 \
            .agent-contract-types/fix-05-0 \
            .agent-contract-types/fix-05-1 \
            .agent-contract-types/fix-05-2 \
            .agent-contract-types/part-06 \
            .agent-contract-types/fix-07-0 \
            .agent-contract-types/fix-07-1 \
            .agent-contract-types/fix-07-2 \
            .agent-contract-types/part-08 \
            .agent-contract-types/part-09 \
            | base64 -d > /tmp/contract-types.tar.gz
          echo "52eb6b7adde0f086cd62b127ec1e6ef81c5732c01987e9198922b5dbd491ec4d  /tmp/contract-types.tar.gz" | sha256sum -c -
          tar -xzf /tmp/contract-types.tar.gz -C /tmp
          python3 /tmp/economy-contract-types/apply.py
          python3 - <<'PY'
          from pathlib import Path
          source = Path('server/src/commercial-contracts.js')
          source.write_text(source.read_text().replace("creditPopulationEmployment(world, fee, 'bankService')", "creditPopulationEmployment(world, fee, 'banking')"))
          page = Path('src/pages/ContractPage.tsx')
          page_text = page.read_text()
          page_text = page_text.replace("Pick<ProductionContract, 'kind' | 'publisherSide'>", "Pick<ProductionContract, 'kind' | 'publisherSide' | 'publisherRole'>", 1)
          page_text = page_text.replace("principal, interestRateBps: Math.round(interestPercent * 100), loanTerm,", "principal, interestRateBps: Math.round(interestPercent * 100), termMs: loanTerm,", 1)
          page.write_text(page_text)
          types = Path('src/contracts/types.ts')
          types.write_text(types.read_text().replace('  issue?: string | null;\n  auditCompleteness:', '  issue: string | null;\n  auditCompleteness:', 1))
          path = Path('server/test/commercial-contracts.test.js')
          text = path.read_text()
          text = text.replace("principal: 100,", "principal: 10,")
          text = text.replace("  const contract = state.productionContracts[0];\n  const totalBefore", "  let contract = state.productionContracts[0];\n  const totalBefore", 1)
          text = text.replace("  assert.equal(applyProductionContractAction(state, { id: 2 }, 'acceptProductionContract', { contractId: contract.id }, now).ok, true);\n  assert.equal(playerLoanCollateralQuantity", "  assert.equal(applyProductionContractAction(state, { id: 2 }, 'acceptProductionContract', { contractId: contract.id }, now).ok, true);\n  contract = state.productionContracts[0];\n  assert.equal(playerLoanCollateralQuantity", 1)
          text = text.replace("  assert.equal(applyProductionContractAction(state, { id: 1 }, 'repayPlayerLoan', { contractId: contract.id }, now + 1).ok, true);\n  assert.equal(contract.status", "  assert.equal(applyProductionContractAction(state, { id: 1 }, 'repayPlayerLoan', { contractId: contract.id }, now + 1).ok, true);\n  contract = state.productionContracts[0];\n  assert.equal(contract.status", 1)
          text = text.replace("  const contract = state.productionContracts[0];\n  assert.equal(applyProductionContractAction(state, { id: 2 }, 'acceptProductionContract'", "  let contract = state.productionContracts[0];\n  assert.equal(applyProductionContractAction(state, { id: 2 }, 'acceptProductionContract'", 1)
          text = text.replace("  assert.equal(applyProductionContractAction(state, { id: 2 }, 'acceptProductionContract', { contractId: contract.id }, now).ok, true);\n  assert.equal(leasedOutFacilityQuantity", "  assert.equal(applyProductionContractAction(state, { id: 2 }, 'acceptProductionContract', { contractId: contract.id }, now).ok, true);\n  contract = state.productionContracts[0];\n  assert.equal(leasedOutFacilityQuantity", 1)
          text = text.replace("  processProductionContracts(state, now + 1);\n  assert.equal(contract.completedPeriods", "  processProductionContracts(state, now + 1);\n  contract = state.productionContracts[0];\n  assert.equal(contract.completedPeriods", 1)
          text = text.replace("  processProductionContracts(state, now + 60 * 60 * 1000 + 2);\n  assert.equal(contract.status", "  processProductionContracts(state, now + 60 * 60 * 1000 + 2);\n  contract = state.productionContracts[0];\n  assert.equal(contract.status", 1)
          path.write_text(text)
          PY
          rm -rf .agent-contract-types
          rm -f .github/workflows/agent-contract-types.yml
          git add -u -- .agent-contract-types .github/workflows/agent-contract-types.yml
          git diff --check

      - name: Install dependencies
        run: npm ci

      - name: Run focused contract validation
        shell: bash
        run: |
          set -euo pipefail
          node --check server/src/commercial-contracts.js
          node --check server/src/contract-asset-locks.js
          node --test server/test/commercial-contracts.test.js
          node scripts/verify-contract-types.mjs
          npm run typecheck

      - name: Run full build validation
        run: npm run build

      - name: Commit formal implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- README.md docs package.json server src scripts
          git diff --cached --check
          git status --short
          git commit -m "增加六类合同方向与三类合同领域"
          git push origin HEAD:agent/contract-types
