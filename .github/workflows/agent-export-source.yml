name: Agent Export Source

on:
  push:
    branches:
      - agent/c1-c7-research
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: economy-source
          path: .
          include-hidden-files: true
          retention-days: 1
