name: Export Population Model Source

on:
  push:
    branches: [feature/population-model]

permissions:
  contents: read
  statuses: write

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Create source archive
        run: |
          set -euo pipefail
          tar --exclude=.git -czf /tmp/source-export.tar.gz .

      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: economy-population-source-${{ github.run_id }}
          path: /tmp/source-export.tar.gz
          retention-days: 1
          if-no-files-found: error

      - name: Publish export status
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          if [ "$JOB_STATUS" = success ]; then state=success; description='Population source export completed'; else state=failure; description='Population source export failed'; fi
          python3 - "$state" "$description" <<'PYTHON' > /tmp/status.json
          import json, os, sys
          print(json.dumps({
              'state': sys.argv[1],
              'description': sys.argv[2],
              'context': 'diagnostics/population-source-export',
              'target_url': f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }))
          PYTHON
          curl --fail --silent --show-error --request POST \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --data-binary @/tmp/status.json \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" >/dev/null
