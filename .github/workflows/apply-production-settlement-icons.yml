name: Apply production settlement icons

on:
  pull_request:
    branches:
      - main
    paths:
      - '.agent/apply-production-settlement-icons.py'
      - '.github/workflows/apply-production-settlement-icons.yml'

permissions:
  contents: write
  pull-requests: read

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply shared controls and design updates
        run: |
          python3 .agent/apply-production-settlement-icons.py
          python3 - <<'PY'
          from pathlib import Path

          settlement = Path('scripts/verify-production-settlement-layout.mjs')
          settlement_content = settlement.read_text(encoding='utf-8')
          settlement_old = "assert.equal((formula.match(/<RecipeItems/g) ?? []).length, 3, '生产结算必须保留组件定义、输入调用和输出调用');"
          settlement_new = "assert.equal((formula.match(/<RecipeItems/g) ?? []).length, 2, '生产结算必须保留输入和输出调用');"
          if settlement_content.count(settlement_old) != 1:
              raise RuntimeError('生产结算 RecipeItems 防回退目标不唯一')
          settlement.write_text(settlement_content.replace(settlement_old, settlement_new), encoding='utf-8')

          facility_groups = Path('scripts/verify-facility-groups.mjs')
          facility_content = facility_groups.read_text(encoding='utf-8')
          replacements = {
              "  '周期 SVG 图标',": "  '周期与当前集群周期成本固定放在输入组合区的物资行下方',",
              "  '周期与成本不得回到输入输出之间的独立中列',": "  '时间与成本不得回到输入输出之间的独立中列',",
          }
          for old, new in replacements.items():
              if facility_content.count(old) != 1:
                  raise RuntimeError(f'工厂集群防回退目标不唯一: {old}')
              facility_content = facility_content.replace(old, new)
          facility_groups.write_text(facility_content, encoding='utf-8')
          PY

      - name: Remove temporary application files
        run: |
          rm .agent/apply-production-settlement-icons.py
          rm .github/workflows/apply-production-settlement-icons.yml
          rmdir .agent 2>/dev/null || true
          git add -A

      - name: Install dependencies
        run: npm ci

      - name: Run production settlement verification
        run: npm run verify:production-settlement

      - name: Run production method verification
        run: npm run verify:production-methods

      - name: Build
        run: npm run build

      - name: Check patch formatting
        run: git diff --check --cached

      - name: Commit applied changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "完善生产结算与生产设置图标布局"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
