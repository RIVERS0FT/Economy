name: Agent Apply Renewal

on:
  push:
    branches:
      - agent/renewal-explicit-bilateral-approval

permissions:
  contents: write

jobs:
  apply:
    if: contains(github.event.head_commit.message, 'stage bilateral renewal patch 5/5')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/renewal-explicit-bilateral-approval
          fetch-depth: 0
      - name: Apply verified patch
        shell: bash
        run: |
          set -euo pipefail
          cat .agent-renewal.patch.part-* > /tmp/renewal.patch
          git apply --check /tmp/renewal.patch
          git apply /tmp/renewal.patch
          git rm -- .agent-renewal.patch.part-00 .agent-renewal.patch.part-01 .agent-renewal.patch.part-02 .agent-renewal.patch.part-03 .agent-renewal.patch.part-04
          git rm -- .github/workflows/agent-export-source.yml .github/workflows/agent-apply-renewal.yml
          git add -- README.md docs/GEM_ACCELERATION_AND_DYNAMIC_EXCHANGE_DESIGN.md docs/GIFT_CODE_AND_ADMIN_DESIGN.md docs/INDUSTRY_AND_PRODUCTION_DESIGN.md docs/LOCAL_ACTIVITY_LOG_DESIGN.md docs/PAGE_CONTENT_AND_NAVIGATION_DESIGN.md docs/PRODUCT_AND_GAMEPLAY_DESIGN.md docs/README.md docs/SERVER_ARCHITECTURE_AND_DEPLOYMENT_DESIGN.md docs/UNIFIED_ASSET_ORDER_BOOK_DESIGN.md docs/WAREHOUSE_EXPANSION_DESIGN.md scripts/verify-asset-auctions.mjs scripts/verify-contract-renewal-economic-events.mjs scripts/verify-contract-types.mjs scripts/verify-money-precision.mjs scripts/verify-production-methods.mjs server/shared/economy-state-version.js server/src/contract-audit-store.js server/src/contracts.js server/test/commercial-contracts.test.js server/test/contracts.test.js src/contracts/types.ts src/pages/ContractPage.tsx src/types.ts tests/browser/contract-layout.spec.ts tests/browser/runtime-harness.tsx
          git diff --cached --check
      - name: Commit and push implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'RIVERSOFT'
          git config user.email '105160096+RIVERS0FT@users.noreply.github.com'
          git commit -m 'feat: require bilateral contract renewal approval'
          git push origin HEAD:agent/renewal-explicit-bilateral-approval
