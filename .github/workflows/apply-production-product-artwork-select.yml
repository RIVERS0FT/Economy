name: Apply production product artwork select

on:
  pull_request:
    branches:
      - main
    paths:
      - '.agent/apply-production-product-artwork-select.py'
      - '.github/workflows/apply-production-product-artwork-select.yml'

permissions:
  contents: write
  pull-requests: read

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.4.0
          cache: npm

      - name: Apply product artwork and rich select changes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.agent/apply-production-product-artwork-select.py')
          content = path.read_text(encoding='utf-8')
          replacements = [
              (
                  """    if content.count(marker) != 1:\n        raise RuntimeError(f'{path} 插入标记不唯一: {marker}')\n    target.write_text(content.replace(marker, addition + marker), encoding='utf-8')""",
                  """    if marker not in content:\n        raise RuntimeError(f'{path} 缺少插入标记: {marker}')\n    target.write_text(content.replace(marker, addition + marker, 1), encoding='utf-8')""",
              ),
              ('  overscroll-behavior: contain;', '  overscroll-behavior-y: auto;'),
              (
                  ".ui-rich-select__trigger:hover:not(:disabled) {\n  border-color: var(--color-border-strong);\n  background: var(--color-surface-hover);\n}",
                  "@media (hover: hover) and (pointer: fine) {\n  html[data-input-modality='mouse'] .ui-rich-select__trigger:hover:not(:disabled) {\n    border-color: var(--color-border-strong);\n    background: var(--color-surface-hover);\n  }\n}",
              ),
              (
                  ".ui-rich-select__option:hover:not(:disabled),\n.ui-rich-select__option[data-active='true']:not(:disabled) {\n  color: var(--color-text-primary);\n  background: var(--color-surface-hover);\n}",
                  ".ui-rich-select__option[data-active='true']:not(:disabled) {\n  color: var(--color-text-primary);\n  background: var(--color-surface-hover);\n}\n\n@media (hover: hover) and (pointer: fine) {\n  html[data-input-modality='mouse'] .ui-rich-select__option:hover:not(:disabled) {\n    color: var(--color-text-primary);\n    background: var(--color-surface-hover);\n  }\n}",
              ),
          ]
          for old, new in replacements:
              if content.count(old) != 1:
                  raise RuntimeError(f'实施脚本修复目标不唯一: {old[:60]}')
              content = content.replace(old, new)
          path.write_text(content, encoding='utf-8')
          PY
          python3 .agent/apply-production-product-artwork-select.py
          python3 - <<'PY'
          from pathlib import Path

          def replace_one(path, old, new):
              target = Path(path)
              content = target.read_text(encoding='utf-8')
              if content.count(old) != 1:
                  raise RuntimeError(f'{path} 验证文案目标不唯一: {old}')
              target.write_text(content.replace(old, new), encoding='utf-8')

          replacements = [
              (
                  'scripts/verify-unified-factory-recipes-grid.mjs',
                  "  '生产配方与作业制度必须合并为同一个“生产设置”区',",
                  "  '玩家可见“生产产物”与“作业制度”必须合并为同一个“生产设置”区',",
              ),
              (
                  'scripts/verify-unified-factory-recipes-grid.mjs',
                  "      '生产配方与作业制度使用同一个“生产设置”区',",
                  "      '玩家可见的“生产产物”与“作业制度”使用同一个“生产设置”区',",
              ),
              (
                  'scripts/verify-market-assets.mjs',
                  "  '生产配方',\n  '下一周期切换为：',",
                  "  '生产产物',\n  '下一周期切换为：',",
              ),
              (
                  'scripts/verify-warehouse-expansion.mjs',
                  "  '生产配方',\n  '固定配方：',",
                  "  '生产产物',\n  '固定产物：',",
              ),
              (
                  'scripts/verify-facility-groups.mjs',
                  "  '生产配方与作业制度必须合并为同一个“生产设置”区',",
                  "  '玩家可见“生产产物”与“作业制度”必须合并为同一个“生产设置”区',",
              ),
              (
                  'scripts/verify-facility-groups.mjs',
                  "  '生产配方与作业制度使用同一个“生产设置”区',",
                  "  '玩家可见的“生产产物”与“作业制度”使用同一个“生产设置”区',",
              ),
          ]
          for target_path, old, new in replacements:
              replace_one(target_path, old, new)

          css_path = Path('src/styles/form-controls.css')
          css_path.write_text(css_path.read_text(encoding='utf-8').rstrip() + '\n', encoding='utf-8')
          PY

      - name: Remove temporary application files
        run: |
          rm .agent/apply-production-product-artwork-select.py
          rm .github/workflows/apply-production-product-artwork-select.yml
          rmdir .agent 2>/dev/null || true
          git add -A

      - name: Install dependencies
        run: npm ci

      - name: Verify product artwork
        run: npm run verify:product-artwork

      - name: Verify production settlement
        run: npm run verify:production-settlement

      - name: Verify production methods
        run: npm run verify:production-methods

      - name: Build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Test browser runtime
        run: npm run test:browser

      - name: Check patch formatting
        run: git diff --check --cached

      - name: Commit applied changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "统一生产商品图片与下拉框"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
