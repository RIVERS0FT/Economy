name: Apply production product artwork select

on:
  pull_request:
    branches:
      - main
    paths:
      - '.agent/apply-production-product-artwork-select.py'
      - '.github/workflows/apply-production-product-artwork-select.yml'

permissions:
  contents: write
  pull-requests: read

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.4.0
          cache: npm

      - name: Apply product artwork and rich select changes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.agent/apply-production-product-artwork-select.py')
          content = path.read_text(encoding='utf-8')
          old = """    if content.count(marker) != 1:\n        raise RuntimeError(f'{path} 插入标记不唯一: {marker}')\n    target.write_text(content.replace(marker, addition + marker), encoding='utf-8')"""
          new = """    if marker not in content:\n        raise RuntimeError(f'{path} 缺少插入标记: {marker}')\n    target.write_text(content.replace(marker, addition + marker, 1), encoding='utf-8')"""
          if content.count(old) != 1:
              raise RuntimeError('append_before 修复目标不唯一')
          content = content.replace(old, new)

          scroll_old = '  overscroll-behavior: contain;'
          scroll_new = '  overscroll-behavior-y: auto;'
          if content.count(scroll_old) != 1:
              raise RuntimeError('富内容下拉框滚动边界修复目标不唯一')
          content = content.replace(scroll_old, scroll_new)

          trigger_hover_old = """.ui-rich-select__trigger:hover:not(:disabled) {\n  border-color: var(--color-border-strong);\n  background: var(--color-surface-hover);\n}"""
          trigger_hover_new = """@media (hover: hover) and (pointer: fine) {\n  html[data-input-modality='mouse'] .ui-rich-select__trigger:hover:not(:disabled) {\n    border-color: var(--color-border-strong);\n    background: var(--color-surface-hover);\n  }\n}"""
          if content.count(trigger_hover_old) != 1:
              raise RuntimeError('富内容下拉框触发器 hover 修复目标不唯一')
          content = content.replace(trigger_hover_old, trigger_hover_new)

          option_hover_old = """.ui-rich-select__option:hover:not(:disabled),\n.ui-rich-select__option[data-active='true']:not(:disabled) {\n  color: var(--color-text-primary);\n  background: var(--color-surface-hover);\n}"""
          option_hover_new = """.ui-rich-select__option[data-active='true']:not(:disabled) {\n  color: var(--color-text-primary);\n  background: var(--color-surface-hover);\n}\n\n@media (hover: hover) and (pointer: fine) {\n  html[data-input-modality='mouse'] .ui-rich-select__option:hover:not(:disabled) {\n    color: var(--color-text-primary);\n    background: var(--color-surface-hover);\n  }\n}"""
          if content.count(option_hover_old) != 1:
              raise RuntimeError('富内容下拉框选项 hover 修复目标不唯一')
          path.write_text(content.replace(option_hover_old, option_hover_new), encoding='utf-8')
          PY
          python3 .agent/apply-production-product-artwork-select.py

      - name: Remove temporary application files
        run: |
          rm .agent/apply-production-product-artwork-select.py
          rm .github/workflows/apply-production-product-artwork-select.yml
          rmdir .agent 2>/dev/null || true
          git add -A

      - name: Install dependencies
        run: npm ci

      - name: Verify product artwork
        run: npm run verify:product-artwork

      - name: Verify production settlement
        run: npm run verify:production-settlement

      - name: Verify production methods
        run: npm run verify:production-methods

      - name: Build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Test browser runtime
        run: npm run test:browser

      - name: Check patch formatting
        run: git diff --check --cached

      - name: Commit applied changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "统一生产商品图片与下拉框"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
