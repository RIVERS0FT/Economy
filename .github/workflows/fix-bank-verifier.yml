name: One-shot bank verifier patch

on:
  push:
    branches:
      - feat/asset-based-bank-loans
    paths:
      - .github/workflows/fix-bank-verifier.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/asset-based-bank-loans
          fetch-depth: 0
      - name: Patch verifier and remove helper
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/verify-provincial-economy.mjs')
          text = path.read_text()
          old = "assert.ok(read('server/test/banking.test.js').includes('bank collateral locks only the selected province facility group'), '缺少银行跨省冻结防回退测试');"
          new = "assert.ok(read('server/test/banking-legacy-province.test.js').includes('legacy bank collateral remains scoped to the selected province only'), '缺少历史银行抵押跨省冻结兼容测试');"
          if text.count(old) != 1:
              raise SystemExit(f'expected one verifier match, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
          git rm .github/workflows/fix-bank-verifier.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/verify-provincial-economy.mjs server/test/banking-legacy-province.test.js
          git commit -m 'test(bank): align provincial legacy collateral guard'
          git push origin HEAD:feat/asset-based-bank-loans
