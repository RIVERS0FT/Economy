name: codex-map-zoom-kick

on:
  push:
    branches:
      - codex/map-zoom-interpolation

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/map-zoom-interpolation
          fetch-depth: 0
      - name: Run embedded interpolation patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'RUNNER'
          from pathlib import Path

          source = Path('.github/workflows/codex-map-zoom-interpolation.yml').read_text()
          marker = "          python3 - <<'PY'\n"
          start = source.index(marker) + len(marker)
          end = source.index("\n          PY\n", start)
          embedded = source[start:end]
          lines = []
          for line in embedded.splitlines():
              lines.append(line[10:] if line.startswith('          ') else line)
          script = '\n'.join(lines) + '\n'

          def rewrite_replace_block(script_text, label, replacement):
              end_marker = f"'{label}')"
              end_pos = script_text.index(end_marker) + len(end_marker)
              start_pos = script_text.rfind("\ntext = replace_once(text,", 0, end_pos)
              if start_pos < 0:
                  raise SystemExit(f'cannot locate replacement block: {label}')
              return script_text[:start_pos] + '\n' + replacement + script_text[end_pos:]

          script = rewrite_replace_block(
              script,
              'verifier ui interpolation docs',
              """ui_marker = '  \"`georoam` 热路径只允许更新共享 SVG 相机组的统一等比缩放和平移矩阵\",\\n'\nif ui_marker not in text:\n    raise SystemExit('verifier ui interpolation marker missing')\ntext = text.replace(\n    ui_marker,\n    ui_marker\n    + '  \"`roam: \\\'move\\\'`\",\\n'\n    + \"  '每帧最多一次 `geoRoam`',\\n\"\n    + \"  '真实 `pinchScale`',\\n\"\n    + \"  '不得使用逐帧 `setOption`',\\n\",\n    1,\n)""",
          )
          script = rewrite_replace_block(
              script,
              'verifier page interpolation docs',
              """page_marker = \"  '`georoam` 期间不得重新执行 48 州标签完整布局',\\n\"\nif page_marker not in text:\n    raise SystemExit('verifier page interpolation marker missing')\ntext = text.replace(\n    page_marker,\n    page_marker\n    + '  \"`roam: \\\'move\\\'`\",\\n'\n    + \"  '目标缩放',\\n\"\n    + \"  '每帧最多通过一次 ECharts `geoRoam`',\\n\"\n    + \"  '真实 `pinchScale`',\\n\",\n    1,\n)""",
          )
          exec(compile(script, 'codex-map-zoom-interpolation.py', 'exec'), {})
          RUNNER
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/codex-map-zoom-interpolation.yml
          git rm .github/workflows/codex-map-zoom-kick.yml
          git rm .github/codex-map-zoom-trigger
          git add -- src/components/provinces/UsMainlandMap.tsx docs/PAGE_CONTENT_AND_NAVIGATION_DESIGN.md docs/UI_DESIGN_SYSTEM.md tests/browser/province-map.spec.ts scripts/verify-provincial-economy.mjs src/components/provinces/provinceMapZoomInterpolator.ts
          git commit -m "接入地图插值缩放并更新回归"
          git push origin HEAD:codex/map-zoom-interpolation
