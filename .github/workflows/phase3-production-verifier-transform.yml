name: Phase 3 production verifier transform

on:
  push:
    branches:
      - agent/client-response-phase3

permissions:
  contents: write

jobs:
  transform:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/client-response-phase3
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.4.0
      - run: node scripts/phase3-production-verifier-transform.mjs
      - name: Remove temporary transformer and commit
        run: |
          rm scripts/phase3-production-verifier-transform.mjs .github/workflows/phase3-production-verifier-transform.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "test: 迁移生产叶子时钟验证"
          git push origin HEAD:agent/client-response-phase3
