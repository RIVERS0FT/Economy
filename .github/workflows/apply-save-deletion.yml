name: Apply save deletion implementation

on:
  push:
    branches:
      - feature/save-deletion
    paths:
      - .github/workflows/apply-save-deletion.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/save-deletion
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24.4.0
          cache: npm

      - name: Apply implementation
        shell: bash
        run: |
          cat .github/save-deletion/apply.py.gz.b64.part-* > /tmp/apply-save-deletion.py.gz.b64
          base64 -d /tmp/apply-save-deletion.py.gz.b64 | gzip -d > .github/save-deletion/apply-save-deletion.py
          python3 .github/save-deletion/apply-save-deletion.py
          rm -f .github/save-deletion/apply-save-deletion.py
          git rm -- .github/workflows/apply-save-deletion.yml .github/save-deletion/apply.py.gz.b64.part-*
          git add -- scripts/verify-reset-disabled.mjs

      - name: Install dependencies
        run: npm ci

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Run focused verification
        run: |
          node scripts/verify-save-deletion.mjs
          node scripts/verify-settings-layout.mjs
          node --test server/test/save-deletion.test.js
          npm run typecheck
          git diff --check

      - name: Run full build
        run: npm run build

      - name: Run browser tests
        run: npm run test:browser

      - name: Commit verified implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            README.md \
            docs/GIFT_CODE_AND_ADMIN_DESIGN.md \
            docs/PAGE_CONTENT_AND_NAVIGATION_DESIGN.md \
            docs/PRODUCT_AND_GAMEPLAY_DESIGN.md \
            docs/SERVER_ARCHITECTURE_AND_DEPLOYMENT_DESIGN.md \
            docs/UI_DESIGN_SYSTEM.md \
            package.json \
            scripts/verify-market-assets.mjs \
            scripts/verify-page-content.mjs \
            scripts/verify-save-deletion.mjs \
            scripts/verify-settings-layout.mjs \
            server/src/app.js \
            server/src/runtime-store.js \
            server/src/save-deletion.js \
            server/test/save-deletion.test.js \
            src/api/game.ts \
            src/pages/SettingsPage.tsx \
            src/styles/settings.css \
            src/types.ts \
            tests/browser/settings-layout.spec.ts
          git diff --cached --check
          git commit -m "增加玩家删除存档功能"
          git push origin HEAD:feature/save-deletion
