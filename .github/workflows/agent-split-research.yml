name: Agent Split Research Technologies

on:
  push:
    branches:
      - feature/split-research-technologies

permissions:
  contents: write

concurrency:
  group: agent-split-research-technologies
  cancel-in-progress: false

jobs:
  implement-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24.4.0
          cache: npm

      - name: Apply split technology implementation
        run: |
          python3 .agent/split_research.py
          python3 - <<'PY'
          from pathlib import Path

          view_model = Path('src/app/gameViewModel.ts')
          content = view_model.read_text(encoding='utf-8')
          old = "startResearch: (targetComplexity) => runAction('startResearch', () => gameActions.startResearch(technologyId)),"
          new = "startResearch: (technologyId) => runAction('startResearch', () => gameActions.startResearch(technologyId)),"
          if content.count(old) != 1:
              raise SystemExit('generated view-model research callback did not match')
          view_model.write_text(content.replace(old, new, 1), encoding='utf-8')

          page = Path('src/pages/ResearchPage.tsx')
          content = page.read_text(encoding='utf-8')
          old = '    durationMs: active.durationMs,\n'
          new = '    durationMs: active.durationMs ?? Math.max(1, active.completesAt - active.startedAt),\n'
          if content.count(old) != 1:
              raise SystemExit('generated legacy research duration did not match')
          page.write_text(content.replace(old, new, 1), encoding='utf-8')

          auction_verifier = Path('scripts/verify-asset-auctions.mjs')
          content = auction_verifier.read_text(encoding='utf-8')
          if content.count('世界状态版本：26') != 1:
              raise SystemExit('asset auction world-version assertion did not match')
          auction_verifier.write_text(content.replace('世界状态版本：26', '世界状态版本：27', 1), encoding='utf-8')

          for path in [
              Path('docs/SERVER_ARCHITECTURE_AND_DEPLOYMENT_DESIGN.md'),
              Path('src/styles/research-page.css'),
          ]:
              path.write_text(path.read_text(encoding='utf-8').rstrip() + '\n', encoding='utf-8')
          PY
          git add -u -- .agent .github/workflows/agent-split-research.yml

      - name: Install dependencies
        run: npm ci

      - name: Run research checks
        run: |
          npm run verify:research
          node scripts/verify-research-page.mjs
          node --test server/test/research.test.js server/test/research-gem-acceleration.test.js server/test/commercial-contracts.test.js

      - name: Typecheck
        run: npm run typecheck

      - name: Build and full verification
        run: npm run build

      - name: Install browser runtime
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        run: npm run test:browser

      - name: Review final diff
        run: |
          git diff --check
          git status --short
          git diff --stat

      - name: Commit verified implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "RIVERSOFT Automation"
          git config user.email "105160096+RIVERS0FT@users.noreply.github.com"
          mapfile -t changed < <(git status --porcelain=v1 | sed -E 's/^...//')
          if [ "${#changed[@]}" -eq 0 ]; then
            echo "No changes to commit"
            exit 1
          fi
          for path in "${changed[@]}"; do
            case "$path" in
              README.md|docs/*.md|server/src/research-catalog.js|server/src/research.js|server/src/state-partitions.js|server/src/commercial-contracts.js|server/test/research.test.js|server/test/research-gem-acceleration.test.js|src/types.ts|src/api/game.ts|src/app/gameViewModel.ts|src/pages/ResearchPage.tsx|src/styles/research-page.css|tests/browser/runtime-harness.tsx|tests/browser/research-technology-tree.spec.ts|scripts/verify-research-progression.mjs|scripts/verify-research-page.mjs|scripts/verify-document-authority.mjs|scripts/verify-client-state-version.mjs|scripts/verify-state-delivery-capacity.mjs|scripts/verify-runtime-reliability.mjs|scripts/verify-asset-auctions.mjs|.agent/*|.github/workflows/agent-split-research.yml)
                git add -- "$path"
                ;;
              *)
                echo "Unexpected changed path: $path" >&2
                exit 1
                ;;
            esac
          done
          git diff --cached --check
          git commit -m "拆分产业科技研发"
          git push origin HEAD:feature/split-research-technologies
