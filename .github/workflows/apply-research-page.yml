name: Apply research page

on:
  push:
    branches:
      - feat/research-page

permissions:
  contents: write

concurrency:
  group: apply-research-page
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.4.0
          cache: npm

      - name: Apply research page changes
        run: node scripts/apply-research-page.mjs

      - name: Install dependencies
        run: npm ci

      - name: Verify research page
        run: node scripts/verify-research-page.mjs

      - name: Build website and test authoritative API
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Test browser runtime
        run: npm run test:browser

      - name: Commit applied changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            src/config/navigation.ts \
            src/components/icons/GameIcons.tsx \
            src/pages/PageRouter.tsx \
            src/pages/ResearchPage.tsx \
            docs/README.md \
            docs/PAGE_CONTENT_AND_NAVIGATION_DESIGN.md \
            docs/UI_DESIGN_SYSTEM.md \
            scripts/verify-research-page.mjs \
            package.json \
            scripts/apply-research-page.mjs \
            .github/workflows/apply-research-page.yml
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "新增研发页面"
          git push origin "HEAD:${GITHUB_REF_NAME}"
