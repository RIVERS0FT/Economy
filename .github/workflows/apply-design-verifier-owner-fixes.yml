name: Apply design verifier owner fixes

on:
  push:
    branches:
      - docs/design-authority-compression-current-20260902

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.4.0
          cache: npm
      - run: npm ci
      - name: Apply owner fixes
        run: |
          node scripts/fix-design-verifier-ownership.mjs
          node scripts/trim-design-owner-summary.mjs
          node scripts/fix-design-verifier-ownership-v2.mjs
      - name: Generate verifier prerequisites
        run: |
          npm run generate:artwork
          npm run generate:local-preview
      - name: Verify document authority and all DESIGN readers
        run: |
          node scripts/verify-document-authority.mjs
          failed=0
          while IFS= read -r file; do
            node --experimental-strip-types "$file" || failed=1
          done < <(grep -lE "docs/[A-Z0-9_]+_DESIGN\.md|docs/UI_DESIGN_SYSTEM\.md" scripts/verify-*.mjs | sort)
          git diff --check
          exit "$failed"
      - name: Commit fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs scripts/verify-*.mjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m '收束设计文档与 verifier 所有权'
          git push origin HEAD:${GITHUB_REF_NAME}
