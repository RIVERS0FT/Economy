name: Finalize facility card readability

on:
  pull_request:
    types: [opened, reopened]
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'codex/facility-card-readability-20260802'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.4.0
          cache: npm

      - name: Finalize names and regression gates
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync, writeFileSync } from 'node:fs';

          const read = (path) => readFileSync(path, 'utf8');
          const write = (path, content) => writeFileSync(path, content);

          function replaceExact(path, search, replacement, expected = 1) {
            const source = read(path);
            const count = source.split(search).length - 1;
            assert.equal(count, expected, `${path}: expected ${expected}, found ${count}: ${search}`);
            write(path, source.split(search).join(replacement));
          }

          for (const path of [
            'docs/SERVER_ARCHITECTURE_AND_DEPLOYMENT_DESIGN.md',
            'tests/browser/runtime-harness.tsx',
            'tests/browser/market-runtime-harness.tsx',
            'tests/browser/market-runtime.spec.ts',
          ]) {
            const source = read(path);
            assert.ok(source.includes('电子工厂'), `${path} 缺少待迁移旧名称`);
            write(path, source.replaceAll('电子工厂', '电子厂'));
          }

          const verifier = 'scripts/verify-unified-factory-recipes-grid.mjs';
          replaceExact(
            verifier,
            "const productIds = new Set(PRODUCT_CATALOG.map((product) => product.id));",
            `const productIds = new Set(PRODUCT_CATALOG.map((product) => product.id));

            assert.equal(
              FACILITY_TYPE_CATALOG.find((facility) => facility.id === 'electronics-factory')?.name,
              '电子厂',
              'electronics-factory 正式显示名称必须为电子厂',
            );`,
          );
          replaceExact(
            verifier,
            "  'transform: none;',",
            `  'transform: none;',
              'rgb(0 0 0 / 82%) 0%',
              'transparent 44%',
              'rgb(0 0 0 / 76%) 0%',
              'transparent 42%',`,
          );
          replaceExact(
            verifier,
            `  '正数不加正号并使用绿色，负数保留负号并使用红色',`,
            `  '正数不加正号并使用绿色，负数显示绝对值、不显示负号并使用红色',
              '不得恢复“正数不加正号并使用绿色，负数保留负号并使用红色”的旧规则',`,
          );
          replaceExact(
            verifier,
            `      '盈利为绿色且不加正号，亏损为红色且保留负号',`,
            `      '盈利为绿色且不加正号，亏损为红色、显示绝对值且不显示负号',
                  '不得恢复“盈利为绿色且不加正号，亏损为红色且保留负号”的旧规则',
                  '上下两层黑色渐变',
                  '中央主体区域保持透明',`,
          );
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Run targeted verification
        shell: bash
        run: |
          set -euo pipefail
          npm run verify:facility-artwork
          node scripts/verify-recipe-profit-analysis.mjs
          node scripts/verify-unified-factory-recipes-grid.mjs
          node scripts/verify-industry-catalog.mjs

      - name: Build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Test browser runtime
        run: npm run test:browser

      - name: Commit verified final changes
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/finalize-facility-card-readability.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m '完善工厂卡片可读性回归'
          git push origin HEAD:${{ github.head_ref }}
