name: C2 temporary sync cleanup

on:
  push:
    branches:
      - feature/c2-production-methods

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove temporary synchronization files
        run: |
          rm -f scripts/sync-c2-production-docs.mjs
          rm -f .github/workflows/c2-production-doc-sync.yml
          rm -f .github/workflows/c2-production-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u -- scripts/sync-c2-production-docs.mjs .github/workflows/c2-production-doc-sync.yml .github/workflows/c2-production-cleanup.yml
          git commit -m "chore: remove temporary C2 authority sync"
          git push origin HEAD:feature/c2-production-methods