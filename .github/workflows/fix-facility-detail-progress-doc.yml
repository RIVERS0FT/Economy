name: Fix facility detail progress documentation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Clarify production progress rule
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('docs/UI_DESIGN_SYSTEM.md')
          source = path.read_text()
          old = '公式、操作数据带和进度共同组成“生产结算”，进度条是最后一个可见元素；单厂平均利润只属于工厂信息区。'
          new = '公式、操作数据带和进度共同组成“生产结算”；生产进度位于数据带下方，并且是生产结算最后一个可见元素；单厂平均利润只属于工厂信息区。'
          if source.count(old) != 1:
              raise SystemExit(f'expected one progress rule, found {source.count(old)}')
          path.write_text(source.replace(old, new, 1))
          Path('.github/workflows/fix-facility-detail-progress-doc.yml').unlink()
          PY
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- docs/UI_DESIGN_SYSTEM.md .github/workflows/fix-facility-detail-progress-doc.yml
          git commit -m "明确生产结算进度位置"
          git push origin HEAD:${{ github.head_ref }}
