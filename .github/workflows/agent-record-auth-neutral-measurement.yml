name: Record authentication neutral measurement rules

on:
  push:
    branches:
      - agent/official-auth-liquid-glass

permissions:
  contents: write

jobs:
  record:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record authoritative rules
        run: |
          set -euo pipefail
          # Apply every design and guard update as one atomic operation.
          python3 .agent/record-auth-neutral-measurement.py
          rm -f .agent/record-auth-neutral-measurement.py
          rm -f .github/workflows/agent-record-auth-neutral-measurement.yml
          rmdir .agent 2>/dev/null || true
          git diff --check
      - name: Commit authoritative rules
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "记录认证液态玻璃中性测量规则"
          git push origin HEAD:agent/official-auth-liquid-glass
