name: Fix final server market tests

on:
  push:
    branches:
      - codex/daily-system-market

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/codex-fix-final-server-market-tests.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "收口剩余即时市场服务器测试"
          git push origin HEAD:codex/daily-system-market
