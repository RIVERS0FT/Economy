name: Temporary Fix State 39 Design

on:
  push:
    branches:
      - feature/daily-regional-supply-contracts-impl

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/daily-regional-supply-contracts-impl
          fetch-depth: 0
      - name: Update authoritative client state baseline
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('docs/SERVER_ARCHITECTURE_AND_DEPLOYMENT_DESIGN.md')
          text = path.read_text()
          count = text.count('当前客户端状态版本为 38')
          if count < 2:
              raise SystemExit(f'expected at least two stale client-state baselines, found {count}')
          path.write_text(text.replace('当前客户端状态版本为 38', '当前客户端状态版本为 39'))
          PY
          rm .github/workflows/temp-fix-state39-design.yml
          git config user.name "RIVERSOFT"
          git config user.email "105160096+RIVERS0FT@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "同步客户端协议 39 权威设计基线"
          git push origin HEAD:feature/daily-regional-supply-contracts-impl
