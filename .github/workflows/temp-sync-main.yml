name: Temporary Sync Latest Main

on:
  push:
    branches:
      - feature/daily-regional-supply-contracts-impl

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/daily-regional-supply-contracts-impl
          fetch-depth: 0
      - name: Merge latest main with authoritative design resolution
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "RIVERSOFT"
          git config user.email "105160096+RIVERS0FT@users.noreply.github.com"
          git fetch origin main
          set +e
          git merge --no-edit origin/main
          merge_status=$?
          set -e
          if [ "$merge_status" -ne 0 ]; then
            unmerged="$(git diff --name-only --diff-filter=U)"
            if [ "$unmerged" != "docs/SERVER_ARCHITECTURE_AND_DEPLOYMENT_DESIGN.md" ]; then
              echo "Unexpected merge conflicts:"
              printf '%s\n' "$unmerged"
              exit 1
            fi
            git checkout --ours docs/SERVER_ARCHITECTURE_AND_DEPLOYMENT_DESIGN.md
            python3 - <<'PY'
          from pathlib import Path

          path = Path('docs/SERVER_ARCHITECTURE_AND_DEPLOYMENT_DESIGN.md')
          text = path.read_text()
          old_transport = """跨州运输把 `world.transportShipments` 作为顶层 segment 随事务持久化，并在世界截止时间规划器注册运输到达边界；多站点运输按 `stopPlan` 注册“下一未交付站”的最早截止时间，到期把对应交付数量的源州 `inTransit` 转入该站 `available`，整链完成后才把 shipment 置为 `arrived`。玩家运输路线直接保存在对应玩家分段状态的 `transportRoutes` 中，每人最多 50 条，站点序列无上限；路线 CRUD 只修改当前玩家行，路线发运继续复用同一个 `transportShip` 权威动作并修改当前玩家、`transportShipments` 与既有运输就业资金域。路线不会自动循环、离线定时或新增后台扫描器，删除路线不得删除已经在途的 shipment。"""
          new_transport = """跨州运输把 `world.transportShipments` 作为顶层 segment 随事务持久化，并在世界截止时间规划器注册运输到达边界；多站点运输继续按 `stopPlan` 注册“下一未交付站”的最早截止时间，shipment 同时固化多商品 `manifest` 与逐段权威时间／载荷 `legPlan`。到达某站时只把 `manifest` 中目的地为该站的源州 `inTransit` 转入该站 `available`，整链完成后才把 shipment 置为 `arrived`。玩家运输路线直接保存在对应玩家分段状态的 `transportRoutes` 中，每人最多 50 条、站点序列无上限；运输路线不保存商品、数量或自动发运开关，只保存 ID、名称、路径、行程、运输方式和时间戳。路线创建、地图编辑保存、重命名和删除继续复用 `transportShip` 权威动作，普通玩家不存在 `route-dispatch` 手动发运操作。有运输在途时禁止删除路线，路线编辑不得改写已经出发 shipment 的 `manifest`、`stopPlan` 或 `legPlan`。服务器只在既有正常世界推进末尾检查等待路线：同一路线没有在途运输、玩家全局在途未达上限，并且按当前库存、州级参考价、运输容量和资金能够形成整趟正预期净价差 `manifest` 时立即自动发运；条件不足只保持等待，不产生失败写入。每条路线同时最多一笔在途运输，整链完成后可在同一次正常世界推进末尾重新检查下一趟；不得新增运输专用轮询器、离线定时器或后台扫描器。"""
          if old_transport not in text:
              raise SystemExit('missing legacy transport design block during merge resolution')
          text = text.replace(old_transport, new_transport, 1)

          old_visibility = "合同审计查询只允许发布者、采购方或供应方本人访问，不参与普通状态认证缓存之外的写操作，不改变世界修订号。"
          new_visibility = "合同审计查询只允许合同实际参与者访问：发布者以及采购、供货、放贷、贷款、出租、租赁对应玩家均按权威参与关系判定；第三方不可见。审计读取不参与普通状态认证缓存之外的写操作，也不改变世界修订号。"
          if old_visibility not in text:
              raise SystemExit('missing legacy contract audit visibility sentence')
          text = text.replace(old_visibility, new_visibility, 1)
          path.write_text(text)
          PY
            git add docs/SERVER_ARCHITECTURE_AND_DEPLOYMENT_DESIGN.md
          fi
          rm -f .github/workflows/temp-sync-main.yml scripts/temp-sync-conflict.txt
          git add -A
          git diff --cached --check
          git commit -m "同步最新 main 并合并合同与自动物流设计"
          git push origin HEAD:feature/daily-regional-supply-contracts-impl
