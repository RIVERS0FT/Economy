name: Temporary Sync Latest Main

on:
  push:
    branches:
      - feature/daily-regional-supply-contracts-impl

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/daily-regional-supply-contracts-impl
          fetch-depth: 0
      - name: Diagnose merge conflicts
        shell: bash
        run: |
          set -uo pipefail
          git config user.name "RIVERSOFT"
          git config user.email "105160096+RIVERS0FT@users.noreply.github.com"
          git fetch origin main
          if git merge --no-edit origin/main; then
            rm -f .github/workflows/temp-sync-main.yml
            git add -A
            git diff --cached --check
            git commit -m "同步最新 main 并清理临时工作流"
            git push origin HEAD:feature/daily-regional-supply-contracts-impl
            exit 0
          fi
          {
            echo 'UNMERGED FILES'
            git diff --name-only --diff-filter=U
            echo
            echo 'CONFLICT DIFF'
            git diff --cc
          } > scripts/temp-sync-conflict.txt
          git merge --abort
          git add scripts/temp-sync-conflict.txt
          git commit -m "记录最终主线合并冲突"
          git push origin HEAD:feature/daily-regional-supply-contracts-impl
          exit 1
