name: Agent Contract History Rewrite

on:
  push:
    branches:
      - agent/history-contract-results-republish
    paths:
      - '.agent/contract-history-rewrite.part-*'
      - '.github/workflows/agent-contract-history-rewrite.yml'

permissions:
  contents: write

jobs:
  rewrite-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/history-contract-results-republish
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.4.0
          cache: npm

      - name: Assemble and apply contract history rewrite
        shell: bash
        run: |
          set -euo pipefail
          cat .agent/contract-history-rewrite.part-* > /tmp/contract-history-rewrite.mjs
          echo '6ebc91fb22d4f308a9b5a06766497a42d91dce871c11402e79cca40c4eb7cbe5  /tmp/contract-history-rewrite.mjs' | sha256sum --check
          node --check /tmp/contract-history-rewrite.mjs
          node /tmp/contract-history-rewrite.mjs

      - name: Install dependencies
        run: npm ci

      - name: Verify contract rules and focused server behavior
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-contract-audit.mjs
          node scripts/verify-contract-layout.mjs
          node --test server/test/contract-audit.test.js
          npm run typecheck

      - name: Build website and run authoritative tests
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run focused contract browser tests
        run: npx playwright test tests/browser/contract-layout.spec.ts

      - name: Run complete browser suite
        run: npm run test:browser

      - name: Validate and commit final tree
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          rm -f .agent/contract-history-rewrite.part-* .github/workflows/agent-contract-history-rewrite.yml
          rmdir .agent 2>/dev/null || true

          expected_file="$(mktemp)"
          actual_file="$(mktemp)"
          cat > "$expected_file" <<'FILES'
          docs/PAGE_CONTENT_AND_NAVIGATION_DESIGN.md
          docs/SERVER_ARCHITECTURE_AND_DEPLOYMENT_DESIGN.md
          scripts/verify-contract-audit.mjs
          scripts/verify-contract-layout.mjs
          server/src/contract-audit-store.js
          server/test/contract-audit.test.js
          src/contracts/api.ts
          src/contracts/types.ts
          src/pages/ContractPage.tsx
          src/styles/contract-audit.css
          tests/browser/contract-layout.spec.ts
          FILES
          git diff --name-only 5e8a8ce9dbe868038dd8fae1f860ec1842e20465...HEAD | grep -v '^\.agent/' | grep -v '^\.github/workflows/agent-contract-history-rewrite.yml$' | sort -u > "$actual_file"
          git diff --name-only | grep -v '^\.agent/' | grep -v '^\.github/workflows/agent-contract-history-rewrite.yml$' | sort -u >> "$actual_file"
          sort -u -o "$actual_file" "$actual_file"
          diff -u "$expected_file" "$actual_file"
          git diff --check

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            docs/PAGE_CONTENT_AND_NAVIGATION_DESIGN.md \
            docs/SERVER_ARCHITECTURE_AND_DEPLOYMENT_DESIGN.md \
            scripts/verify-contract-audit.mjs \
            scripts/verify-contract-layout.mjs \
            server/src/contract-audit-store.js \
            server/test/contract-audit.test.js \
            src/contracts/api.ts \
            src/contracts/types.ts \
            src/pages/ContractPage.tsx \
            src/styles/contract-audit.css \
            tests/browser/contract-layout.spec.ts \
            .agent/contract-history-rewrite.part-00 \
            .agent/contract-history-rewrite.part-01 \
            .agent/contract-history-rewrite.part-02 \
            .agent/contract-history-rewrite.part-03 \
            .agent/contract-history-rewrite.part-04 \
            .agent/contract-history-rewrite.part-05 \
            .github/workflows/agent-contract-history-rewrite.yml
          git diff --cached --check
          git commit -m '精简历史合同并支持重新拟定'
          git push origin HEAD:agent/history-contract-results-republish
