name: Apply facility detail layout from PR

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Execute embedded layout patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/apply-facility-detail-layout.yml').read_text()
          marker = "          python3 - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY\n", start)
          script = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in workflow[start:end].splitlines()
          )

          header_start = script.index(
              "replace_once(\n    mobile_path,\n    '''          <div className=\"facility-detail-sheet-header\">",
          )
          body_start = script.index(
              "replace_once(\n    mobile_path,\n    '''            <FacilityClusterDetailBody",
              header_start,
          )
          header_replacement = r'''sub_once(
              mobile_path,
              r'\s*<div className="facility-detail-sheet-header">[\s\S]*?</div>\n\n(?=\s*<ScrollArea)',
              '''          <div className="facility-detail-sheet-header">
                <div className="facility-detail-sheet-drag-handle" aria-hidden="true">
                  <span className="facility-detail-sheet-handle" />
                </div>
              </div>

''',
          )
          '''
          script = script[:header_start] + header_replacement + script[body_start:]

          body_start = script.index(
              "replace_once(\n    mobile_path,\n    '''            <FacilityClusterDetailBody",
          )
          body_end = script.index("\n\nformula_path =", body_start)
          body_replacement = r'''sub_once(
              mobile_path,
              r'\s*<FacilityClusterDetailBody[\s\S]*?/>\n(?=\s*</ScrollArea>)',
              '''            <FacilityClusterInformation
                entry={entry}
                products={products}
                inventories={inventories}
                now={now}
                onToggle={onToggle}
                titleId="mobile-facility-detail-title"
              />
              <FacilityClusterDetailBody
                entry={entry}
                products={products}
                inventories={inventories}
                now={now}
                onRecipeChange={onRecipeChange}
              />
''',
          )
          '''
          script = script[:body_start] + body_replacement + script[body_end:]

          artwork_start = script.index(
              "replace_once(\n    artwork_css,\n    '''  .facility-detail-artwork {",
          )
          artwork_end = script.index("\n\nprofit_css =", artwork_start)
          artwork_replacement = r'''sub_once(
              artwork_css,
              r'  \.facility-detail-artwork \{[\s\S]*?aspect-ratio: 16 / 5;[\s\S]*?\n  \}',
              '''  .facility-detail-artwork {
                min-height: 0;
                aspect-ratio: 4 / 5;
              }''',
          )
          '''
          script = script[:artwork_start] + artwork_replacement + script[artwork_end:]

          exec(compile(script, 'embedded-facility-detail-layout.py', 'exec'))
          PY

          rm -f .github/workflows/apply-facility-detail-layout-pr.yml
          rm -f facility-detail-layout-trigger.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- \
            docs/INDUSTRY_AND_PRODUCTION_DESIGN.md \
            docs/PRODUCTION_PILL_ALIGNMENT_DESIGN.md \
            docs/UI_DESIGN_SYSTEM.md \
            scripts/verify-facility-artwork.mjs \
            scripts/verify-facility-groups.mjs \
            scripts/verify-recipe-profit-analysis.mjs \
            scripts/verify-unified-factory-recipes-grid.mjs \
            src/components/facilities/FacilityProductionFormula.tsx \
            src/pages/production/MobileFacilityDetailSheet.tsx \
            src/pages/production/ProductionFacilityDetail.tsx \
            src/styles/facility-artwork.css \
            src/styles/facility-detail-sheet.css \
            src/styles/facility-group-card-grid.css \
            src/styles/facility-recipe-profit-analysis.css \
            src/styles/production-surface.css \
            tests/browser/facility-detail-sheet.spec.ts \
            tests/browser/production-methods.spec.ts \
            .github/workflows/apply-facility-detail-layout.yml \
            .github/workflows/apply-facility-detail-layout-pr.yml \
            facility-detail-layout-trigger.txt
          git commit -m "重构工厂详情纵向信息层级"
          git push origin HEAD:${{ github.head_ref }}
