name: Apply facility detail layout from PR

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Execute standalone layout patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/apply-facility-detail-layout-v2.yml').read_text()
          marker = "          python3 - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY\n", start)
          script = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in workflow[start:end].splitlines()
          )
          exec(compile(script, 'facility-detail-layout-v2.py', 'exec'))
          PY

          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- \
            docs/INDUSTRY_AND_PRODUCTION_DESIGN.md \
            docs/PRODUCTION_PILL_ALIGNMENT_DESIGN.md \
            docs/UI_DESIGN_SYSTEM.md \
            scripts/verify-facility-artwork.mjs \
            scripts/verify-facility-groups.mjs \
            scripts/verify-recipe-profit-analysis.mjs \
            scripts/verify-unified-factory-recipes-grid.mjs \
            src/components/facilities/FacilityProductionFormula.tsx \
            src/pages/production/MobileFacilityDetailSheet.tsx \
            src/pages/production/ProductionFacilityDetail.tsx \
            src/styles/facility-artwork.css \
            src/styles/facility-detail-sheet.css \
            src/styles/facility-group-card-grid.css \
            src/styles/facility-recipe-profit-analysis.css \
            src/styles/production-surface.css \
            tests/browser/facility-detail-sheet.spec.ts \
            tests/browser/production-methods.spec.ts \
            .github/workflows/apply-facility-detail-layout.yml \
            .github/workflows/apply-facility-detail-layout-pr.yml \
            .github/workflows/apply-facility-detail-layout-v2.yml \
            facility-detail-layout-trigger.txt
          git commit -m "重构工厂详情纵向信息层级"
          git push origin HEAD:${{ github.head_ref }}
