name: Patch facility summary three rows retry

on:
  push:
    branches:
      - fix/facility-summary-three-rows

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply corrected patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/patch-facility-summary-three-rows.yml').read_text().splitlines()
          start = workflow.index("          python3 - <<'PY'") + 1
          end = workflow.index('          PY', start)
          patch_source = '\n'.join(line[10:] if line.startswith('          ') else line for line in workflow[start:end])
          exec(compile(patch_source, 'facility-summary-patch.py', 'exec'), {})

          path = Path('scripts/verify-production-settlement-layout.mjs')
          text = path.read_text()
          old = "  '运行中／冻结中／抵押中数量明细、单厂平均利润与满员率全部位于插画右侧主信息区',\n"
          new = "  '插画右侧主信息固定为三行',\n  '单厂平均利润固定第二行且只显示标题和值',\n"
          if text.count(old) != 1:
              raise SystemExit(f'production authority assertion: expected 1 match, got {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          node scripts/verify-production-settlement-layout.mjs
          node scripts/verify-unified-factory-recipes-grid.mjs
          node scripts/verify-facility-groups.mjs
          git diff --check
      - name: Commit update
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/components/facilities/FacilityRecipeProfitAnalysis.tsx \
            src/styles/facility-recipe-profit-analysis.css \
            src/styles/facility-group-card-grid.css \
            tests/browser/production-methods.spec.ts \
            scripts/verify-production-settlement-layout.mjs \
            scripts/verify-unified-factory-recipes-grid.mjs \
            scripts/verify-facility-groups.mjs \
            docs/INDUSTRY_AND_PRODUCTION_DESIGN.md \
            docs/UI_DESIGN_SYSTEM.md
          git commit -m "调整工厂摘要为三行布局"
          git push origin HEAD:fix/facility-summary-three-rows
