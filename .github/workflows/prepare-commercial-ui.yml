name: Prepare commercial building UI

on:
  push:
    branches: [codex/align-commercial-building-ui]
    paths:
      - .github/workflows/prepare-commercial-ui.yml
      - .github/commercial-ui-transform.py
      - .github/commercial-harness-fragment.tsx

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/align-commercial-building-ui
          fetch-depth: 0
      - name: Apply reviewed source and design edits
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/commercial-ui-transform.py
          git diff --check
          git add src tests docs scripts/verify-unified-factory-recipes-grid.mjs runtime-test.html
          git diff --cached --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: align commercial building cards and details with industrial UI'
          git push origin HEAD:codex/align-commercial-building-ui
