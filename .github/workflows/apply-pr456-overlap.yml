name: Apply PR 456 Overlap Merge

on:
  push:
    branches:
      - agent/recover-pr450-bundle
  pull_request:
    branches:
      - main

concurrency:
  group: apply-pr456-overlap-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/recover-pr450-bundle
          fetch-depth: 0
      - name: Apply validated overlap patch
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          ready_file=.github/pr456-overlap.ready
          parts=(.github/pr456-overlap.patch.gz.b64.part*)
          if [ ! -f "$ready_file" ]; then
            echo "Overlap bundle is not ready."
            exit 0
          fi
          if [ "${#parts[@]}" -eq 0 ]; then
            echo "Overlap bundle parts are missing." >&2
            exit 1
          fi
          patch_file="$RUNNER_TEMP/pr456-overlap.patch"
          cat "${parts[@]}" | base64 --decode | gzip --decompress > "$patch_file"
          echo "320566e865af37e2415fc3fd1f4e0f4311a1be438fffa5842ec73b8b2720ae80  $patch_file" | sha256sum --check
          mapfile -t patch_paths < <(git apply --numstat "$patch_file" | awk '{ print $3 }')
          git apply --check "$patch_file"
          git apply "$patch_file"
          rm -- "$ready_file" "${parts[@]}"
          git add -- "${patch_paths[@]}" "$ready_file" "${parts[@]}"
          git diff --cached --check
          git config user.name "RIVERS0FT Automation"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "chore: merge latest main overlap rules"
          git push origin HEAD:agent/recover-pr450-bundle
