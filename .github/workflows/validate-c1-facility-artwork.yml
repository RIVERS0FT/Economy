name: Validate C1 Facility Artwork

on:
  push:
    branches:
      - agent/c1-facility-artwork

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/c1-facility-artwork
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.4.0
          cache: npm

      - name: Validate build and browser runtime
        shell: bash
        run: |
          set -Eeuo pipefail

          configure_git() {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          }

          report_failure() {
            status=$?
            trap - ERR
            configure_git
            cp /tmp/c1-validation.log .github/c1-validation.log || true
            printf 'C1 validation failed with exit code %s\n' "$status" > .github/c1-validation-failed.txt
            git add -A .github/c1-validation.log .github/c1-validation-failed.txt .github/c1-validation-success.txt
            git commit -m "记录 C1 插画验证失败" || true
            git push origin HEAD:agent/c1-facility-artwork || true
            exit "$status"
          }
          trap report_failure ERR

          rm -f .github/c1-validation-success.txt .github/c1-validation-failed.txt .github/c1-validation.log
          exec > >(tee /tmp/c1-validation.log) 2>&1
          npm ci
          npm run build
          npx playwright install --with-deps chromium
          npm run test:browser

          configure_git
          printf '%s\n' \
            'npm ci: passed' \
            'npm run build: passed' \
            'npm run test:browser: passed' \
            > .github/c1-validation-success.txt
          git add -A .github/c1-validation-success.txt .github/c1-validation-failed.txt .github/c1-validation.log
          git commit -m "记录 C1 插画验证通过"
          git push origin HEAD:agent/c1-facility-artwork
