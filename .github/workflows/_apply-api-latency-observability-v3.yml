name: Apply API latency observability v3

on:
  push:
    branches:
      - perf/api-latency-observability-v3

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.event.head_commit.message == 'Run API latency observability patch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/api-latency-observability-v3
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.4.0'
          cache: npm
      - name: Apply guarded patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/.apply-api-latency-observability-v3.mjs')
          source = path.read_text()
          source = source.replace("`${label} 必须直接读取已提交世界`", "label + ' 必须直接读取已提交世界'")
          source = source.replace("`${label} 只读接口不得进入权威写队列`", "label + ' 只读接口不得进入权威写队列'")
          path.write_text(source)
          PY
          node --check scripts/.apply-api-latency-observability-v3.mjs
          node scripts/.apply-api-latency-observability-v3.mjs
          git diff --check
      - name: Install dependencies
        run: npm ci
      - name: Run focused regression
        run: |
          node --test \
            server/test/request-metrics.test.js \
            server/test/admin-summary.test.js \
            server/test/runtime-hotpath-architecture.test.js \
            server/test/authoritative-hotpaths.test.js \
            server/test/server-status.test.js
          npm run verify:runtime-efficiency
          npm run verify:authoritative-hotpaths
      - name: Run full build verification
        run: npm run build
      - name: Commit verified patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f \
            .github/workflows/_apply-api-latency-observability-v3.yml \
            scripts/.apply-api-latency-observability-v3.mjs
          git add \
            server/src/request-metrics.js \
            server/src/admin-summary.js \
            server/src/app.js \
            server/src/runtime-store-core.js \
            server/src/storage.js \
            server/src/runtime-action-executor.js \
            server/test/request-metrics.test.js \
            server/test/admin-summary.test.js \
            scripts/verify-runtime-efficiency.mjs \
            docs/SERVER_ARCHITECTURE_AND_DEPLOYMENT_DESIGN.md \
            docs/README.md
          git diff --check
          git diff --cached --check
          if git status --porcelain | grep -Eq '^.[^ ]|^\?\?'; then
            echo 'Unexpected unstaged or untracked files after verification:' >&2
            git status --short >&2
            exit 1
          fi
          git status --short
          git commit -m '修复 API 响应统计并降低管理员只读延迟'
          git push origin perf/api-latency-observability-v3
