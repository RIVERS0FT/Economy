name: Validate global building row interactions

on:
  push:
    branches:
      - fix/global-building-row-interactions

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/global-building-row-interactions
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.4.0
          cache: npm
      - name: Apply implementation and design updates
        run: |
          python .codex-global-building-row-fix-bootstrap.py
          python .codex-global-building-row-fix.py
          python .codex-global-building-row-fix-verifier.py
          python .codex-global-building-row-fix-padding.py
          python .codex-global-building-row-fix-geometry.py
          python .codex-global-building-region-two-line.py
          python - <<'PY'
          from pathlib import Path
          path = Path('src/styles/global-operation-pages.css')
          path.write_text(path.read_text(encoding='utf-8').rstrip() + '\n', encoding='utf-8', newline='\n')
          PY
      - name: Install dependencies
        run: npm ci
      - name: Plan validation
        shell: bash
        run: |
          git diff --check
          git diff --name-only > /tmp/changed-files.txt
          node scripts/select-ci-tests.mjs plan --changed-files-file /tmp/changed-files.txt --plan-file /tmp/ci-plan.json
          cat /tmp/ci-plan.json
      - name: Run full checks
        shell: bash
        run: |
          node scripts/verify-deployment-pipeline.mjs
          npm run build
      - name: Prepare browser
        run: bash scripts/prepare-playwright-chromium.sh
      - name: Run focused browser checks
        env:
          PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: /usr/bin/google-chrome
        run: npx playwright test tests/browser/global-operation-pages.spec.ts tests/browser/all-pages-preview.spec.ts tests/browser/player-page-geometry.spec.ts
      - name: Run full browser checks
        env:
          PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: /usr/bin/google-chrome
        run: npm run test:browser
      - name: Commit validated change
        shell: bash
        run: |
          rm .codex-global-building-row-fix.py
          rm .codex-global-building-row-fix-bootstrap.py
          rm .codex-global-building-row-fix-verifier.py
          rm .codex-global-building-row-fix-padding.py
          rm .codex-global-building-row-fix-geometry.py
          rm .codex-global-building-region-two-line.py
          rm .github/workflows/codex-global-building-row-fix.yml
          git diff --check
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "修复建筑条目交互与地区生产下拉"
          git push origin HEAD:fix/global-building-row-interactions