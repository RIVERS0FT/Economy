name: Diagnose doc compression merge

on:
  push:
    branches:
      - docs/design-authority-compression-current-20260902

permissions:
  contents: read

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Diagnose merge with main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          set +e
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge --no-commit --no-ff refs/remotes/origin/main
          code=$?
          echo "MERGE_EXIT=$code"
          echo "CONFLICTS_BEGIN"
          git diff --name-only --diff-filter=U
          echo "CONFLICTS_END"
          git merge --abort >/dev/null 2>&1 || true
          exit $code
