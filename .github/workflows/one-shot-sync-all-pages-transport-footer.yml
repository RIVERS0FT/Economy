name: One-shot sync all-pages transport footer

on:
  push:
    branches:
      - codex/transport-route-cards-footer

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: codex/transport-route-cards-footer
          fetch-depth: 0
      - name: Sync all-pages transport footer locator
        shell: python
        run: |
          from pathlib import Path

          path = Path('tests/browser/all-pages-preview.spec.ts')
          text = path.read_text(encoding='utf-8')
          old = "const addRouteButton = transportContent.locator('.transport-page-actions').getByRole('button', { name: '增加路线', exact: true });"
          new = "const addRouteButton = transportContent.locator('.transport-page-footer').getByRole('button', { name: '增加路线', exact: true });"
          if old not in text:
              raise SystemExit('stale all-pages transport action locator not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
      - name: Commit sync and remove one-shot workflow
        run: |
          git config user.name "RIVERSOFT"
          git config user.email "105160096+RIVERS0FT@users.noreply.github.com"
          rm .github/workflows/one-shot-sync-all-pages-transport-footer.yml
          git add tests/browser/all-pages-preview.spec.ts .github/workflows/one-shot-sync-all-pages-transport-footer.yml
          git commit -m "Sync all-pages transport footer locator"
          git push origin HEAD:codex/transport-route-cards-footer
