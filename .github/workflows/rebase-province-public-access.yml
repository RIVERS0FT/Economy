name: Rebase province public access

on:
  push:
    branches:
      - feat/province-public-overview-market
    paths:
      - .github/workflows/rebase-province-public-access.yml

permissions:
  contents: write

jobs:
  rebase-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/province-public-overview-market
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.4.0
          cache: npm

      - name: Merge latest main and resolve authority docs
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git merge --no-commit --no-ff origin/main; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            printf 'Merge conflicts:\n%s\n' "$conflicts"
            expected=$'docs/PAGE_CONTENT_AND_NAVIGATION_DESIGN.md\ndocs/WAREHOUSE_EXPANSION_DESIGN.md'
            if [ "$conflicts" != "$expected" ]; then
              echo 'Unexpected conflict set; refusing automatic resolution.'
              exit 1
            fi
            git checkout --theirs docs/PAGE_CONTENT_AND_NAVIGATION_DESIGN.md docs/WAREHOUSE_EXPANSION_DESIGN.md
            python3 - <<'PY'
          from pathlib import Path

          page = Path('docs/PAGE_CONTENT_AND_NAVIGATION_DESIGN.md')
          text = page.read_text(encoding='utf-8')
          anchor = '两者都不得创建第二套订单簿、生产状态或地区选择下拉框；`ProvincePage` 内的市场与建筑分区仍始终是地图所打开当前州的本地视图。'
          rule = '州级上下文页不得因地区未解锁而整页拦截。概览无论解锁状态都显示官方常住人口以及该玩家在该州的只读经营摘要，且概览不得显示解锁信息或解锁按钮；市场无论解锁状态都允许查看商品目录、行情和订单簿，未解锁时必须为只读，隐藏或禁用下单、自动交易、撤单等市场写入口。建筑与仓库只有已解锁州才显示经营内容，未解锁时各自在本分区显示距离、费用、当前资金和统一解锁按钮。一级市场商品的地区行情列表与一级建筑工厂的地区列表只允许出现当前玩家已解锁州，不能因为锁定州的概览或市场可查看就把锁定州加入这些全局经营钻取列表。'
          if text.count(anchor) != 1:
              raise SystemExit('page authority anchor mismatch')
          if rule not in text:
              text = text.replace(anchor, anchor + '\n\n' + rule, 1)
          page.write_text(text, encoding='utf-8')

          warehouse = Path('docs/WAREHOUSE_EXPANSION_DESIGN.md')
          text = warehouse.read_text(encoding='utf-8')
          old = '- 当前地区的完整仓库管理入口只位于隐藏 `ProvincePage` 的“仓库”分区；仓库不承担设施升级、自动交易设置、跨州运输发货或运输记录，跨州运输唯一显示在独立运输页。'
          new = '- 当前地区的完整仓库管理入口只位于隐藏 `ProvincePage` 的“仓库”分区；仅已解锁州显示本地库存内容，未解锁州只显示该分区自己的地区解锁信息与解锁按钮。仓库不承担设施升级、自动交易设置、跨州运输发货或运输记录，跨州运输唯一显示在独立运输页。'
          if text.count(old) != 1:
              raise SystemExit('warehouse authority anchor mismatch')
          warehouse.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
            git add docs/PAGE_CONTENT_AND_NAVIGATION_DESIGN.md docs/WAREHOUSE_EXPANSION_DESIGN.md
          fi
          if git diff --name-only --diff-filter=U | grep -q .; then
            git diff --name-only --diff-filter=U
            exit 1
          fi
          git commit -m 'chore: align province access with latest main'
          git diff --check origin/main...HEAD

      - name: Install dependencies
        run: npm ci

      - name: Verify merged implementation
        run: |
          node scripts/verify-page-content.mjs
          npm run verify:provincial-economy
          node --experimental-strip-types scripts/verify-market-assets.mjs
          node scripts/verify-market-page-layout.mjs
          npm run build

      - name: Prepare Chromium
        run: bash scripts/prepare-playwright-chromium.sh

      - name: Verify browser behavior
        run: |
          npx playwright test tests/browser/province-locked-access.spec.ts
          npm run test:browser

      - name: Clean temporary workflow and push
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/rebase-province-public-access.yml
          git add -A
          git commit -m 'chore: remove temporary merge workflow'
          git push origin HEAD:feat/province-public-overview-market
