name: Export Unify Mobile Detail Sheet

on:
  push:
    branches:
      - agent/unify-mobile-detail-sheet

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/unify-mobile-detail-sheet
          fetch-depth: 0
      - name: Create archive
        run: tar --exclude=.git --exclude=node_modules --exclude=dist --exclude=test-results --exclude=playwright-report -czf /tmp/unify-mobile-detail-sheet.tar.gz .
      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: unify-mobile-detail-sheet-source
          path: /tmp/unify-mobile-detail-sheet.tar.gz
          retention-days: 1
