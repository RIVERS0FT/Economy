name: Production-only test isolation
on:
  push:
    branches: [fix/market-contract-summary-cleanup-20260906]
    paths: [.github/workflows/production-only-test-isolation.yml]
permissions:
  contents: write
jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.4.0
          cache: npm
      - run: npm ci
      - name: Isolate pure-production tests from default automatic trading
        run: |
          set -euo pipefail
          python3 scripts/tmp-disable-auto-operation-in-production-only-tests.py
          git diff --check
      - name: Run previously failing integration tests
        run: |
          set -euo pipefail
          node --test \
            server/test/commercial-facility-isolation.test.js \
            server/test/facility-groups.test.js \
            server/test/production-lazy-settlement.test.js
      - name: Commit tested fixtures only
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            server/test/commercial-facility-isolation.test.js \
            server/test/facility-groups.test.js \
            server/test/production-lazy-settlement.test.js
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'test: isolate pure production checks from automatic trading'
          git push origin HEAD:fix/market-contract-summary-cleanup-20260906
