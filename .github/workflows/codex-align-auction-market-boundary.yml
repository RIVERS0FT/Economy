name: Align auction and instant market authority

on:
  push:
    branches:
      - codex/daily-system-market

permissions:
  contents: write

jobs:
  align:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: node scripts/codex-align-auction-market-boundary.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "对齐拍卖与即时市场文档职责"
          git push origin HEAD:codex/daily-system-market
