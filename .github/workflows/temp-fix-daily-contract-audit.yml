name: Temporary Daily Contract Audit Fix

on:
  push:
    branches:
      - feature/daily-regional-supply-contracts-impl

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/daily-regional-supply-contracts-impl
          fetch-depth: 0
      - name: Apply audit patch
        run: python3 scripts/temp-fix-daily-contract-audit.py
      - name: Patch projection cache
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('server/src/runtime-store.js')
          text = p.read_text()
          old = """  getStateSnapshot(user, knownRevision = null, now = Date.now(), options = {}) {\n    const snapshot = super.getStateSnapshot(user, knownRevision, now, options);\n"""
          new = """  getStateSnapshot(user, knownRevision = null, now = Date.now(), options = {}) {\n    const currentRevision = this.worldCache?.revision;\n    if (currentRevision !== undefined && this.canReuseStateProjection(user.id, now)) {\n      if (Number.isInteger(knownRevision) && Number(knownRevision) === Number(currentRevision)) {\n        return { revision: Number(currentRevision), unchanged: true };\n      }\n      const cachedProjection = this.cachedStateProjection(user.id, currentRevision);\n      if (cachedProjection) return cachedProjection;\n    }\n    const snapshot = super.getStateSnapshot(user, knownRevision, now, options);\n"""
          if old not in text:
              raise SystemExit('missing runtime projection cache anchor')
          p.write_text(text.replace(old, new, 1))
          PY
      - name: Check diff
        run: git diff --check
      - name: Verify daily contract architecture
        run: node scripts/verify-daily-supply-contracts.mjs
      - name: Verify contract audit architecture
        run: node scripts/verify-contract-audit.mjs
      - name: Test daily contracts
        run: node --test server/test/daily-supply-contracts.test.js
      - name: Test state projection cache
        run: node --test server/test/state-projection-cache.test.js
      - name: Commit audit patch
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/temp-fix-daily-contract-audit.yml
          rm scripts/temp-fix-daily-contract-audit.py
          git config user.name "RIVERSOFT"
          git config user.email "105160096+RIVERS0FT@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "补齐每日合同审计与历史完成事实"
          git push origin HEAD:feature/daily-regional-supply-contracts-impl
