name: Build PR 456 Final Branch

on:
  push:
    branches:
      - agent/recover-pr450-bundle
  pull_request:
    branches:
      - main

concurrency:
  group: build-pr456-final-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-final:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/recover-pr450-bundle
          fetch-depth: 0
      - name: Build clean final branch
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          if [ -f .github/pr456-overlap.ready ]; then
            parts=(.github/pr456-overlap.patch.gz.b64.part*)
            test "${#parts[@]}" -gt 0
            patch_file="$RUNNER_TEMP/pr456-overlap.patch"
            cat "${parts[@]}" | base64 --decode | gzip --decompress > "$patch_file"
            echo "320566e865af37e2415fc3fd1f4e0f4311a1be438fffa5842ec73b8b2720ae80  $patch_file" | sha256sum --check
            git apply --check "$patch_file"
            git apply "$patch_file"
            rm -- .github/pr456-overlap.ready "${parts[@]}"
            git add -u -- .github
            mapfile -t overlap_paths < <(git apply --numstat "$patch_file" | awk '{ print $3 }')
            git add -- "${overlap_paths[@]}"
            git config user.name "RIVERS0FT Automation"
            git config user.email "actions@users.noreply.github.com"
            git commit -m "chore: materialize overlap merge for final branch"
          fi

          source_sha="$(git rev-parse HEAD)"
          git fetch origin main
          main_sha="$(git rev-parse origin/main)"
          if [ "$main_sha" != "6a76f330a02a753571a2235624da9d7ccb4a40e1" ]; then
            echo "MAIN_ADVANCED=$main_sha" >&2
            exit 1
          fi

          git diff --name-only "$main_sha...$source_sha" \
            | grep -v '^\.github/pr456-' \
            | grep -v '^\.github/workflows/apply-pr456-overlap\.yml$' \
            | grep -v '^\.github/workflows/build-pr456-final-branch\.yml$' \
            > "$RUNNER_TEMP/formal-paths.txt"

          final_dir="$RUNNER_TEMP/pr456-final"
          git worktree add --detach "$final_dir" "$main_sha"
          while IFS= read -r path; do
            [ -n "$path" ] || continue
            if git cat-file -e "$source_sha:$path" 2>/dev/null; then
              git -C "$final_dir" checkout "$source_sha" -- "$path"
            else
              git -C "$final_dir" rm --ignore-unmatch -- "$path"
            fi
          done < "$RUNNER_TEMP/formal-paths.txt"

          git -C "$final_dir" diff --check
          git -C "$final_dir" config user.name "RIVERS0FT Automation"
          git -C "$final_dir" config user.email "actions@users.noreply.github.com"
          git -C "$final_dir" add --pathspec-from-file="$RUNNER_TEMP/formal-paths.txt"
          git -C "$final_dir" commit -m "feat: optimize onboarding architecture and capacity diagnostics"
          git -C "$final_dir" push --force origin HEAD:agent/pr456-final
