name: Rebuild PR 456 Clean Head

on:
  push:
    branches:
      - agent/recover-pr450-bundle
  workflow_dispatch:

concurrency:
  group: rebuild-pr456-clean-head
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  rebuild-clean-head:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/recover-pr450-bundle
          fetch-depth: 0

      - name: Rebuild on latest main and publish merge result
        shell: bash
        run: |
          set -euo pipefail

          source_sha="$(git rev-parse HEAD)"
          base_sha="6a76f330a02a753571a2235624da9d7ccb4a40e1"
          target_branch="agent/recover-pr450-bundle"
          debug_branch="agent/pr456-merge-debug"

          git fetch origin main --force
          main_sha="$(git rev-parse origin/main)"

          formal_paths="$RUNNER_TEMP/pr456-formal-paths.txt"
          git diff --name-only "$base_sha...$source_sha" \
            | grep -v '^\.github/pr456-' \
            | grep -v '^\.github/workflows/apply-pr456-overlap\.yml$' \
            | grep -v '^\.github/workflows/build-pr456-final-branch\.yml$' \
            | grep -v '^\.github/workflows/finalize-pr456-delivery\.yml$' \
            | grep -v '^test-results/' \
            | sort -u \
            > "$formal_paths"
          test -s "$formal_paths"

          final_dir="$RUNNER_TEMP/pr456-clean"
          merge_dir="$RUNNER_TEMP/pr456-merge"
          mkdir -p "$merge_dir"
          git worktree add --detach "$final_dir" "$main_sha"

          had_conflict=0
          while IFS= read -r path; do
            [ -n "$path" ] || continue

            source_exists=false
            base_exists=false
            main_exists=false
            git cat-file -e "$source_sha:$path" 2>/dev/null && source_exists=true
            git cat-file -e "$base_sha:$path" 2>/dev/null && base_exists=true
            git cat-file -e "$main_sha:$path" 2>/dev/null && main_exists=true

            if [ "$source_exists" = false ]; then
              git -C "$final_dir" rm --ignore-unmatch -- "$path"
              continue
            fi

            if git diff --quiet "$base_sha" "$main_sha" -- "$path"; then
              git -C "$final_dir" checkout "$source_sha" -- "$path"
              continue
            fi

            ours="$merge_dir/ours"
            ancestor="$merge_dir/ancestor"
            theirs="$merge_dir/theirs"
            rm -f "$ours" "$ancestor" "$theirs"
            git show "$source_sha:$path" > "$ours"

            if [ "$base_exists" = true ] && [ "$main_exists" = true ]; then
              git show "$base_sha:$path" > "$ancestor"
              git show "$main_sha:$path" > "$theirs"
              set +e
              git merge-file --diff3 "$ours" "$ancestor" "$theirs"
              merge_status=$?
              set -e
              if [ "$merge_status" -ne 0 ]; then
                had_conflict=1
                echo "Three-way merge conflict retained for inspection: $path"
              fi
              install -D -m 0644 "$ours" "$final_dir/$path"
              continue
            fi

            if [ "$base_exists" = false ] && [ "$main_exists" = true ]; then
              git show "$main_sha:$path" > "$theirs"
              if ! cmp -s "$ours" "$theirs"; then
                had_conflict=1
                {
                  echo '<<<<<<< PR456'
                  cat "$ours"
                  echo '======='
                  cat "$theirs"
                  echo '>>>>>>> MAIN'
                } > "$final_dir/$path"
              fi
              continue
            fi

            install -D -m 0644 "$ours" "$final_dir/$path"
          done < "$formal_paths"

          git -C "$final_dir" config user.name "RIVERS0FT Automation"
          git -C "$final_dir" config user.email "actions@users.noreply.github.com"
          git -C "$final_dir" add -A --pathspec-from-file="$formal_paths"
          git -C "$final_dir" commit -m "feat: rebuild PR 456 on latest main"
          result_sha="$(git -C "$final_dir" rev-parse HEAD)"

          git -C "$final_dir" push --force origin "HEAD:refs/heads/$debug_branch"

          if [ "$had_conflict" -ne 0 ]; then
            echo "Published conflict result to $debug_branch at $result_sha" >&2
            exit 1
          fi

          git -C "$final_dir" diff-tree --check "$result_sha"
          git -C "$final_dir" push \
            --force-with-lease="refs/heads/$target_branch:$source_sha" \
            origin "HEAD:refs/heads/$target_branch"
