name: Finalize auto operation immediate-trade design

on:
  push:
    branches:
      - codex/daily-system-market
    paths:
      - .github/workflows/codex-fix-auto-operation-design.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: node scripts/codex-fix-auto-operation-design.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "收口自动经营即时交易设计"
          git push origin HEAD:codex/daily-system-market
