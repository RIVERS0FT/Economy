name: Apply contract review fixes v2

on:
  push:
    branches:
      - agent/contract-types

permissions:
  contents: write

concurrency:
  group: agent-contract-review-fixes-v2
  cancel-in-progress: false

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/contract-types
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.4.0
          cache: npm
      - name: Apply review fixes
        run: |
          set -euo pipefail
          python3 .agent-contract-review-fixes.py
          rm -f .agent-contract-review-fixes.py
          rm -f .github/workflows/agent-contract-review-fixes.yml
          rm -f .github/workflows/agent-contract-review-fixes-v2.yml
          git add -u -- .agent-contract-review-fixes.py .github/workflows/agent-contract-review-fixes.yml .github/workflows/agent-contract-review-fixes-v2.yml
          git diff --check
      - run: npm ci
      - name: Validate
        run: |
          set -euo pipefail
          node --test server/test/commercial-contracts.test.js
          node scripts/verify-contract-types.mjs
          npm run typecheck
          npm run build
      - name: Commit fixes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- server/src server/test
          git diff --cached --check
          git commit -m "修复合同资产锁与租赁生产协调"
          git push origin HEAD:agent/contract-types
