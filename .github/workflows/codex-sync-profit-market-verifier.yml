name: Sync profit market verifier

on:
  push:
    branches:
      - codex/daily-system-market

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.4.0
          cache: npm
      - run: npm ci
      - run: node scripts/codex-sync-profit-market-verifier.mjs
      - run: npm run generate:local-preview
      - run: node --experimental-strip-types scripts/verify-recipe-profit-analysis.mjs
      - run: node scripts/verify-market-page-layout.mjs
      - run: node scripts/verify-facility-auto-procure.mjs
      - run: npx tsc --noEmit
      - run: git diff --check
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "同步利润分析市场类型收窄验证"
          git push origin HEAD:codex/daily-system-market
