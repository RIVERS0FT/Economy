name: Diagnose Economy database size via PR

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/database-size-diagnostic
          fetch-depth: 0
      - name: Configure SSH
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SERVER_PORT" "$SERVER_HOST" >> ~/.ssh/known_hosts
      - name: Collect read-only SQLite capacity report
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" \
            'if [ "$(id -u)" -eq 0 ]; then exec python3 -; elif command -v sudo >/dev/null 2>&1 && sudo -n true; then exec sudo -n python3 -; else echo ECONOMY_DIAGNOSTIC_PRIVILEGES_UNAVAILABLE >&2; exit 1; fi' \
            > database-size-diagnostic.txt <<'PYTHON'
          import datetime
          import sqlite3
          from pathlib import Path

          database = Path('/var/lib/riversoft-economy/economy.sqlite')
          connection = sqlite3.connect(f'file:{database}?mode=ro', uri=True, timeout=30)
          connection.execute('PRAGMA query_only = ON')

          def scalar(sql, parameters=()):
              row = connection.execute(sql, parameters).fetchone()
              return None if row is None else row[0]

          def section(name):
              print(f'\n=== {name} ===')

          section('FILES')
          for path in (database, Path(str(database) + '-wal'), Path(str(database) + '-shm')):
              print(f'{path.name}\t{path.stat().st_size if path.exists() else 0}')

          page_size = int(scalar('PRAGMA page_size') or 0)
          page_count = int(scalar('PRAGMA page_count') or 0)
          freelist_count = int(scalar('PRAGMA freelist_count') or 0)
          section('PAGES')
          print(f'page_size\t{page_size}')
          print(f'page_count\t{page_count}')
          print(f'freelist_count\t{freelist_count}')
          print(f'allocated_bytes\t{page_size * page_count}')
          print(f'freelist_bytes\t{page_size * freelist_count}')
          print(f'live_page_bytes\t{page_size * max(0, page_count - freelist_count)}')
          print(f'journal_mode\t{scalar("PRAGMA journal_mode")}')
          print(f'auto_vacuum\t{scalar("PRAGMA auto_vacuum")}')

          section('DBSTAT')
          try:
              for name, size, pages, payload, unused in connection.execute('''
                SELECT name, SUM(pgsize), COUNT(*), SUM(payload), SUM(unused)
                FROM dbstat
                GROUP BY name
                ORDER BY SUM(pgsize) DESC, name
              '''):
                  print(f'{name}\tbytes={size}\tpages={pages}\tpayload={payload}\tunused={unused}')
          except sqlite3.Error as error:
              print(f'DBSTAT_UNAVAILABLE\t{error}')

          tables = [row[0] for row in connection.execute('''
            SELECT name FROM sqlite_schema
            WHERE type = 'table' AND name NOT LIKE 'sqlite_%'
            ORDER BY name
          ''')]
          section('ROWS')
          for table in tables:
              quoted = '"' + table.replace('"', '""') + '"'
              try:
                  print(f'{table}\t{scalar(f"SELECT COUNT(*) FROM {quoted}")}')
              except sqlite3.Error as error:
                  print(f'{table}\tERROR={error}')

          section('WORLD')
          if 'economy_world' in tables:
              row = connection.execute('SELECT revision, LENGTH(state_json), updated_at FROM economy_world WHERE id = 1').fetchone()
              if row:
                  print(f'revision\t{row[0]}')
                  print(f'state_json_bytes\t{row[1]}')
                  print(f'updated_at\t{row[2]}')

          section('IDEMPOTENCY')
          if 'economy_idempotency' in tables:
              row = connection.execute('''
                SELECT COUNT(*), COALESCE(SUM(LENGTH(response_json)), 0),
                       COALESCE(MAX(LENGTH(response_json)), 0), MIN(created_at), MAX(created_at)
                FROM economy_idempotency
              ''').fetchone()
              print(f'rows={row[0]}\tresponse_bytes={row[1]}\tmax_response={row[2]}\tfirst={row[3]}\tlast={row[4]}')

          section('CONTRACT_AUDIT')
          if 'economy_contract_audit_events' in tables:
              row = connection.execute('''
                SELECT COUNT(*),
                       COALESCE(SUM(LENGTH(before_json)), 0),
                       COALESCE(SUM(LENGTH(after_json)), 0),
                       COALESCE(SUM(LENGTH(metadata_json)), 0),
                       MIN(occurred_at), MAX(occurred_at)
                FROM economy_contract_audit_events
              ''').fetchone()
              print(f'events={row[0]}\tbefore_bytes={row[1]}\tafter_bytes={row[2]}\tmetadata_bytes={row[3]}\tfirst={row[4]}\tlast={row[5]}')
              for event_type, count in connection.execute('''
                SELECT event_type, COUNT(*)
                FROM economy_contract_audit_events
                GROUP BY event_type
                ORDER BY COUNT(*) DESC, event_type
              '''):
                  print(f'event_type\t{event_type}\t{count}')
          if 'economy_contract_audit_transfers' in tables:
              print(f'transfers\t{scalar("SELECT COUNT(*) FROM economy_contract_audit_transfers")}')
          if 'economy_contract_audit_contracts' in tables:
              row = connection.execute('''
                SELECT COUNT(*), COALESCE(SUM(LENGTH(contract_json)), 0), COALESCE(MAX(LENGTH(contract_json)), 0)
                FROM economy_contract_audit_contracts
              ''').fetchone()
              print(f'contracts={row[0]}\tcontract_json_bytes={row[1]}\tmax_contract_json={row[2]}')

          connection.close()
          PYTHON
      - name: Commit report and remove temporary files
        run: |
          set -euo pipefail
          rm -f .github/workflows/agent-diagnose-database-size.yml
          rm -f .github/workflows/agent-diagnose-database-size-pr.yml
          rm -f .agent/trigger-database-size-diagnostic.txt
          rmdir .agent 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "记录只读数据库容量诊断"
          git push origin HEAD:agent/database-size-diagnostic
