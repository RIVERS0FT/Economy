name: Apply fertilizer factory implementation

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - scripts/fertilizer-bootstrap-ready.txt

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/add-fertilizer-factory' }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.4.0
          cache: npm

      - name: Apply implementation
        shell: bash
        run: |
          cat scripts/apply-fertilizer-factory.py.gz.b64.part-* | base64 -d | gzip -d > "$RUNNER_TEMP/apply-fertilizer-factory.py"
          python3 -m py_compile "$RUNNER_TEMP/apply-fertilizer-factory.py"
          python3 "$RUNNER_TEMP/apply-fertilizer-factory.py"
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              'server/src/domain.js': [('migrated.version = 23', 'migrated.version = 24')],
              'server/src/domain-core.js': [('world.version = 23', 'world.version = 24')],
              'server/src/research.js': [('world.version = 23', 'world.version = 24')],
              'server/src/storage.js': [('world.version = 23', 'world.version = 24')],
              'server/src/runtime-store.js': [('prepared.version = 23', 'prepared.version = 24')],
              'scripts/verify-staple-crops-demand.mjs': [('world.version = 23', 'world.version = 24')],
              'scripts/verify-asset-auctions.mjs': [('prepared.version = 23', 'prepared.version = 24')],
              'server/test/domain.test.js': [('world.version = 23', 'world.version = 24')],
              'scripts/verify-money-precision.mjs': [
                  ('CURRENT_CLIENT_STATE_VERSION = 26', 'CURRENT_CLIENT_STATE_VERSION = 27'),
                  ('MIN_COMPATIBLE_CLIENT_STATE_VERSION = 26', 'MIN_COMPATIBLE_CLIENT_STATE_VERSION = 27'),
                  ('MARKET_DEMAND_MODEL_VERSION = 13', 'MARKET_DEMAND_MODEL_VERSION = 14'),
                  ('world\\.version = 23', 'world\\.version = 24'),
              ],
              'tests/browser/market-runtime.spec.ts': [('toHaveCount(21)', 'toHaveCount(22)')],
          }
          for path, pairs in replacements.items():
              file = Path(path)
              source = file.read_text()
              for old, new in pairs:
                  source = source.replace(old, new)
              file.write_text(source)
          PY

      - name: Install dependencies
        run: npm ci

      - name: Run focused verification
        shell: bash
        run: |
          node scripts/verify-industry-catalog.mjs
          node scripts/verify-production-methods.mjs
          node scripts/verify-staple-crops-demand.mjs
          node scripts/verify-client-state-version.mjs
          npm run verify:product-artwork
          npm run verify:facility-artwork
          node --test server/test/fertilizer-factory.test.js
          git diff --check

      - name: Remove one-time implementation files
        shell: bash
        run: |
          rm -f .github/workflows/apply-fertilizer-factory-pr.yml
          rm -f scripts/apply-fertilizer-factory.py.gz.b64
          rm -f scripts/apply-fertilizer-factory.py.gz.b64.part-*
          rm -f scripts/fertilizer-bootstrap-ready.txt
          git add -A

      - name: Run full production build
        run: npm run build

      - name: Run Chromium regression
        shell: bash
        run: |
          npx playwright install --with-deps chromium
          npm run test:browser

      - name: Publish clean implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "增加化肥厂与化肥产业支线"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
