name: Agent Apply Market Reserve

on:
  push:
    branches:
      - feat/market-reserve-operations-20260808

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[market-reserve-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/market-reserve-operations-20260808
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.4.0
          cache: npm
      - name: Prepare temporary patch runner
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.agent/apply_market_reserve.py')
          source = path.read_text(encoding='utf-8')
          anchor = "function marketReserveGroupFor(world, contract) {"
          replacement = "function addMoney(...values) {\n  return roundInternalMoney(values.reduce((sum, value) => sum + Number(value || 0), 0));\n}\n\nfunction marketReserveGroupFor(world, contract) {"
          if replacement not in source:
              if source.count(anchor) != 1:
                  raise SystemExit('contracts helper anchor unavailable')
              source = source.replace(anchor, replacement, 1)
          source = source.replace('## 4. 商品／工厂资产拍卖', '## 2. 商品与工厂资产拍卖')
          source = source.replace(
              "assert.equal(world.productionContracts?.some((contract) => contract.publisherType === 'market_reserve'), false);",
              "assert.equal(Boolean(world.productionContracts?.some((contract) => contract.publisherType === 'market_reserve')), false);",
          )
          path.write_text(source, encoding='utf-8')
          PY
      - name: Apply implementation patch
        run: python3 .agent/apply_market_reserve.py
      - name: Normalize generated test and authority wording
        run: |
          python3 - <<'PY'
          from pathlib import Path
          test_path = Path('server/test/market-reserve-operations.test.js')
          source = test_path.read_text(encoding='utf-8')
          old = """  assert.equal(accepted.ok, true);\n  assert.equal(contract.status, 'active');\n  assert.ok(reserveGroup(world).frozenCredits >= contract.batchGross + contract.buyerBondCredits);\n  assert.equal(contract.negotiations.length, 0);\n\n  processProductionContracts(world, Number(contract.nextDueAt) + 1);\n  assert.equal(contract.completedDeliveries, 1);\n  assert.equal(reserve.inventory + reserve.frozenInventory, inventoryBefore + contract.quantityPerDelivery);\n  assert.ok(reserveGroup(world).credits + reserveGroup(world).frozenCredits < fundsBefore);\n  assert.ok(supplier.stats.contractGoodsSupplied >= contract.quantityPerDelivery);\n"""
          new = """  assert.equal(accepted.ok, true);\n  const activeContract = world.productionContracts.find((item) => item.id === contract.id);\n  assert.ok(activeContract);\n  assert.equal(activeContract.status, 'active');\n  assert.ok(activeContract.buyerEscrowCredits > 0);\n  assert.ok(activeContract.buyerBondCredits > 0);\n  assert.ok(reserveGroup(world).frozenCredits >= activeContract.buyerEscrowCredits + activeContract.buyerBondCredits);\n  assert.equal(activeContract.negotiations.length, 0);\n\n  processProductionContracts(world, Number(activeContract.nextDueAt) + 1);\n  const settledContract = world.productionContracts.find((item) => item.id === contract.id);\n  assert.ok(settledContract);\n  assert.equal(settledContract.completedDeliveries, 1);\n  assert.equal(reserve.inventory + reserve.frozenInventory, inventoryBefore + settledContract.quantityPerDelivery);\n  assert.ok(reserveGroup(world).credits + reserveGroup(world).frozenCredits < fundsBefore);\n  assert.ok(supplier.stats.contractGoodsSupplied >= settledContract.quantityPerDelivery);\n"""
          if old not in source:
              raise SystemExit('reserve contract test block unavailable')
          test_path.write_text(source.replace(old, new, 1), encoding='utf-8')

          docs_path = Path('docs/README.md')
          docs = docs_path.read_text(encoding='utf-8')
          expanded = '库存与资金守恒且可通过订单簿、固定采购合同与储备清仓拍卖跨市场调节的市场储备、生产链双向滞后价格传导'
          preserved = '库存与资金守恒的双边市场储备（可通过订单簿、固定采购合同与储备清仓拍卖跨市场调节）、生产链双向滞后价格传导'
          if expanded not in docs:
              raise SystemExit('reserve authority index expansion unavailable')
          docs_path.write_text(docs.replace(expanded, preserved, 1), encoding='utf-8')

          verifier_path = Path('scripts/verify-market-assets.mjs')
          verifier = verifier_path.read_text(encoding='utf-8')
          stale = "  '当前上限为 52 笔',\n]) requireText('docs/UNIFIED_ASSET_ORDER_BOOK_DESIGN.md', text);"
          current = "  '当前权威目录为 36 种商品与 26 种工厂类型，即当前上限 62 笔',\n]) requireText('docs/UNIFIED_ASSET_ORDER_BOOK_DESIGN.md', text);\nforbidText('docs/UNIFIED_ASSET_ORDER_BOOK_DESIGN.md', '当前上限为 52 笔');"
          if stale not in verifier:
              raise SystemExit('stale 52-order verifier anchor unavailable')
          verifier_path.write_text(verifier.replace(stale, current, 1), encoding='utf-8')
          PY
      - name: Install dependencies
        run: npm ci
      - name: Run market reserve verification
        run: node scripts/verify-market-reserve-operations.mjs
      - name: Run market reserve server tests
        run: node --test server/test/market-reserve-operations.test.js
      - name: Build and run repository verification
        run: npm run build
      - name: Inspect patch
        run: |
          git diff --check
          git status --short
          git diff --stat
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            package.json \
            server/src/market-reserve-operations.js \
            server/src/market-demand/catalog.js \
            server/src/market-demand.js \
            server/src/market-liquidity.js \
            server/src/balanced-market.js \
            server/src/contracts.js \
            server/src/asset-auctions.js \
            server/src/runtime-store.js \
            server/src/contract-audit-store.js \
            server/test/market-reserve-operations.test.js \
            scripts/verify-market-reserve-operations.mjs \
            scripts/verify-market-assets.mjs \
            src/contracts/types.ts \
            src/pages/ContractPage.tsx \
            docs/PRODUCT_AND_GAMEPLAY_DESIGN.md \
            docs/UNIFIED_ASSET_ORDER_BOOK_DESIGN.md \
            docs/PAGE_CONTENT_AND_NAVIGATION_DESIGN.md \
            docs/GIFT_CODE_AND_ADMIN_DESIGN.md \
            docs/SERVER_ARCHITECTURE_AND_DEPLOYMENT_DESIGN.md \
            docs/README.md
          git diff --cached --check
          git commit -m "feat: deepen market reserve operations [market-reserve-applied]"
          git push origin HEAD:feat/market-reserve-operations-20260808
