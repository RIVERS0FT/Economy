name: Apply deploy SSH reliability patch

on:
  push:
    branches:
      - fix/deploy-ssh-preflight-retry

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/deploy-ssh-preflight-retry
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.4.0
          cache: npm
      - name: Patch deployment workflow, authority design, and regression guard
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          function replaceOnce(path, from, to) {
            const source = fs.readFileSync(path, 'utf8');
            const count = source.split(from).length - 1;
            if (count !== 1) throw new Error(`${path}: expected one match, found ${count}`);
            fs.writeFileSync(path, source.replace(from, to));
          }

          const deploy = '.github/workflows/deploy.yml';
          const secret = (name) => '$' + `{{ secrets.${name} }}`;
          const source = fs.readFileSync(deploy, 'utf8');
          const configurePattern = /      - name: Configure SSH\n[\s\S]*?(?=\n      - name: Prune backups)/;
          const configureMatch = source.match(configurePattern);
          if (!configureMatch) throw new Error('deploy.yml: Configure SSH block not found');
          const configure = `      - name: Configure SSH
        id: configure_ssh
        env:
          SERVER_HOST: ${secret('SERVER_HOST')}
          SERVER_USER: ${secret('SERVER_USER')}
          SERVER_PORT: ${secret('SERVER_PORT')}
          SERVER_SSH_KEY: ${secret('SERVER_SSH_KEY')}
        run: |
          exec > >(tee /tmp/economy-ssh.log) 2>&1
          set -euo pipefail
          test -n "$SERVER_HOST"
          test -n "$SERVER_USER"
          test -n "$SERVER_PORT"
          test -n "$SERVER_SSH_KEY"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\\n' "$SERVER_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          touch ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          ssh_connected=0
          for attempt in 1 2 3 4 5; do
            if ssh \\
              -i ~/.ssh/deploy_key \\
              -p "$SERVER_PORT" \\
              -o BatchMode=yes \\
              -o ConnectTimeout=15 \\
              -o StrictHostKeyChecking=accept-new \\
              -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \\
              "$SERVER_USER@$SERVER_HOST" true; then
              ssh_connected=1
              break
            fi
            echo "ECONOMY_SSH_PREFLIGHT_RETRY attempt=$attempt"
            if [ "$attempt" -lt 5 ]; then
              sleep 5
            fi
          done
          if [ "$ssh_connected" -ne 1 ]; then
            echo "ECONOMY_SSH_PREFLIGHT_FAILED attempts=5" >&2
            exit 1
          fi
`;
          fs.writeFileSync(deploy, source.replace(configurePattern, configure));

          const design = 'docs/SERVER_ARCHITECTURE_AND_DEPLOYMENT_DESIGN.md';
          replaceOnce(
            design,
            '- `main` 分支由 `.github/workflows/deploy.yml` 对实际待部署提交重新执行 `npm ci`、`npm run build`、固定 Chromium 安装和 `npm run test:browser`；构建与浏览器回归都成功后才允许上传、安装并执行线上验证。',
            '- `main` 分支由 `.github/workflows/deploy.yml` 对实际待部署提交重新执行 `npm ci`、`npm run build`、固定 Chromium 安装和 `npm run test:browser`；构建与浏览器回归都成功后才允许上传、安装并执行线上验证。正式部署的 SSH 初始化不得依赖单次 `ssh-keyscan`：新 runner 必须使用部署私钥执行真实只读认证预检，以 `StrictHostKeyChecking=accept-new` 仅接受首次未知主机密钥、继续拒绝同一 runner 内发生变化的主机密钥，并使用 `BatchMode=yes`、15 秒连接超时最多尝试 5 次、失败尝试之间等待 5 秒。全部预检失败时必须在数据库备份、文件上传和服务变更之前终止，保留 `economy-ssh.log` 的实际 SSH 诊断；预检成功后由同一 `known_hosts` 约束本次部署余下所有 SSH/rsync 连接。'
          );

          const verify = 'scripts/verify-runtime-reliability.mjs';
          replaceOnce(
            verify,
`  'Ensure rsync is available',
  'if ! command -v rsync >/dev/null 2>&1; then',
  'Collect failed step log',`,
`  'Ensure rsync is available',
  'if ! command -v rsync >/dev/null 2>&1; then',
  'StrictHostKeyChecking=accept-new',
  'BatchMode=yes',
  'ConnectTimeout=15',
  'for attempt in 1 2 3 4 5; do',
  'ECONOMY_SSH_PREFLIGHT_RETRY attempt=$attempt',
  'ECONOMY_SSH_PREFLIGHT_FAILED attempts=5',
  'Collect failed step log',`
          );
          replaceOnce(
            verify,
`  ['docs/SERVER_ARCHITECTURE_AND_DEPLOYMENT_DESIGN.md', '不得用手工成功状态替代任一真实检查'],
  ['docs/SERVER_ARCHITECTURE_AND_DEPLOYMENT_DESIGN.md', '成功步骤日志不得上传'],`,
`  ['docs/SERVER_ARCHITECTURE_AND_DEPLOYMENT_DESIGN.md', '不得用手工成功状态替代任一真实检查'],
  ['docs/SERVER_ARCHITECTURE_AND_DEPLOYMENT_DESIGN.md', '不得依赖单次 \\`ssh-keyscan\\`'],
  ['docs/SERVER_ARCHITECTURE_AND_DEPLOYMENT_DESIGN.md', '最多尝试 5 次'],
  ['docs/SERVER_ARCHITECTURE_AND_DEPLOYMENT_DESIGN.md', '数据库备份、文件上传和服务变更之前终止'],
  ['docs/SERVER_ARCHITECTURE_AND_DEPLOYMENT_DESIGN.md', '成功步骤日志不得上传'],`
          );
          replaceOnce(
            verify,
            "forbidFile('.github/workflows/web-build.yml');",
            "forbidFile('.github/workflows/web-build.yml');\nforbidText('.github/workflows/deploy.yml', 'ssh-keyscan -p \\\"$SERVER_PORT\\\" \\\"$SERVER_HOST\\\"');"
          );
          NODE
      - run: npm ci
      - run: node scripts/verify-runtime-reliability.mjs
      - run: npm run build
      - name: Commit verified patch and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/apply-deploy-ssh-reliability-patch.yml
          git diff --check
          git config user.name 'RIVERSOFT'
          git config user.email '105160096+RIVERS0FT@users.noreply.github.com'
          git add -- .github/workflows/deploy.yml docs/SERVER_ARCHITECTURE_AND_DEPLOYMENT_DESIGN.md scripts/verify-runtime-reliability.mjs .github/workflows/apply-deploy-ssh-reliability-patch.yml
          git commit -m 'fix: harden deployment SSH preflight'
          git push origin HEAD:fix/deploy-ssh-preflight-retry
