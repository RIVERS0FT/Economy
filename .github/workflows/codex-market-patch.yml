name: Codex market information hierarchy

on:
  push:
    branches:
      - codex/victoria-market-layout

permissions:
  contents: write

jobs:
  patch-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/victoria-market-layout
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.4.0
          cache: npm
      - name: Fix patch runner root-file writes
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const path = 'scripts/codex-market-patch.mjs';
          let source = fs.readFileSync(path, 'utf8');
          const before = "  fs.mkdirSync(path.split('/').slice(0, -1).join('/'), { recursive: true });";
          const after = "  const directory = path.split('/').slice(0, -1).join('/');\n  if (directory) fs.mkdirSync(directory, { recursive: true });";
          if (!source.includes(before)) throw new Error('root-file write anchor missing');
          source = source.replace(before, after);
          fs.writeFileSync(path, source);
          NODE
      - name: Apply market patch
        run: node scripts/codex-market-patch.mjs
      - name: Commit generated market changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            src/pages/GlobalMarketPage.tsx \
            src/pages/MarketPage.tsx \
            src/components/market/MarketBalanceBar.tsx \
            src/styles/global-operation-pages.css \
            src/styles/market-page-polish.css \
            docs/PAGE_CONTENT_AND_NAVIGATION_DESIGN.md \
            scripts/verify-market-information-hierarchy.mjs \
            tests/browser/market-information-hierarchy.spec.ts \
            package.json
          git diff --cached --check
          git commit -m "应用市场信息层级改造"
          git push origin HEAD:codex/victoria-market-layout
