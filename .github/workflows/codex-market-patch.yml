name: Codex market information hierarchy

on:
  push:
    branches:
      - codex/victoria-market-layout

permissions:
  contents: write

jobs:
  patch-market-regression:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/victoria-market-layout
          fetch-depth: 0
      - name: Update chart-before-trade regression
        run: |
          python3 - <<'PY'
          from pathlib import Path

          runtime_path = Path('tests/browser/market-runtime.spec.ts')
          runtime = runtime_path.read_text()
          replacements = [
              ('market desktop layout keeps order entry and order book together above the chart in the compact page', 'market desktop layout keeps market context and chart above the combined trade card in the compact page'),
              ('expect(chartCardBox.y).toBeGreaterThan(tradeBox.y + tradeBox.height - 2);', 'expect(tradeBox.y).toBeGreaterThan(chartCardBox.y + chartCardBox.height - 2);'),
              ('expect(chartBox.y).toBeGreaterThan(tradeBox.y + tradeBox.height - 2);', 'expect(tradeBox.y).toBeGreaterThan(chartBox.y + chartBox.height - 2);'),
              ('expect(narrowChart.y).toBeGreaterThan(narrowTrade.y + narrowTrade.height - 2);', 'expect(narrowTrade.y).toBeGreaterThan(narrowChart.y + narrowChart.height - 2);'),
          ]
          for old, new in replacements:
              if old not in runtime:
                  raise SystemExit(f'missing runtime anchor: {old}')
              runtime = runtime.replace(old, new, 1)
          runtime_path.write_text(runtime)

          verifier_path = Path('scripts/verify-market-page-layout-base.mjs')
          verifier = verifier_path.read_text()
          old_title = 'market desktop layout keeps order entry and order book together above the chart in the compact page'
          new_title = 'market desktop layout keeps market context and chart above the combined trade card in the compact page'
          if old_title not in verifier:
              raise SystemExit('missing verifier title anchor')
          verifier = verifier.replace(old_title, new_title, 1)
          verifier = verifier.replace('Playwright 必须覆盖紧凑市场的合并交易卡与后续行情布局。', 'Playwright 必须覆盖商品基本面与行情先于合并交易卡的最终信息层级。', 1)
          verifier_path.write_text(verifier)
          PY
      - name: Commit regression update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/browser/market-runtime.spec.ts scripts/verify-market-page-layout-base.mjs
          git diff --cached --check
          git commit -m "更新市场详情信息顺序回归"
          git push origin HEAD:codex/victoria-market-layout
