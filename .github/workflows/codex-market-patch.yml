name: Codex market information hierarchy

on:
  push:
    branches:
      - codex/victoria-market-layout
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/victoria-market-layout
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.4.0
          cache: npm
      - name: Fix patch runner root-file writes
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const path = 'scripts/codex-market-patch.mjs';
          let source = fs.readFileSync(path, 'utf8');
          const before = "  fs.mkdirSync(path.split('/').slice(0, -1).join('/'), { recursive: true });";
          const after = "  const directory = path.split('/').slice(0, -1).join('/');\n  if (directory) fs.mkdirSync(directory, { recursive: true });";
          if (!source.includes(before)) throw new Error('root-file write anchor missing');
          source = source.replace(before, after);
          fs.writeFileSync(path, source);
          NODE
      - name: Apply final market patch
        run: node scripts/codex-market-patch.mjs
      - name: Remove temporary patch machinery
        run: rm .github/workflows/codex-market-patch.yml scripts/codex-market-patch.mjs
      - name: Install dependencies
        run: npm ci
      - name: Check patch whitespace
        run: git diff --check
      - name: Verify market hierarchy
        run: npm run verify:market-information-hierarchy
      - name: Verify market layout
        run: node scripts/verify-market-page-layout.mjs
      - name: Verify page content
        run: node scripts/verify-page-content.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: Build and run architecture checks
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser tests
        run: npm run test:browser
      - name: Commit verified final changes
        run: |
          git config user.name "RIVERSOFT Automation"
          git config user.email "105160096+RIVERS0FT@users.noreply.github.com"
          git add -A -- \
            .github/workflows/codex-market-patch.yml \
            scripts/codex-market-patch.mjs \
            src/pages/GlobalMarketPage.tsx \
            src/pages/MarketPage.tsx \
            src/components/market/MarketBalanceBar.tsx \
            src/styles/global-operation-pages.css \
            src/styles/market-page-polish.css \
            docs/PAGE_CONTENT_AND_NAVIGATION_DESIGN.md \
            scripts/verify-market-information-hierarchy.mjs \
            tests/browser/market-information-hierarchy.spec.ts \
            package.json
          git status --short
          git commit -m "重构全局与地区市场信息层级"
          git push origin HEAD:codex/victoria-market-layout
