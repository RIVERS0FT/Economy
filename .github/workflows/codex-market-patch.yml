name: Codex market information hierarchy

on:
  push:
    branches:
      - codex/victoria-market-layout

permissions:
  contents: write

jobs:
  patch-labels:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/victoria-market-layout
          fetch-depth: 0
      - name: Restore authoritative market labels
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/pages/MarketPage.tsx')
          text = path.read_text()
          old = 'label="市场价"\n                  value={<CurrencyAmount>{formatCurrency(selectedMarketPrice)}</CurrencyAmount>}'
          new = 'label="官方系统价"\n                  value={<CurrencyAmount>{formatCurrency(selectedMarketPrice)}</CurrencyAmount>}'
          if old not in text:
              raise SystemExit('official price label anchor missing')
          text = text.replace(old, new, 1)
          text = text.replace('label="周期实际成交"', 'label="周期系统买卖量"', 1)
          path.write_text(text)
          PY
      - name: Commit authoritative labels
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/MarketPage.tsx
          git diff --cached --check
          git commit -m "保留市场官方系统价标签"
          git push origin HEAD:codex/victoria-market-layout
