name: Apply notification design

on:
  push:
    branches:
      - codex/notification-center
    paths:
      - .github/workflows/apply-notification-design.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/notification-center
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply authoritative design and verification updates
        run: node scripts/apply-notification-design.mjs
      - name: Commit generated repository changes
        run: |
          rm -- .github/workflows/apply-notification-design.yml scripts/apply-notification-design.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- docs/PAGE_CONTENT_AND_NAVIGATION_DESIGN.md package.json scripts/verify-liquid-glass-chrome.mjs
          git rm --cached -- .github/workflows/apply-notification-design.yml scripts/apply-notification-design.mjs
          git commit -m "docs: define unified notification system"
          git push origin HEAD:codex/notification-center
