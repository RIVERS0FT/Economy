name: Apply operating growth line design sync

on:
  push:
    branches:
      - agent/operating-growth-line

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/operating-growth-line
          fetch-depth: 0

      - name: Patch authoritative design and regression fixtures
        run: python3 scripts/apply-operating-growth-line.py

      - name: Commit synchronized design
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-operating-growth-line.yml scripts/apply-operating-growth-line.py
          git add -- \
            docs/PRODUCT_AND_GAMEPLAY_DESIGN.md \
            docs/PAGE_CONTENT_AND_NAVIGATION_DESIGN.md \
            docs/SERVER_ARCHITECTURE_AND_DEPLOYMENT_DESIGN.md \
            tests/browser/runtime-harness.tsx \
            scripts/verify-overview-content.mjs \
            scripts/verify-page-content.mjs \
            scripts/verify-email-registration.mjs
          git diff --cached --check
          git commit -m "同步经营成长线权威设计与防回退"
          git push origin HEAD:agent/operating-growth-line
