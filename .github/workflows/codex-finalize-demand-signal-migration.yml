name: Finalize demand signal migration

on:
  push:
    branches:
      - codex/daily-system-market

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.4.0
          cache: npm
      - run: npm ci
      - run: node scripts/codex-finalize-demand-signal-migration-v2.mjs
      - run: node scripts/verify-staple-crops-demand.mjs
      - run: node scripts/verify-runtime-efficiency.mjs
      - run: node scripts/verify-industry-catalog.mjs
      - run: node scripts/verify-system-market.mjs
      - run: node --test server/test/domain.test.js
      - run: git diff --check
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "收口人口需求即时市场信号"
          git push origin HEAD:codex/daily-system-market
