name: Apply unified order price patch

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]
    paths:
      - '.agent/**'
      - '.github/workflows/apply-unify-order-price.yml'

permissions:
  contents: write

concurrency:
  group: apply-unify-order-price-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.4.0
          cache: npm

      - name: Apply source edits and remove temporary files
        run: |
          python3 .agent/apply-unify-order-price.py
          rm -f \
            .agent/apply-unify-order-price.py \
            .agent/unify-order-price.patch \
            .github/workflows/apply-unify-order-price.yml
          rmdir .agent
          git add -u -- \
            .agent/apply-unify-order-price.py \
            .agent/unify-order-price.patch \
            .github/workflows/apply-unify-order-price.yml

      - name: Install dependencies
        run: npm ci

      - name: Run focused validation
        run: |
          node --test server/test/order-limits.test.js
          node scripts/verify-market-assets.mjs
          git diff --check

      - name: Build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        run: npm run test:browser

      - name: Commit final source changes
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          git add -- \
            server/src/domain.js \
            server/src/facility-groups.js \
            src/config/economy.ts \
            src/pages/MarketPage.tsx \
            server/test/order-limits.test.js \
            docs/UNIFIED_ASSET_ORDER_BOOK_DESIGN.md \
            scripts/verify-market-assets.mjs
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "统一商品与工厂订单价格规则"
          git push origin "HEAD:${HEAD_BRANCH}"
