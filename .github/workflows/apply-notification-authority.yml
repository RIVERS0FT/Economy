name: Apply notification authority

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
    paths:
      - .github/workflows/apply-notification-authority.yml
      - scripts/apply-notification-authority.mjs
      - scripts/fix-notification-scroll.mjs

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'codex/notification-center'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/notification-center
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Synchronize notification authority and regressions
        run: |
          node scripts/apply-notification-authority.mjs
          node scripts/fix-notification-scroll.mjs
      - name: Commit authoritative changes and remove migration files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- docs/LIQUID_GLASS_CHROME_DESIGN.md docs/UI_DESIGN_SYSTEM.md scripts/verify-notification-center.mjs src/styles/notification-center.css tests/browser/notification-center.spec.ts
          git rm -- .github/workflows/apply-notification-authority.yml scripts/apply-notification-authority.mjs scripts/fix-notification-scroll.mjs
          git commit -m "fix: align notification authority and scroll ownership"
          git push origin HEAD:codex/notification-center
