name: Prepare isolated build readiness change
on:
  push:
    branches: [fix/build-button-readiness-20260908]
    paths:
      - .github/prepare-build-readiness.py
      - .github/workflows/prepare-build-readiness.yml
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/build-button-readiness-20260908
          fetch-depth: 0
      - name: Apply exact scoped edits
        run: python3 .github/prepare-build-readiness.py
      - name: Check scoped changes
        run: |
          git diff --check c146dad8828302aa45ffb029b9717979d6b45b78
          node scripts/verify-facility-auto-procure.mjs
          node scripts/verify-gem-shop.mjs
          git diff --stat
      - name: Commit to isolated task branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/BuildingsPage.tsx src/pages/GemShopPage.tsx docs/PAGE_CONTENT_AND_NAVIGATION_DESIGN.md docs/AUTHORITATIVE_COUNTDOWN_DESIGN.md
          git commit -m 'fix: decouple construction readiness and shop acknowledgement from auxiliary reads'
          git push origin HEAD:fix/build-button-readiness-20260908
