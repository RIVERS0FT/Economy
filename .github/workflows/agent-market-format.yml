name: Format market layout change

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  format:
    if: github.head_ref == 'agent/market-layout-fill' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/market-layout-fill
          fetch-depth: 0
      - name: Normalize changed TypeScript blocks
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_lines(path: str, old_lines: list[str], new_lines: list[str]) -> None:
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              old = '\n'.join(old_lines) + '\n'
              new = '\n'.join(new_lines) + '\n'
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected one block, found {text.count(old)}')
              file.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_lines('src/pages/MarketPage.tsx', [
              '        : availabilityReason',
              "? orderSide === 'buy'",
              '  ? game.credits < (parsedOrderPrice ?? 0)',
              '    ? `资金不足，无法买入${assetName}`',
              '    : `仓库已满，无法买入${assetName}`',
              '  : `暂无${assetName}可卖`',
              ": `数量超出范围，无法${orderSide === 'buy' ? '买入' : '卖出'}${assetName}`",
          ], [
              '        : availabilityReason',
              "          ? orderSide === 'buy'",
              '            ? game.credits < (parsedOrderPrice ?? 0)',
              '              ? `资金不足，无法买入${assetName}`',
              '              : `仓库已满，无法买入${assetName}`',
              '            : `暂无${assetName}可卖`',
              "          : `数量超出范围，无法${orderSide === 'buy' ? '买入' : '卖出'}${assetName}`",
          ])
          replace_lines('src/pages/MarketPage.tsx', [
              '                <Button',
              '        block',
              '        className="market-submit-order"',
              '        disabled={Boolean(orderDisabledReason)}',
              '        aria-label={orderActionLabel}',
              '        onClick={submitOrder}',
              '      >',
              '        {orderActionLabel}',
              '      </Button>',
          ], [
              '                <Button',
              '                  block',
              '                  className="market-submit-order"',
              '                  disabled={Boolean(orderDisabledReason)}',
              '                  aria-label={orderActionLabel}',
              '                  onClick={submitOrder}',
              '                >',
              '                  {orderActionLabel}',
              '                </Button>',
          ])
          replace_lines('src/components/charts/PriceSparkline.tsx', [
              '        const sideBySide = Boolean(',
              'chartCardRect',
              '&& tradeCardRect',
              '&& Math.abs(chartCardRect.top - tradeCardRect.top) < 3',
              '&& chartCardRect.left > tradeCardRect.left + tradeCardRect.width - 3',
              '        );',
              '        const cardPaddingBottom = chartCard',
              '? Number.parseFloat(getComputedStyle(chartCard).paddingBottom) || 0',
              ': 0;',
              '        const minimumHeight = sideBySide && chartCardRect',
              '? Math.max(0, chartCardRect.bottom - elementRect.top - cardPaddingBottom)',
              ': 0;',
          ], [
              '        const sideBySide = Boolean(',
              '          chartCardRect',
              '          && tradeCardRect',
              '          && Math.abs(chartCardRect.top - tradeCardRect.top) < 3',
              '          && chartCardRect.left > tradeCardRect.left + tradeCardRect.width - 3',
              '        );',
              '        const cardPaddingBottom = chartCard',
              '          ? Number.parseFloat(getComputedStyle(chartCard).paddingBottom) || 0',
              '          : 0;',
              '        const minimumHeight = sideBySide && chartCardRect',
              '          ? Math.max(0, chartCardRect.bottom - elementRect.top - cardPaddingBottom)',
              '          : 0;',
          ])
          replace_lines('src/components/charts/PriceSparkline.tsx', [
              '        setMetrics((current) => (',
              'Math.abs(current.width - width) < 0.5',
              '&& Math.abs(current.rootFontSize - rootFontSize) < 0.1',
              '&& Math.abs(current.minimumHeight - minimumHeight) < 0.5',
              '  ? current',
              '  : { width, rootFontSize, minimumHeight }',
              '        ));',
          ], [
              '        setMetrics((current) => (',
              '          Math.abs(current.width - width) < 0.5',
              '          && Math.abs(current.rootFontSize - rootFontSize) < 0.1',
              '          && Math.abs(current.minimumHeight - minimumHeight) < 0.5',
              '            ? current',
              '            : { width, rootFontSize, minimumHeight }',
              '        ));',
          ])
          replace_lines('src/components/charts/PriceSparkline.tsx', [
              '  return { ref, ...metrics };',
              '}',
              'function MarketHistoryChart({ buckets, variant }: { buckets: MarketHistoryBucket[]; variant: MarketChartVariant }) {',
          ], [
              '  return { ref, ...metrics };',
              '}',
              '',
              'function MarketHistoryChart({ buckets, variant }: { buckets: MarketHistoryBucket[]; variant: MarketChartVariant }) {',
          ])
          Path('.github/workflows/agent-market-format.yml').unlink()
          trigger = Path('.agent-format-trigger')
          if trigger.exists():
              trigger.unlink()
          PY
      - name: Verify formatting patch
        run: |
          git diff --check
          node scripts/verify-market-order-entry-compact.mjs
          node scripts/verify-market-page-layout.mjs
          node --experimental-strip-types scripts/verify-market-chart.mjs
      - name: Commit formatting
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "整理市场布局实现格式"
          git push origin HEAD:agent/market-layout-fill
