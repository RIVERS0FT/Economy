name: Audit repair workspace
on:
  push:
    branches: [fix/audit-boundaries-20260906]
    paths: [.github/workflows/audit-workspace.yml]
permissions:
  contents: read
jobs:
  workspace:
    if: github.ref == 'refs/heads/fix/audit-boundaries-20260906'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.4.0
          cache: npm
      - run: npm ci
      - name: Package source and locked local test tools
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=tar HEAD > "$RUNNER_TEMP/source.tar"
          cp "$(command -v node)" "$RUNNER_TEMP/node"
          tar -czf "$RUNNER_TEMP/test-tools.tar.gz" node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: audit-repair-workspace
          path: |
            ${{ runner.temp }}/source.tar
            ${{ runner.temp }}/node
            ${{ runner.temp }}/test-tools.tar.gz
          retention-days: 1
