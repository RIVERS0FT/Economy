name: Prepare audit repair workspace
on:
  push:
    branches: [work/audit-fixes-20260906]
    paths: [.github/workflows/audit-workspace.yml]
permissions:
  contents: write
jobs:
  publish-reviewed-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify and decode reviewed patch
        shell: python
        run: |
          import base64, hashlib, lzma, os
          from pathlib import Path
          encoded = ''.join(Path(f'.audit-transfer/part-{i}.b64').read_text().strip() for i in range(3))
          patch = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == 'e82b107cecd979665fd5315766da8ecbfd2605ca073496334737452a43dcb575'
          Path(os.environ['RUNNER_TEMP'], 'audit-repair.patch').write_bytes(patch)
      - name: Publish only product changes to a clean branch
        shell: bash
        run: |
          set -euo pipefail
          target=fix/audit-boundaries-20260906
          if git ls-remote --exit-code origin "refs/heads/$target" >/dev/null 2>&1; then
            echo 'Refusing to overwrite an existing repair branch'
            exit 1
          fi
          git switch --detach 345c3390254d4c02e339d58da3653e0480baa184
          git switch -c "$target"
          git apply --unidiff-zero --index --check "$RUNNER_TEMP/audit-repair.patch"
          git apply --unidiff-zero --index "$RUNNER_TEMP/audit-repair.patch"
          git diff --cached --check
          if git diff --cached --name-only | grep -Eq '^(\.github/|\.audit-transfer/|test-results/|playwright-report/|node_modules/)'; then
            echo 'Temporary transfer files must never enter the repair branch'
            exit 1
          fi
          git diff --cached --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: isolate write intents and sessions and restore market and commercial boundaries'
          git push origin "HEAD:refs/heads/$target"
          echo "REPAIR_HEAD=$(git rev-parse HEAD)"
