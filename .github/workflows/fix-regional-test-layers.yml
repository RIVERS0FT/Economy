name: Correct regional page test ownership
on:
  push:
    branches: [codex/regional-building-tabs-fixup]
    paths: [.github/workflows/fix-regional-test-layers.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/regional-building-tabs-fixup
      - name: Keep source-only assertions in DT and fail closed on removed tests
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          old = Path('server/test/commercial-page-contract.test.js')
          new = Path('tests/dt/commercial-page.test.ts')
          assert old.exists() and not new.exists()
          new.write_text(old.read_text().replace('const read = (path) =>', 'const read = (path: string) =>'))
          old.unlink()
          p = Path('scripts/select-ci-tests.mjs')
          s = p.read_text()
          marker = '  const fullTrigger = findFullTrigger(executableChanges);'
          assert s.count(marker) == 1
          s = s.replace(marker, '''  // A deleted or moved test cannot be executed by its old path. Validate the
            // entire remaining suite rather than silently dropping its coverage.
            const removedTest = executableChanges.find((path) => (
              (isDtTest(path) || isServerTest(path) || isBrowserSpec(path))
              && !existsSync(resolve(root, path))
            ));
            if (removedTest) {
              plan.mode = 'full';
              plan.reasons.push(`removed-test:${removedTest}`);
              plan.needsDependencies = true;
              plan.browser = { mode: 'all', tests: [] };
              return plan;
            }

          ''' + marker)
          # Align the inserted function body without changing its behavior.
          start = s.index('  // A deleted or moved test')
          end = s.index(marker, start)
          chunk = s[start:end].splitlines()
          chunk = [chunk[0]] + [line[2:] if line.startswith('    ') else line for line in chunk[1:]]
          s = s[:start] + '\n'.join(chunk) + '\n' + s[end:]
          p.write_text(s)
          p = Path('docs/CI_EXECUTION_DESIGN.md')
          s = p.read_text()
          marker = '### 2.2 IT（Integration Test）'
          assert marker in s
          s = s.replace(marker, '页面源码／设计文本结构断言属于 DT，应位于 `scripts/verify-*.mjs` 或 `tests/dt/*.test.ts`，不得仅因文件名包含 contract 就作为服务器合同集成测试；商业页面结构基线位于 `tests/dt/commercial-page.test.ts`。迁移时保留原断言，并继续由正式 DT 入口执行。\n\n' + marker)
          s += '\n选择计划遇到已删除或迁移的 DT、IT 或 ST-browser 测试路径时必须回退完整验证，不把不存在的旧路径交给 runner，也不得静默删除测试覆盖。该回退继续执行完整 DT、完整 IT 与完整浏览器分片，覆盖率门槛不变。\n'
          p.write_text(s)
          p = Path('tests/dt/ci-deleted-test-selection.test.ts')
          p.write_text('''import assert from 'node:assert/strict';
          import { mkdtempSync, mkdirSync, rmSync, writeFileSync } from 'node:fs';
          import { tmpdir } from 'node:os';
          import { dirname, join } from 'node:path';
          import test from 'node:test';
          import { selectCiPlan } from '../../scripts/select-ci-tests.mjs';

          for (const removed of ['tests/dt/removed.test.ts', 'server/test/removed.test.js', 'tests/browser/removed.spec.ts']) {
            test(`removed test retains full validation: ${removed}`, (t) => {
              const root = mkdtempSync(join(tmpdir(), 'economy-removed-tests-'));
              t.after(() => rmSync(root, { recursive: true, force: true }));
              const plan = selectCiPlan([removed], { root });
              assert.equal(plan.mode, 'full');
              assert.deepEqual(plan.reasons, [`removed-test:${removed}`]);
              assert.equal(plan.needsDependencies, true);
              assert.equal(plan.browser.mode, 'all');
              assert.deepEqual(plan.it.tests, []);
            });
          }

          test('moving source-only page checks to DT preserves assertions and uses full migration validation', (t) => {
            const root = mkdtempSync(join(tmpdir(), 'economy-moved-tests-'));
            t.after(() => rmSync(root, { recursive: true, force: true }));
            const destination = 'tests/dt/commercial-page.test.ts';
            mkdirSync(dirname(join(root, destination)), { recursive: true });
            writeFileSync(join(root, destination), '// retained page assertions');
            const migration = selectCiPlan(['server/test/commercial-page-contract.test.js', destination], { root });
            assert.equal(migration.mode, 'full');
            assert.equal(migration.browser.mode, 'all');
            const followup = selectCiPlan([destination], { root });
            assert.equal(followup.mode, 'targeted');
            assert.deepEqual(followup.it.tests, []);
            assert.ok(followup.dt.commands.some((command) => command.args[0] === 'scripts/run-code-coverage.mjs' && command.args[1] === 'dt'));
          });
          ''')
          Path('.github/workflows/fix-regional-test-layers.yml').unlink()
          PY
          git add -A
          node scripts/normalize-repository-text.mjs
          git add -A
          git diff --cached --check
          node --test tests/dt/ci-deleted-test-selection.test.ts tests/dt/commercial-page.test.ts
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test: preserve page assertions in DT and validate test migrations fully'
          git push origin HEAD:codex/regional-building-tabs-fixup
