name: Codex PR Apply Repeat Save Delete Gift Shop

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'codex/repeat-save-delete-gift-shop'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/repeat-save-delete-gift-shop
          fetch-depth: 0

      - name: Extract and run patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/codex-apply-repeat-save-delete-gift-shop.yml').read_text(encoding='utf-8')
          marker = "          python3 - <<'PY'\n"
          start = source.index(marker) + len(marker)
          end = source.index("\n          PY\n", start)
          lines = source[start:end].splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          Path('/tmp/apply-repeat-save-delete-gift-shop.py').write_text(script, encoding='utf-8')
          PY
          python3 /tmp/apply-repeat-save-delete-gift-shop.py

      - name: Commit final patch without temporary workflows
        shell: bash
        run: |
          git rm .github/workflows/codex-apply-repeat-save-delete-gift-shop.yml
          git rm .github/workflows/codex-pr-apply-repeat-save-delete-gift-shop.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "实现可重复删档并迁移礼品兑换至商店"
          git push origin HEAD:codex/repeat-save-delete-gift-shop
