name: Codex PR Apply Repeat Save Delete Gift Shop

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'codex/repeat-save-delete-gift-shop'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/repeat-save-delete-gift-shop
          fetch-depth: 0

      - name: Extract and run patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/codex-apply-repeat-save-delete-gift-shop.yml').read_text(encoding='utf-8')
          marker = "          python3 - <<'PY'\n"
          start = source.index(marker) + len(marker)
          end = source.index("\n          PY\n", start)
          raw_lines = source[start:end].splitlines()
          restored = []
          in_triple = False
          for raw in raw_lines:
              if in_triple:
                  line = raw
              else:
                  line = raw[10:] if raw.startswith('          ') else raw
              restored.append(line)
              if line.count('"""') % 2 == 1:
                  in_triple = not in_triple
          script = '\n'.join(restored) + '\n'
          script = script.replace(
              "for (const text of ['礼品兑换', 'redeemGift', 'gift-redemption-card']) {",
              "for (const text of ['WidgetHeading title=\"礼品兑换\"', 'label=\"礼品兑换码\"', 'redeemGift', 'gift-redemption-card']) {",
          )
          script = script.replace(
              "assert '礼品兑换' not in settings",
              "assert 'WidgetHeading title=\"礼品兑换\"' not in settings",
          )
          Path('/tmp/apply-repeat-save-delete-gift-shop.py').write_text(script, encoding='utf-8')
          PY
          python3 /tmp/apply-repeat-save-delete-gift-shop.py

      - name: Commit final patch without temporary workflows
        shell: bash
        run: |
          git rm .github/workflows/codex-apply-repeat-save-delete-gift-shop.yml
          git rm .github/workflows/codex-pr-apply-repeat-save-delete-gift-shop.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "实现可重复删档并迁移礼品兑换至商店"
          git push origin HEAD:codex/repeat-save-delete-gift-shop
