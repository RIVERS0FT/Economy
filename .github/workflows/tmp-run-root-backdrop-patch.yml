name: Temporary root backdrop patch runner

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'fix/unify-root-backdrop-layers'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/unify-root-backdrop-layers
          fetch-depth: 1

      - name: Extract and run focused patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/tmp-unify-root-backdrop-layers.yml').read_text(encoding='utf-8').splitlines()
          start = workflow.index("          python - <<'PY'") + 1
          end = workflow.index('          PY', start)
          script = []
          for line in workflow[start:end]:
              script.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/unify-root-backdrop-layers.py').write_text('\n'.join(script) + '\n', encoding='utf-8')
          PY
          python /tmp/unify-root-backdrop-layers.py

      - name: Verify focused architecture rules
        shell: bash
        run: |
          node scripts/verify-auth-three-layer.mjs
          node scripts/verify-game-three-layer.mjs
          node scripts/verify-open-glass-sampling.mjs
          git diff --check

      - name: Commit focused change and remove temporary workflows
        shell: bash
        run: |
          rm -- \
            .github/workflows/tmp-unify-root-backdrop-layers.yml \
            .github/workflows/tmp-run-root-backdrop-patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            src/styles/financial-backdrop.css \
            docs/REGISTRATION_INVITE_FLOW_DESIGN.md \
            docs/LIQUID_GLASS_CHROME_DESIGN.md \
            scripts/verify-open-glass-sampling.mjs \
            scripts/verify-game-three-layer.mjs \
            scripts/verify-auth-three-layer.mjs \
            tests/browser/open-glass-sampling.spec.ts \
            tests/browser/game-three-layer.spec.ts \
            tests/browser/application-photography.spec.ts
          git add -u -- \
            .github/workflows/tmp-unify-root-backdrop-layers.yml \
            .github/workflows/tmp-run-root-backdrop-patch.yml
          git commit -m 'fix: unify root backdrop layers'
          git push origin HEAD:fix/unify-root-backdrop-layers
