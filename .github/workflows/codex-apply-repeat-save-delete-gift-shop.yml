name: Codex Apply Repeat Save Delete Gift Shop

on:
  push:
    branches:
      - codex/repeat-save-delete-gift-shop

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message != 'chore: apply repeatable save deletion and shop gift redemption'
    runs-on: ubuntu-latest
    steps:
