          fetch-depth: 0

      - name: Apply product and implementation changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')

          def replace_once(path, old, new):
              text = read(path)
              if old not in text:
                  raise SystemExit(f'{path}: missing replacement anchor:\n{old[:240]}')
              write(path, text.replace(old, new, 1))

          def replace_all(path, old, new):
              text = read(path)
              if old not in text:
                  raise SystemExit(f'{path}: missing replacement anchor: {old}')
              write(path, text.replace(old, new))

