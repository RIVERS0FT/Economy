name: codex-mobile-map-tooltip-ci-fix

on:
  push:
    branches:
      - codex/hide-mobile-map-tooltip

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply architecture fix
        run: |
          python - <<'PY'
          from pathlib import Path

          map_path = Path('src/components/provinces/UsMainlandMap.tsx')
          map_text = map_path.read_text(encoding='utf-8')
          old = 'tooltip: { show: showTooltip },'
          new = '''tooltip: {
        ...commonTooltip,
        show: showTooltip,
      },'''
          if map_text.count(old) != 1:
              raise SystemExit(f'expected one responsive tooltip block, got {map_text.count(old)}')
          map_path.write_text(map_text.replace(old, new), encoding='utf-8', newline='\n')

          verify_path = Path('scripts/verify-provincial-economy.mjs')
          verify_text = verify_path.read_text(encoding='utf-8')
          old_verify = "'tooltip: { show: showTooltip },'"
          new_verify = "'show: showTooltip,'"
          if verify_text.count(old_verify) != 1:
              raise SystemExit(f'expected one verifier tooltip fragment, got {verify_text.count(old_verify)}')
          verify_path.write_text(verify_text.replace(old_verify, new_verify), encoding='utf-8', newline='\n')
          PY
          grep -F '...commonTooltip,' src/components/provinces/UsMainlandMap.tsx
          grep -F 'show: showTooltip,' scripts/verify-provincial-economy.mjs
      - name: Commit fix and remove migration workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/provinces/UsMainlandMap.tsx scripts/verify-provincial-economy.mjs
          git rm .github/workflows/codex-mobile-map-tooltip-ci-fix.yml
          git commit -m '修正响应式地图 Tooltip 架构契约'
          git push origin HEAD:codex/hide-mobile-map-tooltip
