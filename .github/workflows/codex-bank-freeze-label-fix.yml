name: Codex bank freeze label fix

on:
  push:
    branches:
      - codex/daily-market-freeze-timeout-fix

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message == '修复冻结资产重复标签'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/daily-market-freeze-timeout-fix
          fetch-depth: 0
      - name: Apply label fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = [
              (
                  'src/pages/BankPage.tsx',
                  '<span role="columnheader">冻结资产</span>',
                  '<span role="columnheader">工厂</span>',
              ),
              (
                  'docs/PAGE_CONTENT_AND_NAVIGATION_DESIGN.md',
                  '每行第一层只保留“冻结资产／可冻结／审慎单价／本次冻结”四项用于连续比较',
                  '每行第一层只保留“工厂／可冻结／审慎单价／本次冻结”四项用于连续比较',
              ),
          ]
          for path, old, new in replacements:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected exactly one replacement target: {old!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          Path('.github/workflows/codex-bank-freeze-label-fix.yml').unlink()
          PY
          git diff --check
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "消除银行冻结资产重复标签"
          git push origin HEAD:codex/daily-market-freeze-timeout-fix
