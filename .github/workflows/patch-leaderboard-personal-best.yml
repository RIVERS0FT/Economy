name: Patch leaderboard personal best

on:
  push:
    branches:
      - agent/gameplay-strategy-next-phase

permissions:
  contents: write

concurrency:
  group: patch-leaderboard-personal-best
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/gameplay-strategy-next-phase
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24.4.0
          cache: npm

      - name: Apply personal best patch
        run: python3 scripts/patch-leaderboard-personal-best.py

      - name: Install dependencies
        run: npm ci

      - name: Verify full build
        run: npm run build

      - name: Commit verified patch and remove temporary tooling
        run: |
          rm scripts/patch-leaderboard-personal-best.py
          rm .github/workflows/patch-leaderboard-personal-best.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            server/src/leaderboards.js \
            server/test/leaderboards.test.js \
            src/leaderboardTypes.ts \
            src/pages/LeaderboardPage.tsx \
            src/styles/leaderboards.css \
            scripts/verify-leaderboards.mjs \
            scripts/verify-gameplay-decision-support.mjs \
            docs/PAGE_CONTENT_AND_NAVIGATION_DESIGN.md \
            docs/SERVER_ARCHITECTURE_AND_DEPLOYMENT_DESIGN.md \
            docs/PRODUCT_AND_GAMEPLAY_DESIGN.md \
            scripts/patch-leaderboard-personal-best.py \
            .github/workflows/patch-leaderboard-personal-best.yml
          git diff --cached --check
          git commit -m "增加排行榜权威个人最好成绩"
          git push origin HEAD:agent/gameplay-strategy-next-phase
