name: Apply facility object-card visual redesign

on:
  push:
    branches:
      - codex/facility-object-card-visual

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: codex/facility-object-card-visual
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.4.0
          cache: npm

      - name: Apply building object-card redesign
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import gzip

          payloads = {
              'src/styles/global-facility-narrow.css': '',
              'tests/browser/facility-catalog-layout.spec.ts': '',
              'scripts/verify-facility-catalog-layout.mjs': '',
          }
          for path, payload in payloads.items():
              Path(path).write_text(gzip.decompress(base64.b64decode(payload)).decode('utf-8'), encoding='utf-8')

          design_path = Path('docs/UI_DESIGN_SYSTEM.md')
          design = design_path.read_text(encoding='utf-8')
          replacements = [
              ('2. **同构列表／表格**：商品、工厂、成交、日志、历史记录等主要任务是连续比较多个对象时，使用共享列表或表格行及细线分隔，不为每行重复创建圆角卡片；已登记的建筑两行目录例外使用留白和信息层级而不是可见分隔线区分条目内部区域。', '2. **同构列表／表格**：商品、成交、日志、历史记录等连续比较对象使用共享列表或表格行及细线分隔，不为每行重复创建圆角卡片；建筑两行目录是已登记例外，允许整条对象卡边界明确归属，但卡内主信息与生产配置只用留白和层级区分，不绘制内部横线。'),
              ('运输路线是已登记的独立业务对象例外：一级运输页每条路线固定使用 `.ui-entity-card`，路线卡之间只使用共享 `gap` 分隔且不绘制行分割线；不得扩展到商品、工厂、成交或历史记录。运输页“增加路线”固定在底部 sticky 操作区，不使用毛玻璃或浮动阴影，不显示路线数量／上限胶囊，并保持在页面承载面和移动安全区内。', '运输路线是已登记的独立业务对象例外：一级运输页每条路线固定使用 `.ui-entity-card`，路线卡之间只使用共享 `gap` 分隔且不绘制行分割线；不得扩展到商品、成交或历史记录，建筑目录只按下文自身例外执行。运输页“增加路线”固定在底部 sticky 操作区，不使用毛玻璃或浮动阴影，不显示路线数量／上限胶囊，并保持在页面承载面和移动安全区内。'),
              ('所有带表头的页面实体目录固定使用 `.entity-list-surface` 包裹 `EntityListHeader + .entity-list-rows`。表头与首行、相邻数据行统一使用同一 `.32rem` 间距；列 gap、横向 padding、Chevron 轨道和目录插画槽只能由 `entity-list-header.css` 的共享变量随真实内容容器收缩，业务 CSS 只允许定义字段列模板和业务单元格内部排版。列表密度例外只有两类：`market-commodity-row.css` 同时覆盖一级市场 `.global-market-goods-row` 与地区商品 `.market-commodity-row` 的紧凑商品行；一级全局建筑 `.global-facility-catalog-row` 为容纳第二行生产设置，登记为约 `93～96px` 的两行高度例外：桌面第一行固定收紧到 `30px`，移动端第一行保持 `44px` 触控高度；`FacilityIcon` 正方形插画跨两行，第二行两个方案槽使用列表场景 `48px` 尺寸。横向内边距继续复用 `--entity-list-inline-padding` 与共享表头对齐，纵向内边距允许按两行密度独立收紧；地区下钻主按钮只覆盖第一行。建筑两行目录为分区表面例外：外层行保持透明且不增加条目外边界；第一行下钻按钮必须使用可见共享表面底色，第二行生产配置必须使用独立可见底部卡片；第一行与第二行之间不得绘制独立横向分隔线，表头底线和插画正文竖线也不显示；建筑名称、利润和拥有数量使用更高字重与字号成为主信息，状态与 Chevron 保持辅助层级。第二行必须复用建筑详情页 `FacilityProductionProductSelect` / `FacilityProductionMethodSelect` 及同一个 `production-config` 变体，`ProductArtwork` / 作业制度 Icon、候选名称、投入／产出／周期／成本和相对变化摘要与详情页保持同源；列表场景仅允许把触发尺寸收紧到 `48px` 并通过现有颜色、边框与阴影令牌强化触发按钮，不得复制第二套选择器、Popover、焦点或交互状态。工厂地区列表 `.global-facility-region-row` 同步使用相同的两行密度与共享生产方案槽，但不增加 `FacilityIcon` 场景插画；第一行仍使用共享表头列并独占下钻交互。除这两类外其他市场、地区商品、建筑或地区建筑不得维护另一套列表密度。正负行情与利润统一通过 `.entity-list-value.is-positive / .is-negative` 表达，避免同一语义跨页面变色。', '所有带表头的页面实体目录固定使用 `.entity-list-surface` 包裹 `EntityListHeader + .entity-list-rows`。表头与首行、相邻数据行继续复用共享列 gap、横向 padding、Chevron 轨道和排序结构，业务 CSS 只定义字段列模板与已登记场景例外。列表密度例外只有两类：`market-commodity-row.css` 同时覆盖一级市场 `.global-market-goods-row` 与地区商品 `.market-commodity-row` 的紧凑商品行；一级全局建筑 `.global-facility-catalog-row` 为容纳生产设置登记为两行对象卡例外，`FacilityIcon` 保持正方形真实 Grid 列并在常规宽度跨两行，卡内两行总内容高度由当前响应式插画高度决定，第一行下钻主按钮只占卡内上层，第二行只容纳两个列表场景 `48px` 的 `production-config` 按钮。横向内边距继续复用 `--entity-list-inline-padding` 与共享表头对齐。建筑对象卡使用实体轻量背景、共享对象卡圆角和边界，条目间由专用 gap 区分；主信息按钮使用实体底色、内边界与内高光增强按钮感，生产配置容器保持透明且不得再绘制独立底卡；卡内不绘制第一行与第二行横向分隔、表头底线或插画正文竖线。建筑名称、利润和拥有数量保持高于状态与 Chevron 的视觉权重。第二行必须复用建筑详情页 `FacilityProductionProductSelect` / `FacilityProductionMethodSelect` 及同一个 `production-config` 变体，`ProductArtwork` / 作业制度 Icon、候选名称、投入／产出／周期／成本和相对变化摘要与详情页保持同源，不得复制第二套选择器、Popover、焦点或交互状态。工厂地区列表 `.global-facility-region-row` 同步使用对象卡、主按钮和透明生产按钮组层级，但不增加 `FacilityIcon` 场景插画；第一行仍使用共享表头列并独占下钻交互。除这两类外其他市场、地区商品、建筑或地区建筑不得维护另一套列表密度。正负行情与利润统一通过 `.entity-list-value.is-positive / .is-negative` 表达，避免同一语义跨页面变色。'),
              ('建筑两行目录的最终几何规则：插画必须作为真实 Grid 列参与条目尺寸计算，禁止再通过 `position: absolute`、`transform` 与正文 `padding-left` 模拟插画占位；建筑两行目录不显示表头底线、条目外边界、插画与正文之间的竖向分隔或第一行与第二行之间的横向分隔；建筑名称、利润和拥有数量必须高于状态、Chevron 等辅助信息的视觉权重；生产方案槽继续复用 `production-config`，列表场景允许通过现有令牌强化触发按钮边界、底色与内阴影。桌面第一行收紧为 `30px`；地区工厂列表同步登记为相同的两行高度例外，并与一级工厂目录保持相同的第一行高度与第二行分区层级；插画轨道宽度必须与当前响应式插画尺寸一致。`src/styles/global-facility-narrow.css` 是该两行条目的最终几何覆盖；验证：`tests/browser/facility-catalog-layout.spec.ts`、`tests/browser/global-operation-pages.spec.ts`、`tests/browser/player-page-geometry.spec.ts`。', '建筑两行目录的最终几何规则：插画必须作为真实 Grid 列参与条目尺寸计算，禁止再通过 `position: absolute`、`transform` 与正文 `padding-left` 模拟插画占位；一级与地区建筑外层必须是实体对象卡，并以边界、圆角、轻量内高光和列表 gap 建立清晰分隔，不使用毛玻璃或大范围浮动阴影；一级建筑插画保持 `1:1` 正方形且轨道宽度等于插画宽度，常规宽度下跨两行，卡内两行内容高度与插画高度一致；主信息按钮高度低于插画高度并保持独立实体按钮质感；生产配置容器必须透明无独立底卡，`production-config` 按钮自身承担可见底色、边界与轻量内阴影。卡内不绘制横向分隔线、表头底线或插画正文竖线；极窄载体允许将生产按钮组移到插画下方以避免横向溢出。地区工厂列表同步对象卡、主按钮和透明生产按钮组层级但不渲染插画。`src/styles/global-facility-narrow.css` 是该两行条目的最终几何覆盖；验证：`tests/browser/facility-catalog-layout.spec.ts`、`tests/browser/global-operation-pages.spec.ts`、`tests/browser/player-page-geometry.spec.ts`。'),
          ]
          for old, new in replacements:
              count = design.count(old)
              if count != 1:
                  raise SystemExit(f'UI design replacement expected exactly one match, got {count}: {old[:80]}')
              design = design.replace(old, new)
          design_path.write_text(design, encoding='utf-8')
          size = len(design.encode('utf-8'))
          if size > 128 * 1024:
              raise SystemExit(f'UI_DESIGN_SYSTEM.md exceeds 128 KiB after update: {size} bytes')
          print(f'UI_DESIGN_SYSTEM.md size={size} bytes')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Verify authoritative rules and types
        shell: bash
        run: |
          set -euo pipefail
          npm run verify:repository-text-format
          node scripts/verify-document-authority.mjs
          node scripts/verify-facility-catalog-layout.mjs
          npm run typecheck
          git diff --check

      - name: Commit redesign
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/UI_DESIGN_SYSTEM.md src/styles/global-facility-narrow.css scripts/verify-facility-catalog-layout.mjs tests/browser/facility-catalog-layout.spec.ts
          if git diff --cached --quiet; then
            echo "No redesign changes to commit."
            exit 0
          fi
          git commit -m "优化建筑目录对象卡与插画"
          git push origin HEAD:codex/facility-object-card-visual
