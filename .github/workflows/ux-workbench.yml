name: UX review workbench
on:
  push:
    branches: [codex/ux-review-workbench-20260906]
    paths: [.github/workflows/ux-workbench.yml]
permissions:
  contents: read
jobs:
  stage:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          path: workbench
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          path: source
          ref: b3bf15c503a536d8abd7090b12b17eabb58dd540
      - name: Stage source-only refinement
        working-directory: source
        run: |
          set -euo pipefail
          base64 --decode ../workbench/.workbench/ux-followup.b64 | xz --decompress > "$RUNNER_TEMP/ux.patch"
          echo "24b4699129ed14f6377a29be3bdd9511c99f8bab91070e8f3da3b9f4e307bef7  $RUNNER_TEMP/ux.patch" | sha256sum --check
          git apply --check "$RUNNER_TEMP/ux.patch"
          git apply "$RUNNER_TEMP/ux.patch"
          git diff --check
          git add src tests
          test "$(git write-tree)" = 4ccbcb1cb1b2fa6dfcfdd5c93966a4e3302cb9a4
          git config user.name RIVERSOFT
          git config user.email 105160096+RIVERS0FT@users.noreply.github.com
          git commit -m "fix: 覆盖教程完成后受阻与旧上下文导航边界"
          git push origin HEAD:refs/heads/codex/ux-review-refinement-20260906
  inspect:
    needs: stage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/ux-review-refinement-20260906
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.4.0
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/browser/ux-operating-flow.spec.ts --workers=2 --reporter=list
      - name: Capture overview and market
        run: |
          cat > ux-inspect.mjs <<'JS'
          import { chromium } from 'playwright';
          import { spawn } from 'node:child_process';
          import { mkdir, writeFile } from 'node:fs/promises';
          const server = spawn(process.execPath, ['node_modules/vite/bin/vite.js','--host','127.0.0.1'], { stdio: 'ignore' });
          let browser;
          try {
            for (let i=0;i<120;i++) { try { if ((await fetch('http://127.0.0.1:1420/economy/')).ok) break; } catch {} await new Promise(r=>setTimeout(r,500)); }
            await mkdir('ux-review-images',{recursive:true});
            browser=await chromium.launch();
            const measurements=[];
            for (const width of [390,1440]) {
              const page=await browser.newPage({viewport:{width,height:1000},locale:'zh-CN'});
              for (const [name,label] of [['overview','概览'],['market','市场']]) {
                await page.goto('http://127.0.0.1:1420/economy/?preview=game');
                const nav=page.locator(width<=720?'.mobile-bottom-navigation':'.desktop-sidebar');
                await nav.getByRole('button',{name:new RegExp('^'+label)}).click();
                await page.getByRole('heading',{name:label,exact:true}).waitFor();
                await page.screenshot({path:`ux-review-images/${name}-${width}.png`});
                measurements.push(await page.evaluate(({name,width})=>({name,width,documentWidth:document.documentElement.scrollWidth,viewport:innerWidth,colors:['--color-text-primary','--color-text-secondary','--color-text-muted'].map(v=>[v,getComputedStyle(document.documentElement).getPropertyValue(v)])}),{name,width}));
              }
              await page.close();
            }
            await writeFile('ux-review-images/measurements.json',JSON.stringify(measurements,null,2));
          } finally { await browser?.close(); server.kill(); }
          JS
          node ux-inspect.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: economy-ux-visual-review
          path: |
            ux-review-images
            test-results
          retention-days: 1
          if-no-files-found: warn
