name: UX review workbench
on:
  push:
    branches: [codex/ux-review-workbench-20260906]
    paths: [.github/workflows/ux-workbench.yml]
permissions:
  contents: read
jobs:
  stage:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          path: workbench
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          path: source
          ref: 4ca56623ad4aa0f6658850d318b4fce4a9f9079a
      - name: Stage source-only alignment
        working-directory: source
        run: |
          set -euo pipefail
          base64 --decode ../workbench/.workbench/ux-alignment.b64 | xz --decompress > "$RUNNER_TEMP/ux.patch"
          echo "0ba218a86baf5cc24c14bcf89eed66e8dd3e1ffa98178299bf143b9e64aaf521  $RUNNER_TEMP/ux.patch" | sha256sum --check
          git apply --check "$RUNNER_TEMP/ux.patch"
          git apply "$RUNNER_TEMP/ux.patch"
          git diff --check
          git add src tests
          test "$(git write-tree)" = 6682644cca9cb9eaa016b872f4972b7b52a003d9
          git config user.name RIVERSOFT
          git config user.email 105160096+RIVERS0FT@users.noreply.github.com
          git commit -m "fix: 保持概览下钻数字与箭头同行"
          git push origin HEAD:refs/heads/codex/ux-review-alignment-20260906
  inspect:
    needs: stage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/ux-review-alignment-20260906
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.4.0
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/browser/ux-operating-flow.spec.ts --workers=2 --reporter=list
      - name: Capture settled overview
        run: |
          cat > ux-inspect.mjs <<'JS'
          import { chromium } from 'playwright';
          import { spawn } from 'node:child_process';
          import { mkdir } from 'node:fs/promises';
          const server=spawn(process.execPath,['node_modules/vite/bin/vite.js','--host','127.0.0.1'],{stdio:'ignore'});
          let browser;
          try {
            for(let i=0;i<120;i++){try{if((await fetch('http://127.0.0.1:1420/economy/')).ok)break;}catch{}await new Promise(r=>setTimeout(r,500));}
            await mkdir('ux-review-images',{recursive:true});browser=await chromium.launch();
            for(const width of [390,1440]){
              const page=await browser.newPage({viewport:{width,height:1000},locale:'zh-CN',reducedMotion:'reduce'});
              await page.goto('http://127.0.0.1:1420/economy/?preview=game');
              await page.locator(width<=720?'.mobile-bottom-navigation':'.desktop-sidebar').getByRole('button',{name:/^概览/}).click();
              await page.getByRole('heading',{name:'概览',exact:true}).waitFor();
              await page.mouse.move(width-10,990);await page.waitForTimeout(400);
              await page.screenshot({path:`ux-review-images/overview-${width}.png`,animations:'disabled'});await page.close();
            }
          }finally{await browser?.close();server.kill();}
          JS
          node ux-inspect.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: economy-ux-alignment-review
          path: |
            ux-review-images
            test-results
          retention-days: 1
          if-no-files-found: warn
