name: Replay auction changes on latest main

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

jobs:
  replay:
    if: github.head_ref == 'codex/auction-two-column-attention' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/auction-two-column-attention
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Replay approved auction changes
        run: python3 scripts/codex-replay-auction-on-main.py
      - name: Install dependencies
        run: npm ci
      - name: Build and test
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test browser runtime
        run: npm run test:browser
      - name: Verify final diff
        run: git diff --check
      - name: Commit clean replay
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            docs/PAGE_CONTENT_AND_NAVIGATION_DESIGN.md \
            scripts/verify-asset-auctions.mjs \
            scripts/verify-authoritative-countdowns.mjs \
            scripts/verify-navigation-badges.mjs \
            scripts/verify-page-content.mjs \
            server/src/asset-auctions.js \
            server/test/asset-auctions.test.js \
            src/auctions/types.ts \
            src/components/shell/GameShell.tsx \
            src/hooks/useNavigationBadges.ts \
            src/navigation/navigationBadges.ts \
            src/pages/AuctionPage.tsx \
            src/styles/asset-auctions.css \
            scripts/codex-replay-auction-on-main.py \
            .github/workflows/codex-replay-auction-on-main.yml
          git commit -m 'feat: reorganize auction attention workspace'
          git push origin HEAD:codex/auction-two-column-attention
