name: Temp Fix Player ID Residual

on:
  push:
    branches:
      - codex/id-player-reference

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/id-player-reference
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply residual fix
        shell: bash
        run: |
          if [[ "$(git log -1 --pretty=%s)" != "chore: fix residual player relation name" ]]; then
            exit 0
          fi
          python scripts/temp-fix-player-id-residual.py
          npm ci
          node --test server/test/player-id-reference.test.js server/test/commercial-contracts.test.js server/test/contracts.test.js
          node scripts/verify-runtime-efficiency.mjs
          git diff --check
          rm .github/workflows/temp-fix-player-id-residual.yml scripts/temp-fix-player-id-residual.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: remove residual live contract name field"
          git push origin HEAD:codex/id-player-reference
