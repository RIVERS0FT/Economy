name: Apply player profile and compact numbers

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'codex/player-avatar-compact-numbers'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/player-avatar-compact-numbers
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.4.1
          cache: npm
      - run: npm ci
      - name: Apply final implementation
        run: |
          node scripts/codex-fix-player-profile-apply.mjs
          node --check scripts/codex-apply-player-profile.mjs
          node scripts/codex-apply-player-profile.mjs
          node scripts/codex-repair-template-numbers.mjs
          node scripts/codex-fix-page-content.mjs
          git diff --check
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Targeted browser regression
        run: npx playwright test tests/browser/all-pages-preview.spec.ts tests/browser/runtime.spec.ts
