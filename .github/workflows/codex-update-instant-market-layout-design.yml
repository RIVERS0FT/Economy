name: Update instant market layout design

on:
  push:
    branches:
      - codex/daily-system-market-rebased

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: node scripts/codex-update-instant-market-layout-design.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "同步即时市场行情布局设计"
          git push origin HEAD:codex/daily-system-market-rebased
