name: Apply Population Model Final

on:
  push:
    branches: [feature/population-model-final]
    paths: [.github/workflows/apply-population-final.yml]

permissions:
  contents: write
  actions: read
  statuses: write

concurrency:
  group: apply-population-model-final
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/population-model-final
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.4.0
          cache: npm

      - name: Download verified population payload
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/8889879290/zip" \
            --output /tmp/population-payload.zip
          mkdir -p /tmp/population-artifact /tmp/population-payload
          unzip -q /tmp/population-payload.zip -d /tmp/population-artifact
          tar -xzf /tmp/population-artifact/source-export.tar.gz -C /tmp/population-payload
          test "$(find /tmp/population-payload/scripts -maxdepth 1 -name '.population-model-patch-part-*' | wc -l)" -eq 9

      - name: Apply verified population model
        run: |
          set -euo pipefail
          cat /tmp/population-payload/scripts/.population-model-patch-part-* > /tmp/population-model.b64
          echo '2614022a63ca92b4107efc7344cf3374ad68976366253f667b0d4ab2a94ff9cd  /tmp/population-model.b64' | sha256sum --check
          base64 --decode /tmp/population-model.b64 | gzip --decompress > /tmp/population-model.patch
          echo '180f6a67786b737bfc6473ac86b04a41522e22c90a7a1de6789cf3b7890de714  /tmp/population-model.patch' | sha256sum --check
          git apply --index --check \
            --exclude=docs/GIFT_CODE_AND_ADMIN_DESIGN.md \
            --exclude=server/src/runtime-store.js \
            /tmp/population-model.patch
          git apply --index \
            --exclude=docs/GIFT_CODE_AND_ADMIN_DESIGN.md \
            --exclude=server/src/runtime-store.js \
            /tmp/population-model.patch

          echo 'bc201d934115f5b8debdb34e4195d20988dd683095572e04e57697ce7968fb72  scripts/.population-final-conflicts.b64' | sha256sum --check
          base64 --decode scripts/.population-final-conflicts.b64 | gzip --decompress > /tmp/population-conflicts.patch
          echo '1a04f018bb55981228b9754fbc93aa9936d1139fc28aa0ac2b9e0496b2b9be8d  /tmp/population-conflicts.patch' | sha256sum --check
          git apply --index --check /tmp/population-conflicts.patch
          git apply --index /tmp/population-conflicts.patch

          git rm -- \
            .github/workflows/apply-population-final.yml \
            .github/workflows/export-population-final-source.yml \
            scripts/.population-final-conflicts.b64 \
            scripts/.population-final-part-*

      - name: Install dependencies
        run: npm ci

      - name: Build and test
        run: |
          set -euo pipefail
          npm run build
          npx playwright install --with-deps chromium
          npm run test:browser

      - name: Verify implementation scope
        run: |
          set -euo pipefail
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          test -z "$(git diff --name-only)"
          git status --short

      - name: Commit implementation
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: implement factory-driven population model'
          git push origin HEAD:feature/population-model-final

      - name: Publish implementation status
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          if [ "$JOB_STATUS" = success ]; then state=success; description='Population model implementation verified'; else state=failure; description='Population model implementation failed'; fi
          python3 - "$state" "$description" <<'PYTHON' > /tmp/status.json
          import json, os, sys
          print(json.dumps({
              'state': sys.argv[1],
              'description': sys.argv[2],
              'context': 'implementation/population-model-final',
              'target_url': f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }))
          PYTHON
          curl --fail --silent --show-error --request POST \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --data-binary @/tmp/status.json \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" >/dev/null
