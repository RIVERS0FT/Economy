name: Validate atomic building production batch

on:
  push:
    branches:
      - fix/global-building-row-interactions

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/global-building-row-interactions
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.4.0
          cache: npm
      - name: Apply atomic batch patch
        run: python .codex-building-production-batch.py
      - name: Install dependencies
        run: npm ci
      - name: Validate repository and server
        run: |
          npm run typecheck
          npm run server:check
          node --test server/test/facility-groups.test.js
          node scripts/verify-page-content.mjs
          node scripts/verify-production-methods.mjs
          git diff --check
      - name: Prepare Chromium
        run: bash scripts/prepare-playwright-chromium.sh
      - name: Focused browser validation
        env:
          PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: /usr/bin/google-chrome
        run: npx playwright test tests/browser/global-operation-pages.spec.ts tests/browser/production-methods.spec.ts tests/browser/player-page-geometry.spec.ts --workers=1 --reporter=line
      - name: Commit validated real changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/api/game.ts \
            src/app/gameViewModel.ts \
            server/src/game-routes.js \
            server/src/player-action-registry.js \
            server/src/research.js \
            server/src/facility-groups.js \
            server/src/runtime-action-executor.js \
            server/src/world-storage-v2.js \
            server/test/facility-groups.test.js \
            scripts/verify-production-methods.mjs \
            docs/FACILITY_CATALOG_PRESENTATION_DESIGN.md \
            docs/INDUSTRY_AND_PRODUCTION_DESIGN.md
          git diff --cached --check
          git commit -m "原子化建筑快捷生产批量设置"
          git push origin HEAD:fix/global-building-row-interactions
