name: Repair market cleanup validation
on:
  push:
    branches: [fix/market-contract-summary-cleanup-20260906]
    paths: [.github/workflows/market-contract-summary-validation-repair.yml]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Align typecheck with project preview generation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/market-contract-summary-cleanup-v2.yml')
          text = path.read_text()
          old = '          npx tsc --noEmit\n'
          new = '          npm run generate:local-preview\n          npx tsc --noEmit\n'
          assert text.count(old) == 1
          path.write_text(text.replace(old, new, 1))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/market-contract-summary-validation-repair.yml
          git add .github/workflows/market-contract-summary-cleanup-v2.yml
          git diff --cached --check
          git commit -m 'chore: align cleanup typecheck with preview generation'
          git push origin HEAD:fix/market-contract-summary-cleanup-20260906
