name: Update auction deployment backup guard

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Update backup guard
        run: |
          set -euo pipefail
          python3 .agent/update-auction-backup-guard.py
          rm -f .agent/update-auction-backup-guard.py
          rm -f .github/workflows/agent-update-auction-backup-guard.yml
          rmdir .agent 2>/dev/null || true
          git diff --check
      - name: Commit backup guard
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "更新拍卖部署备份防回退规则"
          git push origin HEAD:${{ github.head_ref }}
