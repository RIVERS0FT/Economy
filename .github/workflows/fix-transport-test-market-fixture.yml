name: Fix transport market fixture

on:
  push:
    branches:
      - codex/transport-route-pages-auto-logistics

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.4.0
          cache: npm
      - run: npm ci
      - name: Apply fixture patch and validate transport tests
        run: |
          python3 scripts/fix-transport-test-market-fixture.py
          node scripts/verify-provincial-unlock-transport.mjs
          node --test server/test/transport.test.js
      - name: Commit patch and remove temporary files
        run: |
          rm -f scripts/fix-transport-test-market-fixture.py .github/workflows/fix-transport-test-market-fixture.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "initialize provincial markets in transport tests"
          git push origin HEAD:codex/transport-route-pages-auto-logistics
