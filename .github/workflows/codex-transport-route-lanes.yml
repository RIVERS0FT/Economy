name: Codex transport route lanes

on:
  push:
    branches:
      - codex/transport-route-parallel-lanes

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/transport-route-parallel-lanes
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.4.0
          cache: npm
      - name: Apply implementation
        run: python3 scripts/codex-apply-transport-route-lanes.py
      - name: Install dependencies
        run: npm ci
      - name: Verify targeted transport changes
        run: |
          npm run verify:transport-route-lanes
          npm run verify:provincial-unlock-transport
          npm run generate:local-preview
          npm run typecheck
          git diff --check
      - name: Commit final implementation
        run: |
          rm .github/workflows/codex-transport-route-lanes.yml
          rm scripts/codex-apply-transport-route-lanes.py
          git config user.name "Codex"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: render transport routes in parallel lanes"
          git push origin HEAD:codex/transport-route-parallel-lanes
