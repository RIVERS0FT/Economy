name: Apply navigation badge form verification

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/agent-diagnose-navigation-badges.yml"

permissions:
  contents: write

jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/unified-navigation-badges'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/unified-navigation-badges
          fetch-depth: 0
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply verification update and run build
        run: |
          git apply --check .agent/navigation-badge-form-verification.patch
          git apply .agent/navigation-badge-form-verification.patch
          rm -f .agent/navigation-badge-form-verification.patch
          rm -f .agent/navigation-badges-ci-error.txt

          set +e
          npm ci > /tmp/navigation-badge-ci.log 2>&1
          status=$?
          if [ "$status" -eq 0 ]; then
            npm run build >> /tmp/navigation-badge-ci.log 2>&1
            status=$?
          fi
          if [ "$status" -ne 0 ]; then
            tail -n 400 /tmp/navigation-badge-ci.log > .agent/navigation-badges-ci-error.txt
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "更新统一导航角标表单防回退"
          git push origin HEAD:agent/unified-navigation-badges
          exit 0
