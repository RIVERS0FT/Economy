name: Apply navigation badge page verification

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/agent-diagnose-navigation-badges.yml"

permissions:
  contents: write

jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/unified-navigation-badges'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/unified-navigation-badges
          fetch-depth: 0
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply and validate page verification
        run: |
          git apply --check .agent/navigation-badge-page-verification.patch
          git apply .agent/navigation-badge-page-verification.patch
          rm -f .agent/navigation-badge-page-verification.patch
          node scripts/verify-page-content.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "更新导航角标页面职责防回退"
          git push origin HEAD:agent/unified-navigation-badges
