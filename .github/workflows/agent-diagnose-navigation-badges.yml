name: Diagnose navigation badge CI

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/agent-diagnose-navigation-badges.yml"

permissions:
  contents: write

jobs:
  diagnose:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/unified-navigation-badges'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/unified-navigation-badges
          fetch-depth: 0
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Capture build failure
        run: |
          set +e
          npm ci > /tmp/navigation-badge-ci.log 2>&1
          status=$?
          if [ "$status" -eq 0 ]; then
            npm run build >> /tmp/navigation-badge-ci.log 2>&1
            status=$?
          fi
          if [ "$status" -ne 0 ]; then
            tail -n 400 /tmp/navigation-badge-ci.log > .agent/navigation-badges-ci-error.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -f .agent/navigation-badges-ci-error.txt
            git commit -m "记录导航角标完整构建错误"
            git push origin HEAD:agent/unified-navigation-badges
          fi
          exit 0
