name: Align mobile stack verifier
on:
  push:
    branches: [codex/warehouse-product-stack]
permissions:
  contents: write
jobs:
  apply:
    if: github.event.head_commit.message == 'stage mobile stack verifier alignment'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 scripts/codex-align-mobile-stack-verifier.py
      - run: git diff --check
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/verify-mobile-page-sheet.mjs
          git commit -m "align mobile sheet verifier with page stack close"
          git push origin HEAD:${GITHUB_REF_NAME}
