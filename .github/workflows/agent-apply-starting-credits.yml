name: Apply new player starting credits update

on:
  pull_request:
    types:
      - opened

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/increase-starting-credits-500
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.4.0
          cache: npm

      - name: Apply authoritative starting credits change
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              return text.replace(old, new, 1)

          domain_path = Path('server/src/domain-core.js')
          domain = domain_path.read_text()
          domain = replace_once(
              domain,
              "    lastEconomicActivityAt: now,\n    credits: 100,\n    frozenCredits: 0,",
              "    lastEconomicActivityAt: now,\n    credits: 500,\n    frozenCredits: 0,",
              'new player credits',
          )
          domain = replace_once(
              domain,
              "  addLedger(player, 'system', 100, '服务器发放玩家启动资金', now);",
              "  addLedger(player, 'system', 500, '服务器发放玩家启动资金', now);",
              'startup ledger',
          )
          domain_path.write_text(domain)

          design_path = Path('docs/PRODUCT_AND_GAMEPLAY_DESIGN.md')
          design = design_path.read_text()
          design = replace_once(design, '> 更新时间：2026-07-25', '> 更新时间：2026-08-03', 'design update date')
          marker = '工作只承担新玩家启动和经营失败后的兜底收入。生产、产业链和交易是中后期主要增长来源。'
          rule = '新玩家首次创建 Economy 玩家档案时，服务器一次性发放 **500 普通货币**作为启动资金，并写入同额系统账本；该规则只作用于此后首次建档，不迁移、不补发，也不改写既有玩家余额。'
          if rule not in design:
              design = replace_once(design, marker, f'{marker}\n\n{rule}', 'starting credits design rule')
          design_path.write_text(design)

          test_path = Path('server/test/domain.test.js')
          tests = test_path.read_text()
          test_case = """test('new players receive 500 credits with a matching startup ledger entry', () => {
            const world = createWorld(now);
            const player = ensurePlayer(world, alice, now);

            assert.equal(player.credits, 500);
            assert.equal(player.frozenCredits, 0);
            assert.equal(player.ledger.length, 1);
            assert.equal(player.ledger[0].category, 'system');
            assert.equal(player.ledger[0].amount, 500);
            assert.equal(player.ledger[0].balanceAfter, 500);
            assert.equal(player.ledger[0].description, '服务器发放玩家启动资金');
          });

          """
          insertion = """function deferDemand(world, at = now + cycleMs) {
            for (const state of Object.values(world.demandGroups)) state.nextDemandAt = at;
          }

          """
          if test_case not in tests:
              tests = replace_once(tests, insertion, insertion + test_case, 'starting credits test insertion')
          test_path.write_text(tests)

          verifier_path = Path('scripts/verify-starting-funds.mjs')
          verifier_path.write_text("""import { readFileSync } from 'node:fs';

          function assertRule(condition, message) {
            if (!condition) throw new Error(message);
          }

          const domain = readFileSync('server/src/domain-core.js', 'utf8');
          const design = readFileSync('docs/PRODUCT_AND_GAMEPLAY_DESIGN.md', 'utf8');
          const tests = readFileSync('server/test/domain.test.js', 'utf8');
          const packageJson = JSON.parse(readFileSync('package.json', 'utf8'));
          const createPlayerBlock = domain.slice(
            domain.indexOf('function createPlayer'),
            domain.indexOf('function migrateFacility'),
          );

          assertRule(createPlayerBlock.includes('credits: 500,'), '新玩家初始可用货币必须为 500');
          assertRule(
            createPlayerBlock.includes("addLedger(player, 'system', 500, '服务器发放玩家启动资金', now);"),
            '新玩家启动资金账本必须记录 500',
          );
          assertRule(!createPlayerBlock.includes('credits: 100,'), '不得恢复 100 初始货币');
          assertRule(
            design.includes('服务器一次性发放 **500 普通货币**作为启动资金'),
            '产品玩法权威文档必须记录 500 初始货币',
          );
          assertRule(
            design.includes('不迁移、不补发，也不改写既有玩家余额'),
            '产品玩法权威文档必须明确既有玩家余额不变',
          );
          assertRule(
            tests.includes("test('new players receive 500 credits with a matching startup ledger entry'"),
            '服务端必须保留新玩家启动资金回归测试',
          );
          assertRule(
            packageJson.scripts['verify:starting-funds'] === 'node scripts/verify-starting-funds.mjs',
            'package.json 必须登记启动资金专项验证',
          );
          assertRule(
            packageJson.scripts['verify:architecture'].includes('npm run verify:starting-funds'),
            '完整架构验证必须执行启动资金专项验证',
          );

          console.log('Starting funds rules verified.');
          """)

          package_path = Path('package.json')
          package_text = package_path.read_text()
          package_text = replace_once(
              package_text,
              '    "verify:money-precision": "node --experimental-strip-types scripts/verify-money-precision.mjs",\n',
              '    "verify:money-precision": "node --experimental-strip-types scripts/verify-money-precision.mjs",\n    "verify:starting-funds": "node scripts/verify-starting-funds.mjs",\n',
              'starting funds npm script',
          )
          package_text = replace_once(
              package_text,
              'node --experimental-strip-types scripts/verify-money-precision.mjs && node --experimental-strip-types scripts/verify-order-book-decimal-levels.mjs',
              'node --experimental-strip-types scripts/verify-money-precision.mjs && npm run verify:starting-funds && node --experimental-strip-types scripts/verify-order-book-decimal-levels.mjs',
              'architecture verification chain',
          )
          package_path.write_text(package_text)
          PY

      - name: Check patch formatting
        run: git diff --check

      - name: Install dependencies
        run: npm ci

      - name: Run focused verification
        run: |
          npm run verify:starting-funds
          node --test server/test/domain.test.js

      - name: Run complete build
        run: npm run build

      - name: Commit verified change and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/agent-apply-starting-credits.yml
          allowed='^( M|M |A |D ) (docs/PRODUCT_AND_GAMEPLAY_DESIGN.md|package.json|server/src/domain-core.js|server/test/domain.test.js|scripts/verify-starting-funds.mjs|.github/workflows/agent-apply-starting-credits.yml)$'
          unexpected="$(git status --short | grep -Ev "$allowed" || true)"
          if [[ -n "$unexpected" ]]; then
            echo 'Unexpected worktree changes:'
            echo "$unexpected"
            exit 1
          fi
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- docs/PRODUCT_AND_GAMEPLAY_DESIGN.md package.json server/src/domain-core.js server/test/domain.test.js scripts/verify-starting-funds.mjs
          git commit -m 'feat: increase new player starting credits to 500'
          git push origin HEAD:agent/increase-starting-credits-500
