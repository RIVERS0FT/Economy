name: Banking isolation full build validation
on:
  push:
    branches: [fix/banking-production-auto-operation-isolation-20260906]
    paths: [.github/workflows/banking-full-build-validation.yml]
permissions:
  contents: read
jobs:
  full-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.4.0
          cache: npm
      - run: npm ci
      - name: Run production-equivalent full build gate
        run: npm run build
