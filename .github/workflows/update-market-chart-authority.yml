name: Update market chart authority

on:
  push:
    branches:
      - agent/daily-check-in

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/daily-check-in
      - name: Update page design
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('docs/PAGE_CONTENT_AND_NAVIGATION_DESIGN.md')
          text = path.read_text()
          old = '概览页与市场页的商品行情统一统计当前资产最近 24h，按 6 分钟聚合为 240 个数据分段。每个分段的价格使用该段最后一笔成交价；没有成交的分段延续最近有效成交价，成交量为该段全部成交数量之和。价格折线图位于上方，成交量柱状图位于下方，两图纵向堆叠并共享同一横轴。概览页只使用紧凑尺寸，不得恢复“最近 24 笔成交”或仅价格折线的独立数据口径。'
          new = '市场页的商品行情统一统计当前资产最近 24h，按 6 分钟聚合为 240 个数据分段。每个分段的价格使用该段最后一笔成交价；没有成交的分段延续最近有效成交价，成交量为该段全部成交数量之和。价格折线图位于上方，成交量柱状图位于下方，两图纵向堆叠并共享同一横轴。市场页不得恢复“最近 24 笔成交”或仅价格折线的独立数据口径；概览页不再承载市场行情图。'
          if text.count(old) != 1:
              raise SystemExit('market chart authority paragraph not found exactly once')
          text = text.replace(old, new, 1)
          old = '市场页 `.chart-footer` 与概览页 `.overview-market-footer` 必须在容器本身统一使用 `--font-size-xs`，图表组件据此反算 SVG 坐标、轴标题和图例字号；不得只给容器内部的 `small` 设置字号。'
          new = '市场页 `.chart-footer` 必须在容器本身使用 `--font-size-xs`，图表组件据此反算 SVG 坐标、轴标题和图例字号；不得只给容器内部的 `small` 设置字号。'
          if text.count(old) != 1:
              raise SystemExit('chart footer authority paragraph not found exactly once')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit page design
        run: |
          git rm .github/workflows/update-market-chart-authority.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "docs: make market page the sole chart owner"
          git push origin HEAD:agent/daily-check-in
