name: Apply commodity row density patch

on:
  push:
    branches:
      - codex/commodity-row-density-20260830

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply final patch
        env:
          PATCH_SCRIPT_GZ_B64: 
        run: |
          python3 - <<'PY'
          import base64
          import gzip
          import os
          exec(compile(gzip.decompress(base64.b64decode(os.environ['PATCH_SCRIPT_GZ_B64'])), '<patch>', 'exec'))
          PY
          node scripts/verify-commodity-row-density.mjs
          node scripts/verify-market-information-hierarchy.mjs
          rm .github/workflows/agent-commodity-density-patch.yml
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "压缩商品列表行高并统一图标比例"
          git push origin HEAD:${GITHUB_REF_NAME}
