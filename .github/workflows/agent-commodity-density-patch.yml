          new_market_rule = '''- `MarketCommodityRow` 是商品全局详情地区行和地区市场目录的唯一共享商品数据行；一级市场商品目录保留自身聚合字段结构，但 `.global-market-goods-row` 必须与 `.market-commodity-row` 共同由 `market-commodity-row.css` 收束商品行密度，禁止两处分别维护高度或插画尺寸。共享列表固定使用独立表头“商品｜卖单量｜买单量｜市场价｜24h｜箭头”，商品全局详情地区列表首列为“地区”，地区行的可见身份只显示地区全名，不渲染商品插画、商品名称、类别或副标题；数据行固定为“实体身份｜卖单量值｜买单量值｜市场价值｜24h 值｜右向 Chevron”且不重复字段名，不显示挂单差额、基准偏离或挂单状态；这些分析指标只在具体地区商品详情保留。表头是唯一排序入口：可排序列渲染为按钮并使用 `role="columnheader"` + `aria-sort` 播报方向，采用“默认方向 → 反方向 → 恢复目录顺序”三态循环，数值列默认从优到劣、名称列默认升序，缺失值固定排末尾；筛选 disclosure 只承载筛选，不得恢复排序下拉或排序按钮组。普通商品身份槽桌面使用 `36px`、商品插画 `32px`；不大于 620px 时使用 `32px / 28px`，不大于 360px 时使用 `30px / 26px`；插画槽与 `ProductArtwork` 必须显式保持 `1:1`。商品数据行桌面最小高 `50px`，不大于 620px 时为 `46px`，不大于 360px 时为 `44px`，一级市场与地区商品目录必须同步。`44px` 是移动触控下限；商品目录需要连续扫描较多重复条目，因此只在商品数据行允许低于通用实体行的紧凑高度。移动端仍保持单行，不得恢复两列／多行摘要卡、隐藏四项核心指标或产生横向主滚动。商品详情头部继续复用对应主视觉；建筑从属交易详情调用按正式 ID 映射的 `FacilityIcon` 并保持居中 `cover`。
