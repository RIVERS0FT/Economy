          old_market_rule = '''- `MarketCommodityRow` 是商品全局详情地区行和地区市场目录的唯一共享商品数据行。共享列表固定使用独立表头“商品｜卖单量｜买单量｜市场价｜24h｜箭头”，商品全局详情地区列表首列为“地区”，地区行的可见身份只显示地区全名，不渲染商品插画、商品名称、类别或副标题；数据行固定为“实体身份｜卖单量值｜买单量值｜市场价值｜24h 值｜右向 Chevron”且不重复字段名，不显示挂单差额、基准偏离或挂单状态；这些分析指标只在具体地区商品详情保留。表头是唯一排序入口：可排序列渲染为按钮并使用 `role="columnheader"` + `aria-sort` 播报方向，采用“默认方向 → 反方向 → 恢复目录顺序”三态循环，数值列默认从优到劣、名称列默认升序，缺失值固定排末尾；筛选 disclosure 只承载筛选，不得恢复排序下拉或排序按钮组。普通商品身份槽桌面使用 `42px`、商品插画 `34px`；不大于 620px 时收紧为 `34px / 29px`，极窄屏继续缩小。移动端仍保持单行，不得恢复两列／多行摘要卡、隐藏四项核心指标或产生横向主滚动。商品详情头部继续复用对应主视觉；建筑从属交易详情调用按正式 ID 映射的 `FacilityIcon` 并保持居中 `cover`。
