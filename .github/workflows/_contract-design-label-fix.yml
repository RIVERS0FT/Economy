name: Contract design label fix

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'codex/contracts-core-workspace'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Restore authoritative player action labels
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('docs/PAGE_CONTENT_AND_NAVIGATION_DESIGN.md')
          text = path.read_text()
          old = '受偿玩家必须主动执行对应解除／领取动作；责任方不能自行解除来逃避赔付。双方均违约时按服务器权威规则解除且不发生单方赔付。玩家抵押借贷的抵押处置和工厂租赁违约后的使用权停止同样由服务器执行；市场储备作为无玩家操作主体时可以按服务器规则自动处置，例外不得扩大到玩家受偿合同。'
          new = '受偿玩家必须主动执行对应解除／领取动作：商品供货与工厂租赁等保证金赔付使用“解除合同并领取违约金”，玩家抵押借贷使用“解除合同并处置抵押”；责任方不能自行解除来逃避赔付。双方均违约时只显示“解除合同”，按服务器权威规则解除且不发生单方赔付。玩家抵押借贷的抵押处置和工厂租赁违约后的使用权停止同样由服务器执行；市场储备作为无玩家操作主体时可以按服务器规则自动处置，例外不得扩大到玩家受偿合同。'
          assert old in text
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/PAGE_CONTENT_AND_NAVIGATION_DESIGN.md
          git commit -m "补齐合同受偿动作权威文案"
          git push origin HEAD:${{ github.head_ref }}
