name: Fix liquid glass verifier
on:
  push:
    branches: [codex/warehouse-product-stack]
permissions:
  contents: write
jobs:
  apply:
    if: github.event.head_commit.message == 'stage liquid glass verifier fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 scripts/codex-fix-liquid-glass-verifier.py
      - run: git diff --check
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/verify-liquid-glass-chrome.mjs
          git commit -m "align liquid glass verifier with page location stack"
          git push origin HEAD:${GITHUB_REF_NAME}
