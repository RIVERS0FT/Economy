name: Apply PR 456 Change

on:
  push:
    branches:
      - agent/recover-pr450-bundle
  pull_request:
    branches:
      - main

concurrency:
  group: apply-pr456-change
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/recover-pr450-bundle
          fetch-depth: 0
      - name: Apply validated source patch
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          ready_file=.github/pr456-change.ready
          parts=(.github/pr456-change.patch.gz.b64.part*)
          if [ ! -f "$ready_file" ]; then
            echo "Change bundle is not ready."
            exit 0
          fi
          if [ "${#parts[@]}" -eq 0 ]; then
            echo "Change bundle parts are missing." >&2
            exit 1
          fi
          patch_file="$RUNNER_TEMP/pr456-change.patch"
          cat "${parts[@]}" | base64 --decode | gzip --decompress > "$patch_file"
          echo "a3dedd40dd006a24126458147fdba22a81bb6264f929cdc6e88e394a6368c744  $patch_file" | sha256sum --check
          mapfile -t patch_paths < <(git apply --numstat "$patch_file" | awk '{ print $3 }')
          git apply --check "$patch_file"
          git apply "$patch_file"
          rm -- "$ready_file" "${parts[@]}"
          git add -- "${patch_paths[@]}" "$ready_file" "${parts[@]}"
          git diff --cached --check
          git config user.name "RIVERS0FT Automation"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "feat: optimize onboarding architecture and capacity diagnostics"
          git push origin HEAD:agent/recover-pr450-bundle
