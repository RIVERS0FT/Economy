name: Patch Legacy Backup Rules Once

on:
  push:
    branches:
      - agent/compact-migration-backups

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/compact-migration-backups
      - name: Remove obsolete backup rules
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path

          path = Path('docs/SERVER_ARCHITECTURE_AND_DEPLOYMENT_DESIGN.md')
          text = path.read_text(encoding='utf-8')
          old_15 = '部署世界 15 前，`.github/workflows/deploy.yml` 必须在上传新服务前使用 Python `sqlite3.Connection.backup()` 为 `/var/lib/riversoft-economy/economy.sqlite` 创建 `economy-pre-world-v15-<UTC 时间>.sqlite` 在线快照，并对快照执行 `PRAGMA quick_check`；校验失败立即中止部署。迁移快照保留最近 10 份。回滚世界 15 必须同时恢复匹配的代码与数据库快照，禁止只回滚代码。'
          new_15 = '世界 15 资产拍卖迁移和世界 16 银行迁移的回滚仍必须同时恢复匹配代码与对应迁移前数据库快照，禁止只回滚代码、只删除字段或手工修改贷款与抵押。所有新建和后续保留的迁移快照统一遵守第 8 节紧凑 gzip SQLite 备份、全局最多 5 个迁移族和完整恢复校验规则，不再使用 `sqlite3.Connection.backup()` 复制源库高水位页布局。'
          old_16 = '部署世界 16 前必须使用相同在线备份机制创建 `economy-pre-world-v16-<UTC 时间>.sqlite`，执行 `PRAGMA quick_check` 成功后才可上传代码；世界 16 快照独立保留最近 10 份。回滚银行版本必须同时恢复世界 16 部署前数据库快照与匹配代码，禁止只删除银行字段、只回滚客户端或在生产数据库中手工修改贷款、抵押和利息池。'
          new_16 = '历史世界 15／16 未压缩快照只作为既有回滚资料，不作为新备份格式示例；验证新的紧凑压缩快照可恢复后，保留和清理由统一迁移族策略处理。'
          old_audit = '不存在时使用 SQLite 在线备份创建 `economy-pre-contract-audit-<UTC 时间>.sqlite.gz`，执行 `PRAGMA quick_check`、设置服务用户 `0600` 权限并保留最近 10 份。'
          new_audit = '不存在时使用 `VACUUM INTO` 创建无 freelist 的紧凑副本，执行 `PRAGMA quick_check`、外键与 `auto_vacuum` 校验，再生成 `economy-pre-contract-audit-<UTC 时间>.sqlite.gz` 并验证解压哈希；文件权限固定为服务用户 `0600`，保留最近 10 份。'
          for old, new in ((old_15, new_15), (old_16, new_16), (old_audit, new_audit)):
              if old in text:
                  text = text.replace(old, new, 1)
              elif new not in text:
                  raise SystemExit(f'backup rule anchor missing: {old[:60]}')
          path.write_text(text, encoding='utf-8')
          PYTHON
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/SERVER_ARCHITECTURE_AND_DEPLOYMENT_DESIGN.md
          git commit -m "移除旧完整备份与十份保留规则"
          git push origin HEAD:agent/compact-migration-backups
