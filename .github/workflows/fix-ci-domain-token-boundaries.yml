name: Validate CI domain token boundaries
on:
  push:
    branches: [fix/banking-production-auto-operation-isolation-20260906]
    paths: [.github/workflows/fix-ci-domain-token-boundaries.yml]
permissions:
  contents: write
jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.4.0
          cache: npm
      - run: npm ci
      - name: Fix auth domain lexical boundaries
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          selector = Path('scripts/select-ci-tests.mjs')
          text = selector.read_text()
          old = "  { name: 'auth', source: /(?:auth|registration|invite|invitation|ban|login)/i, candidate: /(?:auth|registration|invite|invitation|ban|login)/i },"
          new = "  { name: 'auth', source: /(?:\\bauth(?:entication)?\\b|\\bregistration\\b|\\binvites?\\b|\\binvitations?\\b|\\bbans?\\b|\\blogin\\b)/i, candidate: /(?:\\bauth(?:entication)?\\b|\\bregistration\\b|\\binvites?\\b|\\binvitations?\\b|\\bbans?\\b|\\blogin\\b)/i },"
          assert text.count(old) == 1
          selector.write_text(text.replace(old, new, 1))

          verifier = Path('scripts/verify-deployment-pipeline.mjs')
          text = verifier.read_text()
          old = """const directItPlan = selectCiPlan(['server/test/banking.test.js']);
          if (directItPlan.mode !== 'targeted' || !directItPlan.it.tests.includes('server/test/banking.test.js')) failures.push('直接修改 server test 时必须执行该 IT');
          """
          new = """const directItPlan = selectCiPlan(['server/test/banking.test.js']);
          if (directItPlan.mode !== 'targeted' || !directItPlan.it.tests.includes('server/test/banking.test.js')) failures.push('直接修改 server test 时必须执行该 IT');
          if (!directItPlan.reasons.includes('domains:banking')) failures.push('banking 测试不得因 ban 子串误归入 auth 域');
          for (const unrelated of ['server/test/auth-cache.test.js', 'server/test/authoritative-hotpaths.test.js', 'server/test/registration.test.js']) {
            if (directItPlan.it.tests.includes(unrelated)) failures.push(`banking 测试不得扩散无关 auth IT: ${unrelated}`);
          }
          const authoritativeItPlan = selectCiPlan(['server/test/authoritative-hotpaths.test.js']);
          if (authoritativeItPlan.reasons.includes('domains:auth')) failures.push('authoritative 测试不得因 auth 子串误归入认证域');
          """
          assert text.count(old) == 1
          verifier.write_text(text.replace(old, new, 1))

          design = Path('docs/CI_EXECUTION_DESIGN.md')
          text = design.read_text()
          old = "Targeted IT 的领域扩散只允许从本次变更中的 `server/src/**/*.js` 或直接修改的 `server/test/*.test.js` 推导；纯前端源码、设计文档、浏览器 spec、静态 verifier 或其他非服务端路径不得仅凭 `province`、`market` 等同名领域把服务器 IT 加入计划。服务器测试对改动文件存在直接引用时仍可按引用关系选择；`shared/`、`server/shared/` 与既有 high-risk 核心边界继续回退 full。这样 targeted IT 的 loaded-code 覆盖率只衡量与真实服务端影响相关的测试加载图，不得用无服务端改动的 UI 领域扩散制造无关分母。"
          new = old + " 领域关键词匹配必须遵守路径词边界，不得用裸子串把无关术语并入领域；例如认证域的 `auth` 不得命中 `authoritative`，封禁域词 `ban` 不得命中 `banking`。"
          assert text.count(old) == 1
          design.write_text(text.replace(old, new, 1))
          PY
          git diff --check
      - name: Verify selector contracts
        run: node scripts/verify-deployment-pipeline.mjs
      - name: Verify banking targeted coverage now uses the real domain graph
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { spawnSync } from 'node:child_process';
          import { selectCiPlan } from './scripts/select-ci-tests.mjs';
          const plan = selectCiPlan(['server/test/banking.test.js']);
          console.log(JSON.stringify(plan, null, 2));
          if (!plan.reasons.includes('domains:banking')) process.exit(2);
          const result = spawnSync('node', ['scripts/run-code-coverage.mjs', 'it', ...plan.it.tests], { stdio: 'inherit' });
          process.exit(result.status ?? 1);
          NODE
      - name: Commit tested CI boundary fix
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/CI_EXECUTION_DESIGN.md scripts/select-ci-tests.mjs scripts/verify-deployment-pipeline.mjs
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'fix: bound CI auth domain tokens to path words'
          git push origin HEAD:fix/banking-production-auto-operation-isolation-20260906
