name: Transport protocol alignment

on:
  push:
    branches:
      - codex/transport-route-pages-auto-logistics

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply transport protocol patch
        run: python3 scripts/transport-protocol-patch.py
      - name: Commit protocol alignment and remove temporary runner
        run: |
          rm -f scripts/transport-protocol-patch.py .github/workflows/transport-protocol-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "align automatic transport client protocol"
          git push origin HEAD:codex/transport-route-pages-auto-logistics
