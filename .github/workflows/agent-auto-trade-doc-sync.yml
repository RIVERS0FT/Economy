name: Temporary auto trade documentation sync

on:
  push:
    branches:
      - codex/commodity-auto-trade

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/commodity-auto-trade
          fetch-depth: 0
      - name: Align authoritative documentation
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';

          function patch(path, replacements) {
            let content = readFileSync(path, 'utf8');
            for (const [from, to] of replacements) {
              if (!content.includes(from)) {
                throw new Error(`${path} missing expected text: ${from}`);
              }
              content = content.replace(from, to);
            }
            writeFileSync(path, content);
          }

          patch('docs/README.md', [
            ['> 更新时间：2026-08-10', '> 更新时间：2026-08-11'],
            ['`WAREHOUSE_EXPANSION_DESIGN.md` | 无限共享仓库、真实商品库存、容量机制退役、客户端在线自动出售、商品卡和商品网格密度', '`WAREHOUSE_EXPANSION_DESIGN.md` | 无限共享仓库、真实商品库存、容量机制退役、客户端在线自动采购／自动出售、商品自动交易卡和商品网格密度'],
          ]);

          patch('docs/PAGE_CONTENT_AND_NAVIGATION_DESIGN.md', [
            ['> 更新时间：2026-08-10', '> 更新时间：2026-08-11'],
            ['仓库与在线自动出售设置、建设、工厂集群', '仓库与商品在线自动交易设置、建设、工厂集群'],
            ['├─ 左侧：自动出售', '├─ 左侧：自动交易'],
            ['自动出售、共享仓库、建设新工厂和工厂集群是生产页同一一级平面的卡片', '自动交易、共享仓库、建设新工厂和工厂集群是生产页同一一级平面的卡片'],
            ['桌面主布局中自动出售与建设新工厂共用 `minmax(280px, 320px)` 控制列宽度基线。', '桌面主布局中自动交易与建设新工厂共用 `minmax(280px, 320px)` 控制列宽度基线。'],
            ['完整库存与在线自动出售规则见 `WAREHOUSE_EXPANSION_DESIGN.md`。', '完整库存与在线自动交易规则见 `WAREHOUSE_EXPANSION_DESIGN.md`。'],
            ['仓库不提供“有库存／全部商品”筛选，只展示可用或冻结数量大于零的商品，以及当前玩家在本浏览器已启用在线自动出售策略的零库存商品。', '仓库不提供“有库存／全部商品”筛选，只展示可用或冻结数量大于零的商品，以及已启用在线自动采购或自动出售策略的零库存商品；其他零库存商品通过自动交易卡的全商品选择器配置。'],
            ['大于 `720px` 时自动出售控制卡位于共享仓库左侧；桌面主布局与“建设新工厂”使用同一 `minmax(280px, 320px)` 控制列宽度基线。移动端自动出售使用与工厂详情相同的底部抽屉：`720px` 及以下点击商品打开共享 `MobileWorkspaceDetailSheet`，保存动作固定在底栏，关闭后焦点返回商品卡；`721px` 起恢复左侧常驻控制卡。桌面与移动复用同一自动出售表单状态和字段逻辑。', '大于 `720px` 时自动交易控制卡位于共享仓库左侧；桌面主布局与“建设新工厂”使用同一 `minmax(280px, 320px)` 控制列宽度基线。移动端自动交易使用与工厂详情相同的底部抽屉：`720px` 及以下可通过共享仓库标题右侧“自动交易”入口在零库存时打开全商品选择器，也可点击商品卡直接打开对应商品；两种入口都复用 `MobileWorkspaceDetailSheet`，保存动作固定在底栏，关闭后焦点返回实际触发按钮；`721px` 起恢复左侧常驻控制卡。桌面与移动复用同一商品选择、采购／出售页签、表单草稿和原子保存逻辑。'],
            ['与仓库工作区的自动出售控制卡共用同一宽度基线', '与仓库工作区的自动交易控制卡共用同一宽度基线'],
            ['仓库管理、商品库存、客户端在线自动出售设置和扩容', '仓库管理、商品库存与客户端在线自动交易设置'],
          ]);

          patch('docs/UI_DESIGN_SYSTEM.md', [
            ['> 更新时间：2026-08-10', '> 更新时间：2026-08-11'],
            ['共享仓库工作区、桌面自动出售控制列、容器查询、紧凑商品卡和自动出售正文布局', '共享仓库工作区、桌面自动交易控制列、容器查询、紧凑商品卡和自动采购／自动出售正文布局'],
            ['移动工厂、研发详情与仓库自动出售设置共享的根级 Dialog', '移动工厂、研发详情与仓库自动交易设置共享的根级 Dialog'],
            ['移动工厂详情、移动研发详情与仓库自动出售设置是当前批准用途', '移动工厂详情、移动研发详情与仓库自动交易设置是当前批准用途'],
            ['仓库自动出售设置复用既有仓库表单信息层级并把保存动作放在共享固定底栏', '仓库自动交易设置复用统一商品选择器、采购／出售页签和既有仓库表单信息层级，并把原子保存动作放在共享固定底栏'],
          ]);

          patch('docs/SERVER_ARCHITECTURE_AND_DEPLOYMENT_DESIGN.md', [
            ['> 更新时间：2026-08-10', '> 更新时间：2026-08-11'],
            ['- 商品可用与冻结库存；', '- 商品可用与冻结库存；\n- 商品级在线自动采购／自动出售策略，以及仅当前玩家可见的托管买单／卖单私有关联；'],
            ['- `facility-auto-procure.js`：即时建厂缺料预检、真实商品卖盘价格保护、资金校验、事务内 FOK 采购，以及卖盘不足时按单次建造批量创建／取消正式商品买单的编排；', '- `facility-auto-procure.js`：即时建厂缺料预检、真实商品卖盘价格保护、资金校验、事务内 FOK 采购，以及卖盘不足时按单次建造批量创建／取消正式商品买单的编排；\n- `online-auto-trade-reservations.js`：商品自动采购／出售共享的生产预定与供货合同可用保留计算；\n- `online-auto-trade-policy.js`：同商品自动采购／出售策略的原子校验与保存，统一约束库存区间和价格区间；\n- `online-auto-buy-policy.js`、`online-auto-buy-orders.js`、`online-auto-buy.js`：自动采购存档策略、私有真实买单关联、资金释放与在线买单重平衡；\n- `online-auto-sell-policy.js`、`online-auto-sell-orders.js`、`online-auto-sell.js`：自动出售存档策略、私有真实卖单关联、库存释放与在线卖单重平衡；'],
            ['- `order-book-runtime.js`：按资产、方向、价格、时间和原数组顺序建立的事务内订单簿派生索引，以及玩家订单计数、仓库买单预占、工厂卖单冻结和需求组订单查询；', '- `order-book-runtime.js`：按资产、方向、价格、时间和原数组顺序建立的事务内订单簿派生索引，以及玩家普通订单计数、自动交易托管订单配额豁免、工厂卖单冻结和需求组订单查询；'],
            ['- `warehouse.js`：共享仓库容量、预占和扩容；', '- `warehouse.js`：无限共享仓库真实库存汇总，以及当前玩家自动采购／自动出售策略和私有托管订单关联的状态投影；'],
          ]);
          NODE

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/agent-auto-trade-doc-sync.yml
          git add docs/README.md docs/PAGE_CONTENT_AND_NAVIGATION_DESIGN.md docs/UI_DESIGN_SYSTEM.md docs/SERVER_ARCHITECTURE_AND_DEPLOYMENT_DESIGN.md
          git commit -m "docs: align commodity auto trade authority"
          git push origin HEAD:codex/commodity-auto-trade
