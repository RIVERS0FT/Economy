name: Apply online auto-sell implementation

on:
  push:
    branches:
      - feature/online-auto-sell
  workflow_dispatch:

permissions:
  contents: write

jobs:
  implement:
    if: ${{ github.actor != 'github-actions[bot]' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/online-auto-sell
          fetch-depth: 4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.4.0'
          cache: npm

      - name: Apply implementation from staged source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          source = subprocess.check_output(
              ['git', 'show', '61adde712eceb1f6d13e3f084a19893e9c401b1c:.github/workflows/apply-online-auto-sell.yml'],
              text=True,
          )
          lines = source.splitlines()
          start = lines.index("          python3 - <<'PY'") + 1
          end = lines.index('          PY', start)
          script = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in lines[start:end]
          ) + '\n'
          Path('/tmp/apply-online-auto-sell.py').write_text(script, encoding='utf-8')
          PY
          python3 /tmp/apply-online-auto-sell.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('server/src/online-auto-sell.js')
          source = path.read_text(encoding='utf-8')
          source = source.replace('  processFacilityGroupWorld,\n', '')
          source = source.replace('\n  processFacilityGroupWorld(world, now);\n', '\n')
          path.write_text(source, encoding='utf-8')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Run focused checks
        run: |
          node --test server/test/online-auto-sell.test.js server/test/tutorial-store.test.js
          node scripts/verify-online-auto-sell.mjs
          node scripts/verify-game-tutorial.mjs
          node scripts/verify-warehouse-expansion.mjs

      - name: Run full build verification
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser suite
        run: npm run test:browser

      - name: Commit verified implementation
        shell: bash
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            package.json \
            docs/README.md \
            docs/WAREHOUSE_EXPANSION_DESIGN.md \
            docs/PAGE_CONTENT_AND_NAVIGATION_DESIGN.md \
            docs/UNIFIED_ASSET_ORDER_BOOK_DESIGN.md \
            scripts/verify-game-tutorial.mjs \
            scripts/verify-online-auto-sell.mjs \
            scripts/verify-warehouse-expansion.mjs \
            server/src/domain.js \
            server/src/facility-groups.js \
            server/src/online-auto-sell.js \
            server/src/runtime-action-executor.js \
            server/src/tutorial-store.js \
            server/test/online-auto-sell.test.js \
            src/api/game.ts \
            src/app/GameApp.tsx \
            src/app/gameViewModel.ts \
            src/auto-sell/autoSellStorage.ts \
            src/auto-sell/useOnlineAutoSell.ts \
            src/components/warehouse/WarehouseUpgradeCard.tsx \
            src/game-guide/tutorialDefinition.ts \
            src/game-guide/tutorialStorage.ts \
            src/game-guide/useGameTutorial.ts \
            src/pages/PageRouter.tsx \
            src/pages/ProductionPage.tsx \
            src/pages/SettingsPage.tsx \
            src/styles/warehouse-expansion.css \
            src/utils/localActivityStore.ts
          git diff --cached --check
          git status --short
          git commit -m "feat: add online warehouse auto-sell"
          git push origin HEAD:feature/online-auto-sell
