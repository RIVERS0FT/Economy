### 7.1 在线自动出售

自动出售是玩家当前浏览器客户端的在线自动化，不是服务器后台策略，也不是长期卖单。设置按玩家 ID 保存在浏览器本地，只包含“启用／关闭”和最低出售价格；价格遵守商品订单相同的最低 `0.01` 与两位小数规则，不提供数量输入。客户端关闭、退出登录、断网或没有运行 Economy 页面时不会发起新的自动出售；不得为此增加在线心跳、自动出售专用轮询、全世界扫描调度器或后台常驻任务。正式状态刷新已经包含公开订单簿，在线客户端只在该状态中发现存在价格不低于最低出售价的现有买单时尝试一次自动出售。

服务器在每次自动出售事务内重新计算数量，客户端估算不得成为资产扣减依据：

```text
生产预定 = Σ(所有 enabled 工厂集群下一完整周期按当前生产配置所需的输入商品)
合同可用保留 = Σ(当前玩家作为供应方且启用自动准备的活跃供货合同／已接受续签中，下一批尚未进入 frozen 的缺口)
可自动出售 = max(0, available - 生产预定 - 合同可用保留)
本次自动出售数量 = min(可自动出售, 当前价格达到阈值的外部买单剩余量)
```

合同已经进入 `supplierReservedQuantity`／续签 `supplierReservedQuantity` 的商品继续属于真实 `frozen` 库存，本来就不在 `available` 中，不得重复扣除；普通手动商品卖单、商品拍卖等冻结资产同理已经从 `available` 排除。生产预定只保护 `enabled=true` 的工厂，运行中使用当前参与生产的实体数量，等待恢复的异常工厂使用当前生产可用实体数量；玩家手动关闭的工厂不形成生产预定。为了避免满员率恢复过程中提前卖掉原料，生产预定按实体工厂的完整周期投入保守保护，不按当前折算就业产能缩小。

自动出售复用现有 `POST /api/game/orders`，通过内部执行语义 `execution: online-auto-sell` 表示一次在线即时出售。服务器忽略客户端数量，自行按上述规则和当前达到阈值的买盘决定数量，再进入正式商品订单簿按价格优先／同价时间优先、maker price、卖方手续费、匿名成交和资产守恒规则成交；预期数量必须全部命中当时已经存在的买盘，若并发变化留下未成交部分，服务器在同一事务立即撤销余量并释放冻结商品。自动出售不得留下客户端离线后仍可继续成交的开放卖单，也不得通过该执行语义绕过自成交保护或扩大玩家普通未完成订单配额。

