name: Apply online auto-sell implementation

on:
  push:
    branches:
      - feature/online-auto-sell
  workflow_dispatch:

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/online-auto-sell
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24.4.0
          cache: npm

      - name: Apply implementation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, content):
              target = Path(path)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(content, encoding='utf-8')

          def replace(path, old, new, count=1):
              source = read(path)
              actual = source.count(old)
              if actual < count:
                  raise SystemExit(f'{path}: expected at least {count} occurrence(s), found {actual}: {old[:120]!r}')
              source = source.replace(old, new, count)
              write(path, source)

          write('src/auto-sell/autoSellStorage.ts', r'''export interface AutoSellPolicy {
            enabled: boolean;
            price: number;
          }

          export type AutoSellPolicyMap = Record<string, AutoSellPolicy>;

          export const AUTO_SELL_PANEL_EVENT = 'economy:auto-sell-panel';
          const STORAGE_VERSION = 1;

          export function autoSellStorageKey(userId: number) {
            return `economy.online-auto-sell.v${STORAGE_VERSION}.${userId}`;
          }

          function panelRequestKey(userId: number) {
            return `economy.online-auto-sell-panel.v${STORAGE_VERSION}.${userId}`;
          }

          function normalizePolicy(value: unknown): AutoSellPolicy | null {
            if (!value || typeof value !== 'object') return null;
            const raw = value as Partial<AutoSellPolicy>;
            const price = Number(raw.price);
            if (!Number.isFinite(price) || price < 0.01) return null;
            return {
              enabled: raw.enabled === true,
              price: Math.round(price * 100) / 100,
            };
          }

          export function loadAutoSellPolicies(userId: number): AutoSellPolicyMap {
            if (typeof window === 'undefined') return {};
            try {
              const raw = window.localStorage.getItem(autoSellStorageKey(userId));
              if (!raw) return {};
              const parsed = JSON.parse(raw) as Record<string, unknown>;
              return Object.fromEntries(Object.entries(parsed).flatMap(([productId, value]) => {
                const policy = normalizePolicy(value);
                return policy ? [[productId, policy]] : [];
              }));
            } catch {
              return {};
            }
          }

          export function saveAutoSellPolicies(userId: number, policies: AutoSellPolicyMap) {
            if (typeof window === 'undefined') return;
            try {
              window.localStorage.setItem(autoSellStorageKey(userId), JSON.stringify(policies));
            } catch {
              // Browser-local automation preferences must never block authoritative gameplay.
            }
          }

          export function clearAutoSellPolicies(userId: number) {
            if (typeof window === 'undefined') return;
            try {
              window.localStorage.removeItem(autoSellStorageKey(userId));
              window.sessionStorage.removeItem(panelRequestKey(userId));
            } catch {
              // Optional browser-local state may be unavailable.
            }
          }

          export function requestAutoSellPanel(userId: number, productId: string) {
            if (typeof window === 'undefined') return;
            try {
              window.sessionStorage.setItem(panelRequestKey(userId), productId);
            } catch {
              // The event below still supports an already-mounted production page.
            }
            window.dispatchEvent(new CustomEvent(AUTO_SELL_PANEL_EVENT, {
              detail: { userId, productId },
            }));
          }

          export function consumeAutoSellPanelRequest(userId: number) {
            if (typeof window === 'undefined') return null;
            try {
              const key = panelRequestKey(userId);
              const productId = window.sessionStorage.getItem(key);
              if (productId) window.sessionStorage.removeItem(key);
              return productId || null;
            } catch {
              return null;
            }
          }
          ''')

          write('src/auto-sell/useOnlineAutoSell.ts', r'''import { useCallback, useEffect, useMemo, useRef, useState } from 'react';
          import type { LoadedGameViewModel } from '../app/gameViewModel';
          import { productionContractStateFromGame } from '../contracts/types';
          import type { EconomyState, FacilityGroup, FacilityRecipeItem } from '../types';
          import type { TutorialAwareGameViewModel } from '../game-guide/useGameTutorial';
          import {
            loadAutoSellPolicies,
            saveAutoSellPolicies,
            type AutoSellPolicy,
            type AutoSellPolicyMap,
          } from './autoSellStorage';

          export interface AutoSellProductStatus {
            availableInventory: number;
            productionReserved: number;
            contractReserved: number;
            eligibleQuantity: number;
            blockedByOwnBuy: boolean;
            hasCrossingBuyer: boolean;
          }

          export interface OnlineAutoSellController {
            policies: AutoSellPolicyMap;
            busyProductId: string | null;
            policyFor: (productId: string) => AutoSellPolicy;
            statusFor: (productId: string) => AutoSellProductStatus;
            setPolicy: (productId: string, policy: AutoSellPolicy) => void;
          }

          export type OnlineAutoSellAwareGameViewModel = TutorialAwareGameViewModel & {
            autoSell: OnlineAutoSellController;
          };

          function nonNegativeInteger(value: unknown) {
            const normalized = Math.floor(Number(value));
            return Number.isSafeInteger(normalized) && normalized > 0 ? normalized : 0;
          }

          function activeRecipeInputs(game: EconomyState, group: FacilityGroup): FacilityRecipeItem[] {
            const type = game.facilityTypes.find((candidate) => candidate.id === group.facilityTypeId);
            if (!type) return [];
            const directRecipe = type.recipes.find((recipe) => recipe.id === group.activeRecipeId);
            if (directRecipe) return directRecipe.inputs;
            for (const methodGroup of type.productionMethodGroups ?? []) {
              for (const method of methodGroup.methods) {
                for (const plan of Object.values(method.plansByRecipeId)) {
                  if (plan.recipeId === group.activeRecipeId) return plan.inputs;
                }
              }
            }
            return type.inputs;
          }

          function productionReservations(game: EconomyState) {
            const reserved: Record<string, number> = {};
            for (const group of game.facilityGroups) {
              if (!group.enabled) continue;
              const physicalCount = group.status === 'running'
                ? nonNegativeInteger(group.participatingCount)
                : nonNegativeInteger(group.productionAvailableCount ?? group.count);
              if (physicalCount < 1) continue;
              for (const input of activeRecipeInputs(game, group)) {
                const quantity = nonNegativeInteger(input.quantity) * physicalCount;
                if (quantity > 0) reserved[input.productId] = (reserved[input.productId] ?? 0) + quantity;
              }
            }
            return reserved;
          }

          interface ContractReservation {
            display: number;
            availableHold: number;
          }

          function contractReservations(game: EconomyState) {
            const reserved: Record<string, ContractReservation> = {};
            const contracts = productionContractStateFromGame(game).productionContracts;
            const add = (productId: string, display: number, availableHold: number) => {
              const current = reserved[productId] ?? { display: 0, availableHold: 0 };
              current.display += nonNegativeInteger(display);
              current.availableHold += nonNegativeInteger(availableHold);
              reserved[productId] = current;
            };
            for (const contract of contracts) {
              if (
                contract.kind !== 'supply'
                || contract.status !== 'active'
                || !contract.isSupplier
                || contract.completedDeliveries >= contract.totalDeliveries
              ) continue;
              const quantity = nonNegativeInteger(contract.quantityPerDelivery);
              const frozen = Math.min(quantity, nonNegativeInteger(contract.supplierReservedQuantity));
              if (contract.supplierAutoReserve !== false) add(contract.productId, quantity, Math.max(0, quantity - frozen));
              else add(contract.productId, frozen, 0);

              const proposal = contract.renewalProposal;
              if (proposal?.status === 'accepted') {
                const renewalQuantity = nonNegativeInteger(proposal.terms.quantityPerDelivery);
                const renewalFrozen = Math.min(renewalQuantity, nonNegativeInteger(proposal.supplierReservedQuantity));
                if (contract.supplierAutoReserve !== false) {
                  add(contract.productId, renewalQuantity, Math.max(0, renewalQuantity - renewalFrozen));
                } else {
                  add(contract.productId, renewalFrozen, 0);
                }
              }
            }
            return reserved;
          }

          function isOpenCommodityBuy(game: EconomyState, productId: string, own: boolean, minimumPrice: number) {
            return game.orders.some((order) => (
              order.assetKind === 'commodity'
              && order.assetId === productId
              && order.side === 'buy'
              && ['open', 'partial'].includes(order.status)
              && Number(order.remaining || 0) > 0
              && Number(order.price || 0) >= minimumPrice
              && Boolean(order.isOwn) === own
            ));
          }

          export function useOnlineAutoSell(
            model: LoadedGameViewModel,
            callbacks: {
              onPolicyEnabled?: (productId: string) => void;
              onSale?: (productId: string) => void;
            } = {},
          ): OnlineAutoSellController {
            const userId = model.user.id;
            const [policies, setPolicies] = useState<AutoSellPolicyMap>(() => loadAutoSellPolicies(userId));
            const [busyProductId, setBusyProductId] = useState<string | null>(null);
            const busyRef = useRef(false);
            const productionReserved = useMemo(() => productionReservations(model.game), [model.game]);
            const contractReserved = useMemo(() => contractReservations(model.game), [model.game]);

            useEffect(() => {
              setPolicies(loadAutoSellPolicies(userId));
            }, [userId]);

            const policyFor = useCallback((productId: string): AutoSellPolicy => {
              const existing = policies[productId];
              if (existing) return existing;
              const product = model.game.products.find((candidate) => candidate.id === productId);
              return { enabled: false, price: Math.max(0.01, Number(product?.basePrice || 1)) };
            }, [model.game.products, policies]);

            const statusFor = useCallback((productId: string): AutoSellProductStatus => {
              const policy = policyFor(productId);
              const availableInventory = nonNegativeInteger(model.game.inventories[productId]?.available);
              const production = nonNegativeInteger(productionReserved[productId]);
              const contract = contractReserved[productId] ?? { display: 0, availableHold: 0 };
              return {
                availableInventory,
                productionReserved: production,
                contractReserved: nonNegativeInteger(contract.display),
                eligibleQuantity: Math.max(0, availableInventory - production - nonNegativeInteger(contract.availableHold)),
                blockedByOwnBuy: isOpenCommodityBuy(model.game, productId, true, policy.price),
                hasCrossingBuyer: isOpenCommodityBuy(model.game, productId, false, policy.price),
              };
            }, [contractReserved, model.game, policyFor, productionReserved]);

            const setPolicy = useCallback((productId: string, policy: AutoSellPolicy) => {
              const price = Math.round(Number(policy.price) * 100) / 100;
              if (!Number.isFinite(price) || price < 0.01) return;
              const normalized = { enabled: policy.enabled === true, price };
              setPolicies((current) => {
                const next = { ...current, [productId]: normalized };
                saveAutoSellPolicies(userId, next);
                return next;
              });
              if (normalized.enabled) callbacks.onPolicyEnabled?.(productId);
            }, [callbacks.onPolicyEnabled, userId]);

            useEffect(() => {
              if (busyRef.current) return;
              const candidate = model.game.products.find((product) => {
                const policy = policies[product.id];
                if (!policy?.enabled) return false;
                const status = statusFor(product.id);
                return status.eligibleQuantity > 0 && !status.blockedByOwnBuy && status.hasCrossingBuyer;
              });
              if (!candidate) return;
              const policy = policies[candidate.id];
              if (!policy) return;

              busyRef.current = true;
              setBusyProductId(candidate.id);
              void model.onlineAutoSell(candidate.id, policy.price)
                .then((result) => {
                  if (result.ok) callbacks.onSale?.(candidate.id);
                })
                .finally(() => {
                  busyRef.current = false;
                  setBusyProductId(null);
                });
            }, [callbacks.onSale, model, policies, statusFor]);

            return useMemo(() => ({
              policies,
              busyProductId,
              policyFor,
              statusFor,
              setPolicy,
            }), [busyProductId, policies, policyFor, setPolicy, statusFor]);
          }
          ''')

          write('server/src/online-auto-sell.js', r'''import { PRODUCT_CATALOG } from './domain.js';
          import {
            applyFacilityGroupAction,
            processFacilityGroupWorld,
            productionReservedQuantitiesForPlayer,
          } from './facility-groups.js';
          import { isOpenOrder, orderAssetId, orderKind } from './order-identity.js';
          import { normalizePlayerMoneyInput } from './money.js';

          const PRODUCT_BY_ID = new Map(PRODUCT_CATALOG.map((product) => [product.id, product]));

          function positiveInteger(value) {
            const normalized = Math.floor(Number(value));
            return Number.isSafeInteger(normalized) && normalized > 0 ? normalized : 0;
          }

          function activeSupplyContractsFor(world, userId, productId) {
            return (world.productionContracts || []).filter((contract) => (
              contract?.kind === 'supply'
              && contract?.status === 'active'
              && Number(contract?.supplierId) === Number(userId)
              && String(contract?.productId || '') === productId
              && positiveInteger(contract?.completedDeliveries) < positiveInteger(contract?.totalDeliveries)
            ));
          }

          export function contractAvailableHoldForAutoSell(world, userId, productId) {
            let hold = 0;
            for (const contract of activeSupplyContractsFor(world, userId, productId)) {
              if (contract.supplierAutoReserve !== false) {
                const required = positiveInteger(contract.quantityPerDelivery);
                const frozen = Math.min(required, positiveInteger(contract.supplierReservedQuantity));
                hold += Math.max(0, required - frozen);
              }
              const proposal = contract.renewalProposal;
              if (proposal?.status === 'accepted' && contract.supplierAutoReserve !== false) {
                const required = positiveInteger(proposal.terms?.quantityPerDelivery);
                const frozen = Math.min(required, positiveInteger(proposal.supplierReservedQuantity));
                hold += Math.max(0, required - frozen);
              }
            }
            return hold;
          }

          function qualifyingBuyOrders(world, userId, productId, minimumPrice) {
            return (world.orders || []).filter((order) => (
              orderKind(order) === 'commodity'
              && orderAssetId(order) === productId
              && order.side === 'buy'
              && isOpenOrder(order)
              && positiveInteger(order.remaining) > 0
              && Number(order.price || 0) >= minimumPrice
              && Number(order.ownerId) !== Number(userId)
            ));
          }

          export function crossingBuyQuantityForAutoSell(world, userId, productId, minimumPrice) {
            let total = 0;
            for (const order of qualifyingBuyOrders(world, userId, productId, minimumPrice)) {
              total = Math.min(Number.MAX_SAFE_INTEGER, total + positiveInteger(order.remaining));
            }
            return total;
          }

          function hasOwnCrossingBuy(world, userId, productId, minimumPrice) {
            return (world.orders || []).some((order) => (
              orderKind(order) === 'commodity'
              && orderAssetId(order) === productId
              && order.side === 'buy'
              && isOpenOrder(order)
              && Number(order.ownerId) === Number(userId)
              && Number(order.price || 0) >= minimumPrice
            ));
          }

          export function applyOnlineAutoSell(world, user, payload = {}, now = Date.now()) {
            const userId = Number(user.id);
            const productId = String(payload.productId || payload.assetId || '');
            const product = PRODUCT_BY_ID.get(productId);
            const minimumPrice = normalizePlayerMoneyInput(payload.price, { min: 0.01 });
            if (!product || minimumPrice === null) return { ok: false, message: '自动出售参数无效' };

            processFacilityGroupWorld(world, now);
            const player = world.players?.[String(userId)];
            if (!player) return { ok: false, message: '玩家不存在' };
            if (hasOwnCrossingBuy(world, userId, productId, minimumPrice)) {
              return { ok: false, message: '自己的买单达到自动出售价格，请先撤销反向订单' };
            }

            const inventory = player.inventories?.[productId] || { available: 0, frozen: 0 };
            const productionReserved = positiveInteger(
              productionReservedQuantitiesForPlayer(world, userId)[productId],
            );
            const contractHold = positiveInteger(contractAvailableHoldForAutoSell(world, userId, productId));
            const eligible = Math.max(0, positiveInteger(inventory.available) - productionReserved - contractHold);
            if (eligible < 1) return { ok: false, message: '当前没有扣除生产预定和合同预定后的可自动出售库存' };

            const crossingQuantity = crossingBuyQuantityForAutoSell(world, userId, productId, minimumPrice);
            const quantity = Math.min(eligible, crossingQuantity);
            if (quantity < 1) return { ok: false, message: '当前没有达到自动出售最低价的买单' };

            const existingOrderIds = new Set((world.orders || []).map((order) => String(order.id)));
            const placed = applyFacilityGroupAction(world, user, 'placeOrder', {
              assetKind: 'commodity',
              assetId: productId,
              productId,
              side: 'sell',
              quantity,
              price: minimumPrice,
              execution: 'online-auto-sell',
            }, now);
            if (!placed?.ok) return placed;

            const order = [...(world.orders || [])].reverse().find((candidate) => (
              !existingOrderIds.has(String(candidate.id))
              && Number(candidate.ownerId) === userId
              && orderKind(candidate) === 'commodity'
              && orderAssetId(candidate) === productId
              && candidate.side === 'sell'
            ));
            const filled = order
              ? Math.max(0, positiveInteger(order.quantity) - positiveInteger(order.remaining))
              : 0;

            if (order && isOpenOrder(order)) {
              applyFacilityGroupAction(world, user, 'cancelOrder', { orderId: order.id }, now);
            }
            if (filled < 1) return { ok: false, message: '买盘已变化，本次没有发生自动出售' };
            return {
              ok: true,
              message: `已按不低于 ${minimumPrice.toFixed(2)} 的价格自动出售 ${filled} 个${product.name}`,
            };
          }
          ''')

          write('server/test/online-auto-sell.test.js', r'''import assert from 'node:assert/strict';
          import test from 'node:test';
          import { createWorld, ensurePlayer } from '../src/domain.js';
          import {
            migrateFacilityGroupWorld,
            productionReservedQuantitiesForPlayer,
          } from '../src/facility-groups.js';
          import {
            applyOnlineAutoSell,
            contractAvailableHoldForAutoSell,
          } from '../src/online-auto-sell.js';
          import { isOpenOrder } from '../src/order-identity.js';

          const now = 1_700_000_000_000;
          const alice = { id: 1, email: 'alice@example.com', name: 'Alice' };
          const bob = { id: 2, email: 'bob@example.com', name: 'Bob' };

          function addBuyOrder(world, buyer, productId, quantity, price, id = `buy-${productId}`) {
            const total = quantity * price;
            buyer.credits -= total;
            buyer.frozenCredits += total;
            world.orders.push({
              id,
              assetKind: 'commodity',
              assetId: productId,
              productId,
              side: 'buy',
              ownerType: 'player',
              ownerId: buyer.userId,
              ownerName: buyer.playerName,
              price,
              quantity,
              remaining: quantity,
              status: 'open',
              fills: [],
              createdAt: now + 1,
            });
          }

          function group(typeId, count, overrides = {}) {
            return {
              facilityTypeId: typeId,
              count,
              participatingCount: 0,
              enabled: false,
              status: 'stopped',
              statusReason: 'manual',
              activeRecipeId: `${typeId}-default`,
              lifetimeOutput: 0,
              ...overrides,
            };
          }

          test('online auto sell keeps one full enabled production cycle of inputs', () => {
            const world = createWorld(now);
            const seller = ensurePlayer(world, alice, now);
            const buyer = ensurePlayer(world, bob, now);
            seller.credits = 1_000;
            buyer.credits = 10_000;
            seller.inventories.plastic.available = 5;
            seller.inventories.copper.available = 2;
            seller.facilityGroups = [group('electronics-factory', 2, {
              enabled: true,
              status: 'running',
              participatingCount: 2,
              cycleStartedAt: now,
            })];
            migrateFacilityGroupWorld(world, now);
            addBuyOrder(world, buyer, 'plastic', 10, 100);

            assert.equal(productionReservedQuantitiesForPlayer(world, alice.id).plastic, 2);
            const result = applyOnlineAutoSell(world, alice, {
              productId: 'plastic',
              price: 50,
            }, now + 2);

            assert.equal(result.ok, true);
            assert.equal(seller.inventories.plastic.available, 2);
            assert.equal(seller.inventories.plastic.frozen, 0);
            assert.equal(seller.facilityGroups[0].status, 'running');
            const ownAutoOrders = world.orders.filter((order) => (
              Number(order.ownerId) === alice.id && order.productId === 'plastic' && order.side === 'sell'
            ));
            assert.equal(ownAutoOrders.length, 1);
            assert.equal(ownAutoOrders[0].status, 'filled');
            assert.equal(ownAutoOrders[0].remaining, 0);
          });

          test('online auto sell preserves the unfrozen shortfall of an auto-reserved supply contract', () => {
            const world = createWorld(now);
            const seller = ensurePlayer(world, alice, now);
            const buyer = ensurePlayer(world, bob, now);
            buyer.credits = 10_000;
            seller.inventories.wheat.available = 9;
            seller.inventories.wheat.frozen = 1;
            world.productionContracts = [{
              id: 'supply-1',
              kind: 'supply',
              status: 'active',
              supplierId: alice.id,
              productId: 'wheat',
              quantityPerDelivery: 4,
              supplierReservedQuantity: 1,
              supplierAutoReserve: true,
              completedDeliveries: 0,
              totalDeliveries: 10,
            }];
            addBuyOrder(world, buyer, 'wheat', 10, 10);

            assert.equal(contractAvailableHoldForAutoSell(world, alice.id, 'wheat'), 3);
            const result = applyOnlineAutoSell(world, alice, {
              productId: 'wheat',
              price: 5,
            }, now + 2);

            assert.equal(result.ok, true);
            assert.equal(seller.inventories.wheat.available, 3);
            assert.equal(seller.inventories.wheat.frozen, 1);
          });

          test('online auto sell leaves no standing sell order when qualifying demand disappears', () => {
            const world = createWorld(now);
            const seller = ensurePlayer(world, alice, now);
            seller.inventories.wheat.available = 10;
            const beforeOrders = world.orders.length;

            const result = applyOnlineAutoSell(world, alice, {
              productId: 'wheat',
              price: 5,
            }, now + 1);

            assert.equal(result.ok, false);
            assert.equal(world.orders.length, beforeOrders);
            assert.equal(seller.inventories.wheat.available, 10);
            assert.equal(seller.inventories.wheat.frozen, 0);
          });

          test('own crossing buy blocks online auto sell instead of creating a self-cross', () => {
            const world = createWorld(now);
            const seller = ensurePlayer(world, alice, now);
            const buyer = ensurePlayer(world, bob, now);
            seller.credits = 1_000;
            buyer.credits = 1_000;
            seller.inventories.wheat.available = 10;
            addBuyOrder(world, seller, 'wheat', 1, 8, 'own-buy');
            addBuyOrder(world, buyer, 'wheat', 2, 8, 'external-buy');

            const result = applyOnlineAutoSell(world, alice, {
              productId: 'wheat',
              price: 5,
            }, now + 2);

            assert.equal(result.ok, false);
            assert.match(result.message, /自己的买单/);
            assert.equal(seller.inventories.wheat.available, 10);
            assert.equal(world.orders.filter((order) => Number(order.ownerId) === alice.id && order.side === 'sell').length, 0);
            assert.equal(world.orders.filter((order) => isOpenOrder(order) && order.side === 'buy').length, 2);
          });
          ''')

          insert_point = "function describeCounterparty(order) {\n"
          production_helper = r'''export function productionReservedQuantitiesForPlayer(world, userId) {
            const player = world.players?.[String(userId)];
            const reserved = {};
            if (!player) return reserved;
            for (const group of player.facilityGroups || []) {
              if (!group.enabled) continue;
              const type = typeFor(group.facilityTypeId);
              if (!type) continue;
              const physicalCount = group.status === 'running'
                ? Math.max(0, Math.floor(Number(group.participatingCount || 0)))
                : availableGroupCount(world, player, group);
              if (physicalCount < 1) continue;
              for (const input of recipeInputs(activeRecipeFor(type, group))) {
                const quantity = Math.max(0, Math.floor(Number(input.quantity || 0))) * physicalCount;
                if (quantity > 0) reserved[input.productId] = Number(reserved[input.productId] || 0) + quantity;
              }
            }
            return reserved;
          }

          '''
          replace('server/src/facility-groups.js', insert_point, production_helper + insert_point)

          replace(
              'server/src/domain.js',
              "  const fillOrKill = payload.execution === 'fill-or-kill';\n",
