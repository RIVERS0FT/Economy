name: Prepare regional building tabs
on:
  push:
    branches: [codex/regional-commercial-industrial-tabs]
    paths: [.github/workflows/prepare-regional-building-tabs.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/regional-commercial-industrial-tabs
          fetch-depth: 0
      - name: Apply reviewed edits and remove temporary transport
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/apply-regional-building-tabs.py
          git add -A
          node scripts/normalize-repository-text.mjs
          git add -A
          git diff --cached --check
          git diff --cached --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: separate regional commercial and industrial building tabs'
          git push origin HEAD:codex/regional-commercial-industrial-tabs
