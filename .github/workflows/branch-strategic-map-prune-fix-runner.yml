name: Fix strategic map prune runner

on:
  push:
    branches:
      - codex/strategic-map-pruned-context

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/strategic-map-pruned-context
          fetch-depth: 0
      - name: Separate browser preparation from execution
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/branch-strategic-map-prune-context.yml')
          text = path.read_text()
          old = '''      - name: Run strategic map browser regressions
        run: |
          bash scripts/prepare-playwright-chromium.sh
          npx playwright test tests/browser/province-map-world-boundary.spec.ts tests/browser/map-reset-sync.spec.ts tests/browser/map-zoom-out-boundary.spec.ts tests/browser/province-map.spec.ts --project=chromium --workers=1
'''
          new = '''      - name: Prepare Chromium
        run: bash scripts/prepare-playwright-chromium.sh

      - name: Run strategic map browser regressions
        run: npx playwright test tests/browser/province-map-world-boundary.spec.ts tests/browser/map-reset-sync.spec.ts tests/browser/map-zoom-out-boundary.spec.ts tests/browser/province-map.spec.ts --project=chromium --workers=1
'''
          if text.count(old) != 1:
              raise SystemExit('browser regression step anchor missing')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit runner fix
        run: |
          rm -f .github/workflows/branch-strategic-map-prune-fix-runner.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/branch-strategic-map-prune-context.yml .github/workflows/branch-strategic-map-prune-fix-runner.yml
          git diff --cached --check
          git commit -m 'Fix strategic map browser runner handoff'
          git push origin HEAD:codex/strategic-map-pruned-context
