name: codex-browser-flake-fix

on:
  push:
    branches:
      - codex/market-global-product-detail

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/market-global-product-detail
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.4.0
      - run: node scripts/codex-browser-flake-fix.mjs
      - run: rm scripts/codex-browser-flake-fix.mjs .github/workflows/codex-browser-flake-fix.yml
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "稳定市场与移动端浏览器回归"
          git push origin HEAD:codex/market-global-product-detail
