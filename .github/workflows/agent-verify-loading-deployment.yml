name: Verify loading-state deployment

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
    paths:
      - .github/workflows/agent-verify-loading-deployment.yml

permissions:
  actions: read
  contents: read
  statuses: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      TARGET_SHA: 2e00ffb4ce0760fc795644e1b8fa5cc4cd6c2697
    steps:
      - name: Wait for exact deployment run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          import time
          import urllib.parse
          import urllib.request

          repository = os.environ['GH_REPOSITORY']
          target_sha = os.environ['TARGET_SHA']
          token = os.environ['GH_TOKEN']
          query = urllib.parse.urlencode({
              'head_sha': target_sha,
              'event': 'push',
              'per_page': '10',
          })
          url = f'https://api.github.com/repos/{repository}/actions/workflows/deploy.yml/runs?{query}'
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'User-Agent': 'RIVERS0FT-Economy-deployment-verifier',
              'X-GitHub-Api-Version': '2022-11-28',
          }

          for attempt in range(90):
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=30) as response:
                  payload = json.load(response)
              runs = payload.get('workflow_runs', [])
              if not runs:
                  print(f'No deployment run found yet for {target_sha}; attempt {attempt + 1}/90')
                  time.sleep(10)
                  continue
              run = max(runs, key=lambda item: item.get('run_attempt', 1))
              print(json.dumps({
                  'id': run.get('id'),
                  'html_url': run.get('html_url'),
                  'status': run.get('status'),
                  'conclusion': run.get('conclusion'),
                  'head_sha': run.get('head_sha'),
              }, ensure_ascii=False))
              if run.get('status') != 'completed':
                  time.sleep(10)
                  continue
              if run.get('conclusion') != 'success':
                  raise SystemExit(f"Deployment run {run.get('id')} concluded {run.get('conclusion')}")
              break
          else:
              raise SystemExit('Timed out waiting for the exact deployment run')
          PYTHON

      - name: Verify live website assets and routes
        shell: bash
        run: |
          set -euo pipefail
          base='https://game.riversoft.top/economy/'
          html='/tmp/economy-index.html'
          main_js='/tmp/economy-main.js'
          game_js='/tmp/economy-game.js'

          curl --fail --silent --show-error --location --retry 5 --retry-delay 3 "$base" --output "$html"
          script_src="$(grep -oE 'src="[^"]+\.js"' "$html" | head -n 1 | cut -d'"' -f2)"
          test -n "$script_src"
          case "$script_src" in
            https://*) main_url="$script_src" ;;
            /*) main_url="https://game.riversoft.top${script_src}" ;;
            *) main_url="${base}${script_src#./}" ;;
          esac
          curl --fail --silent --show-error --location --retry 5 --retry-delay 3 "$main_url" --output "$main_js"
          grep -Fq '正在连接统一账号服务' "$main_js"
          grep -Fq '正在加载金融帝国' "$main_js"

          game_chunk="$(grep -oE 'GameApp-[A-Za-z0-9_-]+\.js' "$main_js" | head -n 1)"
          test -n "$game_chunk"
          curl --fail --silent --show-error --location --retry 5 --retry-delay 3 \
            "https://game.riversoft.top/economy/assets/${game_chunk}" --output "$game_js"
          grep -Fq '正在连接权威游戏服务器' "$game_js"

          auth_status="$(curl --silent --show-error --output /tmp/economy-auth.json --write-out '%{http_code}' \
            https://game.riversoft.top/economy-api/me || true)"
          case "$auth_status" in 200|401) ;; *) cat /tmp/economy-auth.json || true; exit 1 ;; esac

          game_status="$(curl --silent --show-error --output /tmp/economy-state.json --write-out '%{http_code}' \
            https://game.riversoft.top/economy-api/game/state || true)"
          test "$game_status" = '401'

          echo "LIVE_MAIN_ASSET=$main_url"
          echo "LIVE_GAME_ASSET=https://game.riversoft.top/economy/assets/${game_chunk}"
          echo "LIVE_AUTH_STATUS=$auth_status"
          echo "LIVE_GAME_STATUS=$game_status"

      - name: Publish successful deployment status
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          curl --fail --silent --show-error --request POST \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GH_REPOSITORY/statuses/$TARGET_SHA" \
            --data '{"state":"success","context":"agent/deployment-verification","description":"Deployment and live loading assets verified"}' >/dev/null

      - name: Publish failed deployment status
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          curl --fail --silent --show-error --request POST \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GH_REPOSITORY/statuses/$TARGET_SHA" \
            --data '{"state":"failure","context":"agent/deployment-verification","description":"Deployment or live verification failed"}' >/dev/null
