name: codex-market-finalize

on:
  push:
    branches:
      - codex/market-global-product-detail

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/market-global-product-detail
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.4.0
      - name: Apply final market rules
        run: node scripts/codex-market-finalize.mjs
      - name: Remove one-time migration files
        run: rm scripts/codex-market-finalize.mjs .github/workflows/codex-market-finalize.yml
      - name: Commit final state
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "完成市场商品全局详情重构"
          git push origin HEAD:codex/market-global-product-detail
