name: Fix commercial verifier residue

on:
  push:
    branches:
      - feat/commercial-buildings

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/commercial-buildings
          fetch-depth: 0
      - name: Replace stale province navigation token
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/verify-provincial-economy.mjs')
          text = path.read_text()
          old = "'州级上下文页（无导航按钮）', '概览｜市场｜建筑｜仓库', '中文州全名作为唯一州面名称'"
          new = "'州级上下文页（无导航按钮）', '概览｜市场｜商业｜工业｜仓库', '中文州全名作为唯一州面名称'"
          if old not in text:
              raise SystemExit('stale province navigation verifier token not found')
          path.write_text(text.replace(old, new, 1))
          Path('.github/workflows/fix-commercial-verifier.yml').unlink()
          PY
      - name: Commit patch and remove helper workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: 更新地区五分区验证口径"
          git push origin HEAD:feat/commercial-buildings
