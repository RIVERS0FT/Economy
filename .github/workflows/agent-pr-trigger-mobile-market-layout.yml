name: Trigger mobile market layout application

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: agent-mobile-market-entry-book-columns-pr
  cancel-in-progress: false

jobs:
  apply-and-verify:
    if: github.head_ref == 'agent/mobile-market-entry-book-columns'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: agent/mobile-market-entry-book-columns
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.4.0
          cache: npm

      - name: Extract and run approved edits
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/agent-apply-mobile-market-layout.yml').read_text(encoding='utf-8')
          marker = '      - name: Apply approved layout changes\n        shell: bash\n        run: |\n'
          start = workflow.index(marker) + len(marker)
          end = workflow.index('\n      - name: Check patch formatting', start)
          block = workflow[start:end]
          lines = []
          in_triple = False
          for line in block.splitlines():
              has_triple = "'''" in line or '"""' in line
              if in_triple:
                  if has_triple:
                      lines.append(line[10:] if line.startswith('          ') else line)
                      in_triple = False
                  else:
                      lines.append(line)
                  continue
              normalized = line[10:] if line.startswith('          ') else line
              lines.append(normalized)
              if has_triple and normalized.count("'''") % 2 == 1:
                  in_triple = True
              elif has_triple and normalized.count('"""') % 2 == 1:
                  in_triple = True
          Path('/tmp/apply-mobile-market-layout.sh').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          bash /tmp/apply-mobile-market-layout.sh

      - name: Update compact order-entry verification
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('scripts/verify-market-order-entry-compact.mjs')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  "  'grid-template-columns: minmax(0, 2fr) minmax(126px, 1fr);',",
                  "  'grid-template-columns: minmax(0, 3fr) minmax(112px, 2fr);',\n  '@container market-page (max-width: 359px)',\n  'grid-template-columns: 24px minmax(0, 1fr) 34px;',",
              ),
              (
                  "  '约 66%／34%',",
                  "  '不大于 `720px` 的移动端始终同时显示下单区和五档盘口',\n  '盘口保留不小于 112px 的可读宽度',",
              ),
              (
                  "forbidText(pagePath, 'market-order-details');",
                  "forbidText(pagePath, 'market-order-details');\nforbidText(pagePath, 'compactTradeView');\nforbidText(pagePath, 'market-compact-view-switch');",
              ),
              (
                  "forbidText(stylePath, '.market-order-details');",
                  "forbidText(stylePath, '.market-order-details');\nforbidText(stylePath, '@container market-page (max-width: 339px)');\nforbidText(stylePath, 'grid-template-columns: minmax(0, 2fr) minmax(126px, 1fr);');",
              ),
              (
                  "console.log('市场同行标签、内嵌步进按钮稳定定位、聚焦金额滚轮、详情移除和订单簿宽度验证通过。');",
                  "console.log('市场同行标签、内嵌步进按钮稳定定位、聚焦金额滚轮、详情移除、移动端永久双列和极窄盘口验证通过。');",
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'compact verifier expected one match, found {count}: {old}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')

          runtime_path = Path('tests/browser/market-runtime.spec.ts')
          runtime_text = runtime_path.read_text(encoding='utf-8')
          old_ratio = '''  expect(narrowOrder.width / narrowBook.width).toBeGreaterThan(1.75);
  expect(narrowOrder.width / narrowBook.width).toBeLessThan(2.25);'''
          new_ratio = '''  expect(narrowOrder.width / narrowBook.width).toBeGreaterThan(1.4);
  expect(narrowOrder.width / narrowBook.width).toBeLessThan(1.7);'''
          count = runtime_text.count(old_ratio)
          if count != 1:
              raise SystemExit(f'market runtime expected one old narrow ratio block, found {count}')
          runtime_path.write_text(runtime_text.replace(old_ratio, new_ratio, 1), encoding='utf-8')
          PY

      - name: Check patch formatting
        run: git diff --check

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run market layout gates
        run: |
          node scripts/verify-market-page-layout.mjs
          npm run verify:market-desktop-cleanup
          node scripts/verify-market-order-entry-compact.mjs

      - name: Run complete build
        run: npm run build

      - name: Run browser regression suite
        run: npm run test:browser

      - name: Commit verified source changes
        shell: bash
        run: |
          rm .github/workflows/agent-apply-mobile-market-layout.yml
          rm .github/workflows/agent-pr-trigger-mobile-market-layout.yml
          git diff --check
          git status --short
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- \
            docs/UNIFIED_ASSET_ORDER_BOOK_DESIGN.md \
            src/pages/MarketPage.tsx \
            src/styles/market-page-polish.css \
            src/styles/market-desktop-cleanup.css \
            scripts/verify-market-page-layout.mjs \
            scripts/verify-market-desktop-cleanup.mjs \
            scripts/verify-market-order-entry-compact.mjs \
            tests/browser/market-runtime.spec.ts \
            tests/browser/market-desktop-cleanup.spec.ts \
            .github/workflows/agent-apply-mobile-market-layout.yml \
            .github/workflows/agent-pr-trigger-mobile-market-layout.yml
          git commit -m "feat: keep mobile market entry and book side by side"
          git push origin HEAD:agent/mobile-market-entry-book-columns
