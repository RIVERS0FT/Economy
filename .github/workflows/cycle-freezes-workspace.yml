name: Cycle freeze isolated workspace
on:
  push:
    branches: [codex/cycle-profit-freezes-20260905]
    paths: [.github/workflows/cycle-freezes-workspace.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 26dae91f41a7e0fec55b7c4e5ecbcba7a066e2bf
      - uses: actions/setup-node@v4
        with:
          node-version: 24.4.0
          cache: npm
      - run: npm ci
      - name: Package pinned local verification tools
        run: |
          cp "$(command -v node)" economy-node
          tar -czf economy-tools.tar.gz node_modules economy-node
      - uses: actions/upload-artifact@v4
        with:
          name: cycle-freezes-tools
          path: economy-tools.tar.gz
          retention-days: 1
