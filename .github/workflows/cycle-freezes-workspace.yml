name: Cycle freeze isolated workspace
on:
  push:
    branches: [codex/cycle-profit-freezes-20260905]
    paths: [.github/workflows/cycle-freezes-workspace.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 26dae91f41a7e0fec55b7c4e5ecbcba7a066e2bf
      - name: Package tracked source only
        run: git archive --format=tar.gz --output=economy-source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: cycle-freezes-source
          path: economy-source.tar.gz
          retention-days: 1
