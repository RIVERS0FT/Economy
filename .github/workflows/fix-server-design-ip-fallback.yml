name: Fix server design IP fallback

on:
  push:
    branches:
      - docs/design-authority-compression-current-20260902

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.4.0
      - name: Record IP fallback authority boundaries
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('docs/SERVER_ARCHITECTURE_AND_DEPLOYMENT_DESIGN.md')
          text = path.read_text(encoding='utf-8')
          rule = '''生产公网 IP 的唯一部署来源固定为 `ECONOMY_PRODUCTION_PUBLIC_IP=116.204.134.56`；SSH、IP 证书、临时 Nginx 入口和 Deploy 外部验收必须全部读取该值，不得继续使用独立 `SERVER_HOST` Secret，不得在脚本中维护第二个独立 IP 常量。临时 IP HTTPS 入口保持 `COOKIE_SECURE=true`；短期证书申请使用 `--preferred-profile shortlived`，续签由 `riversoft-economy-ip-cert-renew.timer` 管理。TLS 验收不得加 `-k`，证书状态直接读取 `/etc/letsencrypt/live/`，本机正式 HTTPS 验收使用 `--connect-to` 指向 `127.0.0.1:443`。回收 fallback 时必须删除临时 IP 虚拟主机、续签 timer 和专用短期证书。'''
          if rule not in text:
              marker = '## 9. Nginx 与验收'
              if marker not in text:
                  raise SystemExit('SERVER DESIGN 缺少 Nginx 章节锚点')
              text = text.replace(marker, rule + '\n\n' + marker, 1)
              path.write_text(text, encoding='utf-8')
          PY
      - name: Verify IP fallback contract
        run: |
          node scripts/verify-document-authority.mjs
          node scripts/run-python.mjs scripts/test_configure_economy_ip_fallback_nginx.py
          git diff --check
      - name: Commit design fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/SERVER_ARCHITECTURE_AND_DEPLOYMENT_DESIGN.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m '补齐公网 IP fallback 部署边界'
          git push origin HEAD:${GITHUB_REF_NAME}
