name: One-shot compact transport UI authority

on:
  push:
    branches:
      - codex/transport-route-cards-footer
    paths:
      - .github/workflows/one-shot-compact-transport-ui-rule.yml

permissions:
  contents: write

jobs:
  compact:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: codex/transport-route-cards-footer
          fetch-depth: 0

      - name: Compact transport object-card rule
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('docs/UI_DESIGN_SYSTEM.md')
          text = path.read_text(encoding='utf-8')
          old = '运输路线是已登记的独立业务对象例外：每条已保存路线同时承载名称、运行状态、完整站点路径、运输方式、行程、站点数、一次性建线投入和进入独立详情的整体操作，去掉对象边界会让相邻路线的属性归属变得含混。因此一级运输页每条路线固定使用 `.ui-entity-card`，路线卡之间只使用共享 `gap` 分隔，不绘制行分割线；该例外不得扩展到商品目录、工厂目录、成交或历史记录。运输页固定底部“增加路线”属于页面内 sticky 操作区，不使用毛玻璃或浮动阴影，不显示路线数量／上限胶囊，并必须始终位于当前页面承载面和移动安全区内。'
          new = '运输路线是已登记的独立业务对象例外：一级运输页每条路线固定使用 `.ui-entity-card`，路线卡之间只使用共享 `gap` 分隔且不绘制行分割线；不得扩展到商品、工厂、成交或历史记录。运输页“增加路线”固定在底部 sticky 操作区，不使用毛玻璃或浮动阴影，不显示路线数量／上限胶囊，并保持在页面承载面和移动安全区内。'
          if old not in text:
              raise SystemExit('transport UI authority paragraph not found')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

          workflow = Path('.github/workflows/one-shot-compact-transport-ui-rule.yml')
          workflow.unlink()
          PY

      - name: Commit compaction and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/UI_DESIGN_SYSTEM.md .github/workflows/one-shot-compact-transport-ui-rule.yml
          git commit -m "Compact transport UI authority wording"
          git push origin HEAD:codex/transport-route-cards-footer
