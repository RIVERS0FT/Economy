name: Codex Map Single Camera Followup

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  followup:
    if: github.head_ref == 'codex/fix-map-single-camera-20260822'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Fix verifier quoting and camera reset authority
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          verifier = Path('scripts/verify-provincial-economy.mjs')
          text = verifier.read_text(encoding='utf-8')
          pairs = [
              ("  'expect(duringAnimation.mapTransform).toBe('')',", "  \"expect(duringAnimation.mapTransform).toBe('')\","),
              ("  'expect(duringAnimation.labelTransform).toBe('')',", "  \"expect(duringAnimation.labelTransform).toBe('')\","),
          ]
          for old, new in pairs:
              if text.count(old) != 1:
                  raise SystemExit(f'verifier quote replacement mismatch: {old!r}')
              text = text.replace(old, new, 1)
          verifier.write_text(text, encoding='utf-8')

          ui = Path('docs/UI_DESIGN_SYSTEM.md')
          text = ui.read_text(encoding='utf-8')
          old = '只有首次图表就绪与容器真实尺寸变化允许应用基础 Contain 相机。'
          new = '只有首次图表就绪、容器真实尺寸变化或用户在地图空白双击／双触重置时允许应用基础 Contain 相机。'
          if text.count(old) != 1:
              raise SystemExit(f'UI reset authority replacement mismatch: {text.count(old)}')
          ui.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit followup and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/codex-map-single-camera-followup.yml
          git config user.name 'RIVERSOFT'
          git config user.email '105160096+RIVERS0FT@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m '修正地图单相机验证与重置规则'
          git push origin HEAD:${{ github.head_ref }}
