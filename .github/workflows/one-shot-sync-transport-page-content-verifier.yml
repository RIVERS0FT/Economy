name: One-shot sync transport page-content verifier

on:
  push:
    branches:
      - codex/transport-route-cards-footer

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: codex/transport-route-cards-footer
          fetch-depth: 0
      - name: Align page-content verifier with transport footer design
        shell: python
        run: |
          from pathlib import Path

          path = Path('scripts/verify-page-content.mjs')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  "  '运输页的“增加路线”固定放在正文顶部操作区',",
                  "  '运输页的“增加路线”固定放在页面正文承载面的底部 sticky 操作区',",
              ),
              (
                  "  'className=\"transport-page-actions\"',\n  '<PageLayout title=\"运输\">',",
                  "  'className=\"transport-page-footer\"',\n  '<PageLayout title=\"运输\">',",
              ),
              (
                  "requireText('src/styles/transport-page.css', '.transport-page-actions {');",
                  "requireText('src/styles/transport-page.css', '.transport-page-footer {');\nforbidText('src/pages/TransportPage.tsx', 'className=\"transport-page-actions\"');\nforbidText('src/styles/transport-page.css', '.transport-page-actions {');\nforbidText('docs/PAGE_CONTENT_AND_NAVIGATION_DESIGN.md', '运输页的“增加路线”固定放在正文顶部操作区');",
              ),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'target text not found: {old}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
      - name: Commit verifier sync and remove one-shot workflow
        run: |
          git config user.name "RIVERSOFT"
          git config user.email "105160096+RIVERS0FT@users.noreply.github.com"
          rm .github/workflows/one-shot-sync-transport-page-content-verifier.yml
          git add scripts/verify-page-content.mjs .github/workflows/one-shot-sync-transport-page-content-verifier.yml
          git commit -m "Align page-content verifier with transport footer design"
          git push origin HEAD:codex/transport-route-cards-footer
