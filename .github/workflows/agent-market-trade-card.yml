name: Agent Market Trade Card

on:
  push:
    branches:
      - agent/merge-market-order-card
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: agent-market-trade-card-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: false

jobs:
  apply-and-verify:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.4.0
          cache: npm

      - name: Apply market transaction card patch
        shell: bash
        run: |
          base64 -d .agent/apply-market-trade-card.py.gz.b64 | gunzip > /tmp/apply-market-trade-card.py
          echo "40ed594dff1beb2ea3ca25f8672cc7ee75255592a0e960885b23d16a4c111858  /tmp/apply-market-trade-card.py" | sha256sum -c -
          python3 /tmp/apply-market-trade-card.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/verify-market-page-layout.mjs')
          source = path.read_text()
          old = "requireText(runtimeSpec, 'market desktop layout gives the full chart the dominant column', 'Playwright 必须覆盖宽屏行情主列。');"
          new = "requireText(runtimeSpec, \"page.locator('.market-trade-card')\", 'Playwright 必须覆盖宽屏合并交易卡与行情列。');"
          if old not in source:
              raise SystemExit('missing legacy desktop layout verifier')
          path.write_text(source.replace(old, new, 1))
          PY

      - name: Remove one-time implementation files
        shell: bash
        run: |
          rm -f .agent/apply-market-trade-card.py.gz.b64
          rmdir .agent 2>/dev/null || true
          rm -f .github/workflows/agent-market-trade-card.yml

      - name: Check patch formatting
        run: git diff --check

      - name: Install dependencies
        run: npm ci

      - name: Verify market layout contract
        run: node scripts/verify-market-page-layout.mjs

      - name: Build project
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        run: npm run test:browser

      - name: Commit verified implementation
        shell: bash
        run: |
          git status --short
          git diff --stat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "合并市场下单与订单簿卡片"
          git push origin "HEAD:${TARGET_BRANCH}"
