name: Apply gem economy change

on:
  push:
    branches:
      - agent/gem-construction-and-dynamic-rate
    paths:
      - .github/workflows/agent-apply-gem-economy.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/agent-apply-gem-economy.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/gem-construction-and-dynamic-rate' || github.ref_name == 'agent/gem-construction-and-dynamic-rate'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/gem-construction-and-dynamic-rate
          fetch-depth: 0
      - name: Apply gem shop core
        run: git apply --check .agent/patches/01-gem-shop.patch && git apply .agent/patches/01-gem-shop.patch
      - name: Apply server and API wiring
        run: git apply --check .agent/patches/02-core.patch && git apply .agent/patches/02-core.patch
      - name: Apply facility construction acceleration
        run: git apply --check --recount --ignore-space-change .agent/patches/04-facility-groups.patch && git apply --recount --ignore-space-change .agent/patches/04-facility-groups.patch
      - name: Apply gem shop page
        run: git apply --check .agent/patches/05-gem-shop-page.patch && git apply .agent/patches/05-gem-shop-page.patch
      - name: Apply production page
        run: git apply --check .agent/patches/06-production-page.patch && git apply .agent/patches/06-production-page.patch
      - name: Apply tests and verification
        run: git apply --check .agent/patches/07-tests-verify.patch && git apply .agent/patches/07-tests-verify.patch
      - name: Apply documentation
        run: git apply --check .agent/patches/08-docs.patch && git apply .agent/patches/08-docs.patch
      - name: Commit applied changes
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .agent
          rm -f .github/workflows/agent-apply-gem-economy.yml
          git config user.name "OpenAI Codex"
          git config user.email "codex@openai.com"
          git add -A
          git commit -m "实现宝石施工加速与动态终端报价"
          git push origin HEAD:agent/gem-construction-and-dynamic-rate
