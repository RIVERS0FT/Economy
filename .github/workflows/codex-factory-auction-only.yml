name: Temporary factory auction-only patch

on:
  push:
    branches:
      - codex/factory-auction-only

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/factory-auction-only
          fetch-depth: 0
      - name: Apply factory auction-only changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def load(path):
              return Path(path).read_text(encoding='utf-8')

          def save(path, text):
              Path(path).write_text(text, encoding='utf-8')

          def replace(path, old, new, count=None):
              text = load(path)
              actual = text.count(old)
              if count is not None and actual != count:
                  raise SystemExit(f'{path}: expected {count} occurrences, found {actual}: {old[:80]!r}')
              if actual == 0:
                  raise SystemExit(f'{path}: missing replacement source: {old[:120]!r}')
              save(path, text.replace(old, new))

          def sub(path, pattern, repl, count=1, flags=0):
              text = load(path)
              next_text, actual = re.subn(pattern, repl, text, count=count, flags=flags)
              if actual != count:
                  raise SystemExit(f'{path}: expected regex count {count}, found {actual}: {pattern[:120]!r}')
              save(path, next_text)

          # Remove the embedded factory market entry/page from Buildings.
          replace(
              'src/pages/BuildingsPage.tsx',
              "import { lazy, Suspense, useEffect, useMemo, useRef, useState } from 'react';",
              "import { useEffect, useMemo, useRef, useState } from 'react';",
              1,
          )
          replace(
              'src/pages/BuildingsPage.tsx',
              "\nconst EmbeddedFacilityAssetMarket = lazy(() => import('./MarketPage').then((module) => ({\n  default: module.MarketPage,\n})));\n",
              "\n",
              1,
          )
          replace(
              'src/pages/BuildingsPage.tsx',
              ' * 作业制度; 生产方式; 生产进度已清零; 交易该建筑资产; ChevronIcon;\n',
              ' * 作业制度; 生产方式; 生产进度已清零;\n',
              1,
          )
          replace(
              'src/pages/BuildingsPage.tsx',
              "  const [facilityAssetTradeId, setFacilityAssetTradeId] = useState('');\n",
              '',
              1,
          )
          text = load('src/pages/BuildingsPage.tsx')
          text = text.replace("    setFacilityAssetTradeId('');\n", '')
          save('src/pages/BuildingsPage.tsx', text)
          sub(
              'src/pages/BuildingsPage.tsx',
              r"\n  const openSelectedFacilityMarket = \(\) => \{\n    if \(!selectedFacilityEntry\) return;\n    selectMarketAsset\('facility', selectedFacilityEntry\.group\.facilityTypeId, false\);\n    setFacilityAssetTradeId\(selectedFacilityEntry\.group\.facilityTypeId\);\n  \};\n",
              '\n',
              flags=re.S,
          )
          replace(
              'src/pages/BuildingsPage.tsx',
              '          onOpenMarket={openSelectedFacilityMarket}\n',
              '',
              1,
          )
          sub(
              'src/pages/BuildingsPage.tsx',
              r"  const buildingsContent = facilityAssetTradeId \? \(\n    <Suspense fallback=\{<Panel className=\"empty-state\"><span role=\"status\">正在加载建筑资产交易…</span></Panel>\}>\n      <EmbeddedFacilityAssetMarket\n        model=\{model\}\n        embedded\n        facilityAssetId=\{facilityAssetTradeId\}\n        onBackFromFacilityAsset=\{\(\) => setFacilityAssetTradeId\(''\)\}\n      />\n    </Suspense>\n  \) : buildingsManagementContent;",
              '  const buildingsContent = buildingsManagementContent;',
              flags=re.S,
          )

          # Remove the factory detail direct-market CTA.
          replace(
              'src/pages/production/ProductionFacilityDetail.tsx',
              "import { ChevronIcon } from '../../components/icons/GameIcons';\n",
              '',
              1,
          )
          replace(
              'src/pages/production/ProductionFacilityDetail.tsx',
              '  Button,\n  StatusTag,\n',
              '  StatusTag,\n',
              1,
          )
          replace(
              'src/pages/production/ProductionFacilityDetail.tsx',
              '  onOpenMarket: () => void;\n',
              '',
              1,
          )
          replace(
              'src/pages/production/ProductionFacilityDetail.tsx',
              ": Omit<FacilityClusterDetailSharedProps, 'onToggle' | 'onOpenMarket'>) {",
              ": Omit<FacilityClusterDetailSharedProps, 'onToggle'>) {",
              1,
          )
          sub(
              'src/pages/production/ProductionFacilityDetail.tsx',
              r"\nexport function FacilityMarketAction\(\{ onOpenMarket \}: \{ onOpenMarket: \(\) => void \}\) \{\n  return \(\n    <div className=\"facility-market-link-row\">\n      <Button variant=\"text\" className=\"facility-market-link\" onClick=\{onOpenMarket\}>\n        交易该建筑资产 <ChevronIcon direction=\"right\" />\n      </Button>\n    </div>\n  \);\n\}\n",
              '\n',
              flags=re.S,
          )
          replace(
              'src/pages/production/ProductionFacilityDetail.tsx',
              '  onOpenMarket,\n',
              '',
              1,
          )
          replace(
              'src/pages/production/ProductionFacilityDetail.tsx',
              '      <FacilityMarketAction onOpenMarket={onOpenMarket} />\n',
              '',
              1,
          )

          # Browser coverage now asserts the direct market entry is absent.
          sub(
              'tests/browser/production-methods.spec.ts',
              r"    const marketLinkGeometry = await detail\.getByRole\('button', \{ name: /交易该建筑资产/ \}\)\.evaluate\(\(element\) => \{.*?    expect\(marketLinkGeometry\.iconBottom\)\.toBeLessThanOrEqual\(marketLinkGeometry\.buttonBottom\);\n",
              "    await expect(detail.getByRole('button', { name: /交易该建筑资产/ })).toHaveCount(0);\n",
              flags=re.S,
          )

          # Reject all new direct factory market orders while keeping non-market /orders executions intact.
          replace(
              'server/src/runtime-action-executor.js',
              "      } else if (action === 'placeOrder' && payload.assetKind !== 'facility') {\n        gameResult = applySettledCommodityOrder(world, user, payload, now);\n      } else if (action === 'renamePlayer') {",
              "      } else if (action === 'placeOrder' && payload.assetKind !== 'facility') {\n        gameResult = applySettledCommodityOrder(world, user, payload, now);\n      } else if (action === 'placeOrder' && payload.assetKind === 'facility') {\n        gameResult = { ok: false, message: '工厂资产仅允许通过拍卖交易' };\n      } else if (action === 'renamePlayer') {",
              1,
          )
          replace(
              'server/src/runtime-action-executor.js',
              "  'collectFacility', 'placeOrder', 'cancelOrder', 'listFacility',\n  'cancelFacilityListing', 'buyFacility', 'redeemGift',",
              "  'collectFacility', 'placeOrder', 'cancelOrder', 'redeemGift',",
              1,
          )

          # Retire legacy direct-sale endpoints. Cancellation remains available only to release old locks.
          replace(
              'server/src/game-routes.js',
              "      list: 'listFacility',",
              "      list: 'retiredFacilityMarket',",
              1,
          )
          replace(
              'server/src/game-routes.js',
              "      action: listingAction[2] === 'cancel' ? 'cancelFacilityListing' : 'buyFacility',",
              "      action: listingAction[2] === 'cancel' ? 'cancelFacilityListing' : 'retiredFacilityMarket',",
              1,
          )
          replace(
              'server/src/app.js',
              "    if (route?.action === 'retiredFacilityConstructionAcceleration') {\n      sendError(response, 410, '工厂建造已改为资金与材料即时完成，施工加速接口已退役');\n      return;\n    }\n",
              "    if (route?.action === 'retiredFacilityConstructionAcceleration') {\n      sendError(response, 410, '工厂建造已改为资金与材料即时完成，施工加速接口已退役');\n      return;\n    }\n    if (route?.action === 'retiredFacilityMarket') {\n      sendError(response, 410, '工厂资产仅允许通过拍卖交易');\n      return;\n    }\n",
              1,
          )

          # Direct calls to the facility-domain facade are also blocked; old cancellations remain legal.
          replace(
              'server/src/facility-groups.js',
              "  else if (action === 'placeOrder' && payload.assetKind === 'facility') actionResult = placeFacilityOrder(world, userId, payload, now);\n  else if (action === 'listFacility') actionResult = placeFacilityOrder(world, userId, {\n    assetKind: 'facility',\n    assetId: payload.facilityTypeId,\n    provinceId: payload.provinceId,\n    side: 'sell',\n    quantity: payload.quantity,\n    price: payload.unitPrice ?? payload.price,\n  }, now);",
              "  else if (action === 'placeOrder' && payload.assetKind === 'facility') actionResult = result(false, '工厂资产仅允许通过拍卖交易');\n  else if (action === 'listFacility') actionResult = result(false, '工厂资产仅允许通过拍卖交易');",
              1,
          )
          sub(
              'server/src/facility-groups.js',
              r"  \} else if \(action === 'buyFacility'\) \{\n    const listing = orderById\(world, payload\.listingId\);\n    actionResult = listing && isOpenOrder\(listing\) && orderKind\(listing\) === 'facility' && listing\.side === 'sell'\n      \? placeFacilityOrder\(world, userId, \{\n        assetKind: 'facility', assetId: orderAssetId\(listing\), side: 'buy',\n        quantity: payload\.quantity \|\| 1, price: listing\.price,\n      \}, now\)\n      : result\(false, '工厂卖单不存在'\);\n",
              "  } else if (action === 'buyFacility') {\n    actionResult = result(false, '工厂资产仅允许通过拍卖交易');\n",
              flags=re.S,
          )

          # Old open factory orders are cancelled during migration so assets/funds cannot remain stranded.
          replace(
              'server/src/facility-groups.js',
              "  for (const player of Object.values(world.players)) migrateLegacyPlayer(world, player, now);\n\n  for (const player of Object.values(world.players)) {",
              "  for (const player of Object.values(world.players)) migrateLegacyPlayer(world, player, now);\n  retireOpenFacilityMarketOrders(world, now);\n\n  for (const player of Object.values(world.players)) {",
              1,
          )
          replace(
              'server/src/facility-groups.js',
              "function cancelFacilityOrder(world, userId, order, now = Date.now()) {\n  const player = getPlayer(world, userId);\n  const group = order.side === 'sell'\n    ? groupFor(player, orderAssetId(order), false, now, order.provinceId)\n    : null;\n  const previousAvailable = group ? availableGroupCount(world, player, group) : 0;\n  if (order.side === 'buy') {\n    const release = order.remaining * order.price;\n    player.frozenCredits -= release;\n    player.credits += release;\n  }\n  order.status = 'cancelled';\n  closeOrderInOrderBook(world, order);\n  if (group) {\n    const nextAvailable = availableGroupCount(world, player, group);\n    expandAvailableFacilities(group, previousAvailable, nextAvailable, now);\n  }\n  return result(true, '订单已撤销，冻结资产已释放');\n}\n",
              "function cancelFacilityOrder(world, userId, order, now = Date.now()) {\n  const player = getPlayer(world, userId);\n  const group = order.side === 'sell'\n    ? groupFor(player, orderAssetId(order), false, now, order.provinceId)\n    : null;\n  const previousAvailable = group ? availableGroupCount(world, player, group) : 0;\n  if (order.side === 'buy') {\n    const release = order.remaining * order.price;\n    player.frozenCredits -= release;\n    player.credits += release;\n  }\n  order.status = 'cancelled';\n  closeOrderInOrderBook(world, order);\n  if (group) {\n    const nextAvailable = availableGroupCount(world, player, group);\n    expandAvailableFacilities(group, previousAvailable, nextAvailable, now);\n  }\n  return result(true, '订单已撤销，冻结资产已释放');\n}\n\nfunction retireOpenFacilityMarketOrders(world, now = Date.now()) {\n  for (const order of world.orders || []) {\n    if (!isOpenOrder(order) || orderKind(order) !== 'facility' || order.ownerType !== 'player') continue;\n    const ownerId = Number(order.ownerId);\n    if (!Number.isSafeInteger(ownerId) || !world.players?.[String(ownerId)]) {\n      order.status = 'cancelled';\n      closeOrderInOrderBook(world, order);\n      continue;\n    }\n    cancelFacilityOrder(world, ownerId, order, now);\n  }\n  world.facilityListings = [];\n}\n",
              1,
          )

          # Replace the old direct-transfer test with rejection + legacy cleanup coverage.
          sub(
              'server/test/provinces.test.js',
              r"test\('facility order transfer preserves the province and client projections stay partitioned', \(\) => \{.*?\n\}\);\n\n(?=test\('global wealth ranking values each inventory with its local market price')",
              """test('factory market orders are rejected and legacy open orders are retired', () => {\n  const world = createWorld(NOW);\n  world.orders = [];\n  const seller = ensurePlayer(world, bob, NOW);\n  const buyer = ensurePlayer(world, alice, NOW);\n  seller.facilityGroups = [{\n    facilityTypeId: 'farm', provinceId: GEORGIA, count: 1, participatingCount: 0,\n    enabled: false, status: 'stopped', statusReason: 'manual', lifetimeOutput: 0,\n    activeRecipeId: 'wheat-crop', staffingRateBps: 10_000, staffingUpdatedAt: NOW,\n    staffingBatchCarryBps: 0,\n  }];\n  buyer.credits = 1_000;\n  migrateFacilityGroupWorld(world, NOW);\n\n  const directSell = applyFacilityGroupAction(world, bob, 'placeOrder', {\n    provinceId: GEORGIA, assetKind: 'facility', assetId: 'farm', side: 'sell', quantity: 1, price: 80,\n  }, NOW + 1);\n  const directBuy = applyFacilityGroupAction(world, alice, 'placeOrder', {\n    provinceId: GEORGIA, assetKind: 'facility', assetId: 'farm', side: 'buy', quantity: 1, price: 80,\n  }, NOW + 2);\n  assert.deepEqual(directSell, { ok: false, message: '工厂资产仅允许通过拍卖交易' });\n  assert.deepEqual(directBuy, { ok: false, message: '工厂资产仅允许通过拍卖交易' });\n  assert.equal(seller.facilityGroups.find((group) => group.facilityTypeId === 'farm' && group.provinceId === GEORGIA)?.count, 1);\n\n  buyer.credits = 920;\n  buyer.frozenCredits = 80;\n  world.orders.push(\n    {\n      id: 'legacy-facility-buy', assetKind: 'facility', assetId: 'farm', facilityTypeId: 'farm',\n      provinceId: GEORGIA, side: 'buy', ownerType: 'player', ownerId: alice.id, ownerName: alice.name,\n      price: 80, quantity: 1, remaining: 1, status: 'open', createdAt: NOW + 3, fills: [],\n    },\n    {\n      id: 'legacy-facility-sell', assetKind: 'facility', assetId: 'farm', facilityTypeId: 'farm',\n      provinceId: GEORGIA, side: 'sell', ownerType: 'player', ownerId: bob.id, ownerName: bob.name,\n      price: 80, quantity: 1, remaining: 1, status: 'open', createdAt: NOW + 4, fills: [],\n    },\n  );\n\n  migrateFacilityGroupWorld(world, NOW + 5);\n\n  assert.equal(world.orders.find((order) => order.id === 'legacy-facility-buy')?.status, 'cancelled');\n  assert.equal(world.orders.find((order) => order.id === 'legacy-facility-sell')?.status, 'cancelled');\n  assert.equal(buyer.frozenCredits, 0);\n  assert.equal(buyer.credits, 1_000);\n  assert.equal(seller.facilityGroups.find((group) => group.facilityTypeId === 'farm' && group.provinceId === GEORGIA)?.count, 1);\n\n  const state = createFacilityGroupClientState(world, alice.id, NOW + 6);\n  assert.equal(state.orders.some((order) => order.assetKind === 'facility' && (order.status === 'open' || order.status === 'partial')), false);\n});\n\n""",
              flags=re.S,
          )

          # Design authority: factories are auction-only; historical order data is compatibility/audit only.
          def insert_after_heading(path, heading, block):
              text = load(path)
              if block.strip() in text:
                  return
              pos = text.find(heading)
              if pos < 0:
                  raise SystemExit(f'{path}: missing heading {heading}')
              end = text.find('\n', pos)
              text = text[:end+1] + '\n' + block.rstrip() + '\n' + text[end+1:]
              save(path, text)

          auction_rule = '> 2026-08-30 不可回退规则：工厂资产禁止通过市场订单簿直接买卖，新的工厂所有权转移只能通过拍卖完成；建筑详情与市场不得提供工厂直售入口或从属工厂交易页。旧未完成工厂订单在迁移时自动撤销并释放冻结资产；已结束历史订单／历史行情只可用于兼容、审计或估值，不得重新成为业务入口。'
          for path, heading in [
              ('docs/UNIFIED_ASSET_ORDER_BOOK_DESIGN.md', '# Economy'),
              ('docs/PAGE_CONTENT_AND_NAVIGATION_DESIGN.md', '# Economy'),
              ('docs/INDUSTRY_AND_PRODUCTION_DESIGN.md', '# Economy'),
              ('docs/UI_DESIGN_SYSTEM.md', '# Economy'),
              ('docs/PRODUCT_AND_GAMEPLAY_DESIGN.md', '# Economy'),
              ('docs/SERVER_ARCHITECTURE_AND_DEPLOYMENT_DESIGN.md', '# Economy'),
          ]:
              insert_after_heading(path, heading, auction_rule)

          # Core order-book authority no longer grants a live factory order book.
          text = load('docs/UNIFIED_ASSET_ORDER_BOOK_DESIGN.md')
          text = re.sub(
              r'建筑资产订单簿只允许从建筑详情打开从属资产交易视图.*?(?=\n\n)',
              '工厂资产不再拥有可操作的市场订单簿。建筑详情不得打开工厂从属交易视图，市场也不得展示工厂买卖表单；工厂所有权交易统一进入拍卖页。`AssetOrder.assetKind = facility` 仅允许用于已结束历史订单兼容与迁移清理，新请求不得创建 `open`／`partial` 工厂订单。',
              text,
              count=1,
              flags=re.S,
          )
          text = text.replace('工厂订单仍只能由玩家提交', '历史工厂订单只用于兼容与审计，新工厂订单禁止提交')
          text = text.replace('商品和工厂订单价格', '商品订单价格')
          text = text.replace('商品和工厂订单合计', '商品订单')
          text = text.replace('商品与工厂继续共享同一订单簿内核', '商品继续使用统一订单簿内核；工厂退出订单簿并仅通过拍卖交易')
          save('docs/UNIFIED_ASSET_ORDER_BOOK_DESIGN.md', text)

          text = load('docs/PAGE_CONTENT_AND_NAVIGATION_DESIGN.md')
          text = text.replace('实际建设、运行、生产配置和建筑资产交易继续由地区 `BuildingsPage` 执行', '实际建设、运行和生产配置继续由地区 `BuildingsPage` 执行；工厂所有权交易唯一由拍卖页执行')
          text = re.sub(
              r'建筑资产交易作为建筑详情的从属视图复用订单簿草稿.*?(?=\n\n)',
              '建筑详情只承担工厂经营与生产配置，不提供工厂买卖入口、订单簿草稿或从属交易页。工厂所有权交易只能前往一级“拍卖”页面发起或竞拍。',
              text,
              count=1,
              flags=re.S,
          )
          text = text.replace('订单簿／拍卖冻结', '拍卖冻结')
          text = text.replace('订单簿／拍卖或银行抵押占用', '拍卖或银行抵押占用')
          text = text.replace('旧工厂挂牌', '旧工厂挂牌兼容记录')
          text = text.replace('## 6. 拍卖\n', '## 6. 拍卖\n\n工厂所有权交易唯一通过本页拍卖完成；市场和建筑详情不得创建工厂订单或提供固定价格直售。\n')
          save('docs/PAGE_CONTENT_AND_NAVIGATION_DESIGN.md', text)

          text = load('docs/INDUSTRY_AND_PRODUCTION_DESIGN.md')
          text = text.replace('工厂卖单和工厂拍卖冻结数量立即不参与生产。', '工厂拍卖冻结数量立即不参与生产；市场订单不得再冻结工厂。')
          text = text.replace('工厂订单、拍卖冻结和成交必须携带集群地区', '工厂拍卖冻结和成交必须携带集群地区')
          text = text.replace('新建、买入或解冻的数量', '新建、拍卖成交转入或解冻的数量')
          text = text.replace('建设、买入、竞拍、启动', '建设、竞拍、启动')
          text = text.replace('挂单和拍卖冻结退出生产', '拍卖冻结退出生产')
          text = text.replace('订单簿／拍卖冻结数量', '拍卖冻结数量')
          save('docs/INDUSTRY_AND_PRODUCTION_DESIGN.md', text)

          text = load('docs/UI_DESIGN_SYSTEM.md')
          text = text.replace('“交易该建筑资产”文字与右向 Chevron 固定同一行', '工厂详情不得显示“交易该建筑资产”入口，工厂所有权交易只允许通过拍卖页完成')
          save('docs/UI_DESIGN_SYSTEM.md', text)

          text = load('docs/README.md')
          text = text.replace('州级本地商品和工厂统一限价订单、冻结、抵押后的可转让数量、撮合、成交价、估值、资产统计和普通玩家成交匿名化', '州级本地商品限价订单、冻结、撮合、成交价与普通玩家成交匿名化；工厂订单仅保留历史兼容，新的工厂所有权交易只允许拍卖')
          save('docs/README.md', text)

          for path in ['docs/PRODUCT_AND_GAMEPLAY_DESIGN.md', 'docs/SERVER_ARCHITECTURE_AND_DEPLOYMENT_DESIGN.md']:
              text = load(path)
              text = text.replace('订单簿／拍卖冻结', '拍卖冻结')
              save(path, text)

          # Verification contracts: remove the old CTA requirement and lock the new auction-only rule.
          text = load('scripts/verify-unified-factory-recipes-grid.mjs')
          text = text.replace("  'export function FacilityMarketAction',\n", '')
          text = text.replace("  '交易该建筑资产',\n", '')
          text = text.replace(
              "for (const forbidden of [\n  'facility-recipe-section',",
              "for (const forbidden of [\n  'FacilityMarketAction',\n  '交易该建筑资产',\n  'onOpenMarket',\n  'facility-recipe-section',",
              1,
          )
          save('scripts/verify-unified-factory-recipes-grid.mjs', text)

          text = load('scripts/verify-production-settlement-layout.mjs')
          for old in [
              "  '.facility-market-link-row .facility-market-link {',\n",
              "  '.facility-market-link-row .facility-market-link .game-icon',\n",
          ]:
              text = text.replace(old, '')
          text = text.replace("  'marketLinkGeometry',\n", "  \"getByRole('button', { name: /交易该建筑资产/ })).toHaveCount(0)\",\n")
          text = text.replace('“交易该建筑资产”文字与右向 Chevron 固定同一行', '工厂详情不得显示“交易该建筑资产”入口，工厂所有权交易只允许通过拍卖页完成')
          save('scripts/verify-production-settlement-layout.mjs', text)

          text = load('scripts/verify-market-assets.mjs')
          text = text.replace("  '交易该建筑资产',\n  'ChevronIcon',\n", '')
          text = text.replace("  '工厂订单仍只能由玩家提交',\n", "  '历史工厂订单只用于兼容与审计，新工厂订单禁止提交',\n")
          text = text.replace(
              "for (const text of ['assetKind','matchFacilityOrder','reduceRunningGroupForSellOrder','valuationPricesFor','recentTradePriceFor','lastTradePrice','world.version = 20','reconcileFacilityGroup','activeRecipeId','pendingRecipeId','removeSystemFacilityOrders','SELF_CROSS_MESSAGE']) requireText('server/src/facility-groups.js', text);",
              "for (const text of ['assetKind','valuationPricesFor','recentTradePriceFor','lastTradePrice','world.version = 20','reconcileFacilityGroup','activeRecipeId','pendingRecipeId','removeSystemFacilityOrders','retireOpenFacilityMarketOrders','工厂资产仅允许通过拍卖交易']) requireText('server/src/facility-groups.js', text);",
              1,
          )
          marker = "for (const text of [\n  'SwitchControl',"
          if marker not in text:
              raise SystemExit('verify-market-assets: buildings marker block not found')
          text = text.replace(
              "]) requireText('src/pages/BuildingsPage.tsx', text);\nfor (const text of [\n  'facility-power-button'",
              "]) requireText('src/pages/BuildingsPage.tsx', text);\nfor (const text of ['交易该建筑资产', 'EmbeddedFacilityAssetMarket', 'facilityAssetTradeId', 'onOpenMarket={openSelectedFacilityMarket}']) forbidText('src/pages/BuildingsPage.tsx', text);\nfor (const text of [\n  'facility-power-button'",
              1,
          )
          save('scripts/verify-market-assets.mjs', text)

          # Ensure the new non-obvious invariant is explicit and old UI source is gone.
          for path in ['src/pages/BuildingsPage.tsx', 'src/pages/production/ProductionFacilityDetail.tsx']:
              source = load(path)
              for forbidden in ['FacilityMarketAction', '交易该建筑资产', 'onOpenMarket']:
                  if forbidden in source:
                      raise SystemExit(f'{path}: factory direct-market UI still contains {forbidden}')
          if "message: '工厂资产仅允许通过拍卖交易'" not in load('server/src/runtime-action-executor.js'):
              raise SystemExit('runtime rejection missing')
          if 'retireOpenFacilityMarketOrders(world, now);' not in load('server/src/facility-groups.js'):
              raise SystemExit('legacy factory order retirement missing')

          # Remove this temporary workflow from the resulting branch diff.
          Path('.github/workflows/codex-factory-auction-only.yml').unlink()
          PY
      - name: Syntax and focused verification
        shell: bash
        run: |
          node --check server/src/runtime-action-executor.js
          node --check server/src/facility-groups.js
          node --check server/src/game-routes.js
          node --check server/src/app.js
      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Restrict factory ownership transfers to auctions'
          git push origin HEAD:codex/factory-auction-only
