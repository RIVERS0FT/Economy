name: Validate market floating interactions
on:
  push:
    branches: [work/market-floating-validation-20260906]
    paths: [.github/workflows/market-validation-workspace.yml]
permissions:
  contents: write
jobs:
  validate:
    if: github.ref == 'refs/heads/work/market-floating-validation-20260906'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Apply reviewed browser-evidence fixes on the diagnostic branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 .maintenance/market-refine.py
          git diff --check
          git add src docs tests scripts
          git commit -m 'fix: lock shared chart mapping and restore visible mobile tooltips'
          git push origin HEAD:refs/heads/work/market-floating-validation-20260906
      - uses: actions/setup-node@v4
        with:
          node-version: 24.4.0
          cache: npm
      - run: npm ci
      - run: bash scripts/prepare-playwright-chromium.sh
      - name: Validate real layouts, mapping and shared tooltip regressions
        shell: bash
        run: |
          set -o pipefail
          npm run generate:local-preview
          npx tsc --noEmit
          node scripts/verify-scroll-ownership.mjs
          node scripts/verify-game-shell-layout.mjs
          npm run test:browser -- tests/browser/commodity-freeze-details.spec.ts tests/browser/market-chart-pointer.spec.ts tests/browser/market-tooltip-persistence.spec.ts tests/browser/market-chart-safe-zone.spec.ts tests/browser/market-chart-height-stability.spec.ts tests/browser/shell-floating-safe-zone.spec.ts tests/browser/notification-center.spec.ts tests/browser/auction-bid-history.spec.ts --workers=3 --reporter=list 2>&1 | tee market-floating.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: market-floating-diagnostics
          path: |
            market-floating.log
            test-results
          retention-days: 1
          if-no-files-found: warn
