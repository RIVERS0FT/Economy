name: Fix gem ledger schema

on:
  push:
    branches:
      - agent/daily-check-in

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/daily-check-in
      - name: Remove trailing schema commas
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('server/src/storage.js')
          text = path.read_text()
          old = '        source_key TEXT UNIQUE,\n      ) STRICT;'
          if text.count(old) != 2:
              raise SystemExit(f'expected two trailing source_key commas, found {text.count(old)}')
          path.write_text(text.replace(old, '        source_key TEXT UNIQUE\n      ) STRICT;'))
          PY
      - name: Commit schema fix
        run: |
          git rm .github/workflows/fix-gem-ledger-schema.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: correct gem ledger schema syntax"
          git push origin HEAD:agent/daily-check-in
