name: Apply provincial action registry verifier

on:
  push:
    branches:
      - "fix/interactive-action-guardrails"
    paths:
      - ".github/workflows/apply-provincial-action-registry-verifier.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/interactive-action-guardrails
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.4.0
          cache: npm
      - name: Apply verifier update
        run: |
          python3 scripts/update-provincial-action-registry-verifier.py
          rm scripts/update-provincial-action-registry-verifier.py
      - name: Install dependencies
        run: npm ci
      - name: Validate provincial guardrails
        run: |
          node scripts/verify-provincial-unlock-transport.mjs
          node scripts/verify-runtime-efficiency.mjs
          node scripts/verify-client-response-performance.mjs
          node --test server/test/player-action-registry.test.js server/test/world-storage-v2.test.js
          npm run typecheck
          git diff --check
      - name: Commit source
        run: |
          git config user.name 'RIVERSOFT'
          git config user.email '105160096+RIVERS0FT@users.noreply.github.com'
          git add -A
          git commit -m '迁移州与运输事务验证到统一动作注册表'
          git push origin HEAD:fix/interactive-action-guardrails
