  expect(narrowOrder.width / narrowBook.width).toBeLessThan(1.65);`,
            `  expect(narrowOrder.width / narrowBook.width).toBeGreaterThan(1.75);
  expect(narrowOrder.width / narrowBook.width).toBeLessThan(2.25);`,
          );

          const sellFeeVerifier = 'scripts/verify-market-sell-fee.mjs';
          replaceText(
            sellFeeVerifier,
            "for (const text of ['estimatedSellFee', '预计手续费', '预计到账', '手续费 / 实收']) {",
            "for (const text of ['estimatedSellFee', 'estimatedNetTotal', '预计到账', '手续费 / 实收']) {",
          );

          appendFile('scripts/verify-market-order-entry-compact.mjs', `import { existsSync, readFileSync } from 'node:fs';
import { resolve } from 'node:path';

const root = process.cwd();
const failures = [];
const read = (path) => readFileSync(resolve(root, path), 'utf8');
const requireFile = (path) => { if (!existsSync(resolve(root, path))) failures.push(\`缺少文件: \${path}\`); };
const requireText = (path, text) => { if (!read(path).includes(text)) failures.push(\`\${path} 缺少: \${text}\`); };
const forbidText = (path, text) => { if (read(path).includes(text)) failures.push(\`\${path} 不应包含: \${text}\`); };

const componentPath = 'src/components/ui/FormControls.tsx';
const pagePath = 'src/pages/MarketPage.tsx';
const stylePath = 'src/styles/market-page-polish.css';
const orderDesignPath = 'docs/UNIFIED_ASSET_ORDER_BOOK_DESIGN.md';
const uiDesignPath = 'docs/UI_DESIGN_SYSTEM.md';
const browserPath = 'tests/browser/market-order-entry-compact.spec.ts';

[componentPath, pagePath, stylePath, orderDesignPath, uiDesignPath, browserPath].forEach(requireFile);

for (const text of [
  'wheelStep?: number',
  'document.activeElement !== input',
  "input.addEventListener('wheel', handleWheel, { passive: false })",
  'onValueChange(formatMoneyDraft(clampedCents / 100))',
]) requireText(componentPath, text);
for (const text of ['wheelStep={0.01}', 'className="market-submit-order"']) requireText(pagePath, text);
for (const text of [
  'grid-template-columns: minmax(320px, 3fr) minmax(240px, 2fr);',
  'grid-template-columns: minmax(0, 2fr) minmax(126px, 1fr);',
