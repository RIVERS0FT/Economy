  'position: absolute;',
  'width: 44px;',
  'padding-inline: 52px;',
]) requireText(stylePath, text);
for (const text of [
  '字段标签／内嵌减号按钮／共享输入控件／内嵌加号按钮',
  '不再提供“交易资产详情”折叠区',
