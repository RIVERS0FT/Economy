name: Sync daily check-in with main

on:
  push:
    branches:
      - agent/daily-check-in

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/daily-check-in
          fetch-depth: 0
      - name: Merge current main
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main
          git merge origin/main -X theirs --no-edit
      - name: Reconcile check-in rules
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          for document_path in [
              'docs/README.md',
              'docs/PRODUCT_AND_GAMEPLAY_DESIGN.md',
              'docs/INDUSTRY_AND_PRODUCTION_DESIGN.md',
              'docs/UNIFIED_ASSET_ORDER_BOOK_DESIGN.md',
              'docs/WAREHOUSE_EXPANSION_DESIGN.md',
              'docs/PAGE_CONTENT_AND_NAVIGATION_DESIGN.md',
              'docs/SERVER_ARCHITECTURE_AND_DEPLOYMENT_DESIGN.md',
              'docs/LOCAL_ACTIVITY_LOG_DESIGN.md',
          ]:
              path = Path(document_path)
              path.write_text(path.read_text().replace('客户端状态版本：17', '客户端状态版本：18'))

          path = Path('docs/PRODUCT_AND_GAMEPLAY_DESIGN.md')
          text = path.read_text()
          text = text.replace('**30 / 20 / 10 宝石**', '**50 / 30 / 20 宝石**')
          text = text.replace(
              '宝石来源包括邀请奖励、排行榜周奖励和管理员调整。',
              '宝石来源包括每日签到、每周全勤、邀请奖励、排行榜周奖励和管理员调整。',
          )
          if '### 9.1 每日签到与每周全勤' not in text:
              marker = '### 9.1 注册事务邀请归因'
              section = (
                  '### 9.1 每日签到与每周全勤\n\n'
                  '- 签到按 `Asia/Shanghai` 服务器自然日判定，每个账号每天最多成功一次；客户端时间、刷新、多标签页和不同幂等键不得重复领取。\n'
                  '- 每日签到获得 **1 宝石**。完整自然周从周一 00:00 到下周一 00:00，周一至周日全部签到后，第七次签到在同一事务额外获得 **5 宝石**。\n'
                  '- 注册所在的不完整周只能领取每日奖励，不获得该周全勤奖励；下一个完整周开始参与全勤。签到不支持补签。\n'
                  '- 每日奖励、全勤奖励、签到记录、宝石余额和宝石流水必须在同一 SQLite 事务提交；失败全部回滚。签到不计入总资产、增长榜或经营积分，也不刷新经济活跃时间。\n\n'
                  '### 9.2 注册事务邀请归因'
              )
              if marker in text:
                  text = text.replace(marker, section, 1)
                  text = text.replace('### 9.2 商店', '### 9.3 商店', 1)
          text = text.replace(
              '资产一致性、冻结、成交、生产、周结算、市场需求发行、宝石奖励和封禁判定优先级最高；',
              '资产一致性、冻结、成交、生产、签到、周结算、市场需求发行、宝石奖励和封禁判定优先级最高；',
          )
          path.write_text(text)

          path = Path('docs/README.md')
          text = path.read_text()
          text = text.replace(
              '产品定位、核心循环、工作冷却、普通货币与宝石、直接货币发行、人口就业收入、三类人口真实钱包、消费需求与排行榜目标',
              '产品定位、核心循环、工作冷却、每日签到、普通货币与宝石、直接货币发行、人口就业收入、三类人口真实钱包、消费需求与排行榜目标',
          )
          text = text.replace(
              '概览真实内容宽度断点、外层轨道、紧凑图表、短列表滚动、市场空值和浏览器几何回归',
              '概览真实内容宽度断点、外层轨道、签到日历、短列表滚动和浏览器几何回归',
          )
          text = text.replace(
              '服务器权威边界、长期合同事务与 `contract` 分区、普通玩家订单公开序列化、邮箱验证码注册、统一账号首次建档、邀请归因、注册 IP 封禁、API、SQLite、容量限制、Nginx、systemd 和部署',
              '服务器权威边界、每日签到、长期合同事务与 `contract` 分区、普通玩家订单公开序列化、邮箱验证码注册、统一账号首次建档、邀请归因、注册 IP 封禁、API、SQLite、容量限制、Nginx、systemd 和部署',
          )
          path.write_text(text)

          path = Path('server/src/invitations.js')
          text = path.read_text()
          text = text.replace(
              "category TEXT NOT NULL CHECK (category IN ('share_link_reward', 'invite_code_reward', 'admin_adjustment'))",
              "category TEXT NOT NULL CHECK (category IN ('share_link_reward', 'invite_code_reward', 'daily_check_in', 'weekly_full_attendance', 'leaderboard_reward', 'admin_adjustment'))",
          )
          if 'source_key TEXT UNIQUE' not in text:
              text = text.replace(
                  '        created_at INTEGER NOT NULL,\n        FOREIGN KEY (invitation_id) REFERENCES economy_invitation_relations(id)',
                  '        created_at INTEGER NOT NULL,\n        source_key TEXT UNIQUE,\n        FOREIGN KEY (invitation_id) REFERENCES economy_invitation_relations(id)',
                  1,
              )
          path.write_text(text)

          path = Path('scripts/verify-gems-invitations-and-bans.mjs')
          text = path.read_text()
          if 'CURRENT_CLIENT_STATE_VERSION' not in text:
              text = text.replace(
                  "import { resolve } from 'node:path';\n",
                  "import { resolve } from 'node:path';\nimport { CURRENT_CLIENT_STATE_VERSION } from '../server/shared/economy-state-version.js';\n",
                  1,
              )
          text = text.replace("  'version: 17;',", "  `version: ${CURRENT_CLIENT_STATE_VERSION};`,")
          path.write_text(text)
          PY
      - name: Commit synchronized branch
        shell: bash
        run: |
          git rm .github/workflows/sync-daily-check-in-main.yml
          git add -A
          git commit -m "chore: sync daily check-in with latest main"
          git push origin HEAD:agent/daily-check-in
