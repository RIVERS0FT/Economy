name: Verify order prune fix full build

on:
  push:
    branches:
      - fix/initial-state-timeout

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.4.0
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: git diff --check
