name: Agent production method finalizer

on:
  push:
    branches:
      - agent/factory-production-methods

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/factory-production-methods
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply authoritative documentation and verification updates
        run: node scripts/agent-finalize-production-methods.mjs
      - name: Commit generated edits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            docs/README.md \
            docs/INDUSTRY_AND_PRODUCTION_DESIGN.md \
            docs/PAGE_CONTENT_AND_NAVIGATION_DESIGN.md \
            docs/UI_DESIGN_SYSTEM.md \
            docs/SERVER_ARCHITECTURE_AND_DEPLOYMENT_DESIGN.md \
            src/types.ts \
            server/src/production-methods.js \
            scripts/verify-unified-factory-recipes-grid.mjs \
            package.json
          if git diff --cached --quiet; then
            echo "No generated edits required."
          else
            git commit -m "docs: define factory production methods"
            git push origin HEAD:agent/factory-production-methods
          fi
