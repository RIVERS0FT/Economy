assert.equal(resolveMarketBucketIndex(windowStart - 1, windowStart, 240), 0, '悬浮索引必须限制在首个分段');
assert.equal(resolveMarketBucketIndex(windowStart + MARKET_BUCKET_MS * 40 + 1, windowStart, 240), 40, '悬浮索引必须由统一轴值映射');
assert.equal(resolveMarketBucketIndex(windowEnd + 1, windowStart, 240), 239, '悬浮索引必须限制在最后分段');

