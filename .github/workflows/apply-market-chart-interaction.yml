name: Apply market chart interaction

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: apply-market-chart-interaction
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/market-unified-hover-dynamic-ticks
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.4.0
          cache: npm
      - name: Apply unified hover and dynamic ticks
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path_name: str, old: str, new: str) -> None:
              path = Path(path_name)
              source = path.read_text(encoding='utf-8')
              count = source.count(old)
              if count == 0 and new in source:
                  return
              if count != 1:
                  raise SystemExit(f'{path_name}: expected one replacement target, found {count}')
              path.write_text(source.replace(old, new), encoding='utf-8')

