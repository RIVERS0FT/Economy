name: Apply save deletion timeout patch

on:
  push:
    branches:
      - "fix/save-deletion-timeout"
    paths:
      - ".github/workflows/apply-save-deletion-timeout-patch.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/save-deletion-timeout
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.4.0
          cache: npm
      - name: Apply patch
        run: |
          python3 scripts/apply-save-deletion-timeout-patch.py
          rm scripts/apply-save-deletion-timeout-patch.py
      - name: Install dependencies
        run: npm ci
      - name: Validate save deletion hot path
        run: |
          node scripts/verify-save-deletion.mjs
          node scripts/verify-runtime-efficiency.mjs
          node scripts/verify-authoritative-hotpaths.mjs
          node scripts/verify-market-action-latency.mjs
          node --test server/test/save-deletion.test.js
          node --test server/test/world-storage-v2.test.js
          npm run typecheck
          npm run server:check
          git diff --check
      - name: Commit source
        run: |
          git config user.name 'RIVERSOFT'
          git config user.email '105160096+RIVERS0FT@users.noreply.github.com'
          git add -A
          git commit -m '修复删除存档的全世界事务超时'
          git push origin HEAD:fix/save-deletion-timeout
