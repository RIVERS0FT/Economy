name: Apply form state isolation

on:
  push:
    branches:
      - agent/isolate-market-construction-state

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/isolate-market-construction-state
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply source, design, and verification changes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import json

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}: {old!r}')
              target.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'src/app/gameViewModel.ts',
              '  buildFacility: (facilityTypeId?: string) => Promise<ActionResult>;',
              '  buildFacility: (facilityTypeId: string) => Promise<ActionResult>;',
          )
          replace_once(
              'src/app/gameViewModel.ts',
              '    if (type.id !== selectedFacilityTypeId) setSelectedFacilityTypeId(type.id);\n',
              '',
          )
          replace_once(
              'src/app/gameViewModel.ts',
              '  }, [game, marketAssetId, marketAssetKind, selectedFacilityTypeId]);',
              '  }, [game, marketAssetId, marketAssetKind]);',
          )
          replace_once(
              'src/app/gameViewModel.ts',
              "    if (kind === 'facility') setSelectedFacilityTypeId(assetId);\n",
              '',
          )
          replace_once(
              'src/app/gameViewModel.ts',
              "    buildFacility: (facilityTypeId = selectedFacilityTypeId) => runAction('buildFacility', () => gameActions.buildFacility(facilityTypeId)),",
              "    buildFacility: (facilityTypeId) => runAction('buildFacility', () => gameActions.buildFacility(facilityTypeId)),",
          )

          replace_once(
              'src/pages/AuctionPage.tsx',
              "import { useMemo, useState } from 'react';",
              "import { useEffect, useMemo, useState } from 'react';",
          )
          auction_effect_anchor = """  const selectedOption = useMemo(() => (\n    availableOptions.find((item) => item.id === selectedAssetId) ?? availableOptions[0]\n  ), [availableOptions, selectedAssetId]);\n"""
          auction_effect = auction_effect_anchor + """\n  useEffect(() => {\n    setSelectedAssetId((current) => (\n      availableOptions.some((item) => item.id === current)\n        ? current\n        : availableOptions[0]?.id ?? ''\n    ));\n  }, [availableOptions]);\n"""
          replace_once('src/pages/AuctionPage.tsx', auction_effect_anchor, auction_effect)
          replace_once(
              'src/pages/AuctionPage.tsx',
              "                  value={selectedOption?.id || ''}",
              '                  value={selectedAssetId}',
          )

          package_path = Path('package.json')
          package = json.loads(package_path.read_text(encoding='utf-8'))
          scripts = {}
          for key, value in package['scripts'].items():
              if key == 'verify:architecture':
                  scripts['verify:form-state-isolation'] = 'node scripts/verify-form-state-isolation.mjs'
              scripts[key] = value
          architecture = scripts['verify:architecture']
          verification_command = 'node scripts/verify-form-state-isolation.mjs'
          if verification_command not in architecture:
              anchor = 'node scripts/verify-form-controls.mjs'
              if anchor not in architecture:
                  raise SystemExit('package.json: verify:architecture form-controls anchor missing')
              architecture = architecture.replace(anchor, f'{verification_command} && {anchor}', 1)
          scripts['verify:architecture'] = architecture
          package['scripts'] = scripts
          package_path.write_text(json.dumps(package, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          design_path = Path('docs/PAGE_CONTENT_AND_NAVIGATION_DESIGN.md')
          design = design_path.read_text(encoding='utf-8')
          design_marker = '## 2. 应用外壳'
          design_section = """### 1.1 跨页面表单状态隔离\n\n- 市场当前选择的商品或工厂只属于市场交易上下文。市场切换资产、从工厂详情进入市场和市场目录合法化只能修改 `marketAssetKind`、`marketAssetId` 及对应订单草稿，不得改写生产页“建设新工厂”的类型选择。\n- 建设工厂类型只属于生产页建设表单；目录变化时只在自身候选目录内合法化。建设动作必须显式提交表单当前选择的 `facilityTypeId`，不得通过可选参数或其他页面状态隐式回退。\n- 拍卖、合同、设置和管理员等下拉框必须由所属页面或业务表单状态控制；候选项变化时应在本表单内同步合法化显示值与提交值，不得借用其他页面的选择状态。\n\n## 2. 应用外壳"""
          if '### 1.1 跨页面表单状态隔离' not in design:
              if design.count(design_marker) != 1:
                  raise SystemExit('PAGE_CONTENT_AND_NAVIGATION_DESIGN.md: application shell marker mismatch')
              design = design.replace(design_marker, design_section, 1)
              design_path.write_text(design, encoding='utf-8')

          verifier = r"""import fs from 'node:fs';
          import path from 'node:path';
          import process from 'node:process';

          const root = process.cwd();
          const read = (relativePath) => fs.readFileSync(path.join(root, relativePath), 'utf8');
          const fail = (message) => {
            console.error(`form state isolation verification failed: ${message}`);
            process.exitCode = 1;
          };
          const requireText = (source, text, label) => {
            if (!source.includes(text)) fail(`${label} is missing`);
          };
          const forbidText = (source, text, label) => {
            if (source.includes(text)) fail(`${label} must not exist`);
          };

          const viewModel = read('src/app/gameViewModel.ts');
          const productionPage = read('src/pages/ProductionPage.tsx');
          const auctionPage = read('src/pages/AuctionPage.tsx');
          const pageDesign = read('docs/PAGE_CONTENT_AND_NAVIGATION_DESIGN.md');

          requireText(
            viewModel,
            'buildFacility: (facilityTypeId: string) => Promise<ActionResult>;',
            'required buildFacility interface parameter',
          );
          requireText(
            viewModel,
            "buildFacility: (facilityTypeId) => runAction('buildFacility', () => gameActions.buildFacility(facilityTypeId))",
            'explicit buildFacility implementation parameter',
          );
          forbidText(
            viewModel,
            "if (kind === 'facility') setSelectedFacilityTypeId(assetId);",
            'market-to-construction setter coupling',
          );
          forbidText(
            viewModel,
            'if (type.id !== selectedFacilityTypeId) setSelectedFacilityTypeId(type.id);',
            'market validation construction backfill',
          );
          forbidText(
            viewModel,
            '[game, marketAssetId, marketAssetKind, selectedFacilityTypeId]',
            'construction state in market validation dependencies',
          );
          forbidText(
            viewModel,
            'buildFacility: (facilityTypeId = selectedFacilityTypeId)',
            'implicit buildFacility state fallback',
          );
          requireText(
            viewModel,
            '}, [game, marketAssetId, marketAssetKind]);',
            'market-only validation dependencies',
          );
          requireText(
            productionPage,
            'buildFacility(selectedType.id)',
            'production page explicit facility submission',
          );
          requireText(
            auctionPage,
            "import { useEffect, useMemo, useState } from 'react';",
            'auction option legalization effect import',
          );
          requireText(
            auctionPage,
            'setSelectedAssetId((current) => (',
            'auction selected asset legalization',
          );
          requireText(
            auctionPage,
            'value={selectedAssetId}',
            'auction select single source of truth',
          );
          requireText(
            pageDesign,
            '### 1.1 跨页面表单状态隔离',
            'page design state isolation rule',
          );
          requireText(
            pageDesign,
            '建设动作必须显式提交表单当前选择的 `facilityTypeId`',
            'explicit construction submission design rule',
          );

          const sourceRoot = path.join(root, 'src');
          const sourceFiles = [];
          const walk = (directory) => {
            for (const entry of fs.readdirSync(directory, { withFileTypes: true })) {
              const target = path.join(directory, entry.name);
              if (entry.isDirectory()) walk(target);
              else if (/\.(?:ts|tsx)$/.test(entry.name)) sourceFiles.push(target);
            }
          };
          walk(sourceRoot);
          for (const file of sourceFiles) {
            const source = fs.readFileSync(file, 'utf8');
            if (/\bbuildFacility\s*\(\s*\)/.test(source)) {
              fail(`${path.relative(root, file)} calls buildFacility without a facilityTypeId`);
            }
          }

          if (!process.exitCode) console.log('form state isolation verification passed');
          """
          Path('scripts/verify-form-state-isolation.mjs').write_text(verifier, encoding='utf-8')
          PY
      - name: Install dependencies
        run: npm ci
      - name: Verify form state isolation
        run: npm run verify:form-state-isolation
      - name: Typecheck
        run: npm run typecheck
      - name: Commit verified changes
        shell: bash
        run: |
          rm .github/workflows/apply-form-state-isolation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/gameViewModel.ts src/pages/AuctionPage.tsx docs/PAGE_CONTENT_AND_NAVIGATION_DESIGN.md package.json scripts/verify-form-state-isolation.mjs .github/workflows/apply-form-state-isolation.yml
          git commit -m "隔离市场与建造表单状态"
          git push origin HEAD:agent/isolate-market-construction-state
