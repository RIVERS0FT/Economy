name: Apply interactive action guardrails

on:
  push:
    branches:
      - "fix/interactive-action-guardrails"
    paths:
      - ".github/workflows/apply-interactive-action-guardrails.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/interactive-action-guardrails
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.4.0
          cache: npm
      - name: Apply guardrails
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/apply-interactive-action-guardrails.py')
          source = path.read_text(encoding='utf-8')
          old = "write(path, content[:start] + replacement + content[end:])"
          new = "write(path, content[:start] + replacement + content[end + len(end_marker):])"
          if source.count(old) != 1:
              raise SystemExit('replace_between helper shape changed')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY
          python3 scripts/apply-interactive-action-guardrails.py
          python3 - <<'PY'
          from pathlib import Path

          contract = Path('src/pages/ContractPage.tsx')
          source = contract.read_text(encoding='utf-8')
          old = "        await model.refresh({ mode: 'authoritative' });"
          new = "        void model.refresh({ mode: 'authoritative' });"
          if source.count(old) != 1:
              raise SystemExit(f'ContractPage blocking refresh count changed: {source.count(old)}')
          contract.write_text(source.replace(old, new, 1), encoding='utf-8')

          storage_test = Path('server/test/world-storage-v2.test.js')
          source = storage_test.read_text(encoding='utf-8')
          old = """  const error = assert.throws(() => createRuntimeMutationScope(
    world,
    1,
    'futureUnregisteredAction',
    {},
    { scheduledProcessing: true },
  ));
  assert.equal(error.code, 'INTERACTIVE_ACTION_SCOPE_UNDECLARED');
  assert.equal(error.statusCode, 500);
"""
          new = """  assert.throws(
    () => createRuntimeMutationScope(
      world,
      1,
      'futureUnregisteredAction',
      {},
      { scheduledProcessing: true },
    ),
    { code: 'INTERACTIVE_ACTION_SCOPE_UNDECLARED', statusCode: 500 },
  );
"""
          if source.count(old) != 1:
              raise SystemExit('unregistered action assertion shape changed')
          source = source.replace(old, new, 1)
          old = """  const error = assert.throws(() => createRuntimeMutationScope(world, 1, 'placeOrder', {
    execution: 'future-unregistered-execution',
    productId: 'wheat',
    side: 'buy',
    price: 10,
    quantity: 1,
  }, { scheduledProcessing: true }));
  assert.equal(error.code, 'ORDER_EXECUTION_UNREGISTERED');
  assert.equal(error.statusCode, 400);
"""
          new = """  assert.throws(
    () => createRuntimeMutationScope(world, 1, 'placeOrder', {
      execution: 'future-unregistered-execution',
      productId: 'wheat',
      side: 'buy',
      price: 10,
      quantity: 1,
    }, { scheduledProcessing: true }),
    { code: 'ORDER_EXECUTION_UNREGISTERED', statusCode: 400 },
  );
"""
          if source.count(old) != 1:
              raise SystemExit('unknown order execution assertion shape changed')
          storage_test.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY
          rm scripts/apply-interactive-action-guardrails.py
      - name: Install dependencies
        run: npm ci
      - name: Validate guardrails
        run: |
          node scripts/verify-runtime-efficiency.mjs
          node scripts/verify-client-response-performance.mjs
          node scripts/verify-production-lazy-settlement.mjs
          node --test server/test/player-action-registry.test.js server/test/world-storage-v2.test.js server/test/request-performance.test.js
          npm run typecheck
          git diff --check
      - name: Commit source
        run: |
          git config user.name 'RIVERSOFT'
          git config user.email '105160096+RIVERS0FT@users.noreply.github.com'
          git add -A
          git commit -m '强制玩家交互显式声明事务范围与延迟预算'
          git push origin HEAD:fix/interactive-action-guardrails
