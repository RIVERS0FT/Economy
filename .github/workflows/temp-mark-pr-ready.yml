name: Temporary Mark PR Ready

on:
  push:
    branches:
      - feature/daily-regional-supply-contracts-impl

permissions:
  contents: read
  pull-requests: write

jobs:
  ready:
    runs-on: ubuntu-latest
    steps:
      - name: Mark PR 717 ready for review
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr ready 717 --repo RIVERS0FT/Economy
