name: Fix province page stack entry

on:
  push:
    branches:
      - codex/warehouse-product-stack

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 scripts/codex-fix-province-stack-entry.py
      - run: git diff --check
      - name: Commit patch
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'Expected province stack entry patch to change files.' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/ProvincePage.tsx scripts/verify-provincial-economy.mjs docs/PAGE_CONTENT_AND_NAVIGATION_DESIGN.md
          git commit -m 'preserve map history when opening province'
          git push
