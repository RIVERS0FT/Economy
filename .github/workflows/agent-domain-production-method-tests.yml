name: Agent domain production method tests

on:
  push:
    branches:
      - agent/factory-production-methods

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/factory-production-methods
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Update legacy domain catalog assertions
        run: node scripts/agent-update-domain-production-method-tests.mjs
      - name: Commit test compatibility and remove one-time files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -- .github/workflows/agent-domain-production-method-tests.yml scripts/agent-update-domain-production-method-tests.mjs
          git add -- server/test/domain.test.js
          git commit -m "test: distinguish production methods from base routes"
          git push origin HEAD:agent/factory-production-methods
