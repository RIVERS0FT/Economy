name: Finalize facility object-card baselines

on:
  push:
    branches:
      - codex/facility-object-card-visual

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/facility-object-card-visual
          fetch-depth: 0
      - name: Align shared list gap and button baselines
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          # Keep the shared entity-list row gap; object-card borders/material provide separation.
          css_path = Path('src/styles/global-facility-narrow.css')
          css = css_path.read_text(encoding='utf-8')
          for block in [
              ".global-operation-page .global-facility-catalog-list,\n.global-operation-page .global-facility-region-list {\n  gap: .62rem;\n}\n\n",
              "  .global-operation-page .global-facility-catalog-list,\n  .global-operation-page .global-facility-region-list {\n    gap: .55rem;\n  }\n\n",
              "  .global-operation-page .global-facility-catalog-list,\n  .global-operation-page .global-facility-region-list {\n    gap: .5rem;\n  }\n\n",
          ]:
              if css.count(block) != 1:
                  raise SystemExit(f'CSS list-gap block match count={css.count(block)}')
              css = css.replace(block, '')
          css_path.write_text(css, encoding='utf-8')

          design_path = Path('docs/UI_DESIGN_SYSTEM.md')
          design = design_path.read_text(encoding='utf-8')
          replacements = [
              ('除下文建筑对象卡条目间距例外外，表头与首行、相邻数据行统一使用同一 `.32rem` 间距；列 gap、横向 padding、Chevron 轨道和排序结构继续复用共享定义，业务 CSS 只定义字段列模板与已登记例外。', '表头与首行、相邻数据行统一使用同一 `.32rem` 间距；列 gap、横向 padding、Chevron 轨道和排序结构继续复用共享定义，业务 CSS 只定义字段列模板与已登记例外。'),
              ('建筑对象卡使用实体轻量背景、共享对象卡圆角和边界，条目间由专用 gap 区分；', '建筑对象卡使用实体轻量背景、共享对象卡圆角和边界，条目间继续使用共享 `.32rem` gap；'),
          ]
          for old, new in replacements:
              if design.count(old) != 1:
                  raise SystemExit(f'design replacement match count={design.count(old)}')
              design = design.replace(old, new)
          size = len(design.encode('utf-8'))
          if size > 128 * 1024:
              raise SystemExit(f'UI_DESIGN_SYSTEM.md exceeds 128 KiB: {size} bytes')
          design_path.write_text(design, encoding='utf-8')

          verifier_path = Path('scripts/verify-facility-catalog-layout.mjs')
          verifier = verifier_path.read_text(encoding='utf-8')
          for old in [
              "    '.global-facility-catalog-list,',\n",
              "    'gap: .62rem;',\n",
          ]:
              if verifier.count(old) != 1:
                  raise SystemExit(f'verifier removal match count={verifier.count(old)}: {old}')
              verifier = verifier.replace(old, '')
          verifier_replacements = [
              ("    '建筑对象卡使用实体轻量背景、共享对象卡圆角和边界',\n", "    '建筑对象卡使用实体轻量背景、共享对象卡圆角和边界',\n    '条目间继续使用共享 `.32rem` gap',\n"),
              ("    'expect(desktop.listGap).toBeGreaterThanOrEqual(8);',\n", "    'expect(desktop.listGap).toBeGreaterThanOrEqual(5);',\n"),
          ]
          for old, new in verifier_replacements:
              if verifier.count(old) != 1:
                  raise SystemExit(f'verifier replacement match count={verifier.count(old)}')
              verifier = verifier.replace(old, new)
          verifier_path.write_text(verifier, encoding='utf-8')

          facility_test_path = Path('tests/browser/facility-catalog-layout.spec.ts')
          facility_test = facility_test_path.read_text(encoding='utf-8')
          replacements = [
              ('  expect(desktop.openHeight).toBeGreaterThanOrEqual(47);\n  expect(desktop.openHeight).toBeLessThanOrEqual(49);', '  expect(desktop.openHeight).toBeGreaterThanOrEqual(44);\n  expect(desktop.openHeight).toBeLessThanOrEqual(48);'),
              ('  expect(desktop.listGap).toBeGreaterThanOrEqual(8);', '  expect(desktop.listGap).toBeGreaterThanOrEqual(5);'),
              ('  expect(region.listGap).toBeGreaterThanOrEqual(8);', '  expect(region.listGap).toBeGreaterThanOrEqual(5);'),
          ]
          for old, new in replacements:
              if facility_test.count(old) != 1:
                  raise SystemExit(f'facility test replacement match count={facility_test.count(old)}')
              facility_test = facility_test.replace(old, new)
          facility_test_path.write_text(facility_test, encoding='utf-8')

          op_path = Path('tests/browser/global-operation-pages.spec.ts')
          op = op_path.read_text(encoding='utf-8')
          old = "  expect(regionOpenBox.height).toBeGreaterThanOrEqual(30);\n  expect(regionOpenBox.height).toBeLessThan(44);"
          new = "  expect(regionOpenBox.height).toBeGreaterThanOrEqual(44);\n  expect(regionOpenBox.height).toBeLessThanOrEqual(48);"
          if op.count(old) != 1:
              raise SystemExit(f'region open baseline match count={op.count(old)}')
          op_path.write_text(op.replace(old, new), encoding='utf-8')
          PY
          node scripts/verify-page-content.mjs
          node scripts/verify-facility-catalog-layout.mjs
          node scripts/verify-primary-surface-insets.mjs
          git diff --check
      - name: Commit final baseline alignment
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/UI_DESIGN_SYSTEM.md src/styles/global-facility-narrow.css scripts/verify-facility-catalog-layout.mjs tests/browser/facility-catalog-layout.spec.ts tests/browser/global-operation-pages.spec.ts
          git commit -m "对齐建筑对象卡共享间距与按钮基线"
          git push origin HEAD:codex/facility-object-card-visual
