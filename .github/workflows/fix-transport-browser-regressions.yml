name: Fix transport browser regressions

on:
  push:
    branches:
      - codex/transport-route-pages-auto-logistics

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.4.0
          cache: npm
      - run: npm ci
      - name: Apply browser regression patch
        run: python3 scripts/fix-transport-browser-regressions.py
      - name: Prepare preview and Chromium
        run: |
          npm run generate:artwork
          npm run generate:local-preview
          npx playwright install --with-deps chromium
      - name: Validate affected browser flows
        run: npx playwright test tests/browser/transport-map-picking.spec.ts tests/browser/province-map.spec.ts tests/browser/all-pages-preview.spec.ts
      - name: Commit patch and remove temporary files
        run: |
          rm -f scripts/fix-transport-browser-regressions.py .github/workflows/fix-transport-browser-regressions.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "align transport browser tests with map-only editing"
          git push origin HEAD:codex/transport-route-pages-auto-logistics
