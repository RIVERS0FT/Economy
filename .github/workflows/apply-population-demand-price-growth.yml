name: Apply population demand price growth

on:
  push:
    branches:
      - fix/population-demand-price-growth

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/population-demand-price-growth

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.4.0
          cache: npm

      - name: Apply authoritative change
        run: |
          set -euo pipefail
          python3 .github/scripts/apply-population-demand-price-growth.py
          rm .github/scripts/apply-population-demand-price-growth.py
          rm .github/workflows/apply-population-demand-price-growth.yml

      - name: Install dependencies
        run: npm ci

      - name: Verify demand model
        run: |
          set -euo pipefail
          node scripts/verify-staple-crops-demand.mjs
          node --test \
            server/test/market-demand-v6.test.js \
            server/test/all-products-demand.test.js \
            server/test/market-liquidity.test.js \
            server/test/fertilizer-factory.test.js

      - name: Build
        run: npm run build

      - name: Commit validated change
        run: |
          set -euo pipefail
          git diff --check
          python3 - <<'PYTHON'
          import subprocess
          expected = {
              '.github/scripts/apply-population-demand-price-growth.py',
              '.github/workflows/apply-population-demand-price-growth.yml',
              'docs/INDUSTRY_AND_PRODUCTION_DESIGN.md',
              'docs/PRODUCT_AND_GAMEPLAY_DESIGN.md',
              'docs/SERVER_ARCHITECTURE_AND_DEPLOYMENT_DESIGN.md',
              'docs/UNIFIED_ASSET_ORDER_BOOK_DESIGN.md',
              'scripts/verify-document-authority.mjs',
              'scripts/verify-money-precision.mjs',
              'scripts/verify-staple-crops-demand.mjs',
              'server/src/domain.js',
              'server/src/market-demand.js',
              'server/src/market-demand/catalog.js',
              'server/src/market-demand/state.js',
              'server/test/all-products-demand.test.js',
              'server/test/fertilizer-factory.test.js',
              'server/test/market-demand-v6.test.js',
              'server/test/market-liquidity.test.js',
          }
          actual = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          if actual != expected:
              raise SystemExit(f'unexpected changed paths: missing={sorted(expected - actual)} extra={sorted(actual - expected)}')
          PYTHON
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            docs/INDUSTRY_AND_PRODUCTION_DESIGN.md \
            docs/PRODUCT_AND_GAMEPLAY_DESIGN.md \
            docs/SERVER_ARCHITECTURE_AND_DEPLOYMENT_DESIGN.md \
            docs/UNIFIED_ASSET_ORDER_BOOK_DESIGN.md \
            scripts/verify-document-authority.mjs \
            scripts/verify-money-precision.mjs \
            scripts/verify-staple-crops-demand.mjs \
            server/src/domain.js \
            server/src/market-demand.js \
            server/src/market-demand/catalog.js \
            server/src/market-demand/state.js \
            server/test/all-products-demand.test.js \
            server/test/fertilizer-factory.test.js \
            server/test/market-demand-v6.test.js \
            server/test/market-liquidity.test.js
          git add -u -- \
            .github/scripts/apply-population-demand-price-growth.py \
            .github/workflows/apply-population-demand-price-growth.yml
          git diff --cached --check
          git commit -m 'fix: 降低人口需求报价增长速率'
          git push origin HEAD:fix/population-demand-price-growth
