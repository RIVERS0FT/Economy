name: Apply population demand price growth

on:
  push:
    branches:
      - fix/population-demand-price-growth

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/population-demand-price-growth

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.4.0
          cache: npm

      - name: Repair patch constraints
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          from pathlib import Path

          path = Path('.github/scripts/apply-population-demand-price-growth.py')
          text = path.read_text(encoding='utf-8')
          old = """for path in docs:
              replace(path, '> 更新时间：2026-08-05', '> 更新时间：2026-08-06')
              replace(path, '> 市场需求模型版本：16', '> 市场需求模型版本：17')
              replace_all(path, '市场需求模型 16', '市场需求模型 17')
              replace_all(path, '模型 16', '模型 17')
              text = read(path).replace('`marketDemand.modelVersion = 14`', '`marketDemand.modelVersion = 17`')
              write(path, text)
          """
          new = """for path in docs:
              replace(path, '> 更新时间：2026-08-05', '> 更新时间：2026-08-06')
              replace(path, '> 市场需求模型版本：16', '> 市场需求模型版本：17')
              text = read(path)
              for old, new in [
                  ('市场需求模型 16 与人口经济模型 7 迁移', '市场需求模型 17 与人口经济模型 7 迁移'),
                  ('## 市场需求模型 16 迁移与运行顺序', '## 市场需求模型 17 迁移与运行顺序'),
                  ('市场需求模型 16 必须遵守', '市场需求模型 17 必须遵守'),
                  ('模型 16 需求覆盖规则', '模型 17 需求覆盖规则'),
                  ('模型 16 按实际人口', '模型 17 按实际人口'),
              ]:
                  text = text.replace(old, new)
              text = text.replace('`marketDemand.modelVersion = 14`', '`marketDemand.modelVersion = 17`')
              write(path, text)
          """
          if old not in text:
              raise SystemExit('documentation loop not found')
          text = text.replace(old, new)
          text = text.replace(
              "['市场需求模型版本：17', '单座 C1 工厂人口承载基数固定为 **11**'",
              "['市场需求模型版本：17', '市场需求模型 16 升级至 17', '单座 C1 工厂人口承载基数固定为 **11**'",
          )
          text = text.replace(
              "['population-economy.js', 'population-demographics.js', '人口经济内部版本固定为 7'",
              "['population-economy.js', 'population-demographics.js', '`marketDemand.modelVersion = 17`', '市场需求模型 16 升级至 17', '人口经济内部版本固定为 7'",
          )
          text = text.replace(
              "replace_all('scripts/verify-document-authority.mjs', '市场需求模型 16', '市场需求模型 17')\n",
              '',
          )
          text = text.replace(
              "replace_all('scripts/verify-document-authority.mjs', '模型 16', '模型 17')\n",
              '',
          )
          marker = "\nproduct_doc = 'docs/PRODUCT_AND_GAMEPLAY_DESIGN.md'"
          addition = """
replace_all(
    'server/test/tool-workshop.test.js',
    'MARKET_DEMAND_MODEL_VERSION, 16',
    'MARKET_DEMAND_MODEL_VERSION, 17',
)
replace_all(
    'server/test/tool-workshop.test.js',
    '模型 16 在固定耐用品预算内加入工具需求',
    '模型 17 在固定耐用品预算内加入工具需求',
)
"""
          if marker not in text:
              raise SystemExit('tool workshop insertion marker not found')
          text = text.replace(marker, addition + marker)
          text = text.replace(
              "    'server/test/fertilizer-factory.test.js',\n    verify,",
              "    'server/test/fertilizer-factory.test.js',\n    'server/test/tool-workshop.test.js',\n    verify,",
          )
          path.write_text(text, encoding='utf-8')
          PYTHON

      - name: Apply authoritative change
        run: |
          set -euo pipefail
          python3 .github/scripts/apply-population-demand-price-growth.py

      - name: Install dependencies
        run: npm ci

      - name: Verify demand model
        run: |
          set -euo pipefail
          node scripts/verify-staple-crops-demand.mjs
          node --test \
            server/test/market-demand-v6.test.js \
            server/test/all-products-demand.test.js \
            server/test/market-liquidity.test.js \
            server/test/fertilizer-factory.test.js \
            server/test/tool-workshop.test.js

      - name: Build
        run: npm run build

      - name: Commit validated change
        run: |
          set -euo pipefail
          rm .github/scripts/apply-population-demand-price-growth.py
          rm .github/workflows/apply-population-demand-price-growth.yml
          git diff --check
          python3 - <<'PYTHON'
          import subprocess
          expected = {
              '.github/scripts/apply-population-demand-price-growth.py',
              '.github/workflows/apply-population-demand-price-growth.yml',
              'docs/INDUSTRY_AND_PRODUCTION_DESIGN.md',
              'docs/PRODUCT_AND_GAMEPLAY_DESIGN.md',
              'docs/SERVER_ARCHITECTURE_AND_DEPLOYMENT_DESIGN.md',
              'docs/UNIFIED_ASSET_ORDER_BOOK_DESIGN.md',
              'scripts/verify-money-precision.mjs',
              'scripts/verify-staple-crops-demand.mjs',
              'server/src/domain.js',
              'server/src/market-demand.js',
              'server/src/market-demand/catalog.js',
              'server/src/market-demand/state.js',
              'server/test/all-products-demand.test.js',
              'server/test/fertilizer-factory.test.js',
              'server/test/market-demand-v6.test.js',
              'server/test/market-liquidity.test.js',
              'server/test/tool-workshop.test.js',
          }
          actual = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          if actual != expected:
              raise SystemExit(f'unexpected changed paths: missing={sorted(expected - actual)} extra={sorted(actual - expected)}')
          PYTHON
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            docs/INDUSTRY_AND_PRODUCTION_DESIGN.md \
            docs/PRODUCT_AND_GAMEPLAY_DESIGN.md \
            docs/SERVER_ARCHITECTURE_AND_DEPLOYMENT_DESIGN.md \
            docs/UNIFIED_ASSET_ORDER_BOOK_DESIGN.md \
            scripts/verify-money-precision.mjs \
            scripts/verify-staple-crops-demand.mjs \
            server/src/domain.js \
            server/src/market-demand.js \
            server/src/market-demand/catalog.js \
            server/src/market-demand/state.js \
            server/test/all-products-demand.test.js \
            server/test/fertilizer-factory.test.js \
            server/test/market-demand-v6.test.js \
            server/test/market-liquidity.test.js \
            server/test/tool-workshop.test.js
          git add -u -- \
            .github/scripts/apply-population-demand-price-growth.py \
            .github/workflows/apply-population-demand-price-growth.yml
          git diff --cached --check
          git commit -m 'fix: 降低人口需求报价增长速率'
          git push origin HEAD:fix/population-demand-price-growth
