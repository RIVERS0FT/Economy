name: Apply population demand price growth

on:
  push:
    branches:
      - fix/population-demand-price-growth

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/population-demand-price-growth

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.4.0
          cache: npm

      - name: Apply authoritative change
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          from pathlib import Path

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')

          def replace(path, old, new, expected=1):
              text = read(path)
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected} occurrence(s), found {count}: {old!r}')
              write(path, text.replace(old, new))

          def replace_all(path, old, new, minimum=1):
              text = read(path)
              count = text.count(old)
              if count < minimum:
                  raise SystemExit(f'{path}: expected at least {minimum} occurrence(s), found {count}: {old!r}')
              write(path, text.replace(old, new))

          catalog = 'server/src/market-demand/catalog.js'
          replace(
              catalog,
              'export const MARKET_DEMAND_MODEL_VERSION = 16;',
              'export const MARKET_DEMAND_MODEL_VERSION = 17;\nexport const MARKET_DEMAND_PRESERVE_STATE_FROM_VERSION = 16;',
          )
          for old, new in [
              ('DIRECT_DEMAND_UNFILLED_PRICE_STEP = 1.0075', 'DIRECT_DEMAND_UNFILLED_PRICE_STEP = 1.0025'),
              ('DIRECT_DEMAND_UNFILLED_REFERENCE_GAP_RATE = 0.05', 'DIRECT_DEMAND_UNFILLED_REFERENCE_GAP_RATE = 0.02'),
              ('DIRECT_DEMAND_UNFILLED_REFERENCE_MAX_RATE = 0.02', 'DIRECT_DEMAND_UNFILLED_REFERENCE_MAX_RATE = 0.0075'),
              ('DIRECT_DEMAND_BELOW_REFERENCE_RECOVERY_RATE = 0.025', 'DIRECT_DEMAND_BELOW_REFERENCE_RECOVERY_RATE = 0.01'),
              ('DIRECT_DEMAND_SHORTAGE_PRICE_STEP = 1.005', 'DIRECT_DEMAND_SHORTAGE_PRICE_STEP = 1.0025'),
          ]:
              replace(catalog, old, new)

          market_demand = 'server/src/market-demand.js'
          replace(
              market_demand,
              '  MARKET_DEMAND_MODEL_VERSION,\n  MARKET_DEMAND_PRODUCT_IDS,',
              '  MARKET_DEMAND_MODEL_VERSION,\n  MARKET_DEMAND_PRESERVE_STATE_FROM_VERSION,\n  MARKET_DEMAND_PRODUCT_IDS,',
          )
          replace(
              market_demand,
              "export { MARKET_DEMAND_GROUP_CATALOG, MARKET_DEMAND_MODEL_VERSION, MARKET_DEMAND_PRODUCT_IDS } from './market-demand/catalog.js';",
              "export {\n  MARKET_DEMAND_GROUP_CATALOG,\n  MARKET_DEMAND_MODEL_VERSION,\n  MARKET_DEMAND_PRESERVE_STATE_FROM_VERSION,\n  MARKET_DEMAND_PRODUCT_IDS,\n} from './market-demand/catalog.js';",
          )
          replace(
              market_demand,
              """  function normalizeWorld(world, now = Date.now(), options = {}) {
    const previousVersion = Number(world.marketDemand?.modelVersion || 0);
    stateRuntime.normalizeWorld(world, now, options);
    liquidityRuntime.normalizeWorld(world, {
      seed: Boolean(options.forceRebuild) || previousVersion < MARKET_DEMAND_MODEL_VERSION,
    });
    return world;
  }
""",
              """  function normalizeWorld(world, now = Date.now(), options = {}) {
    const previousVersion = Number(world.marketDemand?.modelVersion || 0);
    const requiresDemandRebuild = Boolean(options.forceRebuild)
      || previousVersion < MARKET_DEMAND_PRESERVE_STATE_FROM_VERSION;
    stateRuntime.normalizeWorld(world, now, options);
    liquidityRuntime.normalizeWorld(world, { seed: requiresDemandRebuild });
    return world;
  }
""",
          )

          state = 'server/src/market-demand/state.js'
          replace(
              state,
              "import { DIRECT_DEMAND_MIN_PRICE, MARKET_DEMAND_GROUP_CATALOG, MARKET_DEMAND_MODEL_VERSION, PRICE_MAX_MULTIPLIER } from './catalog.js';",
              """import {
  DIRECT_DEMAND_MIN_PRICE,
  MARKET_DEMAND_GROUP_CATALOG,
  MARKET_DEMAND_MODEL_VERSION,
  MARKET_DEMAND_PRESERVE_STATE_FROM_VERSION,
  PRICE_MAX_MULTIPLIER,
} from './catalog.js';""",
          )
          replace(
              state,
              """    const previousModel = world.marketDemand && typeof world.marketDemand === 'object' ? world.marketDemand : null;
    const isUpgrade = forceRebuild || Number(previousModel?.modelVersion || 0) < MARKET_DEMAND_MODEL_VERSION;
    const fallback = defaultWorldState(now);
""",
              """    const previousModel = world.marketDemand && typeof world.marketDemand === 'object' ? world.marketDemand : null;
    const previousModelVersion = Number(previousModel?.modelVersion || 0);
    const requiresDemandRebuild = forceRebuild
      || previousModelVersion < MARKET_DEMAND_PRESERVE_STATE_FROM_VERSION;
    const fallback = defaultWorldState(now);
""",
          )
          replace(state, 'if (isUpgrade) {', 'if (requiresDemandRebuild) {', expected=3)

          domain = 'server/src/domain.js'
          replace(
              domain,
              '  MARKET_DEMAND_MODEL_VERSION,\n  MARKET_DEMAND_PRODUCT_IDS,',
              '  MARKET_DEMAND_MODEL_VERSION,\n  MARKET_DEMAND_PRESERVE_STATE_FROM_VERSION,\n  MARKET_DEMAND_PRODUCT_IDS,',
              expected=2,
          )
          replace(
              domain,
              """  const hadCurrentMarketDemandModel = Number(world.marketDemand?.modelVersion || 0) >= MARKET_DEMAND_MODEL_VERSION;
  const hadCurrentPopulationModel = Number(world.populationEconomy?.modelVersion || 0) >= 7;
  const hadCurrentDemandSystem = hadCurrentMarketDemandModel && hadCurrentPopulationModel;
""",
              """  const hadCompatibleMarketDemandModel = Number(world.marketDemand?.modelVersion || 0)
    >= MARKET_DEMAND_PRESERVE_STATE_FROM_VERSION;
  const hadCurrentPopulationModel = Number(world.populationEconomy?.modelVersion || 0) >= 7;
  const hadCompatibleDemandSystem = hadCompatibleMarketDemandModel && hadCurrentPopulationModel;
""",
          )
          replace(domain, 'hadCurrentDemandSystem', 'hadCompatibleDemandSystem', expected=3)

          market_test = 'server/test/market-demand-v6.test.js'
          replace(
              market_test,
              '  assert.ok(raisedAnchor >= 2.23 && raisedAnchor <= 2.24);\n  assert.equal(topWheatPriceFor(raisedCycleId), 2.23);',
              '  assert.ok(raisedAnchor >= 2.07 && raisedAnchor <= 2.08);\n  assert.equal(topWheatPriceFor(raisedCycleId), 2.07);',
          )
          replace(
              market_test,
              '  assert.equal(zeroWorld.marketDemand.groups.food.directQuoteAnchors.food, 6.2);',
              '  assert.equal(zeroWorld.marketDemand.groups.food.directQuoteAnchors.food, 6.075);',
          )
          replace(
              market_test,
              '  assert.equal(partialWorld.marketDemand.groups.food.directQuoteAnchors.food, 6.1);',
              '  assert.equal(partialWorld.marketDemand.groups.food.directQuoteAnchors.food, 6.04);',
          )
          replace(
              market_test,
              "test('shortage pressure approaches the reference premium by at most half a percent per cycle', () => {",
              "test('shortage pressure approaches the reference premium by at most a quarter percent per cycle', () => {",
          )
          replace(
              market_test,
              '  assert.equal(Math.max(...prices), 180.89);',
              '  assert.equal(Math.max(...prices), 180.45);',
          )
          migration_test = """

test('market model 17 preserves model 16 demand state and escrow during rate-only migration', () => {
  const now = 1_700_000_000_000;
  const runtime = createRuntime();
  const world = createTestWorld(now);
  runtime.initializeWorld(world, now);
  world.marketDemand.groups.food.nextDemandAt = now;
  runtime.processGroup(world, 'food', now);

  const order = world.orders.find((item) => (
    item.demandGroupId === 'food'
    && item.demandTier === 'direct'
    && isOpenOrder(item)
  ));
  assert.ok(order);
  const productId = order.productId;
  world.marketDemand.groups.food.directQuoteAnchors[productId] = 2.3456;
  world.marketDemand.groups.food.directOversupplyCycles[productId] = 4;
  const orderBefore = {
    status: order.status,
    remaining: order.remaining,
    price: order.price,
  };
  const frozenBefore = Object.fromEntries(Object.entries(world.populationEconomy.models).map(([id, model]) => [
    id,
    model.frozenCredits,
  ]));

  world.marketDemand.modelVersion = 16;
  runtime.normalizeWorld(world, now + 1_000);

  assert.equal(world.marketDemand.modelVersion, 17);
  assert.equal(world.marketDemand.groups.food.directQuoteAnchors[productId], 2.3456);
  assert.equal(world.marketDemand.groups.food.directOversupplyCycles[productId], 4);
  assert.deepEqual({ status: order.status, remaining: order.remaining, price: order.price }, orderBefore);
  assert.deepEqual(Object.fromEntries(Object.entries(world.populationEconomy.models).map(([id, model]) => [
    id,
    model.frozenCredits,
  ])), frozenBefore);
});
"""
          replace(
              market_test,
              "\ntest('market model 12 uses funded population wallets when no player is active', () => {",
              migration_test + "\ntest('market model 12 uses funded population wallets when no player is active', () => {",
          )

          all_products = 'server/test/all-products-demand.test.js'
          replace_all(all_products, 'MARKET_DEMAND_MODEL_VERSION, 16', 'MARKET_DEMAND_MODEL_VERSION, 17')
          replace_all(all_products, 'world.marketDemand.modelVersion, 16', 'world.marketDemand.modelVersion, 17')
          replace_all(all_products, 'model 16', 'model 17')
          domain_migration_test = """

test('model 16 to 17 rate migration preserves demand escrow and quote state', () => {
  const world = createWorld(now);
  ensurePlayer(world, alice, now);
  for (const state of Object.values(world.demandGroups)) {
    state.nextDemandAt = now;
    state.lastCycleId = Math.floor(now / cycleMs) - 1;
  }
  processWorld(world, now + 1);

  const oldOrders = world.orders.filter((order) => (
    order.ownerType === 'population'
    && (order.demandTier === 'direct' || order.demandTier === 'derived-liquidity')
    && order.remaining > 0
    && (order.status === 'open' || order.status === 'partial')
  ));
  assert.ok(oldOrders.length > 0);
  const oldOrderState = new Map(oldOrders.map((order) => [order.id, {
    status: order.status,
    remaining: order.remaining,
    price: order.price,
  }]));
  const frozenBefore = Object.fromEntries(Object.entries(world.populationEconomy.models).map(([id, model]) => [
    id,
    model.frozenCredits,
  ]));
  const reserveBefore = Object.fromEntries(Object.entries(world.marketDemand.liquidity.groups).map(([groupId, group]) => [
    groupId,
    {
      credits: group.credits + group.frozenCredits,
      inventories: Object.fromEntries(Object.entries(group.reserves).map(([productId, reserve]) => [
        productId,
        reserve.inventory + reserve.frozenInventory,
      ])),
    },
  ]));
  const wheatReference = world.marketDemand.priceTransmission.products.wheat.referencePrice;
  world.marketDemand.groups.food.directQuoteAnchors.wheat = wheatReference * 1.25;
  world.marketDemand.groups.food.directOversupplyCycles.wheat = 4;
  world.marketDemand.modelVersion = 16;

  migrateWorld(world, now + 2);

  assert.equal(world.marketDemand.modelVersion, 17);
  assert.equal(world.marketDemand.groups.food.directQuoteAnchors.wheat, wheatReference * 1.25);
  assert.equal(world.marketDemand.groups.food.directOversupplyCycles.wheat, 4);
  for (const [orderId, snapshot] of oldOrderState) {
    const order = world.orders.find((item) => item.id === orderId);
    assert.ok(order, orderId);
    assert.deepEqual({ status: order.status, remaining: order.remaining, price: order.price }, snapshot);
  }
  assert.deepEqual(Object.fromEntries(Object.entries(world.populationEconomy.models).map(([id, model]) => [
    id,
    model.frozenCredits,
  ])), frozenBefore);
  for (const [groupId, group] of Object.entries(world.marketDemand.liquidity.groups)) {
    assert.equal(group.credits + group.frozenCredits, reserveBefore[groupId].credits, groupId);
    for (const [productId, reserve] of Object.entries(group.reserves)) {
      assert.equal(
        reserve.inventory + reserve.frozenInventory,
        reserveBefore[groupId].inventories[productId],
        `${groupId}/${productId}`,
      );
    }
  }
});
"""
          replace(
              all_products,
              "\n\ntest('population model 6 migration refunds current model 17 escrow before rebuilding demand', () => {",
              domain_migration_test + "\n\ntest('population model 6 migration refunds current model 17 escrow before rebuilding demand', () => {",
          )

          for test_path in [
              'server/test/market-liquidity.test.js',
              'server/test/fertilizer-factory.test.js',
          ]:
              replace_all(test_path, 'MARKET_DEMAND_MODEL_VERSION, 16', 'MARKET_DEMAND_MODEL_VERSION, 17')
          replace_all(
              'server/test/market-liquidity.test.js',
              'world.marketDemand.modelVersion, 16',
              'world.marketDemand.modelVersion, 17',
          )

          product_doc = 'docs/PRODUCT_AND_GAMEPLAY_DESIGN.md'
          old_quote_rule = '上一完整周期存在直接需求且零成交时，上涨量取“上一锚点的 0.75%”与“参考价缺口的 5%、但最多为参考价的 2%”中的较大值；存在成交但直接成交率低于需求组目标时，锚点低于参考价只恢复 2.5% 缺口，高于参考价保持；普通达标、无需求和持续过剩仍双向回归或下调。压力达到 1.15 时，参考价 103% 仅作为短缺目标，每周期最多在当前报价锚点上追涨 0.5%。'
          new_quote_rule = '上一完整周期存在直接需求且零成交时，上涨量取“上一锚点的 0.25%”与“参考价缺口的 2%、但最多为参考价的 0.75%”中的较大值；存在成交但直接成交率低于需求组目标时，锚点低于参考价只恢复 1% 缺口，高于参考价保持；普通达标、无需求和持续过剩仍双向回归或下调。压力达到 1.15 时，参考价 103% 仅作为短缺目标，每周期最多在当前报价锚点上追涨 0.25%。市场需求模型 16 升级至 17 只调整后续报价速率，必须保留现有双向报价锚点、连续过剩周期、未完成消费订单及其真实冻结资金、市场储备资产和价格传导状态；早于模型 16 的旧状态仍执行完整重建迁移。'
          replace(product_doc, old_quote_rule, new_quote_rule)

          server_doc = 'docs/SERVER_ARCHITECTURE_AND_DEPLOYMENT_DESIGN.md'
          replace(
              server_doc,
              '当前客户端状态版本为 27，本地匿名成交存储为 v6，世界状态版本为 24，市场需求模型版本为 14；',
              '当前客户端状态版本为 30，本地匿名成交存储为 v6，世界状态版本为 26，市场需求模型版本为 17；',
          )
          replace(
              server_doc,
              '- 权威状态使用 `marketDemand.modelVersion = 14`、`populationEconomy.modelVersion = 7`。模型升级时先原额释放并取消旧消费需求与市场储备订单，保留玩家订单、人口钱包、储备真实资产、价格传导关系和玩家资产，不重复补发储备资产或人口启动资金。',
              '- 权威状态使用 `marketDemand.modelVersion = 17`、`populationEconomy.modelVersion = 7`。早于市场需求模型 16 或早于人口经济模型 7 的旧状态升级时，先原额释放并取消旧消费需求与市场储备订单，保留玩家订单、人口钱包、储备真实资产、价格传导关系和玩家资产，不重复补发储备资产或人口启动资金；市场需求模型 16 升级至 17 仅降低后续报价增长速率，必须保留报价锚点、过剩周期、未完成系统订单、真实冻结资金和储备资产。',
          )

          docs = [
              product_doc,
              'docs/INDUSTRY_AND_PRODUCTION_DESIGN.md',
              'docs/UNIFIED_ASSET_ORDER_BOOK_DESIGN.md',
              server_doc,
          ]
          for path in docs:
              replace(path, '> 更新时间：2026-08-05', '> 更新时间：2026-08-06')
              replace(path, '> 市场需求模型版本：16', '> 市场需求模型版本：17')
              replace_all(path, '市场需求模型 16', '市场需求模型 17')
              text = read(path).replace('`marketDemand.modelVersion = 14`', '`marketDemand.modelVersion = 17`')
              write(path, text)

          verify = 'scripts/verify-staple-crops-demand.mjs'
          replace_all(verify, 'MARKET_DEMAND_MODEL_VERSION, 16', 'MARKET_DEMAND_MODEL_VERSION, 17')
          replace_all(verify, 'MARKET_DEMAND_MODEL_VERSION = 16', 'MARKET_DEMAND_MODEL_VERSION = 17')
          replace(
              verify,
              "  'MARKET_DEMAND_MODEL_VERSION = 17',\n  'DIRECT_BUDGET_SHARE = 0.70',",
              "  'MARKET_DEMAND_MODEL_VERSION = 17',\n  'MARKET_DEMAND_PRESERVE_STATE_FROM_VERSION = 16',\n  'DIRECT_BUDGET_SHARE = 0.70',",
          )
          for old, new in [
              ('DIRECT_DEMAND_UNFILLED_PRICE_STEP = 1.0075', 'DIRECT_DEMAND_UNFILLED_PRICE_STEP = 1.0025'),
              ('DIRECT_DEMAND_UNFILLED_REFERENCE_GAP_RATE = 0.05', 'DIRECT_DEMAND_UNFILLED_REFERENCE_GAP_RATE = 0.02'),
              ('DIRECT_DEMAND_UNFILLED_REFERENCE_MAX_RATE = 0.02', 'DIRECT_DEMAND_UNFILLED_REFERENCE_MAX_RATE = 0.0075'),
              ('DIRECT_DEMAND_BELOW_REFERENCE_RECOVERY_RATE = 0.025', 'DIRECT_DEMAND_BELOW_REFERENCE_RECOVERY_RATE = 0.01'),
              ('DIRECT_DEMAND_SHORTAGE_PRICE_STEP = 1.005', 'DIRECT_DEMAND_SHORTAGE_PRICE_STEP = 1.0025'),
              ('市场需求模型版本：16', '市场需求模型版本：17'),
              ('市场需求模型 16', '市场需求模型 17'),
              ('上一锚点的 0.75%', '上一锚点的 0.25%'),
              ('参考价缺口的 5%', '参考价缺口的 2%'),
              ('最多为参考价的 2%', '最多为参考价的 0.75%'),
              ('只恢复 2.5% 缺口', '只恢复 1% 缺口'),
              ('当前报价锚点上追涨 0.5%', '当前报价锚点上追涨 0.25%'),
              ('half a percent per cycle', 'a quarter percent per cycle'),
              ('model 16', 'model 17'),
          ]:
              replace_all(verify, old, new)
          replace(
              verify,
              "  'shortage pressure approaches the reference premium by at most a quarter percent per cycle',",
              "  'shortage pressure approaches the reference premium by at most a quarter percent per cycle',\n  'market model 17 preserves model 16 demand state and escrow during rate-only migration',",
          )
          replace(
              verify,
              "  'population model 6 migration refunds current model 17 escrow before rebuilding demand',",
              "  'model 16 to 17 rate migration preserves demand escrow and quote state',\n  'population model 6 migration refunds current model 17 escrow before rebuilding demand',",
          )
          replace(
              verify,
              "  'directQuoteAnchors',",
              "  'directQuoteAnchors',\n  'requiresDemandRebuild',",
          )

          for path in ['scripts/verify-money-precision.mjs']:
              replace_all(path, 'MARKET_DEMAND_MODEL_VERSION = 16', 'MARKET_DEMAND_MODEL_VERSION = 17')
          for path in ['scripts/verify-document-authority.mjs']:
              replace_all(path, '市场需求模型 16', '市场需求模型 17')

          forbidden = {
              'MARKET_DEMAND_MODEL_VERSION = 16',
              'MARKET_DEMAND_MODEL_VERSION, 16',
              'world.marketDemand.modelVersion, 16',
              '市场需求模型版本：16',
              '上一锚点的 0.75%',
              '参考价缺口的 5%',
              '只恢复 2.5% 缺口',
              '当前报价锚点上追涨 0.5%',
          }
          checked = [
              catalog,
              market_demand,
              state,
              domain,
              market_test,
              all_products,
              'server/test/market-liquidity.test.js',
              'server/test/fertilizer-factory.test.js',
              verify,
              'scripts/verify-money-precision.mjs',
              'scripts/verify-document-authority.mjs',
              *docs,
          ]
          combined = '\n'.join(read(path) for path in checked)
          for text in forbidden:
              if text in combined:
                  raise SystemExit(f'stale rule remains: {text}')
          for required in [
              'MARKET_DEMAND_MODEL_VERSION = 17',
              'MARKET_DEMAND_PRESERVE_STATE_FROM_VERSION = 16',
              'DIRECT_DEMAND_UNFILLED_PRICE_STEP = 1.0025',
              'DIRECT_DEMAND_UNFILLED_REFERENCE_GAP_RATE = 0.02',
              'DIRECT_DEMAND_UNFILLED_REFERENCE_MAX_RATE = 0.0075',
              'DIRECT_DEMAND_BELOW_REFERENCE_RECOVERY_RATE = 0.01',
              'DIRECT_DEMAND_SHORTAGE_PRICE_STEP = 1.0025',
              '市场需求模型 16 升级至 17',
              'model 16 to 17 rate migration preserves demand escrow and quote state',
          ]:
              if required not in combined:
                  raise SystemExit(f'required rule missing: {required}')
          PYTHON

          rm .github/workflows/apply-population-demand-price-growth.yml

      - name: Install dependencies
        run: npm ci

      - name: Verify demand model
        run: |
          set -euo pipefail
          node scripts/verify-staple-crops-demand.mjs
          node --test \
            server/test/market-demand-v6.test.js \
            server/test/all-products-demand.test.js \
            server/test/market-liquidity.test.js \
            server/test/fertilizer-factory.test.js

      - name: Build
        run: npm run build

      - name: Commit validated change
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python3 - <<'PYTHON'
          import subprocess
          expected = {
              '.github/workflows/apply-population-demand-price-growth.yml',
              'docs/INDUSTRY_AND_PRODUCTION_DESIGN.md',
              'docs/PRODUCT_AND_GAMEPLAY_DESIGN.md',
              'docs/SERVER_ARCHITECTURE_AND_DEPLOYMENT_DESIGN.md',
              'docs/UNIFIED_ASSET_ORDER_BOOK_DESIGN.md',
              'scripts/verify-document-authority.mjs',
              'scripts/verify-money-precision.mjs',
              'scripts/verify-staple-crops-demand.mjs',
              'server/src/domain.js',
              'server/src/market-demand.js',
              'server/src/market-demand/catalog.js',
              'server/src/market-demand/state.js',
              'server/test/all-products-demand.test.js',
              'server/test/fertilizer-factory.test.js',
              'server/test/market-demand-v6.test.js',
              'server/test/market-liquidity.test.js',
          }
          actual = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          if actual != expected:
              raise SystemExit(f'unexpected changed paths: missing={sorted(expected - actual)} extra={sorted(actual - expected)}')
