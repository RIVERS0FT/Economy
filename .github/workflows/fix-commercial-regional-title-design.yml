name: Fix commercial regional title design

on:
  push:
    branches:
      - feat/commercial-buildings

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/commercial-buildings
          fetch-depth: 0
      - name: Extend shared title authority to commercial building detail
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('docs/UI_DESIGN_SYSTEM.md')
          text = path.read_text()
          replacements = [
              (
                  '`RegionalEntityPageTitle` 固定负责地区商品／工厂详情共享两行标题',
                  '`RegionalEntityPageTitle` 固定负责地区商品／商业建筑／工厂详情共享两行标题',
              ),
              (
                  '当前 `PlayerPageNavigationContext` 位置为 `regional-product` 或 `regional-facility` 时',
                  '当前 `PlayerPageNavigationContext` 位置为 `regional-product`、`regional-commercial` 或 `regional-facility` 时',
              ),
              (
                  '把原商品／工厂详情保留在历史中以便返回',
                  '把原商品／商业建筑／工厂详情保留在历史中以便返回',
              ),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'missing UI design token: {old}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          Path('.github/workflows/fix-commercial-regional-title-design.yml').unlink()
          PY
      - name: Commit design alignment
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "docs: 扩展商业建筑地区标题导航规则"
          git push origin HEAD:feat/commercial-buildings
