name: One-shot normalize regional entity title authority

on:
  push:
    branches:
      - codex/transport-route-cards-footer

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: codex/transport-route-cards-footer
          fetch-depth: 0
      - name: Normalize regional title authority wording
        shell: python
        run: |
          from pathlib import Path

          path = Path('docs/UI_DESIGN_SYSTEM.md')
          text = path.read_text(encoding='utf-8')
          old = '`RegionalEntityPageTitle` 是地区商品与地区工厂详情的唯一共享标题结构。第一行固定显示实体名称并使用大于地区行的主标题字号；第二行固定显示州级地区全称。'
          new = '`RegionalEntityPageTitle` 固定负责地区商品／工厂详情共享两行标题：第一行显示实体名称并使用大于地区行的主标题字号；第二行显示州级地区全称。'
          if old not in text:
              raise SystemExit('regional entity title authority paragraph not found')
          if new in text:
              raise SystemExit('regional entity title authority wording already normalized')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
      - name: Commit normalized authority and remove one-shot workflow
        run: |
          git config user.name "RIVERSOFT"
          git config user.email "105160096+RIVERS0FT@users.noreply.github.com"
          rm .github/workflows/one-shot-normalize-regional-title-authority.yml
          git add docs/UI_DESIGN_SYSTEM.md .github/workflows/one-shot-normalize-regional-title-authority.yml
          git commit -m "Normalize regional entity title authority"
          git push origin HEAD:codex/transport-route-cards-footer
