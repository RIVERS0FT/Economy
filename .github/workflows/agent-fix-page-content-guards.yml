name: Fix page content guards

on:
  push:
    branches:
      - agent/gem-construction-and-dynamic-rate
    paths:
      - .github/workflows/agent-fix-page-content-guards.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/gem-construction-and-dynamic-rate
          fetch-depth: 0
      - name: Align production and shop guards
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/verify-page-content.mjs')
          text = path.read_text()
          replacements = [
            (
              "  'summary[group.status] += 1;',",
              "  'if (!entry.constructionOnly)',\n  'summary[entry.group.status] += 1;',",
              'construction-only status exclusion',
            ),
            (
              "  '| 商店 | `gem-shop` | `GemShopPage` | 邀请获取宝石与宝石单向兑换普通货币 |',",
              "  '| 商店 | `gem-shop` | `GemShopPage` | 邀请获取宝石与每日终端动态报价兑换普通货币 |',",
              'dynamic quote page responsibility',
            ),
          ]
          for old, new, label in replacements:
              if old not in text:
                  raise SystemExit(f'missing page guard: {label}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
      - name: Commit guard updates
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/agent-fix-page-content-guards.yml
          git config user.name "OpenAI Codex"
          git config user.email "codex@openai.com"
          git add -A
          git commit -m "同步施工入口与商店页面职责校验"
          git push origin HEAD:agent/gem-construction-and-dynamic-rate
