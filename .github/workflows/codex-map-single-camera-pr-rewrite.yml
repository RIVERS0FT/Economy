name: Codex Map Single Camera PR Rewrite

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  rewrite:
    if: github.head_ref == 'codex/fix-map-single-camera-20260822'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Extract and run authoritative rewrite
        shell: bash
        run: |
          set -euo pipefail
          awk '
            /python3 - <<.PY./ { capture=1; next }
            capture && /^          PY$/ { capture=0; exit }
            capture { sub(/^          /, ""); print }
          ' .github/workflows/codex-map-single-camera-rewrite.yml > /tmp/map-rewrite.py
          test -s /tmp/map-rewrite.py
          python3 /tmp/map-rewrite.py

      - name: Commit rewritten sources and remove temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/codex-map-single-camera-rewrite.yml
          rm -f .github/workflows/codex-map-single-camera-pr-rewrite.yml
          git config user.name 'RIVERSOFT'
          git config user.email '105160096+RIVERS0FT@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m '同步地图单相机设计与防回退'
          git push origin HEAD:${{ github.head_ref }}
