name: Deploy Economy Website

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-economy-website
  cancel-in-progress: true

permissions:
  contents: read
  statuses: write

env:
  ECONOMY_PRODUCTION_PUBLIC_IP: 116.204.134.56

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.4.0
          cache: npm

      - name: Install dependencies
        id: install_dependencies
        run: |
          exec > >(tee /tmp/economy-install-dependencies.log) 2>&1
          set -euo pipefail
          npm ci

      - name: Build website and test authoritative API
        id: build
        run: |
          exec > >(tee /tmp/economy-build.log) 2>&1
          set -euo pipefail
          npm run build

      - name: Prepare Chromium
        id: install_chromium
        run: |
          exec > >(tee /tmp/economy-install-chromium.log) 2>&1
          set -euo pipefail
          bash scripts/prepare-playwright-chromium.sh

      - name: Test browser runtime before deployment
        id: browser_test
        shell: bash
        run: |
          exec > >(tee /tmp/economy-browser-test.log) 2>&1
          set -euo pipefail
          npm run test:browser

      - name: Ensure rsync is available
        id: ensure_rsync
        run: |
          exec > >(tee /tmp/economy-rsync.log) 2>&1
          set -euo pipefail
          if ! command -v rsync >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y rsync
          fi

      - name: Configure SSH
        id: configure_ssh
        env:
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          exec > >(tee /tmp/economy-ssh.log) 2>&1
          set -euo pipefail
          test -n "$ECONOMY_PRODUCTION_PUBLIC_IP"
          test -n "$SERVER_USER"
          test -n "$SERVER_PORT"
          test -n "$SERVER_SSH_KEY"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          touch ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          ssh_connected=0
          for attempt in 1 2 3 4 5; do
            if ssh \
              -i ~/.ssh/deploy_key \
              -p "$SERVER_PORT" \
              -o BatchMode=yes \
              -o ConnectTimeout=15 \
              -o StrictHostKeyChecking=accept-new \
              -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
              "$SERVER_USER@$ECONOMY_PRODUCTION_PUBLIC_IP" true; then
              ssh_connected=1
              break
            fi
            echo "ECONOMY_SSH_PREFLIGHT_RETRY attempt=$attempt"
            if [ "$attempt" -lt 5 ]; then
              sleep 5
            fi
          done
          if [ "$ssh_connected" -ne 1 ]; then
            echo "ECONOMY_SSH_PREFLIGHT_FAILED attempts=5" >&2
            exit 1
          fi

      - name: Prune backups and create compact compressed database backup before storage V2 migration
        id: backup_database
        env:
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          exec > >(tee /tmp/economy-database-backup.log) 2>&1
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -p "$SERVER_PORT" "$SERVER_USER@$ECONOMY_PRODUCTION_PUBLIC_IP" \
            'if [ "$(id -u)" -eq 0 ]; then exec python3 - backup-world --target-storage-schema-version 2; elif command -v sudo >/dev/null 2>&1 && sudo -n true; then exec sudo -n python3 - backup-world --target-storage-schema-version 2; else echo ECONOMY_DEPLOY_PRIVILEGES_UNAVAILABLE >&2; exit 1; fi' \
            < scripts/manage-production-backups.py

      - name: Prepare remote directories
        id: prepare_remote
        env:
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          exec > >(tee /tmp/economy-deploy.log) 2>&1
          set -euo pipefail
          test -n "$SERVER_USER"
          ssh -i ~/.ssh/deploy_key -p "$SERVER_PORT" "$SERVER_USER@$ECONOMY_PRODUCTION_PUBLIC_IP" 'bash -s' <<'REMOTE'
          set -euo pipefail
          deploy_user="$(id -un)"
          deploy_group="$(id -gn)"

          run_privileged() {
            if [ "$(id -u)" -eq 0 ]; then
              "$@"
            elif command -v sudo >/dev/null 2>&1 && sudo -n true; then
              sudo -n "$@"
            else
              echo ECONOMY_DEPLOY_PRIVILEGES_UNAVAILABLE >&2
              exit 1
            fi
          }

          run_privileged install -d -o "$deploy_user" -g "$deploy_group" \
            /var/www/game/economy \
            /var/www/game/economy/assets \
            /var/www/game/economy-api \
            /var/www/game/shared

          test -w /var/www/game/economy || { echo ECONOMY_WEB_DIRECTORY_NOT_WRITABLE >&2; exit 1; }
          test -w /var/www/game/economy/assets || { echo ECONOMY_ASSET_DIRECTORY_NOT_WRITABLE >&2; exit 1; }
          test -w /var/www/game/economy-api || { echo ECONOMY_API_DIRECTORY_NOT_WRITABLE >&2; exit 1; }
          test -w /var/www/game/shared || { echo ECONOMY_SHARED_DIRECTORY_NOT_WRITABLE >&2; exit 1; }
          command -v python3 >/dev/null || { echo ECONOMY_REMOTE_PYTHON_MISSING >&2; exit 1; }
          command -v curl >/dev/null || { echo ECONOMY_REMOTE_CURL_MISSING >&2; exit 1; }

          minimum_free_kb=$((1024 * 1024))
          available_kb="$(df -Pk /var/www/game | awk 'NR == 2 { print $4 }')"
          case "$available_kb" in
            ''|*[!0-9]*) echo ECONOMY_DEPLOY_DISK_CHECK_INVALID >&2; exit 1 ;;
          esac
          if [ "$available_kb" -lt "$minimum_free_kb" ]; then
            echo "ECONOMY_DEPLOY_INSUFFICIENT_DISK available_kb=$available_kb required_kb=$minimum_free_kb" >&2
            exit 1
          fi
          echo "ECONOMY_DEPLOY_AVAILABLE_KB=$available_kb"
          REMOTE

      - name: Prepare portable Node runtime
        id: prepare_runtime
        env:
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          exec > >(tee /tmp/economy-runtime.log) 2>&1
          set -euo pipefail
          remote_machine="$(ssh -i ~/.ssh/deploy_key -p "$SERVER_PORT" "$SERVER_USER@$ECONOMY_PRODUCTION_PUBLIC_IP" uname -m)"
          case "$remote_machine" in
            x86_64|amd64) node_arch="x64" ;;
            aarch64|arm64) node_arch="arm64" ;;
            *) echo "ECONOMY_UNSUPPORTED_SERVER_ARCHITECTURE: $remote_machine" >&2; exit 1 ;;
          esac
          node_version="$(node -p 'process.versions.node')"
          archive="node-v${node_version}-linux-${node_arch}.tar.xz"
          runtime_dir="/tmp/economy-node-runtime"
          rm -rf "$runtime_dir"
          mkdir -p "$runtime_dir"
          curl --fail --silent --show-error --location \
            "https://nodejs.org/dist/v${node_version}/${archive}" \
            --output "/tmp/${archive}" || { echo ECONOMY_NODE_RUNTIME_DOWNLOAD_FAILED >&2; exit 1; }
          tar -xJf "/tmp/${archive}" --strip-components=1 -C "$runtime_dir"
          "$runtime_dir/bin/node" -e 'require("node:sqlite"); console.log(process.versions.node)'

      - name: Upload website and game API
        id: upload_assets
        env:
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          exec > >(tee /tmp/economy-upload.log) 2>&1
          set -euo pipefail
          rsync -az -e "ssh -i ~/.ssh/deploy_key -p $SERVER_PORT" \
            dist/assets/ "$SERVER_USER@$ECONOMY_PRODUCTION_PUBLIC_IP:/var/www/game/economy/assets/"
          rsync -az --delete -e "ssh -i ~/.ssh/deploy_key -p $SERVER_PORT" \
            --exclude assets/ \
            --exclude index.html \
            dist/ "$SERVER_USER@$ECONOMY_PRODUCTION_PUBLIC_IP:/var/www/game/economy/"
          rsync -az --delete -e "ssh -i ~/.ssh/deploy_key -p $SERVER_PORT" \
            shared/ "$SERVER_USER@$ECONOMY_PRODUCTION_PUBLIC_IP:/var/www/game/shared/"
          rsync -az --delete-before -e "ssh -i ~/.ssh/deploy_key -p $SERVER_PORT" \
            server/ "$SERVER_USER@$ECONOMY_PRODUCTION_PUBLIC_IP:/var/www/game/economy-api/"
          rsync -az --delete-before -e "ssh -i ~/.ssh/deploy_key -p $SERVER_PORT" \
            /tmp/economy-node-runtime/ "$SERVER_USER@$ECONOMY_PRODUCTION_PUBLIC_IP:/var/www/game/economy-api/runtime/"

      - name: Install authoritative game service
        id: install_service
        env:
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          exec > >(tee /tmp/economy-api-install.log) 2>&1
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -p "$SERVER_PORT" "$SERVER_USER@$ECONOMY_PRODUCTION_PUBLIC_IP" \
            "if [ \$(id -u) -eq 0 ]; then exec python3 - /var/www/game/economy-api '$SERVER_USER'; elif command -v sudo >/dev/null 2>&1 && sudo -n true; then exec sudo -n python3 - /var/www/game/economy-api '$SERVER_USER'; else echo ECONOMY_DEPLOY_PRIVILEGES_UNAVAILABLE >&2; exit 1; fi" \
            < scripts/install-economy-api.py

      - name: Configure Nginx routes and static cache
        id: configure_nginx
        env:
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          exec > >(tee /tmp/economy-proxy-configure.log) 2>&1
          set -euo pipefail
          for script in \
            scripts/configure-economy-nginx.py \
            scripts/configure-economy-static-cache.py \
            scripts/configure-economy-registration-nginx.py; do
            ssh -i ~/.ssh/deploy_key -p "$SERVER_PORT" "$SERVER_USER@$ECONOMY_PRODUCTION_PUBLIC_IP" \
              'if [ "$(id -u)" -eq 0 ]; then exec python3 -; elif command -v sudo >/dev/null 2>&1 && sudo -n true; then exec sudo -n python3 -; else echo ECONOMY_DEPLOY_PRIVILEGES_UNAVAILABLE >&2; exit 1; fi' \
              < "$script"
          done
          ssh -i ~/.ssh/deploy_key -p "$SERVER_PORT" "$SERVER_USER@$ECONOMY_PRODUCTION_PUBLIC_IP" \
            "if [ \$(id -u) -eq 0 ]; then exec python3 - '$ECONOMY_PRODUCTION_PUBLIC_IP'; elif command -v sudo >/dev/null 2>&1 && sudo -n true; then exec sudo -n python3 - '$ECONOMY_PRODUCTION_PUBLIC_IP'; else echo ECONOMY_DEPLOY_PRIVILEGES_UNAVAILABLE >&2; exit 1; fi" \
            < scripts/configure-economy-ip-fallback-nginx.py

      - name: Verify production host before publishing entry
        id: verify_remote
        shell: bash
        env:
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          set -uo pipefail
          set +e
          ssh -i ~/.ssh/deploy_key -p "$SERVER_PORT" "$SERVER_USER@$ECONOMY_PRODUCTION_PUBLIC_IP" \
            "bash -s -- remote '$ECONOMY_PRODUCTION_PUBLIC_IP'" \
            < scripts/verify-production-deployment.sh 2>&1 | tee /tmp/economy-pre-publish-verify.log
          verification_status=${PIPESTATUS[0]}
          set -e
          exit "$verification_status"

      - name: Publish website entry and prune expired assets
        id: publish_entry
        env:
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          exec > >(tee /tmp/economy-publish-entry.log) 2>&1
          set -euo pipefail
          rsync -az -e "ssh -i ~/.ssh/deploy_key -p $SERVER_PORT" \
            dist/index.html "$SERVER_USER@$ECONOMY_PRODUCTION_PUBLIC_IP:/var/www/game/economy/index.html.next"
          ssh -i ~/.ssh/deploy_key -p "$SERVER_PORT" "$SERVER_USER@$ECONOMY_PRODUCTION_PUBLIC_IP" 'bash -s' <<'REMOTE'
          set -euo pipefail
          test -s /var/www/game/economy/index.html.next
          mv -f /var/www/game/economy/index.html.next /var/www/game/economy/index.html
          find /var/www/game/economy/assets -type f -mtime +400 -delete
          find /var/www/game/economy/assets -mindepth 1 -type d -empty -delete
          REMOTE

      - name: Verify public website, account routes, and game API
        id: verify_public
        shell: bash
        run: |
          set -uo pipefail
          set +e
          bash scripts/verify-production-deployment.sh public "$ECONOMY_PRODUCTION_PUBLIC_IP" \
            2>&1 | tee /tmp/economy-post-publish-verify.log
          verification_status=${PIPESTATUS[0]}
          set -e
          exit "$verification_status"

      - name: Collect failed step log
        if: failure()
        shell: bash
        env:
          INSTALL_DEPENDENCIES_OUTCOME: ${{ steps.install_dependencies.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          INSTALL_CHROMIUM_OUTCOME: ${{ steps.install_chromium.outcome }}
          BROWSER_TEST_OUTCOME: ${{ steps.browser_test.outcome }}
          ENSURE_RSYNC_OUTCOME: ${{ steps.ensure_rsync.outcome }}
          CONFIGURE_SSH_OUTCOME: ${{ steps.configure_ssh.outcome }}
          BACKUP_DATABASE_OUTCOME: ${{ steps.backup_database.outcome }}
          PREPARE_REMOTE_OUTCOME: ${{ steps.prepare_remote.outcome }}
          PREPARE_RUNTIME_OUTCOME: ${{ steps.prepare_runtime.outcome }}
          UPLOAD_ASSETS_OUTCOME: ${{ steps.upload_assets.outcome }}
          INSTALL_SERVICE_OUTCOME: ${{ steps.install_service.outcome }}
          CONFIGURE_NGINX_OUTCOME: ${{ steps.configure_nginx.outcome }}
          VERIFY_REMOTE_OUTCOME: ${{ steps.verify_remote.outcome }}
          PUBLISH_ENTRY_OUTCOME: ${{ steps.publish_entry.outcome }}
          VERIFY_PUBLIC_OUTCOME: ${{ steps.verify_public.outcome }}
        run: |
          set -euo pipefail
          failure_dir="$RUNNER_TEMP/economy-failure-log"
          summary_file=/tmp/economy-failure-summary.txt
          rm -rf "$failure_dir"
          mkdir -p "$failure_dir"
          : > "$summary_file"

          collect_failed_log() {
            local outcome="$1"
            local source="$2"
            local target="$3"
            if [ "$outcome" != "failure" ]; then
              return
            fi
            if [ -s "$source" ]; then
              cp "$source" "$failure_dir/$target"
            else
              printf '步骤失败，但未生成可读取的命令日志：%s\n' "$target" > "$failure_dir/$target"
            fi
          }

          collect_failed_log "$INSTALL_DEPENDENCIES_OUTCOME" /tmp/economy-install-dependencies.log install-dependencies.log
          collect_failed_log "$BUILD_OUTCOME" /tmp/economy-build.log build.log
          collect_failed_log "$INSTALL_CHROMIUM_OUTCOME" /tmp/economy-install-chromium.log install-chromium.log
          collect_failed_log "$BROWSER_TEST_OUTCOME" /tmp/economy-browser-test.log browser-test.log
          collect_failed_log "$ENSURE_RSYNC_OUTCOME" /tmp/economy-rsync.log rsync.log
          collect_failed_log "$CONFIGURE_SSH_OUTCOME" /tmp/economy-ssh.log configure-ssh.log
          collect_failed_log "$BACKUP_DATABASE_OUTCOME" /tmp/economy-database-backup.log database-backup.log
          collect_failed_log "$PREPARE_REMOTE_OUTCOME" /tmp/economy-deploy.log prepare-remote.log
          collect_failed_log "$PREPARE_RUNTIME_OUTCOME" /tmp/economy-runtime.log prepare-runtime.log
          collect_failed_log "$UPLOAD_ASSETS_OUTCOME" /tmp/economy-upload.log upload-assets.log
          collect_failed_log "$INSTALL_SERVICE_OUTCOME" /tmp/economy-api-install.log install-service.log
          collect_failed_log "$CONFIGURE_NGINX_OUTCOME" /tmp/economy-proxy-configure.log configure-nginx.log
          collect_failed_log "$VERIFY_REMOTE_OUTCOME" /tmp/economy-pre-publish-verify.log pre-publish-verification.log
          collect_failed_log "$PUBLISH_ENTRY_OUTCOME" /tmp/economy-publish-entry.log publish-entry.log
          collect_failed_log "$VERIFY_PUBLIC_OUTCOME" /tmp/economy-post-publish-verify.log post-publish-verification.log

          if ! compgen -G "$failure_dir/*" > /dev/null; then
            printf '失败发生在非 shell Action 步骤；完整输出保留在 GitHub Actions job log。\n' > "$failure_dir/action-step-failure.txt"
          fi

          for failed_log in "$failure_dir"/*; do
            [ -f "$failed_log" ] || continue
            detail="$(grep -Eai 'ECONOMY_DEPLOY_VERIFY_FAILED|ECONOMY_[A-Z0-9_]+_(FAILED|INVALID|UNAVAILABLE)|AUTH_PROXY_UNAVAILABLE|permission denied|command not found|connection refused|failed|error' "$failed_log" | tail -n 1 || true)"
            if [ -z "$detail" ]; then
              detail="$(awk 'NF { line=$0 } END { print line }' "$failed_log")"
            fi
            if [ -n "$detail" ]; then
              printf '%s\n' "$detail" > "$summary_file"
              break
            fi
          done
          if [ ! -s "$summary_file" ]; then
            printf 'Economy deployment failed; see failure artifact\n' > "$summary_file"
          fi
          cp "$summary_file" "$failure_dir/failure-summary.txt"

      - name: Upload failed step log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: economy-deploy-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/economy-failure-log
          if-no-files-found: warn
          retention-days: 3
          compression-level: 9

      - name: Report deployment status
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          if [ "$JOB_STATUS" = "success" ]; then
            STATE="success"
            DESCRIPTION="Economy website and authoritative game API deployed"
          else
            STATE="failure"
            DESCRIPTION="Economy deployment failed"
            DETAIL="$(cat /tmp/economy-failure-summary.txt 2>/dev/null | tr '\n' ' ' | sed 's/[[:space:]]\+/ /g' | cut -c1-125 || true)"
            if [ -n "$DETAIL" ]; then DESCRIPTION="$DETAIL"; fi
          fi

          TARGET_URL="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          python3 - "$STATE" "$DESCRIPTION" "$TARGET_URL" <<'PYTHON_SCRIPT' > /tmp/deploy-status.json
          import json
          import sys
          print(json.dumps({
              "state": sys.argv[1],
              "description": sys.argv[2],
              "context": "deploy/economy",
              "target_url": sys.argv[3],
          }))
          PYTHON_SCRIPT

          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data-binary @/tmp/deploy-status.json \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" > /dev/null
