name: Temporary Fix Mobile Map Verifier

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'fix/mobile-map-interactions-20260821'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Correct verifier
        run: |
          python3 scripts/_temporary_fix_mobile_map_verifier.py
          node --check scripts/verify-provincial-economy.mjs
          git diff --check

      - name: Remove temporary correction machinery
        run: |
          git rm -f .github/workflows/_temporary-fix-mobile-map-verifier.yml scripts/_temporary_fix_mobile_map_verifier.py
          git diff --check

      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "修正移动地图防回退脚本语法"
          git push origin HEAD:fix/mobile-map-interactions-20260821
