name: Apply slower demand price rises

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/slow-demand-price-rises'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: agent/slow-demand-price-rises
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.4.0
          cache: npm

      - name: Apply authoritative patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              file = Path(path)
              content = file.read_text()
              count = content.count(old)
              if count != 1:
                  raise RuntimeError(f'{path}: expected one match, found {count}: {old[:80]!r}')
              file.write_text(content.replace(old, new, 1))

          replace_once('server/src/market-demand/catalog.js',
              'export const DIRECT_DEMAND_UNFILLED_PRICE_STEP = 1.03;\nexport const DIRECT_DEMAND_UNFILLED_REFERENCE_GAP_RATE = 0.25;\nexport const DIRECT_DEMAND_UNFILLED_REFERENCE_MAX_RATE = 0.10;\nexport const DIRECT_DEMAND_BELOW_REFERENCE_RECOVERY_RATE = 0.10;',
              'export const DIRECT_DEMAND_UNFILLED_PRICE_STEP = 1.015;\nexport const DIRECT_DEMAND_UNFILLED_REFERENCE_GAP_RATE = 0.10;\nexport const DIRECT_DEMAND_UNFILLED_REFERENCE_MAX_RATE = 0.04;\nexport const DIRECT_DEMAND_BELOW_REFERENCE_RECOVERY_RATE = 0.05;\nexport const DIRECT_DEMAND_SHORTAGE_PRICE_STEP = 1.01;')

          replace_once('server/src/market-demand.js',
              '  DIRECT_DEMAND_PRICE_RECOVERY_RATE,\n  DIRECT_DEMAND_UNFILLED_PRICE_STEP,',
              '  DIRECT_DEMAND_PRICE_RECOVERY_RATE,\n  DIRECT_DEMAND_SHORTAGE_PRICE_STEP,\n  DIRECT_DEMAND_UNFILLED_PRICE_STEP,')

          replace_once('server/src/market-demand.js',
              "    const directBase = role === 'direct'\n      ? (pressure >= 1.15 ? Math.max(directQuoteAnchor, referencePrice * shortageMultiplier) : directQuoteAnchor)\n      : referencePrice;",
              "    const shortageTarget = referencePrice * shortageMultiplier;\n    const directBase = role === 'direct'\n      ? (pressure >= 1.15\n        ? Math.min(Math.max(directQuoteAnchor, shortageTarget), directQuoteAnchor * DIRECT_DEMAND_SHORTAGE_PRICE_STEP)\n        : directQuoteAnchor)\n      : referencePrice;")

          test_path = Path('server/test/market-demand-v6.test.js')
          tests = test_path.read_text()
          tests = tests.replace('for (let cycle = 1; cycle <= 8; cycle += 1)', 'for (let cycle = 1; cycle <= 15; cycle += 1)', 1)
          tests = tests.replace('const raisedAt = now + 8 * constants.demandCycleMs;', 'const raisedAt = now + 15 * constants.demandCycleMs;', 1)
          tests = tests.replace('assert.ok(raisedAnchor >= 2.53);', 'assert.ok(raisedAnchor >= 2.50);', 1)
          tests = tests.replace('assert.equal(zeroWorld.marketDemand.groups.food.directQuoteAnchors.food, 7);', 'assert.equal(zeroWorld.marketDemand.groups.food.directQuoteAnchors.food, 6.4);', 1)
          tests = tests.replace('assert.equal(partialWorld.marketDemand.groups.food.directQuoteAnchors.food, 6.4);', 'assert.equal(partialWorld.marketDemand.groups.food.directQuoteAnchors.food, 6.2);', 1)
          marker = "test('market model 10 uses funded population wallets when no player is active', () => {"
          if tests.count(marker) != 1:
              raise RuntimeError('market-demand test insertion marker missing')
          shortage_test = """test('shortage pressure approaches the reference premium by at most one percent per cycle', () => {
  const now = 1_700_000_000_000;
  const runtime = createRuntime();
  const world = createTestWorld(now);
  runtime.initializeWorld(world, now);
  world.marketDemand.priceTransmission.products.food.referencePrice = 30;
  world.marketDemand.groups.food.directQuoteAnchors.food = 10;
  world.marketDemand.productPressure.food = 1.20;
  world.marketDemand.groups.food.nextDemandAt = now;

  runtime.processGroup(world, 'food', now);

  const cycleId = Math.floor(now / constants.demandCycleMs);
  const prices = demandOrdersFor(world, 'food', 'food', cycleId).map((order) => Number(order.price || 0));
  assert.ok(prices.length > 0);
  assert.equal(Math.max(...prices), 16);
  assert.ok(Math.max(...prices) < Math.round(30 * 1.03));
});

"""
          tests = tests.replace(marker, shortage_test + marker, 1)
          test_path.write_text(tests)

          replace_once('README.md',
              '- 直接需求为每项商品持久化未取整的双向报价锚点和连续过剩周期：零成交时按 3% 与参考价缺口恢复量中的较大值上涨，成交不足时从参考价下方温和恢复，普通达标或无直接需求时双向回归参考价；直接成交率至少 95%、直接成交延迟得分至少 85% 连续两个周期后，每周期下调 2%，允许跌穿参考价但不得低于 1。三档直接需求买价全部以该锚点为基准；派生流动性、预算、最近成交价和估值不受影响。',
              '- 直接需求为每项商品持久化未取整的双向报价锚点和连续过剩周期：零成交时按 1.5% 与参考价缺口 10%（单周期最多参考价 4%）中的较大值上涨，成交不足且低于参考价时只恢复 5% 缺口；压力达到 1.15 后也只允许每周期最多追涨 1%，不得瞬间跳到参考价 103%。普通达标、无需求、持续过剩降价、绝对下限 1、三档曲线和派生流动性规则保持不变，预算、最近成交价和估值不受影响。')

          replace_once('docs/PRODUCT_AND_GAMEPLAY_DESIGN.md',
              '新周期每项商品预算按 50%／30%／20% 拆成三档买盘，倍率固定为 100%／97%／93%。每项直接需求商品保存未取整的双向报价锚点与连续过剩周期，锚点合法范围为绝对价格 1 至基础价的 300%：上一完整周期存在直接需求且零成交时，上涨量取“上一锚点的 3%”与“参考价缺口的 25%、但最多为参考价的 10%”中的较大值；存在成交但直接成交率低于需求组目标时，锚点低于参考价则恢复 10% 缺口，高于参考价则保持；成交达到目标但尚未形成持续过剩，或当周期没有直接需求时，锚点按 30% 差额双向回归参考价。只有直接成交率至少 95%、直接成交延迟得分至少 85% 连续满足两个周期，才从第二个周期起按 98% 乘数下降，允许跌穿参考价但不得低于 1。压力达到 1.15 时，直接需求曲线基准至少为参考价的 103%；三档直接需求价格必须全部基于同一曲线基准，禁止第二、第三档继续使用参考价造成倒挂。派生流动性继续使用参考价和既有短缺保护，不读取直接需求锚点。周期预算不增加，价格变化只改变可购买数量；同价档合并，未形成整数数量的预算不结转。',
              '新周期每项商品预算按 50%／30%／20% 拆成三档买盘，倍率固定为 100%／97%／93%。每项直接需求商品保存未取整的双向报价锚点与连续过剩周期，锚点合法范围为绝对价格 1 至基础价的 300%：上一完整周期存在直接需求且零成交时，上涨量取“上一锚点的 1.5%”与“参考价缺口的 10%、但最多为参考价的 4%”中的较大值；存在成交但直接成交率低于需求组目标时，锚点低于参考价只恢复 5% 缺口，高于参考价则保持；成交达到目标但尚未形成持续过剩，或当周期没有直接需求时，锚点仍按 30% 差额双向回归参考价。只有直接成交率至少 95%、直接成交延迟得分至少 85% 连续满足两个周期，才从第二个周期起按 98% 乘数下降，允许跌穿参考价但不得低于 1。压力达到 1.15 时，参考价的 103% 只作为短缺目标，直接需求曲线基准每周期最多在当前报价锚点上追涨 1%，不得瞬间跳到短缺目标；三档直接需求价格必须全部基于同一曲线基准，禁止价格倒挂。派生流动性继续使用参考价和既有短缺保护，不读取直接需求锚点。周期预算不增加，价格变化只改变可购买数量；同价档合并，未形成整数数量的预算不结转。')

          replace_once('docs/UNIFIED_ASSET_ORDER_BOOK_DESIGN.md',
              '每项直接需求商品保存未取整的双向报价锚点与连续过剩周期：零成交上涨，成交不足时保持或从参考价下方恢复，普通达标与无直接需求时双向回归参考价；直接成交率至少 95%、直接成交延迟得分至少 85% 连续两个周期后按每周期 2% 下调，允许跌穿参考价但最低为 1、最高为基础价 300%。',
              '每项直接需求商品保存未取整的双向报价锚点与连续过剩周期：零成交按 1.5% 与参考价缺口 10%（单周期最多参考价 4%）中的较大值上涨，成交不足且低于参考价时只恢复 5% 缺口；压力短缺目标不得造成瞬时跳价，每周期最多在当前锚点上追涨 1%。普通达标与无直接需求仍双向回归参考价；直接成交率至少 95%、直接成交延迟得分至少 85% 连续两个周期后按每周期 2% 下调，允许跌穿参考价但最低为 1、最高为基础价 300%。')

          verify = Path('scripts/verify-staple-crops-demand.mjs')
          content = verify.read_text()
          replacements = {
              "'DIRECT_DEMAND_UNFILLED_PRICE_STEP = 1.03'": "'DIRECT_DEMAND_UNFILLED_PRICE_STEP = 1.015'",
              "'DIRECT_DEMAND_UNFILLED_REFERENCE_GAP_RATE = 0.25'": "'DIRECT_DEMAND_UNFILLED_REFERENCE_GAP_RATE = 0.10'",
              "'DIRECT_DEMAND_BELOW_REFERENCE_RECOVERY_RATE = 0.10'": "'DIRECT_DEMAND_BELOW_REFERENCE_RECOVERY_RATE = 0.05'",
          }
          for old, new in replacements.items():
              if content.count(old) != 1:
                  raise RuntimeError(f'verify constant missing: {old}')
              content = content.replace(old, new, 1)
          anchor = "  'DIRECT_DEMAND_BELOW_REFERENCE_RECOVERY_RATE = 0.05',\n"
          content = content.replace(anchor, anchor + "  'DIRECT_DEMAND_UNFILLED_REFERENCE_MAX_RATE = 0.04',\n  'DIRECT_DEMAND_SHORTAGE_PRICE_STEP = 1.01',\n", 1)
          test_anchor = "  'no direct demand converges toward reference and derived liquidity ignores a low direct anchor',\n"
          content = content.replace(test_anchor, test_anchor + "  'shortage pressure approaches the reference premium by at most one percent per cycle',\n", 1)
          verify.write_text(content)
          PY

      - name: Install dependencies
        run: npm ci

      - name: Run focused tests
        run: |
          node --test server/test/market-demand-v6.test.js
          node scripts/verify-staple-crops-demand.mjs

      - name: Build and test
        run: npm run build

      - name: Commit final changes
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/apply-slower-demand-price-rises.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "降低人口需求涨价速度"
          git push origin HEAD:agent/slow-demand-price-rises
