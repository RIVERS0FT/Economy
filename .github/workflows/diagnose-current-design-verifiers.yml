name: Diagnose current design verifiers

on:
  push:
    branches:
      - docs/design-authority-compression-current-20260902

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.4.0
          cache: npm
      - run: npm ci
      - name: Generate verifier prerequisites
        run: |
          npm run generate:artwork
          npm run generate:local-preview
      - name: Run every verifier that reads a DESIGN
        run: |
          set +e
          failed=0
          : > /tmp/design-verifier-failures.txt
          while IFS= read -r file; do
            output_file="/tmp/$(basename "$file").log"
            node --experimental-strip-types "$file" >"$output_file" 2>&1
            status=$?
            if [ "$status" -ne 0 ]; then
              failed=1
              {
                echo "===== $file (exit $status) ====="
                tail -n 24 "$output_file"
                echo
              } >> /tmp/design-verifier-failures.txt
            fi
          done < <(grep -lE "docs/[A-Z0-9_]+_DESIGN\.md|docs/UI_DESIGN_SYSTEM\.md" scripts/verify-*.mjs | sort)
          if [ -s /tmp/design-verifier-failures.txt ]; then
            cat /tmp/design-verifier-failures.txt
          else
            echo 'ALL_DESIGN_VERIFIERS_PASSED'
          fi
          exit "$failed"
