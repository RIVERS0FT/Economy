name: Patch facility summary three rows

on:
  push:
    branches:
      - fix/facility-summary-three-rows

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply facility summary layout update
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path_name, old, new, label):
              path = Path(path_name)
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, got {count}')
              path.write_text(text.replace(old, new, 1))

          replace_once(
              'src/components/facilities/FacilityRecipeProfitAnalysis.tsx',
              '  const { profitPerMinute, staffingPercent, description, fallback, detail } = presentation;\n',
              '  const { profitPerMinute, fallback, detail } = presentation;\n',
              'profit presentation destructure',
          )
          replace_once(
              'src/components/facilities/FacilityRecipeProfitAnalysis.tsx',
              '        <small>{description} · 最近真实成交价 · 满员率 {staffingPercent}%</small>\n',
              '',
              'profit visible description',
          )

          replace_once(
              'src/styles/facility-recipe-profit-analysis.css',
              ".facility-average-profit__copy {\n  min-width: 0;\n  display: grid;\n  gap: 0.12rem;\n}\n",
              ".facility-average-profit__copy {\n  min-width: 0;\n}\n",
              'profit copy layout',
          )
          replace_once(
              'src/styles/facility-recipe-profit-analysis.css',
              "\n.facility-average-profit__copy small {\n  overflow: hidden;\n  color: var(--color-text-muted);\n  font-size: var(--font-size-xs);\n  line-height: var(--line-height-tight);\n  text-overflow: ellipsis;\n  white-space: nowrap;\n}\n",
              "\n",
              'profit small style',
          )
          replace_once(
              'src/styles/facility-recipe-profit-analysis.css',
              "\n  .facility-average-profit__copy small {\n    font-size: 0.66rem;\n  }\n",
              "\n",
              'profit small mobile style',
          )

          replace_once(
              'src/styles/facility-group-card-grid.css',
              ".facility-information-details {\n  min-width: 0;\n  display: grid;\n  gap: var(--space-2);\n}\n",
              ".facility-information-details {\n  min-width: 0;\n  display: grid;\n  grid-template-columns: minmax(0, 1fr);\n  grid-template-rows: auto auto auto;\n  align-items: start;\n  gap: var(--space-2);\n}\n",
              'information details grid',
          )
          replace_once(
              'src/styles/facility-group-card-grid.css',
              ".facility-count-summary {\n  width: 100%;\n  min-width: 0;\n",
              ".facility-count-summary {\n  grid-column: 1;\n  grid-row: 1;\n  width: 100%;\n  min-width: 0;\n",
              'count summary row',
          )
          replace_once(
              'src/styles/facility-group-card-grid.css',
              ".facility-information-details > .facility-average-profit {\n  margin: 0;\n  border-top: 1px solid var(--color-divider);\n  padding-top: var(--space-2);\n}\n",
              ".facility-information-details > .facility-average-profit {\n  grid-column: 1;\n  grid-row: 2;\n  width: 100%;\n  margin: 0;\n  border-top: 1px solid var(--color-divider);\n  padding-top: var(--space-2);\n}\n\n.facility-information-details > .facility-staffing-summary {\n  grid-column: 1;\n  grid-row: 3;\n  width: 100%;\n}\n",
              'profit and staffing rows',
          )

          replace_once(
              'tests/browser/production-methods.spec.ts',
              "    await expect(informationMain).toContainText('满员率');\n",
              "    await expect(informationMain).toContainText('满员率');\n    await expect(informationMain.locator('.facility-average-profit__copy small')).toHaveCount(0);\n    const summaryRows = await informationMain.locator('.facility-information-details').evaluate((element) => {\n      const count = element.querySelector<HTMLElement>('.facility-count-summary');\n      const profit = element.querySelector<HTMLElement>('.facility-average-profit');\n      const staffing = element.querySelector<HTMLElement>('.facility-staffing-summary');\n      if (!count || !profit || !staffing) throw new Error('facility summary rows are incomplete');\n      const countBox = count.getBoundingClientRect();\n      const profitBox = profit.getBoundingClientRect();\n      const staffingBox = staffing.getBoundingClientRect();\n      return {\n        count: { top: countBox.top, bottom: countBox.bottom },\n        profit: { top: profitBox.top, bottom: profitBox.bottom },\n        staffing: { top: staffingBox.top, bottom: staffingBox.bottom },\n      };\n    });\n    expect(summaryRows.profit.top).toBeGreaterThanOrEqual(summaryRows.count.bottom);\n    expect(summaryRows.staffing.top).toBeGreaterThanOrEqual(summaryRows.profit.bottom);\n",
              'desktop summary row geometry',
          )
          replace_once(
              'tests/browser/production-methods.spec.ts',
              "      await expect(informationMain.locator('.facility-staffing-summary')).toBeVisible();\n      await expect(recipeSelect).toBeVisible();\n",
              "      await expect(informationMain.locator('.facility-staffing-summary')).toBeVisible();\n      await expect(informationMain.locator('.facility-average-profit__copy small')).toHaveCount(0);\n      const mobileSummaryRows = await informationMain.locator('.facility-information-details').evaluate((element) => {\n        const count = element.querySelector<HTMLElement>('.facility-count-summary');\n        const profit = element.querySelector<HTMLElement>('.facility-average-profit');\n        const staffing = element.querySelector<HTMLElement>('.facility-staffing-summary');\n        if (!count || !profit || !staffing) throw new Error('mobile facility summary rows are incomplete');\n        const countBox = count.getBoundingClientRect();\n        const profitBox = profit.getBoundingClientRect();\n        const staffingBox = staffing.getBoundingClientRect();\n        return { countBottom: countBox.bottom, profitTop: profitBox.top, profitBottom: profitBox.bottom, staffingTop: staffingBox.top };\n      });\n      expect(mobileSummaryRows.profitTop).toBeGreaterThanOrEqual(mobileSummaryRows.countBottom);\n      expect(mobileSummaryRows.staffingTop).toBeGreaterThanOrEqual(mobileSummaryRows.profitBottom);\n      await expect(recipeSelect).toBeVisible();\n",
              'mobile summary row geometry',
          )

          replace_once(
              'scripts/verify-production-settlement-layout.mjs',
              "const profitCss = read('src/styles/facility-recipe-profit-analysis.css');\n",
              "const profitCss = read('src/styles/facility-recipe-profit-analysis.css');\nconst profitAnalysis = read('src/components/facilities/FacilityRecipeProfitAnalysis.tsx');\n",
              'profit verifier source',
          )
          replace_once(
              'scripts/verify-production-settlement-layout.mjs',
              "  '.facility-information-details > .facility-average-profit',\n  '.facility-market-link-row .facility-market-link {',\n",
              "  '.facility-information-details > .facility-average-profit',\n  '.facility-information-details > .facility-staffing-summary',\n  'grid-template-rows: auto auto auto;',\n  'grid-row: 1;',\n  'grid-row: 2;',\n  'grid-row: 3;',\n  '.facility-market-link-row .facility-market-link {',\n",
              'summary row verifier styles',
          )
          marker = "assert.equal(detail.includes('<FacilityRecipeProfitAnalysis'), true, '工厂信息必须渲染单厂利润');\n"
          insertion = marker + "assert.equal(profitAnalysis.includes('<small>'), false, '单厂平均利润行不得显示副说明');\nassert.equal(profitAnalysis.includes('最近真实成交价 · 满员率'), false, '单厂平均利润行不得恢复成交价与满员率副说明');\n"
          replace_once(
              'scripts/verify-production-settlement-layout.mjs',
              marker,
              insertion,
              'profit description verifier',
          )
          replace_once(
              'scripts/verify-production-settlement-layout.mjs',
              "  \"getByRole('button', { name: /^查看机械本地商品详情/ })\",\n",
              "  \"getByRole('button', { name: /^查看机械本地商品详情/ })\",\n  \"locator('.facility-average-profit__copy small')).toHaveCount(0)\",\n  'summaryRows.profit.top',\n  'summaryRows.staffing.top',\n  'mobileSummaryRows.profitTop',\n  'mobileSummaryRows.staffingTop',\n",
              'browser summary verifier strings',
          )

          replace_once(
              'scripts/verify-unified-factory-recipes-grid.mjs',
              "  '.facility-information-details > .facility-average-profit',\n]) assert.equal(baseCss.includes(text), true, `工厂卡与详情基础样式缺少: ${text}`);\n",
              "  '.facility-information-details > .facility-average-profit',\n  '.facility-information-details > .facility-staffing-summary',\n  'grid-template-rows: auto auto auto;',\n]) assert.equal(baseCss.includes(text), true, `工厂卡与详情基础样式缺少: ${text}`);\n",
              'unified summary row verifier',
          )

          replace_once(
              'scripts/verify-facility-groups.mjs',
              "  'src/components/facilities/FacilityProductionFormula.tsx',\n",
              "  'src/components/facilities/FacilityProductionFormula.tsx',\n  'src/components/facilities/FacilityRecipeProfitAnalysis.tsx',\n",
              'facility profit source required file',
          )
          replace_once(
              'scripts/verify-facility-groups.mjs',
              "  '.facility-count-summary',\n  'align-self: start;',\n  'grid-auto-rows: auto;',\n  'grid-template-rows: auto;',\n",
              "  '.facility-count-summary',\n  '.facility-information-details > .facility-staffing-summary',\n  'align-self: start;',\n  'grid-auto-rows: auto;',\n  'grid-template-rows: auto;',\n  'grid-template-rows: auto auto auto;',\n",
              'facility summary rows required',
          )
          marker = "forbidText('src/pages/production/ProductionFacilityDetail.tsx', '<strong>生产设置</strong>');\n"
          insertion = marker + "forbidText('src/components/facilities/FacilityRecipeProfitAnalysis.tsx', '<small>');\nforbidText('src/components/facilities/FacilityRecipeProfitAnalysis.tsx', '最近真实成交价 · 满员率');\n"
          replace_once(
              'scripts/verify-facility-groups.mjs',
              marker,
              insertion,
              'facility profit description forbidden',
          )

          industry = 'docs/INDUSTRY_AND_PRODUCTION_DESIGN.md'
          replace_once(
              industry,
              '- 当前工厂详情的可见顺序固定为“移动端把手（桌面端无）→ 工厂信息（插画右侧含运行／冻结／抵押、单厂平均利润与满员率）→ 生产配置 → 生产结算 → 经营诊断 → 市场入口”。桌面端不得渲染把手 DOM；移动 Bottom Sheet 的固定头部只保留拖动把手，工厂名称、状态和开关必须进入正文中的共享工厂信息区。 Bottom Sheet 必须在首次可见绘制前完成页面滚动锁定、稳定视觉视口高度快照和 `focus({ preventScroll: true })`；移动 Bottom Sheet 打开期间只允许单向上移，打开后不得因动态视口变化产生纵向抖动。移动触控下工厂选择卡不得使用缩放按压反馈。',
              '- 当前工厂详情的可见顺序固定为“移动端把手（桌面端无）→ 工厂信息（插画右侧三行：运行／冻结／抵押数量摘要 → 单厂平均利润 → 满员率）→ 生产配置 → 生产结算 → 经营诊断 → 市场入口”。桌面端不得渲染把手 DOM；移动 Bottom Sheet 的固定头部只保留拖动把手，工厂名称、状态和开关必须进入正文中的共享工厂信息区。 Bottom Sheet 必须在首次可见绘制前完成页面滚动锁定、稳定视觉视口高度快照和 `focus({ preventScroll: true })`；移动 Bottom Sheet 打开期间只允许单向上移，打开后不得因动态视口变化产生纵向抖动。移动触控下工厂选择卡不得使用缩放按压反馈。',
              'industry detail order',
          )
          replace_once(
              industry,
              '- 工厂信息是唯一身份与经营摘要区，包含工厂名称、`4:5` 纵向场景插画、总数量、唯一完整状态胶囊、运行开关，以及插画右侧的运行中／冻结中／抵押中三项数量明细、唯一一行单厂平均利润／分钟与满员率状态带。不得再把标题状态固定在移动头部、把插画拆到另一列、把这些经营指标移回插画下方或把利润留在生产结算中。',
              '- 工厂信息是唯一身份与经营摘要区，包含工厂名称、`4:5` 纵向场景插画、总数量、唯一完整状态胶囊、运行开关，以及插画右侧固定三行经营摘要：第一行为运行中／冻结中／抵押中三项数量明细，第二行为单厂平均利润／分钟，第三行为满员率状态带。利润行只显示标题和值，不显示“当前配方预计”、最近真实成交价、满员率或其他副说明。不得再把标题状态固定在移动头部、把插画拆到另一列、把这些经营指标移回插画下方或把利润留在生产结算中。',
              'industry summary rows',
          )
          replace_once(
              industry,
              '- 工厂信息内部使用“纵向插画 + 右侧主信息”的两列布局；三项数量明细、利润与满员率都位于右侧主信息内并按 DOM 顺序排列。桌面与移动共用同一个 `FacilityClusterInformation`，不得通过 CSS `order` 建立与 DOM 不同的视觉顺序。',
              '- 工厂信息内部使用“纵向插画 + 右侧主信息”的两列布局；右侧主信息固定为数量摘要、利润、满员率三行纵向排列，三行不得并排或交换顺序。桌面与移动共用同一个 `FacilityClusterInformation`，不得通过 CSS `order` 建立与 DOM 不同的视觉顺序。',
              'industry summary layout',
          )
          replace_once(
              industry,
              '- 满员率位于工厂信息的插画右侧主信息内，紧跟数量摘要与单厂平均利润；满员率状态带只显示当前百分比、恢复／下降方向和进度条。物理数量、完成时满员率与整数等效产能只进入完整无障碍描述，不得恢复可见长句、独立卡片背景或移回插画下方。',
              '- 满员率固定为工厂信息插画右侧主信息的第三行，紧跟单厂平均利润；满员率状态带只显示当前百分比、恢复／下降方向和进度条。物理数量、完成时满员率与整数等效产能只进入完整无障碍描述，不得恢复可见长句、独立卡片背景、与利润并排或移回插画下方。',
              'industry staffing row',
          )

          ui = 'docs/UI_DESIGN_SYSTEM.md'
          replace_once(
              ui,
              '- 当前工厂详情使用唯一 `FacilityClusterInformation` 合并名称、`4:5` 纵向场景插画、总数量、唯一状态胶囊与 `SwitchControl`；运行中／冻结中／抵押中数量明细、单厂平均利润与满员率全部位于插画右侧主信息区，移动固定头部不得继续承载名称、状态或开关。',
              '- 当前工厂详情使用唯一 `FacilityClusterInformation` 合并名称、`4:5` 纵向场景插画、总数量、唯一状态胶囊与 `SwitchControl`；插画右侧主信息固定为三行：运行中／冻结中／抵押中数量摘要、单厂平均利润、满员率。移动固定头部不得继续承载名称、状态或开关。',
              'ui summary rows',
          )
          replace_once(
              ui,
              '- 数量摘要位于工厂信息区内部，固定为“运行中／冻结中／抵押中”三列；单厂平均利润与满员率紧随数量摘要并同样位于插画右侧；总数量只在主信息中显示一次，不得重新拼入标题。',
              '- 数量摘要位于工厂信息区内部第一行，固定为“运行中／冻结中／抵押中”三列；单厂平均利润固定第二行且只显示标题和值，不显示“当前配方预计”、最近真实成交价、满员率或其他副说明；满员率固定第三行并显示百分比、方向和进度条。三行都位于插画右侧且不得并排；总数量只在主信息中显示一次，不得重新拼入标题。',
              'ui summary content',
          )
          replace_once(
              ui,
              '- 当前工厂详情顺序固定为“移动把手（桌面无）→ 工厂信息（插画右侧含运行／冻结／抵押、单厂平均利润与满员率）→ 生产配置 → 生产结算 → 经营诊断 → 市场入口”。工厂信息内部使用纵向插画与主信息两列；其余区块必须按 DOM 自上而下排列。满员率使用无独立圆角和背景的状态带，只显示百分比、方向和进度条。',
              '- 当前工厂详情顺序固定为“移动把手（桌面无）→ 工厂信息（插画右侧三行：数量摘要 → 单厂平均利润 → 满员率）→ 生产配置 → 生产结算 → 经营诊断 → 市场入口”。工厂信息内部使用纵向插画与主信息两列；右侧三行和其余区块都必须按 DOM 自上而下排列。满员率使用无独立圆角和背景的状态带，只显示百分比、方向和进度条。',
              'ui detail order',
          )
          replace_once(
              ui,
              '- 工厂详情参考经营模拟游戏的建筑信息层级组织为“工厂信息 → 满员率 → 生产设置 → 投入产出与进度”。工厂信息统一使用 `4:5` 纵向场景插画并包含经营结果；满员率不得显示周期范围、锁定值或等效产能说明；生产设置不得重复周期、产出和成本摘要；生产结算标题不得显示右侧长描述。',
              '- 工厂详情按“工厂信息（插画右侧三行：数量摘要 → 单厂平均利润 → 满员率）→ 无标题生产配置 → 生产结算 → 经营诊断 → 市场入口”组织。工厂信息统一使用 `4:5` 纵向场景插画并包含经营结果；利润行不得显示副说明；满员率不得显示周期范围、锁定值或等效产能说明；生产配置不得重复周期、产出和成本摘要；生产结算标题不得显示右侧长描述。',
              'ui stale hierarchy',
          )
          replace_once(
              ui,
              '当前工厂详情正文按“工厂信息 → 满员率 → 生产设置 → 生产结算 → 经营诊断”组织；单厂平均利润属于工厂信息，生产结算只包含公式、操作数据带和进度，经营诊断固定紧跟生产结算。',
              '当前工厂详情正文按“工厂信息（右侧三行数量摘要 → 单厂平均利润 → 满员率）→ 无标题生产配置 → 生产结算 → 经营诊断 → 市场入口”组织；单厂平均利润属于工厂信息且只显示标题和值，生产结算只包含公式、操作数据带和进度，经营诊断固定紧跟生产结算。',
              'ui stale body order',
          )

          replace_once(
              'scripts/verify-facility-groups.mjs',
              "  '玩家可见“生产产物”与“作业制度”必须合并为同一个无标题生产配置区',\n",
              "  '右侧主信息固定为数量摘要、利润、满员率三行纵向排列',\n  '利润行只显示标题和值',\n  '玩家可见“生产产物”与“作业制度”必须合并为同一个无标题生产配置区',\n",
              'industry authority verifier rows',
          )
          replace_once(
              'scripts/verify-facility-groups.mjs',
              "  '玩家可见的“生产产物”与“作业制度”固定使用同一个无标题生产配置区',\n",
              "  '插画右侧主信息固定为三行',\n  '单厂平均利润固定第二行且只显示标题和值',\n  '玩家可见的“生产产物”与“作业制度”固定使用同一个无标题生产配置区',\n",
              'ui authority verifier rows',
          )

          PY
          node scripts/verify-production-settlement-layout.mjs
          node scripts/verify-unified-factory-recipes-grid.mjs
          node scripts/verify-facility-groups.mjs
          git diff --check
      - name: Commit update
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/components/facilities/FacilityRecipeProfitAnalysis.tsx \
            src/styles/facility-recipe-profit-analysis.css \
            src/styles/facility-group-card-grid.css \
            tests/browser/production-methods.spec.ts \
            scripts/verify-production-settlement-layout.mjs \
            scripts/verify-unified-factory-recipes-grid.mjs \
            scripts/verify-facility-groups.mjs \
            docs/INDUSTRY_AND_PRODUCTION_DESIGN.md \
            docs/UI_DESIGN_SYSTEM.md
          git commit -m "调整工厂摘要为三行布局"
          git push origin HEAD:fix/facility-summary-three-rows
