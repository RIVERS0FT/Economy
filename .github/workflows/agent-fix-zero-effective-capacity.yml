name: Fix zero effective factory capacity

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/factory-staffing-rate
          fetch-depth: 0

      - name: Apply exact server fix and regression test
        run: |
          python3 - <<'PY'
          from pathlib import Path

          server = Path('server/src/facility-groups.js')
          text = server.read_text()
          old = '    Math.max(1, capacity.effectiveCount),\n'
          new = '    capacity.effectiveCount,\n'
          if text.count(old) != 1:
              raise SystemExit(f'zero-capacity server replacement expected one match, found {text.count(old)}')
          server.write_text(text.replace(old, new, 1))

          tests = Path('server/test/facility-groups.test.js')
          text = tests.read_text().rstrip()
          addition = r'''

test('zero effective capacity can run without funds until a payable batch is due', () => {
  const world = createWorld(now);
  const player = ensurePlayer(world, alice, now);
  player.credits = 0;
  player.facilityGroups = [group('farm', 1, {
    enabled: true,
    status: 'error',
    statusReason: 'insufficient_funds',
    staffingRateBps: 0,
    staffingUpdatedAt: now,
    staffingBatchCarryBps: 0,
  })];
  migrateFacilityGroupWorld(world, now);

  processFacilityGroupWorld(world, now + 1);
  assert.equal(player.facilityGroups[0].status, 'running');
  assert.equal(player.facilityGroups[0].cycleStaffingRateBps, 0);

  processFacilityGroupWorld(world, now + 120_001);
  assert.equal(player.facilityGroups[0].status, 'running');
  assert.equal(player.credits, 0);
  assert.equal(player.inventories.wheat.available, 0);

  processFacilityGroupWorld(world, now + 600_001);
  assert.equal(player.facilityGroups[0].status, 'error');
  assert.equal(player.facilityGroups[0].statusReason, 'insufficient_funds');
  assert.equal(player.credits, 0);
  assert.equal(player.inventories.wheat.available, 0);
});
'''
          tests.write_text(text + addition)
          PY
          git diff --check

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.4.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and test
        run: npm run build

      - name: Commit verified source fix
        run: |
          git config user.name 'OpenAI Agent'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/src/facility-groups.js server/test/facility-groups.test.js
          git diff --cached --check
          git commit -m '允许零等效产能周期正常运行'
          git pull --rebase origin agent/factory-staffing-rate
          git push origin HEAD:agent/factory-staffing-rate

# Trigger after workflow creation.
