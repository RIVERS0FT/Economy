name: Finalize state economic baselines v6

on:
  push:
    branches:
      - feat/state-economic-baselines
    paths:
      - .github/workflows/finalize-state-economic-baselines-v6.yml

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/state-economic-baselines
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.4.0
          cache: npm

      - name: Apply final implementation and compatibility fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/finalize-state-economic-baselines-v5.yml').read_text(encoding='utf-8')
          start_marker = "      - name: Apply final implementation\n        shell: bash\n        run: |\n"
          end_marker = "\n      - name: Install dependencies\n"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          Path('/tmp/finalize-v5.sh').write_text(textwrap.dedent(workflow[start:end]), encoding='utf-8')
          PY
          bash /tmp/finalize-v5.sh

          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              target = Path(path)
              text = target.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"replacement mismatch {path}: expected 1, found {count} for {old[:120]!r}")
              target.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'server/src/market-demand/allocation.js',
              "import { allocateMoneyBudget, clamp, floorMoney, normalizeShares, round4, roundMoney, smoothShares } from './math.js';",
              "import { allocateMoneyBudget, clamp, floorMoney, normalizeShares, round4, roundMoney, smoothShares } from './math.js';\nimport { DEFAULT_PROVINCE_ID } from '../provinces.js';",
          )
          replace_once(
              'server/src/market-demand/allocation.js',
              "    const recipeStateKey = `${provinceId || 'global'}:${outputProductId}`;\n    const previous = state.recipeShares[recipeStateKey] || target;\n    const smoothed = smoothShares(target, previous, minima);\n    state.recipeShares[recipeStateKey] = smoothed;\n    return smoothed;",
              "    const recipeStateKey = `${provinceId || 'global'}:${outputProductId}`;\n    const previous = state.recipeShares[recipeStateKey] || target;\n    const smoothed = smoothShares(target, previous, minima);\n    state.recipeShares[recipeStateKey] = smoothed;\n    if (!state.recipeShares[outputProductId] || provinceId === DEFAULT_PROVINCE_ID) {\n      state.recipeShares[outputProductId] = smoothed;\n    }\n    return smoothed;",
          )

          replace_once(
              'server/src/market-demand.js',
              "import { populationDemandProvinceWeights } from './state-economic-baselines.js';",
              "import { populationDemandProvinceWeights } from './state-economic-baselines.js';\nimport { DEFAULT_PROVINCE_ID } from './provinces.js';",
          )
          replace_once(
              'server/src/market-demand.js',
              "    const classAllocationByModel = {};\n    const derivedRelations = [];",
              "    const classAllocationByModel = {};\n    const classAllocationByProvince = {};\n    const derivedRelations = [];",
          )
          replace_once(
              'server/src/market-demand.js',
              "      classAllocationByModel[modelId] = {};\n\n      for (const province of provinceWeights) {",
              "      for (const province of provinceWeights) {",
          )
          replace_once(
              'server/src/market-demand.js',
              "        classAllocationByModel[modelId][provinceId] = direct.classAllocation;\n        derivedRelations.push(...derived.relationDetails.map((relation) => ({",
              "        classAllocationByProvince[provinceId] ||= {};\n        classAllocationByProvince[provinceId][modelId] = direct.classAllocation;\n        if (!classAllocationByModel[modelId] || provinceId === DEFAULT_PROVINCE_ID) {\n          classAllocationByModel[modelId] = direct.classAllocation;\n        }\n        derivedRelations.push(...derived.relationDetails.map((relation) => ({",
          )
          replace_once(
              'server/src/market-demand.js',
              "    state.lastClassAllocation = classAllocationByModel;\n    state.lastProvinceBudgets = lastProvinceBudgets;",
              "    state.lastClassAllocation = classAllocationByModel;\n    state.lastClassAllocationByProvince = classAllocationByProvince;\n    state.lastProvinceBudgets = lastProvinceBudgets;",
          )

          replace_once(
              'server/src/market-demand/state.js',
              "      lastProvinceBudgets: {},\n      populationAllocationState: {},\n      lastCommitted: 0,",
              "      lastProvinceBudgets: {},\n      populationAllocationState: {},\n      lastClassAllocationByProvince: {},\n      lastCommitted: 0,",
          )
          replace_once(
              'server/src/market-demand/state.js',
              "      state.populationAllocationState = state.populationAllocationState && typeof state.populationAllocationState === 'object' ? state.populationAllocationState : {};\n      state.lastRetainedOrderValue",
              "      state.populationAllocationState = state.populationAllocationState && typeof state.populationAllocationState === 'object' ? state.populationAllocationState : {};\n      state.lastClassAllocationByProvince = state.lastClassAllocationByProvince && typeof state.lastClassAllocationByProvince === 'object' ? state.lastClassAllocationByProvince : {};\n      state.lastRetainedOrderValue",
          )
          replace_once(
              'server/src/market-demand/state.js',
              "        state.lastProvinceBudgets = {};\n        state.populationAllocationState = {};\n        state.directQuoteAnchors",
              "        state.lastProvinceBudgets = {};\n        state.populationAllocationState = {};\n        state.lastClassAllocationByProvince = {};\n        state.directQuoteAnchors",
          )

          for target in Path('server/test').glob('*.test.js'):
              text = target.read_text(encoding='utf-8')
              updated = text.replace(
                  'assert.equal(world.marketDemand.modelVersion, 19);',
                  'assert.equal(world.marketDemand.modelVersion, 20);',
              )
              updated = updated.replace(
                  'assert.equal(MARKET_DEMAND_MODEL_VERSION, 19);',
                  'assert.equal(MARKET_DEMAND_MODEL_VERSION, 20);',
              )
              updated = updated.replace('current model 19', 'current model 20')
              updated = updated.replace('market demand model 19 gives every product direct terminal demand', 'market demand model 20 gives every product direct terminal demand')
              updated = updated.replace('市场需求模型 19 在固定耐用品预算内保留工具需求', '市场需求模型 20 在固定耐用品预算内保留工具需求')
              if updated != text:
                  target.write_text(updated, encoding='utf-8')

          for path in ['scripts/verify-c1-input-balance.mjs', 'scripts/verify-document-authority.mjs']:
              target = Path(path)
              text = target.read_text(encoding='utf-8')
              updated = text.replace('当前市场需求模型 19', '当前市场需求模型 20')
              updated = updated.replace('市场需求模型 19、', '市场需求模型 20、')
              if updated != text:
                  target.write_text(updated, encoding='utf-8')
          PY
          git diff --check

      - name: Install dependencies
        run: npm ci

      - name: Run targeted server tests
        run: node --test server/test/state-economic-baselines.test.js server/test/market-demand-v6.test.js server/test/provinces.test.js server/test/population-economy.test.js server/test/domain.test.js server/test/all-products-demand.test.js server/test/market-liquidity.test.js server/test/c1-input-balance-migration.test.js

      - name: Verify population and provincial economy
        run: |
          node scripts/verify-staple-crops-demand.mjs
          npm run verify:provincial-economy

      - name: Run full build verification
        run: npm run build

      - name: Commit final implementation
        shell: bash
        run: |
          git rm .github/workflows/apply-state-economic-baselines.yml
          git rm .github/workflows/finalize-state-economic-baselines.yml
          git rm .github/workflows/finalize-state-economic-baselines-v2.yml
          git rm .github/workflows/finalize-state-economic-baselines-v3.yml
          git rm .github/workflows/finalize-state-economic-baselines-v4.yml
          git rm .github/workflows/finalize-state-economic-baselines-v5.yml
          git rm .github/workflows/finalize-state-economic-baselines-v6.yml
          git add -A
          git diff --cached --check
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: add state economic baselines"
          git push origin HEAD:feat/state-economic-baselines
