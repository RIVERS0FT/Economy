name: Repair login session syntax

on:
  push:
    branches:
      - fix/login-session-fast-path
    paths:
      - .github/workflows/repair-login-session-syntax.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/login-session-fast-path
          fetch-depth: 0
      - name: Repair source formatting and commit
        run: |
          python3 - <<'PY'
          from pathlib import Path

          for path in ['src/app/App.tsx', 'server/src/market-demand/signals.js']:
              text = Path(path).read_text()
              if text.startswith('\\\n'):
                  text = text[2:]
              if text.startswith('\\\r\n'):
                  text = text[3:]
              Path(path).write_text(text)

          path = Path('tests/browser/application-error-state.spec.ts')
          text = path.read_text()
          marker = "  \\\n    test('mobile authentication abort warning centers recoverable text beside a fixed refresh target'"
          if marker in text:
              text = text.replace(
                  marker,
                  "  test('mobile authentication abort warning centers recoverable text beside a fixed refresh target'",
                  1,
              )
          start = text.index("    test('mobile authentication abort warning centers recoverable text beside a fixed refresh target'")
          end = text.rindex('\n\n});')
          block = text[start:end]
          block = '\n'.join(line[2:] if line.startswith('  ') else line for line in block.splitlines())
          text = text[:start] + block + text[end:]
          path.write_text(text)
          PY
          node --check server/src/market-demand.js
          node --check server/src/market-demand/signals.js
          node --check server/src/app.js
          node --check server/src/registration-store.js
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/app/App.tsx server/src/market-demand/signals.js tests/browser/application-error-state.spec.ts
          git commit -m "清理登录会话实现语法残片"
          git push origin HEAD:fix/login-session-fast-path
