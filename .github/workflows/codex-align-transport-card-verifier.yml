name: Align transport card verifier
on:
  push:
    branches: [codex/warehouse-product-stack]
permissions:
  contents: write
jobs:
  apply:
    if: github.event.head_commit.message == 'stage transport card verifier alignment'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 scripts/codex-align-transport-card-verifier.py
      - run: git diff --check
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/verify-provincial-unlock-transport.mjs src/styles/warehouse-expansion.css
          git commit -m "align transport verifier with standalone card"
          git push origin HEAD:${GITHUB_REF_NAME}
