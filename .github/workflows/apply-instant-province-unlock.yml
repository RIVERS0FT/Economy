name: Apply instant province unlock patch

on:
  push:
    branches:
      - fix/instant-province-unlock

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24.4.0
          cache: npm

      - name: Apply patch
        id: apply
        continue-on-error: true
        shell: bash
        run: python3 scripts/apply-instant-province-unlock-patch-v2.py 2> patch-error.txt

      - name: Commit patch diagnostic
        if: steps.apply.outcome == 'failure'
        shell: bash
        run: |
          git reset --hard HEAD
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add patch-error.txt
          git commit -m "记录临时州解锁补丁失败锚点"
          git push origin HEAD
          exit 1

      - name: Install dependencies
        if: steps.apply.outcome == 'success'
        run: npm ci

      - name: Validate targeted behavior
        if: steps.apply.outcome == 'success'
        run: |
          node scripts/verify-provincial-unlock-transport.mjs
          node scripts/verify-client-response-performance.mjs
          node scripts/verify-runtime-efficiency.mjs
          node --test server/test/world-storage-v2.test.js server/test/province-access.test.js
          npm run typecheck

      - name: Commit patch
        if: steps.apply.outcome == 'success'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            server/src/world-storage-v2.js \
            src/app/gameViewModel.ts \
            src/pages/ProvincePage.tsx \
            docs/PAGE_CONTENT_AND_NAVIGATION_DESIGN.md \
            docs/SERVER_ARCHITECTURE_AND_DEPLOYMENT_DESIGN.md \
            scripts/verify-provincial-unlock-transport.mjs \
            scripts/verify-client-response-performance.mjs \
            server/test/world-storage-v2.test.js
          git diff --cached --check
          git commit -m "让州解锁使用局部事务并异步同步状态"
          git push origin HEAD
