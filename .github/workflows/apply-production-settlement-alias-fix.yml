name: Apply production settlement alias fix

on:
  push:
    branches:
      - "fix/interaction-mutation-scopes"
    paths:
      - ".github/workflows/apply-production-settlement-alias-fix.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/interaction-mutation-scopes
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.4.0
          cache: npm
      - run: |
          python3 scripts/apply-production-settlement-alias-fix.py
          rm scripts/apply-production-settlement-alias-fix.py
      - run: npm ci
      - name: Validate
        run: |
          node scripts/verify-production-lazy-settlement.mjs
          node scripts/verify-client-response-performance.mjs
          node scripts/verify-runtime-efficiency.mjs
          node --test server/test/world-storage-v2.test.js
          npm run typecheck
          git diff --check
      - name: Commit source
        run: |
          git config user.name 'RIVERSOFT'
          git config user.email '105160096+RIVERS0FT@users.noreply.github.com'
          git add -A
          git commit -m '保持生产结算既有局部事务别名'
          git push origin HEAD:fix/interaction-mutation-scopes
