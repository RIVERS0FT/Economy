name: Harden manual administrator bans

on:
  push:
    branches:
      - agent/manual-admin-bans

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/manual-admin-bans
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.4.0
          cache: npm
      - name: Apply hardening patch
        env:
          PATCH_B64: ""
        run: |
          python3 - <<'PY'
          import base64, os, zlib
          open('/tmp/harden_manual_bans.py', 'wb').write(zlib.decompress(base64.b64decode(os.environ['PATCH_B64'])))
          PY
          python3 /tmp/harden_manual_bans.py
      - name: Install dependencies
        run: npm ci
      - name: Validate hardening
        run: |
          node --check server/src/invitations.js
          node scripts/verify-gems-invitations-and-bans.mjs
          node --test server/test/invitations.test.js
          npm run build
          git diff --check
      - name: Commit hardening
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f .github/workflows/agent-harden-manual-bans.yml
          git add -A
          git commit -m "Harden manual-ban migration"
          git push origin HEAD:agent/manual-admin-bans
