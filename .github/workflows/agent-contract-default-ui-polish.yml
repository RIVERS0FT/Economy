name: Agent contract default UI polish

on:
  push:
    branches:
      - feat/contract-default-claims

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/contract-default-claims
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.4.0
          cache: npm
      - run: npm ci
      - name: Apply UI priority and copy fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'src/pages/ContractPage.tsx',
              """    .sort((left, right) => (\n      Number(Boolean(right.graceEndsAt)) - Number(Boolean(left.graceEndsAt))\n""",
              """    .sort((left, right) => (\n      Number(isConfirmedDefault(right)) - Number(isConfirmedDefault(left))\n      || Number(Boolean(right.graceEndsAt)) - Number(Boolean(left.graceEndsAt))\n""",
          )
          replace_once(
              'src/pages/ContractPage.tsx',
              """          <p className=\"contract-offer-note\">{isSupply ? '商品与货款逐批托管，卖方累计收取 1% 服务费。' : isLoan ? '本金不得超过抵押工厂审慎价值的 50%，逾期 12 小时后处置最少足额抵押工厂。' : '租入工厂不计入承租方资产；欠租会暂停使用权并进入 12 小时宽限期。'}</p>\n""",
              """          <p className=\"contract-offer-note\">{isSupply ? '商品与货款逐批托管，卖方累计收取 1% 服务费。' : isLoan ? '本金不得超过抵押工厂审慎价值的 50%；宽限结束仍未还款时确认违约，由出借方主动解除并按确认时快照处置抵押。' : '租入工厂不计入承租方资产；欠租会暂停使用权，宽限结束仍欠租时由出租方主动解除并领取违约金。'}</p>\n""",
          )
          replace_once(
              'docs/PAGE_CONTENT_AND_NAVIGATION_DESIGN.md',
              '进行中合同固定按宽限期、待处理、即将交付和正常履约排序。',
              '进行中合同固定按已违约待解除、宽限期、待处理、即将交付和正常履约排序。',
          )
          replace_once(
              'scripts/verify-contract-types.mjs',
              "requireText('src/pages/ContractPage.tsx', ['供应合同', '采购合同', '放贷合同', '贷款合同', '出租合同', '租赁合同', '已违约 · 待解除', '解除合同并领取违约金', '解除合同并处置抵押', '等待受偿方处理']);",
              "requireText('src/pages/ContractPage.tsx', ['供应合同', '采购合同', '放贷合同', '贷款合同', '出租合同', '租赁合同', '已违约 · 待解除', '解除合同并领取违约金', '解除合同并处置抵押', '等待受偿方处理', 'Number(isConfirmedDefault(right))', '宽限结束仍未还款时确认违约', '宽限结束仍欠租时由出租方主动解除']);",
          )
          PY
      - run: npm run verify:contract-types
      - run: npm run verify:contract-layout
      - run: npm run typecheck
      - run: git diff --check
      - name: Commit patch and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/ContractPage.tsx docs/PAGE_CONTENT_AND_NAVIGATION_DESIGN.md scripts/verify-contract-types.mjs
          git rm .github/workflows/agent-contract-default-ui-polish.yml
          git commit -m "fix: prioritize confirmed contract defaults"
          git push origin HEAD:feat/contract-default-claims
