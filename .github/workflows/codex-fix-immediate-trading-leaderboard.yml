name: Fix immediate market trading leaderboard

on:
  push:
    branches:
      - codex/daily-system-market
    paths:
      - .github/workflows/codex-fix-immediate-trading-leaderboard.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: node scripts/codex-fix-immediate-trading-leaderboard.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "修正即时市场交易榜小数成交额"
          git push origin HEAD:codex/daily-system-market
