name: Apply authentication card outline removal

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply source patch
        run: |
          if [ -f .agent/patch-error.txt ]; then
            echo "已有补丁错误记录，等待修正。"
            exit 1
          fi
          if ! git apply --recount --check .agent/remove-auth-card-white-outline.patch 2> .agent/patch-error.txt; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .agent/patch-error.txt
            git commit -m "记录认证卡片补丁错误"
            git push origin HEAD:${{ github.head_ref }}
            exit 1
          fi
          rm -f .agent/patch-error.txt
          git apply --recount .agent/remove-auth-card-white-outline.patch
          rm -f .agent/remove-auth-card-white-outline.patch
          rm -f .github/workflows/agent-remove-auth-card-white-outline.yml
          rmdir .agent 2>/dev/null || true
      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "移除认证卡片外层白边"
          git push origin HEAD:${{ github.head_ref }}
