name: Apply authentication card outline removal

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply verified source edits
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              content = file.read_text(encoding='utf-8')
              count = content.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}: {old[:120]!r}')
              file.write_text(content.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'src/styles/liquid-glass-surfaces.css',
              '''.liquid-glass-surface--desktopStatusBar::after,
          .liquid-glass-surface--mobileStatusBar::after,
          .liquid-glass-surface--desktopAuthCard::after,
          .liquid-glass-surface--mobileAuthCard::after {
            content: "";
            position: absolute;
            z-index: 2;
            inset: 0;
            box-sizing: border-box;
            border: 1px solid var(--liquid-glass-structure-border);
            border-radius: inherit;
            pointer-events: none;
          }''',
              '''.liquid-glass-surface--desktopStatusBar::after,
          .liquid-glass-surface--mobileStatusBar::after {
            content: "";
            position: absolute;
            z-index: 2;
            inset: 0;
            box-sizing: border-box;
            border: 1px solid var(--liquid-glass-structure-border);
            border-radius: inherit;
            pointer-events: none;
          }

          .liquid-glass-surface--desktopAuthCard::after,
          .liquid-glass-surface--mobileAuthCard::after {
            content: none;
          }''',
          )

          replace_once(
              'tests/browser/auth-three-layer.spec.ts',
              "      outlineBorder: outlineStyle.borderTopWidth,\n      outlineZIndex: outlineStyle.zIndex,",
              "      outlineBorder: outlineStyle.borderTopWidth,\n      outlineContent: outlineStyle.content,\n      outlineZIndex: outlineStyle.zIndex,",
          )
          replace_once(
              'tests/browser/auth-three-layer.spec.ts',
              "      expect(glass.outlineBorder).toBe('1px');\n      expect(glass.outlineZIndex).toBe('2');",
              "      expect(glass.outlineBorder).toBe('0px');\n      expect(glass.outlineContent).toBe('none');\n      expect(glass.outlineZIndex).toBe('auto');",
          )
          replace_once(
              'tests/browser/auth-three-layer.spec.ts',
              "      expect(registrationGlass.outlineBorder).toBe('1px');",
              "      expect(registrationGlass.outlineBorder).toBe('0px');\n      expect(registrationGlass.outlineContent).toBe('none');",
          )

          for path in ['scripts/verify-auth-three-layer.mjs', 'scripts/verify-liquid-glass-chrome.mjs']:
              replace_once(
                  path,
                  "  '.liquid-glass-surface--desktopAuthCard::after,',\n  '.liquid-glass-surface--mobileAuthCard::after {'," if path.endswith('auth-three-layer.mjs') else "    '.liquid-glass-surface--desktopAuthCard::after,',\n    '.liquid-glass-surface--mobileAuthCard::after {',",
                  "  '.liquid-glass-surface--desktopStatusBar::after,\\n.liquid-glass-surface--mobileStatusBar::after {',\n  '.liquid-glass-surface--desktopAuthCard::after,\\n.liquid-glass-surface--mobileAuthCard::after {',\n  'content: none;'," if path.endswith('auth-three-layer.mjs') else "    '.liquid-glass-surface--desktopStatusBar::after,\\n.liquid-glass-surface--mobileStatusBar::after {',\n    '.liquid-glass-surface--desktopAuthCard::after,\\n.liquid-glass-surface--mobileAuthCard::after {',\n    'content: none;',",
              )

          replace_once(
              'scripts/verify-auth-three-layer.mjs',
              "  '不得再创建 `.liquid-glass-surface__material-fill`',",
              "  '不得再创建 `.liquid-glass-surface__material-fill`',\n  '认证卡片不得绘制项目结构描边',",
          )
          replace_once(
              'scripts/verify-auth-three-layer.mjs',
              "  'expect(glass.materialFillCount).toBe(0)',",
              "  'expect(glass.materialFillCount).toBe(0)',\n  \"expect(glass.outlineContent).toBe('none')\",",
          )
          replace_once(
              'scripts/verify-auth-three-layer.mjs',
              "登录三层结构、认证内容层、状态栏同源染色与表单状态保持验证通过。",
              "登录三层结构、认证内容层、状态栏同源染色、无认证外框与表单状态保持验证通过。",
          )

          replace_once(
              'scripts/verify-liquid-glass-chrome.mjs',
              "    '不得创建 `.liquid-glass-surface__material-fill`',",
              "    '不得创建 `.liquid-glass-surface__material-fill`',\n    '认证卡片不得绘制项目结构描边',",
          )
          replace_once(
              'scripts/verify-liquid-glass-chrome.mjs',
              "    '统一使用 `--liquid-glass-contrast`',\n    '不得在 `auth.css` 手写另一套 `backdrop-filter`',",
              "    '统一使用 `--liquid-glass-contrast`',\n    '认证卡片不得绘制项目结构描边',\n    '不得在 `auth.css` 手写另一套 `backdrop-filter`',",
          )
          replace_once(
              'scripts/verify-liquid-glass-chrome.mjs',
              "    'expect(glass.materialFillCount).toBe(0)',",
              "    'expect(glass.materialFillCount).toBe(0)',\n    \"expect(glass.outlineContent).toBe('none')\",",
          )
          replace_once(
              'scripts/verify-liquid-glass-chrome.mjs',
              "liquid-glass-react 登录后外壳、认证卡片、同源内容与染色、平台预设、内容自适应、开放背景采样链与安全边缘滚动条验证通过。",
              "liquid-glass-react 登录后外壳、无项目外框认证卡片、同源内容与染色、平台预设、内容自适应、开放背景采样链与安全边缘滚动条验证通过。",
          )

          replace_once(
              'docs/REGISTRATION_INVITE_FLOW_DESIGN.md',
              '液态玻璃参数、回退底色、单层结构描边、上游装饰隐藏和阴影',
              '液态玻璃参数、回退底色、状态栏单层结构描边、认证卡片无项目结构描边、上游装饰隐藏和阴影',
          )
          replace_once(
              'docs/REGISTRATION_INVITE_FLOW_DESIGN.md',
              '\n移动端只有认证卡片拥有实体轮廓、圆角与玻璃背景；',
              '\n认证卡片不得绘制项目结构描边或额外大圆角白色外框，只保留 `liquid-glass-react` 自身的折射边缘、圆角裁切和宿主阴影；桌面与移动状态栏继续保留一条位于内容之上的连续结构描边。\n\n移动端只有认证卡片保留圆角玻璃背景；',
          )
          replace_once(
              'docs/REGISTRATION_INVITE_FLOW_DESIGN.md',
              '状态栏同源宿主染色、内容自适应',
              '状态栏同源宿主染色、认证卡片无项目结构描边、内容自适应',
          )
          replace_once(
              'docs/REGISTRATION_INVITE_FLOW_DESIGN.md',
              '内容自适应、单层描边、同源宿主染色',
              '内容自适应、状态栏单层描边、认证卡片无外框、同源宿主染色',
          )
          replace_once(
              'docs/REGISTRATION_INVITE_FLOW_DESIGN.md',
              '认证宿主与状态栏同源染色、无 `material-fill`',
              '认证宿主与状态栏同源染色、认证伪元素不生成外框、无 `material-fill`',
          )

          replace_once(
              'docs/LIQUID_GLASS_CHROME_DESIGN.md',
              '认证回退底色、单层结构描边、第三方装饰层显隐',
              '认证回退底色、状态栏单层结构描边、认证卡片无项目结构描边、第三方装饰层显隐',
          )
          replace_once(
              'docs/LIQUID_GLASS_CHROME_DESIGN.md',
              '只保留 `.glass__warp` 材质和宿主的一条最上层连续结构描边。',
              '只保留 `.glass__warp` 材质。状态栏只保留宿主的一条最上层连续结构描边；认证卡片不得绘制项目结构描边或额外大圆角白色外框，只保留第三方折射边缘、圆角裁切和宿主阴影。',
          )
          replace_once(
              'docs/LIQUID_GLASS_CHROME_DESIGN.md',
              '认证回退、单层结构描边、装饰层显隐',
              '认证回退、状态栏单层结构描边、认证卡片无项目结构描边、装饰层显隐',
          )
          replace_once(
              'docs/LIQUID_GLASS_CHROME_DESIGN.md',
              '同源宿主染色、单实例、自然高度',
              '同源宿主染色、无项目外框、单实例、自然高度',
          )
          replace_once(
              'docs/LIQUID_GLASS_CHROME_DESIGN.md',
              '轻度模糊、结构描边和内容结构',
              '轻度模糊、状态栏结构描边、认证卡片圆角裁切和内容结构',
          )
          replace_once(
              'docs/LIQUID_GLASS_CHROME_DESIGN.md',
              '状态栏和认证卡片只保留一条低强度 `1px` 最上层连续结构描边；移动底栏继续使用宿主边框。',
              '状态栏只保留一条低强度 `1px` 最上层连续结构描边；认证卡片不得绘制项目结构描边，`.liquid-glass-surface--desktopAuthCard::after` 与 `.liquid-glass-surface--mobileAuthCard::after` 必须使用 `content: none`；移动底栏继续使用宿主边框。',
          )
          replace_once(
              'docs/LIQUID_GLASS_CHROME_DESIGN.md',
              '真实表单内容位于 `.glass` 内且表单值不丢失。',
              '真实表单内容位于 `.glass` 内且表单值不丢失；认证伪元素不生成项目结构描边或大圆角白色外框。',
          )
          replace_once(
              'docs/LIQUID_GLASS_CHROME_DESIGN.md',
              '认证卡片与状态栏统一使用 `--liquid-glass-contrast` 宿主染色且不存在 `.liquid-glass-surface__material-fill`；`auth.css`',
              '认证卡片与状态栏统一使用 `--liquid-glass-contrast` 宿主染色且不存在 `.liquid-glass-surface__material-fill`；认证卡片 `::after` 不生成外框，`auth.css`',
          )
          PY
          rm -f .agent/remove-auth-card-white-outline.patch
          rm -f .agent/patch-error.txt
          rm -f .github/workflows/agent-remove-auth-card-white-outline.yml
          rmdir .agent 2>/dev/null || true
      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "移除认证卡片外层白边"
          git push origin HEAD:${{ github.head_ref }}
