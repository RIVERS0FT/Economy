name: Agent unified mobile sheet migration

on:
  push:
    branches:
      - agent/unified-mobile-sheet-host

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/unified-mobile-sheet-host
          fetch-depth: 0

      - name: Apply exact authority migration
        run: node scripts/agent-migrate-unified-mobile-sheet.mjs

      - name: Remove one-time migration helpers
        run: |
          rm scripts/agent-migrate-unified-mobile-sheet.mjs
          rm .github/workflows/agent-unified-mobile-sheet-migration.yml

      - name: Commit migrated sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            docs/UI_DESIGN_SYSTEM.md \
            docs/PAGE_CONTENT_AND_NAVIGATION_DESIGN.md \
            docs/LIQUID_GLASS_CHROME_DESIGN.md \
            scripts/verify-game-shell-layout.mjs \
            scripts/verify-unified-factory-recipes-grid.mjs \
            scripts/agent-migrate-unified-mobile-sheet.mjs \
            .github/workflows/agent-unified-mobile-sheet-migration.yml
          git diff --cached --check
          git commit -m "同步唯一移动 Sheet 设计与验证"
          git push origin HEAD:agent/unified-mobile-sheet-host
