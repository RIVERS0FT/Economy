name: Apply fixed weekly settlement

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

concurrency:
  group: apply-fixed-weekly-settlement
  cancel-in-progress: true

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fixed-weekly-bank-settlement
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24.4.0
          cache: npm

      - name: Reassemble and apply patch
        run: |
          cat .github/scripts/fixed-weekly-settlement.part* > /tmp/fixed-weekly-settlement.b64
          base64 --decode /tmp/fixed-weekly-settlement.b64 | gzip --decompress > /tmp/apply-fixed-weekly-settlement.mjs
          python3 - <<'PYTHON'
          from pathlib import Path
          path = Path('/tmp/apply-fixed-weekly-settlement.mjs')
          content = path.read_text()
          content = content.replace(
              "replaceAllLiteral('scripts/verify-document-authority.mjs', '应为 17', '应为 20');",
              "replaceAllLiteral('scripts/verify-document-authority.mjs', '应为 17', '应为 20', { required: false });",
          )
          path.write_text(content)
          PYTHON
          node --check /tmp/apply-fixed-weekly-settlement.mjs
          node /tmp/apply-fixed-weekly-settlement.mjs
          python3 - <<'PYTHON'
          from pathlib import Path

          verifier = Path('scripts/verify-money-precision.mjs')
          content = verifier.read_text()
          replacements = {
              'CURRENT_CLIENT_STATE_VERSION = 22': 'CURRENT_CLIENT_STATE_VERSION = 23',
              'MIN_COMPATIBLE_CLIENT_STATE_VERSION = 22': 'MIN_COMPATIBLE_CLIENT_STATE_VERSION = 23',
              'BANKING_VERSION = 2': 'BANKING_VERSION = 3',
          }
          for before, after in replacements.items():
              content = content.replace(before, after)
          world_version_assertion = 'world' + chr(92) + '.version = 19'
          if world_version_assertion not in content:
              raise RuntimeError('Missing world version 19 assertion in verify-money-precision.mjs')
          content = content.replace(
              world_version_assertion,
              'world' + chr(92) + '.version = 20',
          )
          verifier.write_text(content)

          page_verifier = Path('scripts/verify-page-content.mjs')
          content = page_verifier.read_text().replace('动态存款利息', '活跃周固定存款利息、周资金结算')
          page_verifier.write_text(content)

          assets_verifier = Path('scripts/verify-assets-page.mjs')
          content = assets_verifier.read_text()
          content = content.replace('title="存款利息"', 'title="存款利息与周结算"')
          content = content.replace(
              '页面顺序固定为“资产总览／存款账户与存款利息／工厂抵押贷款／银行记录”',
              '页面顺序固定为“资产总览／存款账户与存款利息、周资金结算／工厂抵押贷款／银行记录”',
          )
          assets_verifier.write_text(content)

          auction_verifier = Path('scripts/verify-asset-auctions.mjs')
          content = auction_verifier.read_text()
          content = content.replace('客户端状态版本：`22`', '客户端状态版本：`23`')
          content = content.replace('世界状态版本：`19`', '世界状态版本：`20`')
          auction_verifier.write_text(content)

          for verifier_path in Path('scripts').glob('*.mjs'):
              verifier_content = verifier_path.read_text()
              verifier_content = verifier_content.replace(
                  'Prune backups and create compact compressed database backup before world 19 migration',
                  'Prune backups and create compact compressed database backup before world 20 migration',
              )
              verifier_content = verifier_content.replace(
                  'backup-world --target-world-version 19',
                  'backup-world --target-world-version 20',
              )
              verifier_path.write_text(verifier_content)

          settlement = Path('server/src/weekly-cash-settlement.js')
          content = settlement.read_text().replace('safeMoney(player?.frozenCredits)', 'safeMoney(player.frozenCredits)')
          old_login_settlement = '''export function settlePlayerWeeklyCashOnLogin(world, player, now = Date.now()) {
            processWeeklyCashSettlementWorld(world, now);
            const playerState = ensurePlayerWeeklyCashSettlement(player, now);
            const currentPeriod = weeklyCashPeriodFor(now);
            const hadPending = weeklySettlementLiability(player) > 0;
            let result = collectPlayerWeeklyCashSettlement(world, player, now);
            if (!hadPending
              && !playerState.pendingSettlement
              && playerState.lastLoginAt < currentPeriod.startsAt) {
              createAssessment(world, player, 'returning_player', currentPeriod.key, now);
              result = collectPlayerWeeklyCashSettlement(world, player, now);
            }
            playerState.lastLoginWeekKey = currentPeriod.key;
            playerState.lastLoginAt = now;
            return result;
          }
          '''
          new_login_settlement = '''export function settlePlayerWeeklyCashOnLogin(world, player, now = Date.now()) {
            processWeeklyCashSettlementWorld(world, now);
            const playerState = ensurePlayerWeeklyCashSettlement(player, now);
            const currentPeriod = weeklyCashPeriodFor(now);
            const enteredNewLoginPeriod = playerState.lastLoginWeekKey !== currentPeriod.key
              || playerState.lastLoginAt < currentPeriod.startsAt;
            const hadPending = weeklySettlementLiability(player) > 0;
            let result = collectPlayerWeeklyCashSettlement(world, player, now);
            if (!hadPending
              && !playerState.pendingSettlement
              && enteredNewLoginPeriod) {
              createAssessment(world, player, 'returning_player', currentPeriod.key, now);
              result = collectPlayerWeeklyCashSettlement(world, player, now);
            }
            if (enteredNewLoginPeriod) {
              playerState.lastLoginWeekKey = currentPeriod.key;
              playerState.lastLoginAt = now;
            }
            return result;
          }
          '''
          old_login_settlement = '\n'.join(line[10:] if line.startswith('          ') else line for line in old_login_settlement.splitlines()) + '\n'
          new_login_settlement = '\n'.join(line[10:] if line.startswith('          ') else line for line in new_login_settlement.splitlines()) + '\n'
          if old_login_settlement not in content:
              raise RuntimeError('Missing weekly login settlement implementation')
          settlement.write_text(content.replace(old_login_settlement, new_login_settlement))

          domain = Path('server/src/domain.js')
          content = domain.read_text()
          if content.count('  migrated.version = 19;') != 1:
              raise RuntimeError('Expected one legacy domain migration version assignment')
          domain.write_text(content.replace('  migrated.version = 19;', '  migrated.version = 20;'))

          banking_test = Path('server/test/banking.test.js')
          content = banking_test.read_text()
          before = """test('deposit interest preserves sub-cent carry until a full cent can be paid', () => {
            const world = createWorld(now);
            const player = ensurePlayer(world, alice, now);
            const account = ensurePlayerBankAccount(player, now);
          """
          after = """test('deposit interest preserves sub-cent carry until a full cent can be paid', () => {
            const world = createWorld(now);
            const player = ensurePlayer(world, alice, now);
            ensureBankWorld(world, now);
            const account = ensurePlayerBankAccount(player, now);
          """
          before = '\n'.join(line[10:] if line.startswith('          ') else line for line in before.splitlines()) + '\n'
          after = '\n'.join(line[10:] if line.startswith('          ') else line for line in after.splitlines()) + '\n'
          if before not in content:
              raise RuntimeError('Missing sub-cent carry test setup')
          banking_test.write_text(content.replace(before, after))

          product_design = Path('docs/PRODUCT_AND_GAMEPLAY_DESIGN.md')
          content = product_design.read_text()
          content = content.replace(
              '银行按 `Asia/Shanghai` 每日 00:00 自动结息：',
              '固定存款日利率为每日 1%，银行按 `Asia/Shanghai` 每日 00:00 自动结息：',
          )
          content = content.replace(
              '借款人实际支付利息仍按 70%／20%／10% 分入存款利息池、银行服务就业收入和风险准备金。',
              '借款人实际支付利息仍按 70%／20%／10% 分配，其中 70% 进入存款利息池、20% 进入银行服务就业收入、10% 进入风险准备金。',
          )
          content = content.replace(
              '每个完整活跃周结束时，服务器在周一 00:00',
              '每周 10% 的资金扣除只适用于完整活跃周。每个完整活跃周结束时，服务器在周一 00:00',
          )
          product_design.write_text(content)

          page_design = Path('docs/PAGE_CONTENT_AND_NAVIGATION_DESIGN.md')
          content = page_design.read_text().replace(
              '页面顺序固定为“资产总览／存款账户与存款利息／工厂抵押贷款／银行记录”',
              '页面顺序固定为“资产总览／存款账户与存款利息、周资金结算／工厂抵押贷款／银行记录”',
          )
          page_design.write_text(content)
          PYTHON
          node --check server/src/weekly-cash-settlement.js
          node --check server/test/weekly-cash-settlement.test.js
          node --check scripts/verify-weekly-cash-settlement.mjs

      - name: Install dependencies
        run: npm ci

      - name: Build and run architecture checks
        id: build
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee /tmp/fixed-weekly-build.log

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        id: browser
        shell: bash
        run: |
          set -o pipefail
          npm run test:browser 2>&1 | tee /tmp/fixed-weekly-browser.log

      - name: Capture applied worktree
        if: always()
        shell: bash
        run: |
          mkdir -p /tmp/fixed-weekly-artifact
          git status --short > /tmp/fixed-weekly-artifact/git-status.txt
          git diff --binary > /tmp/fixed-weekly-artifact/applied.patch
          {
            echo '=== build log tail ==='
            if [ -f /tmp/fixed-weekly-build.log ]; then tail -n 1000 /tmp/fixed-weekly-build.log; else echo 'build log unavailable'; fi
            echo
            echo '=== browser log tail ==='
            if [ -f /tmp/fixed-weekly-browser.log ]; then tail -n 1000 /tmp/fixed-weekly-browser.log; else echo 'browser log unavailable'; fi
          } > /tmp/fixed-weekly-artifact/run.log
          tar \
            --exclude=.git \
            --exclude=node_modules \
            --exclude=dist \
            --exclude=test-results \
            --exclude=playwright-report \
            -czf /tmp/fixed-weekly-artifact/applied-worktree.tar.gz .

      - name: Upload applied worktree
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fixed-weekly-applied-${{ github.run_id }}
          path: /tmp/fixed-weekly-artifact
          if-no-files-found: error
          retention-days: 3

      - name: Commit implementation
        run: |
          rm -f .github/fixed-weekly-settlement-failure.log
          rm -f .github/scripts/fixed-weekly-settlement.part*
          git checkout HEAD -- .github/workflows/deploy.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No implementation changes to commit"
            exit 0
          fi
          git commit -m "Implement fixed weekly bank settlement"
          git push origin HEAD:agent/fixed-weekly-bank-settlement
