name: Agent production method browser fixture

on:
  push:
    branches:
      - agent/factory-production-methods

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/factory-production-methods
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Add production method browser fixture
        run: node scripts/agent-add-production-method-browser-fixture.mjs
      - name: Commit fixture and remove one-time files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -- .github/workflows/agent-production-method-browser-fixture.yml scripts/agent-add-production-method-browser-fixture.mjs
          git add -- tests/browser/runtime-harness.tsx
          git commit -m "test: add production method browser fixture"
          git push origin HEAD:agent/factory-production-methods
