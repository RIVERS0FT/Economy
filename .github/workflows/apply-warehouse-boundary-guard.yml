name: Apply Warehouse Boundary Guard

on:
  push:
    branches:
      - agent/increase-warehouse-expansion-cost

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/increase-warehouse-expansion-cost
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.4.0
          cache: npm

      - name: Add rounding boundary guard
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PYTHON'
          from pathlib import Path
          path = Path('scripts/verify-warehouse-expansion.mjs')
          source = path.read_text(encoding='utf-8')
          old = "  'warehouse summary price matches the amount deducted for the same actual capacity',"
          new = (
              "  'warehouse summary price matches the amount deducted for the same actual capacity',\n"
              "  'warehouseUpgradeCostForCapacity(501), 152',\n"
              "  'warehouseUpgradeCostForCapacity(502), 153',"
          )
          if source.count(old) != 1:
              raise SystemExit('warehouse boundary guard anchor mismatch')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
          PYTHON

      - name: Install dependencies
        run: npm ci

      - name: Validate guard
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-warehouse-expansion.mjs
          node --test server/test/warehouse.test.js
          npm run build
          git diff --check

      - name: Commit guard and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/apply-warehouse-boundary-guard.yml
          git add scripts/verify-warehouse-expansion.mjs
          git commit -m '加强仓库扩容价格舍入防回退'
          git push origin HEAD:agent/increase-warehouse-expansion-cost
