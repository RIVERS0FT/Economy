name: Fix fertilizer version documentation

on:
  push:
    branches:
      - agent/add-fertilizer-factory
    paths:
      - .github/workflows/fix-fertilizer-version-docs.yml

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/add-fertilizer-factory
          fetch-depth: 0

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.4.0
          cache: npm

      - name: Fix authoritative version wording
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              'docs/PRODUCT_AND_GAMEPLAY_DESIGN.md': [
                  ('> 更新时间：2026-08-03', '> 更新时间：2026-08-05'),
                  (
                      '权威状态使用 `marketDemand.modelVersion = 13`、`populationEconomy.modelVersion = 7` 和 `moneyPrecision.version = 3`。市场需求模型 14 与人口经济模型 7 随世界版本 23 引入；客户端状态版本继续为 26，因为人口数量与承载指标只属于服务器和管理员摘要，不改变普通玩家六分区协议。系统商品订单继续使用统一资产订单结构：',
                      '权威状态使用 `marketDemand.modelVersion = 14`、`populationEconomy.modelVersion = 7` 和 `moneyPrecision.version = 3`。市场需求模型 13 与人口经济模型 7 随世界版本 23 引入；世界版本 24 将市场需求升级至模型 14，客户端状态版本 27 同步扩展普通玩家商品与工厂目录协议。系统商品订单继续使用统一资产订单结构：',
                  ),
              ],
              'docs/UNIFIED_ASSET_ORDER_BOOK_DESIGN.md': [
                  ('> 更新时间：2026-08-04', '> 更新时间：2026-08-05'),
                  ('模型 13 按实际人口计算稳定需求预算', '模型 14 按实际人口计算稳定需求预算'),
                  ('当前市场需求模型为 13，人口经济内部版本为 7', '当前市场需求模型为 14，人口经济内部版本为 7'),
                  ('模型 13 保持 `food` / `household`', '模型 14 保持 `food` / `household`'),
                  ('- 市场需求模型版本为 13。实际人口只改变', '- 市场需求模型版本为 14。实际人口只改变'),
              ],
              'docs/SERVER_ARCHITECTURE_AND_DEPLOYMENT_DESIGN.md': [
                  ('> 更新时间：2026-08-02', '> 更新时间：2026-08-05'),
                  (
                      '当前客户端状态版本为 26，本地匿名成交存储为 v6，世界状态版本为 23，市场需求模型版本为 13；人口迁移、手续费迁移、储备迁移与资产拍卖删除迁移都不得重置纯商品／工厂资产、玩家订单或既有订单簿成交，储备种子只允许初始化一次。',
                      '当前客户端状态版本为 27，本地匿名成交存储为 v6，世界状态版本为 24，市场需求模型版本为 14；人口迁移、手续费迁移、储备迁移、资产拍卖删除迁移与化肥目录迁移都不得重置纯商品／工厂资产、玩家订单或既有订单簿成交，储备种子只允许初始化一次。',
                  ),
                  ('- 权威状态使用 `marketDemand.modelVersion = 13`、`populationEconomy.modelVersion = 7`。', '- 权威状态使用 `marketDemand.modelVersion = 14`、`populationEconomy.modelVersion = 7`。'),
                  (
                      '- 历史人口迁移与当前世界版本 23／客户端状态版本 26 都只执行一次人口启动发行，旧施工费不得追溯补发；',
                      '- 人口启动发行只允许在历史人口迁移中执行一次；世界版本 24／客户端状态版本 27 的化肥目录扩展不得再次发放人口启动资金，旧施工费也不得追溯补发；',
                  ),
              ],
              'docs/INDUSTRY_AND_PRODUCTION_DESIGN.md': [
                  ('> 更新时间：2026-08-04', '> 更新时间：2026-08-05'),
                  (
                      '世界版本 23／人口经济模型 7／市场需求模型 14 增加工厂人口承载。旧世界迁移按当时全部正式 `facilityGroups[].count` 计算结构承载、按运行参与数量与满员率初始化活跃承载 EMA，并把实际人口初始化为 10,000 后逐周期收敛；不得按工厂所有者拆分人口、不得因挂单或拍卖冻结删除结构承载、不得把历史产量或库存价值转换成人口。新世界从 1,000 基础人口开始。迁移不得改变工厂数量、参与数量、周期进度、满员率、配方、作业制度、抵押、挂单、拍卖或生产统计。',
                      '世界版本 23／人口经济模型 7／市场需求模型 13 增加工厂人口承载。旧世界迁移按当时全部正式 `facilityGroups[].count` 计算结构承载、按运行参与数量与满员率初始化活跃承载 EMA，并把实际人口初始化为 10,000 后逐周期收敛；不得按工厂所有者拆分人口、不得因挂单或拍卖冻结删除结构承载、不得把历史产量或库存价值转换成人口。新世界从 1,000 基础人口开始。迁移不得改变工厂数量、参与数量、周期进度、满员率、配方、作业制度、抵押、挂单、拍卖或生产统计。\n\n世界版本 24／市场需求模型 14／客户端状态版本 27 新增化肥商品与 C4 化肥厂。迁移只为每名玩家补齐化肥零库存、为世界补齐化肥市场与价格传导状态，并让公开目录返回 32 种商品和 22 种工厂；不得改写既有资金、库存、工厂、订单、冻结、合同、拍卖、银行、人口钱包、人口数量、周期进度或成交历史。',
                  ),
              ],
              'scripts/verify-document-authority.mjs': [
                  ('failures.push(`${path} 世界状态版本必须为 23`)', 'failures.push(`${path} 世界状态版本必须为 24`)'),
                  ('版本 ${CURRENT_CLIENT_STATE_VERSION}/23、500 新玩家启动资金', '版本 ${CURRENT_CLIENT_STATE_VERSION}/24、500 新玩家启动资金'),
              ],
              'scripts/verify-staple-crops-demand.mjs': [
                  ('市场需求验证通过：模型 13 使用工厂承载驱动的实际人口与真实钱包覆盖全部 32 种商品', '市场需求验证通过：模型 14 使用工厂承载驱动的实际人口与真实钱包覆盖全部 32 种商品'),
              ],
          }

          for path, pairs in replacements.items():
              file = Path(path)
              source = file.read_text()
              for old, new in pairs:
                  count = source.count(old)
                  if count != 1:
                      raise SystemExit(f'{path}: expected exactly one occurrence of {old!r}, found {count}')
                  source = source.replace(old, new)
              file.write_text(source)

          checks = {
              'docs/PRODUCT_AND_GAMEPLAY_DESIGN.md': [
                  '`marketDemand.modelVersion = 14`',
                  '世界版本 24 将市场需求升级至模型 14',
                  '客户端状态版本 27 同步扩展普通玩家商品与工厂目录协议',
              ],
              'docs/UNIFIED_ASSET_ORDER_BOOK_DESIGN.md': [
                  '模型 14 按实际人口计算稳定需求预算',
                  '当前市场需求模型为 14',
                  '模型 14 保持 `food` / `household`',
                  '市场需求模型版本为 14',
              ],
              'docs/SERVER_ARCHITECTURE_AND_DEPLOYMENT_DESIGN.md': [
                  '当前客户端状态版本为 27',
                  '世界状态版本为 24',
                  '市场需求模型版本为 14',
                  '`marketDemand.modelVersion = 14`',
                  '化肥目录扩展不得再次发放人口启动资金',
              ],
              'docs/INDUSTRY_AND_PRODUCTION_DESIGN.md': [
                  '世界版本 23／人口经济模型 7／市场需求模型 13 增加工厂人口承载',
                  '世界版本 24／市场需求模型 14／客户端状态版本 27 新增化肥商品与 C4 化肥厂',
              ],
          }
          for path, texts in checks.items():
              source = Path(path).read_text()
              for text in texts:
                  if text not in source:
                      raise SystemExit(f'{path}: missing postcondition {text!r}')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Run focused verification
        shell: bash
        run: |
          node scripts/verify-document-authority.mjs
          node scripts/verify-staple-crops-demand.mjs
          node scripts/verify-industry-catalog.mjs
          node --test server/test/fertilizer-factory.test.js
          git diff --check

      - name: Run full production build
        run: npm run build

      - name: Run Chromium regression
        shell: bash
        run: |
          npx playwright install --with-deps chromium
          npm run test:browser

      - name: Publish clean documentation fix
        shell: bash
        run: |
          rm -f .github/workflows/fix-fertilizer-version-docs.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            docs/PRODUCT_AND_GAMEPLAY_DESIGN.md \
            docs/UNIFIED_ASSET_ORDER_BOOK_DESIGN.md \
            docs/SERVER_ARCHITECTURE_AND_DEPLOYMENT_DESIGN.md \
            docs/INDUSTRY_AND_PRODUCTION_DESIGN.md \
            scripts/verify-document-authority.mjs \
            scripts/verify-staple-crops-demand.mjs \
            .github/workflows/fix-fertilizer-version-docs.yml
          git diff --cached --check
          git commit -m "统一化肥版本文档与验证口径"
          git push origin HEAD:agent/add-fertilizer-factory
