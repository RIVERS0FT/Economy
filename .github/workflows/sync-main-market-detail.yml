name: Sync main into market detail branch

on:
  push:
    branches:
      - fix/market-detail-direct-flow-20260901

permissions:
  contents: write

jobs:
  sync-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge latest main and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main
          if git merge-base --is-ancestor origin/main HEAD; then
            git rm .github/workflows/sync-main-market-detail.yml
            git commit -m "chore: remove main sync workflow"
          else
            git merge origin/main -X ours --no-edit
            git rm .github/workflows/sync-main-market-detail.yml
            git commit --amend --no-edit
          fi
          git push origin HEAD:${GITHUB_REF_NAME}
