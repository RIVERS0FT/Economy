name: Temporary Tutorial Naming Migration

on:
  push:
    branches:
      - codex/tutorial-right-rail

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ !contains(github.event.head_commit.message, '[tutorial-doc-migrated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/tutorial-right-rail
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rename player-facing tutorial terminology
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const { execFileSync } = require('node:child_process');
          const roots = ['src', 'server', 'docs', 'scripts', 'tests'];
          const output = execFileSync('git', ['grep', '-Il', '-E', '经营成长线|成长线', '--', ...roots], { encoding: 'utf8' }).trim();
          for (const path of output ? output.split('\n') : []) {
            let text = fs.readFileSync(path, 'utf8');
            const next = text.replaceAll('经营成长线', '教程').replaceAll('成长线', '教程');
            if (next !== text) fs.writeFileSync(path, next);
          }
          const pagePath = 'docs/PAGE_CONTENT_AND_NAVIGATION_DESIGN.md';
          let page = fs.readFileSync(pagePath, 'utf8');
          page = page.replace('不得形成成长进度', '不得形成教程进度');
          fs.writeFileSync(pagePath, page);
          NODE
      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src server docs scripts tests
          git diff --cached --check
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "统一教程显示名称 [tutorial-doc-migrated]"
          git push origin HEAD:codex/tutorial-right-rail
