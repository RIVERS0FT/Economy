name: Map raster frame diagnostics
on:
  push:
    branches: [fix/map-raster-frame-budget-20260906]
    paths: [.github/workflows/map-raster-frame-diagnostics.yml]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.4.0
          cache: npm
      - run: npm ci
      - name: Apply performance isolation runner
        run: |
          set -euo pipefail
          python3 scripts/tmp-isolate-map-performance.py
          git diff --check
      - name: Validate runner plan and architecture
        run: |
          set -euo pipefail
          node --experimental-strip-types --test tests/dt/browser-test-runner.test.ts
          node scripts/verify-deployment-pipeline.mjs
          node scripts/verify-runtime-reliability.mjs
          node scripts/verify-provincial-economy.mjs
          git diff --check
      - name: Prepare formal Playwright browser
        run: bash scripts/prepare-playwright-chromium.sh
      - name: Validate full deployment shard 4 with isolated performance gate
        run: npm run test:browser -- --shard=4/4
      - name: Commit tested product changes only
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            package.json \
            scripts/run-browser-tests.mjs \
            tests/dt/browser-test-runner.test.ts \
            scripts/verify-runtime-reliability.mjs \
            scripts/verify-deployment-pipeline.mjs \
            docs/CI_EXECUTION_DESIGN.md \
            docs/STRATEGIC_MAP_RENDERING_DESIGN.md
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'fix: isolate quantitative map performance from browser shards'
          git push origin HEAD:fix/map-raster-frame-budget-20260906
