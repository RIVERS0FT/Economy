name: Patch unified orderbook market detail doc

on:
  push:
    branches:
      - fix/market-detail-direct-flow-20260901

permissions:
  contents: write

jobs:
  patch-doc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Align unified orderbook market detail rules
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('docs/UNIFIED_ASSET_ORDER_BOOK_DESIGN.md')
          text = path.read_text(encoding='utf-8')

          def replace_once(old: str, new: str, label: str):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              text = text.replace(old, new, 1)

          replace_once(
              '地区商品目录和商品全局详情的地区行使用该地区官方系统价 `officialPrice` 与真实 24h 成交变化；基准偏离不在列表展示，只在具体地区商品详情计算。一级商品目录的跨州价格范围只能由各地区 `lastTradePrice` 形成，不得用 `officialPrice` 平均值、基础价或回退价制造全国市场价。`lastPrice` 与商品基础价只可用于详情行情曲线内部填补空分段和对照。历史工厂行情只可用于兼容、审计或估值，不得重新成为业务入口。',
              '地区商品目录和商品全局详情的地区行使用该地区官方系统价 `officialPrice` 与真实 24h 成交变化；一级商品目录的“市场价”只取当前玩家全部已解锁地区 `officialPrice` 的简单平均，作为只读跨地区摘要，不创建全国订单簿、全国深度、全国撮合或可交易的全国市场价。基准偏离不在目录或地区商品详情展示；地区商品详情顶部也不显示官方系统价，只保留真实 24h 变化和当前可用库存。`lastPrice` 与商品基础价只可用于详情行情曲线内部填补空分段和对照。历史工厂行情只可用于兼容、审计或估值，不得重新成为业务入口。',
              'regional price visibility',
          )
          replace_once(
              '市场下单表单与同资产五档订单簿必须位于同一个一级“{资产}交易”卡片内，内部使用无嵌套卡片的左右区域：下单区在左、订单簿在右，只以留白和分隔线区分。交易卡标题下固定显示最近成交、近 24h 变化和当前可用商品／可出售工厂的紧凑摘要；价格和数量均使用“字段标签／内嵌减号按钮／共享输入控件／内嵌加号按钮”的单行组合，价格步长为 0.01、数量步长为 1，快捷数量只显示 25%／50%／最大。最大可买／可卖、订单总额和可用资金／预计到账常驻显示，不再提供“交易资产详情”折叠区；资金、仓库、库存、冻结、抵押和生产参与只在摘要、限制说明或所属页面展示，市场不得重复堆叠。桌面端和移动端订单簿使用同一信息结构，均连续展示卖 5 至卖 1 和买 1 至买 5，不渲染“档位／价格／数量”表头或真实最近成交价“最新”分隔行；桌面端继续隐藏“实时五档 · 点击填价”辅助文案。档位可使用不遮挡文字的淡色深度比例背景，点击任一档位只把该档价格填入价格输入，不得直接提交订单。价格输入只在显式启用 `wheelStep={0.01}`、输入框已聚焦且滚轮命中输入框时按 0.01 调整并消费纵向滚轮；未聚焦时必须放行页面滚动。当前资产本人订单统一在详情后续“已有订单”区逐单展示和撤销，交易卡内不得再复制快捷撤单列表。内容宽度不小于 820px 时交易卡内部保持下单 60%／盘口 40% 双列；内容宽度不大于 819px 时继续使用约 60%／40% 左右双列，并给盘口保留不小于 112px 的可读宽度。不大于 `720px` 的移动端始终同时显示下单区和五档盘口，包括 `320px` 视口；极窄宽度通过把价格与数量标签移到输入框上方、压缩快捷数量间距、缩窄盘口三列并保留至少 44px 档位高度适配，不得隐藏任一区域、改为上下堆叠或恢复“下单／盘口”切换。“我的订单与成交”在桌面与移动端统一按“已有订单在上、本地成交在下”的单列顺序同时显示，不渲染“挂单／成交”账户视图切换，也不得通过断点隐藏其中一项。布局变化不得改变五档深度、撮合、冻结、手续费或订单限制。',
              '地区商品详情的手动下单与同资产五档订单簿直接排列在页面正文，不使用一级“{资产}交易”卡片底座；下单区与盘口区仍作为同一交易分组同排，只以标题、留白、分隔与各自内部控件边界区分。交易分组固定显示最近成交与 24h 成交量摘要；地区详情顶部另只保留商品身份、真实 24h 变化和当前可用库存。价格和数量均使用“字段标签／内嵌减号按钮／共享输入控件／内嵌加号按钮”的单行组合，价格步长为 0.01、数量步长为 1，快捷数量只显示 25%／50%／最大。最大可买／可卖、订单总额和可用资金／预计到账常驻显示，不再提供“交易资产详情”折叠区；资金、仓库、库存、冻结、抵押和生产参与只在摘要、限制说明或所属页面展示，市场不得重复堆叠。桌面端和移动端订单簿使用同一信息结构，均连续展示卖 5 至卖 1 和买 1 至买 5，不渲染“档位／价格／数量”表头或真实最近成交价“最新”分隔行；桌面端继续隐藏“实时五档 · 点击填价”辅助文案。档位可使用不遮挡文字的淡色深度比例背景，点击任一档位只把该档价格填入价格输入，不得直接提交订单。价格输入只在显式启用 `wheelStep={0.01}`、输入框已聚焦且滚轮命中输入框时按 0.01 调整并消费纵向滚轮；未聚焦时必须放行页面滚动。当前资产本人订单统一在详情后续“已有订单”区逐单展示和撤销，交易分组内不得再复制快捷撤单列表。内容宽度不小于 820px 时下单与盘口保持约 60%／40% 双列；内容宽度不大于 819px 时继续使用约 60%／40% 左右双列，并给盘口保留不小于 112px 的可读宽度。不大于 `720px` 的移动端始终同时显示下单区和五档盘口，包括 `320px` 视口；极窄宽度通过把价格与数量标签移到输入框上方、压缩快捷数量间距、缩窄盘口三列并保留至少 44px 档位高度适配，不得隐藏任一区域、改为上下堆叠或恢复“下单／盘口”切换。“我的订单与成交”在桌面与移动端统一按“已有订单在上、本地成交在下”的单列顺序同时显示，不渲染“挂单／成交”账户视图切换，也不得通过断点隐藏其中一项。本地成交由当前商品详情上下文确定资产，只显示方向、数量、价格、总额、手续费／实收和时间，并复用全局实体列表视觉。布局变化不得改变五档深度、撮合、冻结、手续费或订单限制。',
              'direct trade layout',
          )
          replace_once(
              '- 在内容宽度 `340px–819px` 恢复下单与盘口纵向单列，或删除移动端小于 340px 时的“下单／盘口”切换；',
              '- 在任意地区商品详情宽度恢复下单与盘口纵向单列、隐藏任一区域，或恢复“下单／盘口”切换；',
              'trade anti regression',
          )
          replace_once(
              '不得恢复：\n\n- 商品和工厂二级市场切换；',
              '不得恢复：\n\n- 地区商品详情的市场价、基准偏离、需求满足率、参考价、上轮需求、基本面条、自动经营执行卡、一级交易卡底座或本地成交“资产”列；\n- 商品和工厂二级市场切换；',
              'regional detail anti regression',
          )
          replace_once(
              '- 详情交易卡内部在支持宽度下保持下单与盘口同排；行情图和当前资产订单／成交随后显示；',
              '- 地区商品详情先显示近 24h 真实成交趋势；其后手动交易内容直接排列在正文，下单与盘口同排并保持各自内部操作边界，不使用一级交易卡底座；当前资产订单／成交随后显示；',
              'market page flow bullet',
          )
          replace_once(
              '- 不大于 `720px` 时账户记录使用“挂单／成交”切换并只显示当前分区；下单与盘口仍同时可见，不恢复表头或最新成交分隔；',
              '- 不大于 `720px` 时“已有订单”和“本地成交”仍按单列顺序同时显示，不使用“挂单／成交”切换；下单与盘口仍同时可见，不恢复表头或最新成交分隔；',
              'mobile account records',
          )
          replace_once(
              '完整行情图继续使用组件计算的动态几何，成交量绘图区必须保留最低可读高度和占比，不得由业务 CSS 恢复固定 `16:9`。市场复用概览与建筑相同的紧凑战略容器，行情图固定位于交易卡之后；不得因浏览器视口变宽而绕过页面容器恢复并排，也不得恢复已删除的行情底部统计栏。零涨跌使用中性色并显示 `0`，不得显示绿色 `+0`。',
              '完整行情图继续使用组件计算的动态几何，成交量绘图区必须保留最低可读高度和占比，不得由业务 CSS 恢复固定 `16:9`。市场复用概览与建筑相同的紧凑战略容器；地区商品详情中行情图固定先于手动交易区，交易区取消一级卡片底座，不得因浏览器视口变宽而绕过页面容器恢复并排，也不得恢复已删除的行情底部统计栏。零涨跌使用中性色并显示 `0`，不得显示绿色 `+0`。',
              'chart before trade',
          )

          path.write_text(text, encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/patch-unified-orderbook-market-detail-doc.yml
          git add docs/UNIFIED_ASSET_ORDER_BOOK_DESIGN.md
          git diff --cached --quiet && exit 0
          git commit -m "docs: align unified orderbook market detail rules"
          git push origin HEAD:${GITHUB_REF_NAME}
