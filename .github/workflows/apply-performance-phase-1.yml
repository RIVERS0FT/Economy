name: Apply Performance Phase 1

on:
  push:
    branches:
      - perf/phase-observability

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/phase-observability
          fetch-depth: 0
      - name: Apply approved performance patch
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/performance.patch.gz.b64 <<'PATCH'

PATCH
          base64 -d /tmp/performance.patch.gz.b64 | gzip -d > /tmp/performance.patch
          git apply --check /tmp/performance.patch
          git apply /tmp/performance.patch
          rm -- .github/workflows/apply-performance-phase-1.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- \
            docs/README.md \
            docs/SERVER_ARCHITECTURE_AND_DEPLOYMENT_DESIGN.md \
            scripts/verify-runtime-efficiency.mjs \
            server/src/app.js \
            server/src/request-metrics.js \
            server/src/request-performance.js \
            server/src/runtime-store.js \
            server/src/state-partitions.js \
            server/src/storage.js \
            server/test/request-metrics.test.js \
            server/test/request-performance.test.js \
            tests/stress/budgets.json \
            .github/workflows/apply-performance-phase-1.yml
          git commit -m "perf: add request phase observability"
          git push origin HEAD:perf/phase-observability
