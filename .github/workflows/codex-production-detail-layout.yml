name: Apply production detail layout

on:
  push:
    branches:
      - codex/production-detail-layout-20260802
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: codex-production-detail-layout-20260802
  cancel-in-progress: true

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: codex/production-detail-layout-20260802
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.4.0
          cache: npm

      - name: Apply patch
        run: |
          set -euo pipefail
          python3 .agent/apply-production-detail-layout.py
          rm -rf .agent
          rm .github/workflows/codex-production-detail-layout.yml

      - name: Install dependencies
        run: npm ci

      - name: Run focused regressions
        run: |
          set -euo pipefail
          node scripts/verify-production-methods.mjs
          node scripts/verify-unified-factory-recipes-grid.mjs
          node --experimental-strip-types scripts/verify-recipe-profit-analysis.mjs

      - name: Build and run repository verification
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run full browser suite
        run: npm run test:browser

      - name: Commit verified source
        run: |
          set -euo pipefail
          git diff --check
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "优化工厂详情信息层级"
          git push origin HEAD:codex/production-detail-layout-20260802
