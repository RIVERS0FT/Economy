name: Agent Integrate Market Reserve

on:
  push:
    branches:
      - feat/market-reserve-operations-main-20260808

concurrency:
  group: market-reserve-integration
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  integrate:
    if: ${{ !contains(github.event.head_commit.message, '[market-reserve-applied]') && !contains(github.event.head_commit.message, '[market-reserve-integrated]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/market-reserve-operations-main-20260808
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.4.0
          cache: npm
      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Cherry-pick verified implementation
        run: |
          set +e
          git cherry-pick bc4b06209dfb733d868383ec0a323c1332710399
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            unresolved="$(git diff --name-only --diff-filter=U | sort)"
            expected="$(printf '%s\n' package.json server/src/runtime-store.js | sort)"
            if [ "$unresolved" != "$expected" ]; then
              echo "Unexpected integration conflicts:"
              printf '%s\n' "$unresolved"
              exit 1
            fi
            git checkout --ours -- package.json server/src/runtime-store.js
            git add -- package.json server/src/runtime-store.js
            GIT_EDITOR=true git cherry-pick --continue
          fi
      - name: Reconcile latest main
        run: python3 scripts/agent-integrate-market-reserve.py
      - name: Remove temporary integration files
        run: |
          git rm -- .github/workflows/agent-integrate-market-reserve.yml scripts/agent-integrate-market-reserve.py
      - name: Install dependencies
        run: npm ci
      - name: Run focused reserve verification
        run: |
          node scripts/verify-market-reserve-operations.mjs
          node --test server/test/market-reserve-operations.test.js
          node scripts/verify-contract-audit.mjs
          npm run verify:authoritative-hotpaths
      - name: Build repository
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser tests
        run: npm run test:browser
      - name: Inspect and publish integration
        run: |
          git diff --check
          git status --short
          git diff --stat HEAD
          git add -- \
            package.json \
            server/src/runtime-store.js \
            server/src/contract-audit-store.js \
            scripts/verify-market-reserve-operations.mjs \
            docs/PRODUCT_AND_GAMEPLAY_DESIGN.md \
            docs/UNIFIED_ASSET_ORDER_BOOK_DESIGN.md
          git diff --cached --check
          git commit --amend -m "feat: deepen market reserve operations [market-reserve-integrated]"
          git push origin HEAD:feat/market-reserve-operations-main-20260808
