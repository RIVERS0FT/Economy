name: Temporary Facility Radius Regression Sync

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/tmp-facility-radius-regression.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'codex/facility-shared-padding-fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/facility-shared-padding-fix
          fetch-depth: 0
      - name: Register object-card radius exception
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          test_path = Path('tests/browser/all-pages-preview.spec.ts')
          test_text = test_path.read_text()
          old = """    if (densityKeys.has(key)) {
          expect(new Set(marketSamples.map((sample) => String(sample[key]))).size, `${key} should match inside commodity lists`).toBe(1);
          expect(new Set(facilitySamples.map((sample) => String(sample[key]))).size, `${key} should match inside facility two-line lists`).toBe(1);
          expect(String(marketSamples[0][key]), `${key} should keep the commodity density exception`).not.toBe(String(facilitySamples[0][key]));
          continue;
        }
"""
          new = """    if (key === 'borderRadius') {
          expect(new Set(marketSamples.map((sample) => String(sample[key]))).size, 'borderRadius should match inside commodity lists').toBe(1);
          expect(new Set(facilitySamples.map((sample) => String(sample[key]))).size, 'borderRadius should match inside facility object cards').toBe(1);
          expect(String(marketSamples[0][key]), 'facility object-card radius should remain distinct from commodity rows').not.toBe(String(facilitySamples[0][key]));
          continue;
        }
        if (densityKeys.has(key)) {
          expect(new Set(marketSamples.map((sample) => String(sample[key]))).size, `${key} should match inside commodity lists`).toBe(1);
          expect(new Set(facilitySamples.map((sample) => String(sample[key]))).size, `${key} should match inside facility two-line lists`).toBe(1);
          expect(String(marketSamples[0][key]), `${key} should keep the commodity density exception`).not.toBe(String(facilitySamples[0][key]));
          continue;
        }
"""
          if old not in test_text:
              raise SystemExit('all-pages radius insertion anchor missing')
          test_path.write_text(test_text.replace(old, new, 1))

          verifier_path = Path('scripts/verify-facility-catalog-layout.mjs')
          verifier = verifier_path.read_text()
          old_paths = """  browser: 'tests/browser/facility-catalog-layout.spec.ts',
  selector: 'scripts/select-ci-tests.mjs',
"""
          new_paths = """  browser: 'tests/browser/facility-catalog-layout.spec.ts',
  crossPageBrowser: 'tests/browser/all-pages-preview.spec.ts',
  selector: 'scripts/select-ci-tests.mjs',
"""
          if old_paths not in verifier:
              raise SystemExit('verifier path anchor missing')
          verifier = verifier.replace(old_paths, new_paths, 1)
          anchor = """  for (const text of [
    \"'tests/browser/all-pages-preview.spec.ts'\",
    \"'tests/browser/global-operation-pages.spec.ts'\",
"""
          radius_guard = """  for (const text of [
    \"if (key === 'borderRadius') {\",
    'borderRadius should match inside commodity lists',
    'borderRadius should match inside facility object cards',
    'facility object-card radius should remain distinct from commodity rows',
  ]) requireText(paths.crossPageBrowser, text);

  for (const text of [
    \"'tests/browser/all-pages-preview.spec.ts'\",
    \"'tests/browser/global-operation-pages.spec.ts'\",
"""
          if anchor not in verifier:
              raise SystemExit('verifier radius guard anchor missing')
          verifier_path.write_text(verifier.replace(anchor, radius_guard, 1))
          PY
      - name: Commit final files and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/tmp-facility-radius-regression.yml
          git add tests/browser/all-pages-preview.spec.ts scripts/verify-facility-catalog-layout.mjs
          git commit -m "同步建筑对象卡圆角回归"
          git push origin HEAD:codex/facility-shared-padding-fix
