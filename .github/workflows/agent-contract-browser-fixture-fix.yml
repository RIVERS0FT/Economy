name: Fix contract browser fixtures

on:
  push:
    branches:
      - agent/contract-types

permissions:
  contents: write

concurrency:
  group: agent-contract-browser-fixture-fix
  cancel-in-progress: false

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/contract-types
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.4.0
          cache: npm
      - name: Apply fixture correction
        shell: bash
        run: |
          set -euo pipefail
          python3 .agent-contract-browser-fixture-fix.py
          rm -f .agent-contract-browser-fixture-fix.py
          rm -f .github/workflows/agent-contract-browser-fixture-fix.yml
          git add -u -- .agent-contract-browser-fixture-fix.py .github/workflows/agent-contract-browser-fixture-fix.yml
          git diff --check
      - run: npm ci
      - name: Validate focused browser regressions
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-contract-layout.mjs
          npm run typecheck
          npx playwright install --with-deps chromium
          npx playwright test tests/browser/contract-layout.spec.ts tests/browser/contract-workspace.spec.ts
      - name: Validate full build
        run: npm run build
      - name: Commit formal fixture correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- tests/browser/runtime-harness.tsx scripts/verify-contract-layout.mjs
          git diff --cached --check
          git commit -m "修复合同浏览器运行夹具类型"
          git push origin HEAD:agent/contract-types
