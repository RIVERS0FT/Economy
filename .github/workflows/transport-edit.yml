name: Apply isolated transport edits

on:
  push:
    branches: [work/transport-balance-20260906]
    paths:
      - .github/transport-edit.py
      - .github/workflows/transport-edit.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.ref == 'refs/heads/work/transport-balance-20260906'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Apply exact scoped source edits
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/transport-edit.py
          node --check server/src/transport.js
          node --check shared/transport-policy.js
          node --check src/transport/transportPlanner.js
          node --check src/transport/transportCoordinator.js
          git rm .github/transport-edit.py .github/workflows/transport-edit.yml
          git diff --check
          git add server/src/transport.js src/utils/provinceLogistics.ts src/types.ts docs/WAREHOUSE_EXPANSION_DESIGN.md docs/PAGE_CONTENT_AND_NAVIGATION_DESIGN.md docs/SERVER_ARCHITECTURE_AND_DEPLOYMENT_DESIGN.md scripts/verify-provincial-unlock-transport.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(transport): lock active cycle policy and align authoritative transport rules'
          git push origin HEAD:refs/heads/work/transport-balance-20260906
          git show --stat --oneline HEAD
