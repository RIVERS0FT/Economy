name: Apply unified floating glass

on:
  push:
    branches:
      - agent/unify-floating-glass
    paths:
      - '.agent/**'
      - '.github/workflows/apply-unified-glass.yml'

permissions:
  contents: write

concurrency:
  group: apply-unified-floating-glass
  cancel-in-progress: true

jobs:
  apply-and-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Apply and publish source changes
        run: |
          set +e
          {
            sed -i 's/状态栏单描边/状态栏单层描边/g' .agent/apply_unified_glass.py
            python3 -m py_compile .agent/apply_unified_glass.py
            node --check .agent/new-verify-desktop-primary-surfaces.mjs
            python3 .agent/apply_unified_glass.py
            git diff --check
          } > /tmp/apply-unified-glass.log 2>&1
          status=$?
          set -e
          cat /tmp/apply-unified-glass.log

          rm -rf .agent
          rm -f .github/workflows/apply-unified-glass.yml
          if [ "$status" -ne 0 ]; then
            cp /tmp/apply-unified-glass.log APPLY_UNIFIED_GLASS_FAILURE.txt
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if [ "$status" -eq 0 ]; then
            git commit -m 'Unify application glass surfaces'
          else
            git commit -m 'Report unified glass application failure'
          fi
          git push origin HEAD:agent/unify-floating-glass
