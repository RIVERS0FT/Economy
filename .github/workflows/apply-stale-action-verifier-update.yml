name: Apply stale action verifier update

on:
  push:
    branches:
      - "fix/interactive-action-guardrails"
    paths:
      - ".github/workflows/apply-stale-action-verifier-update.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/interactive-action-guardrails
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.4.0
          cache: npm
      - name: Apply verifier updates
        run: |
          python3 scripts/update-action-registry-stale-verifiers.py
          rm scripts/update-action-registry-stale-verifiers.py
      - name: Install dependencies
        run: npm ci
      - name: Validate affected architecture
        run: |
          node scripts/verify-admin-player-statistics.mjs
          node scripts/verify-runtime-efficiency.mjs
          node --test server/test/runtime-hotpath-architecture.test.js server/test/player-action-registry.test.js server/test/world-storage-v2.test.js
          npm run typecheck
          git diff --check
      - name: Commit source
        run: |
          git config user.name 'RIVERSOFT'
          git config user.email '105160096+RIVERS0FT@users.noreply.github.com'
          git add -A
          git commit -m '迁移旧事务范围验证到统一动作注册表'
          git push origin HEAD:fix/interactive-action-guardrails
