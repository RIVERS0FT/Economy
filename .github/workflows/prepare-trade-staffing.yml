name: Finalize trade confirmation and commercial staffing
on:
  push:
    branches: [codex/trade-confirmation-commercial-staffing]
    paths: [.github/workflows/prepare-trade-staffing.yml]
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/trade-confirmation-commercial-staffing
          fetch-depth: 0
      - name: Align frozen-preview assertions and remove temporary tooling
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          for p in Path('scripts').glob('verify-*.mjs'):
              text = p.read_text()
              updated = text.replace('const total = officialPrice * effectiveQuantity;', 'const total = (pendingTrade.current?.price ?? officialPrice) * effectiveQuantity;')
              if updated != text:
                  p.write_text(updated)
          for path in [
              '.github/apply-trade-staffing.py',
              '.github/document-trade-staffing.py',
              '.github/review-trade-staffing.py',
              '.github/correct-trade-staffing.py',
              '.github/trade-staffing-diagnostics.md',
              '.github/workflows/prepare-trade-staffing.yml',
          ]:
              Path(path).unlink()
          PY
          git add -A
          node scripts/normalize-repository-text.mjs
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: finalize trade confirmation guards and remove review tools'
          git diff --check origin/main...HEAD
          git diff --stat origin/main...HEAD
          test -z "$(git status --porcelain)"
          git push origin HEAD:codex/trade-confirmation-commercial-staffing
