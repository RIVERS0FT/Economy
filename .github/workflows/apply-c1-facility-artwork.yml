name: Apply C1 Facility Artwork

on:
  push:
    branches:
      - agent/c1-facility-artwork

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/c1-facility-artwork
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply artwork and design changes
        shell: bash
        run: |
          set -Eeuo pipefail

          configure_git() {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          }

          report_failure() {
            status=$?
            configure_git
            printf 'C1 artwork workflow failed with exit code %s\n' "$status" > .agent/workflow-failed.txt
            git add .agent/workflow-failed.txt
            git commit -m "记录 C1 插画实施失败" || true
            git push origin HEAD:agent/c1-facility-artwork || true
            exit "$status"
          }
          trap report_failure ERR

          python -m pip install --disable-pip-version-check pillow==11.3.0
          python .agent/redraw-c1-facilities.py
          git apply --check .agent/c1-facility-artwork.patch
          git apply --whitespace=fix .agent/c1-facility-artwork.patch
          git diff --check

          configure_git
          git add \
            docs/UI_DESIGN_SYSTEM.md \
            scripts/verify-facility-artwork.mjs \
            scripts/facility-artwork-baseline.json \
            src/assets/facility-icons/farm.png \
            src/assets/facility-icons/orchard.png \
            src/assets/facility-icons/ranch.png \
            src/assets/facility-icons/fishery.png
          git diff --cached --check
          git commit -m "重绘 C1 工厂场景插画"
          git push origin HEAD:agent/c1-facility-artwork
