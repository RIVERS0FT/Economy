name: Apply C1 Facility Artwork

on:
  push:
    branches:
      - agent/c1-facility-artwork

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/c1-facility-artwork
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.4.0
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pillow==11.3.0
          npm ci

      - name: Redraw C1 facility artwork
        run: |
          set -euo pipefail
          python .agent/redraw-c1-facilities.py
          git apply --check .agent/c1-facility-artwork.patch
          git apply --whitespace=fix .agent/c1-facility-artwork.patch

      - name: Build
        run: |
          set -euo pipefail
          npm run build

      - name: Install Chromium
        run: |
          set -euo pipefail
          npx playwright install --with-deps chromium

      - name: Run browser tests
        run: |
          set -euo pipefail
          npm run test:browser

      - name: Commit generated implementation
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/UI_DESIGN_SYSTEM.md \
            scripts/verify-facility-artwork.mjs \
            scripts/facility-artwork-baseline.json \
            src/assets/facility-icons/farm.png \
            src/assets/facility-icons/orchard.png \
            src/assets/facility-icons/ranch.png \
            src/assets/facility-icons/fishery.png
          git diff --cached --check
          git commit -m "重绘 C1 工厂场景插画"
          git push origin HEAD:agent/c1-facility-artwork
