name: Patch login session fast path

on:
  push:
    branches:
      - fix/login-session-fast-path
    paths:
      - .github/workflows/patch-login-session-fast-path.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/login-session-fast-path
          fetch-depth: 0
      - name: Apply source, test, verifier and design changes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text()

          def write(path, text):
              Path(path).write_text(text)

          def replace_once(path, old, new):
              text = read(path)
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one replacement, found {count}: {old[:120]!r}')
              write(path, text.replace(old, new, 1))

          # Client auth errors expose status for the root authentication state machine.
          replace_once(
              'src/api/auth.ts',
              'class ApiRequestError extends Error {',
              'export class ApiRequestError extends Error {',
          )
          replace_once(
              'src/api/auth.ts',
              "}\n\nfunction createIdempotencyKey(prefix: string) {",
              "}\n\nexport function isUnauthorizedApiError(reason: unknown) {\n  return reason instanceof ApiRequestError && reason.status === 401;\n}\n\nfunction createIdempotencyKey(prefix: string) {",
          )

          app = r'''import { lazy, Suspense, useCallback, useEffect, useLayoutEffect, useState } from 'react';
          import {
            ApiRequestError,
            getCurrentUser,
            initializeEconomySession,
            isUnauthorizedApiError,
            type EconomySessionResponse,
          } from '../api/auth';
          import { ApplicationLoadingState } from '../components/system/ApplicationLoadingState';
          import { RefreshPageButton } from '../components/system/RefreshPageButton';
          import { Button } from '../components/ui/layout';
          import type {
            FinancialBackdropTone,
            FinancialBackdropVariant,
          } from '../components/visual/FinancialBackdrop';
          import { PhotographicStateShell } from '../components/visual/PhotographicStateShell';
          import type { AuthUser } from '../types';
          import { LoginPage } from './LoginPage';
          import '../styles/invitations.css';

          const initialAdminPath = window.location.pathname.replace(/\/+$/, '') === '/economy/admin';
          const initialLocalGamePreview = import.meta.env.DEV
            && new URLSearchParams(window.location.search).get('preview') === 'game';
          const adminAppModule = initialAdminPath ? import('./AdminApp') : null;
          const gameAppModule = initialAdminPath ? null : import('./GameApp');
          const localGamePreviewModule = initialLocalGamePreview ? import('./LocalGamePreviewApp') : null;
          const AdminApp = lazy(() => (adminAppModule ?? import('./AdminApp')).then((module) => ({ default: module.AdminApp })));
          const GameApp = lazy(() => (gameAppModule ?? import('./GameApp')).then((module) => ({ default: module.GameApp })));
          const LocalGamePreviewApp = localGamePreviewModule
            ? lazy(() => localGamePreviewModule.then((module) => ({ default: module.LocalGamePreviewApp })))
            : null;

          type AppSurface = 'loading' | 'auth' | 'game' | 'admin' | 'banned' | 'error';

          function adminSurface() {
            const path = window.location.pathname.replace(/\/+$/, '');
            if (path === '/economy/admin') return 'main';
            return null;
          }

          function stateVariantForPath(adminPath: ReturnType<typeof adminSurface>): FinancialBackdropVariant {
            return adminPath ? 'admin' : 'auth';
          }

          function invitationCodeFromLocation() {
            return new URLSearchParams(window.location.search).get('invite')?.trim().toUpperCase() || undefined;
          }

          function clearInvitationCodeFromLocation() {
            const url = new URL(window.location.href);
            if (!url.searchParams.has('invite')) return;
            url.searchParams.delete('invite');
            window.history.replaceState({}, '', `${url.pathname}${url.search}${url.hash}`);
          }

          function sessionConnectionMessage(reason: unknown) {
            if (reason instanceof ApiRequestError && reason.status >= 500 && reason.message === '请求失败') {
              return '游戏服务器暂时无法响应，请重新连接';
            }
            return reason instanceof Error ? reason.message : '无法初始化 Economy 玩家状态';
          }

          function BannedAccount({ incidentId }: { incidentId?: number }) {
            return (
              <PhotographicStateShell variant="game" tone="critical" className="banned-account-shell" role="alert">
                <section className="photographic-state-card banned-account-card">
                  <h1>账号已封禁</h1>
                  <p>该账号已被管理员封禁，普通游戏访问已暂停。</p>
                  {incidentId ? <p>事件编号：#{incidentId}</p> : null}
                  <p>如需申诉，请联系管理员并提供事件编号。</p>
                </section>
              </PhotographicStateShell>
            );
          }

          function SessionConnectionError({ message, onRetry }: { message: string; onRetry: () => void }) {
            return (
              <PhotographicStateShell variant="game" tone="critical" className="session-connection-error-shell" role="alert">
                <section className="photographic-state-card session-connection-error-card">
                  <h1>无法连接游戏服务器</h1>
                  <p>{message}</p>
                  <Button type="button" onClick={onRetry}>重新连接</Button>
                </section>
              </PhotographicStateShell>
            );
          }

          function AuthenticatedApp() {
            const [user, setUser] = useState<AuthUser | null>(null);
            const [session, setSession] = useState<EconomySessionResponse | null>(null);
            const [checking, setChecking] = useState(true);
            const [authError, setAuthError] = useState('');
            const [sessionError, setSessionError] = useState('');
            const adminPath = adminSurface();
            const sessionFailed = Boolean(user && sessionError);
            const banned = Boolean(session?.banned && !(adminPath && user?.role === 'admin'));
            const surface: AppSurface = checking
              ? 'loading'
              : !user
                ? 'auth'
                : sessionFailed
                  ? 'error'
                  : banned
                    ? 'banned'
                    : adminPath
                      ? 'admin'
                      : 'game';
            const backdrop: FinancialBackdropVariant = checking
              ? stateVariantForPath(adminPath)
              : !user
                ? 'auth'
                : adminPath
                  ? 'admin'
                  : 'game';
            const tone: FinancialBackdropTone = sessionFailed
              || banned
              || Boolean(user && adminPath && user.role !== 'admin')
              ? 'critical'
              : 'normal';
            const inviteCode = invitationCodeFromLocation();
            const handleSignedOut = useCallback(() => {
              setUser(null);
              setSession(null);
              setSessionError('');
              setAuthError('');
            }, []);

            useLayoutEffect(() => {
              document.documentElement.dataset.appSurface = surface;
              document.documentElement.dataset.appBackdrop = backdrop;
              document.documentElement.dataset.appTone = tone;
            }, [backdrop, surface, tone]);

            useEffect(() => {
              let cancelled = false;
              void (async () => {
                try {
                  const currentUser = await getCurrentUser();
                  if (!currentUser || cancelled) return;
                  setUser(currentUser);
                  try {
                    const nextSession = await initializeEconomySession(inviteCode);
                    if (cancelled) return;
                    setSession(nextSession);
                    setSessionError('');
                    clearInvitationCodeFromLocation();
                  } catch (reason) {
                    if (cancelled) return;
                    if (isUnauthorizedApiError(reason)) {
                      setUser(null);
                      setSession(null);
                      setAuthError('登录状态已失效，请重新登录');
                    } else {
                      setSessionError(sessionConnectionMessage(reason));
                    }
                  }
                } catch (reason) {
                  if (!cancelled) setAuthError(reason instanceof Error ? reason.message : '账号服务不可用');
                } finally {
                  if (!cancelled) setChecking(false);
                }
              })();
              return () => { cancelled = true; };
            }, []);

            async function connectAuthenticatedUser(nextUser: AuthUser) {
              setUser(nextUser);
              setSession(null);
              setChecking(true);
              setAuthError('');
              setSessionError('');
              try {
                const nextSession = await initializeEconomySession(inviteCode);
                setSession(nextSession);
                clearInvitationCodeFromLocation();
              } catch (reason) {
                if (isUnauthorizedApiError(reason)) {
                  setUser(null);
                  setSession(null);
                  setAuthError('登录状态已失效，请重新登录');
                } else {
                  setSessionError(sessionConnectionMessage(reason));
                }
              } finally {
                setChecking(false);
              }
            }

            async function authenticated(nextUser: AuthUser) {
              await connectAuthenticatedUser(nextUser);
            }

            if (checking) {
              return (
                <ApplicationLoadingState>
                  正在连接服务器…
                </ApplicationLoadingState>
              );
            }
            if (!user) {
              return (
                <>
                  <LoginPage inviteCode={inviteCode} onAuthenticated={authenticated} />
                  {authError ? (
                    <div className="auth-service-warning" role="alert">
                      <span>{authError}</span>
                      <RefreshPageButton />
                    </div>
                  ) : null}
                </>
              );
            }
            if (sessionError || !session) {
              return (
                <SessionConnectionError
                  message={sessionError || 'Economy 会话尚未建立'}
                  onRetry={() => { void connectAuthenticatedUser(user); }}
                />
              );
            }
            if (banned) return <BannedAccount incidentId={session.incidentId} />;
            return (
              <Suspense
                fallback={(
                  <ApplicationLoadingState>
                    正在连接服务器…
                  </ApplicationLoadingState>
                )}
              >
                {adminPath === 'main'
                  ? <AdminApp user={user} />
                  : <GameApp user={user} onSignedOut={handleSignedOut} />}
              </Suspense>
            );
          }

          export default function App() {
            if (LocalGamePreviewApp) {
              return (
                <Suspense fallback={<ApplicationLoadingState>正在加载本地免登录游戏…</ApplicationLoadingState>}>
                  <LocalGamePreviewApp />
                </Suspense>
              );
            }
            return <AuthenticatedApp />;
          }
          '''
          app = '\n'.join(line[10:] if line.startswith('          ') else line for line in app.splitlines()) + '\n'
          write('src/app/App.tsx', app)

          # Existing profiles can determine whether the session is read-only or metadata-only without loading world state.
          replace_once(
              'server/src/invitations.js',
              "  ensureInviteCode(userId, now = Date.now()) {\n    return this.store.transaction(() => this.ensureInviteCodeInTransaction(userId, now));\n  }\n\n  activeBan(userId) {",
              "  ensureInviteCode(userId, now = Date.now()) {\n    return this.store.transaction(() => this.ensureInviteCodeInTransaction(userId, now));\n  }\n\n  hasInviteCode(userId) {\n    return Boolean(this.selectInviteCodeByUser.get(Number(userId)));\n  }\n\n  activeBan(userId) {",
          )

          old_session = """  initializeSession({ user, ipFingerprint, inviteCode, requestKey, now = Date.now() }) {
            const existing = this.selectRegistrationByUser.get(Number(user.id));
            let result;
            if (existing) {
              this.invitations.ensureInviteCode(user.id, now);
              result = { playerCreated: false, repeated: true, invalidInvite: Boolean(inviteCode) };
            } else {
              result = this.store.transaction(() => this.ensurePlayerRegistrationInTransaction({
                user,
                ipFingerprint,
                source: 'homepage_session',
                inviteCode,
                invitationSource: 'share_link',
                invitationRequestKey: requestKey,
                now,
              }));
            }
            const ban = this.invitations.activeBan(user.id);
            return {
              playerCreated: Boolean(result.playerCreated),
              banned: Boolean(ban),
              incidentId: ban ? Number(ban.incident_id) : undefined,
              invitationBound: Boolean(result.relation),
              invalidInvite: Boolean(result.invalidInvite),
              anomalyIncidentId: result.anomalyIncidentId,
            };
          }
          """
          old_session = '\n'.join(line[10:] if line.startswith('          ') else line for line in old_session.splitlines()) + '\n'
          new_session = """  sessionBootstrapMode(userId) {
            const normalizedUserId = Number(userId);
            if (!this.selectRegistrationByUser.get(normalizedUserId)) return 'profile-create';
            return this.invitations.hasInviteCode(normalizedUserId) ? 'existing' : 'metadata-repair';
          }

          readExistingSession({ user, inviteCode }) {
            if (!this.selectRegistrationByUser.get(Number(user.id))) {
              throw httpError('Economy 玩家档案尚未创建', 409);
            }
            const ban = this.invitations.activeBan(user.id);
            return {
              playerCreated: false,
              banned: Boolean(ban),
              incidentId: ban ? Number(ban.incident_id) : undefined,
              invitationBound: false,
              invalidInvite: Boolean(inviteCode),
            };
          }

          initializeSession({ user, ipFingerprint, inviteCode, requestKey, now = Date.now() }) {
            const existing = this.selectRegistrationByUser.get(Number(user.id));
            if (existing) {
              this.invitations.ensureInviteCode(user.id, now);
              return this.readExistingSession({ user, inviteCode });
            }
            const result = this.store.transaction(() => this.ensurePlayerRegistrationInTransaction({
              user,
              ipFingerprint,
              source: 'homepage_session',
              inviteCode,
              invitationSource: 'share_link',
              invitationRequestKey: requestKey,
              now,
            }));
            const ban = this.invitations.activeBan(user.id);
            return {
              playerCreated: Boolean(result.playerCreated),
              banned: Boolean(ban),
              incidentId: ban ? Number(ban.incident_id) : undefined,
              invitationBound: Boolean(result.relation),
              invalidInvite: Boolean(result.invalidInvite),
              anomalyIncidentId: result.anomalyIncidentId,
            };
          }
          """
          new_session = '\n'.join(line[10:] if line.startswith('          ') else line for line in new_session.splitlines()) + '\n'
          replace_once('server/src/registration-store.js', old_session, new_session)

          replace_once(
              'server/src/app.js',
              "const userWriteOptions = (user, operation) => ({\n  actor: `user:${Number(user.id)}`,\n  operation,\n});",
              "const userWriteOptions = (user, operation) => ({\n  actor: `user:${Number(user.id)}`,\n  operation,\n});\nconst sessionMetadataWriteOptions = (user) => ({\n  actor: `system:session-metadata:${Number(user.id)}`,\n  operation: 'session-metadata-repair',\n});",
          )
          old_route = """    if (method === 'POST' && path === '/api/game/session') {
              const requestKey = requireIdempotencyKey(request);
              const body = await readJson(request);
              const session = await enqueueAuthoritativeWrite(userWriteOptions(user, 'session-initialization'), () => (
                registrationStore.initializeSession({
                  user,
                  ipFingerprint: registrationIpFingerprint(request),
                  inviteCode: body.inviteCode,
                  requestKey,
                })
              ));
              sendJson(response, 200, session);
              return;
            }
          """
          old_route = '\n'.join(line[10:] if line.startswith('          ') else line for line in old_route.splitlines()) + '\n'
          new_route = """    if (method === 'POST' && path === '/api/game/session') {
              const requestKey = requireIdempotencyKey(request);
              const body = await readJson(request);
              const sessionMode = registrationStore.sessionBootstrapMode(user.id);
              const startedAt = Date.now();
              const queueAtStart = store.getAuthoritativeWriteDiagnostics();
              try {
                const session = sessionMode === 'existing'
                  ? registrationStore.readExistingSession({ user, inviteCode: body.inviteCode })
                  : await enqueueAuthoritativeWrite(
                    sessionMode === 'metadata-repair'
                      ? sessionMetadataWriteOptions(user)
                      : userWriteOptions(user, 'session-profile-creation'),
                    () => registrationStore.initializeSession({
                      user,
                      ipFingerprint: registrationIpFingerprint(request),
                      inviteCode: body.inviteCode,
                      requestKey,
                    }),
                  );
                sendJson(response, 200, session);
              } finally {
                const totalMs = Math.max(0, Date.now() - startedAt);
                if (totalMs >= 1_000) {
                  console.warn('ECONOMY_SESSION_SLOW', JSON.stringify({
                    sessionMode,
                    totalMs,
                    queueDepth: Number(queueAtStart.queueDepth || 0),
                    queueRunning: Boolean(queueAtStart.running),
                  }));
                }
              }
              return;
            }
          """
          new_route = '\n'.join(line[10:] if line.startswith('          ') else line for line in new_route.splitlines()) + '\n'
          replace_once('server/src/app.js', old_route, new_route)

          signals = r'''import { iterateOrderBookSide, recordOrderBookVisit } from '../order-book-runtime.js';
          import { PRICE_WINDOW_MS } from './catalog.js';
          import { clamp } from './math.js';

          export function createMarketSignalRuntime({ marketFor, isOpenOrder }) {
            let planningCache = null;

            function activePlanningCache(world, now = null) {
              if (!planningCache || planningCache.world !== world) return null;
              if (now !== null && planningCache.now !== Number(now)) return null;
              return planningCache;
            }

            function beginPlanningCache(world, now) {
              planningCache = {
                world,
                now: Number(now),
                tradeStats: new Map(),
                quotes: new Map(),
              };
            }

            function endPlanningCache(world) {
              if (!world || planningCache?.world === world) planningCache = null;
            }

            function realTradeStats(world, productId, now, windowMs = PRICE_WINDOW_MS, provinceId) {
              const cache = activePlanningCache(world, now);
              const cacheKey = `${String(provinceId || '')}:${String(productId || '')}:${Number(windowMs)}`;
              if (cache?.tradeStats.has(cacheKey)) return cache.tradeStats.get(cacheKey);
              const points = (marketFor(world, productId, now, provinceId).priceHistory || []).filter((point) => (
                Number(point.createdAt || 0) >= now - windowMs
                && (point.takerSide === 'buy' || point.takerSide === 'sell')
                && Number(point.quantity || 0) > 0
                && Number(point.price || 0) > 0
              ));
              const weightedQuantity = (point) => Number(point.quantity) * clamp(0, 1, Number(point.signalWeight ?? 1));
              const summarize = (selected) => {
                const quantity = selected.reduce((sum, point) => sum + weightedQuantity(point), 0);
                const value = selected.reduce((sum, point) => sum + weightedQuantity(point) * Number(point.price), 0);
                const netActive = selected.reduce((sum, point) => (
                  sum + weightedQuantity(point) * (point.takerSide === 'buy' ? 1 : -1)
                ), 0);
                return { quantity, value, netActive, vwap: quantity > 0 ? value / quantity : null };
              };
              const all = summarize(points);
              const player = summarize(points.filter((point) => point.marketRole === 'player'));
              const consumption = summarize(points.filter((point) => point.marketRole === 'consumption'));
              const liquidity = summarize(points.filter((point) => point.marketRole === 'liquidity'));
              const result = {
                ...all,
                playerQuantity: player.quantity,
                playerValue: player.value,
                playerNetActive: player.netActive,
                consumptionQuantity: consumption.quantity,
                consumptionValue: consumption.value,
                liquidityQuantity: liquidity.quantity,
                liquidityValue: liquidity.value,
              };
              cache?.tradeStats.set(cacheKey, result);
              return result;
            }

            function orderBookQuote(world, product, depth, referencePrice, provinceId) {
              const cache = activePlanningCache(world);
              const cacheKey = `${String(provinceId || '')}:${product.id}:${Number(depth)}:${Number(referencePrice)}`;
              if (cache?.quotes.has(cacheKey)) return cache.quotes.get(cacheKey);
              const asks = iterateOrderBookSide(world, {
                provinceId,
                assetKind: 'commodity',
                assetId: product.id,
                side: 'sell',
              });
              const targetDepth = Math.max(1, Math.ceil(depth));
              let remaining = targetDepth;
              let available = 0;
              let cost = 0;
              let fallbackPrice = referencePrice;
              let visited = 0;
              for (const ask of asks) {
                visited += 1;
                if (remaining <= 0) break;
                if (ask.ownerType !== 'player' || !isOpenOrder(ask)) continue;
                const quantity = Math.min(remaining, Math.max(0, Number(ask.remaining || 0)));
                if (quantity <= 0) continue;
                fallbackPrice = Math.max(fallbackPrice, Number(ask.price || referencePrice));
                cost += quantity * Number(ask.price || referencePrice);
                available += quantity;
                remaining -= quantity;
              }
              recordOrderBookVisit(world, visited);
              const result = available === 0
                ? { quote: referencePrice, available: 0, coverage: 0 }
                : {
                  quote: Math.max(1, (cost + (remaining > 0 ? remaining * fallbackPrice : 0)) / targetDepth),
                  available,
                  coverage: clamp(0, 1, available / targetDepth),
                };
              cache?.quotes.set(cacheKey, result);
              return result;
            }

            function effectivePrice(world, product, depth, priceState, now, provinceId) {
              const referencePrice = Math.max(0.01, Number(priceState?.referencePrice || product.basePrice));
              const quote = orderBookQuote(world, product, depth, referencePrice, provinceId);
              const trades = realTradeStats(world, product.id, now, PRICE_WINDOW_MS, provinceId);
              const vwap = trades.vwap === null ? referencePrice : trades.vwap;
              return {
                ...quote,
                vwap,
                effective: 0.50 * quote.quote + 0.30 * referencePrice + 0.20 * vwap,
                referencePrice,
              };
            }

            return {
              realTradeStats,
              orderBookQuote,
              effectivePrice,
              beginPlanningCache,
              endPlanningCache,
            };
          }
          '''
          signals = '\n'.join(line[10:] if line.startswith('          ') else line for line in signals.splitlines()) + '\n'
          write('server/src/market-demand/signals.js', signals)

          replace_once('server/src/market-demand.js', '  function processGroup(world, groupId, now) {', '  function processGroup(world, groupId, now, suppliedProvinceWeights = null) {')
          replace_once('server/src/market-demand.js', '    const provinceWeights = populationDemandProvinceWeights(world);', '    const provinceWeights = suppliedProvinceWeights || populationDemandProvinceWeights(world);')
          replace_once('server/src/market-demand.js', '    for (const modelId of POPULATION_MODEL_IDS) {', '    signals.beginPlanningCache(world, now);\n    try {\n      for (const modelId of POPULATION_MODEL_IDS) {')
          replace_once(
              'server/src/market-demand.js',
              "      }\n    }\n\n    materializeChoices(world, group, state, cycleId, now, demandPlans, totals, allocations);",
              "      }\n    }\n    } finally {\n      signals.endPlanningCache(world);\n    }\n\n    materializeChoices(world, group, state, cycleId, now, demandPlans, totals, allocations);",
          )
          replace_once(
              'server/src/market-demand.js',
              "    for (const group of MARKET_DEMAND_GROUP_CATALOG) {\n      if (now >= Number(world.marketDemand.groups[group.id].nextDemandAt)) processGroup(world, group.id, now);\n    }",
              "    let provinceWeights = null;\n    for (const group of MARKET_DEMAND_GROUP_CATALOG) {\n      if (now < Number(world.marketDemand.groups[group.id].nextDemandAt)) continue;\n      provinceWeights ||= populationDemandProvinceWeights(world);\n      processGroup(world, group.id, now, provinceWeights);\n    }",
          )

          # Server tests lock the read-only existing-session path and a full 48-state demand budget.
          replace_once(
              'server/test/invitations.test.js',
              "  constructor() {\n    this.database = new DatabaseSync(':memory:');",
              "  constructor() {\n    this.loadWorldCalls = 0;\n    this.database = new DatabaseSync(':memory:');",
          )
          replace_once(
              'server/test/invitations.test.js',
              "  loadWorld(now) {\n    const row = this.database.prepare('SELECT revision, state_json FROM economy_world WHERE id = 1').get();",
              "  loadWorld(now) {\n    this.loadWorldCalls += 1;\n    const row = this.database.prepare('SELECT revision, state_json FROM economy_world WHERE id = 1').get();",
          )
          replace_once(
              'server/test/invitations.test.js',
              "    const before = context.store.loadWorld(now + 2);\n\n    const result = context.registrationStore.initializeSession({\n      user: user(2),\n      ipFingerprint: 'ip-two',\n      inviteCode,\n      requestKey: 'existing-session-invite-0001',\n      now: now + 3,\n    });\n\n    assert.equal(result.playerCreated, false);",
              "    const before = context.store.loadWorld(now + 2);\n    context.store.loadWorldCalls = 0;\n    assert.equal(context.registrationStore.sessionBootstrapMode(2), 'existing');\n\n    const result = context.registrationStore.readExistingSession({\n      user: user(2),\n      inviteCode,\n    });\n\n    assert.equal(context.store.loadWorldCalls, 0);\n    assert.equal(result.playerCreated, false);",
          )

          state_test = read('server/test/state-economic-baselines.test.js')
          if "full 48-state population demand cycle stays below the server timeout budget" not in state_test:
              state_test += r'''

          test('full 48-state population demand cycle stays below the server timeout budget', () => {
            const world = createWorld(NOW + 60_000);
            let userId = 2_000;
            for (const province of PROVINCE_CATALOG) {
              const player = ensurePlayer(world, { id: userId, name: province.shortName }, NOW + 60_000, { migrate: false });
              Object.assign(player, {
                startingProvinceId: province.id,
                startingProvinceChosen: true,
                unlockedProvinces: [province.id],
              });
              userId += 1;
            }

            assert.equal(activePopulationDemandProvinceIds(world).length, 48);
            const startedAt = performance.now();
            processMarketDemand(world, NOW + 60_000);
