name: Apply unified application atmosphere

on:
  push:
    branches:
      - codex/unify-application-atmosphere-auth-style

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: codex/unify-application-atmosphere-auth-style
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.4.0
          cache: npm

      - name: Apply approved atmosphere change
        run: node scripts/apply-unified-atmosphere.mjs

      - name: Remove one-off automation
        run: rm .github/workflows/apply-unified-atmosphere.yml scripts/apply-unified-atmosphere.mjs

      - name: Install dependencies
        run: npm ci

      - name: Verify architecture and build
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build-test.log

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify browser runtime
        shell: bash
        run: |
          set -o pipefail
          npm run test:browser 2>&1 | tee browser-test.log

      - name: Check patch cleanliness
        run: |
          git diff --check
          git status --short

      - name: Commit verified change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            src/styles/financial-backdrop.css \
            docs/REGISTRATION_INVITE_FLOW_DESIGN.md \
            docs/LIQUID_GLASS_CHROME_DESIGN.md \
            scripts/verify-game-three-layer.mjs \
            tests/browser/application-atmosphere-consistency.spec.ts \
            .github/workflows/apply-unified-atmosphere.yml \
            scripts/apply-unified-atmosphere.mjs
          git commit -m "统一全应用摄影氛围"
          git push origin HEAD:codex/unify-application-atmosphere-auth-style

# Existing-workflow trigger commit.
