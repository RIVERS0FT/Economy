name: Apply Admin Server Trend Rules

on:
  push:
    branches:
      - fix/admin-server-trend-ranges

permissions:
  contents: write

concurrency:
  group: apply-admin-server-trend-rules
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact document and verification updates
        run: python3 scripts/.tmp-apply-admin-server-trends.py

      - name: Commit generated updates
        run: |
          set -euo pipefail
          if git diff --quiet -- docs/GIFT_CODE_AND_ADMIN_DESIGN.md scripts/verify-admin-navigation.mjs; then
            echo "No generated updates remain."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/GIFT_CODE_AND_ADMIN_DESIGN.md scripts/verify-admin-navigation.mjs
          git commit -m "更新服务器趋势设计与防回退"
          git push origin HEAD:fix/admin-server-trend-ranges
