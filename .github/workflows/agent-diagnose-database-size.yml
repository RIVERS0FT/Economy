name: Diagnose Economy database size

on:
  push:
    branches:
      - agent/database-size-diagnostic

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure SSH
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SERVER_PORT" "$SERVER_HOST" >> ~/.ssh/known_hosts
      - name: Collect read-only SQLite report
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" \
            'if [ "$(id -u)" -eq 0 ]; then exec python3 -; elif command -v sudo >/dev/null 2>&1 && sudo -n true; then exec sudo -n python3 -; else echo ECONOMY_DIAGNOSTIC_PRIVILEGES_UNAVAILABLE >&2; exit 1; fi' \
            > database-size-diagnostic.txt <<'PYTHON'
          import datetime
          import os
          import sqlite3
          from pathlib import Path

          database = Path('/var/lib/riversoft-economy/economy.sqlite')
          connection = sqlite3.connect(f'file:{database}?mode=ro', uri=True, timeout=30)
          connection.execute('PRAGMA query_only = ON')

          def scalar(sql, parameters=()):
              row = connection.execute(sql, parameters).fetchone()
              return None if row is None else row[0]

          def print_section(title):
              print(f'\n=== {title} ===')

          print_section('FILES')
          for path in [database, Path(f'{database}-wal'), Path(f'{database}-shm')]:
              print(f'{path.name}\t{path.stat().st_size if path.exists() else 0}')

          print_section('PRAGMAS')
          for pragma in ['page_size', 'page_count', 'freelist_count', 'auto_vacuum', 'journal_mode', 'schema_version', 'user_version']:
              print(f'{pragma}\t{scalar(f"PRAGMA {pragma}")}')

          print_section('DATABASE_TOTALS')
          page_size = int(scalar('PRAGMA page_size') or 0)
          page_count = int(scalar('PRAGMA page_count') or 0)
          freelist_count = int(scalar('PRAGMA freelist_count') or 0)
          print(f'allocated_bytes\t{page_size * page_count}')
          print(f'freelist_bytes\t{page_size * freelist_count}')
          print(f'live_page_bytes\t{page_size * max(0, page_count - freelist_count)}')

          print_section('DBSTAT_BY_OBJECT')
          try:
              rows = connection.execute('''
                SELECT name,
                       SUM(pgsize) AS bytes,
                       COUNT(*) AS pages,
                       SUM(payload) AS payload_bytes,
                       SUM(unused) AS unused_bytes
                FROM dbstat
                GROUP BY name
                ORDER BY bytes DESC, name
              ''').fetchall()
              for name, size, pages, payload, unused in rows:
                  print(f'{name}\tbytes={size}\tpages={pages}\tpayload={payload}\tunused={unused}')
          except sqlite3.Error as error:
              print(f'DBSTAT_UNAVAILABLE\t{error}')

          tables = [row[0] for row in connection.execute('''
            SELECT name FROM sqlite_schema
            WHERE type = 'table' AND name NOT LIKE 'sqlite_%'
            ORDER BY name
          ''')]

          print_section('TABLE_ROW_COUNTS')
          for table in tables:
              quoted = '"' + table.replace('"', '""') + '"'
              try:
                  count = scalar(f'SELECT COUNT(*) FROM {quoted}')
                  print(f'{table}\t{count}')
              except sqlite3.Error as error:
                  print(f'{table}\tERROR={error}')

          print_section('KNOWN_TEXT_PAYLOADS')
          payload_queries = [
              ('economy_world', 'state_json'),
              ('economy_contract_audit_contracts', 'contract_json'),
              ('economy_contract_audit_events', 'before_json'),
              ('economy_contract_audit_events', 'after_json'),
              ('economy_contract_audit_events', 'metadata_json'),
          ]
          table_set = set(tables)
          for table, column in payload_queries:
              if table not in table_set:
                  continue
              columns = {row[1] for row in connection.execute(f'PRAGMA table_info("{table}")')}
              if column not in columns:
                  continue
              result = connection.execute(
                  f'SELECT COUNT(*), COALESCE(SUM(LENGTH("{column}")), 0), '
                  f'COALESCE(AVG(LENGTH("{column}")), 0), COALESCE(MAX(LENGTH("{column}")), 0) '
                  f'FROM "{table}"'
              ).fetchone()
              print(f'{table}.{column}\trows={result[0]}\ttotal={result[1]}\tavg={result[2]:.2f}\tmax={result[3]}')

          if 'economy_world' in table_set:
              print_section('WORLD_ROW')
              row = connection.execute('SELECT revision, LENGTH(state_json), updated_at FROM economy_world WHERE id = 1').fetchone()
              if row:
                  updated = datetime.datetime.fromtimestamp(row[2] / 1000, datetime.timezone.utc).isoformat() if row[2] else None
                  print(f'revision\t{row[0]}')
                  print(f'state_json_bytes\t{row[1]}')
                  print(f'updated_at_utc\t{updated}')

          if 'economy_contract_audit_events' in table_set:
              print_section('CONTRACT_EVENT_TYPES')
              for event_type, count, first_at, last_at in connection.execute('''
                SELECT event_type, COUNT(*), MIN(occurred_at), MAX(occurred_at)
                FROM economy_contract_audit_events
                GROUP BY event_type
                ORDER BY COUNT(*) DESC, event_type
              '''):
                  print(f'{event_type}\tcount={count}\tfirst={first_at}\tlast={last_at}')

              print_section('CONTRACT_EVENT_TRIGGER_TYPES')
              for trigger_type, count in connection.execute('''
                SELECT trigger_type, COUNT(*)
                FROM economy_contract_audit_events
                GROUP BY trigger_type
                ORDER BY COUNT(*) DESC, trigger_type
              '''):
                  print(f'{trigger_type}\t{count}')

              print_section('CONTRACT_EVENTS_BY_DAY')
              for day, count in connection.execute('''
                SELECT date(occurred_at / 1000, 'unixepoch'), COUNT(*)
                FROM economy_contract_audit_events
                GROUP BY date(occurred_at / 1000, 'unixepoch')
                ORDER BY day DESC
                LIMIT 30
              '''):
                  print(f'{day}\t{count}')

          print_section('INDEX_LIST')
          for row in connection.execute('''
            SELECT name, tbl_name, sql
            FROM sqlite_schema
            WHERE type = 'index' AND name NOT LIKE 'sqlite_%'
            ORDER BY tbl_name, name
          '''):
              print(f'{row[0]}\ttable={row[1]}')

          connection.close()
          PYTHON
      - name: Commit diagnostic report
        run: |
          set -euo pipefail
          rm -f .github/workflows/agent-diagnose-database-size.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "记录只读数据库容量诊断"
          git push origin HEAD:agent/database-size-diagnostic
