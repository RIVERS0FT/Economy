name: Agent client recipe compatibility

on:
  push:
    branches:
      - agent/factory-production-methods

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/factory-production-methods
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Preserve client recipe compatibility
        run: node scripts/agent-preserve-client-recipe-compatibility.mjs
      - name: Commit compatibility and remove one-time files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -- .github/workflows/agent-client-recipe-compatibility.yml scripts/agent-preserve-client-recipe-compatibility.mjs
          git add -- \
            server/src/facility-groups.js \
            src/pages/production/ProductionFacilityDetail.tsx \
            docs/SERVER_ARCHITECTURE_AND_DEPLOYMENT_DESIGN.md
          git commit -m "fix: preserve client recipe compatibility"
          git push origin HEAD:agent/factory-production-methods
