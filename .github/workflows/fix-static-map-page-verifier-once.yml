name: Fix static map page verifier once

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'codex/static-svg-map-camera'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/static-svg-map-camera
          fetch-depth: 0
      - name: Align mobile map page verifier wording
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/verify-provincial-economy.mjs')
          text = path.read_text(encoding='utf-8')
          old = "  '不大于 `720px` 时地图 Tooltip 必须禁用并隐藏',"
          new = "  '不大于 `720px` 时镜头栏和地图 Tooltip 必须隐藏',"
          if text.count(old) != 1:
              raise SystemExit(f'expected one mobile page verifier phrase, got {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git rm .github/workflows/fix-static-map-page-verifier-once.yml
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/verify-provincial-economy.mjs
          git commit -m "对齐移动静态地图页面验证术语"
          git push origin HEAD:codex/static-svg-map-camera
