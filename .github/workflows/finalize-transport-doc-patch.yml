name: Finalize transport design patch

on:
  push:
    branches:
      - transport-client-node-logistics

permissions:
  contents: write

concurrency:
  group: finalize-transport-design-patch
  cancel-in-progress: false

jobs:
  patch-docs:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply remaining transport document edits
        run: node scripts/finalize-transport-doc-patch.mjs
      - name: Remove one-shot migration files
        run: |
          rm scripts/finalize-transport-doc-patch.mjs
          rm .github/workflows/finalize-transport-doc-patch.yml
      - name: Commit final transport design cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/PAGE_CONTENT_AND_NAVIGATION_DESIGN.md scripts/verify-provincial-unlock-transport.mjs scripts/finalize-transport-doc-patch.mjs .github/workflows/finalize-transport-doc-patch.yml
          git diff --cached --check
          git commit -m '清理运输旧规则残留'
          git push origin HEAD:transport-client-node-logistics
