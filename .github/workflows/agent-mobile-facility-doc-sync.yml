              '- 移动详情悬浮框不显示顶部关闭按钮；对话框容器承担初始焦点，点击遮罩、按 `Escape` 和有效向下拖动共用向下收起与遮罩淡出动画，关闭后焦点返回触发卡。移动详情使用 `SignedInShell` 的根级 Dialog 层覆盖完整视口并位于状态栏与底部导航之上，普通 Tooltip／Popover 仍使用工作区安全浮层根。',
