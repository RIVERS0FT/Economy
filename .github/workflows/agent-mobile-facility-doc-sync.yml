name: Agent mobile facility detail sync

on:
  push:
    branches:
      - agent/mobile-facility-detail-layer-fix

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update authoritative design and regression gates
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one replacement, found {count}: {old[:120]!r}')
              target.write_text(text.replace(old, new), encoding='utf-8')

          def require(path: str, text: str) -> None:
              if text not in Path(path).read_text(encoding='utf-8'):
                  raise SystemExit(f'{path}: missing required text: {text}')

          page_path = 'docs/PAGE_CONTENT_AND_NAVIGATION_DESIGN.md'
          replace(page_path, '> 更新时间：2026-08-02', '> 更新时间：2026-08-03')
          old_page_methods = '''## 生产页作业制度

- 生产页工厂详情把基础配方与作业制度放在同一个“生产配置”区。基础配方与作业制度都使用统一下拉选择控件，不得把作业制度恢复为选择卡、按钮组或独立弹窗。
- 作业制度下拉选项显示方式名称；控件下方必须显示当前所选方式的说明，以及该基础配方对应的周期、单周期产出和周期成本。页面效果预览、真实价格利润和生产公式必须读取服务器返回的变体数值。
- 运行中改变任一配置时显示“下一周期切换”为目标基础配方与生产方式，当前周期内容保持不变；一次操作必须提交完整目标变体，不得先后发送两个会形成中间状态的请求。
- 桌面详情和移动底部详情必须共用同一生产配置组件、相同下拉选中状态与相同下一周期语义。
'''
          new_page_methods = '''## 生产页作业制度

- 生产页工厂详情把基础配方与作业制度放在同一个“生产设置”区。基础配方与作业制度都使用统一富内容下拉选择控件，不得把作业制度恢复为选择卡、按钮组或独立弹窗。
- 正常移动宽度下“生产产物”与“作业制度”必须保持同一行双列，包括 `320px`、`390px` 和不大于 `479px` 的详情正文；长名称在触发器中省略，但完整名称必须保留在选项和无障碍名称中，不得恢复移动端单列堆叠。
- 作业制度下拉选项显示方式 Icon 与名称；控件下方只显示该基础配方对应的周期、单周期产出和周期成本，不显示作业制度说明，也不得重复当前制度名称。页面效果预览、真实价格利润和生产公式必须读取服务器返回的变体数值。
- 工厂详情正文固定在生产设置之前显示当前工厂场景插画和满员率状态带；桌面详情与移动底部详情共用同一正文组件，移动端不得遗漏满员率百分比、方向、进度条或周期等效产能说明。
- 移动底部详情使用登录态根级业务 Dialog 层并遮罩完整视口，必须位于移动状态栏和底部导航之上；生产设置的富内容列表继续 Portal 到同一根层并位于详情遮罩之上。
- 运行中改变任一配置时显示“下一周期切换”为目标基础配方与生产方式，当前周期内容保持不变；一次操作必须提交完整目标变体，不得先后发送两个会形成中间状态的请求。
- 桌面详情和移动底部详情必须共用同一生产设置组件、相同下拉选中状态与相同下一周期语义。
'''
          replace(page_path, old_page_methods, new_page_methods)

          industry_path = 'docs/INDUSTRY_AND_PRODUCTION_DESIGN.md'
          replace(industry_path, '> 更新时间：2026-08-02', '> 更新时间：2026-08-03')
          replace(
              industry_path,
              '- 详情显示工厂名称和总数量、运行开关、完整状态、“运行中／下一周期加入／冻结中／抵押中”四列摘要、紧凑满员率状态、生产设置、生产结算和市场入口。玩家可见生产设置包含“生产产物”与“作业制度”，底层仍提交服务器正式配方 ID；生产结算包含集群生产公式、生产进度和单厂平均利润／分钟。满员率不得替换或扩成第五项数量摘要。',
              '- 详情显示工厂名称和总数量、运行开关、完整状态、“运行中／下一周期加入／冻结中／抵押中”四列摘要、当前工厂场景插画、紧凑满员率状态、生产设置、生产结算和市场入口。玩家可见生产设置包含“生产产物”与“作业制度”，底层仍提交服务器正式配方 ID；生产结算包含集群生产公式、生产进度和单厂平均利润／分钟。场景插画、满员率、生产设置与生产结算必须属于桌面和移动共用的同一详情正文；满员率不得替换或扩成第五项数量摘要。',
          )
          replace(
              industry_path,
              '- 玩家可见“生产产物”与“作业制度”必须合并为同一个“生产设置”区；详情容器宽度大于 `479px` 时两个统一富内容下拉框并排，不大于 `479px` 时单列排列。生产产物的触发器和选项均显示产出商品 PNG 与路线名称，作业制度的触发器和选项均显示制度 Icon 与名称；两者共用共享 `RichSelectInput`，不得恢复浏览器浅色原生选项弹层。作业制度摘要只显示周期、产出、成本和说明，不得在下拉框下重复当前制度名称。',
              '- 玩家可见“生产产物”与“作业制度”必须合并为同一个“生产设置”区；桌面详情使用双列，移动 Bottom Sheet 在 `320px` 及以上同样固定双列同行，不得因详情容器不大于 `479px` 改为单列。生产产物的触发器和选项均显示产出商品 PNG 与路线名称，作业制度的触发器和选项均显示制度 Icon 与名称；两者共用共享 `RichSelectInput`，不得恢复浏览器浅色原生选项弹层。作业制度下方只显示周期、单周期产出和周期成本，不显示制度说明，也不得重复当前制度名称。',
          )
          replace(
              industry_path,
              '- 悬浮框使用“固定头部／唯一 `ScrollArea` 正文／固定底部操作区”三段结构。头部包含拖动把手、同一行内的标题与状态、运行开关和下一行三项数量摘要，不包含顶部关闭按钮；正文只包含生产设置与生产结算，生产结算内部依次包含公式、进度和单厂平均利润行；底部只包含市场入口。`src/styles/facility-detail-sheet.css` 是移动悬浮框布局、拖动反馈和固定头尾的最终 CSS 权威。',
              '- 悬浮框使用“固定头部／唯一 `ScrollArea` 正文／固定底部操作区”三段结构。头部包含拖动把手、同一行内的标题与状态、运行开关和下一行三项数量摘要，不包含顶部关闭按钮；正文依次包含当前工厂场景插画、满员率状态带、生产设置与生产结算，生产结算内部依次包含公式、进度和单厂平均利润行；底部只包含市场入口。`src/styles/facility-detail-sheet.css` 是移动悬浮框布局、拖动反馈和固定头尾的最终 CSS 权威。',
          )
          anchor = '- 悬浮框使用 `role="dialog"`、`aria-modal="true"` 和标题关联；打开后焦点进入可程序化聚焦的对话框容器，第一次 `Tab` 再进入开关、配方选择器或市场按钮，焦点始终限制在悬浮框内。`Escape`、点击遮罩或有效向下拖动可以关闭，关闭后焦点返回触发卡；该焦点只恢复语义导航位置。触摸关闭后必须恢复为仅由工厂运行状态决定的基础视觉，不得残留悬停、按压或焦点选中外观；键盘关闭后仍必须显示可见焦点。'
          replace(
              industry_path,
              anchor,
              anchor + '\n- 移动工厂详情必须 Portal 到 `SignedInShell` 的根级业务 Dialog 层，遮罩覆盖完整视口并位于移动状态栏与底部导航之上；不得退回只覆盖两者之间的 `.workspace-floating-layer`。详情内 `RichSelectInput` 的列表继续 Portal 到同一个根层，并以更高层级显示在 Sheet 与遮罩之上。',
          )
          replace(
              industry_path,
              '- 为满员率恢复独立边框／圆角／背景卡片，把生产配方与作业制度拆成两个卡片区，重复显示当前制度名称，或让单厂平均利润重新形成独立卡片；',
              '- 为满员率恢复独立边框／圆角／背景卡片，把生产产物与作业制度拆成两个卡片区或在移动端改为上下单列，重复显示当前制度名称／制度说明，遗漏工厂场景插画或满员率进度条，或让单厂平均利润重新形成独立卡片；\n- 让移动工厂详情退回工作区普通浮层、被状态栏或底部导航覆盖，或让富内容下拉列表落在详情遮罩下方；',
          )
          anchor_methods = '- 生产工资、原料扣除、仓库检查、累计产量和统计全部读取服务器解析后的当前变体；任一条件不满足时仍必须保持资金、原料和库存的原子性。'
          replace(
              industry_path,
              anchor_methods,
              anchor_methods + '\n- 作业制度下方只显示周期、单周期产出和周期成本；制度说明不属于工厂详情可见内容，不得由客户端恢复。',
          )

          ui_path = 'docs/UI_DESIGN_SYSTEM.md'
          replace(ui_path, '> 更新时间：2026-08-02', '> 更新时间：2026-08-03')
          old_rich = '`src/components/ui/FormControls.tsx` 是文本、整数、原生纯文字选择器、文本域、文件与组合输入的唯一 React 包装层；紧凑表格行内输入可以直接使用原生控件，但必须带 `.ui-control` 并遵守相同解析和状态规则。需要在收起状态和选项中显示商品图片或语义 Icon 时，必须使用共享 `RichSelectInput`，不得由业务页面自行实现下拉弹层。`RichSelectInput` 的触发器、深色列表、选项高度、圆角、悬停、选中、禁用、键盘导航、焦点返回和工作区安全浮层定位统一由 `form-controls.css` 与组件实现；生产产物使用 `ProductArtwork`，作业制度使用统一功能 Icon，不得手写 `<svg>`、`<path>`、Emoji、字符或字体图标。'
          new_rich = old_rich + ' 移动工厂详情中的生产产物与作业制度必须在同一行双列显示，作业制度说明不得显示；根级 Dialog 内的 `RichSelectInput` 列表必须复用该 Dialog 根作为安全定位边界并位于详情遮罩之上。'
          replace(ui_path, old_rich, new_rich)
          replace(
              ui_path,
              '工厂场景插画是经营模拟主视觉，用于让玩家在小尺寸下直接识别产业类型。正式源资源统一保存在 `src/assets/facility-icons/`，文件名必须与服务器 `FACILITY_TYPE_CATALOG` 的 `facilityTypeId` 一致。生产集群选择卡、市场工厂目录卡以及拍卖工厂的大型主视觉、资产矩阵、资产包行和历史图标统一通过 `FacilityIcon` 选择资源；订单表格、本地成交、银行抵押、概览挂单、导航和未知工厂继续使用紧凑 `FactoryIcon`，不得把场景插画扩散到高密度语义位置。',
              '工厂场景插画是经营模拟主视觉，用于让玩家在小尺寸下直接识别产业类型。正式源资源统一保存在 `src/assets/facility-icons/`，文件名必须与服务器 `FACILITY_TYPE_CATALOG` 的 `facilityTypeId` 一致。生产集群选择卡、当前工厂详情横幅、市场工厂目录卡以及拍卖工厂的大型主视觉、资产矩阵、资产包行和历史图标统一通过 `FacilityIcon` 选择资源；订单表格、本地成交、银行抵押、概览挂单、导航和未知工厂继续使用紧凑 `FactoryIcon`，不得把场景插画扩散到高密度语义位置。当前工厂详情横幅使用 256px 运行时缩略图、居中 `cover` 裁切和上下轻量渐变，移动端不得隐藏。',
          )
          replace(
              ui_path,
              '- 玩家可见的“生产产物”与“作业制度”使用同一个“生产设置”区和统一 `RichSelectInput`；容器宽度大于 `479px` 时双列，不大于 `479px` 时单列。生产产物的收起状态和每个选项均使用对应产出商品的 `ProductArtwork` PNG 加路线名称，作业制度的收起状态和选项使用对应统一功能 Icon 加名称；两者必须共用同一深色弹层、选项几何、键盘交互和工作区安全浮层定位。作业制度摘要不得重复显示下拉框已经选中的制度名称。',
              '- 玩家可见的“生产产物”与“作业制度”使用同一个“生产设置”区和统一 `RichSelectInput`；桌面和移动详情都固定双列同行，移动端在 `320px` 及以上不得因容器不大于 `479px` 改为单列。生产产物的收起状态和每个选项均使用对应产出商品的 `ProductArtwork` PNG 加路线名称，作业制度的收起状态和选项使用对应统一功能 Icon 加名称；两者必须共用同一深色弹层、选项几何、键盘交互和安全浮层定位。作业制度下方只显示周期、单周期产出和周期成本，作业制度说明不得显示，也不得重复下拉框已经选中的制度名称。',
