name: Sync main into daily market branch

on:
  push:
    branches:
      - codex/daily-system-market

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge current main and resolve approved overlaps
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          if git merge --no-ff origin/main -m "同步 main 最新地区访问规则"; then
            echo "main merged without conflicts"
          else
            conflicts="$(git diff --name-only --diff-filter=U)"
            expected=$'docs/PAGE_CONTENT_AND_NAVIGATION_DESIGN.md\ndocs/PRODUCT_AND_GAMEPLAY_DESIGN.md\ndocs/WAREHOUSE_EXPANSION_DESIGN.md\nscripts/verify-page-content.mjs'
            if [ "$conflicts" != "$expected" ]; then
              echo "ECONOMY_UNEXPECTED_SYNC_CONFLICTS"
              printf '%s\n' "$conflicts"
              exit 1
            fi
            git checkout --ours -- \
              docs/PAGE_CONTENT_AND_NAVIGATION_DESIGN.md \
              docs/PRODUCT_AND_GAMEPLAY_DESIGN.md \
              docs/WAREHOUSE_EXPANSION_DESIGN.md \
              scripts/verify-page-content.mjs

            python - <<'PY'
          from pathlib import Path
          import re

          def load(path):
              return Path(path).read_text(encoding='utf-8')

          def save(path, text):
              Path(path).write_text(text if text.endswith('\n') else text + '\n', encoding='utf-8')

          def replace_required(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'missing replacement anchor: {label}')
              return text.replace(old, new)

          # PRODUCT: keep daily instant-market rules, adopt #764's no-unlock/no-starting-state rules.
          path = 'docs/PRODUCT_AND_GAMEPLAY_DESIGN.md'
          text = load(path)
          old = '世界 32 固定提供美国本土连续 48 个州级经营地区，稳定 ID、中文名称、州缩写、地图英文名、中文首府名称、英文首府名称与首府经纬度以 `shared/provinces.json` 为准；默认地区 ID `110000` 保持不变并显示为加利福尼亚州。新玩家首次进入游戏必须从 48 州中选择一块起始地块并永久绑定，之后必须按目标地区水平与距永久起始州距离计算的货币费用逐个解锁其他州才能在该州提交订单／自动交易、建设或运营工厂以及使用仓库；未解锁州的地区概览仍公开官方常住人口，地区市场允许只读查看今日官方价格与真实成交行情，但不得产生任何市场写操作，建筑与仓库分区改为显示解锁信息和解锁按钮。地图选择是玩家经营上下文，不是可买卖资产或可迁移的出生地。每次建设、生产、商品订单、工厂订单、自动交易、资产拍卖和跨州运输都必须携带明确州级地区；内部协议继续使用兼容字段名 `provinceId`。'
          new = '世界 32 固定提供美国本土连续 48 个州级经营地区，稳定 ID、中文名称、州缩写、地图英文名、中文首府名称、英文首府名称与首府经纬度以 `shared/provinces.json` 为准；默认地区 ID `110000` 保持不变并显示为加利福尼亚州。连续 48 州从玩家首次建档起全部可直接经营，不存在起始州选择、地区解锁或解锁费用；任一州都可直接进行商品即时交易／自动交易、建设或运营工厂以及使用仓库，唯一限制来自对应业务自身的资金、库存、研发、合同、运输等正式规则。地图选择只表示当前经营上下文，不是可买卖资产、出生地或访问资格。每次建设、生产、商品即时交易、工厂交易、自动交易、资产拍卖和跨州运输仍必须携带明确州级地区；内部协议继续使用兼容字段名 `provinceId`。'
          text = replace_required(text, old, new, 'product province access')
          old = '地区水平只由上述 48 州官方经济基准确定，不允许人工给州配置等级。对 `pceMillions`、`averageWeeklyWage`、`population` 分别在 48 州内计算百分位，同值使用平均百分位；综合分数固定为 PCE `50%` + 平均周薪 `30%` + 常住人口 `20%`。按综合分数升序（同分按 `provinceId`）把 48 州等量分为 1～5 级；运行时参数唯一来源为 `shared/province-economic-level-policy.json`。地区解锁不增加工厂数、已解锁州数或资产等额外门槛；玩家只需已确认起始州、目标州尚未解锁且普通货币足够。1～5 级地区基础解锁费依次为 `1,500 / 2,500 / 4,000 / 6,000 / 9,000` 普通货币，再按目标州到永久起始州的球面距离每完整 `500 km` 增加 `300`，总费用最多 `20,000`；起始州本身免费并永久绑定。所有解锁费用由服务器权威计算和扣除，客户端只使用同一策略展示费用拆分。'
          new = '地区水平只由上述 48 州官方经济基准确定，不允许人工给州配置等级。对 `pceMillions`、`averageWeeklyWage`、`population` 分别在 48 州内计算百分位，同值使用平均百分位；综合分数固定为 PCE `50%` + 平均周薪 `30%` + 常住人口 `20%`。按综合分数升序（同分按 `provinceId`）把 48 州等量分为 1～5 级；运行时参数唯一来源为 `shared/province-economic-level-policy.json`。地区水平只用于经济基准、展示和后续明确引用该等级的业务模型，不再决定地区访问资格，也不得附带地区解锁价格、距离附加费或解锁上限。'
          text = replace_required(text, old, new, 'product province level')
          old = '每个消费周期仍先从同一套三类人口真实钱包形成全局可消费预算，再仅在至少一名玩家已选择、已解锁或已有工厂经营足迹的州之间按 PCE 总额权重以六位小数完整分摊；同一州无论有多少玩家只计算一次真实州经济，不按玩家人数复制人口。没有任何州经营足迹时回退默认加利福尼亚州。州权重只分配既有预算，不发行货币、不增加钱包余额；分配后的消费与派生需求订单必须携带对应 `provinceId` 并只进入该州本地订单簿。'
          new = '每个消费周期仍先从同一套三类人口真实钱包形成全局可消费预算；地区访问资格与人口需求落点彻底解耦：连续 48 州均可直接经营，但人口需求州只由玩家兼容默认经营地区 `startingProvinceId` 与实际已有工厂经营足迹激活，兼容字段 `unlockedProvinces` 不参与需求激活。激活州之间按 PCE 总额权重以六位小数完整分摊，同一州无论有多少玩家只计算一次真实州经济，不按玩家人数复制人口；没有任何玩家或经营足迹时回退默认加利福尼亚州。州权重只分配既有预算，不发行货币、不增加钱包余额；分配后的消费与派生需求订单必须携带对应 `provinceId` 并只进入该州服务器内部需求订单簿。'
          text = replace_required(text, old, new, 'product demand activation')
          text = text.replace('跨州商品只能通过付费运输在已解锁州之间流动；', '跨州商品只能通过付费运输在连续 48 州之间流动；')
          save(path, text)

          # PAGE: keep instant-market information architecture, adopt #764 direct access for all 48 states.
          path = 'docs/PAGE_CONTENT_AND_NAVIGATION_DESIGN.md'
          text = load(path)
          text = text.replace('全部已解锁州的商品目录', '连续 48 州的商品目录')
          text = text.replace('全部已解锁州的工厂类型汇总', '连续 48 州的工厂类型汇总')
          text = text.replace('完整权威状态中的全部已解锁州摘要', '完整权威状态中的连续 48 州摘要')
          old = '州级上下文页不得因地区未解锁而整页拦截。概览无论解锁状态都显示官方常住人口以及该玩家在该州的只读经营摘要，且概览不得显示解锁信息或解锁按钮；市场无论解锁状态都允许查看商品目录、今日价格和真实成交行情，未解锁时必须为只读并隐藏即时交易提交能力；地区商品详情不渲染自动经营执行卡；自动经营策略与玩家可见执行解释只在已解锁州的地区工厂详情显示。建筑与仓库只有已解锁州才显示经营内容，未解锁时各自在本分区显示距离、费用、当前资金和统一解锁按钮。一级市场商品的地区行情列表与一级建筑工厂的地区列表只允许出现当前玩家已解锁州，不能因为锁定州的概览或市场可查看就把锁定州加入这些全局经营钻取列表。'
          new = '连续 48 州均为完整经营上下文，不存在地区锁定、只读锁定市场、解锁信息、解锁按钮或按解锁状态裁剪全局列表。概览始终显示官方常住人口以及该玩家在该州的只读经营摘要；市场提供商品目录、今日官方价格、真实成交行情和当日价即时交易写操作；建筑与仓库直接显示本地经营内容；地区商品详情仍不渲染自动经营执行卡，自动经营策略与玩家可见执行解释继续只在地区工厂详情显示。一级市场商品的地区行情列表与一级建筑工厂的地区列表覆盖连续 48 州，并仅按各自业务筛选、排序和数据可用性决定展示。'
          text = replace_required(text, old, new, 'page province access')
          text = text.replace('订单簿草稿', '即时交易草稿')
          text = text.replace('及订单草稿', '及即时交易数量草稿')
          text = re.sub(
              r'不得根据生产配方语义自动推断采购／出售方向，数量和价格继续按统一市场资产切换的订单草稿初始化规则处理（当前数量重置为 `1`，并按当前方向与目标资产初始化默认价格），不得自动提交订单；',
              '不得根据生产配方语义自动推断采购／出售方向；进入商品详情后即时交易数量重置为 `1`，成交价格只读取服务器当日 `officialPrice`，不得由生产配方或来源页面预填自定义价格，也不得自动提交交易；',
              text,
          )
          text = re.sub(
              r'- 建设工厂类型、数量和一键采购报价只属于建筑页建设表单；.*?(?=\n- )',
              '- 建设工厂类型、数量和一键采购报价只属于建筑页建设表单；目录变化时只在自身候选目录内合法化显示值与提交值。建设动作必须显式提交表单当前选择的 `facilityTypeId` 与 `quantity`。农场和果园的空 `buildInputs` 显示“无需材料”；其他工厂逐项显示需求、库存与缺口。存在缺料时按表单地区、工厂类型和数量请求只读建造报价，报价按各缺失材料当日 `officialPrice` 显示逐材料缺口、成交价和采购总额；加载期间禁止提交，切换上下文时中止旧请求，失败时显示明确错误。确认后使用“一键购齐并建造”提交 `autoProcure=true` 及价格／总额保护，服务器在同一事务即时购入全部缺料并继续建厂；任一价格、资金、材料或建设校验失败时整笔回滚，不创建 FOK、开放商品挂单或待采购订单组。',
              text,
              count=1,
              flags=re.S,
          )
          save(path, text)

          # WAREHOUSE: keep instant auto-trading, adopt all-state warehouse/transport access.
          path = 'docs/WAREHOUSE_EXPANSION_DESIGN.md'
          text = load(path)
          text = text.replace('当前地区完整仓库入口只位于隐藏 `ProvincePage` 的“仓库”分区；仅已解锁州显示本地库存内容。', '当前地区完整仓库入口只位于隐藏 `ProvincePage` 的“仓库”分区；连续 48 州均直接显示本地库存内容，不存在仓库地区解锁门禁。')
          text = text.replace('玩家可以在已解锁州之间保存有序多站点运输路线。', '玩家可以在连续 48 州之间保存有序多站点运输路线。')
          text = text.replace('路线全部站点必须已解锁，', '路线全部站点必须属于连续 48 州正式地区，')
          save(path, text)

          # PAGE verifier: combine #764 direct-access expectations with current instant-market expectations.
          path = 'scripts/verify-page-content.mjs'
          text = load(path)
          replacements = {
              "'概览无论解锁状态都显示官方常住人口',": "'概览始终显示官方常住人口',",
              "'市场无论解锁状态都允许查看商品目录、今日价格和真实成交行情',": "'市场提供商品目录、今日官方价格、真实成交行情和当日价即时交易写操作',",
              "'建筑与仓库只有已解锁州才显示经营内容',": "'建筑与仓库直接显示本地经营内容',",
              "'一级市场商品的地区行情列表与一级建筑工厂的地区列表只允许出现当前玩家已解锁州',": "'一级市场商品的地区行情列表与一级建筑工厂的地区列表覆盖连续 48 州',",
              "'<EmbeddedMarketPage model={model} embedded readOnly={!isUnlocked} />',": "'<EmbeddedMarketPage model={model} embedded readOnly={false} />',",
              "  'section=\"buildings\"',\n  'section=\"warehouse\"',\n  '建筑功能未解锁',\n  '仓库功能未解锁',\n": "  '<WarehouseInventoryPanel',\n  'className=\"province-warehouse-section\"',\n",
              "  '该地区尚未解锁，市场仅供查看。',\n  'market-trade-readonly',\n  'readOnly ? (',\n": "",
              "  requireText(path, 'game.provinces.filter((province) => unlocked.has(province.id))');\n  requireText(path, 'const provinces = operationalProvinces(model);');\n": "  requireText(path, 'return model.game.provinces;');\n  requireText(path, 'const provinces = operationalProvinces(model);');\n  forbidText(path, 'unlocked.has(province.id)');\n",
              "requireText('docs/PRODUCT_AND_GAMEPLAY_DESIGN.md', '未解锁州的地区概览仍公开官方常住人口');": "requireText('docs/PRODUCT_AND_GAMEPLAY_DESIGN.md', '连续 48 州从玩家首次建档起全部可直接经营');",
              "requireText('docs/PRODUCT_AND_GAMEPLAY_DESIGN.md', '地区市场允许只读查看今日官方价格与真实成交行情');": "requireText('docs/PRODUCT_AND_GAMEPLAY_DESIGN.md', '任一州都可直接进行商品即时交易');",
              "requireText('docs/WAREHOUSE_EXPANSION_DESIGN.md', '仅已解锁州显示本地库存内容');": "requireText('docs/WAREHOUSE_EXPANSION_DESIGN.md', '连续 48 州均直接显示本地库存内容');",
              "requireText('docs/PAGE_CONTENT_AND_NAVIGATION_DESIGN.md', '建筑与仓库只有已解锁州才显示经营内容');": "requireText('docs/PAGE_CONTENT_AND_NAVIGATION_DESIGN.md', '建筑与仓库直接显示本地经营内容');",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing verifier replacement: {old[:80]}')
              text = text.replace(old, new)
          # Strengthen no-unlock page checks without restoring old read-only market text.
          anchor = "for (const text of [\n  '该州尚未解锁，解锁后可以使用市场、工厂与仓库经营功能。',\n  '<WidgetHeading title=\"州级地区未解锁\"',\n]) forbidText('src/pages/ProvincePage.tsx', text);"
          replacement = "for (const text of [\n  '该州尚未解锁，解锁后可以使用市场、工厂与仓库经营功能。',\n  '<WidgetHeading title=\"州级地区未解锁\"',\n  'section=\"buildings\"',\n  'section=\"warehouse\"',\n  '建筑功能未解锁',\n  '仓库功能未解锁',\n  'ProvinceUnlockPanel',\n  'province-unlock-button',\n]) forbidText('src/pages/ProvincePage.tsx', text);"
          text = replace_required(text, anchor, replacement, 'page verifier province forbid')
          save(path, text)
          PY
          fi

          # The temporary sync workflow must not survive in the final branch.
          rm -f .github/workflows/codex-sync-main.yml
          git add -A
          if git diff --name-only --diff-filter=U | grep -q .; then
            echo "ECONOMY_UNRESOLVED_SYNC_CONFLICTS"
            git diff --name-only --diff-filter=U
            exit 1
          fi
          git commit --no-edit
          git push origin HEAD:codex/daily-system-market
