name: Sync main into daily market branch

on:
  push:
    branches:
      - codex/daily-system-market

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge current main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          if ! git merge --no-ff origin/main -m "同步 main 最新地区访问规则"; then
            echo "ECONOMY_SYNC_CONFLICTS"
            git status --short
            git diff --name-only --diff-filter=U
            exit 1
          fi
          rm -f .github/workflows/codex-sync-main.yml
          git add -A
          git commit --amend --no-edit
          git push origin HEAD:codex/daily-system-market
