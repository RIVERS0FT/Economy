name: Fix unified glass contract

on:
  push:
    branches:
      - agent/unify-floating-glass
    paths:
      - '.github/workflows/fix-unified-glass-contract.yml'

permissions:
  contents: write

jobs:
  fix-contract:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rewrite authoritative material contract
        run: |
          set +e
          python3 - <<'PY' > /tmp/fix-unified-glass-contract.log 2>&1
          import re
          from pathlib import Path

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, content):
              Path(path).write_text(content if content.endswith('\n') else content + '\n', encoding='utf-8')

          def replace_all(path, old, new):
              source = read(path)
              if old not in source:
                  raise RuntimeError(f'{path}: missing {old}')
              write(path, source.replace(old, new))

          path = 'docs/LIQUID_GLASS_CHROME_DESIGN.md'
          source = read(path)
          section = '''## 3. 全局液态玻璃参数与平台几何

禁止 `shader` 模式。桌面状态栏、管理员桌面工作栏、移动状态栏、移动底栏和认证卡片统一使用以下悬浮玻璃参数：

- `mode="standard"`；
- `displacementScale: 70`；
- `blurAmount: 0`；
- `saturation: 140`；
- `aberrationIntensity: 2`；
- `elasticity: 0`；
- `overLight: false`；
- `mouseContainer={null}`；
- 固定 `globalMousePos` 与 `mouseOffset`。

五种表面统一使用 `overLight=false`。`liquid-glass-react@1.1.1` 输出的两个直属辅助 `div` 必须保持完整宿主几何、`padding: 0`、`mask-image: none` 和透明绘制；两个直属边缘高光 `span` 必须全部可见；第三方 `.glass` 的官方 `0 12px 40px rgba(0, 0, 0, 0.25)` 阴影必须保留。浏览器计算值统一为 `blur(4px) saturate(140%)`，首个 `feDisplacementMap` 的绝对 scale 为 `70`。

四个用途预设只保留名称和平台几何差异：`DESKTOP_STATUS_GLASS` 与 `DESKTOP_AUTH_CARD_GLASS` 使用 `24px`，`MOBILE_CHROME_GLASS` 与 `MOBILE_AUTH_CARD_GLASS` 使用 `40px`。每个宿主必须暴露实际 `data-liquid-glass-over-light` 以及配置参数 data attribute。所有四个用途预设都必须固定 `elasticity: 0`，并继续使用静态鼠标输入；任何表面都不得开启鼠标、触控板、触笔或触摸跟踪。

认证卡片继续使用 `layout="content"`，状态栏、管理员工作栏和移动底栏继续使用固定布局。认证内容高度只允许读取 `scrollHeight`／`offsetHeight`，React 内容变化仍在 `useLayoutEffect` 中于首次绘制前同步提交，单个 `ResizeObserver` 与条件 `MutationObserver` 仅负责补充测量；不得通过重建 React `key` 更新尺寸或清空未受控表单值。

所有表面的可见高光几何都必须直接绑定所属宿主：两个官方高光 `span`、两个透明辅助 `div`、效果层与 `.glass` 都使用宿主 `100%` 尺寸并取消几何过渡。宿主必须透明且无项目阴影、结构描边或宿主边框；`.glass` 官方默认阴影必须保留。认证内容高度变化时，上游 resize 通知只负责随后补齐 SVG 滤镜内部坐标；派发前继续使用 `data-liquid-glass-measuring="true"` 中性测量态排除第三方视觉 transform，派发后立即清除。

## 4.'''
          source, count = re.subn(r'## 3\. 全局液态玻璃参数与平台几何\n[\s\S]*?\n## 4\.', section, source, count=1)
          if count != 1:
              raise RuntimeError('LIQUID_GLASS_CHROME_DESIGN.md section 3 did not match')
          replacements = {
              '- Safari、iOS WebKit 和 Firefox 在折射能力受限时仍保留同一组件、轻度模糊、状态栏结构描边、认证卡片圆角裁切和内容结构；': '- Safari、iOS WebKit 和 Firefox 在折射能力受限时仍保留同一组件、轻度模糊、官方双层高光、统一圆角裁切和内容结构；',
              '- `liquid-glass-react` 内联的非前缀 `backdrop-filter` 始终是参数权威；状态栏、管理员工作栏和移动底栏的 `-webkit-backdrop-filter` 必须匹配 `blur(4px) saturate(140%)`，认证卡片必须匹配 `blur(4px) saturate(140%)`；': '- `liquid-glass-react` 内联的非前缀 `backdrop-filter` 始终是参数权威；五种表面的 `-webkit-backdrop-filter` 必须统一匹配 `blur(4px) saturate(140%)`；',
              '- 不支持 `backdrop-filter` 时状态栏与导航使用既有高对比回退，认证卡片使用 `--liquid-glass-auth-fallback`，不切换到另一套玻璃组件；': '- 不支持 `backdrop-filter` 时五种表面统一使用 `--liquid-glass-auth-fallback`，不切换到另一套玻璃组件；',
              '- 认证卡片不得创建 `.liquid-glass-surface__material-fill`，也不得恢复 `--liquid-glass-auth-contrast` 或 `--liquid-glass-auth-mobile-contrast`；只有不支持背景滤镜时可使用 `--liquid-glass-auth-fallback`。': '- 五种表面都不得创建 `.liquid-glass-surface__material-fill`，也不得恢复 `--liquid-glass-contrast`、`--liquid-glass-structure-border`、`--liquid-glass-auth-contrast` 或 `--liquid-glass-auth-mobile-contrast`；只有不支持背景滤镜时可统一使用 `--liquid-glass-auth-fallback`。',
          }
          for old, new in replacements.items():
              if old not in source:
                  raise RuntimeError(f'LIQUID_GLASS_CHROME_DESIGN.md missing: {old}')
              source = source.replace(old, new)
          write(path, source)

          verify = 'scripts/verify-auth-three-layer.mjs'
          replace_all(verify, '认证宿主背景必须透明', '所有宿主背景必须透明')
          replace_all(verify, '不得再创建 `--liquid-glass-tint-dark`、`.liquid-glass-surface__material-fill`', '不得创建低密度状态栏染色、`--liquid-glass-tint-dark`、`.liquid-glass-surface__material-fill`')
          replace_all(verify, '两个边缘高光 `span` 必须直接使用宿主的 `100%` 宽高', '两个边缘高光 `span` 必须直接使用所属宿主的 `100%` 宽高')

          desktop = 'scripts/verify-desktop-primary-surfaces.mjs'
          text = read(desktop)
          needle = "  for (const text of [\n    '桌面工作栏高度保持 `76px`',"
          replacement = "  for (const text of [\n    '桌面状态栏、管理员桌面工作栏、移动状态栏、移动底栏和认证卡片统一使用以下悬浮玻璃参数',\n    '`overLight: false`',\n    '首个 `feDisplacementMap` 的绝对 scale 为 `70`',\n    '五种表面统一使用 `--liquid-glass-auth-fallback`',\n    '桌面工作栏高度保持 `76px`',"
          if needle not in text:
              raise RuntimeError('desktop verifier design block not found')
          text = text.replace(needle, replacement, 1)
          needle = "  ]) requireText(paths.liquidDesign, text);\n\n  for (const text of [\n    'desktop status bar uses"
          replacement = "  ]) requireText(paths.liquidDesign, text);\n  for (const text of [\n    '`overLight: true`',\n    'padding: 1.5px',\n    '绝对 scale 为 `35`',\n    '状态栏结构描边',\n    '状态栏与导航使用既有高对比回退',\n  ]) forbidText(paths.liquidDesign, text);\n\n  for (const text of [\n    'desktop status bar uses"
          if needle not in text:
              raise RuntimeError('desktop verifier insertion point not found')
          text = text.replace(needle, replacement, 1)
          write(desktop, text)
          PY
          status=$?
          set -e
          cat /tmp/fix-unified-glass-contract.log
          rm -f .github/workflows/fix-unified-glass-contract.yml
          if [ "$status" -ne 0 ]; then
            cp /tmp/fix-unified-glass-contract.log FIX_UNIFIED_GLASS_CONTRACT_FAILURE.txt
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if [ "$status" -eq 0 ]; then
            git commit -m 'Align unified glass design contract'
          else
            git commit -m 'Report unified glass contract failure'
          fi
          git push origin HEAD:agent/unify-floating-glass
