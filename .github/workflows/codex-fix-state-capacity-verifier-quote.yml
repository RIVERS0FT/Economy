name: Fix state capacity verifier quote

on:
  push:
    branches:
      - codex/daily-system-market

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix verifier string literal
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/verify-state-delivery-capacity.mjs')
          text = path.read_text()
          old = "  'demand: { lastQuantity: demandLastQuantity, satisfaction: demandSatisfaction },\n"
          new = "  'demand: { lastQuantity: demandLastQuantity, satisfaction: demandSatisfaction },',\n"
          if old not in text:
              raise SystemExit('malformed verifier literal not found')
          path.write_text(text.replace(old, new, 1))
          Path('.github/workflows/codex-fix-state-capacity-verifier-quote.yml').unlink()
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "修复状态容量 verifier 字符串语法"
          git push origin HEAD:codex/daily-system-market
