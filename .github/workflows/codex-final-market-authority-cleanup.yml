name: Final market authority cleanup

on:
  push:
    branches:
      - codex/daily-system-market

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: node scripts/codex-final-market-authority-cleanup.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "收口每日市场权威设计与估值语义"
          git push origin HEAD:codex/daily-system-market
