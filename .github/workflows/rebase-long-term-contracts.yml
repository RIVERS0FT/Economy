name: Rebase long-term contract implementation

on:
  push:
    branches:
      - agent/long-term-supply-contracts-rebase

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/long-term-supply-contracts-rebase
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.4.0
          cache: npm
      - name: Apply implementation transforms
        run: |
          cat .agent/long-term-parts/*.part > /tmp/implement-long-term-contracts.mjs
          node --check /tmp/implement-long-term-contracts.mjs
          node /tmp/implement-long-term-contracts.mjs
          git rm -rf --ignore-unmatch .agent/long-term-parts .agent/rebase-trigger.txt .github/workflows/rebase-long-term-contracts.yml
      - name: Install dependencies
        run: npm ci
      - name: Run focused server tests
        run: node --test server/test/contracts.test.js server/test/contract-audit.test.js server/test/online-auto-sell.test.js
      - name: Run contract regression guard
        run: node scripts/verify-contract-renewal-economic-events.mjs
      - name: Build and run full verification
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run contract browser regression
        run: npx playwright test tests/browser/contract-layout.spec.ts
      - name: Publish rebased PR head
        shell: bash
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --name-only -z | xargs -0 git add --
          git diff --cached --check
          git commit -m "支持长期采购与供应合同"
          git push --force-with-lease=refs/heads/agent/long-term-supply-contracts:437fe4d021d7af399905e2fe425071510521385b origin HEAD:agent/long-term-supply-contracts
