name: PR 616 finalize static map

on:
  push:
    branches:
      - codex/static-svg-map-camera

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/static-svg-map-camera
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.4.0
      - name: Apply final static-map regression fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new, expected):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              actual = text.count(old)
              if actual != expected:
                  raise SystemExit(f'{path}: expected {expected} matches, found {actual}')
              p.write_text(text.replace(old, new), encoding='utf-8', newline='\n')

          replace_exact(
              'tests/browser/all-pages-preview.spec.ts',
              "'data-echarts-ready'",
              "'data-map-ready'",
              2,
          )
          replace_exact(
              'tests/browser/global-operation-pages.spec.ts',
              "'data-echarts-ready'",
              "'data-map-ready'",
              1,
          )
          replace_exact(
              'tests/browser/warehouse-auto-sell.spec.ts',
              "'data-echarts-ready'",
              "'data-map-ready'",
              1,
          )

          replace_exact(
              'src/components/provinces/provinceMapCamera.ts',
              """  const finishMultiTouchSequence = () => {\n    if (!multiTouchSequenceActive) return;\n    refreshTapSuppression();\n    multiTouchSequenceActive = false;\n    scheduleMultiTouchInactiveFallback();\n""",
              """  const finishMultiTouchSequence = () => {\n    if (!multiTouchSequenceActive) return;\n    refreshTapSuppression();\n    multiTouchSequenceActive = false;\n    suppressNextDragClick = false;\n    scheduleMultiTouchInactiveFallback();\n""",
              1,
          )
          replace_exact(
              'src/components/provinces/provinceMapCamera.ts',
              """    if (shouldSuppressTap()) {\n      pendingSuppressedTouchTap = false;\n      suppressedMultiTouchTapCount += 1;\n""",
              """    if (shouldSuppressTap()) {\n      pendingSuppressedTouchTap = false;\n      suppressNextDragClick = false;\n      suppressedMultiTouchTapCount += 1;\n""",
              1,
          )

          replace_exact(
              'tests/browser/map-zoom-render-sync.spec.ts',
              """      const hit = document.elementsFromPoint(screenX, screenY).some((element) => element === path);\n      return { provinceId, screenX, screenY, hit };\n""",
              """      const viewport = map.querySelector<HTMLElement>('.province-map-static-viewport') ?? map;\n      const bounds = viewport.getBoundingClientRect();\n      const visible = screenX >= bounds.left\n        && screenX <= bounds.right\n        && screenY >= bounds.top\n        && screenY <= bounds.bottom;\n      const hit = visible\n        ? document.elementsFromPoint(screenX, screenY).some((element) => element === path)\n        : false;\n      return { provinceId, screenX, screenY, visible, hit };\n""",
              1,
          )
          old_assert = "  expect((await readLabelHitState(page)).every((entry) => entry.hit)).toBe(true);\n"
          replacement_index = {'value': 0}
          p = Path('tests/browser/map-zoom-render-sync.spec.ts')
          text = p.read_text(encoding='utf-8')
          if text.count(old_assert) != 2:
              raise SystemExit('map-zoom-render-sync: expected two legacy hit assertions')
          replacements = [
              """  const baselineHitState = await readLabelHitState(page);\n  const baselineVisibleHitState = baselineHitState.filter((entry) => entry.visible);\n  expect(baselineVisibleHitState.length).toBeGreaterThan(0);\n  expect(baselineVisibleHitState.every((entry) => entry.hit)).toBe(true);\n""",
              """  const zoomedHitState = await readLabelHitState(page);\n  const zoomedVisibleHitState = zoomedHitState.filter((entry) => entry.visible);\n  expect(zoomedVisibleHitState.length).toBeGreaterThan(0);\n  expect(zoomedVisibleHitState.every((entry) => entry.hit)).toBe(true);\n""",
          ]
          for replacement in replacements:
              text = text.replace(old_assert, replacement, 1)
          p.write_text(text, encoding='utf-8', newline='\n')
          PY
      - name: Remove one-time workflow and commit
        run: |
          rm .github/workflows/pr616-finalize-static-map.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "修复静态地图浏览器回归"
          git push origin HEAD:codex/static-svg-map-camera
