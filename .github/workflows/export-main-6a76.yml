name: Export Main 6a76

on:
  push:
    branches:
      - agent/export-main-6a76
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/export-main-6a76
          fetch-depth: 0
      - name: Create archive
        run: tar --exclude=.git -czf /tmp/main-6a76.tar.gz .
      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: main-6a76
          path: /tmp/main-6a76.tar.gz
          retention-days: 1
