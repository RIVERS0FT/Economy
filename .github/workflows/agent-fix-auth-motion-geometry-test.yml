name: Fix authentication motion geometry assertions

on:
  push:
    branches:
      - agent/official-auth-liquid-glass

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix untransformed geometry assertions
        run: |
          set -euo pipefail
          python3 .agent/fix-auth-motion-geometry-test.py
          rm -f .agent/fix-auth-motion-geometry-test.py
          rm -f .github/workflows/agent-fix-auth-motion-geometry-test.yml
          rmdir .agent 2>/dev/null || true
          git diff --check
      - name: Commit geometry assertion fix
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "按未变换布局验证认证玻璃几何"
          git push origin HEAD:agent/official-auth-liquid-glass
