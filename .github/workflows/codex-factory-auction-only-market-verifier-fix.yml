name: Temporary factory market verifier fix

on:
  push:
    branches:
      - codex/factory-auction-only

permissions:
  contents: write
  actions: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/factory-auction-only
          fetch-depth: 0
      - name: Replace retired factory-market assertions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/verify-market-page-layout-regional.mjs')
          text = path.read_text(encoding='utf-8')
          old = "requireText(buildingsPage, 'facilityAssetId={facilityAssetTradeId}', '建筑详情必须继续打开从属资产交易。');\nrequireText(buildingsPage, \"onBackFromFacilityAsset={() => setFacilityAssetTradeId('')}\", '建筑从属资产交易必须返回原建筑详情。');"
          new = "forbidText(buildingsPage, 'facilityAssetId={facilityAssetTradeId}', '建筑详情不得恢复从属工厂资产交易页。');\nforbidText(buildingsPage, \"onBackFromFacilityAsset={() => setFacilityAssetTradeId('')}\", '建筑详情不得恢复工厂资产交易返回链。');\nforbidText(buildingsPage, '交易该建筑资产', '建筑详情不得恢复工厂直售入口。');"
          if text.count(old) != 1:
              raise SystemExit(f'expected one legacy factory-market assertion block, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          Path('.github/workflows/codex-factory-auction-only-market-verifier-fix.yml').unlink()
          PY
      - name: Verify updated market contract
        shell: bash
        run: node scripts/verify-market-page-layout.mjs
      - name: Commit verifier update
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Retire factory market layout contract'
          git push origin HEAD:codex/factory-auction-only
      - name: Run full CI on updated head
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh workflow run ci.yml --ref codex/factory-auction-only
