name: Finalize rebased instant market

on:
  push:
    branches:
      - codex/daily-system-market-rebased

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply rebased instant-market patches
        run: node scripts/codex-finalize-rebased-instant-market.mjs
      - name: Commit final patches
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "收口重基后的每日即时市场规则"
          git push origin HEAD:codex/daily-system-market-rebased
