name: Finalize contract browser baseline

on:
  push:
    branches:
      - agent/contract-types

permissions:
  contents: write

concurrency:
  group: agent-contract-browser-baseline-final
  cancel-in-progress: false

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/contract-types
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.4.0
          cache: npm
      - name: Apply final six-direction baseline
        shell: bash
        run: |
          set -euo pipefail
          python3 .agent-contract-browser-fixture-fix.py
          rm -f .agent-contract-browser-fixture-fix.py
          rm -f .github/workflows/agent-contract-browser-baseline-final.yml
          git add -u -- .agent-contract-browser-fixture-fix.py .github/workflows/agent-contract-browser-baseline-final.yml
          git diff --check
      - run: npm ci
      - name: Validate focused browser and authority rules
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-contract-layout.mjs
          node scripts/verify-page-content.mjs
          node scripts/verify-document-authority.mjs
          npm run typecheck
          npx playwright install --with-deps chromium
          npx playwright test tests/browser/contract-layout.spec.ts tests/browser/contract-workspace.spec.ts
      - name: Validate full build
        run: npm run build
      - name: Commit formal baseline correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            tests/browser/runtime-harness.tsx \
            tests/browser/contract-layout.spec.ts \
            scripts/verify-contract-layout.mjs \
            scripts/verify-page-content.mjs \
            docs/PAGE_CONTENT_AND_NAVIGATION_DESIGN.md
          git diff --cached --check
          git commit -m "同步合同六方向浏览器与权威规则"
          git push origin HEAD:agent/contract-types
