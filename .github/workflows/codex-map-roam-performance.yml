name: codex-map-roam-performance

on:
  push:
    branches:
      - codex/map-roam-performance

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/map-roam-performance
          fetch-depth: 0
      - name: Apply map roam performance refactor
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 occurrence, found {count}')
              return text.replace(old, new, 1)

          def regex_once(text, pattern, replacement, label):
              result, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 regex replacement, found {count}')
              return result

          labels_path = Path('src/components/provinces/provinceMapLabels.ts')
          labels = labels_path.read_text()
          labels = replace_once(labels, '''export interface ProvinceMapLabelSource {\n  provinceId: string;\n  provinceName: string;\n  anchor: [number, number];\n  geometry: unknown;\n}\n\nexport interface ProvinceMapLabelRenderer {\n  schedule: () => void;\n  destroy: () => void;\n}\n''', '''export interface ProvinceMapLabelSource {\n  provinceId: string;\n  provinceName: string;\n  anchor: [number, number];\n  geometry: unknown;\n}\n\ninterface PreparedProvinceMapLabelSource extends ProvinceMapLabelSource {\n  labelRing: Array<[number, number]>;\n}\n\nexport interface ProvinceMapLabelRenderer {\n  refreshLayout: () => void;\n  syncCamera: () => void;\n  updateSelection: () => void;\n  destroy: () => void;\n}\n''', 'renderer interface')
          labels = replace_once(labels, '''function measureNaturalText(container: HTMLElement, text: string): NaturalTextMetrics {\n  const fontFamily = getComputedStyle(container).fontFamily || 'sans-serif';\n  const cacheKey = `${LABEL_FONT_WEIGHT}|${fontFamily}|${text}`;\n''', '''function measureNaturalText(fontFamily: string, text: string): NaturalTextMetrics {\n  const cacheKey = `${LABEL_FONT_WEIGHT}|${fontFamily}|${text}`;\n''', 'font measurement input')
          labels = replace_once(labels, '''function renderLabels(\n  chart: EChartsType,\n  sources: ProvinceMapLabelSource[],\n  overlay: SVGSVGElement,\n  selectedProvinceId: string | null,\n) {''', '''function renderLabels(\n  chart: EChartsType,\n  sources: PreparedProvinceMapLabelSource[],\n  overlay: SVGSVGElement,\n  cameraGroup: SVGGElement,\n  selectedProvinceId: string | null,\n  fontFamily: string,\n) {''', 'render labels signature')
          labels = replace_once(labels, '''  overlay.replaceChildren();\n  let renderedCount = 0;''', '''  cameraGroup.replaceChildren();\n  cameraGroup.removeAttribute('transform');\n  let renderedCount = 0;''', 'layout node rebuild target')
          labels = replace_once(labels, '''    const geoRing = largestOuterRing(source.geometry);\n    if (geoRing.length < 3) continue;''', '''    const geoRing = source.labelRing;\n    if (geoRing.length < 3) continue;''', 'prepared label ring')
          labels = replace_once(labels, '''    const metrics = measureNaturalText(container, source.provinceName);''', '''    const metrics = measureNaturalText(fontFamily, source.provinceName);''', 'cached font family')
          labels = replace_once(labels, '''    overlay.append(group);''', '''    cameraGroup.append(group);''', 'camera group append')

          new_renderer = r'''function chooseCameraReferenceCoordinates(sources: ProvinceMapLabelSource[]) {\n  if (sources.length === 0) return null;\n  const first = sources[0].anchor;\n  let bestFirst: [number, number] = first;\n  let bestSecond: [number, number] = sources[1]?.anchor ?? [first[0] + 1, first[1]];\n  let bestDistanceSquared = -1;\n  for (let left = 0; left < sources.length; left += 1) {\n    for (let right = left + 1; right < sources.length; right += 1) {\n      const dx = sources[right].anchor[0] - sources[left].anchor[0];\n      const dy = sources[right].anchor[1] - sources[left].anchor[1];\n      const distanceSquared = dx * dx + dy * dy;\n      if (distanceSquared <= bestDistanceSquared) continue;\n      bestDistanceSquared = distanceSquared;\n      bestFirst = sources[left].anchor;\n      bestSecond = sources[right].anchor;\n    }\n  }\n  return [bestFirst, bestSecond] as const;\n}\n\nexport function createProvinceMapLabelRenderer(\n  chart: EChartsType,\n  sources: ProvinceMapLabelSource[],\n  selectedProvinceId: () => string | null,\n): ProvinceMapLabelRenderer {\n  const container = chart.getDom();\n  const existing = container.querySelector<SVGSVGElement>(':scope > .province-map-label-overlay');\n  existing?.remove();\n  const overlay = createSvgElement('svg');\n  overlay.classList.add('province-map-label-overlay');\n  overlay.setAttribute('aria-hidden', 'true');\n  overlay.setAttribute('focusable', 'false');\n  const cameraGroup = createSvgElement('g');\n  cameraGroup.classList.add('province-map-label-camera');\n  overlay.append(cameraGroup);\n  container.append(overlay);\n\n  const preparedSources: PreparedProvinceMapLabelSource[] = sources.map((source) => ({\n    ...source,\n    labelRing: largestOuterRing(source.geometry),\n  }));\n  const referenceCoordinates = chooseCameraReferenceCoordinates(preparedSources);\n  let baseCameraReference: {\n    firstCoordinate: [number, number];\n    secondCoordinate: [number, number];\n    firstPixel: ScreenPoint;\n    secondPixel: ScreenPoint;\n  } | null = null;\n  let layoutFrame: number | null = null;\n  let cameraFrame: number | null = null;\n  let layoutRevision = 0;\n  let cameraSyncCount = 0;\n\n  container.dataset.mapLabelCameraMode = 'shared-transform';\n  container.dataset.mapLabelLayoutRevision = '0';\n  container.dataset.mapLabelCameraSyncCount = '0';\n  container.dataset.mapLabelCameraScale = '1.00000';\n\n  const updateSelection = () => {\n    if (chart.isDisposed()) return;\n    const selected = selectedProvinceId();\n    for (const group of cameraGroup.querySelectorAll<SVGGElement>('.province-map-label')) {\n      group.dataset.selected = group.dataset.provinceId === selected ? 'true' : 'false';\n    }\n  };\n\n  const captureBaseCameraReference = () => {\n    if (!referenceCoordinates) {\n      baseCameraReference = null;\n      return;\n    }\n    const firstPixel = projectCoordinate(chart, referenceCoordinates[0]);\n    const secondPixel = projectCoordinate(chart, referenceCoordinates[1]);\n    if (!firstPixel || !secondPixel || length(subtract(secondPixel, firstPixel)) <= GEOMETRY_EPSILON) {\n      baseCameraReference = null;\n      return;\n    }\n    baseCameraReference = {\n      firstCoordinate: referenceCoordinates[0],\n      secondCoordinate: referenceCoordinates[1],\n      firstPixel,\n      secondPixel,\n    };\n    cameraGroup.removeAttribute('transform');\n    container.dataset.mapLabelCameraScale = '1.00000';\n    container.dataset.mapLabelZoom = '1.000';\n  };\n\n  const renderLayout = () => {\n    layoutFrame = null;\n    if (chart.isDisposed()) return;\n    const fontFamily = getComputedStyle(container).fontFamily || 'sans-serif';\n    renderLabels(\n      chart,\n      preparedSources,\n      overlay,\n      cameraGroup,\n      selectedProvinceId(),\n      fontFamily,\n    );\n    captureBaseCameraReference();\n    layoutRevision += 1;\n    container.dataset.mapLabelLayoutRevision = String(layoutRevision);\n    updateSelection();\n  };\n\n  const refreshLayout = () => {\n    if (chart.isDisposed() || layoutFrame !== null) return;\n    if (cameraFrame !== null) {\n      cancelAnimationFrame(cameraFrame);\n      cameraFrame = null;\n    }\n    layoutFrame = requestAnimationFrame(renderLayout);\n  };\n\n  const syncCameraNow = () => {\n    cameraFrame = null;\n    if (chart.isDisposed() || layoutFrame !== null || !baseCameraReference) return;\n    const currentFirst = projectCoordinate(chart, baseCameraReference.firstCoordinate);\n    const currentSecond = projectCoordinate(chart, baseCameraReference.secondCoordinate);\n    if (!currentFirst || !currentSecond) return;\n    const baseDistance = length(subtract(baseCameraReference.secondPixel, baseCameraReference.firstPixel));\n    const currentDistance = length(subtract(currentSecond, currentFirst));\n    if (!(baseDistance > GEOMETRY_EPSILON) || !(currentDistance > GEOMETRY_EPSILON)) return;\n    const scaleFactor = currentDistance / baseDistance;\n    const firstTranslate = {\n      x: currentFirst.x - baseCameraReference.firstPixel.x * scaleFactor,\n      y: currentFirst.y - baseCameraReference.firstPixel.y * scaleFactor,\n    };\n    const secondTranslate = {\n      x: currentSecond.x - baseCameraReference.secondPixel.x * scaleFactor,\n      y: currentSecond.y - baseCameraReference.secondPixel.y * scaleFactor,\n    };\n    const translateX = (firstTranslate.x + secondTranslate.x) / 2;\n    const translateY = (firstTranslate.y + secondTranslate.y) / 2;\n    cameraGroup.setAttribute(\n      'transform',\n      `matrix(${scaleFactor.toFixed(5)} 0 0 ${scaleFactor.toFixed(5)} ${translateX.toFixed(2)} ${translateY.toFixed(2)})`,\n    );\n    cameraSyncCount += 1;\n    container.dataset.mapLabelCameraSyncCount = String(cameraSyncCount);\n    container.dataset.mapLabelCameraScale = scaleFactor.toFixed(5);\n    container.dataset.mapLabelZoom = scaleFactor.toFixed(3);\n  };\n\n  const syncCamera = () => {\n    if (chart.isDisposed() || cameraFrame !== null || layoutFrame !== null) return;\n    cameraFrame = requestAnimationFrame(syncCameraNow);\n  };\n\n  const handleGeoRoam = () => {\n    syncCamera();\n  };\n  chart.on('georoam', handleGeoRoam);\n  refreshLayout();\n  return {\n    refreshLayout,\n    syncCamera,\n    updateSelection,\n    destroy: () => {\n      if (layoutFrame !== null) cancelAnimationFrame(layoutFrame);\n      if (cameraFrame !== null) cancelAnimationFrame(cameraFrame);\n      layoutFrame = null;\n      cameraFrame = null;\n      if (!chart.isDisposed()) chart.off('georoam', handleGeoRoam);\n      overlay.remove();\n      delete container.dataset.mapLabelMode;\n      delete container.dataset.mapLabelGeometryMode;\n      delete container.dataset.mapLabelCount;\n      delete container.dataset.mapCurvedLabelCount;\n      delete container.dataset.mapLabelZoom;\n      delete container.dataset.mapLabelCameraMode;\n      delete container.dataset.mapLabelLayoutRevision;\n      delete container.dataset.mapLabelCameraSyncCount;\n      delete container.dataset.mapLabelCameraScale;\n    },\n  };\n}\n'''
          new_renderer = new_renderer.replace('\\n', '\n')
          labels = regex_once(labels, r'''export function createProvinceMapLabelRenderer\([\s\S]*\n}\s*$''', new_renderer.rstrip() + '\n', 'renderer implementation')
          labels_path.write_text(labels)

          map_path = Path('src/components/provinces/UsMainlandMap.tsx')
          map_source = map_path.read_text()
          map_source = replace_once(map_source, 'labelRendererRef.current?.schedule();', 'labelRendererRef.current?.syncCamera();', 'contain camera label sync')
          map_source = replace_once(map_source, '''  useEffect(() => () => {\n    labelRendererRef.current?.destroy();\n    labelRendererRef.current = null;\n  }, []);\n''', '''  useEffect(() => {\n    labelRendererRef.current?.updateSelection();\n  }, [selectedProvinceId]);\n\n  useEffect(() => () => {\n    labelRendererRef.current?.destroy();\n    labelRendererRef.current = null;\n  }, []);\n''', 'selection-only label update')
          map_source = replace_once(map_source, '''  const handleChartResize = useCallback((chart: EChartsType) => {\n    applyContainCamera(chart);\n    applyResponsiveTooltip(chart);\n  }, [applyContainCamera, applyResponsiveTooltip]);\n\n  const handleOptionApplied = useCallback(() => {\n    labelRendererRef.current?.schedule();\n  }, []);\n''', '''  const handleChartResize = useCallback((chart: EChartsType) => {\n    applyContainCamera(chart);\n    applyResponsiveTooltip(chart);\n    labelRendererRef.current?.refreshLayout();\n  }, [applyContainCamera, applyResponsiveTooltip]);\n''', 'resize-only full layout')
          map_source = replace_once(map_source, '        onOptionApplied={handleOptionApplied}\n', '', 'remove option relayout callback')
          map_path.write_text(map_source)

          test_path = Path('tests/browser/province-map.spec.ts')
          test_source = test_path.read_text()
          test_source = replace_once(test_source, '''async function provinceLabelFontSize(page: Page, provinceId: string) {\n  return page.locator(`.province-map-label[data-province-id="${provinceId}"]`).evaluate((label) => (\n    Number.parseFloat(getComputedStyle(label).fontSize)\n  ));\n}\n''', '''async function provinceLabelVisualWidth(page: Page, provinceId: string) {\n  const box = await page.locator(`.province-map-label[data-province-id="${provinceId}"]`).boundingBox();\n  if (!box) throw new Error(`province label ${provinceId} has no visual bounds`);\n  return box.width;\n}\n''', 'visual width helper')
          test_source = replace_once(test_source, '''  await expect(canvas).toHaveAttribute('data-map-label-count', '48');\n  await expect(canvas).toHaveAttribute('data-map-tooltip-mode', 'desktop');\n''', '''  await expect(canvas).toHaveAttribute('data-map-label-count', '48');\n  await expect(canvas).toHaveAttribute('data-map-label-camera-mode', 'shared-transform');\n  await expect(canvas).toHaveAttribute('data-map-label-layout-revision', /^[1-9]\\d*$/);\n  await expect(canvas).toHaveAttribute('data-map-label-camera-sync-count', /^\\d+$/);\n  await expect(canvas).toHaveAttribute('data-map-tooltip-mode', 'desktop');\n''', 'desktop camera instrumentation')
          test_source = replace_once(test_source, '''  const coloradoFontBeforeZoom = await provinceLabelFontSize(page, '150000');\n  await page.mouse.move(\n''', '''  const coloradoWidthBeforeZoom = await provinceLabelVisualWidth(page, '150000');\n  const layoutRevisionBeforeRoam = await canvas.getAttribute('data-map-label-layout-revision');\n  const cameraSyncBeforeRoam = Number(await canvas.getAttribute('data-map-label-camera-sync-count'));\n  await page.mouse.move(\n''', 'desktop zoom baseline')
          test_source = replace_once(test_source, '''  await expect.poll(() => provinceLabelFontSize(page, '150000')).toBeGreaterThan(coloradoFontBeforeZoom * 1.05);\n  const cameraBeforeSelection = await readOutlineGeometry(page);\n''', '''  await expect.poll(() => provinceLabelVisualWidth(page, '150000')).toBeGreaterThan(coloradoWidthBeforeZoom * 1.05);\n  const zoomedOutline = await readOutlineGeometry(page);\n  const zoomedColoradoWidth = await provinceLabelVisualWidth(page, '150000');\n  const mapScale = (zoomedOutline.right - zoomedOutline.left) / (geometry.pathBounds.right - geometry.pathBounds.left);\n  const labelScale = zoomedColoradoWidth / coloradoWidthBeforeZoom;\n  expect(Math.abs(labelScale - mapScale) / mapScale).toBeLessThan(0.04);\n  await expect(canvas).toHaveAttribute('data-map-label-layout-revision', layoutRevisionBeforeRoam || '');\n  expect(Number(await canvas.getAttribute('data-map-label-camera-sync-count'))).toBeGreaterThan(cameraSyncBeforeRoam);\n  const cameraBeforeSelection = await readOutlineGeometry(page);\n''', 'desktop visual zoom and no relayout')
          test_source = replace_once(test_source, '''  await expect(page.getByRole('heading', { name: '科罗拉多州', exact: true })).toBeVisible();\n  await expect(page.locator('.strategic-page-host')).toHaveAttribute('data-strategic-presentation', 'building');\n''', '''  await expect(page.getByRole('heading', { name: '科罗拉多州', exact: true })).toBeVisible();\n  await expect(canvas).toHaveAttribute('data-map-label-layout-revision', layoutRevisionBeforeRoam || '');\n  await expect(page.locator('.strategic-page-host')).toHaveAttribute('data-strategic-presentation', 'building');\n''', 'selection does not relayout')
          test_source = replace_once(test_source, '''  await page.setViewportSize({ width: 900, height: 900 });\n  await expect(canvas).toHaveAttribute('data-map-contain-viewport', '900x900');\n''', '''  const layoutRevisionBeforeResize = Number(await canvas.getAttribute('data-map-label-layout-revision'));\n  await page.setViewportSize({ width: 900, height: 900 });\n  await expect(canvas).toHaveAttribute('data-map-contain-viewport', '900x900');\n  await expect.poll(async () => Number(await canvas.getAttribute('data-map-label-layout-revision')))\n    .toBeGreaterThan(layoutRevisionBeforeResize);\n''', 'resize relayout instrumentation')
          test_source = replace_once(test_source, '''  await page.getByRole('navigation', { name: '地图镜头' }).getByRole('button', { name: '市场', exact: true }).click();\n  await expect(page.locator('.strategic-map-stage')).toHaveAttribute('data-map-lens', 'market');\n''', '''  const layoutRevisionBeforeLens = await canvas.getAttribute('data-map-label-layout-revision');\n  await page.getByRole('navigation', { name: '地图镜头' }).getByRole('button', { name: '市场', exact: true }).click();\n  await expect(page.locator('.strategic-map-stage')).toHaveAttribute('data-map-lens', 'market');\n  await expect(canvas).toHaveAttribute('data-map-label-layout-revision', layoutRevisionBeforeLens || '');\n''', 'lens does not relayout')
          test_source = replace_once(test_source, '''    const initialOutline = await readOutlineGeometry(page);\n    const initialColoradoFontSize = await provinceLabelFontSize(page, '150000');\n    let blankPoint = await findMapBlankPoint(page);\n''', '''    const initialOutline = await readOutlineGeometry(page);\n    const initialColoradoVisualWidth = await provinceLabelVisualWidth(page, '150000');\n    const mobileLayoutRevisionBeforeRoam = await canvas.getAttribute('data-map-label-layout-revision');\n    const mobileCameraSyncBeforeRoam = Number(await canvas.getAttribute('data-map-label-camera-sync-count'));\n    let blankPoint = await findMapBlankPoint(page);\n''', 'mobile zoom baseline')
          test_source = replace_once(test_source, '''    await expect.poll(() => provinceLabelFontSize(page, '150000')).toBeGreaterThan(initialColoradoFontSize * 1.05);\n\n    blankPoint = await findMapBlankPoint(page);\n''', '''    await expect.poll(() => provinceLabelVisualWidth(page, '150000')).toBeGreaterThan(initialColoradoVisualWidth * 1.05);\n    await expect(canvas).toHaveAttribute('data-map-label-layout-revision', mobileLayoutRevisionBeforeRoam || '');\n    expect(Number(await canvas.getAttribute('data-map-label-camera-sync-count'))).toBeGreaterThan(mobileCameraSyncBeforeRoam);\n\n    blankPoint = await findMapBlankPoint(page);\n''', 'mobile no relayout')
          if 'provinceLabelFontSize' in test_source:
              raise SystemExit('old provinceLabelFontSize helper/calls remain')
          test_path.write_text(test_source)

          verifier_path = Path('scripts/verify-provincial-economy.mjs')
          verifier = verifier_path.read_text()
          verifier = replace_once(verifier, '''  'export function createProvinceMapLabelRenderer',\n  "document.createElementNS(SVG_NAMESPACE, name)",\n''', '''  'export function createProvinceMapLabelRenderer',\n  'interface PreparedProvinceMapLabelSource',\n  'function chooseCameraReferenceCoordinates',\n  "cameraGroup.classList.add('province-map-label-camera')",\n  "container.dataset.mapLabelCameraMode = 'shared-transform'",\n  'container.dataset.mapLabelLayoutRevision',\n  'container.dataset.mapLabelCameraSyncCount',\n  'const handleGeoRoam = () => {',\n  'syncCamera();',\n  "document.createElementNS(SVG_NAMESPACE, name)",\n''', 'verifier performance requirements')
          verifier = replace_once(verifier, '''  'scaleY',\n]) {''', '''  'scaleY',\n  'requestAnimationFrame(schedule)',\n]) {''', 'forbid double schedule')
          verifier = replace_once(verifier, '''  'provinceLabelFontSize',\n  'clickProvinceLabel',\n''', '''  'provinceLabelVisualWidth',\n  'data-map-label-camera-mode',\n  'data-map-label-layout-revision',\n  'data-map-label-camera-sync-count',\n  'mapScale',\n  'labelScale',\n  'clickProvinceLabel',\n''', 'browser performance assertions')
          verifier = replace_once(verifier, '''  '随地图缩放和平移同步重新投影',\n]) assert.ok(uiDesign.includes(text), `移动地图设计规则缺少: ${text}`);''', '''  'georoam 热路径只允许更新共享 SVG 相机组的统一等比缩放和平移矩阵',\n  '禁止重新执行州界投影、主轴／走廊扫描、字体测量、逐字碰撞或 `replaceChildren()`',\n]) assert.ok(uiDesign.includes(text), `移动地图设计规则缺少: ${text}`);''', 'UI design verifier performance rule')
          verifier = replace_once(verifier, '''  '名称随地图缩放和平移同步变化',\n  '不大于 `720px` 时地图 Tooltip 必须禁用并隐藏',\n]) assert.ok(pageDesign.includes(text), `州级页面设计权威缺少: ${text}`);''', '''  '名称随地图缩放和平移同步变化',\n  'georoam 期间不得重新执行 48 州标签完整布局',\n  '共享 SVG 相机组',\n  '不大于 `720px` 时地图 Tooltip 必须禁用并隐藏',\n]) assert.ok(pageDesign.includes(text), `州级页面设计权威缺少: ${text}`);''', 'page design verifier performance rule')
          verifier = replace_once(verifier, '''console.log('地区经济验证通过：美国连续 48 州、版本 36/32、既有地区 ID 原位保留、起始州与州解锁、三种跨州运输、本地库存与市场、工厂建造生产转让、抵押租赁地区锁定、隐藏州级上下文页、视觉选中清理、透明页面与通知覆盖、ECharts 地图点击、桌面地图 Tooltip 与移动端隐藏边界、州内中文全名自然比例刚性字形标签、随镜头缩放平移、空白全局平移和空白双击／双触镜头重置均已锁定。');''', '''console.log('地区经济验证通过：美国连续 48 州、版本 36/32、既有地区 ID 原位保留、起始州与州解锁、三种跨州运输、本地库存与市场、工厂建造生产转让、抵押租赁地区锁定、隐藏州级上下文页、视觉选中清理、透明页面与通知覆盖、ECharts 地图点击、桌面地图 Tooltip 与移动端隐藏边界、州内中文全名自然比例刚性字形标签、georoam 共享 SVG 相机矩阵与零逐帧重排、空白全局平移和空白双击／双触镜头重置均已锁定。');''', 'verifier summary')
          verifier_path.write_text(verifier)

          page_path = Path('docs/PAGE_CONTENT_AND_NAVIGATION_DESIGN.md')
          page = page_path.read_text()
          page = replace_once(page, '''标签层继续设置 `pointer-events: none`，不得拦截州面点击、拖动或桌面 Tooltip，也不得维护第二套地图／相机状态。ECharts `georoam`、Contain 重置和容器尺寸变化后必须重新投影州边界并同步计算主轴、可用走廊、字号和逐字位置，使名称随地图缩放和平移同步变化，视觉上像直接绘制在地图地块上。小州在全图视角允许使用很小字号并随放大自然变大''', '''标签层继续设置 `pointer-events: none`，不得拦截州面点击、拖动或桌面 Tooltip，也不得维护第二套地图／相机状态。州名完整布局只允许在标签层首次创建、字体准备完成或地图容器真实尺寸变化后执行；布局完成后全部州名必须挂在同一个共享 SVG 相机组中。`georoam` 期间不得重新执行 48 州标签完整布局，禁止重新投影全部州界、扫描主轴／文字走廊、重复字体测量、逐字碰撞检查或 `replaceChildren()`；每个动画帧只允许从同一 ECharts 实例读取两个稳定地理参考点的当前投影，求出统一等比缩放和平移矩阵，并通过单次 `requestAnimationFrame` 合并更新共享 SVG 相机组。Contain 重置只同步该派生矩阵，容器真实尺寸变化才在重置后重新布局一次；州选择只更新 `data-selected`，镜头和普通数据 `setOption` 不得重排州名。名称随地图缩放和平移同步变化，视觉上像直接绘制在地图地块上。小州在全图视角允许使用很小字号并随放大自然变大''', 'page design map performance')
          page_path.write_text(page)

          ui_path = Path('docs/UI_DESIGN_SYSTEM.md')
          ui = ui_path.read_text()
          ui = replace_once(ui, '''标签层使用 `pointer-events: none`，不得遮挡州面点击、拖动或 Tooltip；`georoam`、Contain 重置与尺寸变化后必须随地图缩放和平移同步重新投影主轴、走廊和刚性字形，使名称像直接画在地图上一样与地块共同缩放。小州允许使用极小字号并在放大后自然变大''', '''标签层使用 `pointer-events: none`，不得遮挡州面点击、拖动或 Tooltip。完整州名布局只在首次创建、字体准备完成或容器真实尺寸变化后执行，并把全部州名放入同一个共享 SVG 相机组；`georoam` 热路径只允许更新共享 SVG 相机组的统一等比缩放和平移矩阵，每帧最多读取两个稳定地理参考点的 ECharts 投影并通过单次 `requestAnimationFrame` 合并写入。手势缩放和平移期间禁止重新执行州界投影、主轴／走廊扫描、字体测量、逐字碰撞或 `replaceChildren()`；Contain 重置只同步派生矩阵，真实尺寸变化才重新布局一次，州选择只更新选中属性，镜头和普通数据更新不得触发标签布局。这样名称仍像直接画在地图上一样与地块共同缩放。小州允许使用极小字号并在放大后自然变大''', 'UI design map performance')
