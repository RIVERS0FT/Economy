name: Apply unified loading states

on:
  push:
    branches:
      - agent/unify-loading-states
    paths:
      - .github/workflows/agent-apply-loading-unification.yml
      - .agent/apply-loading-unification.py.gz.b64

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.4.0
          cache: npm

      - name: Decode and apply patch
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .agent/apply-loading-unification.py.gz.b64 | gzip -d > /tmp/apply-loading-unification.py
          python3 /tmp/apply-loading-unification.py
          git diff --check

      - name: Run focused verification
        run: node scripts/verify-game-three-layer.mjs

      - name: Install dependencies
        run: npm ci

      - name: Build and test
        run: npm run build

      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git add -- \
            src/components/system/ApplicationLoadingState.tsx \
            src/app/App.tsx \
            src/app/GameApp.tsx \
            src/styles/financial-backdrop.css \
            docs/REGISTRATION_INVITE_FLOW_DESIGN.md \
            docs/LIQUID_GLASS_CHROME_DESIGN.md \
            scripts/verify-game-three-layer.mjs \
            tests/browser/application-photography.spec.ts
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No implementation changes were produced.' >&2
            exit 1
          fi
          git config user.name 'RIVERS0FT Automation'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m '统一应用加载状态'
          git push origin HEAD
