name: Patch page-list verifiers
on:
  push:
    branches: [fix/unify-page-entity-lists]
    paths: [.github/workflows/patch-page-list-verifiers.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/unify-page-entity-lists
      - name: Sync hierarchy verifier and browser selector
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, got {count}: {old}')
              p.write_text(text.replace(old, new, 1))

          verifier = 'scripts/verify-market-information-hierarchy.mjs'
          replace(verifier,
              '<ul className="global-market-goods-list"',
              '<ul className="entity-list-rows global-market-goods-list"')
          replace(verifier,
              '<ul className="global-market-product-region-list"',
              '<ul className="entity-list-rows global-market-product-region-list"')
          replace(verifier,
              '--entity-list-columns: minmax(8rem, 1.45fr) repeat(5, minmax(3.8rem, .64fr)) .8rem;',
              '--entity-list-columns: minmax(8rem, 1.45fr) repeat(5, minmax(3.8rem, .64fr)) var(--entity-list-chevron-column, .8rem);')
          replace(verifier,
              'page.locator(\'.global-market-product-detail > .market-commodity-row-header\')',
              'page.locator(\'.global-market-product-region-surface > .market-commodity-row-header\')')

          spec = 'tests/browser/market-information-hierarchy.spec.ts'
          replace(spec,
              "page.locator('.global-market-product-detail > .market-commodity-row-header')",
              "page.locator('.global-market-product-region-surface > .market-commodity-row-header')")
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/verify-market-information-hierarchy.mjs tests/browser/market-information-hierarchy.spec.ts
          git commit -m "同步页面列表层级校验"
          git push
