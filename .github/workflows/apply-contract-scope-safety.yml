name: Apply contract scope safety patch

on:
  push:
    branches:
      - "fix/interaction-mutation-scopes"
    paths:
      - ".github/workflows/apply-contract-scope-safety.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/interaction-mutation-scopes
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.4.0
          cache: npm
      - name: Apply patch
        run: |
          python3 scripts/apply-contract-scope-safety-patch.py
          rm scripts/apply-contract-scope-safety-patch.py
      - name: Install dependencies
        run: npm ci
      - name: Validate
        run: |
          node scripts/verify-client-response-performance.mjs
          node scripts/verify-runtime-efficiency.mjs
          node --test server/test/world-storage-v2.test.js
          npm run typecheck
          git diff --check
      - name: Commit source
        run: |
          git config user.name 'RIVERSOFT'
          git config user.email '105160096+RIVERS0FT@users.noreply.github.com'
          git add -A
          git commit -m '收紧合同交互的局部事务边界'
          git push origin HEAD:fix/interaction-mutation-scopes
