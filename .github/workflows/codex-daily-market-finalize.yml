name: Finalize daily instant market

on:
  push:
    branches:
      - codex/daily-system-market

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply final market rule patches
        run: node scripts/codex-daily-market-finalize.mjs
      - name: Commit patches and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "收口每日即时市场规则与验证"
          git push origin HEAD:codex/daily-system-market
