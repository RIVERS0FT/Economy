name: Codex Fix Chevron Type

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.ref == 'codex/unify-market-headers-chevrons'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Fix chevron prop type
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          path = Path('src/components/icons/GameIcons.tsx')
          text = path.read_text(encoding='utf-8')
          old = """export function ChevronIcon({ direction = 'right', ...props }: GameIconProps & { direction?: ChevronDirection }) {
  const path = direction === 'left'
    ? 'm15 6-6 6 6 6'
    : direction === 'up'
      ? 'm6 15 6-6 6 6'
      : direction === 'down'
        ? 'm6 9 6 6 6-6'
        : 'm9 6 6 6-6 6';
  return <GameIcon {...props}><path d={path} /></GameIcon>;
}

export function BackIcon(props: GameIconProps) {
  return <ChevronIcon direction=\"left\" {...props} />;
}
"""
          new = """type DirectionalGameIconProps = Omit<GameIconProps, 'direction'>;

export function ChevronIcon({
  direction = 'right',
  ...props
}: DirectionalGameIconProps & { direction?: ChevronDirection }) {
  const path = direction === 'left'
    ? 'm15 6-6 6 6 6'
    : direction === 'up'
      ? 'm6 15 6-6 6 6'
      : direction === 'down'
        ? 'm6 9 6 6 6-6'
        : 'm9 6 6 6-6 6';
  return <GameIcon {...props}><path d={path} /></GameIcon>;
}

export function BackIcon(props: DirectionalGameIconProps) {
  return <ChevronIcon direction=\"left\" {...props} />;
}
"""
          if old not in text:
              raise SystemExit('expected chevron block not found')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/icons/GameIcons.tsx
          git commit -m "修正方向图标属性类型"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
