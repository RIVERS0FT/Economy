name: Patch primary-surface list authority
on:
  push:
    branches: [fix/unify-page-entity-lists]
    paths: [.github/workflows/patch-primary-surface-list-authority.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/unify-page-entity-lists
      - name: Sync page-list authority
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, got {count}: {old[:120]}')
              p.write_text(text.replace(old, new, 1))

          design = 'docs/PRIMARY_SURFACE_INSET_DESIGN.md'
          replace_once(
              design,
              '- 全局建筑列表的响应不能只依赖浏览器 viewport。`.global-operation-page` 必须建立 inline-size 容器；真实页面承载宽度不大于 `620px` 时，全局工厂目录通过更紧凑的单行列宽和 `40×40` 正方形插画收缩，地区工厂列表同步收紧五列轨道；极窄 `360px` 及以下可把全局工厂插画进一步缩至 `36×36`，并继续压缩两级列表列宽与间距。原因是 `721px` 及以上已经进入桌面外壳，但固定侧栏和主卡轨道仍可能把实际页面槽压缩到远小于移动断点的宽度；响应必须以实际页面槽为准，同时不能为了避免溢出破坏两级工厂列表的单行语义。',
              '- 全局建筑列表的响应不能只依赖浏览器 viewport。`.global-operation-page` 必须建立 inline-size 容器；真实页面承载宽度不大于 `620px` 时，两级工厂列表只通过业务列模板继续压缩字段最小宽度，通用列间距、横向内边距、Chevron 轨道与目录插画槽必须复用 `entity-list-header.css` 的页面列表共享令牌；极窄 `360px` 及以下同样只允许进一步压缩业务列模板，共享列表密度不得由建筑页单独改写。原因是 `721px` 及以上已经进入桌面外壳，但固定侧栏和主卡轨道仍可能把实际页面槽压缩到远小于移动断点的宽度；响应必须以实际页面槽为准，同时不能为了避免溢出破坏两级工厂列表的单行语义或重新形成页面专属列表样式。',
          )
          replace_once(
              design,
              '- 全局建筑页只保留全局工厂目录入口；全局工厂目录和工厂类型下的地区工厂列表在 `620px`、`360px` 实际承载断点继续保持单行并收紧列宽，一级页面不得恢复 `.global-province-list` / `.global-province-row`，两级列表都不得产生页面级横向溢出，也不得恢复已退役的 `.global-operation-metrics`；',
              '- 全局建筑页只保留全局工厂目录入口；全局工厂目录和工厂类型下的地区工厂列表在 `620px`、`360px` 实际承载断点继续保持单行并只收紧业务列宽，列表通用密度继续由 `entity-list-header.css` 统一控制；一级页面不得恢复 `.global-province-list` / `.global-province-row`，两级列表都不得产生页面级横向溢出，也不得恢复已退役的 `.global-operation-metrics`；',
          )

          verifier = 'scripts/verify-primary-surface-insets.mjs'
          old = """  for (const text of [
    '.global-operation-page {',
    'width: 100%;',
    'max-width: 100%;',
    'container-type: inline-size;',
    '.global-facility-catalog-header,',
    '.global-facility-region-header {',
    '.global-facility-catalog-list,',
    '.global-facility-region-list {',
    '.global-facility-catalog-row,',
    '.global-facility-region-row {',
    '--entity-list-columns: minmax(0, 1.6fr) minmax(7rem, .8fr) minmax(4rem, .45fr) 1rem;',
    '--entity-list-columns: minmax(0, 1.45fr) minmax(6rem, .7fr) minmax(3.5rem, .42fr) minmax(4.5rem, .55fr) 1rem;',
    '.global-facility-catalog-row__artwork {',
    'aspect-ratio: 1;',
    '.global-facility-region-row__profit,',
    '@container (max-width: 620px)',
    '--entity-list-columns: minmax(0, 1.45fr) minmax(4.65rem, .8fr) minmax(2.4rem, .42fr) .6rem;',
    '--entity-list-columns: minmax(0, 1.2fr) minmax(4.5rem, .68fr) minmax(2.2rem, .35fr) minmax(3rem, .48fr) .6rem;',
    '@container (max-width: 360px)',
    '--entity-list-columns: minmax(0, 1.35fr) minmax(4.25rem, .76fr) minmax(2.1rem, .4fr) .55rem;',
    '--entity-list-columns: minmax(0, .9fr) minmax(0, 1.15fr) minmax(0, .45fr) minmax(0, .75fr) .4rem;',
    'font-size: .6875rem;',
    '@media (max-width: 720px)',
  ]) requireText(paths.globalOperationStyles, text);
  for (const text of [
    '.entity-list-header {',
    'border-bottom: 1px solid var(--color-divider);',
    '.entity-list-header > span,',
    '.entity-list-row {',
    'text-overflow: ellipsis;',
  ]) requireText(paths.entityHeaderStyles, text);"""
          new = """  for (const text of [
    '.global-operation-page {',
    'width: 100%;',
    'max-width: 100%;',
    'container-type: inline-size;',
    '.global-facility-catalog-header {',
    '.global-facility-region-header {',
    '.global-facility-catalog-row,',
    '.global-facility-region-row {',
    '--entity-list-columns: minmax(0, 1.6fr) minmax(7rem, .8fr) minmax(4rem, .45fr) var(--entity-list-chevron-column);',
    '--entity-list-columns: minmax(0, 1.45fr) minmax(6rem, .7fr) minmax(3.5rem, .42fr) minmax(4.5rem, .55fr) var(--entity-list-chevron-column);',
    '.global-facility-catalog-row__artwork {',
    'width: var(--entity-list-artwork-size);',
    'aspect-ratio: 1;',
    '.global-facility-region-row__profit,',
    '@container (max-width: 620px)',
    '--entity-list-columns: minmax(0, 1.45fr) minmax(4.65rem, .8fr) minmax(2.4rem, .42fr) var(--entity-list-chevron-column);',
    '--entity-list-columns: minmax(0, 1.2fr) minmax(4.5rem, .68fr) minmax(2.2rem, .35fr) minmax(3rem, .48fr) var(--entity-list-chevron-column);',
    '@container (max-width: 360px)',
    '--entity-list-columns: minmax(0, 1.35fr) minmax(4.25rem, .76fr) minmax(2.1rem, .4fr) var(--entity-list-chevron-column);',
    '--entity-list-columns: minmax(0, .9fr) minmax(0, 1.15fr) minmax(0, .45fr) minmax(0, .75fr) var(--entity-list-chevron-column);',
    '@media (max-width: 720px)',
  ]) requireText(paths.globalOperationStyles, text);
  for (const text of [
    '.entity-list-surface {',
    '--entity-list-gap: .55rem;',
    '--entity-list-inline-padding: .6rem;',
    '--entity-list-chevron-column: .8rem;',
    '--entity-list-artwork-slot: 42px;',
    '--entity-list-artwork-size: 34px;',
    '.entity-list-rows {',
    'gap: .32rem;',
    '.entity-list-header {',
    'border-bottom: 1px solid var(--color-divider);',
    '.entity-list-header > span,',
    '.entity-list-row {',
    'text-overflow: ellipsis;',
    '@container (max-width: 620px)',
    '--entity-list-artwork-slot: 34px;',
    '--entity-list-artwork-size: 29px;',
    '@container (max-width: 360px)',
    '--entity-list-artwork-slot: 30px;',
    '--entity-list-artwork-size: 26px;',
  ]) requireText(paths.entityHeaderStyles, text);"""
          replace_once(verifier, old, new)
          replace_once(
              verifier,
              "    '真实页面承载宽度不大于 `620px` 时',\n    '极窄 `360px` 及以下',",
              "    '真实页面承载宽度不大于 `620px` 时',\n    '通用列间距、横向内边距、Chevron 轨道与目录插画槽必须复用 `entity-list-header.css` 的页面列表共享令牌',\n    '极窄 `360px` 及以下同样只允许进一步压缩业务列模板',",
          )
          replace_once(
              verifier,
              "console.log('一级卡片统一内边距验证通过：桌面 16px、移动 12px、共享组件语义、承载面局部间距、跨端页面安全宽度、正文顶部留白、全局建筑目录与地区工厂五列单行按真实承载宽度响应、旧类兼容、样式与设计文档权威均已锁定。');",
              "console.log('一级卡片统一内边距验证通过：桌面 16px、移动 12px、共享组件语义、承载面局部间距、跨端页面安全宽度、正文顶部留白、全局建筑目录与地区工厂列表按真实承载宽度保持单行并复用统一页面列表密度、旧类兼容、样式与设计文档权威均已锁定。');",
          )
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/PRIMARY_SURFACE_INSET_DESIGN.md scripts/verify-primary-surface-insets.mjs
          git commit -m "同步统一页面列表承载规则"
          git push
