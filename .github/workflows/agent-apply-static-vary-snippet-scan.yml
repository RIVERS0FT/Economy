name: Apply static Vary snippet scan

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-static-vary-included-snippets
          fetch-depth: 0
      - name: Apply and verify snippet scanning
        run: |
          set -euo pipefail
          python3 .agent/apply-static-vary-snippet-scan.py
          git diff --check
          python3 scripts/test_configure_economy_nginx.py
          node scripts/verify-state-delivery-capacity.mjs
          rm -f .agent/apply-static-vary-snippet-scan.py
          rm -f .github/workflows/agent-apply-static-vary-snippet-scan.yml
          rmdir .agent 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "扫描并修补静态 Nginx snippet"
          git push origin HEAD:agent/fix-static-vary-included-snippets
