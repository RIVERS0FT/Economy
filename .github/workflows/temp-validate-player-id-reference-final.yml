name: Temp Validate Final Player ID Reference Refactor

on:
  push:
    branches:
      - codex/id-player-reference

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/id-player-reference
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build CI selection plan
        shell: bash
        run: |
          git fetch origin main
          git diff --name-only origin/main...HEAD | grep -v '^\.github/workflows/temp-validate-player-id-reference-final.yml$' > /tmp/changed-files.txt
          node scripts/select-ci-tests.mjs plan --changed-files-file /tmp/changed-files.txt --plan-file /tmp/ci-plan.json
          cat /tmp/ci-plan.json
          node -e "const p=require('/tmp/ci-plan.json'); if(p.mode!=='full') throw new Error('expected full CI plan')"

      - name: Audit mutable player-name relations
        shell: bash
        run: |
          echo '=== relationship name fields ==='
          grep -RInE --include='*.js' 'ownerName|sellerName|publisherName|buyerName|supplierName|lenderName|borrowerName|lessorName|lesseeName|counterparty' server/src || true
          echo '=== direct mutable playerName copies into relation-like fields ==='
          grep -RInE --include='*.js' '(ownerName|sellerName|publisherName|buyerName|supplierName|lenderName|borrowerName|lessorName|lesseeName|counterparty).*[.]playerName|[.]playerName.*(ownerName|sellerName|publisherName|buyerName|supplierName|lenderName|borrowerName|lessorName|lesseeName|counterparty)' server/src || true
          echo '=== forbidden live write patterns ==='
          ! grep -RInE --include='*.js' 'ownerName: player[.]playerName|order[.]ownerName =|listing[.]ownerName =|contract[.](publisherName|buyerName|supplierName|lenderName|borrowerName|lessorName|lesseeName) = .*playerName' server/src

      - name: Install dependencies
        run: npm ci

      - name: Full build
        run: npm run build

      - name: Prepare Playwright Chromium
        run: bash scripts/prepare-playwright-chromium.sh

      - name: Full browser suite
        run: npm run test:browser

      - name: Final diff check
        shell: bash
        run: git diff --check origin/main...HEAD
