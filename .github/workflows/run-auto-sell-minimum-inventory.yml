name: Run auto-sell minimum inventory implementation

on:
  push:
    branches:
      - feature/auto-sell-minimum-inventory
  workflow_dispatch:

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/auto-sell-minimum-inventory
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24.4.0'
          cache: npm

      - name: Apply staged implementation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/apply-auto-sell-minimum-inventory.yml').read_text(encoding='utf-8')
          lines = source.splitlines()
          step_start = lines.index('      - name: Apply implementation')
          run_start = lines.index('        run: |', step_start) + 1
          run_end = lines.index('      - name: Install dependencies', run_start)
          script = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in lines[run_start:run_end]
          ) + '\n'
          Path('/tmp/apply-auto-sell-minimum-inventory.sh').write_text(script, encoding='utf-8')
          PY
          bash /tmp/apply-auto-sell-minimum-inventory.sh

      - name: Install dependencies
        run: npm ci

      - name: Run focused checks
        run: |
          node --test server/test/online-auto-sell.test.js
          node scripts/verify-online-auto-sell.mjs
          node scripts/verify-warehouse-expansion.mjs
          node scripts/verify-game-tutorial.mjs

      - name: Run full build verification
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run focused browser check
        run: npx playwright test tests/browser/warehouse-auto-sell.spec.ts

      - name: Run full browser suite
        run: npm run test:browser

      - name: Commit verified implementation
        shell: bash
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-auto-sell-minimum-inventory.yml .github/workflows/run-auto-sell-minimum-inventory.yml
          git add -- \
            docs/WAREHOUSE_EXPANSION_DESIGN.md \
            docs/PAGE_CONTENT_AND_NAVIGATION_DESIGN.md \
            scripts/verify-online-auto-sell.mjs \
            scripts/verify-warehouse-expansion.mjs \
            scripts/verify-game-tutorial.mjs \
            server/src/online-auto-sell.js \
            server/test/online-auto-sell.test.js \
            src/api/game.ts \
            src/app/gameViewModel.ts \
            src/auto-sell/autoSellStorage.ts \
            src/auto-sell/useOnlineAutoSell.ts \
            src/components/warehouse/WarehouseInventoryPanel.tsx \
            src/game-guide/tutorialDefinition.ts \
            src/styles/warehouse-expansion.css \
            tests/browser/warehouse-auto-sell.spec.ts
          git diff --cached --check
          git status --short
          git commit -m "feat: add auto-sell minimum free inventory"
          git push origin HEAD:feature/auto-sell-minimum-inventory
