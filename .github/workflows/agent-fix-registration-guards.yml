name: Fix registration guard text

on:
  push:
    branches:
      - agent/gem-construction-and-dynamic-rate
    paths:
      - .github/workflows/agent-fix-registration-guards.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/gem-construction-and-dynamic-rate
          fetch-depth: 0
      - name: Align registration guards
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path_name, old, new, label):
              path = Path(path_name)
              text = path.read_text()
              if old not in text:
                  raise SystemExit(f'missing {label} in {path_name}')
              path.write_text(text.replace(old, new, 1))

          replace(
              'scripts/verify-email-registration.mjs',
              "  '| 商店 | `gem-shop` | `GemShopPage` | 邀请获取宝石与宝石单向兑换普通货币 |',",
              "  '| 商店 | `gem-shop` | `GemShopPage` | 邀请获取宝石与每日终端动态报价兑换普通货币 |',",
              'shop responsibility guard',
          )
          replace(
              'README.md',
              '- 宝石是独立于普通货币的整数资产，不参与市场、生产、总资产或排行榜。每名玩家拥有永久 8 位邀请码和专属分享链接；有效邀请立即向邀请人发放 10 宝石。商店按每日终端报价单向兑换普通货币；工厂详情允许 1 宝石减少当前施工 30 分钟。不得增加宝石兑换工厂产量或商品的功能。',
              '- 宝石是独立于普通货币的整数资产，不参与市场、生产、总资产或排行榜。每名玩家拥有永久 8 位邀请码和专属分享链接；邀请码只能在首次创建 Economy 玩家档案时归因，注册完成后不能补填、更换或重新绑定。有效邀请立即向邀请人发放 10 宝石。商店按每日终端报价单向兑换普通货币；工厂详情允许 1 宝石减少当前施工 30 分钟。不得增加宝石兑换工厂产量或商品的功能。',
              'README invite completion rule',
          )
          PY
      - name: Commit guard updates
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/agent-fix-registration-guards.yml
          git config user.name "OpenAI Codex"
          git config user.email "codex@openai.com"
          git add -A
          git commit -m "同步注册与商店职责校验"
          git push origin HEAD:agent/gem-construction-and-dynamic-rate
