name: Patch remove region abbreviation

on:
  push:
    branches:
      - fix/remove-region-abbreviation

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/remove-region-abbreviation
          fetch-depth: 0
      - name: Apply final patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'missing expected text in {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_exact(
              'src/pages/GlobalBuildingsPage.tsx',
              '''                      <span className="global-facility-region-row__identity">\n                        <strong>{row.province.name}</strong>\n                        <small>{row.province.shortName}</small>\n                      </span>''',
              '''                      <span className="global-facility-region-row__identity">\n                        <strong>{row.province.name}</strong>\n                      </span>''',
          )

          replace_exact(
              'src/styles/global-operation-pages.css',
              '''.global-facility-region-row__identity {\n  min-width: 0;\n  display: grid;\n  gap: .1rem;\n}\n\n.global-facility-region-row__identity strong,\n.global-facility-region-row__identity small {\n  min-width: 0;\n  overflow: hidden;\n  text-overflow: ellipsis;\n  white-space: nowrap;\n}\n\n.global-facility-region-row__identity small {\n  color: var(--color-text-muted);\n}\n''',
              '''.global-facility-region-row__identity {\n  min-width: 0;\n  display: grid;\n}\n\n.global-facility-region-row__identity strong {\n  min-width: 0;\n  overflow: hidden;\n  text-overflow: ellipsis;\n  white-space: nowrap;\n}\n''',
          )

          replace_exact(
              'src/styles/global-operation-pages.css',
              '''\n  .global-facility-region-row__identity small {\n    display: none;\n  }\n''',
              '\n',
          )

          replace_exact(
              'docs/FACILITY_CATALOG_PRESENTATION_DESIGN.md',
              '> 更新时间：2026-08-25',
              '> 更新时间：2026-08-29',
          )
          replace_exact(
              'docs/FACILITY_CATALOG_PRESENTATION_DESIGN.md',
              '工厂类型地区页使用该工厂名称作为 `PageLayout` 标题，内容区不增加卡片包裹，固定使用“地区｜利润／分钟｜拥有｜状态”统一表头，只列出实际持有该工厂且 `count > 0` 的已解锁州。',
              '工厂类型地区页使用该工厂名称作为 `PageLayout` 标题，内容区不增加卡片包裹，固定使用“地区｜利润／分钟｜拥有｜状态”统一表头；地区列只显示州级地区全称，不在地区名下方重复显示字母简写；只列出实际持有该工厂且 `count > 0` 的已解锁州。',
          )

          replace_exact(
              'scripts/verify-page-content.mjs',
              "  '固定使用“地区｜利润／分钟｜拥有｜状态”统一表头',\n  '利润列固定显示该州当前同类工厂的单厂利润／分钟',",
              "  '固定使用“地区｜利润／分钟｜拥有｜状态”统一表头',\n  '地区列只显示州级地区全称，不在地区名下方重复显示字母简写',\n  '利润列固定显示该州当前同类工厂的单厂利润／分钟',",
          )
          replace_exact(
              'scripts/verify-page-content.mjs',
              "requireText('src/pages/GlobalBuildingsPage.tsx', 'className=\"global-facility-region-header\"');\nforbidText('src/pages/GlobalMarketPage.tsx', '筛选与排序');",
              "requireText('src/pages/GlobalBuildingsPage.tsx', 'className=\"global-facility-region-header\"');\nforbidText('src/pages/GlobalBuildingsPage.tsx', '<small>{row.province.shortName}</small>');\nforbidText('src/styles/global-operation-pages.css', '.global-facility-region-row__identity small');\nforbidText('src/pages/GlobalMarketPage.tsx', '筛选与排序');",
          )
          PY

          rm .github/workflows/patch-remove-region-abbreviation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/GlobalBuildingsPage.tsx src/styles/global-operation-pages.css docs/FACILITY_CATALOG_PRESENTATION_DESIGN.md scripts/verify-page-content.mjs .github/workflows/patch-remove-region-abbreviation.yml
          git diff --cached --check
          git commit -m "去掉地区建筑列表字母简写"
          git push origin HEAD:fix/remove-region-abbreviation
