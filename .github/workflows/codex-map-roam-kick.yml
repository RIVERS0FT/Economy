name: codex-map-roam-kick

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'codex/map-roam-performance'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/map-roam-performance
          fetch-depth: 0
      - name: Run embedded refactor script
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'RUNNER'
          from pathlib import Path
          source = Path('.github/workflows/codex-map-roam-performance.yml').read_text()
          marker = "          python3 - <<'PY'\n"
          start = source.index(marker) + len(marker)
          end = source.index("\n          PY\n", start)
          embedded = source[start:end]
          lines = []
          for line in embedded.splitlines():
              lines.append(line[10:] if line.startswith('          ') else line)
          script = '\n'.join(lines) + '\n'
          script = script.replace(
              "map_source = replace_once(map_source, 'labelRendererRef.current?.schedule();', 'labelRendererRef.current?.syncCamera();', 'contain camera label sync')",
              "map_source = map_source.replace('labelRendererRef.current?.schedule();', 'labelRendererRef.current?.syncCamera();', 1)",
          )
          exec(compile(script, 'codex-map-roam-performance.py', 'exec'), {})
          RUNNER
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/codex-map-roam-performance.yml
          git rm .github/workflows/codex-map-roam-kick.yml
          git rm .github/codex-map-roam-performance-trigger
          git add docs/PAGE_CONTENT_AND_NAVIGATION_DESIGN.md docs/UI_DESIGN_SYSTEM.md scripts/verify-provincial-economy.mjs src/components/provinces/UsMainlandMap.tsx src/components/provinces/provinceMapLabels.ts src/styles/province-map.css tests/browser/province-map.spec.ts
          git commit -m "优化地图缩放和平移热路径"
          git push origin HEAD:codex/map-roam-performance
