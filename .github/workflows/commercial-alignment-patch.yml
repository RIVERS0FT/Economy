name: Commercial alignment patch

on:
  push:
    branches:
      - feat/commercial-buildings

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/commercial-buildings
          fetch-depth: 0
      - name: Apply commercial alignment patches
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'missing expected text in {path}: {old[:160]!r}')
              p.write_text(text.replace(old, new, 1))

          replace(
              'src/styles/province-page.css',
              'grid-template-columns: repeat(4, minmax(0, 1fr));',
              'grid-template-columns: repeat(5, minmax(0, 1fr));',
          )

          # State 39 gains an additive catalog field. Old same-version cached catalog snapshots remain structurally valid;
          # the changed catalog revision still causes the server to deliver the new field.
          replace(
              'server/src/state-partitions.js',
              "for (const key of ['products', 'facilityTypes', 'commercialBuildingTypes', 'researchLevels', 'provinces']) {",
              "for (const key of ['products', 'facilityTypes', 'researchLevels', 'provinces']) {",
          )
          replace(
              'server/src/state-partitions.js',
              "  if (catalog.commercialBuildingTypes.length === 0) return 'catalog.commercialBuildingTypes 为空';\n",
              '',
          )

          replace(
              'scripts/verify-provincial-economy.mjs',
              "  'MAX_PLAYER_PAGE_STACK_DEPTH = 20', \"type: 'province'\", \"type: 'regional-product'\", \"type: 'regional-facility'\",",
              "  'MAX_PLAYER_PAGE_STACK_DEPTH = 20', \"type: 'province'\", \"type: 'regional-product'\", \"type: 'regional-commercial'\", \"type: 'regional-facility'\",",
          )
          replace(
              'scripts/verify-provincial-economy.mjs',
              "  \"{ id: 'buildings', label: '建筑' }\", \"{ id: 'warehouse', label: '仓库' }\",\n  '<EmbeddedMarketPage model={model} embedded />', '<EmbeddedBuildingsPage',",
              "  \"{ id: 'commerce', label: '商业' }\", \"{ id: 'buildings', label: '工业' }\", \"{ id: 'warehouse', label: '仓库' }\",\n  '<EmbeddedMarketPage model={model} embedded />', '<EmbeddedCommercePage', '<EmbeddedBuildingsPage',",
          )
          replace(
              'scripts/verify-provincial-economy.mjs',
              "assert.ok(provinceStyles.includes('grid-template-columns: repeat(4, minmax(0, 1fr));'), '州级上下文切换必须保持四个等宽按钮');",
              "assert.ok(provinceStyles.includes('grid-template-columns: repeat(5, minmax(0, 1fr));'), '州级上下文切换必须保持五个等宽按钮');",
          )

          replace(
              'scripts/verify-unified-factory-recipes-grid.mjs',
              "assert.equal(provincePage.includes('actions={sectionSwitch}'), false, '地区四分区切换不得恢复到固定标题操作区');",
              "assert.equal(provincePage.includes('actions={sectionSwitch}'), false, '地区五分区切换不得恢复到固定标题操作区');",
          )
          replace(
              'scripts/verify-unified-factory-recipes-grid.mjs',
              "  '地区“概览 / 市场 / 建筑 / 仓库”是正文级子导航',",
              "  '地区子导航的名称与顺序以 `PAGE_CONTENT_AND_NAVIGATION_DESIGN.md` 为唯一权威',",
          )
          replace(
              'scripts/verify-production-desktop-layout.mjs',
              "assert.equal(provincePage.includes('actions={sectionSwitch}'), false, '地区四分区按钮不得回到固定标题操作区');",
              "assert.equal(provincePage.includes('actions={sectionSwitch}'), false, '地区五分区按钮不得回到固定标题操作区');",
          )
          replace(
              'scripts/verify-production-desktop-layout.mjs',
              "  '地区“概览 / 市场 / 建筑 / 仓库”是正文级子导航',",
              "  '地区子导航的名称与顺序以 `PAGE_CONTENT_AND_NAVIGATION_DESIGN.md` 为唯一权威',",
          )

          replace(
              'docs/PRODUCTION_PILL_ALIGNMENT_DESIGN.md',
              '- 地区“概览 / 市场 / 建筑 / 仓库”是正文级子导航，不进入固定页面标题操作区。',
              '- 地区子导航的名称与顺序以 `PAGE_CONTENT_AND_NAVIGATION_DESIGN.md` 为唯一权威；本文只要求该正文级子导航不进入固定页面标题操作区。',
          )

          replace(
              'docs/PAGE_CONTENT_AND_NAVIGATION_DESIGN.md',
              '连续 48 州统一使用“概览｜市场｜建筑｜仓库”四个互斥切换按钮；不存在未解锁州、解锁费用、解锁按钮或市场只读分支，地区写操作只受资金、库存、研发、合同、运输等对应业务自身正式约束。',
              '连续 48 州统一使用“概览｜市场｜商业｜工业｜仓库”五个互斥切换按钮；“工业”只替换地区 `buildings` 分区的玩家可见名称，技术 section ID 不迁移；不存在未解锁州、解锁费用、解锁按钮或市场只读分支，地区写操作只受资金、库存、研发、合同、运输等对应业务自身正式约束。',
          )
          replace(
              'docs/PAGE_CONTENT_AND_NAVIGATION_DESIGN.md',
              '概览只展示当前州库存、工厂、运行／异常与经营摘要；市场直接复用当前州 `MarketPage` 的目录与详情内容；工厂直接复用当前州 `BuildingsPage` 的建设和工厂集群内容，但不重复仓库；仓库直接复用 `WarehouseInventoryPanel`。',
              '概览展示当前州库存、工业建筑、商业建筑与经营摘要；市场直接复用当前州 `MarketPage` 的目录与详情内容；商业分区使用 `CommercePage` 展示当前州商业建筑建设、集群与经营详情；工业分区继续复用当前州 `BuildingsPage` 的建设和工厂集群内容，但不重复仓库；仓库直接复用 `WarehouseInventoryPanel`。',
          )

          replace(
              'scripts/verify-page-content.mjs',
              "  '<EmbeddedMarketPage model={model} embedded />',\n  '<EmbeddedBuildingsPage',",
              "  '<EmbeddedMarketPage model={model} embedded />',\n  '<EmbeddedCommercePage',\n  '<EmbeddedBuildingsPage',",
          )
          replace(
              'scripts/verify-page-content.mjs',
              "requireText('docs/PAGE_CONTENT_AND_NAVIGATION_DESIGN.md', '建筑与仓库直接显示本地经营内容');",
              "requireText('docs/PAGE_CONTENT_AND_NAVIGATION_DESIGN.md', '商业、工业与仓库直接显示本地经营内容');",
          )

          replace(
              'package.json',
              '"verify:provincial-economy": "node scripts/verify-provincial-economy.mjs",',
              '"verify:provincial-economy": "node scripts/verify-provincial-economy.mjs && node scripts/verify-commercial-buildings.mjs",',
          )

          Path('.github/workflows/commercial-alignment-patch.yml').unlink()
          PY
      - name: Commit alignment patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: 对齐商业地区导航与防回退"
          git push origin HEAD:feat/commercial-buildings
