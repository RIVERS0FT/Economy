name: Patch notification partial state documentation

on:
  push:
    branches:
      - codex/notification-center
    paths:
      - .github/workflows/patch-notification-partial-state-doc.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/notification-center
          fetch-depth: 0
      - name: Record partial-state notification rule
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('docs/UI_DESIGN_SYSTEM.md')
          text = path.read_text(encoding='utf-8')
          rule = '- 待处理派生必须容忍浏览器夹具、迁移中状态或分区尚未送达造成的局部字段缺失；缺失领域不得阻断登录后外壳，只能不生成对应提醒，不得伪造提醒。'
          anchor = '- `prefers-reduced-motion` 下关闭 Toast 位移动画；颜色不得作为待处理严重程度、未读状态或操作结果的唯一表达。'
          if rule not in text:
              if anchor not in text:
                  raise SystemExit('notification documentation anchor not found')
              text = text.replace(anchor, f'{anchor}\n{rule}', 1)
              path.write_text(text, encoding='utf-8')
          PY
      - name: Commit documentation and self-clean
        run: |
          git rm .github/workflows/patch-notification-partial-state-doc.yml
          git add docs/UI_DESIGN_SYSTEM.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "docs: define partial notification state safety"
          git push origin HEAD:codex/notification-center
