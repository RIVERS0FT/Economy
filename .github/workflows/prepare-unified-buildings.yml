name: Prepare unified building implementation

on:
  push:
    branches: [codex/unified-buildings-auto-operation]
    paths:
      - .github/workflows/prepare-unified-buildings.yml
      - .github/unify-buildings-*.py

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/unified-buildings-auto-operation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply reviewed integration edits
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -q 'EconomyState extends CommercialStateFields' src/types.ts; then
            python3 .github/unify-buildings-core.py
            python3 .github/unify-buildings-pages.py
          fi
          python3 .github/unify-buildings-acceptance.py
          python3 .github/unify-buildings-followup.py
          node scripts/normalize-repository-text.mjs
          git diff --check
          git add src server shared tests docs scripts runtime-test.html
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'feat: finalize unified building contracts and acceptance coverage'
            git push origin HEAD:codex/unified-buildings-auto-operation
          fi
      - run: npm ci
      - run: npm run generate:local-preview && npm run typecheck
      - name: Complete domain integration tests
        if: always()
        run: npm run test:it
      - name: Build and development verification
        if: always()
        run: npm run validate:dt
      - name: Building browser acceptance
        if: always()
        run: |
          npx playwright install --with-deps chromium
          npx playwright test tests/browser/commercial-buildings-layout.spec.ts tests/browser/unified-buildings.spec.ts tests/browser/buildings-ledger-layout.spec.ts tests/browser/production-methods.spec.ts tests/browser/province-map.spec.ts --workers=4 --reporter=line
