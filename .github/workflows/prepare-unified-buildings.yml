name: Prepare unified building implementation

on:
  push:
    branches: [codex/unified-buildings-auto-operation]
    paths:
      - .github/workflows/prepare-unified-buildings.yml
      - .github/unify-buildings-*.py

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/unified-buildings-auto-operation
          fetch-depth: 0
      - name: Apply reviewed integration edits
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -q 'EconomyState extends CommercialStateFields' src/types.ts; then
            python3 .github/unify-buildings-core.py
            python3 .github/unify-buildings-pages.py
          fi
          if [ -f .github/unify-buildings-followup.py ]; then
            python3 .github/unify-buildings-followup.py
          fi
          git diff --check
          git add src server shared tests docs scripts
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git diff --cached --stat
            git commit -m 'feat: integrate unified building directories and commercial auto-operation'
            git push origin HEAD:codex/unified-buildings-auto-operation
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Focused regression diagnostics
        if: always()
        shell: bash
        run: |
          set +e
          failed=0
          for verifier in verify-commercial-buildings verify-production-settlement-layout verify-unified-factory-recipes-grid verify-online-auto-sell verify-warehouse-expansion verify-production-desktop-layout verify-provincial-economy verify-form-state-isolation; do
            node --experimental-strip-types scripts/$verifier.mjs || failed=1
          done
          exit "$failed"
