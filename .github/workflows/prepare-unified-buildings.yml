name: Finalize unified building implementation
on:
  push:
    branches: [codex/unified-buildings-auto-operation]
    paths:
      - .github/workflows/prepare-unified-buildings.yml
      - .github/unify-buildings-integrate.py
permissions:
  contents: write
defaults:
  run:
    shell: bash
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/unified-buildings-auto-operation
          fetch-depth: 0
      - name: Integrate reviewed main changes and remove temporary review tools
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 .github/unify-buildings-integrate.py
          git add -A
          node scripts/normalize-repository-text.mjs
          git add -A
          git diff --cached --check
          git diff --cached --stat
          if ! git diff --cached --quiet; then
            git commit -m 'chore: finalize unified building changes and remove review artifacts'
          fi
          git merge-base --is-ancestor ceb4e5df390a111602624510e672ac698a1476d4 HEAD
          git diff --check origin/main...HEAD
          git status --porcelain
          git diff --stat origin/main...HEAD
          git push origin HEAD:codex/unified-buildings-auto-operation
