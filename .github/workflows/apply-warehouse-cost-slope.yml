name: Apply Warehouse Cost Slope

on:
  push:
    branches:
      - agent/increase-warehouse-expansion-cost

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/increase-warehouse-expansion-cost
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.4.0
          cache: npm

      - name: Apply warehouse pricing change
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PYTHON'
          from pathlib import Path

          def replace_once(path, old, new):
              target = Path(path)
              source = target.read_text(encoding='utf-8')
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one occurrence, found {count}: {old!r}')
              target.write_text(source.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'server/src/warehouse.js',
              'export const WAREHOUSE_COST_SLOPE_NUMERATOR = 3;',
              'export const WAREHOUSE_COST_SLOPE_NUMERATOR = 6;',
          )

          replace_once(
              'server/test/warehouse.test.js',
              '[150, 300, 480, 690, 930, 1_200]',
              '[150, 450, 810, 1_230, 1_710, 2_250]',
          )
          replace_once(
              'server/test/warehouse.test.js',
              '  assert.equal(warehouseUpgradeCostForCapacity(900), 390);',
              '  assert.equal(warehouseUpgradeCostForCapacity(900), 630);\n'
              '  assert.equal(warehouseUpgradeCostForCapacity(501), 152);\n'
              '  assert.equal(warehouseUpgradeCostForCapacity(502), 153);',
          )
          replace_once(
              'server/test/warehouse.test.js',
              '    assert.equal(state.warehouseUpgradeCost, 300);',
              '    assert.equal(state.warehouseUpgradeCost, 450);',
          )
          replace_once(
              'server/test/warehouse.test.js',
              '    assert.equal(before.warehouseUpgradeCost, 480);',
              '    assert.equal(before.warehouseUpgradeCost, 810);',
          )
          replace_once(
              'server/test/warehouse.test.js',
              '    assert.equal(state.credits, 9_520);',
              '    assert.equal(state.credits, 9_190);',
          )
          replace_once(
              'server/test/warehouse.test.js',
              '    assert.equal(state.stats.warehousePayroll, 480);',
              '    assert.equal(state.stats.warehousePayroll, 810);',
          )
          replace_once(
              'server/test/warehouse.test.js',
              '    assert.equal(state.stats.employmentPayments, 480);',
              '    assert.equal(state.stats.employmentPayments, 810);',
          )
          replace_once(
              'server/test/warehouse.test.js',
              '    assert.equal(state.warehouseUpgradeCost, 690);',
              '    assert.equal(state.warehouseUpgradeCost, 1_230);',
          )
          replace_once(
              'server/test/warehouse.test.js',
              '    assert.equal(state.warehouseUpgradeCost, 480);',
              '    assert.equal(state.warehouseUpgradeCost, 810);',
          )
          replace_once(
              'server/test/warehouse.test.js',
              '    assert.equal(state.warehouseUpgradeCost, 1_200);',
              '    assert.equal(state.warehouseUpgradeCost, 2_250);',
          )
          replace_once(
              'server/test/warehouse.test.js',
              '    assert.equal(upgradedState.warehouseUpgradeCost, 1_500);',
              '    assert.equal(upgradedState.warehouseUpgradeCost, 2_850);',
          )

          replace_once(
              'README.md',
              '扩容费用为 `150 + ceil((当前实际总容量 - 500) × 0.6)`',
              '扩容费用为 `150 + ceil((当前实际总容量 - 500) × 1.2)`',
          )

          replace_once(
              'docs/WAREHOUSE_EXPANSION_DESIGN.md',
              '> 更新时间：2026-07-25',
              '> 更新时间：2026-07-27',
          )
          replace_once(
              'docs/WAREHOUSE_EXPANSION_DESIGN.md',
              '升级费用：150 + ceil((当前实际总容量 - 500) × 0.6)',
              '升级费用：150 + ceil((当前实际总容量 - 500) × 1.2)',
          )
          replace_once(
              'docs/WAREHOUSE_EXPANSION_DESIGN.md',
              '费用整数实现使用等价比例 `3 / 5`，不依赖浮点累积：',
              '费用整数实现使用等价比例 `6 / 5`，不依赖浮点累积：',
          )
          replace_once(
              'docs/WAREHOUSE_EXPANSION_DESIGN.md',
              '升级费用 = 150 + ceil(超出基础容量 × 3 / 5)\n```',
              '升级费用 = 150 + ceil(超出基础容量 × 6 / 5)\n```\n\n'
              '当前扩容斜率固定为 1.2（整数比例 `6 / 5`）；后续调整必须同步更新服务端常量、标准价格表、README、服务器测试和防回退检查。',
          )
          for old, new in [
              ('| 2 | 750 | 300 | 300 |', '| 2 | 750 | 300 | 450 |'),
              ('| 3 | 1050 | 350 | 480 |', '| 3 | 1050 | 350 | 810 |'),
              ('| 4 | 1400 | 400 | 690 |', '| 4 | 1400 | 400 | 1230 |'),
              ('| 5 | 1800 | 450 | 930 |', '| 5 | 1800 | 450 | 1710 |'),
              ('| 6 | 2250 | 500 | 1200 |', '| 6 | 2250 | 500 | 2250 |'),
          ]:
              replace_once('docs/WAREHOUSE_EXPANSION_DESIGN.md', old, new)
          replace_once(
              'docs/WAREHOUSE_EXPANSION_DESIGN.md',
              '本次定价与就业规则切换不补收、退还或追溯分配历史扩容费用，不修改已有等级、容量、库存和订单；模型 7 上线后的每次扩容费在同一事务转入人口待结算收入。',
              '扩容定价调整不补收、退还或追溯分配历史扩容费用，不修改已有等级、容量、库存和订单；每次扩容费都在同一事务转入人口待结算收入。',
          )

          replace_once(
              'scripts/verify-warehouse-expansion.mjs',
              "  'WAREHOUSE_COST_SLOPE_NUMERATOR = 3',",
              "  'WAREHOUSE_COST_SLOPE_NUMERATOR = 6',",
          )
          replace_once(
              'scripts/verify-warehouse-expansion.mjs',
              "  '[150, 300, 480, 690, 930, 1_200]',",
              "  '[150, 450, 810, 1_230, 1_710, 2_250]',",
          )
          replace_once(
              'scripts/verify-warehouse-expansion.mjs',
              "requireText('README.md', '扩容费用为 `150 + ceil((当前实际总容量 - 500) × 0.6)`');",
              "requireText('README.md', '扩容费用为 `150 + ceil((当前实际总容量 - 500) × 1.2)`');",
          )
          replace_once(
              'scripts/verify-warehouse-expansion.mjs',
              "  'WAREHOUSE_BASE_UPGRADE_COST * normalized * normalized',\n]) forbidText('server/src/warehouse.js', forbidden);",
              "  'WAREHOUSE_BASE_UPGRADE_COST * normalized * normalized',\n"
              "  'WAREHOUSE_COST_SLOPE_NUMERATOR = 3',\n"
              "]) forbidText('server/src/warehouse.js', forbidden);\n\n"
              "for (const [path, forbidden] of [\n"
              "  ['README.md', '× 0.6'],\n"
              "  ['docs/WAREHOUSE_EXPANSION_DESIGN.md', '× 0.6'],\n"
              "  ['docs/WAREHOUSE_EXPANSION_DESIGN.md', '3 / 5'],\n"
              "]) forbidText(path, forbidden);",
          )
          replace_once(
              'scripts/verify-warehouse-expansion.mjs',
              "  '仓库等级只能决定容量增量，不能直接决定扩容费用',",
              "  '仓库等级只能决定容量增量，不能直接决定扩容费用',\n"
              "  '当前扩容斜率固定为 1.2（整数比例 `6 / 5`）',",
          )
          PYTHON

      - name: Install dependencies
        run: npm ci

      - name: Validate warehouse pricing
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-warehouse-expansion.mjs
          node --test server/test/warehouse.test.js
          npm run build
          git diff --check

      - name: Commit implementation and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/apply-warehouse-cost-slope.yml
          git add README.md docs/WAREHOUSE_EXPANSION_DESIGN.md scripts/verify-warehouse-expansion.mjs server/src/warehouse.js server/test/warehouse.test.js
          git commit -m '提高仓库扩容费用斜率'
          git push origin HEAD:agent/increase-warehouse-expansion-cost
