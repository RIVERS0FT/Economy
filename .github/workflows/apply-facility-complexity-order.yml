name: Apply Facility Complexity Order

on:
  push:
    branches:
      - agent/facility-complexity-order

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/facility-complexity-order
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.4.0
          cache: npm

      - name: Apply implementation
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          from pathlib import Path
          import re

          NEW_ORDER = [
              'farm', 'orchard', 'ranch', 'fishery',
              'logging-camp', 'mine', 'oil-field', 'mill', 'sawmill',
              'pulp-mill', 'steelworks', 'textile-mill', 'food-factory', 'paper-mill',
              'refinery', 'beverage-factory', 'furniture-factory', 'garment-factory',
              'machine-factory', 'electronics-factory', 'appliance-factory',
          ]

          def read(path: str) -> str:
              return Path(path).read_text(encoding='utf-8')

          def write(path: str, content: str) -> None:
              Path(path).write_text(content, encoding='utf-8', newline='\n')

          def replace_once(content: str, old: str, new: str, label: str) -> str:
              count = content.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one occurrence, found {count}')
              return content.replace(old, new, 1)

          catalog_path = 'server/src/industry-catalog.js'
          catalog = read(catalog_path)
          start_marker = 'const rawFacilities = ['
          end_marker = '\n];\n\nconst EXPECTED_PROFIT_PER_MINUTE'
          start = catalog.index(start_marker) + len(start_marker)
          end = catalog.index(end_marker, start)
          body = catalog[start:end]
          matches = list(re.finditer(r"(?ms)^  \{\n    id: '([^']+)'.*?^  \},(?:\n|$)", body))
          if len(matches) != 21:
              raise SystemExit(f'expected 21 facility blocks, found {len(matches)}')
          cursor = 0
          blocks = []
          for match in matches:
              if body[cursor:match.start()].strip():
                  raise SystemExit('unexpected text between facility blocks')
              block = match.group(0).rstrip('\n')
              complexity = re.search(r"complexity: 'C([1-7])'", block)
              if not complexity:
                  raise SystemExit(f"{match.group(1)} missing complexity")
              blocks.append((int(complexity.group(1)), match.group(1), block))
              cursor = match.end()
          if body[cursor:].strip():
              raise SystemExit('unexpected trailing facility catalog text')
          sorted_blocks = sorted(blocks, key=lambda item: item[0])
          actual_order = [item[1] for item in sorted_blocks]
          if actual_order != NEW_ORDER:
              raise SystemExit(f'unexpected stable complexity order: {actual_order}')
          new_body = '\n' + '\n'.join(item[2] for item in sorted_blocks)
          catalog = catalog[:start] + new_body + catalog[end:]
          write(catalog_path, catalog)

          expected_block = """const expectedFacilities = [
            'farm', 'orchard', 'ranch', 'fishery',
            'logging-camp', 'mine', 'oil-field', 'mill', 'sawmill',
            'pulp-mill', 'steelworks', 'textile-mill', 'food-factory', 'paper-mill',
            'refinery', 'beverage-factory', 'furniture-factory', 'garment-factory',
            'machine-factory', 'electronics-factory', 'appliance-factory',
          ];"""
          complexity_assertion = """const facilityComplexityRanks = FACILITY_TYPE_CATALOG.map((item) => Number(item.complexity.slice(1)));
          assert.deepEqual(
            facilityComplexityRanks,
            [...facilityComplexityRanks].sort((left, right) => left - right),
            '工厂正式目录必须按复杂度 C1 至 C7 升序排列',
          );"""
          order_assertion = 'assert.deepEqual(FACILITY_TYPE_CATALOG.map((item) => item.id), expectedFacilities);'
          for path in ['scripts/verify-industry-catalog.mjs', 'server/test/domain.test.js']:
              content = read(path)
              content, count = re.subn(
                  r"const expectedFacilities = \[\n.*?\n\];",
                  expected_block,
                  content,
                  count=1,
                  flags=re.S,
              )
              if count != 1:
                  raise SystemExit(f'{path}: expectedFacilities replacement failed')
              if complexity_assertion not in content:
                  content = replace_once(
                      content,
                      order_assertion,
                      order_assertion + '\n' + complexity_assertion,
                      f'{path} complexity assertion',
                  )
              write(path, content)

          design_path = 'docs/FACILITY_CATALOG_PRESENTATION_DESIGN.md'
          design = read(design_path)
          design = replace_once(design, '> 更新时间：2026-08-01', '> 更新时间：2026-08-02', 'design date')
          design = replace_once(
              design,
              """## 1. 唯一顺序来源

          服务器 `FACILITY_TYPE_CATALOG` 返回的顺序进入客户端 `game.facilityTypes`。`game.facilityTypes` 是客户端工厂展示顺序的唯一权威。

          客户端不得再维护独立工厂顺序表，也不得把玩家持有数据的返回顺序当作目录顺序。""",
              """## 1. 唯一顺序来源与复杂度排序

          服务器 `FACILITY_TYPE_CATALOG` 返回的顺序进入客户端 `game.facilityTypes`。`game.facilityTypes` 是客户端工厂展示顺序的唯一权威。

          正式目录必须按 `complexity` 从 `C1` 到 `C7` 升序排列。同一复杂度内保持服务器目录声明的相对顺序，不再按名称、ID、分类、建造费用或其他字段追加第二排序键。服务器源目录本身必须满足该顺序，不得只在序列化或客户端展示时临时排序。

          客户端不得再维护独立工厂顺序表，不得把玩家持有数据的返回顺序当作目录顺序，也不得对 `game.facilityTypes` 再次执行 `sort()` 或 `toSorted()`。""",
              'design section 1',
          )
          design = replace_once(
              design,
              '- 后续新增的工厂目录导航、筛选器和选择器。',
              '- 所有直接遍历 `game.facilityTypes` 的工厂目录导航、筛选器和选择器。',
              'design consumer scope',
          )
          design = replace_once(
              design,
              '2. 再遍历 `game.facilityTypes`；',
              '2. 再遍历已经按 `C1` 至 `C7` 排列的 `game.facilityTypes`；',
              'design implementation step',
          )
          design = replace_once(
              design,
              '不得按 `facilityGroups` 返回顺序、中文名称、ID 或 `localeCompare` 重新排序。也不得按运行状态、工厂数量或最近查看重排选择卡，不得把“运行中优先”“最近查看”作为默认详情规则。',
              '不得按 `facilityGroups` 返回顺序、中文名称、ID 或 `localeCompare` 重新排序，也不得在客户端按复杂度二次排序。不得按运行状态、工厂数量或最近查看重排选择卡，不得把“运行中优先”“最近查看”作为默认详情规则。',
              'design no client sorting',
          )
          design = replace_once(
              design,
              '- 新增正式工厂类型时，只需调整服务器目录；客户端不得追加另一处排序配置。',
              '- 新增正式工厂或修改复杂度时，必须同步调整服务器目录，使完整目录继续满足 `C1` 至 `C7` 升序；客户端不得追加另一处排序配置。\n- 同一复杂度工厂之间的相对顺序必须稳定，运行状态、数量、价格、轮询刷新和响应式布局均不得改变该顺序。',
              'design stability',
          )
          design = replace_once(
              design,
              '1. 建设下拉框顺序等于 `facilityTypes`；\n2. 工厂选择卡顺序等于过滤到已拥有类型后的 `facilityTypes`；',
              '1. `facilityTypes` 的复杂度序列严格满足 `C1` 至 `C7` 非递减，同复杂度顺序等于服务器目录声明顺序；\n2. 建设下拉框顺序等于 `facilityTypes`；\n3. 工厂选择卡顺序等于过滤到已拥有类型后的 `facilityTypes`；',
              'design acceptance start',
          )
          design = design.replace('3. 默认详情工厂', '4. 默认详情工厂', 1)
          design = design.replace('4. 侧栏展开', '5. 侧栏展开', 1)
          design = design.replace('5. 当前工厂数量', '6. 当前工厂数量', 1)
          design = design.replace('6. 客户端代码', '7. 客户端代码', 1)
          design = replace_once(
              design,
              '- 按名称、ID、本地化比较、运行状态、数量或玩家持有顺序重新排列工厂选择卡；',
              '- 在客户端按复杂度、名称、ID、本地化比较、运行状态、数量或玩家持有顺序重新排列工厂选择卡；',
              'design regression rule',
          )
          write(design_path, design)

          page_path = 'src/pages/ProductionPage.tsx'
          page = read(page_path)
          page = replace_once(
              page,
              '按服务器正式目录顺序选择工厂并查看生产详情。',
              '按复杂度从 C1 到 C7 选择工厂并查看生产详情。',
              'production helper text',
          )
          write(page_path, page)

          verifier_path = 'scripts/verify-unified-factory-recipes-grid.mjs'
          verifier = read(verifier_path)
          verifier = replace_once(
              verifier,
              "const mobile = read('src/pages/production/MobileFacilityDetailSheet.tsx');",
              "const mobile = read('src/pages/production/MobileFacilityDetailSheet.tsx');\nconst catalogPresentationDesign = read('docs/FACILITY_CATALOG_PRESENTATION_DESIGN.md');",
              'verifier design read',
          )
          production_source_anchor = """const productionSource = `${page}
          ${detail}
          ${mobile}`;"""
          verifier_checks = """
          assert.equal(
            page.includes('按复杂度从 C1 到 C7 选择工厂并查看生产详情。'),
            true,
            '生产页必须说明正式复杂度顺序',
          );
          for (const forbidden of [
            'game.facilityTypes.sort(',
            'game.facilityTypes.toSorted(',
            'game.facilityTypes.slice().sort(',
          ]) assert.equal(page.includes(forbidden), false, `生产页不得对服务器工厂目录二次排序: ${forbidden}`);
          for (const required of [
            '正式目录必须按 `complexity` 从 `C1` 到 `C7` 升序排列',
            '同一复杂度内保持服务器目录声明的相对顺序',
            '不得对 `game.facilityTypes` 再次执行 `sort()` 或 `toSorted()`',
          ]) assert.equal(catalogPresentationDesign.includes(required), true, `工厂目录权威设计缺少: ${required}`);
          """
          if '生产页必须说明正式复杂度顺序' not in verifier:
              verifier = replace_once(
                  verifier,
                  production_source_anchor,
                  production_source_anchor + verifier_checks,
                  'verifier complexity checks',
              )
          write(verifier_path, verifier)

          harness_path = 'tests/browser/runtime-harness.tsx'
          harness = read(harness_path)
          facility_order_scenario = """    if (scenario === 'facility-order') {
                const baseType = next.game.facilityTypes[0];
                const baseGroup = next.game.facilityGroups[0];
                const orderedTypes = [
                  { id: 'farm', name: '农场', complexity: 'C1' },
                  { id: 'orchard', name: '果园', complexity: 'C1' },
                  { id: 'ranch', name: '畜牧场', complexity: 'C1' },
                  { id: 'fishery', name: '渔场', complexity: 'C1' },
                  { id: 'mine', name: '矿场', complexity: 'C2' },
                  { id: 'steelworks', name: '冶炼厂', complexity: 'C3' },
                  { id: 'refinery', name: '炼油厂', complexity: 'C4' },
                  { id: 'machine-factory', name: '机械厂', complexity: 'C5' },
                  { id: 'electronics-factory', name: '电子厂', complexity: 'C6' },
                  { id: 'appliance-factory', name: '家电厂', complexity: 'C7' },
                ];
                next.game.facilityTypes = orderedTypes.map((type) => ({ ...baseType, ...type }));
                next.game.facilityGroups = [...orderedTypes].reverse().map((type, index) => ({
                  ...baseGroup,
                  facilityTypeId: type.id,
                  count: index + 1,
                  participatingCount: index + 1,
                  availableCount: index + 1,
                  nextCycleCount: index + 1,
                }));
              }
          """
          if "scenario === 'facility-order'" not in harness:
              harness = replace_once(
                  harness,
                  "    if (scenario === 'cluster-summary') {",
                  facility_order_scenario + "    if (scenario === 'cluster-summary') {",
                  'runtime facility order scenario',
              )
          write(harness_path, harness)

          spec_path = 'tests/browser/production-facility-cards.spec.ts'
          spec = read(spec_path)
          browser_test = """
            test('uses server C1 to C7 order even when facility groups arrive reversed', async ({ page }) => {
              await page.setViewportSize({ width: 1440, height: 900 });
              await page.goto('runtime-test.html?view=production&scenario=facility-order');

              const expectedNames = [
                '农场', '果园', '畜牧场', '渔场', '矿场',
                '冶炼厂', '炼油厂', '机械厂', '电子厂', '家电厂',
              ];
              await expect(page.getByLabel('工厂类型').locator('option')).toHaveText(expectedNames);
              await expect(page.locator('.facility-cluster-name')).toHaveText(expectedNames);
              await expect(page.locator('#desktop-facility-detail-title')).toHaveText('农场');
              await expect(page.getByText('按复杂度从 C1 到 C7 选择工厂并查看生产详情。')).toBeVisible();
            });
          """
          if 'uses server C1 to C7 order' not in spec:
              closing = '\n});\n'
              if not spec.endswith(closing):
                  raise SystemExit('unexpected production facility cards spec ending')
              spec = spec[:-len(closing)] + browser_test + closing
          write(spec_path, spec)

          print('Applied stable C1-C7 facility catalog ordering and regressions.')
          PYTHON
          git diff --check

      - name: Validate implementation
        id: validation
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          (
            set -euo pipefail
            npm ci
            npm run build
            npx playwright install --with-deps chromium
            npm run test:browser
            git diff --check
          ) 2>&1 | tee /tmp/facility-complexity-order-validation.log

      - name: Commit implementation
        if: steps.validation.outcome == 'success'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            server/src/industry-catalog.js \
            server/test/domain.test.js \
            docs/FACILITY_CATALOG_PRESENTATION_DESIGN.md \
            src/pages/ProductionPage.tsx \
            scripts/verify-industry-catalog.mjs \
            scripts/verify-unified-factory-recipes-grid.mjs \
            tests/browser/runtime-harness.tsx \
            tests/browser/production-facility-cards.spec.ts
          git diff --cached --check
          git commit -m "按复杂度排序工厂目录"
          git push origin HEAD:agent/facility-complexity-order

      - name: Record validation failure
        if: steps.validation.outcome != 'success'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp /tmp/facility-complexity-order-validation.log .github/facility-complexity-order-validation.log
          printf 'validation failed\n' > .github/facility-complexity-order-validation-failed.txt
          git add .github/facility-complexity-order-validation.log .github/facility-complexity-order-validation-failed.txt
          git commit -m "记录工厂复杂度排序验证失败"
          git push origin HEAD:agent/facility-complexity-order
          exit 1
