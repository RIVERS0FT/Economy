name: Apply transport route design update

on:
  push:
    branches:
      - codex/transport-route-cost-style-lock
    paths:
      - scripts/apply-transport-route-design-update.mjs
      - .github/workflows/apply-transport-route-design-update.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/transport-route-cost-style-lock
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/apply-transport-route-design-update.mjs
      - run: node scripts/verify-provincial-unlock-transport.mjs
      - run: node scripts/verify-primary-surface-insets.mjs
      - run: git diff --check
      - name: Commit migrated design documents
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "更新运输路线与滚动正文权威设计"
          git push origin HEAD:codex/transport-route-cost-style-lock
