name: Fix factory staffing UI semantics

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/factory-staffing-rate
          fetch-depth: 0

      - name: Apply exact UI fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          formula = Path('src/components/facilities/FacilityProductionFormula.tsx')
          text = formula.read_text()
          old = '        scopeCount={profitScope.count}\n'
          new = '        scopeCount={profitScope.physicalCount}\n'
          if text.count(old) != 1:
              raise SystemExit(f'profit scope replacement expected one match, found {text.count(old)}')
          formula.write_text(text.replace(old, new, 1))

          detail = Path('src/pages/production/ProductionFacilityDetail.tsx')
          text = detail.read_text()
          old = "  const scopeLabel = group.status === 'running'\n    ? '本周期'\n    : group.status === 'error'\n      ? '恢复后'\n      : '启动后';\n"
          new = old + "  const settlementVerb = group.status === 'running' ? '锁定' : '预计';\n"
          if text.count(old) != 1:
              raise SystemExit(f'settlement verb insertion expected one match, found {text.count(old)}')
          text = text.replace(old, new, 1)
          old = '        {scopeLabel} {formatNumber(physicalCount)} 座 · 锁定 {formatNumber(settlementPercent)}% · 等效 {formatNumber(effectiveCount)} 座\n'
          new = '        {scopeLabel} {formatNumber(physicalCount)} 座 · {settlementVerb} {formatNumber(settlementPercent)}% · 等效 {formatNumber(effectiveCount)} 座\n'
          if text.count(old) != 1:
              raise SystemExit(f'settlement label replacement expected one match, found {text.count(old)}')
          detail.write_text(text.replace(old, new, 1))
          PY
          git diff --check

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.4.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and test
        run: npm run build

      - name: Commit verified UI fixes
        run: |
          git config user.name 'OpenAI Agent'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/facilities/FacilityProductionFormula.tsx src/pages/production/ProductionFacilityDetail.tsx
          git diff --cached --check
          git commit -m '修正满员率利润范围与预计标签'
          git pull --rebase origin agent/factory-staffing-rate
          git push origin HEAD:agent/factory-staffing-rate
