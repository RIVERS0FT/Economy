name: Apply Pie padAngle

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: apply-pie-pad-angle
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pie-pad-angle
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.4.0
          cache: npm
      - name: Apply shared Pie padAngle
        id: patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path_name: str, old: str, new: str) -> None:
              path = Path(path_name)
              source = path.read_text(encoding='utf-8')
              count = source.count(old)
              if count == 0 and new in source:
                  return
              if count != 1:
                  raise SystemExit(f'{path_name}: expected one replacement target, found {count}')
              path.write_text(source.replace(old, new), encoding='utf-8')

          replace_once(
              'src/components/charts/chartOptions.ts',
              "} as const;\n\nconst compactFormatter",
              "} as const;\n\nexport const PIE_PAD_ANGLE = 5;\n\nconst compactFormatter",
          )

          replace_once(
              'src/components/charts/AssetAllocationChart.tsx',
              "import { chartColor, commonTooltip, escapeChartHtml, formatChartPercent } from './chartOptions';",
              "import { PIE_PAD_ANGLE, chartColor, commonTooltip, escapeChartHtml, formatChartPercent } from './chartOptions';",
          )
          replace_once(
              'src/components/charts/AssetAllocationChart.tsx',
              "      center: ['50%', '50%'],\n      label: { show: false },",
              "      center: ['50%', '50%'],\n      padAngle: PIE_PAD_ANGLE,\n      label: { show: false },",
          )

          replace_once(
              'src/components/charts/AdminCharts.tsx',
              "import {\n  chartColor,",
              "import {\n  PIE_PAD_ANGLE,\n  chartColor,",
          )
          replace_once(
              'src/components/charts/AdminCharts.tsx',
              "      radius: ['52%', '78%'],\n      center: ['50%', '50%'],\n      avoidLabelOverlap: true,",
              "      radius: ['52%', '78%'],\n      center: ['50%', '50%'],\n      padAngle: PIE_PAD_ANGLE,\n      avoidLabelOverlap: true,",
          )

          doc_rule = (
              "所有 `type: 'pie'` 系列（包括实心饼图与圆环图）必须使用 `chartOptions.ts` 的共享 "
              "`PIE_PAD_ANGLE = 5`，统一设置 `padAngle: PIE_PAD_ANGLE`；不得在业务图表中改回零间隔、"
              "直接写入魔法数字或定义第二套扇区间隔。"
          )
          doc_path = Path('docs/UI_DESIGN_SYSTEM.md')
          doc_source = doc_path.read_text(encoding='utf-8')
          if doc_rule not in doc_source:
              marker = (
                  "`EconomyChart` 是业务数据图表的唯一 React 入口。项目只安装 Apache `echarts`，不得引入 `echarts-for-react` 或第二套图表包装库；"
                  "`echarts.init`、SVGRenderer、按需模块注册、`ResizeObserver`、`requestAnimationFrame` 合并 resize、Option 更新与卸载 `dispose()` "
                  "统一放在 `src/components/charts/`。市场、银行资产配置、管理员玩家与人口图表必须从现有 CSS 设计令牌读取颜色，提供中文 `aria-label` "
                  "与可读数据摘要；业务页面只提供数据和 Option，不得直接持有 ECharts 实例或依赖其私有 SVG DOM。ECharts 必须随市场、银行和管理员页面的"
                  "既有动态 import 按需加载，登录首屏不得静态加载图表包。"
              )
              if doc_source.count(marker) != 1:
                  raise SystemExit('docs/UI_DESIGN_SYSTEM.md: EconomyChart rule marker not found exactly once')
              doc_path.write_text(doc_source.replace(marker, f'{marker}\n\n{doc_rule}'), encoding='utf-8')

          verifier = Path('scripts/verify-echarts-adoption.mjs')
          source = verifier.read_text(encoding='utf-8')

          scan_block = """const pieSeriesFiles = sourceFiles.filter((path) => /type:\\s*['\"]pie['\"]/.test(read(path)));
          for (const path of pieSeriesFiles) {
            const content = read(path);
            const pieSeriesCount = content.match(/type:\\s*['\"]pie['\"]/g)?.length ?? 0;
            const padAngleCount = content.match(/padAngle:\\s*PIE_PAD_ANGLE/g)?.length ?? 0;
            if (pieSeriesCount !== padAngleCount) {
              failures.push(`${path} 的每个 Pie 系列都必须使用共享 PIE_PAD_ANGLE，当前 Pie=${pieSeriesCount}、padAngle=${padAngleCount}`);
            }
          }
          """
          marker = "const sourceFiles = walk('src').filter((path) => /\\.(?:ts|tsx)$/.test(path));\n"
          if scan_block not in source:
              if source.count(marker) != 1:
                  raise SystemExit('verify-echarts-adoption.mjs: sourceFiles marker not found')
              source = source.replace(marker, marker + scan_block)

          source = source.replace(
              "requireText('src/components/charts/echartsCore.ts', [\n  'BarChart', 'LineChart', 'PieChart', 'GridComponent', 'TooltipComponent', 'AriaComponent', 'SVGRenderer',\n]);",
              "requireText('src/components/charts/echartsCore.ts', [\n  'BarChart', 'LineChart', 'PieChart', 'GridComponent', 'TooltipComponent', 'AriaComponent', 'SVGRenderer',\n]);\nrequireText('src/components/charts/chartOptions.ts', ['export const PIE_PAD_ANGLE = 5;']);",
          )
          source = source.replace(
              "  '<EconomyChart', \"type: 'pie'\", \"radius: ['64%', '84%']\",",
              "  '<EconomyChart', \"type: 'pie'\", \"radius: ['64%', '84%']\", 'padAngle: PIE_PAD_ANGLE',",
          )
          source = source.replace(
              "  '<EconomyChart', \"type: 'bar'\", \"type: 'pie'\", 'PopulationBudgetChart',",
              "  '<EconomyChart', \"type: 'bar'\", \"type: 'pie'\", 'padAngle: PIE_PAD_ANGLE', 'PopulationBudgetChart',",
          )
          source = source.replace(
              "  '`EconomyChart` 是业务数据图表的唯一 React 入口', '不得引入 `echarts-for-react`', 'ECharts 必须随市场、银行和管理员页面',",
              "  '`EconomyChart` 是业务数据图表的唯一 React 入口', '不得引入 `echarts-for-react`', 'ECharts 必须随市场、银行和管理员页面',\n  '`PIE_PAD_ANGLE = 5`', '`padAngle: PIE_PAD_ANGLE`',",
          )
          source = source.replace(
              '市场动态几何及管理员与资产图表均已锁定。',
              '市场动态几何、统一 Pie padAngle 及管理员与资产图表均已锁定。',
          )
          verifier.write_text(source, encoding='utf-8')
          PY

          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install dependencies
        if: steps.patch.outputs.changed == 'true'
        run: npm ci
      - name: Verify ECharts architecture
        if: steps.patch.outputs.changed == 'true'
        run: npm run verify:echarts
      - name: Build and test
        if: steps.patch.outputs.changed == 'true'
        run: npm run build
      - name: Install Chromium
        if: steps.patch.outputs.changed == 'true'
        run: npx playwright install --with-deps chromium
      - name: Run browser regression suite
        if: steps.patch.outputs.changed == 'true'
        run: npm run test:browser
      - name: Commit verified change
        if: steps.patch.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git add src/components/charts/chartOptions.ts \
            src/components/charts/AssetAllocationChart.tsx \
            src/components/charts/AdminCharts.tsx \
            docs/UI_DESIGN_SYSTEM.md \
            scripts/verify-echarts-adoption.mjs
          git diff --cached --check
          git commit -m "统一饼图扇区间隔"
          git push origin HEAD:agent/pie-pad-angle
