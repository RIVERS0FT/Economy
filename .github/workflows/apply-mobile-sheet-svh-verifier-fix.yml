name: Update mobile sheet viewport verifier

on:
  push:
    branches:
      - agent/fix-mobile-facility-sheet-opening-jitter

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: agent/fix-mobile-facility-sheet-opening-jitter
          fetch-depth: 0

      - name: Update verifier
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          from pathlib import Path
          path = Path('scripts/verify-unified-factory-recipes-grid.mjs')
          text = path.read_text()
          old = "  'max-height: min(88dvh, 760px);',"
          new = "  'max-height: min(88svh, 760px);',"
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected one old viewport verifier, found {count}')
          path.write_text(text.replace(old, new, 1))
          PYTHON

          git rm .github/workflows/apply-mobile-sheet-svh-verifier-fix.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- scripts/verify-unified-factory-recipes-grid.mjs
          git commit -m '同步移动详情稳定视口防回退'
          git push origin HEAD:agent/fix-mobile-facility-sheet-opening-jitter
