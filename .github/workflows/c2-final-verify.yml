name: C2 final branch verification

on:
  push:
    branches:
      - feature/c2-production-methods

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.4.0'
      - name: Normalize remaining current-version assertions
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const roots = ['README.md', 'docs', 'scripts', 'server/test'];
          const files = [];
          function walk(target) {
            if (!fs.existsSync(target)) return;
            const stat = fs.statSync(target);
            if (stat.isFile()) { files.push(target); return; }
            for (const name of fs.readdirSync(target)) walk(path.join(target, name));
          }
          for (const root of roots) walk(root);
          for (const file of files) {
            if (!/\.(?:md|mjs|js|ts|tsx)$/.test(file)) continue;
            let content = fs.readFileSync(file, 'utf8');
            let next = content;
            next = next.split('世界状态版本：27').join('世界状态版本：28');
            next = next.split('世界状态版本必须为 27').join('世界状态版本必须为 28');
            next = next.split("RESEARCH_WORLD_VERSION = 27").join("RESEARCH_WORLD_VERSION = 28");
            next = next.split('市场需求模型版本：18').join('市场需求模型版本：19');
            next = next.split('MARKET_DEMAND_MODEL_VERSION, 18').join('MARKET_DEMAND_MODEL_VERSION, 19');
            next = next.split('MARKET_DEMAND_MODEL_VERSION = 18').join('MARKET_DEMAND_MODEL_VERSION = 19');
            if (file === 'README.md') {
              next = next.split('36 种商品和 26 种工厂').join('38 种商品和 26 种工厂');
              next = next.split('36 种商品、26 种工厂').join('38 种商品、26 种工厂');
            }
            if (next !== content) fs.writeFileSync(file, next);
          }
          NODE
      - name: Install dependencies
        run: npm ci
      - name: Generate artwork
        run: npm run generate:artwork
      - name: Verify industry catalog
        run: node scripts/verify-industry-catalog.mjs
      - name: Verify production methods
        run: node scripts/verify-production-methods.mjs
      - name: Verify product artwork
        run: node scripts/verify-product-artwork.mjs
      - name: Verify document authority
        run: node scripts/verify-document-authority.mjs
      - name: Run focused server tests
        run: node --test server/test/production-methods.test.js server/test/research.test.js server/test/market-demand-v6.test.js server/test/all-products-demand.test.js server/test/market-liquidity.test.js server/test/fertilizer-factory.test.js
      - name: Build
        run: npm run build
      - name: Browser tests
        run: npm run test:browser
      - name: Commit normalized assertions and remove verifier
        run: |
          rm -f .github/workflows/c2-final-verify.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git commit -m "chore: finalize C2 production verification"
          git push origin HEAD:feature/c2-production-methods