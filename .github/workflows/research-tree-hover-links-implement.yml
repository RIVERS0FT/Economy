name: Research tree hover links implement

on:
  push:
    branches:
      - fix/research-tree-hover-links
    paths:
      - .github/workflows/research-tree-hover-links-implement.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/research-tree-hover-links
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.4.0
          cache: npm
      - name: Apply fix
        run: |
          python3 .agent/fix-research-tree-css-doc.py
          python3 .agent/fix-research-tree-test.py
          rm -f .agent/fix-research-tree-css-doc.py .agent/fix-research-tree-test.py
          rmdir .agent
          rm -f .github/workflows/research-tree-hover-links-implement.yml
          git add -u -- .agent .github/workflows
      - name: Install dependencies
        run: npm ci
      - name: Verify research page
        run: node scripts/verify-research-page.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run research browser regression
        run: npx playwright test tests/browser/research-technology-tree.spec.ts
      - name: Build
        run: npm run build
      - name: Run full browser regression
        run: npm run test:browser
      - name: Check diff
        run: git diff --check && git diff --cached --check
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/styles/research-page.css tests/browser/research-technology-tree.spec.ts scripts/verify-research-page.mjs docs/PAGE_CONTENT_AND_NAVIGATION_DESIGN.md
          git diff --cached --check
          git commit -m "fix: stabilize research tree interactions"
          git push origin HEAD:fix/research-tree-hover-links
