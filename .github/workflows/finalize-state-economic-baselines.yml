name: Finalize state economic baselines

on:
  push:
    branches:
      - feat/state-economic-baselines
    paths:
      - .github/workflows/finalize-state-economic-baselines.yml

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/state-economic-baselines
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.4.0
          cache: npm

      - name: Apply implementation and regression fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/apply-state-economic-baselines.yml').read_text(encoding='utf-8')
          start_marker = "      - name: Apply state economic baseline implementation\n        shell: bash\n        run: |\n"
          end_marker = "\n      - name: Install dependencies\n"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          Path('/tmp/apply-state-economic-baselines.sh').write_text(
              textwrap.dedent(workflow[start:end]),
              encoding='utf-8',
          )
          PY
          bash /tmp/apply-state-economic-baselines.sh

          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              target = Path(path)
              text = target.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"replacement mismatch {path}: expected 1, found {count} for {old[:120]!r}")
              target.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'server/test/market-demand-v6.test.js',
              "  world.marketDemand.modelVersion = 18;\n  runtime.normalizeWorld(world, now + 1_000);\n\n  assert.equal(world.marketDemand.modelVersion, 19);",
              "  world.marketDemand.modelVersion = 19;\n  runtime.normalizeWorld(world, now + 1_000);\n\n  assert.equal(world.marketDemand.modelVersion, 20);",
          )
          replace_once(
              'server/test/provinces.test.js',
              "  assert.equal(Object.hasOwn(state.provinceMarkets[GEORGIA] || {}, 'wheat'), false);",
              "  assert.equal(Object.hasOwn(state.provinceMarkets[GEORGIA] || {}, 'wheat'), true);\n  assert.equal(state.provinceMarkets[GEORGIA].wheat.provinceId, GEORGIA);",
          )

          replace_once(
              'server/src/market-demand.js',
              "      const rolePlans = [...plans.values()].filter((plan) => plan.role === role);\n      if (rolePlans.length === 0) continue;\n      const fundingByModel = new Map(POPULATION_MODEL_IDS.map((modelId) => [modelId, 0]));",
              "      const allRolePlans = [...plans.values()].filter((plan) => plan.role === role);\n      if (allRolePlans.length === 0) continue;\n      const plansByProvince = new Map();\n      for (const plan of allRolePlans) {\n        const provincePlans = plansByProvince.get(plan.provinceId) || [];\n        provincePlans.push(plan);\n        plansByProvince.set(plan.provinceId, provincePlans);\n      }\n      for (const rolePlans of plansByProvince.values()) {\n        const fundingByModel = new Map(POPULATION_MODEL_IDS.map((modelId) => [modelId, 0]));",
          )
          replace_once(
              'server/src/market-demand.js',
              "        market.demand.nextDemandAt = (cycleId + 1) * group.cycleMs;\n      }\n    }\n  }\n\n  function updateProductPressure",
              "        market.demand.nextDemandAt = (cycleId + 1) * group.cycleMs;\n      }\n      }\n    }\n  }\n\n  function updateProductPressure",
          )

          replace_once(
              'server/test/state-economic-baselines.test.js',
              "  for (const group of Object.values(world.marketDemand.groups)) {\n    const provinceBudget = Object.values(group.lastProvinceBudgets || {})",
              "  const cycleId = Math.floor(NOW / 300_000);\n  for (const group of Object.values(world.marketDemand.groups)) {\n    const provinceBudget = Object.values(group.lastProvinceBudgets || {})",
          )
          replace_once(
              'server/test/state-economic-baselines.test.js',
              "    assert.ok(caBudget > txBudget && txBudget > 0);\n  }",
              "    assert.ok(caBudget > txBudget && txBudget > 0);\n    for (const provinceId of [CALIFORNIA, TEXAS]) {\n      const committed = demandOrders\n        .filter((order) => order.demandGroupId === group.demandGroupId\n          && order.provinceId === provinceId\n          && Number(order.demandCycleId) === cycleId)\n        .reduce((sum, order) => sum + Number(order.price || 0) * Number(order.quantity || 0), 0);\n      assert.ok(committed <= Number(group.lastProvinceBudgets?.[provinceId] || 0) + 0.00001);\n    }\n  }",
          )
          PY
          git diff --check

      - name: Install dependencies
        run: npm ci

      - name: Run targeted server tests
        run: node --test server/test/state-economic-baselines.test.js server/test/market-demand-v6.test.js server/test/provinces.test.js server/test/population-economy.test.js

      - name: Verify population and provincial economy
        run: |
          node scripts/verify-staple-crops-demand.mjs
          npm run verify:provincial-economy

      - name: Run full build verification
        run: npm run build

      - name: Commit final implementation
        shell: bash
        run: |
          git rm .github/workflows/apply-state-economic-baselines.yml
          git rm .github/workflows/finalize-state-economic-baselines.yml
          git add -A
          git diff --cached --check
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: add state economic baselines"
          git push origin HEAD:feat/state-economic-baselines
