name: Run unified page-list patch
on:
  push:
    branches: [fix/unify-page-entity-lists]
    paths:
      - scripts/fix-unified-page-list-followup.py
      - .github/workflows/run-unified-page-list-patch.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/unify-page-entity-lists
      - run: python scripts/fix-unified-page-list-followup.py
      - run: git diff --check
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/verify-page-content.mjs
          git commit -m "同步统一页面列表防回退校验"
          git push
