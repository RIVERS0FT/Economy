name: PR 616 fix active frame race

on:
  push:
    branches:
      - codex/static-svg-map-camera

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/static-svg-map-camera
          fetch-depth: 0
      - name: Patch camera lifecycle and deterministic regression
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new, expected=1):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              actual = text.count(old)
              if actual != expected:
                  raise SystemExit(f'{path}: expected {expected} matches, found {actual}')
              p.write_text(text.replace(old, new), encoding='utf-8', newline='\n')

          replace_exact(
              'src/components/provinces/provinceMapCamera.ts',
              """  const scheduleWrite = (mode: Exclude<CameraInputMode, 'idle' | 'reset'>) => {\n    inputMode = mode;\n    if (!active) setActive(true);\n    if (frame === null) frame = requestAnimationFrame(writeCamera);\n    if (settleTimer !== null) clearTimeout(settleTimer);\n    settleTimer = setTimeout(() => {\n      settleTimer = null;\n      interactionBounds = null;\n      inputMode = 'idle';\n      setActive(false);\n    }, INPUT_SETTLE_MS);\n  };\n""",
              """  const scheduleSettle = () => {\n    if (settleTimer !== null) clearTimeout(settleTimer);\n    settleTimer = setTimeout(() => {\n      settleTimer = null;\n      if (destroyed) return;\n      if (frame !== null) {\n        scheduleSettle();\n        return;\n      }\n      interactionBounds = null;\n      inputMode = 'idle';\n      setActive(false);\n    }, INPUT_SETTLE_MS);\n  };\n\n  const scheduleWrite = (mode: Exclude<CameraInputMode, 'idle' | 'reset'>) => {\n    inputMode = mode;\n    if (!active) setActive(true);\n    if (frame === null) frame = requestAnimationFrame(writeCamera);\n    scheduleSettle();\n  };\n""",
          )

          replace_exact(
              'tests/browser/map-zoom-out-boundary.spec.ts',
              """async function wheelBurst(page: Page, deltaY: number, count: number) {\n  const canvas = page.getByTestId('us-mainland-map').locator('.province-map-static-viewport');\n  await canvas.evaluate((container, input) => {\n    const bounds = container.getBoundingClientRect();\n    for (let index = 0; index < input.count; index += 1) {\n      container.dispatchEvent(new WheelEvent('wheel', {\n        bubbles: true,\n        cancelable: true,\n        clientX: bounds.left + bounds.width / 2,\n        clientY: bounds.top + bounds.height / 2,\n        deltaY: input.deltaY,\n      }));\n    }\n  }, { deltaY, count });\n  await page.evaluate(() => new Promise<void>((resolve) => requestAnimationFrame(() => resolve())));\n}\n""",
              """async function wheelBurst(page: Page, deltaY: number, count: number) {\n  const canvas = page.getByTestId('us-mainland-map').locator('.province-map-static-viewport');\n  return canvas.evaluate((container, input) => new Promise<{ active: string | undefined; current: number }>((resolve) => {\n    const bounds = container.getBoundingClientRect();\n    for (let index = 0; index < input.count; index += 1) {\n      container.dispatchEvent(new WheelEvent('wheel', {\n        bubbles: true,\n        cancelable: true,\n        clientX: bounds.left + bounds.width / 2,\n        clientY: bounds.top + bounds.height / 2,\n        deltaY: input.deltaY,\n      }));\n    }\n    requestAnimationFrame(() => resolve({\n      active: container.dataset.mapZoomActive,\n      current: Number(container.dataset.mapZoomCurrent),\n    }));\n  }), { deltaY, count });\n}\n""",
          )

          replace_exact(
              'tests/browser/map-zoom-out-boundary.spec.ts',
              """  await wheelBurst(page, -180, 8);\n  expect(Number(await canvas.getAttribute('data-map-zoom-current'))).toBeGreaterThan(2.5);\n""",
              """  const zoomedInFrame = await wheelBurst(page, -180, 8);\n  expect(zoomedInFrame.current).toBeGreaterThan(2.5);\n""",
          )

          replace_exact(
              'tests/browser/map-zoom-out-boundary.spec.ts',
              """  await wheelBurst(page, 180, 16);\n  await expect(canvas).toHaveAttribute('data-map-zoom-active', 'true');\n  expect(Number(await canvas.getAttribute('data-map-zoom-current'))).toBeLessThanOrEqual(0.501);\n""",
              """  const zoomOutActiveFrame = await wheelBurst(page, 180, 16);\n  expect(zoomOutActiveFrame.active).toBe('true');\n  expect(zoomOutActiveFrame.current).toBeLessThanOrEqual(0.501);\n""",
          )

          replace_exact(
              'docs/LIQUID_GLASS_CHROME_DESIGN.md',
              """滚轮／双指围绕真实焦点更新 `x / y / zoom`，同一帧输入合并；`will-change: transform` 只在 active 期间临时开启并在停止后清除。""",
              """滚轮／双指围绕真实焦点更新 `x / y / zoom`，同一帧输入合并；只要仍有待提交的 `requestAnimationFrame` 相机写入，本轮输入就不得先进入 idle，必须至少提交一帧 active 合成结果后才允许 `INPUT_SETTLE_MS` 收口；`will-change: transform` 只在 active 期间临时开启并在停止后清除。""",
          )
          PY
      - name: Remove one-time workflow and commit
        run: |
          rm .github/workflows/pr616-fix-active-frame-race.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "修复地图 active 帧收口竞态"
          git push origin HEAD:codex/static-svg-map-camera
