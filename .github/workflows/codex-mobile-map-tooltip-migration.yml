name: codex-mobile-map-tooltip-migration

on:
  push:
    branches:
      - codex/hide-mobile-map-tooltip

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update authoritative map design
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/PAGE_CONTENT_AND_NAVIGATION_DESIGN.md')
          text = path.read_text(encoding='utf-8')
          replacements = [
              (
                  '未解锁州在地图上使用灰显视觉并在 Tooltip 标注“未解锁”，点击后同样打开州级上下文页并展示解锁面板。',
                  '未解锁州在地图上使用灰显视觉；桌面 Tooltip 标注“未解锁”，点击后同样打开州级上下文页并展示解锁面板。不大于 `720px` 时地图 Tooltip 必须禁用并隐藏，触摸州面直接打开州级上下文页，未解锁说明与解锁信息由该页解锁面板承担。',
              ),
              (
                  '地图提供州界、资产、工业、市场和异常五种镜头；镜头只改变州面视觉编码与 Tooltip 上下文，不得修改服务器权威数据、地区选择、本地库存、工厂或订单。桌面镜头栏固定在根级地图层底部安全区，并由更高的 UI 页面层自然遮挡；移动端隐藏镜头栏，保留中央可交互地图。',
                  '地图提供州界、资产、工业、市场和异常五种镜头；镜头只改变州面视觉编码与桌面 Tooltip 上下文，不得修改服务器权威数据、地区选择、本地库存、工厂或订单。桌面镜头栏固定在根级地图层底部安全区，并由更高的 UI 页面层自然遮挡；不大于 `720px` 时隐藏镜头栏和地图 Tooltip，保留中央可交互地图、州面触摸选择与缩放平移手势。',
              ),
              (
                  '标签层继续设置 `pointer-events: none`，不得拦截州面点击、拖动或 Tooltip，也不得维护第二套地图／相机状态。',
                  '标签层继续设置 `pointer-events: none`，不得拦截州面点击、拖动或桌面 Tooltip，也不得维护第二套地图／相机状态。',
              ),
              (
                  '- 把地图 `scaleLimit` 改离 `0.5～4`，移除滚轮／双指缩放、恢复独立放大／缩小／重置功能面板，或让页面切换、州面点击和镜头切换重置用户当前相机；',
                  '- 把地图 `scaleLimit` 改离 `0.5～4`，移除滚轮／双指缩放、恢复独立放大／缩小／重置功能面板，让页面切换、州面点击和镜头切换重置用户当前相机，或在不大于 `720px` 时恢复地图 Tooltip；',
              ),
              (
                  '- 把地图州名恢复为英文州缩写、ECharts 默认直线标签、固定屏幕字号、州外标签或引线标签；州名必须继续使用中文州全名、州面内 SVG `textPath` 曲线路径，名称与字号随地图缩放和平移同步变化，且标签层不得拦截州面交互或维护第二套相机状态；',
                  '- 把地图州名恢复为英文州缩写、ECharts 默认标签、固定屏幕字号、州外标签或引线标签，或恢复 `textPath`／`textLength`／非等比字形拉伸；州名必须继续使用中文州全名、州面内自然比例逐字刚性 SVG `text`，名称与字号随地图缩放和平移同步变化，且标签层不得拦截州面交互或维护第二套相机状态；',
              ),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one authoritative rule match, got {count}: {old[:80]}')
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8', newline='\n')
          PY
          grep -F '不大于 `720px` 时地图 Tooltip 必须禁用并隐藏' docs/PAGE_CONTENT_AND_NAVIGATION_DESIGN.md
          ! grep -F '州面内 SVG `textPath` 曲线路径' docs/PAGE_CONTENT_AND_NAVIGATION_DESIGN.md
      - name: Commit design and remove migration workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/PAGE_CONTENT_AND_NAVIGATION_DESIGN.md
          git rm .github/workflows/codex-mobile-map-tooltip-migration.yml
          git commit -m '同步移动地图悬浮提示设计'
          git push origin HEAD:codex/hide-mobile-map-tooltip
