name: Finalize state economic baselines v5

on:
  push:
    branches:
      - feat/state-economic-baselines
    paths:
      - .github/workflows/finalize-state-economic-baselines-v5.yml

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/state-economic-baselines
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.4.0
          cache: npm

      - name: Apply final implementation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/finalize-state-economic-baselines-v4.yml').read_text(encoding='utf-8')
          start_marker = "      - name: Apply implementation and fixes\n        shell: bash\n        run: |\n"
          end_marker = "\n      - name: Install dependencies\n"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          Path('/tmp/finalize-v4.sh').write_text(textwrap.dedent(workflow[start:end]), encoding='utf-8')
          PY
          bash /tmp/finalize-v4.sh

          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              target = Path(path)
              text = target.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"replacement mismatch {path}: expected 1, found {count} for {old[:120]!r}")
              target.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'docs/README.md',
              '16. 人口数量、工厂结构与活跃承载、迁入迁出、类别转换、劳动力就业、按实际人口计算的消费需求、三类人口六位小数真实钱包、私有 `fundingSlices`、',
              '16. 人口数量、工厂结构与活跃承载、迁入迁出、类别转换、劳动力就业、按实际人口计算的消费需求、州级居民经济只保存官方统计基准，不复制人口钱包、全局人口消费预算按当前经营州的 PCE 权重分摊并生成本地 `provinceId` 订单、三类人口六位小数真实钱包、私有 `fundingSlices`、',
          )
          replace_once(
              'scripts/verify-staple-crops-demand.mjs',
              '市场需求验证通过：模型 19 使用工厂承载驱动的实际人口与真实钱包覆盖全部 38 种商品，并保持双向报价、派生流动性和市场储备约束。',
              '市场需求验证通过：模型 20 使用工厂承载驱动的实际人口与真实钱包覆盖全部 38 种商品，并按州级 PCE 权重生成本地需求，同时保持双向报价、派生流动性和市场储备约束。',
          )
          PY
          git diff --check

      - name: Install dependencies
        run: npm ci

      - name: Run targeted server tests
        run: node --test server/test/state-economic-baselines.test.js server/test/market-demand-v6.test.js server/test/provinces.test.js server/test/population-economy.test.js

      - name: Verify population and provincial economy
        run: |
          node scripts/verify-staple-crops-demand.mjs
          npm run verify:provincial-economy

      - name: Run full build verification
        run: npm run build

      - name: Commit final implementation
        shell: bash
        run: |
          git rm .github/workflows/apply-state-economic-baselines.yml
          git rm .github/workflows/finalize-state-economic-baselines.yml
          git rm .github/workflows/finalize-state-economic-baselines-v2.yml
          git rm .github/workflows/finalize-state-economic-baselines-v3.yml
          git rm .github/workflows/finalize-state-economic-baselines-v4.yml
          git rm .github/workflows/finalize-state-economic-baselines-v5.yml
          git add -A
          git diff --cached --check
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: add state economic baselines"
          git push origin HEAD:feat/state-economic-baselines
