name: Apply profile rename timeout fix

on:
  push:
    branches:
      - "fix/profile-rename-timeout"
    paths:
      - ".github/workflows/apply-profile-rename-timeout.yml"
      - "scripts/apply-profile-rename-timeout-patch.py"

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message != '修复保存昵称触发全局订单写入超时'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/profile-rename-timeout
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.4.0
          cache: npm
      - name: Apply patch
        run: |
          python3 scripts/apply-profile-rename-timeout-patch.py
          rm scripts/apply-profile-rename-timeout-patch.py
      - name: Install dependencies
        run: npm ci
      - name: Select validation scope
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          changed_files="$RUNNER_TEMP/economy-profile-changed-files.txt"
          plan_file="$RUNNER_TEMP/economy-profile-ci-plan.json"
          printf '%s\n' \
            docs/SERVER_ARCHITECTURE_AND_DEPLOYMENT_DESIGN.md \
            docs/UNIFIED_ASSET_ORDER_BOOK_DESIGN.md \
            scripts/verify-runtime-efficiency.mjs \
            server/src/player-profile.js \
            server/src/world-storage-v2.js \
            server/test/player-profile.test.js \
            server/test/world-storage-v2.test.js \
            > "$changed_files"
          node scripts/select-ci-tests.mjs plan \
            --changed-files-file "$changed_files" \
            --plan-file "$plan_file"
          cat "$plan_file"
          mode="$(node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));process.stdout.write(p.mode)" "$plan_file")"
          browser_mode="$(node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));process.stdout.write(p.browser?.mode || 'none')" "$plan_file")"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "browser_mode=$browser_mode" >> "$GITHUB_OUTPUT"
      - name: Validate full scope checks
        if: steps.scope.outputs.mode == 'full'
        run: |
          node scripts/verify-deployment-pipeline.mjs
          npm run build
          git diff --check
      - name: Validate targeted scope checks
        if: steps.scope.outputs.mode == 'targeted'
        shell: bash
        run: |
          set -euo pipefail
          plan_file="$RUNNER_TEMP/economy-profile-ci-plan.json"
          node scripts/select-ci-tests.mjs run --plan-file "$plan_file" --phase checks
          git diff --check
      - name: Prepare Playwright Chromium
        if: steps.scope.outputs.mode == 'full' || steps.scope.outputs.browser_mode != 'none'
        run: bash scripts/prepare-playwright-chromium.sh
      - name: Validate full browser scope
        if: steps.scope.outputs.mode == 'full'
        run: npm run test:browser
      - name: Validate targeted browser scope
        if: steps.scope.outputs.mode == 'targeted' && steps.scope.outputs.browser_mode != 'none'
        shell: bash
        run: |
          set -euo pipefail
          plan_file="$RUNNER_TEMP/economy-profile-ci-plan.json"
          node scripts/select-ci-tests.mjs run --plan-file "$plan_file" --phase browser
      - name: Commit source
        run: |
          git config user.name 'RIVERSOFT'
          git config user.email '105160096+RIVERS0FT@users.noreply.github.com'
          git add \
            docs/SERVER_ARCHITECTURE_AND_DEPLOYMENT_DESIGN.md \
            docs/UNIFIED_ASSET_ORDER_BOOK_DESIGN.md \
            scripts/verify-runtime-efficiency.mjs \
            server/src/player-profile.js \
            server/src/world-storage-v2.js \
            server/test/player-profile.test.js \
            server/test/world-storage-v2.test.js
          git add -u scripts/apply-profile-rename-timeout-patch.py
          git commit -m '修复保存昵称触发全局订单写入超时'
          git push origin HEAD:fix/profile-rename-timeout
