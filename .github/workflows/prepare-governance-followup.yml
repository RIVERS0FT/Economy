name: Validate governance integration with main

on:
  push:
    branches:
      - chore/project-rules-ci-followup

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 24a53d35d4adfc78af86ebe531d250cdc6eec35a
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.4.0
          cache: npm
      - name: Integrate reviewed overlapping changes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          import tempfile
          BASE = '53a8561de91610829e8337db9896655fdb60ba27'
          OURS = '73be1506b4633ae429f02a80e466084f7546f5c5'
          MAIN = '24a53d35d4adfc78af86ebe531d250cdc6eec35a'
          def original(ref, path):
              return subprocess.check_output(['git', 'show', f'{ref}:{path}'], text=True).rstrip() + '\n'
          def replace(text, before, after):
              assert text.count(before) == 1, before
              return text.replace(before, after, 1)
          paths = subprocess.check_output(['git', 'diff', '--name-only', BASE, OURS], text=True).splitlines()
          assert len(paths) == 12, paths
          for path in paths:
              text = original(OURS, path)
              if path in ['docs/CI_EXECUTION_DESIGN.md', 'docs/PAGE_CONTENT_AND_NAVIGATION_DESIGN.md']:
                  with tempfile.TemporaryDirectory() as temp:
                      names = []
                      for name, ref in [('ours', OURS), ('base', BASE), ('main', MAIN)]:
                          target = Path(temp, name)
                          target.write_text(original(ref, path))
                          names.append(str(target))
                      merged = subprocess.run(['git', 'merge-file', '-p', *names], capture_output=True, text=True)
                      if merged.returncode:
                          raise RuntimeError(f'Unresolved document merge: {path}\n{merged.stdout}\n{merged.stderr}')
                      text = merged.stdout
              if path == 'scripts/select-ci-tests.mjs':
                  anchor = '  const domains = inferDomains(executableChanges);'
                  text = replace(text, anchor, anchor + '\n  const itDomains = inferDomains([...serverChanges, ...executableChanges.filter(isServerTest)]);')
                  anchor = '  const isDomainCandidate = (candidate) => domains.some((rule) => rule.candidate.test(candidate));'
                  text = replace(text, anchor, anchor + '\n  const isItDomainCandidate = (candidate) => itDomains.some((rule) => rule.candidate.test(candidate));')
                  text = replace(text, 'if (isDomainCandidate(candidate) || isReferenceCandidate(candidate)) selectedServerTests.add(candidate);', 'if (isItDomainCandidate(candidate) || isReferenceCandidate(candidate)) selectedServerTests.add(candidate);')
              if path == 'scripts/verify-deployment-pipeline.mjs':
                  anchor = "const facilityPlan = selectCiPlan(['src/pages/GlobalBuildingsPage.tsx']);"
                  block = """const frontendProvincePlan = selectCiPlan(['src/components/provinces/UsMainlandMap.tsx']);
          if (frontendProvincePlan.mode !== 'targeted') failures.push('纯前端战略地图改动必须使用 targeted CI');
          if (frontendProvincePlan.it.tests.length !== 0) failures.push('纯前端战略地图改动不得仅凭 province/map 域扩散服务器 IT');
          if (frontendProvincePlan.browser.mode !== 'selected' || frontendProvincePlan.browser.tests.length === 0) failures.push('纯前端战略地图改动必须选择相关 Playwright ST');

          """
                  text = replace(text, anchor, block + anchor)
                  anchor = "const docsPlan = selectCiPlan(['docs/SERVER_ARCHITECTURE_AND_DEPLOYMENT_DESIGN.md']);"
                  block = """const serverProvincePlan = selectCiPlan(['server/src/provinces.js']);
          if (serverProvincePlan.mode !== 'targeted') failures.push('地区服务端改动必须使用 targeted CI');
          if (!serverProvincePlan.it.tests.some((path) => /province/i.test(path))) failures.push('地区服务端改动必须继续选择相关 IT');

          """
                  text = replace(text, anchor, block + anchor)
              target = Path(path)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(text.rstrip() + '\n')
          PY
      - name: Validate focused behavior
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          node scripts/verify-document-authority.mjs
          node scripts/verify-deployment-pipeline.mjs
          node scripts/verify-runtime-reliability.mjs
          node --experimental-strip-types --test tests/dt/project-governance.test.ts
          node scripts/verify-repository-text-format.mjs
      - name: Store validated integration file objects
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const cp = require('node:child_process');
            const paths = cp.execFileSync('git', ['diff', '--cached', '--name-only', '-z'], {encoding: 'utf8'}).split('\0').filter(Boolean);
            const {owner, repo} = context.repo;
            const entries = [];
            for (const path of paths) {
              const blob = await github.rest.git.createBlob({owner, repo, content: fs.readFileSync(path).toString('base64'), encoding: 'base64'});
              entries.push({path, mode: '100644', type: 'blob', sha: blob.data.sha});
            }
            core.info('ECONOMY_INTEGRATED_ENTRIES=' + JSON.stringify(entries));
            await core.summary.addHeading('Validated integration files').addCodeBlock(JSON.stringify(entries, null, 2)).write();
      - name: Validate complete DT
        run: |
          set -euo pipefail
          npm ci
          npm run validate:dt 2>&1 | tee "$RUNNER_TEMP/governance-dt.log"
      - name: Save final integration patch
        if: always()
        run: git diff 24a53d35d4adfc78af86ebe531d250cdc6eec35a --binary > "$RUNNER_TEMP/governance-review.patch"
      - name: Upload integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: governance-integration-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/governance-review.patch
            ${{ runner.temp }}/governance-dt.log
          retention-days: 1
