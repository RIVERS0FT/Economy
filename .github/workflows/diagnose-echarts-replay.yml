name: Replay ECharts migration

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/echarts-migration-clean
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.4.0
          cache: npm
      - name: Replay migration on latest main
        id: replay
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin agent/echarts-migration main

          if git merge-base --is-ancestor origin/agent/echarts-migration HEAD; then
            echo "applied=true" >> "$GITHUB_OUTPUT"
            echo "Migration is already replayed."
            exit 0
          fi

          set +e
          git merge --no-commit --no-ff origin/agent/echarts-migration
          merge_status=$?
          set -e

          conflicts="$(git diff --name-only --diff-filter=U | sort)"
          expected_conflicts="$(printf '%s\n' README.md docs/README.md package.json | sort)"
          if [[ "$merge_status" -ne 1 || "$conflicts" != "$expected_conflicts" ]]; then
            echo "Unexpected replay result. status=$merge_status"
            echo "Conflicts:"
            printf '%s\n' "$conflicts"
            exit 1
          fi

          git checkout --ours README.md docs/README.md package.json
          git add README.md docs/README.md package.json
          rm -f .github/workflows/diagnose-echarts-main-sync.yml

          python3 - <<'PY'
          from pathlib import Path

          path = Path('docs/README.md')
          lines = path.read_text(encoding='utf-8').splitlines()
          market_rule = (
              '51. 市场行情图的整数坐标、成交量绘图区最低 `48px` 实际高度、最低 `22%` 数据区占比、'
              'ECharts SVG 双 Grid 动态实际高度／纵横比、底部安全区与图例居中唯一归属 '
              '`MARKET_CHART_LAYOUT_DESIGN.md`；页面职责和通用 UI 文档只保留模块边界与引用。实现必须同步 '
              '`PriceSparkline.tsx`、`scripts/verify-market-chart.mjs` 和真实浏览器几何回归，不得恢复窄屏压缩成交量区或强制固定 `16:9`。'
          )
          chart_rule = (
              '63. 项目业务数据图表只允许通过共享 `EconomyChart` 使用 Apache ECharts SVG；只安装 `echarts`，不得引入 '
              '`echarts-for-react`、第二套图表库或业务页面直接 `echarts.init`。初始化、按需模块、`ResizeObserver`、逐帧 resize、'
              '`dispose()`、设计令牌、中文无障碍摘要和稳定测试接口归 `UI_DESIGN_SYSTEM.md`；市场专项几何继续归 '
              '`MARKET_CHART_LAYOUT_DESIGN.md`。'
          )

          market_indexes = [index for index, line in enumerate(lines) if line.startswith('51. 市场行情图')]
          if market_indexes != [market_indexes[0]] if market_indexes else True:
              raise SystemExit(f'Expected exactly one market chart rule, found {len(market_indexes)}')
          lines[market_indexes[0]] = market_rule

          lines = [line for line in lines if not line.startswith('63. 项目业务数据图表')]
          while lines and not lines[-1].strip():
              lines.pop()
          lines.extend(['', chart_rule])
          path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

          node <<'NODE'
          const fs = require('node:fs');
          const packageJson = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          packageJson.dependencies ??= {};
          packageJson.dependencies.echarts = '6.1.0';
          packageJson.scripts['verify:echarts'] = 'node scripts/verify-echarts-adoption.mjs';
          const marker = 'node scripts/verify-ui-architecture-runner.mjs && ';
          if (!packageJson.scripts['verify:architecture'].includes('npm run verify:echarts')) {
            if (!packageJson.scripts['verify:architecture'].includes(marker)) {
              throw new Error('verify:architecture marker not found');
            }
            packageJson.scripts['verify:architecture'] = packageJson.scripts['verify:architecture']
              .replace(marker, `${marker}npm run verify:echarts && `);
          }
          fs.writeFileSync('package.json', `${JSON.stringify(packageJson, null, 2)}\n`);
          NODE

          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/verify-echarts-adoption.mjs')
          source = path.read_text(encoding='utf-8')
          old = "requireText('README.md', ['项目只安装 `echarts`，不引入 `echarts-for-react`']);"
          new = """requireText('docs/README.md', [
            '项目业务数据图表只允许通过共享 `EconomyChart` 使用 Apache ECharts SVG',
            '不得引入 `echarts-for-react`',
          ]);"""
          if old not in source:
              raise SystemExit('Old root README ECharts assertion not found')
          path.write_text(source.replace(old, new), encoding='utf-8')
          PY

          npm install --package-lock-only --ignore-scripts --save-exact echarts@6.1.0
          npm ci
          npm run verify:echarts
          git add -A
          git diff --cached --check
          echo "applied=false" >> "$GITHUB_OUTPUT"
      - name: Build and verify architecture
        if: steps.replay.outputs.applied == 'false'
        run: npm run build
      - name: Install Chromium
        if: steps.replay.outputs.applied == 'false'
        run: npx playwright install --with-deps chromium
      - name: Run browser regression suite
        if: steps.replay.outputs.applied == 'false'
        id: browser
        continue-on-error: true
        run: npm run test:browser
      - name: Upload browser diagnostics
        if: steps.replay.outputs.applied == 'false' && always()
        uses: actions/upload-artifact@v4
        with:
          name: echarts-replay-browser-diagnostics
          path: |
            playwright-report
            test-results
          retention-days: 1
          if-no-files-found: warn
      - name: Require browser regressions to pass
        if: steps.replay.outputs.applied == 'false' && steps.browser.outcome != 'success'
        run: exit 1
      - name: Commit verified replay
        if: steps.replay.outputs.applied == 'false'
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .agent
          test ! -e .github/workflows/diagnose-echarts-main-sync.yml
          git diff --cached --check
          git commit -m "feat: migrate project charts to Apache ECharts"
          git push origin HEAD:agent/echarts-migration-clean
