name: Commercial cross-cutting patch

on:
  push:
    branches:
      - feat/commercial-buildings

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/commercial-buildings
          fetch-depth: 0
      - name: Apply exact commercial patches
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'missing expected text in {path}: {old[:100]!r}')
              p.write_text(text.replace(old, new, 1))

          # Commercial buildings are real player assets and must remain in net-worth / leaderboard valuation.
          replace(
              'server/src/facility-groups.js',
              "} from './domain.js';\nimport { ensureWarehouse } from './warehouse.js';",
              "} from './domain.js';\nimport { COMMERCIAL_BUILDING_TYPE_CATALOG } from './commercial-buildings.js';\nimport { ensureWarehouse } from './warehouse.js';",
          )
          replace(
              'server/src/facility-groups.js',
              "  const bankDepositValue = Number(player?.bankAccount?.depositCredits || 0);",
              "  const commercialValue = (player.commercialBuildingGroups || []).reduce((sum, group) => {\n    const type = COMMERCIAL_BUILDING_TYPE_CATALOG.find((candidate) => candidate.id === group.commercialTypeId);\n    return sum + Math.max(0, Number(group.count || 0)) * Math.max(0, Number(type?.systemValue || 0));\n  }, 0);\n  const bankDepositValue = Number(player?.bankAccount?.depositCredits || 0);",
          )
          replace(
              'server/src/facility-groups.js',
              '  const grossAssetValue = cashValue + commodityValue + facilityValue;',
              '  const grossAssetValue = cashValue + commodityValue + facilityValue + commercialValue;',
          )
          replace(
              'server/src/facility-groups.js',
              '  const availableAssetValue = availableCashValue + bankDepositValue + availableCommodityValue + availableFacilityValue - liabilityValue;',
              '  const availableAssetValue = availableCashValue + bankDepositValue + availableCommodityValue + availableFacilityValue + commercialValue - liabilityValue;',
          )
          replace(
              'server/src/facility-groups.js',
              '    facilityValue,\n    bankDepositValue,',
              '    facilityValue,\n    commercialValue,\n    bankDepositValue,',
          )
          replace(
              'src/types.ts',
              '  facilityValue: number;\n',
              '  facilityValue: number;\n  commercialValue?: number;\n',
          )

          # Product-level rules: commercial buildings are a first-class asset and commercial margin is an explicit issuer.
          replace(
              'docs/PRODUCT_AND_GAMEPLAY_DESIGN.md',
              'Economy 是一款多人在线经济模拟、产业经营与市场交易游戏。玩家持有普通货币、宝石、商品、工厂数量、订单和工厂配方选择；不设置企业、城市地块或角色职业作为权威资产。',
              'Economy 是一款多人在线经济模拟、产业经营与市场交易游戏。玩家持有普通货币、宝石、商品、工厂数量、商业建筑数量、订单和工厂配方选择；不设置企业、城市地块或角色职业作为权威资产。',
          )
          replace(
              'docs/PRODUCT_AND_GAMEPLAY_DESIGN.md',
              '→ 消耗资金和原料完成完整周期，产成品进入工厂所在州级地区的本地无限仓库\n→ 合同覆盖的需求按权威条款准备、托管、履约和结算，未覆盖的缺口与剩余产出按同州当日官方系统价即时交易',
              '→ 消耗资金和原料完成完整周期，产成品进入工厂所在州级地区的本地无限仓库\n→ 商业建筑在所在州消耗本地仓库商品，并按 `COMMERCIAL_BUILDINGS_DESIGN.md` 的服务器权威周期获得固定商业利润\n→ 合同覆盖的需求按权威条款准备、托管、履约和结算，未覆盖的缺口与剩余产出按同州当日官方系统价即时交易',
          )
          replace(
              'docs/PRODUCT_AND_GAMEPLAY_DESIGN.md',
              '生产、产业链、合同和交易共同构成玩家持续增长来源；不存在可重复点击领取普通货币的基础工作玩法。',
              '工业生产、商业经营、产业链、合同和交易共同构成玩家持续增长来源；不存在可重复点击领取普通货币的基础工作玩法。商业建筑的商品消费、周期锁定和固定利润唯一以 `COMMERCIAL_BUILDINGS_DESIGN.md` 为准。',
          )
          replace(
              'docs/PRODUCT_AND_GAMEPLAY_DESIGN.md',
              '任一州都可直接进行商品即时交易／自动交易、建设或运营工厂以及使用仓库，唯一限制来自对应业务自身的资金、库存、研发、合同、运输等正式规则。',
              '任一州都可直接进行商品即时交易／自动交易、建设或运营工厂、建设或运营商业建筑以及使用仓库，唯一限制来自对应业务自身的资金、库存、研发、合同、运输等正式规则。',
          )
          replace(
              'docs/PRODUCT_AND_GAMEPLAY_DESIGN.md',
              '每次建设、生产、商品即时交易、工厂交易、自动交易、资产拍卖和跨州运输仍必须携带明确州级地区；内部协议继续使用兼容字段名 `provinceId`。',
              '每次工业建设、商业建设、工业生产、商业经营、商品即时交易、工厂交易、自动交易、资产拍卖和跨州运输仍必须携带明确州级地区；内部协议继续使用兼容字段名 `provinceId`。',
          )
          replace(
              'docs/PRODUCT_AND_GAMEPLAY_DESIGN.md',
              '商品库存、商品行情、工厂集群和服务器内部市场状态按州级地区隔离：玩家商品即时交易只改变成交州的本地资金与库存；人口／储备内部订单只能在同州模拟市场内撮合；工厂交易或拍卖后仍留在原地区。',
              '商品库存、商品行情、工厂集群、商业建筑集群和服务器内部市场状态按州级地区隔离：玩家商品即时交易只改变成交州的本地资金与库存；人口／储备内部订单只能在同州模拟市场内撮合；工厂交易或拍卖后仍留在原地区；商业建筑只消费自身所在州本地仓库商品。',
          )
          replace(
              'docs/PRODUCT_AND_GAMEPLAY_DESIGN.md',
              '5. 管理员生产工资系数高于 100% 时形成的生产工资补贴差额。',
              '5. 管理员生产工资系数高于 100% 时形成的生产工资补贴差额；\n6. 商业建筑完成已投入营业周期时，按 `COMMERCIAL_BUILDINGS_DESIGN.md` 发行锁定营业收入，其中只有目录固定商业利润构成玩家净资产新增。',
          )

          # Page owner: the hidden province context now has five sections, while the existing global `buildings` route remains technical/visible "建筑".
          replace(
              'docs/PAGE_CONTENT_AND_NAVIGATION_DESIGN.md',
              '点击地图州面后，在州名标题下切换概览、市场、建筑和仓库四个当前州经营分区',
              '点击地图州面后，在州名标题下切换概览、市场、商业、工业和仓库五个当前州经营分区',
          )
          replace(
              'docs/PAGE_CONTENT_AND_NAVIGATION_DESIGN.md',
              '`ProvincePage` 内的市场与建筑分区仍始终是地图所打开当前州的本地视图。',
              '`ProvincePage` 内的市场、商业与工业分区仍始终是地图所打开当前州的本地视图；“工业”只替换地区分区玩家可见名称，技术 section ID 继续使用 `buildings`。',
          )
          replace(
              'docs/PAGE_CONTENT_AND_NAVIGATION_DESIGN.md',
              '市场提供商品目录、今日官方价格、真实成交行情和当日价即时交易写操作；建筑与仓库直接显示本地经营内容；',
              '市场提供商品目录、今日官方价格、真实成交行情和当日价即时交易写操作；商业、工业与仓库直接显示本地经营内容；',
          )
          replace(
              'docs/PAGE_CONTENT_AND_NAVIGATION_DESIGN.md',
              '地区商品／工厂详情标题第二行的州级地区名是直接地区导航入口；点击或键盘激活时必须从当前 `regional-product`／`regional-facility` 位置 push `{ type: \'province\', provinceId, section: \'overview\' }`，不得 replace、不得按实体类型直接跳到 `market`／`buildings` 分区。该入口只复用现有 `ProvincePage`，不新增路由、状态或地区选择器；返回时必须恢复原商品／工厂详情。',
              '地区商品／商业建筑／工厂详情标题第二行的州级地区名是直接地区导航入口；点击或键盘激活时必须从当前 `regional-product`／`regional-commercial`／`regional-facility` 位置 push `{ type: \'province\', provinceId, section: \'overview\' }`，不得 replace、不得按实体类型直接跳到 `market`／`commerce`／`buildings` 分区。该入口只复用现有 `ProvincePage`，不新增地区选择器；返回时必须恢复原商品／商业建筑／工厂详情。',
          )
          replace(
              'docs/PAGE_CONTENT_AND_NAVIGATION_DESIGN.md',
              '- 市场当前选择的商品只属于市场交易上下文；建筑详情只承担工厂经营与生产配置，不提供工厂买卖入口、即时交易草稿或从属交易页。工厂所有权交易只能前往一级“拍卖”页面发起或竞拍；市场商品切换和市场目录合法化只能修改商品交易对应的 `marketAssetKind`、`marketAssetId` 及即时交易数量草稿，不得改写建筑页“建设新工厂”的类型选择。',
              '- 市场当前选择的商品只属于市场交易上下文；商业分区只承担当前州商业建筑建设、营业与消费商品解释；工业建筑详情只承担工厂经营与生产配置，不提供工厂买卖入口、即时交易草稿或从属交易页。工厂所有权交易只能前往一级“拍卖”页面发起或竞拍；市场商品切换和市场目录合法化只能修改商品交易对应的 `marketAssetKind`、`marketAssetId` 及即时交易数量草稿，不得改写商业建筑建设选择或工业建筑页“建设新工厂”的类型选择。',
          )

          # Industry and server owners only record their boundaries; commercial business rules stay in the commercial DESIGN.
          replace(
              'docs/INDUSTRY_AND_PRODUCTION_DESIGN.md',
              '市场交易以 `UNIFIED_ASSET_ORDER_BOOK_DESIGN.md` 为准；共享仓库以 `WAREHOUSE_EXPANSION_DESIGN.md` 为准；页面归属以 `PAGE_CONTENT_AND_NAVIGATION_DESIGN.md` 为准。',
              '市场交易以 `UNIFIED_ASSET_ORDER_BOOK_DESIGN.md` 为准；共享仓库以 `WAREHOUSE_EXPANSION_DESIGN.md` 为准；商业建筑资产与营业结算以 `COMMERCIAL_BUILDINGS_DESIGN.md` 为准；页面归属以 `PAGE_CONTENT_AND_NAVIGATION_DESIGN.md` 为准。本文中的“工厂”只表示工业生产资产，不包含商业建筑。',
          )
          replace(
              'docs/SERVER_ARCHITECTURE_AND_DEPLOYMENT_DESIGN.md',
              '- 工厂集群、当前与待生效配方、统一周期、即时建设结果与银行抵押数量；',
              '- 工厂集群、当前与待生效配方、统一周期、即时建设结果与银行抵押数量；\n- 按州保存的商业建筑集群、营业意图、已投入周期锁定收入、消费商品累计与商业结算审计；',
          )
          replace(
              'docs/SERVER_ARCHITECTURE_AND_DEPLOYMENT_DESIGN.md',
              '浏览器不得决定资产、存贷款、利息、抵押、违约处置、邀请奖励、封禁、拍卖、合同交付、成交、配方、生产结果或排行榜。',
              '浏览器不得决定资产、存贷款、利息、抵押、违约处置、邀请奖励、封禁、拍卖、合同交付、成交、配方、生产结果、商业周期结算或排行榜。',
          )

          # This workflow exists only to make exact surgical edits through the repository API-limited environment.
          Path('.github/workflows/commercial-cross-cutting-patch.yml').unlink()
          PY
      - name: Commit branch patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: 对齐商业资产与权威设计"
          git push origin HEAD:feat/commercial-buildings
