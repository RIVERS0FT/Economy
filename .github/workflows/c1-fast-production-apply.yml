name: Apply C1 fast production patch

on:
  pull_request:
    branches:
      - main

permissions:
  actions: write
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'agent/c1-fast-production'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/c1-fast-production
          fetch-depth: 0

      - name: Apply deterministic transformations
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('.agent/c1-fast-production.patch')
          text = path.read_text(encoding='utf-8')
          start = text.index("replace('server/test/facility-groups.test.js', \"\"\"  processFacilityGroupWorld(world, now + 360_000);")
          end = text.index("\n\nprint('C1 fast production transformations applied')", start)
          replacement = '''replace('server/test/facility-groups.test.js', "processFacilityGroupWorld(world, now + 360_000);", "processFacilityGroupWorld(world, now + 80_000);")
          replace('server/test/facility-groups.test.js', "assert.equal(player.credits, 94);", "assert.equal(player.credits, 99);")
          replace('server/test/facility-groups.test.js', "assert.equal(player.facilityGroups[0].staffingBatchCarryBps, 3_500);", "assert.equal(player.facilityGroups[0].staffingBatchCarryBps, 1_998);")
          replace('server/test/facility-groups.test.js', "assert.equal(player.facilityGroups[0].staffingRateBps, 8_500);", "assert.equal(player.facilityGroups[0].staffingRateBps, 3_832);")
          replace('server/test/facility-groups.test.js', "assert.equal(player.facilityGroups[0].cycleStaffingRateBps, 8_500);", "assert.equal(player.facilityGroups[0].cycleStaffingRateBps, 3_832);")'''
          path.write_text(text[:start] + replacement + text[end:], encoding='utf-8')
          PY
          python .agent/c1-fast-production.patch
          rm -f .agent/c1-fast-production.patch .github/workflows/c1-fast-production-apply.yml
          rmdir .agent 2>/dev/null || true

      - name: Commit source changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            server/src/industry-catalog.js \
            server/src/production-methods.js \
            server/src/facility-groups.js \
            server/src/market-demand/catalog.js \
            scripts/verify-industry-catalog.mjs \
            scripts/verify-production-methods.mjs \
            scripts/verify-recipe-profit-analysis.mjs \
            server/test/production-methods.test.js \
            server/test/domain.test.js \
            server/test/facility-groups.test.js \
            docs/README.md \
            docs/INDUSTRY_AND_PRODUCTION_DESIGN.md \
            .agent/c1-fast-production.patch \
            .github/workflows/c1-fast-production-apply.yml
          git diff --cached --check
          git commit -m '调整 C1 工厂为快速生产'
          git push origin HEAD:agent/c1-fast-production

      - name: Run final repository CI
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          head_sha="$(git rev-parse HEAD)"
          gh workflow run ci.yml --ref agent/c1-fast-production
          run_id=''
          for attempt in $(seq 1 30); do
            run_id="$(gh run list \
              --workflow ci.yml \
              --branch agent/c1-fast-production \
              --event workflow_dispatch \
              --limit 20 \
              --json databaseId,headSha \
              --jq ".[] | select(.headSha == \"${head_sha}\") | .databaseId" \
              | head -n 1)"
            if [ -n "$run_id" ]; then break; fi
            sleep 2
          done
          test -n "$run_id"
          gh run watch "$run_id" --exit-status
