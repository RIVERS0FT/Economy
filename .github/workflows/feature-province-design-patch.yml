name: Feature province design patch

on:
  push:
    branches:
      - codex/province-level-unlock

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/province-level-unlock
          fetch-depth: 0
      - name: Apply authoritative design and verifier patch
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          function patch(path, transform) {
            const before = fs.readFileSync(path, 'utf8');
            const after = transform(before);
            if (after === before) throw new Error(`No change produced for ${path}`);
            fs.writeFileSync(path, after);
          }
          function replaceOnce(source, from, to, label) {
            const first = source.indexOf(from);
            if (first < 0) throw new Error(`Missing ${label}`);
            if (source.indexOf(from, first + from.length) >= 0) throw new Error(`Ambiguous ${label}`);
            return source.slice(0, first) + to + source.slice(first + from.length);
          }

          patch('docs/PRODUCT_AND_GAMEPLAY_DESIGN.md', (source) => {
            source = replaceOnce(source, '> 更新时间：2026-08-27', '> 更新时间：2026-09-01', 'product design date');
            source = replaceOnce(
              source,
              '之后必须按货币费用逐个解锁其他州',
              '之后必须按目标地区水平与距永久起始州距离计算的货币费用逐个解锁其他州',
              'province unlock rule',
            );
            const anchor = '人口与工资用于州级经济基准和诊断；PCE 总额用于消费需求的州间分配权重，避免同时乘人口、工资和 PCE 造成重复放大。';
            const paragraph = '\n\n地区水平只由上述 48 州官方经济基准确定，不允许人工给州配置等级。对 `pceMillions`、`averageWeeklyWage`、`population` 分别在 48 州内计算百分位，同值使用平均百分位；综合分数固定为 PCE `50%` + 平均周薪 `30%` + 常住人口 `20%`。按综合分数升序（同分按 `provinceId`）把 48 州等量分为 1～5 级；运行时参数唯一来源为 `shared/province-economic-level-policy.json`。地区解锁不增加工厂数、已解锁州数或资产等额外门槛；玩家只需已确认起始州、目标州尚未解锁且普通货币足够。1～5 级地区基础解锁费依次为 `1,500 / 2,500 / 4,000 / 6,000 / 9,000` 普通货币，再按目标州到永久起始州的球面距离每完整 `500 km` 增加 `300`，总费用最多 `20,000`；起始州本身免费并永久绑定。所有解锁费用由服务器权威计算和扣除，客户端只使用同一策略展示费用拆分。';
            source = replaceOnce(source, anchor, anchor + paragraph, 'economic level authority');
            return source;
          });

          patch('docs/PAGE_CONTENT_AND_NAVIGATION_DESIGN.md', (source) => {
            source = replaceOnce(source, '> 更新时间：2026-08-31', '> 更新时间：2026-09-01', 'page design date');
            source = replaceOnce(
              source,
              '候选州名称／缩写、首府以及',
              '候选州中文名称、地区水平、首府以及',
              'starting province visible identity',
            );
            source = replaceOnce(
              source,
              '并明确提示永久绑定。只有概览面板的显式确认按钮',
              '并明确提示永久绑定；该面板不得显示 `shortName` 州缩写。只有概览面板的显式确认按钮',
              'starting province shortName prohibition',
            );
            source = replaceOnce(
              source,
              '建筑与仓库分区分别显示距离起始州、货币费用、当前资金与统一解锁按钮，按钮在资金不足时禁用并说明原因。',
              '建筑与仓库分区分别显示地区水平、常住人口、平均周薪、州 PCE、地区基础费用、距永久起始州距离、距离费用、总解锁费用和当前资金，并提供统一解锁按钮；按钮在资金不足时禁用并说明原因。锁定面板不得增加工厂数、资产、已解锁州数等额外解锁门槛，客户端费用拆分必须读取与服务器一致的共享策略，不得维护第二套价格。',
              'locked province panel rule',
            );
            return source;
          });

          patch('docs/UI_DESIGN_SYSTEM.md', (source) => {
            source = replaceOnce(source, '> 更新时间：2026-08-31', '> 更新时间：2026-09-01', 'ui design date');
            source = replaceOnce(
              source,
              '- 玩家可见界面统一使用中文，不允许固定文案中英文夹杂。',
              '- 玩家可见界面统一使用中文，不允许固定文案中英文夹杂。\n- 州级地区玩家可见名称唯一使用 `shared/provinces.json.name` 的中文短名；`shortName` 仅属于协议、目录映射、经济基准一致性校验和兼容测试元数据，不得出现在任何玩家可见标题、起始州概览、地图 Tooltip／文本、地区商品／工厂标题、银行抵押、合同、运输、拍卖、列表或可见 fallback。高密度列表也不得用州缩写替代中文名。',
              'player-visible province naming rule',
            );
            source = replaceOnce(
              source,
              '不得：\n\n- 把地区商品／工厂详情标题的地区导航恢复为纯文本',
              '不得：\n\n- 在任何玩家可见 React 页面或组件重新读取 `province.shortName`、`province?.shortName` 或等价 `shortName` fallback 作为地区显示；\n- 把地区商品／工厂详情标题的地区导航恢复为纯文本',
              'shortName anti-regression rule',
            );
            return source;
          });

          patch('src/pages/ProvincePage.tsx', (source) => replaceOnce(
            source,
            "const provinceName = model.selectedProvince?.name || '加利福尼亚州';",
            "const provinceName = model.selectedProvince?.name || '加利福尼亚';",
            'province name fallback',
          ));

          patch('scripts/verify-provincial-unlock-transport.mjs', (source) => {
            source = replaceOnce(
              source,
              "function requireText(source, text, message) {\n  if (!source.includes(text)) failures.push(message);\n}\n",
              "function requireText(source, text, message) {\n  if (!source.includes(text)) failures.push(message);\n}\nfunction forbidText(source, text, message) {\n  if (source.includes(text)) failures.push(message);\n}\n",
              'forbidText helper',
            );
            source = replaceOnce(
              source,
              "const pageDesign = read('docs/PAGE_CONTENT_AND_NAVIGATION_DESIGN.md');\n",
              "const pageDesign = read('docs/PAGE_CONTENT_AND_NAVIGATION_DESIGN.md');\nconst uiDesign = read('docs/UI_DESIGN_SYSTEM.md');\nconst provinceEconomicPolicy = JSON.parse(read('shared/province-economic-level-policy.json'));\n",
              'verifier design and policy reads',
            );
            source = replaceOnce(
              source,
              "const provinceAccess = read('server/src/province-access.js');\n",
              "const provinceAccess = read('server/src/province-access.js');\nconst stateEconomicBaselines = read('server/src/state-economic-baselines.js');\n",
              'server economic baseline read',
            );
            source = replaceOnce(
              source,
              "const provincePage = read('src/pages/ProvincePage.tsx');\n",
              "const provincePage = read('src/pages/ProvincePage.tsx');\nconst bankPage = read('src/pages/BankPage.tsx');\nconst contractPage = read('src/pages/ContractPage.tsx');\n",
              'visible page reads',
            );
            source = replaceOnce(
              source,
              "const provinceLogistics = read('src/utils/provinceLogistics.ts');\n",
              "const provinceLogistics = read('src/utils/provinceLogistics.ts');\nconst provinceEconomicLevel = read('src/utils/provinceEconomicLevel.ts');\n",
              'client economic level read',
            );
            source = replaceOnce(
              source,
              "requireText(productDesign, '跨州商品只能通过付费运输在已解锁州之间流动', '产品设计必须记录付费运输边界。');",
              "requireText(productDesign, '跨州商品只能通过付费运输在已解锁州之间流动', '产品设计必须记录付费运输边界。');\nrequireText(productDesign, '综合分数固定为 PCE `50%` + 平均周薪 `30%` + 常住人口 `20%`', '产品设计必须记录地区水平综合分数。');\nrequireText(productDesign, '1～5 级地区基础解锁费依次为 `1,500 / 2,500 / 4,000 / 6,000 / 9,000`', '产品设计必须锁定五档地区基础解锁费。');\nrequireText(productDesign, '每完整 `500 km` 增加 `300`', '产品设计必须锁定距离附加费。');\nrequireText(productDesign, '总费用最多 `20,000`', '产品设计必须锁定地区解锁费用上限。');",
              'product economic level checks',
            );
            source = replaceOnce(
              source,
              "requireText(pageDesign, '未解锁州仍保留“概览｜市场｜建筑｜仓库”四个分区', '页面设计必须记录未解锁州仍可浏览概览和市场。');",
              "requireText(pageDesign, '未解锁州仍保留“概览｜市场｜建筑｜仓库”四个分区', '页面设计必须记录未解锁州仍可浏览概览和市场。');\nrequireText(pageDesign, '候选州中文名称、地区水平、首府', '页面设计必须锁定起始州中文名称与地区水平展示。');\nrequireText(pageDesign, '该面板不得显示 `shortName` 州缩写', '页面设计必须禁止起始州概览显示州缩写。');\nrequireText(pageDesign, '地区水平、常住人口、平均周薪、州 PCE、地区基础费用、距永久起始州距离、距离费用、总解锁费用和当前资金', '页面设计必须锁定未解锁地区费用拆分。');\nrequireText(pageDesign, '不得增加工厂数、资产、已解锁州数等额外解锁门槛', '页面设计必须锁定无额外解锁门槛。');\nrequireText(uiDesign, '`shortName` 仅属于协议、目录映射、经济基准一致性校验和兼容测试元数据', 'UI 设计必须记录 shortName 仅作内部兼容元数据。');",
              'page and ui design checks',
            );
            source = replaceOnce(
              source,
              "requireText(provinceAccess, 'PROVINCE_UNLOCK_BASE_COST = 1500', '州访问模块必须锁定基础解锁费用。');\nrequireText(provinceAccess, 'PROVINCE_UNLOCK_COST_PER_500_KM = 300', '州访问模块必须锁定距离费用。');\nrequireText(provinceAccess, 'PROVINCE_UNLOCK_MAX_COST = 20000', '州访问模块必须锁定费用上限。');",
              "if (provinceEconomicPolicy.version !== 1) failures.push('地区水平策略版本必须为 1。');\nif (provinceEconomicPolicy.levelCount !== 5) failures.push('地区水平必须固定为五档。');\nif (JSON.stringify(provinceEconomicPolicy.weights) !== JSON.stringify({ pceMillions: 0.5, averageWeeklyWage: 0.3, population: 0.2 })) failures.push('地区水平权重必须保持 PCE 50%、工资 30%、人口 20%。');\nif (JSON.stringify(provinceEconomicPolicy.levelBaseCosts) !== JSON.stringify({ 1: 1500, 2: 2500, 3: 4000, 4: 6000, 5: 9000 })) failures.push('地区水平基础解锁费必须保持 1500/2500/4000/6000/9000。');\nif (provinceEconomicPolicy.distanceStepKm !== 500 || provinceEconomicPolicy.distanceCostPerStep !== 300 || provinceEconomicPolicy.maxUnlockCost !== 20000) failures.push('地区解锁距离步长、附加费和上限必须保持 500km/300/20000。');\nrequireText(stateEconomicBaselines, \"provinceEconomicLevelPolicy from '../../shared/province-economic-level-policy.json'\", '服务器经济基准必须读取共享地区水平策略。');\nrequireText(stateEconomicBaselines, 'stateEconomicLevelFor', '服务器经济基准必须导出地区水平。');\nrequireText(provinceAccess, 'stateEconomicLevelFor', '州访问模块必须使用服务器地区水平。');\nrequireText(provinceAccess, 'provinceUnlockBaseCostForLevel', '州访问模块必须按地区水平选择基础费用。');\nrequireText(provinceAccess, 'provinceUnlockCostBreakdown', '州访问模块必须提供权威费用拆分。');\nrequireText(provinceAccess, 'PROVINCE_UNLOCK_DISTANCE_STEP_KM', '州访问模块必须读取共享距离步长。');\nrequireText(provinceAccess, 'PROVINCE_UNLOCK_MAX_COST', '州访问模块必须读取共享费用上限。');",
              'server unlock policy checks',
            );
            source = replaceOnce(
              source,
              "requireText(provincePage, 'province-lock-content', '州页必须提供直接排列在正文的解锁内容。');",
              "requireText(provincePage, 'province-lock-content', '州页必须提供直接排列在正文的解锁内容。');\nrequireText(provincePage, 'provinceUnlockCostBreakdown', '州页必须使用共享解锁费用拆分。');\nfor (const text of ['label=\"地区水平\"', 'label=\"地区基础费用\"', 'label=\"距离费用\"', 'label=\"解锁费用\"']) requireText(provincePage, text, `州页解锁信息缺少：${text}`);",
              'province page breakdown checks',
            );
            source = replaceOnce(
              source,
              "requireText(gameShell, 'model.chooseStartingProvince(province.id)', '起始州必须在概览确认按钮中显式提交。');",
              "requireText(gameShell, 'model.chooseStartingProvince(province.id)', '起始州必须在概览确认按钮中显式提交。');\nrequireText(gameShell, 'label=\"地区水平\"', '起始州概览必须显示地区水平。');\nfor (const [label, visibleSource] of [['GameShell', gameShell], ['ProvincePage', provincePage], ['BankPage', bankPage], ['ContractPage', contractPage]]) forbidText(visibleSource, 'shortName', `${label} 玩家可见实现不得读取 shortName。`);",
              'visible shortName checks',
            );
            source = replaceOnce(
              source,
              "requireText(provinceLogistics, 'PROVINCE_UNLOCK_BASE_COST = 1500', '客户端物流工具必须与服务器同步基础费用。');\nrequireText(provinceLogistics, 'PROVINCE_UNLOCK_COST_PER_500_KM = 300', '客户端物流工具必须与服务器同步距离费用。');",
              "requireText(provinceEconomicLevel, \"provinceEconomicLevelPolicy from '../../shared/province-economic-level-policy.json'\", '客户端地区水平必须读取共享策略。');\nrequireText(provinceEconomicLevel, 'provinceEconomicLevelFor', '客户端必须提供地区水平计算。');\nrequireText(provinceLogistics, \"provinceEconomicLevelPolicy from '../../shared/province-economic-level-policy.json'\", '客户端物流工具必须读取共享地区水平策略。');\nrequireText(provinceLogistics, 'provinceUnlockCostBreakdown', '客户端物流工具必须同步解锁费用拆分。');\nrequireText(provinceLogistics, 'PROVINCE_UNLOCK_DISTANCE_STEP_KM', '客户端物流工具必须同步距离步长。');",
              'client unlock policy checks',
            );
            source = replaceOnce(
              source,
              "if (!provinceAccessTest.includes('world migration unlocks every state with existing assets')) {",
              "if (!provinceAccessTest.includes('economic levels cover five tiers with monotonic base costs')) {\n  failures.push('州访问测试必须覆盖五档地区水平与基础费用。');\n}\nif (!provinceAccessTest.includes('unlock cost follows economic level and distance and is deducted atomically')) {\n  failures.push('州访问测试必须覆盖地区水平与距离组合解锁费用。');\n}\nif (!provinceAccessTest.includes('world migration unlocks every state with existing assets')) {",
              'economic level tests checks',
            );
            source = replaceOnce(
              source,
              "console.log('起始州、州解锁与跨州运输验证通过：地图选点与左侧概览确认、永久起始州、货币解锁、三种运输模式参数、运费计入运输就业、在途按起始州官方价估值、锁定州写拒绝、持久化手动路线、独立运输页与老玩家迁移均已锁定。');",
              "console.log('起始州、州解锁与跨州运输验证通过：地图选点与左侧概览确认、永久起始州、地区水平与距离解锁、玩家界面中文地区名、三种运输模式参数、运费计入运输就业、在途按起始州官方价估值、锁定州写拒绝、持久化手动路线、独立运输页与老玩家迁移均已锁定。');",
              'verifier success text',
            );
            return source;
          });
          NODE
      - name: Commit generated patch
        shell: bash
        run: |
          git rm .github/workflows/feature-province-design-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/PRODUCT_AND_GAMEPLAY_DESIGN.md docs/PAGE_CONTENT_AND_NAVIGATION_DESIGN.md docs/UI_DESIGN_SYSTEM.md src/pages/ProvincePage.tsx scripts/verify-provincial-unlock-transport.mjs
          git diff --check
          git commit -m "同步地区水平设计与防回退"
          git push origin HEAD:codex/province-level-unlock
