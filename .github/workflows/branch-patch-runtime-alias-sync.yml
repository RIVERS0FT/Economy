name: Apply runtime alias sync patch

on:
  push:
    branches:
      - fix/market-cycle-stall-deploy-timeout
    paths:
      - .github/workflows/branch-patch-runtime-alias-sync.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/market-cycle-stall-deploy-timeout
          fetch-depth: 0

      - name: Apply runtime alias sync
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new, label):
              target = Path(path)
              text = target.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              target.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')

          replace_exact(
              'server/src/provinces.js',
              '    const count = Math.max(0, Math.floor(Number(group?.count || 0)));',
              '    const count = Math.max(0, Number(group?.count || 0));',
              'restore province summary count semantics',
          )

          replace_exact(
              'server/src/domain-core.js',
              "  provinceAssetSummaries,\n  provinceScopedKey,\n  splitProvinceScopedKey,\n",
              "  provinceAssetSummaries,\n  provinceScopedKey,\n  splitProvinceScopedKey,\n  syncDefaultProvinceAlias,\n",
              'domain core province import',
          )
          replace_exact(
              'server/src/domain-core.js',
              """  world.markets[key] ||= createMarket(product, Date.now(), selectedProvinceId);\n  installDefaultProvinceAliases(world.markets);\n  return world.markets[key];\n""",
              """  world.markets[key] ||= createMarket(product, Date.now(), selectedProvinceId);\n  installDefaultProvinceAliases(world.markets);\n  if (selectedProvinceId === DEFAULT_PROVINCE_ID) syncDefaultProvinceAlias(world.markets, product.id);\n  return world.markets[key];\n""",
              'domain core market alias sync',
          )

          replace_exact(
              'server/src/balanced-market.js',
              "  normalizeProvinceId,\n  provinceScopedKey,\n} from './provinces.js';\n",
              "  normalizeProvinceId,\n  provinceScopedKey,\n  syncDefaultProvinceAlias,\n} from './provinces.js';\n",
              'balanced market province import',
          )
          replace_exact(
              'server/src/balanced-market.js',
              """    world.markets[key] ||= createMarket(product, now, selectedProvinceId);\n    installDefaultProvinceAliases(world.markets);\n    return world.markets[key];\n""",
              """    world.markets[key] ||= createMarket(product, now, selectedProvinceId);\n    installDefaultProvinceAliases(world.markets);\n    if (selectedProvinceId === DEFAULT_PROVINCE_ID) syncDefaultProvinceAlias(world.markets, product.id);\n    return world.markets[key];\n""",
              'balanced market alias sync',
          )

          replace_exact(
              'server/src/facility-groups.js',
              "  provinceScopedKey,\n  splitProvinceScopedKey,\n} from './provinces.js';\n",
              "  provinceScopedKey,\n  splitProvinceScopedKey,\n  syncDefaultProvinceAlias,\n} from './provinces.js';\n",
              'facility group province import',
          )
          replace_exact(
              'server/src/facility-groups.js',
              """  world.facilityMarkets[key] ||= createFacilityMarket(type, now, selectedProvinceId);\n  installDefaultProvinceAliases(world.facilityMarkets);\n  return world.facilityMarkets[key];\n""",
              """  world.facilityMarkets[key] ||= createFacilityMarket(type, now, selectedProvinceId);\n  installDefaultProvinceAliases(world.facilityMarkets);\n  if (selectedProvinceId === DEFAULT_PROVINCE_ID) syncDefaultProvinceAlias(world.facilityMarkets, type.id);\n  return world.facilityMarkets[key];\n""",
              'facility market alias sync',
          )

          old_design = '> 州级运行时兼容别名的全量安装只允许在世界冷加载／迁移或同一 record 首次访问时执行一次；同一 `markets`／`facilityMarkets`／玩家 `inventories` record 的后续热查询必须复用已安装别名与迁移结果。48 州需求周期会高频查询州级市场与库存，重复 O(州数 × 商品数) 属性扫描会阻塞 Node 事件循环并让正常 API 穿透 Nginx 30 秒超时。'
          new_design = '> 州级运行时兼容别名的全量安装只允许在世界冷加载／迁移或同一 record 首次访问时执行一次；同一 `markets`／`facilityMarkets`／玩家 `inventories` record 的后续热查询必须复用已安装别名与迁移结果。运行时新增或删除默认州的单个 scoped 键时，只允许同步该资产对应的兼容别名，不得重新扫描整份 record。48 州需求周期会高频查询州级市场与库存，重复 O(州数 × 商品数) 属性扫描会阻塞 Node 事件循环并让正常 API 穿透 Nginx 30 秒超时。'
          replace_exact(
              'docs/SERVER_ARCHITECTURE_AND_DEPLOYMENT_DESIGN.md',
              old_design,
              new_design,
              'authoritative incremental alias rule',
          )
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/src/provinces.js server/src/domain-core.js server/src/balanced-market.js server/src/facility-groups.js docs/SERVER_ARCHITECTURE_AND_DEPLOYMENT_DESIGN.md
          git commit -m "补齐州级运行时别名增量同步"
          git push origin HEAD:fix/market-cycle-stall-deploy-timeout
