name: Agent production method demand safeguard

on:
  push:
    branches:
      - agent/factory-production-methods

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/factory-production-methods
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Keep production variants out of the demand graph
        run: node scripts/agent-filter-production-method-demand.mjs
      - name: Commit safeguard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            server/src/market-demand.js \
            server/src/domain.js \
            scripts/verify-production-methods.mjs \
            docs/INDUSTRY_AND_PRODUCTION_DESIGN.md \
            docs/SERVER_ARCHITECTURE_AND_DEPLOYMENT_DESIGN.md
          if git diff --cached --quiet; then
            echo "No safeguard edits required."
          else
            git commit -m "fix: keep production methods out of demand graph"
            git push origin HEAD:agent/factory-production-methods
          fi
