name: Implement daily check-in

on:
  push:
    branches:
      - agent/daily-check-in

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/daily-check-in
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Apply implementation
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          root = Path('.')

          def read(path):
              return (root / path).read_text()

          def write(path, content):
              target = root / path
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(content)

          def replace_once(path, old, new):
              text = read(path)
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one occurrence, found {count}: {old[:100]!r}')
              write(path, text.replace(old, new, 1))

          def replace_regex(path, pattern, replacement, flags=0):
              text = read(path)
              next_text, count = re.subn(pattern, replacement, text, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f'{path}: regex did not match exactly once: {pattern}')
              write(path, next_text)

          daily_check_in = r'''export const CHECK_IN_TIME_ZONE = 'Asia/Shanghai';
          export const DAILY_CHECK_IN_REWARD_GEMS = 1;
          export const WEEKLY_FULL_ATTENDANCE_REWARD_GEMS = 5;
          export const CHECK_IN_DAY_MS = 24 * 60 * 60 * 1000;

          const SHANGHAI_OFFSET_MS = 8 * 60 * 60 * 1000;

          function safeTimestamp(value, fallback) {
            const timestamp = Number(value);
            return Number.isFinite(timestamp) && timestamp >= 0 ? timestamp : fallback;
          }

          export function checkInDateKey(now = Date.now()) {
            return new Date(safeTimestamp(now, Date.now()) + SHANGHAI_OFFSET_MS).toISOString().slice(0, 10);
          }

          export function dailyCheckInPeriodFor(now = Date.now()) {
            const timestamp = safeTimestamp(now, Date.now());
            const local = new Date(timestamp + SHANGHAI_OFFSET_MS);
            const localDayStart = Date.UTC(local.getUTCFullYear(), local.getUTCMonth(), local.getUTCDate());
            const todayStartsAt = localDayStart - SHANGHAI_OFFSET_MS;
            const daysSinceMonday = (local.getUTCDay() + 6) % 7;
            const localMonday = Date.UTC(
              local.getUTCFullYear(),
              local.getUTCMonth(),
              local.getUTCDate() - daysSinceMonday,
            );
            const weekStartsAt = localMonday - SHANGHAI_OFFSET_MS;
            const dateKeys = Array.from({ length: 7 }, (_, index) => (
              checkInDateKey(weekStartsAt + index * CHECK_IN_DAY_MS)
            ));
            return {
              todayKey: checkInDateKey(timestamp),
              todayStartsAt,
              nextResetAt: todayStartsAt + CHECK_IN_DAY_MS,
              weekKey: checkInDateKey(weekStartsAt),
              weekStartsAt,
              weekEndsAt: weekStartsAt + 7 * CHECK_IN_DAY_MS,
              dateKeys,
            };
          }

          export function nextDailyCheckInResetAt(now = Date.now()) {
            return dailyCheckInPeriodFor(now).nextResetAt;
          }

          export function processDailyCheckInWorld(world, now = Date.now()) {
            const dateKey = checkInDateKey(now);
            if (world?.checkInDateKey === dateKey) return false;
            world.checkInDateKey = dateKey;
            return true;
          }

          export function createDailyCheckInSummary(player, rows = [], now = Date.now()) {
            const period = dailyCheckInPeriodFor(now);
            const validDateKeys = new Set(period.dateKeys);
            const claimedDateKeys = [...new Set((rows || [])
              .map((row) => String(row?.date_key || row?.dateKey || ''))
              .filter((dateKey) => validDateKeys.has(dateKey)))]
              .sort();
            const weeklyBonusEarned = (rows || []).some((row) => (
              Number(row?.weekly_bonus_gems ?? row?.weeklyBonusGems ?? 0) > 0
            ));
            const registeredAt = safeTimestamp(player?.registeredAt, now);
            return {
              timeZone: CHECK_IN_TIME_ZONE,
              todayKey: period.todayKey,
              weekKey: period.weekKey,
              weekStartsAt: period.weekStartsAt,
              weekEndsAt: period.weekEndsAt,
              nextResetAt: period.nextResetAt,
              dateKeys: period.dateKeys,
              claimedToday: claimedDateKeys.includes(period.todayKey),
              claimedDateKeys,
              weeklyClaimCount: claimedDateKeys.length,
              weeklyBonusEarned,
              weeklyBonusEligible: registeredAt <= period.weekStartsAt,
              dailyRewardGems: DAILY_CHECK_IN_REWARD_GEMS,
              weeklyBonusGems: WEEKLY_FULL_ATTENDANCE_REWARD_GEMS,
            };
          }

          export function dailyCheckInRewardFor(player, rows = [], now = Date.now()) {
            const summary = createDailyCheckInSummary(player, rows, now);
            if (summary.claimedToday) {
              return { summary, alreadyClaimed: true, dailyGems: 0, weeklyBonusGems: 0, totalGems: 0 };
            }
            const weeklyBonusGems = summary.weeklyBonusEligible
              && !summary.weeklyBonusEarned
              && summary.weeklyClaimCount === 6
              ? WEEKLY_FULL_ATTENDANCE_REWARD_GEMS
              : 0;
            return {
              summary,
              alreadyClaimed: false,
              dailyGems: DAILY_CHECK_IN_REWARD_GEMS,
              weeklyBonusGems,
              totalGems: DAILY_CHECK_IN_REWARD_GEMS + weeklyBonusGems,
            };
          }
          '''
          write('server/src/daily-check-in.js', re.sub(r'^          ', '', daily_check_in, flags=re.M))

          daily_test = r'''import assert from 'node:assert/strict';
          import test from 'node:test';
          import {
            CHECK_IN_DAY_MS,
            DAILY_CHECK_IN_REWARD_GEMS,
            WEEKLY_FULL_ATTENDANCE_REWARD_GEMS,
            dailyCheckInPeriodFor,
          } from '../src/daily-check-in.js';
          import { EconomyStore } from '../src/storage.js';

          const MONDAY_SHANGHAI = Date.UTC(2026, 6, 12, 16, 0, 0, 0);

          function user(id = 1) {
            return { id, email: `check-in-${id}@example.com`, name: `签到玩家${id}`, role: 'user' };
          }

          function claim(store, account, now, key) {
            return store.apply(account, {
              action: 'checkIn',
              payload: {},
              requestKey: key,
              method: 'POST',
              path: '/api/game/check-in',
            }, now);
          }

          test('daily check-in boundaries use Monday weeks and Shanghai midnight', () => {
            const beforeMonday = dailyCheckInPeriodFor(MONDAY_SHANGHAI - 1);
            const monday = dailyCheckInPeriodFor(MONDAY_SHANGHAI);
            assert.equal(beforeMonday.weekKey, '2026-07-06');
            assert.equal(monday.weekKey, '2026-07-13');
            assert.equal(monday.todayKey, '2026-07-13');
            assert.equal(monday.nextResetAt, MONDAY_SHANGHAI + CHECK_IN_DAY_MS);
            assert.deepEqual(monday.dateKeys, [
              '2026-07-13', '2026-07-14', '2026-07-15', '2026-07-16',
              '2026-07-17', '2026-07-18', '2026-07-19',
            ]);
          });

          test('daily check-in grants one gem once per server day', () => {
            const store = new EconomyStore(':memory:', { scheduledProcessing: false });
            const account = user(1);
            try {
              store.getState(account, MONDAY_SHANGHAI - CHECK_IN_DAY_MS);
              const now = MONDAY_SHANGHAI + 12 * 60 * 60 * 1000;
              const first = claim(store, account, now, 'check-in-once-0001');
              const duplicate = claim(store, account, now + 1, 'check-in-once-0002');
              assert.equal(first.result.ok, true);
              assert.match(first.result.message, /获得 1 宝石/);
              assert.equal(duplicate.result.ok, false);
              assert.match(duplicate.result.message, /今日已签到/);
              const state = store.getState(account, now + 2);
              assert.equal(state.gems, DAILY_CHECK_IN_REWARD_GEMS);
              assert.equal(state.checkIn.claimedToday, true);
              assert.equal(state.checkIn.weeklyClaimCount, 1);
              assert.equal(store.database.prepare('SELECT COUNT(*) AS count FROM economy_daily_check_ins').get().count, 1);
              assert.equal(store.database.prepare("SELECT COUNT(*) AS count FROM economy_gem_ledger WHERE category = 'daily_check_in'").get().count, 1);
            } finally {
              store.close();
            }
          });

          test('seven complete days atomically grant the five-gem full-attendance bonus', () => {
            const store = new EconomyStore(':memory:', { scheduledProcessing: false });
            const account = user(2);
            try {
              store.getState(account, MONDAY_SHANGHAI - CHECK_IN_DAY_MS);
              for (let index = 0; index < 7; index += 1) {
                const result = claim(
                  store,
                  account,
                  MONDAY_SHANGHAI + index * CHECK_IN_DAY_MS + 12 * 60 * 60 * 1000,
                  `full-week-${String(index).padStart(4, '0')}`,
                );
                assert.equal(result.result.ok, true);
              }
              const state = store.getState(account, MONDAY_SHANGHAI + 6 * CHECK_IN_DAY_MS + 13 * 60 * 60 * 1000);
              assert.equal(state.gems, 7 * DAILY_CHECK_IN_REWARD_GEMS + WEEKLY_FULL_ATTENDANCE_REWARD_GEMS);
              assert.equal(state.checkIn.weeklyClaimCount, 7);
              assert.equal(state.checkIn.weeklyBonusEarned, true);
              assert.equal(store.database.prepare("SELECT COUNT(*) AS count FROM economy_gem_ledger WHERE category = 'weekly_full_attendance'").get().count, 1);
              assert.equal(store.database.prepare('SELECT COUNT(*) AS count FROM economy_gem_ledger').get().count, 8);
            } finally {
              store.close();
            }
          });

          test('registration week can claim daily gems but cannot receive full-attendance bonus', () => {
            const store = new EconomyStore(':memory:', { scheduledProcessing: false });
            const account = user(3);
            try {
              const wednesday = MONDAY_SHANGHAI + 2 * CHECK_IN_DAY_MS;
              store.getState(account, wednesday + 60_000);
              for (let index = 2; index < 7; index += 1) {
                claim(
                  store,
                  account,
                  MONDAY_SHANGHAI + index * CHECK_IN_DAY_MS + 12 * 60 * 60 * 1000,
                  `partial-week-${String(index).padStart(4, '0')}`,
                );
              }
              const state = store.getState(account, MONDAY_SHANGHAI + 6 * CHECK_IN_DAY_MS + 13 * 60 * 60 * 1000);
              assert.equal(state.gems, 5);
              assert.equal(state.checkIn.weeklyBonusEligible, false);
              assert.equal(state.checkIn.weeklyBonusEarned, false);
              assert.equal(store.database.prepare("SELECT COUNT(*) AS count FROM economy_gem_ledger WHERE category = 'weekly_full_attendance'").get().count, 0);
            } finally {
              store.close();
            }
          });
          '''
          write('server/test/daily-check-in.test.js', re.sub(r'^          ', '', daily_test, flags=re.M))

          verify_daily = r'''import fs from 'node:fs';
          import path from 'node:path';
          import process from 'node:process';
          import { fileURLToPath } from 'node:url';

          const root = path.resolve(path.dirname(fileURLToPath(import.meta.url)), '..');
          const read = (relativePath) => fs.readFileSync(path.join(root, relativePath), 'utf8');
          const failures = [];
          const check = (condition, message) => { if (!condition) failures.push(message); };

          const daily = read('server/src/daily-check-in.js');
          const storage = read('server/src/storage.js');
          const routes = read('server/src/game-routes.js');
          const overview = read('src/pages/OverviewPage.tsx');
          const types = read('src/types.ts');
          const productDesign = read('docs/PRODUCT_AND_GAMEPLAY_DESIGN.md');
          const pageDesign = read('docs/PAGE_CONTENT_AND_NAVIGATION_DESIGN.md');
          const serverDesign = read('docs/SERVER_ARCHITECTURE_AND_DEPLOYMENT_DESIGN.md');

          check(daily.includes("CHECK_IN_TIME_ZONE = 'Asia/Shanghai'"), 'check-in must use Shanghai time');
          check(daily.includes('DAILY_CHECK_IN_REWARD_GEMS = 1'), 'daily reward must be one gem');
          check(daily.includes('WEEKLY_FULL_ATTENDANCE_REWARD_GEMS = 5'), 'weekly bonus must be five gems');
          check(routes.includes("path === '/api/game/check-in'"), 'check-in route is missing');
          check(storage.includes('economy_daily_check_ins'), 'daily check-in table is missing');
          check(storage.includes("'daily_check_in'"), 'daily gem ledger category is missing');
          check(storage.includes("'weekly_full_attendance'"), 'weekly gem ledger category is missing');
          check(storage.includes("'leaderboard_reward'"), 'leaderboard gem ledger category is missing');
          check(types.includes('export interface DailyCheckInState'), 'client check-in state type is missing');
          check(types.includes('checkIn: DailyCheckInState;'), 'EconomyState check-in field is missing');
          check(overview.includes('title="本周签到"'), 'overview check-in card is missing');
          check(overview.includes('role="list" aria-label="本周签到日历"'), 'check-in calendar semantics are missing');
          check(overview.includes('签到领取 1 宝石'), 'daily claim button copy is missing');
          check(!overview.includes('market-summary'), 'overview market card must be removed');
          check(!overview.includes('PriceSparkline'), 'overview must not render the market chart');
          check(productDesign.includes('每日签到'), 'product design must record daily check-in');
          check(productDesign.includes('每周全勤'), 'product design must record weekly attendance');
          check(pageDesign.includes('签到日历'), 'page design must record the check-in calendar');
          check(serverDesign.includes('economy_daily_check_ins'), 'server design must record check-in persistence');

          if (failures.length > 0) {
            console.error('Daily check-in verification failed:');
            for (const failure of failures) console.error(`- ${failure}`);
            process.exit(1);
          }
          console.log('Daily check-in verification passed.');
          '''
          write('scripts/verify-daily-check-in.mjs', re.sub(r'^          ', '', verify_daily, flags=re.M))

          # Server routes.
          replace_once(
              'server/src/game-routes.js',
              "  if (method === 'POST' && path === '/api/game/work') return { action: 'work', category: 'general' };\n",
              "  if (method === 'POST' && path === '/api/game/work') return { action: 'work', category: 'general' };\n  if (method === 'POST' && path === '/api/game/check-in') return { action: 'checkIn', category: 'general' };\n",
          )

          # Daily reset participates in the single deadline planner.
          replace_once(
              'server/src/world-deadline-planner.js',
              "import { createContractRuntimeIndex } from './contract-runtime-index.js';\n",
              "import { createContractRuntimeIndex } from './contract-runtime-index.js';\nimport { nextDailyCheckInResetAt } from './daily-check-in.js';\n",
          )
          replace_once(
              'server/src/world-deadline-planner.js',
              "    leaderboard: leaderboardDeadline(world, normalizedNow),\n    orderPrune: orderPruneDeadline(world, normalizedNow),\n",
              "    leaderboard: leaderboardDeadline(world, normalizedNow),\n    checkIn: nextDailyCheckInResetAt(normalizedNow),\n    orderPrune: orderPruneDeadline(world, normalizedNow),\n",
          )

          # Leaderboard rewards and transaction callback for the unified gem ledger.
          replace_once('server/src/leaderboards.js', 'export const LEADERBOARD_REWARDS = Object.freeze([30, 20, 10]);', 'export const LEADERBOARD_REWARDS = Object.freeze([50, 30, 20]);')
          replace_once('server/src/leaderboards.js', 'function awardPeriod(world, state, settledAt) {', 'function awardPeriod(world, state, settledAt, onGemReward) {')
          replace_once(
              'server/src/leaderboards.js',
              "        playerStats(player).leaderboardGemsIssued += gems;\n      }\n",
              "        playerStats(player).leaderboardGemsIssued += gems;\n        onGemReward?.({\n          userId: Number(entry.userId),\n          amount: gems,\n          balanceAfter: player.gems,\n          category: 'leaderboard_reward',\n          description: `${boardDefinition(boardId).title}第 ${index + 1} 名奖励 ${gems} 宝石`,\n          sourceKey: `leaderboard:${state.periodKey}:${boardId}:${entry.userId}`,\n          createdAt: settledAt,\n        });\n      }\n",
          )
          replace_once(
              'server/src/leaderboards.js',
              'export function processLeaderboardWorld(world, now = Date.now()) {',
              'export function processLeaderboardWorld(world, now = Date.now(), options = {}) {',
          )
          replace_once(
              'server/src/leaderboards.js',
              '    awardPeriod(world, state, state.endsAt);',
              '    awardPeriod(world, state, state.endsAt, options.onGemReward);',
          )

          # Invitation-created databases use the extended shared ledger schema too.
          replace_once(
              'server/src/invitations.js',
              "        category TEXT NOT NULL CHECK (category IN ('share_link_reward', 'invite_code_reward', 'admin_adjustment')),\n        invitation_id INTEGER,\n        description TEXT NOT NULL,\n        created_at INTEGER NOT NULL,\n",
              "        category TEXT NOT NULL CHECK (category IN ('share_link_reward', 'invite_code_reward', 'daily_check_in', 'weekly_full_attendance', 'leaderboard_reward', 'admin_adjustment')),\n        invitation_id INTEGER,\n        description TEXT NOT NULL,\n        created_at INTEGER NOT NULL,\n        source_key TEXT UNIQUE,\n",
          )

          # Storage imports and schema.
          replace_once(
              'server/src/storage.js',
              "import { ensureGemState } from './invitations.js';\n",
              "import { ensureGemState } from './invitations.js';\nimport {\n  createDailyCheckInSummary,\n  dailyCheckInPeriodFor,\n  dailyCheckInRewardFor,\n  processDailyCheckInWorld,\n} from './daily-check-in.js';\n",
          )
          replace_once(
              'server/src/storage.js',
              "function generateGiftCode() {\n  const token = randomBytes(6).toString('hex').toUpperCase();\n  return `RIVER-${token.slice(0, 4)}-${token.slice(4, 8)}-${token.slice(8, 12)}`;\n}\n",
              "function generateGiftCode() {\n  const token = randomBytes(6).toString('hex').toUpperCase();\n  return `RIVER-${token.slice(0, 4)}-${token.slice(4, 8)}-${token.slice(8, 12)}`;\n}\n\nfunction migrateGemLedgerSchema(database) {\n  const row = database.prepare(\"SELECT sql FROM sqlite_master WHERE type = 'table' AND name = 'economy_gem_ledger'\").get();\n  const sql = String(row?.sql || '');\n  if (!sql || (sql.includes('source_key') && sql.includes('weekly_full_attendance'))) return;\n  database.exec('PRAGMA foreign_keys = OFF');\n  try {\n    database.exec(`\n      BEGIN IMMEDIATE;\n      DROP TABLE IF EXISTS economy_gem_ledger_v2;\n      CREATE TABLE economy_gem_ledger_v2 (\n        id INTEGER PRIMARY KEY AUTOINCREMENT,\n        user_id INTEGER NOT NULL,\n        amount INTEGER NOT NULL,\n        balance_after INTEGER NOT NULL CHECK (balance_after >= 0),\n        category TEXT NOT NULL CHECK (category IN ('share_link_reward', 'invite_code_reward', 'daily_check_in', 'weekly_full_attendance', 'leaderboard_reward', 'admin_adjustment')),\n        invitation_id INTEGER,\n        description TEXT NOT NULL,\n        created_at INTEGER NOT NULL,\n        source_key TEXT UNIQUE,\n        FOREIGN KEY (invitation_id) REFERENCES economy_invitation_relations(id)\n      ) STRICT;\n      INSERT INTO economy_gem_ledger_v2 (\n        id, user_id, amount, balance_after, category, invitation_id, description, created_at, source_key\n      )\n      SELECT id, user_id, amount, balance_after, category, invitation_id, description, created_at, NULL\n      FROM economy_gem_ledger;\n      DROP TABLE economy_gem_ledger;\n      ALTER TABLE economy_gem_ledger_v2 RENAME TO economy_gem_ledger;\n      COMMIT;\n    `);\n  } catch (error) {\n    try { database.exec('ROLLBACK'); } catch { /* no active transaction */ }\n    throw error;\n  } finally {\n    database.exec('PRAGMA foreign_keys = ON');\n  }\n}\n",
          )
          replace_once(
              'server/src/storage.js',
              "      CREATE TABLE IF NOT EXISTS economy_gem_shop_exchanges (\n",
              "      CREATE TABLE IF NOT EXISTS economy_daily_check_ins (\n        user_id INTEGER NOT NULL,\n        date_key TEXT NOT NULL,\n        week_key TEXT NOT NULL,\n        daily_reward_gems INTEGER NOT NULL CHECK (daily_reward_gems = 1),\n        weekly_bonus_gems INTEGER NOT NULL DEFAULT 0 CHECK (weekly_bonus_gems IN (0, 5)),\n        claimed_at INTEGER NOT NULL,\n        request_key TEXT NOT NULL UNIQUE,\n        balance_after INTEGER NOT NULL CHECK (balance_after >= 0),\n        PRIMARY KEY (user_id, date_key)\n      ) STRICT;\n      CREATE INDEX IF NOT EXISTS idx_economy_daily_check_ins_week\n        ON economy_daily_check_ins(user_id, week_key, date_key);\n      CREATE UNIQUE INDEX IF NOT EXISTS idx_economy_daily_check_ins_bonus\n        ON economy_daily_check_ins(user_id, week_key) WHERE weekly_bonus_gems > 0;\n      CREATE TABLE IF NOT EXISTS economy_gem_ledger (\n        id INTEGER PRIMARY KEY AUTOINCREMENT,\n        user_id INTEGER NOT NULL,\n        amount INTEGER NOT NULL,\n        balance_after INTEGER NOT NULL CHECK (balance_after >= 0),\n        category TEXT NOT NULL CHECK (category IN ('share_link_reward', 'invite_code_reward', 'daily_check_in', 'weekly_full_attendance', 'leaderboard_reward', 'admin_adjustment')),\n        invitation_id INTEGER,\n        description TEXT NOT NULL,\n        created_at INTEGER NOT NULL,\n        source_key TEXT UNIQUE,\n        FOREIGN KEY (invitation_id) REFERENCES economy_invitation_relations(id)\n      ) STRICT;\n      CREATE TABLE IF NOT EXISTS economy_gem_shop_exchanges (\n",
          )
          replace_once(
              'server/src/storage.js',
              "    `);\n    this.selectWorld = this.database.prepare('SELECT revision, state_json FROM economy_world WHERE id = 1');\n",
              "    `);\n    migrateGemLedgerSchema(this.database);\n    this.database.exec(`\n      CREATE INDEX IF NOT EXISTS idx_economy_gem_ledger_user\n        ON economy_gem_ledger(user_id, created_at DESC);\n    `);\n    this.selectWorld = this.database.prepare('SELECT revision, state_json FROM economy_world WHERE id = 1');\n",
          )
          replace_once(
              'server/src/storage.js',
              "    this.insertGemShopExchange = this.database.prepare(`\n",
              "    this.selectDailyCheckInByDate = this.database.prepare(`\n      SELECT * FROM economy_daily_check_ins WHERE user_id = ? AND date_key = ?\n    `);\n    this.selectDailyCheckInsForWeek = this.database.prepare(`\n      SELECT * FROM economy_daily_check_ins\n      WHERE user_id = ? AND week_key = ? ORDER BY date_key\n    `);\n    this.insertDailyCheckIn = this.database.prepare(`\n      INSERT INTO economy_daily_check_ins (\n        user_id, date_key, week_key, daily_reward_gems, weekly_bonus_gems,\n        claimed_at, request_key, balance_after\n      ) VALUES (?, ?, ?, ?, ?, ?, ?, ?)\n    `);\n    this.insertGemLedgerEvent = this.database.prepare(`\n      INSERT INTO economy_gem_ledger (\n        user_id, amount, balance_after, category, invitation_id, description, created_at, source_key\n      ) VALUES (?, ?, ?, ?, NULL, ?, ?, ?)\n    `);\n    this.insertGemShopExchange = this.database.prepare(`\n",
          )
          replace_once(
              'server/src/storage.js',
              'function createVersionedClientState(world, userId, now) {',
              'function createVersionedClientState(world, userId, now, checkIn) {',
          )
          replace_once(
              'server/src/storage.js',
              "    gems: player.gems,\n    ...createWarehouseSummary(world, player),\n",
              "    gems: player.gems,\n    checkIn,\n    ...createWarehouseSummary(world, player),\n",
          )
          replace_once(
              'server/src/storage.js',
              "  prepareWorldForStorage(world, now) {\n    for (const player of Object.values(world.players || {})) {\n",
              "  prepareWorldForStorage(world, now) {\n    processDailyCheckInWorld(world, now);\n    for (const player of Object.values(world.players || {})) {\n",
          )
          replace_once(
              'server/src/storage.js',
              "  processWorldIfDue(world, now, _currentUserId, { force = false } = {}) {\n  if (!force && now < this.nextWorldProcessingAt) return false;\n  processLeaderboardWorld(world, now);\n",
              "  processWorldIfDue(world, now, _currentUserId, { force = false } = {}) {\n  if (!force && now < this.nextWorldProcessingAt) return false;\n  processLeaderboardWorld(world, now, {\n    onGemReward: (reward) => this.recordGemLedgerEvent(reward),\n  });\n",
          )
          replace_once(
