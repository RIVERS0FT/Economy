          server_design = read('docs/SERVER_ARCHITECTURE_AND_DEPLOYMENT_DESIGN.md')
          server_design = server_design.replace('- 礼品码、宝石流水和商店兑换；', '- 礼品码、每日签到、每周全勤、宝石流水和商店兑换；')
          server_design = server_design.replace('- `invitations.js`：邀请码、邀请关系、宝石流水和同 IP 邀请阻断；', '- `invitations.js`：邀请码、邀请关系和同 IP 邀请阻断；\n- `daily-check-in.js`：北京时间自然日／自然周、每日签到、全勤资格和状态摘要；')
          server_design = server_design.replace('`economy_invite_codes`、`economy_invitation_relations`、`economy_gem_ledger`、`economy_gem_shop_exchanges`', '`economy_invite_codes`、`economy_invitation_relations`、`economy_daily_check_ins`、`economy_gem_ledger`、`economy_gem_shop_exchanges`')
          server_design = server_design.replace('客户端状态版本 17 是破坏性边界，当前客户端只接受版本 17', '客户端状态版本 18 增加服务器权威签到摘要并成为新的破坏性边界，当前客户端只接受版本 18')
          server_design = server_design.replace('所有资产、邀请与管理员写操作要求 8～128 字符的 `Idempotency-Key`。', '所有资产、签到、邀请与管理员写操作要求 8～128 字符的 `Idempotency-Key`。')
          server_design += "\n\n### 每日签到持久化与调度\n\n`economy_daily_check_ins` 以 `(user_id, date_key)` 唯一约束保证每天最多签到一次，并以 `(user_id, week_key)` 的部分唯一索引保证每周最多发放一次全勤奖励。`economy_gem_ledger.source_key` 为每日签到、全勤和排行榜奖励提供不可重复来源键。签到、宝石余额、签到记录、宝石流水、幂等确认与世界修订共享同一 `BEGIN IMMEDIATE` 事务。\n\n单一世界到期调度器把下一个北京时间 00:00 纳入候选截止时间，并更新世界 `checkInDateKey` 以产生一次全局修订；所有客户端因此能在跨日后通过现有玩家分区补丁获得新的 `todayKey`，不得增加独立轮询或客户端日期判断。\n"
          write('docs/SERVER_ARCHITECTURE_AND_DEPLOYMENT_DESIGN.md', server_design)

          # Current client fixtures use version 18.
          for base in [Path('tests'), Path('src')]:
              for path in base.rglob('*'):
                  if path.is_file() and path.suffix in {'.ts', '.tsx', '.js', '.mjs'}:
                      text = path.read_text()
                      next_text = text.replace('version: 17,', 'version: 18,')
                      if next_text != text:
                          path.write_text(next_text)

          # Ensure documentation records the new reward values in both slash styles.
          for path in [Path('docs/PRODUCT_AND_GAMEPLAY_DESIGN.md'), Path('README.md')]:
              text = path.read_text().replace('30／20／10', '50／30／20')
              path.write_text(text)

          # Final source-level sanity checks before committing.
          checks = {
              'server/src/storage.js': ['checkInInTransaction', 'economy_daily_check_ins', 'leaderboard_reward'],
              'src/pages/OverviewPage.tsx': ['本周签到', '签到领取 1 宝石'],
              'src/types.ts': ['version: 18;', 'checkIn: DailyCheckInState;'],
              'server/src/leaderboards.js': ['Object.freeze([50, 30, 20])'],
          }
          for path, fragments in checks.items():
              content = read(path)
              for fragment in fragments:
                  if fragment not in content:
                      raise SystemExit(f'{path}: missing final fragment {fragment}')
          PY
      - name: Validate implementation
        continue-on-error: true
        run: |
          npm ci
          npm run build
      - name: Commit implementation
        run: |
          git rm .github/workflows/implement-daily-check-in.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat: add daily check-in rewards"
          git push origin HEAD:agent/daily-check-in
