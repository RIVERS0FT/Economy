name: Agent Recover Contract Tests

on:
  push:
    branches:
      - agent/supply-contract-negotiation

permissions:
  contents: write

jobs:
  recover:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/supply-contract-negotiation
          fetch-depth: 0
      - name: Restore and fix contract tests
        shell: bash
        run: |
          git show d22997d514c21f3d5b3a8f735be9637c8ec41636:server/test/contracts.test.js > server/test/contracts.test.js
          python3 - <<'PY'
          from pathlib import Path
          path = Path('server/test/contracts.test.js')
          text = path.read_text()
          old = '      unitPrice: 2.8 + revision / 100,'
          new = '      unitPrice: Number((2.8 + revision / 100).toFixed(2)),'
          if old not in text:
              raise SystemExit('precision test anchor missing')
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check
          git rm .github/workflows/agent-recover-contract-tests.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- server/test/contracts.test.js
          git commit -m "修正合同议价测试金额精度"
          git push origin HEAD:agent/supply-contract-negotiation
