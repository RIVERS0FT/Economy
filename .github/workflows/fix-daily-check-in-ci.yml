name: Fix daily check-in CI

on:
  push:
    branches:
      - agent/daily-check-in

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/daily-check-in
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Apply fixes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              target = Path(path)
              text = target.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one occurrence, found {count}: {old!r}')
              target.write_text(text.replace(old, new, 1))

          path = Path('scripts/verify-document-authority.mjs')
          text = path.read_text()
          text = text.replace(
              "import { resolve } from 'node:path';\n",
              "import { resolve } from 'node:path';\nimport { CURRENT_CLIENT_STATE_VERSION } from '../server/shared/economy-state-version.js';\n",
              1,
          )
          text = text.replace("    '客户端状态版本：`17`',", "    `客户端状态版本：\\`${CURRENT_CLIENT_STATE_VERSION}\\``,", 1)
          text = text.replace(
              "  if (!content.includes('客户端状态版本：17')) failures.push(`${path} 客户端状态版本必须为 17`);",
              "  if (!content.includes(`客户端状态版本：${CURRENT_CLIENT_STATE_VERSION}`)) failures.push(`${path} 客户端状态版本必须为 ${CURRENT_CLIENT_STATE_VERSION}`);",
              1,
          )
          text = text.replace(
              "console.log('文档权威性验证通过：登记文档清单、版本 17/15、市场需求模型 10、长期生产合同、商品／工厂资产拍卖、真实人口钱包、就业资金流、统一订单簿、双边市场储备和九页导航职责均满足当前基线。');",
              "console.log(`文档权威性验证通过：登记文档清单、版本 ${CURRENT_CLIENT_STATE_VERSION}/15、市场需求模型 10、长期生产合同、商品／工厂资产拍卖、真实人口钱包、就业资金流、统一订单簿、双边市场储备和九页导航职责均满足当前基线。`);",
              1,
          )
          path.write_text(text)

          gem_verifier = Path('scripts/verify-gems-invitations-and-bans.mjs')
          text = gem_verifier.read_text()
          text = text.replace(
              "import { resolve } from 'node:path';\n",
              "import { resolve } from 'node:path';\nimport { CURRENT_CLIENT_STATE_VERSION } from '../server/shared/economy-state-version.js';\n",
              1,
          )
          text = text.replace("  'version: 17;',", "  `version: ${CURRENT_CLIENT_STATE_VERSION};`,", 1)
          gem_verifier.write_text(text)

          for document_path in [
              'docs/README.md',
              'docs/PRODUCT_AND_GAMEPLAY_DESIGN.md',
              'docs/INDUSTRY_AND_PRODUCTION_DESIGN.md',
              'docs/UNIFIED_ASSET_ORDER_BOOK_DESIGN.md',
              'docs/WAREHOUSE_EXPANSION_DESIGN.md',
              'docs/PAGE_CONTENT_AND_NAVIGATION_DESIGN.md',
              'docs/SERVER_ARCHITECTURE_AND_DEPLOYMENT_DESIGN.md',
              'docs/LOCAL_ACTIVITY_LOG_DESIGN.md',
          ]:
              document = Path(document_path)
              document.write_text(document.read_text().replace('客户端状态版本：17', '客户端状态版本：18'))

          verifier = Path('scripts/verify-overview-content.mjs')
          text = verifier.read_text()
          text = text.replace("  'async function expectNoPairOverlap',\n  'async function expectElementsInside',\n", '', 1)
          text = text.replace(
              "  'overview shows completed and partial-week attendance states',\n",
              "  'overview shows completed and partial-week attendance states',\n  'overview check-in calendar preserves seven columns on mobile',\n",
              1,
          )
          verifier.write_text(text)

          browser_spec = Path('tests/browser/runtime.spec.ts')
          text = browser_spec.read_text()
          text = text.replace(
              "  await expect(days.nth(0)).toHaveAttribute('aria-label', /周一 07-13 已签/);\n  await expect(days.nth(4)).toHaveAttribute('aria-label', /周五 07-17 今日/);",
              "  await expect(days.nth(0)).toHaveAttribute('aria-label', /周一 07-13 已签/);\n  await expect(days.nth(2)).toHaveAttribute('aria-label', /周三 07-15 漏签/);\n  await expect(days.nth(4)).toHaveAttribute('aria-label', /周五 07-17 今日/);",
              1,
          )
          insertion = """

test('overview check-in calendar preserves seven columns on mobile', async ({ page }) => {
  const pageErrors = await capturePageErrors(page);
  await page.setViewportSize({ width: 390, height: 844 });
  await page.goto('runtime-test.html?view=overview&scenario=empty');

  const calendar = page.getByRole('list', { name: '本周签到日历' });
  await expect(calendar.getByRole('listitem')).toHaveCount(7);
  expect(await gridTrackCount(calendar)).toBe(7);
  expect(await page.locator('.overview-check-in-panel').evaluate((element) => element.scrollWidth <= element.clientWidth + 1)).toBe(true);
  expect(pageErrors).toEqual([]);
});
"""
          marker = "\ntest('overview cash changes exclude synchronization events and short lists do not scroll'"
          if insertion.strip() not in text:
              if marker not in text:
                  raise SystemExit('runtime.spec.ts: mobile insertion marker missing')
              text = text.replace(marker, insertion + marker, 1)
          browser_spec.write_text(text)

          storage = Path('server/src/storage.js')
          text = storage.read_text()
          foreign_key = "        FOREIGN KEY (invitation_id) REFERENCES economy_invitation_relations(id)\n"
          if text.count(foreign_key) != 2:
              raise SystemExit(f'storage: expected two ledger foreign keys, found {text.count(foreign_key)}')
          text = text.replace(foreign_key, '')
          text = text.replace(
              '      const { revision, world } = this.loadWorld(now);\n      const player = ensurePlayer(world, user, now);',
              '      const { revision, stateJson, world } = this.loadWorld(now);\n      const player = ensurePlayer(world, user, now);',
              1,
          )
          text = text.replace(
              '      const nextRevision = this.saveWorld(revision, world, now);\n      const response = createActionAcknowledgement(gameResult, nextRevision);',
              '      const nextRevision = this.saveWorldIfChanged(revision, world, now, stateJson);\n      const response = createActionAcknowledgement(gameResult, nextRevision);',
              1,
          )
          storage.write_text(text)

          replace_once(
              'src/pages/OverviewPage.tsx',
              'description="优先处理生产、仓库与订单提醒，再根据市场快照调整经营决策。"',
              'description="优先处理生产、仓库与订单提醒，并领取服务器每日签到奖励。"',
          )

          harness = Path('tests/browser/runtime-harness.tsx')
          text = harness.read_text()
          text = text.replace(
              "      todayKey: '2026-07-17',",
              "      todayKey: scenario === 'check-in-complete' ? '2026-07-19' : '2026-07-17',",
              1,
          )
          text = text.replace(
              "        : ['2026-07-13', '2026-07-14', '2026-07-15', '2026-07-16'],",
              "        : ['2026-07-13', '2026-07-14', '2026-07-16'],",
              1,
          )
          text = text.replace(
              "      weeklyClaimCount: scenario === 'check-in-complete' ? 7 : 4,",
              "      weeklyClaimCount: scenario === 'check-in-complete' ? 7 : 3,",
              1,
          )
          harness.write_text(text)
          PY
      - name: Commit fixes
        run: |
          git rm .github/workflows/fix-daily-check-in-ci.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: align check-in persistence and version validation"
          git push origin HEAD:agent/daily-check-in
      - name: Validate
        run: |
          npm ci
          npm run build
