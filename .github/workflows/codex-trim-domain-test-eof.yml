name: Trim domain test EOF

on:
  push:
    branches:
      - codex/daily-system-market

permissions:
  contents: write

jobs:
  trim:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Trim trailing blank lines
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('server/test/domain.test.js')
          text = path.read_text()
          path.write_text(text.rstrip('\n') + '\n')
          Path('.github/workflows/codex-trim-domain-test-eof.yml').unlink()
          PY
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "清理领域测试文件尾空行"
          git push origin HEAD:codex/daily-system-market
