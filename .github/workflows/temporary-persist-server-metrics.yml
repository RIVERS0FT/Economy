name: Temporary Persist Server Metrics Implementation

on:
  push:
    branches:
      - fix/persist-admin-server-metrics

permissions:
  contents: write

jobs:
  implement-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: fix/persist-admin-server-metrics
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.4.0
          cache: npm

      - name: Synchronize authoritative documentation and deployment rules
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import json
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              content = target.read_text(encoding='utf-8')
              if new in content:
                  return
              if old not in content:
                  raise SystemExit(f'PATCH_ANCHOR_MISSING: {path}: {old[:120]}')
              target.write_text(content.replace(old, new, 1), encoding='utf-8')

          package_path = Path('package.json')
          package = json.loads(package_path.read_text(encoding='utf-8'))
          scripts = package['scripts']
          scripts['verify:server-metrics-persistence'] = 'node scripts/verify-server-metrics-persistence.mjs'
          architecture = scripts['verify:architecture']
          architecture_anchor = 'node scripts/verify-runtime-reliability.mjs && node scripts/verify-deployment-storage.mjs'
          architecture_replacement = 'node scripts/verify-runtime-reliability.mjs && npm run verify:server-metrics-persistence && node scripts/verify-deployment-storage.mjs'
          if architecture_replacement not in architecture:
              if architecture_anchor not in architecture:
                  raise SystemExit('PACKAGE_ARCHITECTURE_ANCHOR_MISSING')
              scripts['verify:architecture'] = architecture.replace(architecture_anchor, architecture_replacement, 1)
          package_path.write_text(json.dumps(package, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          replace_once(
              'README.md',
              '| 数据存储 | SQLite |',
              '| 数据存储 | SQLite（权威游戏库与独立服务器监控库） |',
          )
          replace_once(
              'README.md',
              'ECONOMY_DB_PATH=./economy.sqlite \\\nPUBLIC_ORIGIN=http://localhost:1420 \\\nnode server/src/app.js'.replace('\n', chr(10)),
              'ECONOMY_DB_PATH=./economy.sqlite \\\nECONOMY_SERVER_METRICS_DB_PATH=./server-metrics.sqlite \\\nPUBLIC_ORIGIN=http://localhost:1420 \\\nnode server/src/app.js'.replace('\n', chr(10)),
          )

          replace_once(
              'docs/README.md',
              '生产 SQLite INCREMENTAL 空间维护、API、容量限制、Nginx、systemd 和部署',
              '生产 SQLite INCREMENTAL 空间维护、独立服务器监控 SQLite 持久化、API、容量限制、Nginx、systemd 和部署',
          )

          replace_once(
              'docs/SERVER_ARCHITECTURE_AND_DEPLOYMENT_DESIGN.md',
              '- `player-admin-statistics.js`：管理员玩家运营统计、精确日活动覆盖、首次里程碑、财富分布和只读运营诊断。\n\n`domain-core.js`'.replace('\n', chr(10)),
              '- `player-admin-statistics.js`：管理员玩家运营统计、精确日活动覆盖、首次里程碑、财富分布和只读运营诊断。\n- `server-metrics-store.js`：独立服务器监控 SQLite、启动批次、分钟／小时／天聚合桶、保留期清理和完整性检查。\n- `persistent-server-runtime-metrics.js`：将进程内请求、CPU、内存和事件循环趋势按启动批次持久化，并在管理员查询时合并历史批次与当前实时桶。\n\n`domain-core.js`'.replace('\n', chr(10)),
          )

          monitoring_design = '\n'.join([
              '正式数据库：',
              '',
              '```text',
              '/var/lib/riversoft-economy/economy.sqlite',
              '```',
              '',
              '管理员服务器监控数据库：',
              '',
              '```text',
              '/var/lib/riversoft-economy/server-metrics.sqlite',
              '```',
              '',
              '服务器监控数据库只保存管理员服务器页使用的非权威诊断聚合，不得保存单次请求、IP、Cookie、会话、完整动态 URL 或玩家资产状态。它必须与权威游戏库分离，默认由 `ECONOMY_SERVER_METRICS_DB_PATH` 指定；未指定时从 `ECONOMY_DB_PATH` 的目录派生。监控库必须位于 `/var/lib/riversoft-economy`，不得写入 `/var/www/game/economy-api` 或其他会被 `rsync --delete-before` 替换的发布目录。',
              '',
              '监控数据按进程启动批次写入 `economy_server_metric_boots` 与 `economy_server_metric_buckets`。聚合桶主键由 `boot_id + granularity + starts_at` 组成；同一进程重复快照使用 UPSERT 替换当前批次贡献，管理员查询排除当前批次已落库副本，再将旧批次与当前实时桶按时间合并，避免重复累计并允许同一分钟内重新部署。进程启动时间和 `uptimeSeconds` 始终表示当前进程，不得伪造为跨部署连续运行时间。',
              '',
              '保留策略固定为：分钟聚合桶保留 48 小时，小时聚合桶保留 35 天，天聚合桶保留 180 天。持久化内容包括请求数量、4xx／5xx、延迟直方图、响应大小、有限路由聚合、事件循环延迟、CPU 和内存聚合；不得落单次请求明细。正常 `SIGTERM`／`SIGINT` 和退出前必须同步刷新当前批次、记录停止时间并关闭 SQLite。监控写入失败只记录告警，不得阻断权威游戏 API；损坏的单条诊断记录应跳过，正式部署必须执行监控库 `PRAGMA quick_check(1)` 和表存在性验收。',
              '',
              '写事务固定：',
          ])
          replace_once(
              'docs/SERVER_ARCHITECTURE_AND_DEPLOYMENT_DESIGN.md',
              '正式数据库：\n\n```text\n/var/lib/riversoft-economy/economy.sqlite\n```\n\n写事务固定：'.replace('\n', chr(10)),
              monitoring_design,
          )

          replace_once(
              'scripts/install-economy-api.py',
              "Environment=ECONOMY_DB_PATH={STATE_DIRECTORY / 'economy.sqlite'}\nEnvironment=ECONOMY_REGISTRATION_SECRET_FILE={REGISTRATION_SECRET_PATH}".replace('\n', chr(10)),
              "Environment=ECONOMY_DB_PATH={STATE_DIRECTORY / 'economy.sqlite'}\nEnvironment=ECONOMY_SERVER_METRICS_DB_PATH={STATE_DIRECTORY / 'server-metrics.sqlite'}\nEnvironment=ECONOMY_REGISTRATION_SECRET_FILE={REGISTRATION_SECRET_PATH}".replace('\n', chr(10)),
          )

          deploy_old = "          print('ECONOMY_DATABASE_INCREMENTAL_VERIFIED')\n          PYTHON".replace('\n', chr(10))
          deploy_new = '\n'.join([
              "          print('ECONOMY_DATABASE_INCREMENTAL_VERIFIED')",
              '',
              "          metrics_database = '/var/lib/riversoft-economy/server-metrics.sqlite'",
              "          with sqlite3.connect(f'file:{metrics_database}?mode=ro', uri=True) as connection:",
              "              connection.execute('PRAGMA query_only = ON')",
              "              metrics_quick_check = str(connection.execute('PRAGMA quick_check(1)').fetchone()[0])",
              "              metric_tables = {row[0] for row in connection.execute(\"SELECT name FROM sqlite_master WHERE type = 'table'\")}",
              "          required_metric_tables = {'economy_server_metric_boots', 'economy_server_metric_buckets'}",
              "          if metrics_quick_check != 'ok':",
              "              raise SystemExit(f'ECONOMY_SERVER_METRICS_QUICK_CHECK_FAILED={metrics_quick_check}')",
              "          if not required_metric_tables.issubset(metric_tables):",
              "              raise SystemExit(f'ECONOMY_SERVER_METRICS_TABLES_MISSING={sorted(required_metric_tables - metric_tables)}')",
              "          print('ECONOMY_SERVER_METRICS_DATABASE_VERIFIED')",
              '          PYTHON',
          ])
          replace_once('.github/workflows/deploy.yml', deploy_old, deploy_new)
          PYTHON

      - name: Install dependencies
        run: npm ci

      - name: Verify server metrics persistence
        run: |
          npm run verify:server-metrics-persistence
          node --test server/test/server-metrics-persistence.test.js
          npm run server:check

      - name: Run full production build
        run: npm run build

      - name: Check final diff
        run: |
          git diff --check
          git status --short

      - name: Commit verified implementation and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/temporary-persist-server-metrics.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            .github/workflows/deploy.yml \
            .github/workflows/temporary-persist-server-metrics.yml \
            README.md \
            docs/README.md \
            docs/SERVER_ARCHITECTURE_AND_DEPLOYMENT_DESIGN.md \
            package.json \
            scripts/install-economy-api.py \
            scripts/verify-server-metrics-persistence.mjs \
            server/src/persistent-server-runtime-metrics.js \
            server/src/server-metrics-store.js \
            server/src/server-status-bootstrap.js \
            server/test/server-metrics-persistence.test.js
          git diff --cached --check
          git commit -m 'fix: persist admin server metrics across deployments'
          git push origin HEAD:fix/persist-admin-server-metrics
