name: Align market account verifier
on:
  push:
    branches: [codex/warehouse-product-stack]
permissions:
  contents: write
jobs:
  apply:
    if: github.event.head_commit.message == 'stage market account verifier alignment'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 scripts/codex-align-market-account-verifier.py
      - run: git diff --check
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/UNIFIED_ASSET_ORDER_BOOK_DESIGN.md src/styles/market-desktop-cleanup.css scripts/verify-market-desktop-cleanup.mjs tests/browser/market-desktop-cleanup.spec.ts
          git commit -m "align market account layout authority"
          git push origin HEAD:${GITHUB_REF_NAME}
