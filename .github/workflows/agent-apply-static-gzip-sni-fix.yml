name: Apply static gzip SNI self-check fix

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-static-gzip-sni-check
          fetch-depth: 0
      - name: Apply and test SNI self-check fix
        run: |
          set -euo pipefail
          python3 .agent/apply-static-gzip-sni-fix.py
          git diff --check
          python3 scripts/test_configure_economy_nginx.py
          node scripts/verify-state-delivery-capacity.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/SERVER_ARCHITECTURE_AND_DEPLOYMENT_DESIGN.md \
            scripts/configure-economy-nginx.py \
            scripts/test_configure_economy_nginx.py \
            scripts/verify-state-delivery-capacity.mjs
          git diff --cached --check
          git commit -m "修复静态 gzip HTTPS 自检"
          git push origin HEAD:agent/fix-static-gzip-sni-check
