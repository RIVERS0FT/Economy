name: Patch unified factory verifier

on:
  push:
    branches:
      - fix/facility-detail-summary-local-product

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch verifier
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/verify-unified-factory-recipes-grid.mjs')
          text = path.read_text()
          old = "  '<strong>生产设置</strong>',\n"
          new = "  'aria-label=\"生产配置\"',\n"
          if text.count(old) != 1:
              raise SystemExit(f'expected one visible-heading assertion, got {text.count(old)}')
          text = text.replace(old, new, 1)
          marker = "]) assert.equal(detail.includes(text), true, `工厂详情缺少: ${text}`);\n\nfor (const forbidden of ["
          replacement = "]) assert.equal(detail.includes(text), true, `工厂详情缺少: ${text}`);\nassert.equal(detail.includes('<strong>生产设置</strong>'), false, '工厂详情不得恢复可见生产设置标题');\n\nfor (const forbidden of ["
          if text.count(marker) != 1:
              raise SystemExit('detail assertion marker missing')
          text = text.replace(marker, replacement, 1)
          text = text.replace('统一工厂配方与地区卡片验证通过：目录顺序、三列 4:5 工厂卡、二级详情、统一生产设置与共享移动基础设施均已锁定。', '统一工厂配方与地区卡片验证通过：目录顺序、三列 4:5 工厂卡、二级详情、无标题生产配置与共享移动基础设施均已锁定。')
          path.write_text(text)
          PY
          node scripts/verify-unified-factory-recipes-grid.mjs
          git diff --check
      - name: Commit update
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/verify-unified-factory-recipes-grid.mjs
          git commit -m "同步统一工厂配方防回退规则"
          git push origin HEAD:fix/facility-detail-summary-local-product
