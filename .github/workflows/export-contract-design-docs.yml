name: Apply Contract Design Docs

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

env:
  TARGET_BRANCH: ${{ github.event.pull_request.head.ref }}

jobs:
  patch-designs:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
      - name: Apply design rules
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if new in text:
                  return
              if old not in text or text.count(old) != 1:
                  raise SystemExit(f'expected design text not found exactly once: {path}: {old[:80]}')
              p.write_text(text.replace(old, new))

          path = 'docs/PRODUCT_AND_GAMEPLAY_DESIGN.md'
          old = '玩家通过商品供货／采购、玩家冻结借贷和工厂使用权租赁三类合同建立稳定合作，再用现货市场处理没有被合同覆盖的即时缺口与剩余产出。工厂生产继续按现有权威采购规则比较同州合同固定价与真实市场可执行价格，不因“合同核心化”改成无条件优先合同，也不允许客户端替服务器决定实际使用来源。'
          replace(path, old, old + '\n\n玩家冻结借贷的本金始终由放贷玩家实际提供，银行不替代合同成立时的出资。借款方到期且 12 小时宽限结束后仍未结清时，银行作为清算担保方立即向放贷方代支付未履行应收，并在同一服务器事务向借款方代收同额未履行额度；代收顺序固定为银行存款、可用资金、按 80% 审慎价处置足额最少冻结工厂。冻结工厂进入银行工厂储备而不是转给放贷玩家，整座工厂折抵超过剩余欠款的价值返还借款方银行存款；银行以实际取得的冻结工厂折抵价值发行对应清算信用，数据异常或资产缺失导致冻结工厂仍不足时才先使用风险准备金并对剩余缺口记录可审计的担保发行。清算后贷款合同直接结束，不再要求放贷方手动追偿或领取工厂。')
          old = '6. 商业建筑完成已投入营业周期时，按 `COMMERCIAL_BUILDINGS_DESIGN.md` 发行锁定营业收入，其中只有目录固定商业利润构成玩家净资产新增。'
          replace(path, old, old + '\n7. 玩家冻结借贷发生银行担保清算时，以银行实际取得的冻结工厂折抵价值发行对应清算信用；只有冻结资产异常不足且风险准备金也无法覆盖的剩余缺口才允许额外担保发行。两类发行都必须只发生在服务器确认违约的同一幂等事务并写入合同审计，不得在合同成立、正常还款或客户端预览时发行。')
          old = '银行存取款只转移玩家已有普通货币。银行贷款本金由银行放款时发行，并在归还本金或违约核销对应本金时注销；本金发行与等额负债同步发生，不得提高净资产、增长榜经营资产或人口需求预算。借款人实际支付的贷款利息继续优先进入存款利息池、人口银行服务就业收入和风险准备金；活跃周固定存款收益超过利息池的缺口作为 `bankDepositInterestSubsidyIssued` 明确发行。活跃周结束后的 10% 周资金扣除不再销毁；实际收取部分按食品市场与社会消费市场的 `baseBudget` 权重 **3000:2700** 在微单位精度下完整转入两组市场储备真实 `credits`，不进入人口钱包、银行或其他玩家账户。历史 `weeklyCashSettlementBurned` 只保留规则切换前已经销毁的审计金额，新收取额改记 `weeklyCashSettlementReserveTransferred`，两者都属于排行榜经营增长的政策调整项。'
          replace(path, old, '银行存取款只转移玩家已有普通货币。银行贷款本金由银行放款时发行，并在归还本金或违约核销对应本金时注销；本金发行与等额负债同步发生，不得提高净资产、增长榜经营资产或人口需求预算。玩家冻结借贷的银行担保清算不是合同成立时的银行放款：银行先代收借款方银行存款和可用资金，再以取得的冻结工厂折抵价值发行对应清算信用；若有效冻结资产因异常状态仍不足，则先由风险准备金吸收，再把剩余缺口计入 `bankGuaranteeIssuedCredits`。银行代支付只把放贷方既有合同应收转换为可用资金，借款方同时失去等额资金、冻结资产或原有负债，因此不得把代付额再次计入经营增长或人口需求预算。借款人实际支付的贷款利息继续优先进入存款利息池、人口银行服务就业收入和风险准备金；活跃周固定存款收益超过利息池的缺口作为 `bankDepositInterestSubsidyIssued` 明确发行。活跃周结束后的 10% 周资金扣除不再销毁；实际收取部分按食品市场与社会消费市场的 `baseBudget` 权重 **3000:2700** 在微单位精度下完整转入两组市场储备真实 `credits`，不进入人口钱包、银行或其他玩家账户。历史 `weeklyCashSettlementBurned` 只保留规则切换前已经销毁的审计金额，新收取额改记 `weeklyCashSettlementReserveTransferred`，两者都属于排行榜经营增长的政策调整项。')
