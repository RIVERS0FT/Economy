          replace(path, old, '不得恢复浏览器本地资产或排行榜、系统自动卖单、库存价值扩大市场需求预算、产业链逐层重复发行、无限市场回收、替代份额单周期归零、忽略互补瓶颈、同周期跨多条生产边传播、工作玩法、工作接口、工作冷却或工作货币发行、让可成交的不同主体交叉订单等待下一次轮询、让同一玩家交叉订单长期并存、允许最高系统买价不低于最低系统卖价、将宝石计入总资产、普通货币购买宝石、被邀请人获得邀请宝石、一个账号绑定多个邀请人、注册完成后补填或更换邀请码、宝石兑换工厂产量、拍卖成交写入订单簿行情、玩家冻结借贷违约后要求放贷方手动领取或把冻结工厂直接转给放贷方，或新增工业榜替代当前四榜结构。')

          path = 'docs/SERVER_ARCHITECTURE_AND_DEPLOYMENT_DESIGN.md'
          old = '合同审计必须同时区分新每日额度事件与旧兼容事件。每日额度合同的追加式审计覆盖发布、承接、议价、自动准备／补款设置变化、手动准备／补款、每次真实部分交付、当前日结束申请、有限合同到期、立即违约终止和保证金赔付；北京时间跨日的未用额度释放与重置属于权威状态推进，当前不伪造独立审计事件。交付事件必须记录真实 `lastDeliveryQuantity / lastDeliveryGross / lastDeliveryFee`，不得把每日上限伪装成实际交付量。旧有限批次合同继续保留原发布、批次准备／补款、宽限、逐批成功交付、续签、违约确认与受偿方领取事件。每个事件保存稳定事件类型、执行主体、触发类型、服务器事务时间、原因代码、前后紧凑快照和资产转移；玩家查询不得返回请求幂等键、来源哈希、世界修订号或其他玩家的非合同资产。旧世界既有合同只允许按已有审计完整度读取，不根据缺失字段伪造过程。'
          replace(path, old, old + ' 玩家冻结借贷的新违约清算必须使用单一 `loan_bank_guarantee_settled` 终态事件记录未履行额度、银行代付到账、银行存款代收、可用资金代收、冻结工厂代收、工厂处置找零、风险准备金吸收和担保发行；不得再把新违约贷款审计为冻结工厂转给出借方。历史既有 `loan_defaulted / loan_default_claimed` 只作为旧审计兼容读取，不再由新违约流程产生。')
          old = '玩家贷款承接时从出借方可用资金原子转移本金到借款方，并锁定借款方冻结工厂；冻结工厂继续生产，但不得出售、拍卖、银行冻结、重复借贷冻结或出租。到期优先按自动还款设置从可用资金结清本金和固定利息；宽限结束仍不足时只确认借款方违约，并按当时审慎价格的 80% 锁定处置单价与“足以覆盖欠款的最少冻结数量”快照，不得立即转移工厂。冻结在等待期间继续锁定且不得通过迟到还款恢复合同；只有出借方主动执行“解除合同并处置冻结”时才按已锁快照转移对应数量并结束合同。未偿本金在最终处置前继续分别计入出借方合同应收和借款方合同负债，未支付利息不提前计入净资产。'
          replace(path, old, '玩家贷款承接时从出借方可用资金原子转移本金到借款方，并锁定借款方冻结工厂；银行不得替代合同成立时的本金出资。冻结工厂继续生产，但不得出售、拍卖、银行冻结、重复借贷冻结或出租。到期优先按自动还款设置从借款方可用资金结清本金和固定利息；不足进入通用宽限。宽限结束再次尝试正常还款后仍不足时，服务器必须在一个幂等事务完成银行担保清算：固定当时未履行额度与当前审慎价格 80% 的处置单价，银行向出借方代支付应收净额并按既有规则结算贷款利息服务费，同时依次从借款方银行存款、可用资金、按处置单价足以覆盖剩余欠款的最少冻结工厂执行银行代收。取得的工厂进入 `world.bank.facilityReserves`，不得转给出借方；整座工厂折抵超过剩余欠款的价值返还借款方银行存款，未处置冻结立即解除。银行以取得冻结工厂的实际折抵价值发行对应清算信用；若数据异常、参与者缺失或资产不足仍形成缺口，则先由 `riskReserveCredits` 吸收，再把剩余缺口显式记入 `bankGuaranteeIssuedCredits`。清算完成后合同直接写入 `breachedAt + borrower_default + terminated`，未偿本金与利息归零，不再存在出借方“解除合同并处置冻结”动作；旧状态中已经处于 `breachedAt + borrower_default + active` 的贷款在下一次权威处理时按同一规则惰性清算。重启、迟到轮询、重复截止时间、幂等重放或旧状态迁移不得重复代付、重复代收、重复扣厂或按新价格二次清算。')
