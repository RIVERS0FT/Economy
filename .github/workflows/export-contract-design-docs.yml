          old = '宽限结束只确认违约，不得直接解除玩家合同。服务器记录责任方与 `breachedAt` 后停止后续履约；与违约赔偿无关的托管资金、商品和无责方保证金按权威规则释放，责任方保证金继续冻结作为待领取赔偿。违约确认后不得通过事后补货、补款、还款或重新开启自动履约恢复合同。受偿玩家必须主动执行对应解除／领取动作：商品供货与工厂租赁等保证金赔付使用“解除合同并领取违约金”，玩家冻结借贷使用“解除合同并处置冻结”；责任方不能自行解除来逃避赔付。双方均违约时只显示“解除合同”，按服务器权威规则解除且不发生单方赔付。玩家冻结借贷的冻结处置和工厂租赁违约后的使用权停止同样由服务器执行；市场储备作为无玩家操作主体时可以按服务器规则自动处置，例外不得扩大到玩家受偿合同。'
