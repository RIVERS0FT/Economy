name: Temporary Economic Migration Workspace

on:
  push:
    branches: [work/cash-production-investment]
    paths: [.github/workflows/workspace-bundle.yml]

permissions:
  contents: read

jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.4.0
          cache: npm
      - run: npm ci
      - name: Bundle tracked source and locked verification tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/economy-workspace/repo" "$RUNNER_TEMP/economy-workspace/bin"
          git archive HEAD | tar -xf - -C "$RUNNER_TEMP/economy-workspace/repo"
          cp -a node_modules "$RUNNER_TEMP/economy-workspace/repo/node_modules"
          cp "$(command -v node)" "$RUNNER_TEMP/economy-workspace/bin/node"
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/economy-workspace/source-sha.txt"
          tar -C "$RUNNER_TEMP/economy-workspace" -czf "$RUNNER_TEMP/economy-workspace.tar.gz" .
          sha256sum "$RUNNER_TEMP/economy-workspace.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: economy-migration-workspace
          path: ${{ runner.temp }}/economy-workspace.tar.gz
          retention-days: 1
          if-no-files-found: error
