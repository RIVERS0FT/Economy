name: Patch facility build procurement docs

on:
  push:
    branches:
      - feature/facility-build-procurement-orders

permissions:
  contents: write

jobs:
  patch-docs:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/facility-build-procurement-orders
          fetch-depth: 0
      - name: Patch authoritative docs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              target = Path(path)
              text = target.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, got {count}')
              target.write_text(text.replace(old, new), encoding='utf-8')

          replace_once(
              'docs/INDUSTRY_AND_PRODUCTION_DESIGN.md',
              '- “一键购齐并建造”只补足当前库存缺少的正式 `buildInputs`：服务器必须在同一建造事务中按真实统一商品订单簿执行 Fill-or-Kill 采购，遵守价格优先、同价时间优先、maker price、玩家卖出手续费、自成交阻断和市场储备真实库存；客户端提交逐材料最高接受价与采购总额上限，任一材料无法在上限内一次购齐、资金不足、报价失效或随后建设失败时，全部采购与建设一起回滚，不留下未完成买单，也不得创建系统材料商店或绕过正常资产守恒。',
              '- “一键购齐并建造”只补足当前库存缺少的正式 `buildInputs`：服务器必须在同一建造事务中按真实统一商品订单簿执行 Fill-or-Kill 采购，遵守价格优先、同价时间优先、maker price、玩家卖出手续费、自成交阻断和市场储备真实库存；客户端提交逐材料最高接受价与采购总额上限，任一材料无法在上限内一次购齐、资金不足、报价失效或随后建设失败时，全部采购与建设一起回滚，不留下未完成买单，也不得创建系统材料商店或绕过正常资产守恒。\n- 当前真实卖盘不足以一次购齐全部缺料时，建设卡允许按本次 `facilityTypeId + quantity` 建造意图一次提交缺料买单。服务器必须重新计算真实库存缺口并校验具体科技、1～100 座数量、逐材料价格、自交叉、未完成订单配额、安全金额以及“当前可用资金 ≥ 建造现金 + 全部新买单最大冻结额”，随后在同一幂等事务中为每种缺料创建一张正式玩家商品买单；可成交部分立即按统一订单簿规则成交，剩余数量保持普通 `open`／`partial` 买单并冻结对应剩余资金。该采购组不得创建工厂实例、施工任务或第二套订单类型，也不得自动建厂；已成交材料进入普通共享仓库，建造现金只在提交时用于资金充足校验而不冻结，材料购齐后仍由玩家显式执行即时建设。一次建造提交形成一个独立采购组，后续相同工厂与数量的提交不得自动合并；整组取消只批量撤销该次提交仍未完成的正式买单并释放剩余冻结资金，已经成交的材料继续保留在仓库。',
          )

          replace_once(
              'docs/PAGE_CONTENT_AND_NAVIGATION_DESIGN.md',
              '- 建设工厂类型、数量和一键采购报价只属于生产页建设表单；目录变化时只在自身候选目录内合法化。建设动作必须显式提交表单当前选择的 `facilityTypeId` 与 `quantity`，所有教程、通知或页面包装层必须原样透传两者以及可选采购保护参数，不得通过默认值、其他页面状态或刷新结果隐式回退。农场和果园的空 `buildInputs` 必须显示“无需材料”；其他工厂逐项显示需求、库存与缺口，并把原“最多可建”改为“库存可直接建”。存在缺料时复用当前五秒权威状态中已经返回的公开订单簿计算“预计采购／预计总支出”，不得新增报价轮询；只有全部缺料可在真实卖盘中购齐时显示可用的“一键购齐并建造”，提交 `autoProcure=true`、逐材料最高接受价和采购总额上限，服务器报价失效时拒绝并要求重新确认。',
              '- 建设工厂类型、数量和一键采购报价只属于生产页建设表单；目录变化时只在自身候选目录内合法化。建设动作必须显式提交表单当前选择的 `facilityTypeId` 与 `quantity`，所有教程、通知或页面包装层必须原样透传两者以及可选采购保护参数，不得通过默认值、其他页面状态或刷新结果隐式回退。农场和果园的空 `buildInputs` 必须显示“无需材料”；其他工厂逐项显示需求、库存与缺口，并把原“最多可建”改为“库存可直接建”。存在缺料时只复用当前五秒权威状态中已经返回的公开订单簿，不得新增报价轮询：全部缺料可在真实卖盘中购齐时显示“一键购齐并建造”，继续提交 `autoProcure=true`、逐材料最高接受价和采购总额上限，服务器报价失效时拒绝并要求重新确认；任一缺料卖盘不足时不得仅因深度不足禁用建设意图，而应显示逐材料“价格”、买单最高资金占用和“一键提交缺料买单”。缺料买单默认价格只从当前 `game.orders` 计算，固定按同商品最低有效卖价 → 无卖单时最高有效买价 → 买卖盘均为空时 `1`，自动刷新不得覆盖玩家已编辑价格。服务器成功返回本次建造对应的正式订单 ID 后，客户端仅用按玩家隔离的浏览器本地关联把这些订单按单次建造聚类为“待采购”；官方订单及成交状态始终以 `game.orders` 为权威，不新增采购组轮询或服务器第二状态。',
          )

          replace_once(
              'docs/PAGE_CONTENT_AND_NAVIGATION_DESIGN.md',
              '必须显示工厂类型、可选或固定产物、建造数量、建造现金、逐项建造材料需要量／库存／缺口和“库存可直接建”。材料不足时只复用当前权威订单簿快照显示预计采购和预计总支出；全部缺料可购齐且不存在自己的交叉卖单时允许“一键购齐并建造”，否则显示明确阻断原因。材料已经齐全时直接“立即建造”。',
              '必须显示工厂类型、可选或固定产物、建造数量、建造现金、逐项建造材料需要量／库存／缺口和“库存可直接建”。材料不足时只复用当前权威订单簿快照：全部缺料可购齐且不存在自己的交叉卖单时显示预计采购、预计总支出并允许“一键购齐并建造”；卖盘不足时显示“卖盘不足 · 可挂买单”、逐材料价格、买单最高占用和“一键提交缺料买单”，并继续校验自己的交叉卖单、未完成订单配额以及“建造现金 + 买单最大冻结额”的可用资金。材料已经齐全时直接“立即建造”。建设卡下方的“待采购”按每次提交建造的工厂类型和数量独立聚类，显示该次提交关联的正式商品买单、已成交／目标／剩余与提交价格，并提供“取消全部”；取消只撤销该组剩余 `open`／`partial` 买单，已成交材料保留。采购组全部订单成交或取消后从建设卡本地聚类中移除；不得把不同提交合并、不得自动建厂、不得冻结建造现金，也不得在市场页合并底层订单或删除逐单撤销入口。',
          )

          replace_once(
              'docs/UNIFIED_ASSET_ORDER_BOOK_DESIGN.md',
              '- 建厂一键购料属于现有商品订单簿的事务内 `Fill-or-Kill`（FOK）买入，不是系统商店：只采购建设所缺数量，按当前真实卖盘价格优先／同价时间优先逐档成交并继续使用 maker price、玩家卖出手续费、普通成交记录与市场储备真实库存。客户端必须提交逐材料价格上限与本次采购总额上限；服务器重新预扫盘口，价格下降按更低真实成交价执行，任一材料深度不足、价格超过上限、自成交、资金／仓库不足或最终建设失败时整个组合事务回滚。FOK 建材买单经过完整预检后必须在本事务全部成交并立即关闭，因此不占“同时未完成订单”数量上限，但其已完成订单与 fills 仍按普通真实交易保留。',
              '- 建厂一键购料属于现有商品订单簿的事务内 `Fill-or-Kill`（FOK）买入，不是系统商店：只采购建设所缺数量，按当前真实卖盘价格优先／同价时间优先逐档成交并继续使用 maker price、玩家卖出手续费、普通成交记录与市场储备真实库存。客户端必须提交逐材料价格上限与本次采购总额上限；服务器重新预扫盘口，价格下降按更低真实成交价执行，任一材料深度不足、价格超过上限、自成交、资金不足或最终建设失败时整个组合事务回滚。FOK 建材买单经过完整预检后必须在本事务全部成交并立即关闭，因此不占“同时未完成订单”数量上限，但其已完成订单与 fills 仍按普通真实交易保留。\n- 当前卖盘不足时的建造采购组仍然不是第二套订单。`POST /api/game/orders` 的内部 `execution = facility-build-procurement` 只负责在一个幂等事务中按服务器重新计算的真实缺口批量创建普通玩家商品 BUY；每张子订单都进入唯一 `world.orders`，照常执行价格时间优先、maker price、资金冻结、部分成交、自交叉阻断、玩家未完成订单上限、成交记录和逐单撤销。`execution = facility-build-procurement-cancel` 只批量调用同一玩家这些正式订单的普通撤销语义；已成交数量不得回滚，剩余冻结资金正常释放。一次建造提交形成一个浏览器可见采购组，但组 ID 与订单关联仅用于当前玩家建设卡聚类，不写入公开 `AssetOrder`、不改变匿名序列化、不建立第二套盘口，也不改变市场页“我的订单”逐单展示和逐单撤销。采购完成不得自动创建工厂，建造现金不得作为订单冻结资金。',
          )

          replace_once(
              'docs/SERVER_ARCHITECTURE_AND_DEPLOYMENT_DESIGN.md',
              '- `facility-auto-procure.js`：即时建厂缺料预检、真实商品卖盘价格保护、仓库／资金校验和事务内 FOK 采购编排；',
              '- `facility-auto-procure.js`：即时建厂缺料预检、真实商品卖盘价格保护、资金校验、事务内 FOK 采购，以及卖盘不足时按单次建造批量创建／取消正式商品买单的编排；',
          )

          replace_once(
              'docs/SERVER_ARCHITECTURE_AND_DEPLOYMENT_DESIGN.md',
              '`POST /api/game/facilities` 接受 `facilityTypeId` 与可选 `quantity`（1～100）；省略 `autoProcure` 时保持原有“库存齐全才建设”行为。缺料时客户端可以提交 `autoProcure = true`、`materialPriceCaps: Record<productId, price>` 与 `maxProcurementTotal`。服务器必须在同一幂等写事务和经济回滚边界中先计算真实库存缺口，再按统一商品订单簿重新预扫非本人卖盘；只有全部缺口都能在逐材料价格上限内一次成交、当前仓库临时交割空间足够且“建造费 + 当前真实采购额”可支付时，才按价格档位执行内部 Fill-or-Kill 买入。价格下降按当前更低 maker price 成交，盘口深度、逐材料价格或采购总额任一超过客户端确认边界时拒绝。内部 FOK 买单因预检保证本事务关闭，可跳过普通玩家“同时未完成订单”数量上限，但不得跳过自成交检查、仓库、资金、手续费、成交记录、市场储备和订单簿撮合规则。全部买入完成后复用既有即时建设逻辑扣除材料与建造资金；采购、卖方结算、市场记录或建设任一步失败都通过同一 SQLite savepoint 与世界快照完全回滚，不留下部分材料、部分卖方结算或未完成订单。`POST /api/game/facilities/construction/accelerate` 固定返回 `410 Gone`，不得进入经济写事务或写入新的施工宝石审计。',
              '`POST /api/game/facilities` 接受 `facilityTypeId` 与可选 `quantity`（1～100）；省略 `autoProcure` 时保持原有“库存齐全才建设”行为。缺料但当前卖盘足以一次购齐时，客户端可以提交 `autoProcure = true`、`materialPriceCaps: Record<productId, price>` 与 `maxProcurementTotal`。服务器必须在同一幂等写事务和经济回滚边界中先计算真实库存缺口，再按统一商品订单簿重新预扫非本人卖盘；只有全部缺口都能在逐材料价格上限内一次成交且“建造费 + 当前真实采购额”可支付时，才按价格档位执行内部 Fill-or-Kill 买入。无限共享仓库不检查旧容量或临时交割空间。价格下降按当前更低 maker price 成交，盘口深度、逐材料价格或采购总额任一超过客户端确认边界时拒绝。内部 FOK 买单因预检保证本事务关闭，可跳过普通玩家“同时未完成订单”数量上限，但不得跳过自成交检查、资金、手续费、成交记录、市场储备和订单簿撮合规则。全部买入完成后复用既有即时建设逻辑扣除材料与建造资金；采购、卖方结算、市场记录或建设任一步失败都通过同一 SQLite savepoint 与世界快照完全回滚，不留下部分材料、部分卖方结算或未完成订单。\n\n卖盘不足时继续复用 `POST /api/game/orders`，不新增建厂采购路由。`execution = facility-build-procurement` 只表示一次建造意图的批量普通商品买单：服务器重新计算缺口并校验具体科技、1～100 数量、逐材料 `materialOrderPrices`、自交叉、动态未完成订单上限、安全金额和“可用资金 ≥ 建造费 + 全部新买单最大金额”，再在同一个 SQLite savepoint／世界回滚边界内逐材料调用正式 `placeOrder`；任何一张失败必须回滚本次已经创建或成交的其他子订单。成功响应可以额外返回仅供当前浏览器立即建立聚类关系的 `procurementGroup`（工厂类型、建造数量、正式订单 ID、商品、原始数量和提交价格），但该组不进入世界 JSON、六分区、客户端状态版本或额外轮询。`execution = facility-build-procurement-cancel` 在同一 `/orders` 写接口中批量撤销所给当前玩家普通商品 BUY 的未完成部分，已成交材料保持在仓库。两种 execution 都继续使用请求 `Idempotency-Key`；前者按 `buildFacility` 复用科技准入，后者不触发自动建厂。建造现金不被冻结。`POST /api/game/facilities/construction/accelerate` 固定返回 `410 Gone`，不得进入经济写事务或写入新的施工宝石审计。',
          )

          replace_once(
              'docs/README.md',
              '工厂建设以服务器正式目录的 `buildCost + buildInputs` 为唯一成本；在一个幂等事务中原子扣除资金和材料、一次性记入建造业就业收入并立即增加同类集群数量。农场和果园当前按正式目录不消耗建造材料，其他工厂使用各自正式 `buildInputs`；缺料时允许在同一建造事务内执行真实统一订单簿 FOK 采购，但必须保留逐材料价格保护、采购总额保护、自成交阻断、卖方手续费、无限共享仓库入库与全事务回滚，不得创建系统材料商店、持续建材买单或绕过市场资产守恒。不得恢复施工时间、施工任务、施工队列、施工倒计时或工厂宝石加速。历史 `economy_facility_gem_actions` 仅保留只读审计，不得恢复 INSERT 写路径；旧 `POST /api/game/facilities/construction/accelerate` 必须继续在进入经济事务前返回 `410 Gone`。规则变更必须同步更新产业、产品、订单簿、仓库、页面、服务器、宝石与权威倒计时文档，以及一键采购、目录、宝石、倒计时和服务器测试。',
              '工厂建设以服务器正式目录的 `buildCost + buildInputs` 为唯一成本；在一个幂等事务中原子扣除资金和材料、一次性记入建造业就业收入并立即增加同类集群数量。农场和果园当前按正式目录不消耗建造材料，其他工厂使用各自正式 `buildInputs`。缺料且当前卖盘足够时允许在同一建造事务内执行真实统一订单簿 FOK 采购，保留逐材料价格保护、采购总额保护、自成交阻断、卖方手续费、无限共享仓库入库与全事务回滚。卖盘不足时允许通过统一 `/orders` 提交按单次建造聚类的缺料买单：服务器重新计算缺口，每种缺料创建普通玩家商品买单，可成交部分立即成交、剩余正常挂盘并冻结资金；整组取消只撤销该次提交剩余订单，已成交材料保留，建造现金不冻结且不得自动建厂。两条路径都不得创建系统材料商店、第二套订单类型、施工任务或绕过市场资产守恒。不得恢复施工时间、施工任务、施工队列、施工倒计时或工厂宝石加速。历史 `economy_facility_gem_actions` 仅保留只读审计，不得恢复 INSERT 写路径；旧 `POST /api/game/facilities/construction/accelerate` 必须继续在进入经济事务前返回 `410 Gone`。规则变更必须同步更新产业、产品、订单簿、仓库、页面、服务器、宝石与权威倒计时文档，以及一键采购、目录、宝石、倒计时和服务器测试。',
          )

          replace_once(
