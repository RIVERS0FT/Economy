name: Apply unified navigation badges

on:
  pull_request:
    branches:
      - main
    paths:
      - ".agent/navigation-badges.patch.part-*"
      - ".github/workflows/agent-apply-navigation-badges.yml"

permissions:
  contents: write
  pull-requests: read

jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/unified-navigation-badges'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/unified-navigation-badges
          fetch-depth: 0
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply patch
        run: |
          cat .agent/navigation-badges.patch.part-* > /tmp/navigation-badges.patch
          if ! git apply /tmp/navigation-badges.patch 2> .agent/navigation-badges-apply-error.txt; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .agent/navigation-badges-apply-error.txt
            git commit -m "记录导航角标补丁错误"
            git push origin HEAD:agent/unified-navigation-badges
            exit 0
          fi
          rm -f .agent/navigation-badges.patch.part-*
          rm -f .agent/navigation-badges-apply-error.txt
      - name: Validate focused changes
        run: |
          set +e
          : > .agent/navigation-badges-validation-error.txt
          npm ci >> .agent/navigation-badges-validation-error.txt 2>&1
          status=$?
          if [ "$status" -eq 0 ]; then
            npm run verify:navigation-badges >> .agent/navigation-badges-validation-error.txt 2>&1
            status=$?
          fi
          if [ "$status" -eq 0 ]; then
            npm run typecheck >> .agent/navigation-badges-validation-error.txt 2>&1
            status=$?
          fi
          if [ "$status" -ne 0 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .agent/navigation-badges-validation-error.txt
            git commit -m "记录导航角标验证错误"
            git push origin HEAD:agent/unified-navigation-badges
            exit 0
          fi
          rm -f .agent/navigation-badges-validation-error.txt
      - name: Commit generated change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "统一导航角标系统"
          git push origin HEAD:agent/unified-navigation-badges
