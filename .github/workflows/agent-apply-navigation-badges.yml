name: Apply unified navigation badges

on:
  pull_request:
    branches:
      - main
    paths:
      - ".agent/navigation-badges.patch.part-*"
      - ".github/workflows/agent-apply-navigation-badges.yml"

permissions:
  contents: write
  pull-requests: read

jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/unified-navigation-badges'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/unified-navigation-badges
          fetch-depth: 0
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply patch
        run: |
          cat .agent/navigation-badges.patch.part-* > /tmp/navigation-badges.patch
          if ! git apply \
            --exclude=src/styles/mobile-status-navigation.css \
            --exclude=docs/README.md \
            /tmp/navigation-badges.patch 2> .agent/navigation-badges-apply-error.txt; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -f .agent/navigation-badges-apply-error.txt
            git commit -m "记录导航角标补丁错误"
            git push origin HEAD:agent/unified-navigation-badges
            exit 0
          fi
          python - <<'PY'
          from pathlib import Path

          mobile = Path('src/styles/mobile-status-navigation.css')
          mobile_text = mobile.read_text()
          old_mobile = '  .mobile-bottom-navigation .sidebar-nav-button small {'
          new_mobile = '  .mobile-bottom-navigation .sidebar-nav-button .navigation-badge {'
          if mobile_text.count(old_mobile) != 1:
              raise SystemExit('mobile navigation badge selector context changed')
          mobile.write_text(mobile_text.replace(old_mobile, new_mobile))

          index = Path('docs/README.md')
          index_text = index.read_text()
          replacements = {
              '| `PAGE_CONTENT_AND_NAVIGATION_DESIGN.md` | 九个正式页面、商品／工厂资产拍卖、进行中的合同默认视图、登录注册入口、独立商店、分享链接、邀请码、封禁提示、资产导航、模块唯一归属和页面防回退规则 |':
              '| `PAGE_CONTENT_AND_NAVIGATION_DESIGN.md` | 九个正式页面、统一导航角标语义与已读规则、商品／工厂资产拍卖、进行中的合同默认视图、登录注册入口、独立商店、分享链接、邀请码、封禁提示、资产导航、模块唯一归属和页面防回退规则 |',
              '| `UI_DESIGN_SYSTEM.md` | 设计令牌、共享组件、统一表单控件、统一 SVG 图标、商品插画主视觉、覆盖式滚动条、订单成交表、桌面导航行高、中文界面、响应式、移动触摸反馈与可访问性 |':
              '| `UI_DESIGN_SYSTEM.md` | 设计令牌、共享组件、统一表单控件、统一 SVG 图标、统一导航角标视觉、商品插画主视觉、覆盖式滚动条、订单成交表、桌面导航行高、中文界面、响应式、移动触摸反馈与可访问性 |',
          }
          for old, new in replacements.items():
              if index_text.count(old) != 1:
                  raise SystemExit(f'document index context changed: {old}')
              index_text = index_text.replace(old, new)
          index.write_text(index_text)
          PY
          rm -f .agent/navigation-badges.patch.part-*
          rm -f .agent/navigation-badges-apply-error.txt
      - name: Validate focused changes
        run: |
          set +e
          : > .agent/navigation-badges-validation-error.txt
          npm ci >> .agent/navigation-badges-validation-error.txt 2>&1
          status=$?
          if [ "$status" -eq 0 ]; then
            npm run verify:navigation-badges >> .agent/navigation-badges-validation-error.txt 2>&1
            status=$?
          fi
          if [ "$status" -eq 0 ]; then
            npm run typecheck >> .agent/navigation-badges-validation-error.txt 2>&1
            status=$?
          fi
          if [ "$status" -ne 0 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -f .agent/navigation-badges-validation-error.txt
            git commit -m "记录导航角标验证错误"
            git push origin HEAD:agent/unified-navigation-badges
            exit 0
          fi
          rm -f .agent/navigation-badges-validation-error.txt
      - name: Commit generated change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "统一导航角标系统"
          git push origin HEAD:agent/unified-navigation-badges
