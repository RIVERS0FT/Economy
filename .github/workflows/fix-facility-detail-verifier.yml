name: Fix facility detail verifier

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Update verifier
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/verify-unified-factory-recipes-grid.mjs')
          source = path.read_text()
          old = "  'className=\"facility-detail-artwork\"',"
          new = "  'className=\"facility-detail-artwork facility-information-artwork\"',"
          if source.count(old) != 1:
              raise SystemExit(f'expected one old artwork verifier token, found {source.count(old)}')
          path.write_text(source.replace(old, new, 1))
          Path('.github/workflows/fix-facility-detail-verifier.yml').unlink()
          PY
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- scripts/verify-unified-factory-recipes-grid.mjs .github/workflows/fix-facility-detail-verifier.yml
          git commit -m "同步工厂信息插画验证类名"
          git push origin HEAD:${{ github.head_ref }}
