name: Sync production icons with main

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/sync-production-icons-main.yml'

permissions:
  contents: write
  pull-requests: read

jobs:
  sync:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Merge latest main and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-ff origin/main -m "同步最新 main"
          rm .github/workflows/sync-production-icons-main.yml
          git add -A
          git commit --amend --no-edit
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
