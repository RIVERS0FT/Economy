name: Apply current design compression

on:
  push:
    branches:
      - docs/design-authority-compression-current-20260902

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.4.0
      - name: Reuse verified compression outside the new surface-design domain
        run: |
          git fetch origin docs/design-authority-compression-20260902:refs/remotes/origin/old-compression
          files=(
            docs/AUTHORITATIVE_COUNTDOWN_DESIGN.md
            docs/CI_EXECUTION_DESIGN.md
            docs/FACILITY_CATALOG_PRESENTATION_DESIGN.md
            docs/GEM_ACCELERATION_AND_DYNAMIC_EXCHANGE_DESIGN.md
            docs/GIFT_CODE_AND_ADMIN_DESIGN.md
            docs/INDUSTRY_AND_PRODUCTION_DESIGN.md
            docs/LIQUID_GLASS_CHROME_DESIGN.md
            docs/LOCAL_ACTIVITY_LOG_DESIGN.md
            docs/MARKET_CHART_LAYOUT_DESIGN.md
            docs/OVERVIEW_LAYOUT_INTEGRITY_DESIGN.md
            docs/PAGE_CONTENT_AND_NAVIGATION_DESIGN.md
            docs/PRODUCTION_PILL_ALIGNMENT_DESIGN.md
            docs/PRODUCT_AND_GAMEPLAY_DESIGN.md
            docs/README.md
            docs/REGISTRATION_INVITE_FLOW_DESIGN.md
            docs/SERVER_ARCHITECTURE_AND_DEPLOYMENT_DESIGN.md
            docs/UNIFIED_ASSET_ORDER_BOOK_DESIGN.md
            docs/WAREHOUSE_EXPANSION_DESIGN.md
            scripts/verify-client-state-version.mjs
            scripts/verify-contract-audit.mjs
            scripts/verify-contract-renewal-economic-events.mjs
            scripts/verify-deployment-pipeline.mjs
            scripts/verify-document-authority.mjs
            scripts/verify-industry-catalog.mjs
            scripts/verify-market-action-latency.mjs
            scripts/verify-order-matching-core.mjs
            scripts/verify-production-methods.mjs
            scripts/verify-provincial-economy.mjs
            scripts/verify-provincial-unlock-transport.mjs
            scripts/verify-research-progression.mjs
            scripts/verify-state-delivery-capacity.mjs
          )
          for file in "${files[@]}"; do
            git show "origin/old-compression:${file}" > "${file}"
          done
      - name: Compress the latest UI design without reverting surface semantics
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def clean_header(text):
              kept = []
              for line in text.splitlines():
                  if line.startswith('> 2026-') and '不可回退规则' in line:
                      continue
                  if line.startswith('> 状态：') or line.startswith('> 适用项目：') or line.startswith('> 当前平台：') or line.startswith('> 更新时间：'):
                      continue
                  kept.append(line)
              return '\n'.join(kept)

          ui_path = Path('docs/UI_DESIGN_SYSTEM.md')
          ui = clean_header(ui_path.read_text())

          style_start = ui.index('## 2. 样式职责')
          style_tail = ui.index('业务页面样式先加载', style_start)
          compact_style = '''## 2. 样式职责

          共享视觉按职责分层，业务页面不得复制基础样式：

          | 权威层 | 主要职责 |
          |---|---|
          | `design-system.css` / `interaction-states.css` / `form-controls.css` | 设计令牌、共享控件、输入状态、交互反馈与焦点 |
          | `primary-surfaces.css` / `content-surfaces.css` / `scrolling-page-sections.css` | 圆角表面 inset、正文对象卡、页面分区与同构列表表面语义 |
          | `strategic-game-shell.css` / `mobile-detail-sheet.css` / `frosted-glass-surfaces.css` | 战略工作区、唯一移动 Workspace Sheet 与高层毛玻璃表面 |
          | `safe-floating.css` / `charts.css` / `scrollbars.css` | 顶层 Tooltip、图表容器和共享滚动行为 |
          | `entity-list-header.css` / `market-commodity-row.css` | 带表头实体列表及已登记的紧凑商品行 |
          | 商品、工厂、银行、合同、设置等领域样式 | 只负责领域内部布局与已登记场景例外，不得重做共享表面、控件或交互基础视觉 |

          具体样式文件属于实现事实；新增或拆分文件不需要在 DESIGN 维护完整目录副本，但必须继续服从上述唯一职责和加载层级。

          '''.replace('          ', '')
          ui = ui[:style_start] + compact_style + ui[style_tail:]

          component_start = ui.index('## 3. 共享 React 组件')
          component_tail = ui.index('`MobileWorkspaceSheetHost` 是移动端唯一根级 Sheet 宿主', component_start)
          compact_components = '''## 3. 共享 React 组件

          页面、表单、列表、金额、图表、Tooltip、商品／工厂插画和移动 Workspace Sheet 必须优先复用现有共享组件，不为单页复制第二套基础组件。核心结构包括 `PageLayout`、`PagePanel`、`MobileWorkspaceSheetHost`、共享 FormControls、实体列表、金额格式化、`SafeTooltip` / `GameConcept` 与 `EconomyChart`；具体组件清单属于代码事实。

          `PagePanel` 只是兼容结构语义，不自动决定可见圆角。页面章节与同构比较列表保持平面分区；具有独立身份、状态、属性和操作的复杂业务对象可以使用 `.ui-entity-card` 或已登记兼容入口，即使随 `.page-card-scroll` 滚动。正文对象卡只使用实体背景、边框和圆角，不使用毛玻璃或高层阴影。

          '''.replace('          ', '')
          ui = ui[:component_start] + compact_components + ui[component_tail:]

          compact_product_icons = '''### 5.1 商品 SVG 图标目录

          所有服务器正式商品必须在共享商品图标组件中拥有稳定、可辨识且与商品语义对应的本地内联 SVG；正式商品 ID、数量与增删范围以服务器商品目录和组件映射为运行事实，DESIGN 不复制完整逐商品清单。已知正式商品不得退化为同一个默认包装箱、字符、字母缩写或 Emoji；服务器未来返回未知商品 ID 时只允许使用明确的通用安全回退，不得因此改变已知商品映射。新增或删除正式商品必须在同一变更中同步目录、图标映射和专项验证。

          '''.replace('          ', '')
          ui, product_replacements = re.subn(r'### 5\.1 商品 SVG 图标目录[\s\S]*?(?=### 5\.2 )', compact_product_icons, ui, count=1)
          if product_replacements != 1:
              raise SystemExit('未找到可压缩的商品 SVG 图标目录')

          artwork_start = ui.index('当前 C1 复杂度工厂')
          artwork_tail = ui.index('C1–C7 全部图片都必须', artwork_start)
          compact_artwork = '''当前 C1–C7 正式工厂均采用统一的新场景插画语言并使用独立原创构图；具体工厂 ID、产业语义和增删范围以服务器正式目录为唯一来源，DESIGN 不再逐级复制完整工厂清单。每张图必须突出对应产业的核心建筑、设备、原料或产物，缩小并按 `4:5` 居中裁切后仍可直接识别，不得把旧图作为生成、编辑、描摹或构图输入。

          '''.replace('          ', '')
          ui = ui[:artwork_start] + compact_artwork + ui[artwork_tail:]

          runtime_start = ui.index('运行时不得直接加载 1024px 源图')
          runtime_tail = ui.index('新增或删除正式工厂时', runtime_start)
          compact_runtime = '''运行时只加载构建阶段从 1024px 源图生成的 256px RGBA 工厂缩略图；生成目录属于可再生成产物，不提交仓库。`FacilityIcon` 只在已批准的主视觉上下文使用缩略图，未知 ID 与低流量模式回退共享厂房 SVG；插画始终等比 `cover` 居中裁切，运行／异常／停止／悬停等状态只能由边框、背景、文字、胶囊和数量表达，不得给插画本身着色。源图、缩略图、目录映射、批准上下文与基线哈希由专项生成脚本和 verifier 直接检查，不在 DESIGN 复制完整实现路径清单。

          '''.replace('          ', '')
          ui = ui[:runtime_start] + compact_runtime + ui[runtime_tail:]
          ui_path.write_text(ui.rstrip() + '\n')

          primary_path = Path('docs/PRIMARY_SURFACE_INSET_DESIGN.md')
          primary = clean_header(primary_path.read_text())
          primary_path.write_text(primary.rstrip() + '\n')
          PY
      - name: Verify authority and syntax
        run: |
          node scripts/verify-document-authority.mjs
          git diff --check
      - name: Commit permanent compression
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs scripts
          git commit -m '压缩最新设计文档并归一化权威验证'
          git push origin HEAD:${GITHUB_REF_NAME}
