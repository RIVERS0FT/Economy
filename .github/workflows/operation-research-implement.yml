name: Operation research separation implementation

on:
  push:
    branches:
      - feature/operation-research-separation-v2
    paths:
      - .agent/apply-operation-research.py
      - .github/workflows/operation-research-implement.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/operation-research-separation-v2
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.4.0
          cache: npm
      - name: Apply implementation
        run: |
          python3 .agent/apply-operation-research.py
          python3 - <<'PY'
          from pathlib import Path

          path = Path('server/test/research.test.js')
          text = path.read_text(encoding='utf-8')
          old = "assert.deepEqual(player.research.active.grantTechnologyIds, ['tool-manufacturing', 'tool-operation']);"
          new = "assert.deepEqual(player.research.active.grantTechnologyIds, ['tool-operation', 'tool-manufacturing']);"
          if text.count(old) != 1:
              raise SystemExit('active grant ordering assertion not found exactly once')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          path = Path('server/test/domain.test.js')
          text = path.read_text(encoding='utf-8')
          old = 'assert.equal(persisted.version, 28);'
          if text.count(old) != 1:
              raise SystemExit(f'domain current world-version assertion count={text.count(old)}')
          path.write_text(text.replace(old, 'assert.equal(persisted.version, 29);', 1), encoding='utf-8')

          path = Path('scripts/verify-money-precision.mjs')
          text = path.read_text(encoding='utf-8')
          old = "assert.match(read('server/src/storage.js'), /world\\.version = 28/);"
          new = "assert.match(read('server/src/storage.js'), /world\\.version = 29/);"
          if text.count(old) != 1:
              raise SystemExit('money precision world-version assertion not found exactly once')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          for verifier in [
              'scripts/verify-online-auto-sell.mjs',
              'scripts/verify-asset-auctions.mjs',
              'scripts/verify-warehouse-expansion.mjs',
          ]:
              path = Path(verifier)
              text = path.read_text(encoding='utf-8')
              old = '世界状态版本：28'
              if text.count(old) != 1:
                  raise SystemExit(f'{verifier}: expected one current world-version marker, found {text.count(old)}')
              path.write_text(text.replace(old, '世界状态版本：29', 1), encoding='utf-8')

          path = Path('README.md')
          text = path.read_text(encoding='utf-8')
          old = '- **银行与研发**：管理存款、贷款、抵押和周期结算，并通过树状产业技术路线解锁更高复杂度的生产能力；当前研发支持 1 宝石减少 30 分钟的服务器权威加速，工厂建设即时完成且不产生施工加速。'
          new = '- **银行与研发**：管理存款、贷款、抵押和周期结算，并通过树状产业技术路线分别研发生产科技与作业科技：生产科技负责制造能力，作业科技负责使用工具、化肥、饲料、药剂、工业耗材、机械和拖拉机；当前研发支持 1 宝石减少 30 分钟的服务器权威加速，工厂建设即时完成且不产生施工加速。'
          if text.count(old) != 1:
              raise SystemExit('root README research summary anchor not found exactly once')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          rm -f .agent/apply-operation-research.py
          rmdir .agent
          git add -- .agent/apply-operation-research.py
      - name: Install dependencies
        run: npm ci
      - name: Run targeted research tests
        run: node --test server/test/research.test.js server/test/production-methods.test.js
      - name: Run targeted verifiers
        run: |
          node scripts/verify-research-progression.mjs
          node scripts/verify-research-page.mjs
          node scripts/verify-production-methods.mjs
          node scripts/verify-document-authority.mjs
      - name: Build
        run: npm run build
      - name: Check diff
        run: git diff --check
      - name: Commit implementation and remove workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -f .github/workflows/operation-research-implement.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            README.md \
            server/src/research-catalog.js \
            server/src/production-methods.js \
            server/src/research.js \
            server/src/storage.js \
            server/test/research.test.js \
            server/test/domain.test.js \
            src/types.ts \
            src/pages/ResearchPage.tsx \
            tests/browser/runtime-harness.tsx \
            tests/browser/research-technology-tree.spec.ts \
            scripts/verify-research-progression.mjs \
            scripts/verify-research-page.mjs \
            scripts/verify-production-methods.mjs \
            scripts/verify-document-authority.mjs \
            scripts/verify-money-precision.mjs \
            scripts/verify-online-auto-sell.mjs \
            scripts/verify-asset-auctions.mjs \
            scripts/verify-warehouse-expansion.mjs \
            docs/README.md \
            docs/PRODUCT_AND_GAMEPLAY_DESIGN.md \
            docs/GEM_ACCELERATION_AND_DYNAMIC_EXCHANGE_DESIGN.md \
            docs/INDUSTRY_AND_PRODUCTION_DESIGN.md \
            docs/UNIFIED_ASSET_ORDER_BOOK_DESIGN.md \
            docs/WAREHOUSE_EXPANSION_DESIGN.md \
            docs/PAGE_CONTENT_AND_NAVIGATION_DESIGN.md \
            docs/SERVER_ARCHITECTURE_AND_DEPLOYMENT_DESIGN.md \
            docs/LOCAL_ACTIVITY_LOG_DESIGN.md \
            docs/GIFT_CODE_AND_ADMIN_DESIGN.md \
            .github/workflows/operation-research-implement.yml
          git diff --cached --check
          git commit -m "feat: separate production and operation research"
          git push origin HEAD:feature/operation-research-separation-v2
