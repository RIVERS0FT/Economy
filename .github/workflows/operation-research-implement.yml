name: Operation research separation implementation

on:
  push:
    branches:
      - feature/operation-research-separation-v2
    paths:
      - .agent/apply-operation-research.py
      - .github/workflows/operation-research-implement.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/operation-research-separation-v2
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.4.0
          cache: npm
      - name: Apply implementation
        run: |
          python3 .agent/apply-operation-research.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('server/test/research.test.js')
          text = path.read_text(encoding='utf-8')
          old = "assert.deepEqual(player.research.active.grantTechnologyIds, ['tool-manufacturing', 'tool-operation']);"
          new = "assert.deepEqual(player.research.active.grantTechnologyIds, ['tool-operation', 'tool-manufacturing']);"
          if text.count(old) != 1:
              raise SystemExit('active grant ordering assertion not found exactly once')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Install dependencies
        run: npm ci
      - name: Run targeted research tests
        run: node --test server/test/research.test.js server/test/production-methods.test.js
      - name: Run targeted verifiers
        run: |
          node scripts/verify-research-progression.mjs
          node scripts/verify-research-page.mjs
          node scripts/verify-production-methods.mjs
          node scripts/verify-document-authority.mjs
      - name: Build
        run: npm run build
      - name: Check diff
        run: git diff --check
      - name: Commit implementation and remove helpers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -f .agent/apply-operation-research.py .github/workflows/operation-research-implement.yml
          rmdir .agent 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            server/src/research-catalog.js \
            server/src/production-methods.js \
            server/src/research.js \
            server/src/storage.js \
            server/test/research.test.js \
            server/test/domain.test.js \
            src/types.ts \
            src/pages/ResearchPage.tsx \
            tests/browser/runtime-harness.tsx \
            tests/browser/research-technology-tree.spec.ts \
            scripts/verify-research-progression.mjs \
            scripts/verify-research-page.mjs \
            scripts/verify-production-methods.mjs \
            scripts/verify-document-authority.mjs \
            docs/README.md \
            docs/PRODUCT_AND_GAMEPLAY_DESIGN.md \
            docs/GEM_ACCELERATION_AND_DYNAMIC_EXCHANGE_DESIGN.md \
            docs/INDUSTRY_AND_PRODUCTION_DESIGN.md \
            docs/UNIFIED_ASSET_ORDER_BOOK_DESIGN.md \
            docs/WAREHOUSE_EXPANSION_DESIGN.md \
            docs/PAGE_CONTENT_AND_NAVIGATION_DESIGN.md \
            docs/SERVER_ARCHITECTURE_AND_DEPLOYMENT_DESIGN.md \
            docs/LOCAL_ACTIVITY_LOG_DESIGN.md \
            docs/GIFT_CODE_AND_ADMIN_DESIGN.md \
            .agent/apply-operation-research.py \
            .github/workflows/operation-research-implement.yml
          git diff --cached --check
          git commit -m "feat: separate production and operation research"
          git push origin HEAD:feature/operation-research-separation-v2
