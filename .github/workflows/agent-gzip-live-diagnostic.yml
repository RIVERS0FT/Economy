name: Diagnose live gzip responses

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/gzip-live-diagnostic
          fetch-depth: 0
      - name: Collect public HTTPS compression report
        shell: bash
        run: |
          set -u

          collect() {
            local label="$1"
            local url="$2"
            local headers body
            headers="$(mktemp)"
            body="$(mktemp)"
            echo "=== $label ===" >> gzip-live-report.txt
            curl --silent --show-error --http1.1 \
              --header 'Accept-Encoding: gzip' \
              --dump-header "$headers" \
              --output "$body" \
              "$url"
            printf 'curl_exit\t%s\n' "$?" >> gzip-live-report.txt
            tr -d '\r' < "$headers" \
              | awk 'BEGIN{IGNORECASE=1} /^HTTP\// || /^content-type:/ || /^content-length:/ || /^content-encoding:/ || /^transfer-encoding:/ || /^vary:/ || /^cache-control:/ || /^etag:/ {print}' \
              >> gzip-live-report.txt
            printf 'wire_bytes\t%s\n' "$(wc -c < "$body")" >> gzip-live-report.txt
            rm -f "$headers" "$body"
          }

          : > gzip-live-report.txt
          index_html="$(curl --silent --show-error https://game.riversoft.top/economy/ || true)"
          js_path="$(printf '%s' "$index_html" | grep -oE 'src="/economy/assets/[^" ]+\.js"' | head -n 1 | cut -d'"' -f2 || true)"
          css_path="$(printf '%s' "$index_html" | grep -oE 'href="/economy/assets/[^" ]+\.css"' | head -n 1 | cut -d'"' -f2 || true)"

          collect HTML https://game.riversoft.top/economy/
          if [ -n "$js_path" ]; then
            collect JAVASCRIPT "https://game.riversoft.top${js_path}"
          else
            printf '=== JAVASCRIPT ===\nasset_not_found\n' >> gzip-live-report.txt
          fi
          if [ -n "$css_path" ]; then
            collect CSS "https://game.riversoft.top${css_path}"
          else
            printf '=== CSS ===\nasset_not_found\n' >> gzip-live-report.txt
          fi
          collect API_UNAUTHENTICATED https://game.riversoft.top/economy-api/game/state
      - name: Commit report and remove temporary files
        run: |
          set -euo pipefail
          rm -f .github/workflows/agent-gzip-live-diagnostic.yml
          rm -f .agent/gzip-live-trigger.txt
          rmdir .agent 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "记录线上 gzip 响应诊断"
          git push origin HEAD:agent/gzip-live-diagnostic
