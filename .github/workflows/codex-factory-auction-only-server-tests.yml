name: Temporary factory auction-only server tests

on:
  push:
    branches:
      - codex/factory-auction-only

permissions:
  contents: write
  actions: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/factory-auction-only
          fetch-depth: 0
      - name: Replace retired direct factory order tests
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          reject = "{ ok: false, message: '工厂资产仅允许通过拍卖交易' }"

          path = Path('server/test/facility-groups.test.js')
          text = path.read_text(encoding='utf-8')
          text, n = re.subn(
              r"test\('factory buy and sell orders use price-time matching and partial fills', \(\) => \{.*?\n\}\);\n\n",
              """test('factory direct buy and sell orders are rejected without transferring assets', () => {\n  const world = createWorld(now);\n  const seller = ensurePlayer(world, bob, now);\n  const buyer = ensurePlayer(world, alice, now);\n  seller.facilityGroups = [group('farm', 5)];\n  buyer.credits = 1_000;\n  migrateFacilityGroupWorld(world, now);\n\n  const sell = applyFacilityGroupAction(world, bob, 'placeOrder', {\n    assetKind: 'facility', assetId: 'farm', side: 'sell', quantity: 3, price: 80,\n  }, now + 1);\n  const buy = applyFacilityGroupAction(world, alice, 'placeOrder', {\n    assetKind: 'facility', assetId: 'farm', side: 'buy', quantity: 2, price: 90,\n  }, now + 2);\n\n  assert.deepEqual(sell, { ok: false, message: '工厂资产仅允许通过拍卖交易' });\n  assert.deepEqual(buy, { ok: false, message: '工厂资产仅允许通过拍卖交易' });\n  assert.equal(seller.facilityGroups[0].count, 5);\n  assert.equal(buyer.facilityGroups?.some((item) => item.facilityTypeId === 'farm'), false);\n  assert.equal(buyer.credits, 1_000);\n  assert.equal(buyer.frozenCredits, 0);\n  assert.equal(world.orders.some((order) => order.assetKind === 'facility' && order.ownerType === 'player'), false);\n});\n\n""",
              text,
              count=1,
              flags=re.S,
          )
          if n != 1: raise SystemExit(f'facility-groups matching test replacement count={n}')
          text, n = re.subn(
              r"test\('running factory sell order immediately reduces participating output', \(\) => \{.*?\n\}\);\n\n",
              """test('rejected factory direct sell leaves running participation unchanged', () => {\n  const world = createWorld(now);\n  const seller = ensurePlayer(world, bob, now);\n  seller.facilityGroups = [group('farm', 5, { enabled: true, status: 'running', participatingCount: 5, cycleStartedAt: now })];\n  migrateFacilityGroupWorld(world, now);\n\n  const response = applyFacilityGroupAction(world, bob, 'placeOrder', {\n    assetKind: 'facility', assetId: 'farm', side: 'sell', quantity: 2, price: 100,\n  }, now + 1);\n  assert.deepEqual(response, { ok: false, message: '工厂资产仅允许通过拍卖交易' });\n  assert.equal(seller.facilityGroups[0].participatingCount, 5);\n  assert.equal(createFacilityGroupClientState(world, bob.id, now + 1).facilityGroups[0].listedCount, 0);\n});\n\n""",
              text,
              count=1,
              flags=re.S,
          )
          if n != 1: raise SystemExit(f'facility-groups participation test replacement count={n}')
          text, n = re.subn(
              r"\n*test\('purchased factories join a running group immediately and dilute live staffing', \(\) => \{.*?\n\}\);\n\n",
              "\n",
              text,
              count=1,
              flags=re.S,
          )
          if n != 1: raise SystemExit(f'facility-groups purchased test removal count={n}')
          path.write_text(text, encoding='utf-8')

          Path('server/test/listed-factory-production.test.js').write_text("""import assert from 'node:assert/strict';\nimport test from 'node:test';\nimport { createWorld, ensurePlayer } from '../src/domain.js';\nimport { applyFacilityGroupAction, createFacilityGroupClientState, migrateFacilityGroupWorld } from '../src/facility-groups.js';\n\nconst now = 1_700_000_000_000;\nconst alice = { id: 1, email: 'alice@example.com', name: 'Alice' };\n\ntest('factory direct sell cannot remove running production capacity', () => {\n  const world = createWorld(now);\n  const player = ensurePlayer(world, alice, now);\n  player.facilityGroups = [{\n    facilityTypeId: 'farm', count: 5, participatingCount: 5,\n    enabled: true, status: 'running', cycleStartedAt: now,\n    staffingRateBps: 10_000, staffingUpdatedAt: now,\n    activeRecipeId: 'wheat-crop', lifetimeOutput: 0,\n  }];\n  migrateFacilityGroupWorld(world, now);\n\n  const response = applyFacilityGroupAction(world, alice, 'placeOrder', {\n    assetKind: 'facility', assetId: 'farm', side: 'sell', quantity: 5, price: 100,\n  }, now + 1);\n\n  assert.deepEqual(response, { ok: false, message: '工厂资产仅允许通过拍卖交易' });\n  const farm = player.facilityGroups[0];\n  assert.equal(farm.status, 'running');\n  assert.equal(farm.enabled, true);\n  assert.equal(farm.count, 5);\n  assert.equal(farm.participatingCount, 5);\n  assert.equal(farm.staffingRateBps, 10_000);\n  const state = createFacilityGroupClientState(world, alice.id, now + 1).facilityGroups[0];\n  assert.equal(state.listedCount, 0);\n});\n""", encoding='utf-8')

          path = Path('server/test/market-sell-fee.test.js')
          text = path.read_text(encoding='utf-8')
          text, n = re.subn(
              r"test\('工厂卖单使用相同手续费并只向本人公开匿名金额字段', \(\) => \{.*?\n\}\);",
              """test('工厂直售被拒绝且不会产生市场手续费', () => {\n  const world = createWorld(now);\n  const seller = ensurePlayer(world, bob, now);\n  seller.credits = 0;\n  seller.facilityGroups = [group('farm', 2)];\n  migrateFacilityGroupWorld(world, now);\n\n  const response = applyFacilityGroupAction(world, bob, 'placeOrder', {\n    assetKind: 'facility', assetId: 'farm', side: 'sell', quantity: 2, price: 80,\n  }, now + 1);\n\n  assert.deepEqual(response, { ok: false, message: '工厂资产仅允许通过拍卖交易' });\n  assert.equal(seller.credits, 0);\n  assert.equal(seller.stats.marketServiceFees, 0);\n  assert.equal(seller.facilityGroups[0].count, 2);\n  assert.equal(world.orders.some((item) => item.ownerId === bob.id && item.assetKind === 'facility'), false);\n});""",
              text,
              count=1,
              flags=re.S,
          )
          if n != 1: raise SystemExit(f'market sell fee test replacement count={n}')
          path.write_text(text, encoding='utf-8')

          path = Path('server/test/order-book-integrity.test.js')
          text = path.read_text(encoding='utf-8')
          text, n = re.subn(
              r"test\('facility orders reject a price that crosses the same player resting order before freezing funds', \(\) => \{.*?\n\}\);\n\n",
              """test('factory direct orders are rejected before freezing funds or facilities', () => {\n  const world = createWorld(now);\n  deferDemand(world);\n  const player = ensurePlayer(world, alice, now);\n  const farm = FACILITY_TYPE_CATALOG.find((type) => type.id === 'farm');\n  assert.ok(farm);\n  player.credits = 100_000;\n  player.facilityGroups = [{ facilityTypeId: farm.id, count: 1 }];\n\n  const creditsBefore = player.credits;\n  const frozenCreditsBefore = player.frozenCredits;\n  const orderCountBefore = world.orders.length;\n  const sell = applyFacilityGroupAction(world, alice, 'placeOrder', {\n    assetKind: 'facility', assetId: farm.id, side: 'sell', quantity: 1, price: farm.systemValue,\n  }, now + 1);\n  const buy = applyFacilityGroupAction(world, alice, 'placeOrder', {\n    assetKind: 'facility', assetId: farm.id, side: 'buy', quantity: 1, price: farm.systemValue,\n  }, now + 2);\n\n  assert.deepEqual(sell, { ok: false, message: '工厂资产仅允许通过拍卖交易' });\n  assert.deepEqual(buy, { ok: false, message: '工厂资产仅允许通过拍卖交易' });\n  assert.equal(player.credits, creditsBefore);\n  assert.equal(player.frozenCredits, frozenCreditsBefore);\n  assert.equal(player.facilityGroups[0].count, 1);\n  assert.equal(world.orders.length, orderCountBefore);\n});\n\n""",
              text,
              count=1,
              flags=re.S,
          )
          if n != 1: raise SystemExit(f'order integrity facility test replacement count={n}')
          path.write_text(text, encoding='utf-8')

          Path('server/test/order-limits.test.js').write_text("""import assert from 'node:assert/strict';\nimport test from 'node:test';\nimport {\n  createWorld,\n  ECONOMY_CONSTANTS,\n  ensurePlayer,\n  FACILITY_TYPE_CATALOG,\n  PRODUCT_CATALOG,\n} from '../src/domain.js';\nimport {\n  applyFacilityGroupAction,\n  migrateFacilityGroupWorld,\n  processFacilityGroupWorld,\n} from '../src/facility-groups.js';\n\nconst now = 1_700_000_000_000;\nconst alice = { id: 1, email: 'alice@example.com', name: 'Alice' };\nconst bob = { id: 2, email: 'bob@example.com', name: 'Bob' };\n\nfunction stoppedGroup(typeId, count) {\n  return {\n    facilityTypeId: typeId,\n    count,\n    participatingCount: 0,\n    pendingJoinCount: 0,\n    enabled: false,\n    status: 'stopped',\n    statusReason: 'manual',\n    activeRecipeId: typeId === 'farm' ? 'wheat-crop' : `${typeId}-default`,\n    lifetimeOutput: 0,\n  };\n}\n\ntest('commodity orders keep the safe-integer quantity boundary while factory direct orders are retired', () => {\n  const world = createWorld(now);\n  const commoditySeller = ensurePlayer(world, alice, now);\n  const facilitySeller = ensurePlayer(world, bob, now);\n  commoditySeller.inventories.wheat.available = 10_001;\n  facilitySeller.facilityGroups = [stoppedGroup('farm', 1_000_001)];\n  migrateFacilityGroupWorld(world, now);\n\n  assert.equal(ECONOMY_CONSTANTS.maxOrderQuantity, Number.MAX_SAFE_INTEGER);\n  assert.equal(applyFacilityGroupAction(world, alice, 'placeOrder', {\n    assetKind: 'commodity', assetId: 'wheat', side: 'sell', quantity: 10_001, price: 1,\n  }, now + 1).ok, true);\n  assert.deepEqual(applyFacilityGroupAction(world, bob, 'placeOrder', {\n    assetKind: 'facility', assetId: 'farm', side: 'sell', quantity: 1_000_001, price: 80,\n  }, now + 2), { ok: false, message: '工厂资产仅允许通过拍卖交易' });\n\n  assert.equal(world.orders.find((order) => order.ownerId === alice.id && order.assetKind === 'commodity')?.quantity, 10_001);\n  assert.equal(world.orders.some((order) => order.ownerId === bob.id && order.assetKind === 'facility'), false);\n});\n\ntest('unfinished order limit still applies to commodity orders while factory direct orders reject independently', () => {\n  const world = createWorld(now);\n  const player = ensurePlayer(world, alice, now);\n  player.credits = 1_000_000;\n  processFacilityGroupWorld(world, now);\n\n  const catalogSize = PRODUCT_CATALOG.length + FACILITY_TYPE_CATALOG.length;\n  const expectedLimit = catalogSize * 10;\n  assert.equal(ECONOMY_CONSTANTS.maxOpenOrders, expectedLimit);\n\n  const baseOrders = [\n    ...PRODUCT_CATALOG.map((product, index) => ({\n      id: `commodity-limit-${index}`,\n      assetKind: 'commodity',\n      assetId: product.id,\n      productId: product.id,\n      side: 'buy',\n      ownerType: 'player',\n      ownerId: alice.id,\n      ownerName: 'Alice',\n      price: 1,\n      quantity: 1,\n      remaining: 1,\n      status: 'open',\n      createdAt: now + index,\n    })),\n    ...FACILITY_TYPE_CATALOG.map((facility, index) => ({\n      id: `legacy-facility-limit-${index}`,\n      assetKind: 'facility',\n      assetId: facility.id,\n      facilityTypeId: facility.id,\n      side: 'buy',\n      ownerType: 'player',\n      ownerId: alice.id,\n      ownerName: 'Alice',\n      price: facility.systemValue,\n      quantity: 1,\n      remaining: 1,\n      status: 'open',\n      createdAt: now + PRODUCT_CATALOG.length + index,\n    })),\n  ];\n  world.orders = Array.from({ length: 10 }, (_, batchIndex) => baseOrders.map((order, index) => ({\n    ...order,\n    id: `${order.id}-${batchIndex}`,\n    createdAt: now + batchIndex * catalogSize + index,\n  }))).flat();\n\n  const commodityResult = applyFacilityGroupAction(world, alice, 'placeOrder', {\n    assetKind: 'commodity', assetId: 'wheat', side: 'buy', quantity: 1, price: 1,\n  }, now);\n  const facilityResult = applyFacilityGroupAction(world, alice, 'placeOrder', {\n    assetKind: 'facility', assetId: 'farm', side: 'buy', quantity: 1, price: 80,\n  }, now);\n\n  assert.deepEqual(commodityResult, { ok: false, message: '未完成订单数量已达上限' });\n  assert.deepEqual(facilityResult, { ok: false, message: '工厂资产仅允许通过拍卖交易' });\n});\n\ntest('commodity orders keep the cent tick without a fixed business price cap', () => {\n  const world = createWorld(now);\n  const commoditySeller = ensurePlayer(world, alice, now);\n  commoditySeller.inventories.wheat.available = 2;\n  migrateFacilityGroupWorld(world, now);\n\n  const uncappedPrice = 1_000_000.01;\n  assert.equal(applyFacilityGroupAction(world, alice, 'placeOrder', {\n    assetKind: 'commodity', assetId: 'wheat', side: 'sell', quantity: 1, price: uncappedPrice,\n  }, now + 1).ok, true);\n  assert.equal(applyFacilityGroupAction(world, alice, 'placeOrder', {\n    assetKind: 'commodity', assetId: 'wheat', side: 'sell', quantity: 1, price: 0.01,\n  }, now + 2).ok, true);\n\n  assert.equal(world.orders.find((order) => order.ownerId === alice.id && order.price === uncappedPrice)?.price, uncappedPrice);\n  assert.deepEqual(applyFacilityGroupAction(world, alice, 'placeOrder', {\n    assetKind: 'commodity', assetId: 'wheat', side: 'sell', quantity: 1, price: 0.001,\n  }, now + 3), { ok: false, message: '订单参数无效' });\n});\n\ntest('factory direct orders reject before price or notional validation', () => {\n  const world = createWorld(now);\n  const seller = ensurePlayer(world, bob, now);\n  seller.facilityGroups = [stoppedGroup('farm', 2)];\n  migrateFacilityGroupWorld(world, now);\n\n  for (const payload of [\n    { quantity: 1, price: 1_000_000.01 },\n    { quantity: 1, price: 0.001 },\n    { quantity: Number.MAX_SAFE_INTEGER, price: 80 },\n  ]) {\n    assert.deepEqual(applyFacilityGroupAction(world, bob, 'placeOrder', {\n      assetKind: 'facility', assetId: 'farm', side: 'sell', ...payload,\n    }, now + 4), { ok: false, message: '工厂资产仅允许通过拍卖交易' });\n  }\n  assert.equal(seller.facilityGroups[0].count, 2);\n  assert.equal(world.orders.some((order) => order.ownerId === bob.id && order.assetKind === 'facility'), false);\n});\n\ntest('commodity orders reject notionals outside the representable money range', () => {\n  const world = createWorld(now);\n  ensurePlayer(world, alice, now);\n  migrateFacilityGroupWorld(world, now);\n\n  assert.deepEqual(applyFacilityGroupAction(world, alice, 'placeOrder', {\n    assetKind: 'commodity', assetId: 'wheat', side: 'sell', quantity: Number.MAX_SAFE_INTEGER, price: 1,\n  }, now + 1), { ok: false, message: '订单总额超出系统可表示范围' });\n});\n""", encoding='utf-8')

          Path('.github/workflows/codex-factory-auction-only-server-tests.yml').unlink()
          PY
      - name: Run server suite
        shell: bash
        run: npm ci && npm run server:test
      - name: Commit test updates
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Retire direct factory market tests'
          git push origin HEAD:codex/factory-auction-only
      - name: Run full CI on updated head
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh workflow run ci.yml --ref codex/factory-auction-only
