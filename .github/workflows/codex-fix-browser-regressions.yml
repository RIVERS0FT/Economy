name: Fix immediate-trade browser regressions

on:
  push:
    branches:
      - codex/daily-system-market

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update browser fixtures and stale assertions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          harness_path = Path('tests/browser/runtime-harness.tsx')
          harness = harness_path.read_text(encoding='utf-8')
          start = harness.index("    if (scenario === 'facility-card-profit') {")
          end = harness.index("    if (scenario === 'facility-order') {", start)
          section = harness[start:end]

          section, count = re.subn(
              r"(lastPrice: 29,\n)(\s*)lastTradePrice: 28\.75,",
              lambda match: (
                  f"{match.group(1)}{match.group(2)}officialPrice: 28.75,\n"
                  f"{match.group(2)}lastTradePrice: 28.75,"
              ),
              section,
              count=1,
          )
          if count != 1:
              raise RuntimeError(f'runtime-harness steel officialPrice replacement count={count}')

          section, count = re.subn(
              r"(markets\.machinery = \{\n\s*\.\.\.markets\.machinery,\n)(\s*)lastTradePrice: 76\.25,",
              lambda match: (
                  f"{match.group(1)}{match.group(2)}officialPrice: 76.25,\n"
                  f"{match.group(2)}lastTradePrice: 76.25,"
              ),
              section,
              count=1,
          )
          if count != 1:
              raise RuntimeError(f'runtime-harness machinery officialPrice replacement count={count}')

          harness_path.write_text(harness[:start] + section + harness[end:], encoding='utf-8')

          runtime_path = Path('tests/browser/runtime.spec.ts')
          runtime = runtime_path.read_text(encoding='utf-8')
          runtime, count = re.subn(
              r"  const nestedOverflowModes = await page\.locator\('\.overview-open-orders-list'\)\n"
              r"\s*\.evaluateAll\(\(elements\) => elements\.map\(\(element\) => getComputedStyle\(element\)\.overflowY\)\);\n"
              r"  expect\(nestedOverflowModes\)\.toEqual\(\['visible'\]\);",
              "  await expect(page.locator('.overview-open-orders-list')).toHaveCount(0);",
              runtime,
              count=1,
          )
          if count != 1:
              raise RuntimeError(f'runtime.spec retired order assertion replacement count={count}')
          runtime_path.write_text(runtime, encoding='utf-8')
          PY
          node scripts/verify-recipe-profit-analysis.mjs
          node scripts/verify-overview-content.mjs
      - name: Commit browser regression fixes
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/codex-fix-browser-regressions.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "修复即时交易浏览器回归夹具"
          git push origin HEAD:codex/daily-system-market
