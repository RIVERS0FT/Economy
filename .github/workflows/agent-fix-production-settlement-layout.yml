name: Agent fix production settlement layout

on:
  push:
    branches:
      - agent/fix-mobile-production-settlement-layout

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24.4.0
          cache: npm

      - name: Apply layout, design, test, and gate changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}: {old[:120]!r}')
              file.write_text(text.replace(old, new), encoding='utf-8')

          def require(path: str, text: str) -> None:
              if text not in Path(path).read_text(encoding='utf-8'):
                  raise SystemExit(f'{path}: missing required text: {text}')

          group_css = 'src/styles/facility-group-card-grid.css'
          replace_once(
              group_css,
              '''@container (max-width: 519px) {
            .facility-formula-top {
              grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
              grid-template-areas:
                "input output"
                "center center";
            }

            .facility-formula-input {
              grid-area: input;
            }

            .facility-formula-output {
              grid-area: output;
            }

            .facility-formula-center {
              grid-area: center;
              min-width: 0;
              justify-self: center;
            }
          }

          ''',
              '',
          )

          formula_css = 'src/styles/facility-production-formula.css'
          replace_once(
              formula_css,
              '''.facility-formula-input,
          .facility-formula-output {
            min-width: 0;
            display: flex;
            align-items: flex-start;
          }
          ''',
              '''.facility-formula-input,
          .facility-formula-output {
            min-width: 0;
            grid-area: auto;
            display: flex;
            align-items: flex-start;
            align-self: start;
          }
          ''',
          )
          replace_once(
              formula_css,
              '''.facility-formula-meta {
            max-width: 100%;
            display: grid;
            grid-template-columns: minmax(0, 1fr);
            align-items: start;
            gap: 0.28rem;
            border: 1px solid color-mix(in srgb, var(--color-border-strong) 76%, var(--color-bg-deep));
            border-radius: calc(var(--radius-control) - 0.25rem);
            padding: 0.38rem 0.52rem;
            color: var(--color-text-muted);
            background:
              linear-gradient(180deg, color-mix(in srgb, var(--color-text-primary) 4%, transparent), transparent),
              color-mix(in srgb, var(--color-bg-deep) 72%, var(--color-surface-control));
            box-shadow:
              inset 0 1px color-mix(in srgb, var(--color-text-primary) 5%, transparent),
              inset 0 -1px color-mix(in srgb, var(--color-bg-deep) 70%, transparent);
            font-size: var(--font-size-xs);
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
          }

          .facility-formula-meta-unit {
            width: 100%;
            justify-content: flex-start;
          }

          .facility-formula-meta-unit.is-cycle {
            color: var(--color-info);
          }

          .facility-formula-meta-unit.is-cost {
            color: var(--color-warning);
          }
          ''',
              '''.facility-formula-meta {
            max-width: 100%;
            min-width: 0;
            grid-area: auto;
            display: inline-flex;
            align-items: center;
            justify-content: flex-start;
            gap: 0;
            border: 1px solid color-mix(in srgb, var(--color-border-strong) 76%, var(--color-bg-deep));
            border-radius: calc(var(--radius-control) - 0.25rem);
            padding: 0.38rem 0.52rem;
            color: var(--color-text-muted);
            background:
              linear-gradient(180deg, color-mix(in srgb, var(--color-text-primary) 4%, transparent), transparent),
              color-mix(in srgb, var(--color-bg-deep) 72%, var(--color-surface-control));
            box-shadow:
              inset 0 1px color-mix(in srgb, var(--color-text-primary) 5%, transparent),
              inset 0 -1px color-mix(in srgb, var(--color-bg-deep) 70%, transparent);
            font-size: var(--font-size-xs);
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
          }

          .facility-formula-meta-unit {
            width: auto;
            flex: 0 0 auto;
            justify-content: flex-start;
          }

          .facility-formula-meta-unit.is-cycle {
            color: var(--color-info);
          }

          .facility-formula-meta-unit.is-cost {
            margin-left: 0.48rem;
            border-left: 1px solid var(--color-divider);
            padding-left: 0.48rem;
            color: var(--color-warning);
          }
          ''',
          )

          test_path = 'tests/browser/production-methods.spec.ts'
          replace_once(
              test_path,
              '    expect(costBox.y).toBeGreaterThan(cycleBox.y + cycleBox.height - 1);',
              '''    expect(Math.abs(costBox.y - cycleBox.y)).toBeLessThanOrEqual(1);
              expect(costBox.x).toBeGreaterThan(cycleBox.x + cycleBox.width - 1);
              const costDividerWidth = await metaUnits.nth(1).evaluate((element) => (
                Number.parseFloat(getComputedStyle(element).borderLeftWidth)
              ));
              expect(costDividerWidth).toBeGreaterThan(0);''',
          )
          replace_once(
              test_path,
              '''  test('keeps mobile production controls aligned inside the top dialog layer', async ({ page }) => {
            await page.setViewportSize({ width: 390, height: 844 });
            await page.goto('runtime-test.html?view=production&scenario=production-methods');
          ''',
              '''  test('keeps mobile production controls and settlement aligned inside the top dialog layer', async ({ page }) => {
            for (const width of [320, 390, 430]) {
              await page.setViewportSize({ width, height: 844 });
              await page.goto('runtime-test.html?view=production&scenario=production-methods');
          ''',
          )
          replace_once(
              test_path,
              '''    expect(Math.abs(recipeBox.y - methodBox.y)).toBeLessThanOrEqual(1);
            expect(methodBox.x).toBeGreaterThan(recipeBox.x + recipeBox.width - 1);

            await recipeSelect.click();
          ''',
              '''    expect(Math.abs(recipeBox.y - methodBox.y)).toBeLessThanOrEqual(1);
            expect(methodBox.x).toBeGreaterThan(recipeBox.x + recipeBox.width - 1);

            const settlement = sheet.locator('.facility-production-formula');
            const inputSlot = settlement.locator('.facility-formula-input .facility-formula-item-group').first();
            const outputSlot = settlement.locator('.facility-formula-output .facility-formula-item-group').first();
            const formulaMeta = settlement.locator('.facility-formula-meta');
            const progress = settlement.locator('.facility-formula-progress');
            const metaUnits = formulaMeta.locator(':scope > .facility-formula-meta-unit');
            const [inputBox, outputBox, metaBox, progressBox, cycleBox, costBox] = await Promise.all([
              inputSlot.boundingBox(),
              outputSlot.boundingBox(),
              formulaMeta.boundingBox(),
              progress.boundingBox(),
              metaUnits.nth(0).boundingBox(),
              metaUnits.nth(1).boundingBox(),
            ]);
            expect(inputBox).not.toBeNull();
            expect(outputBox).not.toBeNull();
            expect(metaBox).not.toBeNull();
            expect(progressBox).not.toBeNull();
            expect(cycleBox).not.toBeNull();
            expect(costBox).not.toBeNull();
            if (!inputBox || !outputBox || !metaBox || !progressBox || !cycleBox || !costBox) {
              throw new Error(`移动生产结算几何不可用: ${width}px`);
            }
            expect(Math.abs(inputBox.y - outputBox.y)).toBeLessThanOrEqual(1);
            expect(metaBox.y).toBeGreaterThanOrEqual(inputBox.y + inputBox.height - 1);
            expect(progressBox.y).toBeGreaterThanOrEqual(
              Math.max(metaBox.y + metaBox.height, outputBox.y + outputBox.height) - 1,
            );
            expect(Math.abs(costBox.y - cycleBox.y)).toBeLessThanOrEqual(1);
            expect(costBox.x).toBeGreaterThan(cycleBox.x + cycleBox.width - 1);
            expect(await metaUnits.nth(1).evaluate((element) => (
              Number.parseFloat(getComputedStyle(element).borderLeftWidth)
            ))).toBeGreaterThan(0);
            const settlementOverflow = await settlement.evaluate((element) => ({
              clientWidth: element.clientWidth,
              scrollWidth: element.scrollWidth,
            }));
            expect(settlementOverflow.scrollWidth).toBeLessThanOrEqual(settlementOverflow.clientWidth + 1);

            await recipeSelect.click();
          ''',
          )
          replace_once(
              test_path,
              '    expect(box.x + box.width).toBeLessThanOrEqual(390);',
              '    expect(box.x + box.width).toBeLessThanOrEqual(width);',
          )
          replace_once(
              test_path,
              '''    await expect(listbox).toHaveCount(0);
            await expect(recipeSelect).toBeFocused();
            });
          });
          ''',
              '''    await expect(listbox).toHaveCount(0);
            await expect(recipeSelect).toBeFocused();
            }
            });
          });
          ''',
          )

          verifier = 'scripts/verify-production-settlement-layout.mjs'
          replace_once(
              verifier,
              "const formulaCss = read('src/styles/facility-production-formula.css');",
              "const formulaCss = read('src/styles/facility-production-formula.css');\nconst groupCss = read('src/styles/facility-group-card-grid.css');",
          )
          replace_once(
              verifier,
              "  'grid-template-columns: minmax(0, 1fr);',",
              "  'display: inline-flex;',\n  'grid-area: auto;',\n  '.facility-formula-meta-unit.is-cost {',",
          )
          replace_once(
              verifier,
              '''for (const forbidden of [
            '.facility-formula-center',
            '.facility-formula-meta-divider',
            'grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);',
            'border-top: 1px solid var(--color-divider);',
          ]) assert.equal(formulaCss.includes(forbidden), false, `生产结算样式不得包含: ${forbidden}`);
          ''',
              '''for (const forbidden of [
            '.facility-formula-center',
            '.facility-formula-meta-divider',
            'grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);',
            'border-top: 1px solid var(--color-divider);',
          ]) assert.equal(formulaCss.includes(forbidden), false, `生产结算样式不得包含: ${forbidden}`);
          for (const forbidden of [
            '@container (max-width: 519px)',
            'grid-area: input;',
            'grid-area: output;',
            '.facility-formula-center',
          ]) assert.equal(groupCss.includes(forbidden), false, `工厂主从样式不得控制生产结算内部网格: ${forbidden}`);
          ''',
          )
          replace_once(
              verifier,
              "  'expect(costBox.y).toBeGreaterThan(cycleBox.y + cycleBox.height - 1)',",
              "  'expect(Math.abs(costBox.y - cycleBox.y)).toBeLessThanOrEqual(1)',\n  'expect(Math.abs(inputBox.y - outputBox.y)).toBeLessThanOrEqual(1)',\n  'settlementOverflow.scrollWidth',\n  'for (const width of [320, 390, 430])',",
          )

          groups_verifier = 'scripts/verify-facility-groups.mjs'
          replace_once(
              groups_verifier,
              '''for (const forbidden of [
            '--facility-card-height',
            'grid-auto-rows: 1fr;',
            'align-self: stretch;',
            '.facility-card-spacer',
            'top: var(--desktop-page-top-offset);',
          ]) forbidText('src/styles/facility-group-card-grid.css', forbidden);
          ''',
              '''for (const forbidden of [
            '--facility-card-height',
            'grid-auto-rows: 1fr;',
            'align-self: stretch;',
            '.facility-card-spacer',
            'top: var(--desktop-page-top-offset);',
            '@container (max-width: 519px)',
            'grid-area: input;',
            'grid-area: output;',
            '.facility-formula-center',
          ]) forbidText('src/styles/facility-group-card-grid.css', forbidden);
          ''',
          )
          replace_once(
              groups_verifier,
              "  '.facility-production-formula-heading',\n]) requireText('src/styles/facility-production-formula.css', text);",
              "  '.facility-production-formula-heading',\n  'display: inline-flex;',\n  '.facility-formula-meta-unit.is-cost {',\n  'border-left: 1px solid var(--color-divider);',\n]) requireText('src/styles/facility-production-formula.css', text);",
          )
          replace_once(
              groups_verifier,
              "  '周期与当前集群周期成本固定放在输入组合区的物资行下方',",
              "  '时间与成本在输入物资下方同一行显示，中间使用竖向分隔线',",
          )
          replace_once(
              groups_verifier,
              "  '时间与成本不得回到输入输出之间的独立中列',",
              "  '时间与成本在输入物资下方同一行显示',\n  '时间与成本不得回到输入输出之间的独立中列',",
          )

          industry = 'docs/INDUSTRY_AND_PRODUCTION_DESIGN.md'
          replace_once(
              industry,
              '- 周期与当前集群周期成本固定放在输入组合区的物资行下方，并以时间、成本两行显示；周期不乘工厂数量，不得显示总工时，也不得恢复输入输出之间的独立中列或横向时间成本分隔符。',
              '- 时间与成本固定放在输入组合区的物资行下方同一行显示，中间使用竖向分隔线；周期不乘工厂数量，不得显示总工时，也不得恢复输入输出之间的独立中列、上下两行排列或横向分隔线。生产结算内部网格唯一归属 `src/styles/facility-production-formula.css`，`facility-group-card-grid.css` 不得定义任何 `.facility-formula-*` 的 `grid-area`、隐式轨道或容器查询。',
          )

          ui = 'docs/UI_DESIGN_SYSTEM.md'
          replace_once(
              ui,
              '- 工厂生产公式固定采用双列顶层布局：左侧为输入组合区，右侧为输出区；输入组合区内先显示投入物资槽，再在其下以两行显示时间与成本。多输入或多输出内部允许换行，时间与成本不得回到输入输出之间的独立中列。公式、进度和单厂平均利润共同组成一张“生产结算”卡，利润行只使用顶部分隔线，不得拥有独立外框、圆角或背景。',
              '- 工厂生产公式固定采用双列顶层布局：左侧为输入组合区，右侧为输出区；输入与输出物资槽顶部对齐，输入组合区内先显示投入物资槽，再在其下同一行显示时间与成本，中间使用竖向分隔线。多输入或多输出内部允许换行，时间与成本不得回到输入输出之间的独立中列。公式、进度和单厂平均利润共同组成一张“生产结算”卡，利润行只使用顶部分隔线，不得拥有独立外框、圆角或背景。',
          )
          replace_once(
              ui,
              '- 输入侧周期成本仪表只显示时间 Icon、周期数值、成本 Icon 和集群成本数值，不显示可见的“周期”或“运行成本”标签；时间和成本固定上下两行，共用一个容器且不得恢复横向分隔符。',
              '- 输入侧周期成本仪表只显示时间 Icon、周期数值、成本 Icon 和集群成本数值，不显示可见的“周期”或“运行成本”标签；时间和成本固定在同一行，中间使用 `border-left` 形成竖向分隔线，不得恢复上下两行或横向分隔符。生产结算内部布局只能由 `facility-production-formula.css` 定义，工厂主从布局样式不得写入生产公式的 `grid-area` 或专属容器查询。',
          )

          require(group_css, '.facility-production-settings-grid')
          require(formula_css, 'display: inline-flex;')
          require(formula_css, 'border-left: 1px solid var(--color-divider);')
          require(test_path, 'for (const width of [320, 390, 430])')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Run focused verification
        shell: bash
        run: |
          set -euo pipefail
          npm run verify:production-settlement
          node scripts/verify-facility-groups.mjs
          node scripts/verify-unified-factory-recipes-grid.mjs
          npx playwright install --with-deps chromium
          npx playwright test tests/browser/production-methods.spec.ts --project=chromium
          git diff --check

      - name: Run full build and browser suite
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          npm run test:browser
          git diff --check

      - name: Commit verified changes
        shell: bash
        run: |
          rm .github/workflows/agent-fix-production-settlement-layout.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src scripts tests docs .github/workflows/agent-fix-production-settlement-layout.yml
          git commit -m "修复移动生产结算布局"
          git push origin HEAD:agent/fix-mobile-production-settlement-layout
