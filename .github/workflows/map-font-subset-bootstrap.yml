name: Finalize bundled map font integration

on:
  pull_request:
    paths:
      - '.github/workflows/map-font-subset-bootstrap.yml'
      - 'scripts/finalize-map-font-subset.py'
      - 'scripts/fix-map-font-finalizer-verifier.py'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify subset reproducibility and apply final integration
        shell: bash
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check 'fonttools[woff]==4.59.2' brotli==1.1.0
          python3 scripts/generate-map-font-subset.py
          git diff --exit-code -- src/assets/fonts/economy-map-serif-600.woff2 src/assets/fonts/economy-map-serif-600.manifest.json
          python3 scripts/finalize-map-font-subset.py
          python3 scripts/fix-map-font-finalizer-verifier.py
          rm scripts/finalize-map-font-subset.py scripts/fix-map-font-finalizer-verifier.py .github/workflows/map-font-subset-bootstrap.yml
          node scripts/verify-province-map-focus.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: bundle only strategic map font glyphs'
          git push origin "HEAD:${HEAD_REF}"
