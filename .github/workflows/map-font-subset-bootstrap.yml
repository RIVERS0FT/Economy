name: Bootstrap map font subset

on:
  pull_request:
    paths:
      - '.github/workflows/map-font-subset-bootstrap.yml'
      - 'shared/provinces.json'

permissions:
  contents: write

jobs:
  subset:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and commit pinned Source Han Serif map subset
        shell: bash
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check 'fonttools[woff]==4.59.2' brotli==1.1.0
          python3 - <<'PY'
          import json
          from pathlib import Path
          provinces = json.loads(Path('shared/provinces.json').read_text(encoding='utf-8'))
          chars = ''.join(sorted(set(''.join(item['name'] for item in provinces))))
          Path('/tmp/map-font-chars.txt').write_text(chars, encoding='utf-8')
          print(f'MAP_FONT_CHAR_COUNT={len(chars)}')
          print(f'MAP_FONT_CHARS={chars}')
          PY
          curl --fail --location --silent --show-error \
            'https://raw.githubusercontent.com/adobe-fonts/source-han-serif/2.003R/SubsetOTF/CN/SourceHanSerifCN-SemiBold.otf' \
            --output /tmp/source-han-serif-cn-semibold.otf
          test "$(git hash-object /tmp/source-han-serif-cn-semibold.otf)" = '44d7f0c522ee7e9c6cb373a5ef7e851f30b558a1'
          pyftsubset /tmp/source-han-serif-cn-semibold.otf \
            --text-file=/tmp/map-font-chars.txt \
            --output-file=/tmp/economy-map-serif-600.woff2 \
            --flavor=woff2 \
            --layout-features='' \
            --no-layout-closure \
            --notdef-glyph \
            --notdef-outline \
            --recommended-glyphs \
            --name-IDs='*' \
            --name-languages='*'
          python3 - <<'PY'
          from fontTools.ttLib import TTFont
          path = '/tmp/economy-map-serif-600.woff2'
          font = TTFont(path)
          font['OS/2'].usWeightClass = 600
          names = {
              1: 'Economy Map Serif',
              2: 'SemiBold',
              3: 'Economy Map Serif SemiBold 2.003R subset',
              4: 'Economy Map Serif SemiBold',
              6: 'EconomyMapSerif-SemiBold',
              16: 'Economy Map Serif',
              17: 'SemiBold',
          }
          table = font['name']
          for name_id, value in names.items():
              table.removeNames(nameID=name_id)
              table.setName(value, name_id, 3, 1, 0x409)
              table.setName(value, name_id, 1, 0, 0)
          font.flavor = 'woff2'
          font.save(path)
          PY
          mkdir -p src/assets/fonts
          cp /tmp/economy-map-serif-600.woff2 src/assets/fonts/economy-map-serif-600.woff2
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          chars = Path('/tmp/map-font-chars.txt').read_text(encoding='utf-8')
          font_path = Path('src/assets/fonts/economy-map-serif-600.woff2')
          payload = {
              'family': 'Economy Map Serif',
              'weight': 600,
              'sourceProject': 'Adobe Source Han Serif',
              'sourceVersion': '2.003R',
              'sourcePath': 'SubsetOTF/CN/SourceHanSerifCN-SemiBold.otf',
              'sourceGitBlobSha': '44d7f0c522ee7e9c6cb373a5ef7e851f30b558a1',
              'generator': {'fonttools': '4.59.2', 'brotli': '1.1.0'},
              'characters': chars,
              'characterCount': len(chars),
              'sizeBytes': font_path.stat().st_size,
              'sha256': hashlib.sha256(font_path.read_bytes()).hexdigest(),
          }
          Path('src/assets/fonts/economy-map-serif-600.manifest.json').write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          print(f"MAP_FONT_SIZE={payload['sizeBytes']}")
          print(f"MAP_FONT_SHA256={payload['sha256']}")
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/assets/fonts/economy-map-serif-600.woff2 src/assets/fonts/economy-map-serif-600.manifest.json
          if git diff --cached --quiet; then
            echo 'MAP_FONT_SUBSET_UNCHANGED'
            exit 0
          fi
          git commit -m 'chore: add generated map font subset'
          git push origin "HEAD:${HEAD_REF}"
