name: Bootstrap map font subset

on:
  pull_request:
    paths:
      - '.github/workflows/map-font-subset-bootstrap.yml'
      - 'scripts/generate-map-font-subset.py'
      - 'shared/provinces.json'

permissions:
  contents: write

jobs:
  subset:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and commit pinned Source Han Serif map subset
        shell: bash
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check 'fonttools[woff]==4.59.2' brotli==1.1.0
          python3 scripts/generate-map-font-subset.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/assets/fonts/economy-map-serif-600.woff2 src/assets/fonts/economy-map-serif-600.manifest.json
          if git diff --cached --quiet; then
            echo 'MAP_FONT_SUBSET_UNCHANGED'
            exit 0
          fi
          git commit -m 'chore: add generated map font subset'
          git push origin "HEAD:${HEAD_REF}"
