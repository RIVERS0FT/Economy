name: Maintain Economy Production Database Space

on:
  schedule:
    - cron: '30 18 * * 0'
  workflow_dispatch:

concurrency:
  group: economy-production-database-mutation
  cancel-in-progress: false

permissions:
  contents: read
  statuses: write

jobs:
  maintain:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$SERVER_HOST"
          test -n "$SERVER_PORT"
          test -n "$SERVER_SSH_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SERVER_PORT" "$SERVER_HOST" >> ~/.ssh/known_hosts

      - name: Reclaim bounded SQLite freelist pages
        id: maintain_database
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          set -uo pipefail
          test -n "$SERVER_USER"
          report=/tmp/economy-incremental-maintenance.json
          rm -f "$report"

          set +e
          timeout 15m ssh -i ~/.ssh/deploy_key -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" \
            'if [ "$(id -u)" -eq 0 ]; then exec python3 - maintain-incremental --minimum-reclaimable-bytes 67108864 --minimum-reclaimable-ratio-ppm 250000 --pages-per-batch 1024 --max-batches 4; elif command -v sudo >/dev/null 2>&1 && sudo -n true; then exec sudo -n python3 - maintain-incremental --minimum-reclaimable-bytes 67108864 --minimum-reclaimable-ratio-ppm 250000 --pages-per-batch 1024 --max-batches 4; else echo ECONOMY_DATABASE_MAINTENANCE_PRIVILEGES_UNAVAILABLE >&2; exit 1; fi' \
            < scripts/manage-production-database.py | tee "$report"
          maintenance_status=${PIPESTATUS[0]}
          set -e

          test -s "$report"
          python3 scripts/manage-production-database.py render-summary "$report" "$GITHUB_STEP_SUMMARY"
          exit "$maintenance_status"

      - name: Publish maintenance status
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MAINTENANCE_OUTCOME: ${{ steps.maintain_database.outcome }}
        run: |
          set -euo pipefail
          report=/tmp/economy-incremental-maintenance.json
          target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          python3 - "$report" "$MAINTENANCE_OUTCOME" "$target_url" <<'PYTHON' > /tmp/economy-maintenance-status.json
          import json
          import sys

          report_path, outcome, target_url = sys.argv[1:]
          state = 'success' if outcome == 'success' else 'failure'
          description = 'Economy database space maintenance failed'
          try:
              with open(report_path, encoding='utf-8') as handle:
                  report = json.load(handle)
              before = report.get('before', {})
              after = report.get('after', {})
              mib = 1024 ** 2
              description = (
                  f'{report.get("status", "unknown")}; reusable '
                  f'{before.get("reclaimableBytes", 0) / mib:.0f}MiB -> '
                  f'{after.get("reclaimableBytes", 0) / mib:.0f}MiB'
              )[:140]
          except Exception as error:
              description = f'Economy database maintenance failed: {error}'[:140]
              state = 'failure'

          print(json.dumps({
              'state': state,
              'description': description,
              'context': 'maintenance/economy-database-space',
              'target_url': target_url,
          }))
          PYTHON

          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data-binary @/tmp/economy-maintenance-status.json \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" > /dev/null
