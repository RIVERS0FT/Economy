name: Fix instant province patch runner

on:
  push:
    branches:
      - fix/instant-province-unlock

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix temporary workflow
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/apply-instant-province-unlock.yml')
          text = path.read_text(encoding='utf-8')
          old_condition = "    if: github.actor != 'github-actions[bot]'\n"
          new_condition = "    if: github.actor != 'github-actions[bot]' || github.event.head_commit.message == '修正临时补丁运行环境'\n"
          old_node = '          node-version-file: .nvmrc\n'
          new_node = '          node-version: 24.4.0\n'
          if text.count(old_condition) != 1 or text.count(old_node) != 1:
              raise SystemExit('temporary workflow no longer matches expected source')
          path.write_text(text.replace(old_condition, new_condition, 1).replace(old_node, new_node, 1), encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/apply-instant-province-unlock.yml
          git diff --cached --check
          git commit -m "修正临时补丁运行环境"
          git push origin HEAD
