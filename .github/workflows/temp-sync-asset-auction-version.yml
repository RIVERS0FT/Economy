name: Temporary Sync Asset Auction Version

on:
  push:
    branches:
      - agent/stabilize-state-partition-revisions
    paths:
      - .github/workflows/temp-sync-asset-auction-version.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stabilize-state-partition-revisions
          fetch-depth: 0
      - name: Synchronize asset auction version assertion
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/verify-asset-auctions.mjs')
          text = path.read_text(encoding='utf-8')
          old = '客户端状态版本：`21`'
          new = '客户端状态版本：`22`'
          if old not in text:
              raise SystemExit('expected version assertion not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git rm .github/workflows/temp-sync-asset-auction-version.yml
      - name: Commit synchronized assertion
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/verify-asset-auctions.mjs .github/workflows/temp-sync-asset-auction-version.yml
          git commit -m "同步资产拍卖状态版本检查"
          git push origin HEAD:agent/stabilize-state-partition-revisions
