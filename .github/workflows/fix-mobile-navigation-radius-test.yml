name: Fix mobile navigation radius test

on:
  push:
    branches:
      - fix/mobile-navigation-radius-test-20260902

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.4.0
          cache: npm
      - run: npm ci
      - name: Remove obsolete navigation-to-content radius coupling
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/browser/mobile-workspace-overlay.spec.ts')
          text = path.read_text(encoding='utf-8')
          old = "    expect(geometry.navigationRadius).toBe(geometry.primaryPanelRadius);\n"
          if old not in text:
              raise SystemExit('obsolete navigation radius assertion missing')
          path.write_text(text.replace(old, '', 1), encoding='utf-8')
          PY
      - name: Verify mobile overlay geometry
        env:
          PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: /usr/bin/google-chrome
        run: |
          npm run generate:local-preview
          bash scripts/prepare-playwright-chromium.sh
          npm run test:browser -- tests/browser/mobile-workspace-overlay.spec.ts
          git diff --check
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/browser/mobile-workspace-overlay.spec.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m '校正移动导航与正文圆角回归边界'
          git push origin HEAD:${GITHUB_REF_NAME}
