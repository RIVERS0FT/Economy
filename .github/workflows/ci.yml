name: Economy CI

on:
  pull_request:
  push:
    branches-ignore:
      - main
  workflow_dispatch:

concurrency:
  group: economy-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  inspect-pr449-deploy:
    if: (github.event_name == 'push' && github.ref_name == 'agent/pr449-deploy-check-2') || (github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'agent/pr449-deploy-check-2')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    steps:
      - name: Inspect production workflows
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TARGET_SHA: 32bf5107222556a4f8ce4d0b7403aab2c8741b67
        run: |
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.request

          token = os.environ['GH_TOKEN']
          repository = os.environ['REPOSITORY']
          target_sha = os.environ['TARGET_SHA']
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'X-GitHub-Api-Version': '2022-11-28',
          }
          required_names = [
              'Deploy Economy Website',
              'Configure Economy Registration Email',
          ]

          def get_json(url):
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request) as response:
                  return json.load(response)

          for _ in range(100):
              data = get_json(
                  f'https://api.github.com/repos/{repository}/actions/runs'
                  f'?head_sha={target_sha}&per_page=50'
              )
              runs = sorted(
                  data.get('workflow_runs', []),
                  key=lambda run: run.get('created_at', ''),
                  reverse=True,
              )
              selected = {
                  name: next((run for run in runs if run.get('name') == name), None)
                  for name in required_names
              }
              summary = {
                  name: None if run is None else {
                      'id': run['id'],
                      'run_number': run['run_number'],
                      'status': run['status'],
                      'conclusion': run['conclusion'],
                      'head_sha': run['head_sha'],
                  }
                  for name, run in selected.items()
              }
              print(json.dumps(summary, ensure_ascii=False, indent=2), flush=True)

              deploy = selected['Deploy Economy Website']
              email = selected['Configure Economy Registration Email']
              if deploy and deploy['status'] == 'completed':
                  if deploy['conclusion'] != 'success':
                      raise SystemExit('Deploy Economy Website did not succeed')
                  if email and email['status'] == 'completed':
                      if email['conclusion'] != 'success':
                          raise SystemExit('Configure Economy Registration Email did not succeed')
                      for run in (deploy, email):
                          jobs = get_json(run['jobs_url']).get('jobs', [])
                          print(json.dumps({
                              'workflow': run['name'],
                              'run_id': run['id'],
                              'run_number': run['run_number'],
                              'jobs': [
                                  {
                                      'name': job['name'],
                                      'status': job['status'],
                                      'conclusion': job['conclusion'],
                                  }
                                  for job in jobs
                              ],
                          }, ensure_ascii=False, indent=2), flush=True)
                      raise SystemExit(0)
              time.sleep(10)

          raise SystemExit('Production workflows did not complete within the diagnostic window')
          PY

  verify-head-ci-registration:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Verify head push CI registration
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.request

          token = os.environ['GH_TOKEN']
          head_sha = os.environ['HEAD_SHA']
          repository = os.environ['REPOSITORY']
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'X-GitHub-Api-Version': '2022-11-28',
          }

          runs = []
          for _ in range(12):
              url = f'https://api.github.com/repos/{repository}/actions/runs?head_sha={head_sha}&event=push&per_page=20'
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request) as response:
                  runs = json.load(response).get('workflow_runs', [])
              if runs:
                  break
              time.sleep(5)

          print(json.dumps({
              'head_sha': head_sha,
              'push_runs': [
                  {
                      'id': run['id'],
                      'run_number': run['run_number'],
                      'status': run['status'],
                      'conclusion': run['conclusion'],
                  }
                  for run in runs
              ],
          }, ensure_ascii=False, indent=2))
          if not runs:
              raise SystemExit('No push workflow run found for the pull request head SHA')
          PY

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.4.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and test
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build-test.log

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Test browser runtime
        shell: bash
        run: |
          set -o pipefail
          npm run test:browser 2>&1 | tee browser-test.log

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: economy-test-artifacts
          path: |
            build-test.log
            browser-test.log
            playwright-report
            test-results
          if-no-files-found: warn
          retention-days: 3
