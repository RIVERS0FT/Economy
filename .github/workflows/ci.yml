name: Economy CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: economy-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Apply factory settlement fix
        if: github.head_ref == 'agent/fix-mobile-settlement-meta-and-separators'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.agent/apply-factory-settlement-fix.py')
          text = path.read_text()

          old = '`生产结算不得包含: ${text}`'
          new = '`生产结算不得包含: ${forbidden}`'
          count = text.count(old)
          if count != 2:
              raise SystemExit(f'expected two verifier template matches, found {count}')
          text = text.replace(old, new)

          old = r"\n  'width: 100%;',\n"
          new = r"\n  '  .facility-formula-meta {\\n    width: 100%;\\n  }',\n"
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected one mobile width verifier match, found {count}')
          text = text.replace(old, new)

          path.write_text(text)
          PY
          python .agent/apply-factory-settlement-fix.py
          rm -rf .agent
          git rm --cached -f .agent/apply-factory-settlement-fix.py

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.4.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and test
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build-test.log

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Test browser runtime
        shell: bash
        run: |
          set -o pipefail
          npm run test:browser 2>&1 | tee browser-test.log

      - name: Commit focused change
        if: github.head_ref == 'agent/fix-mobile-settlement-meta-and-separators'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout origin/main -- .github/workflows/ci.yml
          git rm -f .github/workflows/apply-factory-settlement-fix.yml
          git add -- \
            .github/workflows/ci.yml \
            src/components/facilities/FacilityProductionFormula.tsx \
            src/styles/facility-production-formula.css \
            docs/INDUSTRY_AND_PRODUCTION_DESIGN.md \
            docs/UI_DESIGN_SYSTEM.md \
            scripts/verify-production-settlement-layout.mjs \
            tests/browser/production-methods.spec.ts
          git diff --cached --check
          git commit -m "fix: tighten factory settlement metadata"
          git push origin HEAD:${{ github.head_ref }}

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: economy-test-artifacts
          path: |
            build-test.log
            browser-test.log
            playwright-report
            test-results
          if-no-files-found: warn
          retention-days: 3
