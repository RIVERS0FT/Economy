name: Economy CI

on:
  pull_request:
  push:
    branches-ignore:
      - main
  workflow_dispatch:

concurrency:
  group: economy-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  verify-head-ci-registration:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Verify head push CI registration
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.request

          token = os.environ['GH_TOKEN']
          head_sha = os.environ['HEAD_SHA']
          repository = os.environ['REPOSITORY']
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'X-GitHub-Api-Version': '2022-11-28',
          }

          runs = []
          for _ in range(12):
              url = f'https://api.github.com/repos/{repository}/actions/runs?head_sha={head_sha}&event=push&per_page=20'
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request) as response:
                  runs = json.load(response).get('workflow_runs', [])
              if runs:
                  break
              time.sleep(5)

          print(json.dumps({
              'head_sha': head_sha,
              'push_runs': [
                  {
                      'id': run['id'],
                      'run_number': run['run_number'],
                      'status': run['status'],
                      'conclusion': run['conclusion'],
                  }
                  for run in runs
              ],
          }, ensure_ascii=False, indent=2))
          if not runs:
              raise SystemExit('No push workflow run found for the pull request head SHA')
          PY

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Collapse lazy production runtime patch
        if: github.event_name == 'push' && github.ref_name == 'agent/production-lazy-settlement'
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'missing patch anchor in {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1))

          core = Path('server/src/leaderboards-core.js')
          text = core.read_text()
          old = "import { FACILITY_TYPE_CATALOG, PRODUCT_CATALOG } from './domain.js';"
          new = "import { FACILITY_TYPE_CATALOG, processWorld, PRODUCT_CATALOG } from './domain.js';"
          if old not in text:
              raise SystemExit('leaderboard import anchor missing')
          text = text.replace(old, new, 1)
          old = "export function processLeaderboardWorld(world, now = Date.now(), options = {}) {\n  const migrate = options.migrate !== false;\n  world.players ||= {};"
          new = "export function processLeaderboardWorld(world, now = Date.now(), options = {}) {\n  const migrate = options.migrate !== false;\n  processWorld(world, now, { migrate: false });\n  world.players ||= {};"
          if old not in text:
              raise SystemExit('leaderboard process anchor missing')
          Path('server/src/leaderboards.js').write_text(text.replace(old, new, 1))
          core.unlink()

          replace_once(
              'server/src/facility-groups.js',
              "  return {\n    ...publicGroup,\n    staffingRateBps,\n    staffingUpdatedAt: Math.max(0, Number(now) || 0),",
              "  return {\n    ...publicGroup,\n    staffingRateBps,\n    staffingUpdatedAt: Math.max(0, Number(now) || 0),\n    productionSettlementStaffingRateBps: normalizeStaffingRate(group.staffingRateBps) ?? FACILITY_STAFFING_FULL_BPS,\n    productionSettlementStaffingUpdatedAt: Number.isFinite(Number(group.staffingUpdatedAt))\n      ? Math.max(0, Number(group.staffingUpdatedAt))\n      : Math.max(0, Number(now) || 0),",
          )
          replace_once(
              'src/types.ts',
              "  /** Server timestamp at which staffingRateBps was projected. */\n  staffingUpdatedAt?: number;\n  /** Fixed-point equivalent-capacity carry retained between completed cycles. */",
              "  /** Server timestamp at which staffingRateBps was projected. */\n  staffingUpdatedAt?: number;\n  /** Raw authoritative staffing rate used only to construct a production settlement proposal. */\n  productionSettlementStaffingRateBps?: number;\n  /** Raw authoritative staffing timestamp used only to construct a production settlement proposal. */\n  productionSettlementStaffingUpdatedAt?: number;\n  /** Fixed-point equivalent-capacity carry retained between completed cycles. */",
          )
          replace_once(
              'src/utils/productionSettlement.ts',
              "    staffingRateBps: nonNegativeInteger(group.staffingRateBps ?? 10_000),\n    staffingUpdatedAt: Number.isFinite(Number(group.staffingUpdatedAt)) ? Number(group.staffingUpdatedAt) : serverNow,",
              "    staffingRateBps: nonNegativeInteger(\n      group.productionSettlementStaffingRateBps ?? group.staffingRateBps ?? 10_000,\n    ),\n    staffingUpdatedAt: Number.isFinite(Number(group.productionSettlementStaffingUpdatedAt))\n      ? Number(group.productionSettlementStaffingUpdatedAt)\n      : Number.isFinite(Number(group.staffingUpdatedAt))\n        ? Number(group.staffingUpdatedAt)\n        : serverNow,",
          )
          replace_once(
              'src/utils/productionSettlement.ts',
              "    // Public state contains the server-time staffing projection. It is exact for the common full-staffing case;\n    // a resource-bound approximation mismatch is rejected and retried through the current-player server fallback.\n",
              "    // Settlement proposal math uses the raw authoritative staffing baseline while UI fields remain projected.\n",
          )

          verifier = Path('scripts/verify-production-lazy-settlement.mjs')
          text = verifier.read_text()
          anchor = "assert.match(clientSettlement, /createProductionSettlementClaim/, '浏览器必须从现有权威状态计算生产结算声明');"
          addition = anchor + "\nassert.match(clientSettlement, /productionSettlementStaffingRateBps/, '客户端必须使用服务器原始 staffing 基线而不是 UI 投影值');"
          if '客户端必须使用服务器原始 staffing 基线' not in text:
              if anchor not in text:
                  raise SystemExit('verifier staffing anchor missing')
              verifier.write_text(text.replace(anchor, addition, 1))
          PY

          git fetch origin main --depth=1
          git checkout origin/main -- .github/workflows/ci.yml
          git config user.name 'RIVERSOFT'
          git config user.email '105160096+RIVERS0FT@users.noreply.github.com'
          git add -A .github/workflows/ci.yml server/src/leaderboards.js server/src/leaderboards-core.js server/src/facility-groups.js src/types.ts src/utils/productionSettlement.ts scripts/verify-production-lazy-settlement.mjs
          git diff --cached --check
          git commit -m 'collapse lazy production runtime repair'
          git push origin HEAD:agent/production-lazy-settlement

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.4.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and test
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build-test.log

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Test browser runtime
        shell: bash
        run: |
          set -o pipefail
          npm run test:browser 2>&1 | tee browser-test.log

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: economy-test-artifacts
          path: |
            build-test.log
            browser-test.log
            playwright-report
            test-results
          if-no-files-found: warn
          retention-days: 3
