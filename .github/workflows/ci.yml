name: Economy CI

on:
  pull_request:
  push:
    branches-ignore:
      - main
  workflow_dispatch:

concurrency:
  group: economy-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply production settlement precision fixes
        if: github.event_name == 'push' && github.ref_name == 'agent/production-lazy-settlement'
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'missing patch anchor in {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1))

          replace_once(
              'server/src/production-settlement.js',
              "function settleProductionWage(world, player, group, groupBasis, costMicros) {\n  const multiplier = Math.max(5_000, safeInteger(groupBasis.cycleWageMultiplierBps, 10_000));\n  const carry = bigint(group.productionWageCarryNumerator || WAGE_ROUNDING_HALF);\n  const numerator = costMicros * BigInt(multiplier) + carry;",
              "function settleProductionWage(world, player, group, groupBasis, costMicros, multiplierBps) {\n  if (costMicros <= 0n) return;\n  const multiplier = Math.max(5_000, safeInteger(multiplierBps, 10_000));\n  const carry = group.productionWageCarryNumerator === undefined\n    ? WAGE_ROUNDING_HALF\n    : bigint(group.productionWageCarryNumerator);\n  const numerator = costMicros * BigInt(multiplier) + carry;",
          )
          replace_once(
              'server/src/production-settlement.js',
              "    settleProductionWage(world, player, group, groupBasis, usage.costMicros);\n    group.staffingBatchCarryBps = usage.finalCarryBps;",
              "    const firstCycleCostMicros = productionResourceUsage(groupBasis, 1).costMicros;\n    settleProductionWage(\n      world,\n      player,\n      group,\n      groupBasis,\n      firstCycleCostMicros,\n      groupBasis.cycleWageMultiplierBps,\n    );\n    const remainingCostMicros = usage.costMicros - firstCycleCostMicros;\n    settleProductionWage(\n      world,\n      player,\n      group,\n      groupBasis,\n      remainingCostMicros,\n      currentProductionWageMultiplier(world),\n    );\n    group.staffingBatchCarryBps = usage.finalCarryBps;",
          )

          replace_once(
              'server/src/leaderboards.js',
              "import { FACILITY_TYPE_CATALOG, PRODUCT_CATALOG } from './domain.js';",
              "import { FACILITY_TYPE_CATALOG, processWorld, PRODUCT_CATALOG } from './domain.js';",
          )
          replace_once(
              'server/src/leaderboards.js',
              "export function processLeaderboardWorld(world, now = Date.now(), options = {}) {\n  const migrate = options.migrate !== false;\n  world.players ||= {};",
              "export function processLeaderboardWorld(world, now = Date.now(), options = {}) {\n  const migrate = options.migrate !== false;\n  processWorld(world, now, { migrate: false });\n  world.players ||= {};",
          )

          replace_once(
              'server/src/facility-groups.js',
              "  return {\n    ...publicGroup,\n    staffingRateBps,\n    staffingUpdatedAt: Math.max(0, Number(now) || 0),",
              "  return {\n    ...publicGroup,\n    staffingRateBps,\n    staffingUpdatedAt: Math.max(0, Number(now) || 0),\n    productionSettlementStaffingRateBps: normalizeStaffingRate(group.staffingRateBps) ?? FACILITY_STAFFING_FULL_BPS,\n    productionSettlementStaffingUpdatedAt: Number.isFinite(Number(group.staffingUpdatedAt))\n      ? Math.max(0, Number(group.staffingUpdatedAt))\n      : Math.max(0, Number(now) || 0),",
          )

          replace_once(
              'src/types.ts',
              "  /** Server timestamp at which staffingRateBps was projected. */\n  staffingUpdatedAt?: number;\n  /** Fixed-point equivalent-capacity carry retained between completed cycles. */",
              "  /** Server timestamp at which staffingRateBps was projected. */\n  staffingUpdatedAt?: number;\n  /** Raw authoritative staffing rate used only to construct a production settlement proposal. */\n  productionSettlementStaffingRateBps?: number;\n  /** Raw authoritative staffing timestamp used only to construct a production settlement proposal. */\n  productionSettlementStaffingUpdatedAt?: number;\n  /** Fixed-point equivalent-capacity carry retained between completed cycles. */",
          )

          replace_once(
              'src/utils/productionSettlement.ts',
              "    staffingRateBps: nonNegativeInteger(group.staffingRateBps ?? 10_000),\n    staffingUpdatedAt: Number.isFinite(Number(group.staffingUpdatedAt)) ? Number(group.staffingUpdatedAt) : serverNow,",
              "    staffingRateBps: nonNegativeInteger(\n      group.productionSettlementStaffingRateBps ?? group.staffingRateBps ?? 10_000,\n    ),\n    staffingUpdatedAt: Number.isFinite(Number(group.productionSettlementStaffingUpdatedAt))\n      ? Number(group.productionSettlementStaffingUpdatedAt)\n      : Number.isFinite(Number(group.staffingUpdatedAt))\n        ? Number(group.staffingUpdatedAt)\n        : serverNow,",
          )
          replace_once(
              'src/utils/productionSettlement.ts',
              "    // Public state contains the server-time staffing projection. It is exact for the common full-staffing case;\n    // a resource-bound approximation mismatch is rejected and retried through the current-player server fallback.\n",
              "    // Settlement proposal math uses the raw authoritative staffing baseline while UI fields remain projected.\n",
          )

          test = Path('server/test/production-lazy-settlement.test.js')
          text = test.read_text()
          marker = "test('production wage settlement is batch invariant across an old first-cycle multiplier',"
          if marker not in text:
              insert = r'''

test('production wage settlement is batch invariant across an old first-cycle multiplier', () => {
  const combined = productionWorld();
  const split = productionWorld();
  for (const { world, player } of [combined, split]) {
    world.populationEconomy.policy.productionWageMultiplierBps = 10_000;
    player.facilityGroups[0].cycleWageMultiplierBps = 6_000;
  }

  const combinedThrough = now + 40_000;
  const combinedBasis = createProductionSettlementBasis(combined.world, user.id, combinedThrough);
  applyProductionSettlementClaim(
    combined.world,
    user.id,
    createProductionSettlementClaim(combinedBasis),
    combinedThrough,
  );

  const firstThrough = now + 20_000;
  const firstBasis = createProductionSettlementBasis(split.world, user.id, firstThrough);
  applyProductionSettlementClaim(
    split.world,
    user.id,
    createProductionSettlementClaim(firstBasis),
    firstThrough,
  );
  const secondBasis = createProductionSettlementBasis(split.world, user.id, combinedThrough);
  applyProductionSettlementClaim(
    split.world,
    user.id,
    createProductionSettlementClaim(secondBasis),
    combinedThrough,
  );

  assert.equal(combined.player.facilityGroups[0].productionEmploymentTotalMicros, '1600000');
  assert.equal(
    combined.player.facilityGroups[0].productionEmploymentTotalMicros,
    split.player.facilityGroups[0].productionEmploymentTotalMicros,
  );
  assert.deepEqual(
    combined.player.facilityGroups[0].productionEmploymentAllocatedMicros,
    split.player.facilityGroups[0].productionEmploymentAllocatedMicros,
  );
});
'''
              anchor = "\ntest('world deadline plan no longer schedules global facility catch-up'"
              if anchor not in text:
                  raise SystemExit('production test insertion anchor missing')
              text = text.replace(anchor, insert + anchor, 1)
              test.write_text(text)

          verifier = Path('scripts/verify-production-lazy-settlement.mjs')
          text = verifier.read_text()
          replace = "assert.match(clientSettlement, /createProductionSettlementClaim/, '浏览器必须从现有权威状态计算生产结算声明');"
          addition = replace + "\nassert.match(clientSettlement, /productionSettlementStaffingRateBps/, '客户端必须使用服务器原始 staffing 基线而不是 UI 投影值');\nassert.match(serverSettlement, /group\\.productionWageCarryNumerator === undefined/, '工资余数的合法 0 值不得被重新初始化');\nassert.match(serverSettlement, /firstCycleCostMicros/, '旧周期工资系数只能作用于首个欠结算周期');\nassert.match(leaderboard, /processWorld\\(world, now, \\{ migrate: false \\}\\);/, '排行榜推进必须显式保留通用市场与运输世界推进，不能依赖工厂扫描副作用');"
          if replace not in text:
              raise SystemExit('verifier anchor missing')
          verifier.write_text(text.replace(replace, addition, 1))
          PY

          git fetch origin main --depth=1
          git checkout origin/main -- .github/workflows/ci.yml
          git config user.name 'RIVERSOFT'
          git config user.email '105160096+RIVERS0FT@users.noreply.github.com'
          git add .github/workflows/ci.yml server/src/production-settlement.js server/src/leaderboards.js server/src/facility-groups.js server/test/production-lazy-settlement.test.js src/types.ts src/utils/productionSettlement.ts scripts/verify-production-lazy-settlement.mjs
          git diff --cached --check
          git commit -m 'preserve lazy production settlement precision'
          git push origin HEAD:agent/production-lazy-settlement

      - uses: actions/setup-node@v4
        with:
          node-version: 24.4.0
          cache: npm
      - run: npm ci
      - name: Focused verification
        run: |
          npm run verify:production-lazy-settlement
          node --test server/test/production-lazy-settlement.test.js
          npm run server:check
          npm run typecheck