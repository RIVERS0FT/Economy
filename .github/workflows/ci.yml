name: Economy CI

on:
  pull_request:
  push:
    branches-ignore:
      - main
  workflow_dispatch:

concurrency:
  group: economy-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  verify-head-ci-registration:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Verify head push CI registration
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.request

          token = os.environ['GH_TOKEN']
          head_sha = os.environ['HEAD_SHA']
          repository = os.environ['REPOSITORY']
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'X-GitHub-Api-Version': '2022-11-28',
          }

          runs = []
          for _ in range(12):
              url = f'https://api.github.com/repos/{repository}/actions/runs?head_sha={head_sha}&event=push&per_page=20'
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request) as response:
                  runs = json.load(response).get('workflow_runs', [])
              if runs:
                  break
              time.sleep(5)

          print(json.dumps({
              'head_sha': head_sha,
              'push_runs': [
                  {
                      'id': run['id'],
                      'run_number': run['run_number'],
                      'status': run['status'],
                      'conclusion': run['conclusion'],
                  }
                  for run in runs
              ],
          }, ensure_ascii=False, indent=2))
          if not runs:
              raise SystemExit('No push workflow run found for the pull request head SHA')
          PY

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply final transport type and design fixes
        if: github.event_name == 'push' && github.ref == 'refs/heads/feat/transport-routes-page'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              'src/api/game.ts': [
                  (
                      "  transportShip: (input: TransportRouteInput) => postAction('/transport', input),",
                      "  transportShip: (input: TransportRouteInput) => postAction('/transport', { ...input }),",
                  ),
              ],
              'docs/UI_DESIGN_SYSTEM.md': [
                  (
                      '| `src/styles/warehouse-expansion.css` | 州级可钻取仓库商品网格、独立跨州运输卡、地区商品详情自动交易控制、容器查询、紧凑商品卡和移动自动交易入口布局 |',
                      '| `src/styles/warehouse-expansion.css` | 州级可钻取仓库商品网格、地区商品详情自动交易控制、容器查询、紧凑商品卡和移动自动交易入口布局 |\n| `src/styles/transport-page.css` | 独立运输页的路线编辑、路线卡、在途／最近完成记录与响应式布局 |',
                  ),
              ],
          }

          changed = False
          for path, pairs in replacements.items():
              target = Path(path)
              text = target.read_text(encoding='utf-8')
              original = text
              for old, new in pairs:
                  if old in text:
                      if text.count(old) != 1:
                          raise SystemExit(f'{path}: replacement source is not unique')
                      text = text.replace(old, new, 1)
              if text != original:
                  target.write_text(text, encoding='utf-8')
                  changed = True
          if not changed:
              raise SystemExit('final transport fixes were already applied')
          PY
          git fetch --no-tags origin main:refs/remotes/origin/main
          git checkout origin/main -- .github/workflows/ci.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "修正运输 API 类型与样式职责文档"
          git push origin HEAD:feat/transport-routes-page

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.4.0
          cache: npm

      - name: Select changed-file CI scope
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          changed_files="$RUNNER_TEMP/economy-changed-files.txt"
          plan_file="$RUNNER_TEMP/economy-ci-plan.json"

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            : > "$changed_files"
            node scripts/select-ci-tests.mjs plan \
              --changed-files-file "$changed_files" \
              --plan-file "$plan_file" \
              --github-output "$GITHUB_OUTPUT" \
              --full
          elif [ "$EVENT_NAME" = "pull_request" ]; then
            git diff --check "$PR_BASE_SHA" "$PR_HEAD_SHA"
            git diff --name-only "$PR_BASE_SHA" "$PR_HEAD_SHA" > "$changed_files"
            node scripts/select-ci-tests.mjs plan \
              --changed-files-file "$changed_files" \
              --plan-file "$plan_file" \
              --github-output "$GITHUB_OUTPUT"
          else
            git fetch --no-tags origin main:refs/remotes/origin/main
            BASE_SHA="$(git merge-base origin/main "$GITHUB_SHA")"
            git diff --check "$BASE_SHA" "$GITHUB_SHA"
            git diff --name-only "$BASE_SHA" "$GITHUB_SHA" > "$changed_files"
            node scripts/select-ci-tests.mjs plan \
              --changed-files-file "$changed_files" \
              --plan-file "$plan_file" \
              --github-output "$GITHUB_OUTPUT"
          fi

          echo "ECONOMY_CI_CHANGED_FILES"
          cat "$changed_files"
          echo "ECONOMY_CI_PLAN"
          cat "$plan_file"

      - name: Install dependencies
        if: steps.scope.outputs.dependencies == 'true'
        run: npm ci

      - name: Build and test full fallback
        if: steps.scope.outputs.mode == 'full'
        shell: bash
        run: |
          set -o pipefail
          node scripts/verify-deployment-pipeline.mjs
          npm run build 2>&1 | tee build-test.log

      - name: Build and test selected changes
        if: steps.scope.outputs.mode == 'targeted'
        shell: bash
        run: |
          set -o pipefail
          node scripts/select-ci-tests.mjs run \
            --plan-file "$RUNNER_TEMP/economy-ci-plan.json" \
            --phase checks 2>&1 | tee build-test.log

      - name: Prepare Chromium
        if: steps.scope.outputs.browser == 'true'
        run: bash scripts/prepare-playwright-chromium.sh

      - name: Test browser runtime full fallback
        if: steps.scope.outputs.mode == 'full'
        shell: bash
        run: |
          set -o pipefail
          npm run test:browser 2>&1 | tee browser-test.log

      - name: Test browser runtime selected changes
        if: steps.scope.outputs.mode == 'targeted' && steps.scope.outputs.browser == 'true'
        shell: bash
        run: |
          set -o pipefail
          node scripts/select-ci-tests.mjs run \
            --plan-file "$RUNNER_TEMP/economy-ci-plan.json" \
            --phase browser 2>&1 | tee browser-test.log

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: economy-test-artifacts
          path: |
            build-test.log
            browser-test.log
            playwright-report
            test-results
          if-no-files-found: warn
          retention-days: 3
