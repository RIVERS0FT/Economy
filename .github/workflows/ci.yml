name: Diagnose gameplay apply

on:
  pull_request:

concurrency:
  group: diagnose-gameplay-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/contract-renewal-economic-calendar'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply and preserve diagnostics
        shell: bash
        run: |
          set -euo pipefail
          cat .agent/apply-part-* | base64 -d | gzip -d > /tmp/apply.py
          python3 .agent/fix.py
          python3 -m py_compile /tmp/apply.py
          set +e
          python3 /tmp/apply.py > /tmp/apply.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            cp /tmp/apply.log .agent/apply-failure.log
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add .agent/apply-failure.log
            if ! git diff --cached --quiet; then
              git commit -m '记录功能应用失败原因 [diagnostic]'
              git push origin HEAD:${{ github.head_ref }}
            fi
            cat /tmp/apply.log
            exit "$status"
          fi
          rm -rf .agent
          rm -f .github/workflows/apply-contract-renewal-economic-calendar.yml
          git fetch origin main
          git checkout origin/main -- .github/workflows/ci.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m '增加合同续签与公开经济事件日历 [applied]'
          git push origin HEAD:${{ github.head_ref }}
