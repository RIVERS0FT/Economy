name: Economy CI

on:
  pull_request:
  push:
    branches-ignore:
      - main
  workflow_dispatch:

concurrency:
  group: economy-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  verify-head-ci-registration:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Verify head push CI registration
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request
          token = os.environ['GH_TOKEN']
          head_sha = os.environ['HEAD_SHA']
          repository = os.environ['REPOSITORY']
          headers = {'Accept':'application/vnd.github+json','Authorization':f'Bearer {token}','X-GitHub-Api-Version':'2022-11-28'}
          runs=[]
          for _ in range(12):
              request=urllib.request.Request(f'https://api.github.com/repos/{repository}/actions/runs?head_sha={head_sha}&event=push&per_page=20',headers=headers)
              with urllib.request.urlopen(request) as response: runs=json.load(response).get('workflow_runs',[])
              if runs: break
              time.sleep(5)
          if not runs: raise SystemExit('No push workflow run found for the pull request head SHA')
          PY

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore leaderboard migration ordering
        if: github.event_name == 'push' && github.ref_name == 'agent/production-lazy-settlement'
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('server/src/leaderboards.js')
          text = p.read_text()
          old = "function processWorldAt(world, now, priorOrderReferences = [], { migrate = true } = {}) {\n  processAssetAuctions(world, now, { migrate });"
          new = "function processWorldAt(world, now, priorOrderReferences = [], { migrate = true } = {}) {\n  processWorld(world, now, { migrate: false });\n  processAssetAuctions(world, now, { migrate });"
          if old not in text: raise SystemExit('processWorldAt anchor missing')
          text = text.replace(old, new, 1)
          old = "export function processLeaderboardWorld(world, now = Date.now(), options = {}) {\n  const migrate = options.migrate !== false;\n  processWorld(world, now, { migrate: false });\n  world.players ||= {};"
          new = "export function processLeaderboardWorld(world, now = Date.now(), options = {}) {\n  const migrate = options.migrate !== false;\n  world.players ||= {};"
          if old not in text: raise SystemExit('leaderboard top anchor missing')
          text = text.replace(old, new, 1)
          old = "  if (!validLeaderboardState(world.leaderboardState)) {\n    processAssetAuctions(world, now, { migrate });"
          new = "  if (!validLeaderboardState(world.leaderboardState)) {\n    processWorld(world, now, { migrate: false });\n    processAssetAuctions(world, now, { migrate });"
          if old not in text: raise SystemExit('leaderboard initialize anchor missing')
          p.write_text(text.replace(old, new, 1))

          v = Path('scripts/verify-production-lazy-settlement.mjs')
          text = v.read_text()
          old = "assert.match(\n  leaderboard,\n  /processWorld\\(world, now, \\{ migrate: false \\}\\);/,\n  '排行榜推进必须显式保留通用市场与运输世界推进，不能依赖工厂扫描副作用',\n);"
          new = "assert.match(\n  leaderboard,\n  /function processWorldAt[\\s\\S]*?processWorld\\(world, now, \\{ migrate: false \\}\\);/,\n  '排行榜周期推进必须在规则迁移之后显式推进通用市场与运输逻辑',\n);\nassert.match(\n  leaderboard,\n  /if \\(!validLeaderboardState\\(world\\.leaderboardState\\)\\) \\{\\s*processWorld\\(world, now, \\{ migrate: false \\}\\);/,\n  '首次排行榜初始化仍必须推进通用市场与运输逻辑',\n);"
          if old not in text: raise SystemExit('verifier ordering anchor missing')
          v.write_text(text.replace(old, new, 1))
          PY

          git fetch origin main --depth=1
          git checkout origin/main -- .github/workflows/ci.yml
          git config user.name 'RIVERSOFT'
          git config user.email '105160096+RIVERS0FT@users.noreply.github.com'
          git add .github/workflows/ci.yml server/src/leaderboards.js scripts/verify-production-lazy-settlement.mjs
          git diff --cached --check
          git commit -m 'preserve leaderboard migration before world processing'
          git push origin HEAD:agent/production-lazy-settlement

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.4.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Focused verification
        run: |
          npm run verify:production-lazy-settlement
          node --test server/test/leaderboards.test.js server/test/state-polling.test.js server/test/world-deadline-planner.test.js
