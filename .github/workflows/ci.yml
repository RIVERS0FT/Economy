name: Prepare Economy governance change

on:
  push:
    branches:
      - chore/project-rules-ci-cleanup

concurrency:
  group: prepare-economy-governance
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.4.0
      - name: Apply scoped changes
        run: python3 .github/prepare-governance.py
      - name: Validate governance behavior and patch
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          node scripts/verify-document-authority.mjs
          node scripts/verify-deployment-pipeline.mjs
          node --experimental-strip-types --test tests/dt/project-governance.test.ts
          node scripts/verify-repository-text-format.mjs
      - name: Create reviewable commit without updating any branch
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const cp = require('node:child_process');
            const paths = cp.execFileSync('git', ['diff', '--cached', '--name-only', '-z'], {encoding: 'utf8'}).split('\0').filter(Boolean);
            const {owner, repo} = context.repo;
            const parent = await github.rest.git.getCommit({owner, repo, commit_sha: context.sha});
            const entries = paths.map(path => fs.existsSync(path)
              ? {path, mode: '100644', type: 'blob', content: fs.readFileSync(path, 'utf8')}
              : {path, mode: '100644', type: 'blob', sha: null});
            const tree = await github.rest.git.createTree({owner, repo, base_tree: parent.data.tree.sha, tree: entries});
            const commit = await github.rest.git.createCommit({owner, repo, tree: tree.data.sha, parents: [context.sha], message: '清理项目规则、文档门禁与 CI 重复验证'});
            core.info('ECONOMY_PREPARED_COMMIT=' + commit.data.sha);
            await core.summary.addHeading('Prepared governance change').addRaw(commit.data.sha).addList(paths).write();
      - name: Save review patch
        if: always()
        run: git diff 53a8561de91610829e8337db9896655fdb60ba27 --binary > "$RUNNER_TEMP/economy-governance.patch"
      - name: Upload review patch
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: economy-governance-review-${{ github.run_id }}
          path: ${{ runner.temp }}/economy-governance.patch
          retention-days: 1
