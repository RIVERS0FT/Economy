name: Economy CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: economy-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: agent/market-tooltip-persistence
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.4.0
          cache: npm

      - name: Apply tooltip persistence changes
        run: |
          python3 scripts/apply-market-tooltip-persistence.py
          python3 scripts/apply-market-tooltip-persistence-fix.py

      - name: Install dependencies
        run: npm ci

      - name: Verify market chart
        run: node --experimental-strip-types scripts/verify-market-chart.mjs

      - name: Build and test
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build-test.log

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Test browser runtime
        shell: bash
        run: |
          set -o pipefail
          npm run test:browser 2>&1 | tee browser-test.log

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: market-tooltip-persistence-artifacts
          path: |
            build-test.log
            browser-test.log
            playwright-report
            test-results
          if-no-files-found: warn
          retention-days: 3

      - name: Commit verified implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/components/charts/EconomyChart.tsx \
            src/components/charts/PriceSparkline.tsx \
            docs/MARKET_CHART_LAYOUT_DESIGN.md \
            scripts/verify-market-chart.mjs \
            market-tooltip-persistence-test.html \
            tests/browser/market-tooltip-persistence-harness.tsx \
            tests/browser/market-tooltip-persistence.spec.ts
          git diff --cached --check
          git commit -m "保持市场图静止悬浮状态"
          git push origin HEAD:agent/market-tooltip-persistence
