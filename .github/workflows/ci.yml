name: Economy CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: economy-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  fix:
    if: github.event_name == 'pull_request' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Align auction checks with authority documents
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/verify-asset-auctions.mjs')
          text = path.read_text(encoding='utf-8')

          replacements = {
              "['docs/INDUSTRY_AND_PRODUCTION_DESIGN.md', ['商品／工厂单项或捆绑资产包拍卖', '冻结数量退出生产']]":
                  "['docs/INDUSTRY_AND_PRODUCTION_DESIGN.md', ['工厂订单与拍卖冻结', '整包任一项目异常时不得部分转移工厂']]",
              "['docs/UI_DESIGN_SYSTEM.md', ['商品／工厂资产拍卖', '统一商品 SVG 与工厂图标']]":
                  "['docs/UI_DESIGN_SYSTEM.md', ['拍卖页只允许商品和工厂', '商品必须使用 `ProductIcon`', '工厂必须使用 `FactoryIcon`']]",
              "forbidText('docs/PAGE_CONTENT_AND_NAVIGATION_DESIGN.md', ['藏品页', 'collections']);":
                  "forbidText('docs/PAGE_CONTENT_AND_NAVIGATION_DESIGN.md', ['藏品页']);",
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise RuntimeError(f'asset auction authority check target is not unique: {old}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY

          git fetch origin main
          git checkout origin/main -- .github/workflows/ci.yml

      - name: Commit authority-check correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/verify-asset-auctions.mjs .github/workflows/ci.yml
          git diff --cached --check
          git commit -m '修正资产拍卖文档验证口径'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
