name: Economy CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-approved-performance-phase-5:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'perf/phase-write-executor'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/phase-write-executor
          fetch-depth: 0
      - name: Apply approved bounded write executor patch
        shell: bash
        run: |
          set -euo pipefail
          cat .performance-phase-5-part01 .performance-phase-5-part02 \
            | base64 -d | gzip -d > /tmp/performance-phase-5.patch
          printf '%s  %s\n' '67b1bc45bb9c50fddbb4d2e8b6db6a27cc50cc2df6d66845ef9dd595b0fc4e5d' /tmp/performance-phase-5.patch | sha256sum --check
          git apply --check /tmp/performance-phase-5.patch
          git apply /tmp/performance-phase-5.patch
          git checkout origin/main -- .github/workflows/ci.yml
          rm -f -- .performance-phase-5-part01 .performance-phase-5-part02
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- \
            docs/README.md \
            docs/SERVER_ARCHITECTURE_AND_DEPLOYMENT_DESIGN.md \
            scripts/verify-runtime-efficiency.mjs \
            server/src/admin-summary.js \
            server/src/app.js \
            server/src/registration.js \
            server/src/storage.js \
            server/src/authoritative-write-executor.js \
            server/test/authoritative-write-executor.test.js \
            server/test/registration.test.js \
            .github/workflows/ci.yml \
            .performance-phase-5-part01 \
            .performance-phase-5-part02
          git commit -m "perf: serialize authoritative writes through bounded executor"
          git push origin HEAD:perf/phase-write-executor
