name: Economy CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: economy-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.4.0
          cache: npm

      - name: Apply approved unified atmosphere change
        if: github.event_name == 'pull_request' && hashFiles('scripts/apply-unified-atmosphere.mjs') != ''
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git checkout "$BASE_SHA" -- \
            src/styles/financial-backdrop.css \
            docs/REGISTRATION_INVITE_FLOW_DESIGN.md \
            docs/LIQUID_GLASS_CHROME_DESIGN.md \
            scripts/verify-game-three-layer.mjs
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/apply-unified-atmosphere.mjs')
          source = path.read_text()
          source = source.replace(
              "const verificationMarker = '\\nif (failures.length > 0) {';",
              "const verificationMarker = '\\nif (failures.length) {';",
          )
          source = source.replace(
              "let registration = read(registrationPath);",
              "let registration = read(registrationPath);\nregistration = registration.replace('> 更新时间：2026-07-31', '> 更新时间：2026-08-02');",
          )
          source = source.replace(
              "let chrome = read(chromePath);",
              "let chrome = read(chromePath);\nchrome = chrome.replace('> 更新时间：2026-08-01', '> 更新时间：2026-08-02');",
          )
          path.write_text(source)
          PY
          node scripts/apply-unified-atmosphere.mjs
          python - <<'PY'
          from pathlib import Path
          path = Path('docs/REGISTRATION_INVITE_FLOW_DESIGN.md')
          source = path.read_text()
          old = '''2. 氛围层由根级 `.application-atmosphere-layer` 承载。`data-app-backdrop` 只负责认证／玩家／管理员三种图片滤镜与氛围选择，`data-app-tone` 只负责普通或 critical 警示暗角；对应选择器为 `html[data-app-backdrop="auth"|"game"|"admin"]` 与 `html[data-app-tone="normal"|"critical"]`。玩家和管理员变体必须比登录变体更暗，管理员变体还必须比玩家变体更均匀，确保密集表格、表单和运营数据保持稳定对比度。`html[data-app-surface="auth"|"game"|"admin"|"loading"|"banned"|"error"] body::before` 必须关闭，网格只能存在于氛围层，避免形成第四个全局背景层。封禁、无权限和致命错误不得替换为纯色页面或另一张图片。桌面登录氛围保持原有横向明暗分布；移动登录氛围层必须比原基线更透明，纵向主遮罩固定使用 `rgba(1, 7, 4, 0.62)`、`rgba(2, 10, 6, 0.6)`、`rgba(2, 8, 5, 0.82)`，网格与噪点透明度分别为 `0.12` 和 `0.05`，不得恢复 `0.78`／`0.76`／`0.93` 的过暗遮罩。'''
          new = '''2. 氛围层由根级 `.application-atmosphere-layer` 承载。`data-app-backdrop` 只保留认证／玩家／管理员语义和状态路由职责，`data-app-tone` 只负责普通或 critical 警示暗角；对应选择器为 `html[data-app-backdrop="auth"|"game"|"admin"]` 与 `html[data-app-tone="normal"|"critical"]`。认证、九个玩家页面、管理员五个分区及根级普通状态必须使用完全相同的正常态视觉参数，并以登录／注册页当前样式为唯一基线：桌面图片滤镜固定为 `saturate(0.72) contrast(1.08) brightness(0.72)`，桌面渐变固定复用登录页横向明暗分布，网格与噪点透明度固定为 `0.24` 和 `0.075`；移动图片滤镜固定为 `saturate(0.68) contrast(1.08) brightness(0.62)`，纵向主遮罩固定使用 `rgba(1, 7, 4, 0.62)`、`rgba(2, 10, 6, 0.6)`、`rgba(2, 8, 5, 0.82)`，网格与噪点透明度固定为 `0.12` 和 `0.05`。`auth`、`game`、`admin` 不得再拥有角色级或页面级图片滤镜、渐变、网格或噪点覆盖；仅 `html[data-app-tone="critical"]` 可以在共享基线之上增加红色内暗角，且不得改变共享参数。`html[data-app-surface="auth"|"game"|"admin"|"loading"|"banned"|"error"] body::before` 必须关闭，网格只能存在于氛围层，避免形成第四个全局背景层。封禁、无权限和致命错误不得替换为纯色页面或另一张图片。'''
          if old not in source:
              raise SystemExit('authoritative atmosphere paragraph not found')
          source = source.replace(old, new)
          source = source.replace('该文件同时负责三种根级氛围、critical 暗角', '该文件同时负责三种语义变体共享的唯一正常态氛围、critical 暗角')
          source = source.replace('三种氛围变体、根级加载／封禁／无权限／错误状态', '三种语义变体共享登录页正常态氛围基线、根级加载／封禁／无权限／错误状态')
          source = source.replace(
              '`tests/browser/application-photography.spec.ts` 必须用 DOM 标记验证账号检查切换到认证后仍是同一图片节点，并覆盖管理员、封禁、无权限与摄影失败回退。',
              '`tests/browser/application-photography.spec.ts` 必须用 DOM 标记验证账号检查切换到认证后仍是同一图片节点，并覆盖管理员、封禁、无权限与摄影失败回退；`tests/browser/application-atmosphere-consistency.spec.ts` 必须分别在桌面与移动视口比较 `auth`、`game`、`admin` 的图片滤镜、渐变、网格和噪点计算样式完全相同。',
          )
          path.write_text(source)
          PY
          rm -f .github/workflows/apply-unified-atmosphere.yml scripts/apply-unified-atmosphere.mjs

      - name: Install dependencies
        run: npm ci

      - name: Build and test
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build-test.log

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Test browser runtime
        shell: bash
        run: |
          set -o pipefail
          npm run test:browser 2>&1 | tee browser-test.log

      - name: Check patch cleanliness
        if: github.event_name == 'pull_request' && hashFiles('tests/browser/application-atmosphere-consistency.spec.ts') != ''
        run: git diff --check

      - name: Commit verified change
        if: github.event_name == 'pull_request' && hashFiles('tests/browser/application-atmosphere-consistency.spec.ts') != ''
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          git checkout "$BASE_SHA" -- .github/workflows/ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            .github/workflows/ci.yml \
            .github/workflows/apply-unified-atmosphere.yml \
            scripts/apply-unified-atmosphere.mjs \
            src/styles/financial-backdrop.css \
            docs/REGISTRATION_INVITE_FLOW_DESIGN.md \
            docs/LIQUID_GLASS_CHROME_DESIGN.md \
            scripts/verify-game-three-layer.mjs \
            tests/browser/application-atmosphere-consistency.spec.ts
          git commit -m "统一全应用摄影氛围"
          git push origin HEAD:"$HEAD_BRANCH"

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: economy-test-artifacts
          path: |
            build-test.log
            browser-test.log
            playwright-report
            test-results
          if-no-files-found: warn
          retention-days: 3
