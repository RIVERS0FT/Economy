name: Prepare Economy governance change

on:
  push:
    branches:
      - chore/project-rules-ci-cleanup

concurrency:
  group: prepare-economy-governance
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.4.0
      - name: Apply scoped changes
        run: |
          python3 .github/prepare-governance.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/deploy.yml')
          text = path.read_text()
          anchor = '      - name: Download validated website\n'
          assert text.count(anchor) == 1
          path.write_text(text.replace(anchor, anchor + "        if: needs.build.outputs.artifact_id != ''\n"))
          PY
      - name: Validate governance behavior and patch
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          node scripts/verify-document-authority.mjs
          node scripts/verify-deployment-pipeline.mjs
          node --experimental-strip-types --test tests/dt/project-governance.test.ts
          node scripts/verify-repository-text-format.mjs
      - name: Store validated file objects for connector review
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const cp = require('node:child_process');
            const paths = cp.execFileSync('git', ['diff', '--cached', '--name-only', '-z'], {encoding: 'utf8'}).split('\0').filter(Boolean);
            const {owner, repo} = context.repo;
            const parent = await github.rest.git.getCommit({owner, repo, commit_sha: context.sha});
            const entries = [];
            for (const path of paths) {
              let sha = null;
              if (fs.existsSync(path)) {
                const blob = await github.rest.git.createBlob({owner, repo, content: fs.readFileSync(path).toString('base64'), encoding: 'base64'});
                sha = blob.data.sha;
              }
              entries.push({path, mode: '100644', type: 'blob', sha});
            }
            core.info('ECONOMY_PREPARED_TREE=' + JSON.stringify({parent: context.sha, base_tree: parent.data.tree.sha, entries}));
            await core.summary.addHeading('Validated file objects').addCodeBlock(JSON.stringify(entries, null, 2)).write();
      - name: Save review patch
        if: always()
        run: git diff 53a8561de91610829e8337db9896655fdb60ba27 --binary > "$RUNNER_TEMP/economy-governance.patch"
      - name: Upload review patch
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: economy-governance-review-${{ github.run_id }}
          path: ${{ runner.temp }}/economy-governance.patch
          retention-days: 1
