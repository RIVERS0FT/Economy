name: Economy CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: economy-ci-fix-${{ github.run_id }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/factory-staffing-rate
          fetch-depth: 0

      - name: Apply exact zero-capacity fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('server/src/facility-groups.js')
          text = path.read_text()
          old = '    Math.max(1, capacity.effectiveCount),\n'
          new = '    capacity.effectiveCount,\n'
          count = text.count(old)
          if count == 1:
              path.write_text(text.replace(old, new, 1))
          elif text.count(new) < 3:
              raise SystemExit(f'zero-capacity fix site invalid: old={count}, new={text.count(new)}')
          PY
          git diff --check

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.4.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and test
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build-test.log

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Test browser runtime
        shell: bash
        run: |
          set -o pipefail
          npm run test:browser 2>&1 | tee browser-test.log

      - name: Commit verified source fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'OpenAI Agent'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/src/facility-groups.js
          git diff --cached --check
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m '允许零等效产能周期正常运行'
          git push origin HEAD:agent/factory-staffing-rate

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: economy-test-artifacts
          path: |
            build-test.log
            browser-test.log
            playwright-report
            test-results
          if-no-files-found: warn
          retention-days: 3
