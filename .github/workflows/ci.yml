name: Economy CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-approved-performance-phase-4:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'perf/phase-order-history'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/phase-order-history
          fetch-depth: 0
      - name: Apply approved order-history patch
        shell: bash
        run: |
          set -euo pipefail
          cat .performance-phase-4-part01 .performance-phase-4-part02 .performance-phase-4-part03 \
            | base64 -d | gzip -d > /tmp/performance-phase-4.patch
          git apply --check /tmp/performance-phase-4.patch
          git apply /tmp/performance-phase-4.patch
          git checkout origin/main -- .github/workflows/ci.yml
          rm -f -- .performance-phase-4-part01 .performance-phase-4-part02 .performance-phase-4-part03
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- \
            docs/LOCAL_ACTIVITY_LOG_DESIGN.md \
            docs/README.md \
            docs/SERVER_ARCHITECTURE_AND_DEPLOYMENT_DESIGN.md \
            scripts/verify-local-trade-privacy.mjs \
            scripts/verify-runtime-efficiency.mjs \
            server/src/app.js \
            server/src/facility-groups.js \
            server/src/runtime-store.js \
            server/test/order-history.test.js \
            .github/workflows/ci.yml \
            .performance-phase-4-part01 \
            .performance-phase-4-part02 \
            .performance-phase-4-part03
          git commit -m "perf: move closed order history out of main state"
          git push origin HEAD:perf/phase-order-history
