name: Economy CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: economy-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.4.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and test
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build-test.log

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Test browser runtime
        shell: bash
        run: |
          set -o pipefail
          npm run test:browser 2>&1 | tee browser-test.log

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: economy-test-artifacts
          path: |
            build-test.log
            browser-test.log
            playwright-report
            test-results
          if-no-files-found: warn
          retention-days: 3

  finalize:
    if: github.event_name == 'pull_request' && github.head_ref == 'fix/mobile-facility-sheet-full-width'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/mobile-facility-sheet-full-width
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.4.0
          cache: npm

      - name: Apply authority and verifier updates
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one replacement, found {count}')
              file.write_text(text.replace(old, new, 1), encoding='utf-8')

          design_bullet = '- 移动工厂详情必须 Portal 到 `SignedInShell` 的根级业务 Dialog 层，遮罩覆盖完整视口并位于移动状态栏与底部导航之上；不得退回只覆盖两者之间的 `.workspace-floating-layer`。详情内 `RichSelectInput` 的列表继续 Portal 到同一个根层，并以更高层级显示在 Sheet 与遮罩之上。'
          replace_once(
              'docs/INDUSTRY_AND_PRODUCTION_DESIGN.md',
              design_bullet,
              design_bullet + '\n- 根级遮罩必须显式使用单列 `minmax(0, 1fr)` Grid 并在横向拉伸；Bottom Sheet 左边缘固定为视口 `x = 0`，宽度等于当前视觉视口，在 `320px–720px` 内不得受工作区 gutter、内容固有宽度、遗留 `justify-content: center` 或最大内容轨道影响而居中缩窄。',
          )

          verifier = Path('scripts/verify-unified-factory-recipes-grid.mjs')
          text = verifier.read_text(encoding='utf-8')
          sheet_marker = "  '.workspace-dialog-layer > .facility-detail-sheet-backdrop',\n"
          browser_marker = "  'expect(navigationCovered).toBe(true)',\n"
          design_marker = "  '移动工厂详情必须 Portal 到 `SignedInShell` 的根级业务 Dialog 层',\n"
          for marker in [sheet_marker, browser_marker, design_marker]:
              if text.count(marker) != 1:
                  raise SystemExit(f'verifier marker count mismatch: {marker!r}')
          text = text.replace(
              sheet_marker,
              sheet_marker
              + "  'grid-template-columns: minmax(0, 1fr);',\n"
              + "  'justify-content: stretch;',\n"
              + "  'justify-items: stretch;',\n"
              + "  'justify-self: stretch;',\n",
              1,
          )
          text = text.replace(
              browser_marker,
              browser_marker
              + "  'for (const width of [320, 390, 430, 720])',\n"
              + "  'expect(sheetBox.x).toBeCloseTo(0, 1)',\n"
              + "  'expect(sheetBox.width).toBeCloseTo(width, 1)',\n"
              + '  "expect(alignment.justifyContent).toBe(\'stretch\')",\n',
              1,
          )
          text = text.replace(
              design_marker,
              design_marker + "  'Bottom Sheet 左边缘固定为视口 `x = 0`',\n",
              1,
          )
          verifier.write_text(text, encoding='utf-8')
          PY

          git fetch origin main
          git checkout origin/main -- .github/workflows/ci.yml
          rm -f .github/workflows/fix-mobile-facility-sheet-width.yml
          rm -f .agent-mobile-facility-sheet-trigger
          git add -A
          git diff --cached --check

      - name: Install dependencies
        run: npm ci

      - name: Verify final source
        run: |
          node scripts/verify-unified-factory-recipes-grid.mjs
          npm run build

      - name: Commit clean verified change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "修复移动工厂详情全宽布局"
          git push origin HEAD:fix/mobile-facility-sheet-full-width
