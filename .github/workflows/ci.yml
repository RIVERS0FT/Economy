name: Economy CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: economy-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  fix:
    if: github.event_name == 'pull_request' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.4.0

      - name: Move auction verification to reservation module
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/verify-asset-auctions.mjs')
          text = path.read_text(encoding='utf-8')

          old_files = "  'server/src/warehouse.js',\n  'server/src/storage.js',"
          new_files = "  'server/src/warehouse.js',\n  'server/src/warehouse-reservations.js',\n  'server/src/storage.js',"
          if text.count(old_files) != 1:
              raise RuntimeError('asset auction required-file list target is not unique')
          text = text.replace(old_files, new_files, 1)

          old_rule = "requireText('server/src/warehouse.js', ['world?.assetAuctions']);"
          new_rule = """requireText('server/src/warehouse.js', [
            "from './warehouse-reservations.js'",
            'nonContractWarehouseReservation',
          ]);
          requireText('server/src/warehouse-reservations.js', [
            "import { pendingCommodityBuyQuantityForOwner } from './order-book-runtime.js';",
            'world?.assetAuctions',
            'auction?.highestBidderId',
          ]);"""
          if text.count(old_rule) != 1:
              raise RuntimeError('legacy warehouse auction verification target is not unique')
          path.write_text(text.replace(old_rule, new_rule, 1), encoding='utf-8')
          PY

          node scripts/verify-asset-auctions.mjs
          git fetch origin main
          git checkout origin/main -- .github/workflows/ci.yml

      - name: Commit static verification correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/verify-asset-auctions.mjs .github/workflows/ci.yml
          git diff --cached --check
          git commit -m '修正统一仓库预占拍卖验证归属'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
