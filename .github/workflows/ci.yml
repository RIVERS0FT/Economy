name: Economy CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: economy-live-staffing-apply-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apply-live-staffing:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/live-staffing-settlement
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.4.0
          cache: npm

      - name: Validate migration helpers
        run: |
          node --check scripts/prepare-live-staffing-helper.mjs
          node --check scripts/apply-live-staffing-settlement.mjs
          node --check scripts/apply-live-staffing-settlement-v2.mjs
          node --check scripts/apply-live-staffing-settlement-v3.mjs
          node --check scripts/apply-live-staffing-settlement-v4.mjs

      - name: Apply migration
        run: |
          node scripts/prepare-live-staffing-helper.mjs
          node scripts/apply-live-staffing-settlement.mjs
          node scripts/apply-live-staffing-settlement-v2.mjs
          node scripts/apply-live-staffing-settlement-v3.mjs
          node scripts/apply-live-staffing-settlement-v4.mjs

      - name: Stage removed helpers for repository validation
        run: |
          git add -u -- \
            scripts/prepare-live-staffing-helper.mjs \
            scripts/apply-live-staffing-settlement.mjs \
            scripts/apply-live-staffing-settlement-v2.mjs \
            scripts/apply-live-staffing-settlement-v3.mjs \
            scripts/apply-live-staffing-settlement-v4.mjs \
            .github/workflows/apply-live-staffing-settlement.yml

      - name: Restore formal CI workflow before validation
        run: git checkout origin/main -- .github/workflows/ci.yml

      - name: Install dependencies
        run: npm ci

      - name: Build and test
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build-test.log

      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            server/shared/economy-state-version.js \
            server/src/facility-groups.js \
            server/test \
            src \
            docs \
            scripts \
            tests/browser \
            .github/workflows/ci.yml \
            .github/workflows/apply-live-staffing-settlement.yml
          git diff --cached --check
          git commit -m "feat: 按周期完成时满员率结算并重排工厂详情"
          git push origin HEAD:feat/live-staffing-settlement

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: live-staffing-apply-failure
          path: build-test.log
          if-no-files-found: warn
          retention-days: 3
