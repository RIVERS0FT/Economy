name: Economy CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  apply-approved-performance-phase-3:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'perf/phase-partition-cache'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/phase-partition-cache
          fetch-depth: 0
      - name: Apply approved partition-cache patch and dispatch final CI
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          cat .performance-phase-3-part-* > /tmp/performance.patch.gz.b64
          base64 -d /tmp/performance.patch.gz.b64 | gzip -d > /tmp/performance.patch
          git apply --check /tmp/performance.patch
          git apply /tmp/performance.patch
          git checkout origin/main -- .github/workflows/ci.yml
          rm -f -- .performance-phase-3-part-00 .performance-phase-3-part-01
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- \
            docs/README.md \
            docs/SERVER_ARCHITECTURE_AND_DEPLOYMENT_DESIGN.md \
            scripts/verify-runtime-efficiency.mjs \
            server/src/runtime-store.js \
            server/src/state-partitions.js \
            server/src/storage.js \
            server/test/state-partitions.test.js \
            server/test/state-projection-cache.test.js \
            .github/workflows/ci.yml \
            .performance-phase-3-part-00 \
            .performance-phase-3-part-01
          git commit -m "perf: cache final state partitions"
          git push origin HEAD:perf/phase-partition-cache
          python3 - <<'PY' > /tmp/dispatch.json
          import json
          print(json.dumps({'ref': 'perf/phase-partition-cache'}))
          PY
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data-binary @/tmp/dispatch.json \
            "https://api.github.com/repos/$REPOSITORY/actions/workflows/ci.yml/dispatches"
