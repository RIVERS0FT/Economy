name: Economy CI

on:
  pull_request:
  push:
    branches-ignore:
      - main
  workflow_dispatch:

concurrency:
  group: economy-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  verify-head-ci-registration:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Verify head push CI registration
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.request

          token = os.environ['GH_TOKEN']
          head_sha = os.environ['HEAD_SHA']
          repository = os.environ['REPOSITORY']
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'X-GitHub-Api-Version': '2022-11-28',
          }

          runs = []
          for _ in range(12):
              url = f'https://api.github.com/repos/{repository}/actions/runs?head_sha={head_sha}&event=push&per_page=20'
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request) as response:
                  runs = json.load(response).get('workflow_runs', [])
              if runs:
                  break
              time.sleep(5)

          print(json.dumps({
              'head_sha': head_sha,
              'push_runs': [
                  {
                      'id': run['id'],
                      'run_number': run['run_number'],
                      'status': run['status'],
                      'conclusion': run['conclusion'],
                  }
                  for run in runs
              ],
          }, ensure_ascii=False, indent=2))
          if not runs:
              raise SystemExit('No push workflow run found for the pull request head SHA')
          PY

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair market processing after facility decoupling
        if: github.event_name == 'push' && github.ref_name == 'agent/production-lazy-settlement'
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  raise SystemExit(f'missing repair anchor in {path}: {old[:120]!r}')
              file.write_text(text.replace(old, new, 1))

          replace_once(
              'server/src/runtime-store-core.js',
              "import { ensurePlayer } from './domain.js';",
              "import { ensurePlayer, processWorld } from './domain.js';",
          )
          replace_once(
              'server/src/runtime-store-core.js',
              "      if (dueDomains.has('market')) {\n        const beforeReserveContracts = contractSnapshot(world);",
              "      if (dueDomains.has('market')) {\n        processWorld(world, now, { migrate: false });\n        const beforeReserveContracts = contractSnapshot(world);",
          )
          replace_once(
              'server/test/production-lazy-settlement.test.js',
              "  assert.equal(player.facilityGroups[0].status, 'error');\n  assert.equal(player.facilityGroups[0].statusReason, 'insufficient_funds');",
              "  assert.equal(player.facilityGroups[0].lifetimeOutput, 3);\n  assert.equal(player.facilityGroups[0].cycleStartedAt >= now + 60_000, true);",
          )
          PY
          git fetch origin main --depth=1
          git checkout origin/main -- .github/workflows/ci.yml
          git config user.name 'RIVERSOFT'
          git config user.email '105160096+RIVERS0FT@users.noreply.github.com'
          git add .github/workflows/ci.yml server/src/runtime-store-core.js server/test/production-lazy-settlement.test.js
          git diff --cached --check
          git commit -m 'restore market processing after facility decoupling'
          git push origin HEAD:agent/production-lazy-settlement

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.4.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and test
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build-test.log

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Test browser runtime
        shell: bash
        run: |
          set -o pipefail
          npm run test:browser 2>&1 | tee browser-test.log

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: economy-test-artifacts
          path: |
            build-test.log
            browser-test.log
            playwright-report
            test-results
          if-no-files-found: warn
          retention-days: 3
