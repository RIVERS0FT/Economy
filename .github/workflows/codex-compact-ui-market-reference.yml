name: Compact UI market design reference

on:
  push:
    branches:
      - codex/daily-system-market

permissions:
  contents: write

jobs:
  compact:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: node scripts/codex-compact-ui-market-reference.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "压缩 UI 市场业务设计引用"
          git push origin HEAD:codex/daily-system-market
