name: Apply facility auto-procure patch

on:
  push:
    branches:
      - feat/facility-auto-procure
    paths:
      - .agent/fix_facility_auto_procure_tests.py
      - .github/workflows/apply-facility-auto-procure.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply scoped changes
        run: python3 .agent/fix_facility_auto_procure_tests.py
      - name: Check whitespace
        run: git diff --check
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- server/test/instant-facility-construction.test.js
          git commit -m "Harden facility procurement market tests"
          git push origin HEAD:feat/facility-auto-procure
