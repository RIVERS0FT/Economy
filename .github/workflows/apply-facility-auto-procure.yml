name: Apply facility auto-procure patch

on:
  push:
    branches:
      - feat/facility-auto-procure
    paths:
      - .agent/apply_facility_auto_procure.py
      - .github/workflows/apply-facility-auto-procure.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply scoped changes
        run: python3 .agent/apply_facility_auto_procure.py
      - name: Check whitespace
        run: git diff --check
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            server/src/domain.js \
            server/src/facility-auto-procure.js \
            server/src/runtime-action-executor.js \
            src/api/game.ts \
            src/app/gameViewModel.ts \
            src/app/GameApp.tsx \
            src/pages/ProductionPage.tsx \
            src/utils/facilityBuildProcurement.ts \
            server/test/instant-facility-construction.test.js \
            scripts/verify-form-state-isolation.mjs \
            scripts/verify-authoritative-countdowns.mjs \
            scripts/verify-facility-auto-procure.mjs \
            package.json \
            docs/INDUSTRY_AND_PRODUCTION_DESIGN.md \
            docs/UNIFIED_ASSET_ORDER_BOOK_DESIGN.md \
            docs/WAREHOUSE_EXPANSION_DESIGN.md \
            docs/PAGE_CONTENT_AND_NAVIGATION_DESIGN.md \
            docs/SERVER_ARCHITECTURE_AND_DEPLOYMENT_DESIGN.md \
            docs/PRODUCT_AND_GAMEPLAY_DESIGN.md \
            docs/GEM_ACCELERATION_AND_DYNAMIC_EXCHANGE_DESIGN.md \
            docs/AUTHORITATIVE_COUNTDOWN_DESIGN.md \
            docs/README.md \
            README.md
          git commit -m "Implement one-click facility material procurement"
          git push origin HEAD:feat/facility-auto-procure
