name: Patch market page layout verifier
on:
  push:
    branches: [fix/market-six-column-headers]
    paths: [.github/workflows/patch-market-page-layout-verifier.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/market-six-column-headers
      - shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/verify-market-page-layout-regional.mjs')
          text = p.read_text()
          replacements = [
            ("type MarketCatalogSort = 'catalog' | 'name' | 'price' | 'trend' | 'buy-volume' | 'sell-volume';", "type MarketCatalogSort = 'catalog' | 'name' | 'price' | 'trend' | 'buy-volume' | 'sell-volume' | 'volume24h';"),
            ("for (const token of ['卖单量', '买单量', '市场价', '24h'])", "for (const token of ['卖单量', '买单量', '24h成交量', '市场价', '24h价格变化'])"),
            ("--entity-list-columns: minmax(8rem, 1.45fr) repeat(4, minmax(4.1rem, .68fr)) .8rem;", "--entity-list-columns: minmax(8rem, 1.45fr) repeat(5, minmax(3.8rem, .64fr)) .8rem;"),
            ("共享商品数据行必须保持身份、四项指标和箭头的单行布局。", "共享商品数据行必须保持身份、五项指标和箭头的单行布局。"),
            ("requireText(pageDesign, '地区、卖单量、买单量、市场价和 24h 变化', '页面职责设计必须记录地区行核心字段。');", "requireText(pageDesign, '地区、卖单量、买单量、24h 成交量、市场价和 24h 价格变化', '页面职责设计必须记录地区行核心字段。');"),
          ]
          for old, new in replacements:
            if text.count(old) != 1:
              raise SystemExit(f'expected one match, got {text.count(old)}: {old}')
            text = text.replace(old, new, 1)
          anchor = "requireText(marketPage, 'const sellVolume = Math.max(0, Number(market?.sellVolume || 0));', '地区商品卖单量必须读取服务端市场摘要。');"
          if text.count(anchor) != 1:
            raise SystemExit('missing market volume anchor')
          text = text.replace(anchor, anchor + "\nrequireText(marketPage, 'tradeVolume24h: Math.max(0, Number(market?.tradeVolume24h || 0))', '地区商品 24h 成交量必须读取服务端市场摘要。');", 1)
          p.write_text(text)
          PY
          node scripts/verify-market-page-layout.mjs
          node scripts/verify-market-information-hierarchy.mjs
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/verify-market-page-layout-regional.mjs
          git commit -m "同步地区市场六列验证规则"
          git push
