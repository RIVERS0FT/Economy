name: Patch market page-list verifier
on:
  push:
    branches: [fix/unify-page-entity-lists]
    paths: [.github/workflows/patch-market-page-layout-verifier.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/unify-page-entity-lists
      - name: Sync shared row template verifier
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/verify-market-page-layout-regional.mjs')
          text = path.read_text()
          old = "requireText(commodityRowStyles, '--entity-list-columns: minmax(8rem, 1.45fr) repeat(5, minmax(3.8rem, .64fr)) .8rem;', '共享商品数据行必须保持身份、五项指标和箭头的单行布局。');"
          new = "requireText(commodityRowStyles, '--entity-list-columns: minmax(8rem, 1.45fr) repeat(5, minmax(3.8rem, .64fr)) var(--entity-list-chevron-column, .8rem);', '共享商品数据行必须保持身份、五项指标和共享箭头轨道的单行布局。');"
          if text.count(old) != 1:
              raise SystemExit(f'expected one match, got {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/verify-market-page-layout-regional.mjs
          git commit -m "同步市场页面列表校验"
          git push
