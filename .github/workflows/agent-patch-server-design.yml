name: Agent Patch Server Design

on:
  push:
    branches:
      - agent/stability-transaction-mix-save-epoch

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stability-transaction-mix-save-epoch
      - name: Patch authoritative server design
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('docs/SERVER_ARCHITECTURE_AND_DEPLOYMENT_DESIGN.md')
          text = path.read_text(encoding='utf-8')
          replacements = {
              '> 更新时间：2026-08-06': '> 更新时间：2026-08-07',
              '工厂集群、当前与待生效配方、统一周期、在建任务与银行抵押数量；': '工厂集群、当前与待生效配方、统一周期、即时建设结果与银行抵押数量；',
              '玩家卖出手续费累计、市场服务就业收入、人口生产工资系数和施工托管；': '玩家卖出手续费累计、市场服务就业收入、人口生产工资系数和即时建造业就业收入；',
              '礼品码、每日签到、每周全勤、宝石流水、每日终端报价、报价决策、商店兑换和施工宝石加速审计；': '礼品码、每日签到、每周全勤、宝石流水、每日终端报价、报价决策、商店兑换、研发宝石加速审计与历史施工宝石加速只读审计；',
              '`research.js`：C1-C7 顺序研发目录、玩家迁移、就业托管释放、复杂度准入校验、客户端状态与最近调度截止时间；': '`research.js`：产业科技节点研发、旧等级与资产承诺迁移、就业进度释放、具体科技准入校验、研发宝石加速、客户端状态与最近调度截止时间；',
              '`gem-economy-store.js`：每日汇率、玩家接受／拒绝、实际兑换与施工宝石加速审计；': '`gem-economy-store.js`：每日汇率、玩家接受／拒绝、实际兑换、研发宝石加速审计与历史施工宝石加速只读表；',
              '`population-economy.js`：三类人口真实钱包、生产复杂度岗位、固定建造业岗位、施工托管、市场服务与银行服务就业、收入 EMA、五档消费状态和整数资金分配；': '`population-economy.js`：三类人口真实钱包、生产复杂度岗位、固定建造业岗位、即时建造业就业收入、市场服务与银行服务就业、收入 EMA、五档消费状态和整数资金分配；',
              '→ C1-C7 研发迁移：按玩家已有工厂、施工、未完成工厂买单和最高竞拍承诺推导等级，初始化 C1-C7 顺序状态与就业托管': '→ 科技节点研发迁移：按旧等级、已有工厂、旧施工承诺、未完成工厂买单和最高竞拍承诺授予具体科技及前置闭包，初始化单个活动科技与就业释放状态',
              '`world-deadline-planner.js` 从运行中工厂周期、施工完成与下一整数就业释放、市场需求和价格传导周期、人口政策到期、开放拍卖、合同到期／宽限期／公开过期、银行每日结息、贷款到期／宽限结束、每日签到跨日、排行榜结算与订单历史裁剪中选出最早绝对时间': '`world-deadline-planner.js` 从运行中工厂周期、市场需求和价格传导周期、人口政策到期、开放拍卖、合同到期／宽限期／公开过期、银行每日结息、贷款到期／宽限结束、每日签到跨日、排行榜结算与订单历史裁剪中选出最早绝对时间',
              '| POST | `/api/game/facilities/construction/accelerate` | 消耗 1 宝石减少当前施工 30 分钟 |': '| POST | `/api/game/facilities/construction/accelerate` | 已退役兼容墓碑，固定返回 `410 Gone` 且不进入经济事务 |',
              '`server/src/population-economy.js` 是三类人口钱包、就业收入、施工进度释放、人均收入 EMA、五档消费状态、真实人口订单冻结和管理员摘要的唯一实现。': '`server/src/population-economy.js` 是三类人口钱包、就业收入、即时建造业就业分配、人均收入 EMA、五档消费状态、真实人口订单冻结和管理员摘要的唯一实现。',
              '工厂交易不得改变世界总结构承载，施工、产量、库存、商品价格和玩家活跃数不得直接创造人口或补贴；': '工厂交易不得改变世界总结构承载，即时建设、产量、库存、商品价格和玩家活跃数不得直接创造人口或补贴；',
              '- 隔离环境使用模拟统一账号服务、临时 SQLite 和真实 Economy API 进程，允许执行 `mixed`／`soak` 写入场景；结束后必须关闭子进程并删除临时数据库。PR 和 `npm run build` 只运行短时隔离行为测试，证明执行器、状态协议、幂等和安全门禁正确，不把共享 CI 机器延迟作为正式容量基线。': '- 隔离环境使用模拟统一账号服务、临时 SQLite 和真实 Economy API 进程，允许执行 `mixed`／`transaction-mix`／`soak` 写入场景；`transaction-mix` 固定只允许本地隔离环境，临时 SQLite 可为固定测试账号预置充足现金、宝石、库存、仓库和农场资产，但不得增加生产调试接口或改变正式玩家初始资产。结束后必须关闭子进程并删除临时数据库。PR 和 `npm run build` 只运行短时隔离行为测试，证明执行器、状态协议、幂等和安全门禁正确，不把共享 CI 机器延迟作为正式容量基线。',
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one match for {old!r}, got {count}')
              text = text.replace(old, new)

          marker = '测试环境分为以下两类：\n'
          addition = ('`transaction-mix` 的操作构成固定为 60% 状态读取、10% 工作、10% 商品订单、8% 工厂启停、5% 配方切换、4% 即时建设、3% 研发；'
                      '执行器必须以确定性序列覆盖全部类别，写动作确认后立即补拉状态并继续校验全局修订号、分区修订和 `serverNow` 不倒退。'
                      '该场景不得用于 staging 或生产，生产继续只允许只读 `smoke`／`poll`。\n\n')
          if marker not in text:
              raise SystemExit('stress environment marker missing')
          if '`transaction-mix` 的操作构成固定为' not in text:
              text = text.replace(marker, addition + marker, 1)

          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
          git rm .github/workflows/agent-patch-server-design.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/SERVER_ARCHITECTURE_AND_DEPLOYMENT_DESIGN.md
          git commit -m "同步服务器稳定性与即时建设设计"
          git push origin HEAD:agent/stability-transaction-mix-save-epoch
