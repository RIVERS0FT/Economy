name: Agent Patch Server Design

on:
  push:
    branches:
      - agent/stability-transaction-mix-save-epoch

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stability-transaction-mix-save-epoch
      - name: Patch stability design details
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('docs/SERVER_ARCHITECTURE_AND_DEPLOYMENT_DESIGN.md')
          text = path.read_text(encoding='utf-8')
          replacements = {
            '正式场景为 `smoke`、`poll`、`burst`、`mixed` 和 `soak`：`smoke` 验证登录与完整／增量状态，`poll` 模拟正常轮询，`burst` 验证隔离环境冷状态尖峰，`mixed` 在隔离环境混合状态读取、工作动作、动作补拉和幂等重放，`soak` 长时间验证延迟、SQLite／WAL 与错误是否持续增长。未专门声明限流场景时，超时、5xx、非预期 4xx 和 429 必须为零。': '正式场景为 `smoke`、`poll`、`burst`、`mixed`、`transaction-mix` 和 `soak`：`smoke` 验证登录与完整／增量状态，`poll` 模拟正常轮询，`burst` 验证隔离环境冷状态尖峰，`mixed` 在隔离环境混合状态读取、工作动作、动作补拉和幂等重放，`transaction-mix` 在本地隔离环境覆盖状态、工作、订单、工厂启停、配方、即时建设和研发，`soak` 长时间验证延迟、SQLite／WAL 与错误是否持续增长。未专门声明限流场景时，超时、5xx、非预期 4xx 和 429 必须为零。',
            '服务器状态固定下发 `saveEpoch`。当前客户端对普通写请求发送 `X-Economy-Save-Epoch`；服务器允许没有该请求头的兼容旧客户端，但新客户端携带的世代与当前玩家不一致时必须返回 `409 SAVE_EPOCH_MISMATCH`，防止删档前的旧标签页把操作写入新存档。旧 `POST /api/game/reset` 继续固定返回 `410 Gone`，不得映射到删除存档领域能力。': '服务器状态固定下发 `saveEpoch`。当前客户端对普通写请求发送 `X-Economy-Save-Epoch`；仅当当前存档仍处于初始 `saveEpoch = 0` 时允许兼容旧客户端缺失该请求头。一旦玩家成功删除存档进入更高世代，缺失或与当前玩家不一致的世代都必须在 `store.apply()` 之前返回 `409 SAVE_EPOCH_MISMATCH`，不得推进世界修订号或改变现金、订单、工厂、研发等新存档状态，从而防止删档前的旧标签页把操作写入新存档；当前世代请求仍必须保持可写。旧 `POST /api/game/reset` 继续固定返回 `410 Gone`，不得映射到删除存档领域能力。',
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one match, got {count}: {old[:100]}')
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
          git rm .github/workflows/agent-patch-server-design.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/SERVER_ARCHITECTURE_AND_DEPLOYMENT_DESIGN.md
          git commit -m "补充事务混合与存档世代稳定性规则"
          git push origin HEAD:agent/stability-transaction-mix-save-epoch
