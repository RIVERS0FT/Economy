name: Verify published transport release

on:
  push:
    branches: [work/transport-public-verify-20260906]
    paths: [.github/workflows/transport-public-verify.yml]

permissions:
  contents: read

jobs:
  public-verification:
    if: github.ref == 'refs/heads/work/transport-public-verify-20260906'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 3d3b82b3c3e14968575d3ef3c224674c835ade43
          persist-credentials: false
      - name: Measure public endpoint response times without authentication
        shell: bash
        run: |
          set -uo pipefail
          getent ahosts game.riversoft.top || true
          for round in 1 2 3; do
            for url in \
              https://game.riversoft.top/economy-api/health \
              https://game.riversoft.top/economy-api/game/state \
              https://116.204.134.56/economy-api/game/state; do
              printf 'PUBLIC_PROBE round=%s url=%s\n' "$round" "$url"
              curl --silent --show-error --connect-timeout 2 --max-time 3 \
                --output /dev/null \
                --write-out 'status=%{http_code} remote=%{remote_ip} dns=%{time_namelookup} tls=%{time_appconnect} first_byte=%{time_starttransfer} total=%{time_total}\n' \
                "$url" || true
            done
            sleep 2
          done
      - name: Run unchanged formal public acceptance checks
        shell: bash
        run: bash scripts/verify-production-deployment.sh public 116.204.134.56
