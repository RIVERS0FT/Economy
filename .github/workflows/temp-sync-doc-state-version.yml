name: Temporary Sync Doc State Version

on:
  push:
    branches:
      - agent/stabilize-state-partition-revisions
    paths:
      - .github/workflows/temp-sync-doc-state-version.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stabilize-state-partition-revisions
          fetch-depth: 0
      - name: Synchronize authority document headers
        run: |
          python - <<'PY'
          from pathlib import Path

          paths = [
              Path('docs/PRODUCT_AND_GAMEPLAY_DESIGN.md'),
              Path('docs/INDUSTRY_AND_PRODUCTION_DESIGN.md'),
              Path('docs/UNIFIED_ASSET_ORDER_BOOK_DESIGN.md'),
              Path('docs/WAREHOUSE_EXPANSION_DESIGN.md'),
              Path('docs/PAGE_CONTENT_AND_NAVIGATION_DESIGN.md'),
              Path('docs/LOCAL_ACTIVITY_LOG_DESIGN.md'),
          ]
          for path in paths:
              text = path.read_text(encoding='utf-8')
              updated = text.replace('> 客户端状态版本：21', '> 客户端状态版本：22', 1)
              if updated == text:
                  raise SystemExit(f'{path} did not contain the expected version header')
              path.write_text(updated, encoding='utf-8')
          PY
      - name: Commit synchronized documents
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/PRODUCT_AND_GAMEPLAY_DESIGN.md \
            docs/INDUSTRY_AND_PRODUCTION_DESIGN.md \
            docs/UNIFIED_ASSET_ORDER_BOOK_DESIGN.md \
            docs/WAREHOUSE_EXPANSION_DESIGN.md \
            docs/PAGE_CONTENT_AND_NAVIGATION_DESIGN.md \
            docs/LOCAL_ACTIVITY_LOG_DESIGN.md
          git commit -m "同步权威文档状态版本"
          git push origin HEAD:agent/stabilize-state-partition-revisions
