name: Verify Auction Production

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/verify-auction-production.yml

permissions:
  contents: read
  actions: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify deployed commit and production assets
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ba2da87804e75c5d0da5f94907c641dc5470109b
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.request
          from collections import deque
          from pathlib import Path
          from urllib.parse import urljoin, urlparse

          token = os.environ['GH_TOKEN']
          sha = os.environ['TARGET_SHA']
          api_url = f'https://api.github.com/repos/RIVERS0FT/Economy/actions/runs?head_sha={sha}&per_page=100'
          request = urllib.request.Request(api_url, headers={
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'economy-production-verifier',
          })
          with urllib.request.urlopen(request, timeout=20) as response:
              payload = json.load(response)
          runs = [run for run in payload.get('workflow_runs', []) if run.get('name') == 'Deploy Economy Website']
          assert runs, 'deployment workflow run not found'
          run = max(runs, key=lambda item: int(item.get('id') or 0))
          assert run.get('status') == 'completed' and run.get('conclusion') == 'success', run
          print('DEPLOYMENT_VERIFIED', run.get('id'), run.get('html_url'))

          state_request = urllib.request.Request(
              'https://game.riversoft.top/economy-api/game/state',
              headers={'User-Agent': 'economy-production-verifier'},
          )
          try:
              urllib.request.urlopen(state_request, timeout=30)
              raise AssertionError('unauthenticated game state unexpectedly succeeded')
          except urllib.error.HTTPError as error:
              assert error.code == 401, error.code
              state_payload = json.loads(error.read().decode('utf-8'))
              assert state_payload.get('message') == '请先登录', state_payload
              print('PRODUCTION_API_VERIFIED', state_payload)

          index_request = urllib.request.Request(
              'https://game.riversoft.top/economy/',
              headers={'User-Agent': 'economy-production-verifier'},
          )
          with urllib.request.urlopen(index_request, timeout=30) as response:
              assert response.status == 200
              last_modified = response.headers.get('Last-Modified')
              html = response.read().decode('utf-8')
          print('PRODUCTION_INDEX_VERIFIED', last_modified, 'bytes', len(html.encode('utf-8')))

          sources = re.findall(r'<script[^>]+src=["\']([^"\']+)["\']', html)
          assert sources, 'production HTML has no script bundle'
          queue = deque(urljoin('https://game.riversoft.top/economy/', source) for source in sources)
          visited = set()
          texts = {}
          asset_pattern = re.compile(r'(?:["\']|`)([^"\'`]*?assets/[A-Za-z0-9._-]+\.js)(?:["\']|`)')
          relative_pattern = re.compile(r'(?:["\']|`)(\.?\.?/[A-Za-z0-9._/-]+\.js)(?:["\']|`)')
          while queue and len(visited) < 250:
              url = queue.popleft()
              if url in visited or urlparse(url).netloc != 'game.riversoft.top':
                  continue
              visited.add(url)
              request = urllib.request.Request(url, headers={'User-Agent': 'economy-production-verifier'})
              with urllib.request.urlopen(request, timeout=30) as response:
                  text = response.read().decode('utf-8', errors='replace')
              texts[url] = text
              for match in asset_pattern.findall(text):
                  queue.append(urljoin(url, match))
              for match in relative_pattern.findall(text):
                  queue.append(urljoin(url, match))

          combined = '\n'.join(texts.values())
          required = ['隐藏保留价', '查看最近 10 条', '发布费', '最后 2 分钟']
          missing = [text for text in required if text not in combined]
          assert not missing, f'production JS chunks missing auction copy: {missing}; scanned={len(texts)}'
          matched = [url for url, text in texts.items() if any(term in text for term in required)]
          print('PRODUCTION_BUNDLE_VERIFIED', 'chunks', len(texts), 'matched', matched)
          PY
