name: Verify Auction Production

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/verify-auction-production.yml

permissions:
  contents: read
  actions: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify deployment and inspect production responses
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ba2da87804e75c5d0da5f94907c641dc5470109b
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          sha = os.environ['TARGET_SHA']
          token = os.environ['GH_TOKEN']
          url = f'https://api.github.com/repos/RIVERS0FT/Economy/actions/runs?head_sha={sha}&per_page=100'
          request = urllib.request.Request(url, headers={
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'economy-production-verifier',
          })
          with urllib.request.urlopen(request, timeout=20) as response:
              payload = json.load(response)
          runs = [run for run in payload.get('workflow_runs', []) if run.get('name') == 'Deploy Economy Website']
          assert runs, 'deployment workflow run not found'
          run = max(runs, key=lambda item: int(item.get('id') or 0))
          print('DEPLOYMENT_RUN', {
              'id': run.get('id'),
              'status': run.get('status'),
              'conclusion': run.get('conclusion'),
              'event': run.get('event'),
              'url': run.get('html_url'),
          })
          assert run.get('status') == 'completed' and run.get('conclusion') == 'success', run
          PY

          inspect_url() {
            local name="$1"
            local url="$2"
            local body="/tmp/${name}.body"
            local headers="/tmp/${name}.headers"
            local result
            result="$(curl --retry 3 --retry-all-errors --connect-timeout 10 --max-time 30 -sS -L -D "$headers" -o "$body" -w 'code=%{http_code} effective=%{url_effective} type=%{content_type} bytes=%{size_download}' "$url")"
            echo "RESPONSE $name $result"
            sed -n '1,30p' "$headers"
            echo "BODY $name"
            head -c 1000 "$body" || true
            echo
          }

          inspect_url health https://game.riversoft.top/economy-api/health
          inspect_url health_slash https://game.riversoft.top/economy-api/health/
          inspect_url app https://game.riversoft.top/economy/
