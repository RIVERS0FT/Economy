name: Run primary-surface list patch
on:
  push:
    branches: [fix/unify-page-entity-lists]
    paths:
      - scripts/patch-primary-surface-list-authority.py
      - .github/workflows/run-primary-surface-list-patch.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/unify-page-entity-lists
      - run: python scripts/patch-primary-surface-list-authority.py
      - run: git diff --check
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/PRIMARY_SURFACE_INSET_DESIGN.md scripts/verify-primary-surface-insets.mjs
          git commit -m "同步统一页面列表承载规则"
          git push
