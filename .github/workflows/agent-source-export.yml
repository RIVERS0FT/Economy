name: Agent source export

on:
  push:
    branches:
      - agent/merge-assets-into-bank

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: economy-source
          path: .
          include-hidden-files: true
          retention-days: 1
