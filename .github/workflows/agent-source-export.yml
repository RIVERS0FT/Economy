name: Apply asset bank refactor

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.head_ref == 'agent/merge-assets-into-bank' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Clone, decode, and verify patch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git clone --quiet --depth 1 --branch agent/merge-assets-into-bank "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          : > /tmp/merge-assets-into-bank.patch.gz
          for part in .agent/patch.part-00.b64 .agent/patch.part-01.b64 .agent/patch.part-02.b64 .agent/patch.part-03.b64 .agent/patch.part-04.b64 .agent/patch.part-05.b64; do
            base64 --decode "$part" >> /tmp/merge-assets-into-bank.patch.gz
          done
          echo '240ba3273e092fa040bcf8cb00a36fad382418c60b6e2656dc84a9cabf366cf2  /tmp/merge-assets-into-bank.patch.gz' | sha256sum --check
          gzip --decompress --stdout /tmp/merge-assets-into-bank.patch.gz > /tmp/merge-assets-into-bank.patch
          echo '316ebe365f65ba2f58276571f367afd74269a7c3ae5585a363746e4201aa5a36  /tmp/merge-assets-into-bank.patch' | sha256sum --check
          git apply --check /tmp/merge-assets-into-bank.patch
          git apply /tmp/merge-assets-into-bank.patch
          rm -f .agent/merge-assets-into-bank.patch.gz.b64
          rm -f .agent/patch.part-*.b64
          rm -f .agent-note .agent-placeholder .agent-pr-trigger
          rmdir .agent 2>/dev/null || true
          git diff --check

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24.4.0'
          cache: npm
          cache-dependency-path: repo/package-lock.json

      - name: Install dependencies
        working-directory: repo
        run: npm ci --silent

      - name: Build and verify
        id: build
        continue-on-error: true
        working-directory: repo
        shell: bash
        run: npm run build > /tmp/economy-build.log 2>&1

      - name: Upload build failure log
        if: steps.build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: asset-bank-build-error
          path: /tmp/economy-build.log
          retention-days: 1

      - name: Stop after build failure
        if: steps.build.outcome == 'failure'
        run: exit 1

      - name: Install Chromium
        working-directory: repo
        run: npx playwright install --with-deps chromium >/dev/null

      - name: Run browser tests
        id: browser
        continue-on-error: true
        working-directory: repo
        shell: bash
        run: npm run test:browser > /tmp/economy-browser.log 2>&1

      - name: Upload browser failure log
        if: steps.browser.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: asset-bank-browser-error
          path: /tmp/economy-browser.log
          retention-days: 1

      - name: Stop after browser failure
        if: steps.browser.outcome == 'failure'
        run: exit 1

      - name: Commit implementation
        working-directory: repo
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m '资产页面合入银行并删除本地资产变动'
          git push origin HEAD:agent/merge-assets-into-bank
