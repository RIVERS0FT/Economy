name: Apply asset bank refactor

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.head_ref == 'agent/merge-assets-into-bank' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Clone, decode, and verify patch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git clone --quiet --depth 1 --branch agent/merge-assets-into-bank "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          : > /tmp/merge-assets-into-bank.patch.gz
          for part in .agent/patch.part-00.b64 .agent/patch.part-01.b64 .agent/patch.part-02.b64 .agent/patch.part-03.b64 .agent/patch.part-04.b64 .agent/patch.part-05.b64; do
            base64 --decode "$part" >> /tmp/merge-assets-into-bank.patch.gz
          done
          echo '240ba3273e092fa040bcf8cb00a36fad382418c60b6e2656dc84a9cabf366cf2  /tmp/merge-assets-into-bank.patch.gz' | sha256sum --check
          gzip --decompress --stdout /tmp/merge-assets-into-bank.patch.gz > /tmp/merge-assets-into-bank.patch
          echo '316ebe365f65ba2f58276571f367afd74269a7c3ae5585a363746e4201aa5a36  /tmp/merge-assets-into-bank.patch' | sha256sum --check
          git apply --check /tmp/merge-assets-into-bank.patch
          git apply /tmp/merge-assets-into-bank.patch

          base64 --decode .agent/patch.fix-01.gz.b64 > /tmp/asset-bank-fix-01.patch.gz
          echo 'a8f9726f62df92f64560b38cf0d6449d5b01030371211af450413c25edaf0a70  /tmp/asset-bank-fix-01.patch.gz' | sha256sum --check
          gzip --decompress --stdout /tmp/asset-bank-fix-01.patch.gz > /tmp/asset-bank-fix-01.patch
          echo 'f4b38e2279b0deb3f9378bb324c9b8343c0d53a0d35e39ac522b48f1bb3c89fa  /tmp/asset-bank-fix-01.patch' | sha256sum --check
          git apply --check /tmp/asset-bank-fix-01.patch
          git apply /tmp/asset-bank-fix-01.patch

          base64 --decode .agent/patch.fix-02.gz.b64 > /tmp/asset-bank-fix-02.patch.gz
          echo '3bdb94a9a1413a5ad5f48647dee094bbba0916c806ea216576f5fc720515f84a  /tmp/asset-bank-fix-02.patch.gz' | sha256sum --check
          gzip --decompress --stdout /tmp/asset-bank-fix-02.patch.gz > /tmp/asset-bank-fix-02.patch
          echo '2d09ae01a31069f87f63ff261d38446fdcd4054216b3cafb6925bfad4775a23f  /tmp/asset-bank-fix-02.patch' | sha256sum --check
          git apply --check /tmp/asset-bank-fix-02.patch
          git apply /tmp/asset-bank-fix-02.patch

          base64 --decode .agent/patch.fix-03.gz.b64 > /tmp/asset-bank-fix-03.patch.gz
          echo 'f9152dddbda4f9b45658ec83d696c48f56a61a82c26a25a31d4688ece8fd41ac  /tmp/asset-bank-fix-03.patch.gz' | sha256sum --check
          gzip --decompress --stdout /tmp/asset-bank-fix-03.patch.gz > /tmp/asset-bank-fix-03.patch
          echo '861adb514ae3df07a81184aa69feada77e3b18cf5f621ad94d601d6721c0aca3  /tmp/asset-bank-fix-03.patch' | sha256sum --check
          git apply --check /tmp/asset-bank-fix-03.patch
          git apply /tmp/asset-bank-fix-03.patch

          base64 --decode .agent/patch.fix-04.gz.b64 > /tmp/asset-bank-fix-04.patch.gz
          echo 'e38488dd6d3af6a82a1be99f24d662b50e6baef07c6683ee94e6ed6fa513bf25  /tmp/asset-bank-fix-04.patch.gz' | sha256sum --check
          gzip --decompress --stdout /tmp/asset-bank-fix-04.patch.gz > /tmp/asset-bank-fix-04.patch
          echo 'c7e0998fd100a2c97014be4e73e8ef98d29e887564816ff82aa483839e0462c9  /tmp/asset-bank-fix-04.patch' | sha256sum --check
          git apply --check /tmp/asset-bank-fix-04.patch
          git apply /tmp/asset-bank-fix-04.patch

          base64 --decode .agent/patch.fix-05.gz.b64 > /tmp/asset-bank-fix-05.patch.gz
          echo '3efe66650d62cd192856471c8ee7672d67be9e822103d0a7ee1266459ca7d80f  /tmp/asset-bank-fix-05.patch.gz' | sha256sum --check
          gzip --decompress --stdout /tmp/asset-bank-fix-05.patch.gz > /tmp/asset-bank-fix-05.patch
          echo 'e86c62b9be2ee85469a0ec736c106e1355c5b2f39e35e29d393c850d1c6b3843  /tmp/asset-bank-fix-05.patch' | sha256sum --check
          git apply --check /tmp/asset-bank-fix-05.patch
          git apply /tmp/asset-bank-fix-05.patch

          base64 --decode .agent/patch.fix-06.gz.b64 > /tmp/asset-bank-fix-06.patch.gz
          echo 'd76823fa018a80278cdb4c08c7f35d05681c09dbbd4e307c969f0a89161ca381  /tmp/asset-bank-fix-06.patch.gz' | sha256sum --check
          gzip --decompress --stdout /tmp/asset-bank-fix-06.patch.gz > /tmp/asset-bank-fix-06.patch
          echo '89efdaf6d2794b0e085ffc0294be552dcbb79a00f17be63be29891e8509ae44c  /tmp/asset-bank-fix-06.patch' | sha256sum --check
          git apply --check /tmp/asset-bank-fix-06.patch
          git apply /tmp/asset-bank-fix-06.patch

          rm -f .agent/merge-assets-into-bank.patch.gz.b64
          rm -f .agent/patch.part-*.b64 .agent/patch.fix-*.gz.b64
          rm -f .agent-note .agent-placeholder .agent-pr-trigger
          rmdir .agent 2>/dev/null || true
          git diff --check

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24.4.0'
          cache: npm
          cache-dependency-path: repo/package-lock.json

      - name: Install dependencies
        working-directory: repo
        run: npm ci --silent

      - name: Build and verify
        id: build
        continue-on-error: true
        working-directory: repo
        shell: bash
        run: npm run build > /tmp/economy-build.log 2>&1

      - name: Upload build failure log
        if: steps.build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: asset-bank-build-error
          path: /tmp/economy-build.log
          retention-days: 1

      - name: Stop after build failure
        if: steps.build.outcome == 'failure'
        run: exit 1

      - name: Install Chromium
        working-directory: repo
        run: npx playwright install --with-deps chromium >/dev/null

      - name: Run browser tests
        id: browser
        continue-on-error: true
        working-directory: repo
        shell: bash
        run: npm run test:browser > /tmp/economy-browser.log 2>&1

      - name: Upload browser failure log
        if: steps.browser.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: asset-bank-browser-error
          path: /tmp/economy-browser.log
          retention-days: 1

      - name: Stop after browser failure
        if: steps.browser.outcome == 'failure'
        run: exit 1

      - name: Commit implementation
        working-directory: repo
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m '资产页面合入银行并删除本地资产变动'
          git push origin HEAD:agent/merge-assets-into-bank
