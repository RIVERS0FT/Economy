name: Apply banking implementation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/banking-interest
          fetch-depth: 1
          show-progress: false
      - name: Verify patch parts
        run: sha256sum --quiet --check .agent/manifest.sha256
      - name: Reconstruct and verify patch
        shell: bash
        run: |
          set -euo pipefail
          {
            cat .agent/fix-aa-0 .agent/fix-aa-1 .agent/fix-aa-2
            cat .agent/fix-ab-0 .agent/fix-ab-1 .agent/fix-ab-2
            cat .agent/banking.patch.part-ac
            cat .agent/fix-ad-0 .agent/fix-ad-1 .agent/fix-ad-2
            cat .agent/banking.patch.part-ae .agent/banking.patch.part-af .agent/banking.patch.part-ag
            cat .agent/banking.patch.part-ah .agent/banking.patch.part-ai .agent/banking.patch.part-aj
            cat .agent/banking.patch.part-ak .agent/banking.patch.part-al .agent/banking.patch.part-am
          } | base64 --decode > /tmp/banking.patch.gz
          echo '1317be2804e23b8a0ad34c22f69225447a4606718cc436b2b625638aebf4849f  /tmp/banking.patch.gz' | sha256sum --check -
          gzip --decompress --stdout /tmp/banking.patch.gz > /tmp/banking.patch
          git apply --check /tmp/banking.patch
      - name: Apply implementation
        run: |
          git apply /tmp/banking.patch
          git diff --check
      - name: Commit implementation
        run: |
          rm -rf .agent
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m '实现银行、抵押贷款与动态存款利息'
      - name: Push implementation
        run: git push origin HEAD:refs/heads/agent/banking-interest
