name: Sync facility primary-surface geometry guard

on:
  push:
    branches:
      - codex/facility-object-card-visual

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/facility-object-card-visual
          fetch-depth: 0
      - name: Update primary-surface building geometry guard
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/verify-primary-surface-insets.mjs')
          text = path.read_text(encoding='utf-8')
          old = "    'expect(row.height).toBeGreaterThanOrEqual(82);',\n    'expect(row.height).toBeLessThanOrEqual(98);',"
          new = "    'expect(row.height).toBeGreaterThanOrEqual(104);',\n    'expect(row.height).toBeLessThanOrEqual(132);',"
          if text.count(old) != 1:
              raise SystemExit(f'primary inset baseline match count={text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          node scripts/verify-primary-surface-insets.mjs
          node scripts/verify-facility-catalog-layout.mjs
          git diff --check
      - name: Commit guard update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/verify-primary-surface-insets.mjs
          git commit -m "同步建筑对象卡一级表面几何门禁"
          git push origin HEAD:codex/facility-object-card-visual
