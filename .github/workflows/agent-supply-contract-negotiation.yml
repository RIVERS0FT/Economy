name: Agent Supply Contract Negotiation Patch

on:
  push:
    branches:
      - agent/supply-contract-negotiation

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/supply-contract-negotiation
      - name: Apply implementation patch
        shell: bash
        run: |
          cat .agent/supply-negotiation.patch.00 .agent/supply-negotiation.patch.01 .agent/supply-negotiation.patch.02 .agent/supply-negotiation.patch.03 > /tmp/payload.b64
          base64 -d /tmp/payload.b64 | gzip -d > /tmp/apply.py
          python3 /tmp/apply.py
          git diff --check
          git rm .agent/supply-negotiation.patch.00 .agent/supply-negotiation.patch.01 .agent/supply-negotiation.patch.02 .agent/supply-negotiation.patch.03 .github/workflows/agent-supply-contract-negotiation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- server/src/contracts.js server/src/game-routes.js server/src/runtime-store.js server/src/contract-audit-store.js server/test/contracts.test.js src/contracts/types.ts src/contracts/api.ts src/contracts/navigation.ts src/contracts/ContractNegotiationSection.tsx src/styles/contract-negotiation.css src/pages/ContractPage.tsx src/components/facilities/FacilityOperatingDiagnostics.tsx src/styles/facility-operating-diagnostics.css src/pages/production/ProductionFacilityDetail.tsx src/pages/production/MobileFacilityDetailSheet.tsx src/pages/ProductionPage.tsx scripts/verify-gameplay-decision-support.mjs docs/PAGE_CONTENT_AND_NAVIGATION_DESIGN.md docs/PRODUCT_AND_GAMEPLAY_DESIGN.md docs/INDUSTRY_AND_PRODUCTION_DESIGN.md docs/SERVER_ARCHITECTURE_AND_DEPLOYMENT_DESIGN.md
          git status --short
          git commit -m "实现商品合同结构化议价与经营联动"
          git push origin HEAD:agent/supply-contract-negotiation
