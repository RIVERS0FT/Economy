name: Fix facility detail settings documentation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Restore exact production settings rule
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('docs/INDUSTRY_AND_PRODUCTION_DESIGN.md')
          source = path.read_text()
          old = '- 玩家可见“生产产物”与“作业制度”必须合并为同一个“生产设置”区；桌面与移动在 `320px` 及以上固定双列同行。两者使用共享 `RichSelectInput`、商品 PNG 或制度 Icon 与名称；不得显示制度说明、周期摘要、产出摘要或成本摘要。'
          new = '- 玩家可见“生产产物”与“作业制度”必须合并为同一个“生产设置”区；桌面与移动在 `320px` 及以上固定双列同行。两者使用共享 `RichSelectInput`、商品 PNG 或制度 Icon 与名称；生产设置下方不得显示“周期 · 产出 · 成本”摘要、制度说明或重复当前制度名称。'
          if source.count(old) != 1:
              raise SystemExit(f'expected one settings rule, found {source.count(old)}')
          path.write_text(source.replace(old, new, 1))
          Path('.github/workflows/fix-facility-detail-settings-doc.yml').unlink()
          PY
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- docs/INDUSTRY_AND_PRODUCTION_DESIGN.md .github/workflows/fix-facility-detail-settings-doc.yml
          git commit -m "保留生产设置防重复权威表述"
          git push origin HEAD:${{ github.head_ref }}
