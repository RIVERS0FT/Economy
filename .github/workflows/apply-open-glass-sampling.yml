      expect(chain.openTransforms.every((value) => value === 'none')).toBe(true);
      expect(chain.warpBackdropFilter).toContain('blur(4px)');
      expect(chain.warpBackdropFilter).toMatch(/saturate\((?:140%|1\.4)\)/);
    }
  });

