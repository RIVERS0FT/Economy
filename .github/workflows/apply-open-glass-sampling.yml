name: Apply open glass sampling chain

on:
  push:
    branches:
      - agent/open-glass-sampling
    paths:
      - '.github/workflows/apply-open-glass-sampling.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply sampling-chain fix
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, content):
              Path(path).write_text(content if content.endswith('\n') else content + '\n', encoding='utf-8')

          def replace_once(path, old, new):
              source = read(path)
              count = source.count(old)
              if count != 1:
                  raise RuntimeError(f'{path}: expected one match, found {count}: {old[:120]!r}')
              write(path, source.replace(old, new, 1))

          replace_once(
              'src/styles/viewport.css',
              '''.signed-in-shell {
  position: fixed;
  inset: 0;
  height: auto;
  min-height: 0;
