name: Apply stale managed automatic-order cleanup

on:
  push:
    branches:
      - codex/factory-auto-operation-v2
    paths:
      - scripts/apply-stale-managed-order-cleanup.mjs
      - .github/workflows/apply-stale-managed-order-cleanup.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/factory-auto-operation-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.4.0
      - name: Apply cleanup changes
        run: node scripts/apply-stale-managed-order-cleanup.mjs
      - name: Commit cleanup changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/auto-trade/useOnlineAutoTrade.ts docs/WAREHOUSE_EXPANSION_DESIGN.md scripts/verify-online-auto-sell.mjs
          git diff --cached --check
          git commit -m 'Clean stale managed automatic orders'
          git push origin HEAD:codex/factory-auto-operation-v2
