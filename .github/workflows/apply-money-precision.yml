name: Apply money precision

on:
  push:
    branches:
      - agent/player-money-two-decimals
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Apply source and design changes
        run: |
          node .agent/apply-money-precision.mjs
          rm -rf .agent .github/workflows/apply-money-precision.yml
          git diff --check
      - name: Verify money precision
        run: npm run verify:money-precision
      - name: Full build and tests
        run: npm run build
      - name: Commit generated source changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "实现玩家货币两位小数与六位计算精度"
          git push origin HEAD:agent/player-money-two-decimals
