name: Apply money precision

on:
  push:
    branches:
      - agent/player-money-two-decimals
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Apply source and design changes
        id: apply
        continue-on-error: true
        run: node .agent/apply-money-precision.mjs > /tmp/money-patch.log 2>&1
      - name: Upload patch diagnostics
        if: steps.apply.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: money-patch-diagnostics
          path: /tmp/money-patch.log
          retention-days: 1
      - name: Stop after patch failure
        if: steps.apply.outcome == 'failure'
        run: |
          cat /tmp/money-patch.log
          exit 1
      - name: Remove temporary application files
        id: cleanup
        continue-on-error: true
        run: |
          rm -rf .agent .github/workflows/apply-money-precision.yml
          git diff --check > /tmp/money-cleanup.log 2>&1
      - name: Upload cleanup diagnostics
        if: steps.cleanup.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: money-cleanup-diagnostics
          path: /tmp/money-cleanup.log
          retention-days: 1
      - name: Stop after cleanup failure
        if: steps.cleanup.outcome == 'failure'
        run: |
          cat /tmp/money-cleanup.log
          exit 1
      - name: Verify money precision
        run: npm run verify:money-precision
      - name: Full build and tests
        id: build
        continue-on-error: true
        run: npm run build > /tmp/money-build.log 2>&1
      - name: Upload build diagnostics
        if: steps.build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: money-build-diagnostics
          path: /tmp/money-build.log
          retention-days: 1
      - name: Stop after build failure
        if: steps.build.outcome == 'failure'
        run: |
          tail -n 300 /tmp/money-build.log
          exit 1
      - name: Commit generated source changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "实现玩家货币两位小数与六位计算精度"
          git push origin HEAD:agent/player-money-two-decimals
