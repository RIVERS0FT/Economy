name: Diagnose production state timeout

on:
  push:
    branches:
      - fix/initial-state-timeout

permissions:
  contents: read

env:
  ECONOMY_PRODUCTION_PUBLIC_IP: 116.204.134.56

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure SSH
        env:
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SERVER_PORT" "$ECONOMY_PRODUCTION_PUBLIC_IP" >> ~/.ssh/known_hosts 2>/dev/null
          chmod 600 ~/.ssh/known_hosts

      - name: Read safe production diagnostics
        env:
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -p "$SERVER_PORT" -o BatchMode=yes -o ConnectTimeout=15 \
            "$SERVER_USER@$ECONOMY_PRODUCTION_PUBLIC_IP" 'bash -s' <<'REMOTE'
          set -euo pipefail
          pid="$(systemctl show riversoft-economy-api.service -p MainPID --value || true)"
          echo '=== service/process ==='
          systemctl is-active riversoft-economy-api.service || true
          systemctl show riversoft-economy-api.service -p ActiveEnterTimestamp -p MainPID -p NRestarts --no-pager || true
          if [ -n "$pid" ] && [ "$pid" != "0" ]; then
            ps -p "$pid" -o pid=,etime=,%cpu=,%mem=,rss=,vsz= || true
          fi

          echo '=== anonymous world cardinality/deadlines ==='
          python3 - <<'PY'
          import collections, json, sqlite3, time
          path = 'file:/var/lib/riversoft-economy/economy.sqlite?mode=ro'
          db = sqlite3.connect(path, uri=True, timeout=2)
          now = int(time.time() * 1000)
          segments = {key: json.loads(raw) for key, raw in db.execute('SELECT segment_key, state_json FROM economy_world_segments')}
          meta = db.execute('SELECT revision, world_version, storage_schema_version, updated_at FROM economy_world_meta WHERE id=1').fetchone()
          orders = segments.get('orders') or []
          status = collections.Counter(str(row.get('status') or '') for row in orders if isinstance(row, dict))
          open_orders = [row for row in orders if isinstance(row, dict) and str(row.get('status') or '') in ('open', 'partial') and float(row.get('remaining') or 0) > 0]
          closed = [row for row in orders if isinstance(row, dict) and row not in open_orders]
          print('now=', now)
          print('meta=', meta)
          print('orders_total=', len(orders), 'open=', len(open_orders), 'closed=', len(closed), 'status=', dict(status))
          print('order_prune_threshold_due=', len(orders) > 4000)
          if closed:
            created = [int(row.get('createdAt') or 0) for row in closed if int(row.get('createdAt') or 0) >= 0]
            if created:
              print('closed_created_min=', min(created), 'closed_created_max=', max(created), 'oldest_prune_due=', min(created) + 86400000 + 1, 'past_due=', min(created) + 86400000 + 1 <= now)

          leaderboard = segments.get('leaderboardState') or {}
          print('leaderboard=', {k: leaderboard.get(k) for k in ('startsAt','endsAt','periodKey')}, 'past_due=', int(leaderboard.get('endsAt') or 0) <= now)

          contracts = segments.get('productionContracts') or []
          active_contracts = [row for row in contracts if isinstance(row, dict) and row.get('status') == 'active']
          contract_due = []
          for row in active_contracts:
            values = [int(row.get(k)) for k in ('nextDueAt','dueAt','graceEndsAt') if isinstance(row.get(k), (int,float)) and int(row.get(k)) >= 0]
            if values: contract_due.append(min(values))
          print('contracts_total=', len(contracts), 'active=', len(active_contracts), 'next_due=', min(contract_due) if contract_due else None, 'past_due=', bool(contract_due and min(contract_due) <= now))

          auctions = segments.get('assetAuctions') or []
          auction_due = [int(row.get('endsAt')) for row in auctions if isinstance(row, dict) and row.get('status') == 'open' and isinstance(row.get('endsAt'), (int,float))]
          print('auctions_total=', len(auctions), 'open=', len(auction_due), 'next_due=', min(auction_due) if auction_due else None, 'past_due=', bool(auction_due and min(auction_due) <= now))

          market = segments.get('marketDemand') or {}
          groups = market.get('groups') if isinstance(market, dict) else None
          if isinstance(groups, dict):
            demand_due = [int(row.get('nextDemandAt')) for row in groups.values() if isinstance(row, dict) and isinstance(row.get('nextDemandAt'), (int,float))]
            print('market_groups=', len(groups), 'next_demand=', min(demand_due) if demand_due else None, 'past_due=', bool(demand_due and min(demand_due) <= now))
          else:
            print('market_groups=unavailable')
          db.close()
          PY

          echo '=== revision samples ==='
          for i in 1 2 3 4 5; do
            python3 - <<'PY'
          import sqlite3, time
          db = sqlite3.connect('file:/var/lib/riversoft-economy/economy.sqlite?mode=ro', uri=True, timeout=2)
          print(int(time.time() * 1000), db.execute('SELECT revision, updated_at FROM economy_world_meta WHERE id=1').fetchone())
          db.close()
          PY
            sleep 1
          done

          echo '=== health ==='
          curl -sS --max-time 5 -w '\nstatus=%{http_code} total=%{time_total}\n' http://127.0.0.1:3002/health || true
          REMOTE
