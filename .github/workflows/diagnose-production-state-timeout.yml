name: Diagnose production state timeout

on:
  push:
    branches:
      - fix/initial-state-timeout

permissions:
  contents: read

env:
  ECONOMY_PRODUCTION_PUBLIC_IP: 116.204.134.56

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure SSH
        env:
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SERVER_PORT" "$ECONOMY_PRODUCTION_PUBLIC_IP" >> ~/.ssh/known_hosts 2>/dev/null
          chmod 600 ~/.ssh/known_hosts

      - name: Read safe production diagnostics
        env:
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -p "$SERVER_PORT" -o BatchMode=yes -o ConnectTimeout=15 \
            "$SERVER_USER@$ECONOMY_PRODUCTION_PUBLIC_IP" 'bash -s' <<'REMOTE'
          set -euo pipefail
          echo '=== service ==='
          systemctl is-active riversoft-economy-api.service || true
          systemctl show riversoft-economy-api.service -p ActiveEnterTimestamp -p MainPID -p NRestarts --no-pager || true

          echo '=== process ==='
          pid="$(systemctl show riversoft-economy-api.service -p MainPID --value || true)"
          if [ -n "$pid" ] && [ "$pid" != "0" ]; then
            ps -p "$pid" -o pid=,etime=,%cpu=,%mem=,rss=,vsz= || true
          fi

          echo '=== database ==='
          stat -c 'bytes=%s modified=%y' /var/lib/riversoft-economy/economy.sqlite || true
          python3 - <<'PY'
          import sqlite3
          path = 'file:/var/lib/riversoft-economy/economy.sqlite?mode=ro'
          db = sqlite3.connect(path, uri=True, timeout=2)
          print('meta=', db.execute('SELECT revision, world_version, storage_schema_version, updated_at FROM economy_world_meta WHERE id=1').fetchone())
          print('players=', db.execute('SELECT COUNT(*), COALESCE(SUM(length(state_json)),0), COALESCE(MAX(length(state_json)),0) FROM economy_world_players').fetchone())
          print('segments:')
          for row in db.execute('SELECT segment_key, length(state_json), updated_revision FROM economy_world_segments ORDER BY length(state_json) DESC'):
              print(row)
          db.close()
          PY

          echo '=== health samples ==='
          for i in 1 2 3; do
            curl -sS --max-time 5 -w '\nstatus=%{http_code} total=%{time_total}\n' http://127.0.0.1:3002/health || true
            sleep 1
          done

          echo '=== safe session diagnostics ==='
          journalctl -u riversoft-economy-api.service --since '2 hours ago' --no-pager \
            | grep 'ECONOMY_SESSION_SLOW' \
            | tail -n 100 || true

          echo '=== perf availability ==='
          if command -v perf >/dev/null 2>&1 && [ -n "$pid" ] && [ "$pid" != "0" ]; then
            echo perf-present
            if sudo -n true 2>/dev/null; then
              sudo -n timeout 8s perf record -F 49 -g -p "$pid" -o /tmp/economy-state-timeout.perf -- sleep 5 >/dev/null 2>&1 || true
              sudo -n perf report -i /tmp/economy-state-timeout.perf --stdio --no-children 2>/dev/null | head -n 80 || true
              sudo -n rm -f /tmp/economy-state-timeout.perf || true
            fi
          else
            echo perf-unavailable
          fi
          REMOTE
