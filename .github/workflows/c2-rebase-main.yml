name: C2 rebase latest main

on:
  push:
    branches:
      - feature/c2-production-methods

permissions:
  contents: write

jobs:
  rebase:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24.4.0'
          cache: npm

      - name: Merge latest main and resolve known conflicts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          merge_status=0
          git merge --no-commit --no-ff origin/main || merge_status=$?
          echo "merge_status=${merge_status}"
          git diff --name-only --diff-filter=U || true
          python3 scripts/c2-rebase-main.py
          python3 scripts/c2-fix-economical.py
          python3 scripts/c2-fix-production-verifier.py
          python3 scripts/c2-fix-current-tests.py
          git add -- \
            docs/README.md \
            docs/INDUSTRY_AND_PRODUCTION_DESIGN.md \
            docs/SERVER_ARCHITECTURE_AND_DEPLOYMENT_DESIGN.md \
            docs/UI_DESIGN_SYSTEM.md \
            docs/UNIFIED_ASSET_ORDER_BOOK_DESIGN.md \
            docs/WAREHOUSE_EXPANSION_DESIGN.md \
            src/pages/ProductionPage.tsx \
            src/pages/production/ProductionFacilityDetail.tsx \
            server/src/production-methods.js \
            server/test/c1-input-balance-migration.test.js \
            server/test/domain.test.js \
            server/test/order-limits.test.js \
            server/test/production-methods.test.js \
            server/test/tool-workshop.test.js \
            scripts/verify-document-authority.mjs \
            scripts/verify-money-precision.mjs \
            scripts/verify-production-methods.mjs
          git diff --check

      - name: Install dependencies
        run: npm ci

      - name: Verify merged branch
        run: npm run build

      - name: Commit merged main and remove temporary helpers
        shell: bash
        run: |
          set -euo pipefail
          git rm -- \
            .github/workflows/c2-rebase-main.yml \
            scripts/c2-rebase-main.py \
            scripts/c2-fix-economical.py \
            scripts/c2-fix-production-verifier.py \
            scripts/c2-fix-current-tests.py
          git diff --check
          git status --short
          git commit -m "merge: integrate latest main into C2 production methods"
          git push origin HEAD:feature/c2-production-methods
