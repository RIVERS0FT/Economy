name: Apply production lazy settlement integration

on:
  push:
    branches:
      - agent/production-lazy-settlement

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.4.0'
          cache: npm
      - name: Patch integration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'missing patch anchor in {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1))

          replace_once(
              'server/src/world-deadline-planner.js',
              '    facility: facilityDeadline(world),',
              '    facility: null,',
          )

          replace_once(
              'server/src/leaderboards.js',
              "import { processFacilityGroupWorld } from './facility-groups.js';\n",
              '',
          )
          text = Path('server/src/leaderboards.js').read_text()
          text = text.replace('  processFacilityGroupWorld(world, now, { migrate });\n', '')
          Path('server/src/leaderboards.js').write_text(text)

          replace_once(
              'server/src/runtime-store-core.js',
              "import { processWeeklyCashSettlementWorld } from './weekly-cash-settlement.js';\n",
              "import { processWeeklyCashSettlementWorld } from './weekly-cash-settlement.js';\nimport { settleProductionForDueContractParticipants } from './production-settlement.js';\n",
          )
          replace_once(
              'server/src/runtime-store-core.js',
              "  'facility',\n",
              '',
          )
          text = Path('server/src/runtime-store-core.js').read_text()
          text = text.replace(
              '        processProductionContracts(world, now);',
              '        settleProductionForDueContractParticipants(world, now);\n        processProductionContracts(world, now);',
          )
          Path('server/src/runtime-store-core.js').write_text(text)

          replace_once(
              'server/src/runtime-action-executor.js',
              "import { applyFacilityGroupAction, processFacilityGroupWorld } from './facility-groups.js';\n",
              "import { applyFacilityGroupAction, processFacilityGroupWorld } from './facility-groups.js';\nimport { applyProductionSettlementClaim, settleProductionForPlayerServerSide } from './production-settlement.js';\n",
          )
          replace_once(
              'server/src/runtime-action-executor.js',
              "      if (researchAccess) {\n        gameResult = researchAccess;",
              "      if (action === 'settleProduction') {\n        gameResult = { ok: true, message: '生产结算已由服务器校验并入账' };\n      } else if (researchAccess) {\n        gameResult = researchAccess;",
          )
          replace_once(
              'server/src/runtime-action-executor.js',
              "    ensurePlayerWeeklyCashSettlement(player, now);\n    if (!store.scheduledProcessing) {",
              "    ensurePlayerWeeklyCashSettlement(player, now);\n    if (payload?.productionSettlement) {\n      applyProductionSettlementClaim(world, Number(user.id), payload.productionSettlement, now);\n    } else {\n      settleProductionForPlayerServerSide(world, Number(user.id), now);\n    }\n    if (!store.scheduledProcessing) {",
          )

          replace_once(
              'server/src/world-storage-v2.js',
              "  'setFacilityRecipe',\n",
              "  'setFacilityRecipe',\n  'settleProduction',\n",
          )

          replace_once(
              'server/src/game-routes.js',
              "  if (method === 'POST' && path === '/api/game/check-in') return { action: 'checkIn', category: 'general' };\n",
              "  if (method === 'POST' && path === '/api/game/check-in') return { action: 'checkIn', category: 'general' };\n  if (method === 'POST' && path === '/api/game/production/settle') return { action: 'settleProduction', category: 'general' };\n",
          )

          replace_once(
              'server/src/app.js',
              "import { measureRequestPhase, setRequestGauge } from './request-performance.js';\n",
              "import { measureRequestPhase, setRequestGauge } from './request-performance.js';\nimport { createProductionSettlementBasis } from './production-settlement.js';\n",
          )
          replace_once(
              'server/src/app.js',
              'const store = new EconomyStore(databasePath);',
              'const store = new EconomyStore(databasePath, { initialSchedulerDelayMs: 1_000 });',
          )
          replace_once(
              'server/src/app.js',
              "    if (method === 'POST' && path === '/api/game/session') {",
              "    if (method === 'GET' && path === '/api/game/production/basis') {\n      const now = Date.now();\n      const productionSettlement = store.worldCache?.world\n        ? createProductionSettlementBasis(store.worldCache.world, Number(user.id), now)\n        : store.transaction(() => {\n            const { world } = store.loadWorld(now);\n            return createProductionSettlementBasis(world, Number(user.id), now);\n          }, { immediate: false });\n      sendJson(response, 200, { productionSettlement });\n      return;\n    }\n\n    if (method === 'POST' && path === '/api/game/session') {",
          )

          replace_once(
              'server/src/storage.js',
              '    schedulerMaxDelayMs = 2_147_000_000,\n    writeExecutorOptions = {},',
              '    schedulerMaxDelayMs = 2_147_000_000,\n    initialSchedulerDelayMs = 0,\n    writeExecutorOptions = {},',
          )
          replace_once(
              'server/src/storage.js',
              '  this.schedulerMaxDelayMs = Math.max(1_000, Number(schedulerMaxDelayMs) || 2_147_000_000);\n',
              '  this.schedulerMaxDelayMs = Math.max(1_000, Number(schedulerMaxDelayMs) || 2_147_000_000);\n  this.initialSchedulerDelayMs = Math.max(0, Number(initialSchedulerDelayMs) || 0);\n',
          )
          replace_once(
              'server/src/storage.js',
              '      : now;\n    if (planned === null) {',
              '      : now + this.initialSchedulerDelayMs;\n    if (planned === null) {',
          )
          replace_once(
              'server/src/runtime-store-core.js',
              '      : now;\n    if (planned === null) {',
              '      : now + this.initialSchedulerDelayMs;\n    if (planned === null) {',
          )

          replace_once(
              'server/src/facility-groups.js',
              "    cycleStaffingRateBps: _legacyCycleStaffingRateBps,\n    ...publicGroup",
              "    cycleStaffingRateBps: _legacyCycleStaffingRateBps,\n    productionWageCarryNumerator: _productionWageCarryNumerator,\n    productionEmploymentTotalMicros: _productionEmploymentTotalMicros,\n    productionEmploymentAllocatedMicros: _productionEmploymentAllocatedMicros,\n    ...publicGroup",
          )

          replace_once(
              'src/api/game.ts',
              "import { acceptServerNow, resetServerClock } from '../utils/serverClock.js';\n",
              "import { acceptServerNow, resetServerClock } from '../utils/serverClock.js';\nimport { createProductionSettlementClaim, type ProductionSettlementBasis } from '../../shared/production-settlement.js';\n",
          )
          replace_once(
              'src/api/game.ts',
              'let currentSaveEpoch: number | null = null;\n',
              'let currentSaveEpoch: number | null = null;\nlet productionSettlementBasis: ProductionSettlementBasis | null = null;\n',
          )
          replace_once(
              'src/api/game.ts',
              "export class GameApiError extends Error {\n  status: number;\n  constructor(status: number, message: string) {\n    super(message);\n    this.name = 'GameApiError';\n    this.status = status;\n  }\n}",
              "export class GameApiError extends Error {\n  status: number;\n  code: string;\n  constructor(status: number, message: string, code = '') {\n    super(message);\n    this.name = 'GameApiError';\n    this.status = status;\n    this.code = code;\n  }\n}",
          )
          replace_once(
              'src/api/game.ts',
              '  currentSaveEpoch = null;\n  resetServerClock();',
              '  currentSaveEpoch = null;\n  productionSettlementBasis = null;\n  resetServerClock();',
          )
          replace_once(
              'src/api/game.ts',
              "        const payload = (await response.json()) as { message?: string };\n        if (payload.message) message = payload.message;\n      } catch { /* preserve generic message */ }\n      throw new GameApiError(response.status, message);",
              "        const payload = (await response.json()) as { message?: string; code?: string };\n        if (payload.message) message = payload.message;\n        throw new GameApiError(response.status, message, String(payload.code || ''));\n      } catch (reason) {\n        if (reason instanceof GameApiError) throw reason;\n      }\n      throw new GameApiError(response.status, message);",
          )
          replace_once(
              'src/api/game.ts',
              "function postAction(path: string, body: Record<string, unknown> = {}) {\n  return request<GameActionResponse>(path, { method: 'POST', body: JSON.stringify(body) });\n}",
              "async function postAction(path: string, body: Record<string, unknown> = {}) {\n  const claim = createProductionSettlementClaim(productionSettlementBasis);\n  const payload = claim ? { ...body, productionSettlement: claim } : body;\n  try {\n    const response = await request<GameActionResponse>(path, { method: 'POST', body: JSON.stringify(payload) });\n    productionSettlementBasis = null;\n    return response;\n  } catch (reason) {\n    if (claim && reason instanceof GameApiError && reason.code.startsWith('PRODUCTION_SETTLEMENT_')) {\n      productionSettlementBasis = null;\n      return request<GameActionResponse>(path, { method: 'POST', body: JSON.stringify(body) });\n    }\n    throw reason;\n  }\n}\n\nexport async function settlePendingProduction(): Promise<GameActionResponse | null> {\n  if (!createProductionSettlementClaim(productionSettlementBasis)) return null;\n  return postAction('/production/settle');\n}",
          )
          replace_once(
              'src/api/game.ts',
              "  const suffix = query ? `?${query}` : '';\n  return request<GameStatePollResponse>(`/state${suffix}`, { method: 'GET', signal });",
              "  const suffix = query ? `?${query}` : '';\n  const response = await request<GameStatePollResponse>(`/state${suffix}`, { method: 'GET', signal });\n  const basis = await request<{ productionSettlement: ProductionSettlementBasis }>('/production/basis', { method: 'GET', signal });\n  productionSettlementBasis = basis.productionSettlement;\n  return response;",
          )

          replace_once(
              'src/app/gameViewModel.ts',
              '  resetGameStateDelivery,\n',
              '  resetGameStateDelivery,\n  settlePendingProduction,\n',
          )
          replace_once(
              'src/app/gameViewModel.ts',
              "        acceptVersionedState(\n          response.revision,\n          response.state,\n          'refresh',\n          undefined,\n          response.changedPartitions,\n        );\n        setLoadError('');",
              "        acceptVersionedState(\n          response.revision,\n          response.state,\n          'refresh',\n          undefined,\n          response.changedPartitions,\n        );\n        const settlement = await settlePendingProduction();\n        if (settlement) {\n          const settledState = await getGameState(settlement.revision, controller.signal);\n          if (mode === 'normal' && actionsInFlightRef.current > 0) return;\n          acceptVersionedState(\n            settledState.revision,\n            settledState.state,\n            'refresh',\n            settlement.result.message,\n            settledState.changedPartitions,\n          );\n        }\n        setLoadError('');",
          )

          replace_once(
              'package.json',
              '    "verify:production-settlement": "node scripts/verify-production-settlement-layout.mjs",\n',
              '    "verify:production-settlement": "node scripts/verify-production-settlement-layout.mjs",\n    "verify:production-lazy-settlement": "node scripts/verify-production-lazy-settlement.mjs",\n',
          )
          replace_once(
              'package.json',
              '&& npm run verify:production-settlement && node scripts/verify-production-desktop-layout.mjs',
              '&& npm run verify:production-settlement && npm run verify:production-lazy-settlement && node scripts/verify-production-desktop-layout.mjs',
          )

          server_design = Path('docs/SERVER_ARCHITECTURE_AND_DEPLOYMENT_DESIGN.md')
          text = server_design.read_text()
          marker = '## 生产懒结算与调度边界'
          if marker not in text:
              text += '''\n\n## 生产懒结算与调度边界\n\n正式工厂生产采用按玩家懒结算。浏览器根据服务器只读生产基线与 `settleThrough` 服务器时间计算生产结算提案；浏览器不得提交资金、库存、工资或产出增量，只提交每个工厂组的完成周期数。服务器重新生成相同基线摘要，以闭式 staffing/carry 公式验证声明周期数，并要求该周期数是在当前权威资金与原料约束下的最大合法值，再在同一权威事务内生成资金、原料、产出、就业与工厂状态变化。结算公式按工厂组顺序共享玩家资金与库存，服务端验证复杂度不得随停机期间欠周期数线性增长。\n\n全局世界截止时间计划不得注册玩家工厂周期，排行榜、市场、启动调度与常规 `/health` 不得通过 `processFacilityGroupWorld` 扫描全服工厂。生产截止时间只在当前玩家上线、动作附带结算声明或明确受影响的到期合同参与者范围内物化；旧客户端或合同到期允许服务器使用同一闭式公式为对应玩家生成提案作为兼容兜底，但不得扩展为全玩家遍历。生产工资使用微单位余数与累计人口分配账本，保证同一工资政策输入序列下的最终资金与人口就业结果不依赖结算批次大小。正式 API 冷启动额外保留 1 秒初始调度让渡窗口，使真实 `/health` 可以在后台世界处理前响应；45 秒部署就绪门槛不因此放宽。\n'''
              server_design.write_text(text)

          industry = Path('docs/INDUSTRY_AND_PRODUCTION_DESIGN.md')
          text = industry.read_text()
          marker = '## 按玩家懒结算'
          if marker not in text:
              text += '''\n\n## 按玩家懒结算\n\n持续生产的经济语义保持服务器权威，但离线欠周期的搜索计算由客户端承担：客户端读取服务器生产基线，使用共享闭式公式计算每个工厂组在服务器结算时间之前可完成的最大合法周期数，服务端只验证该提案并原子记账。客户端不能指定产量、成本、原料扣除或人口工资。工厂组按照服务器返回的稳定顺序共享资金和库存，上游组本次结算产生的商品可以成为后续组的投入。生产结果必须与结算批次大小无关；staffing carry、生产工资微单位余数和人口就业累计分配都必须跨结算保存，禁止通过改变结算频率获得额外产量或工资舍入收益。\n'''
              industry.write_text(text)

          docs = Path('docs/README.md')
          text = docs.read_text()
          marker = '77. 工厂持续生产采用按玩家懒结算'
          if marker not in text:
              anchor = '76. Economy API 的部署就绪与共享运行时目录细则归 `SERVER_ARCHITECTURE_AND_DEPLOYMENT_DESIGN.md`'
              pos = text.find(anchor)
              if pos < 0:
                  raise SystemExit('docs/README.md rule 76 anchor missing')
              end = text.find('\n\n', pos)
              if end < 0:
                  end = len(text)
              rule = "\n\n77. 工厂持续生产采用按玩家懒结算：客户端只能根据服务器生产基线与服务器时间计算最大合法周期提案，服务端必须重新生成基线摘要并用共享闭式公式验证周期数与资源约束后原子记账；全局截止时间、排行榜、市场和服务启动不得扫描全服工厂或逐周期重放离线生产。旧客户端及到期合同兜底只能结算当前玩家或明确受影响参与者。staffing carry、生产工资微单位余数和人口就业累计分配必须使生产结果不受结算批次大小影响。该规则归属 `INDUSTRY_AND_PRODUCTION_DESIGN.md` 与 `SERVER_ARCHITECTURE_AND_DEPLOYMENT_DESIGN.md`，并由 `scripts/verify-production-lazy-settlement.mjs` 和服务器测试防回退。"
              text = text[:end] + rule + text[end:]
              docs.write_text(text)

          root = Path('README.md')
          text = root.read_text()
          marker = '## 工厂生产懒结算'
          if marker not in text:
              text += '''\n\n## 工厂生产懒结算\n\n工厂离线生产不再由全服调度器逐周期回放。客户端通过 `GET /api/game/production/basis` 获取服务器生产基线并计算最大合法周期提案，使用 `POST /api/game/production/settle` 或随普通动作附带提案；服务器重新校验后才修改资金、库存、产出和就业。旧客户端以及到期合同只对相关玩家使用同一闭式算法兜底，不执行全玩家工厂扫描。\n'''
              root.write_text(text)
          PY
      - name: Install dependencies
        run: npm ci
      - name: Verify focused production changes
        run: |
          node scripts/verify-production-lazy-settlement.mjs
          node --test server/test/production-lazy-settlement.test.js
          npm run server:check
          npm run typecheck
      - name: Commit integration
        shell: bash
        run: |
          git config user.name 'RIVERSOFT'
          git config user.email '105160096+RIVERS0FT@users.noreply.github.com'
          git rm .github/workflows/apply-production-lazy-settlement.yml
          git add server/src server/test shared src scripts docs README.md package.json
          git diff --cached --check
          git commit -m 'implement lazy production settlement'
          git push origin HEAD:agent/production-lazy-settlement
# trigger
