name: Fix compact command revision

on:
  push:
    branches:
      - codex/daily-market-freeze-timeout-fix
    paths:
      - .github/workflows/fix-compact-command-revision.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add command revision to compact trade acknowledgement
        run: |
          python3 - <<'PY'
          from pathlib import Path

          app = Path('server/src/app.js')
          text = app.read_text(encoding='utf-8')
          old = """    if (compactManualCommodityOrder) {\n      sendJson(response, 200, actionResponse);\n      return;\n    }\n"""
          new = """    if (compactManualCommodityOrder) {\n      sendJson(response, 200, {\n        ...actionResponse,\n        commandRevision: actionResponse.revision,\n      });\n      return;\n    }\n"""
          if old not in text:
              raise SystemExit('compact commodity acknowledgement block not found')
          app.write_text(text.replace(old, new, 1), encoding='utf-8')

          for path in [
              Path('scripts/verify-market-action-latency.mjs'),
              Path('scripts/verify-state-delivery-capacity.mjs'),
          ]:
              text = path.read_text(encoding='utf-8')
              text = text.replace("'sendJson(response, 200, actionResponse);',", "'commandRevision: actionResponse.revision',")
              text = text.replace('"sendJson(response, 200, actionResponse);",', '"commandRevision: actionResponse.revision",')
              path.write_text(text, encoding='utf-8')

          for path in [
              Path('docs/SERVER_ARCHITECTURE_AND_DEPLOYMENT_DESIGN.md'),
              Path('docs/UNIFIED_ASSET_ORDER_BOOK_DESIGN.md'),
          ]:
              text = path.read_text(encoding='utf-8')
              text = text.replace('HTTP 立即返回 `{ result, revision }` 精简确认', 'HTTP 立即返回 `{ result, revision, commandRevision }` 精简确认')
              text = text.replace('服务器事务和幂等结果落盘后立即返回精简确认', '服务器事务和幂等结果落盘后立即返回带 `commandRevision` 的精简确认')
              path.write_text(text.rstrip('\n') + '\n', encoding='utf-8')
          PY
      - name: Remove temporary workflow
        run: rm -f .github/workflows/fix-compact-command-revision.yml
      - name: Check diff
        run: git diff --check
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "补齐即时交易命令修订号"
          git push origin HEAD:codex/daily-market-freeze-timeout-fix
