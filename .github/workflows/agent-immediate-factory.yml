name: Apply immediate factory participation

on:
  pull_request:
    branches:
      - main
    types:
      - opened

permissions:
  contents: write

concurrency:
  group: agent-immediate-factory-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply-and-verify:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.4.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply approved production-state migration
        shell: bash
        run: |
          cat > /tmp/apply-immediate-factory.mjs.gz.b64 <<'AGENT_PATCH'
