name: C2 authority sync

on:
  push:
    branches:
      - feature/c2-production-methods

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.4.0'
      - name: Sync authoritative docs and current world version
        run: node scripts/sync-c2-production-docs.mjs
      - name: Complete UI authority rule
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'docs/UI_DESIGN_SYSTEM.md';
          let content = fs.readFileSync(path, 'utf8');
          if (!content.includes('未解锁作业制度')) {
            content = `${content.trimEnd()}\n\n### 商品与生产方式扩展\n\n当前 38 种正式商品继续由服务器目录动态驱动，商品图片映射覆盖工业燃料与工业化学品；服务器未来返回未知商品 ID 时必须回退到通用商品 SVG，不得导致布局或市场卡片失效。\n\n生产方式下拉选择继续使用共享 \`RichSelectInput\` 的 \`production-config\` 变体和 \`combobox\`／\`listbox\`／\`option\` 语义。未解锁作业制度保持在同一个生产方案槽中并禁用，详情显示所需研发科技；作业制度说明不得显示。不得恢复 \`radiogroup\`、选择卡、按钮组、可见原生 \`select\`，菜单允许宽于触发器，不得复制第二套 Popover、键盘导航或刷新状态。\n`;
            fs.writeFileSync(path, content);
          }
          NODE
      - name: Commit synchronized authority
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            README.md \
            docs/README.md \
            docs/PRODUCT_AND_GAMEPLAY_DESIGN.md \
            docs/GEM_ACCELERATION_AND_DYNAMIC_EXCHANGE_DESIGN.md \
            docs/INDUSTRY_AND_PRODUCTION_DESIGN.md \
            docs/UNIFIED_ASSET_ORDER_BOOK_DESIGN.md \
            docs/WAREHOUSE_EXPANSION_DESIGN.md \
            docs/PAGE_CONTENT_AND_NAVIGATION_DESIGN.md \
            docs/UI_DESIGN_SYSTEM.md \
            docs/SERVER_ARCHITECTURE_AND_DEPLOYMENT_DESIGN.md \
            docs/LOCAL_ACTIVITY_LOG_DESIGN.md \
            docs/GIFT_CODE_AND_ADMIN_DESIGN.md \
            server/src/storage.js \
            src/types.ts \
            scripts/verify-document-authority.mjs \
            scripts/verify-*.mjs
          git commit -m "docs: synchronize C2 production authority"
          git push origin HEAD:feature/c2-production-methods