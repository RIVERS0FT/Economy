name: Apply notification hover constraints

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
    paths:
      - .github/workflows/apply-notification-hover.yml
      - scripts/patch-notification-hover.mjs

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'codex/notification-center'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/notification-center
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Constrain hover to mouse-capable input
        run: node scripts/patch-notification-hover.mjs
      - name: Commit interaction update and remove migration files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/styles/notification-center.css
          git rm -- .github/workflows/apply-notification-hover.yml scripts/patch-notification-hover.mjs
          git commit -m "fix: constrain notification hover interactions"
          git push origin HEAD:codex/notification-center
