name: Temporary Daily Contract Server Design Fix

on:
  push:
    branches:
      - feature/daily-regional-supply-contracts-impl

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/daily-regional-supply-contracts-impl
          fetch-depth: 0
      - name: Calibrate daily contract server design
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/temp-fix-daily-contract-server-design.py
          rm .github/workflows/temp-fix-daily-contract-server-design.yml
          rm scripts/temp-fix-daily-contract-server-design.py
          git config user.name "RIVERSOFT"
          git config user.email "105160096+RIVERS0FT@users.noreply.github.com"
          git add -A
          git diff --cached --check
          node scripts/verify-daily-supply-contracts.mjs
          node scripts/verify-contract-audit.mjs
          git commit -m "校准每日合同服务器权威设计"
          git push origin HEAD:feature/daily-regional-supply-contracts-impl
