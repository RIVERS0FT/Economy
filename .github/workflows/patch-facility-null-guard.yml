name: Patch facility navigation null guard

on:
  push:
    branches:
      - fix/facility-detail-summary-local-product

permissions:
  contents: write

jobs:
  patch-source:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch null guard
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/pages/production/ProductionFacilityDetail.tsx')
          text = path.read_text()
          old = "if (currentLocation?.type === 'regional-facility') {\n      pageNavigation.pushPage({"
          new = "if (currentLocation?.type === 'regional-facility' && pageNavigation) {\n      pageNavigation.pushPage({"
          if text.count(old) != 1:
              raise SystemExit(f'expected one navigation guard, got {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check
      - name: Commit source fix
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/pages/production/ProductionFacilityDetail.tsx
          git commit -m "修复工厂详情本地导航空值收窄 [source-synced]"
          git push origin HEAD:fix/facility-detail-summary-local-product
