name: Finalize commercial contract audit

on:
  push:
    branches:
      - agent/contract-types

permissions:
  contents: write

concurrency:
  group: agent-contract-audit-fix
  cancel-in-progress: false

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/contract-types
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.4.0
          cache: npm
      - name: Apply audit conservation fix
        shell: bash
        run: |
          set -euo pipefail
          python3 .agent-contract-audit-fix.py
          rm -f .agent-contract-audit-fix.py
          rm -f .github/workflows/agent-contract-audit-fix.yml
          git add -u -- .agent-contract-audit-fix.py .github/workflows/agent-contract-audit-fix.yml
          git diff --check
      - name: Install dependencies
        run: npm ci
      - name: Validate focused contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check server/src/commercial-contracts.js
          node --check server/src/contract-audit-store.js
          node --test server/test/commercial-contracts.test.js
          node scripts/verify-contract-types.mjs
          npm run typecheck
      - name: Validate full build
        run: npm run build
      - name: Commit formal audit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            server/src/commercial-contracts.js \
            server/src/contract-audit-store.js \
            server/test/commercial-contracts.test.js \
            scripts/verify-contract-types.mjs
          git diff --cached --check
          git commit -m "完善商业合同资产审计守恒"
          git push origin HEAD:agent/contract-types
