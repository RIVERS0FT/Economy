name: Fix remaining five-tab browser tests

on:
  push:
    branches:
      - feat/commercial-buildings

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/commercial-buildings
          fetch-depth: 0
      - name: Align remaining province browser tests
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          all_pages = Path('tests/browser/all-pages-preview.spec.ts')
          text = all_pages.read_text()
          old = "  await expect(page.getByRole('tablist', { name: '得克萨斯页面分区' }).getByRole('tab')).toHaveCount(4);"
          new = "  const provinceTabs = page.getByRole('tablist', { name: '得克萨斯页面分区' });\n  await expect(provinceTabs.getByRole('tab')).toHaveCount(5);\n  await expect(provinceTabs.getByRole('tab', { name: '商业', exact: true })).toBeVisible();\n  await expect(provinceTabs.getByRole('tab', { name: '工业', exact: true })).toBeVisible();"
          if old not in text:
              raise SystemExit('missing stale four-tab count in all-pages-preview')
          all_pages.write_text(text.replace(old, new, 1))

          locked = Path('tests/browser/province-locked-access.spec.ts')
          text = locked.read_text()
          old = "  await page.getByRole('tab', { name: '建筑' }).click();"
          new = "  await page.getByRole('tab', { name: '工业', exact: true }).click();"
          if old not in text:
              raise SystemExit('missing stale building tab in province-locked-access')
          locked.write_text(text.replace(old, new, 1))

          Path('.github/workflows/fix-remaining-five-tab-browser-tests.yml').unlink()
          PY
      - name: Commit browser test alignment
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "test: 对齐剩余地区五分区浏览器回归"
          git push origin HEAD:feat/commercial-buildings
