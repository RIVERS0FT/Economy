name: Apply chart hover visibility fix

on:
  push:
    branches:
      - fix/chart-hover-visibility
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]' && (github.event_name == 'push' || github.head_ref == 'fix/chart-hover-visibility')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/chart-hover-visibility
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24.4.0
          cache: npm

      - name: Restore and apply reviewed patch
        shell: bash
        run: |
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/RIVERS0FT/Economy/d8130844f7b29465d711f8124700b9d4cd811df1/.github/workflows/agent-chart-hover-fix.yml \
            --output /tmp/chart-hover-source.yml
          python3 <<'PY'
          from pathlib import Path
          lines = Path('/tmp/chart-hover-source.yml').read_text(encoding='utf-8').splitlines()
          start = next(index for index, line in enumerate(lines) if "python3 <<'PY'" in line) + 1
          end = next(index for index in range(start, len(lines)) if lines[index].strip() == 'PY')
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines[start:end]) + '\n'
          Path('/tmp/apply-chart-hover-fix.py').write_text(script, encoding='utf-8')
          PY
          python3 /tmp/apply-chart-hover-fix.py
          python3 <<'PY'
          from pathlib import Path

          verifier = Path('scripts/verify-echarts-adoption.mjs')
          verifier_content = verifier.read_text(encoding='utf-8')
          verifier_old = "'data.echartsCssColorsResolved'"
          verifier_new = "'dataset.echartsCssColorsResolved'"
          if verifier_content.count(verifier_old) != 1:
              raise SystemExit(f'expected one verifier marker, found {verifier_content.count(verifier_old)}')
          verifier.write_text(verifier_content.replace(verifier_old, verifier_new), encoding='utf-8')

          browser_test = Path('tests/browser/chart-hover-visibility.spec.ts')
          browser_content = browser_test.read_text(encoding='utf-8')
          browser_url_old = "await page.goto('/chart-hover-runtime-test.html');"
          browser_url_new = "await page.goto('chart-hover-runtime-test.html');"
          if browser_content.count(browser_url_old) != 1:
              raise SystemExit(f'expected one browser URL, found {browser_content.count(browser_url_old)}')
          browser_content = browser_content.replace(browser_url_old, browser_url_new)

          helper_anchor = "async function assertStableHover(page: Page, testId: string) {"
          helper = '''async function hoverInsideFill(page: Page, mark: Locator) {
  const point = await mark.evaluate((element) => {
    const geometry = element as SVGGeometryElement;
    const matrix = geometry.getScreenCTM();
    const box = geometry.getBBox();
    if (matrix && typeof geometry.isPointInFill === 'function') {
      for (let yStep = 1; yStep < 10; yStep += 1) {
        for (let xStep = 1; xStep < 10; xStep += 1) {
          const localPoint = new DOMPoint(
            box.x + box.width * xStep / 10,
            box.y + box.height * yStep / 10,
          );
          if (!geometry.isPointInFill(localPoint)) continue;
          const screenPoint = localPoint.matrixTransform(matrix);
          return { x: screenPoint.x, y: screenPoint.y };
        }
      }
    }
    const bounds = element.getBoundingClientRect();
    return { x: bounds.left + bounds.width / 2, y: bounds.top + bounds.height / 2 };
  });
  await page.mouse.move(point.x, point.y);
}

'''
          if browser_content.count(helper_anchor) != 1:
              raise SystemExit(f'expected one helper anchor, found {browser_content.count(helper_anchor)}')
          browser_content = browser_content.replace(helper_anchor, helper + helper_anchor)

          hover_old = "  await mark.hover({ force: true });"
          hover_new = "  await hoverInsideFill(page, mark);"
          if browser_content.count(hover_old) != 1:
              raise SystemExit(f'expected one hover call, found {browser_content.count(hover_old)}')
          browser_test.write_text(browser_content.replace(hover_old, hover_new), encoding='utf-8')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify ECharts architecture
        run: npm run verify:echarts

      - name: Run chart hover browser regression
        run: npx playwright test tests/browser/chart-hover-visibility.spec.ts

      - name: Run production build
        run: npm run build

      - name: Check and publish branch commit
        shell: bash
        run: |
          git diff --check
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            src/components/charts/resolveEChartsCssColors.ts \
            src/components/charts/EconomyChart.tsx \
            src/components/charts/chartOptions.ts \
            src/components/charts/PriceSparkline.tsx \
            src/components/charts/AssetAllocationChart.tsx \
            src/components/charts/AdminCharts.tsx \
            docs/UI_DESIGN_SYSTEM.md \
            scripts/verify-echarts-adoption.mjs \
            chart-hover-runtime-test.html \
            src/chart-hover-runtime-test.tsx \
            tests/browser/chart-hover-visibility.spec.ts
          git commit -m "修复图表悬浮可见性"
          git push origin HEAD:fix/chart-hover-visibility
