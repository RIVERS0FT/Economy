name: One-shot restore player avatar authority

on:
  push:
    branches:
      - codex/transport-route-cards-footer

permissions:
  contents: write

jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: codex/transport-route-cards-footer
          fetch-depth: 0
      - name: Restore player avatar authority wording
        shell: python
        run: |
          from pathlib import Path

          path = Path('docs/UI_DESIGN_SYSTEM.md')
          text = path.read_text(encoding='utf-8')
          old = '玩家头像统一由 `PlayerAvatar` 渲染。服务器实际资源固定为 64×64 WebP；加载失败或旧玩家尚未设置头像时使用玩家名称首字符作为本地回退，不请求大图。设置页选择原图后必须先在浏览器本地居中裁成正方形、缩放至 64×64 并压缩，再上传最终缩略图；原图不得发送到服务器。状态栏和设置页不得各自实现第二套头像加载逻辑。'
          new = '玩家头像统一由 `PlayerAvatar` 渲染；状态栏左侧玩家头像与排行榜玩家列固定复用 `PlayerAvatar`。头像盒必须始终保持 `1:1` 正方形；服务器实际资源固定为 64×64 WebP。加载失败或旧玩家尚未设置头像时使用玩家名称首字符作为本地回退，不请求大图。设置页选择原图后必须先在浏览器本地居中裁成正方形、缩放至 64×64 并压缩，再上传最终缩略图；原图不得发送到服务器。状态栏、设置页和排行榜不得各自实现第二套头像加载逻辑。'
          if old not in text:
              raise SystemExit('player avatar authority paragraph not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
      - name: Commit restored authority and remove one-shot workflow
        run: |
          git config user.name "RIVERSOFT"
          git config user.email "105160096+RIVERS0FT@users.noreply.github.com"
          rm .github/workflows/one-shot-restore-player-avatar-authority.yml
          git add docs/UI_DESIGN_SYSTEM.md .github/workflows/one-shot-restore-player-avatar-authority.yml
          git commit -m "Restore player avatar authority after design compaction"
          git push origin HEAD:codex/transport-route-cards-footer
