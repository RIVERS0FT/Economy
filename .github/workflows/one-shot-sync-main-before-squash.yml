name: One-shot sync latest main before squash

on:
  push:
    branches:
      - codex/transport-route-cards-footer

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: codex/transport-route-cards-footer
          fetch-depth: 0
      - name: Merge latest main and remove one-shot workflow
        run: |
          set -euo pipefail
          git config user.name "RIVERSOFT"
          git config user.email "105160096+RIVERS0FT@users.noreply.github.com"
          git fetch origin main
          git merge --no-commit --no-ff origin/main
          rm .github/workflows/one-shot-sync-main-before-squash.yml
          git add -A
          git commit -m "Sync latest main before squash merge"
          git push origin HEAD:codex/transport-route-cards-footer
