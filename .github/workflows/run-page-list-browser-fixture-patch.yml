name: Run page-list browser fixture patch
on:
  push:
    branches: [fix/unify-page-entity-lists]
    paths:
      - scripts/patch-page-list-browser-fixture.py
      - .github/workflows/run-page-list-browser-fixture-patch.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/unify-page-entity-lists
      - run: python scripts/patch-page-list-browser-fixture.py
      - run: git diff --check
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/browser/all-pages-preview.spec.ts src/styles/entity-list-header.css src/styles/market-commodity-row.css scripts/verify-page-content.mjs
          git commit -m "稳定统一页面列表浏览器回归"
          git push
