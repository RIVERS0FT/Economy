name: Apply storage V2 deployment backup protection

on:
  push:
    branches:
      - perf/segmented-world-storage-v2

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Verify storage V2 deployment backup'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/segmented-world-storage-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.4.0'
          cache: npm
      - name: Fix deployment backup verifier
        run: |
          node scripts/.fix-storage-v2-backup-verifier.mjs
          git diff --check
      - name: Commit verifier fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/verify-deployment-storage.mjs
          git commit -m 'Fix storage V2 backup source integrity verification'
          git push origin HEAD:perf/segmented-world-storage-v2
      - run: npm ci
      - name: Verify deployment storage and full build
        run: |
          node scripts/verify-deployment-storage.mjs
          npm run build
          npm run test:stress
