name: Patch login session fast path v4

on:
  push:
    branches:
      - fix/login-session-fast-path
    paths:
      - .github/workflows/patch-login-session-fast-path-v4.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/login-session-fast-path
          fetch-depth: 0
      - name: Apply and commit final implementation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/patch-login-session-fast-path-v2.yml').read_text()
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          script = textwrap.dedent(workflow[start:end])
          needle = "if market.count(old_process) != 1:\n"
          replacement = "old_process = textwrap.indent(old_process, '  ')\nnew_process = textwrap.indent(new_process, '  ')\nif market.count(old_process) != 1:\n"
          if script.count(needle) != 1:
              raise SystemExit('v2 market process guard not found exactly once')
          script = script.replace(needle, replacement, 1)
          exec(compile(script, 'patch-login-session-fast-path-v4', 'exec'), {'__name__': '__main__'})
          PY
          git diff --check
          git status --short
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/api/auth.ts src/app/App.tsx server/src/app.js server/src/invitations.js server/src/registration-store.js server/src/market-demand.js server/src/market-demand/signals.js server/test/invitations.test.js server/test/state-economic-baselines.test.js tests/browser/application-error-state.spec.ts scripts/verify-email-registration.mjs scripts/verify-auth-three-layer.mjs scripts/verify-runtime-efficiency.mjs docs/REGISTRATION_INVITE_FLOW_DESIGN.md docs/AUTHORITATIVE_COUNTDOWN_DESIGN.md docs/SERVER_ARCHITECTURE_AND_DEPLOYMENT_DESIGN.md
          git commit -m "修复登录会话回退并优化州级需求规划"
          git push origin HEAD:fix/login-session-fast-path
