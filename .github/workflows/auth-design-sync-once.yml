name: Auth design sync once

on:
  push:
    branches:
      - codex/auth-entry-reset-20260830

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: codex/auth-entry-reset-20260830
          fetch-depth: 0

      - name: Update authoritative authentication design
        run: python3 scripts/sync-auth-design-once.py

      - name: Commit synchronized design
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo AUTH_DESIGN_ALREADY_SYNCHRONIZED
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/PAGE_CONTENT_AND_NAVIGATION_DESIGN.md docs/SERVER_ARCHITECTURE_AND_DEPLOYMENT_DESIGN.md docs/README.md README.md scripts/verify-email-registration.mjs
          git commit -m '统一认证入口权威设计'
          git push origin HEAD:codex/auth-entry-reset-20260830
