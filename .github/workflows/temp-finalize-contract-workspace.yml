name: Temporary Finalize Contract Workspace

on:
  push:
    branches:
      - feature/daily-regional-supply-contracts-impl

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/daily-regional-supply-contracts-impl
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.4.0'
          cache: npm
      - name: Apply workspace finalizer
        run: python3 scripts/temp-finalize-contract-workspace.py
      - name: Apply audit participant finalizer
        run: python3 scripts/temp-fix-contract-audit-participants.py
      - name: Normalize generated verifiers and browser regressions
        run: python3 scripts/temp-normalize-final-contract.py
      - name: Check diff
        run: git diff --check
      - name: Install dependencies
        run: npm ci
      - name: Verify contract layout
        run: npm run verify:contract-layout
      - name: Verify gameplay decision support
        run: npm run verify:gameplay-decision-support
      - name: Verify contract audit
        run: npm run verify:contract-audit
      - name: Verify form controls
        run: node scripts/verify-form-controls.mjs
      - name: Generate local preview
        run: npm run generate:local-preview
      - name: Typecheck
        run: npm run typecheck
      - name: Compile targeted browser tests
        run: npx playwright test --list tests/browser/contract-layout.spec.ts tests/browser/contract-workspace.spec.ts tests/browser/contract-attention-background.spec.ts
      - name: Test contract server paths
        run: node --test server/test/contract-audit.test.js server/test/daily-supply-contracts.test.js server/test/state-projection-cache.test.js server/test/commercial-contracts.test.js
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run contract browser regressions
        shell: bash
        run: |
          set +e
          npx playwright test tests/browser/contract-layout.spec.ts tests/browser/contract-workspace.spec.ts tests/browser/contract-attention-background.spec.ts 2>&1 | tee scripts/temp-contract-browser-error.txt
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            git config user.name "RIVERSOFT"
            git config user.email "105160096+RIVERS0FT@users.noreply.github.com"
            git add scripts/temp-contract-browser-error.txt
            git commit -m "记录最新合同浏览器失败"
            git push origin HEAD:feature/daily-regional-supply-contracts-impl
            exit "$status"
          fi
      - name: Commit final contract workspace
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/temp-finalize-contract-workspace.yml
          rm -f scripts/temp-finalize-contract-workspace.py
          rm -f scripts/temp-fix-contract-audit-participants.py
          rm -f scripts/temp-normalize-final-contract.py
          rm -f scripts/temp-participant-finalizer-error.txt
          rm -f scripts/temp-contract-layout-error.txt
          rm -f scripts/temp-contract-browser-error.txt
          git config user.name "RIVERSOFT"
          git config user.email "105160096+RIVERS0FT@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "收尾每日合同工作区与审计可见性"
          git push origin HEAD:feature/daily-regional-supply-contracts-impl
