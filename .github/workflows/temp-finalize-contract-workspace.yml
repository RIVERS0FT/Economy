name: Temporary Finalize Contract Workspace

on:
  push:
    branches:
      - feature/daily-regional-supply-contracts-impl

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/daily-regional-supply-contracts-impl
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.4.0'
          cache: npm
      - name: Apply workspace finalizer
        run: python3 scripts/temp-finalize-contract-workspace.py
      - name: Apply audit participant finalizer
        run: python3 scripts/temp-fix-contract-audit-participants.py
      - name: Normalize generated verifiers and browser regressions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('scripts/verify-contract-layout.mjs')
          text = p.read_text()
          old = """const pageSource = read(pagePath);
          if (pageSource.indexOf('className=\"contract-content-actions\"') > pageSource.indexOf('className=\"contract-summary-grid\"')) failures.push('合同正文发布按钮必须位于摘要卡之前');
          if (pageSource.indexOf('className=\"contract-summary-grid\"') > pageSource.indexOf('className=\"contract-workspace\"')) failures.push('合同摘要必须位于工作区之前');
          """
          new = """const pageSource = read(pagePath);
          const pageLayoutStart = pageSource.indexOf('<PageLayout title=\"合同\"');
          const pageActionIndex = pageSource.indexOf('className=\"contract-content-actions\"', pageLayoutStart);
          const pageSummaryIndex = pageSource.indexOf('className=\"contract-summary-grid\"', pageLayoutStart);
          const pageWorkspaceIndex = pageSource.indexOf('className=\"contract-workspace\"', pageLayoutStart);
          if (pageLayoutStart < 0 || pageActionIndex < 0 || pageSummaryIndex < 0 || pageWorkspaceIndex < 0) failures.push('合同 PageLayout 一级结构不完整');
          else {
            if (pageActionIndex > pageSummaryIndex) failures.push('合同正文发布按钮必须位于摘要卡之前');
            if (pageSummaryIndex > pageWorkspaceIndex) failures.push('合同摘要必须位于工作区之前');
          }
          """
          if old not in text:
              raise SystemExit('missing page-level ordering verifier anchor')
          p.write_text(text.replace(old, new, 1))

          p = Path('scripts/verify-contract-audit.mjs')
          text = p.read_text()
          text = text.replace("includesAll(store, [\"target === 'credits'\", \"target.startsWith('facility:')\", \"json_extract(contract_json, '$.facilityTypeId') = ?\"], 'contract history server target filtering');", "includesAll(auditStore, [\"target === 'credits'\", \"target.startsWith('facility:')\", \"json_extract(contract_json, '$.facilityTypeId') = ?\"], 'contract history server target filtering');")
          p.write_text(text)

          p = Path('tests/browser/contract-layout.spec.ts')
          text = p.read_text().replace("page.locator('.contract-summary-grid')", "page.locator('.ui-page-stack > .contract-summary-grid')")
          p.write_text(text)

          p = Path('tests/browser/contract-workspace.spec.ts')
          text = p.read_text()
          text = text.replace("  await page.route('**/economy-api/game/contracts/history**', async (route) => {\n    await route.fulfill({ json: { history: { items: [], nextCursor: null } } });\n  });", """  await page.route('**/economy-api/game/contracts/history**', async (route) => {
    await route.fulfill({ json: { history: { items: [], nextCursor: null } } });
  });
  await page.route('**/economy-api/game/contracts/performance**', async (route) => {
    await route.fulfill({ json: { performance: { totalEnded: 0, completed: 0, abnormalEnded: 0, defaulted: 0, completionRateBps: 0, compensationPaid: 0, compensationReceived: 0, recent: [] } } });
  });
  await page.route('**/api/game/community-link**', async (route) => {
    await route.fulfill({ json: { communityLink: null } });
  });""", 1)
          text = text.replace("await expect(market.getByText('采购 机械', { exact: true })).toBeVisible();", "await expect(market.getByText('每日额度', { exact: true })).toBeVisible();")
          p.write_text(text)
          PY
      - name: Check diff
        run: git diff --check
      - name: Install dependencies
        run: npm ci
      - name: Verify contract layout
        run: npm run verify:contract-layout
      - name: Verify gameplay decision support
        run: npm run verify:gameplay-decision-support
      - name: Verify contract audit
        run: npm run verify:contract-audit
      - name: Verify form controls
        run: node scripts/verify-form-controls.mjs
      - name: Generate local preview
        run: npm run generate:local-preview
      - name: Typecheck
        run: npm run typecheck
      - name: Compile targeted browser tests
        run: npx playwright test --list tests/browser/contract-layout.spec.ts tests/browser/contract-workspace.spec.ts tests/browser/contract-attention-background.spec.ts
      - name: Test contract server paths
        run: node --test server/test/contract-audit.test.js server/test/daily-supply-contracts.test.js server/test/state-projection-cache.test.js server/test/commercial-contracts.test.js
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run contract browser regressions
        run: npx playwright test tests/browser/contract-layout.spec.ts tests/browser/contract-workspace.spec.ts tests/browser/contract-attention-background.spec.ts
      - name: Commit final contract workspace
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/temp-finalize-contract-workspace.yml
          rm -f scripts/temp-finalize-contract-workspace.py
          rm -f scripts/temp-fix-contract-audit-participants.py
          rm -f scripts/temp-participant-finalizer-error.txt
          rm -f scripts/temp-contract-layout-error.txt
          rm -f scripts/temp-contract-browser-error.txt
          git config user.name "RIVERSOFT"
          git config user.email "105160096+RIVERS0FT@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "收尾每日合同工作区与审计可见性"
          git push origin HEAD:feature/daily-regional-supply-contracts-impl
