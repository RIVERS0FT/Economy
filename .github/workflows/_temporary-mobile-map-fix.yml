name: Temporary Mobile Map Patch

on:
  push:
    branches:
      - fix/mobile-map-interactions-20260821
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]' && (github.event_name != 'pull_request' || github.head_ref == 'fix/mobile-map-interactions-20260821')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - name: Apply deterministic patch
        run: |
          python3 scripts/_temporary_fix_mobile_map_patch.py
          python3 -m py_compile scripts/_temporary_apply_mobile_map_fix.py
          python3 scripts/_temporary_apply_mobile_map_fix.py
          git diff --check

      - name: Remove temporary patch machinery
        run: |
          git rm .github/workflows/_temporary-mobile-map-fix.yml scripts/_temporary_apply_mobile_map_fix.py scripts/_temporary_fix_mobile_map_patch.py
          git diff --check

      - name: Commit patched sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "修复移动端地图标签与空白手势"
          git push origin HEAD:fix/mobile-map-interactions-20260821
