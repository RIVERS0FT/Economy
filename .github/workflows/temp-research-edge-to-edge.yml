name: Apply research edge-to-edge source edits

on:
  push:
    branches:
      - codex/research-tree-edge-to-edge

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/research-tree-edge-to-edge
          fetch-depth: 0
      - name: Apply exact replacements
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}: {old!r}')
              file.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'docs/PAGE_CONTENT_AND_NAVIGATION_DESIGN.md',
              '研发正文使用 `PageLayout scrollable={false}` 的固定工作区，科技节点画布必须占满标题下方的全部可用页面区域，页面自身不得纵向滚动。',
              '研发正文使用 `PageLayout scrollable={false}` 的固定工作区，科技节点画布必须占满标题下方的全部可用页面区域，页面自身不得纵向滚动。桌面研发科技树画布横向不得继承固定正文的左右 `var(--layout-gutter)`，其左、右边缘必须分别贴齐标题下方固定正文区域的可用边界；该例外只移除画布横向外边距，不改变统一 `workspaceCard`、标题栏、左上操作卡或右下控制条的安全内距。',
          )
          replace_once(
              'docs/PAGE_CONTENT_AND_NAVIGATION_DESIGN.md',
              '不得恢复研发树 viewport 的铺满页面边框／圆角／卡片背景，也不得通过 `research` 专属样式关闭统一 `workspaceCard` 的边框、圆角、毛玻璃背景、阴影、高光或滤镜；',
              '不得恢复研发树 viewport 的铺满页面边框／圆角／卡片背景，不得重新给桌面研发科技树画布添加固定正文左右 gutter，也不得通过 `research` 专属样式关闭统一 `workspaceCard` 的边框、圆角、毛玻璃背景、阴影、高光或滤镜；',
          )
          replace_once(
              'docs/LIQUID_GLASS_CHROME_DESIGN.md',
              '标题与正文内距、一级区块间距统一使用 `var(--layout-gutter)`；',
              '标题与普通正文内距、一级区块间距统一使用 `var(--layout-gutter)`；研发科技树画布的横向贴边属于页面级例外，具体边界由 `PAGE_CONTENT_AND_NAVIGATION_DESIGN.md` 统一规定；',
          )
          replace_once(
              'scripts/verify-research-page.mjs',
              "  '.page-card-static .research-workspace {',\n  'height: 100%;",
              "  '@media (min-width: 721px)',\n  '.game-shell.strategic-tab-research .page-card-static {',\n  'padding-inline: 0;',\n  '.page-card-static .research-workspace {',\n  'height: 100%;",
          )
          replace_once(
              'scripts/verify-research-page.mjs',
              "  'expect(researchGeometry.treeViewport).toEqual(researchGeometry.treePanel)',\n  \"expect(fixedPageOverflow.stackAlignContent).toBe('stretch')\"," ,
              "  'expect(researchGeometry.treeViewport).toEqual(researchGeometry.treePanel)',\n  'fixedPageOverflow.paddingInlineStart',\n  'fixedPageOverflow.paddingInlineEnd',\n  'researchGeometry.fixedBody',\n  'expect(researchGeometry.workspace?.left).toBeCloseTo',\n  'expect(researchGeometry.workspace?.right).toBeCloseTo',\n  \"expect(fixedPageOverflow.stackAlignContent).toBe('stretch')\"," ,
          )
          replace_once(
              'scripts/verify-research-page.mjs',
              "  '科技节点画布必须占满标题下方的全部可用页面区域',",
              "  '科技节点画布必须占满标题下方的全部可用页面区域',\n  '桌面研发科技树画布横向不得继承固定正文的左右',",
          )
          replace_once(
              'scripts/verify-research-page.mjs',
              "console.log('downward prerequisite research DAG, stable hover geometry, ordinary wheel zoom, drag pan, double-click current focus, shared workspace card with transparent research canvas, shared mobile pan/zoom viewport, stable selection, no below-tree page-flow card, detail sheet and design verification passed');",
              "console.log('downward prerequisite research DAG, edge-to-edge desktop canvas, stable hover geometry, ordinary wheel zoom, drag pan, double-click current focus, shared workspace card with transparent research canvas, shared mobile pan/zoom viewport, stable selection, no below-tree page-flow card, detail sheet and design verification passed');",
          )
          PY
      - name: Verify research rules
        run: node scripts/verify-research-page.mjs
      - name: Commit final source changes
        run: |
          rm .github/workflows/temp-research-edge-to-edge.yml
          git config user.name "RIVERSOFT"
          git config user.email "105160096+RIVERS0FT@users.noreply.github.com"
          git add docs/PAGE_CONTENT_AND_NAVIGATION_DESIGN.md docs/LIQUID_GLASS_CHROME_DESIGN.md scripts/verify-research-page.mjs .github/workflows/temp-research-edge-to-edge.yml
          git commit -m "记录研发树横向贴边规则"
          git push origin HEAD:codex/research-tree-edge-to-edge
