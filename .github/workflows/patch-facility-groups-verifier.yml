name: Patch facility groups verifier

on:
  push:
    branches:
      - fix/facility-detail-summary-local-product

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update authority and verifier
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, got {count}')
              path.write_text(text.replace(old, new, 1))

          industry = Path('docs/INDUSTRY_AND_PRODUCTION_DESIGN.md')
          replace_once(
              industry,
              '- 当前工厂详情的可见顺序固定为“移动端把手（桌面端无）→ 工厂信息 → 满员率 → 生产设置 → 生产结算 → 经营诊断 → 市场入口”。桌面端不得渲染把手 DOM；移动 Bottom Sheet 的固定头部只保留拖动把手，工厂名称、状态和开关必须进入正文中的共享工厂信息区。 Bottom Sheet 必须在首次可见绘制前完成页面滚动锁定、稳定视觉视口高度快照和 `focus({ preventScroll: true })`；移动 Bottom Sheet 打开期间只允许单向上移，打开后不得因动态视口变化产生纵向抖动。移动触控下工厂选择卡不得使用缩放按压反馈。',
              '- 当前工厂详情的可见顺序固定为“移动端把手（桌面端无）→ 工厂信息（插画右侧含运行／冻结／抵押、单厂平均利润与满员率）→ 生产配置 → 生产结算 → 经营诊断 → 市场入口”。桌面端不得渲染把手 DOM；移动 Bottom Sheet 的固定头部只保留拖动把手，工厂名称、状态和开关必须进入正文中的共享工厂信息区。 Bottom Sheet 必须在首次可见绘制前完成页面滚动锁定、稳定视觉视口高度快照和 `focus({ preventScroll: true })`；移动 Bottom Sheet 打开期间只允许单向上移，打开后不得因动态视口变化产生纵向抖动。移动触控下工厂选择卡不得使用缩放按压反馈。',
              'industry detail order',
          )
          replace_once(
              industry,
              '- 工厂信息是唯一身份与经营摘要区，包含工厂名称、`4:5` 纵向场景插画、总数量、唯一完整状态胶囊、运行开关、运行中／冻结中／抵押中三项数量明细，以及唯一一行单厂平均利润／分钟。不得再把标题状态固定在移动头部、把插画拆到另一列或把利润留在生产结算中。',
              '- 工厂信息是唯一身份与经营摘要区，包含工厂名称、`4:5` 纵向场景插画、总数量、唯一完整状态胶囊、运行开关，以及插画右侧的运行中／冻结中／抵押中三项数量明细、唯一一行单厂平均利润／分钟与满员率状态带。不得再把标题状态固定在移动头部、把插画拆到另一列、把这些经营指标移回插画下方或把利润留在生产结算中。',
              'industry information summary',
          )
          replace_once(
              industry,
              '- 工厂信息内部允许“纵向插画 + 右侧主信息”的两列布局；三项数量明细与利润位于该信息区内部并按 DOM 顺序出现在后。桌面与移动共用同一个 `FacilityClusterInformation`，不得通过 CSS `order` 建立与 DOM 不同的视觉顺序。',
              '- 工厂信息内部使用“纵向插画 + 右侧主信息”的两列布局；三项数量明细、利润与满员率都位于右侧主信息内并按 DOM 顺序排列。桌面与移动共用同一个 `FacilityClusterInformation`，不得通过 CSS `order` 建立与 DOM 不同的视觉顺序。',
              'industry information columns',
          )
          replace_once(
              industry,
              '- 满员率紧跟工厂信息之后；满员率状态带只显示当前百分比、恢复／下降方向和进度条。物理数量、完成时满员率与整数等效产能只进入完整无障碍描述，不得恢复可见长句、独立卡片背景或与插画绑定的并排布局。',
              '- 满员率位于工厂信息的插画右侧主信息内，紧跟数量摘要与单厂平均利润；满员率状态带只显示当前百分比、恢复／下降方向和进度条。物理数量、完成时满员率与整数等效产能只进入完整无障碍描述，不得恢复可见长句、独立卡片背景或移回插画下方。',
              'industry staffing placement',
          )
          replace_once(
              industry,
              '- 玩家可见“生产产物”与“作业制度”必须合并为同一个“生产设置”区；桌面与移动在 `320px` 及以上固定双列同行。两者使用共享 `RichSelectInput`、商品 PNG 或制度 Icon 与名称；生产设置下方不得显示“周期 · 产出 · 成本”摘要、制度说明或重复当前制度名称。',
              '- 玩家可见“生产产物”与“作业制度”必须合并为同一个无标题生产配置区；不得显示独立“生产设置”标题。桌面与移动在 `320px` 及以上固定双列同行。两者使用共享 `RichSelectInput`、商品 PNG 或制度 Icon 与名称；生产配置下方不得显示“周期 · 产出 · 成本”摘要、制度说明或重复当前制度名称。',
              'industry production config heading',
          )
          replace_once(
              industry,
              '- 时间与成本固定放在投入与产出下方的同一条操作数据带，操作数据带保持内容宽度并在中间使用竖向分隔线；生产进度位于数据带下方，并且是生产结算最后一个可见元素。进度条下方不得显示当前周期、恢复运行、产出、成本或其他说明文字。生产结算标题只显示“生产结算”，不得包含单厂平均利润、范围长句或第二张结果卡。',
              '- 时间与成本固定放在投入与产出下方的同一条操作数据带，操作数据带保持内容宽度并在中间使用竖向分隔线；生产进度位于数据带下方，并且是生产结算最后一个可见元素。进度轨道使用胶囊圆角，流光只允许存在于已完成填充内部并由填充裁剪，未完成轨道不得出现流光。进度条下方不得显示当前周期、恢复运行、产出、成本或其他说明文字。生产结算标题只显示“生产结算”，不得包含单厂平均利润、范围长句或第二张结果卡。',
              'industry progress shimmer',
          )
          replace_once(
              industry,
              '- 市场入口固定使用“交易该建筑资产”文本与右向无横杆 Chevron，桌面位于详情自然内容底部，移动端位于固定 Footer。',
              '- 市场入口固定使用“交易该建筑资产”文本与右向无横杆 Chevron，文字与 Chevron 必须保持同一行；桌面位于详情自然内容底部，移动端位于固定 Footer。',
              'industry market action row',
          )

          verifier = Path('scripts/verify-facility-groups.mjs')
          replace_once(
              verifier,
              "  '<strong>生产设置</strong>',\n",
              "  'aria-label=\"生产配置\"',\n",
              'verifier source heading',
          )
          replace_once(
              verifier,
              "  '玩家可见“生产产物”与“作业制度”必须合并为同一个“生产设置”区',\n",
              "  '玩家可见“生产产物”与“作业制度”必须合并为同一个无标题生产配置区',\n",
              'verifier industry authority',
          )
          replace_once(
              verifier,
              "  '玩家可见的“生产产物”与“作业制度”固定使用同一个“生产设置”区',\n",
              "  '玩家可见的“生产产物”与“作业制度”固定使用同一个无标题生产配置区',\n",
              'verifier ui authority',
          )
          verifier_text = verifier.read_text()
          marker = "for (const text of [\n  'facility-production-settings',\n  'facility-production-settings-grid',\n  'aria-label=\"生产配置\"',\n  '<FacilityProductionConfigControls',\n]) requireText('src/pages/production/ProductionFacilityDetail.tsx', text);"
          if verifier_text.count(marker) != 1:
              raise SystemExit('verifier production-config marker missing')
          verifier_text = verifier_text.replace(
              marker,
              marker + "\nforbidText('src/pages/production/ProductionFacilityDetail.tsx', '<strong>生产设置</strong>');",
              1,
          )
          verifier.write_text(verifier_text)
          PY
          node scripts/verify-facility-groups.mjs
          node scripts/verify-production-settlement-layout.mjs
          git diff --check
      - name: Commit updates
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/INDUSTRY_AND_PRODUCTION_DESIGN.md scripts/verify-facility-groups.mjs
          git commit -m "同步工厂详情组合验证与设计基线 [facility-groups-synced]"
          git push origin HEAD:fix/facility-detail-summary-local-product
