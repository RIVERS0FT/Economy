name: Codex market verifier sync

on:
  push:
    branches:
      - codex/daily-market-freeze-timeout-fix

permissions:
  contents: write

jobs:
  sync:
    if: github.event.head_commit.message == '同步30日行情浏览器防回退'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/daily-market-freeze-timeout-fix
          fetch-depth: 0
      - name: Sync verifier
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/verify-market-chart.mjs')
          text = path.read_text(encoding='utf-8')
          old = "  'priceMinMatches', 'volumeMaxMatches', '共享边界只能存在一项纵轴刻度',"
          new = "  'priceMinMatches', 'boundaryLabels', '共享边界只能存在一项纵轴刻度',"
          if text.count(old) != 1:
              raise SystemExit('market verifier boundary target missing or duplicated')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          Path('.github/workflows/codex-market-verifier-sync.yml').unlink()
          PY
          git diff --check
      - name: Commit verifier sync
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "同步30日行情浏览器防回退检查"
          git push origin HEAD:codex/daily-market-freeze-timeout-fix
