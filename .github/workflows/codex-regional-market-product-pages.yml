name: Codex regional market product pages

on:
  push:
    branches:
      - codex/regional-market-product-pages

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/regional-market-product-pages
          fetch-depth: 0

      - name: Check refactor script
        id: guard
        shell: bash
        run: |
          if [[ -f .codex/apply_regional_market_product_pages.py ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.guard.outputs.run == 'true'
        with:
          node-version: 24.4.0
          cache: npm

      - name: Align refactor script with current CSS
        if: steps.guard.outputs.run == 'true'
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.codex/apply_regional_market_product_pages.py')
          text = path.read_text(encoding='utf-8')
          old = """  grid-template-columns: minmax(280px, 320px) minmax(0, 1fr);\n  align-items: start;\n  gap: var(--layout-gutter);"""
          new = """  grid-template-columns: minmax(280px, 320px) minmax(0, 1fr);\n  align-items: start;\n  gap: var(--space-3);"""
          if old not in text:
              raise SystemExit('warehouse CSS source block not found in refactor script')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Apply and commit implementation
        if: steps.guard.outputs.run == 'true'
        shell: bash
        run: |
          set +e
          python3 .codex/apply_regional_market_product_pages.py > .codex/last-run.log 2>&1
          status=$?
          cat .codex/last-run.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ $status -ne 0 ]]; then
            git add .codex/last-run.log
            git commit -m "chore: record regional market apply failure" || true
            git push origin HEAD:codex/regional-market-product-pages
            exit $status
          fi
          git diff --check
          git add src docs scripts tests
          if ! git diff --cached --quiet; then
            git commit -m "重构地区商品页与地区实体标题"
            git push origin HEAD:codex/regional-market-product-pages
          fi

      - name: Verify implementation and record result
        if: steps.guard.outputs.run == 'true'
        shell: bash
        run: |
          set +e
          set -o pipefail
          {
            npm ci &&
            node --experimental-strip-types scripts/verify-market-assets.mjs &&
            node scripts/verify-market-page-layout.mjs &&
            node scripts/verify-warehouse-expansion.mjs &&
            node scripts/verify-production-desktop-layout.mjs &&
            node scripts/verify-unified-factory-recipes-grid.mjs &&
            node scripts/verify-page-content.mjs &&
            npm run typecheck &&
            npm run build &&
            npx playwright install --with-deps chromium &&
            npm run test:browser &&
            git diff --check
          } 2>&1 | tee .codex/last-run.log
          status=${PIPESTATUS[0]}
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .codex/last-run.log
          git commit -m "chore: record regional market verification result" || true
          git push origin HEAD:codex/regional-market-product-pages
          exit $status
