name: Apply contract four-column workspace

on:
  push:
    branches:
      - agent/contract-four-column-workspace
    paths:
      - .agent/apply-ready
  pull_request:
    branches:
      - main
    paths:
      - .agent/apply-ready

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/contract-four-column-workspace
          fetch-depth: 0
      - name: Apply patches
        run: |
          for patch in .agent/part-0[1-6].patch; do
            git apply --check "$patch"
            git apply "$patch"
          done
          python .agent/update-doc.py
          rm -rf .agent
          rm .github/workflows/apply-contract-four-column-workspace.yml
      - name: Commit applied sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "重构合同四列工作区"
          git push origin HEAD:agent/contract-four-column-workspace
