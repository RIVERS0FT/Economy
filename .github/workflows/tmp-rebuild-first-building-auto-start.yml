name: Temporary Rebuild First Building Auto Start

on:
  push:
    branches:
      - tmp/rebuild-first-building-auto-start-20260906

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout temporary driver branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild feature on latest main
        shell: bash
        env:
          BASE_SHA: 60574d7e044deee95049aafc8f1c5b47a7f55691
          BACKUP_BRANCH: backup/first-building-auto-start-pre-801-20260906
          TARGET_BRANCH: fix/first-building-auto-start
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main "$BACKUP_BRANCH" "$TARGET_BRANCH"
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          git checkout -B rebuilt-first-building-auto-start origin/main

          set +e
          git merge --squash "origin/$BACKUP_BRANCH"
          merge_status=$?
          set -e
          if [ "$merge_status" -ne 0 ]; then
            echo "Squash merge reported conflicts; applying semantic resolutions."
          fi

          python3 <<'PY'
          from pathlib import Path
          import subprocess

          BACKUP = 'origin/backup/first-building-auto-start-pre-801-20260906'
          MAIN = 'origin/main'

          def show(ref, path):
              return subprocess.check_output(['git', 'show', f'{ref}:{path}'], text=True)

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8', newline='\n')

          def line_with_prefix(text, prefix):
              for line in text.splitlines():
                  if line.startswith(prefix):
                      return line
              raise AssertionError(f'missing line prefix: {prefix}')

          def replace_line_with_prefix(text, prefix, replacement):
              lines = text.splitlines()
              matches = [i for i, line in enumerate(lines) if line.startswith(prefix)]
              if len(matches) != 1:
                  raise AssertionError(f'expected one line for {prefix!r}, found {len(matches)}')
              lines[matches[0]] = replacement
              return '\n'.join(lines) + ('\n' if text.endswith('\n') else '')

          def paragraph_with_prefix(text, prefix):
              for paragraph in text.split('\n\n'):
                  if paragraph.startswith(prefix):
                      return paragraph
              raise AssertionError(f'missing paragraph prefix: {prefix}')

          path = 'docs/COMMERCIAL_BUILDINGS_DESIGN.md'
          backup = show(BACKUP, path)
          main = show(MAIN, path)
          merged = backup
          balance_para = paragraph_with_prefix(main, '商业目录以满员、基础价及两周期消费商品／运营资金计算占款')
          if balance_para not in merged:
              anchor = paragraph_with_prefix(merged, '每座满员等效建筑的固定商业利润是服务器目录声明的**绝对金额**')
              merged = merged.replace(anchor, anchor + '\n\n' + balance_para, 1)
          write(path, merged)

          path = 'docs/INDUSTRY_AND_PRODUCTION_DESIGN.md'
          backup = show(BACKUP, path)
          merged = show(MAIN, path)
          for prefix in [
              '- 工厂建设不创建施工任务、施工队列或工厂实例；',
              '- 周期投入严格限定工厂所在地区；',
              '服务端允许单次建设 1～100 座并按数量安全相乘。',
          ]:
              merged = replace_line_with_prefix(merged, prefix, line_with_prefix(backup, prefix))
          first_build_rule = line_with_prefix(backup, '- 玩家首次建设使某州某类型集群从 `0 → >0` 时，服务器默认设置 `enabled = true`；')
          if first_build_rule not in merged:
              anchor = line_with_prefix(merged, '- 玩家打开开关后，`enabled = true`。')
              merged = merged.replace(anchor, first_build_rule + '\n' + anchor, 1)
          bootstrap_rule = line_with_prefix(backup, '- 尚未建立首周期且自动经营开启时，原料不足可以按 `WAREHOUSE_EXPANSION_DESIGN.md` 执行 purchase-only bootstrap；')
          if bootstrap_rule not in merged:
              anchor = line_with_prefix(merged, '- 资金、原料、仓库或可用工厂不足时状态为 `error`。')
              merged = merged.replace(anchor, anchor + '\n' + bootstrap_rule, 1)
          guard_rules = [
              line_with_prefix(backup, '- 首次建设后默认保持停止，或要求首次缺料必须由玩家手动买入后才能开始首周期；'),
              line_with_prefix(backup, '- 让首周期 bootstrap 出售地区商品、写入完成游标、伪造完成周期或补造异常期间产出；'),
              line_with_prefix(backup, '- 已手动停止的既有集群因扩建而自动重新开启；'),
          ]
          if guard_rules[0] not in merged:
              anchor = line_with_prefix(merged, '- 固定价格工厂挂牌市场；')
              merged = merged.replace(anchor, anchor + '\n' + '\n'.join(guard_rules), 1)
          write(path, merged)

          path = 'server/src/facility-groups.js'
          backup = show(BACKUP, path)
          merged = show(MAIN, path)
          merged = replace_line_with_prefix(
              merged,
              'import { completeBuildingCycleAutoOperation, recordCompletedIndustrialOutput } from',
              line_with_prefix(backup, 'import { bootstrapBuildingAutoOperation, completeBuildingCycleAutoOperation, recordCompletedIndustrialOutput } from'),
          )
          marker_line = line_with_prefix(backup, '    ...(overrides.autoOperationBootstrapPending === true ?')
          if marker_line not in merged:
              anchor = line_with_prefix(merged, '    ...(Number.isSafeInteger(overrides.cycleRecordedLifetimeOutput) ?')
              merged = merged.replace(anchor, anchor + '\n' + marker_line, 1)
          if '  delete group.autoOperationBootstrapPending;\n' not in merged:
              start = merged.index('function startGroupRuntime(world, group, count, now) {')
              pos = merged.index('  delete group.statusReason;\n', start) + len('  delete group.statusReason;\n')
              merged = merged[:pos] + '  delete group.autoOperationBootstrapPending;\n' + merged[pos:]
          scan_start = backup.index('    const bootstrapProvinceIds = new Set((player.facilityGroups || [])')
          scan_end_line = '    for (const provinceId of bootstrapProvinceIds) bootstrapBuildingAutoOperation(world, player, now, provinceId);\n'
          scan_end = backup.index(scan_end_line, scan_start) + len(scan_end_line)
          scan_block = backup[scan_start:scan_end]
          if scan_block.strip() not in merged:
              func = merged.index('export function processFacilityGroupWorld(')
              anchor_pos = merged.index('    ensureWarehouse(player);\n', func) + len('    ensureWarehouse(player);\n')
              merged = merged[:anchor_pos] + scan_block + merged[anchor_pos:]
          existing_line = line_with_prefix(backup, '  const existingGroup = groupFor(player, type.id, false, now, provinceId);')
          first_line = line_with_prefix(backup, '  const firstBuild = !existingGroup || existingGroup.count < 1;')
          if existing_line not in merged:
              func = merged.index('function buildFacilityGroup(world, userId, payload, now) {')
              quantity_line = line_with_prefix(merged[func:], "  if (!quantity) return result(false, '建造数量必须为 1 到 100 的整数');")
              pos = merged.index(quantity_line, func) + len(quantity_line)
              merged = merged[:pos] + '\n' + existing_line + '\n' + first_line + merged[pos:]
          block_start = backup.index('  const group = addPurchasedGroup(world, player, type.id, quantity, now, provinceId);')
          block_end_line = '  return result(true, `${quantity} 座${type.name}已建成并加入同类工厂集群`);\n'
          block_end = backup.index(block_end_line, block_start) + len(block_end_line)
          desired_build_tail = backup[block_start:block_end]
          main_tail = '  addPurchasedGroup(world, player, type.id, quantity, now, provinceId);\n' + block_end_line
          if desired_build_tail not in merged:
              if main_tail not in merged:
                  raise AssertionError('missing main build tail')
              merged = merged.replace(main_tail, desired_build_tail, 1)
          start_func = merged.index('function startFacilityGroup(world, userId, payload, now) {')
          bootstrap_start = backup.index("  if (group.status !== 'running' && group.autoOperationBootstrapPending === true) {", backup.index('function startFacilityGroup(world, userId, payload, now) {'))
          bootstrap_end_marker = '  reconcileFacilityGroup(world, player, group, now);\n'
          bootstrap_end = backup.index(bootstrap_end_marker, bootstrap_start)
          start_bootstrap_block = backup[bootstrap_start:bootstrap_end]
          if start_bootstrap_block.strip() not in merged:
              reconcile_pos = merged.index(bootstrap_end_marker, start_func)
              merged = merged[:reconcile_pos] + start_bootstrap_block + merged[reconcile_pos:]
          client_marker = line_with_prefix(backup, '    autoOperationBootstrapPending: _autoOperationBootstrapPending,')
          if client_marker not in merged:
              client_func = merged.index('function clientGroup(world, player, group, now) {')
              anchor = line_with_prefix(merged[client_func:], '    cycleRecordedLifetimeOutput: _cycleRecordedLifetimeOutput,')
              pos = merged.index(anchor, client_func) + len(anchor)
              merged = merged[:pos] + '\n' + client_marker + merged[pos:]
          for required in [
              "import { activeProductionRecipe, legacyProductionOperatingCost, PRODUCTION_BALANCE_VERSION } from './production-balance.js';",
              'productionBalanceVersion: PRODUCTION_BALANCE_VERSION,',
              'productionCostChangeAt:',
              'autoOperationBootstrapPending',
              'bootstrapBuildingAutoOperation',
          ]:
              if required not in merged:
                  raise AssertionError(f'facility-groups lost required token: {required}')
          write(path, merged)

          path = 'server/src/production-settlement.js'
          backup = show(BACKUP, path)
          merged = show(MAIN, path)
          merged = replace_line_with_prefix(
              merged,
              'import { completeBuildingCycleAutoOperation, recordCompletedIndustrialOutput } from',
              line_with_prefix(backup, 'import { bootstrapBuildingAutoOperation, completeBuildingCycleAutoOperation, recordCompletedIndustrialOutput } from'),
          )
          block_start = backup.index('  const bootstrapProvinceIds = new Set((player.facilityGroups || [])')
          block_end_line = '  for (const provinceId of bootstrapProvinceIds) bootstrapBuildingAutoOperation(world, player, now, provinceId);\n'
          block_end = backup.index(block_end_line, block_start) + len(block_end_line)
          retry_block = backup[block_start:block_end]
          if retry_block.strip() not in merged:
              func = merged.index('export function applyProductionSettlementClaim(')
              anchor = "  for (const event of completed) completeBuildingCycleAutoOperation(world, player, event.group, 'production', event.completedAt, now);\n"
              pos = merged.index(anchor, func) + len(anchor)
              merged = merged[:pos] + retry_block + merged[pos:]
          for required in ['productionCostBoundary', 'bootstrapBuildingAutoOperation', 'productionResourceUsage']:
              if required not in merged:
                  raise AssertionError(f'production-settlement lost required token: {required}')
          write(path, merged)

          path = 'server/test/commercial-buildings.test.js'
          backup = show(BACKUP, path).rstrip() + '\n'
          main = show(MAIN, path)
          marker = "test('pre-upgrade invested commercial profit is honored and only the next cycle adopts the new catalog'"
          idx = main.index(marker)
          migration_test = main[idx:].strip() + '\n'
          merged = backup
          if marker not in merged:
              merged += '\n' + migration_test
          write(path, merged)
          PY

          git add -A
          if git ls-files -u | grep -q .; then
            echo 'Unresolved merge conflicts remain:'
            git ls-files -u
            exit 1
          fi

          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l)" -eq 17
          test -z "$(git diff --cached --name-only | grep '^\.github/workflows/' || true)"

          npm ci
          node --test \
            server/test/first-building-auto-start.test.js \
            server/test/commercial-buildings.test.js \
            server/test/commercial-auto-operation.test.js \
            server/test/commercial-staffing.test.js \
            server/test/building-shared-inventory.test.js \
            server/test/production-lazy-settlement.test.js \
            server/test/c1-input-balance-migration.test.js
          npm run build

          git commit -m 'fix: 首次建筑默认运行并补齐首周期原料'
          git push --force-with-lease="refs/heads/$TARGET_BRANCH:$BASE_SHA" origin "HEAD:refs/heads/$TARGET_BRANCH"
