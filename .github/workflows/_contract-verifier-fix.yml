name: Contract verifier fix

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'codex/contracts-core-workspace'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Align verifier with authority wording
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/verify-contract-layout.mjs')
          text = path.read_text()
          text = text.replace('不得恢复合同广场与我的合同桌面常驻双栏', '不得恢复合同市场与我的合同桌面常驻双栏')
          text = text.replace('公开合同和进行中合同逐份使用独立对象卡', '当前选中的公开合同或进行中合同使用独立对象卡')
          path.write_text(text)
          PY
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/verify-contract-layout.mjs
          git commit -m "对齐合同 verifier 与权威设计"
          git push origin HEAD:${{ github.head_ref }}
