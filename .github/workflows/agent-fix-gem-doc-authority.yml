name: Fix gem document authority

on:
  push:
    branches:
      - agent/gem-construction-and-dynamic-rate
    paths:
      - .github/workflows/agent-fix-gem-doc-authority.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/gem-construction-and-dynamic-rate
          fetch-depth: 0
      - name: Update authority index and guards
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path_name, old, new, label):
              path = Path(path_name)
              text = path.read_text()
              if old not in text:
                  raise SystemExit(f'missing {label} in {path_name}')
              path.write_text(text.replace(old, new, 1))

          replace(
              'README.md',
              '- 商店按北京时间每日锁定的全服终端报价直接发行普通货币；基准 10、范围 6～14、每日最多变化 1，每名玩家每天只能接受兑换一次或明确放弃一次。礼品码和管理员发放继续按各自规则记录发行。',
              '- 商店按北京时间每日锁定的全服终端报价直接发行普通货币；基准 10、范围 6～14、每日最多变化 1，每名玩家每天只能接受兑换一次或明确放弃一次。礼品码和管理员发放继续按各自规则记录发行。系统不设置人口侧货币回收、余额衰减或发行总量上限。',
              'README monetary policy',
          )
          replace(
              'README.md',
              '- 商店：分享专属链接与永久邀请码、查看邀请统计，并按服务器固定汇率将宝石单向兑换为普通货币。',
              '- 商店：分享专属链接与永久邀请码、查看邀请统计，并按每日全服终端报价接受兑换或明确放弃。',
              'README shop navigation',
          )
          replace(
              'README.md',
              '| 产品定位、工作、普通货币、银行、净资产、宝石、邀请、市场需求与价格传导 | `docs/PRODUCT_AND_GAMEPLAY_DESIGN.md` |',
              '| 产品定位、工作、普通货币、银行、净资产、宝石、邀请、市场需求与价格传导 | `docs/PRODUCT_AND_GAMEPLAY_DESIGN.md` |\n| 宝石施工加速、每日终端动态报价、决策与审计 | `docs/GEM_ACCELERATION_AND_DYNAMIC_EXCHANGE_DESIGN.md` |',
              'README authority table',
          )

          replace(
              'docs/README.md',
              '| `PRODUCT_AND_GAMEPLAY_DESIGN.md` | 产品定位、核心循环、工作冷却、每日签到、普通货币与宝石、直接货币发行、人口就业收入、三类人口真实钱包、消费需求与排行榜目标 |',
              '| `PRODUCT_AND_GAMEPLAY_DESIGN.md` | 产品定位、核心循环、工作冷却、每日签到、普通货币与宝石、直接货币发行、人口就业收入、三类人口真实钱包、消费需求与排行榜目标 |\n| `GEM_ACCELERATION_AND_DYNAMIC_EXCHANGE_DESIGN.md` | 1 宝石减少施工 30 分钟、每日终端动态报价、接受／拒绝决策、历史汇率、SQLite 审计与禁止宝石兑换工厂产量 |',
              'docs index table',
          )
          replace(
              'docs/README.md',
              '18. 商店固定汇率、单向兑换、直接货币发行、兑换幂等与独立页面属于产品、页面和服务器权威规则；必须同步更新对应文档、测试和 `scripts/verify-gem-shop.mjs`；邀请卡唯一归属商店，不得恢复到设置页。',
              '18. 商店每日终端动态报价、全服同价、接受／拒绝决策、单向兑换、直接货币发行、施工宝石加速、兑换幂等与独立页面属于产品、页面和服务器权威规则；必须同步更新 `GEM_ACCELERATION_AND_DYNAMIC_EXCHANGE_DESIGN.md`、对应文档、测试和 `scripts/verify-gem-shop.mjs`；邀请卡唯一归属商店，不得恢复固定永久汇率、同日重复兑换或宝石兑换工厂产量。',
              'docs rule 18',
          )

          replace(
              'scripts/verify-document-authority.mjs',
              "  'docs/PRODUCT_AND_GAMEPLAY_DESIGN.md',\n",
              "  'docs/PRODUCT_AND_GAMEPLAY_DESIGN.md',\n  'docs/GEM_ACCELERATION_AND_DYNAMIC_EXCHANGE_DESIGN.md',\n",
              'canonical docs',
          )
          replace(
              'scripts/verify-document-authority.mjs',
              "  'docs/PRODUCT_AND_GAMEPLAY_DESIGN.md',\n  'docs/INDUSTRY_AND_PRODUCTION_DESIGN.md',",
              "  'docs/PRODUCT_AND_GAMEPLAY_DESIGN.md',\n  'docs/GEM_ACCELERATION_AND_DYNAMIC_EXCHANGE_DESIGN.md',\n  'docs/INDUSTRY_AND_PRODUCTION_DESIGN.md',",
              'versioned docs',
          )
          replace(
              'scripts/verify-document-authority.mjs',
              "    '商店兑换继续按固定汇率直接发行普通货币',",
              "    '商店按北京时间每日锁定的全服终端报价直接发行普通货币',",
              'README quote guard',
          )
          replace(
              'scripts/verify-document-authority.mjs',
              "    '商店固定汇率、单向兑换、直接货币发行、兑换幂等与独立页面',",
              "    '商店每日终端动态报价、全服同价、接受／拒绝决策、单向兑换、直接货币发行、施工宝石加速',",
              'docs index guard',
          )
          replace(
              'scripts/verify-document-authority.mjs',
              "    '`FACILITY_CATALOG_PRESENTATION_DESIGN.md`',",
              "    '`GEM_ACCELERATION_AND_DYNAMIC_EXCHANGE_DESIGN.md`',\n    '`FACILITY_CATALOG_PRESENTATION_DESIGN.md`',",
              'docs file guard',
          )
          PY
      - name: Commit authority updates
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/agent-fix-gem-doc-authority.yml
          git config user.name "OpenAI Codex"
          git config user.email "codex@openai.com"
          git add -A
          git commit -m "更新宝石规则文档权威校验"
          git push origin HEAD:agent/gem-construction-and-dynamic-rate
