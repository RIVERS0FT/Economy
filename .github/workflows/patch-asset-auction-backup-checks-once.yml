name: Patch Asset Auction Backup Checks Once

on:
  push:
    branches:
      - agent/compact-migration-backups

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/compact-migration-backups
      - name: Update backup design and verifier
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path

          gift = Path('docs/GIFT_CODE_AND_ADMIN_DESIGN.md')
          gift_text = gift.read_text(encoding='utf-8')
          old_gift = '5. 迁移前部署流程必须使用 Python `sqlite3.Connection.backup()` 将 `/var/lib/riversoft-economy/economy.sqlite` 在线备份到 `/var/lib/riversoft-economy/backups/economy-pre-world-v15-<UTC 时间>.sqlite`，通过 `PRAGMA quick_check` 后才允许上传新服务；部署保留最近 10 份该迁移快照。回滚必须同时恢复代码和对应数据库快照，不能只回滚代码。'
          new_gift = '5. 迁移前部署流程必须按服务器权威设计使用 `VACUUM INTO` 创建无 freelist 的紧凑 SQLite 副本，通过 `PRAGMA quick_check`、外键与 `auto_vacuum` 校验后，以 gzip 级别 6 压缩为 `/var/lib/riversoft-economy/backups/economy-pre-world-v15-<UTC 时间>.sqlite.gz` 并验证解压哈希；迁移族统一按全局最多 5 个保留。回滚必须同时恢复代码和对应数据库快照，不能只回滚代码。'
          if old_gift in gift_text:
              gift_text = gift_text.replace(old_gift, new_gift, 1)
          elif new_gift not in gift_text:
              raise SystemExit('gift backup rule anchor missing')
          gift.write_text(gift_text, encoding='utf-8')

          verifier = Path('scripts/verify-asset-auctions.mjs')
          source = verifier.read_text(encoding='utf-8')
          source = source.replace(
              "  '.github/workflows/deploy.yml',\n  'README.md',",
              "  '.github/workflows/deploy.yml',\n  'scripts/manage-production-backups.py',\n  'README.md',",
              1,
          )
          start = source.index("requireText('.github/workflows/deploy.yml', [")
          end = source.index("\n\nrequireText('README.md', [", start)
          new_deploy = """requireText('.github/workflows/deploy.yml', [
  'Prune backups and create compact compressed database backup before world 18 migration',
  'scripts/manage-production-backups.py',
  'backup-world --target-world-version 18',
  'ECONOMY_DATABASE_INCREMENTAL_VERIFIED',
  'database-backup.log',
]);
requireText('scripts/manage-production-backups.py', [
  'VACUUM INTO',
  'gzip.GzipFile(',
  'PRAGMA quick_check(1)',
  'PRAGMA foreign_key_check',
  "economy-pre-world-v{args.target_world_version}",
  "backup_directory.glob('economy-pre-*')",
  'MAX_BACKUP_FAMILIES = 5',
  'def prune_backups(',
]);
forbidText('.github/workflows/deploy.yml', [
  'source.backup(destination)',
  "backup_dir.glob('economy-pre-*.sqlite')",
]);"""
          source = source[:start] + new_deploy + source[end:]
          source = source.replace(
              "  '使用 Python `sqlite3.Connection.backup()`',\n  '通过 `PRAGMA quick_check` 后才允许上传新服务',",
              "  '使用 `VACUUM INTO` 创建无 freelist 的紧凑 SQLite 副本',\n  'gzip 级别 6',\n  '`PRAGMA quick_check`、外键与 `auto_vacuum` 校验',",
              1,
          )
          source = source.replace(
              "  '部署世界 15 前，`.github/workflows/deploy.yml` 必须在上传新服务前使用 Python `sqlite3.Connection.backup()`',\n  '`economy-pre-world-v15-<UTC 时间>.sqlite`',",
              "  '世界 15 资产拍卖迁移和世界 16 银行迁移的回滚仍必须同时恢复匹配代码',\n  '紧凑 gzip SQLite 快照',\n  '`VACUUM INTO` 消除 freelist',",
              1,
          )
          source = source.replace(
              '数据库快照、410 墓碑',
              '紧凑压缩数据库快照、410 墓碑',
              1,
          )
          verifier.write_text(source, encoding='utf-8')
          PYTHON

          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/GIFT_CODE_AND_ADMIN_DESIGN.md scripts/verify-asset-auctions.mjs
          git commit -m "更新资产拍卖紧凑备份防回退规则"
          git push origin HEAD:agent/compact-migration-backups
