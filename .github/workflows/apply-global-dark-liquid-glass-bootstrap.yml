name: Bootstrap global dark liquid glass

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: ${{ contains(github.event.head_commit.message, '[global-glass-bootstrap]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply global liquid glass rules
        run: python3 scripts/apply-global-dark-liquid-glass.py

      - name: Run focused architecture checks
        run: |
          set -euo pipefail
          node scripts/verify-auth-three-layer.mjs
          node scripts/verify-liquid-glass-chrome.mjs

      - name: Publish formal change branch
        shell: bash
        run: |
          set -euo pipefail
          git checkout -B agent/global-dark-liquid-glass-applied
          rm scripts/apply-global-dark-liquid-glass.py
          rm .github/workflows/apply-global-dark-liquid-glass-bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply global dark liquid glass"
          git push --force origin HEAD:agent/global-dark-liquid-glass-applied
