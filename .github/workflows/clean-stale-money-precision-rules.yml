name: Clean stale money precision rules

on:
  push:
    branches:
      - agent/remove-stale-money-rules

permissions:
  contents: write

jobs:
  clean-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out cleanup branch
        uses: actions/checkout@v4
        with:
          ref: agent/remove-stale-money-rules
          fetch-depth: 0

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.4.0
          cache: npm

      - name: Remove superseded rules
        run: python3 scripts/remove-stale-money-precision-rules.py

      - name: Install dependencies
        run: npm ci

      - name: Run complete build
        run: npm run build

      - name: Check patch formatting
        run: git diff --check

      - name: Commit verified cleanup
        run: |
          rm -f scripts/remove-stale-money-precision-rules.py
          rm -f .github/workflows/clean-stale-money-precision-rules.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove superseded money precision rules"
          git push origin HEAD:agent/remove-stale-money-rules
