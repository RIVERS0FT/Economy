          replace_once(page, "                  {!quantityReason && quantityDescription ? <small id=\"market-order-quantity-description\" className=\"ui-form-field__description\">{quantityDescription}</small> : null}\n", "")
          replace_once(page, "                  <span><small>{orderSide === 'buy' ? '最大可买' : '最大可卖'}</small><strong>{formatNumber(maxTradeQuantity)}</strong></span>\n", "")
          replace_once(page, """                {visibleDisabledReason ? <p id="order-disabled-reason" className="order-disabled-reason" role="status">{visibleDisabledReason}</p> : null}
                <Button
                  block
