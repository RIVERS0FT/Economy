name: Apply market layout fill

on:
  push:
    branches:
      - agent/market-layout-fill

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/market-layout-fill
          fetch-depth: 0
      - name: Apply market layout changes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, old, new):
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one occurrence, found {count}: {old[:120]!r}')
              file.write_text(text.replace(old, new, 1), encoding='utf-8')

          def insert_after(path, marker, addition):
              replace_once(path, marker, marker + addition)

          page = 'src/pages/MarketPage.tsx'
          replace_once(page, "          ? `当前没有可出售的${assetName}。`", "          ? '暂无可售库存。'")
          replace_once(page, "          ? `当前没有可出售的${assetName}。`", "          ? '暂无可售库存。'")
          replace_once(page, "          : `当前最多可卖 ${formatNumber(maxTradeQuantity)}。`", "          : '数量超过可售范围。'")
          replace_once(page, """  const visibleDisabledReason = orderLimitReason ?? availabilityReason;
  const orderDisabledReason = orderLimitReason ?? priceReason ?? availabilityReason ?? quantityReason;
  const warehouseLimitsBuy = orderSide === 'buy'
    && marketAssetKind === 'commodity'
    && maxBuyByFunds > game.warehouseAvailableCapacity;
  const quantityDescription = quantityReason || maxTradeQuantity < 1
    ? undefined
    : orderSide === 'buy'
      ? warehouseLimitsBuy
        ? `受仓库剩余容量限制，当前最多可买 ${formatNumber(maxTradeQuantity)}。`
        : `当前价格下最多可买 ${formatNumber(maxTradeQuantity)}。`
      : `当前最多可卖 ${formatNumber(maxTradeQuantity)}。`;
""", """  const orderDisabledReason = orderLimitReason ?? priceReason ?? availabilityReason ?? quantityReason;
  const orderActionLabel = orderDisabledReason
    ? orderLimitReason
      ? '订单已达上限'
      : priceReason
        ? `价格无效，无法${orderSide === 'buy' ? '买入' : '卖出'}${assetName}`
        : availabilityReason
          ? orderSide === 'buy'
            ? game.credits < (parsedOrderPrice ?? 0)
              ? `资金不足，无法买入${assetName}`
              : `仓库已满，无法买入${assetName}`
            : `暂无${assetName}可卖`
          : `数量超出范围，无法${orderSide === 'buy' ? '买入' : '卖出'}${assetName}`
    : orderSide === 'buy'
      ? `买入${assetName}`
      : `卖出${assetName}`;
""")
