name: Migrate Economy Database To Incremental Vacuum

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type ENABLE_INCREMENTAL_VACUUM_ON_PRODUCTION
        required: true
        type: string

concurrency:
  group: economy-production-database-mutation
  cancel-in-progress: false

permissions:
  contents: read
  statuses: write

jobs:
  migrate:
    if: inputs.confirmation == 'ENABLE_INCREMENTAL_VACUUM_ON_PRODUCTION'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$SERVER_HOST"
          test -n "$SERVER_PORT"
          test -n "$SERVER_SSH_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SERVER_PORT" "$SERVER_HOST" >> ~/.ssh/known_hosts

      - name: Migrate production SQLite to INCREMENTAL
        id: migrate_database
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          set -uo pipefail
          test -n "$SERVER_USER"
          report=/tmp/economy-incremental-migration.json
          rm -f "$report"

          set +e
          timeout 25m ssh -i ~/.ssh/deploy_key -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" \
            'if [ "$(id -u)" -eq 0 ]; then exec python3 - migrate-incremental; elif command -v sudo >/dev/null 2>&1 && sudo -n true; then exec sudo -n python3 - migrate-incremental; else echo ECONOMY_DATABASE_MAINTENANCE_PRIVILEGES_UNAVAILABLE >&2; exit 1; fi' \
            < scripts/manage-production-database.py | tee "$report"
          migration_status=${PIPESTATUS[0]}
          set -e

          test -s "$report"
          python3 scripts/manage-production-database.py render-summary "$report" "$GITHUB_STEP_SUMMARY"
          exit "$migration_status"

      - name: Publish migration status
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MIGRATION_OUTCOME: ${{ steps.migrate_database.outcome }}
        run: |
          set -euo pipefail
          report=/tmp/economy-incremental-migration.json
          target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          python3 - "$report" "$MIGRATION_OUTCOME" "$target_url" <<'PYTHON' > /tmp/economy-incremental-status.json
          import json
          import sys

          report_path, outcome, target_url = sys.argv[1:]
          state = 'success' if outcome == 'success' else 'failure'
          description = 'Economy database INCREMENTAL migration failed'
          try:
              with open(report_path, encoding='utf-8') as handle:
                  report = json.load(handle)
              before = report.get('before', {})
              after = report.get('after', {})
              gib = 1024 ** 3
              mib = 1024 ** 2
              description = (
                  f'DB {before.get("fileBytes", 0) / gib:.2f}GiB -> '
                  f'{after.get("fileBytes", 0) / mib:.1f}MiB; '
                  f'auto_vacuum={after.get("autoVacuum", "?")}'
              )[:140]
          except Exception as error:
              description = f'Economy INCREMENTAL migration failed: {error}'[:140]
              state = 'failure'

          print(json.dumps({
              'state': state,
              'description': description,
              'context': 'maintenance/economy-database-migration',
              'target_url': target_url,
          }))
          PYTHON

          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data-binary @/tmp/economy-incremental-status.json \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" > /dev/null
