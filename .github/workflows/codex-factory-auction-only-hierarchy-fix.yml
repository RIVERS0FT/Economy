name: Temporary factory hierarchy verifier fix

on:
  push:
    branches:
      - codex/factory-auction-only

permissions:
  contents: write
  actions: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/factory-auction-only
          fetch-depth: 0
      - name: Retire factory detail chevron requirement
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/verify-market-information-hierarchy.mjs')
          text = path.read_text(encoding='utf-8')
          old = "  [productionDetail, '<ChevronIcon direction=\"right\" />', 'production detail'],\n"
          if text.count(old) != 1:
              raise SystemExit(f'expected one production detail chevron assertion, found {text.count(old)}')
          text = text.replace(old, '')
          marker = "forbidText(gameGuide, '设置 → 游戏设置 → 教程', 'tutorial breadcrumb');"
          guard = "forbidText(productionDetail, '交易该建筑资产', 'factory detail direct market entry');\n"
          if marker not in text:
              raise SystemExit('tutorial marker missing')
          text = text.replace(marker, guard + marker, 1)
          path.write_text(text, encoding='utf-8')
          Path('.github/workflows/codex-factory-auction-only-hierarchy-fix.yml').unlink()
          PY
      - name: Verify hierarchy contract
        shell: bash
        run: node scripts/verify-market-information-hierarchy.mjs
      - name: Commit verifier update
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Retire factory direct-market hierarchy contract'
          git push origin HEAD:codex/factory-auction-only
      - name: Run full CI on updated head
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh workflow run ci.yml --ref codex/factory-auction-only
