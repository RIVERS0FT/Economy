name: Remove retired work gameplay

on:
  push:
    branches:
      - remove-retired-work-gameplay
    paths:
      - .github/workflows/remove-retired-work-gameplay.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.4.0
          cache: npm
      - run: npm ci
      - name: Apply retirement patch
        run: |
          python scripts/remove-retired-work-gameplay-patch-fix.py
          python scripts/remove-retired-work-gameplay-patch.py
      - name: Verify
        run: |
          git diff --check
          node scripts/verify-game-tutorial.mjs
          node scripts/verify-market-assets.mjs
          node scripts/verify-state-delivery-capacity.mjs
          node scripts/verify-authoritative-countdowns.mjs
          node scripts/verify-stress-test-flow.mjs
          node scripts/verify-client-response-performance.mjs
          node scripts/verify-runtime-efficiency.mjs
          node --test server/test/domain.test.js server/test/http.test.js server/test/auth-cache.test.js server/test/state-partitions.test.js
          npm run typecheck
      - name: Commit changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "退役工作玩法残留代码"
          git push
