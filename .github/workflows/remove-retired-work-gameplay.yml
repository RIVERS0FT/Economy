          sub(path, r"## 3\. 工作与经济活动\n\n.*?\n## 4\. 普通货币发行、就业转移与开放式扩张", """## 3. 经济活动

- 基础工作玩法已经正式退役，不存在工作按钮、工作冷却、`/api/game/work` 或点击工作发行普通货币。
