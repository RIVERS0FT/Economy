          replace(path, "当前实例：\n\n- 工作冷却 `work.cooldownUntil`。\n\n客户端必须使用服务器返回的绝对截止时间计算剩余时间。归零后按钮立即恢复，不等待下一次轮询；服务器仍在提交操作时再次校验真实时间。", "当前没有正式的本地资格倒计时实例。未来新增此类资格时，客户端必须使用服务器返回的绝对截止时间计算剩余时间；归零后按钮立即恢复，不等待下一次轮询，服务器仍在提交操作时再次校验真实时间。", count=1)
          replace(path, '否则工作冷却、生产、研发和拍卖倒计时会被旧快照重新计时。', '否则生产、研发和拍卖倒计时会被旧快照重新计时。', count=1)
