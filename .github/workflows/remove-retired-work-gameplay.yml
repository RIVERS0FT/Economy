name: Remove retired work gameplay

on:
  push:
    branches:
      - remove-retired-work-gameplay
    paths:
      - .github/workflows/remove-retired-work-gameplay.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.4.0
          cache: npm
      - run: npm ci
      - name: Apply retirement patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import re

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8', newline='\n')

          def replace(path, old, new, count=None, required=True):
              text = read(path)
              actual = text.count(old)
              if required and actual == 0:
                  raise SystemExit(f'{path}: missing replacement source: {old!r}')
              if count is not None and actual != count:
                  raise SystemExit(f'{path}: expected {count} matches, found {actual}: {old!r}')
              write(path, text.replace(old, new))

          def sub(path, pattern, repl, count=0, required=False, flags=0):
              text = read(path)
              out, actual = re.subn(pattern, repl, text, count=count, flags=flags)
              if required and actual == 0:
                  raise SystemExit(f'{path}: missing regex: {pattern!r}')
              write(path, out)
              return actual

          # Client runtime and schema.
          replace('src/api/game.ts', "  work: () => postAction('/work'),\n", '', count=1)
          replace('src/utils/localActivityStore.ts', "  | 'work'\n", '', count=1)
          sub('src/types.ts', r"\nexport interface WorkState \{\n(?:.*\n)*?\}\n", '', count=1, required=True)
          for line in ['  workIssued: number;\n', '  workClicks: number;\n', '  work: WorkState;\n']:
              replace('src/types.ts', line, '', count=1)

          path = 'src/app/gameViewModel.ts'
          for old in [
              '  isWorking: boolean;\n',
              '  work: () => Promise<ActionResult>;\n',
              '  const [isWorking, setIsWorking] = useState(false);\n',
              '  const workPendingRef = useRef(false);\n',
              "    if (action === 'work' && workPendingRef.current) {\n      return { ok: false, message: '工作正在处理中' };\n    }\n",
              "    if (action === 'work') {\n      workPendingRef.current = true;\n      setIsWorking(true);\n    }\n",
              "      if (action === 'work') {\n        workPendingRef.current = false;\n        setIsWorking(false);\n      }\n",
              "    work: () => runAction('work', gameActions.work),\n",
          ]:
              replace(path, old, '', count=1)
          replace(path, '    isWorking, isCheckingIn, inventoryUsed: derived.inventoryUsed,\n', '    isCheckingIn, inventoryUsed: derived.inventoryUsed,\n', count=1)

          # Server route and domain runtime.
          replace('server/src/game-routes.js', "  if (method === 'POST' && path === '/api/game/work') return { action: 'work', category: 'general' };\n", '', count=1)
          path = 'server/src/domain-core.js'
          for old in [
              '  workCooldownMs: 3_000,\n',
              '    work: { cooldownUntil: 0, lastWorkedAt: 0, streak: 0, totalClicks: 0 },\n',
              '      workIssued: 0,\n',
              '      workClicks: 0,\n',
              '    player.work ||= { cooldownUntil: 0, lastWorkedAt: 0, streak: 0, totalClicks: 0 };\n',
              '    player.work.streak = 0;\n',
              '    player.stats.workIssued = Number(player.stats.workIssued || 0);\n',
              '    player.stats.workClicks = Number(player.stats.workClicks ?? player.work.totalClicks ?? 0);\n',
              "    case 'work': return work(world, userId, now);\n",
              '    work: clone(player.work),\n',
          ]:
              replace(path, old, '', count=1)
          sub(path, r"\nfunction work\(world, userId, now\) \{\n.*?\n\}\n", '', count=1, required=True, flags=re.S)
          replace(path, '      weeklyChange: player.stats.workIssued + player.stats.populationIssued - player.stats.systemSinks,\n', '      weeklyChange: player.stats.populationIssued - player.stats.systemSinks,\n', count=1)

          replace('server/src/runtime-action-executor.js', "  'work', 'buildFacility', 'startFacility', 'pauseFacility', 'setFacilityRecipe',\n", "  'buildFacility', 'startFacility', 'pauseFacility', 'setFacilityRecipe',\n", count=1)
          replace('server/src/market-demand/state.js', '        Number(player.work?.lastWorkedAt || 0),\n', '', count=1)
          sub('server/src/facility-groups.js', r"^\s*player\.stats\.workClicks = Number\([^\n]+\);\n", '', count=1, required=True, flags=re.M)
          replace('server/src/facility-groups.js', '        Number(player.stats.workIssued || 0)\n          + ', '        ', count=1)

          # Tests: keep idempotency coverage without the retired action.
          path = 'server/test/domain.test.js'
          sub(path, r"\ntest\('work cooldown uses server time', \(\) => \{.*?\n\}\);\n", '\n', count=1, required=True, flags=re.S)
          sub(path, r"\ntest\('idempotency returns the original response without applying an action twice', \(\) => \{.*?\n\}\);\n\ntest\('client state uses", """\ntest('idempotency returns the original response without applying an action twice', () => {
  const store = new EconomyStore(':memory:');
  try {
    const request = {
      action: 'renamePlayer',
      payload: { playerName: 'Alice Updated' },
      requestKey: 'request-12345678',
      method: 'PATCH',
      path: '/api/game/profile',
    };
    const first = store.apply(alice, request, now);
    const second = store.apply(alice, request, now + 500);
    assert.deepEqual(second, first);
    assert.equal(store.getState(alice, now + 1_000).playerName, 'Alice Updated');
  } finally {
    store.close();
  }
});

test('client state uses""", count=1, required=True, flags=re.S)

          path = 'server/test/http.test.js'
          sub(path, r"    const first = await fetch\(`http://127\.0\.0\.1:\$\{gamePort\}/api/game/work`, \{.*?    assert\.equal\(accountRequestCount, 1\);", """    const first = await fetch(`http://127.0.0.1:${gamePort}/api/game/profile`, {
      method: 'PATCH',
      headers,
      body: JSON.stringify({ playerName: 'Server Player Updated' }),
    });
    assert.equal(first.status, 200);
    const firstPayload = await first.json();
    assert.deepEqual(Object.keys(firstPayload).sort(), ['result', 'revision']);
    assert.deepEqual(Object.keys(firstPayload.result).sort(), ['message', 'ok']);
    assert.equal(firstPayload.result.ok, true);
    assert.equal(typeof firstPayload.result.message, 'string');
    assert.equal(firstPayload.revision > statePayload.revision, true);

    const actionStateResponse = await fetch(
      `http://127.0.0.1:${gamePort}/api/game/state?${revisionQuery(statePayload.revision, statePayload.partitionRevisions)}`,
      { headers: { Cookie: 'session=ok' } },
    );
    assert.equal(actionStateResponse.status, 200);
    const actionStatePayload = await actionStateResponse.json();
    const actionState = mergePatches(initialState, actionStatePayload.patches);
    assert.equal(actionState.playerName, 'Server Player Updated');
    assert.equal(actionState.credits, 500);
    assert.equal(actionStatePayload.revision >= firstPayload.revision, true);
    assert.equal(actionStatePayload.serverNow >= unchangedPayload.serverNow, true);

    const repeated = await fetch(`http://127.0.0.1:${gamePort}/api/game/profile`, {
      method: 'PATCH',
      headers,
      body: JSON.stringify({ playerName: 'Server Player Updated' }),
    });
    assert.equal(repeated.status, 200);
    const repeatedPayload = await repeated.json();
    assert.deepEqual(repeatedPayload, firstPayload);

    const repeatedStateResponse = await fetch(
      `http://127.0.0.1:${gamePort}/api/game/state?${revisionQuery(actionStatePayload.revision, actionStatePayload.partitionRevisions)}`,
      { headers: { Cookie: 'session=ok' } },
    );
    assert.equal(repeatedStateResponse.status, 200);
    const repeatedStatePayload = await repeatedStateResponse.json();
    assert.deepEqual(Object.keys(repeatedStatePayload).sort(), ['revision', 'serverNow', 'unchanged']);
    assert.equal(repeatedStatePayload.revision, actionStatePayload.revision);
    assert.equal(repeatedStatePayload.unchanged, true);
    assert.equal(repeatedStatePayload.serverNow >= actionStatePayload.serverNow, true);

    const retiredWork = await fetch(`http://127.0.0.1:${gamePort}/api/game/work`, {
      method: 'POST',
      headers: { ...headers, 'Idempotency-Key': 'retired-work-route' },
      body: '{}',
    });
    assert.equal(retiredWork.status, 404);
    assert.equal(accountRequestCount, 1);""", count=1, required=True, flags=re.S)
          replace('server/test/auth-cache.test.js', "authenticationCacheMaxAgeForRequest('POST', '/api/game/work')", "authenticationCacheMaxAgeForRequest('POST', '/api/game/bank/deposits')", count=1)

          # Remove work-only fields from test and preview fixtures.
          fixture_paths = [
              'server/test/domain.test.js',
              'server/test/invitations.test.js',
              'server/test/state-partitions.test.js',
              'scripts/generate-local-game-preview.mjs',
              'tests/browser/runtime-harness.tsx',
              'tests/browser/market-runtime-harness.tsx',
          ]
          for fixture in fixture_paths:
              text = read(fixture)
              text = re.sub(r"^\s*work:\s*\{[^\n]*cooldownUntil[^\n]*\},\n", '', text, flags=re.M)
              text = re.sub(r"\bworkIssued:\s*[^,\n]+,\s*", '', text)
              text = re.sub(r"\bworkClicks:\s*[^,\n]+,\s*", '', text)
              text = re.sub(r"^\s*isWorking:\s*false,\n", '', text, flags=re.M)
              text = re.sub(r"^\s*work:\s*async \(\) => \(\{ ok: true, message: '工作完成' \}\),\n", '', text, flags=re.M)
              text = text.replace("message: '工作完成'", "message: '操作完成'")
              write(fixture, text)

          # State-delivery anti-regression now forbids the retired action instead of requiring it.
          replace('scripts/verify-state-delivery-capacity.mjs', "  '工作动作必须在请求发出时同步进入本地“处理中”状态',\n", "  '存在重复提交风险的权威按钮必须在请求发出时同步进入本地“处理中”状态',\n", count=1)
          replace('scripts/verify-state-delivery-capacity.mjs', "  '任何低于当前修订号的迟到响应不得覆盖工作响应',\n", "  '任何低于当前修订号的迟到响应不得覆盖较新的权威动作结果',\n", count=1)
          for old in [
              "  \"action === 'work' && workPendingRef.current\",\n",
              "  'setIsWorking(true)',\n",
              "  'setIsWorking(false)',\n",
          ]:
              replace('scripts/verify-state-delivery-capacity.mjs', old, '', count=1)
          marker = "forbidText('src/app/gameViewModel.ts', [\n  'acceptVersionedState(response.revision, response.state, action',\n  'refreshAbortRef.current',\n]);"
          replacement = marker + "\nforbidText('src/app/gameViewModel.ts', [\n  \"action === 'work'\",\n  'workPendingRef',\n  'setIsWorking(',\n  \"work: () => runAction('work'\",\n]);\nforbidText('src/api/game.ts', [\"postAction('/work')\"]);\nforbidText('server/src/game-routes.js', [\"/api/game/work\"]);"
          replace('scripts/verify-state-delivery-capacity.mjs', marker, replacement, count=1)

          # Market verifier protects against server/client work gameplay restoration.
          replace('scripts/verify-market-assets.mjs', "for (const text of ['workCooldownMs: 3_000','workClicks','boughtGoods','soldGoods','processPriceTransmission','costAnchor','downstreamValueAnchor','liquidity-buy','liquidity-sell','settleLiquidityBuy','settleLiquiditySell','findSelfCrossingOrder','systemBookIsCrossed']) {", "for (const text of ['boughtGoods','soldGoods','processPriceTransmission','costAnchor','downstreamValueAnchor','liquidity-buy','liquidity-sell','settleLiquidityBuy','settleLiquiditySell','findSelfCrossingOrder','systemBookIsCrossed']) {", count=1)
          marker = "for (const text of ['market.lastPrice - 2','market.lastPrice + 2']) {\n  if (domainSource.includes(text)) failures.push('领域实现不应包含: ' + text);\n}"
          replacement = marker + "\nfor (const text of ['workCooldownMs', 'function work(', \"case 'work'\", 'work_income', 'workIssued', 'workClicks']) {\n  if (domainSource.includes(text)) failures.push('领域实现不得恢复工作玩法: ' + text);\n}\nfor (const [path, text] of [\n  ['src/types.ts', 'export interface WorkState'],\n  ['src/types.ts', 'work: WorkState'],\n  ['src/api/game.ts', \"postAction('/work')\"],\n  ['src/app/gameViewModel.ts', 'workPendingRef'],\n  ['server/src/game-routes.js', '/api/game/work'],\n]) forbidText(path, text);"
          replace('scripts/verify-market-assets.mjs', marker, replacement, count=1)

          # Stress runner: replace work traffic with existing commodity order writes.
          path = 'tests/stress/run.mjs'
          replace(path, "const TRANSACTION_MIX_WEIGHTS = Object.freeze({\n  state: 60,\n  work: 10,\n  order: 10,\n  facilityToggle: 8,\n  recipe: 5,\n  build: 4,\n  research: 3,\n});", "const TRANSACTION_MIX_WEIGHTS = Object.freeze({\n  state: 60,\n  order: 15,\n  facilityToggle: 10,\n  recipe: 5,\n  build: 5,\n  research: 5,\n});", count=1)
          replace(path, '    nextWorkAt: Number.POSITIVE_INFINITY,\n', '    nextWriteAt: 0,\n', count=1)
          sub(path, r"async function verifyIdempotency\(metrics, client, endpoints, runId, invariants\) \{.*?\n\}\n\nfunction transactionMixCategory", """async function verifyIdempotency(metrics, client, endpoints, runId, invariants) {
  const requestKey = `stress:${runId}:order-idempotency:${client.slot}`;
  const body = {
    assetKind: 'commodity',
    assetId: STRESS_PRODUCT_ID,
    productId: STRESS_PRODUCT_ID,
    side: 'buy',
    quantity: 1,
    price: STRESS_ORDER_PRICE,
  };
  const first = await postAction(metrics, client, endpoints, '/orders', '/api/game/orders', body, requestKey);
  const repeated = await postAction(metrics, client, endpoints, '/orders', '/api/game/orders', body, requestKey);
  assert.deepEqual(repeated, first, '相同幂等键返回了不同动作确认');
  invariants.actionConfirmations += 2;
  invariants.idempotencyChecks += 1;
  client.nextWriteAt = performance.now() + 3_200;
  await fetchState(metrics, client, endpoints, invariants);
}

function transactionMixCategory""", count=1, required=True, flags=re.S)
          replace(path, "  threshold += TRANSACTION_MIX_WEIGHTS.work;\n  if (slot < threshold) return 'work';\n", '', count=1)
          sub(path, r"\n  if \(category === 'work'\) \{.*?\n  \}\n\n  if \(category === 'order'\)", "\n  if (category === 'order')", count=1, required=True, flags=re.S)
          text = read(path).replace('nextWorkAt', 'nextWriteAt')
          write(path, text)
          sub(path, r"      if \(definition\.writes && now >= client\.nextWriteAt\) \{\n        await postAction\(\n          metrics,\n          client,\n          endpoints,\n          '/work',\n          '/api/game/work',\n          \{\},\n          `stress:\$\{runId\}:work:\$\{client\.slot\}:\$\{randomUUID\(\)\}`,\n        \);\n        invariants\.actionConfirmations \+= 1;\n        client\.nextWriteAt = performance\.now\(\) \+ 3_200;\n        await fetchState\(metrics, client, endpoints, invariants\);\n      \} else \{", """      if (definition.writes && now >= client.nextWriteAt) {
        const openOrder = stressOpenOrder(client);
        if (openOrder) {
          await postAction(
            metrics,
            client,
            endpoints,
            `/orders/${encodeURIComponent(String(openOrder.id))}/cancel`,
            '/api/game/orders/:id/cancel',
            {},
            `stress:${runId}:write-cancel:${client.slot}:${randomUUID()}`,
          );
        } else {
          await postAction(
            metrics,
            client,
            endpoints,
            '/orders',
            '/api/game/orders',
            {
              assetKind: 'commodity',
              assetId: STRESS_PRODUCT_ID,
              productId: STRESS_PRODUCT_ID,
              side: 'buy',
              quantity: 1,
              price: STRESS_ORDER_PRICE,
            },
            `stress:${runId}:write-order:${client.slot}:${randomUUID()}`,
          );
        }
        invariants.actionConfirmations += 1;
        client.nextWriteAt = performance.now() + 3_200;
        await fetchState(metrics, client, endpoints, invariants);
      } else {""", count=1, required=True, flags=re.S)

          # Stress budgets no longer carry a route that does not exist.
          budgets_path = Path('tests/stress/budgets.json')
          budgets = json.loads(budgets_path.read_text(encoding='utf-8'))
          baseline = budgets.get('baselines', {}).get('mixedGithubNode24', {})
          baseline.pop('workP95Ms', None)
