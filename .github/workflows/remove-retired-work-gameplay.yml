          for profile in budgets.get('profiles', {}).values():
              profile.get('routes', {}).pop('POST /api/game/work', None)
          budgets_path.write_text(json.dumps(budgets, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          replace('tests/stress/stress-flow.test.mjs', "test('isolated transaction mix exercises state, work, orders, facilities, recipes, builds and research'", "test('isolated transaction mix exercises state, orders, facilities, recipes, builds and research'", count=1)
          replace('tests/stress/stress-flow.test.mjs', '  assert.equal(report.configuration.transactionMixWeights.work, 10);\n', '', count=1)
          replace('tests/stress/stress-flow.test.mjs', '  assert.equal(report.configuration.transactionMixWeights.order, 10);\n  assert.equal(report.configuration.transactionMixWeights.facilityToggle, 8);\n  assert.equal(report.configuration.transactionMixWeights.recipe, 5);\n  assert.equal(report.configuration.transactionMixWeights.build, 4);\n  assert.equal(report.configuration.transactionMixWeights.research, 3);\n', '  assert.equal(report.configuration.transactionMixWeights.order, 15);\n  assert.equal(report.configuration.transactionMixWeights.facilityToggle, 10);\n  assert.equal(report.configuration.transactionMixWeights.recipe, 5);\n  assert.equal(report.configuration.transactionMixWeights.build, 5);\n  assert.equal(report.configuration.transactionMixWeights.research, 5);\n', count=1)

          path = 'scripts/verify-stress-test-flow.mjs'
          replace(path, "  'work: 10',\n  'order: 10',\n  'facilityToggle: 8',\n  'recipe: 5',\n  'build: 4',\n  'research: 3',\n", "  'order: 15',\n  'facilityToggle: 10',\n  'recipe: 5',\n  'build: 5',\n  'research: 5',\n", count=1)
          sub(path, r"assert\.equal\(budgets\.profiles\?\.mixed\?\.routes\?\.\['POST /api/game/work'\]\?\.maxP95Ms, 1_100, 'mixed work p95 预算必须使用三次 Node 24 基线校准值'\);\n", '', count=1, required=True)
          sub(path, r"assert\.equal\(budgets\.baselines\?\.mixedGithubNode24\?\.workP95Ms\?\.length, 3, 'mixed 预算校准必须保存三个同环境观测值'\);\n", '', count=1, required=True)
          marker = "assert.equal(budgets.baselines?.mixedGithubNode24?.runIds?.length, 3, 'mixed 预算校准必须保存三个同环境 run ID');"
          replace(path, marker, marker + "\nassert.equal(JSON.stringify(budgets).includes('/api/game/work'), false, '压力预算不得恢复已退役工作路由');", count=1)
          replace(path, "  'isolated transaction mix exercises state, work, orders, facilities, recipes, builds and research',\n", "  'isolated transaction mix exercises state, orders, facilities, recipes, builds and research',\n", count=1)
          replace(path, "  '10% 工作',\n  '10% 商品订单',\n  '8% 工厂启停',\n  '5% 配方切换',\n  '4% 即时建设',\n  '3% 研发',\n", "  '15% 商品订单',\n  '10% 工厂启停',\n  '5% 配方切换',\n  '5% 即时建设',\n  '5% 研发',\n", count=1)
          marker = "assert.equal(\n  runner.includes('seedTransactionAssets: true'),"
          replace(path, marker, "assert.equal(runner.includes('/api/game/work'), false, '压力测试执行器不得恢复已退役工作路由');\n\n" + marker, count=1)

          # Authoritative design: the local-work cooldown instance is gone.
