name: Cycle inventory workspace
on:
  push:
    branches: [work/cycle-frozen-inventory-20260905]
    paths: [.github/workflows/cycle-inventory-workspace.yml]
permissions:
  contents: write
jobs:
  publish-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply and verify source changes on feature branch only
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = work/cycle-frozen-inventory-20260905
          base=3bee700b9517ee0be0fb888cfc91d88bd187a950
          git merge-base --is-ancestor "$base" HEAD
          git diff --exit-code "$base" -- . ':(exclude).github/workflows/cycle-inventory-workspace.yml' ':(exclude).github/cycle-work-*.b64'
          python3 - <<'PY'
          import base64, hashlib, json, lzma, pathlib, subprocess
          root = pathlib.Path.cwd().resolve()
          encoded = ''.join((root / f'.github/cycle-work-{i}.b64').read_text().strip() for i in range(1, 5))
          payload = base64.b64decode(encoded, validate=True)
          assert hashlib.sha256(payload).hexdigest() == '4b7e20c6237cdae340a7a8404d6c2f5369767b6e53d7afcdd3e961ee87fc749b', 'source transfer checksum mismatch'
          edits = json.loads(lzma.decompress(payload))
          assert len(edits) == 99
          seen = set()
          for name, chunks in edits:
              path = (root / name).resolve()
              assert path.is_relative_to(root) and '.git' not in path.relative_to(root).parts
              assert name not in seen and not name.startswith('.github/')
              seen.add(name)
              lines = path.read_text().splitlines(keepends=True) if path.exists() else []
              for start, delete, insert in reversed(chunks):
                  assert isinstance(start, int) and isinstance(delete, int)
                  assert 0 <= start <= len(lines) and 0 <= delete <= len(lines) - start
                  lines[start:start + delete] = insert.splitlines(keepends=True)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(''.join(lines))
              subprocess.run(['git', 'add', '--', name], check=True)
          PY
          git rm -- .github/cycle-work-1.b64 .github/cycle-work-2.b64 .github/cycle-work-3.b64 .github/cycle-work-4.b64 .github/workflows/cycle-inventory-workspace.yml
          git diff --cached --check
          actual=$(git write-tree)
          test "$actual" = ebddcab1f87f5aebb09b8602846a08dc801f02ed
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: 周期完成时正利润自动经营与可追溯商品冻结'
          git push origin HEAD:refs/heads/work/cycle-frozen-inventory-20260905
          echo "FEATURE_COMMIT=$(git rev-parse HEAD)"
      - uses: actions/setup-node@v4
        with:
          node-version: 24.4.0
          cache: npm
      - run: npm ci
      - run: bash scripts/prepare-playwright-chromium.sh
      - name: Validate floating commodity freeze details
        run: npm run test:browser -- tests/browser/commodity-freeze-details.spec.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cycle-freeze-browser-evidence
          path: test-results
          if-no-files-found: ignore
          retention-days: 1
