name: Cycle inventory workspace
on:
  push:
    branches: [work/cycle-frozen-inventory-20260905]
    paths: [.github/workflows/cycle-inventory-workspace.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 3bee700b9517ee0be0fb888cfc91d88bd187a950
          persist-credentials: false
      - name: Export tracked source for isolated implementation
        run: git archive --format=tar.gz HEAD > "$RUNNER_TEMP/economy-source.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: cycle-inventory-source
          path: ${{ runner.temp }}/economy-source.tar.gz
          retention-days: 1
          compression-level: 0
