name: Cycle inventory workspace
on:
  push:
    branches: [work/cycle-frozen-inventory-20260905]
    paths: [.github/workflows/cycle-inventory-workspace.yml]
permissions:
  contents: read
jobs:
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 3bee700b9517ee0be0fb888cfc91d88bd187a950
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.4.0
          cache: npm
      - run: npm ci
      - name: Package pinned local test dependencies
        run: |
          cp "$(command -v node)" node24
          tar -czf "$RUNNER_TEMP/economy-dependencies.tar.gz" node_modules node24
      - uses: actions/upload-artifact@v4
        with:
          name: cycle-inventory-dependencies
          path: ${{ runner.temp }}/economy-dependencies.tar.gz
          retention-days: 1
          compression-level: 0
