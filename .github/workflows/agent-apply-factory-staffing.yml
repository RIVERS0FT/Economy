name: Apply factory staffing implementation

on:
  push:
    branches:
      - agent/factory-staffing-rate
    paths:
      - '.agent/factory-staffing/**'
      - '.github/workflows/agent-apply-factory-staffing.yml'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-factory-staffing-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/factory-staffing-rate
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.4.0
          cache: npm

      - name: Decode and apply exact migrations
        shell: bash
        run: |
          set -euo pipefail
          : > migration.log
          for name in server client docs-tests; do
            {
              echo "=== ${name} ==="
              case "$name" in
                server) expected='a9b241a6f544bc27c6ba12e0eebe3541d71f5c569676b57ba1f4e874d6350b24' ;;
                client) expected='b6c4e6639ae57d01362e5e30475d6c843f898bfceeb2fed0af761bc8f89e7435' ;;
                docs-tests) expected='01eb58017fc93b1434282fab562965f99a433b51f73c6fae886b7e60aa3ea548' ;;
              esac
              if compgen -G ".agent/factory-staffing/${name}.part-*" >/dev/null; then
                cat ".agent/factory-staffing/${name}.part-"* > "/tmp/${name}.py.gz.b64"
              else
                cp ".agent/factory-staffing/${name}.py.gz.b64" "/tmp/${name}.py.gz.b64"
              fi
              printf '%s  %s\n' "$expected" "/tmp/${name}.py.gz.b64" | sha256sum --check
              base64 --decode "/tmp/${name}.py.gz.b64" | gzip --decompress > "/tmp/${name}.py"
              if [ "$name" = 'docs-tests' ]; then
                python3 - "/tmp/${name}.py" <<'PY'
          from pathlib import Path
          import sys
          path = Path(sys.argv[1])
          text = path.read_text()
          old = '详情只显示一行“单厂平均利润／分钟”：左侧为指标名称和“当前配方预计／下一周期预计／启动后预计／恢复后预计 · 最近真实成交价”，右侧为数值或内联缺价提示。\n'
          new = '详情只显示一行“单厂平均利润／分钟”：左侧为指标名称和“当前配方预计／下一周期预计／启动后预计／恢复后预计 · 最近真实成交价”，右侧为数值或内联缺价提示。缺失商品名称只允许出现在该行右侧和辅助说明中，不得扩展为逐商品成交价明细或第二张卡。不得恢复市场利润分析标题、盈利状态标签、原料成本、产出价值、周期成本、单周期利润、静态回本、警告列表或说明段落。完整估算口径可通过该行的辅助说明提供，但不得增加第二行指标卡或内部滚动区。\n'
          if text.count(old) != 1:
              raise SystemExit(f'docs migration patch expected one match, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
              fi
              python3 "/tmp/${name}.py"
            } 2>&1 | tee -a migration.log
          done
          python3 - <<'PY'
          from pathlib import Path
          path = Path('server/test/facility-groups.test.js')
          path.write_text(path.read_text().rstrip() + '\n')
          PY
          git diff --check 2>&1 | tee -a migration.log

      - name: Upload migration diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: factory-staffing-migration-log
          path: migration.log
          if-no-files-found: error
          retention-days: 1

      - name: Install dependencies
        run: npm ci

      - name: Build and test
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee factory-staffing-build.log

      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: factory-staffing-build-log
          path: factory-staffing-build.log
          if-no-files-found: error
          retention-days: 1

      - name: Commit verified source and remove temporary migration
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .agent/factory-staffing
          rm -f .github/workflows/agent-apply-factory-staffing.yml
          rm -f migration.log factory-staffing-build.log
          git config user.name 'OpenAI Agent'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m '增加工厂满员率与等效产能'
          git push origin HEAD:agent/factory-staffing-rate
