name: Apply factory staffing implementation

on:
  push:
    branches:
      - agent/factory-staffing-rate
    paths:
      - '.agent/factory-staffing/**'
      - '.github/workflows/agent-apply-factory-staffing.yml'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-factory-staffing-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/factory-staffing-rate
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.4.0
          cache: npm

      - name: Decode and apply exact migrations
        shell: bash
        run: |
          set -euo pipefail
          : > migration.log
          for name in server client docs-tests; do
            {
              echo "=== ${name} ==="
              case "$name" in
                server) expected='a9b241a6f544bc27c6ba12e0eebe3541d71f5c569676b57ba1f4e874d6350b24' ;;
                client) expected='b6c4e6639ae57d01362e5e30475d6c843f898bfceeb2fed0af761bc8f89e7435' ;;
                docs-tests) expected='01eb58017fc93b1434282fab562965f99a433b51f73c6fae886b7e60aa3ea548' ;;
              esac
              if compgen -G ".agent/factory-staffing/${name}.part-*" >/dev/null; then
                cat ".agent/factory-staffing/${name}.part-"* > "/tmp/${name}.py.gz.b64"
              else
                cp ".agent/factory-staffing/${name}.py.gz.b64" "/tmp/${name}.py.gz.b64"
              fi
              printf '%s  %s\n' "$expected" "/tmp/${name}.py.gz.b64" | sha256sum --check
              base64 --decode "/tmp/${name}.py.gz.b64" | gzip --decompress > "/tmp/${name}.py"
              if [ "$name" = 'docs-tests' ]; then
                python3 - "/tmp/${name}.py" <<'PY'
          from pathlib import Path
          import sys
          path = Path(sys.argv[1])
          text = path.read_text()
          old = '详情只显示一行“单厂平均利润／分钟”：左侧为指标名称和“当前配方预计／下一周期预计／启动后预计／恢复后预计 · 最近真实成交价”，右侧为数值或内联缺价提示。\n'
          new = '详情只显示一行“单厂平均利润／分钟”：左侧为指标名称和“当前配方预计／下一周期预计／启动后预计／恢复后预计 · 最近真实成交价”，右侧为数值或内联缺价提示。缺失商品名称只允许出现在该行右侧和辅助说明中，不得扩展为逐商品成交价明细或第二张卡。不得恢复市场利润分析标题、盈利状态标签、原料成本、产出价值、周期成本、单周期利润、静态回本、警告列表或说明段落。完整估算口径可通过该行的辅助说明提供，但不得增加第二行指标卡或内部滚动区。\n'
          if text.count(old) != 1:
              raise SystemExit(f'docs migration patch expected one match, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
              fi
              python3 "/tmp/${name}.py"
            } 2>&1 | tee -a migration.log
          done
          {
            python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              target = Path(path)
              text = target.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}: {old!r}')
              target.write_text(text.replace(old, new, 1))

          path = Path('server/test/facility-groups.test.js')
          path.write_text(path.read_text().rstrip() + '\n')

          verification = Path('scripts/verify-money-precision.mjs')
          text = verification.read_text()
          replacements = {
              'CURRENT_CLIENT_STATE_VERSION = 20': 'CURRENT_CLIENT_STATE_VERSION = 21',
              'MIN_COMPATIBLE_CLIENT_STATE_VERSION = 20': 'MIN_COMPATIBLE_CLIENT_STATE_VERSION = 21',
              'world\\.version = 17': 'world\\.version = 18',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'money precision verification expected one match, found {text.count(old)}: {old}')
              text = text.replace(old, new, 1)
          verification.write_text(text)

          readme = Path('README.md')
          text = readme.read_text()
          for old, new in {
              '客户端状态版本：`20`': '客户端状态版本：`21`',
              '世界状态版本：`17`': '世界状态版本：`18`',
          }.items():
              if text.count(old) != 1:
                  raise SystemExit(f'root README version expected one match, found {text.count(old)}: {old}')
              text = text.replace(old, new, 1)
          readme.write_text(text)

          replace_once(
              'docs/PAGE_CONTENT_AND_NAVIGATION_DESIGN.md',
              '生产公式是集群运行能力展示，公式只展示集群输入、输出、周期和成本。当前周期只使用 `participatingCount`；停止或异常使用 `nextCycleCount` 表示启动后或恢复后的集群能力。周期时长不乘工厂数量，`pendingJoinCount` 不得提前进入当前周期，`group.count` 不得作为公式乘数。开关只改变服务器运行意图；异常时仍保持开启视觉，并等待资金、原料或仓库恢复后自动从完整新周期继续。',
              '生产公式是集群运行能力展示，公式只展示集群输入、输出、周期和成本。当前周期显示 `participatingCount`、`cycleStaffingRateBps` 和 `cycleEffectiveCount`；停止或异常使用 `nextCycleCount`、预计满员率与 `nextCycleEffectiveCount` 表示启动后或恢复后的集群能力。输入、输出和成本统一按整数等效产能计算；周期时长不乘工厂数量，`pendingJoinCount` 不得提前进入当前周期，`group.count` 不得作为公式乘数。开关只改变服务器运行意图；异常时仍保持开启视觉，并等待资金、原料或仓库恢复后自动从完整新周期继续。',
          )
          replace_once(
              'docs/PAGE_CONTENT_AND_NAVIGATION_DESIGN.md',
              '公式上方必须显示“本周期 × N”“启动后 × N”或“恢复后 × N”的范围标识。',
              '公式上方必须显示“本周期 P 座 · 满员率 R% · 等效 × E”，停止或异常时显示对应的“启动后／恢复后 P 座 · 满员率 R% · 等效 × E”范围标识。',
          )
          replace_once(
              'docs/UI_DESIGN_SYSTEM.md',
              '- 让生产公式恢复单座输入、输出或成本，或让运行中的公式不按 `participatingCount` 变化；\n- 停止或异常时不使用 `nextCycleCount`，使用 `group.count` 作为公式乘数，或把 `pendingJoinCount` 提前计入当前周期；',
              '- 让生产公式恢复单座输入、输出或成本，或让运行中的公式不同时显示 `participatingCount`、锁定满员率和 `cycleEffectiveCount`；\n- 停止或异常使用 `nextCycleCount`、预计满员率与 `nextCycleEffectiveCount`；不得使用 `group.count` 作为公式乘数，也不得把 `pendingJoinCount` 提前计入当前周期；',
          )
          replace_once(
              'docs/INDUSTRY_AND_PRODUCTION_DESIGN.md',
              '详情只显示一行“单厂平均利润／分钟”：左侧为指标名称和“当前配方预计／下一周期预计／启动后预计／恢复后预计 · 最近真实成交价 · 满员率 R%”，右侧为按对应周期满员率线性缩放后的数值或内联缺价提示。\n',
              '详情只显示一行“单厂平均利润／分钟”：左侧为指标名称和“当前配方预计／下一周期预计／启动后预计／恢复后预计 · 最近真实成交价 · 满员率 R%”，右侧为按对应周期满员率线性缩放后的数值或内联缺价提示。缺失商品名称只允许出现在该行右侧和辅助说明中，不得扩展为逐商品成交价明细或第二张卡。不得恢复市场利润分析标题、盈利状态标签、原料成本、产出价值、周期成本、单周期利润、静态回本、警告列表或说明段落。完整估算口径可通过该行的辅助说明提供，但不得增加第二行指标卡或内部滚动区。\n',
          )
          verifier = Path('scripts/verify-unified-factory-recipes-grid.mjs')
          text = verifier.read_text()
          for old, new in {
              '运行中按 `participatingCount`': '运行中显示 `participatingCount`、本周期锁定满员率与 `cycleEffectiveCount`',
              '当前周期只使用 `participatingCount`': '当前周期显示 `participatingCount`、`cycleStaffingRateBps` 和 `cycleEffectiveCount`',
              '停止或异常使用 `nextCycleCount`': '停止或异常使用 `nextCycleCount`、预计满员率与 `nextCycleEffectiveCount`',
          }.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'unified factory verifier expected one match, found {count}: {old}')
              text = text.replace(old, new, 1)
          verifier.write_text(text)

          auctions = Path('scripts/verify-asset-auctions.mjs')
          text = auctions.read_text()
          for old, new in {
              'world.version = 17;': 'world.version = 18;',
              'Back up production database before world 17 migration': 'Back up production database before world 18 migration',
              '客户端状态版本：`20`': '客户端状态版本：`21`',
              '世界状态版本：`17`': '世界状态版本：`18`',
          }.items():
              text = text.replace(old, new)
          for expected in [
              'world.version = 18;',
              'Back up production database before world 18 migration',
              '客户端状态版本：`21`',
              '世界状态版本：`18`',
          ]:
              if expected not in text:
                  raise SystemExit(f'asset auction verifier missing synchronized assertion: {expected}')
          auctions.write_text(text)
          PY
          } 2>&1 | tee -a migration.log
          git diff --check 2>&1 | tee -a migration.log
          rm -rf .agent/factory-staffing
          rmdir .agent 2>/dev/null || true

      - name: Upload migration diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: factory-staffing-migration-log
          path: migration.log
          if-no-files-found: error
          retention-days: 1

      - name: Install dependencies
        run: npm ci

      - name: Build and test
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee factory-staffing-build.log

      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: factory-staffing-build-log
          path: factory-staffing-build.log
          if-no-files-found: error
          retention-days: 1

      - name: Commit verified source and remove temporary migration
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .agent
          rm -f .github/workflows/agent-apply-factory-staffing.yml
          rm -f migration.log factory-staffing-build.log
          git config user.name 'OpenAI Agent'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m '增加工厂满员率与等效产能'
          git push origin HEAD:agent/factory-staffing-rate
