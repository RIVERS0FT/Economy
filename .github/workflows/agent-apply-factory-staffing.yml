name: Apply factory staffing implementation

on:
  push:
    branches:
      - agent/factory-staffing-rate
    paths:
      - '.agent/factory-staffing/**'
      - '.github/workflows/agent-apply-factory-staffing.yml'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-factory-staffing-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/factory-staffing-rate
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.4.0
          cache: npm

      - name: Decode and apply exact migrations
        shell: bash
        run: |
          set -euo pipefail
          : > migration.log
          for name in server client docs-tests; do
            {
              echo "=== ${name} ==="
              case "$name" in
                server) expected='a9b241a6f544bc27c6ba12e0eebe3541d71f5c569676b57ba1f4e874d6350b24' ;;
                client) expected='b6c4e6639ae57d01362e5e30475d6c843f898bfceeb2fed0af761bc8f89e7435' ;;
                docs-tests) expected='01eb58017fc93b1434282fab562965f99a433b51f73c6fae886b7e60aa3ea548' ;;
              esac
              if compgen -G ".agent/factory-staffing/${name}.part-*" >/dev/null; then
                cat ".agent/factory-staffing/${name}.part-"* > "/tmp/${name}.py.gz.b64"
              else
                cp ".agent/factory-staffing/${name}.py.gz.b64" "/tmp/${name}.py.gz.b64"
              fi
              printf '%s  %s\n' "$expected" "/tmp/${name}.py.gz.b64" | sha256sum --check
              base64 --decode "/tmp/${name}.py.gz.b64" | gzip --decompress > "/tmp/${name}.py"
              if [ "$name" = 'docs-tests' ]; then
                python3 .agent/factory-staffing/prepatch.py "/tmp/${name}.py"
              fi
              python3 "/tmp/${name}.py"
            } 2>&1 | tee -a migration.log
          done
          python3 .agent/factory-staffing/postpatch.py 2>&1 | tee -a migration.log
          git diff --check 2>&1 | tee -a migration.log
          rm -rf .agent/factory-staffing
          rmdir .agent 2>/dev/null || true

      - name: Upload migration diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: factory-staffing-migration-log
          path: migration.log
          if-no-files-found: error
          retention-days: 1

      - name: Install dependencies
        run: npm ci

      - name: Build and test
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee factory-staffing-build.log

      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: factory-staffing-build-log
          path: factory-staffing-build.log
          if-no-files-found: error
          retention-days: 1

      - name: Commit verified source
        shell: bash
        run: |
          set -o pipefail
          {
            rm -f migration.log factory-staffing-build.log factory-staffing-commit.log
            git checkout origin/agent/factory-staffing-rate -- .github/workflows/deploy.yml
            git config user.name 'OpenAI Agent'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -A
            git diff --cached --check
            git commit -m '增加工厂满员率与等效产能'
            git push origin HEAD:agent/factory-staffing-rate
          } 2>&1 | tee factory-staffing-commit.log

      - name: Upload commit diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: factory-staffing-commit-log
          path: factory-staffing-commit.log
          if-no-files-found: error
          retention-days: 1
