name: Trigger facility artwork 256

on:
  push:
    branches:
      - agent/facility-artwork-256
    paths:
      - .github/agent/facility-artwork-256.trigger

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/facility-artwork-256
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.4.0
          cache: npm

      - name: Apply changes
        run: node .github/agent/upgrade-facility-artwork-256.mjs

      - name: Install dependencies
        run: npm ci

      - name: Build and verify
        run: npm run build

      - name: Check patch
        run: git diff --check

      - name: Commit implementation
        run: |
          set -euo pipefail
          rm .github/agent/upgrade-facility-artwork-256.mjs
          rm .github/agent/facility-artwork-256.trigger
          rm .github/workflows/apply-facility-artwork-256.yml
          rm .github/workflows/apply-facility-artwork-256-trigger.yml
          git config user.name 'RIVERS0FT'
          git config user.email '105160096+RIVERS0FT@users.noreply.github.com'
          git add docs/UI_DESIGN_SYSTEM.md \
            scripts/generate-facility-artwork-thumbnails.mjs \
            scripts/verify-facility-artwork.mjs \
            src/styles/facility-artwork.css \
            tests/browser/facility-artwork-resolution.spec.ts
          git add -u .github
          git commit -m '升级工厂场景运行时插画至 256px'
          git push origin HEAD:agent/facility-artwork-256
