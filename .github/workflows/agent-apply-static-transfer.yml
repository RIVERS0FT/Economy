name: Apply static transfer compression

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/optimize-static-transfer
          fetch-depth: 0
      - name: Apply compression rules
        run: |
          set -uo pipefail
          rm -f .agent/static-transfer-failure.log
          set +e
          {
            python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('.agent/apply-static-transfer.py')
          text = path.read_text(encoding='utf-8')
          pattern = r'(?m)^    \'\'\'        self\.assertIn\("gzip_types application/json;", updated\)$'
          replacement = (
              '    \'\'\'        self.assertIn("location ^~ /economy-api/game/", updated)\n'
              '        self.assertIn("gzip_types application/json;", updated)'
          )
          updated, count = re.subn(pattern, replacement, text, count=2)
          if count != 2:
              raise SystemExit(f'apply script gzip assertion anchors: {count}')

          lines = updated.splitlines()
          header_lines = [index for index, line in enumerate(lines) if "Accept-Encoding: gzip" in line]
          if len(header_lines) != 1:
              raise SystemExit(f'apply script Accept-Encoding lines: {len(header_lines)}')
          lines[header_lines[0]] = '    "  \\"--header \\'Accept-Encoding: gzip\\'\\",\\n"'
          path.write_text("\n".join(lines) + "\n", encoding='utf-8')
          PY
            python3 .agent/apply-static-transfer.py
            git diff --check
            python3 scripts/test_configure_economy_nginx.py
            node scripts/verify-state-delivery-capacity.mjs
          } > /tmp/static-transfer-apply.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            {
              printf 'run_id=%s\n' "$GITHUB_RUN_ID"
              cat /tmp/static-transfer-apply.log
            } > .agent/static-transfer-failure.log
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .agent/static-transfer-failure.log
            git commit -m "记录静态压缩完整验证失败"
            git push origin HEAD:agent/optimize-static-transfer
            cat /tmp/static-transfer-apply.log
            exit "$status"
          fi
          cat /tmp/static-transfer-apply.log
          rm -f .agent/apply-static-transfer.py
          rm -f .agent/static-transfer-failure.log
          rm -f .github/workflows/agent-apply-static-transfer.yml
          rmdir .agent 2>/dev/null || true
      - name: Commit compression rules
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "优化静态资源 gzip 传输"
          git push origin HEAD:agent/optimize-static-transfer
