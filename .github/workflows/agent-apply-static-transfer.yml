name: Apply static transfer compression

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/optimize-static-transfer
          fetch-depth: 0
      - name: Apply compression rules
        run: |
          set -euo pipefail
          python3 .agent/apply-static-transfer.py
          rm -f .agent/apply-static-transfer.py
          rm -f .github/workflows/agent-apply-static-transfer.yml
          rmdir .agent 2>/dev/null || true
          git diff --check
          python3 scripts/test_configure_economy_nginx.py
          node scripts/verify-state-delivery-capacity.mjs
      - name: Commit compression rules
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "优化静态资源 gzip 传输"
          git push origin HEAD:agent/optimize-static-transfer
