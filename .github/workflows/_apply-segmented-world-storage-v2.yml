name: Verify segmented storage V2 authority

on:
  push:
    branches:
      - perf/segmented-world-storage-v2

permissions:
  contents: write

jobs:
  verify:
    if: github.event.head_commit.message == 'Finalize segmented storage V2 authority'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/segmented-world-storage-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.4.0'
          cache: npm
      - name: Apply authority follow-up
        run: |
          node scripts/.authority-followup.mjs
          git diff --check
      - name: Commit authority follow-up
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/README.md
          git commit -m 'Complete segmented storage authority guards'
          git push origin HEAD:perf/segmented-world-storage-v2
      - run: npm ci
      - name: Verify
        shell: bash
        run: |
          set -o pipefail
          node scripts/verify-runtime-efficiency.mjs 2>&1 | tee verify.log
          node scripts/verify-authoritative-hotpaths.mjs 2>&1 | tee -a verify.log
          node --test server/test/world-storage-v2.test.js server/test/state-polling.test.js server/test/runtime-hotpath-architecture.test.js server/test/authoritative-hotpaths.test.js server/test/research.test.js server/test/banking.test.js server/test/asset-auctions.test.js server/test/online-auto-sell-persistence.test.js 2>&1 | tee -a verify.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: segmented-storage-v2-final-verify
          path: verify.log
          if-no-files-found: warn
          retention-days: 1
