# Temporary branch-only verification workflow; removed before squash merge.
name: Verify segmented storage V2 authority

on:
  push:
    branches:
      - perf/segmented-world-storage-v2

permissions:
  contents: write

jobs:
  verify:
    if: github.event.head_commit.message == 'Verify segmented storage V2 authority'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/segmented-world-storage-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.4.0'
          cache: npm
      - name: Fix V2 verifiers and regressions
        run: |
          node scripts/.verifier-cow-wording-fix.mjs
          git diff --check
      - name: Commit V2 fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/verify-authoritative-hotpaths.mjs scripts/verify-state-delivery-capacity.mjs scripts/verify-staple-crops-demand.mjs scripts/verify-asset-auctions.mjs scripts/verify-admin-player-statistics.mjs server/src/storage.js server/src/contract-audit-store.js server/test/asset-events.test.js server/test/domain.test.js tests/stress/run.mjs
          git commit -m 'Fix segmented storage V2 compatibility regressions'
          git push origin HEAD:perf/segmented-world-storage-v2
      - run: npm ci
      - name: Verify stress flow first
        run: npm run test:stress
      - name: Verify authority and regressions
        run: |
          npm run build
          node scripts/verify-runtime-efficiency.mjs
          node scripts/verify-authoritative-hotpaths.mjs
          node --test server/test/world-storage-v2.test.js server/test/state-polling.test.js server/test/runtime-hotpath-architecture.test.js server/test/authoritative-hotpaths.test.js server/test/research.test.js server/test/banking.test.js server/test/asset-auctions.test.js server/test/online-auto-sell-persistence.test.js
