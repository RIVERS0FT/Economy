name: Apply segmented world storage v2

on:
  push:
    branches:
      - perf/segmented-world-storage-v2

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.event.head_commit.message == 'Run segmented storage patch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/segmented-world-storage-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.4.0'
          cache: npm
      - name: Apply core patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/.apply-segmented-world-storage-v2.mjs')
          source = path.read_text()
          generic_invariant = """replaceOnce(
            'server/src/runtime-action-executor.js',
            "      measureRequestPhase('economicInvariantMs', () => assertEconomicStateInvariants(world));",
            "      measureRequestPhase('economicInvariantMs', () => assertEconomicStateInvariantsScoped(world, mutationScope));",
          );"""
          scoped_invariant = """replaceOnce(
            'server/src/runtime-action-executor.js',
            `    if (gameResult?.ok) {
                measureRequestPhase('economicInvariantMs', () => assertEconomicStateInvariants(world));
                savepoint.release();
              } else {`,
            `    if (gameResult?.ok) {
                measureRequestPhase('economicInvariantMs', () => assertEconomicStateInvariantsScoped(world, mutationScope));
                savepoint.release();
              } else {`,
          );"""
          generic_call = """replaceOnce(
            'server/src/runtime-action-executor.js',
            `      requestKey,
                now,
              );`,
            `      requestKey,
                now,
                mutationScope,
              );`,
          );"""
          scoped_call = """replaceOnce(
            'server/src/runtime-action-executor.js',
            `    const { gameResult, playerBeforeAction, contractsBeforeAction } = executeActionBody(
                store,
                world,
                user,
                action,
                payload,
                requestKey,
                now,
              );`,
            `    const { gameResult, playerBeforeAction, contractsBeforeAction } = executeActionBody(
                store,
                world,
                user,
                action,
                payload,
                requestKey,
                now,
                mutationScope,
              );`,
          );"""
          for before, after, label in [
              (generic_invariant, scoped_invariant, 'invariant'),
              (generic_call, scoped_call, 'executeActionBody'),
          ]:
              if before not in source:
                  raise SystemExit(f'missing generic {label} replacement')
              source = source.replace(before, after, 1)
          path.write_text(source)
          PY
          node --check scripts/.apply-segmented-world-storage-v2.mjs
          node scripts/.apply-segmented-world-storage-v2.mjs
          node --check scripts/.apply-segmented-world-storage-v2-followup.mjs
          node scripts/.apply-segmented-world-storage-v2-followup.mjs
          node --check scripts/.apply-segmented-world-storage-v2-coldread.mjs
          node scripts/.apply-segmented-world-storage-v2-coldread.mjs
          node --check server/src/world-storage-v2.js
          git diff --check
      - name: Install dependencies
        run: npm ci
      - name: Diagnose cold restart migration
        run: |
          node --input-type=module <<'JS'
          import { mkdtempSync, rmSync } from 'node:fs';
          import { tmpdir } from 'node:os';
          import { join } from 'node:path';
          import { EconomyStore } from './server/src/runtime-store.js';
          import { readSegmentedWorld, snapshotSegmentedWorld, segmentedSnapshotsEqual } from './server/src/world-storage-v2.js';
          const directory = mkdtempSync(join(tmpdir(), 'storage-v2-diag-'));
          const databasePath = join(directory, 'economy.sqlite');
          const user = { id: 1, email: 'alice@example.com', name: 'Alice', role: 'user' };
          const now = 1_700_000_000_000;
          try {
            const first = new EconomyStore(databasePath, { scheduledProcessing: false });
            first.getState(user, now);
            const action = first.apply(user, { action: 'bankDeposit', payload: { amount: 25 }, requestKey: 'diag-restart-12345678', method: 'POST', path: '/api/game/bank' }, now + 1);
            console.log('first revision', action.revision, first.worldCache.revision);
            first.close();

            const second = new EconomyStore(databasePath, { scheduledProcessing: true });
            try {
              const before = readSegmentedWorld(second);
              console.log('stored revision', before.revision);
              const loaded = second.transaction(() => second.loadWorld(now + 2), { immediate: false });
              console.log('after load', { revision: loaded.revision, cacheRevision: second.worldCache?.revision, needsPersistence: second.worldCache?.needsPersistence });
              const afterSnapshot = snapshotSegmentedWorld(second.worldCache.world);
              console.log('equal', segmentedSnapshotsEqual(before.snapshot, afterSnapshot));
              for (const [id, oldJson] of before.snapshot.playerStateJsonById) {
                const newJson = afterSnapshot.playerStateJsonById.get(id);
                if (oldJson !== newJson) {
                  const a = JSON.parse(oldJson); const b = JSON.parse(newJson);
                  const keys = [...new Set([...Object.keys(a), ...Object.keys(b)])].filter((key) => JSON.stringify(a[key]) !== JSON.stringify(b[key]));
                  console.log('changed player', id, keys);
                  for (const key of keys) console.log('player diff', key, JSON.stringify(a[key]), JSON.stringify(b[key]));
                }
              }
              for (const [key, oldJson] of before.snapshot.segmentStateJsonByKey) {
                const newJson = afterSnapshot.segmentStateJsonByKey.get(key);
                if (oldJson !== newJson) {
                  console.log('changed segment', key);
                  const start = (() => { let i = 0; while (i < oldJson.length && i < (newJson || '').length && oldJson[i] === newJson[i]) i += 1; return i; })();
                  console.log('segment diff', key, { start, before: oldJson.slice(Math.max(0,start-120), start+360), after: (newJson || '').slice(Math.max(0,start-120), start+360) });
                }
              }
              for (const key of afterSnapshot.segmentStateJsonByKey.keys()) if (!before.snapshot.segmentStateJsonByKey.has(key)) console.log('new segment', key);
            } finally { second.stopScheduler(); second.close(); }
          } finally { rmSync(directory, { recursive: true, force: true }); }
          JS
      - name: Run focused server tests
        run: |
          node --test \
            server/test/world-storage-v2.test.js \
            server/test/state-polling.test.js \
            server/test/runtime-hotpath-architecture.test.js \
            server/test/authoritative-hotpaths.test.js \
            server/test/research.test.js \
            server/test/banking.test.js \
            server/test/asset-auctions.test.js \
            server/test/online-auto-sell-persistence.test.js
      - name: Preserve workspace for follow-up
        if: always()
        run: git status --short
