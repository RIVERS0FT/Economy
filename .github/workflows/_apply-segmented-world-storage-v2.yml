name: Apply segmented storage V2 authority update

on:
  push:
    branches:
      - perf/segmented-world-storage-v2

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.event.head_commit.message == 'Apply segmented storage V2 authority update'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/segmented-world-storage-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.4.0'
          cache: npm
      - name: Apply authority and verifier update
        run: |
          node --check scripts/.authority-v2.mjs
          node scripts/.authority-v2.mjs
          git diff --check
      - name: Commit implementation checkpoint
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md docs/README.md docs/SERVER_ARCHITECTURE_AND_DEPLOYMENT_DESIGN.md server/src/runtime-store.js scripts/verify-runtime-efficiency.mjs scripts/verify-authoritative-hotpaths.mjs
          if ! git diff --cached --quiet; then
            git commit -m 'Document segmented storage V2 authority'
            git push origin HEAD:perf/segmented-world-storage-v2
          fi
      - run: npm ci
      - name: Run authority verification and focused server tests
        shell: bash
        run: |
          set -o pipefail
          node scripts/verify-runtime-efficiency.mjs 2>&1 | tee authority.log
          node scripts/verify-authoritative-hotpaths.mjs 2>&1 | tee -a authority.log
          node --test \
            server/test/world-storage-v2.test.js \
            server/test/state-polling.test.js \
            server/test/runtime-hotpath-architecture.test.js \
            server/test/authoritative-hotpaths.test.js \
            server/test/research.test.js \
            server/test/banking.test.js \
            server/test/asset-auctions.test.js \
            server/test/online-auto-sell-persistence.test.js \
            2>&1 | tee -a authority.log
      - name: Upload verification log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: segmented-storage-v2-authority
          path: authority.log
          if-no-files-found: warn
          retention-days: 1
