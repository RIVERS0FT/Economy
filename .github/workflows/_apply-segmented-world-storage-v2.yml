# Temporary branch-only finalization workflow; it deletes itself before the final PR.
name: Verify segmented storage V2 authority

on:
  push:
    branches:
      - perf/segmented-world-storage-v2

permissions:
  contents: write

jobs:
  verify:
    if: github.event.head_commit.message == 'Finalize segmented storage V2 cleanup'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/segmented-world-storage-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.4.0'
          cache: npm
      - name: Finalize V2 source tree
        run: |
          node scripts/.finalize-v2-cleanup.mjs
          git checkout origin/main -- tests/stress/run.mjs tests/stress/localHarness.mjs
          git diff --check
      - name: Commit final source tree
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Finalize segmented world storage V2'
          git push origin HEAD:perf/segmented-world-storage-v2
      - run: npm ci
      - name: Verify final source tree
        run: |
          npm run build
          npm run test:stress
          node scripts/verify-runtime-efficiency.mjs
          node scripts/verify-authoritative-hotpaths.mjs
          node --test server/test/world-storage-v2.test.js server/test/daily-check-in.test.js server/test/asset-events.test.js server/test/state-polling.test.js server/test/runtime-hotpath-architecture.test.js server/test/authoritative-hotpaths.test.js server/test/research.test.js server/test/banking.test.js server/test/asset-auctions.test.js server/test/online-auto-sell-persistence.test.js
