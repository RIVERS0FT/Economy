name: Apply segmented world storage v2

on:
  push:
    branches:
      - perf/segmented-world-storage-v2

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.event.head_commit.message == 'Run segmented storage patch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/segmented-world-storage-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.4.0'
          cache: npm
      - name: Apply core patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/.apply-segmented-world-storage-v2.mjs')
          source = path.read_text()
          generic_invariant = """replaceOnce(
            'server/src/runtime-action-executor.js',
            "      measureRequestPhase('economicInvariantMs', () => assertEconomicStateInvariants(world));",
            "      measureRequestPhase('economicInvariantMs', () => assertEconomicStateInvariantsScoped(world, mutationScope));",
          );"""
          scoped_invariant = """replaceOnce(
            'server/src/runtime-action-executor.js',
            `    if (gameResult?.ok) {
                measureRequestPhase('economicInvariantMs', () => assertEconomicStateInvariants(world));
                savepoint.release();
              } else {`,
            `    if (gameResult?.ok) {
                measureRequestPhase('economicInvariantMs', () => assertEconomicStateInvariantsScoped(world, mutationScope));
                savepoint.release();
              } else {`,
          );"""
          generic_call = """replaceOnce(
            'server/src/runtime-action-executor.js',
            `      requestKey,
                now,
              );`,
            `      requestKey,
                now,
                mutationScope,
              );`,
          );"""
          scoped_call = """replaceOnce(
            'server/src/runtime-action-executor.js',
            `    const { gameResult, playerBeforeAction, contractsBeforeAction } = executeActionBody(
                store,
                world,
                user,
                action,
                payload,
                requestKey,
                now,
              );`,
            `    const { gameResult, playerBeforeAction, contractsBeforeAction } = executeActionBody(
                store,
                world,
                user,
                action,
                payload,
                requestKey,
                now,
                mutationScope,
              );`,
          );"""
          for before, after, label in [
              (generic_invariant, scoped_invariant, 'invariant'),
              (generic_call, scoped_call, 'executeActionBody'),
          ]:
              if before not in source:
                  raise SystemExit(f'missing generic {label} replacement')
              source = source.replace(before, after, 1)
          path.write_text(source)
          PY
          node --check scripts/.apply-segmented-world-storage-v2.mjs
          node scripts/.apply-segmented-world-storage-v2.mjs
          node --check scripts/.apply-segmented-world-storage-v2-followup.mjs
          node scripts/.apply-segmented-world-storage-v2-followup.mjs
          node --check scripts/.apply-segmented-world-storage-v2-coldread.mjs
          node scripts/.apply-segmented-world-storage-v2-coldread.mjs
          node --check server/src/world-storage-v2.js
          git diff --check
      - name: Install dependencies
        run: npm ci
      - name: Diagnose cold restart migration
        run: |
          node --input-type=module <<'JS'
          import { mkdtempSync, rmSync } from 'node:fs';
          import { tmpdir } from 'node:os';
          import { join } from 'node:path';
          import { EconomyStore } from './server/src/runtime-store.js';
          import { readSegmentedWorld } from './server/src/world-storage-v2.js';
          import { processDailyCheckInWorld } from './server/src/daily-check-in.js';
          import { migrateBankWorld, ensurePlayerBankAccount } from './server/src/banking.js';
          import { ensureWeeklyCashSettlementWorld, ensurePlayerWeeklyCashSettlement } from './server/src/weekly-cash-settlement.js';
          import { ensureWarehouse } from './server/src/warehouse.js';
          import { ensureGemState } from './server/src/invitations.js';
          import { migrateAssetAuctionWorld } from './server/src/asset-auctions.js';
          import { migrateFacilityGroupWorld } from './server/src/facility-groups.js';
          import { migrateResearchWorld } from './server/src/research.js';
          import { migrateProductionContractWorld } from './server/src/contracts.js';
          import { normalizeWorldMoneyPrecision } from './server/src/money.js';
          const directory = mkdtempSync(join(tmpdir(), 'storage-v2-diag-'));
          const databasePath = join(directory, 'economy.sqlite');
          const user = { id: 1, email: 'alice@example.com', name: 'Alice', role: 'user' };
          const now = 1_700_000_000_000;
          const price = (world) => world.facilityMarkets?.industrial_land?.lastPrice;
          try {
            const first = new EconomyStore(databasePath, { scheduledProcessing: false });
            first.getState(user, now);
            first.apply(user, { action: 'bankDeposit', payload: { amount: 25 }, requestKey: 'diag-restart-12345678', method: 'POST', path: '/api/game/bank' }, now + 1);
            first.close();

            const second = new EconomyStore(databasePath, { scheduledProcessing: true });
            try {
              const stored = readSegmentedWorld(second);
              const world = structuredClone(stored.world);
              const log = (label) => console.log(label, { price: price(world), version: world.version });
              log('stored');
              processDailyCheckInWorld(world, now + 2); log('daily');
              migrateBankWorld(world, now + 2); log('bank');
              ensureWeeklyCashSettlementWorld(world, now + 2); log('weekly-world');
              for (const player of Object.values(world.players || {})) {
                ensureWarehouse(player);
                ensureGemState(player);
                ensurePlayerBankAccount(player, now + 2);
                ensurePlayerWeeklyCashSettlement(player, now + 2);
              }
              log('player-ensures');
              migrateAssetAuctionWorld(world, now + 2); log('auction');
              migrateFacilityGroupWorld(world, now + 2); log('facility');
              migrateResearchWorld(world, now + 2); log('research');
              migrateProductionContractWorld(world); log('contract');
              normalizeWorldMoneyPrecision(world); log('money');
            } finally { second.stopScheduler(); second.close(); }
          } finally { rmSync(directory, { recursive: true, force: true }); }
          JS
      - name: Run focused server tests
        run: |
          node --test \
            server/test/world-storage-v2.test.js \
            server/test/state-polling.test.js \
            server/test/runtime-hotpath-architecture.test.js \
            server/test/authoritative-hotpaths.test.js \
            server/test/research.test.js \
            server/test/banking.test.js \
            server/test/asset-auctions.test.js \
            server/test/online-auto-sell-persistence.test.js
      - name: Preserve workspace for follow-up
        if: always()
        run: git status --short
