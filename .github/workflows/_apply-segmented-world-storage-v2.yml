name: Apply segmented world storage v2

on:
  push:
    branches:
      - perf/segmented-world-storage-v2

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.event.head_commit.message == 'Run segmented storage fix'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/segmented-world-storage-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.4.0'
          cache: npm
      - name: Apply storage correctness fixes
        run: |
          node --check scripts/.fix-segmented-world-storage-v2.mjs
          node scripts/.fix-segmented-world-storage-v2.mjs
          git diff --check
      - name: Commit generated implementation checkpoint
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/src
          if ! git diff --cached --quiet; then
            git commit -m 'Fix segmented world storage correctness'
            git push origin HEAD:perf/segmented-world-storage-v2
          fi
      - name: Install dependencies
        run: npm ci
      - name: Run focused server tests
        run: |
          node --test \
            server/test/world-storage-v2.test.js \
            server/test/state-polling.test.js \
            server/test/runtime-hotpath-architecture.test.js \
            server/test/authoritative-hotpaths.test.js \
            server/test/research.test.js \
            server/test/banking.test.js \
            server/test/asset-auctions.test.js \
            server/test/online-auto-sell-persistence.test.js
      - name: Show resulting diff
        if: always()
        run: |
          git status --short
          git log -3 --oneline
