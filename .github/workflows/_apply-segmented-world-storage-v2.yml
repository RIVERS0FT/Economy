name: Trace segmented world storage v2 mutation

on:
  push:
    branches:
      - perf/segmented-world-storage-v2

permissions:
  contents: read

jobs:
  trace:
    if: github.event.head_commit.message == 'Trace unrelated player mutation'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/segmented-world-storage-v2
      - uses: actions/setup-node@v4
        with:
          node-version: '24.4.0'
          cache: npm
      - run: npm ci
      - name: Instrument unrelated player
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const path = 'server/test/world-storage-v2.test.js';
          const source = readFileSync(path, 'utf8');
          const before = "    const committedBob = store.worldCache.world.players['2'];\n    assert.equal(Object.hasOwn(committedBob, 'facilities'), false);";
          const after = `    const committedBob = store.worldCache.world.players['2'];
    assert.equal(Object.hasOwn(committedBob, 'facilities'), false);
    Object.defineProperty(committedBob, 'facilities', {
      configurable: true,
      enumerable: false,
      get() { return undefined; },
      set(value) {
        const error = new Error('UNRELATED_FACILITIES_MUTATION');
        error.assignedValue = value;
        throw error;
      },
    });`;
          if (!source.includes(before)) throw new Error('trace insertion target missing');
          writeFileSync(path, source.replace(before, after));
          NODE
      - name: Trace dirty-set test
        shell: bash
        run: |
          set -o pipefail
          node --test --test-name-pattern="dirty player write" server/test/world-storage-v2.test.js 2>&1 | tee trace.log
      - name: Upload trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: segmented-storage-mutation-trace
          path: trace.log
          if-no-files-found: warn
          retention-days: 1
