name: Apply segmented world storage v2

on:
  push:
    branches:
      - perf/segmented-world-storage-v2

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.event.head_commit.message == 'Run segmented storage patch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/segmented-world-storage-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.4.0'
          cache: npm
      - name: Apply core patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/.apply-segmented-world-storage-v2.mjs')
          source = path.read_text()
          generic_invariant = """replaceOnce(
            'server/src/runtime-action-executor.js',
            "      measureRequestPhase('economicInvariantMs', () => assertEconomicStateInvariants(world));",
            "      measureRequestPhase('economicInvariantMs', () => assertEconomicStateInvariantsScoped(world, mutationScope));",
          );"""
          scoped_invariant = """replaceOnce(
            'server/src/runtime-action-executor.js',
            `    if (gameResult?.ok) {
                measureRequestPhase('economicInvariantMs', () => assertEconomicStateInvariants(world));
                savepoint.release();
              } else {`,
            `    if (gameResult?.ok) {
                measureRequestPhase('economicInvariantMs', () => assertEconomicStateInvariantsScoped(world, mutationScope));
                savepoint.release();
              } else {`,
          );"""
          generic_call = """replaceOnce(
            'server/src/runtime-action-executor.js',
            `      requestKey,
                now,
              );`,
            `      requestKey,
                now,
                mutationScope,
              );`,
          );"""
          scoped_call = """replaceOnce(
            'server/src/runtime-action-executor.js',
            `    const { gameResult, playerBeforeAction, contractsBeforeAction } = executeActionBody(
                store,
                world,
                user,
                action,
                payload,
                requestKey,
                now,
              );`,
            `    const { gameResult, playerBeforeAction, contractsBeforeAction } = executeActionBody(
                store,
                world,
                user,
                action,
                payload,
                requestKey,
                now,
                mutationScope,
              );`,
          );"""
          for before, after, label in [
              (generic_invariant, scoped_invariant, 'invariant'),
              (generic_call, scoped_call, 'executeActionBody'),
          ]:
              if before not in source:
                  raise SystemExit(f'missing generic {label} replacement')
              source = source.replace(before, after, 1)
          path.write_text(source)
          PY
          node --check scripts/.apply-segmented-world-storage-v2.mjs
          node scripts/.apply-segmented-world-storage-v2.mjs
          node --check server/src/world-storage-v2.js
          git diff --check
      - name: Install dependencies
        run: npm ci
      - name: Diagnose revision flow
        run: |
          node --input-type=module <<'JS'
          import { EconomyStore } from './server/src/runtime-store.js';
          const user = { id: 1, email: 'alice@example.com', name: 'Alice' };
          const now = 1_700_000_000_000;
          const store = new EconomyStore(':memory:');
          const dump = (label) => {
            const meta = store.database.prepare('SELECT revision FROM economy_world_meta WHERE id=1').get();
            const players = store.database.prepare('SELECT user_id, updated_revision FROM economy_world_players ORDER BY user_id').all();
            const segments = store.database.prepare('SELECT segment_key, updated_revision FROM economy_world_segments WHERE updated_revision = ? ORDER BY segment_key').all(Number(meta?.revision || 0));
            console.log(label, { cacheRevision: store.worldCache?.revision, nextWorldProcessingAt: store.nextWorldProcessingAt, meta, players, segments });
          };
          const initial = store.getStateSnapshot(user, undefined, now);
          dump('after initial');
          const action = store.apply(user, { action: 'work', payload: {}, requestKey: 'diag-work-12345678', method: 'POST', path: '/api/game/work' }, now + 2000);
          dump('after action');
          console.log('initial/action', initial.revision, action.revision);
          const changed = store.getStateSnapshot(user, initial.revision, now + 2001);
          dump('after changed poll');
          console.log('changed', changed.revision, changed.unchanged);
          store.close();
          JS
      - name: Run focused server tests
        run: |
          node --test \
            server/test/world-storage-v2.test.js \
            server/test/state-polling.test.js \
            server/test/runtime-hotpath-architecture.test.js \
            server/test/authoritative-hotpaths.test.js \
            server/test/research.test.js \
            server/test/banking.test.js \
            server/test/asset-auctions.test.js \
            server/test/online-auto-sell-persistence.test.js
      - name: Preserve workspace for follow-up
        if: always()
        run: |
          git status --short
