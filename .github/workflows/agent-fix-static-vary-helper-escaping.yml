name: Fix static Vary helper escaping

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-static-gzip-vary-header
          fetch-depth: 0
      - name: Fix and verify helper escaping
        run: |
          set -uo pipefail
          set +e
          {
            python3 .agent/fix-static-vary-helper-escaping.py
            git diff --check
            python3 scripts/test_configure_economy_nginx.py
            node scripts/verify-state-delivery-capacity.mjs
          } > "$RUNNER_TEMP/static-vary-verify.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/static-vary-verify.log"
          if [ "$status" -ne 0 ]; then exit "$status"; fi
          rm -f .agent/fix-static-vary-helper-escaping.py
          rm -f .github/workflows/agent-fix-static-vary-helper-escaping.yml
          rmdir .agent 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "修复静态 Vary helper 转义"
          git push origin HEAD:agent/fix-static-gzip-vary-header
      - name: Upload static Vary verification log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: static-vary-verification-${{ github.run_id }}
          path: ${{ runner.temp }}/static-vary-verify.log
          if-no-files-found: error
          retention-days: 1
          compression-level: 9
