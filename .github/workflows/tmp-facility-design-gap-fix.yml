name: Fix facility design gap wording

on:
  push:
    branches:
      - codex/facility-object-card-visual

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/facility-object-card-visual
          fetch-depth: 0
      - name: Restore shared gap rule with building exception
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('docs/UI_DESIGN_SYSTEM.md')
          text = path.read_text(encoding='utf-8')
          old = '表头与首行、相邻数据行继续复用共享列 gap、横向 padding、Chevron 轨道和排序结构，业务 CSS 只定义字段列模板与已登记场景例外。'
          new = '除下文建筑对象卡条目间距例外外，表头与首行、相邻数据行统一使用同一 `.32rem` 间距；列 gap、横向 padding、Chevron 轨道和排序结构继续复用共享定义，业务 CSS 只定义字段列模板与已登记例外。'
          if text.count(old) != 1:
              raise SystemExit(f'expected one old sentence, got {text.count(old)}')
          text = text.replace(old, new)
          size = len(text.encode('utf-8'))
          if size > 128 * 1024:
              raise SystemExit(f'UI_DESIGN_SYSTEM.md exceeds 128 KiB: {size} bytes')
          path.write_text(text, encoding='utf-8')
          print(f'UI_DESIGN_SYSTEM.md size={size} bytes')
          PY
          node scripts/verify-page-content.mjs
          node scripts/verify-facility-catalog-layout.mjs
          git diff --check
      - name: Commit wording fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/UI_DESIGN_SYSTEM.md
          git commit -m "明确建筑对象卡列表间距例外"
          git push origin HEAD:codex/facility-object-card-visual
