name: codex-map-roam-followup

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'codex/map-roam-performance'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/map-roam-performance
          fetch-depth: 0
      - name: Update label click helper for camera group
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/browser/province-map.spec.ts')
          source = path.read_text()
          old = "const matrix = element.ownerSVGElement?.getScreenCTM();"
          new = "const matrix = element.getScreenCTM();"
          if source.count(old) != 1:
              raise SystemExit(f'expected one old CTM helper, found {source.count(old)}')
          path.write_text(source.replace(old, new, 1))
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/codex-map-roam-followup.yml
          git add tests/browser/province-map.spec.ts
          git commit -m "适配共享地图相机的标签点击回归"
          git push origin HEAD:codex/map-roam-performance
