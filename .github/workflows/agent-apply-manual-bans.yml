name: Apply manual administrator bans

on:
  push:
    branches:
      - agent/manual-admin-bans

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/manual-admin-bans
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.4.0
          cache: npm
      - name: Apply approved patch
        env:
          PATCH_B64: ""
        run: |
          python3 - <<'PY'
          import base64, os, zlib
          payload = base64.b64decode(os.environ['PATCH_B64'])
          open('/tmp/apply_manual_bans.py', 'wb').write(zlib.decompress(payload))
          PY
          python3 /tmp/apply_manual_bans.py
      - name: Install dependencies
        run: npm ci
      - name: Validate focused changes
        run: |
          node --check server/src/invitations.js
          node --check server/src/registration-store.js
          node --check server/src/app.js
          node scripts/verify-gems-invitations-and-bans.mjs
          node --test server/test/invitations.test.js
          npm run typecheck
          git diff --check
      - name: Commit approved changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Make account bans administrator-only"
          git push origin HEAD:agent/manual-admin-bans
