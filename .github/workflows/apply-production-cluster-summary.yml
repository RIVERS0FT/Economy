name: Apply Production Cluster Summary

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.4.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply production cluster summary changes
        run: node .agent/apply-production-cluster-summary.mjs

      - name: Remove temporary application files before verification
        run: |
          rm -f .agent/apply-production-cluster-summary.mjs
          rm -f .github/workflows/apply-production-cluster-summary.yml
          rmdir .agent 2>/dev/null || true

      - name: Build and run full static and server checks
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee production-cluster-build.log

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify production status summary in browser
        shell: bash
        run: |
          set -o pipefail
          npm run test:browser -- tests/browser/production-status-summary.spec.ts 2>&1 | tee production-cluster-browser.log

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: production-cluster-summary-diagnostics
          path: |
            production-cluster-build.log
            production-cluster-browser.log
          if-no-files-found: warn
          retention-days: 3

      - name: Commit verified source changes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "按集群统计生产状态"
          git push origin HEAD:${{ github.head_ref }}
