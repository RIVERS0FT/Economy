name: Apply API hotpath v2 retry

on:
  push:
    branches:
      - perf/api-hotpath-v2

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.event.head_commit.message == 'Retry API hotpath patch workflow'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/api-hotpath-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.4.0'
          cache: npm
      - name: Apply guarded patch
        run: |
          node scripts/.fix-api-hotpath-patcher.mjs
          node scripts/.fix-api-hotpath-patcher-2.mjs
          node --check scripts/.apply-api-hotpath-v2.mjs
          node scripts/.apply-api-hotpath-v2.mjs
          sed -i '/^\/\/ contractProjectionForState$/d' server/src/runtime-store.js
          sed -i "/  'contractProjectionForState',/d" scripts/verify-runtime-efficiency.mjs
          sed -i 's/正式调度继续按同一修订号计划和实际到期领域推进/正式调度继续复用同一修订号计划并只按实际到期领域推进/' docs/README.md
          sed -i 's/export function createAssetAuctionClientState(world, userId, _now = Date.now())/export function createAssetAuctionClientState(world, userId, now = Date.now())/' server/src/asset-auctions.js
      - name: Complete read-only domain projection
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          function replace(path, before, after) {
            const source = fs.readFileSync(path, 'utf8');
            if (!source.includes(before)) throw new Error(`missing target in ${path}`);
            fs.writeFileSync(path, source.replace(before, after));
          }
          replace(
            'server/src/domain.js',
            "export function createClientState(world, userId, now = Date.now()) {\n  migrateWorld(world, now);\n  const state = core.createClientState(world, userId, now);\n",
            "export function createClientState(world, userId, now = Date.now(), { migrate = true } = {}) {\n  if (migrate) migrateWorld(world, now);\n  const state = core.createClientState(world, userId, now, { migrate });\n",
          );
          replace(
            'server/src/domain-core.js',
            "  const player = getPlayer(world, userId);\n  const wheatInventory = inventoryFor(player, 'wheat');\n  const wheatMarket = marketFor(world, 'wheat');\n",
            "  const player = getPlayer(world, userId);\n  const wheatInventory = migrate\n    ? inventoryFor(player, 'wheat')\n    : player.inventories?.wheat || { available: 0, frozen: 0 };\n  const wheatMarket = migrate\n    ? marketFor(world, 'wheat')\n    : world.markets?.wheat || createMarket(productDefinition('wheat'), now);\n",
          );
          replace('server/src/domain-core.js', '    facilities: clone(player.facilities),\n', '    facilities: clone(player.facilities || []),\n');
          replace('server/src/domain-core.js', '    trades: clone(player.trades),\n    ledger: clone(player.ledger),\n', '    trades: clone(player.trades || []),\n    ledger: clone(player.ledger || []),\n');
          replace('server/src/domain-core.js', '    inventoryCapacity: player.inventoryCapacity,\n', "    ...(migrate && player.inventoryCapacity !== undefined ? { inventoryCapacity: player.inventoryCapacity } : {}),\n");
          replace('server/src/domain-core.js', '    leaderboard: createLeaderboard(world, userId, now),\n', '    leaderboard: migrate ? createLeaderboard(world, userId, now) : [],\n');

          replace(
            'server/src/warehouse.js',
            'export function createWarehouseSummary(player) {\n  return {\n',
            'export function createWarehouseSummary(player) {\n  ensureWarehouse(player);\n  return createWarehouseSummaryReadOnly(player);\n}\n\nexport function createWarehouseSummaryReadOnly(player) {\n  return {\n',
          );
          replace(
            'server/src/storage.js',
            "import { createWarehouseSummary, ensureWarehouse } from './warehouse.js';\n",
            "import { createWarehouseSummaryReadOnly, ensureWarehouse } from './warehouse.js';\n",
          );
          replace('server/src/storage.js', '    ...createWarehouseSummary(player),\n', '    ...createWarehouseSummaryReadOnly(player),\n');

          replace(
            'server/src/banking.js',
            "  const bank = world?.bank && typeof world.bank === 'object'\n    ? world.bank\n    : defaultBankWorld(now);\n  const account = player?.bankAccount && typeof player.bankAccount === 'object'\n    ? player.bankAccount\n    : defaultPlayerBankAccount(player, now);\n",
            "  const bank = {\n    ...defaultBankWorld(now),\n    ...(world?.bank && typeof world.bank === 'object' ? world.bank : {}),\n  };\n  const account = {\n    ...defaultPlayerBankAccount(player, now),\n    ...(player?.bankAccount && typeof player.bankAccount === 'object' ? player.bankAccount : {}),\n  };\n",
          );

          replace('server/src/leaderboards.js', 'const snapshotRowsCache = new WeakMap();\n\n', '');
          replace(
            'server/src/leaderboards.js',
            "function snapshotRowsByBoard(world, state) {\n  const cached = snapshotRowsCache.get(world);\n  if (cached?.state === state) return cached.rowsByBoard;\n  const rowsByBoard = Object.fromEntries(BOARD_IDS.map((boardId) => [\n    boardId,\n    snapshotRowsFor(world, state, boardId),\n  ]));\n  snapshotRowsCache.set(world, { state, rowsByBoard });\n  return rowsByBoard;\n}\n",
            "function snapshotRowsByBoard(world, state) {\n  return Object.fromEntries(BOARD_IDS.map((boardId) => [\n    boardId,\n    snapshotRowsFor(world, state, boardId),\n  ]));\n}\n",
          );
          NODE
      - name: Install dependencies
        run: npm ci
      - name: Run focused server regression
        run: |
          node --test server/test/runtime-hotpath-architecture.test.js server/test/authoritative-hotpaths.test.js server/test/request-metrics.test.js server/test/banking.test.js server/test/warehouse.test.js server/test/leaderboards.test.js server/test/instant-facility-construction.test.js
          npm run verify:authoritative-hotpaths
          npm run verify:runtime-efficiency
      - name: Run full build verification
        run: npm run build
      - name: Commit verified patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f \
            .github/workflows/_apply-api-hotpath-v2.yml \
            .github/workflows/_apply-api-hotpath-v2-retry.yml \
            scripts/.apply-api-hotpath-v2.mjs \
            scripts/.fix-api-hotpath-patcher.mjs \
            scripts/.fix-api-hotpath-patcher-2.mjs \
            scripts/.fix-api-hotpath-patcher-3.mjs
          git add \
            server/src/runtime-store.js \
            server/src/storage.js \
            server/src/domain.js \
            server/src/domain-core.js \
            server/src/facility-groups.js \
            server/src/warehouse.js \
            server/src/asset-auctions.js \
            server/src/contracts.js \
            server/src/contract-runtime-index.js \
            server/src/weekly-cash-settlement.js \
            server/src/banking.js \
            server/src/research.js \
            server/src/leaderboards.js \
            server/src/runtime-store-core.js \
            server/test/runtime-hotpath-architecture.test.js \
            scripts/verify-authoritative-hotpaths.mjs \
            scripts/verify-runtime-efficiency.mjs \
            docs/SERVER_ARCHITECTURE_AND_DEPLOYMENT_DESIGN.md \
            docs/README.md
          git diff --check
          git diff --cached --check
          git status --short
          git commit -m '优化 API 状态投影与写入草稿热路径'
          git push origin perf/api-hotpath-v2
