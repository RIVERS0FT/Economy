name: Sync latest main into transport

on:
  push:
    branches:
      - codex/transport-route-pages-auto-logistics
    paths:
      - .github/workflows/sync-latest-main-transport.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.4.0
          cache: npm
      - name: Merge main and resolve known conflicts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          set +e
          git merge --no-commit --no-ff origin/main
          merge_status=$?
          set -e
          test "$merge_status" -ne 0
          conflicts="$(git diff --name-only --diff-filter=U)"
          expected="$(printf '%s\n%s' 'docs/UI_DESIGN_SYSTEM.md' 'src/components/provinces/UsMainlandMap.tsx')"
          test "$conflicts" = "$expected"
          git checkout --theirs docs/UI_DESIGN_SYSTEM.md
          git checkout --ours src/components/provinces/UsMainlandMap.tsx
          python .github/tmp/sync_transport_main.py
          git add docs/UI_DESIGN_SYSTEM.md src/components/provinces/UsMainlandMap.tsx
          test -z "$(git diff --name-only --diff-filter=U)"
      - name: Remove temporary sync files before validation
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/sync-latest-main-transport.yml .github/tmp/sync_transport_main.py
          git add -A
      - name: Validate integrated transport and tooltip architecture
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build
          bash scripts/prepare-playwright-chromium.sh
          PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=/usr/bin/google-chrome npx playwright test tests/browser/top-layer-overlays.spec.ts tests/browser/shell-floating-safe-zone.spec.ts tests/browser/province-map.spec.ts tests/browser/transport-map-picking.spec.ts --workers=2
      - name: Commit synchronized main
        shell: bash
        run: |
          set -euo pipefail
          git commit -m "同步共享 Tooltip 主线并保留运输地图语义"
          git push origin HEAD:codex/transport-route-pages-auto-logistics
