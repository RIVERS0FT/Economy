name: Prepare operation notification patch
on:
  push:
    branches: ['fix/operation-result-notifications-20260906']
    paths: ['.github/workflows/prepare-operation-notifications.yml', '.operation-notifications-edit.py']
permissions:
  contents: write
concurrency:
  group: prepare-operation-notifications
  cancel-in-progress: true
jobs:
  edit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/operation-result-notifications-20260906
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.4.0
          cache: npm
      - name: Apply and verify the scoped patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.operation-notifications-edit.py')
          s=p.read_text().replace("import re, subprocess\n", "import re, subprocess\nfailures=[]\n")
          s=s.replace("    assert s.count(old)==count, (path, 'anchor count', s.count(old), old[:120])", "    if s.count(old)!=count:\n        failures.append((path, 'anchor count', s.count(old), old[:120])); print('PATCH_MISMATCH', failures[-1], flush=True); return")
          s=s.replace("    assert n==count, (path, 'pattern count', n, pattern)", "    if n!=count:\n        failures.append((path, 'pattern count', n, pattern)); print('PATCH_MISMATCH', failures[-1], flush=True); return")
          s=s.replace(r"r'  function notify\(message: string\) \{.*?\n  \}\n\n  async function showResult\(.*?\n  \}\n'", r"r'  function notify\(message: string\) \{.*?\n  \}\n  async function showResult\([^\n]*\n'")
          s=s.replace(r"replace(p, '    notice,\n', '    notice,\n    noticeEvents,\n')", "replace(p, '    tab, setTab, notice,', '    tab, setTab, notice, noticeEvents,')", 1)
          s=s.replace("print('SCOPED PATCH APPLIED', flush=True)", "assert not failures, failures\nprint('SCOPED PATCH APPLIED', flush=True)")
          p.write_text(s)
          q=Path('src/components/facilities/FacilityAutoOperationControls.tsx')
          t=q.read_text().replace('      if (response.result.ok) {\n        const state', '      if (response.result.ok) {\n        const confirmedPolicy = authorityPolicy(group);\n        if (isCurrent() && confirmedPolicy !== sourcePolicy) setDraft(confirmedPolicy);\n        const state')
          q.write_text(t)
          PY
          python3 .operation-notifications-edit.py
