name: Apply facility detail layout v2

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply source, design and regression changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import textwrap

          def read(path: str) -> str:
              return Path(path).read_text()

          def write(path: str, content: str) -> None:
              Path(path).write_text(content)

          def replace_once(path: str, old: str, new: str) -> None:
              source = read(path)
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: exact match count {count}: {old[:90]!r}')
              write(path, source.replace(old, new, 1))

          def sub_once(path: str, pattern: str, replacement: str) -> None:
              source = read(path)
              updated, count = re.subn(pattern, replacement, source, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'{path}: regex match count {count}: {pattern[:110]!r}')
              write(path, updated)

          detail_path = 'src/pages/production/ProductionFacilityDetail.tsx'
          replace_once(
              detail_path,
              "import { useFacilityRecipeProfitMarkets } from '../../components/facilities/FacilityRecipeProfitContext';\n",
              "import { useFacilityRecipeProfitMarkets } from '../../components/facilities/FacilityRecipeProfitContext';\n"
              "import { FacilityRecipeProfitAnalysis } from '../../components/facilities/FacilityRecipeProfitAnalysis';\n",
          )

          information_component = textwrap.dedent(r"""
          export function FacilityClusterInformation({
            entry,
            products,
            inventories,
            now,
            onToggle,
            titleId,
          }: Pick<
            FacilityClusterDetailSharedProps,
            'entry' | 'products' | 'inventories' | 'now' | 'onToggle'
          > & {
            titleId: string;
          }) {
            const { group, type } = entry;
            const recipeState = resolveFacilityDetailRecipeState(entry);
            const profitScope = currentFormulaScope(group, now);

            return (
              <section
                className="facility-information"
                data-status={group.status}
                aria-label={`${type.name}工厂信息`}
              >
                <div className="facility-detail-artwork facility-information-artwork" aria-hidden="true">
                  <FacilityIcon facilityTypeId={type.id} className="facility-detail-artwork-icon" />
                </div>

                <div className="facility-information-main">
                  <div className="facility-information-heading">
                    <div className="facility-information-title">
                      <h2 id={titleId}>{type.name}</h2>
                      <div className="facility-information-meta">
                        <span className="facility-information-total">
                          <small>总数量</small>
                          <strong>{formatNumber(group.count)}</strong>
                        </span>
                        <StatusTag tone={facilityTone(group.status)}>{facilityStatusLabel(group)}</StatusTag>
                      </div>
                    </div>
                    <SwitchControl
                      checked={group.enabled}
                      aria-label={group.enabled ? `停止${type.name}生产` : `开启${type.name}生产`}
                      title={group.enabled ? '停止生产' : '开启自动运行'}
                      disabled={group.count < 1}
                      onChange={(event) => onToggle(event.target.checked)}
                    />
                  </div>
                </div>

                <div className="facility-count-summary" aria-label={`${type.name}运行数量`}>
                  <span>
                    运行中 <strong>{formatNumber(group.participatingCount)}</strong>
                  </span>
                  <span>
                    冻结中 <strong>{formatNumber(group.frozenCount ?? group.listedCount)}</strong>
                  </span>
                  <span>
                    抵押中 <strong>{formatNumber(group.mortgagedCount)}</strong>
                  </span>
                </div>

                <FacilityRecipeProfitAnalysis
                  type={recipeState.formulaType}
                  scopeCount={profitScope.physicalCount}
                  scopeLabel={profitScope.name}
                  staffingRateBps={profitScope.staffingRateBps}
                  products={products}
                  inventories={inventories}
                />
              </section>
            );
          }

          """).lstrip()
          sub_once(
              detail_path,
              r'export function FacilityClusterDetailHeader\([\s\S]*?\n}\n\n(?=export function FacilityClusterDetailBody)',
              information_component,
          )

          detail_body = textwrap.dedent(r"""
          export function FacilityClusterDetailBody({
            entry,
            products,
            inventories,
            now,
            onRecipeChange,
          }: Omit<FacilityClusterDetailSharedProps, 'onToggle' | 'onOpenMarket'>) {
            const { group, type } = entry;
            const recipeState = resolveFacilityDetailRecipeState(entry);
            const selectConfiguration = (
              selectedBaseRecipeId: string,
              selectedProductionMethodId: FacilityProductionMethodId,
            ) => {
              const recipeId = productionRecipeVariantId(type, selectedBaseRecipeId, selectedProductionMethodId);
              if (recipeId && recipeId !== recipeState.selectedRecipeId) onRecipeChange(recipeId);
            };

            return (
              <>
                <FacilityStaffingSummary entry={entry} now={now} />

                <section className="facility-production-settings">
                  <div className="facility-production-settings-heading">
                    <strong>生产设置</strong>
                  </div>

                  <div className="facility-production-settings-grid">
                    <RichSelectInput
                      label="生产产物"
                      aria-label={`${type.name}生产产物`}
                      value={recipeState.selectedBaseRecipeId}
                      options={recipeState.recipes.map((recipe) => ({
                        value: recipe.id,
                        label: recipe.name,
                        visual: <ProductArtwork productId={recipe.output.productId} />,
                      }))}
                      disabled={group.count < 1 || recipeState.recipes.length === 0}
                      onValueChange={(baseRecipeId) => {
                        selectConfiguration(baseRecipeId, recipeState.selectedProductionMethodId);
                      }}
                    />

                    {recipeState.productionMethodGroup ? (
                      <RichSelectInput
                        label={recipeState.productionMethodGroup.name}
                        aria-label={`${type.name}生产方式`}
                        value={recipeState.selectedProductionMethodId}
                        options={recipeState.productionMethodGroup.methods.map((method) => ({
                          value: method.id,
                          label: method.name,
                          disabled: !method.plansByRecipeId[recipeState.selectedBaseRecipeId],
                          visual: <ProductionMethodIcon methodId={method.id} />,
                        }))}
                        disabled={group.count < 1}
                        onValueChange={(methodId) => {
                          selectConfiguration(
                            recipeState.selectedBaseRecipeId,
                            methodId as FacilityProductionMethodId,
                          );
                        }}
                      />
                    ) : null}
                  </div>
                </section>

                <FacilityProductionFormula
                  group={group}
                  type={recipeState.formulaType}
                  products={products}
                  inventories={inventories}
                  now={now}
                />
              </>
            );
          }

          """).lstrip()
          sub_once(
              detail_path,
              r'export function FacilityClusterDetailBody\([\s\S]*?\n}\n\n(?=export function FacilityMarketAction)',
              detail_body,
          )
          replace_once(
              detail_path,
              '      <FacilityClusterDetailHeader entry={entry} onToggle={onToggle} titleId={titleId} />\n',
              textwrap.dedent("""
                    <FacilityClusterInformation
                      entry={entry}
                      products={products}
                      inventories={inventories}
                      now={now}
                      onToggle={onToggle}
                      titleId={titleId}
                    />
              """),
          )

          mobile_path = 'src/pages/production/MobileFacilityDetailSheet.tsx'
          replace_once(mobile_path, '  FacilityClusterDetailHeader,\n', '  FacilityClusterInformation,\n')
          sub_once(
              mobile_path,
              r'\s*<div className="facility-detail-sheet-header">[\s\S]*?</div>\n\n(?=\s*<ScrollArea)',
              textwrap.dedent("""
                        <div className="facility-detail-sheet-header">
                          <div className="facility-detail-sheet-drag-handle" aria-hidden="true">
                            <span className="facility-detail-sheet-handle" />
                          </div>
                        </div>

              """),
          )
          sub_once(
              mobile_path,
              r'\s*<FacilityClusterDetailBody[\s\S]*?/>\n(?=\s*</ScrollArea>)',
              textwrap.dedent("""
                        <FacilityClusterInformation
                          entry={entry}
                          products={products}
                          inventories={inventories}
                          now={now}
                          onToggle={onToggle}
                          titleId="mobile-facility-detail-title"
                        />
                        <FacilityClusterDetailBody
                          entry={entry}
                          products={products}
                          inventories={inventories}
                          now={now}
                          onRecipeChange={onRecipeChange}
                        />
              """),
          )

          formula_path = 'src/components/facilities/FacilityProductionFormula.tsx'
          replace_once(formula_path, "import { FacilityRecipeProfitAnalysis } from './FacilityRecipeProfitAnalysis';\n", '')
          for obsolete in [
              '  const profitScope = scope;\n',
              '  const profitType = type;\n',
              '  const profitScopeLabel = profitScope.name;\n',
          ]:
              replace_once(formula_path, obsolete, '')
          sub_once(
              formula_path,
              r'\n\s*<FacilityRecipeProfitAnalysis[\s\S]*?\n\s*/>\n(?=\s*</section>)',
              '\n',
          )

          group_css_path = 'src/styles/facility-group-card-grid.css'
          group_css = textwrap.dedent("""
          .facility-group-card {
            --facility-card-section-gap: var(--space-3);
            --facility-card-inner-gap: var(--space-2);

            display: grid;
            grid-template-rows: auto;
            grid-auto-rows: auto;
            align-content: start;
            align-items: start;
            gap: var(--facility-card-section-gap);
            overflow: visible;
          }

          .facility-group-card > * {
            min-width: 0;
            margin-inline: 0;
          }

          .facility-information {
            min-width: 0;
            display: grid;
            grid-template-columns: minmax(8.5rem, 11.5rem) minmax(0, 1fr);
            grid-template-areas:
              "artwork main"
              "summary summary"
              "profit profit";
            align-items: start;
            gap: var(--space-2) var(--space-3);
          }

          .facility-information-artwork {
            grid-area: artwork;
            width: 100%;
            align-self: start;
          }

          .facility-information-main {
            grid-area: main;
            min-width: 0;
            display: grid;
            align-content: start;
          }

          .facility-information-heading {
            width: 100%;
            min-width: 0;
            min-height: var(--control-height-compact);
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            align-items: start;
            gap: var(--space-2);
          }

          .facility-information-title {
            min-width: 0;
            display: grid;
            align-content: start;
            gap: var(--space-2);
          }

          .facility-information-title h2 {
            min-width: 0;
            margin: 0;
            overflow: hidden;
            font-size: var(--font-size-xl);
            line-height: var(--line-height-tight);
            text-overflow: ellipsis;
            white-space: nowrap;
          }

          .facility-information-meta {
            min-width: 0;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: var(--space-1);
          }

          .facility-information-total {
            min-width: 0;
            display: inline-flex;
            align-items: baseline;
            gap: 0.35rem;
            color: var(--color-text-muted);
            white-space: nowrap;
          }

          .facility-information-total small {
            font-size: var(--font-size-xs);
          }

          .facility-information-total strong {
            color: var(--color-text-primary);
            font-size: var(--font-size-lg);
            font-variant-numeric: tabular-nums;
          }

          .facility-information-heading > .ui-switch {
            flex: 0 0 auto;
            margin: 0;
          }

          .facility-count-summary {
            grid-area: summary;
            width: 100%;
            min-width: 0;
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            align-items: baseline;
            gap: var(--space-1);
            color: var(--color-text-muted);
            font-size: var(--font-size-xs);
          }

          .facility-count-summary span {
            min-width: 0;
            display: flex;
            align-items: baseline;
            gap: 0.25rem;
            white-space: nowrap;
          }

          .facility-count-summary span:nth-child(2) {
            justify-content: center;
          }

          .facility-count-summary span:last-child {
            justify-content: flex-end;
          }

          .facility-count-summary strong {
            flex: 0 0 auto;
            color: var(--color-text-primary);
            font-size: var(--font-size-sm);
          }

          .facility-information > .facility-average-profit {
            grid-area: profit;
            margin: 0;
            border-top: 1px solid var(--color-divider);
            padding-top: var(--space-2);
          }

          .facility-staffing-summary {
            min-width: 0;
            display: grid;
            gap: var(--space-1);
            border-top: 1px solid var(--color-divider);
            padding: var(--space-2) var(--space-1) 0;
          }

          .facility-staffing-heading {
            min-width: 0;
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: var(--space-2);
          }

          .facility-staffing-heading strong {
            flex: 0 0 auto;
            color: var(--color-text-primary);
            font-size: var(--font-size-sm);
          }

          .facility-staffing-heading span {
            min-width: 0;
            overflow: hidden;
            color: var(--color-text-muted);
            font-size: var(--font-size-xs);
            line-height: var(--line-height-normal);
            text-align: right;
            text-overflow: ellipsis;
            white-space: nowrap;
          }

          .facility-staffing-track {
            width: 100%;
            height: 0.5rem;
            overflow: hidden;
            border-radius: var(--radius-pill);
            background: color-mix(in srgb, var(--color-border-strong) 38%, transparent);
          }

          .facility-staffing-fill {
            display: block;
            height: 100%;
            border-radius: inherit;
            background: var(--color-success);
            transition: width 180ms ease;
          }

          .facility-production-settings {
            min-width: 0;
            display: grid;
            gap: var(--facility-card-inner-gap);
            border-top: 1px solid var(--color-divider);
            padding-top: var(--space-2);
          }

          .facility-production-settings-heading {
            min-width: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: var(--space-2);
          }

          .facility-production-settings-heading strong {
            flex: 0 0 auto;
            color: var(--color-text-primary);
            font-size: var(--font-size-sm);
            white-space: nowrap;
          }

          .facility-production-settings-grid {
            min-width: 0;
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            align-items: start;
            gap: var(--space-2);
          }

          .facility-production-settings-grid > * {
            min-width: 0;
          }

          .facility-production-settings select {
            min-height: var(--control-height-compact);
          }

          .facility-production-settings select:disabled {
            opacity: 0.72;
            color: var(--color-text-secondary);
          }

          .facility-production-formula {
            align-self: start;
          }

          @media (max-width: 720px) {
            .facility-information {
              grid-template-columns: minmax(6rem, 7.25rem) minmax(0, 1fr);
              gap: var(--space-2);
            }

            .facility-information-title {
              gap: var(--space-1);
            }

            .facility-information-title h2 {
              font-size: var(--font-size-lg);
            }

            .facility-information-total {
              display: grid;
              gap: 0.1rem;
            }

            .facility-information-total strong {
              font-size: var(--font-size-md);
            }

            .facility-count-summary {
              gap: 0.25rem;
              font-size: 0.68rem;
            }

            .facility-count-summary span {
              display: grid;
              justify-items: start;
              gap: 0.1rem;
            }

            .facility-count-summary span:nth-child(2) {
              justify-content: initial;
              justify-items: center;
            }

            .facility-count-summary span:last-child {
              justify-content: initial;
              justify-items: end;
            }
          }

          """).lstrip()
          sub_once(group_css_path, r'\.facility-group-card \{[\s\S]*?(?=\.facility-market-link-row \{)', group_css)

          artwork_css = 'src/styles/facility-artwork.css'
          sub_once(
              artwork_css,
              r'\.facility-detail-artwork \{[\s\S]*?\n\}',
              textwrap.dedent("""
              .facility-detail-artwork {
                position: relative;
                width: 100%;
                min-height: 0;
                aspect-ratio: 4 / 5;
                overflow: hidden;
                border: 1px solid var(--color-border);
                border-radius: var(--radius-control);
                background: var(--color-surface-inset);
              }
              """).lstrip(),
          )
          sub_once(
              artwork_css,
              r'  \.facility-detail-artwork \{[\s\S]*?aspect-ratio: 16 / 5;[\s\S]*?\n  \}',
              textwrap.dedent("""
                .facility-detail-artwork {
                  min-height: 0;
                  aspect-ratio: 4 / 5;
                }
              """).rstrip(),
          )

          profit_css = 'src/styles/facility-recipe-profit-analysis.css'
          sub_once(
              profit_css,
              r'\.facility-average-profit \{[\s\S]*?\n\}',
              textwrap.dedent("""
              .facility-average-profit {
                min-width: 0;
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: var(--space-3);
              }
              """).lstrip(),
          )

          surface_css = 'src/styles/production-surface.css'
          surface_block = textwrap.dedent("""
          .panel.production-surface > .widget-heading,
          .panel.production-surface .facility-information-heading {
            align-items: start;
          }

          .panel.production-surface .facility-information-heading {
            min-height: var(--production-pill-visible-height);
          }

          .panel.production-surface > .widget-heading h2,
          .panel.production-surface .facility-information-title h2 {
            margin: 0;
            font-size: var(--font-size-xl);
            line-height: var(--line-height-tight);
          }

          .panel.production-surface .facility-information-heading > .ui-switch {
            width: 2.75rem;
            min-width: 2.75rem;
            height: var(--production-pill-visible-height);
            min-height: var(--production-pill-visible-height);
            align-self: start;
          }

          .panel.production-surface .facility-information-heading > .ui-switch::before {
            inset: 0;
            height: auto;
            border-radius: var(--radius-pill);
          }

          .panel.production-surface .facility-information-heading > .ui-switch::after {
            top: calc((var(--production-pill-visible-height) - var(--production-switch-thumb-size)) / 2);
            left: var(--production-switch-thumb-inset);
            width: var(--production-switch-thumb-size);
            height: var(--production-switch-thumb-size);
          }

          .panel.production-surface .facility-information-heading > .ui-switch:checked::after {
            transform: translateX(var(--production-switch-thumb-travel));
          }

          .panel.production-surface.facility-group-card {
            --facility-card-section-gap: var(--space-2);
            --facility-card-inner-gap: var(--space-1);
          }

          .panel.production-surface .facility-information-meta .ui-status-tag {
            flex: 0 0 auto;
          }

          .panel.production-surface .facility-count-summary {
            line-height: var(--line-height-tight);
          }

          """).lstrip()
          sub_once(
              surface_css,
              r'\.panel\.production-surface > \.widget-heading,[\s\S]*?(?=/\* Desktop production sticky alignment\.)',
              surface_block,
          )

          sheet_css = 'src/styles/facility-detail-sheet.css'
          for pattern in [
              r'\n\s*\.facility-detail-sheet \.facility-status-header \{[\s\S]*?\n\s*\}\n',
              r'\n\s*\.facility-detail-sheet \.facility-card-title-row,[\s\S]*?touch-action: pan-y;\n\s*\}\n',
              r'\n\s*\.facility-detail-sheet \.facility-card-title-block \{[\s\S]*?\n\s*\}\n',
              r'\n\s*\.facility-detail-sheet \.facility-card-title-block \.ui-status-tag \{[\s\S]*?\n\s*\}\n',
          ]:
              sub_once(sheet_css, pattern, '\n')
          replace_once(
              sheet_css,
              '  .facility-detail-sheet-header {\n    border-bottom: 1px solid var(--color-divider);\n  }\n',
              '  .facility-detail-sheet-header {\n    border-bottom: 0;\n  }\n',
          )
          source = read(sheet_css)
          source, count = re.subn(
              r'\n@media \(max-width: 720px\) \{\n\s*\.facility-detail-sheet \.facility-status-header[\s\S]*?\n\}\n?$',
              '\n',
              source,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'{sheet_css}: obsolete compact header media count {count}')
          write(sheet_css, source)

          industry_path = 'docs/INDUSTRY_AND_PRODUCTION_DESIGN.md'
          industry_section = textwrap.dedent("""
          ### 9.4 当前工厂详情

          - 当前工厂详情的可见顺序固定为“移动端把手（桌面端无）→ 工厂信息 → 满员率 → 生产设置 → 生产结算 → 市场入口”。桌面端不得渲染把手 DOM；移动 Bottom Sheet 的固定头部只保留拖动把手，工厂名称、状态和开关必须进入正文中的共享工厂信息区。
          - 工厂信息是唯一身份与经营摘要区，包含工厂名称、`4:5` 纵向场景插画、总数量、唯一完整状态胶囊、运行开关、运行中／冻结中／抵押中三项数量明细，以及唯一一行单厂平均利润／分钟。不得再把标题状态固定在移动头部、把插画拆到另一列或把利润留在生产结算中。
          - 工厂信息内部允许“纵向插画 + 右侧主信息”的两列布局；三项数量明细与利润位于该信息区内部并按 DOM 顺序出现在后。桌面与移动共用同一个 `FacilityClusterInformation`，不得通过 CSS `order` 建立与 DOM 不同的视觉顺序。
          - 详情正文整体只使用纵向内容流，不得恢复“左侧插画与满员率、右侧设置与结算”的宽详情双列。桌面详情高度继续由自然内容决定，不使用弹性空白行、可见 spacer 或独立纵向滚动条；移动端继续使用唯一正文 `ScrollArea` 和固定底部市场入口。
          - 满员率紧跟工厂信息之后，显示当前百分比、恢复／下降方向和进度条。物理数量、完成时满员率与整数等效产能只进入完整无障碍描述，不得恢复可见长句、独立卡片背景或与插画绑定的并排布局。
          - 玩家可见“生产产物”与“作业制度”必须合并为同一个“生产设置”区；桌面与移动在 `320px` 及以上固定双列同行。两者使用共享 `RichSelectInput`、商品 PNG 或制度 Icon 与名称；不得显示制度说明、周期摘要、产出摘要或成本摘要。
