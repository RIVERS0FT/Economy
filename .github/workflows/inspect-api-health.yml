name: Inspect API health after release failure
on:
  push:
    branches: [diagnostic/api-health-after-798]
    paths: [.github/workflows/inspect-api-health.yml]
permissions:
  contents: read
jobs:
  inspect:
    if: github.ref == 'refs/heads/diagnostic/api-health-after-798'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Read-only service and health samples
        env:
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SERVER_USER"
          test -n "$SERVER_PORT"
          test -n "$SERVER_SSH_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          timeout 120s ssh -i ~/.ssh/deploy_key -p "$SERVER_PORT" \
            -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
            -o ServerAliveInterval=10 -o ServerAliveCountMax=3 \
            "$SERVER_USER@116.204.134.56" 'bash -s' <<'REMOTE'
          set -uo pipefail
          echo READ_ONLY_SERVICE_PROBE_BEGIN
          systemctl show riversoft-economy-api.service -p ActiveState -p SubState -p MainPID -p ExecMainStartTimestamp -p MemoryCurrent -p CPUUsageNSec
          pid="$(systemctl show riversoft-economy-api.service -p MainPID --value)"
          for sample in 1 2 3; do
            date -u +%Y-%m-%dT%H:%M:%SZ
            ps -p "$pid" -o pid=,etime=,cputime=,pcpu=,rss=,stat=
            curl --silent --show-error --connect-timeout 2 --max-time 3 \
              --write-out '\nAPI_HEALTH_STATUS=%{http_code} elapsed=%{time_total}\n' http://127.0.0.1:3002/health || true
            if [ "$sample" -lt 3 ]; then sleep 5; fi
          done
          echo FORMAL_DOMAIN_READ_ONLY_PROBE
          curl --silent --show-error --connect-timeout 2 --max-time 3 \
            --write-out '\nPUBLIC_HEALTH_STATUS=%{http_code} elapsed=%{time_total}\n' https://game.riversoft.top/economy-api/health || true
          echo READ_ONLY_SERVICE_PROBE_END
          REMOTE
