name: One-shot normalize industrial product artwork authority

on:
  push:
    branches:
      - codex/transport-route-cards-footer

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: codex/transport-route-cards-footer
          fetch-depth: 0
      - name: Normalize industrial product artwork authority wording
        shell: python
        run: |
          from pathlib import Path

          path = Path('docs/UI_DESIGN_SYSTEM.md')
          text = path.read_text(encoding='utf-8')
          old = '工业燃料主视觉固定使用红色钢制燃料桶与清晰易燃标志，紧凑 SVG 同步使用红色危险语义；工业化学品主视觉使用密封蓝色工业化学品桶、实验器皿与分子结构，不得出现肥料袋、叶片、土壤或颗粒等农业语义，也不得与化肥复用同一源图。'
          new = '`industrial-fuel`：红色钢制燃料桶与易燃标志，紧凑 SVG 使用红色危险语义；`industrial-chemicals`：密封工业化学品桶、实验器皿与分子结构，不得出现肥料袋、叶片、土壤或颗粒等农业语义，也不得与化肥复用同一源图。'
          if old not in text:
              raise SystemExit('industrial product artwork paragraph not found')
          if new in text:
              raise SystemExit('industrial product artwork wording already normalized')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
      - name: Commit normalized authority and remove one-shot workflow
        run: |
          git config user.name "RIVERSOFT"
          git config user.email "105160096+RIVERS0FT@users.noreply.github.com"
          rm .github/workflows/one-shot-normalize-industrial-product-artwork-authority.yml
          git add docs/UI_DESIGN_SYSTEM.md .github/workflows/one-shot-normalize-industrial-product-artwork-authority.yml
          git commit -m "Normalize industrial product artwork authority"
          git push origin HEAD:codex/transport-route-cards-footer
