name: Remove player heading mobile action style

on:
  push:
    branches:
      - codex/player-title-actions

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/player-title-actions
          fetch-depth: 0
      - name: Remove retired style
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/styles/globals.css')
          text = path.read_text()
          old = '''  .page-heading-actions--player {\n    justify-content: flex-end;\n  }\n\n'''
          if old not in text:
              raise SystemExit('retired mobile player action style not found')
          path.write_text(text.replace(old, '', 1))
          PY
          rm .github/workflows/codex-remove-player-heading-mobile.yml
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "清理玩家标题区旧移动样式"
          git push origin HEAD:codex/player-title-actions
