name: Run market chart height stability fix

on:
  push:
    branches:
      - agent/fix-market-chart-height-loop

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-market-chart-height-loop
          fetch-depth: 0

      - name: Execute embedded implementation
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/agent-fix-market-chart-height-loop.yml')
          source = workflow.read_text(encoding='utf-8')
          marker = "          python3 <<'PY'\n"
          start = source.index(marker) + len(marker)
          end = source.index("\n          PY\n", start)
          lines = source[start:end].splitlines()
          code = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          exec(compile(code, str(workflow), 'exec'), {'__name__': '__main__'})
          Path('.github/workflows/agent-fix-market-chart-height-push.yml').unlink()
          Path('.agent-market-chart-height-trigger').unlink(missing_ok=True)
          PY

      - name: Verify focused invariants
        run: |
          git diff --check
          node --experimental-strip-types scripts/verify-market-chart.mjs
          node scripts/verify-market-page-layout.mjs

      - name: Commit implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "修复市场行情卡高度持续增长"
          git push origin HEAD:agent/fix-market-chart-height-loop
