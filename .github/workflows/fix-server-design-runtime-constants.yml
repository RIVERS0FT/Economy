name: Fix server design runtime constants

on:
  push:
    branches:
      - docs/design-authority-compression-current-20260902

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.4.0
      - name: Record stable deployment runtime constants
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('docs/SERVER_ARCHITECTURE_AND_DEPLOYMENT_DESIGN.md')
          text = path.read_text(encoding='utf-8')
          rule = '正式 systemd 单元固定为 `riversoft-economy-api.service`；固定 Node 运行时入口为 `/var/www/game/economy-api/runtime/bin/node`。'
          if rule not in text:
              marker = '## 9. Nginx 与验收'
              if marker not in text:
                  raise SystemExit('SERVER DESIGN 缺少 Nginx 章节锚点')
              text = text.replace(marker, rule + '\n\n' + marker, 1)
              path.write_text(text, encoding='utf-8')
          PY
      - name: Verify design and Nginx contract
        run: |
          node scripts/verify-document-authority.mjs
          node scripts/run-python.mjs scripts/test_configure_economy_nginx.py
          git diff --check
      - name: Commit design fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/SERVER_ARCHITECTURE_AND_DEPLOYMENT_DESIGN.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m '补齐服务器部署运行常量'
          git push origin HEAD:${GITHUB_REF_NAME}
