name: Fix fullscreen outliner browser tests

on:
  push:
    branches:
      - fix/hide-fullscreen-outliner

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update browser expectations
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              text = Path(path).read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, got {count}: {old!r}')
              Path(path).write_text(text.replace(old, new, 1), encoding='utf-8')

          # Width changes are animated on normal motion; wait for the fullscreen card to settle.
          tutorial = 'tests/browser/tutorial-right-rail.spec.ts'
          replace_once(
              tutorial,
              "    const primaryCardBox = await requireBox(page.locator('.signed-in-shell__primary-card'));\n    const workspaceBox = await requireBox(workspace);\n    expect(workspaceBox.x + workspaceBox.width - (primaryCardBox.x + primaryCardBox.width)).toBeCloseTo(8, 0);",
              "    await expect.poll(async () => {\n      const primaryCardBox = await requireBox(page.locator('.signed-in-shell__primary-card'));\n      const workspaceBox = await requireBox(workspace);\n      return workspaceBox.x + workspaceBox.width - (primaryCardBox.x + primaryCardBox.width);\n    }).toBeCloseTo(8, 0);",
          )
          replace_once(
              tutorial,
              "  const primaryCardBox = await requireBox(page.locator('.signed-in-shell__primary-card'));\n  const workspaceBox = await requireBox(page.locator('.workspace'));\n  expect(workspaceBox.x + workspaceBox.width - (primaryCardBox.x + primaryCardBox.width)).toBeCloseTo(8, 0);",
              "  await expect.poll(async () => {\n    const primaryCardBox = await requireBox(page.locator('.signed-in-shell__primary-card'));\n    const workspaceBox = await requireBox(page.locator('.workspace'));\n    return workspaceBox.x + workspaceBox.width - (primaryCardBox.x + primaryCardBox.width);\n  }).toBeCloseTo(8, 0);",
          )

          # Full-area preview pages hide the same persistent Outliner DOM and consume the released width.
          preview = 'tests/browser/all-pages-preview.spec.ts'
          replace_once(
              preview,
              "  const workspaceCard = page.locator('.signed-in-shell__primary-card');\n  const outliner = page.locator('.strategic-outliner');",
              "  const workspace = page.locator('.workspace');\n  const workspaceCard = page.locator('.signed-in-shell__primary-card');\n  const outliner = page.locator('.strategic-outliner');",
          )
          replace_once(
              preview,
              "    await expect(host).toHaveAttribute('data-strategic-presentation', 'fullscreen');\n    await expect(content).toBeVisible();\n    await expect(outliner).toBeVisible();\n    await expect(outliner).toHaveAttribute('data-preview-outliner-sentinel', 'persistent');\n    const hostBox = await host.boundingBox();\n    const contentBox = await content.boundingBox();\n    const cardBox = await workspaceCard.boundingBox();\n    const outlinerBox = await outliner.boundingBox();\n    expect(hostBox).not.toBeNull();\n    expect(contentBox).not.toBeNull();\n    expect(cardBox).not.toBeNull();\n    expect(outlinerBox).not.toBeNull();\n    expect(contentBox!.width).toBeCloseTo(hostBox!.width, 0);\n    expect(contentBox!.width).toBeGreaterThan(compactWidths[0] + 200);\n    expect(cardBox!.x + cardBox!.width).toBeLessThanOrEqual(outlinerBox!.x - 8);",
              "    await expect(host).toHaveAttribute('data-strategic-presentation', 'fullscreen');\n    await expect(content).toBeVisible();\n    await expect(outliner).toBeHidden();\n    await expect(outliner).toHaveAttribute('data-preview-outliner-sentinel', 'persistent');\n    const hostBox = await host.boundingBox();\n    const contentBox = await content.boundingBox();\n    const cardBox = await workspaceCard.boundingBox();\n    const workspaceBox = await workspace.boundingBox();\n    expect(hostBox).not.toBeNull();\n    expect(contentBox).not.toBeNull();\n    expect(cardBox).not.toBeNull();\n    expect(workspaceBox).not.toBeNull();\n    expect(contentBox!.width).toBeCloseTo(hostBox!.width, 0);\n    expect(contentBox!.width).toBeGreaterThan(compactWidths[0] + 200);\n    expect(workspaceBox!.x + workspaceBox!.width - (cardBox!.x + cardBox!.width)).toBeCloseTo(8, 0);",
          )

          # Fullscreen notifications keep the mounted Outliner as an invisible state host.
          notification = 'tests/browser/notification-center.spec.ts'
          replace_once(
              notification,
              "    await expect(outliner).toHaveAttribute('data-notification-outliner-sentinel', 'persistent');\n    await expect(outliner).toBeVisible();",
              "    await expect(outliner).toHaveAttribute('data-notification-outliner-sentinel', 'persistent');\n    await expect(outliner).toBeHidden();",
          )
          PY
          git diff --check
      - name: Commit browser regressions
        shell: bash
        run: |
          git rm .github/workflows/fix-hide-fullscreen-browser-tests.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "同步全屏右栏浏览器回归"
          git push
