name: Prepare Transport Route Snapshot

on:
  push:
    branches:
      - codex/transport-capital-network-routes
    paths:
      - scripts/generate-transport-capital-routes.mjs
      - scripts/transport-capital-route-core.mjs
      - shared/provinces.json
      - .github/workflows/prepare-transport-route-snapshot.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: codex/transport-capital-network-routes

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.4.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate transport route snapshot
        run: node scripts/generate-transport-capital-routes.mjs

      - name: Validate snapshot shape
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const data = JSON.parse(readFileSync('src/generated/transport-capital-routes.json', 'utf8'));
          if (data.kind !== 'natural-earth-capital-pairs') throw new Error(`unexpected kind: ${data.kind}`);
          if (data.capitalCount !== 48 || data.pairCountPerMode !== 1128) throw new Error('unexpected route catalog size');
          if (Object.keys(data.routes?.road ?? {}).length !== 1128) throw new Error('road pair snapshot incomplete');
          if (Object.keys(data.routes?.rail ?? {}).length !== 1128) throw new Error('rail pair snapshot incomplete');
          NODE

      - name: Commit generated snapshot
        run: |
          if git diff --quiet -- src/generated/transport-capital-routes.json; then
            echo 'Transport route snapshot already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/generated/transport-capital-routes.json
          git commit -m '生成运输首府路网快照'
          git push origin HEAD:codex/transport-capital-network-routes
