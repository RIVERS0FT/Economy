name: Codex Province Access Dead-Code Cleanup

on:
  push:
    branches:
      - codex/remove-province-unlock

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.4.0
          cache: npm

      - name: Apply cleanup
        shell: bash
        run: |
          sed -i "/EmbeddedBuildingsPage model={model} embedded/d" scripts/codex-province-access-cleanup.py
          python3 scripts/codex-province-access-cleanup.py
          rm .github/workflows/codex-province-access-cleanup.yml
          rm scripts/codex-province-access-cleanup.py

      - name: Install dependencies
        run: npm ci

      - name: Verify province access cleanup
        shell: bash
        run: |
          node scripts/verify-provincial-unlock-transport.mjs
          node scripts/verify-provincial-economy.mjs
          node scripts/verify-game-shell-layout.mjs
          node scripts/verify-game-three-layer.mjs
          node scripts/verify-overview-content.mjs
          node scripts/verify-player-avatar.mjs
          npm run verify:local-preview
          npm run build
          git diff --check

      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "移除地区访问旧客户端分支"
            git push origin HEAD:codex/remove-province-unlock
          fi
