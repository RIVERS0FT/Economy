name: Fix buildings DataList

on:
  push:
    branches:
      - codex/daily-system-market

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.4.0
          cache: npm
      - run: npm ci
      - run: node scripts/codex-fix-buildings-datalist.mjs
      - run: npm run generate:local-preview
      - run: npx tsc --noEmit
      - run: node scripts/verify-page-content.mjs
      - run: node scripts/verify-production-desktop-layout.mjs
      - run: node scripts/verify-primary-surface-insets.mjs
      - run: node scripts/verify-facility-auto-procure.mjs
      - run: node scripts/verify-market-page-layout.mjs
      - run: git diff --check
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "收口即时市场前端 TypeScript"
          git push origin HEAD:codex/daily-system-market
