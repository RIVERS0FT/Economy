name: Diagnose registration timeout

on:
  push:
    branches:
      - fix/registration-deploy-health
    paths:
      - .github/workflows/diagnose-registration-timeout.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ECONOMY_PRODUCTION_PUBLIC_IP: 116.204.134.56
    steps:
      - name: Configure SSH
        env:
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SERVER_PORT" "$ECONOMY_PRODUCTION_PUBLIC_IP" >> ~/.ssh/known_hosts 2>/dev/null
          chmod 600 ~/.ssh/known_hosts

      - name: Diagnose production registration route
        env:
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -p "$SERVER_PORT" "$SERVER_USER@$ECONOMY_PRODUCTION_PUBLIC_IP" 'bash -s' <<'REMOTE'
          set -uo pipefail
          echo '=== service ==='
          systemctl is-active riversoft-economy-api.service || true
          systemctl status riversoft-economy-api.service --no-pager --full | tail -n 30 || true
          echo '=== health before ==='
          curl -sS --max-time 5 http://127.0.0.1:3002/health || true
          echo
          echo '=== direct registration with idempotency ==='
          curl -sS --max-time 8 -o /tmp/reg-direct.json -w 'status=%{http_code} time=%{time_total}\n' \
            -X POST -H 'Content-Type: application/json' -H 'Idempotency-Key: diagnose-registration-direct' \
            --data '{}' http://127.0.0.1:3002/api/registration/email-code || true
          cat /tmp/reg-direct.json 2>/dev/null || true
          echo
          echo '=== direct registration without idempotency ==='
          curl -sS --max-time 8 -o /tmp/reg-direct-no-key.json -w 'status=%{http_code} time=%{time_total}\n' \
            -X POST -H 'Content-Type: application/json' --data '{}' \
            http://127.0.0.1:3002/api/registration/email-code || true
          cat /tmp/reg-direct-no-key.json 2>/dev/null || true
          echo
          echo '=== formal-domain nginx from host ==='
          curl -k -sS --max-time 8 -o /tmp/reg-domain.json -w 'status=%{http_code} time=%{time_total}\n' \
            --resolve game.riversoft.top:443:127.0.0.1 \
            -X POST -H 'Content-Type: application/json' -H 'Idempotency-Key: diagnose-registration-domain' \
            --data '{}' https://game.riversoft.top/economy-api/registration/email-code || true
          cat /tmp/reg-domain.json 2>/dev/null || true
          echo
          echo '=== ip-fallback nginx from host ==='
          curl -k -sS --max-time 8 -o /tmp/reg-ip.json -w 'status=%{http_code} time=%{time_total}\n' \
            -X POST -H 'Content-Type: application/json' -H 'Idempotency-Key: diagnose-registration-ip' \
            --data '{}' https://127.0.0.1/economy-api/registration/email-code || true
          cat /tmp/reg-ip.json 2>/dev/null || true
          echo
          echo '=== health after ==='
          curl -sS --max-time 5 http://127.0.0.1:3002/health || true
          echo
          echo '=== processes ==='
          ps -o pid,ppid,etime,stat,%cpu,%mem,cmd -C node || true
          echo '=== nginx registration blocks ==='
          nginx -T 2>/dev/null | grep -A14 -B3 '/economy-api/registration/' || true
          echo '=== recent service journal ==='
          journalctl -u riversoft-economy-api.service --since '10 minutes ago' --no-pager | tail -n 160 || true
          REMOTE
