name: Agent Patch Stress Seeding

on:
  push:
    branches:
      - agent/stability-transaction-mix-save-epoch

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stability-transaction-mix-save-epoch
      - name: Gate transaction-mix seeding
        run: |
          python3 - <<'PY'
          from pathlib import Path

          run_path = Path('tests/stress/run.mjs')
          run = run_path.read_text(encoding='utf-8')
          old = '      harness = await startLocalStressHarness();'
          new = "      harness = await startLocalStressHarness({\n        seedTransactionAssets: profile === 'transaction-mix',\n      });"
          if run.count(old) != 1:
              raise SystemExit(f'expected one harness call, got {run.count(old)}')
          run = run.replace(old, new, 1)
          run_path.write_text(run, encoding='utf-8')

          verify_path = Path('scripts/verify-stress-test-flow.mjs')
          verify = verify_path.read_text(encoding='utf-8')
          old_runner = "  'X-Economy-Save-Epoch',\n]) assert.equal(runner.includes(text), true, `压力测试执行器缺少 ${text}`);"
          new_runner = "  'X-Economy-Save-Epoch',\n  \"seedTransactionAssets: profile === 'transaction-mix'\",\n]) assert.equal(runner.includes(text), true, `压力测试执行器缺少 ${text}`);"
          if verify.count(old_runner) != 1:
              raise SystemExit('runner verification insertion point missing')
          verify = verify.replace(old_runner, new_runner, 1)
          old_harness = "  'seedLocalStressDatabase',\n  'LOCAL_STRESS_CREDITS = 1_000_000',"
          new_harness = "  'seedLocalStressDatabase',\n  'seedTransactionAssets = false',\n  'if (seedTransactionAssets) seedLocalStressDatabase',\n  'LOCAL_STRESS_CREDITS = 1_000_000',"
          if verify.count(old_harness) != 1:
              raise SystemExit('harness verification insertion point missing')
          verify = verify.replace(old_harness, new_harness, 1)
          verify_path.write_text(verify, encoding='utf-8')
          PY
          git diff --check
          git rm .github/workflows/agent-patch-stress-seeding.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/stress/run.mjs scripts/verify-stress-test-flow.mjs
          git commit -m "仅为事务混合场景预置隔离资产"
          git push origin HEAD:agent/stability-transaction-mix-save-epoch
