name: Remove build procurement order UI

on:
  push:
    branches:
      - codex/daily-system-market

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: node scripts/codex-remove-build-procurement-orders-ui.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "移除建厂缺料挂单界面"
          git push origin HEAD:codex/daily-system-market
