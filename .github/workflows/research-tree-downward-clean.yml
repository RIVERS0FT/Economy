name: Research tree downward clean validation

on:
  push:
    branches:
      - feature/research-tree-downward-v2
    paths:
      - .github/workflows/research-tree-downward-clean.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/research-tree-downward-v2
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.4.0
          cache: npm
      - name: Apply final implementation
        run: |
          python3 .agent/apply-research-tree-downward.py
          python3 - <<'PY'
          from pathlib import Path

          verifier = Path('scripts/verify-research-page.mjs')
          text = verifier.read_text(encoding='utf-8')
          replacements = {
              "  'buildResearchTreeFocus(technologies, selectedTechnology?.id ?? '')',": "  'buildResearchTreeFocus(technologies',",
              "  '.research-tree-edge[data-highlighted='true']',": '  ".research-tree-edge[data-highlighted=\'true\']",',
              "  '.research-technology-node[data-status=\"active\"]',": "  '.research-technology-node[data-status=',",
              "  '.research-technology-node[data-selected=\"true\"]',": "  '.research-technology-node[data-selected=',",
          }
          for bad, good in replacements.items():
              if text.count(bad) != 1:
                  raise SystemExit(f'expected one verifier marker: {bad!r}; found {text.count(bad)}')
              text = text.replace(bad, good, 1)
          verifier.write_text(text, encoding='utf-8')

          page = Path('src/pages/ResearchPage.tsx')
          text = page.read_text(encoding='utf-8')
          old = '''                    role="treeitem"\n                    aria-level={layoutNode.depth + 1}\n                    aria-pressed={isSelected}\n'''
          new = '''                    aria-pressed={isSelected}\n'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one technology role override, found {text.count(old)}')
          page.write_text(text.replace(old, new, 1), encoding='utf-8')

          test = Path('tests/browser/research-technology-tree.spec.ts')
          text = test.read_text(encoding='utf-8')
          old = "    const beforeRefreshPosition = await applianceNode.boundingBox();"
          new = """    const beforeRefreshPosition = await applianceNode.evaluate((element) => ({
      x: (element as HTMLElement).style.getPropertyValue('--research-node-desktop-x'),
      y: (element as HTMLElement).style.getPropertyValue('--research-node-desktop-y'),
    }));"""
          if text.count(old) != 1:
              raise SystemExit(f'expected one pre-refresh physical position assertion, found {text.count(old)}')
          text = text.replace(old, new, 1)
          old = """    const afterRefreshPosition = await applianceNode.boundingBox();
    expect(afterRefreshPosition?.x).toBeCloseTo(beforeRefreshPosition?.x ?? 0, 0);
    expect(afterRefreshPosition?.y).toBeCloseTo(beforeRefreshPosition?.y ?? 0, 0);"""
          new = """    const afterRefreshPosition = await applianceNode.evaluate((element) => ({
      x: (element as HTMLElement).style.getPropertyValue('--research-node-desktop-x'),
      y: (element as HTMLElement).style.getPropertyValue('--research-node-desktop-y'),
    }));
    expect(afterRefreshPosition).toEqual(beforeRefreshPosition);"""
          if text.count(old) != 1:
              raise SystemExit(f'expected one post-refresh physical position assertion, found {text.count(old)}')
          test.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          node --check scripts/verify-research-page.mjs
          rm -f .agent/apply-research-tree-downward.py
          rmdir .agent
          rm -f .github/workflows/research-tree-downward-implement.yml
          rm -f .github/workflows/research-tree-downward-fix.yml
          rm -f .github/workflows/research-tree-downward-finalize.yml
          rm -f .github/workflows/research-tree-downward-validate.yml
          rm -f .github/workflows/research-tree-downward-interaction.yml
          rm -f .github/workflows/research-tree-downward-clean.yml
          git add -u -- .agent .github/workflows
      - name: Install dependencies
        run: npm ci
      - name: Verify research page
        run: node scripts/verify-research-page.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run research browser regression
        run: npx playwright test tests/browser/research-technology-tree.spec.ts
      - name: Build
        run: npm run build
      - name: Check diff
        run: git diff --check && git diff --cached --check
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            src/research/researchTreeLayout.ts \
            src/pages/ResearchPage.tsx \
            src/styles/research-page.css \
            tests/browser/research-technology-tree.spec.ts \
            scripts/verify-research-page.mjs \
            docs/PAGE_CONTENT_AND_NAVIGATION_DESIGN.md
          git diff --cached --check
          git commit -m "feat: render research tree downward"
          git push origin HEAD:feature/research-tree-downward-v2
