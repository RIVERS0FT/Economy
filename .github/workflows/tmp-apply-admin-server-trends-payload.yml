name: Apply Admin Server Trend Payload

on:
  push:
    branches:
      - fix/admin-server-trend-ranges

permissions:
  contents: write

concurrency:
  group: apply-admin-server-trend-payload
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify and extract implementation payload
        run: |
          set -euo pipefail
          cat \
            scripts/.tmp-admin-server-trends.part00 \
            scripts/.tmp-admin-server-trends.part01 \
            scripts/.tmp-admin-server-trends.part02 \
            scripts/.tmp-admin-server-trends.part03a \
            scripts/.tmp-admin-server-trends.part03b \
            scripts/.tmp-admin-server-trends.part04 \
            | base64 --decode > /tmp/admin-server-trends.tar.gz
          echo "bd5ee8cba2633e91de10cf057550e86c89a81591f7e9065c8e856f412e29b8d9  /tmp/admin-server-trends.tar.gz" | sha256sum --check -
          tar -xzf /tmp/admin-server-trends.tar.gz

      - name: Commit implementation
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            server/src/request-metrics.js \
            server/src/server-status.js \
            server/test/request-metrics.test.js \
            server/test/server-status.test.js \
            src/api/admin.ts \
            src/components/AdminServerStatusSection.tsx \
            src/components/charts/AdminServerStatusCharts.tsx \
            src/styles/admin-server-status.css \
            tests/browser/admin-server-status.spec.ts
          if git diff --cached --quiet; then
            echo "Implementation already applied."
            exit 0
          fi
          git commit -m "实现服务器小时日月趋势聚合"
          git push origin HEAD:fix/admin-server-trend-ranges
