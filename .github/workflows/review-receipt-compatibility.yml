name: Finalize receipt compatibility
on:
  push:
    branches: [codex/trade-receipt-compatibility]
    paths: [.github/workflows/review-receipt-compatibility.yml]
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/trade-receipt-compatibility
          fetch-depth: 0
      - name: Finalize source and remove temporary review artifacts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/api/game.ts')
          s = p.read_text()
          a = s.index('  let manualCommodity = false;')
          b = s.index('  const timedSignal = isWrite', a)
          s = s[:a] + '''  let manualCommodity = false;
            if (isWrite && path === '/orders' && typeof init?.body === 'string') {
              try {
                const body = JSON.parse(init.body);
                manualCommodity = body?.assetKind === 'commodity' && !body.execution
                  && (body.side === 'buy' || body.side === 'sell');
              } catch { /* Let the server reject an invalid request body. */ }
            }
            if (isWrite) installIdempotentGameWriteFetch();
          '''.replace('\n  ', '\n') + s[b:]
          p.write_text(s)
          p = Path('src/api/gameWriteConfirmation.ts')
          s = p.read_text()
          a = s.index('      catch {\n')
          b = s.index('      if (source.ok', a)
          # Find the actual validation statement, not the inner successful-response guard.
          b = s.index('      if (source.ok && options.validateSuccess', a)
          s = s[:a] + '\n'.join([
            '      catch {',
            '        // Gateways and authentication errors may return HTML. A known HTTP',
            '        // error is not a broken successful action receipt or permission to retry.',
            "        if (source.ok) throw new TypeError('Incomplete game write receipt');",
            '      }', '',
          ]) + s[b:]
          p.write_text(s)
          for p in Path('.github').glob('receipt-test-*'):
              p.unlink()
          Path('.github/receipt-compatibility-results.md').unlink()
          Path('.github/workflows/review-receipt-compatibility.yml').unlink()
          PY
          git add -A
          node scripts/normalize-repository-text.mjs
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: finalize compatibility changes and remove review tooling'
          git diff --check origin/main...HEAD
          test -z "$(git status --porcelain)"
          git diff --stat origin/main...HEAD
          git push origin HEAD:codex/trade-receipt-compatibility
