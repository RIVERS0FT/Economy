name: Finalize strategic map branch

on:
  push:
    branches:
      - codex/strategic-map-mainland-focus

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: codex/strategic-map-mainland-focus
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.4.0

      - name: Refresh package lock
        run: npm install --package-lock-only --ignore-scripts

      - name: Update authoritative map rules and verifiers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, pattern, replacement, flags=0):
              file = Path(path)
              text = file.read_text()
              next_text, count = re.subn(pattern, replacement, text, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f'{path}: expected one replacement, got {count}: {pattern}')
              file.write_text(next_text)

          chrome_world = """- 战略地图固定使用唯一静态 SVG 世界面，由“10m 世界大陆背景 + 美国本土连续 48 州经营层 + 州名／运输叠层”组成。世界大陆背景固定使用 `world-atlas@2.0.2` 的 Natural Earth 1:10m land 数据，提供低对比土地填充、海岸主线和柔和外阴影；美国本土连续 48 州继续使用 `us-atlas@3.0.1` 的 `states-10m`，并把这 48 个州在同一 TopoJSON 中 dissolve 成美国外轮廓作为最终可见美国边线。美国外轮廓必须覆盖世界 land 在美国沿海的对应描边，使美国海岸与州外边界只出现一条可见 10m 级边线，不得同时暴露两套不同来源或不同精度的双线。美国本土连续 48 州仍是唯一经营和交互地理；世界其他地区不得显示国家、州省或其他行政边界、名称、Tooltip、焦点、选中、点击或运输路线选点能力，世界背景必须保持 `pointer-events:none` 且从可访问交互树隐藏。大陆外阴影只用于低强度海岸层次，强度必须弱于州选中辉光；不得为了世界背景建立第二张地图、第二个相机、第二套经营地区数据或服务器状态。"""
          chrome_camera = """- 战略地图滚轮与双指逻辑缩放固定为 `1–4`；逻辑 `1×` 是按当前真实地图视口和美国本土投影包围盒动态计算的最小基础镜头，不等价于固定 CSS `scale(1)`。桌面与横屏在不裁掉美国的前提下，使美国本土包围盒面积目标约占有效地图视口的 `2/3`，且包围盒中心必须与真实地图视口中心重合；窄屏／竖屏若强制 `2/3` 会裁掉美国，则完整显示连续 48 州和约 `12px` 安全边距优先，仍保持居中，允许实际面积比例低于 `2/3`。逻辑 `1×` 时两个轴都锁定在该居中位置而不可平移；从 `1×` 放大到 `4×` 时，合法平移上下文随缩放连续扩展，最大只允许围绕美国本土包围盒向水平方向约扩展 `35%`、垂直方向约扩展 `25%`，不得把镜头拖到远离美国的全球区域。世界背景、48 州、中文州名与运输叠层共用同一个静态 SVG 世界坐标系和单一合成相机；缩放、平移每帧最多一次写入 `.province-map-camera-surface` 的 `translate3d + scale`，世界轮廓和州面 path `d`、州名基础坐标及 glyph transform 在手势期间保持不变。根级 `.application-map-layer` 继续承担最终物理视口裁剪，屏幕外的州面与世界背景几何不得从世界面卸载。滚轮／双指围绕真实焦点更新同一个目标相机，鼠标／单指拖动和双指平移也只修改该目标；每次输入更新后必须在写入下一帧前依据当前逻辑缩放、美国本土上下文包围盒、容器尺寸与 SVG `viewBox` 连续 clamp，不得先越界再回弹。若任一轴的合法上下文小于可视区域，该轴必须居中并禁止继续平移，禁止使用固定屏幕分辨率的硬编码边界。空白双击／双触、真实容器 resize 的地图重置都必须回到动态计算后的逻辑 `1×` 美国居中镜头。只要仍有待提交的 `requestAnimationFrame` 相机写入，本轮输入就不得先进入 idle，必须至少提交一帧 active 合成结果后才允许 `INPUT_SETTLE_MS` 收口；`will-change: transform` 只在 active 期间临时开启并在停止后清除。地图拖动、缩放不得调用 ECharts、ZRender、重新投影、重新布局州名或维护第二套标签相机。移动双指从州面、州界附近或地图空白起手必须等价；一旦本轮出现双指，从多点手势开始到最后触点抬起后的 `420ms` 内，必须抑制合成 click、州面选择和空白双触重置，窗口结束后的正常单指点击立即恢复。多点抑制只负责输入仲裁，不得驱动、回滚或复制相机。"""
          replace_once(
              'docs/LIQUID_GLASS_CHROME_DESIGN.md',
              r'- 战略地图固定使用唯一静态 SVG 世界面，由.*?\n- 战略地图州面交互固定采用',
              chrome_world + '\n' + chrome_camera + '\n- 战略地图州面交互固定采用',
              re.S,
          )
          replace_once(
              'docs/LIQUID_GLASS_CHROME_DESIGN.md',
              r'- `tests/browser/province-map-world-boundary\.spec\.ts`：.*',
              '- `tests/browser/province-map-world-boundary.spec.ts`：锁定世界背景使用 10m 大陆填充、海岸主线和低强度外阴影且保持完全不可交互；美国外轮廓由同一 `states-10m` 州拓扑合并生成并覆盖世界 coastline 的美国对应描边；桌面最小逻辑 `1×` 时美国本土约占有效地图面积 `2/3` 并居中且不可平移，放大后平移只在逐步扩展的美国周边上下文内连续 clamp，竖屏优先完整显示并居中。',
          )
          replace_once(
              'docs/LIQUID_GLASS_CHROME_DESIGN.md',
              r'- `tests/browser/map-zoom-out-boundary\.spec\.ts`：.*',
              '- `tests/browser/map-zoom-out-boundary.spec.ts`：必须先把地图放大到外围州真实离开屏幕，再缩小到逻辑 `1×`，验证在合成相机仍 active 时加利福尼亚、佛罗里达、缅因和华盛顿已经重新进入物理视口且州名中心命中对应州面；`tests/browser/map-zoom-transient.spec.ts` 锁定手势期间 48 条 path `d` 与 glyph 基础 transform 不变、同帧滚轮只写一次合成相机；`tests/browser/map-zoom-render-sync.spec.ts` 锁定州面和州名共享同一个静态世界与相机；`tests/browser/map-reset-sync.spec.ts` 锁定空白重置首帧同步到动态逻辑 `1×` 美国居中镜头。',
          )

          ui_camera = """- 战略地图的世界上下文数据精度、大陆填充与外阴影、美国外边线合并、逻辑缩放基准、最小镜头面积目标、重置语义和平移边界唯一遵循 `LIQUID_GLASS_CHROME_DESIGN.md`；本设计只要求州面、中文州全名与运输叠层继续位于同一个静态 SVG 世界坐标系和同一个 `.province-map-camera-surface` 下，响应式条件下不得通过第二相机、第二地图或重排标签来实现镜头变化。"""
          replace_once(
              'docs/UI_DESIGN_SYSTEM.md',
              r'- 桌面与移动默认镜头均为完整美国本土轮廓的等比 Contain 视图.*?(?=\n- 中文州全名)',
              ui_camera,
              re.S,
          )

          page_camera = """战略地图镜头、缩放、重置和平移边界唯一遵循 `LIQUID_GLASS_CHROME_DESIGN.md`。页面信息架构只要求州面和中文州全名继续位于同一个 SVG 世界坐标系以及同一个 `.province-map-camera-surface` 下，不得由页面路由维护第二套相机、标签相机或地图几何；高频手势仍只通过共享地图组件更新唯一合成相机。"""
          replace_once(
              'docs/PAGE_CONTENT_AND_NAVIGATION_DESIGN.md',
              r'默认镜头使用固定投影比例的等比 Contain 视图并保留安全边距，用户缩放范围固定为 `0\.5～4`。.*?(?=\n\n中文州全名作为唯一州面名称)',
              page_camera,
              re.S,
          )

          page_verify = Path('scripts/verify-page-content.mjs')
          page_verify_text = page_verify.read_text()
          old_page_assert = "'用户缩放范围固定为 `0.5～4`'"
          new_page_assert = "'战略地图镜头、缩放、重置和平移边界唯一遵循 `LIQUID_GLASS_CHROME_DESIGN.md`'"
          if old_page_assert not in page_verify_text:
              raise SystemExit('scripts/verify-page-content.mjs: old zoom authority assertion missing')
          page_verify.write_text(page_verify_text.replace(old_page_assert, new_page_assert, 1))

          provincial = Path('scripts/verify-provincial-economy.mjs')
          text = provincial.read_text()
          replacements = [
              ("  'tests/browser/map-zoom-out-boundary.spec.ts',", "  'tests/browser/map-zoom-out-boundary.spec.ts',\n  'tests/browser/province-map-world-boundary.spec.ts',"),
              ("const topoJsonPackage = JSON.parse(read('node_modules/topojson-client/package.json'));", "const topoJsonPackage = JSON.parse(read('node_modules/topojson-client/package.json'));\nconst worldAtlasPackage = JSON.parse(read('node_modules/world-atlas/package.json'));"),
              ("assert.equal(packageJson.dependencies?.['topojson-client'], '3.1.0', 'TopoJSON 转换依赖必须精确锁定 topojson-client 3.1.0');", "assert.equal(packageJson.dependencies?.['topojson-client'], '3.1.0', 'TopoJSON 转换依赖必须精确锁定 topojson-client 3.1.0');\nassert.equal(packageJson.dependencies?.['world-atlas'], '2.0.2', '世界大陆 10m 数据依赖必须精确锁定 world-atlas 2.0.2');"),
              ("assert.match(String(topoJsonPackage.license || ''), /ISC/i, 'TopoJSON 转换包必须保留 ISC 许可元数据');", "assert.match(String(topoJsonPackage.license || ''), /ISC/i, 'TopoJSON 转换包必须保留 ISC 许可元数据');\nassert.match(String(worldAtlasPackage.license || ''), /ISC/i, '世界大陆数据包必须保留 ISC 许可元数据');\nassert.equal(existsSync('src/data/world-land-110m.json'), false, '不得恢复已退役的 110m 世界大陆数据副本');"),
              ("\"us-atlas/states-10m.json\", \"import { feature } from 'topojson-client'\", 'const regionByMapName = new Map',", "\"us-atlas/states-10m.json\", \"import { feature, merge } from 'topojson-client'\", 'const regionByMapName = new Map',"),
              ("  'provinceMapWorld', 'province-map-camera-surface', 'province-map-world-svg', 'province-map-region',", "  'provinceMapWorld', 'province-map-camera-surface', 'province-map-world-svg', 'province-map-region',\n  'provinceMapMainlandOutlinePath', 'province-map-world-shadow', 'province-map-world-fill', 'province-map-mainland-seam', 'province-map-mainland-outline',"),
              ("  'export const PROVINCE_MAP_ZOOM_MIN = 0.5', 'export const PROVINCE_MAP_ZOOM_MAX = 4',", "  'export const PROVINCE_MAP_ZOOM_MIN = 1', 'export const PROVINCE_MAP_ZOOM_MAX = 4',\n  'MAINLAND_MIN_AREA_RATIO = 2 / 3', 'MAINLAND_CONTEXT_EXPAND_X = 0.35', 'MAINLAND_CONTEXT_EXPAND_Y = 0.25',\n  \"container.dataset.mapPanBoundary = options.focusBounds ? 'mainland-context' : 'none'\", 'minimumPhysicalZoom', 'mapZoomBaseScale',"),
              ("  '.province-map-label', '.province-map-label-glyph', 'fill: var(--color-map-label);', \"[data-selected='true']\",", "  '.province-map-label', '.province-map-label-glyph', 'fill: var(--color-map-label);', \"[data-selected='true']\",\n  '.province-map-world-shadow', '.province-map-world-fill', '.province-map-world-outline', '.province-map-mainland-seam', '.province-map-mainland-outline',"),
              ("  '静态 SVG 世界面', '单一合成相机', '每帧最多一次', '屏幕外的州面',", "  '静态 SVG 世界面', '单一合成相机', '每帧最多一次', '屏幕外的州面',\n  '`world-atlas@2.0.2`', '`states-10m`', '逻辑 `1×`', '`2/3`', '水平方向约扩展 `35%`', '垂直方向约扩展 `25%`',"),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'scripts/verify-provincial-economy.mjs missing replacement anchor: {old}')
              text = text.replace(old, new, 1)
          world_helper_anchor = "const camera = read('src/components/provinces/provinceMapCamera.ts');"
          world_helper_check = """const worldContext = read('src/components/provinces/provinceMapWorldOutline.ts');
          for (const text of ["world-atlas/land-10m.json", 'createProvinceMapWorldOutlinePath', 'createProvinceMapMainlandFocusBounds']) {
            assert.ok(worldContext.includes(text), `10m 世界大陆上下文缺少: ${text}`);
          }
          const camera = read('src/components/provinces/provinceMapCamera.ts');"""
          if world_helper_anchor not in text:
              raise SystemExit('scripts/verify-provincial-economy.mjs world helper insertion anchor missing')
          text = text.replace(world_helper_anchor, world_helper_check, 1)
          map_test_anchor = "const mapBrowserTest = read('tests/browser/province-map.spec.ts');"
          map_test_check = """const worldBoundaryTest = read('tests/browser/province-map-world-boundary.spec.ts');
          for (const text of [
            'continents-filled-10m', 'data-map-world-resolution', 'states-10m-union',
            'data-map-focus-area-target', 'baseline.areaRatio', 'centerOffsetX', 'mainland-context',
          ]) assert.ok(worldBoundaryTest.includes(text), `战略地图世界上下文浏览器回归缺少: ${text}`);
          const mapBrowserTest = read('tests/browser/province-map.spec.ts');"""
          if map_test_anchor not in text:
              raise SystemExit('scripts/verify-provincial-economy.mjs browser test insertion anchor missing')
          text = text.replace(map_test_anchor, map_test_check, 1)
          provincial.write_text(text)

          Path('src/data/world-land-110m.json').unlink(missing_ok=True)
          PY

      - name: Remove one-shot workflow and commit generated lock
        run: |
          rm -f .github/workflows/branch-strategic-map-finalize.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json docs scripts src/data .github/workflows/branch-strategic-map-finalize.yml
          git diff --cached --check
          git commit -m 'Finalize strategic map design and lockfile'
          git push origin HEAD:codex/strategic-map-mainland-focus
