name: Apply deployment storage recovery documentation

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply authoritative deployment rules
        run: |
          set -euo pipefail
          python3 .agent/apply-deploy-storage-recovery.py
          rm -f .agent/apply-deploy-storage-recovery.py
          rm -f .github/workflows/agent-apply-deploy-storage-recovery.yml
          rmdir .agent 2>/dev/null || true
          git diff --check
      - name: Commit authoritative deployment rules
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "记录部署备份容量规则"
          git push origin HEAD:${{ github.head_ref }}
