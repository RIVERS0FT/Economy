name: Apply deployment storage recovery

on:
  push:
    branches:
      - agent/deploy-disk-recovery

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply verified deployment recovery
        run: |
          set -euo pipefail
          python3 .agent/apply-deploy-storage-recovery.py
          rm -f .agent/apply-deploy-storage-recovery.py
          rm -f .github/workflows/agent-apply-deploy-storage-recovery.yml
          rmdir .agent 2>/dev/null || true
          git diff --check
      - name: Commit deployment recovery
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "修复部署备份占满磁盘"
          git push origin HEAD:agent/deploy-disk-recovery
