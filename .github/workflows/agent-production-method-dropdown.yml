name: Agent production method dropdown

on:
  push:
    branches:
      - agent/production-method-dropdown
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/production-method-dropdown
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.4.0
      - name: Apply dropdown update
        run: node scripts/agent-production-method-dropdown.mjs
      - name: Commit formal changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            src/pages/production/ProductionFacilityDetail.tsx \
            src/styles/production-methods.css \
            docs/PAGE_CONTENT_AND_NAVIGATION_DESIGN.md \
            docs/UI_DESIGN_SYSTEM.md \
            scripts/verify-production-methods.mjs \
            tests/browser/production-methods.spec.ts
          git add -u -- \
            scripts/agent-production-method-dropdown.mjs \
            .github/workflows/agent-production-method-dropdown.yml
          git commit -m "改用下拉框选择作业制度"
          git push origin HEAD:agent/production-method-dropdown
