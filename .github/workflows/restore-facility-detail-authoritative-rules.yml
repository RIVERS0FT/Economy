name: Restore facility detail authoritative rules

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Restore retained facility rules
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('docs/INDUSTRY_AND_PRODUCTION_DESIGN.md')
          source = path.read_text()
          replacements = [
              (
                  'Bottom Sheet 必须在首次可见绘制前完成页面滚动锁定、稳定视觉视口高度快照和 `focus({ preventScroll: true })`，打开后不得因动态视口变化产生纵向抖动。',
                  'Bottom Sheet 必须在首次可见绘制前完成页面滚动锁定、稳定视觉视口高度快照和 `focus({ preventScroll: true })`；移动 Bottom Sheet 打开期间只允许单向上移，打开后不得因动态视口变化产生纵向抖动。移动触控下工厂选择卡不得使用缩放按压反馈。',
              ),
              (
                  '桌面详情高度继续由自然内容决定，不使用弹性空白行、可见 spacer 或独立纵向滚动条；',
                  '桌面详情卡高度由自然内容流决定，不使用弹性空白行、可见 spacer 或独立纵向滚动条；',
              ),
              (
                  '满员率紧跟工厂信息之后，显示当前百分比、恢复／下降方向和进度条。',
                  '满员率紧跟工厂信息之后；满员率状态带只显示当前百分比、恢复／下降方向和进度条。',
              ),
              (
                  '时间与成本固定放在投入与产出下方的同一条内容宽度操作数据带，中间使用竖向分隔线；生产进度位于数据带下方，并且是生产结算最后一个可见元素。生产结算不得包含单厂平均利润、当前周期说明或第二张结果卡。',
                  '时间与成本固定放在投入与产出下方的同一条操作数据带，操作数据带保持内容宽度并在中间使用竖向分隔线；生产进度位于数据带下方，并且是生产结算最后一个可见元素。进度条下方不得显示当前周期、恢复运行、产出、成本或其他说明文字。生产结算标题只显示“生产结算”，不得包含单厂平均利润、范围长句或第二张结果卡。',
              ),
          ]
          for old, new in replacements:
              if source.count(old) != 1:
                  raise SystemExit(f'expected one retained rule, found {source.count(old)}: {old[:90]}')
              source = source.replace(old, new, 1)
          path.write_text(source)
          Path('.github/workflows/restore-facility-detail-authoritative-rules.yml').unlink()
          PY
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- docs/INDUSTRY_AND_PRODUCTION_DESIGN.md .github/workflows/restore-facility-detail-authoritative-rules.yml
          git commit -m "补齐工厂详情既有权威规则"
          git push origin HEAD:${{ github.head_ref }}
