name: Apply atmosphere adjustment

on:
  push:
    branches:
      - codex/dim-shared-atmosphere

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply approved atmosphere changes
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def read(path: str) -> str:
              return Path(path).read_text(encoding='utf-8').replace('\r\n', '\n')

          def write(path: str, text: str) -> None:
              Path(path).write_text(text, encoding='utf-8')

          def replace_unique(path: str, old: str, new: str, label: str) -> None:
              text = read(path)
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path} [{label}]: expected one replacement, found {count}')
              write(path, text.replace(old, new))

          css_path = 'src/styles/financial-backdrop.css'
          replace_unique(
              css_path,
              '.application-atmosphere-layer {\n  z-index: -1;\n  overflow: hidden;',
              '''.application-atmosphere-layer {
            z-index: -1;
            overflow: hidden;
            --application-atmosphere-primary-glow: rgba(86, 224, 137, 0.10);
            --application-atmosphere-secondary-glow: rgba(44, 176, 102, 0.06);
            --application-atmosphere-shade-start: rgba(1, 7, 4, 0.96);
            --application-atmosphere-shade-mid: rgba(2, 10, 6, 0.90);
            --application-atmosphere-shade-focus: rgba(3, 12, 8, 0.84);
            --application-atmosphere-shade-end: rgba(2, 9, 6, 0.90);
            --application-atmosphere-grid-opacity: 0.16;
            --application-atmosphere-grid-size: 46px 46px;
            --application-atmosphere-noise-opacity: 0.045;''',
              'desktop variables',
          )
          for old, new, label in [
              ('rgba(86, 224, 137, 0.16)', 'var(--application-atmosphere-primary-glow)', 'desktop primary glow'),
              ('rgba(44, 176, 102, 0.11)', 'var(--application-atmosphere-secondary-glow)', 'desktop secondary glow'),
              ('rgba(1, 7, 4, 0.94)', 'var(--application-atmosphere-shade-start)', 'desktop shade start'),
              ('rgba(2, 10, 6, 0.82)', 'var(--application-atmosphere-shade-mid)', 'desktop shade mid'),
              ('rgba(3, 12, 8, 0.69)', 'var(--application-atmosphere-shade-focus)', 'desktop shade focus'),
              ('rgba(2, 9, 6, 0.82)', 'var(--application-atmosphere-shade-end)', 'desktop shade end'),
              ('  opacity: 0.24;', '  opacity: var(--application-atmosphere-grid-opacity);', 'desktop grid opacity'),
              ('  opacity: 0.075;', '  opacity: var(--application-atmosphere-noise-opacity);', 'desktop noise opacity'),
              ('  background-size: 46px 46px;', '  background-size: var(--application-atmosphere-grid-size);', 'desktop grid size'),
          ]:
              replace_unique(css_path, old, new, label)

          replace_unique(
              css_path,
              '@media (max-width: 720px) {\n',
              '''@media (max-width: 720px) {
            .application-atmosphere-layer {
              --application-atmosphere-primary-glow: rgba(86, 224, 137, 0.09);
              --application-atmosphere-shade-start: rgba(1, 7, 4, 0.78);
              --application-atmosphere-shade-mid: rgba(2, 10, 6, 0.76);
              --application-atmosphere-shade-end: rgba(2, 8, 5, 0.90);
              --application-atmosphere-grid-opacity: 0.08;
              --application-atmosphere-grid-size: 42px 42px;
              --application-atmosphere-noise-opacity: 0.03;
            }

          ''',
              'mobile variables',
          )
          for old, new, label in [
              ('rgba(86, 224, 137, 0.15)', 'var(--application-atmosphere-primary-glow)', 'mobile primary glow'),
              ('rgba(1, 7, 4, 0.62)', 'var(--application-atmosphere-shade-start)', 'mobile shade start'),
              ('rgba(2, 10, 6, 0.6)', 'var(--application-atmosphere-shade-mid)', 'mobile shade mid'),
              ('rgba(2, 8, 5, 0.82)', 'var(--application-atmosphere-shade-end)', 'mobile shade end'),
              ('    opacity: 0.12;', '    opacity: var(--application-atmosphere-grid-opacity);', 'mobile grid opacity'),
              ('    opacity: 0.05;', '    opacity: var(--application-atmosphere-noise-opacity);', 'mobile noise opacity'),
              ('    background-size: 42px 42px;', '    background-size: var(--application-atmosphere-grid-size);', 'mobile grid size'),
          ]:
              replace_unique(css_path, old, new, label)

          replace_unique(
              'docs/REGISTRATION_INVITE_FLOW_DESIGN.md',
              '> 更新时间：2026-08-03',
              '> 更新时间：2026-08-06',
              'registration design date',
          )
          replace_unique(
              'docs/REGISTRATION_INVITE_FLOW_DESIGN.md',
              '全应用氛围基线：认证、注册、九个玩家页面、管理员后台以及根级加载／异常状态继续保留 `auth`、`game`、`admin` 语义变体，但三者必须共享登录／注册页当前的摄影滤镜、渐变遮罩、网格和噪点参数；页面或角色不得再覆盖这些参数。',
              '全应用氛围基线：认证、注册、九个玩家页面、管理员后台以及根级加载／异常状态继续保留 `auth`、`game`、`admin` 语义变体，但三者必须共享登录／注册页当前的摄影滤镜、渐变遮罩、网格和噪点参数；页面或角色不得再覆盖这些参数。正常态摄影图片只作为低对比度空间纹理，第一视觉层必须是状态栏、导航、业务卡片和正文；不得通过降低共享遮罩、增强绿光、网格或噪点，使人物、窗框或建筑轮廓与业务内容争夺注意力。',
              'registration atmosphere principle',
          )
          replace_unique(
              'docs/REGISTRATION_INVITE_FLOW_DESIGN.md',
              '桌面渐变固定复用登录页横向明暗分布，网格与噪点透明度固定为 `0.24` 和 `0.075`；',
              '桌面渐变固定使用两处低强度绿光 `0.10 / 0.06` 与横向主遮罩 `0.96 / 0.90 / 0.84 / 0.90`，网格与噪点透明度固定为 `0.16` 和 `0.045`；',
              'desktop design values',
          )
          replace_unique(
              'docs/REGISTRATION_INVITE_FLOW_DESIGN.md',
              '移动图片滤镜固定为 `saturate(0.68) contrast(1.08) brightness(0.62)`，纵向主遮罩固定使用 `rgba(1, 7, 4, 0.62)`、`rgba(2, 10, 6, 0.6)`、`rgba(2, 8, 5, 0.82)`，网格与噪点透明度固定为 `0.12` 和 `0.05`。',
              '移动图片滤镜固定为 `saturate(0.68) contrast(1.08) brightness(0.62)`，顶部低强度绿光固定为 `0.09`，纵向主遮罩固定使用 `rgba(1, 7, 4, 0.78)`、`rgba(2, 10, 6, 0.76)`、`rgba(2, 8, 5, 0.90)`，网格与噪点透明度固定为 `0.08` 和 `0.03`。',
              'mobile design values',
          )

          replace_unique(
              'docs/LIQUID_GLASS_CHROME_DESIGN.md',
              '> 更新时间：2026-08-04',
              '> 更新时间：2026-08-06',
              'liquid glass design date',
          )
          replace_unique(
              'docs/LIQUID_GLASS_CHROME_DESIGN.md',
              '全应用摄影氛围只允许一套正常态视觉参数：登录、玩家与管理员必须使用完全相同的摄影滤镜、渐变遮罩、网格与噪点，并以登录／注册页参数为基线。`data-app-backdrop` 只保留语义和状态路由职责，不得触发角色级或页面级视觉覆盖；`critical` 只允许在共享氛围之上增加红色内暗角。',
              '全应用摄影氛围只允许一套正常态视觉参数：登录、玩家与管理员必须使用完全相同的摄影滤镜、渐变遮罩、网格与噪点，并以登录／注册页参数为基线。正常态摄影图片只承担低对比度空间纹理职责，状态栏、导航、业务卡片和正文必须保持第一视觉优先级；不得通过角色级覆盖或降低遮罩重新强化图片细节。`data-app-backdrop` 只保留语义和状态路由职责，不得触发角色级或页面级视觉覆盖；`critical` 只允许在共享氛围之上增加红色内暗角。',
              'liquid glass atmosphere principle',
          )

          game_verify_path = 'scripts/verify-game-three-layer.mjs'
          game_verify = read(game_verify_path)
          section_start = game_verify.index('const unifiedAtmosphereCss = read(')
          require_start = game_verify.index('for (const text of [', section_start)
          forbid_end_marker = "]) forbidText('src/styles/financial-backdrop.css', text);"
          forbid_end = game_verify.index(forbid_end_marker, require_start) + len(forbid_end_marker)
          new_atmosphere_checks = '''for (const text of [
            'filter: saturate(0.72) contrast(1.08) brightness(0.72);',
            'filter: saturate(0.68) contrast(1.08) brightness(0.62);',
            '--application-atmosphere-primary-glow: rgba(86, 224, 137, 0.10);',
            '--application-atmosphere-secondary-glow: rgba(44, 176, 102, 0.06);',
            '--application-atmosphere-shade-start: rgba(1, 7, 4, 0.96);',
            '--application-atmosphere-shade-mid: rgba(2, 10, 6, 0.90);',
            '--application-atmosphere-shade-focus: rgba(3, 12, 8, 0.84);',
            '--application-atmosphere-shade-end: rgba(2, 9, 6, 0.90);',
            '--application-atmosphere-grid-opacity: 0.16;',
            '--application-atmosphere-noise-opacity: 0.045;',
            '--application-atmosphere-primary-glow: rgba(86, 224, 137, 0.09);',
            '--application-atmosphere-shade-start: rgba(1, 7, 4, 0.78);',
            '--application-atmosphere-shade-mid: rgba(2, 10, 6, 0.76);',
            '--application-atmosphere-shade-end: rgba(2, 8, 5, 0.90);',
            '--application-atmosphere-grid-opacity: 0.08;',
            '--application-atmosphere-noise-opacity: 0.03;',
          ]) requireText('src/styles/financial-backdrop.css', text);
          for (const text of [
            'brightness(0.5)',
            'brightness(0.42)',
            'brightness(0.43)',
            'brightness(0.36)',
            'opacity: 0.24;',
            'opacity: 0.075;',
            'opacity: 0.12;',
            'opacity: 0.05;',
          ]) forbidText('src/styles/financial-backdrop.css', text);'''
          game_verify = game_verify[:require_start] + new_atmosphere_checks + game_verify[forbid_end:]
          game_verify = game_verify.replace(
              "  '页面或角色不得再覆盖这些参数',\n",
              "  '页面或角色不得再覆盖这些参数',\n  '正常态摄影图片只作为低对比度空间纹理',\n",
              1,
          )
          game_verify = game_verify.replace(
              "  '`data-app-backdrop` 只保留语义和状态路由职责',\n",
              "  '`data-app-backdrop` 只保留语义和状态路由职责',\n  '正常态摄影图片只承担低对比度空间纹理职责',\n",
              1,
          )
          old_test_checks = '''for (const text of [
            'auth, game and admin share the desktop atmosphere baseline',
            'auth, game and admin share the mobile atmosphere baseline',
          ]) requireText('tests/browser/application-atmosphere-consistency.spec.ts', text);'''
          new_test_checks = '''for (const text of [
            'auth, game and admin share the desktop atmosphere baseline',
            'auth, game and admin share the mobile atmosphere baseline',
            'locks the desktop atmosphere intensity',
            'locks the mobile atmosphere intensity',
          ]) requireText('tests/browser/application-atmosphere-consistency.spec.ts', text);'''
          if game_verify.count(old_test_checks) != 1:
              raise SystemExit('verify-game-three-layer: atmosphere browser check block changed')
          game_verify = game_verify.replace(old_test_checks, new_test_checks)
          write(game_verify_path, game_verify)

          auth_verify_path = 'scripts/verify-auth-three-layer.mjs'
          auth_verify = read(auth_verify_path)
          anchor = auth_verify.index("  'rgba(1, 7, 4, 0.62) 0%',")
          block_start = auth_verify.rindex('for (const text of [', 0, anchor)
          block_end_marker = "]) requireText('src/styles/financial-backdrop.css', text);"
          block_end = auth_verify.index(block_end_marker, anchor) + len(block_end_marker)
          new_auth_background_checks = '''for (const text of [
            '.application-image-layer,',
            '.application-atmosphere-layer {',
            'html[data-app-backdrop="auth"] .application-image-layer img',
            'html[data-app-backdrop="auth"] .application-atmosphere-layer',
            '--application-atmosphere-shade-start: rgba(1, 7, 4, 0.78);',
            '--application-atmosphere-shade-mid: rgba(2, 10, 6, 0.76);',
            '--application-atmosphere-shade-end: rgba(2, 8, 5, 0.90);',
            'html[data-app-backdrop="auth"] .application-atmosphere-layer::before',
            '--application-atmosphere-grid-opacity: 0.08;',
            'html[data-app-backdrop="auth"] .application-atmosphere-layer::after',
            '--application-atmosphere-noise-opacity: 0.03;',
            '.application-content-root .login-shell',
            'background: transparent !important;',
            '.application-content-root {',
            'z-index: auto;',
            '.application-image-layer {',
            'z-index: -2;',
            '.application-atmosphere-layer {',
            'z-index: -1;',
          ]) requireText('src/styles/financial-backdrop.css', text);'''
          auth_verify = auth_verify[:block_start] + new_auth_background_checks + auth_verify[block_end:]
          write(auth_verify_path, auth_verify)

          replace_unique(
              'tests/browser/auth-three-layer.spec.ts',
              '''      expect(atmosphere.backgroundImage).toContain('rgba(1, 7, 4, 0.62)');
            expect(atmosphere.backgroundImage).toContain('rgba(2, 10, 6, 0.6)');
            expect(atmosphere.backgroundImage).toContain('rgba(2, 8, 5, 0.82)');
            expect(atmosphere.gridOpacity).toBe('0.12');
            expect(atmosphere.noiseOpacity).toBe('0.05');''',
              '''      expect(atmosphere.backgroundImage).toContain('rgba(1, 7, 4, 0.78)');
            expect(atmosphere.backgroundImage).toContain('rgba(2, 10, 6, 0.76)');
            expect(atmosphere.backgroundImage).toContain('rgba(2, 8, 5, 0.9)');
            expect(atmosphere.gridOpacity).toBe('0.08');
            expect(atmosphere.noiseOpacity).toBe('0.03');''',
              'mobile browser atmosphere assertions',
          )

          write('tests/browser/application-atmosphere-consistency.spec.ts', '''import { expect, test, type Page } from '@playwright/test';

          type BackdropVariant = 'auth' | 'game' | 'admin';

          type AtmosphereSnapshot = {
            imageFilter: string;
            atmosphereBackground: string;
            primaryGlow: string;
            secondaryGlow: string;
            shadeStart: string;
            shadeMid: string;
            shadeFocus: string;
            shadeEnd: string;
            gridOpacity: string;
            gridOpacityToken: string;
            gridSizeToken: string;
            gridBackground: string;
            gridMask: string;
            noiseOpacity: string;
            noiseOpacityToken: string;
            noiseBackground: string;
            noiseBlendMode: string;
          };

          async function atmosphereSnapshot(page: Page, variant: BackdropVariant): Promise<AtmosphereSnapshot> {
            await page.evaluate((nextVariant) => {
              document.documentElement.dataset.appBackdrop = nextVariant;
              document.documentElement.dataset.appTone = 'normal';
            }, variant);

            return page.evaluate(() => {
              const image = document.querySelector<HTMLImageElement>('.application-image-layer img');
              const atmosphere = document.querySelector<HTMLElement>('.application-atmosphere-layer');
              if (!image || !atmosphere) throw new Error('persistent application atmosphere is missing');
              const atmosphereStyle = getComputedStyle(atmosphere);
              const gridStyle = getComputedStyle(atmosphere, '::before');
              const noiseStyle = getComputedStyle(atmosphere, '::after');
              const token = (name: string) => atmosphereStyle.getPropertyValue(name).trim();
              return {
                imageFilter: getComputedStyle(image).filter,
                atmosphereBackground: atmosphereStyle.backgroundImage,
                primaryGlow: token('--application-atmosphere-primary-glow'),
                secondaryGlow: token('--application-atmosphere-secondary-glow'),
                shadeStart: token('--application-atmosphere-shade-start'),
                shadeMid: token('--application-atmosphere-shade-mid'),
                shadeFocus: token('--application-atmosphere-shade-focus'),
                shadeEnd: token('--application-atmosphere-shade-end'),
                gridOpacity: gridStyle.opacity,
                gridOpacityToken: token('--application-atmosphere-grid-opacity'),
                gridSizeToken: token('--application-atmosphere-grid-size'),
                gridBackground: gridStyle.backgroundImage,
                gridMask: gridStyle.maskImage,
                noiseOpacity: noiseStyle.opacity,
                noiseOpacityToken: token('--application-atmosphere-noise-opacity'),
                noiseBackground: noiseStyle.backgroundImage,
                noiseBlendMode: noiseStyle.mixBlendMode,
              };
            });
          }

          async function expectUnifiedAtmosphere(page: Page, viewport: { width: number; height: number }) {
            await page.setViewportSize(viewport);
            await page.goto('runtime-test.html');
            await expect(page.locator('.application-image-layer')).toHaveCount(1);
            await expect(page.locator('.application-atmosphere-layer')).toHaveCount(1);

            const auth = await atmosphereSnapshot(page, 'auth');
            const game = await atmosphereSnapshot(page, 'game');
            const admin = await atmosphereSnapshot(page, 'admin');

            expect(game).toEqual(auth);
            expect(admin).toEqual(auth);
            return auth;
          }

          test('auth, game and admin share the desktop atmosphere baseline', async ({ page }) => {
            await expectUnifiedAtmosphere(page, { width: 1440, height: 900 });
          });

          test('auth, game and admin share the mobile atmosphere baseline', async ({ page }) => {
            await expectUnifiedAtmosphere(page, { width: 390, height: 844 });
          });

          test('locks the desktop atmosphere intensity', async ({ page }) => {
            const atmosphere = await expectUnifiedAtmosphere(page, { width: 1440, height: 900 });

            expect(atmosphere.imageFilter).toBe('saturate(0.72) contrast(1.08) brightness(0.72)');
            expect(atmosphere.primaryGlow).toBe('rgba(86, 224, 137, 0.10)');
            expect(atmosphere.secondaryGlow).toBe('rgba(44, 176, 102, 0.06)');
            expect(atmosphere.shadeStart).toBe('rgba(1, 7, 4, 0.96)');
            expect(atmosphere.shadeMid).toBe('rgba(2, 10, 6, 0.90)');
            expect(atmosphere.shadeFocus).toBe('rgba(3, 12, 8, 0.84)');
            expect(atmosphere.shadeEnd).toBe('rgba(2, 9, 6, 0.90)');
            expect(atmosphere.gridOpacity).toBe('0.16');
            expect(atmosphere.gridOpacityToken).toBe('0.16');
            expect(atmosphere.gridSizeToken).toBe('46px 46px');
            expect(atmosphere.noiseOpacity).toBe('0.045');
            expect(atmosphere.noiseOpacityToken).toBe('0.045');
          });

          test('locks the mobile atmosphere intensity', async ({ page }) => {
            const atmosphere = await expectUnifiedAtmosphere(page, { width: 390, height: 844 });

            expect(atmosphere.imageFilter).toBe('saturate(0.68) contrast(1.08) brightness(0.62)');
            expect(atmosphere.primaryGlow).toBe('rgba(86, 224, 137, 0.09)');
            expect(atmosphere.shadeStart).toBe('rgba(1, 7, 4, 0.78)');
            expect(atmosphere.shadeMid).toBe('rgba(2, 10, 6, 0.76)');
            expect(atmosphere.shadeEnd).toBe('rgba(2, 8, 5, 0.90)');
            expect(atmosphere.gridOpacity).toBe('0.08');
            expect(atmosphere.gridOpacityToken).toBe('0.08');
            expect(atmosphere.gridSizeToken).toBe('42px 42px');
            expect(atmosphere.noiseOpacity).toBe('0.03');
            expect(atmosphere.noiseOpacityToken).toBe('0.03');
          });
          ''')
          PY

      - name: Run focused verification
        shell: bash
        run: |
          node scripts/verify-auth-three-layer.mjs
          node scripts/verify-game-three-layer.mjs
          node scripts/verify-document-authority.mjs
          git diff --check

      - name: Commit implementation
        shell: bash
        run: |
          rm .github/workflows/apply-atmosphere-adjustment.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            docs/REGISTRATION_INVITE_FLOW_DESIGN.md \
            docs/LIQUID_GLASS_CHROME_DESIGN.md \
            scripts/verify-auth-three-layer.mjs \
            scripts/verify-game-three-layer.mjs \
            src/styles/financial-backdrop.css \
            tests/browser/application-atmosphere-consistency.spec.ts \
            tests/browser/auth-three-layer.spec.ts \
            .github/workflows/apply-atmosphere-adjustment.yml
          git commit -m "降低共享摄影背景强度"
          git push origin HEAD:${{ github.ref_name }}
