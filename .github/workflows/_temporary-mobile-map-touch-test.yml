name: Temporary Mobile Map Touch Test

on:
  push:
    branches:
      - fix/mobile-map-interactions-20260821

permissions:
  contents: write

jobs:
  apply-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/mobile-map-interactions-20260821
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.4.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply touch regression correction
        run: |
          python3 -m py_compile scripts/_temporary_fix_mobile_map_touch_test.py
          python3 scripts/_temporary_fix_mobile_map_touch_test.py
          git diff --check

      - name: Prepare Chromium
        run: bash scripts/prepare-playwright-chromium.sh

      - name: Run focused mobile map regression
        run: npx playwright test tests/browser/province-map.spec.ts --grep "mobile strategy map keeps labels and blank-space gestures usable" --workers=1

      - name: Remove temporary correction machinery
        run: |
          git rm -f .github/workflows/_temporary-mobile-map-touch-test.yml scripts/_temporary_fix_mobile_map_touch_test.py
          git diff --check

      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "test: use real touch context for map reset"
          git push origin HEAD:${GITHUB_REF_NAME}
