name: Agent fix unified mobile sheet regressions

on:
  push:
    branches:
      - agent/unified-mobile-sheet-host
    paths:
      - .github/workflows/agent-fix-unified-mobile-sheet.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/unified-mobile-sheet-host
          fetch-depth: 0

      - name: Apply focused mobile sheet fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str, *, count: int | None = None):
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              actual = text.count(old)
              if actual == 0:
                  raise SystemExit(f'{path}: missing replacement source: {old[:120]!r}')
              if count is not None and actual != count:
                  raise SystemExit(f'{path}: expected {count} matches, found {actual}: {old[:120]!r}')
              file.write_text(text.replace(old, new), encoding='utf-8', newline='\n')

          host = 'src/components/ui/MobileWorkspaceSheetHost.tsx'
          replace(host, '''              onPointerDown={activeDetail ? undefined : handlePointerDown}
              onPointerMove={activeDetail ? undefined : handlePointerMove}
              onPointerUp={activeDetail ? undefined : handlePointerEnd}
              onPointerCancel={activeDetail ? undefined : handlePointerEnd}
              onTouchStart={activeDetail ? undefined : handleTouchStart}
              onTouchMove={activeDetail ? undefined : handleTouchMove}
              onTouchEnd={activeDetail ? undefined : handleTouchEnd}
              onTouchCancel={activeDetail ? undefined : cancelDrag}
''', '''              onPointerDown={handlePointerDown}
              onPointerMove={handlePointerMove}
              onPointerUp={handlePointerEnd}
              onPointerCancel={handlePointerEnd}
              onTouchStart={handleTouchStart}
              onTouchMove={handleTouchMove}
              onTouchEnd={handleTouchEnd}
              onTouchCancel={cancelDrag}
''', count=1)
          replace(host, '''                  onPointerDown={handlePointerDown}
                  onPointerMove={handlePointerMove}
                  onPointerUp={handlePointerEnd}
                  onPointerCancel={handlePointerEnd}
                  onTouchStart={handleTouchStart}
                  onTouchMove={handleTouchMove}
                  onTouchEnd={handleTouchEnd}
                  onTouchCancel={cancelDrag}
''', '', count=1)

          replace('tests/browser/input-modality.spec.ts',
                  '    await page.mouse.click(2, 2);\n',
                  '''    await trigger.dispatchEvent('pointerdown', {
      bubbles: true,
      isPrimary: true,
      pointerType: 'mouse',
    });
''', count=1)

          old_direct = ".workspace-dialog-layer > .mobile-detail-sheet"
          new_direct = ".workspace-dialog-layer > .mobile-detail-sheet-backdrop > .mobile-detail-sheet"
          for path in [
              'tests/browser/mobile-detail-sheet.spec.ts',
              'tests/browser/mobile-page-sheet-all-pages.spec.ts',
          ]:
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              if old_direct not in text:
                  raise SystemExit(f'{path}: missing old direct sheet selector')
              file.write_text(text.replace(old_direct, new_direct), encoding='utf-8', newline='\n')

          nav_path = 'tests/browser/mobile-navigation-scrollbar.spec.ts'
          replace(nav_path, '''    await inactive.click();
    await expect(inactive).toHaveAttribute('aria-current', 'page');
    await expect(active).not.toHaveAttribute('aria-current', 'page');
''', '''    const sheet = page.locator('.mobile-workspace-sheet-host');
    const navigationCovered = await inactive.evaluate((element) => {
      const box = element.getBoundingClientRect();
      return Boolean(document.elementFromPoint(
        box.left + box.width / 2,
        box.top + box.height / 2,
      )?.closest('.mobile-detail-sheet-backdrop'));
    });
    expect(navigationCovered).toBe(true);

    await page.getByRole('button', { name: '关闭当前页面并显示地图' }).click();
    await expect(sheet).toHaveCount(0);
    await inactive.click();
    await expect(inactive).toHaveAttribute('aria-current', 'page');
    await expect(active).not.toHaveAttribute('aria-current', 'page');
''', count=1)

          notification_path = 'tests/browser/notification-center.spec.ts'
          replace(notification_path, '''    await page.setViewportSize({ width: 390, height: 844 });
    await page.goto('runtime-test.html?view=overview&scenario=activity');
    await openNotificationPanel(page);
    await mountMobileIsland(page, 3);
''', '''    await page.setViewportSize({ width: 390, height: 844 });
    await page.goto('runtime-test.html?view=overview&scenario=activity');
    const workspaceSheet = page.locator('.mobile-workspace-sheet-host');
    await expect(workspaceSheet).toBeVisible();
    await page.getByRole('button', { name: '关闭当前页面并显示地图' }).click();
    await expect(workspaceSheet).toHaveCount(0);
    await openNotificationPanel(page);
    await mountMobileIsland(page, 3);
''', count=1)

          production_path = 'tests/browser/production-methods.spec.ts'
          replace(production_path, '''      const sheet = page.locator('.mobile-detail-sheet');
      const scroll = sheet.locator('.mobile-detail-sheet-scroll');
      await expect(sheet).toBeVisible();
''', '''      const sheet = page.locator('.mobile-detail-sheet');
      const detailView = sheet.locator('.mobile-workspace-sheet-detail-view');
      const scroll = detailView.locator('.mobile-detail-sheet-scroll');
      await expect(sheet).toBeVisible();
      await expect(detailView).toBeVisible();
''', count=1)
          for old, new in [
              ("sheet.locator('.facility-detail-artwork-icon')", "detailView.locator('.facility-detail-artwork-icon')"),
              ("sheet.locator('.facility-staffing-track')", "detailView.locator('.facility-staffing-track')"),
              ("sheet.locator('.facility-staffing-fill')", "detailView.locator('.facility-staffing-fill')"),
              ("sheet.locator('.mobile-detail-sheet-header > :not(.mobile-detail-sheet-drag-handle)')", "detailView.locator('.mobile-detail-sheet-header > :not(.mobile-detail-sheet-drag-handle)')"),
              ("sheet.locator('.facility-information')", "detailView.locator('.facility-information')"),
              ("sheet.locator('.facility-information .facility-average-profit')", "detailView.locator('.facility-information .facility-average-profit')"),
              ("sheet.locator('.facility-production-formula .facility-average-profit')", "detailView.locator('.facility-production-formula .facility-average-profit')"),
              ("sheet.locator('.facility-detail-artwork')", "detailView.locator('.facility-detail-artwork')"),
              ("sheet.locator('.facility-production-method-summary')", "detailView.locator('.facility-production-method-summary')"),
              ("sheet.locator('.facility-staffing-meta')", "detailView.locator('.facility-staffing-meta')"),
              ("sheet.locator('.facility-formula-scope')", "detailView.locator('.facility-formula-scope')"),
              ("sheet.getByRole('combobox', { name: '机械工厂生产产物' })", "detailView.getByRole('combobox', { name: '机械工厂生产产物' })"),
              ("sheet.getByRole('combobox', { name: '机械工厂生产方式' })", "detailView.getByRole('combobox', { name: '机械工厂生产方式' })"),
              ("sheet.locator('.facility-production-formula')", "detailView.locator('.facility-production-formula')"),
              ("sheet.locator('.facility-operating-diagnostics')", "detailView.locator('.facility-operating-diagnostics')"),
              ("sheet.locator('.mobile-detail-sheet-footer')", "detailView.locator('.mobile-detail-sheet-footer')"),
              ("await expect(sheet).not.toContainText('缩短周期并提高成本');", "await expect(detailView).not.toContainText('缩短周期并提高成本');"),
          ]:
              replace(production_path, old, new)

          research_path = 'tests/browser/research-technology-tree.spec.ts'
          replace(research_path, '''    const dialog = page.getByRole('dialog', { name: '冶金技术研发新技术' });
    await expect(dialog).toBeVisible();
    await expect(dialog).toHaveClass(/mobile-detail-sheet/);
    await expect(dialog).toContainText('研发投入');
    await expect(dialog).not.toContainText('具体要求');
    await expect(dialog).not.toContainText('产业经营视角');
    await expect(dialog).not.toContainText('就业资金已释放');
    await expect(dialog.getByRole('button', { name: '研发中 · 1 宝石加速 30m' })).toBeVisible();
    await expect(dialog.locator('.mobile-detail-summary')).toBeVisible();
    await expect(dialog.locator('.mobile-detail-sheet-footer')).toBeVisible();
''', '''    const dialog = page.getByRole('dialog', { name: '冶金技术研发新技术' });
    await expect(dialog).toBeVisible();
    await expect(dialog).toHaveClass(/mobile-detail-sheet/);
    const detailView = dialog.locator('.mobile-workspace-sheet-detail-view');
    await expect(detailView).toBeVisible();
    await expect(detailView).toContainText('研发投入');
    await expect(detailView).not.toContainText('具体要求');
    await expect(detailView).not.toContainText('产业经营视角');
    await expect(detailView).not.toContainText('就业资金已释放');
    await expect(detailView.getByRole('button', { name: '研发中 · 1 宝石加速 30m' })).toBeVisible();
    await expect(detailView.locator('.mobile-detail-summary')).toHaveCount(1);
    await expect(detailView.locator('.mobile-detail-sheet-footer')).toBeVisible();
''', count=1)

          warehouse_path = 'tests/browser/warehouse-auto-sell.spec.ts'
          replace(warehouse_path, '''    const sheet = page.locator('.mobile-detail-sheet');
    await expect(sheet).toBeVisible();
    await expect(sheet).toContainText('自动交易');
    await expect(sheet).toContainText('设置保存至存档 · 在线维护买单');
    await expect(sheet.getByLabel('目标自由库存')).toHaveValue('0');
    await expect(sheet.getByLabel('最高自动采购价格')).toBeVisible();
    await expect(page.locator('.mobile-detail-sheet-footer').getByRole('button', { name: '保存自动交易设置' })).toBeVisible();

    await page.keyboard.press('Escape');
    await expect(sheet).toHaveCount(0);
    await expect(productCard).toBeFocused();
''', '''    const sheet = page.locator('.mobile-detail-sheet');
    const detailView = sheet.locator('.mobile-workspace-sheet-detail-view');
    await expect(sheet).toBeVisible();
    await expect(detailView).toBeVisible();
    await expect(detailView).toContainText('自动交易');
    await expect(detailView).toContainText('设置保存至存档 · 在线维护买单');
    await expect(detailView.getByLabel('目标自由库存')).toHaveValue('0');
    await expect(detailView.getByLabel('最高自动采购价格')).toBeVisible();
    await expect(detailView.locator('.mobile-detail-sheet-footer').getByRole('button', { name: '保存自动交易设置' })).toBeVisible();

    await page.keyboard.press('Escape');
    await expect(detailView).toHaveCount(0);
    await expect(sheet).toBeVisible();
    await expect(sheet).toHaveAttribute('data-detail-active', 'false');
    await expect(productCard).toBeFocused();
''', count=1)
          replace(warehouse_path, '''    await expect(warehouse.getByText('自动交易', { exact: true })).toHaveCount(0);
    await expect(page.locator('.mobile-detail-sheet')).toHaveCount(0);
''', '''    await expect(warehouse.getByText('自动交易', { exact: true })).toHaveCount(0);
    const sheet = page.locator('.mobile-workspace-sheet-host');
    await expect(sheet).toBeVisible();
    await expect(sheet).toHaveAttribute('data-page-key', 'province');
    await expect(sheet).toHaveAttribute('data-detail-active', 'false');
''', count=1)

          verifier = 'scripts/verify-mobile-page-sheet.mjs'
          file = Path(verifier)
          text = file.read_text(encoding='utf-8')
          text = text.replace(old_direct, new_direct)
          if text == file.read_text(encoding='utf-8'):
              raise SystemExit('verify-mobile-page-sheet.mjs: selector replacement did not apply')
          file.write_text(text, encoding='utf-8', newline='\n')
          replace(verifier, '''  'className="mobile-detail-sheet mobile-workspace-sheet-host"',
  'data-mobile-workspace-sheet-host="true"',
''', '''  'className="mobile-detail-sheet mobile-workspace-sheet-host"',
  'data-mobile-workspace-sheet-host="true"',
  'onPointerDown={handlePointerDown}',
  'onTouchStart={handleTouchStart}',
  'onTouchMove={handleTouchMove}',
  'onTouchEnd={handleTouchEnd}',
''', count=1)
          replace(verifier, '''forbidAll('src/components/ui/MobileWorkspaceSheetHost.tsx', [
  'mobile-workspace-page-sheet',
]);
''', '''forbidAll('src/components/ui/MobileWorkspaceSheetHost.tsx', [
  'mobile-workspace-page-sheet',
  'onPointerDown={activeDetail ? undefined : handlePointerDown}',
  'onTouchStart={activeDetail ? undefined : handleTouchStart}',
]);
''', count=1)
          replace(verifier, '''  '允许覆盖移动底部导航',
]);
requireAll('docs/PAGE_CONTENT_AND_NAVIGATION_DESIGN.md', [
''', '''  '允许覆盖移动底部导航',
  '物理根 Sheet 独占 Pointer／Touch 手势监听',
]);
requireAll('docs/PAGE_CONTENT_AND_NAVIGATION_DESIGN.md', [
''', count=1)

          design = 'docs/UI_DESIGN_SYSTEM.md'
          replace(design, '> 更新时间：2026-08-19\n', '> 更新时间：2026-08-20\n', count=1)
          replace(design, '''`MobileWorkspaceSheetHost` 是移动端唯一根级 Sheet 宿主，并独占 `useMobileWorkspaceSheetDrag` 的向下拖动、速度判定、回弹、关闭和 reduced-motion 状态机。`MobileWorkspacePageSheet` 只保留为 `GameShell` 的零 DOM 兼容适配器，`MobileWorkspaceDetailSheet` 只向 Host 注册详情内容和固定底栏；两者都不得创建自己的 Sheet 外框、遮罩、Portal 或第二套手势状态机。
''', '''`MobileWorkspaceSheetHost` 是移动端唯一根级 Sheet 宿主，并独占 `useMobileWorkspaceSheetDrag` 的向下拖动、速度判定、回弹、关闭和 reduced-motion 状态机。`MobileWorkspacePageSheet` 只保留为 `GameShell` 的零 DOM 兼容适配器，`MobileWorkspaceDetailSheet` 只向 Host 注册详情内容和固定底栏；两者都不得创建自己的 Sheet 外框、遮罩、Portal 或第二套手势状态机。物理根 Sheet 独占 Pointer／Touch 手势监听；详情打开时只把共享拖拽目标切换到详情视觉层，不得把监听下沉到详情子层或同时注册两套监听，以保证真机触摸、Pointer Capture 与下拉刷新保护始终经过同一事件边界。
''', count=1)
          PY

      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          rm .github/workflows/agent-fix-unified-mobile-sheet.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "修复移动唯一抽屉浏览器回归"
          git push origin HEAD:agent/unified-mobile-sheet-host
