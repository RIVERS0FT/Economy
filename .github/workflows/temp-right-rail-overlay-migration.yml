              '''- 玩家主卡片宽度只在页面目标宽度变化时使用与侧栏一致的 `220ms cubic-bezier(.2,.8,.2,1)` 过渡；右侧信息栏显示／隐藏不得改变 fullscreen 主卡片宽度。新页面内容以 keyed `clip-path: inset(0 100% 0 0) → inset(0)` 从左向右裁剪展开并轻微淡入，页面布局轨道从首帧起保持最终 `1fr` 几何，动画不得修改 `grid-template-columns`、页面内容宽度或滚动根宽度。动画只由正式页面 ID 变化触发，权威状态刷新、倒计时和表单变化不得重播；不得对地图、ECharts 宿主、工作区或毛玻璃采样链设置动画 `transform`。''',
          )
          marker = '''- 桌面关闭态 Toast 必须作为 `.workspace-strategic-chrome` 的直接子项，与 `.strategic-economic-event-rail` 使用相同局部 `z-index: 2`，从工作区右下角按 `var(--strategic-panel-gap)`（当前桌面为 `8px`）定位并向上堆叠；最新通知最靠近右下角。'''
          insert = '''- 右侧信息栏从未挂载变为挂载时，统一宿主播放一次 `strategic-right-rail-enter` 入场动画，固定约 `220ms cubic-bezier(.2,.8,.2,1)`，只允许使用 `clip-path` 与 `opacity` 从右向左揭开，不得通过 `transform` 改变毛玻璃采样链或推动正文。页面切换、事件日志增删或教程步骤变化只要右栏宿主持续存在就不得重新播放入场动画；右栏完全卸载后再次出现才允许重新播放。`prefers-reduced-motion: reduce` 下右栏立即显示且 `animation: none`。
          - 桌面关闭态 Toast 必须作为 `.workspace-strategic-chrome` 的直接子项，与 `.strategic-economic-event-rail` 使用相同局部 `z-index: 2`，从工作区右下角按 `var(--strategic-panel-gap)`（当前桌面为 `8px`）定位并向上堆叠；最新通知最靠近右下角。'''
          replace_once('docs/LIQUID_GLASS_CHROME_DESIGN.md', marker, insert)
          replace_once(
              'docs/LIQUID_GLASS_CHROME_DESIGN.md',
              '''- `tests/browser/tutorial-right-rail.spec.ts`：桌面教程跨页面常驻、全屏页避让、`.panel` 毛玻璃计算样式和移动端不出现桌面右栏。''',
              '''- `tests/browser/tutorial-right-rail.spec.ts`：桌面教程跨页面常驻、教程与公开事件共用唯一右栏、fullscreen 正文允许被右栏覆盖、右栏入场动画不因页面切换重播、`.panel` 毛玻璃计算样式、reduced motion 和移动端不出现桌面右栏。''',
          )

          replace_once(
              'docs/PAGE_CONTENT_AND_NAVIGATION_DESIGN.md',
              '''桌面教程显示在外壳右侧信息栏顶部，只由教程自身显示状态控制；切换概览、州级上下文、市场、建筑、研发、拍卖、合同、银行、排行、商店或设置都不得因页面 ID 卸载可见教程。移动端使用概览中的移动专用入口；不得替代页面标题区唯一主操作，也不得新增独立教程页面、全屏遮罩或强制聚光灯。''',
              '''桌面教程显示在外壳右侧信息栏顶部，只由教程自身显示状态控制；切换概览、州级上下文、市场、建筑、研发、拍卖、合同、银行、排行、商店或设置都不得因页面 ID 卸载可见教程。教程与公开经济事件必须共用 `StrategicWorkspaceChrome` 的唯一右侧信息栏容器；fullscreen 页面保持完整宽度，允许该 Chrome 右栏覆盖正文右侧，不能为了教程缩窄页面。移动端使用概览中的移动专用入口；不得替代页面标题区唯一主操作，也不得新增独立教程页面、全屏遮罩或强制聚光灯。''',
          )
          replace_once(
              'docs/PAGE_CONTENT_AND_NAVIGATION_DESIGN.md',
              '''- 让教程读取玩家全局统计、为步骤增加服务器确认写入、增加教程专用轮询、保存重开历史或发放经济奖励；把桌面教程重新绑定到概览页面显示状态，或在教程可见时让全屏页面正文与右栏重叠；''',
              '''- 让教程读取玩家全局统计、为步骤增加服务器确认写入、增加教程专用轮询、保存重开历史或发放经济奖励；把桌面教程重新绑定到概览页面显示状态，把教程与公开经济事件拆成两个右栏容器，或让 fullscreen 页面因为教程右栏出现而缩窄／预留空间；右栏持续存在的页面切换不得重播右栏入场动画；''',
          )

          replace_once(
              'scripts/verify-game-tutorial.mjs',
              '''requireText(strategicStyle, '.game-shell.strategic-tab-research:has(.strategic-economic-event-rail[data-tutorial-visible="true"])', '全屏页面必须在教程可见时为右栏预留空间');
          requireText(strategicStyle, '100% - var(--strategic-event-rail-width) - var(--strategic-panel-gap) * 3', '教程右栏避让必须使用统一右栏宽度和间距');''',
              '''requireText(strategicWorkspace, 'className="strategic-right-rail strategic-economic-event-rail"', '教程与公开事件必须共用统一右侧信息栏宿主');
          requireText(strategicStyle, '.strategic-right-rail {', '右侧信息栏必须拥有统一入场动画宿主');
          requireText(strategicStyle, '@keyframes strategic-right-rail-enter', '右侧信息栏必须提供独立入场动画');
          requireText(strategicStyle, 'clip-path: inset(0 0 0 100%);', '右侧信息栏必须从右侧揭开');
          forbidText(strategicStyle, '.game-shell.strategic-tab-research:has(.strategic-economic-event-rail[data-tutorial-visible="true"])', 'fullscreen 页面不得因教程右栏出现而缩窄');''',
          )
          replace_once(
              'scripts/verify-game-tutorial.mjs',
              '''requireText(chromeDesign, '教程卡根节点必须复用通用 `.panel`', '外壳权威设计必须锁定教程共享毛玻璃材质');''',
              '''requireText(chromeDesign, '教程卡根节点必须复用通用 `.panel`', '外壳权威设计必须锁定教程共享毛玻璃材质');
          requireText(chromeDesign, 'fullscreen 主卡片始终保持完整工作区宽度', '外壳权威设计必须锁定 fullscreen 允许右栏覆盖正文');
          requireText(chromeDesign, '`strategic-right-rail-enter` 入场动画', '外壳权威设计必须锁定右栏首次显示动画');
          requireText(pageDesign, '把教程与公开经济事件拆成两个右栏容器', '页面权威设计必须防止教程和公开事件拆分宿主');''',
