name: Temporary Right Rail Overlay Migration

on:
  push:
    branches:
      - codex/tutorial-right-rail-overlay

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ !contains(github.event.head_commit.message, '[right-rail-overlay-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/tutorial-right-rail-overlay
          fetch-depth: 0
      - name: Apply right rail overlay rules
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{path}: expected exactly one match, got {count}: {old[:120]}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'src/components/shell/StrategicWorkspace.tsx',
              'className="strategic-economic-event-rail"',
              'className="strategic-right-rail strategic-economic-event-rail"',
          )

          css_path = Path('src/styles/strategic-game-shell.css')
          css = css_path.read_text(encoding='utf-8')
          shrink_block = '''  .game-shell.strategic-tab-research:has(.strategic-economic-event-rail[data-tutorial-visible="true"]),
          .game-shell.strategic-tab-auction:has(.strategic-economic-event-rail[data-tutorial-visible="true"]),
          .game-shell.strategic-tab-contracts:has(.strategic-economic-event-rail[data-tutorial-visible="true"]),
          .game-shell.strategic-tab-bank:has(.strategic-economic-event-rail[data-tutorial-visible="true"]),
          .game-shell.strategic-tab-leaderboard:has(.strategic-economic-event-rail[data-tutorial-visible="true"]),
          .game-shell.strategic-tab-gem-shop:has(.strategic-economic-event-rail[data-tutorial-visible="true"]) {
            --strategic-primary-card-inline-size: calc(
              100% - var(--strategic-event-rail-width) - var(--strategic-panel-gap) * 3
            );
          }

          '''
          if css.count(shrink_block) != 1:
              raise RuntimeError('strategic-game-shell.css: fullscreen tutorial shrink block mismatch')
          css = css.replace(shrink_block, '', 1)
          anchor = '''.strategic-economic-event-rail > .economic-event-log-panel:only-child {
            grid-row: 1 / -1;
          }

          '''
          animation = '''.strategic-economic-event-rail > .economic-event-log-panel:only-child {
            grid-row: 1 / -1;
          }

          .strategic-right-rail {
            animation: strategic-right-rail-enter 220ms cubic-bezier(.2, .8, .2, 1) both;
          }

          @keyframes strategic-right-rail-enter {
            from {
              clip-path: inset(0 0 0 100%);
              opacity: 0;
            }

            to {
              clip-path: inset(0);
              opacity: 1;
            }
          }

          '''
          if css.count(anchor) != 1:
              raise RuntimeError('strategic-game-shell.css: right rail animation anchor mismatch')
          css = css.replace(anchor, animation, 1)
          reduced = '''  .game-shell .signed-in-shell__page-reveal {
            animation: none;
          }
          }'''
          reduced_new = '''  .game-shell .signed-in-shell__page-reveal,
          .strategic-right-rail {
            animation: none;
          }
          }'''
          if css.count(reduced) != 1:
              raise RuntimeError('strategic-game-shell.css: reduced-motion anchor mismatch')
          css = css.replace(reduced, reduced_new, 1)
          css_path.write_text(css, encoding='utf-8')

          replace_once(
              'docs/README.md',
              '独立公开事件右栏',
              '教程与公开经济事件共享的统一右侧信息栏',
          )

          replace_once(
              'docs/LIQUID_GLASS_CHROME_DESIGN.md',
              '''- 桌面右侧信息栏由 `StrategicWorkspaceChrome` 唯一持有，教程与公开经济事件是两个独立模块：教程只由 `tutorial.isVisible && tutorial.currentStep` 控制，不能再以 `model.tab === 'home'` 或概览页面是否显示为条件；公开事件日志继续由页面类型控制。教程和公开事件任一需要显示时右栏存在，两者都不需要时右栏不挂载。''',
              '''- 桌面右侧信息栏由 `StrategicWorkspaceChrome` 唯一持有，并且只允许一个结构容器；教程与公开经济事件是该容器内两个独立业务模块。教程只由 `tutorial.isVisible && tutorial.currentStep` 控制，不能再以 `model.tab === 'home'` 或概览页面是否显示为条件；公开事件日志继续由页面类型控制。教程和公开事件任一需要显示时右栏存在，两者都不需要时右栏不挂载；不得把教程和公开事件拆成两个并列或重叠的右栏宿主。''',
          )
          replace_once(
              'docs/LIQUID_GLASS_CHROME_DESIGN.md',
              '''- `research`、`auction`、`contracts`、`bank`、`leaderboard`、`gem-shop` 使用 `fullscreen`；这些页面继续隐藏公开事件日志。教程隐藏或已完成时页面占满主卡片内侧可用区域；教程可见时主卡片必须为右栏预留 `--strategic-event-rail-width + 3 × --strategic-panel-gap`，不得让教程覆盖正文。排行榜与商店在相同教程可见状态下必须保持相同页面宽度。''',
              '''- `research`、`auction`、`contracts`、`bank`、`leaderboard`、`gem-shop` 使用 `fullscreen`；这些页面继续隐藏公开事件日志。fullscreen 主卡片始终保持完整工作区宽度，不得因为教程或右侧信息栏出现而缩窄、追加右侧内边距或预留空间；右侧信息栏作为 `z-index: 2` 的 Chrome 覆盖层允许覆盖正文右侧。排行榜与商店在相同页面状态下必须保持相同页面宽度。''',
          )
          replace_once(
              'docs/LIQUID_GLASS_CHROME_DESIGN.md',
              '''- 当教程与公开事件同时显示时，教程位于右栏顶部，事件日志占用剩余高度并在自身列表内滚动；当右栏只有教程时，教程按自然高度停靠右上，不得用空的事件网格行把教程拉伸到整栏高度。现有 `.strategic-economic-event-rail` 技术类名可以继续沿用，但语义职责已经扩展为通用右侧信息栏。''',
              '''- 当教程与公开事件同时显示时，教程位于同一右栏容器顶部，事件日志占用剩余高度并在自身列表内滚动；当右栏只有教程时，教程按自然高度停靠右上，不得用空的事件网格行把教程拉伸到整栏高度。统一宿主使用 `.strategic-right-rail` 作为正式语义类；`.strategic-economic-event-rail` 只作为既有选择器兼容类保留，二者必须落在同一个 `<aside>` 上，绝不能代表两份 DOM 容器。''',
          )
