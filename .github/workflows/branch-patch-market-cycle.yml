          --- a/scripts/verify-deployment-pipeline.mjs
          +++ b/scripts/verify-deployment-pipeline.mjs
          @@ -154,7 +154,11 @@ requireText('      fail-fast: false\n', '浏览器分片必须允许其他 shard 完成以保留完整诊断');
           requireText('        shard: [1, 2, 3, 4]\n', '浏览器回归必须固定为四个 shard');
           requireText('npm run test:browser -- --shard=${{ matrix.shard }}/4', '浏览器验证必须按四分片执行完整 Playwright 集合');
