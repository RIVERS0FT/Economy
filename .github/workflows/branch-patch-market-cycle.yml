name: Apply market cycle stability patch

on:
  push:
    branches:
      - fix/market-cycle-stall-deploy-timeout
    paths:
      - .github/workflows/branch-patch-market-cycle.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/market-cycle-stall-deploy-timeout
          fetch-depth: 0

      - name: Apply final patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new, label):
              target = Path(path)
              text = target.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              target.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')

          deploy = '.github/workflows/deploy.yml'
          replace_exact(
              deploy,
              """  deploy:\n    needs:\n      - build\n      - browser-test\n    runs-on: ubuntu-latest\n\n    steps:\n""",
              """  deploy:\n    needs:\n      - build\n      - browser-test\n    runs-on: ubuntu-latest\n    timeout-minutes: 20\n\n    steps:\n""",
              'deploy job timeout',
          )
          replace_exact(
              deploy,
              '''          exec > >(tee /tmp/economy-upload.log) 2>&1\n          set -euo pipefail\n          rsync -az -e "ssh -i ~/.ssh/deploy_key -p $SERVER_PORT" \\\n            dist/assets/ "$SERVER_USER@$ECONOMY_PRODUCTION_PUBLIC_IP:/var/www/game/economy/assets/"\n          rsync -az --delete -e "ssh -i ~/.ssh/deploy_key -p $SERVER_PORT" \\\n            --exclude assets/ \\\n            --exclude index.html \\\n            dist/ "$SERVER_USER@$ECONOMY_PRODUCTION_PUBLIC_IP:/var/www/game/economy/"\n          rsync -az --delete -e "ssh -i ~/.ssh/deploy_key -p $SERVER_PORT" \\\n            shared/ "$SERVER_USER@$ECONOMY_PRODUCTION_PUBLIC_IP:/var/www/game/shared/"\n          rsync -az --delete-before -e "ssh -i ~/.ssh/deploy_key -p $SERVER_PORT" \\\n            --exclude runtime/ \\\n            server/ "$SERVER_USER@$ECONOMY_PRODUCTION_PUBLIC_IP:/var/www/game/economy-api/"\n          if [ "$RUNTIME_UPLOAD" = "true" ]; then\n            rsync -az --delete-before -e "ssh -i ~/.ssh/deploy_key -p $SERVER_PORT" \\\n              /tmp/economy-node-runtime/ "$SERVER_USER@$ECONOMY_PRODUCTION_PUBLIC_IP:/var/www/game/economy-api/runtime/"\n          else\n            echo "ECONOMY_NODE_RUNTIME_UPLOAD_SKIPPED"\n          fi\n''',
              '''          exec > >(tee /tmp/economy-upload.log) 2>&1\n          set -euo pipefail\n          RSYNC_RSH="ssh -i ~/.ssh/deploy_key -p $SERVER_PORT -o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=10 -o ServerAliveCountMax=3"\n          run_rsync() {\n            timeout 300s rsync --timeout=60 -az -e "$RSYNC_RSH" "$@"\n          }\n          run_rsync \\\n            dist/assets/ "$SERVER_USER@$ECONOMY_PRODUCTION_PUBLIC_IP:/var/www/game/economy/assets/"\n          run_rsync --delete \\\n            --exclude assets/ \\\n            --exclude index.html \\\n            dist/ "$SERVER_USER@$ECONOMY_PRODUCTION_PUBLIC_IP:/var/www/game/economy/"\n          run_rsync --delete \\\n            shared/ "$SERVER_USER@$ECONOMY_PRODUCTION_PUBLIC_IP:/var/www/game/shared/"\n          run_rsync --delete-before \\\n            --exclude runtime/ \\\n            server/ "$SERVER_USER@$ECONOMY_PRODUCTION_PUBLIC_IP:/var/www/game/economy-api/"\n          if [ "$RUNTIME_UPLOAD" = "true" ]; then\n            run_rsync --delete-before \\\n              /tmp/economy-node-runtime/ "$SERVER_USER@$ECONOMY_PRODUCTION_PUBLIC_IP:/var/www/game/economy-api/runtime/"\n          else\n            echo "ECONOMY_NODE_RUNTIME_UPLOAD_SKIPPED"\n          fi\n''',
              'bounded rsync upload',
          )
          replace_exact(
              deploy,
              '''          exec > >(tee /tmp/economy-publish-entry.log) 2>&1\n          set -euo pipefail\n          rsync -az -e "ssh -i ~/.ssh/deploy_key -p $SERVER_PORT" \\\n            dist/index.html "$SERVER_USER@$ECONOMY_PRODUCTION_PUBLIC_IP:/var/www/game/economy/index.html.next"\n          ssh -i ~/.ssh/deploy_key -p "$SERVER_PORT" "$SERVER_USER@$ECONOMY_PRODUCTION_PUBLIC_IP" 'bash -s' <<'REMOTE'\n''',
              '''          exec > >(tee /tmp/economy-publish-entry.log) 2>&1\n          set -euo pipefail\n          RSYNC_RSH="ssh -i ~/.ssh/deploy_key -p $SERVER_PORT -o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=10 -o ServerAliveCountMax=3"\n          timeout 120s rsync --timeout=60 -az -e "$RSYNC_RSH" \\\n            dist/index.html "$SERVER_USER@$ECONOMY_PRODUCTION_PUBLIC_IP:/var/www/game/economy/index.html.next"\n          ssh -i ~/.ssh/deploy_key -p "$SERVER_PORT" -o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=10 -o ServerAliveCountMax=3 \\\n            "$SERVER_USER@$ECONOMY_PRODUCTION_PUBLIC_IP" 'bash -s' <<'REMOTE'\n''',
              'bounded entry publish',
          )

          verifier = 'scripts/verify-deployment-pipeline.mjs'
          replace_exact(
              verifier,
              "requireText('  deploy:\\n    needs:\\n      - build\\n      - browser-test\\n', '生产部署必须等待 build 与全部 browser shard 成功');\n",
              "requireText('  deploy:\\n    needs:\\n      - build\\n      - browser-test\\n    runs-on: ubuntu-latest\\n    timeout-minutes: 20\\n', '生产部署必须等待 build 与全部 browser shard 成功并保留整体超时边界');\nrequireText('timeout 300s rsync --timeout=60 -az -e \"$RSYNC_RSH\"', '生产主体文件同步必须同时具备 rsync I/O 超时与外层命令超时');\nrequireText('ServerAliveInterval=10', '生产文件同步 SSH 必须定期发送 keepalive');\nrequireText('ServerAliveCountMax=3', '生产文件同步 SSH 必须在 keepalive 失联后有限失败');\nrequireText('timeout 120s rsync --timeout=60 -az -e \"$RSYNC_RSH\"', '入口 HTML 发布同步必须具备独立有限超时');\n",
              'deployment verifier timeout checks',
          )
          replace_exact(
              verifier,
              "requireDesignText('Nginx 头像 `location ~` 正则包含 `{m,n}` 量词，必须整体使用引号包裹', '权威部署设计必须记录头像正则的 Nginx 引用规则');\n",
              "requireDesignText('Nginx 头像 `location ~` 正则包含 `{m,n}` 量词，必须整体使用引号包裹', '权威部署设计必须记录头像正则的 Nginx 引用规则');\nrequireDesignText('生产文件同步必须同时受 deploy Job 20 分钟整体上限、单次 rsync 300 秒外层上限、60 秒 I/O 无进展上限与 SSH keepalive 约束', '权威部署设计必须记录文件同步的有限失败边界');\n",
              'deployment design verifier',
          )

          design = 'docs/SERVER_ARCHITECTURE_AND_DEPLOYMENT_DESIGN.md'
          model_note = '> 模型 20 在世界加载事务内释放模型 19 及更早人口消费订单的真实冻结资金并重建州级系统需求；市场储备通过既有重建流程归还冻结资金与库存，玩家订单、真实历史成交和所有存量资产数量保持不变。州级官方经济基准是随代码发布的只读快照，不在世界加载或需求热路径访问外部 API。\n'
          replace_exact(
              design,
              model_note,
              model_note + '\n> 州级运行时兼容别名的全量安装只允许在世界冷加载／迁移或同一 record 首次访问时执行一次；同一 `markets`／`facilityMarkets`／玩家 `inventories` record 的后续热查询必须复用已安装别名与迁移结果。48 州需求周期会高频查询州级市场与库存，重复 O(州数 × 商品数) 属性扫描会阻塞 Node 事件循环并让正常 API 穿透 Nginx 30 秒超时。\n\n> 生产文件同步必须同时受 deploy Job 20 分钟整体上限、单次 rsync 300 秒外层上限、60 秒 I/O 无进展上限与 SSH keepalive 约束；任一边界触发必须失败并保留步骤日志，不得让生产部署无限挂起。\n',
              'authoritative runtime and deployment rules',
          )
          replace_exact(
              design,
              '当前客户端状态版本为 36，本地匿名成交存储为 v7，世界状态版本为 32，市场需求模型版本为 19；',
              '当前客户端状态版本为 36，本地匿名成交存储为 v7，世界状态版本为 32，市场需求模型版本为 20；',
              'stale market model version prose',
          )
          replace_exact(
              design,
              '`marketDemand.modelVersion = 19`',
              '`marketDemand.modelVersion = 20`',
              'stale market model field prose',
          )

          provinces_test = 'server/test/provinces.test.js'
          replace_exact(
              provinces_test,
              "  PROVINCE_CATALOG,\n  inventoryForProvince,\n",
              "  PROVINCE_CATALOG,\n  installDefaultProvinceAliases,\n  inventoryForProvince,\n",
              'province test import',
          )
          replace_exact(
              provinces_test,
              "const carol = { id: 503, name: '州级玩家丙' };\n\n",
              """const carol = { id: 503, name: '州级玩家丙' };\n\nfunction countOwnKeyScans(target) {\n  let scans = 0;\n  return {\n    record: new Proxy(target, {\n      ownKeys(value) {\n        scans += 1;\n        return Reflect.ownKeys(value);\n      },\n    }),\n    scans: () => scans,\n  };\n}\n\n""",
              'province scan helper',
          )
          tests = """test('default province alias installation scans each record only once', () => {\n  const defaultKey = provinceScopedKey(CALIFORNIA, 'wheat');\n  const georgiaKey = provinceScopedKey(GEORGIA, 'wheat');\n  const observed = countOwnKeyScans({\n    [defaultKey]: { price: 4 },\n    [georgiaKey]: { price: 7 },\n  });\n\n  installDefaultProvinceAliases(observed.record);\n  const firstPassScans = observed.scans();\n  assert.ok(firstPassScans > 0);\n  assert.equal(observed.record.wheat, observed.record[defaultKey]);\n  assert.equal(Object.keys(observed.record).includes('wheat'), false);\n\n  for (let index = 0; index < 1_000; index += 1) {\n    installDefaultProvinceAliases(observed.record);\n  }\n  assert.equal(observed.scans(), firstPassScans + 1);\n  assert.equal(observed.record[georgiaKey].price, 7);\n});\n\ntest('inventory lookup performs legacy inventory migration once per inventory record', () => {\n  const observed = countOwnKeyScans({\n    wheat: { available: 3, frozen: 2 },\n  });\n  const player = { inventories: observed.record };\n\n  const defaultInventory = inventoryForProvince(player, 'wheat', CALIFORNIA);\n  const firstPassScans = observed.scans();\n  assert.ok(firstPassScans > 0);\n  assert.deepEqual(defaultInventory, { available: 3, frozen: 2, inTransit: 0 });\n\n  for (let index = 0; index < 1_000; index += 1) {\n    inventoryForProvince(player, 'wheat', GEORGIA);\n  }\n  assert.equal(observed.scans(), firstPassScans);\n  assert.deepEqual(inventoryForProvince(player, 'wheat', GEORGIA), {\n    available: 0,\n    frozen: 0,\n    inTransit: 0,\n  });\n});\n\n"""
          anchor = "test('world 30 geography replacement keeps legacy scoped assets on their existing region IDs', () => {\n"
          replace_exact(provinces_test, anchor, tests + anchor, 'province hot-path regression tests')
          PY

          git rm server/test/province-runtime-alias-efficiency.test.js
          git rm .github/workflows/branch-patch-market-cycle.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "完善市场周期热路径与部署超时边界"
          git push origin HEAD:fix/market-cycle-stall-deploy-timeout
