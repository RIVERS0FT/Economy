name: Apply market cycle stability patch

on:
  push:
    branches:
      - fix/market-cycle-stall-deploy-timeout
    paths:
      - .github/workflows/branch-patch-market-cycle.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/market-cycle-stall-deploy-timeout
          fetch-depth: 0

      - name: Apply final patch
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/market-cycle.patch <<'PATCH'
          diff --git a/.github/workflows/deploy.yml b/.github/workflows/deploy.yml
          index a3961b0..0000000 100644
          --- a/.github/workflows/deploy.yml
          +++ b/.github/workflows/deploy.yml
          @@ -113,6 +113,7 @@ jobs:
                 - build
                 - browser-test
               runs-on: ubuntu-latest
          +    timeout-minutes: 20
           
               steps:
                 - name: Checkout code
          @@ -296,20 +297,25 @@ jobs:
               run: |
                 exec > >(tee /tmp/economy-upload.log) 2>&1
                 set -euo pipefail
          -      rsync -az -e "ssh -i ~/.ssh/deploy_key -p $SERVER_PORT" \
          +      RSYNC_RSH="ssh -i ~/.ssh/deploy_key -p $SERVER_PORT -o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=10 -o ServerAliveCountMax=3"
          +      run_rsync() {
          +        timeout 300s rsync --timeout=60 -az -e "$RSYNC_RSH" "$@"
          +      }
          +      run_rsync \
                   dist/assets/ "$SERVER_USER@$ECONOMY_PRODUCTION_PUBLIC_IP:/var/www/game/economy/assets/"
