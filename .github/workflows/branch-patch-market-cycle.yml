          +  const defaultInventory = inventoryForProvince(player, 'wheat', CALIFORNIA);
          +  const firstPassScans = observed.scans();
          +  assert.ok(firstPassScans > 0);
          +  assert.deepEqual(defaultInventory, { available: 3, frozen: 2, inTransit: 0 });
