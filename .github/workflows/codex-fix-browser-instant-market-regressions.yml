name: Fix instant market browser regressions

on:
  push:
    branches:
      - codex/daily-system-market

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.4.0
          cache: npm
      - run: npm ci
      - run: node scripts/codex-fix-browser-instant-market-regressions.mjs
      - run: bash scripts/prepare-playwright-chromium.sh
      - name: Diagnose market runtime page
        run: |
          cat > tests/browser/market-runtime-diagnostic.spec.ts <<'EOF'
          import { test } from '@playwright/test';

          test('diagnose market runtime page', async ({ page }) => {
            const errors: string[] = [];
            page.on('pageerror', (error) => errors.push(error.stack || error.message));
            page.on('console', (message) => {
              if (message.type() === 'error') console.log(`BROWSER_CONSOLE_ERROR: ${message.text()}`);
            });
            await page.goto('/market-runtime-test.html');
            await page.waitForTimeout(1500);
            console.log(`MARKET_RUNTIME_URL: ${page.url()}`);
            console.log(`MARKET_RUNTIME_ERRORS: ${JSON.stringify(errors)}`);
            console.log(`MARKET_RUNTIME_BODY: ${JSON.stringify(await page.locator('body').innerText())}`);
            console.log(`MARKET_RUNTIME_ROOT_HTML: ${JSON.stringify((await page.locator('#root').innerHTML()).slice(0, 12000))}`);
          });
          EOF
          npm run test:browser -- tests/browser/market-runtime-diagnostic.spec.ts
          exit 1
