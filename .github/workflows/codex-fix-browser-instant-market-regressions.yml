name: Fix instant market browser regressions

on:
  push:
    branches:
      - codex/daily-system-market

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.4.0
          cache: npm
      - run: npm ci
      - run: node scripts/codex-fix-browser-instant-market-regressions.mjs
      - run: node scripts/codex-fix-market-runtime-base.mjs
      - run: node scripts/codex-split-strategic-layout-st.mjs
      - run: node scripts/codex-fix-daily-market-consistency.mjs
      - run: npm run generate:local-preview
      - run: npx tsc --noEmit
      - run: node scripts/verify-market-page-layout.mjs
      - run: node scripts/verify-market-desktop-cleanup.mjs
      - run: node scripts/verify-market-information-hierarchy.mjs
      - run: node scripts/verify-market-order-entry-compact.mjs
      - run: npm run verify:recipe-profit-analysis
      - run: node scripts/verify-staple-crops-demand.mjs
      - run: bash scripts/prepare-playwright-chromium.sh
      - run: >-
          npm run test:browser --
          tests/browser/all-pages-preview.spec.ts
          tests/browser/province-locked-access.spec.ts
          tests/browser/market-desktop-cleanup.spec.ts
          tests/browser/market-detail-direct-flow.spec.ts
          tests/browser/market-information-hierarchy.spec.ts
          tests/browser/market-order-entry-compact.spec.ts
          tests/browser/market-runtime.spec.ts
          tests/browser/shell-floating-safe-zone.spec.ts
          tests/browser/warehouse-auto-sell.spec.ts
          tests/browser/production-status-summary.spec.ts
          tests/browser/production-facility-cards.spec.ts
      - run: git diff --check
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "收口每日系统价市场回归"
          git push origin HEAD:codex/daily-system-market
