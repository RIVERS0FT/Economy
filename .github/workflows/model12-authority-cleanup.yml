name: Model 12 authority cleanup

on:
  push:
    branches:
      - agent/population-order-depth-v12
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: model12-authority-cleanup
  cancel-in-progress: false

jobs:
  cleanup-and-verify:
    if: ${{ github.event_name == 'pull_request' || !contains(github.event.head_commit.message, '[authority cleaned]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/population-order-depth-v12
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.4.0
          cache: npm
      - name: Apply authority cleanup
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/.model12-authority-cleanup.py')
          text = path.read_text().replace("        '价格为正整数的订单',\n", '')
          path.write_text(text)
          PY
          python3 scripts/.model12-authority-cleanup.py
          python3 scripts/.model12-authority-cleanup-post.py
      - run: npm ci
      - name: Verify complete project
        run: npm run build
      - name: Commit authority cleanup
        shell: bash
        run: |
          set -euxo pipefail
          git restore --source=HEAD --staged --worktree .github/workflows
          git rm scripts/.model12-authority-cleanup.py scripts/.model12-authority-cleanup-post.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Align model 12 authority documents [authority cleaned]'
          git push origin HEAD:agent/population-order-depth-v12
