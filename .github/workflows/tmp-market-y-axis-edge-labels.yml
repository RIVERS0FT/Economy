name: Temporary market y-axis edge label patch

on:
  push:
    branches:
      - fix/market-y-axis-edge-labels

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/market-y-axis-edge-labels
          fetch-depth: 0
      - name: Apply patch
        env:
          PATCH_B64: 
        run: |
          python - <<'PY'
          import base64, gzip, os
          exec(gzip.decompress(base64.b64decode(os.environ['PATCH_B64'])).decode())
          PY
      - name: Commit patch
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "fix: align market y-axis endpoint labels"
          git push origin HEAD:fix/market-y-axis-edge-labels
