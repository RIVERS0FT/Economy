          Path('tests/browser/market-boundary-axis-label.spec.ts').write_text(r'''import { expect, test, type Locator, type Page } from '@playwright/test';

const marketBoundaryViewports = [
  { width: 721, height: 445, label: '问题截图尺寸' },
  { width: 390, height: 844, label: '移动端' },
