          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected exactly one match, got {text.count(old)} for {old[:80]!r}')
              p.write_text(text.replace(old, new, 1))

