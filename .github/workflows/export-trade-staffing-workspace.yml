name: Export trade staffing review workspace
on:
  push:
    branches: [codex/trade-staffing-workspace]
    paths: [.github/workflows/export-trade-staffing-workspace.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 26dae91f41a7e0fec55b7c4e5ecbcba7a066e2bf
      - name: Archive exact source without credentials or generated files
        run: git archive --format=zip HEAD > /tmp/economy-source-26dae91.zip
      - uses: actions/upload-artifact@v4
        with:
          name: trade-staffing-source
          path: /tmp/economy-source-26dae91.zip
          retention-days: 1
