name: Apply contract review fixes

on:
  push:
    branches:
      - agent/contract-types

permissions:
  contents: write

concurrency:
  group: agent-contract-review-fixes
  cancel-in-progress: false

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/contract-types
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.4.0
          cache: npm
      - name: Apply review fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=-1):
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'missing anchor in {path}: {old[:100]!r}')
              text = text.replace(old, new, count)
              file.write_text(text, encoding='utf-8', newline='\n')

          replace(
              'server/src/contract-asset-locks.js',
              "export function leasedInFacilityQuantity(world, lesseeId, facilityTypeId) {",
              "export function leasedOutLockedFacilityQuantity(world, lessorId, facilityTypeId) {\n"
              "  return activeContracts(world).reduce((sum, contract) => (\n"
              "    contract.kind === 'facility_lease'\n"
              "    && Number(contract.lessorId) === Number(lessorId)\n"
              "    && String(contract.facilityTypeId) === String(facilityTypeId)\n"
              "      ? sum + nonNegativeInteger(contract.quantity)\n"
              "      : sum\n"
              "  ), 0);\n"
              "}\n\n"
              "export function leasedInFacilityQuantity(world, lesseeId, facilityTypeId) {",
              1,
          )
          replace(
              'server/src/contract-asset-locks.js',
              "    + leasedOutFacilityQuantity(world, userId, facilityTypeId);",
              "    + leasedOutLockedFacilityQuantity(world, userId, facilityTypeId);",
              1,
          )

          replace(
              'server/src/commercial-contracts.js',
              "function groupFor(player, facilityTypeId, create = false) {",
              "function groupFor(player, facilityTypeId, create = false, now = Date.now()) {",
              1,
          )
          replace(
              'server/src/commercial-contracts.js',
              "staffingRateBps: 10_000, staffingUpdatedAt: Date.now(), staffingBatchCarryBps: 0,",
              "staffingRateBps: 10_000, staffingUpdatedAt: Math.max(0, Number(now) || 0), staffingBatchCarryBps: 0,",
              1,
          )
          replace(
              'server/src/commercial-contracts.js',
              "    contract.lesseeEscrowCredits = gross;",
              "    groupFor(lessee, contract.facilityTypeId, true, now);\n"
              "    contract.lesseeEscrowCredits = gross;",
              1,
          )
          replace(
              'server/src/commercial-contracts.js',
              "    const lenderGroup = groupFor(lender, contract.facilityTypeId, true);",
              "    const lenderGroup = groupFor(lender, contract.facilityTypeId, true, now);",
              1,
          )

          replace(
              'server/src/facility-groups.js',
              "      const frozen = frozenFacilityQuantity(world, player.userId, group.facilityTypeId);\n"
              "      const available = Math.max(0, group.count - frozen);",
              "      const available = availableGroupCount(world, player, group);",
              1,
          )

          replace(
              'server/src/contracts.js',
              "  if (contract.publisherId === Number(user.id)) return result(false, '不能承接自己发布的合同');\n"
              "  if (contract.kind !== 'supply') {\n"
              "    return acceptCommercialContract(world, contract, user, now, runtimeIndex) || result(false, '合同类型不存在');\n"
              "  }\n"
              "  if (runtimeIndex.activeCountForParticipant(user.id) >= MAX_ACTIVE_CONTRACTS_PER_PLAYER) return result(false, '进行中的合同数量已达上限');\n"
              "  if (runtimeIndex.activeCountForParticipant(contract.publisherId) >= MAX_ACTIVE_CONTRACTS_PER_PLAYER) return result(false, '发布者进行中的合同数量已达上限');",
              "  if (contract.publisherId === Number(user.id)) return result(false, '不能承接自己发布的合同');\n"
              "  if (runtimeIndex.activeCountForParticipant(user.id) >= MAX_ACTIVE_CONTRACTS_PER_PLAYER) return result(false, '进行中的合同数量已达上限');\n"
              "  if (runtimeIndex.activeCountForParticipant(contract.publisherId) >= MAX_ACTIVE_CONTRACTS_PER_PLAYER) return result(false, '发布者进行中的合同数量已达上限');\n"
              "  if (contract.kind !== 'supply') {\n"
              "    return acceptCommercialContract(world, contract, user, now, runtimeIndex) || result(false, '合同类型不存在');\n"
              "  }",
              1,
          )

          replace(
              'server/test/commercial-contracts.test.js',
              "import { leasedInFacilityQuantity, leasedOutFacilityQuantity, playerLoanCollateralQuantity } from '../src/contract-asset-locks.js';",
              "import { contractLockedFacilityQuantity, leasedInFacilityQuantity, leasedOutFacilityQuantity, playerLoanCollateralQuantity } from '../src/contract-asset-locks.js';",
              1,
          )
          replace(
              'server/test/commercial-contracts.test.js',
              "  const state = world(); const facility = FACILITY_TYPE_CATALOG[0]; const now = 2_000_000;\n"
              "  assert.equal(applyProductionContractAction",
              "  const state = world(); const facility = FACILITY_TYPE_CATALOG[0]; const now = 2_000_000;\n"
              "  state.players['2'].facilityGroups = [];\n"
              "  assert.equal(applyProductionContractAction",
              1,
          )
          replace(
              'server/test/commercial-contracts.test.js',
              "  assert.equal(leasedInFacilityQuantity(state, 2, facility.id), 3);\n"
              "  processProductionContracts(state, now + 1);",
              "  assert.equal(leasedInFacilityQuantity(state, 2, facility.id), 3);\n"
              "  assert.equal(state.players['2'].facilityGroups.some((group) => group.facilityTypeId === facility.id && group.count === 0), true);\n"
              "  processProductionContracts(state, now + 1);",
              1,
          )
          insert = """

test('lease grace suspends production usage without unlocking the lessor asset', () => {
  const state = world(); const facility = FACILITY_TYPE_CATALOG[0]; const now = 3_000_000;
  assert.equal(applyProductionContractAction(state, { id: 1 }, 'createProductionContract', { kind: 'facility_lease', publisherSide: 'lessor', facilityTypeId: facility.id, quantity: 2, rentPerPeriod: 10, periodMs: 60 * 60 * 1000, totalPeriods: 2, firstPeriodDelayMs: 0 }, now).ok, true);
  const contractId = state.productionContracts[0].id;
  assert.equal(applyProductionContractAction(state, { id: 2 }, 'acceptProductionContract', { contractId }, now).ok, true);
  state.players['2'].credits = 0;
  processProductionContracts(state, now + 1);
  processProductionContracts(state, now + 60 * 60 * 1000 + 2);
  const contract = state.productionContracts[0];
  assert.ok(contract.graceEndsAt);
  assert.equal(leasedOutFacilityQuantity(state, 1, facility.id), 0);
  assert.equal(leasedInFacilityQuantity(state, 2, facility.id), 0);
  assert.equal(contractLockedFacilityQuantity(state, 1, facility.id), 2);
});
"""
          test_file = Path('server/test/commercial-contracts.test.js')
          text = test_file.read_text(encoding='utf-8')
          anchor = "\ntest('schema 5 migrates legacy supply contracts without changing roles', () => {"
          if anchor not in text:
              raise SystemExit('missing commercial test insertion anchor')
          test_file.write_text(text.replace(anchor, insert + anchor, 1), encoding='utf-8', newline='\n')
          PY
          rm -f .github/workflows/agent-contract-review-fixes.yml
          git add -u -- .github/workflows/agent-contract-review-fixes.yml
          git diff --check
      - run: npm ci
      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          node --test server/test/commercial-contracts.test.js
          node scripts/verify-contract-types.mjs
          npm run typecheck
          npm run build
      - name: Commit fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- server/src server/test
          git diff --cached --check
          git commit -m "修复合同资产锁与租赁生产协调"
          git push origin HEAD:agent/contract-types
