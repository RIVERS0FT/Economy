name: Apply static transfer compression guards

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/optimize-static-transfer
          fetch-depth: 0
      - name: Apply remaining compression files
        run: |
          set -uo pipefail
          python3 .agent/apply-static-transfer-guards.py > "$RUNNER_TEMP/static-transfer-guards.log" 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            cat "$RUNNER_TEMP/static-transfer-guards.log"
            exit "$status"
          fi
          cat "$RUNNER_TEMP/static-transfer-guards.log"
          git diff --check
          rm -f .agent/apply-static-transfer-guards.py
          rm -f .github/workflows/agent-apply-static-transfer-guards.yml
          rm -f static-transfer-guards-failure.txt
          rmdir .agent 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "补齐静态资源压缩验收规则"
          git push origin HEAD:agent/optimize-static-transfer
      - name: Upload compression failure log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: static-transfer-guards-failure-${{ github.run_id }}
          path: ${{ runner.temp }}/static-transfer-guards.log
          if-no-files-found: error
          retention-days: 1
          compression-level: 9
