name: Apply static transfer compression guards

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/optimize-static-transfer
          fetch-depth: 0
      - name: Apply non-workflow compression files
        run: |
          set -euo pipefail
          python3 .agent/apply-static-transfer-guards.py
          git diff --check
          cp .github/workflows/deploy.yml "$RUNNER_TEMP/deploy.yml"
          git restore .github/workflows/deploy.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            README.md \
            docs/SERVER_ARCHITECTURE_AND_DEPLOYMENT_DESIGN.md \
            scripts/test_configure_economy_nginx.py \
            scripts/verify-state-delivery-capacity.mjs
          git diff --cached --check
          git commit -m "补齐静态资源压缩验收规则"
          git push origin HEAD:agent/optimize-static-transfer
      - name: Upload deployment workflow
        uses: actions/upload-artifact@v7
        with:
          name: static-transfer-deploy-workflow-${{ github.run_id }}
          path: ${{ runner.temp }}/deploy.yml
          if-no-files-found: error
          retention-days: 1
          compression-level: 9
