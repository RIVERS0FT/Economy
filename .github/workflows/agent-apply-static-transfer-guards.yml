name: Apply static transfer compression guards

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/optimize-static-transfer
          fetch-depth: 0
      - name: Finalize compression self-check
        run: |
          set -euo pipefail
          python3 .agent/finalize-static-transfer.py
          git diff --check
          python3 scripts/test_configure_economy_nginx.py
          node scripts/verify-state-delivery-capacity.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/SERVER_ARCHITECTURE_AND_DEPLOYMENT_DESIGN.md \
            scripts/configure-economy-nginx.py \
            scripts/test_configure_economy_nginx.py \
            scripts/verify-state-delivery-capacity.mjs
          git diff --cached --check
          git commit -m "增加静态压缩线上自检"
          git push origin HEAD:agent/optimize-static-transfer
