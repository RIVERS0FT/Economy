name: Apply static transfer compression guards

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
      - reopened

permissions:
  contents: write
  issues: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/optimize-static-transfer
          fetch-depth: 0
      - name: Apply and verify remaining compression files
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -uo pipefail
          set +e
          {
            python3 .agent/apply-static-transfer-guards.py
            git diff --check
            changed="$(git diff --name-only | sort)"
            expected="$(printf '%s\n' \
              .github/workflows/deploy.yml \
              README.md \
              docs/SERVER_ARCHITECTURE_AND_DEPLOYMENT_DESIGN.md \
              scripts/test_configure_economy_nginx.py \
              scripts/verify-state-delivery-capacity.mjs | sort)"
            test "$changed" = "$expected" || {
              printf 'unexpected changed files\nexpected:\n%s\nactual:\n%s\n' "$expected" "$changed" >&2
              exit 1
            }
            python3 scripts/test_configure_economy_nginx.py
            node scripts/verify-state-delivery-capacity.mjs
          } > /tmp/static-transfer-guards.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            python3 - "$GITHUB_RUN_ID" /tmp/static-transfer-guards.log > /tmp/static-transfer-comment.json <<'PY'
          import json
          import sys
          from pathlib import Path
          run_id = sys.argv[1]
          log = Path(sys.argv[2]).read_text(encoding='utf-8', errors='replace')
          body = f"静态传输压缩验收失败（run {run_id}）：\n\n```text\n{log[-12000:]}\n```"
          print(json.dumps({'body': body}, ensure_ascii=False))
          PY
            curl --fail --silent --show-error \
              --request POST \
              --header "Authorization: Bearer $GITHUB_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --data-binary @/tmp/static-transfer-comment.json \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" >/dev/null
            cat /tmp/static-transfer-guards.log
            exit "$status"
          fi
          cat /tmp/static-transfer-guards.log
          rm -f .agent/apply-static-transfer-guards.py
          rm -f .github/workflows/agent-apply-static-transfer-guards.yml
          rmdir .agent 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "补齐静态资源压缩验收规则"
          git push origin HEAD:agent/optimize-static-transfer
