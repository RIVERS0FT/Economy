name: Patch market page content verifier

on:
  push:
    branches:
      - fix/market-detail-direct-flow-20260901

permissions:
  contents: write

jobs:
  patch-verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Align locked-region market detail verifier
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/verify-page-content.mjs')
          text = path.read_text(encoding='utf-8')
          old = "  \"selectedProduct && !readOnly\",\n"
          new = "  'market-trade-readonly',\n  'readOnly ? (',\n"
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'locked market detail condition: expected exactly one match, found {count}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/patch-market-page-content-verifier.yml
          git add scripts/verify-page-content.mjs
          git diff --cached --quiet && exit 0
          git commit -m "test: align locked market detail read-only verifier"
          git push origin HEAD:${GITHUB_REF_NAME}
