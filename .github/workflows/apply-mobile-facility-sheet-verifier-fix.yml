name: Update mobile facility sheet verifiers

on:
  push:
    branches:
      - agent/fix-mobile-facility-sheet-opening-jitter

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: agent/fix-mobile-facility-sheet-opening-jitter
          fetch-depth: 0

      - name: Update verifiers
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}: {old!r}')
              file.write_text(text.replace(old, new, 1))

          replace_once(
              'scripts/verify-interaction-modality.mjs',
              "  requireText(mobileDetailPath, 'returnFocusRef.current?.focus()');",
              "  requireText(mobileDetailPath, 'returnFocusRef.current?.focus({ preventScroll: true })');",
          )
          replace_once(
              'scripts/verify-unified-factory-recipes-grid.mjs',
              "  \"document.body.style.overflow = 'hidden'\",\n  \"document.querySelector<HTMLElement>('.page-scroll')\",\n  \"pageScroll.style.overflowY = 'hidden'\",\n  \"pageScrollArea.dataset.modalScrollbarSuppressed = 'true'\",\n  'returnFocusRef.current?.focus()',",
              "  'useLayoutEffect',\n  \"window.visualViewport?.height ?? window.innerHeight\",\n  \"sheet?.focus({ preventScroll: true });\",\n  \"document.querySelector<HTMLElement>('.page-scroll')\",\n  \"pageScroll.style.overflowY = 'hidden'\",\n  \"pageScrollArea.dataset.modalScrollbarSuppressed = 'true'\",\n  'returnFocusRef.current?.focus({ preventScroll: true })',",
          )
          replace_once(
              'scripts/verify-unified-factory-recipes-grid.mjs',
              "  'facility-detail-sheet-close',\n  'aria-label=\"关闭工厂详情\"',",
              "  'facility-detail-sheet-close',\n  \"document.body.style.overflow = 'hidden'\",\n  'aria-label=\"关闭工厂详情\"',",
          )
          PYTHON

          git rm .github/workflows/apply-mobile-facility-sheet-verifier-fix.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- scripts/verify-interaction-modality.mjs scripts/verify-unified-factory-recipes-grid.mjs
          git commit -m '同步移动工厂详情焦点防回退'
          git push origin HEAD:agent/fix-mobile-facility-sheet-opening-jitter
