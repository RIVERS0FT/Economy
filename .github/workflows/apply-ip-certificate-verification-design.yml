name: Apply IP Certificate Verification Design Rule

on:
  push:
    branches:
      - fix/deploy-ip-certificate-verification

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/deploy-ip-certificate-verification
          fetch-depth: 0

      - name: Update authoritative deployment rule
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          from pathlib import Path

          path = Path('docs/SERVER_ARCHITECTURE_AND_DEPLOYMENT_DESIGN.md')
          source = path.read_text(encoding='utf-8')
          anchor = '- 两阶段验收日志必须通过 `set -o pipefail` 与同步 `tee` 在步骤退出前完整落盘，失败 Artifact 只收集真实失败步骤及其派生摘要。`deploy/economy` 失败状态的 description 只能读取该次失败步骤生成的 `economy-failure-summary.txt`，优先使用稳定 `ECONOMY_DEPLOY_VERIFY_FAILED`／明确失败标记，禁止重新扫描或拼接成功步骤日志来猜测失败原因。\n'
          rule = ('- 发布前远端的生产 IP 证书验收不得由非 root 的 `deploy` 用户直接读取 `/etc/letsencrypt/live/` 下的证书或私钥路径，也不得为验收扩大证书文件权限或部署账号权限；`scripts/configure-economy-ip-fallback-nginx.py` 仍在 root 配置阶段确认 Certbot 已生成证书文件。远端验收必须通过 Nginx 实际 TLS 行为确认该证书：使用生产公网 IP 作为 URL／TLS 身份，以 `--connect-to` 把 TCP 连接固定到 `127.0.0.1:443`，禁用环境代理并保持系统正常证书校验，不得使用 `-k`／`--insecure`；发布后的公网验收继续从 GitHub Runner 直接访问生产 IP，形成本机证书服务与真实公网链路两层验证。\n')
          if source.count(anchor) != 1:
              raise SystemExit(f'deployment verification design anchor count={source.count(anchor)}')
          path.write_text(source.replace(anchor, rule + anchor), encoding='utf-8', newline='\n')
          PYTHON

          bash -n scripts/verify-production-deployment.sh
          python3 scripts/test_configure_economy_ip_fallback_nginx.py

      - name: Commit design rule and remove temporary workflow
        run: |
          set -euo pipefail
          rm .github/workflows/apply-ip-certificate-verification-design.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/SERVER_ARCHITECTURE_AND_DEPLOYMENT_DESIGN.md .github/workflows/apply-ip-certificate-verification-design.yml
          git diff --cached --check
          git commit -m 'docs: lock trusted loopback IP certificate verification'
          git push origin HEAD:fix/deploy-ip-certificate-verification
