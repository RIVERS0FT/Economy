name: Fix transport map controls

on:
  push:
    branches:
      - codex/transport-route-pages-auto-logistics

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply shared map control patch
        run: python3 scripts/fix-transport-map-controls.py
      - name: Commit patch and remove temporary files
        run: |
          rm -f scripts/fix-transport-map-controls.py .github/workflows/fix-transport-map-controls.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "use shared controls for transport map editing"
          git push origin HEAD:codex/transport-route-pages-auto-logistics
