name: Remove overview resting-order remnants

on:
  push:
    branches:
      - codex/daily-system-market

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove stale overview order UI and design copies
        run: python3 scripts/codex-remove-overview-orders.py
      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          rm scripts/codex-remove-overview-orders.py .github/workflows/codex-remove-overview-orders.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "移除概览挂单残留并收口设计"
          git push origin HEAD:codex/daily-system-market
