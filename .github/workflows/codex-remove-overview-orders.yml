name: Remove overview resting-order remnants

on:
  push:
    branches:
      - codex/daily-system-market

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove stale overview order UI and design copies
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/codex-remove-overview-orders.py')
          source = path.read_text(encoding='utf-8')
          start = source.index("# Industry design: preserve legal fractional official prices in profit presentation.")
          end = source.index("# Page content owner: overview has two business summaries and no player resting-order module.")
          replacement = """# Industry design already contains the fractional official-price rule; verify it without rewriting.\npath = 'docs/INDUSTRY_AND_PRODUCTION_DESIGN.md'\nsource = read(path)\nif '客户端不得要求成交价为整数或不低于 1' not in source:\n    raise RuntimeError(f'{path}: fractional official-price rule missing')\n\n"""
          source = source[:start] + replacement + source[end:]
          source = source.replace(
              "if '当前挂单' in source:\n    raise RuntimeError(f'{path}: stale overview resting-order wording remains')",
              "for stale in ['生产摘要、资产与银行和当前挂单三张核心经营卡', '主列第二排固定为生产摘要、资产与银行和当前挂单', '当前挂单只显示一次买卖统计']:\n    if stale in source:\n        raise RuntimeError(f'{path}: stale overview resting-order wording remains: {stale}')",
              1,
          )
          source = source.replace(
              "if '当前挂单' in source or '三张经营摘要' in source:\n    raise RuntimeError(f'{path}: stale three-card/resting-order wording remains')",
              "for stale in ['三张经营摘要', '当前挂单只有超过三条', '“当前挂单”只显示本人未完成订单摘要和列表']:\n    if stale in source:\n        raise RuntimeError(f'{path}: stale three-card/resting-order wording remains: {stale}')",
              1,
          )
          path.write_text(source, encoding='utf-8')
          PY
          python3 scripts/codex-remove-overview-orders.py
      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          rm scripts/codex-remove-overview-orders.py .github/workflows/codex-remove-overview-orders.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "移除概览挂单残留并收口设计"
          git push origin HEAD:codex/daily-system-market
