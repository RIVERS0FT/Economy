name: Codex Natural Ratio State Label Patch

on:
  push:
    branches:
      - codex/natural-ratio-state-labels

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: codex/natural-ratio-state-labels
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.4.0

      - name: Apply natural-ratio label migration
        run: node scripts/codex-natural-ratio-map-labels-patch.mjs

      - name: Remove temporary migration files
        run: |
          git rm -- scripts/codex-natural-ratio-map-labels-patch.mjs .github/workflows/codex-natural-ratio-patch.yml
          git diff --check

      - name: Commit migrated design and tests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- docs/UI_DESIGN_SYSTEM.md docs/PAGE_CONTENT_AND_NAVIGATION_DESIGN.md scripts/verify-provincial-economy.mjs tests/browser/province-map.spec.ts tests/browser/all-pages-preview.spec.ts tests/browser/warehouse-auto-sell.spec.ts
          git commit -m "同步州名自然比例设计与回归"
          git push origin HEAD:codex/natural-ratio-state-labels
