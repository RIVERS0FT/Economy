name: Sync contract runtime index branch

on:
  push:
    branches:
      - agent/contract-runtime-index

permissions:
  contents: write

concurrency:
  group: sync-contract-runtime-index
  cancel-in-progress: false

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/contract-runtime-index
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.4.0

      - name: Rebase onto current main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git rebase origin/main
          rm .github/workflows/sync-contract-runtime-index.yml
          git add -A
          git commit -m '同步合同索引实现基线'

      - name: Verify focused behavior
        shell: bash
        run: |
          set -euo pipefail
          node --check server/src/contract-runtime-index.js
          node --check server/src/contracts.js
          node --test server/test/contract-runtime-index.test.js server/test/contracts.test.js
          node scripts/verify-runtime-efficiency.mjs

      - name: Push synchronized branch
        shell: bash
        run: |
          set -euo pipefail
          git push --force-with-lease origin HEAD:agent/contract-runtime-index
