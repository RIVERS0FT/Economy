name: Apply C1 input balance

on:
  push:
    branches:
      - fix/c1-input-balance

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.4.0
          cache: npm
      - run: npm ci
      - name: Apply implementation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/apply-c1-input-balance.mjs')
          text = path.read_text()
          text = text.replace(
              "  const previous = readFileSync(fullPath, 'utf8');",
              "  const previous = existsSync(fullPath) ? readFileSync(fullPath, 'utf8') : null;",
              1,
          )
          path.write_text(text)
          PY
          node scripts/apply-c1-input-balance.mjs
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  raise SystemExit(f'{path} missing expected balance text: {old}')
              file.write_text(text.replace(old, new, count))

          replace(
              'server/src/industry-catalog.js',
              "recipes: [{ id: 'appliance-factory-default', name: '生产家电', cycleMs: 60_000, operatingCost: 12, inputs: [{ productId: 'machinery', quantity: 1 }, { productId: 'electronics', quantity: 1 }], output: { productId: 'appliance', quantity: 2 } }]",
              "recipes: [{ id: 'appliance-factory-default', name: '生产家电', cycleMs: 60_000, operatingCost: 72.45, inputs: [{ productId: 'machinery', quantity: 1 }, { productId: 'electronics', quantity: 1 }], output: { productId: 'appliance', quantity: 2 } }]",
          )
          replace(
              'docs/INDUSTRY_AND_PRODUCTION_DESIGN.md',
              '| 家电 (`appliance`) | 92 | 1 机械 + 1 电子产品 → 2 家电 | 60 秒 | 12 | 12 |',
              '| 家电 (`appliance`) | 92 | 1 机械 + 1 电子产品 → 2 家电 | 60 秒 | 72.45 | 12 |',
          )
          replace(
              'scripts/verify-industry-catalog.mjs',
              "assert.deepEqual(standardRecipes(facilities.get('tool-workshop'))[0].output, { productId: 'tools', quantity: 1 });",
              "assert.deepEqual(standardRecipes(facilities.get('tool-workshop'))[0].output, { productId: 'tools', quantity: 5 });",
          )
          replace(
              'scripts/verify-industry-catalog.mjs',
              "assert.deepEqual(standardRecipes(fertilizerFacility)[0].output, { productId: 'fertilizer', quantity: 1 });",
              "assert.deepEqual(standardRecipes(fertilizerFacility)[0].output, { productId: 'fertilizer', quantity: 6 });",
          )
          replace(
              'scripts/verify-industry-catalog.mjs',
              'assert.equal(standardRecipes(fertilizerFacility)[0].operatingCost, 10);',
              'assert.equal(standardRecipes(fertilizerFacility)[0].operatingCost, 16.56);',
          )

          demand_test = Path('server/test/all-products-demand.test.js')
          demand_source = demand_test.read_text()
          start = demand_source.index("test('model 16 to 17 rate migration preserves demand escrow and quote state'")
          end = demand_source.index("\n\ntest('population model 6 migration", start)
          replacement = """test('model 17 to 18 rebalance rebuilds system demand without losing population or reserve assets', () => {
            const world = createWorld(now);
            ensurePlayer(world, alice, now);
            for (const state of Object.values(world.demandGroups)) {
              state.nextDemandAt = now;
              state.lastCycleId = Math.floor(now / cycleMs) - 1;
            }
            processWorld(world, now + 1);

            const oldOrders = world.orders.filter((order) => (
              order.ownerType === 'population'
              && (order.demandTier === 'direct' || order.demandTier === 'derived-liquidity')
              && order.remaining > 0
              && (order.status === 'open' || order.status === 'partial')
            ));
            assert.ok(oldOrders.length > 0);
            const oldOrderIds = new Set(oldOrders.map((order) => order.id));
            const populationTotals = Object.fromEntries(Object.entries(world.populationEconomy.models).map(([id, model]) => [
              id,
              model.credits + model.frozenCredits,
            ]));
            const reserveTotals = Object.fromEntries(Object.entries(world.marketDemand.liquidity.groups).map(([groupId, group]) => [
              groupId,
              {
                credits: group.credits + group.frozenCredits,
                inventories: Object.fromEntries(Object.entries(group.reserves).map(([productId, reserve]) => [
                  productId,
                  reserve.inventory + reserve.frozenInventory,
                ])),
              },
            ]));
            world.marketDemand.modelVersion = 17;
            world.markets.tools.lastPrice = 60;

            migrateWorld(world, now + 2);

            assert.equal(world.marketDemand.modelVersion, 18);
            assert.equal(world.orders.some((order) => oldOrderIds.has(order.id)), false);
            assert.equal(world.markets.tools.lastPrice, 12);
            for (const [id, model] of Object.entries(world.populationEconomy.models)) {
              assert.equal(model.frozenCredits, 0, id);
              assert.equal(model.credits, populationTotals[id], id);
            }
            for (const [groupId, group] of Object.entries(world.marketDemand.liquidity.groups)) {
              assert.equal(group.frozenCredits, 0, groupId);
              assert.equal(group.credits, reserveTotals[groupId].credits, groupId);
              for (const [productId, reserve] of Object.entries(group.reserves)) {
                assert.equal(reserve.frozenInventory, 0, `${groupId}/${productId}`);
                assert.equal(reserve.inventory, reserveTotals[groupId].inventories[productId], `${groupId}/${productId}`);
              }
            }
          });"""
          demand_test.write_text(demand_source[:start] + replacement + demand_source[end:])

          replace(
              'server/test/fertilizer-factory.test.js',
              "assert.deepEqual(recipe.output, { productId: 'fertilizer', quantity: 1 });",
              "assert.deepEqual(recipe.output, { productId: 'fertilizer', quantity: 6 });",
          )
          replace(
              'server/test/fertilizer-factory.test.js',
              "assert.equal(migrated.markets.fertilizer.lastPrice, 34);",
              "assert.equal(migrated.markets.fertilizer.lastPrice, 6.76);",
          )
          replace(
              'server/test/tool-workshop.test.js',
              "assert.equal(m.markets.tools.lastPrice,60);",
              "assert.equal(m.markets.tools.lastPrice,12);",
          )
          replace(
              'server/test/tool-workshop.test.js',
              "test('市场需求模型 17 在固定耐用品预算内加入工具需求'",
              "test('市场需求模型 18 在固定耐用品预算内加入工具需求'",
          )
          replace(
              'scripts/verify-staple-crops-demand.mjs',
              '市场需求验证通过：模型 17 使用工厂承载驱动的实际人口与真实钱包覆盖全部 36 种商品',
              '市场需求验证通过：模型 18 使用工厂承载驱动的实际人口与真实钱包覆盖全部 36 种商品',
          )
          replace(
              'scripts/verify-document-authority.mjs',
              '市场需求模型 16、固定银行收益',
              '市场需求模型 18、固定银行收益',
          )
          PY
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Commit verified implementation
        shell: bash
        run: |
          rm -- scripts/apply-c1-input-balance.mjs .github/workflows/apply-c1-input-balance.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          mapfile -t paths < <(git status --porcelain | sed -E 's/^.. //')
          for path in "${paths[@]}"; do
            git add -- "$path"
          done
          git diff --cached --check
          git commit -m "平衡 C1 投入品价格与产量"
          git push origin HEAD:fix/c1-input-balance
