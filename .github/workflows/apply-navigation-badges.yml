name: Apply navigation badges

on:
  push:
    branches:
      - agent/navigation-badges

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/navigation-badges
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply guarded changes
        run: |
          python .agent/apply_navigation_badges_part1.py
          python .agent/apply_navigation_badges_part2.py
          rm -rf .agent
          rm .github/workflows/apply-navigation-badges.yml
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify navigation badge architecture
        run: npm run verify:navigation-badges
      - name: Typecheck
        run: npm run typecheck
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Run navigation badge browser tests
        run: npm run test:browser -- tests/browser/sidebar-badge.spec.ts
      - name: Commit verified changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "implement unified navigation badges"
          git push origin HEAD:agent/navigation-badges
