name: Fix page surface verifier

on:
  push:
    branches:
      - codex/page-surface-layout

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/page-surface-layout
          fetch-depth: 0
      - name: Update stale province verifier
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/verify-provincial-unlock-transport.mjs')
          source = path.read_text(encoding='utf-8')
          old = "requireText(provincePage, 'province-lock-panel', '州页必须提供解锁面板。');"
          new = "requireText(provincePage, 'province-lock-content', '州页必须提供直接排列在正文的解锁内容。');"
          if source.count(old) != 1:
              raise SystemExit('stale province lock verifier marker not found exactly once')
          path.write_text(source.replace(old, new), encoding='utf-8', newline='\n')
          Path('.github/workflows/codex-fix-page-surface-verifier.yml').unlink()
          PY
          git diff --check
      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m '同步州解锁内容防回退'
          git push origin HEAD:codex/page-surface-layout
