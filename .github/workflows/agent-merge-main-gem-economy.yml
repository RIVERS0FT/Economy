name: Merge main into gem economy

on:
  push:
    branches:
      - agent/gem-construction-and-dynamic-rate
    paths:
      - .github/workflows/agent-merge-main-gem-economy.yml

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/gem-construction-and-dynamic-rate
          fetch-depth: 0
      - name: Merge latest main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "OpenAI Codex"
          git config user.email "codex@openai.com"
          git fetch origin main
          git merge --no-ff -X theirs origin/main -m "合并最新主分支资产与导航改造"
      - name: Reapply gem authority on latest main
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def ensure(path_name, marker, old, new, label):
              path = Path(path_name)
              text = path.read_text()
              if marker in text:
                  return
              if old not in text:
                  raise SystemExit(f'missing {label} in {path_name}')
              path.write_text(text.replace(old, new, 1))

          ensure(
              'README.md',
              '→ 在商店接受或放弃每日终端报价',
              '→ 在商店按固定汇率兑换普通货币\n',
              '→ 在商店接受或放弃每日终端报价，并按全服动态汇率单向兑换普通货币\n→ 在工厂详情使用 1 宝石减少当前施工 30 分钟\n',
              'README core loop',
          )
          ensure(
              'README.md',
              '商店按北京时间每日锁定的全服终端报价直接发行普通货币',
              '- 商店兑换继续按固定汇率直接发行普通货币；礼品码和管理员发放也按各自规则记录发行。系统不设置人口侧货币回收、余额衰减或发行总量上限；稳定需求补充只按人口钱包缺口发行，并受当前目标钱包参数与同周期补充比例约束。',
              '- 商店按北京时间每日锁定的全服终端报价直接发行普通货币；基准 10、范围 6～14、每日最多变化 1，每名玩家每天只能接受兑换一次或明确放弃一次。礼品码和管理员发放继续按各自规则记录发行。系统不设置人口侧货币回收、余额衰减或发行总量上限。',
              'README monetary rule',
          )
          ensure(
              'README.md',
              '不得增加宝石兑换工厂产量或商品的功能',
              '- 宝石是独立于普通货币的整数资产，不参与市场、生产、总资产或排行榜。每名玩家拥有永久 8 位邀请码和专属分享链接；邀请码只能在统一账号首次创建 Economy 玩家档案的注册事务中通过分享链接或注册表单提交，注册完成后不能补填、更换或重新绑定。有效邀请立即向邀请人发放 10 宝石，被邀请人不获得宝石。商店同时承载邀请入口，并按服务器固定汇率 1 宝石兑换 10 普通货币，单次 1～100 宝石，只允许单向兑换且不可撤销。',
              '- 宝石是独立于普通货币的整数资产，不参与市场、生产、总资产或排行榜。每名玩家拥有永久 8 位邀请码和专属分享链接；邀请码只能在首次创建 Economy 玩家档案时归因，注册完成后不能补填、更换或重新绑定。有效邀请立即向邀请人发放 10 宝石。商店按每日终端报价单向兑换普通货币；工厂详情允许 1 宝石减少当前施工 30 分钟。不得增加宝石兑换工厂产量或商品的功能。',
              'README gem rule',
