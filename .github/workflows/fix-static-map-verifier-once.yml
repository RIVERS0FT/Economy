name: Fix static map verifier once

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'codex/static-svg-map-camera'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/static-svg-map-camera
          fetch-depth: 0
      - name: Align page design verifier wording
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/verify-provincial-economy.mjs')
          text = path.read_text(encoding='utf-8')
          old = "  '静态 SVG 世界面', '单一合成相机', '名称随地图缩放和平移同步变化',"
          new = "  '静态 SVG 世界面', '唯一相机状态', '名称随地图缩放和平移同步变化',"
          if text.count(old) != 1:
              raise SystemExit(f'expected one page design verifier phrase, got {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git rm .github/workflows/fix-static-map-verifier-once.yml
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/verify-provincial-economy.mjs
          git commit -m "对齐静态地图页面设计验证术语"
          git push origin HEAD:codex/static-svg-map-camera
