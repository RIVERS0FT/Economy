name: Apply contract audit integration patch

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/contract-audit-history'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Detect staging payload
        id: payload
        run: |
          if [ -f .agent-contract-audit/commit-error.log ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
          elif [ -f .agent-contract-audit/part-00 ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Reconstruct approved patch
        if: steps.payload.outputs.available == 'true'
        run: |
          rm -f .agent-contract-audit/error.log
          python3 - <<'PY'
          import base64
          import zlib
          from pathlib import Path

          parts = sorted(Path('.agent-contract-audit').glob('part-*'))
          if len(parts) != 10:
              raise SystemExit(f'expected 10 payload parts, found {len(parts)}')
          payload = ''.join(path.read_text() for path in parts)
          patcher = zlib.decompress(base64.b64decode(payload)).decode()
          patcher = patcher.replace(
              '| 正式页面、模块归属和导航 | `docs/PAGE_CONTENT_AND_NAVIGATION_DESIGN.md` |',
              '| 页面内容、九页导航、银行资产总览与合同默认视图 | `docs/PAGE_CONTENT_AND_NAVIGATION_DESIGN.md` |',
          )
          patcher = patcher.replace(
              '| 服务器权威状态、SQLite、API、Nginx、systemd 和部署 | `docs/SERVER_ARCHITECTURE_AND_DEPLOYMENT_DESIGN.md` |',
              '| 服务器、API、合同事务、注册、邀请、封禁、容量与部署 | `docs/SERVER_ARCHITECTURE_AND_DEPLOYMENT_DESIGN.md` |',
          )
          patcher = patcher.replace(
              "(ROOT / '.github/workflows/agent-contract-audit-apply.yml').unlink(missing_ok=True)",
              "# The running workflow is removed after this commit by the repository connector.",
          )
          Path('apply-contract-audit-patch.py').write_text(patcher)
          PY
      - name: Apply approved contract audit patch
        if: steps.payload.outputs.available == 'true'
        run: python3 apply-contract-audit-patch.py
      - name: Remove staging payload
        if: steps.payload.outputs.available == 'true'
        run: rm -rf .agent-contract-audit
      - name: Commit patched authoritative files
        if: steps.payload.outputs.available == 'true'
        run: |
          set +e
          {
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add -A
            git diff --cached --check
            git commit -m "实现可审计合同历史"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          } > /tmp/contract-audit-commit.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            git reset --hard origin/${{ github.event.pull_request.head.ref }}
            mkdir -p .agent-contract-audit
            cp /tmp/contract-audit-commit.log .agent-contract-audit/commit-error.log
            git add .agent-contract-audit/commit-error.log
            git commit -m "记录合同审计提交错误"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
            exit "$status"
          fi
