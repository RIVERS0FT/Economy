name: Prepare contract audit deploy workflow

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  prepare:
    if: github.event.pull_request.head.ref == 'agent/contract-audit-history'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Prepare next deploy workflow as ordinary file
        run: |
          set -euo pipefail
          if [ -f .agent-contract-audit/deploy-next.yml ]; then
            exit 0
          fi
          mkdir -p .agent-contract-audit
          python3 - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/deploy.yml').read_text()
          source = source.replace(
              '      - name: Back up production database before world 16 migration\n',
              '      - name: Back up production database before schema migrations\n',
              1,
          )
          marker = "          with sqlite3.connect(database) as source:\n              current_version = 0\n"
          replacement = """          with sqlite3.connect(database) as source:
              audit_table = source.execute(
                  \"SELECT 1 FROM sqlite_master WHERE type = 'table' AND name = 'economy_contract_audit_events'\"
              ).fetchone()
              if not audit_table:
                  backup_dir = database.parent / 'backups'
                  backup_dir.mkdir(mode=0o700, parents=True, exist_ok=True)
                  timestamp = datetime.datetime.now(datetime.timezone.utc).strftime('%Y%m%dT%H%M%SZ')
                  audit_backup_path = backup_dir / f'economy-pre-contract-audit-{timestamp}.sqlite'
                  with sqlite3.connect(audit_backup_path) as destination:
                      source.backup(destination)
                      quick_check = destination.execute('PRAGMA quick_check').fetchone()[0]
                      if quick_check != 'ok':
                          raise RuntimeError(f'contract audit backup quick check failed: {quick_check}')
                  os.chmod(audit_backup_path, 0o600)
                  audit_backups = sorted(backup_dir.glob('economy-pre-contract-audit-*.sqlite'), reverse=True)
                  for stale in audit_backups[10:]:
                      stale.unlink()
                  print(f'ECONOMY_CONTRACT_AUDIT_BACKUP_CREATED={audit_backup_path}')
              else:
                  print('ECONOMY_CONTRACT_AUDIT_BACKUP_SKIPPED_TABLE_EXISTS')

              current_version = 0
"""
          if marker not in source:
              raise SystemExit('deploy workflow backup anchor not found')
          source = source.replace(marker, replacement, 1)
          Path('.agent-contract-audit/deploy-next.yml').write_text(source)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .agent-contract-audit/deploy-next.yml
          git diff --cached --check
          git commit -m "准备合同审计部署工作流"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
