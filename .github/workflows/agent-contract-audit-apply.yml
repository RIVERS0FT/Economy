name: Apply contract audit integration patch

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/contract-audit-history'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Stop after captured failure
        id: captured
        run: |
          if [ -f .agent-contract-audit/error.log ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Reconstruct approved patch
        if: steps.captured.outputs.skip != 'true'
        run: |
          python3 - <<'PY'
          import base64
          import zlib
          from pathlib import Path

          parts = sorted(Path('.agent-contract-audit').glob('part-*'))
          if len(parts) != 10:
              raise SystemExit(f'expected 10 payload parts, found {len(parts)}')
          payload = ''.join(path.read_text() for path in parts)
          Path('apply-contract-audit-patch.py').write_bytes(
              zlib.decompress(base64.b64decode(payload))
          )
          PY
      - name: Apply approved contract audit patch
        if: steps.captured.outputs.skip != 'true'
        run: |
          set +e
          python3 apply-contract-audit-patch.py > /tmp/contract-audit-apply.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            cp /tmp/contract-audit-apply.log .agent-contract-audit/error.log
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add .agent-contract-audit/error.log
            git commit -m "记录合同审计补丁错误"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
            exit "$status"
          fi
      - name: Remove staging payload
        if: steps.captured.outputs.skip != 'true'
        run: rm -rf .agent-contract-audit
      - name: Commit patched authoritative files
        if: steps.captured.outputs.skip != 'true'
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "实现可审计合同历史"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
