name: Sync Main For Mobile Detail Sheet

on:
  push:
    branches:
      - agent/unify-mobile-detail-sheet

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/unify-mobile-detail-sheet
          fetch-depth: 0
      - name: Merge current main and remove temporary workflow
        run: |
          git fetch origin main
          git config user.name "RIVERSOFT"
          git config user.email "105160096+RIVERS0FT@users.noreply.github.com"
          git merge --no-commit --no-ff origin/main
          git rm -- .github/workflows/sync-main-unify-mobile-detail-sheet.yml
          git diff --cached --check
          git commit -m "chore: sync latest main"
          git push origin HEAD:agent/unify-mobile-detail-sheet
