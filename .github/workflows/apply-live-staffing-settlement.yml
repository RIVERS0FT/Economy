name: Apply live staffing settlement

on:
  push:
    branches:
      - feat/live-staffing-settlement
    paths:
      - scripts/apply-live-staffing-settlement.mjs
      - scripts/apply-live-staffing-settlement-v2.mjs
      - .github/workflows/apply-live-staffing-settlement.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/live-staffing-settlement
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.4.0
          cache: npm

      - name: Validate migration helpers
        run: |
          node --check scripts/apply-live-staffing-settlement.mjs
          node --check scripts/apply-live-staffing-settlement-v2.mjs

      - name: Apply migration
        run: |
          node scripts/apply-live-staffing-settlement.mjs
          node scripts/apply-live-staffing-settlement-v2.mjs

      - name: Install dependencies
        run: npm ci

      - name: Build and test
        run: npm run build

      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            server/shared/economy-state-version.js \
            server/src/facility-groups.js \
            server/test \
            src \
            docs \
            scripts \
            tests/browser \
            .github/workflows/apply-live-staffing-settlement.yml
          git diff --cached --check
          git commit -m "feat: 按周期完成时满员率结算并重排工厂详情"
          git push origin HEAD:feat/live-staffing-settlement
