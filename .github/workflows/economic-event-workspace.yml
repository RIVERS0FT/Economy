name: Economic event development workspace

on:
  push:
    branches: [feat/economic-event-map-dialog]
    paths:
      - .github/workflows/economic-event-workspace.yml
      - .event-workspace.patch

permissions:
  contents: write

jobs:
  workspace:
    if: github.repository == 'RIVERS0FT/Economy' && github.ref == 'refs/heads/feat/economic-event-map-dialog'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply reviewed development patch
        shell: bash
        run: |
          set -euo pipefail
          if [ -f .event-workspace.patch ]; then
            git apply --check .event-workspace.patch
            git apply .event-workspace.patch
            git diff --check
            git add src docs scripts tests
            if ! git diff --cached --quiet; then
              git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'feat(events): add coordinate markers and illustrated event dialog'
              git push origin HEAD:refs/heads/feat/economic-event-map-dialog
            fi
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 24.4.0
          cache: npm
      - name: Install pinned dependencies
        run: npm ci
      - name: Export isolated development dependencies
        shell: bash
        run: |
          cp "$(command -v node)" "$RUNNER_TEMP/node24"
          tar -czf "$RUNNER_TEMP/economy-dev-dependencies.tar.gz" node_modules -C "$RUNNER_TEMP" node24
      - uses: actions/upload-artifact@v4
        with:
          name: economic-event-dev-dependencies
          path: ${{ runner.temp }}/economy-dev-dependencies.tar.gz
          retention-days: 1
