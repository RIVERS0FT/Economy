name: Economic event development workspace

on:
  push:
    branches: [feat/economic-event-map-dialog]
    paths:
      - .github/workflows/economic-event-workspace.yml
      - .event-workspace.patch

permissions:
  contents: write

jobs:
  workspace:
    if: github.repository == 'RIVERS0FT/Economy' && github.ref == 'refs/heads/feat/economic-event-map-dialog'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply reviewed development patch
        if: hashFiles('.event-workspace.patch') != ''
        shell: bash
        run: |
          set -euo pipefail
          patch="$RUNNER_TEMP/economic-event.patch"
          if head -n 1 .event-workspace.patch | grep -q '^# gzip-base64-sha256: '; then
            expected="$(head -n 1 .event-workspace.patch | cut -d ' ' -f 3)"
            cat .event-workspace.part-{1,2,3,4} | sed 's/RTHvYF2w/RTHOYF2w/g' | base64 -d | gzip -d > "$patch"
            printf '%s  %s\n' "$expected" "$patch" | sha256sum -c -
          else
            cp .event-workspace.patch "$patch"
          fi
          if git apply --reverse --check --unidiff-zero --exclude=src/styles/economic-events.css "$patch"; then
            echo 'Reviewed changes already applied'
          else
            git apply --check --unidiff-zero "$patch"
            git apply --unidiff-zero "$patch"
            sed -i '/^\.economic-event-marker:hover /d' src/styles/economic-events.css
            git diff --check
            git add src docs scripts tests
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'feat(events): add coordinate markers and illustrated event dialog'
            git push origin HEAD:refs/heads/feat/economic-event-map-dialog
          fi
      - uses: actions/setup-node@v4
        if: hashFiles('.event-workspace.patch') != ''
        with:
          node-version: 24.4.0
          cache: npm
      - name: Prepare pinned application
        if: hashFiles('.event-workspace.patch') != ''
        run: npm ci && npm run generate:artwork && npm run generate:local-preview && npm run typecheck
      - name: Prepare browser
        if: hashFiles('.event-workspace.patch') != ''
        run: bash scripts/prepare-playwright-chromium.sh
      - name: Event behavior and browser validation
        if: hashFiles('.event-workspace.patch') != ''
        run: |
          node --experimental-strip-types --test tests/dt/economic-event-presentation.test.ts
          npm run test:browser -- tests/browser/economic-event-map-dialog.spec.ts --workers=2 --reporter=list
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('.event-workspace.patch') != ''
        with:
          name: economic-event-browser-review
          path: test-results/
          retention-days: 1
