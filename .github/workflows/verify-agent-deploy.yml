name: Verify merged Economy deployment

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/verify-agent-deploy.yml'

permissions:
  actions: read
  contents: write

jobs:
  verify:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/verify-deploy-17e11585'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout verification branch
        uses: actions/checkout@v4
        with:
          ref: agent/verify-deploy-17e11585
          fetch-depth: 0

      - name: Verify deploy workflow for squash commit
        env:
          GH_TOKEN: ${{ github.token }}
          MERGED_SHA: 17e11585aacf631dfbec6410885a2dfcf4af061a
        shell: bash
        run: |
          set -euo pipefail
          api="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/deploy.yml/runs?head_sha=$MERGED_SHA&event=push&per_page=10"
          for attempt in $(seq 1 60); do
            response=$(curl --fail-with-body --silent --show-error \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$api")
            run_id=$(jq -r '.workflow_runs[0].id // empty' <<<"$response")
            status=$(jq -r '.workflow_runs[0].status // empty' <<<"$response")
            conclusion=$(jq -r '.workflow_runs[0].conclusion // empty' <<<"$response")
            if [[ -n "$run_id" && "$status" == "completed" ]]; then
              echo "deploy_run_id=$run_id"
              echo "deploy_status=$status"
              echo "deploy_conclusion=$conclusion"
              [[ "$conclusion" == "success" ]]
              git push origin --delete agent/verify-deploy-17e11585
              exit 0
            fi
            sleep 5
          done
          echo "未找到已完成的生产部署运行" >&2
          exit 1
