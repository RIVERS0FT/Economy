name: Temp Apply Player ID Reference Refactor

on:
  push:
    branches:
      - codex/id-player-reference

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.event.head_commit.message == 'chore: apply player id reference refactor' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/id-player-reference
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply refactor
        run: python scripts/temp-player-id-refactor.py

      - name: Install dependencies
        run: npm ci

      - name: Run focused server regressions
        run: >-
          node --test
          server/test/player-id-reference.test.js
          server/test/order-matching.test.js
          server/test/player-profile.test.js
          server/test/asset-auctions.test.js
          server/test/contracts.test.js
          server/test/commercial-contracts.test.js
          server/test/contract-audit.test.js

      - name: Run runtime efficiency verifier
        run: node scripts/verify-runtime-efficiency.mjs

      - name: Check diff
        run: git diff --check

      - name: Commit refactor and remove temporary files
        shell: bash
        run: |
          rm .github/workflows/temp-apply-player-id-reference.yml scripts/temp-player-id-refactor.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "refactor: use stable player ids for live relations"
          git push origin HEAD:codex/id-player-reference
