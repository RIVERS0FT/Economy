name: Temp Apply Player ID Reference Refactor

on:
  push:
    branches:
      - codex/id-player-reference

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/id-player-reference
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply and validate when requested
        shell: bash
        run: |
          if [[ "$(git log -1 --pretty=%s)" != "chore: apply player id reference refactor" ]]; then
            exit 0
          fi
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/temp-player-id-refactor.py')
          text = path.read_text(encoding='utf-8')
          old = "replace('server/src/balanced-market.js', '      counterparty: counterparty(buyer),\\n', '      counterparty: counterparty(world, buyer),\\n')"
          new = "replace('server/src/balanced-market.js', '      counterparty: counterparty(buyer), createdAt, description:', '      counterparty: counterparty(world, buyer), createdAt, description:')"
          if old not in text:
              raise SystemExit('balanced-market patch line not found')
          text = text.replace(old, new, 1)

          combined = "    '      publisherId: Number(user.id), publisherName: publisher.playerName,\\n',\n"
          if combined not in text:
              raise SystemExit('commercial combined publisher line not found')
          text = text.replace(combined, '', 1)
          loan_restore = "replace('server/src/commercial-contracts.js', \"      id: `player-loan-contract-${randomUUID()}`, kind: 'loan', publisherSide,\\n\", \"      id: `player-loan-contract-${randomUUID()}`, kind: 'loan', publisherSide,\\n      publisherId: Number(user.id),\\n\")\n"
          lease_restore = "replace('server/src/commercial-contracts.js', \"      id: `facility-lease-contract-${randomUUID()}`, kind: 'facility_lease', publisherSide,\\n\", \"      id: `facility-lease-contract-${randomUUID()}`, kind: 'facility_lease', publisherSide,\\n      publisherId: Number(user.id),\\n\")\n"
          if loan_restore not in text or lease_restore not in text:
              raise SystemExit('commercial publisher restore lines not found')
          replacement = "replace_all('server/src/commercial-contracts.js', '      publisherId: Number(user.id), publisherName: publisher.playerName,\\n', '      publisherId: Number(user.id),\\n')\n"
          text = text.replace(loan_restore + lease_restore, replacement, 1)
          path.write_text(text, encoding='utf-8')
          PY
          python scripts/temp-player-id-refactor.py
          npm ci
          node --test \
            server/test/player-id-reference.test.js \
            server/test/order-matching.test.js \
            server/test/player-profile.test.js \
            server/test/asset-auctions.test.js \
            server/test/contracts.test.js \
            server/test/commercial-contracts.test.js \
            server/test/contract-audit.test.js
          node scripts/verify-runtime-efficiency.mjs
          git diff --check
          rm .github/workflows/temp-apply-player-id-reference.yml scripts/temp-player-id-refactor.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "refactor: use stable player ids for live relations"
          git push origin HEAD:codex/id-player-reference
