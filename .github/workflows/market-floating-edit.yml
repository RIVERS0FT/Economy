name: Prepare market floating UI changes
on:
  push:
    branches: [fix/market-floating-details-20260906]
    paths: [.maintenance/market-floating-edit.py]
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'RIVERS0FT/Economy' && github.ref == 'refs/heads/fix/market-floating-details-20260906'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Apply reviewed edits to this branch only
        shell: bash
        run: |
          set -euo pipefail
          python3 .maintenance/market-floating-edit.py
          git diff --check
          git diff --stat
          git add src docs tests scripts
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix: keep frozen details floating and synchronize market chart tooltips'
          git push origin HEAD:refs/heads/fix/market-floating-details-20260906
