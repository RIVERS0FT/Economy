name: Codex Province Access Migration

on:
  push:
    branches:
      - codex/remove-province-unlock

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.4.0
          cache: npm

      - name: Extract and apply migration
        shell: bash
        run: |
          awk '
            /^[[:space:]]*python3 - <<'"'"'PY'"'"'$/ { capture=1; next }
            capture && /^[[:space:]]*PY$/ { exit }
            capture { sub(/^          /, ""); print }
          ' scripts/codex-remove-province-unlock.workflow.txt > /tmp/province-access-migration.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('/tmp/province-access-migration.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              "replace_once('src/pages/ProvincePage.tsx', old_buildings, new_buildings)",
              "replace_regex_once('src/pages/ProvincePage.tsx', r\"\\s*[{]activeSection === 'buildings' [?] [(]\\n.*?\\n\\s*[)] : null[}]\", new_buildings)",
          )
          text = text.replace(
              "replace_once('src/pages/ProvincePage.tsx', old_warehouse, new_warehouse)",
              "replace_regex_once('src/pages/ProvincePage.tsx', r\"\\s*[{]activeSection === 'warehouse' [?] [(]\\n.*?\\n\\s*[)] : null[}]\", new_warehouse)",
          )
          path.write_text(text, encoding='utf-8')
          PY
          python3 /tmp/province-access-migration.py
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, old, new):
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected exactly one legacy fragment: {old[:100]}')
              file.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'scripts/verify-provincial-unlock-transport.mjs',
              "requireText(provincePage, 'model.unlockProvince(provinceId)', '州页解锁按钮必须调用解锁动作。');",
              "forbidText(provincePage, 'model.unlockProvince(', '州页不得恢复地区解锁动作。');",
          )

          for path in ['scripts/verify-provincial-economy.mjs', 'scripts/verify-page-content.mjs']:
              replace_once(
                  path,
                  '<EmbeddedMarketPage model={model} embedded readOnly={!isUnlocked} />',
                  '<EmbeddedMarketPage model={model} embedded readOnly={false} />',
              )

          replace_once(
              'scripts/verify-market-page-layout.mjs',
              "requireText('src/pages/ProvincePage.tsx', '<EmbeddedMarketPage model={model} embedded readOnly={!isUnlocked} />', '州级上下文必须继续复用地区 MarketPage，并允许锁定州只读查看。');",
              "requireText('src/pages/ProvincePage.tsx', '<EmbeddedMarketPage model={model} embedded readOnly={false} />', '州级上下文必须继续复用地区 MarketPage，并保持连续 48 州正常交易。');",
          )
          replace_once(
              'scripts/verify-game-shell-layout.mjs',
              "  'unlockedProvinceIds={startingProvincePicking',",
              "  'unlockedProvinceIds={state.provinces.map((province) => province.id)}',",
          )

          page_verifier = Path('scripts/verify-page-content.mjs')
          text = page_verifier.read_text(encoding='utf-8')
          for old, new in [
              ('概览无论解锁状态都显示官方常住人口', '概览始终显示官方常住人口'),
              ('市场无论解锁状态都允许查看商品目录、行情和订单簿', '市场按正常市场规则提供目录、行情、订单簿和写操作'),
              ('建筑与仓库只有已解锁州才显示经营内容', '建筑与仓库直接显示本地经营内容'),
              ('一级市场商品的地区行情列表与一级建筑工厂的地区列表只允许出现当前玩家已解锁州', '一级市场商品的地区行情列表与一级建筑工厂的地区列表覆盖连续 48 州'),
          ]:
              if text.count(old) != 1:
                  raise SystemExit(f'页面内容 verifier 旧地区访问断言数量异常: {old}')
              text = text.replace(old, new, 1)
          old_required = "  'label=\"常住人口\"',\n  'section=\"buildings\"',\n  'section=\"warehouse\"',\n  '建筑功能未解锁',\n  '仓库功能未解锁',\n"
          new_required = "  'label=\"常住人口\"',\n  '<WarehouseInventoryPanel',\n  'className=\"province-warehouse-section\"',\n"
          if text.count(old_required) != 1:
              raise SystemExit('页面内容 verifier 旧解锁区块断言数量异常')
          text = text.replace(old_required, new_required, 1)
          old_forbid = "for (const text of [\n  '该州尚未解锁，解锁后可以使用市场、工厂与仓库经营功能。',\n  '<WidgetHeading title=\"州级地区未解锁\"',\n]) forbidText('src/pages/ProvincePage.tsx', text);"
          new_forbid = "for (const text of [\n  '该州尚未解锁，解锁后可以使用市场、工厂与仓库经营功能。',\n  '<WidgetHeading title=\"州级地区未解锁\"',\n  'section=\"buildings\"',\n  'section=\"warehouse\"',\n  '建筑功能未解锁',\n  '仓库功能未解锁',\n  'ProvinceUnlockPanel',\n  'province-unlock-button',\n]) forbidText('src/pages/ProvincePage.tsx', text);"
          if text.count(old_forbid) != 1:
              raise SystemExit('页面内容 verifier 锁定州 forbid 区块数量异常')
          page_verifier.write_text(text.replace(old_forbid, new_forbid, 1), encoding='utf-8')

          # Province access is all-48, but population-demand activation remains tied to economic footprints.
          baseline_path = Path('server/src/state-economic-baselines.js')
          text = baseline_path.read_text(encoding='utf-8')
          old_unlock_demand = "    for (const provinceId of player?.unlockedProvinces || []) {\n      const id = String(provinceId || '');\n      if (provinceById.has(id)) active.add(id);\n    }\n"
          if text.count(old_unlock_demand) != 1:
              raise SystemExit('人口需求仍读取旧 unlockedProvinces 的代码位置异常')
          baseline_path.write_text(text.replace(old_unlock_demand, '', 1), encoding='utf-8')

          baseline_test = Path('server/test/state-economic-baselines.test.js')
          text = baseline_test.read_text(encoding='utf-8')
          text = text.replace(
              "test('population demand activates each accessible state once and falls back to California', () => {",
              "test('population demand follows economic footprints instead of legacy access fields and falls back to California', () => {",
              1,
          )
          anchor = "  assert.deepEqual(activePopulationDemandProvinceIds({ players: {} }), [CALIFORNIA]);\n"
          proof = "  assert.deepEqual(activePopulationDemandProvinceIds({ players: { '1': { startingProvinceId: CALIFORNIA, unlockedProvinces: [CALIFORNIA, TEXAS], facilityGroups: [] } } }), [CALIFORNIA]);\n"
          if text.count(anchor) != 1:
              raise SystemExit('人口需求基准测试 fallback 锚点异常')
          text = text.replace(anchor, anchor + proof, 1)
          baseline_test.write_text(text, encoding='utf-8')

          transport_test = Path('server/test/transport.test.js')
          text = transport_test.read_text(encoding='utf-8')
          pattern = r"test\('route validation still enforces unlocked ordered stops and route count limits', \(\) => \{.*?\n\}\);\n\ntest\('current leg is the only transport deadline"
          replacement = """test('route validation ignores legacy access fields while enforcing ordered stops and route count limits', () => {
  const world = createWorld(now);
  const player = unlockedPlayer(world, alice, 1_000_000);

  const duplicate = createRoute(world, alice, { viaProvinceIds: ['130000'], destinationProvinceId: '130000' });
  assert.equal(duplicate.ok, false);
  assert.match(duplicate.message, /站点不能重复/);

  player.unlockedProvinces = ['110000'];
  const unrestricted = createRoute(world, alice, { destinationProvinceId: '130000' }, now + 2);
  assert.equal(unrestricted.ok, true);

  for (let index = 1; index < TRANSPORT_MAX_ROUTES_PER_PLAYER; index += 1) {
    const result = createRoute(world, alice, { destinationProvinceId: index % 2 === 0 ? '130000' : '120000' }, now + 10 + index);
    assert.equal(result.ok, true);
  }
  const over = createRoute(world, alice, {}, now + 100);
  assert.equal(over.ok, false);
  assert.match(over.message, /路线不能超过/);
});

test('current leg is the only transport deadline"""
          text, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('运输旧解锁测试块数量异常')
          transport_test.write_text(text, encoding='utf-8')

          product_design = Path('docs/PRODUCT_AND_GAMEPLAY_DESIGN.md')
          text = product_design.read_text(encoding='utf-8')
          old_demand_rule = '每个消费周期仍先从同一套三类人口真实钱包形成全局可消费预算；存在 Economy 玩家时，连续 48 州都作为可经营地区按 PCE 总额权重以六位小数完整分摊，同一州无论有多少玩家只计算一次真实州经济，不按玩家人数复制人口。没有任何玩家时回退默认加利福尼亚州。'
          new_demand_rule = '每个消费周期仍先从同一套三类人口真实钱包形成全局可消费预算；地区访问资格与人口需求落点彻底解耦：连续 48 州均可直接经营，但人口需求州只由玩家兼容默认经营地区 `startingProvinceId` 与实际已有工厂经营足迹激活，兼容字段 `unlockedProvinces` 不参与需求激活。激活州之间按 PCE 总额权重以六位小数完整分摊，同一州无论有多少玩家只计算一次真实州经济，不按玩家人数复制人口；没有任何玩家或经营足迹时回退默认加利福尼亚州。'
          if text.count(old_demand_rule) != 1:
              raise SystemExit('产品设计人口需求全州分摊规则数量异常')
          product_design.write_text(text.replace(old_demand_rule, new_demand_rule, 1), encoding='utf-8')

          server_design = Path('docs/SERVER_ARCHITECTURE_AND_DEPLOYMENT_DESIGN.md')
          text = server_design.read_text(encoding='utf-8')
          access_anchor = '旧 `/api/game/provinces/starting` 与 `/api/game/provinces/unlock` 可保留兼容路由，但只能返回玩法已退役提示，不得扣款、发行资产或改变经营资格。\n\n'
          demand_rule = '人口需求激活与州访问资格必须解耦：`activePopulationDemandProvinceIds` 不得读取兼容字段 `unlockedProvinces`；它只使用兼容默认经营地区 `startingProvinceId` 与实际工厂经营足迹决定需求州，避免取消地区解锁时顺带把既有全局消费预算稀释到连续 48 州。\n\n'
          if demand_rule not in text:
              if text.count(access_anchor) != 1:
                  raise SystemExit('服务器设计州访问兼容锚点异常')
              text = text.replace(access_anchor, access_anchor + demand_rule, 1)
          server_design.write_text(text, encoding='utf-8')

          verifier_path = Path('scripts/verify-provincial-unlock-transport.mjs')
          text = verifier_path.read_text(encoding='utf-8')
          verifier_anchor = "requireText(stateEconomicBaselines, \"provinceEconomicLevelPolicy from '../../shared/province-economic-level-policy.json'\", '服务器经济基准必须读取共享地区水平策略。');"
          demand_verifier = "\nforbidText(stateEconomicBaselines, 'for (const provinceId of player?.unlockedProvinces', '人口需求激活不得重新读取 legacy unlockedProvinces。');\nrequireText(stateEconomicBaselines, \"const startingProvinceId = String(player?.startingProvinceId || '');\", '人口需求必须保留兼容默认经营地区作为经济足迹。');\nrequireText(stateEconomicBaselines, 'for (const group of player?.facilityGroups || [])', '人口需求必须继续读取实际工厂经营足迹。');"
          if demand_verifier.strip() not in text:
              if text.count(verifier_anchor) != 1:
                  raise SystemExit('州级专项 verifier 人口需求锚点异常')
              text = text.replace(verifier_anchor, verifier_anchor + demand_verifier, 1)
          verifier_path.write_text(text, encoding='utf-8')

          page_design = Path('docs/PAGE_CONTENT_AND_NAVIGATION_DESIGN.md')
          text = page_design.read_text(encoding='utf-8')
          old = '未解锁州灰显，桌面 Tooltip 标注“未解锁”，点击后仍进入州级上下文页展示解锁面板；起始州选点模式则按上段专用语义只更新候选。'
          new = '连续 48 州均使用正常镜头底色，桌面 Tooltip 只展示本地经营摘要，不显示“未解锁”访问状态；点击任一州都直接进入该州级经营上下文。'
          if text.count(old) != 1:
              raise SystemExit('页面设计中的地图锁定州规则数量异常')
          page_design.write_text(text.replace(old, new, 1), encoding='utf-8')

          ui_design = Path('docs/UI_DESIGN_SYSTEM.md')
          text = ui_design.read_text(encoding='utf-8')
          text, count = re.subn(r'和未解锁状态决定', '决定', text)
          if count < 1:
              raise SystemExit('UI 设计缺少地图未解锁状态规则')
          text = text.replace('未解锁州始终保持灰显底色，悬浮其他州不得清除选中州。', '连续 48 州都保持对应镜头的正常底色，悬浮其他州不得清除选中州。')
          text = text.replace('未解锁州明确标注“未解锁”', '所有州都展示正常本地经营摘要，不显示“未解锁”访问状态')
          text, count = re.subn(
              r'默认州面、未解锁州面、州界与州名分别读取 `--color-map-region-default`、`--color-map-region-locked`、`--color-map-region-border` 与 `--color-map-label`。',
              '默认州面、州界与州名分别读取 `--color-map-region-default`、`--color-map-region-border` 与 `--color-map-label`；`--color-map-region-locked` 只保留旧主题兼容，不得用于州级访问状态。',
              text,
          )
          if count != 1:
              raise SystemExit('UI 设计中的地图锁定色规则数量异常')
          ui_design.write_text(text, encoding='utf-8')

          liquid_design = Path('docs/LIQUID_GLASS_CHROME_DESIGN.md')
          text = liquid_design.read_text(encoding='utf-8')
          text = text.replace('和未解锁状态决定', '决定')
          text = text.replace('未解锁州在任何交互状态下继续保持灰显底色；', '连续 48 州在任何交互状态下都保持对应镜头的正常底色；')
          liquid_design.write_text(text, encoding='utf-8')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Verify focused province access rules
        run: |
          node --test server/test/province-access.test.js server/test/state-economic-baselines.test.js server/test/transport.test.js
          node scripts/verify-provincial-unlock-transport.mjs
          node scripts/verify-provincial-economy.mjs
          node scripts/verify-game-shell-layout.mjs
          npm run verify:local-preview
          node scripts/verify-page-content.mjs
          node scripts/verify-primary-surface-insets.mjs
          node scripts/verify-market-page-layout.mjs
          npm run build
          git diff --check

      - name: Commit implementation
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A ':!.github/workflows/codex-remove-province-unlock.yml' ':!scripts/codex-remove-province-unlock.workflow.txt'
          if git diff --cached --quiet; then
            echo 'No implementation changes to commit.'
            exit 1
          fi
          git commit -m '取消地区解锁与起始州选择'
          git push origin HEAD:codex/remove-province-unlock
