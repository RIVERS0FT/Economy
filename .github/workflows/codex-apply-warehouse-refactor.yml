name: Apply warehouse product stack refactor

on:
  push:
    branches:
      - codex/warehouse-product-stack

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'stage codex patch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply refactor
        run: python3 scripts/codex-apply-warehouse-refactor.py

      - name: Validate patch
        run: git diff --check

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No patch changes produced"
            exit 1
          fi
          git commit -m "apply warehouse product stack"
          git push origin HEAD:${GITHUB_REF_NAME}
