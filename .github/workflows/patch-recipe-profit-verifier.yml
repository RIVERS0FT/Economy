name: Patch recipe profit verifier

on:
  push:
    branches:
      - fix/facility-summary-three-rows

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch verifier
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/verify-recipe-profit-analysis.mjs')
          text = path.read_text()
          old = "for (const text of [\n  '单厂平均利润／分钟',\n  '最近真实成交价',\n  'resolveFacilityProfitPresentation({',\n]) assert.ok(analysisSource.includes(text), `单厂平均利润界面缺少: ${text}`);"
          new = "for (const text of [\n  '单厂平均利润／分钟',\n  'resolveFacilityProfitPresentation({',\n]) assert.ok(analysisSource.includes(text), `单厂平均利润界面缺少: ${text}`);\nassert.equal(analysisSource.includes('最近真实成交价'), false, '单厂平均利润行不得恢复最近真实成交价副说明');\nassert.equal(analysisSource.includes('<small>'), false, '单厂平均利润行不得恢复可见副说明');"
          if text.count(old) != 1:
              raise SystemExit(f'expected one profit UI assertion block, got {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          node scripts/verify-recipe-profit-analysis.mjs
          node scripts/verify-production-settlement-layout.mjs
          node scripts/verify-facility-groups.mjs
          git diff --check
      - name: Commit update
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/verify-recipe-profit-analysis.mjs
          git commit -m "同步单厂利润副说明防回退规则"
          git push origin HEAD:fix/facility-summary-three-rows
