name: Validate audit repairs
on:
  push:
    branches: [fix/audit-boundaries-20260906]
    paths:
      - .github/workflows/audit-repair.yml
      - .audit-repair.mjs
      - .audit-tests.mjs
      - .audit-followup.mjs
permissions:
  contents: write
concurrency:
  group: audit-repair-20260906
  cancel-in-progress: false
jobs:
  repair:
    if: github.ref == 'refs/heads/fix/audit-boundaries-20260906'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.4.0
          cache: npm
      - run: npm ci
      - name: Apply reviewed changes
        shell: bash
        run: |
          set -euo pipefail
          node .audit-repair.mjs
          node .audit-tests.mjs
          if test -f .audit-followup.mjs; then node .audit-followup.mjs; fi
          git add docs src server scripts tests
          git diff --cached --check
          git diff --cached --stat
      - name: Full build and DT IT verification
        shell: bash
        run: |
          set -o pipefail
          npm run build > "$RUNNER_TEMP/audit-build.log" 2>&1 || { tail -180 "$RUNNER_TEMP/audit-build.log"; exit 1; }
          tail -25 "$RUNNER_TEMP/audit-build.log"
      - name: Prepare Chromium
        run: bash scripts/prepare-playwright-chromium.sh
      - name: Browser write boundary and save epoch regressions
        shell: bash
        run: |
          set -o pipefail
          npm run test:browser -- tests/browser/write-session-boundaries.spec.ts tests/browser/save-epoch-lifecycle.spec.ts > "$RUNNER_TEMP/audit-browser.log" 2>&1 || { tail -180 "$RUNNER_TEMP/audit-browser.log"; exit 1; }
          tail -25 "$RUNNER_TEMP/audit-browser.log"
      - name: Commit validated source to repair branch only
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/fix/audit-boundaries-20260906
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: preserve ordered writes and account isolation; correct market archive and commercial boundaries'
          git push origin HEAD:refs/heads/fix/audit-boundaries-20260906
          git rev-parse HEAD
      - name: Keep failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: audit-repair-failure
          path: |
            ${{ runner.temp }}/audit-build.log
            ${{ runner.temp }}/audit-browser.log
          if-no-files-found: ignore
          retention-days: 3
