name: Apply market facility document patch

on:
  push:
    branches:
      - codex/market-facility-full-bleed-artwork-v2

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update authoritative page design
        shell: python
        run: |
          from pathlib import Path

          path = Path('docs/PAGE_CONTENT_AND_NAVIGATION_DESIGN.md')
          content = path.read_text(encoding='utf-8')
          old = """商品和工厂保持同一连续目录，但目录使用两行横向布局、明确分组标记、前后滚动控制和“当前”文字状态。商品与工厂目录卡统一使用图标层在前、数据层在后的双层结构：图标层只能包含居中的 `ProductIcon` 或按工厂 ID 映射的 `FacilityIcon`；卡片几何保持桌面 `138 × 92px`、不大于 `720px` 时 `132 × 88px`，中央插画分别固定为 `72 × 72px` 和 `56 × 56px`，不得通过放大卡片获得更大的主视觉。只允许改变中央插画的 `width`／`height`；图标层 `inset`、数据层 `padding` 与 `gap`、四角槽位、名称前 SVG、价格、“当前”胶囊和库存／持有位置均保持不变，不得通过压缩四角留白容纳插画。数据层必须包含左上名称、右上 `CurrencyAmount` 最近真实成交价、左下真实 DOM“当前”胶囊和右下可用库存或持有数量；商品使用对应商品 SVG 与 `WarehouseIcon`，工厂使用 `FactoryIcon`。两层都覆盖卡片，图标层位于下方且不参与数据网格，数据层位于上方且不得用伪元素生成“当前”胶囊。目录卡统一使用 `var(--radius-control)` 圆角、`var(--space-3)` 卡间距、强边框和轻量阴影区分相邻卡片；悬停不得发生位移。下单禁用必须说明资金、仓库或可售资产不足的具体原因；玩家商品和工厂合计未完成订单达到当前商品类型数与工厂类型数之和时，也必须在提交区说明动态上限并禁用提交。本地成交表必须显示成交总额以及卖方“手续费／实收”，买方对应位置显示无手续费，不得新增来源或对手列。行情聚合仍使用最近 24h 与 240 个六分钟分段的同一时间窗口，但行情卡不得显示行情图下方统计栏，不得在图下重复显示成交笔数、最近成交估值、净主动量或我的当前订单；零涨跌使用中性色。 ECharts Tooltip 只是行情图内部交互增强，只能显示当前分段时间、价格、总量和方向汇总，不得新增页面模块、玩家身份、订单来源或交易对手。买盘和卖盘标题必须位于对应价格档位之前，稀疏订单簿按内容自然高度显示。"""
          new = """商品和工厂保持同一连续目录，但目录使用两行横向布局、明确分组标记、前后滚动控制和“当前”文字状态。商品与工厂目录卡统一使用图标层在前、数据层在后的双层结构：图标层只能包含居中的 `ProductIcon` 或按工厂 ID 映射的 `FacilityIcon`；卡片几何保持桌面 `138 × 92px`、不大于 `720px` 时 `132 × 88px`。商品卡中央插画分别固定为 `72 × 72px` 和 `56 × 56px`，工厂卡插画等比居中裁切并铺满整张卡；两者都不得通过放大卡片获得更大的主视觉。商品卡只允许改变中央插画的 `width`／`height`；工厂卡由 `FacilityIcon` 自身向四边扩展抵消图标层 `inset`，不得改变数据层 `padding` 与 `gap`、四角槽位、名称前 SVG、价格、“当前”胶囊和库存／持有位置，不得通过压缩四角留白容纳插画。工厂满幅插画必须使用 `background-size: cover` 与居中定位，保持原始比例、不拉伸、不重复，并在图标层内部使用上下两层黑色渐变保护顶部名称／价格和底部持有数量，中央主体保持清晰；当前和悬停状态不得给插画着色。数据层必须包含左上名称、右上 `CurrencyAmount` 最近真实成交价、左下真实 DOM“当前”胶囊和右下可用库存或持有数量；商品使用对应商品 SVG 与 `WarehouseIcon`，工厂使用 `FactoryIcon`。两层都覆盖卡片，图标层位于下方且不参与数据网格，数据层位于上方且不得用伪元素生成“当前”胶囊。目录卡统一使用 `var(--radius-control)` 圆角、`var(--space-3)` 卡间距、强边框和轻量阴影区分相邻卡片；悬停不得发生位移。下单禁用必须说明资金、仓库或可售资产不足的具体原因；玩家商品和工厂合计未完成订单达到当前商品类型数与工厂类型数之和时，也必须在提交区说明动态上限并禁用提交。本地成交表必须显示成交总额以及卖方“手续费／实收”，买方对应位置显示无手续费，不得新增来源或对手列。行情聚合仍使用最近 24h 与 240 个六分钟分段的同一时间窗口，但行情卡不得显示行情图下方统计栏，不得在图下重复显示成交笔数、最近成交估值、净主动量或我的当前订单；零涨跌使用中性色。 ECharts Tooltip 只是行情图内部交互增强，只能显示当前分段时间、价格、总量和方向汇总，不得新增页面模块、玩家身份、订单来源或交易对手。买盘和卖盘标题必须位于对应价格档位之前，稀疏订单簿按内容自然高度显示。"""
          if old not in content:
              raise SystemExit('authoritative market directory paragraph not found')
          path.write_text(content.replace(old, new, 1), encoding='utf-8')
          Path('.github/workflows/apply-market-facility-doc-patch.yml').unlink()
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/PAGE_CONTENT_AND_NAVIGATION_DESIGN.md .github/workflows/apply-market-facility-doc-patch.yml
          git commit -m "同步市场工厂满幅插画页面设计"
          git push origin HEAD:${GITHUB_REF_NAME}
